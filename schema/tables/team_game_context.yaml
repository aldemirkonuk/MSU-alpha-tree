# Proposed schema for table 'team_game_context' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: team_game_context
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Registry and reference
grain: one row per team x game
primary_key:
- game_id
- team_id
foreign_keys:
- columns:
  - game_id
  references: games.game_id
- columns:
  - team_id
  references: teams.team_id
- columns:
  - opponent_team_id
  references: teams.team_id
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: PRE_TIP
  text: Known before tip (schedule, venue, assignment); usable pre-game once its known_at_utc is before the cutoff (R-CX-09).
requirements:
- R-CX-04
- R-CX-05
- R-CX-08
- R-CX-11
- R-CX-13
- R-CX-14
- R-CX-15
- R-CX-16
- R-MD-14
- R-MD-18
columns:
