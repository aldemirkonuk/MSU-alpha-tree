group: Runs, errors and review
grain: one row per external request or file pull (manifest), written before parsing
primary_key:
- sha256
- fetched_at_utc
foreign_keys: []
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
