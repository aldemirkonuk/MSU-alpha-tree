# Proposed schema (2026-10-18) for table state_corrections. Status: proposed; the requirements session approves.
# Generated from one spec together with docs/data/dictionary_state.md so the two never drift.
# Field names of schema/global_metadata.yaml are used unchanged (global_metadata: true);
# proposed_global_addition: true marks fields proposed for global_metadata.yaml (see the dated note in the dictionary).
table: state_corrections
status: proposed
version: 0.1.0
date: '2026-10-18'
owner: prompt 003 W2 item 5 (state record and invariants)
dictionary: docs/data/dictionary_state.md#state_corrections
grain: one row per corrected value of any state table (append-only; raw rows are never edited)
primary_key:
- correction_id
foreign_keys:
- columns:
  - game_id
  references: games.game_id
- columns:
  - flag_id
  references: scoreboard_flags.flag_id
requirements:
- R-SR-15
- R-SB-02
- R-HR-05
- R-DQ-04
storage: Parquet, processed/<game_id>/<version>/state_corrections.parquet (private Drive, never the repo; R-EN-07)
notes:
- 'Proposed addition (not in the prompt''s list): R-SR-15 needs ''corrections in a separate column with reviewer and reason''; one long table keeps every state table''s raw columns untouched and gives one
  audit trail.'
- 'Readers apply corrections as an overlay: corrected view = raw row + latest correction per (table, row_key, field).'
legend:
  licence:
    computed_by_us: Computed by this project from privately held broadcast video (OCR, CV), audio, manual labels or our own pipeline. Private research use; model input allowed internally; never published
      raw (video is private research use only).
    model_input_allowed: 'Value taken from CollegeBasketballData (CBBD): research and commercial use allowed per docs/research/data_sources_catalog.md row 8.'
    reference_only: 'Value taken from ESPN data already pulled, hoopR ESPN prebuilt files, or hoopR NCAA-engine files: ESPN terms bar automated collection and data-set compilation; NCAA terms unverified.
      Reference and cross-check only until Aldemir decides otherwise.'
    ROW: Licence depends on the row's pbp_provider and is stored in the row's licence_class column (cbbd -> model_input_allowed; espn_pulled, hoopr_espn, hoopr_ncaa -> reference_only).
    REG: Inherits the games registry entry (dictionary_games.md).
  as_of:
    at_frame: Known at the video instant the row describes; usable as an in-game feature at that instant.
    by_pass: 'Blind pass: at_frame. Anchored pass: post_game (it uses PBP, which is only complete after the game). Anchored values are for training and for describing past games, never in-game features
      (Principle 6).'
    post_game: Known only after the game (PBP published, full video processed).
    post_review: Known at reviewed_utc of the review that set it.
    pre_game: Known before tip (registry).
    n/a: Key or processing metadata.
  source:
    OCR: Parsed scoreboard readings (scoreboard_ocr).
    CV: Our detection, tracking, ball, rim and lane models (dictionary_games.md frames, tracks).
    PBP: 'Anchored pass only: CBBD plays, or ESPN play-by-play already pulled / hoopR load_mbb_pbp; exact provider field names in docs/data/source_field_map.md.'
    fused: Fusion of OCR, CV and, in the anchored pass, PBP; authority order official scorebook (PBP, box score) > arena scoreboard > broadcast scorebug (Rule 2-9.13).
    derived: Computed from other columns of the same table by the rule in the definition.
    pipeline: Written by the processing pipeline (keys, versions, lineage).
    manual review: Human reviewer through the review queue (R-HR-02, R-HR-05).
columns:
- name: correction_id
  type: string
  definition: game_id + seq.
  source: pipeline
  licence: computed_by_us
  as_of: n/a
  requirements:
  - R-SR-15
  nullable: false
- name: game_id
  type: string
  definition: ESPN game ID; the one join key across sources (FK games.game_id).
  source: registry/games.csv
  licence: REG
  as_of: pre_game
  requirements:
  - R-MD-01
  global_metadata: true
  nullable: false
- name: target_table
  type: enum
  values:
  - state_frame
  - state_second
  - score_events
  - foul_state
  - free_throws
  - timeouts
  - reviews
  - restarts
  - made_basket_events
  - cv_events_unmatched
  definition: Table corrected.
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SR-15
  nullable: false
- name: target_row_key
  type: string
  definition: Primary key of the corrected row (JSON for composite keys); for frame ranges the first and last key.
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SR-15
  nullable: false
- name: target_range_end_key
  type: string
  definition: Last row key when one correction covers a range of frames or seconds.
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SR-15
  nullable: true
- name: field
  type: string
  definition: Column corrected.
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SR-15
  nullable: false
- name: raw_value
  type: string
  definition: Value as written (copied for audit).
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SR-15
  nullable: false
- name: corrected_value
  type: string
  definition: New value.
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SR-15
  nullable: false
- name: correction_source
  type: enum
  values:
  - manual
  - PBP
  - OCR
  - CV
  - official_record
  definition: Basis of the correction.
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SR-15
  nullable: false
- name: flag_id
  type: string
  definition: Flag that triggered it.
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SB-02
  nullable: true
- name: review_answer
  type: enum
  values:
  - scoreboard_malfunction
  - scorebug_lag
  - official_correction
  - cv_miss
  - cv_false_positive
  - pbp_error
  - unresolved
  definition: R-SB-02 answer.
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SB-02
  nullable: true
- name: reviewer
  type: string
  definition: Who.
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-HR-05
  nullable: false
- name: reviewed_utc
  type: timestamp
  unit: UTC
  definition: When.
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-HR-05
  nullable: false
- name: reason
  type: string
  definition: Why, in words.
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SR-15
  nullable: false
- name: tool_version
  type: string
  definition: Review tool version (R-HR-05).
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-HR-05
  nullable: false
- name: supersedes_correction_id
  type: string
  definition: Earlier correction this one replaces.
  source: review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SR-15
  nullable: true
