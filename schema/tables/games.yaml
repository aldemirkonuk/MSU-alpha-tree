# Proposed schema for table 'games' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: games
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Registry and reference
grain: one row per game (any D-I game in scope; MSU games first)
primary_key:
- game_id
foreign_keys:
- columns:
  - venue_id
  references: venues.venue_id
- columns:
  - home_team_id
  references: teams.team_id
- columns:
  - away_team_id
  references: teams.team_id
- columns:
  - home_head_coach_id
  references: coaches.coach_id
- columns:
  - away_head_coach_id
  references: coaches.coach_id
- columns:
  - primary_video_id
  references: video_files.video_id
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: PRE_TIP
  text: Known before tip (schedule, venue, assignment); usable pre-game once its known_at_utc is before the cutoff (R-CX-09).
requirements:
- R-FD-01
- R-FD-02
- R-MD-14
- R-MD-18
- R-MD-20
- R-CX-04
- R-CX-07
- R-CX-15
notes:
- Scores, attendance and colours are POST_GAME or IN_GAME and are never pre-game features; scheduled facts are PRE_TIP.
- 'registry/games.csv (MSU-centric: opponent, msu_score) is the current partial instance; this table is home/away-neutral
  so it also holds every D-I game for R-SY-06.'
- Closing lines are not stored here; read them from market_snapshots (snapshot_label = close) to keep one source of truth.
columns:
  game_id:
    type: string
    unit: null
    range: ESPN event ID (digits)
    nullable: false
    definition: ESPN game (event) ID, the one join key across video, play-by-play, markets and context.
    sources:
      CBBD: games.sourceId (ESPN event ID per collector_design.md 1.1; verify on first keyed call)
      ESPN files already pulled: header.id / event.id
      hoopR ESPN releases: game_id
      hoopR NCAA engine: espn_game_id
      Torvik: via hoopR mbb_schedule_crosswalk.bart_muid
      KenPom: via mbb_schedule_crosswalk.kp_game_id
      Kaggle archive: none
      EvanMiya exports: none
      markets collector: SnapshotRow.game_id
      computed by us: registry/games.csv game_id
    licence: 'ESPN files already pulled: reference only (ESPN direct; R-DS-02); hoopR ESPN releases: model input allowed (hoopR
      release; R-DS-02 allowed channel); hoopR NCAA engine: model input allowed (hoopR release); CBBD: model input allowed;
      Torvik: model input allowed, provisional (no Torvik terms page found; Aldemir to confirm); KenPom: blocked until the
      KenPom API is bought (R-DS-14); then model input allowed; markets collector: per source, docs/markets/collector_design.md
      section 6; computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'PRE_TIP: Known before tip (schedule, venue, assignment); usable pre-game once its known_at_utc is before the cutoff
      (R-CX-09).'
    requirements:
    - R-FD-01
    - R-FD-02
  season:
    type: int16
    unit: year
    range: '[2003, 2035]'
    nullable: false
    definition: Season named by its ending year (2026 = 2025-26), as ESPN and CBBD do.
    sources:
      CBBD: season
      ESPN files already pulled: season.year
