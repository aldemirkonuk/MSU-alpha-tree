# Proposed schema (2026-10-19) for table clock_map. Status: proposed; the requirements session approves.
# K09 stored truth (hybrid): state_transitions + state_segments + clock_map. Generated by
# tools/specgen/k09_tables/gen_k09.py; types and dimensions in config/state_machine.yaml.
table: clock_map
status: proposed
version: 0.1.0
date: '2026-10-19'
owner: Mac session (msu-colab), Aldemir's request 19 Oct (clock map and state machine specs)
decision: K09 hybrid (docs/requirements_review/conflicts_ab.md; k09_state_storage_research.md)
storage: Parquet, processed/<game_id>/<pass>/<state_version>/<table>.parquet (private, never the repo; R-EN-07)
grain: one row per clock (game, shot) per piecewise-linear stretch of one video (or of the pbp_only game-clock axis) per pass and state_version
primary_key:
- game_id
- pass
- state_version
- clock
- from_video_ms
primary_key_note: pbp_only rows have no video; their key uses from_video_ms = -1 and from_gc_ds (see notes).
foreign_keys:
- columns:
  - game_id
  references: games.game_id
- columns:
  - video_id
  references: video_files.video_id
- columns:
  - game_id
  - pass
  - opened_by_transition_id
  references: state_transitions.(game_id, pass, transition_id)
requirements:
- R-MD-08
- new-MD-E1
- N-MD-01
- R-SB-03
- R-SY-01
- R-MK-03
- R-MK-16
notes:
- Maps video time to game clock and shot clock, and game clock to UTC, per game, with a stated error. Every timing number and every join to play-by-play or in-game prices goes through it (engineer review
  4.7 risk 1).
- 'Integer decisecond arithmetic: value(t) = anchor_ds - rate * (t - from_video_ms) / 100 while running, anchor_ds while stopped. Views reproduce exactly (K09 section 9).'
- Condensed replays cut stopped time and sometimes running time. A stretch ends at every cut (status cut), so no linear map crosses a cut.
- 'UTC: utc_at_from is set only from sources with a real clock (PBP wallclock after the monotone fix, our own recordings'' capture time). CBBD wallclock steps backwards 57-66 times per game (measured 19
  Oct), so raw wallclock is never used directly.'
- Stored truth with state_transitions and state_segments; state_frame and state_second read game_clock_s and shot_clock_s from here.
columns:
  game_id:
    type: string
    unit: null
    range: ESPN event ID (digits)
    nullable: false
    definition: ESPN game (event) ID, the join key across video, play-by-play, markets and context.
    sources:
      computed by us: registry/games.csv game_id
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-FD-02
    - R-MD-01
  pass:
    type: enum
    unit: null
    range: blind | anchored | pbp_only
    nullable: false
    definition: 'Processing pass: blind (video only), anchored (video plus play-by-play) or pbp_only (no video).'
    sources: &id001
      computed by us: fold of state_transitions (tools/state/k09_fold.py)
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-MD-01
    - R-VA-12
  state_version:
    type: string
    unit: null
    range: sv-<12 hex>
    nullable: false
    definition: 'Version of the state build: content hash of the inputs and config that produced the rows. A correction writes a new version; old versions stay readable.'
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-MD-01
    - N-SY-05
  video_id:
    type: string
    unit: null
    range: null
    nullable: true
    definition: Video file ID (video_files.video_id). Null for the pbp_only pass.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-MD-01
  clock:
    type: enum
    unit: null
    range: game | shot
    nullable: false
    definition: Which clock the row maps.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-MD-08
  period:
    type: int
    unit: null
    range: 1..9
    nullable: false
    definition: Period the stretch belongs to (1-2 regulation, 3+ extra periods).
    sources:
      computed by us: pbp_only fold
      CBBD: /plays/game rows (playType, period, secondsRemaining, homeScore, awayScore, onFloor, wallclock)
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-SR-01
  from_video_ms:
    type: int64
    unit: ms
    range: -1 or >= 0
    nullable: false
    definition: Start of the stretch in video time (inclusive). -1 for pbp_only rows.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-MD-08
  to_video_ms:
    type: int64
    unit: ms
    range: -1 or > from_video_ms
    nullable: false
    definition: End of the stretch in video time (exclusive). -1 for pbp_only rows.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MD-08
  from_gc_ds:
    type: int32
    unit: ds
    range: 0..12000
    nullable: false
    definition: Game clock at the start of the stretch, deciseconds remaining in the period.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MD-08
  to_gc_ds:
    type: int32
    unit: ds
    range: 0..12000
    nullable: false
    definition: Game clock at the end of the stretch, deciseconds remaining in the period.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MD-08
  anchor_ds:
    type: int32
    unit: ds
    range: 0..12000 (game), 0..300 (shot)
    nullable: false
    definition: Clock value at from_video_ms (game clock remaining, or shot clock), deciseconds.
    sources: &id002
      computed by us: scorebug OCR (scoreboard_ocr) and CV
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MD-08
  running:
    type: bool
    unit: null
    range: null
    nullable: false
    definition: True when the clock runs through the stretch at rate 1.0.
    sources: *id002
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MD-08
  status:
    type: enum
    unit: null
    range: running | stopped | cut | off | unknown
    nullable: false
    definition: 'Stretch class: running (clock and video advance together), stopped (video advances, clock does not), cut (the video skips game time; no map across it), off (shot clock off, 2-11.2), unknown
      (no anchors).'
    sources: *id002
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MD-08
    - R-SB-03
  rate:
    type: float32
    unit: s/s
    range: 0..1.05
    nullable: false
    definition: 'Clock seconds per video second inside the stretch: 1.0 running, 0.0 stopped. Stored measured value; CLK-02 checks it.'
    sources: *id002
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MD-08
  n_anchors:
    type: int16
    unit: count
    range: '>= 0'
    nullable: false
    definition: Number of OCR or PBP anchors inside the stretch.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MD-08
  err_ds:
    type: int16
    unit: ds
    range: '>= 0'
    nullable: false
    definition: Stated error of the mapped value inside the stretch (95% bound), deciseconds.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MD-08
    - R-SY-01
  utc_at_from:
    type: timestamp[us, UTC]
    unit: UTC
    range: null
    nullable: true
    definition: UTC at the start of the stretch, from a monotone-fixed real clock; null when no source.
    sources:
      CBBD: /plays/game rows (playType, period, secondsRemaining, homeScore, awayScore, onFloor, wallclock)
      computed by us: pbp_only fold
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MK-03
    - R-MK-16
  utc_err_s:
    type: float32
    unit: s
    range: '>= 0'
    nullable: true
    definition: 95% error of utc_at_from.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MK-16
  src:
    type: enum
    unit: null
    range: ocr | pbp | cv | manual | interpolated
    nullable: false
    definition: Source of the anchors.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MD-19
  conf:
    type: float32
    unit: null
    range: 0..1
    nullable: false
    definition: Confidence 0-1 of the stretch class and values.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MD-09
  dq:
    type: enum
    unit: null
    range: observed | inferred | carried | imputed | quarantined
    nullable: false
    definition: Data-quality flag (R-MD-19).
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - R-MD-19
  opened_by_transition_id:
    type: string
    unit: null
    range: null
    nullable: true
    definition: Transition that opened the stretch (clock start or stop, period start, correction); null for a cut or an anchor-only boundary.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'BY_PASS: blind pass = known at the instant (in-game feature allowed); anchored and pbp_only passes = post_game (they use complete play-by-play), for training and describing past games, never
      in-game features.'
    requirements:
    - N-SY-01
