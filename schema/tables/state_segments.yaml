# Proposed schema (2026-10-19) for table state_segments. Status: proposed; the requirements session approves.
# K09 stored truth (hybrid): state_transitions + state_segments + clock_map. Generated by
# tools/specgen/k09_tables/gen_k09.py; types and dimensions in config/state_machine.yaml.
table: state_segments
status: proposed
version: 0.1.0
date: '2026-10-19'
owner: Mac session (msu-colab), Aldemir's request 19 Oct (clock map and state machine specs)
decision: K09 hybrid (docs/requirements_review/conflicts_ab.md; k09_state_storage_research.md)
storage: Parquet, processed/<game_id>/<pass>/<state_version>/<table>.parquet (private, never the repo; R-EN-07)
grain: one row per game-state dimension per validity interval [from, to) per game, pass and state_version
primary_key:
- game_id
- pass
- state_version
- dimension
- dim_key
- from_period
- from_gc_ds
- from_order
primary_key_note: 'Video passes also carry from_frame/to_frame (a unique alternative key with dimension and dim_key); pbp_only rows key on game clock only. dim_key is '''' except for family dimensions (player_fouls:
  player_id).'
foreign_keys:
- columns:
  - game_id
  references: games.game_id
- columns:
  - game_id
  - pass
  - opened_by_transition_id
  references: state_transitions.(game_id, pass, transition_id)
- columns:
  - correction_id
  references: state_corrections.correction_id
requirements:
- N-MD-01
- N-MD-02
- R-MD-01
- R-SR-06
- N-IV-01
- N-SY-05
- R-MD-19
notes:
- The only stored copy of game state (with clock_map). state_frame and state_second are as-of joins of this table, regenerated after any change, never edited (R-MD-01 rewrite).
- 'Dimensions and their value types: config/state_machine.yaml dimensions (stored: segment). Derived dimensions (bonus) are never stored.'
- Per-frame observations (ball x/y/height, player positions, detections) are never segments; they stay in ball_states, player_positions, detections (R-SR-06).
- 'Integrity SEG-01..04: no overlap, no gap, no zero-length segment, every boundary opened by exactly one transition.'
- 'Ordering inside one game-clock instant: from_order is the order_index of the opening transition, so segments are totally ordered by (from_period, -from_gc_ds, from_order).'
- The last segment of each dimension ends at the end of the covered range (to_* = end of the game or video).
columns:
  game_id:
    type: string
    unit: null
    range: ESPN event ID (digits)
    nullable: false
    definition: ESPN game (event) ID, the join key across video, play-by-play, markets and context.
    sources:
      computed by us: registry/games.csv game_id
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-FD-02
    - R-MD-01
  pass:
    type: enum
    unit: null
    range: blind | anchored | pbp_only
    nullable: false
    definition: 'Processing pass: blind (video only), anchored (video plus play-by-play) or pbp_only (no video).'
    sources: &id001
      computed by us: fold of state_transitions (tools/state/k09_fold.py)
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-MD-01
    - R-VA-12
  state_version:
    type: string
    unit: null
    range: sv-<12 hex>
    nullable: false
    definition: 'Version of the state build: content hash of the inputs and config that produced the rows. A correction writes a new version; old versions stay readable.'
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-MD-01
    - N-SY-05
  video_id:
    type: string
    unit: null
    range: null
    nullable: true
    definition: Video file ID (video_files.video_id). Null for the pbp_only pass.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-MD-01
  dimension:
    type: enum
    unit: null
    range: null
    nullable: false
    definition: Dimension name from config/state_machine.yaml.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - N-MD-01
  dim_key:
    type: string
    unit: null
    range: null
