    definition: Key inside a family dimension (player_id for player_fouls); '' otherwise.
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
