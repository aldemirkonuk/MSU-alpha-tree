# Proposed schema for table 'transition_phases' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: transition_phases
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Transition
grain: one row per possession (chance-level twin rows carry chance_id) with every phase timestamp and every transition definition
  side by side
primary_key:
- game_id
- possession_id
- chance_id_or_0
foreign_keys: []
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: IN_GAME
  text: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models only as aggregates
    of earlier games.
requirements:
- R-TR-02
- R-TR-05
- R-TR-08
- R-TR-09
- R-TR-10
- R-TR-11
- R-TR-12
- R-TR-13
- R-TR-14
- R-TR-16
- R-TR-17
- R-TR-18
- R-TR-20
- R-TR-21
- R-TR-23
- R-TR-24
- R-TR-25
- R-TR-26
- R-DF-10
- R-DF-20
stamps:
  file: schema/global_metadata.yaml
  fields: all
  requirement: R-MD-01
  note: Every row also carries every global_metadata field; columns named here take precedence.
notes:
- One flag per definition, never merged (R-TR-18). Clock rules use the shot-clock era of each game (35 s to 2014-15, 30 s
  after).
- PBP-only rows (every D-I game, R-TR-17) fill only clock-based flags; state-based fields stay null.
