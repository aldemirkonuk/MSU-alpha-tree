# Proposed schema for table 'player_positions' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: player_positions
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Video and computer vision
grain: one row per on-court player per frame (observed on main-camera frames, or imputed off-screen)
primary_key:
- video_id
- frame_index
- player_id
foreign_keys:
- columns:
  - video_id
  - frame_index
  references: frames
- columns:
  - player_id
  references: players.player_id
- columns:
  - team_id
  references: teams.team_id
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: IN_GAME
  text: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models only as aggregates
    of earlier games.
requirements:
- R-CG-05
- R-CG-08
- R-DT-07
- R-DT-08
- R-DT-10
- R-ID-01
- R-PL-10
stamps:
  file: schema/global_metadata.yaml
  fields: all
  requirement: R-MD-01
  note: Every row also carries every global_metadata field; columns named here take precedence.
notes:
- 'Attacked-rim frame: positions of all 10 players use the rim attacked by the team in possession (dead balls: the last team
  in possession); the other half is mirrored (R-CG-02). x_fc_m/y_fc_m keep an unmirrored full-court frame so no information
  is lost.'
- 'Range contract (R-DQ-02): positions inside the court +- 1 m, speeds <= 10 m/s; failing rows go to quarantine_rows.'
columns:
  video_id:
    type: string
    unit: null
    range: 64 hex chars
    nullable: false
    definition: Video file ID = SHA-256 of the original file (one game can have several files; same key as video_id in the
      state-record tables) (R-FD-09).
    sources:
      CBBD: none
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: none
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: hash of the Drive file
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'IN_GAME: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models
      only as aggregates of earlier games.'
    requirements:
    - R-FD-09
    - R-VI-09
  frame_index:
    type: int32
    unit: null
    range: '[0, 2.2e6]'
    nullable: false
    definition: 0-based index of the decoded frame in the original file.
    sources:
      CBBD: none
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: none
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
