# Proposed schema for table 'ball_control_state' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: ball_control_state
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Video and computer vision
grain: one row per contiguous ball-control segment (per-frame values live in state_frame)
primary_key:
- game_id
- segment_id
foreign_keys:
- columns:
  - game_id
  references: games.game_id
- columns:
  - cause_event_id
  references: events.event_id
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: IN_GAME
  text: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models only as aggregates
    of earlier games.
requirements:
- R-MD-02
- R-MD-03
- R-MD-04
- R-MD-05
stamps:
  file: schema/global_metadata.yaml
  fields: all
  requirement: R-MD-01
  note: Every row also carries every global_metadata field; columns named here take precedence.
notes:
- Contested and in-flight time is never credited to either team (R-MD-05).
