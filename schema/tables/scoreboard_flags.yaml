# Proposed schema (2026-10-18) for table scoreboard_flags. Status: proposed; the requirements session approves.
# Generated from one spec together with docs/data/dictionary_state.md so the two never drift.
# Field names of schema/global_metadata.yaml are used unchanged (global_metadata: true);
# proposed_global_addition: true marks fields proposed for global_metadata.yaml (see the dated note in the dictionary).
table: scoreboard_flags
status: proposed
version: 0.1.0
date: '2026-10-18'
owner: prompt 003 W2 item 5 (state record and invariants)
dictionary: docs/data/dictionary_state.md#scoreboard_flags
grain: one row per discrepancy or invariant break raised in a game pass; review answer fields are filled once (append-only versions)
primary_key:
- flag_id
foreign_keys:
- columns:
  - game_id
  references: games.game_id
- columns:
  - score_event_id
  references: score_events.score_event_id
- columns:
  - make_id
  references: made_basket_events.make_id
- columns:
  - restart_id
  references: restarts.restart_id
- columns:
  - pbp_event_id
  references: events.event_id
requirements:
- R-SB-01
- R-SB-02
- R-SB-03
- R-SB-04
- R-IV-01..16
- R-HR-01
- R-HR-05
- R-DQ-03
storage: Parquet, processed/<game_id>/<version>/scoreboard_flags.parquet (private Drive, never the repo; R-EN-07)
notes:
- Holds the R-SB-01 types (a)-(j) and every invariant break from config/invariants.yaml (flag_type = invariant_break, invariant_id set), so one review queue serves both.
- No flag is left without review_answer before the game enters training (R-SB-02); more than 3 unresolved flags keep the game out of engine training (R-SB-04).
legend:
  licence:
    computed_by_us: Computed by this project from privately held broadcast video (OCR, CV), audio, manual labels or our own pipeline. Private research use; model input allowed internally; never published
      raw (video is private research use only).
    model_input_allowed: 'Value taken from CollegeBasketballData (CBBD): research and commercial use allowed per docs/research/data_sources_catalog.md row 8.'
    reference_only: 'Value taken from ESPN data already pulled, hoopR ESPN prebuilt files, or hoopR NCAA-engine files: ESPN terms bar automated collection and data-set compilation; NCAA terms unverified.
      Reference and cross-check only until Aldemir decides otherwise.'
    ROW: Licence depends on the row's pbp_provider and is stored in the row's licence_class column (cbbd -> model_input_allowed; espn_pulled, hoopr_espn, hoopr_ncaa -> reference_only).
    REG: Inherits the games registry entry (dictionary_games.md).
  as_of:
    at_frame: Known at the video instant the row describes; usable as an in-game feature at that instant.
    by_pass: 'Blind pass: at_frame. Anchored pass: post_game (it uses PBP, which is only complete after the game). Anchored values are for training and for describing past games, never in-game features
      (Principle 6).'
    post_game: Known only after the game (PBP published, full video processed).
    post_review: Known at reviewed_utc of the review that set it.
    pre_game: Known before tip (registry).
    n/a: Key or processing metadata.
  source:
    OCR: Parsed scoreboard readings (scoreboard_ocr).
    CV: Our detection, tracking, ball, rim and lane models (dictionary_games.md frames, tracks).
    PBP: 'Anchored pass only: CBBD plays, or ESPN play-by-play already pulled / hoopR load_mbb_pbp; exact provider field names in docs/data/source_field_map.md.'
    fused: Fusion of OCR, CV and, in the anchored pass, PBP; authority order official scorebook (PBP, box score) > arena scoreboard > broadcast scorebug (Rule 2-9.13).
    derived: Computed from other columns of the same table by the rule in the definition.
    pipeline: Written by the processing pipeline (keys, versions, lineage).
    manual review: Human reviewer through the review queue (R-HR-02, R-HR-05).
columns:
- name: flag_id
  type: string
  definition: game_id + pass + flag_seq.
  source: pipeline
  licence: computed_by_us
  as_of: n/a
  requirements:
  - R-SB-01
  nullable: false
- name: game_id
  type: string
  definition: ESPN game ID; the one join key across sources (FK games.game_id).
  source: registry/games.csv
  licence: REG
  as_of: pre_game
  requirements:
  - R-MD-01
  global_metadata: true
  nullable: false
- name: pass
  type: enum
  values:
  - blind
  - anchored
  - pbp_only
  definition: blind, anchored, or pbp_only (games or stretches with no video, built from PBP alone for the possession engine, R-SY-06, R-PE-08).
  source: pipeline
  licence: computed_by_us
  as_of: n/a
  requirements:
  - R-SR-13
  - R-SR-15
  - R-SY-06
  - R-PE-08
  nullable: false
  proposed_global_addition: true
- name: flag_seq
  type: int
  range:
  - 1
  - 100000
  definition: Order raised.
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SB-01
  nullable: false
- name: flag_type
  type: enum
  values:
  - a_score_change_no_make_seen
  - b_make_seen_no_score_change
  - c_wrong_value
  - d_wrong_team
  - e_double_count
  - f_late_update
  - g_game_clock_not_started_or_stopped
  - h_shot_clock_not_reset_or_wrong
  - i_later_correction
  - j_scorebug_lag
  - invariant_break
  definition: R-SB-01 types a-j or invariant_break.
  source: checker
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SB-01
  nullable: false
- name: invariant_id
  type: string
  definition: ID from config/invariants.yaml (R-IV-nn or new-IV-nn) for invariant breaks.
  source: checker
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-IV-01..16
  nullable: true
- name: period
  type: int
  range:
  - 1
  - 12
  definition: 1 = first half, 2 = second half, 3+ = extra periods (each an extension of the second half, Rule 5-9.4).
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-01
  - R-IV-16
  global_metadata: true
  nullable: false
- name: game_clock_s
  type: float
  unit: s
  range:
  - 0
  - 1200
  definition: Game clock remaining in the period. 0.1 s resolution (board shows tenths under 60 s, Rule 1-18.2; whole seconds above).
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-01
  - R-IV-05
  global_metadata: true
  nullable: false
- name: video_ts_ms_start
  type: int
  unit: ms
  range:
  - 0
  - null
  definition: Start of the evidence window.
  source: checker
  licence: computed_by_us
  as_of: at_frame
  requirements:
  - R-SB-01
  nullable: true
- name: video_ts_ms_end
  type: int
  unit: ms
  range:
  - 0
  - null
  definition: End of the evidence window.
  source: checker
  licence: computed_by_us
  as_of: at_frame
  requirements:
  - R-SB-01
  nullable: true
- name: team
  type: enum
  values:
  - msu
  - opponent
  - none
  definition: Team concerned.
  source: checker
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SB-01
  nullable: false
- name: field
  type: string
  definition: State field concerned (e.g. 'score_msu', 'shot_clock_s').
  source: checker
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SB-01
  nullable: false
- name: expected_value
  type: string
  definition: Value the rule or the other sensor implies.
  source: checker
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SB-01
  nullable: true
- name: observed_value
  type: string
  definition: Value read.
  source: checker
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SB-01
  nullable: true
- name: lag_s
  type: float
  unit: s
  range:
  - -5
  - 600
  definition: Board change minus event time (types f, j).
  source: checker
  licence: computed_by_us
  as_of: at_frame
  requirements:
  - R-SB-03
  nullable: true
- name: window_s
  type: float
  unit: s
  range:
  - 0
  - 120
  definition: Detection window used (starts at 15 s, then reset from the measured lag; R-SB-03).
  source: config
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SB-03
  nullable: false
- name: not_seen
  type: bool
  definition: 'Camera off court at the moment: logged, not a break (R-SB-01 exception).'
  source: CV
  licence: computed_by_us
  as_of: at_frame
  requirements:
  - R-SB-01
  nullable: false
- name: score_event_id
  type: string
  definition: Linked score event.
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SB-01
  nullable: true
- name: make_id
  type: string
  definition: Linked make.
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-MB-01
  nullable: true
- name: restart_id
  type: string
  definition: Linked restart (shot-clock flags).
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SY-09
  nullable: true
- name: reading_ids
  type: list[string]
  definition: scoreboard_ocr readings used as evidence.
  source: pipeline
  licence: computed_by_us
  as_of: at_frame
  requirements:
  - R-SB-01
  nullable: false
- name: action
  type: enum
  values:
  - flag
  - quarantine
  - human_review
  definition: Action from config/invariants.yaml.
  source: config
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-HR-01
  - R-DQ-03
  nullable: false
- name: priority
  type: float
  unit: score
  range:
  - 0
  - null
  definition: Queue priority (model uncertainty x downstream impact, R-HR-03).
  source: queue
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-HR-03
  nullable: true
- name: review_answer
  type: enum
  values:
  - scoreboard_malfunction
  - scorebug_lag
  - official_correction
  - cv_miss
  - cv_false_positive
  - pbp_error
  - unresolved
  definition: R-SB-02 answer.
  source: manual review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SB-02
  nullable: true
- name: corrected_value
  type: string
  definition: Corrected value (raw values elsewhere stay as written).
  source: manual review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SB-02
  - R-SR-15
  nullable: true
- name: reviewer
  type: string
  definition: Who answered (R-HR-05).
  source: manual review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SB-02
  - R-HR-05
  nullable: true
- name: reviewed_utc
  type: timestamp
  unit: UTC
  definition: When answered.
  source: manual review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SB-02
  - R-HR-05
  nullable: true
- name: review_reason
  type: string
  definition: Reason in words.
  source: manual review
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SB-02
  nullable: true
- name: status
  type: enum
  values:
  - open
  - answered
  definition: open or answered.
  source: pipeline
  licence: computed_by_us
  as_of: post_review
  requirements:
  - R-SB-02
  - R-SB-04
  nullable: false
- name: pbp_provider
  type: enum
  values:
  - cbbd
  - espn_pulled
  - hoopr_espn
  - hoopr_ncaa
  - none
  definition: Provider of the PBP row this record was matched to or built from; 'none' in the blind pass.
  source: pipeline
  licence: computed_by_us
  as_of: post_game
  requirements:
  - R-DQ-01
  - R-DQ-04
  - R-SR-15
  nullable: false
- name: pbp_event_id
  type: string
  definition: Key of the matched row in the events table (dictionary_games.md), which keeps the provider's own play ID.
  source: PBP
  licence: ROW
  as_of: post_game
  requirements:
  - R-SY-02
  - R-SY-10
  nullable: true
- name: licence_class
  type: enum
  values:
  - computed_by_us
  - model_input_allowed
  - reference_only
  definition: Licence class of the PBP-derived values in this row (computed_by_us when no PBP value is used).
  source: pipeline from pbp_provider
  licence: computed_by_us
  as_of: n/a
  requirements:
  - R-DQ-04
  nullable: false
- name: model_version
  type: string
  definition: Pipeline and model versions that produced the row (semver string per stage, joined).
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-MD-09
  - R-EN-04
  - R-DQ-04
  global_metadata: true
  nullable: false
- name: source
  type: string
  definition: Row-level source summary, e.g. 'fused:OCR+CV' or 'PBP:cbbd'. Field-level sources are in the *_src columns.
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-MD-09
  - R-SR-15
  global_metadata: true
  nullable: false
- name: confidence
  type: float
  unit: 0-1
  range:
  - 0
  - 1
  definition: 'Row-level confidence: minimum of the field confidences used in the row.'
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-MD-09
  - R-SR-15
  global_metadata: true
  nullable: false
- name: created_utc
  type: timestamp
  unit: UTC
  definition: UTC time the row was written. Rows are never updated in place; a new version is a new pipeline version (R-EN-07).
  source: pipeline
  licence: computed_by_us
  as_of: n/a (processing metadata)
  requirements:
  - R-DQ-04
  - R-EN-07
  nullable: false
