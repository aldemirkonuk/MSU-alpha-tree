# Proposed schema for table 'market_snapshots' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: market_snapshots
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Registry and reference
grain: one row per priced outcome x market x book or exchange x snapshot (SnapshotRow)
primary_key:
- game_id
- source
- book
- market
- market_phase
- snapshot_label
- side
- team_or_player_id
- line
- snapshot_time_utc
foreign_keys:
- columns:
  - game_id
  references: games.game_id
- columns:
  - team_id
  references: teams.team_id
- columns:
  - player_id
  references: players.player_id
storage: 'private: MyDrive/MSU-Alpha-3/markets/snapshots/ (hive partitions source/season/month)'
as_of_default:
  rule: SNAPSHOT
  text: Carries its own as-of time; usable only when that time is before the cutoff (tip minus horizon; R-CX-09, R-MK-07,
    R-PC-14).
requirements:
- R-MK-01
- R-MK-02
- R-MK-03
- R-MK-14
- R-MK-15
- R-MK-16
- R-MK-25
- R-MK-26
- R-MK-27
notes:
- Columns are exactly SnapshotRow in src/msu_alpha/markets/models.py (schema_version from msu_alpha.markets.SCHEMA_VERSION);
  do not redefine.
- team_or_player_id in the key = coalesce(team_id, player_id), as SnapshotRow.dedup_key() (C-14).
- 'Storage: MyDrive/MSU-Alpha-3/markets/snapshots/ (collector_design.md 3.2); never git (R-MK-24).'
