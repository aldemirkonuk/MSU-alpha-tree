# Proposed schema (2026-10-19) for table state_transitions. Status: proposed; the requirements session approves.
# K09 stored truth (hybrid): state_transitions + state_segments + clock_map. Generated by
# tools/specgen/k09_tables/gen_k09.py; types and dimensions in config/state_machine.yaml.
table: state_transitions
status: proposed
version: 0.1.0
date: '2026-10-19'
owner: Mac session (msu-colab), Aldemir's request 19 Oct (clock map and state machine specs)
decision: K09 hybrid (docs/requirements_review/conflicts_ab.md; k09_state_storage_research.md)
storage: Parquet, processed/<game_id>/<pass>/<state_version>/<table>.parquet (private, never the repo; R-EN-07)
grain: one row per typed game-state change per game, pass and state_version (append-only)
primary_key:
- game_id
- pass
- transition_id
foreign_keys:
- columns:
  - game_id
  references: games.game_id
- columns:
  - video_id
  - effective_frame
  references: frames.(video_id, frame_index)
- columns:
  - game_id
  - pass
  - supersedes_id
  references: state_transitions.(game_id, pass, transition_id)
- columns:
  - source_event_id
  references: events.event_id (or the PBP row id for pbp_only)
requirements:
- N-SY-01
- N-SY-05
- R-MD-01
- N-MD-01
- N-MD-02
- R-SR-01..15
- R-IV-01..16
- N-IV-01
- R-SB-03
notes:
- 'Types, allowed flow-state moves and the dimensions each type may change: config/state_machine.yaml (T01-T25). An untyped row, or a row that changes a dimension its type does not list, is an invariant
  break (TRN-01, TRN-02).'
- Append-only. A data correction writes a new row with supersedes_id and a new state_version; the superseded row stays readable (TRN-05). An officials' correction during the game is its own type, T18.
- 'Effective vs observed: effective_frame is when the change happened on court; observed_frame_* is when each sensor saw it, so scorebug lag is stored, not hidden (engineer review T05: median 1.933 s).'
- changes holds the new value of every dimension the row changes, team-neutral (home/away, N-MD-02). Segment rows are folded from it.
- Replay frames never open a transition (TRN-04).
- About 1,400 rows per game per video pass (K09 benchmark); the pbp_only pass writes about 900-1,000 (measured on the two pilot games).
columns:
  game_id:
    type: string
    unit: null
    range: ESPN event ID (digits)
    nullable: false
    definition: ESPN game (event) ID, the join key across video, play-by-play, markets and context.
    sources:
      computed by us: registry/games.csv game_id
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-FD-02
    - R-MD-01
  pass:
    type: enum
    unit: null
    range: blind | anchored | pbp_only
    nullable: false
    definition: 'Processing pass: blind (video only), anchored (video plus play-by-play) or pbp_only (no video).'
    sources: &id001
      computed by us: fold of state_transitions (tools/state/k09_fold.py)
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-MD-01
    - R-VA-12
  state_version:
    type: string
    unit: null
    range: sv-<12 hex>
    nullable: false
    definition: 'Version of the state build: content hash of the inputs and config that produced the rows. A correction writes a new version; old versions stay readable.'
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-MD-01
    - N-SY-05
  video_id:
    type: string
    unit: null
    range: null
    nullable: true
