    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
    - R-MD-01
  transition_id:
    type: string
    unit: null
    range: tr-<16 hex>
    nullable: false
    definition: 'Deterministic ID: hash of (game_id, pass, ttype, period, game_clock_ds, order_index, source_event_id). The same inputs always give the same ID (new-EN-E3).'
    sources: *id001
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'KEY: identifier; no as-of restriction.'
    requirements:
