# Proposed schema for table 'configuration_snapshots' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: configuration_snapshots
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Actions, sets and defensive structure
grain: one row per configuration snapshot (all 10 players at a trigger moment)
primary_key:
- game_id
- snapshot_id
foreign_keys: []
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: IN_GAME
  text: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models only as aggregates
    of earlier games.
requirements:
- R-ST-03
- R-ST-19
stamps:
  file: schema/global_metadata.yaml
  fields: all
  requirement: R-MD-01
  note: Every row also carries every global_metadata field; columns named here take precedence.
columns:
  game_id:
    type: string
    unit: null
    range: ESPN event ID (digits)
    nullable: false
    definition: ESPN game (event) ID, the one join key across video, play-by-play, markets and context.
    sources:
      CBBD: games.sourceId (ESPN event ID per collector_design.md 1.1; verify on first keyed call)
      ESPN files already pulled: header.id / event.id
      hoopR ESPN releases: game_id
      hoopR NCAA engine: espn_game_id
      Torvik: via hoopR mbb_schedule_crosswalk.bart_muid
      KenPom: via mbb_schedule_crosswalk.kp_game_id
      Kaggle archive: none
      EvanMiya exports: none
      markets collector: SnapshotRow.game_id
      computed by us: registry/games.csv game_id
    licence: 'ESPN files already pulled: reference only (ESPN direct; R-DS-02); hoopR ESPN releases: model input allowed (hoopR
      release; R-DS-02 allowed channel); hoopR NCAA engine: model input allowed (hoopR release); CBBD: model input allowed;
      Torvik: model input allowed, provisional (no Torvik terms page found; Aldemir to confirm); KenPom: blocked until the
      KenPom API is bought (R-DS-14); then model input allowed; markets collector: per source, docs/markets/collector_design.md
      section 6; computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'IN_GAME: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models
      only as aggregates of earlier games.'
    requirements:
    - R-FD-02
  snapshot_id:
    type: string
    unit: null
    range: '''<game_id>:cfg:<n>'''
    nullable: false
    definition: Row key.
    sources:
      CBBD: none
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: none
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: computed by us (tracking + ball)
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'IN_GAME: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models
      only as aggregates of earlier games.'
    requirements:
    - R-ST-03
  possession_id:
    type: int32
    unit: null
    range: '[1, 200] per game'
    nullable: true
    definition: 'Possession number within the game under OUR rule: a possession ends only when the other team gains control.'
    sources:
      CBBD: none
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: poss_num (source definition, kept in possessions.poss_num_ncaa)
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: possessions table
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs); hoopR NCAA engine: model
      input allowed (hoopR release)'
    as_of: 'IN_GAME: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models
      only as aggregates of earlier games.'
    requirements:
    - R-MD-04
    - R-SY-04
  trigger:
    type: enum[action_start, alignment_moment, set_t0, possession_start, shot_release]
    unit: null
    range: enum
    nullable: false
    definition: What triggered it (alignment moment = handler first < 2 m/s with the ball inside y = 9 m, or first pass after
      crossing).
    sources:
      CBBD: none
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: none
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: computed by us (tracking + ball)
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'IN_GAME: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models
      only as aggregates of earlier games.'
    requirements:
    - R-ST-03
    - R-ST-19
  video_ts_ms:
    type: int64
    unit: ms
    range: '[0, 3.6e7]'
    nullable: false
    definition: Milliseconds from the first frame's presentation time in the original file (original PTS kept for VFR, R-VI-12).
    sources:
      CBBD: none
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: none
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: decoder PTS
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'IN_GAME: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models
      only as aggregates of earlier games.'
    requirements:
    - R-MD-01
    - R-VI-12
  players:
    type: list<struct<player_id:string, team_id:string, x_m:float32, y_m:float32, r_m:float32, theta_deg:float32, spot:string,
      role:string>>
    unit: m; degrees
    range: 10 entries
    nullable: false
    definition: All 10 positions, spots and roles.
    sources:
      CBBD: none
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: none
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: computed by us (tracking + ball)
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'IN_GAME: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models
      only as aggregates of earlier games.'
    requirements:
    - R-ST-03
  alignment_code:
    type: string
    unit: null
    range: OFF.F3 codes
    nullable: true
    definition: Alignment matched.
    sources:
      CBBD: none
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: none
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: computed by us (tracking + ball)
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'IN_GAME: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models
      only as aggregates of earlier games.'
    requirements:
    - R-ST-19
    vocabulary: docs/taxonomy/offense_full.md F1-F18 (OFF.F<n>[.<sub>]) and docs/taxonomy/motion_starts.md items (MS.<id>)
      F3
  source:
