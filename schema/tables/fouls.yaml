# Proposed schema for table 'fouls' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: fouls
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Play-by-play, possessions and official events
grain: one row per foul called (player, bench, coach or team)
primary_key:
- game_id
- foul_id
foreign_keys:
- columns:
  - game_id
  references: games.game_id
- columns:
  - fouler_id
  references: players.player_id
- columns:
  - fouled_id
  references: players.player_id
- columns:
  - ft_sequence_id
  references: free_throws.ft_sequence_id (state-record)
- columns:
  - whistle_id
  references: whistles.whistle_id
- columns:
  - calling_official_id
  references: officials.official_id
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: IN_GAME
  text: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models only as aggregates
    of earlier games.
requirements:
- R-RF-03
- R-SR-03
- R-MD-07
- R-MD-16
- R-TR-25
- R-VL-10
stamps:
  file: schema/global_metadata.yaml
  fields: all
  requirement: R-MD-01
  note: Every row also carries every global_metadata field; columns named here take precedence.
notes:
- foul_state (state-record) holds per-team-per-half counts, bonus and analysis buckets; this table holds the call itself.
