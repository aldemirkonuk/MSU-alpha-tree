# Proposed schema for table 'players' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: players
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Registry and reference
grain: one row per player (person)
primary_key:
- player_id
foreign_keys: []
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: STATIC
  text: Entity attribute versioned by valid_from/valid_to; a model for a game at tip T uses the version with valid_from <=
    T.
requirements:
- R-PC-01
- R-FD-03
- R-FD-04
- new-DS-1
notes:
- Body, origin, recruiting, laterality detail and every card field are defined by W1 in docs/data/dictionary_players.md (player_cards);
  this table holds identity only.
- 'Excluded by design (R-PC-15): race, ethnicity or proxies, face data, private health, private social media.'
columns:
  player_id:
    type: string
    unit: null
    range: ESPN athlete ID or local x- ID
    nullable: false
    definition: ESPN athlete ID; local ID 'x-<team_id>-<season>-<n>' when ESPN has none.
    sources:
      CBBD: athleteId -> players.sourceId (assumed ESPN, verify)
      ESPN files already pulled: athlete.id / participants[].athlete.id
      hoopR ESPN releases: athlete_id_1 / participants_0_athlete_id
      hoopR NCAA engine: player_*_id via mbb_player_crosswalk
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: identity pipeline (track -> player)
    licence: 'ESPN files already pulled: reference only (ESPN direct; R-DS-02); hoopR ESPN releases: model input allowed (hoopR
      release; R-DS-02 allowed channel); hoopR NCAA engine: model input allowed (hoopR release); CBBD: model input allowed;
      computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'STATIC: Entity attribute versioned by valid_from/valid_to; a model for a game at tip T uses the version with valid_from
      <= T.'
    requirements:
    - R-FD-03
    - R-PC-01
    - new-DS-1
