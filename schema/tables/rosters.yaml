# Proposed schema for table 'rosters' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: rosters
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Registry and reference
grain: one row per player x team x season
primary_key:
- player_id
- team_id
- season
foreign_keys:
- columns:
  - player_id
  references: players.player_id
- columns:
  - team_id
  references: teams.team_id
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: STATIC
  text: Entity attribute versioned by valid_from/valid_to; a model for a game at tip T uses the version with valid_from <=
    T.
requirements:
- R-FD-03
- R-PC-01
- R-PC-04
notes:
- Rosters are rebuilt from per-game box scores because ESPN's roster endpoint is incomplete (registry/README.md); every player
  in a game's PBP must map to a row (R-FD-03 test).
columns:
  player_id:
    type: string
    unit: null
    range: ESPN athlete ID or local x- ID
    nullable: false
    definition: ESPN athlete ID; local ID 'x-<team_id>-<season>-<n>' when ESPN has none.
    sources:
      CBBD: athleteId -> players.sourceId (assumed ESPN, verify)
      ESPN files already pulled: athlete.id / participants[].athlete.id
      hoopR ESPN releases: athlete_id_1 / participants_0_athlete_id
      hoopR NCAA engine: player_*_id via mbb_player_crosswalk
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: identity pipeline (track -> player)
    licence: 'ESPN files already pulled: reference only (ESPN direct; R-DS-02); hoopR ESPN releases: model input allowed (hoopR
      release; R-DS-02 allowed channel); hoopR NCAA engine: model input allowed (hoopR release); CBBD: model input allowed;
      computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'STATIC: Entity attribute versioned by valid_from/valid_to; a model for a game at tip T uses the version with valid_from
      <= T.'
    requirements:
    - R-FD-03
    - R-PC-01
    - new-DS-1
  team_id:
    type: string
    unit: null
    range: ESPN team ID (digits); MSU = 127
    nullable: false
    definition: ESPN team ID of the team this row belongs to.
    sources:
      CBBD: teamId -> teams.sourceId (ESPN team ID)
      ESPN files already pulled: team.id
      hoopR ESPN releases: team_id / home_team_id / away_team_id
      hoopR NCAA engine: '*_espn_team_id'
      Torvik: team name via hoopR mbb_team_crosswalk.bart_team
      KenPom: team name via mbb_team_crosswalk.kp_team
      Kaggle archive: TEAM / TeamName via crosswalk
      EvanMiya exports: team via crosswalk
      computed by us: id_crosswalk
    licence: 'ESPN files already pulled: reference only (ESPN direct; R-DS-02); hoopR ESPN releases: model input allowed (hoopR
      release; R-DS-02 allowed channel); hoopR NCAA engine: model input allowed (hoopR release); CBBD: model input allowed;
      Torvik: model input allowed, provisional (no Torvik terms page found; Aldemir to confirm); KenPom: blocked until the
      KenPom API is bought (R-DS-14); then model input allowed; Kaggle archive: reference only until the archive licence is
      checked (contains KenPom/Torvik-derived columns); EvanMiya exports: reference only (EvanMiya terms: no redistribution;
      R-DS-10); computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'STATIC: Entity attribute versioned by valid_from/valid_to; a model for a game at tip T uses the version with valid_from
      <= T.'
    requirements:
    - R-FD-02
    - R-DS-05
  season:
    type: int16
    unit: year
    range: '[2003, 2035]'
    nullable: false
    definition: Season named by its ending year (2026 = 2025-26), as ESPN and CBBD do.
    sources:
      CBBD: season
      ESPN files already pulled: season.year
      hoopR ESPN releases: season
      hoopR NCAA engine: season
      Torvik: year in file name
      KenPom: Season
      Kaggle archive: YEAR / Season
      EvanMiya exports: none
    licence: 'ESPN files already pulled: reference only (ESPN direct; R-DS-02); hoopR ESPN releases: model input allowed (hoopR
      release; R-DS-02 allowed channel); hoopR NCAA engine: model input allowed (hoopR release); CBBD: model input allowed;
      Torvik: model input allowed, provisional (no Torvik terms page found; Aldemir to confirm); KenPom: blocked until the
      KenPom API is bought (R-DS-14); then model input allowed; Kaggle archive: reference only until the archive licence is
      checked (contains KenPom/Torvik-derived columns)'
    as_of: 'STATIC: Entity attribute versioned by valid_from/valid_to; a model for a game at tip T uses the version with valid_from
      <= T.'
    requirements:
