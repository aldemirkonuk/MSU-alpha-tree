# Proposed schema for table 'rebounds' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: rebounds
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Play-by-play, possessions and official events
grain: one row per rebound (player or team) after a missed field goal or last free throw
primary_key:
- game_id
- rebound_id
foreign_keys:
- columns:
  - game_id
  references: games.game_id
- columns:
  - event_id
  references: events.event_id
- columns:
  - rebounder_id
  references: players.player_id
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: IN_GAME
  text: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models only as aggregates
    of earlier games.
requirements:
- R-EV-08
- R-PE-03
- R-VL-11
- R-PC-08
stamps:
  file: schema/global_metadata.yaml
  fields: all
  requirement: R-MD-01
  note: Every row also carries every global_metadata field; columns named here take precedence.
columns:
  game_id:
    type: string
    unit: null
    range: ESPN event ID (digits)
    nullable: false
    definition: ESPN game (event) ID, the one join key across video, play-by-play, markets and context.
    sources:
      CBBD: games.sourceId (ESPN event ID per collector_design.md 1.1; verify on first keyed call)
      ESPN files already pulled: header.id / event.id
      hoopR ESPN releases: game_id
      hoopR NCAA engine: espn_game_id
      Torvik: via hoopR mbb_schedule_crosswalk.bart_muid
      KenPom: via mbb_schedule_crosswalk.kp_game_id
      Kaggle archive: none
      EvanMiya exports: none
      markets collector: SnapshotRow.game_id
      computed by us: registry/games.csv game_id
    licence: 'ESPN files already pulled: reference only (ESPN direct; R-DS-02); hoopR ESPN releases: model input allowed (hoopR
      release; R-DS-02 allowed channel); hoopR NCAA engine: model input allowed (hoopR release); CBBD: model input allowed;
      Torvik: model input allowed, provisional (no Torvik terms page found; Aldemir to confirm); KenPom: blocked until the
      KenPom API is bought (R-DS-14); then model input allowed; markets collector: per source, docs/markets/collector_design.md
      section 6; computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'IN_GAME: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models
      only as aggregates of earlier games.'
    requirements:
    - R-FD-02
