# Proposed schema for table 'possessions' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: possessions
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Play-by-play, possessions and official events
grain: one row per possession under OUR rule (ends only when the other team gains control; offensive rebounds stay inside)
primary_key:
- game_id
- possession_id
foreign_keys:
- columns:
  - game_id
  references: games.game_id
- columns:
  - team_id
  references: teams.team_id
- columns:
  - defense_team_id
  references: teams.team_id
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: IN_GAME
  text: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models only as aggregates
    of earlier games.
requirements:
- R-MD-04
- R-SY-04
- R-SY-06
- R-DQ-06
- R-TR-19
- R-PE-01
stamps:
  file: schema/global_metadata.yaml
  fields: all
  requirement: R-MD-01
  note: Every row also carries every global_metadata field; columns named here take precedence.
notes:
- 'Source possession definitions (record, never merge): OURS = ends only when the other team gains control (offensive rebound
  = new chance, same possession). KenPom = estimated count FGA - OR + TO + 0.475 x FTA (glossary). CBBD box ''possessions''
  = an estimate (formula unverified). hoopR NCAA engine poss_num = possession changes on change of poss_team (offensive rebounds
  stay inside; unverified, check on first files). Synergy = an offensive rebound starts a new possession. ESPN = no possession
  field.'
- 'Test (R-SY-04, R-DQ-06): possession points sum to the final score; possessions of the two teams differ by <= 1 per half
  (R-IV-15).'
