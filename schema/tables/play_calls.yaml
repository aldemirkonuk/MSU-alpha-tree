# Proposed schema for table 'play_calls' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: play_calls
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Actions, sets and defensive structure
grain: one row per observed or inferred play call (set called)
primary_key:
- game_id
- call_id
foreign_keys: []
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: IN_GAME
  text: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models only as aggregates
    of earlier games.
requirements:
- R-EV-15
- R-AU-02
- R-CH-06
stamps:
  file: schema/global_metadata.yaml
  fields: all
  requirement: R-MD-01
  note: Every row also carries every global_metadata field; columns named here take precedence.
columns:
  game_id:
    type: string
    unit: null
    range: ESPN event ID (digits)
    nullable: false
    definition: ESPN game (event) ID, the one join key across video, play-by-play, markets and context.
    sources:
      CBBD: games.sourceId (ESPN event ID per collector_design.md 1.1; verify on first keyed call)
      ESPN files already pulled: header.id / event.id
      hoopR ESPN releases: game_id
      hoopR NCAA engine: espn_game_id
      Torvik: via hoopR mbb_schedule_crosswalk.bart_muid
      KenPom: via mbb_schedule_crosswalk.kp_game_id
      Kaggle archive: none
      EvanMiya exports: none
      markets collector: SnapshotRow.game_id
      computed by us: registry/games.csv game_id
    licence: 'ESPN files already pulled: reference only (ESPN direct; R-DS-02); hoopR ESPN releases: model input allowed (hoopR
      release; R-DS-02 allowed channel); hoopR NCAA engine: model input allowed (hoopR release); CBBD: model input allowed;
      Torvik: model input allowed, provisional (no Torvik terms page found; Aldemir to confirm); KenPom: blocked until the
      KenPom API is bought (R-DS-14); then model input allowed; markets collector: per source, docs/markets/collector_design.md
      section 6; computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'IN_GAME: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models
      only as aggregates of earlier games.'
    requirements:
    - R-FD-02
  call_id:
    type: string
    unit: null
    range: '''<game_id>:call:<n>'''
    nullable: false
    definition: Row key.
    sources:
      CBBD: none
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: none
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: computed by us (tracking + ball)
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'IN_GAME: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models
      only as aggregates of earlier games.'
    requirements:
    - R-EV-15
  team_id:
    type: string
    unit: null
    range: ESPN team ID (digits); MSU = 127
    nullable: false
    definition: ESPN team ID of the team this row belongs to.
    sources:
      CBBD: teamId -> teams.sourceId (ESPN team ID)
      ESPN files already pulled: team.id
      hoopR ESPN releases: team_id / home_team_id / away_team_id
      hoopR NCAA engine: '*_espn_team_id'
      Torvik: team name via hoopR mbb_team_crosswalk.bart_team
      KenPom: team name via mbb_team_crosswalk.kp_team
      Kaggle archive: TEAM / TeamName via crosswalk
      EvanMiya exports: team via crosswalk
      computed by us: id_crosswalk
    licence: 'ESPN files already pulled: reference only (ESPN direct; R-DS-02); hoopR ESPN releases: model input allowed (hoopR
      release; R-DS-02 allowed channel); hoopR NCAA engine: model input allowed (hoopR release); CBBD: model input allowed;
      Torvik: model input allowed, provisional (no Torvik terms page found; Aldemir to confirm); KenPom: blocked until the
      KenPom API is bought (R-DS-14); then model input allowed; Kaggle archive: reference only until the archive licence is
      checked (contains KenPom/Torvik-derived columns); EvanMiya exports: reference only (EvanMiya terms: no redistribution;
      R-DS-10); computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'IN_GAME: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models
      only as aggregates of earlier games.'
    requirements:
    - R-FD-02
    - R-DS-05
  video_ts_ms:
    type: int64
    unit: ms
    range: '[0, 3.6e7]'
    nullable: false
    definition: Milliseconds from the first frame's presentation time in the original file (original PTS kept for VFR, R-VI-12).
    sources:
      CBBD: none
      ESPN files already pulled: none
