    type: enum[team, coach, player, pair, lineup, opponent_vs_msu_set]
    unit: null
    range: enum
    nullable: false
    definition: Entity profiled.
    sources:
      CBBD: none
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: none
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: computed by us
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'SNAPSHOT: Carries its own as-of time; usable only when that time is before the cutoff (tip minus horizon; R-CX-09,
      R-MK-07, R-PC-14).'
    requirements:
    - R-FD-07
  entity_id:
