# Proposed schema for table 'profile_snapshots' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: profile_snapshots
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Profiles, quality and research
grain: one row per entity x metric x as-of date (team, coach, player, pair or lineup profiles from games before that date)
primary_key:
- entity_type
- entity_id
- metric_code
- as_of_date
foreign_keys: []
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: SNAPSHOT
  text: Carries its own as-of time; usable only when that time is before the cutoff (tip minus horizon; R-CX-09, R-MK-07,
    R-PC-14).
requirements:
- R-FD-07
- R-OS-01
- R-OS-02
- R-CC-02
- R-CC-05
- R-CH-02
- R-CH-03
- R-CH-07
- R-ST-14
- R-ST-25
- R-CX-19
notes:
- Recomputing a profile from a truncated game list must give identical values (R-FD-07 test).
columns:
