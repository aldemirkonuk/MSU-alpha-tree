# Proposed schema for table 'events' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: events
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Play-by-play, possessions and official events
grain: one row per event from any source (official play-by-play, CV, OCR, audio, manual); one event never hides inside another
primary_key:
- game_id
- event_id
foreign_keys:
- columns:
  - game_id
  references: games.game_id
- columns:
  - team_id
  references: teams.team_id
- columns:
  - player_id_1
  references: players.player_id
- columns:
  - player_id_2
  references: players.player_id
- columns:
  - possession_id
  references: possessions.possession_id
- columns:
  - chance_id
  references: chances.chance_id
- columns:
  - matched_event_id
  references: events.event_id
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: IN_GAME
  text: Known at in-game instant t (video_ts_ms / game clock); live models may use it from t on; pre-game models only as aggregates
    of earlier games.
requirements:
- R-EV-01
- R-EV-12
- R-SY-02
- R-SY-10
- R-SR-14
- R-MD-01
stamps:
  file: schema/global_metadata.yaml
  fields: all
  requirement: R-MD-01
  note: Every row also carries every global_metadata field; columns named here take precedence.
notes:
- PBP rows and CV rows of the same real event are separate rows linked by matched_event_id, so blind and anchored passes stay
  comparable (R-SR-13).
- cv_events_unmatched (state-record table) holds the confidence stream of CV events without a PBP match; events.match_status
  = cv_only points at it.
- ESPN files already pulled are reference only; model inputs come from hoopR releases and CBBD (R-DS-02, R-DS-06).
columns:
