# Proposed schema for table 'ratings_snapshots' (status: proposed). Generated from docs/data/dictionary_games.md, 2026-10-18.
name: ratings_snapshots
status: proposed
proposed_by: W2 core-tables agent, prompt 003 (2026-10-18); approval by the requirements session
group: Registry and reference
grain: one row per entity x rating system x metric x as-of date (long format)
primary_key:
- entity_type
- entity_id
- system
- metric_code
- as_of_date
foreign_keys: []
storage: 'private: MyDrive/MSU-Alpha-3/processed/<game_id>/<version>/<table>.parquet (R-EN-07)'
as_of_default:
  rule: DAY_BEFORE
  text: Value as of the US-Eastern day before tip (R-FD-06, R-DS-04); missing -> nearest earlier snapshot, flagged with its
    date.
requirements:
- R-FD-06
- R-DS-04
- R-OS-01
- R-PR-03
- R-PC-13
notes:
- Long format so any system or metric can be added without a schema change.
- Kaggle archive and EvanMiya export rows are reference only; KenPom rows wait for the API (R-DS-14).
columns:
  entity_type:
    type: enum[team, player, lineup, conference]
    unit: null
    range: enum
    nullable: false
    definition: What is rated.
    sources:
      CBBD: none
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: none
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: loader
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'DAY_BEFORE: Value as of the US-Eastern day before tip (R-FD-06, R-DS-04); missing -> nearest earlier snapshot,
      flagged with its date.'
    requirements:
    - R-FD-06
    - R-DS-04
  entity_id:
    type: string
    unit: null
    range: ESPN team/player ID, lineup_key, or conference ID
    nullable: false
    definition: Rated entity in our IDs (via id_crosswalk).
    sources:
      CBBD: none
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: none
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: id_crosswalk
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'DAY_BEFORE: Value as of the US-Eastern day before tip (R-FD-06, R-DS-04); missing -> nearest earlier snapshot,
      flagged with its date.'
    requirements:
    - R-DS-05
  season:
    type: int16
    unit: year
    range: '[2003, 2035]'
    nullable: false
    definition: Season named by its ending year (2026 = 2025-26), as ESPN and CBBD do.
    sources:
      CBBD: season
      ESPN files already pulled: season.year
      hoopR ESPN releases: season
      hoopR NCAA engine: season
      Torvik: year in file name
      KenPom: Season
      Kaggle archive: YEAR / Season
      EvanMiya exports: none
    licence: 'ESPN files already pulled: reference only (ESPN direct; R-DS-02); hoopR ESPN releases: model input allowed (hoopR
      release; R-DS-02 allowed channel); hoopR NCAA engine: model input allowed (hoopR release); CBBD: model input allowed;
      Torvik: model input allowed, provisional (no Torvik terms page found; Aldemir to confirm); KenPom: blocked until the
      KenPom API is bought (R-DS-14); then model input allowed; Kaggle archive: reference only until the archive licence is
      checked (contains KenPom/Torvik-derived columns)'
    as_of: 'DAY_BEFORE: Value as of the US-Eastern day before tip (R-FD-06, R-DS-04); missing -> nearest earlier snapshot,
      flagged with its date.'
    requirements:
    - R-FD-01
  system:
    type: enum[kenpom, torvik, cbbd_adjusted, cbbd_srs, cbbd_elo, evanmiya, espn_bpi, net, ap_poll, kaggle_538, kaggle_rppf,
      kaggle_teamrankings, haslametrics]
    unit: null
    range: enum
    nullable: false
    definition: Rating system.
    sources:
      CBBD: none
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: none
      Torvik: none
      KenPom: none
      Kaggle archive: none
      EvanMiya exports: none
      computed by us: loader
    licence: 'computed by us: own (model input allowed; inherits the strictest class of its inputs)'
    as_of: 'DAY_BEFORE: Value as of the US-Eastern day before tip (R-FD-06, R-DS-04); missing -> nearest earlier snapshot,
      flagged with its date.'
    requirements:
    - R-FD-06
    - R-DS-09
  metric_code:
    type: enum[adj_o, adj_d, adj_em, adj_t, raw_o, raw_d, raw_t, barthag, sos, ncsos, wab, luck, elo, srs, net_rating, bpr,
      obpr, dbpr, bpi, bpi_o, bpi_d, net_rank, ap_rank, ap_points, tempo, poss_length_off_s, poss_length_def_s, continuity,
      effective_height_cm, experience_years, talent, porpag, dporpag, preseason_adj_em]
    unit: null
    range: enum
    nullable: false
    definition: 'Metric. Source columns: KenPom AdjOE/AdjDE/AdjEM/AdjTempo (KG ''INT _ KenPom _ Summary'': AdjOE, AdjDE, AdjEM,
      AdjTempo; ''KenPom Barttorvik'': KADJ O, KADJ D, KADJ EM, KADJ T); Torvik adjoe/adjde/barthag/adjt/WAB (2026_team_results.csv;
      KG BADJ O/BADJ D/BADJ EM/BARTHAG/BADJ T/WAB/TALENT/EXP/EFF HGT); CBBD ratings/adjusted offensiveRating/defensiveRating/netRating,
      ratings/srs rating, ratings/elo elo, games homeTeamEloStart; EvanMiya obpr/dbpr/bpr (EvanMiya_Teams/Players), O RATE/D
      RATE (KG EvanMiya.csv); KenPom ''Avg Possession Length (Offense)'' (KG INT _ KenPom _ Efficiency); poll ranks from CBBD
      rankings.'
    sources:
      CBBD: /ratings/adjusted, /ratings/srs, /ratings/elo, /rankings
      ESPN files already pulled: powerindex bpi (pulled? no; reference)
      hoopR ESPN releases: none
      hoopR NCAA engine: none
      Torvik: '{YEAR}_team_results.csv, Time Machine'
      KenPom: ratings, archive endpoints (docs)
      Kaggle archive: archive-3 and archive files (see definition)
      EvanMiya exports: EvanMiya_Teams.csv, EvanMiya_Players.csv, EvanMiya_Lineups.csv
    licence: 'KenPom: blocked until the KenPom API is bought (R-DS-14); then model input allowed; Torvik: model input allowed,
      provisional (no Torvik terms page found; Aldemir to confirm); CBBD: model input allowed; EvanMiya exports: reference
      only (EvanMiya terms: no redistribution; R-DS-10); Kaggle archive: reference only until the archive licence is checked
      (contains KenPom/Torvik-derived columns); ESPN files already pulled: reference only (ESPN direct; R-DS-02)'
    as_of: 'DAY_BEFORE: Value as of the US-Eastern day before tip (R-FD-06, R-DS-04); missing -> nearest earlier snapshot,
      flagged with its date.'
    requirements:
    - R-FD-06
    - R-DS-04
    - R-OS-01
  value:
    type: float64
    unit: per metric (points/100 poss, poss/40 min, probability, rank, s, cm, years)
    range: per metric
    nullable: false
    definition: Metric value; unit given by metric_code (e.g. adj_o points per 100 possessions; adj_t possessions per 40 min;
      barthag probability 0-1; poss_length_off_s seconds).
    sources:
      CBBD: see definition
      ESPN files already pulled: none
      hoopR ESPN releases: none
      hoopR NCAA engine: none
