  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  - R-MD-16
  - R-IV-03
  nullable: true
- name: flagrant1_player_cum
  type: int
  unit: count
  range:
  - 0
  - 3
