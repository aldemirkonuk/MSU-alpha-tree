  requirements:
  - R-SR-03
  - R-SR-09
  nullable: false
- name: ft_points_conceded
  type: int
  unit: points
  range:
  - 0
  - 80
  definition: Opponent free-throw points from these fouls.
  source: derived + free_throws
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: personal_fouls_player_cum
  type: int
  unit: count
  range:
  - 0
  - 5
  definition: 'Player rows: personal + Class A technical fouls so far in the game at bucket end (disqualification at 5, Rule 4-12.1).'
