  - PBP
  - CV
  - manual
  - derived
  definition: Source of the foul count value(s) in this row.
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-15
  - R-MD-09
  - R-SR-03
  nullable: false
- name: fouls_conf
  type: float
  unit: 0-1
  range:
  - 0
  - 1
  definition: Confidence of the foul count value(s); PBP-sourced values carry 1.0 (R-MD-09).
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-15
  - R-MD-09
  - R-SR-03
  nullable: false
- name: fouls_dq
  type: enum
  values:
  - observed
  - inferred
  - carried
  - imputed
  - quarantined
  definition: Data-quality flag of the foul count value(s).
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-15
  - R-MD-19
  - R-SR-03
  nullable: false
- name: pbp_provider
  type: enum
  values:
  - cbbd
  - espn_pulled
  - hoopr_espn
  - hoopr_ncaa
  - none
  definition: Provider of the PBP row this record was matched to or built from; 'none' in the blind pass.
  source: pipeline
  licence: computed_by_us
  as_of: post_game
  requirements:
  - R-DQ-01
  - R-DQ-04
  - R-SR-15
  nullable: false
- name: pbp_event_id
  type: string
  definition: Key of the matched row in the events table (dictionary_games.md), which keeps the provider's own play ID.
  source: PBP
  licence: ROW
  as_of: post_game
  requirements:
  - R-SY-02
  - R-SY-10
  nullable: true
- name: licence_class
  type: enum
  values:
  - computed_by_us
  - model_input_allowed
  - reference_only
  definition: Licence class of the PBP-derived values in this row (computed_by_us when no PBP value is used).
  source: pipeline from pbp_provider
  licence: computed_by_us
  as_of: n/a
  requirements:
  - R-DQ-04
  nullable: false
- name: model_version
  type: string
  definition: Pipeline and model versions that produced the row (semver string per stage, joined).
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-MD-09
  - R-EN-04
  - R-DQ-04
  global_metadata: true
  nullable: false
- name: source
  type: string
  definition: Row-level source summary, e.g. 'fused:OCR+CV' or 'PBP:cbbd'. Field-level sources are in the *_src columns.
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-MD-09
  - R-SR-15
  global_metadata: true
  nullable: false
- name: confidence
  type: float
  unit: 0-1
  range:
  - 0
  - 1
  definition: 'Row-level confidence: minimum of the field confidences used in the row.'
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-MD-09
  - R-SR-15
  global_metadata: true
  nullable: false
- name: created_utc
  type: timestamp
  unit: UTC
  definition: UTC time the row was written. Rows are never updated in place; a new version is a new pipeline version (R-EN-07).
  source: pipeline
  licence: computed_by_us
  as_of: n/a (processing metadata)
  requirements:
  - R-DQ-04
  - R-EN-07
  nullable: false
