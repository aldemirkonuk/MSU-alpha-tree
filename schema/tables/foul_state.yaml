# Proposed schema (2026-10-18) for table foul_state. Status: proposed; the requirements session approves.
# Generated from one spec together with docs/data/dictionary_state.md so the two never drift.
# Field names of schema/global_metadata.yaml are used unchanged (global_metadata: true);
# proposed_global_addition: true marks fields proposed for global_metadata.yaml (see the dated note in the dictionary).
table: foul_state
status: proposed
version: 0.1.0
date: '2026-10-18'
owner: prompt 003 W2 item 5 (state record and invariants)
dictionary: docs/data/dictionary_state.md#foul_state
grain: one row per game, pass, team, subject (team or one player) and bucket (half, period, ten_minute, media_segment, game)
primary_key:
- game_id
- pass
- team
- subject_id
- bucket_type
- bucket_id
foreign_keys:
- columns:
  - game_id
  references: games.game_id
- columns:
  - subject_id
  references: rosters.player_id (when not '_team')
requirements:
- R-SR-03
- R-SR-11
- R-IV-03
- R-IV-09
- R-MD-07
- R-MD-16
- R-RF-03
- R-PE-06
- R-PE-07
storage: Parquet, processed/<game_id>/<version>/foul_state.parquet (private Drive, never the repo; R-EN-07)
notes:
- 'Team rows: subject_id = ''_team''. Player rows: personal fouls per player per bucket (R-SR-03 ''personal fouls per player'').'
- bucket_type 'half' is the rule bucket (team fouls and bonus; H2 includes extra periods, Rule 5-9.4). 'period' splits extra periods out for analysis. 'ten_minute' and 'media_segment' are analysis buckets
  only.
- Individual fouls live in the fouls table (dictionary_games.md); this table is the state roll-up and must recompute from it (R-SR-11 test).
legend:
  licence:
    computed_by_us: Computed by this project from privately held broadcast video (OCR, CV), audio, manual labels or our own pipeline. Private research use; model input allowed internally; never published
      raw (video is private research use only).
    model_input_allowed: 'Value taken from CollegeBasketballData (CBBD): research and commercial use allowed per docs/research/data_sources_catalog.md row 8.'
    reference_only: 'Value taken from ESPN data already pulled, hoopR ESPN prebuilt files, or hoopR NCAA-engine files: ESPN terms bar automated collection and data-set compilation; NCAA terms unverified.
      Reference and cross-check only until Aldemir decides otherwise.'
    ROW: Licence depends on the row's pbp_provider and is stored in the row's licence_class column (cbbd -> model_input_allowed; espn_pulled, hoopr_espn, hoopr_ncaa -> reference_only).
    REG: Inherits the games registry entry (dictionary_games.md).
  as_of:
    at_frame: Known at the video instant the row describes; usable as an in-game feature at that instant.
    by_pass: 'Blind pass: at_frame. Anchored pass: post_game (it uses PBP, which is only complete after the game). Anchored values are for training and for describing past games, never in-game features
      (Principle 6).'
    post_game: Known only after the game (PBP published, full video processed).
    post_review: Known at reviewed_utc of the review that set it.
    pre_game: Known before tip (registry).
    n/a: Key or processing metadata.
  source:
    OCR: Parsed scoreboard readings (scoreboard_ocr).
    CV: Our detection, tracking, ball, rim and lane models (dictionary_games.md frames, tracks).
    PBP: 'Anchored pass only: CBBD plays, or ESPN play-by-play already pulled / hoopR load_mbb_pbp; exact provider field names in docs/data/source_field_map.md.'
    fused: Fusion of OCR, CV and, in the anchored pass, PBP; authority order official scorebook (PBP, box score) > arena scoreboard > broadcast scorebug (Rule 2-9.13).
    derived: Computed from other columns of the same table by the rule in the definition.
    pipeline: Written by the processing pipeline (keys, versions, lineage).
    manual review: Human reviewer through the review queue (R-HR-02, R-HR-05).
columns:
- name: game_id
  type: string
  definition: ESPN game ID; the one join key across sources (FK games.game_id).
  source: registry/games.csv
  licence: REG
  as_of: pre_game
  requirements:
  - R-MD-01
  global_metadata: true
  nullable: false
- name: pass
  type: enum
  values:
  - blind
  - anchored
  - pbp_only
  definition: blind, anchored, or pbp_only (games or stretches with no video, built from PBP alone for the possession engine, R-SY-06, R-PE-08).
  source: pipeline
  licence: computed_by_us
  as_of: n/a
  requirements:
  - R-SR-13
  - R-SR-15
  - R-SY-06
  - R-PE-08
  nullable: false
  proposed_global_addition: true
- name: team
  type: enum
  values:
  - msu
  - opponent
  definition: Team that committed the fouls.
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: subject_id
  type: string
  definition: '''_team'' for the team row, else roster player ID.'
  source: pipeline
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  - R-MD-16
  nullable: false
- name: bucket_type
  type: enum
  values:
  - half
  - period
  - ten_minute
  - media_segment
  - game
  definition: half, period, ten_minute, media_segment, game.
  source: pipeline
  licence: computed_by_us
  as_of: n/a
  requirements:
  - R-SR-03
  nullable: false
- name: bucket_id
  type: string
  definition: H1, H2 (incl. OT) | P1, P2, OT1.. | H1-A, H1-B, H2-A, H2-B, OT<n> | H<h>-S<k>, OT<n> | G.
  source: pipeline
  licence: computed_by_us
  as_of: n/a
  requirements:
  - R-SR-03
  - R-MD-13
  nullable: false
- name: bucket_start_clock_s
  type: float
  unit: s
  range:
  - 0
  - 1200
  definition: 'Game clock at bucket start (media segments: clock when the media timeout was taken).'
  source: derived
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: bucket_end_clock_s
  type: float
  unit: s
  range:
  - 0
  - 1200
  definition: Game clock at bucket end.
  source: derived
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: team_fouls_start
  type: int
  unit: count
  range:
  - 0
  - 60
  definition: Team-foul total at bucket start (half rule count).
  source: derived
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  - R-IV-09
  nullable: false
- name: team_fouls_end
  type: int
  unit: count
  range:
  - 0
  - 60
  definition: Team-foul total at bucket end.
  source: derived
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  - R-IV-09
  nullable: false
- name: fouls_team_total
  type: int
  unit: count
  range:
  - 0
  - 60
  definition: 'Fouls in the bucket that count toward the team-foul total: personal (incl. player-control) + Class A technical (Rule 8-2.3).'
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  - R-IV-09
  nullable: false
- name: personal_fouls
  type: int
  unit: count
  range:
  - 0
  - 60
  definition: All personal fouls (Rule 4-15.2).
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: shooting_fouls
  type: int
  unit: count
  range:
  - 0
  - 60
  definition: Personal fouls on a player in the act of shooting.
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  - R-RF-03
  nullable: false
- name: common_nonshooting_fouls
  type: int
  unit: count
  range:
  - 0
  - 60
  definition: Common fouls not on a shooter and not player/team-control.
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: player_control_fouls
  type: int
  unit: count
  range:
  - 0
  - 60
  definition: Player-control fouls (offensive, Rule 4-15.2.a.1).
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: team_control_fouls
  type: int
  unit: count
  range:
  - 0
  - 60
  definition: Team-control fouls that are not loose-ball fouls (Rule 4-15.2.a.2).
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: loose_ball_fouls
  type: int
  unit: count
  range:
  - 0
  - 60
  definition: Loose-ball fouls (Rule 4-15.2.a.3; on an offensive player also team-control but bonus-eligible).
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: flagrant1_fouls
  type: int
  unit: count
  range:
  - 0
  - 10
  definition: Flagrant 1 personal fouls.
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: flagrant2_fouls
  type: int
  unit: count
  range:
  - 0
  - 10
  definition: Flagrant 2 personal fouls.
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: double_simultaneous_fouls
  type: int
  unit: count
  range:
  - 0
  - 20
  definition: Fouls that are part of a double or simultaneous foul (no free throws, Rule 10-1 Penalty f).
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: technical_class_a
  type: int
  unit: count
  range:
  - 0
  - 10
  definition: Class A technical fouls (count toward team fouls and disqualification).
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: technical_class_b
  type: int
  unit: count
  range:
  - 0
  - 10
  definition: Class B technical fouls (no team-foul count; 1 free throw).
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: technical_admin
  type: int
  unit: count
  range:
  - 0
  - 10
  definition: Administrative technical fouls (no team-foul count).
  source: fused
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: bonus_reached_clock_s
  type: float
  unit: s
  range:
  - 0
  - 1200
  definition: Game clock when this team's 7th team foul of the half put the opponent in the bonus (half buckets only).
  source: derived
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  - R-MD-07
  nullable: true
- name: double_bonus_reached_clock_s
  type: float
  unit: s
  range:
  - 0
  - 1200
  definition: Game clock of the 10th team foul of the half.
  source: derived
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  - R-MD-07
  nullable: true
- name: fouls_to_give_start
  type: int
  unit: count
  range:
  - 0
  - 6
  definition: max(0, 6 - team_fouls_start).
  source: derived
  licence: computed_by_us
  as_of: by_pass
  requirements:
  - R-SR-03
  nullable: false
- name: fta_conceded
  type: int
  unit: count
  range:
