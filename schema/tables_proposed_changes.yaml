new_tables:
- table: runs
  grain: one row per run per definition
  leaf: D.01.05
  requirement_ids:
  - new-MD-9
  why_not_columns: a run spans many score events and seconds; one row per run per definition cannot live on an existing row
  columns:
  - column: game_id
    type: string
    unit: null
    range: ESPN event ID
    definition: Game.
  - column: run_id
    type: string
    unit: null
    range: unique in game
    definition: Run identifier.
  - column: definition_code
    type: enum[strict_unanswered_8, register_net8_120s]
    unit: null
    range: enum
    definition: Which run definition.
  - column: team_id
    type: string
    unit: null
    range: ESPN team ID
    definition: Team on the run.
  - column: start_score_event_id
    type: string
    unit: null
    range: FK score_events
    definition: First scoring event of the run.
  - column: end_score_event_id
    type: string
    unit: null
    range: FK score_events
    definition: Last scoring event of the run.
  - column: start_game_clock_s
    type: float32
    unit: s
    range: '[0, 1200]'
    definition: Clock at the first score.
  - column: end_game_clock_s
    type: float32
    unit: s
    range: '[0, 1200]'
    definition: Clock at the last score.
  - column: duration_s
    type: float32
    unit: s
    range: '[0, 2400]'
    definition: Game-clock duration.
  - column: pts_for
    type: int16
    unit: points
    range: '[8, 60]'
    definition: Points by the running team.
  - column: pts_against
    type: int16
    unit: points
    range: '[0, 60]'
    definition: Opponent points inside the window.
  - column: timeouts_during
    type: int8
    unit: count
    range: '[0, 5]'
    definition: Timeouts called inside the run, either team.
  - column: ended_by
    type: enum[opponent_score, period_end, game_end, window_expired]
    unit: null
    range: enum
    definition: What ended it.
- table: fakes
  grain: one row per fake
  leaf: E.02.06
  requirement_ids:
  - new-EV-15
  - new-EV-16
  why_not_columns: several fakes per touch; each has its own defender reaction and value
  columns:
  - column: game_id
    type: string
    unit: null
    range: ESPN event ID
    definition: Game.
  - column: fake_id
    type: string
    unit: null
    range: unique in game
    definition: Fake identifier.
  - column: touch_id
    type: string
    unit: null
    range: FK touches
    definition: Touch in which it happened.
  - column: possession_id
    type: string
    unit: null
    range: FK possessions
    definition: Possession.
  - column: player_id
    type: string
    unit: null
    range: ESPN athlete ID
    definition: Faker.
  - column: kind
    type: enum[shot_fake, jump_fake, pass_fake, jab_step, rocker_step, head_or_shoulder_fake]
    unit: null
    range: enum
    definition: Fake kind (actions_extra.yaml fakes).
  - column: ts_ms
    type: int64
    unit: ms
    range: '[0, video duration]'
    definition: Peak of the fake.
  - column: ball_rise_m
    type: float32
    unit: m
    range: '[0, 1.5]'
    definition: Ball rise (shot fakes).
  - column: foot_disp_m
    type: float32
    unit: m
    range: '[0, 1.5]'
    definition: Foot displacement (jab/rocker).
  - column: direction_deg
    type: float32
    unit: degrees
    range: '[-180, 180]'
    definition: Direction of the fake relative to the player->rim vector.
  - column: defender_id
    type: string
    unit: null
    range: ESPN athlete ID
    definition: On-ball defender.
  - column: defender_reaction
    type: enum[left_feet, rose, shifted, closed_out, no_reaction, not_visible]
    unit: null
    range: enum
    definition: Reaction.
  - column: reaction_latency_s
    type: float32
    unit: s
    range: '[0, 0.40]'
    definition: Time from fake peak to the reaction threshold.
  - column: next_action
    type: enum[shot, drive, pass, dribble_hold, another_fake, turnover, foul_drawn]
    unit: null
    range: enum
    definition: What followed within 1.5 s.
  - column: value_delta
    type: float32
    unit: xpts
    range: '[-2, 2]'
    definition: Value change 1.0 s after.
- table: source_definitions
  grain: one row per source x field definition
  leaf: M.01.06
  requirement_ids:
  - new-DS-3
  why_not_columns: one row per source x field; source_register is one row per source
  columns:
  - column: source
    type: string
    unit: null
    range: source_register.source
    definition: Source.
  - column: source_field
    type: string
    unit: null
    range: field path
    definition: Source field name.
  - column: concept
    type: enum[possession, chance, assist, block, steal, rebound, turnover, transition, fast_break, shot_zone, shot_range, garbage_time, minutes,
      points_in_paint, other]
    unit: null
    range: enum
    definition: Concept defined.
  - column: definition_text
    type: string
    unit: null
    range: <= 600 chars, paraphrased
    definition: The source's definition (paraphrase; no long quotes).
  - column: url
    type: string
    unit: null
    range: URL or repo path
    definition: Where it was read.
  - column: verified
    type: bool
    unit: null
    range: true/false
    definition: Read from an opened page/code (true) or inferred (false).
  - column: checked_on
    type: date
    unit: null
    range: YYYY-MM-DD
    definition: Date checked.
  - column: our_columns
    type: list<string>
    unit: null
    range: table.column
    definition: Columns that carry this source field.
  - column: difference_from_ours
    type: string
    unit: null
    range: free text
    definition: How it differs from our definition.
