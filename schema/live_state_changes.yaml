  - {column: 'clock_age_s', type: 'float', unit: 's', field: 'stamp_age_s', requirement: ['R-SR-15', 'R-MD-24'], definition: 'Seconds of video time since a healthy sensor last read the game clock or last watched for its change; none when never observed in the game.', why: 'The rule of the pack: a value is never shown as better than it is, so every stamp group carries its age beside src, conf and dq.', status: 'not applied: proposal for the requirements session'}
  - {column: 'fouls_age_s', type: 'float', unit: 's', field: 'stamp_age_s', requirement: ['R-SR-15', 'R-MD-24'], definition: 'Seconds of video time since a healthy sensor last read the foul counts or last watched for its change; none when never observed in the game.', why: 'The rule of the pack: a value is never shown as better than it is, so every stamp group carries its age beside src, conf and dq.', status: 'not applied: proposal for the requirements session'}
  - {column: 'est_utc', type: 'timestamp', unit: 'UTC', field: 'est_utc', requirement: ['R-MK-03', 'R-MD-23'], definition: 'Estimated real-world UTC of the start of the second, from the clock map.', why: 'What was true is joined to market prices on est_utc; the per-second view has no UTC column.', status: 'not applied: proposal for the requirements session'}
