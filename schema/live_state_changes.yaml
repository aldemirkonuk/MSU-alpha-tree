  - {column: 'stream_delay_basis', type: 'enum (measured, modelled, none)', unit: 'n/a', field: 'stream_delay_s', requirement: ['R-MK-07', 'R-MD-24'], definition: 'measured = anchored at a live session; modelled = the planning value of the source; none = no delay applies.', why: 'A backtest must say which kind of delay it used.', status: 'not applied: proposal for the requirements session'}
  frames:
  - {column: 'received_utc', type: 'timestamp', unit: 'UTC', field: 'stream_delay_s', requirement: ['R-MK-07', 'R-MD-24'], definition: 'UTC at which our decoder received the frame (live runs only; none on a recording).', why: 'After the anchor the stream delay is computed from receive time and frame time; without this column drift cannot be followed.', status: 'not applied: proposal for the requirements session'}
  run_records:
  - {column: 'mode', type: 'enum (live, post_blind, post_anchored, pbp_only)', unit: 'n/a', field: 'pass', requirement: ['R-SR-13', 'R-MD-35'], definition: 'Mode of the run (config/live_state/core.yaml conventions.modes).', why: 'pass says whether play-by-play is read; mode says whether the run is causal. A live run and a post run of one pass are different runs (OQ-LS-16).', status: 'not applied: proposal for the requirements session'}
  - {column: 'pbp_source', type: 'enum (pbp_feed, pbp_final, none)', unit: 'n/a', field: 'pass', requirement: ['R-SR-13', 'R-SY-20'], definition: 'Which play-by-play the run read.', why: 'No-leakage checks must tell the live feed from the final file.', status: 'not applied: proposal for the requirements session'}
  scoreboard_ocr:
  - {column: 'known_at_utc', type: 'timestamp', unit: 'UTC', field: 'stamp_known_at_utc', requirement: ['R-MD-24'], definition: 'UTC at which the reading was in our hands.', why: 'R-MD-24: every row that can be revised carries its known time.', status: 'not applied: proposal for the requirements session'}
  score_events:
  - {column: 'known_at_utc', type: 'timestamp', unit: 'UTC', field: 'score_home', requirement: ['R-MD-24', 'R-MK-07'], definition: 'UTC at which the score event was first held (at any grade).', why: 'A live model may read a score only from its known time on.', status: 'not applied: proposal for the requirements session'}
  audio_seconds:
  - {column: 'audio_state', type: 'enum (game, masked, break, silent, unknown)', unit: 'n/a', field: 'audio_present', requirement: ['R-MM-03', 'R-AU-05'], definition: 'What the sound is in this second: game = arena sound; masked = sound present but a whistle could not be told; break = studio or advert; silent = no usable signal.', why: 'Health signal of the audio sensor: in a masked second a missing whistle means nothing.', status: 'not applied: proposal for the requirements session'}
  restarts:
  - {column: 'clock_start_trigger', type: 'enum (throw_in_touch, jump_ball_tap, missed_free_throw_touch, none)', unit: 'n/a', field: 'game_clock_running', requirement: ['R-SR-17'], definition: 'The legal trigger that starts the game clock after this restart.', why: 'R-SR-17 measures the clock start against its trigger; the trigger must be stored.', status: 'not applied: proposal for the requirements session'}
  - {column: 'clock_start_delay_s', type: 'float', unit: 's', field: 'game_clock_running', requirement: ['R-SR-17'], definition: 'First tick of the bug clock minus the trigger frame; above clock_start_flag_delay_s (1.0 s) it is a timing-mistake candidate.', why: 'R-SR-17 and flag type (g) of R-SB-01.', status: 'not applied: proposal for the requirements session'}
  timeouts:
  - {column: 'teams_return_video_ts_ms', type: 'int64', unit: 'ms', field: 'period_phase', requirement: ['R-SR-16'], definition: 'Video time at which the teams are back on the floor after an intermission or a timeout.', why: 'R-SR-16 stores each intermission with its start, end and the return of the teams.', status: 'not applied: proposal for the requirements session'}

# ---------------------------------------------------------------------------------------------------------------------
new_tables:
  tracking_quality_second:
    status: 'not applied: proposal for the requirements session'
    field: 'tracking_quality'
    requirement: ['R-DT-11', 'R-SR-07']
    grain: 'one row per game, pass, video second and player on the floor (or track, while identity is on HOLD)'
    primary_key: ['game_id', 'pass', 'video_id', 'second_index', 'subject_id']
    why: 'The 19 Oct page asks tracking quality per player per second; tracks.quality_mean is per track. Three parts are stored apart so a consumer gates on the part it needs.'
    columns:
    - {column: 'game_id', type: 'string', definition: 'game key'}
    - {column: 'pass', type: 'enum (blind, anchored)', definition: 'processing pass'}
    - {column: 'video_id', type: 'string', definition: 'video file'}
    - {column: 'second_index', type: 'int32', unit: 's', definition: 'video second'}
    - {column: 'subject_kind', type: 'enum (player, track)', definition: 'player when identity is locked, else the track'}
    - {column: 'subject_id', type: 'string', definition: 'player_id or track id'}
    - {column: 'observed_share', type: 'float', unit: 'share', definition: 'share of the frames of the second in which he was observed, 0 to 1'}
    - {column: 'sigma_m', type: 'float', unit: 'm', definition: 'position standard error over the second'}
    - {column: 'identity_state', type: 'enum (locked, HOLD, unknown)', definition: 'identity state over the second (identity pack)'}

# ---------------------------------------------------------------------------------------------------------------------
# Value lists that differ from the pack or from config/state_machine.yaml.
enum_changes:
- {id: 'EC-1', where: 'every dq column: state_frame.*_dq (11), state_second.*_dq (4), state_segments.dq, clock_map.dq, state_transitions.dq', change: 'add the values confirmed and unknown (ladder: confirmed, observed, inferred, carried, imputed, unknown; quarantined aside)', field: 'stamp_grade', requirement: ['R-SR-15'], why: 'Until then confirmed is written as observed and unknown as imputed. The second mapping is unsafe: a panel may show an imputed value as an estimate, and unknown is not an estimate.', status: 'not applied: proposal for the requirements session'}
- {id: 'EC-2', where: 'every src column: state_frame.*_src (11) and source, state_second.*_src (4) and source, state_segments.src, clock_map.src', change: 'replace (OCR, PBP, CV, manual, derived) by the sensor names of the pack: scorebug_ocr, pbp_feed, pbp_final, cv_tracking, cv_events, audio, registry, human, derived, rule', field: 'stamp_src', requirement: ['R-SR-15', 'R-MD-24'], why: 'PBP cannot tell the live feed from the final file, which every no-leakage check needs; there is no value for audio, the registry or a value set by a rule (dead reckoning, max dwell).', status: 'not applied: proposal for the requirements session'}
- {id: 'EC-3', where: 'state_frame.camera_shot_type, frames.camera_shot_type', change: 'add the value unknown; reverse_angle stays a separate flag', field: 'camera_shot_type', requirement: ['R-SR-10'], why: 'While the classifier is unsure the stricter reading applies for meta_unsure_max_s; after that the honest value is unknown, and the enum has none.', status: 'not applied: proposal for the requirements session'}
- {id: 'EC-4', where: 'timeouts.timeout_type', change: 'add the value intermission', field: 'period_phase', requirement: ['R-SR-16'], why: 'R-SR-16 stores each intermission as a stoppage row.', status: 'not applied: proposal for the requirements session'}
- {id: 'EC-5', where: 'state_frame.bonus_state (and the bonus columns per team)', change: 'values none, one_and_one, double_bonus; meaning = the bonus reached (count rule), not what the next foul would award', field: 'bonus_home', requirement: ['R-SR-03'], why: 'The schema enum says bonus where config/state_machine.yaml says one_and_one, and its dated note reads one foul ahead of the state-machine rule (OQ-LS-6).', status: 'not applied: proposal for the requirements session'}
- {id: 'EC-6', where: 'state_frame.try_in_flight', change: 'bool becomes enum (none, in_flight, ring_contact); ring_contact_this_try stays as a view of it', field: 'try_in_flight', requirement: ['R-SR-06'], why: 'The state-machine dimension has three values; the arena shot clock resets at ring contact, so the third value is needed.', status: 'not applied: proposal for the requirements session'}
- {id: 'EC-7', where: 'state_frame.stoppage_kind', change: 'values of the stoppage dimension: none, foul, violation, held_ball, timeout_team, timeout_media, review, challenge, injury, period_end, intermission', field: 'stoppage', requirement: ['R-SR-08', 'R-SR-04'], why: 'The column has six other values (team_timeout, media_timeout, review, injury, intermission, other_dead) and cannot hold a foul, a violation, a held ball, a challenge or a period end.', status: 'not applied: proposal for the requirements session'}
- {id: 'EC-8', where: 'state_frame.basket_attacked', change: 'add basket_attacked_home, enum (left, right) on the main camera; basket_attacked (north / south for the team in possession) stays as a view', field: 'basket_attacked_home', requirement: ['R-MD-22', 'R-FD-14'], why: 'The stored dimension is the basket of the home team, fixed for a half; the column follows the team in possession and flips at every change of possession.', status: 'not applied: proposal for the requirements session'}

definition_changes:
- {id: 'DC-1', where: 'state_second.foul_trouble_msu, state_second.foul_trouble_opp', field: 'foul_trouble', requirement: ['R-SR-20'], fix: 'Definition by K10: 2 fouls while the first half has run at most 900 s; 3 with more than 600 s left in half 2; 4 with 600 s or less left and in overtime. The 2 / 4 rule is a named view.', why: 'The text still describes the 2 / 4 rule; config/invariants.yaml holds K10 since 11 Nov.', status: 'not applied: proposal for the requirements session'}
- {id: 'DC-2', where: 'state_frame.team_in_possession, state_second.team_in_possession', field: 'possession_team', requirement: ['R-SR-05', 'R-SR-14'], fix: 'Once state_frame.team_control exists: define team_in_possession as possession (ends only when the other team gains control), not as team control.', why: 'Two values under one name; the named spots need control, the possession count needs possession.', status: 'not applied: proposal for the requirements session'}
- {id: 'DC-3', where: 'state_frame.court_visible_frac, frames.halfcourt_share_in_view', field: 'court_visible_frac', requirement: ['R-SR-10', 'R-VI-05'], fix: 'Say in both definitions that they are different shares (whole court against the attacked half court) and must not share a threshold.', why: 'A main wide frame of half-court play shows about half of the whole court and nearly all of the half court.', status: 'not applied: proposal for the requirements session'}

