  - {column: 'secs_margin_le_5', type: 'float', unit: 's', field: 'close_game_measure', requirement: ['R-MD-33'], definition: 'Game-clock seconds spent so far with the absolute margin at or under 5 points.', why: 'R-MD-33.', status: 'not applied: proposal for the requirements session'}
  - {column: 'secs_margin_le_6', type: 'float', unit: 's', field: 'close_game_measure', requirement: ['R-MD-33'], definition: 'Game-clock seconds spent so far with the absolute margin at or under 6 points.', why: 'R-MD-33.', status: 'not applied: proposal for the requirements session'}
