  - {column: 'confirmed_video_ms', type: 'int64', unit: 'ms', field: 'stamp_known_at_utc', requirement: ['R-SY-11', 'R-MD-24'], definition: 'Video time of the frame the fuser was at when the transition became confirmed.', why: 'As known_video_ms.', status: 'not applied: proposal for the requirements session'}
