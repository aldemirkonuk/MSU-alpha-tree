# Proposed schema changes of the live-game-state pack (baseline 4, 2026-11-20). PROPOSAL; do not treat as schema.
# Source of every entry: config/live_state/*.yaml (0.1.0). No file of schema/tables/ is edited. The requirements
# session approves; the schema owner merges. Every entry carries "not applied: proposal for the requirements session".
# Lint: python tools/specgen/live_state/lslib.py --check (every lands_in_proposed column of a field must be listed here,
# and none may already exist in schema/tables).
version: 0.1.0
status: proposed (not applied; proposal for the requirements session)
date: '2026-11-20'
owner: Mac session for Aldemir (baseline 4 of 8, label doc)
pack: config/live_state/ (core.yaml and the three fields files)
reading_order: [column_additions, new_tables, enum_changes, definition_changes, team_neutral]
design: >-
  The pack adds no new store. The stored truth stays state_transitions + state_segments + clock_map (K09); state_frame
  and state_second stay rebuilt views. What the spec needs and the schema lacks is of four kinds: (1) the age of every
  stamp group and the guaranteed clock interval, so a value is never read as fresher than it is; (2) known and
  confirmed times in video time and UTC, and the stream delay, so the as_of_known view can be rebuilt and joined to
  market prices; (3) the health signals the dropout rules read (degradation level, bug state, feed state, audio
  state); (4) columns for values the 19 Oct page and R-SR / R-MD rows name but no table holds. Home / away naming of
  existing columns is owned by schema/platform_changes.yaml (section team_neutral) and is not repeated here.
counts: {column_additions: 74, of_which_named_by_field_records: 73, tables_touched: 14, new_tables: 1, new_table_columns: 9, of_which_named_by_field_records_in_new_tables: 3, enum_changes: 8, definition_changes: 3}

# ---------------------------------------------------------------------------------------------------------------------
# field = the record of config/live_state/fields_*.yaml that needs the column. Licence of every column: computed by us.
column_additions:
  state_frame:
  - {column: 'state_version', type: 'string', unit: 'n/a', field: 'state_version', requirement: ['R-MD-21', 'R-SY-20'], definition: 'State version the row was rebuilt from: first 16 hex characters of the content hash, or open-<run_id>-<n> while a live run is still appending.', why: 'state_frame is a rebuilt view (K09); without the version a row cannot be traced to the transitions it came from.', status: 'not applied: proposal for the requirements session'}
  - {column: 'degradation_level', type: 'enum (D0_full, D1_bug_away, D2_off_main, D3_replay, D4_break, D5_no_video, unknown)', unit: 'n/a', field: 'degradation_level', requirement: ['R-SR-10'], definition: 'What the broadcast shows at this frame, as the level of config/live_state/core.yaml degradation_levels.', why: 'Every dropout rule reads this one value; a consumer gates on it instead of combining four meta columns.', status: 'not applied: proposal for the requirements session'}
  - {column: 'scorebug_state', type: 'enum (readable, unreadable, covered, absent, unknown)', unit: 'n/a', field: 'scorebug_visible', requirement: ['R-SR-10', 'R-VI-07'], definition: 'Why the bug can or cannot be read: readable (game clock accepted), unreadable (bug present, reading rejected), covered (a strap or graphic over it), absent.', why: 'The bool scorebug_visible cannot tell an OCR fault from a choice of the director; the health log needs the difference.', status: 'not applied: proposal for the requirements session'}
  - {column: 'period_phase', type: 'enum (pregame, period, intermission, final)', unit: 'n/a', field: 'period_phase', requirement: ['R-SR-16'], definition: 'Phase of the game at this frame (state-machine dimension period_phase).', why: 'The dimension has no column in the per-frame view; an intermission cannot be told from a dead ball inside a period.', status: 'not applied: proposal for the requirements session'}
  - {column: 'flow_state', type: 'enum (S0, S1, S2, S3, S4, S4a, S4b, S4c, S5, S6, S7, S8, S9, S10, S11)', unit: 'n/a', field: 'flow_state', requirement: ['R-MD-01', 'R-SR-05'], definition: 'Flow state of config/state_machine.yaml at this frame.', why: 'R-MD-01 lists the flow state in the state stamp of every frame; state_frame has no column for it (state_second.phase is the coarse view).', note: 'Not in a record''s lands_in_proposed; raised by the core audit of 11 Nov.', status: 'not applied: proposal for the requirements session'}
  - {column: 'team_control', type: 'enum (home, away, none)', unit: 'n/a', field: 'team_control', requirement: ['R-SR-14', 'R-MD-22'], definition: 'Team control by Rule 4-9.2 at this frame; none during a try in flight, a jump ball, the batting of a rebound and a dead ball before the thrower has the ball.', why: 'team_in_possession is defined as team control but named possession. Control picks the court frame of the named spots; possession (R-SR-05) is a different value and needs its own column.', status: 'not applied: proposal for the requirements session'}
  - {column: 'backcourt_count_s', type: 'float', unit: 's', field: 'backcourt_count_s', requirement: ['R-SR-18'], definition: 'Game-clock seconds the team in control has held the ball in its backcourt in the current count, 0 to 10; none when the ball is not in the backcourt.', why: 'R-SR-18 asks the count as state; no column holds it.', status: 'not applied: proposal for the requirements session'}
  - {column: 'game_clock_lo_s', type: 'float', unit: 's', field: 'game_clock_s', requirement: ['R-SR-01', 'R-SR-17'], definition: 'Lower end of the guaranteed interval of the game clock: last reading minus elapsed video time, floored at 0. Equal to game_clock_s while observed.', why: 'The clock cannot rise and cannot fall faster than real time, so the interval holds even when the estimate is only carried (replay: it held the true clock in 99.95 % of hidden seconds). Win probability reads it.', status: 'not applied: proposal for the requirements session'}
  - {column: 'game_clock_hi_s', type: 'float', unit: 's', field: 'game_clock_s', requirement: ['R-SR-01', 'R-SR-17'], definition: 'Upper end of the guaranteed interval of the game clock: the last reading.', why: 'As game_clock_lo_s.', status: 'not applied: proposal for the requirements session'}
  - {column: 'period_age_s', type: 'float', unit: 's', field: 'stamp_age_s', requirement: ['R-SR-15', 'R-MD-24'], definition: 'Seconds of video time since a healthy sensor last read the period or last watched for its change; none when never observed in the game.', why: 'The rule of the pack: a value is never shown as better than it is, so every stamp group carries its age beside src, conf and dq.', status: 'not applied: proposal for the requirements session'}
  - {column: 'game_clock_age_s', type: 'float', unit: 's', field: 'game_clock_s', requirement: ['R-SR-15', 'R-SR-01'], definition: 'Seconds of video time since a healthy sensor last read the game clock or last watched for its change; none when never observed in the game.', why: 'The game clock is trusted for about 3 s without a reading (measured); the age is what a consumer tests.', status: 'not applied: proposal for the requirements session'}
  - {column: 'shot_clock_age_s', type: 'float', unit: 's', field: 'shot_clock_s', requirement: ['R-SR-15', 'R-SR-01'], definition: 'Seconds of video time since a healthy sensor last read the shot clock or last watched for its change; none when never observed in the game.', why: 'The shot clock is trusted for 1 s without a reading (replay result); the age is what a consumer tests.', status: 'not applied: proposal for the requirements session'}
  - {column: 'live_ball_age_s', type: 'float', unit: 's', field: 'stamp_age_s', requirement: ['R-SR-15', 'R-MD-24'], definition: 'Seconds of video time since a healthy sensor last read the ball status (live or dead) or last watched for its change; none when never observed in the game.', why: 'The rule of the pack: a value is never shown as better than it is, so every stamp group carries its age beside src, conf and dq.', status: 'not applied: proposal for the requirements session'}
  - {column: 'score_age_s', type: 'float', unit: 's', field: 'stamp_age_s', requirement: ['R-SR-15', 'R-MD-24'], definition: 'Seconds of video time since a healthy sensor last read the score or last watched for its change; none when never observed in the game.', why: 'The rule of the pack: a value is never shown as better than it is, so every stamp group carries its age beside src, conf and dq.', status: 'not applied: proposal for the requirements session'}
  - {column: 'fouls_age_s', type: 'float', unit: 's', field: 'stamp_age_s', requirement: ['R-SR-15', 'R-MD-24'], definition: 'Seconds of video time since a healthy sensor last read the foul counts or last watched for its change; none when never observed in the game.', why: 'The rule of the pack: a value is never shown as better than it is, so every stamp group carries its age beside src, conf and dq.', status: 'not applied: proposal for the requirements session'}
  - {column: 'timeouts_age_s', type: 'float', unit: 's', field: 'stamp_age_s', requirement: ['R-SR-15', 'R-MD-24'], definition: 'Seconds of video time since a healthy sensor last read the timeout counts or last watched for its change; none when never observed in the game.', why: 'The rule of the pack: a value is never shown as better than it is, so every stamp group carries its age beside src, conf and dq.', status: 'not applied: proposal for the requirements session'}
  - {column: 'possession_age_s', type: 'float', unit: 's', field: 'possession_team', requirement: ['R-SR-15', 'R-SR-05'], definition: 'Seconds of video time since a healthy sensor last read the possession and control or last watched for its change; none when never observed in the game.', why: 'The rule of the pack: a value is never shown as better than it is, so every stamp group carries its age beside src, conf and dq.', status: 'not applied: proposal for the requirements session'}
  - {column: 'ball_age_s', type: 'float', unit: 's', field: 'stamp_age_s', requirement: ['R-SR-15', 'R-MD-24'], definition: 'Seconds of video time since a healthy sensor last read the ball position or last watched for its change; none when never observed in the game.', why: 'The rule of the pack: a value is never shown as better than it is, so every stamp group carries its age beside src, conf and dq.', status: 'not applied: proposal for the requirements session'}
  - {column: 'players_age_s', type: 'float', unit: 's', field: 'stamp_age_s', requirement: ['R-SR-15', 'R-MD-24'], definition: 'Seconds of video time since a healthy sensor last read the lineups and player positions or last watched for its change; none when never observed in the game.', why: 'The rule of the pack: a value is never shown as better than it is, so every stamp group carries its age beside src, conf and dq.', status: 'not applied: proposal for the requirements session'}
  - {column: 'broadcast_age_s', type: 'float', unit: 's', field: 'stamp_age_s', requirement: ['R-SR-15', 'R-MD-24'], definition: 'Seconds of video time since a healthy sensor last read the broadcast fields (shot type, bug, replay) or last watched for its change; none when never observed in the game.', why: 'The rule of the pack: a value is never shown as better than it is, so every stamp group carries its age beside src, conf and dq.', status: 'not applied: proposal for the requirements session'}
  state_second:
  - {column: 'state_version', type: 'string', unit: 'n/a', field: 'state_version', requirement: ['R-MD-21', 'R-SY-20'], definition: 'As state_frame.state_version.', why: 'As state_frame.state_version.', status: 'not applied: proposal for the requirements session'}
  - {column: 'degradation_level', type: 'enum (D0_full, D1_bug_away, D2_off_main, D3_replay, D4_break, D5_no_video, unknown)', unit: 'n/a', field: 'degradation_level', requirement: ['R-SR-10'], definition: 'The worst level held during the second.', why: 'As state_frame.degradation_level, at the grain the live panel and the models read.', status: 'not applied: proposal for the requirements session'}
  - {column: 'feed_stale', type: 'bool', unit: 'n/a', field: 'degradation_level', requirement: ['R-SR-10', 'R-SY-20'], definition: 'The feed_stale flag: no play-by-play row for feed_stale_after_s while the clock ran or a whistle was heard. Sits on top of any level.', why: 'Values that only the scorebook gives stop updating while it is on; a consumer must see that.', status: 'not applied: proposal for the requirements session'}
  - {column: 'feed_state', type: 'enum (healthy, suspect, stale, final, off)', unit: 'n/a', field: 'feed_heartbeat', requirement: ['R-SY-20', 'R-MD-24'], definition: 'Health of the play-by-play source: final = the post-game file is the source; off = a blind pass that reads no play-by-play.', why: 'Health signal of the pbp_feed sensor; no column holds it.', status: 'not applied: proposal for the requirements session'}
