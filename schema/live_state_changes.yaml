  owned_by: schema/platform_changes.yaml (team_neutral.audit and team_neutral.other_renames)
  requirement: [R-MD-22]
  rule: 'New columns of this file are home / away from the start (largest_lead_home, wp_home_live, scorebug_home_side). No column proposed here is relative to one programme.'
  fields_that_read_renamed_columns: 21
  renames_this_pack_reads:
    score_home: {'state_frame.score_msu': 'score_home', 'state_frame.score_opp': 'score_away', 'state_second.score_msu': 'score_home', 'state_second.score_opp': 'score_away'}
    score_away: {'state_frame.score_msu': 'score_home', 'state_frame.score_opp': 'score_away', 'state_second.score_msu': 'score_home', 'state_second.score_opp': 'score_away'}
    margin: {'state_frame.margin': 'margin_home', 'state_second.margin': 'margin_home', 'possessions.margin_start': 'margin_start_off'}
    current_run: {'state_second.run_msu_2min': 'run_home_2min', 'state_second.run_opp_2min': 'run_away_2min'}
    team_fouls_home: {'state_frame.team_fouls_msu': 'team_fouls_home', 'state_frame.team_fouls_opp': 'team_fouls_away', 'state_second.team_fouls_msu': 'team_fouls_home', 'state_second.team_fouls_opp': 'team_fouls_away'}
    team_fouls_away: {'state_frame.team_fouls_msu': 'team_fouls_home', 'state_frame.team_fouls_opp': 'team_fouls_away', 'state_second.team_fouls_msu': 'team_fouls_home', 'state_second.team_fouls_opp': 'team_fouls_away'}
    bonus_home: {'state_frame.msu_bonus_state': 'bonus_home', 'state_frame.opp_bonus_state': 'bonus_away', 'state_second.msu_bonus_state': 'bonus_home', 'state_second.opp_bonus_state': 'bonus_away'}
    bonus_away: {'state_frame.msu_bonus_state': 'bonus_home', 'state_frame.opp_bonus_state': 'bonus_away', 'state_second.msu_bonus_state': 'bonus_home', 'state_second.opp_bonus_state': 'bonus_away'}
    foul_trouble: {'state_second.foul_trouble_msu': 'foul_trouble_home', 'state_second.foul_trouble_opp': 'foul_trouble_away'}
    fouls_to_give: {'state_second.fouls_to_give_msu': 'fouls_to_give_home', 'state_second.fouls_to_give_opp': 'fouls_to_give_away'}
    timeouts_left_home: {'state_frame.timeouts_msu': 'timeouts_left_home', 'state_frame.timeouts_opp': 'timeouts_left_away', 'state_frame.to30_left_msu': 'to30_left_home', 'state_frame.to60_left_msu': 'to60_left_home', 'state_frame.to75_left_msu': 'to75_left_home', 'state_frame.to30_left_opp': 'to30_left_away', 'state_frame.to60_left_opp': 'to60_left_away', 'state_frame.to75_left_opp': 'to75_left_away', 'state_second.timeouts_msu': 'timeouts_left_home', 'state_second.timeouts_opp': 'timeouts_left_away', 'timeouts.left_after_msu': 'left_after_home', 'timeouts.left_after_opp': 'left_after_away'}
    timeouts_left_away: {'state_frame.timeouts_msu': 'timeouts_left_home', 'state_frame.timeouts_opp': 'timeouts_left_away', 'state_frame.to30_left_msu': 'to30_left_home', 'state_frame.to60_left_msu': 'to60_left_home', 'state_frame.to75_left_msu': 'to75_left_home', 'state_frame.to30_left_opp': 'to30_left_away', 'state_frame.to60_left_opp': 'to60_left_away', 'state_frame.to75_left_opp': 'to75_left_away', 'state_second.timeouts_msu': 'timeouts_left_home', 'state_second.timeouts_opp': 'timeouts_left_away', 'timeouts.left_after_msu': 'left_after_home', 'timeouts.left_after_opp': 'left_after_away'}
    challenge_available_home: {'state_frame.challenge_available_msu': 'challenge_available_home', 'state_frame.challenge_available_opp': 'challenge_available_away'}
