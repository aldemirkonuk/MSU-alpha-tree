# R-MD-22 (was N-MD-02): stored state is home / away. The renames are owned by schema/platform_changes.yaml; this block
# lists, per field of this pack, the columns it reads today and the name each takes there. When that change set is
# applied, core.yaml inventory.columns and the lands_in lists of the records follow (follow-up FU-LS-01).
