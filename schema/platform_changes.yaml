      - {column: set_at_utc, type: timestamp, definition: 'When the pointer moved.'}
      - {column: known_from_utc, type: timestamp, definition: 'Record time of the data behind the output: the largest known_at_utc of the pulls it descends from.'}
      - {column: reason, type: 'enum (first_build, pbp_correction, config_change, code_change, review_edit, rollback)', definition: 'Why the pointer moved.'}
      - {column: set_by_run_id, type: string, definition: 'The run that moved it.'}
  game_gate_results:
