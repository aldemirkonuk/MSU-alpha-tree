# ---------------------------------------------------------------------------------------------------------------------
# Views of the query layer. layer: base (current files of one table), grain (neutral), team_keyed (one row per team
# with opp_ columns, relative to the row's team), focus (takes focus_team_id; no default), catalogue.
views:
  v_event:
    status: 'not applied: proposal for the requirements session'
    layer: grain
    grain: event
    reads: [events, games]
    columns: [game_id, event_id, period, game_clock_s, order_index, side, team_id, event_type_code, player_id_1, player_id_2, score_value, scoring_play, home_score_after, away_score_after, possession_key, chance_key, pass, state_version, known_at_utc]
  v_possession:
    status: 'not applied: proposal for the requirements session'
    layer: grain
    grain: possession
    reads: [possessions, games]
    columns: [game_id, possession_key, possession_num, team_id, defense_team_id, side, start_period, start_game_clock_s, end_period, end_game_clock_s, duration_s, points, n_chances, n_oreb, end_type, pass, state_version, known_at_utc]
  v_chance:
    status: 'not applied: proposal for the requirements session'
    layer: grain
    grain: chance
    reads: [chances, games]
    columns: [game_id, chance_key, possession_key, chance_number, team_id, side, start_period, start_game_clock_s, end_period, end_game_clock_s, time_used_s, end_type, points, pass, state_version, known_at_utc]
  v_lineup_stint:
    status: 'not applied: proposal for the requirements session'
    layer: grain
    grain: lineup_stint
    reads: [lineup_stints, games]
    columns: [game_id, stint_key, stint_num, team_id, side, lineup_key, player_ids, start_period, start_game_clock_s, end_period, end_game_clock_s, duration_s, off_possessions, def_possessions, points_for, points_against, lineup_status, pass, state_version, known_at_utc]
  v_player_game:
    status: 'not applied: proposal for the requirements session'
    layer: grain
    grain: player_game
    reads: [player_box, player_game_pbp, games]
    columns: [game_id, team_id, player_id, side, site, box_source, minutes, points, fgm, fga, fg3m, fg3a, ftm, fta, oreb, dreb, ast, stl, blk, tov, pf, pass, known_at_utc]
  v_team_game:
    status: 'not applied: proposal for the requirements session'
    layer: team_keyed
    grain: team_game
    reads: [team_box, team_game_pbp, games]
    columns: [game_id, team_id, side, site, opp_team_id, box_source, win, game_minutes, possessions, opp_possessions, points, opp_points, points_h1, points_h2, fgm, fga, fg3m, fg3a, ftm, fta, oreb, dreb, ast, stl, blk, tov, team_tov, pf, largest_lead, opp_fgm, opp_fga, opp_fg3m, opp_fg3a, opp_ftm, opp_fta, opp_oreb, opp_dreb, opp_ast, opp_stl, opp_blk, opp_tov, opp_pf, pass, known_at_utc]
  v_game:
    status: 'not applied: proposal for the requirements session'
    layer: grain
    grain: game
    reads: [games, game_gate_results]
    columns: [game_id, season, home_team_id, away_team_id, neutral_site, home_away_source, home_score, away_score, overtime_periods, pbp_status, lineup_status, state_version, known_at_utc]
  v_team_season:
    status: 'not applied: proposal for the requirements session'
    layer: team_keyed
    grain: team_season
    reads: [v_team_game]
    columns: [season, team_id, games, wins, game_minutes, possessions, opp_possessions, points, opp_points, fgm, fga, fg3m, fg3a, ftm, fta, oreb, dreb, ast, stl, blk, tov, pf, opp_fgm, opp_fga, opp_fg3m, opp_fg3a, opp_ftm, opp_fta, opp_oreb, opp_dreb, opp_tov]
  v_player_season:
    status: 'not applied: proposal for the requirements session'
    layer: grain
    grain: player_season
    reads: [v_player_game]
    columns: [season, team_id, player_id, games, minutes, points, fgm, fga, fg3m, fg3a, ftm, fta, oreb, dreb, ast, stl, blk, tov, pf]
  v_second:
    status: 'not applied: proposal for the requirements session (defined now, served when state_second is built)'
    layer: grain
    grain: second
    reads: [state_second, games]
    columns: [game_id, period, game_clock_s, score_home, score_away, margin_home, team_in_possession, team_fouls_home, team_fouls_away, bonus_home, bonus_away, timeouts_left_home, timeouts_left_away, pass, state_version, known_at_utc]
  v_frame:
    status: 'not applied: proposal for the requirements session (defined now, served when state_frame is built)'
    layer: grain
    grain: frame
    reads: [state_frame, games]
    columns: [game_id, video_id, frame_index, period, game_clock_s, score_home, score_away, margin_home, team_in_possession, lineup_home, lineup_away, pass, state_version]
  focus_game:
    status: 'not applied: proposal for the requirements session'
    layer: focus
    grain: game
    parameters: [focus_team_id]
    default_focus: none
    reads: [v_game]
    columns: [game_id, focus_team_id, other_team_id, side_focus, site_focus, score_focus, score_other, margin_focus, win_focus]
  focus_second:
    status: 'not applied: proposal for the requirements session (defined now, served when state_second is built)'
    layer: focus
    grain: second
    parameters: [focus_team_id]
    default_focus: none
    reads: [v_second, v_game]
    columns: [game_id, period, game_clock_s, score_focus, score_other, margin_focus, ball_focus, team_fouls_focus, team_fouls_other, bonus_focus, bonus_other, timeouts_left_focus, timeouts_left_other]
  focus_possession:
    status: 'not applied: proposal for the requirements session'
    layer: focus
    grain: possession
    parameters: [focus_team_id]
    default_focus: none
    reads: [v_possession, v_game]
    columns: [game_id, possession_key, possession_num, ball_focus, points, margin_start_focus, duration_s]
  v_lineage:
    status: 'not applied: proposal for the requirements session'
    layer: catalogue
    grain: one row per (table, output partition)
    reads: [stage_outputs, stage_runs, current_pointers]
    columns: [table_name, output_key, stage, game_id, pass, code_version, config_hash, first_run_id, rows, content_hash, file_sha256, is_current, known_from_utc]
  v_version_timeline:
    status: 'not applied: proposal for the requirements session'
    layer: catalogue
    grain: one row per (game, play-by-play version, interval of record time in which it was current)
    reads: [pbp_version_pulls, pbp_versions]
    columns: [source, game_id, pbp_version_id, current_from_utc, current_to_utc, first_pull_id, n_plays]

# ---------------------------------------------------------------------------------------------------------------------
# Proposals for files this baseline may not edit. Each is a proposal for its owner; nothing here was applied.
harness_proposals:
  - id: HP-1
    file: tools/state/k09_fold.py (function lineups)
    status: 'not applied: proposal for the requirements session'
    fault: 'On-floor players are split by the team NAME of each entry; any label that is not the home name goes to the away side. Measured: one held game (P03) carries a label equal to neither team name on 4,040 entries; the mirror test fails on 8 lineup cells there and nowhere else.'
    change: 'Split by team id: build the map {team label -> side} from the same pull''s rows that carry both a team label and a home flag (ALG-TN-2). A label outside the map is break LIN-01 and the player is left out. Never a default side.'
    class: spec_fault
  - id: HP-2
    file: tools/state/k09_fold.py (function run_game)
    status: 'not applied: proposal for the requirements session'
    fault: 'The side of the focus programme is set from a literal team name. It is used only by the scorebug comparison.'
    change: 'Take focus_side (home, away or none) as an argument; a fold run needs none.'
    class: spec_fault
  - id: HP-3
    file: tools/state/k09_fold.py (functions emit and finalise_ids), schema/tables/state_transitions.yaml
    status: 'not applied: proposal for the requirements session'
    fault: 'transition_id is made from the order index inside the second and from the source''s surrogate row id. A row inserted in a second renumbers the later transitions of that second; a re-ingest at the source may change the surrogate id.'
    change: 'transition_id from (game, pass, trigger event id, ttype, k) with the trigger event id built from the source''s own play id (cross_item.ids.transition_id). order_index stays a stored ordinal.'
    class: spec_fault
  - id: HP-4
    file: private scorebug sample files read by ocr_vs_fold
    status: 'not applied: proposal for the requirements session'
    fault: 'The samples name their columns for one programme.'
    change: 'left / right in the samples; mapped through the bug template of the game.'
    class: label_fault
state_machine_proposals:
  - id: SP-1
    file: config/state_machine.yaml (pbp_mapping.lineups)
    status: 'not applied: proposal for the requirements session'
    change: 'State the side rule of ALG-TN-2 and add integrity rule LIN-01 (an on-floor label that matches neither side is a break; the player is left out).'
