      - {column: fga, type: int16, definition: 'Field goal attempts.'}
      - {column: fg3m, type: int16, definition: 'Three-point field goals made.'}
      - {column: fg3a, type: int16, definition: 'Three-point attempts.'}
      - {column: ftm, type: int16, definition: 'Free throws made.'}
      - {column: fta, type: int16, definition: 'Free throw attempts.'}
