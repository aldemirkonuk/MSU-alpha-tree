      - {column: bytes, type: int64, definition: 'Size of the Parquet file.'}
      - {column: content_hash, type: string, definition: 'sha256 of the canonical JSON of the rows, sorted by the table''s sort key.'}
      - {column: file_sha256, type: string, definition: 'sha256 of the Parquet file.'}
      - {column: schema_version, type: string, definition: 'Schema version of the table (semver).'}
      - {column: first_run_id, type: string, definition: 'The run that wrote the partition.'}
      - {column: created_utc, type: timestamp, definition: 'When the partition was written.'}
  current_pointers:
    status: 'not applied: proposal for the requirements session'
