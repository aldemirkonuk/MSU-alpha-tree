      - {column: breaks_label_fault, type: int32, definition: 'Breaks of class label_fault.'}
      - {column: breaks_lineup, type: int32, definition: 'Lineup breaks.'}
      - {column: unknown_floor_labels, type: int32, definition: 'On-floor entries whose team label matches neither side (LIN-01).'}
