  decision_points:
  - decision_point: Push or pull back after a change of control
    decider: ball handler, team rule
    window: 0-3 s after the secure
    requirements:
    - N-DF-05
    - R-TR-16
    - R-TR-24
    - R-TR-26
  - decision_point: Inbound fast after a make; press or not
    decider: inbounder, defensive coach
    window: 0-3 s after the net; pre-planned
    requirements:
    - N-DF-02
    - R-DF-12
    - R-DF-18
    - R-TR-21
    - R-TR-23
  - decision_point: Set call
    decider: coach or point guard
    window: dead ball or half-court crossing
    requirements:
    - N-MD-11
    - R-ST-05
    - R-ST-07
  - decision_point: Ball-screen coverage and handler read
    decider: X-big, X-ball; handler
    window: t0 - 1.0 s to t0 + 2.0 s
    requirements:
    - N-DF-06
    - N-ST-07
    - R-DF-06
    - R-DF-16
    - R-ST-17
    - R-ST-20
  - decision_point: 'Catch: shoot, pass, drive, hold'
    decider: receiver
    window: 0.2-3 s per touch
    requirements:
    - N-MD-12
    - R-CO-01
    - R-VL-05
  - decision_point: Help or stay on a drive or skip
    decider: help defender, low man
    window: 0.2-1.5 s after the trigger (calibrate)
    requirements:
    - R-CO-02
    - R-DF-08
    - R-EV-06
  - decision_point: Double the post
    decider: defensive plan
    window: 0-1.5 s after the post catch
    requirements:
    - N-DF-08
    - R-DF-07
  - decision_point: Crash or get back at the release
    decider: all 10 players
    window: at release to rim contact
    requirements:
    - N-EV-04
    - N-VL-02
    - R-EV-08
  - decision_point: Foul or not late (take foul, foul up 3, foul to extend)
    decider: defender, coach
    window: last 60 s
    requirements:
    - R-PE-07
    - R-SR-11
    - R-TR-25
  - decision_point: Timeout or challenge
    decider: head coach
    window: any dead ball; live in the last 2:00
    requirements:
    - N-CC-02
    - R-CC-02
    - R-EV-16
  - decision_point: Substitution, foul-trouble sit
    decider: head coach
    window: next dead ball
    requirements:
    - N-CC-01
    - N-SY-06
    - R-CC-03
  - decision_point: Scheme change (zone, press, switch)
    decider: defensive coach
    window: next dead ball, 1-3 possessions after the trigger
    requirements:
    - N-CH-02
    - N-DF-04
    - N-HY-01
    - N-ST-08
    - R-DF-19
  - decision_point: 'End of clock: hold, two-for-one, last shot'
    decider: coach, handler
    window: 33-45 s window; SC <= 7 s
    requirements:
    - N-ST-09
    - R-PE-07
    - R-SR-11
  - decision_point: Whistle or play on
    decider: calling official
    window: contact to whistle < 1 s (unverified)
    requirements:
    - N-RF-09
    - N-RF-12
    - R-DT-12
