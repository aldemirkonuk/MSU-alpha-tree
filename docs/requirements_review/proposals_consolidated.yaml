conflicts:
- id: K01
  title: Physical limits for speed and acceleration
  affected_ids:
  - R-DQ-02
  - R-DT-08
  - R-EN-03
  - R-IV-13
  views:
  - who: live doc
    view: speed <= 10 m/s (R-DQ-02, R-EN-03); speed <= 10 m/s and acceleration <= 12 m/s² frame to frame (R-IV-13); R-DT-08 flags > 10 m/s²
  - who: data engineer
    view: 10 m/s over >= 0.3 s windows and 12 m/s² over >= 0.5 s windows on filtered tracks; flags, not quarantines; frame-to-frame limits fire on noise
  - who: team data scientist
    view: 9.0 m/s and 8.0 m/s² over >= 0.2 s windows from one shared key; D-I peaks are 6.2-7.0 m/s, so 10 m/s lets identity swaps through
  - who: quality review
    view: one limit in config (R-EN-06); R-DT-08 and R-IV-13 disagree
  recommended_resolution: 'One key physics.* in config read by R-DQ-02, R-IV-13, R-EN-03 and R-DT-08: hard speed limit 10.0 m/s over >= 0.3 s windows (break); soft speed limit 9.0 m/s (review flag for identity
    swaps); acceleration 12 m/s² over >= 0.5 s windows (flag only), tightened to 8.0 m/s² once measured acceleration sigma <= 1.0 m/s²; court bounds + 1.0 m in the same key.'
  reason: At sigma 0.3-0.5 m a 0.2-0.5 s window gives speed noise 0.5-0.9 m/s and acceleration noise 8-14 m/s² (engineer section 3.3), so 9.0 m/s / 8.0 m/s² on short windows would fire on true 7 m/s sprints;
    the soft flag keeps the scientist's identity-swap check without false breaks.
  decision: 'Approve physics key: speed 10.0 m/s hard + 9.0 m/s soft flag (>= 0.3 s windows), acceleration 12 m/s² over >= 0.5 s, to 8.0 m/s² after sigma <= 1.0 m/s²?'
- id: K02
  title: Scorebug make-detection window
  affected_ids:
  - N-SY-04
  - R-SB-03
  - R-SY-01
  views:
  - who: live doc
    view: window starts at 15 s, reset from measured lag
  - who: data engineer
    view: start 4 s (measured 1.50-2.60 s, n = 10), re-estimated per game and per field
  - who: ESPN analyst
    view: start 5 s, then per game p99 + 1 s
  - who: team data scientist
    view: start 4.0 s, then p99 + 0.5 s
  recommended_resolution: Start 4.0 s; after each game re-set per field to p99 + 1.0 s, bounded to [3.0, 15] s; lag-corrected times feed state (new-SY-E4).
  reason: 15 s is six times the measured maximum and pairs the wrong basket in fast exchanges; with only n = 10 measured lags the larger +1.0 s margin is safer than +0.5 s.
  decision: Set the scorebug window to 4.0 s initial, then per-field p99 + 1.0 s (3-15 s bounds)?
- id: K03
  title: Acceleration bands and onsets vs the broadcast noise floor
  affected_ids:
  - N-PL-01
  - N-RF-14
  - R-CO-02
  - R-DT-08
  - R-PC-05
  - R-PL-02
  - R-PL-03
  - R-PL-12
  views:
  - who: live doc
    view: bands +/- 2.0 / +/- 3.0 m/s² (R-PL-12), 2.5 m/s² (R-PL-02), onset at 1 m/s² change (R-CO-02), jerk (R-DT-08)
  - who: data engineer
    view: at the R-PL-13 target sigma 0.5 m acceleration noise is 14 m/s² (0.5 s window) or 2.3 m/s² (1.0 s); report bands only where sigma <= 0.5 m/s²; onset by change-point; no jerk
  - who: team data scientist
    view: acceleration over >= 0.2 s windows; jerk not computed; reaction times only as distributions with n >= 50
  - who: ESPN analyst
    view: broadcast cannot give reliable accelerations above about 3 m/s²; contact candidates use deceleration >= 3 m/s² (review only)
  - who: quality review
    view: acceleration and jerk need their own gate (load_thresholds.md sec. 1.6, RMSE up to 4.17 m/s²)
  recommended_resolution: 'Keep the sourced bands but gate them: acceleration computed over >= 0.5 s windows with propagated sigma; band counts and accelerations reported only where sigma <= 0.5 m/s², else
    "unresolved" (counted); onsets by change-point on velocity; no jerk; the 0.2 s window is not used for acceleration; new-RF-A15 deceleration trigger only where resolvable.'
  reason: A band that the measurement cannot resolve produces confident noise; the gate keeps the requirement and makes the resolvable share itself a reported number.
  decision: Adopt the resolvability gate (sigma <= 0.5 m/s², >= 0.5 s windows, change-point onsets, no jerk)?
- id: K04
  title: Ball-screen coverage granularity (4 coarse vs 13 fine)
  affected_ids:
  - N-DF-06
  - R-DF-06
  - R-DF-16
  views:
  - who: live doc
    view: 'R-DF-06: the 13 taxonomy coverages; R-DF-16: two levels, coarse >= 90%, fine >= 80%'
  - who: ESPN analyst
    view: publish the 4 coarse classes; fine only at confidence >= 0.8; coarse >= 85%, fine >= 70% on 200 screens
  - who: team data scientist
    view: coarse always; fine only after the fine classifier passes >= 75% on >= 300 screens from >= 5 games (NBA reference used 4 classes on full tracking)
  - who: quality review
    view: R-DF-16 is the keeper; R-DF-06 cites it
  recommended_resolution: Store both levels; coarse always (>= 85% on >= 200 screens from >= 5 games at first release, rising to R-DF-16's 90% by season end); fine stored only after the fine gate (>= 75%,
    >= 300 screens, >= 5 games) and published only per screen at confidence >= 0.8.
  reason: 'The two gates are complementary: the scientist''s is a model-level validation, the analyst''s a per-screen display rule; a hedge called a drop on air is the costliest error.'
  decision: 'Approve coverage gates: coarse 85% then 90%; fine 75% on 300 screens/5 games; publish fine only at confidence >= 0.8?'
- id: K05
  title: Run definitions
  affected_ids:
  - N-EV-05
  - R-CC-02
  - R-CH-08
  - R-EV-13
  - R-MD-17
  views:
  - who: live doc
    view: R-MD-17 "current run (points in the last 2 min each team)"; R-EV-13 "runs over 2, 4 and 6 min"
  - who: ESPN analyst
    view: 'three definitions never merged: unanswered; broadcast "a-b" shown at net >= 6; register net >= 8 in 120 s'
  - who: data engineer, team data scientist
    view: register definition net >= 8 in a rolling 120 s (beliefs register B1/B2)
  - who: ontology audit / gap closures
    view: 'register plus strict unanswered >= 8-0; open question: which is primary'
  recommended_resolution: Three named definitions in config (unanswered, broadcast a-b, register), never merged; register is primary for hypotheses; broadcast display threshold default net >= 8 (6 kept
    as a config alternative); the 2/4/6-min net points stay numeric features, not "runs".
  reason: One word must have one definition per use; the register definition is the one the evidence (B1/B2) uses; >= 8 for display avoids calling 6-0 stretches "runs" and matches the register threshold.
  decision: Primary run = register (net >= 8 in 120 s); broadcast display threshold 8 or 6?
- id: K06
  title: Clutch and late-game window
  affected_ids:
  - R-CO-04
  - R-MD-13
  - R-PR-11
  - R-RR-03
  views:
  - who: live doc
    view: R-MD-13 clutch = <= 5 min left and margin <= 5; R-CO-04 = last 4 min and margin <= 5
  - who: ESPN analyst
    view: one config clutch (<= 300 s, margin <= 5); last 240 s used for WP calibration and failure slices
  - who: team data scientist
    view: shrink pressure performance; no window preference
  - who: quality review
    view: one clutch definition in config
  recommended_resolution: 'One clutch key: <= 300 s left in the second half or any extra period and margin <= 5 points; a separately named late_240 flag (last 240 s, the under-4 media segment) for slices
    and WP calibration; no third definition.'
  reason: Two different "clutch" numbers for the same player would be published otherwise; 300 s / 5 points is the common public definition, 240 s is a broadcast segment, not clutch.
  decision: Clutch = <= 300 s and margin <= 5 (late_240 kept as a separate flag)?
- id: K07
  title: Made-basket frame tolerance at 29.97 fps
  affected_ids:
  - R-BL-04
  - R-MB-04
  views:
  - who: live doc
    view: +/- 3 frames (+/- 0.05 s at 60 fps)
  - who: data engineer, ESPN analyst
    view: +/- 2 frames at 29.97 fps (+/- 0.067 s); +/- 3 at 60 fps
  - who: team data scientist
    view: +/- 1 frame at the file rate
  - who: quality review
    view: needs a share of makes
  recommended_resolution: +/- 2 frames on >= 95% of makes, +/- 1 frame on >= 80% as a stretch; tolerances in frames at the file's rate; event times (R-BL-04) +/- 2 frames on >= 90% of 300 labels per type.
  reason: The hand label itself is +/- 1 frame (made_basket_lag.md), so +/- 1 frame for every make cannot be verified; 1080p60 does not exist for the pilot footage.
  decision: Make frame +/- 2 frames on 95% (and +/- 1 frame on 80% as stretch)?
- id: K08
  title: Chance boundaries and terminal events
  affected_ids:
  - R-DQ-06
  - R-MD-04
  - R-MD-06
  - R-SY-05
  views:
  - who: live doc
    view: R-DQ-06 "rebounds + turnovers close every chance"; R-SY-05 end types shot, foul drawn, reset, turnover; R-MD-06 shot-clock start value per chance
  - who: quality review
    view: terminal list incl. foul or kicked-ball reset and period end
  - who: data engineer
    view: terminal list incl. foul with FTs or throw-in, held ball, period end
  - who: ESPN analyst
    view: made FG, final FT, turnover, defensive rebound incl. team and dead-ball rebounds
  recommended_resolution: 'A chance is one shot-clock run inside a possession: a new chance starts after an offensive rebound off the ring and after any shot-clock reset inside the possession (defensive
    foul or kicked ball, max(20, left)); terminal list as R-DQ-06c (made FG with and-one closing after the FT, last FT made, defensive rebound incl. team and dead-ball rebounds, turnover, offensive rebound,
    shot-clock reset, held ball, period end).'
  reason: R-MD-06 already defines the start value per chance, which only works if resets open chances; team and dead-ball rebounds are where possession counts drift from the box.
  decision: 'Confirm: a shot-clock reset inside a possession (defensive foul, kicked ball) opens a new chance?'
- id: K09
  title: Where game state is stored (per frame vs segments) and the flow state
  affected_ids:
  - N-MD-01
  - N-SY-01
  - R-MD-01
  - R-SR-06
  views:
  - who: live doc
    view: every frame and row carries all global metadata fields (R-MD-01); state_frame stamps 102 columns per frame
  - who: data engineer
    view: state_segments with validity intervals; per-frame and per-second state as views; typed transitions
  - who: ESPN analyst
    view: one flow_state per frame (S0-S11) with allowed transitions
  recommended_resolution: Store state once as state_segments per dimension, opened by typed transitions (state_transitions, config/state_machine.yaml); flow_state is one dimension; state_frame and the per-row
    global stamp become as-of views.
  reason: About 1,000 segment rows replace 155,000 x 102 copied cells per game per pass; a correction is made in one place; the analyst still gets flow_state per frame through the view.
  decision: Approve state_segments + state_transitions as stored truth, state_frame as a view?
- id: K10
  title: Foul-trouble thresholds
  affected_ids:
  - N-CC-01
  - N-DF-03
  - R-MD-16
  - R-SR-11
  views:
  - who: live doc
    view: 'R-SR-11: 2 in the first half, 4 in the second; R-MD-16: no cut-offs'
  - who: ESPN analyst
    view: 2 in H1; 3 with > 600 s left in H2; 4 in H2/OT
  - who: team data scientist
    view: 2 in H1, 4 in H2
  - who: quality review
    view: one config table
  recommended_resolution: One config table; default 2 (H1) / 3 (H2 with > 600 s left) / 4 (H2 <= 600 s and OT); the 2/4 rule kept as a named alternative so both can be reported.
  reason: The three-tier rule matches how benches talk about a third foul early in the second half; keeping 2/4 as a named view preserves comparability.
  decision: Foul-trouble default 2/3/4 (analyst) or 2/4, or a coach-supplied MSU rule?
- id: K11
  title: Shot quality with or without the shooter
  affected_ids:
  - N-VL-01
  - R-VL-04
  views:
  - who: ESPN analyst
    view: xPts from location, contest, type and shooter prior; calibrated within 0.02 points per shot
  - who: team data scientist
    view: shooter-agnostic (league-average D-I shooter), layered location-only and contest-aware
  - who: gap closures
    view: shot-making residual = points minus xPts
  recommended_resolution: 'Store both: shooter-agnostic xFG/xPts (shot quality, base of the shot-making residual) and shooter-adjusted xPts (prediction); both calibration criteria apply.'
  reason: Shot-making cannot be separated from shot quality if the shooter is inside the quality model; prediction still needs the shooter.
  decision: Approve two stored shot-quality versions (agnostic for quality, adjusted for prediction)?
- id: K12
  title: Minimum n before a player tendency is shown
  affected_ids:
  - N-PC-02
  - N-VA-04
  - R-PC-11
  views:
  - who: quality review
    view: cells with n < 30 descriptive only
  - who: ESPN analyst
    view: display suppresses n < 20 events
  - who: team data scientist
    view: reliability study gives the n where split-half reliability reaches 0.70 (n70); hide below
  recommended_resolution: Use n70 from the reliability study per metric once it exists; until then n >= 30.
  reason: A data-driven threshold per metric beats one number; 30 is the more conservative of the two fixed values while n70 is unknown.
  decision: 'Display threshold: n70 per metric, n >= 30 until measured?'
- id: K13
  title: Coverage threshold for load (60% vs 70%)
  affected_ids:
  - N-PL-04
  - R-PC-05
  - R-PL-05
  - R-PL-14
  views:
  - who: live doc
    view: flag at 60% (R-PL-05) vs exclusion at 70% (R-PL-14)
  - who: team data scientist
    view: '>= 70% on-camera time for the athletic block'
  - who: gap closures
    view: '>= 70% pose coverage for direction-weighted load'
  recommended_resolution: One config key, default 0.70, read by R-PL-05, R-PL-14, R-PC-05 and new-PL-7.
  reason: Two thresholds for the same coverage produce rows that are flagged but still summarised.
  decision: Single coverage key at 0.70?
- id: K14
  title: 'Possession type: exclusive labels vs multi-label flags'
  affected_ids:
  - R-SY-04
  views:
  - who: quality review
    view: 'two exclusive labels: tempo class and start type'
  - who: ESPN analyst
    view: multi-label flags (ATO and SLOB at once), plus after media timeout, end of period, shot clock off
  recommended_resolution: 'Three label sets: tempo class (exclusive), start type (exclusive) and situation flags (multi-label).'
  reason: Both are right for different questions; an ATO SLOB possession needs two flags, while PPP by start type needs exclusive labels.
  decision: Approve tempo + start type (exclusive) + situation flags (multi-label)?
- id: K15
  title: Off-screen estimates per frame vs 10 Hz
  affected_ids:
  - R-DT-07
  views:
  - who: live doc
    view: per missing player per frame
  - who: data engineer
    view: 10 Hz, per-frame imputation triples the largest table for no information
  - who: team data scientist
    view: coverage of the 95% region 90-98%; used only through a flag
  recommended_resolution: Store at 10 Hz with a calibrated 95% region and an is_imputed flag.
  reason: Per-frame imputation adds rows, not information; calibration is what makes the estimate usable.
  decision: Off-screen estimates at 10 Hz (not per frame)?
- id: K16
  title: Reaction onset method and tolerance
  affected_ids:
  - N-DF-05
  - R-CO-02
  - R-EV-06
  views:
  - who: live doc
    view: onset at an acceleration change > 1 m/s²
  - who: quality review
    view: +/- 80 ms on >= 80% of 200 events, after the acceleration gate
  - who: data engineer
    view: change-point on velocity, +/- 0.10 s on >= 80% of 100 labels; 1 m/s² is below the noise floor
  - who: team data scientist
    view: distributions with n >= 50; effective resolution 0.10-0.15 s
  - who: ESPN analyst
    view: get-back onset = velocity toward own rim > 2.0 m/s (new-DF-A8)
  recommended_resolution: Change-point onset on velocity; tolerance +/- 0.10 s (3 frames) on >= 80% of 100 labels; per-player values only as distributions with n >= 50; velocity thresholds (2.0 m/s) are
    allowed because speed is resolvable.
  reason: +/- 80 ms is finer than one frame plus filter delay at 29.97 fps; velocity is measurable where acceleration is not.
  decision: Reaction onset by change-point, +/- 0.10 s on 80% of 100 labels?
- id: K17
  title: Drift check timing
  affected_ids:
  - N-VA-05
  - R-DQ-08
  views:
  - who: quality review
    view: PSI > 0.25 with 10 quantile bins from now
  - who: data engineer
    view: PSI on one or two games is noise; verdict only from game 11
  - who: team data scientist
    view: model monitoring alerts at rolling 10-game ECE > 0.05 or PSI > 0.25
  recommended_resolution: Quantiles from game 1; PSI verdicts and model alerts from game 11 (>= 10 games of the same source tier).
  reason: All three agree on PSI > 0.25; only the start differs, and a baseline of fewer than 10 games is not a baseline.
  decision: Start drift verdicts at game 11?
