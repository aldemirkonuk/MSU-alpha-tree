  recommendation: 'Keep the sourced bands but gate them: acceleration computed over >= 0.5 s windows with propagated sigma; band counts and accelerations reported only where sigma <= 0.5 m/s², else "unresolved"
    (counted); onsets by change-point on velocity; no jerk; the 0.2 s window is not used for acceleration; new-RF-A15 deceleration trigger only where resolvable.'
  source: conflict K03
- id: K04
  decision: 'Approve coverage gates: coarse 85% then 90%; fine 75% on 300 screens/5 games; publish fine only at confidence >= 0.8?'
  recommendation: Store both levels; coarse always (>= 85% on >= 200 screens from >= 5 games at first release, rising to R-DF-16's 90% by season end); fine stored only after the fine gate (>= 75%, >= 300
    screens, >= 5 games) and published only per screen at confidence >= 0.8.
  source: conflict K04
- id: K05
  decision: Primary run = register (net >= 8 in 120 s); broadcast display threshold 8 or 6?
  recommendation: Three named definitions in config (unanswered, broadcast a-b, register), never merged; register is primary for hypotheses; broadcast display threshold default net >= 8 (6 kept as a config
    alternative); the 2/4/6-min net points stay numeric features, not "runs".
  source: conflict K05
