top_15_changes:
- rank: 1
  change: Clock map as a table
  ids:
  - R-MD-08
  what: Video, game clock, shot clock and UTC aligned in piecewise segments with stated residuals; every timing metric and every market join runs through it.
  driven_by: data engineer (+ analyst, scientist on timing)
- rank: 2
  change: Typed rules state machine with a flow state
  ids:
  - N-SY-01
  - N-IV-01
  what: Every state change is one typed transition (T01-T24) with its rule reference and allowed from/to pairs; invariants run on transitions, not on 155,000 frames.
  driven_by: data engineer, ESPN analyst
- rank: 3
  change: State stored once
  ids:
  - N-MD-01
  - R-MD-01
  - R-SR-06
  - N-MD-02
  what: state_segments per dimension, team-neutral; per-frame state and the global stamp become views, so a correction is made in one place.
  driven_by: data engineer
- rank: 4
  change: Rules layer and rule corrections
  ids:
  - N-RL-01
  - N-RL-02
  - R-IV-02
  - R-IV-10
  - R-RF-03
  - R-SY-08
  - N-CG-01
  what: Rules edition per game; two or three officials; media-format timeouts; 2026-27 foul classes without "intentional"; 41 shot-clock causes; edge-correct court constants.
  driven_by: rules layer, quality review, ESPN analyst
- rank: 5
  change: One chance definition
  ids:
  - R-DQ-06
  - R-SY-05
  - R-MD-06
  what: Fixed terminal-event list; a shot-clock reset inside a possession opens a new chance; team and dead-ball rebounds counted as the scorer records them.
  driven_by: quality review, data engineer, ESPN analyst
- rank: 6
  change: Scorebug timing
  ids:
  - R-SB-03
  - N-SY-04
  - R-SY-01
  what: Window 4.0 s (not 15 s), per-field lag model, lag-corrected state times; POSS is the arrow, never possession.
  driven_by: all three
- rank: 7
  change: Timing in frames at 29.97 fps
  ids:
  - R-VI-01
  - R-MB-04
  - R-BL-04
  what: The footage that exists is 29.97 fps; every tolerance restated in frames; make frame +/- 2 frames on 95%.
  driven_by: all three, quality review
- rank: 8
  change: One physics key
  ids:
  - R-IV-13
  - R-DQ-02
  - R-EN-03
  - R-DT-08
  what: Speed 10.0 m/s hard and 9.0 m/s soft over >= 0.3 s; acceleration 12 m/s² over >= 0.5 s, to 8.0 after calibration; checks on filtered tracks.
  driven_by: data engineer, team data scientist
- rank: 9
  change: Uncertainty travels with every kinematic value
  ids:
  - N-DT-01
  - R-CG-08
  - R-PL-12
  - N-PL-01
  - R-CO-02
  what: Sigma columns; bands and onsets reported only where resolvable; change-point onsets; no jerk.
  driven_by: data engineer, team data scientist
- rank: 10
  change: Ball-screen coverage gates
  ids:
  - R-DF-06
  - R-DF-16
  - N-DF-06
  what: Coarse always; fine only after its validation gate and at confidence >= 0.8; coverage-by-outcome table.
  driven_by: ESPN analyst, team data scientist
- rank: 11
  change: One vocabulary per word
  ids:
  - R-MD-17
  - N-EV-05
  - R-MD-13
  - R-CO-04
  - R-MD-16
  - N-MD-11
  what: Runs (three named definitions), clutch (one key), foul trouble (config table), broadcast phrases for every label.
  driven_by: ESPN analyst (+ all)
- rank: 12
