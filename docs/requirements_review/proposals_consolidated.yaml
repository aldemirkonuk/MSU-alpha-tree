game_flow_spine:
  transitions:
  - id: T00
    from_state: any
    to_state: observed / not observed
    trigger: camera cut, replay, graphics, condensed-replay edit
    rule: none (broadcast director)
    clocks: video time stops being linear in game clock
    detection:
    - N-VI-03
    - R-VI-03
    - R-VI-04
    - R-VI-05
    timing:
    - N-VI-01
    - N-VI-02
    - R-MD-08
    analysis:
    - N-VA-06
    - R-PL-05
    - R-VI-06
  - id: T01
    from_state: S0 pre-period / S1 jump ball
    to_state: S6 loose ball (no team control)
    trigger: toss leaves the official's hand; legal tap
    rule: 6-1.2.a, 6-2, 6-3, 5-10.2.b
    clocks: GC starts on the legal tap; SC off until control
    detection:
    - N-EV-06
    - R-DT-15
    - R-EV-14
    timing:
    - N-SR-02
    - R-MD-08
    - R-SR-01
    analysis:
    - N-IV-16
    - R-EV-14
    - R-MD-12
  - id: T02
    from_state: S6 no control
    to_state: S3/S4 team control
    trigger: player gains control after a jump ball or a try
    rule: 4-9, 2-11.5.b, 5-10.3.b
    clocks: SC starts (30, or 20 flat after ring contact)
    detection:
    - R-BL-02
    - R-MD-02
    - R-SR-06
    timing:
    - N-IV-02
    - R-MD-06
    - R-SY-08
    analysis:
    - R-MD-04
    - R-SR-05
    - R-SY-04
  - id: T03
    from_state: S3/S4 team A control
    to_state: S3 team B control (live)
    trigger: steal, defensive rebound, loose-ball recovery
    rule: 2-11.6.b.1, 2-11.6.b.4, 4-9
    clocks: SC to 30 on control; GC runs
    detection:
    - R-BL-02
    - R-EV-08
    - R-EV-09
    - R-EV-10
    timing:
    - N-SY-01
    - N-SY-03
    - R-SY-08
    analysis:
    - N-DF-05
    - R-TR-08
    - R-TR-09
    - R-TR-22
    - R-TR-26
    - R-VL-01
  - id: T03a
    from_state: S3 backcourt control
    to_state: S4 frontcourt control
    trigger: ball and both feet of the dribbler (or holder) in the frontcourt
    rule: 9-10, 9-12.1-3
    clocks: GC and SC run; 10-s count stops
    detection:
    - N-MD-06
    - N-SR-03
    timing:
    - N-IV-02
    - N-SR-03
    analysis:
    - N-DF-02
    - R-ST-19
    - R-TR-20
  - id: T03b
    from_state: S4a primary transition
    to_state: S4b early offense -> S4c half-court
    trigger: 3 defenders back; defense set (all 10 in the half-court, every attacker guarded within 2.0 m goal-side for 1 s)
    rule: project definition (R-TR-08/09), no rule
    clocks: GC and SC run
    detection:
    - R-DF-20
    - R-TR-08
    - R-TR-12
    timing:
    - R-TR-01
    - R-TR-20
    analysis:
    - N-ST-08
    - R-ST-05
    - R-TR-09
    - R-TR-18
    - R-TR-24
  - id: T04
    from_state: S4 team control
    to_state: S5 try in flight
    trigger: release of a try (the try starts with the shooting motion)
    rule: 5-1.10, 6-6.1, 4-9.4
    clocks: GC and SC keep running; ball stays live through a whistle until the try ends
    detection:
    - N-EV-03
    - R-BL-04
    - R-EV-07
    timing:
    - N-IV-07
    - R-BL-04
    - R-MB-06
    analysis:
    - N-MD-12
    - N-VL-01
    - N-VL-02
    - R-CO-01
    - R-EV-07
    - R-VL-04
  - id: T05
    from_state: S5 try in flight
    to_state: S7 dead (made goal) -> S2 throw-in
    trigger: ball passes through the basket
    rule: 6-5.1.a, 5-1, 5-11.9, 2-10.12
