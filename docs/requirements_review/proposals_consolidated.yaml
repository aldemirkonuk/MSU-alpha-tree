- id: K01
  decision: 'Approve physics key: speed 10.0 m/s hard + 9.0 m/s soft flag (>= 0.3 s windows), acceleration 12 m/s² over >= 0.5 s, to 8.0 m/s² after sigma <= 1.0 m/s²?'
  recommendation: 'One key physics.* in config read by R-DQ-02, R-IV-13, R-EN-03 and R-DT-08: hard speed limit 10.0 m/s over >= 0.3 s windows (break); soft speed limit 9.0 m/s (review flag for identity
    swaps); acceleration 12 m/s² over >= 0.5 s windows (flag only), tightened to 8.0 m/s² once measured acceleration sigma <= 1.0 m/s²; court bounds + 1.0 m in the same key.'
  source: conflict K01
- id: K02
  decision: Set the scorebug window to 4.0 s initial, then per-field p99 + 1.0 s (3-15 s bounds)?
