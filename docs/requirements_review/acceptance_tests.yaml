# Acceptance tests for all 518 requirement IDs of the live requirements doc (export 2026-10-18, 43 families).
# Status: PROPOSAL (2026-10-18, requirements improvement pass). The requirements session owns the live doc;
# nothing here changes it. Companion review: docs/requirements_review/quality_review.md.
# Fields: id, tier (as in the live doc), test_type (unit | integration | data-check | manual-review | benchmark),
#   measure, threshold (live-doc numbers keep "(proposal)"; new numbers say "(initial value, to calibrate)"),
#   unit, data_needed, tables (schema/tables/<name>.yaml that declare the ID in requirements:, else that cite it at column level;
#   process rules name their file),
#   ontology_leaves (count of config/game_ontology.yaml leaves citing the ID), status
#   (ready = runnable once data exists | needs_value = a threshold or share must be set | needs_decision = Aldemir decides),
#   issues (codes defined in quality_review.md), current_test (the live doc's Test or Check cell, verbatim).
