- id: N-SY-01
  family: N-SY
  tier: Shall
  priority: P0
  text: Every game-state change is one typed transition in `state_transitions` (type from `config/state_machine.yaml`, T01-T24 and subtypes, each with its rule reference and allowed from → to pairs). Each
    transition records the effective frame and `order_index` within the frame, the observed frame per source (OCR, PBP, CV, so that scorebug lag is stored, not hidden), all four clocks, the trigger event,
    the sources that observed it, `known_at_utc`, and `supersedes_id` for corrections. Rows are append-only. The analyst flow state (S0-S11; S4 split into primary transition, early offense and half-court,
    with source CV for the split) is a dimension of `state_segments`, so per-frame `flow_state` comes from the view. A disallowed transition is an invariant break. Replay frames never open a transition.
  acceptance: 0 untyped transitions; every segment boundary references exactly one transition; disallowed transitions = 0 on gold-v1 or each explained in review; 0 transitions with an effective frame inside
    a replay; transition count per type reported per game; for each corrected transition the superseded row is still readable (count of superseded = count of corrections).
  lands_in: new table state_transitions; new config/state_machine.yaml; state_segments.dimension = flow_state (view state_frame.flow_state)
  source: K09 approved
- id: N-SY-02
  family: N-SY
  tier: Shall
  priority: P0
  text: Every pull of PBP and of the official box score is stored as a version with a content hash; a diff (plays added, removed, changed; box stats re-credited with old and new value) is computed; downstream
    tables and published outputs that used a changed value are rebuilt and marked; the official box is re-pulled weekly for processed games.
  acceptance: Re-pull with no change -> 0 rebuilt tables; an injected change -> only dependent tables rebuilt (test); 100% of box diffs logged; dependent outputs re-run within 7 days.
  lands_in: new tables pbp_versions (game_id, source, pull_id, sha256, n_plays, n_added, n_removed, n_changed, known_at_utc) and stat_corrections (game_id, player_id, stat, old, new, seen_utc, source)
- id: N-SY-03
  family: N-SY
  tier: Shall
  priority: P0
  text: Events in the same game-clock second carry an explicit order_index and order_source (cbbd_id, video, inferred).
  acceptance: No two events share (game_id, pass, period, game_clock_s, order_index).
  lands_in: events.order_index, events.order_source
- id: N-SY-04
  family: N-SY
  tier: Shall
  priority: P0
  text: Estimate scorebug lag per game and per field (score, game clock start/stop, shot clock reset, fouls, timeouts) from events whose true time is seen on video, and use lag-corrected times for state
