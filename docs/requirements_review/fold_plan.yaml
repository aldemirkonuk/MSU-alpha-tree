- id: N-MD-13
  family: MD
  tier: Shall
  priority: P1
  text: 'Store a game-closeness record per game and per possession: max absolute margin over the game, seconds spent with margin ≤ 3 / ≤ 5 / ≤ 6 points, lead changes, ties, and a close-game class (max absolute
    margin ≤ 6 points after the first 300 s, initial value to calibrate); every possession carries a leverage weight (change in win probability between a score and a stop) so each basket in a close game
    is weighted more.'
  acceptance: 'All 4 fields present for 100% of games; leverage weights sum-check: mean leverage of possessions in close-class games > that of other games on the season set.'
