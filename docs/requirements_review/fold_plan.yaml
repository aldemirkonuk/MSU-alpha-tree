  acceptance: '>= 10 events per field per game; lag median and IQR in the run record; after correction the score-change time is within +/- 0.5 s of the ball-through-net frame on >= 95% of makes (raw lag
    1.50-2.60 s measured); state uses corrected times on 100% of OCR-sourced changes.'
  lands_in: scoreboard_ocr.read_ts_ms (raw); new view scorebug_lag (game_id, field, n, p50_s, p90_s, p95_s); corrected *_time_s columns
- id: N-SY-05
  family: N-SY
  tier: Shall
  priority: P0
  text: A clock or score correction (5-12, 2-9.13, review) produces a correction event with old value, new value and the affected window; only state segments inside the window are rebuilt.
  acceptance: 'Louisville 4:06 → 4:07 produces exactly one correction and rebuilds only segments after it. K09 addition: the regenerated state_frame after the correction equals a full rebuild (0 rows differ);
    the frame range reported as changed equals the symmetric difference of old and new segments.'
