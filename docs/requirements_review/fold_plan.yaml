- id: N-PL-06
  family: PL
  tier: Shall
  priority: P1
  text: 'Store distance-over-time measures per player: metres covered in rolling 5 s windows, time to cross the division line from possession start (s), time from own baseline to the opposite free-throw
    line, sprint segments (speed ≥ 7.0 m/s for ≥ 1.0 s; initial value) with length (m), peak and mean speed (m/s, km/h shown).'
  acceptance: Values reported only where position error ≤ 0.5 m over the window; distance error ≤ 5% against 50 hand-measured court-line crossings.
  source: Aldemir 18 Oct answers
- id: N-CX-10
  family: CX
  tier: Shall
  priority: P1
  text: 'Every parameter used by any model or index is registered once (name, definition, unit, source table/column, valid range, default weight, who may change it) in a parameter registry; every model
    output stores its per-parameter contributions per frame and per incident (event, possession), so each frame or incident can be dissected and re-weighted without re-running the pipeline. K09 addition:
    contributions are keyed by (video_id, frame_index or incident_id, state_version); after a state correction, only incidents overlapping the changed frame range are re-scored.'
  acceptance: 100% of model inputs resolve to a registry entry; for any incident, the stored contributions sum to the output within 1e-6; changing one weight and re-scoring reproduces the new output from
    stored contributions. After any state correction, re-scoring only the overlapping incidents gives exactly the same contributions as re-scoring the whole game (0 differences, tolerance 1e-9), and no
    incident outside the changed frame range is re-scored (0 extra re-scores).
  source: Aldemir 18 Oct answers
- id: N-SR-05
  family: SR
  tier: Shall
  priority: P1
  text: 'Foul trouble per K10 (modified): flag a player with 2 fouls while first-half elapsed ≤ 900 s, 3 fouls with > 600 s left in the second half, 4 fouls with ≤ 600 s left in the second half or in overtime;
    thresholds read from config; the 2/4 rule kept as a named view.'
  acceptance: Flags match the rule on 100% of a 200-row synthetic test; config change re-flags without code change.
