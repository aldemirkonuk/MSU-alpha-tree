    d_division: HALF_Y - y
    sd_paint_out: hypot(max(ax - LANE_X, 0), max(abs(y - (FT_Y + END_Y) / 2) - (FT_Y - END_Y) / 2, 0)) + min(max(ax - LANE_X, abs(y - (FT_Y + END_Y) / 2) - (FT_Y - END_Y) / 2), 0)
