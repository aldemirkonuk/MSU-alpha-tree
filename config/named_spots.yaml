  bounds_text: 'Every object, every frame, store (x, y, r, t, m) plus these values, evaluated with the dictionary grammar (numeric, not boolean), at 0.01 m / 0.1 deg. d3 = signed distance
    behind the three-point line in the is_three regime (> 0 iff three; within 0.031 m of the Euclidean distance to the line for |d3| <= 1.524; it switches formula at y = BREAK_Y, so
    deep inside the arc it is a regime value, not a distance). d_sideline, d_endline, d_division = distances to the inside edges (in bounds > 0). sd_paint_out = exact signed distance
    to the paint rectangle |x| <= LANE_X, END_Y <= y <= FT_Y (negative inside). ball_angle_delta = unsigned angle at the rim between the object and the ball (0..180 deg). It needs bx,
    by and is null without the ball. It is the continuous form of ball_side, with no 0.9 m dead band. An arc-length coordinate along the three-point line (s3) is deferred: the proposed
