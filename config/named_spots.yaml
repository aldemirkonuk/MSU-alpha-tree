loader:
  missing_data: 'Feet occluded, body visible: use the box bottom with sigma_ref = 0.30 m. Player fully occluded: constant-velocity Kalman prediction for up to 0.5 s (15 frames) with
    sigma_pred = 0.5 m/s x t; labels hold their last value, with P recomputed. After 0.5 s: label = unknown, keeping last_known_spot and t_last_seen. On re-acquisition, relabel at once
    (no dwell). Never emit rule decisions from predicted positions. expr null: procedural rule, not a floor region. Loader contract: if x or y is NaN or None, or the object is predicted
    past 0.5 s, emit court_region=unknown and evaluate nothing. An entry whose expr references a ctx name (bx, by, hx, hy, ax_, ay_, ball_side) returns null, not False, when any of those
    ctx values is missing. Null is stored as label absent with reason=no_context, never as an exception or as OOB.'
  temporal:
    schema_field: temporal
    mode:
      single_winner: exit
      multi_label: enter_leave
    on_every_entry:
      hysteresis: painted|convention|none
      h_min_m: 0.1
      h_k_sigma: 0.5
      h_k_sigma_slow: 1.0
      dwell_ms: 133
      dwell_ms_slow: 467
      slow_speed_mps: 1.0
      slow_speed_window_s: 1.0
      output: label|probability
      exempt:
      - landing
      - camera_cut
      - event_frame
      - reacquisition
    defaults:
      source_kind contains rule_book or family painted:
        hysteresis: painted
        h_min_m: 0.1
        h_k_sigma: 0.5
        h_k_sigma_slow: 1.0
        dwell_ms: 133
        dwell_ms_slow: 467
        output: label
      other spatial:
        hysteresis: convention
        h_min_m: 0.25
        h_k_sigma: 0.75
        h_k_sigma_slow: 1.0
        dwell_ms: 233
        dwell_ms_slow: 467
        output: label
      relative:
        hysteresis: convention
        sigma: hypot(sigma_self, sigma_other)
        h_min_m: 0.25
        h_k_sigma: 0.75
        h_k_sigma_slow: 1.0
        dwell_ms: 233
        dwell_ms_slow: 467
        output: label
      rule decisions at events:
        hysteresis: none
        dwell_ms: 0
    probability_only:
    - lane_mark_2_zone
    - division_line
    - end_line
    - free_throw_line
    - lane_line_landmark
    - lane_mark_1
    - lane_mark_1_zone
    - lane_mark_2
    - lane_mark_3
    - lane_mark_3_zone
    - restraining_line
    - restricted_area_straight_leg
    - sideline
    - endline_throw_in_mark
    - halfcourt_crossing_line
    - division_line_extended
    - opp_ft_line
    - restricted_area_arc_line
    - legacy_restricted_area_arc_3ft
    - charge_circle
    - backcourt_28ft_mark
    - mark_28ft
    - three_point_arc
    - three_point_corner_straight
    - coaching_box_38ft_line
    - far_three_point_line
    - lane_block
    - painted_block
    - ft_lane_block
    - out_of_bounds_colour_belt
    - toe_on_line
    - pack_line_band
    - block_zone
    - rim
    - rim_centre
    probability_only_rule: 'An entry goes on this list when the inscribed radius of its own region is below the h of its class at sigma 0.30 (painted: max(0.10, 0.5 x 0.30) = 0.15 m;
      convention: max(0.25, 0.75 x 0.30) = 0.25 m), or when its measured recall for moving players under exit-based hysteresis is <= 0.01 (block_zone, inscribed radius 0.16 m). Output
      for these: P_in = Phi(d / sigma) and the signed distance d, stored every frame, never a boolean. A probability_only entry in a single-winner layer (opp_ft_line in fullcourt) does
      not take part in winner selection.'
  evaluator:
    loader_rules:
    - 'AST whitelist at load: Expression, BoolOp, BinOp, UnaryOp, Compare, IfExp, Call (func Name in BASE only), Name (BASE, x, y, z, ax, r, t, m, ball_side, bx, by, hx, hy, ax_, ay_),
      Constant (int/float); reject Attribute, Subscript, Lambda, comprehensions, NamedExpr'
    - build env once per object-frame (plus one mirrored env) and reuse it across all exprs
    - Monte Carlo P (64 samples) only for entries with |signed distance| < 3 sigma and only for rule-decision layers
  dedupe_identical: keep one id per group (lane_block, free_throw_semicircle, rim, division_line, blob_designated_spot, slob_28ft_frontcourt, slob_28ft_backcourt, jump_ball_jumper_attacking,
    three_second_lane, rule_three_point_shot_membership, backcourt_heave); fold the others into aliases plus supersedes
