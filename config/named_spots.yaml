version: 0.2.0
date: '2026-10-20'
status: proposal under the build freeze; canonical source for every spot, zone and position label
owner: Mac session (msu-colab) for Aldemir
how_built: 9 research families + skeptic each (18 agents) -> 9 synthesis + self-test (18) -> merge with canonical court_region -> 4 scenario testers + 4 reviewers (8) -> fixes applied
  and every test rerun. See docs/data/named_spots.md.
frame:
  origin: floor point under the centre of the attacked rim (team in possession attacks it)
  x: along the end line, + to the attacker's right facing the basket
  y: from the end line toward half court
  r: hypot(x, y), m
  t: theta = atan2(y, x) in degrees, (-180, 180]; 0 = right end line, 90 = top of the key, 180 = left end line
  m: 'folded angle: t if -90 <= t <= 90; 180 - t if t > 90; -180 - t if t < -90'
  mirror: side = mirrored entries are written for the right (x >= 0); the left is x -> -x (ball, handler and assigned attacker x are negated too); right owns x = 0
  units: metres, degrees, seconds; 1 ft = 0.3048 m exactly; stored to 0.01 m and 0.1 deg
  full_court: far end line y = 27.051, far rim y = 25.4508; backcourt points stay in the same frame
constants:
  RIM_Y_FROM_END: 1.6002
  END_Y: -1.6002
  BOARD_Y: -0.381
  LANE_X: 1.8288
  FT_Y: 4.191
  ARC_R: 6.7501
  CORNER_X: 6.6008
  BREAK_Y: 1.4118
  BREAK_T: 12.073
  RA_R: 1.27
  HALF_Y: 12.7
  SIDE_X: 7.62
  FAR_END_Y: 27.051
  LINE_W: 0.0508
  source: docs/rules/PRMBB_RulesBook.pdf (2026-27); docs/data/court_constants_check.md
expression_language: 'Each expr is one Python boolean expression checked against an AST whitelist (arithmetic, comparisons, and/or/not, calls to abs min max hypot atan2 degrees sqrt
  floor is_three dist seg_dist). Names: x y z ax r t m, the constants, and context bx by hx hy ax_ ay_ ball_side, table_side_x_sign. is_three(x, y): corner (y <= BREAK_Y) needs |x| >
  CORNER_X; above the break r > ARC_R; a foot on the line is a two. Grammar extension 0.2.0 (context names; each is None when unknown, and Spot.inside then returns None with reason no_context):
  - dribbling: handler dribble state. 0 = holding with a live dribble (has not dribbled since this catch), 1 = dribbling, 2 = dribble used (DRIBBLE_END since the catch, until the ball
  leaves his hands); None while nobody holds the ball. - lowest_defender_y: min y over the 5 defenders'' stance centres; None unless all five are known. - px, py: the same object''s
  reference point at the previous frame (PTS - 1001/30000 s), taken from the smoothed track (rule_trajectory_smoothing). None if that frame is missing or the step crosses a camera cut,
  landing or airborne freeze. Implementation: spotlib.CTX_NAMES |= {dribbling, lowest_defender_y, px, py}; the mirrored-entry negation tuple in Spot.inside becomes (bx, hx, ax_, px);
  the check.py CTX regex becomes \b(bx|by|hx|hy|ax_|ay_|ball_side|dribbling|lowest_defender_y|px|py)\b; entries may carry probes_ctx: a list of {"p": [x, y], "ctx": {...}, "want": true|false|null},
  and check.py asserts s.inside(x, y, **ctx) == want. Role gating and multi-frame clauses stay in bounds_text. Screener coordinates (sx, sy) are deferred until an off-ball expr that
  holds up exists.'
edge_rules:
- Boundary lines are out of bounds (|x| >= 7.62, y <= -1.6002, y >= 27.051).
- The division line is backcourt except its mathematical edge nearest the attacked basket (frontcourt is y <= 12.700).
- 'Three-point line: the line is two-point territory (strict is_three).'
- 'Restricted area: the arc line is inside (r <= 1.2700, outer edge), straight segments to the board face.'
- 'Lane and FT line: the lines are part of the lane (|x| <= 1.8288, y <= 4.191).'
- Exact ties between non-rule zones go to the zone nearer the rim.
precedence: 'Single-winner layers (spot, restart, fullcourt, and every zone_scheme with partition: true) pick the entry with the minimum rank = family_rank * 1000 + priority; family_rank
  canonical 0, painted 0, interior 1, perimeter 2, defensive 3, restart 4, rule/review 5, shot_zone 6, empirical 7, repo 8. If no spot matches, the primary falls back to court_region.
  landmark, relative, rule and non-partition zone schemes are multi-label.'
layers:
  zone_scheme:court_region: 'THE canonical partition: every floor point gets exactly one of 16 side-qualified labels (+ unknown). Always present, every object, every frame.'
  zone_scheme:three_depth: 'attribute on three-point territory: corner, standard (< 27 ft), deep (27-30 ft), logo (30 ft to half court), heave (backcourt)'
  spot: specific coaching spots (block, elbow, dunker, short corner, wing_mid ...); single winner by rank
  landmark: painted and rule-defined markings and umbrella areas; multi-label
  relative: ball- and player-relative positions (help, deny, gap, PnR coverage); need context
  restart: dead-ball and throw-in positions; evaluated at restart snapshots
  fullcourt: transition, press and backcourt positions
  shot_zone_alt: secondary shot-event labels from other families, kept as alternatives
  rule: labelling rules (reference points, hysteresis, dwell, airborne, occlusion, frame selection)
  zone_scheme:<other>: crosswalks (nba_basic, nba_range, nba_area, ctg, pbpstats, br_distance) and coaching schemes (zones, presses, transition lanes, pnr_location, ball_zone, pickup_y,
    court_thirds ...)
