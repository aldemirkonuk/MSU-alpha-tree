    0.6 m) normalised to unit mass. Stack the surfaces into Lambda and run NMF with K = 10, KL loss, nndsvda init, seed 0, 2000 iterations: Lambda ~ W B. Freeze B to config/learned_zones_v1.npz
    with its SHA-256 in this entry. Per object per frame, soft membership w_k(p) = B_k(tile(p)) / sum_j B_j(tile(p)), stored as the top 3 (k, w) at 0.01. Hard learned label = argmax_k.
