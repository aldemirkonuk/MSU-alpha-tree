  bounds_text: 'Time to reach floor point q for player i with position p_i and velocity v_i (rim frame, smoothed per rule_trajectory_smoothing): T_i(q) = tau + |q - (p_i + v_i tau)|
    / v_max, with tau = 0.25 s and v_max = 7.0 m/s (proposal; recalibrate to the P99 of tracked player speed). Mesh: square 0.10 m cells covering the frontcourt in bounds (|x| < 7.62,
    -1.6002 < y <= 12.700), with cell centres at x = -7.57 + 0.10 i and y = -1.5502 + 0.10 j. Dominant region of i = the cells where T_i is the minimum over all 10 players. Ties go to
    the defence. dom_area_m2 = 0.01 x the cell count, at 0.01 m2. Offensive control: PC_off(q) = 1 / (1 + exp(-(min_def T(q) - min_off T(q)) / s)) with s = 0.25 s. Team control = mean
    of PC_off over the mesh, at 0.01. Named-spot control: for every spot, court_region and zone-slot entry with an anchor (mirrored entries at both mirrors), spot_control_<id> = PC_off(anchor),
