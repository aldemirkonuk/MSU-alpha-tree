  name: Verticality cylinder (block/charge geometry)
  side: n/a
  anchor:
    x: null
    y: null
    z: null
  bounds_text: 'There is no fixed geometry. The rule defines each player''s cylinder from the floor upward, bounded by the hands and arms in front (arms bent at the elbow), the buttocks
    behind and the legs at the sides, and it varies with the player''s size (R4-39.1c). Measurement proposal: an ellipse on the floor centred on the pelvis floor point (reference point
    C). Its semi-axes are half the measured hip-to-hand depth front to back and half the stance width sideways, both from pose. A contact is ''inside the defender''s cylinder'' when
    the attacker''s pelvis or torso keypoints project inside that ellipse. expr is null because the cylinder is specific to each player and needs the defender''s own pose.'
