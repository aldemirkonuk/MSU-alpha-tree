  side: n/a
  expr: null
  bounds_text: 'For any region R with an expr and the object''s reference point p: sd_R(p) = +min{|p - q| : q not in R} if p is in R, else -min{|p - q| : q in R}, in metres, clipped
    to [-5.00, 5.00] and stored to 0.01 m. The court_region label L(p) always gets sd_L, plus nearest_boundary_label = the label of court_region at the first point beyond the nearest
    boundary. Every other partition scheme''s winner gets sd too. Multi-label layers get sd for each emitted label and for each label with -1.0 <= sd < 0 (labels the object is within
    1 m of). Computation for court_region: closed form over its boundary primitives (lines x = +-SIDE_X, +-LANE_X, +-CORNER_X, and x = +-RA_R for BOARD_Y <= y < 0; y = END_Y, BOARD_Y
    (for |x| <= RA_R), FT_Y, BREAK_Y, HALF_Y; circles r = RA_R (y >= 0), 4.2672, ARC_R; rays m = 30, 60, 80). Reference implementation for any expr: from p, march rays at 1 deg in 0.01
    m steps up to the current best distance + 0.01 m, bisect each crossing 30 times, then refine within +-1 deg of the best ray in 0.01 deg steps. Its tolerance against the closed form
    is 0.005 m. Label ETA: g = unit vector from the nearest boundary point to p (outward when p is outside). Closing speed c = -(v . g) for p inside (c > 0 means moving toward the boundary).
