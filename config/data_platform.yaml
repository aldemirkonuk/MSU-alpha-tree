pack: data_platform
version: 0.1.0
date: '2026-11-11'
owner: Mac session for Aldemir
status: proposal under the build freeze (baseline 6 of 8). Requirements, decisions, schemas and algorithms; nothing is built in src/. Every number says whether it is measured (and where) or assumed (and why).
scope: >-
  The four data-platform items Aldemir picked on 19 Oct 2026 (inbox 011), written as requirements: (1) home / away
  storage so the system runs for any D-I game, (2) one SQL query layer that serves every stat by its metric-registry
  id, (3) row lineage, (4) play-by-play corrections pulled again and propagated. Each item is a set of exact rows with
  decisions, table schemas, numbered algorithms, parameters and acceptance tests, and each is proven by a small
  reference prototype on the play-by-play we hold (37 games; aggregates and game codes P01.. only in this repo).
requirement:
  ask: 'Board 2026-10-19T23:45Z: home / away storage (any D-I game), one SQL query layer by metric id, row lineage, play-by-play corrections pulled again and propagated.'
  the_rule: >-
    One fact has one stored form, one identity and one history. Sides are home and away, never "us". A row's identity
    comes from what it is, never from when it was computed. Every output names the inputs, the config and the code
    it came from, and a corrected input makes a new version next to the old one, never an overwrite.
  live_rows: [R-MD-35, R-EN-18, R-EN-19, R-SY-20]
  related_rows: [R-MD-01, R-MD-21, R-MD-22, R-MD-24, R-SY-06, R-SY-11, R-SY-12, R-SY-13, R-SY-15, R-SY-18, R-EN-07, R-EN-09, R-EN-10, R-EN-11, R-EN-12, R-EN-13, R-EN-14, R-EN-16, R-EN-17, R-DQ-04, R-DQ-05, R-DQ-10, R-DQ-14, R-DQ-15, R-FD-02, R-FD-13, R-FD-19, R-RR-01, R-RR-02, R-RR-08, R-AS-02, R-PR-14, R-CS-13, R-IV-15]
  decisions: [D06, D07, D19, K09]
  ids_note: 'Ids are those of the live requirements, rev 563 of 11 Nov 2026. A row that sharpens a live row keeps its id (kind: sharpens). A proposed row is N-<FAM>-nn, numbered on from the highest live number of its family (MD 35, EN 21, SY 20, DQ 18, FD 19, RR 10, AS 12), so it cannot be mistaken for the old N-MD-01.. names. The requirements session assigns the final ids.'
files:
  pack: config/data_platform.yaml (this file)
  implementation: tools/specgen/platform/ (dplib.py loader, lint and shared helpers; fold_all.py item 1; query_layer.py and sql/ item 2; lineage.py item 3; pbp_versions.py item 4; gen_doc.py and doc_template.md)
  tests: tests/platform/ (synthetic tests that run without private data; real-data smoke tests skipped when it is absent)
  results: results/platform_test/ (fold_all.json, query_layer.json, lineage.json, pbp_versions.json, README.md - aggregates and game codes only)
  doc: docs/data/data_platform.md (generated by tools/specgen/platform/gen_doc.py; do not edit by hand)
  schema_changes: schema/platform_changes.yaml (proposed, not applied)
  private_scratch: '~/MSU-Alpha-3-private/work/platform_2026-11-11/<label>/ (every Parquet file, lake, lineage table and run record built from licensed rows)'

# ---------------------------------------------------------------------------------------------------------------------
conventions:
  requirement_rows: 'The format of the live requirements: id, tier (Shall or Should), requirement, product, unit, exceptions, test. Added here: kind (sharpens a live id, splits one, or new), test_data (the sample the test runs on) and acceptance (the ACC-DP rows that make the test runnable).'
  acceptance_status:
    met: 'The test ran; results names the file (and key) that holds the number.'
    failed: 'The test ran and missed the threshold; results names the file, failure_note says what was found. Never hidden.'
    pending_prototype: 'The prototype that runs the test is not run yet; results names the file and key it will write. dplib --check --final treats it as a problem.'
    not_yet_testable: 'The test needs data we do not hold; reason says what. Never reported as met (R-RR-02).'
  sides: 'home, away, none. "Focus" is a parameter of a view, never a stored value. MSU appears in this pack only as the name of the project and in the old column names of the audit.'
  game_codes: 'P01..P37 name the held games in public text. The code -> game rule is dplib.discover_games (order of the private files); no real game id, team name or play text is written in this repo.'
  grains: [frame, second, event, possession, chance, lineup_stint, player_game, team_game, game, player_season, team_season]
  passes: 'pbp_only is the only pass of the prototypes. Every key below holds the pass, so video passes can sit next to it later.'
  units: seconds (s), deciseconds of game clock (ds) where config/state_machine.yaml uses them, bytes, rows, share 0-1. No feet.
  time: 'Record time (when we knew) and game time (when it happened) are separate axes. Record time is UTC with microseconds; game time is (period, seconds remaining, order inside the second).'
  none_value: 'A value that cannot be computed is null with a status that says why (undefined, no_data, not_bound); it is never 0 and never dropped.'
  evidence_tags:
    rule: 'Every evidence string starts with one of these tags and a colon. The lint rejects any other start.'
    tags:
      measured: on our own data; names the result file (a research number of 11 Nov names the private research file and the prototype result that will replace it)
      assumed: not measured; says why this value and which measurement will replace it
      rule: a rule of the 2026-27 rules book or of the source's interface
      decision: a recorded decision (K01-K29, D01-D45, an owner answer)
      requirement: a live-requirement id
      config: mirrors a value of another config file of the repo
      definition: true by construction (a rule of this pack, an identity)
      published: an outside source with a citation
  research: 'Private research note of 11 Nov 2026 (work/platform_2026-11-11/research/RESEARCH.md): repo audit, 37-game fold, synthetic corrections, outside practice with 29 sources. Its numbers are cited as measured with the file name; each is re-measured by a prototype of this pack.'

# ---------------------------------------------------------------------------------------------------------------------
# One id and version scheme for all four items. dplib.py implements every rule; the lint checks that the prefixes
# below equal dplib.ID_PREFIXES. H(x) = hex sha256 of the canonical JSON of x; H16(x) = its first id_hex_len characters.
cross_item:
  hash:
    function: sha256
    canonical_json:
      - UTF-8 bytes; object keys sorted by code point; no white space; lists keep their order.
      - Strings exactly as received (no Unicode normalisation, no trimming, no case change).
      - Integers as integers. Floats in the shortest form that reads back to the same double; -0.0 is written 0.0. No NaN, no infinity (write null and a status).
      - A value absent in the source is absent in the canonical form; an explicit null stays null. The two are different content.
      - Where order is not content (a set of ids, the rows of a table) the caller sorts first, by the canonical JSON of the sort key. Where order is content (the play rows of a pull) the order is kept.
      - 'One implementation is normative: dplib.canonical_json. A port must reproduce the test vectors of tests/platform/test_platform_spec.py.'
  params:
    id_hex_len: {value: 16, unit: hex characters, why: '64 bits. Ids are unique inside one game and pass (at most about 10^5 rows): the chance of any collision in a game is below 10^-9; every writer still asserts uniqueness and fails loudly.', evidence: 'definition: birthday bound n^2 / 2^65 with n = 10^5 gives 2.7e-10; the K09 harness already uses 16 characters for transition ids'}
    version_digest_len: {value: 64, unit: hex characters, why: 'Version ids are shown with id_hex_len characters; the catalogue row always stores the full digest next to it, so a clash of two short ids is detected, not silent.', evidence: 'definition: full sha256 digest'}
  ids:
    pull_id:           {prefix: pl, made_from: [source, endpoint, request_key, fetched_at_utc, body_sha256], carried_by: [raw_pulls, pbp_version_pulls], why: 'A pull is an event: the same bytes fetched twice are two pulls with one body_sha256.'}
    pbp_version_id:    {prefix: pv, made_from: [source, game_id, plays_sha256], carried_by: [pbp_versions, pbp_plays, events], why: 'A version is content: two pulls with the same rows in the same order are one version; a reverted correction returns to the old id.'}
    config_hash:       {prefix: cf, made_from: ['{config path: the PARSED value of each key the stage declares}'], carried_by: [stage_runs, stage_outputs], why: 'A comment, a journal line or a key the stage does not read changes nothing.'}
    code_version:      {prefix: cv, made_from: ['[repo path, sha256 of the file] for each code file the stage declares, sorted', sha256 of the lockfile], carried_by: [stage_runs, stage_outputs], why: 'Only the stages whose code changed get new keys. The git commit is stored as information, never as a key.'}
    output_key:        {prefix: ok, made_from: [stage id, code_version, config_hash, '[input name, slice hash] sorted'], carried_by: [stage_outputs, current_pointers, change_sets], why: 'R-EN-09. Input keys are hashes of the slices the stage reads, so an upstream change it does not read does not re-run it.'}
    state_version:     {prefix: sv, made_from: ['the hex part of the output_key of stage state_fold'], carried_by: [state_transitions, state_segments, game_gate_results], why: 'The state version of a game is the output key of its fold, under the name the state tables already use.'}
    snapshot_id:       {prefix: sn, made_from: ['[table, game_id, pass, output_key] for every partition the session is bound to, sorted'], carried_by: [metric_value_log, stat_corrections], why: 'Names exactly which outputs a query read.'}
    run_id:            {prefix: run, made_from: ['UTC start time', 8 random hex characters], carried_by: [stage_runs], why: 'A run is an event, not content. It is the only id that is not content-derived and it is never written into a row of a content partition.'}
    event_id:          {prefix: none, made_from: [game_id, source, source_play_id], carried_by: [events], why: 'R-EN-11: readable, joined with colons, from the source''s own play id. A clock correction keeps the id, so a diff says changed, not removed and added.'}
    transition_id:     {prefix: tr, made_from: [game_id, pass, 'trigger event id (the word game for the opening transition)', ttype, 'k = 0-based count of earlier transitions of the same ttype from the same trigger'], carried_by: [state_transitions], why: 'No clock and no order index inside: a moved or inserted row does not rename its neighbours (proposal HP-3 of schema/platform_changes.yaml against the K09 harness rule).'}
    segment_id:        {prefix: sg, made_from: [game_id, pass, dimension, dim_key, opened_by_transition_id], carried_by: [state_segments], why: 'A segment is the value one transition opened (SEG-04). When only its end or its value moves it is the same segment, changed.'}
    possession_key:    {prefix: po, made_from: [game_id, pass, 'transition_id that opened the possession'], carried_by: [possessions, chances], why: 'Identity from the opening event. The possession number is an ordinal next to it.'}
    chance_key:        {prefix: ch, made_from: [game_id, pass, 'transition_id that opened the chance'], carried_by: [chances], why: 'As possession_key.'}
    stint_key:         {prefix: st, made_from: [game_id, pass, side, 'transition_id that opened the stint'], carried_by: [lineup_stints], why: 'As possession_key; side because both lineups can change on one transition.'}
    player_game_id:    {prefix: pg, made_from: [game_id, pass, team_id, player_id], carried_by: [change_sets], why: 'Row id of player_game_pbp in change sets; the table itself is keyed by the four columns.'}
    team_game_id:      {prefix: tg, made_from: [game_id, pass, team_id], carried_by: [change_sets], why: 'Row id of team_game_pbp in change sets.'}
    diff_id:           {prefix: df, made_from: [from pbp_version_id, to pbp_version_id], carried_by: [pbp_diffs, pbp_version_pulls], why: 'The diff of two contents is content.'}
    change_set_id:     {prefix: cs, made_from: [table, game_id, pass, from output_key, to output_key], carried_by: [change_sets], why: 'One change set per table and pair of outputs.'}
    binding_hash:      {prefix: qs, made_from: ['the compiled SQL text of the metric binding, white space collapsed'], carried_by: [metric_value_log], why: 'Two consumers that ask by the same id run the same text; the hash proves it.'}
    lineage_handle:    {prefix: mv, made_from: [metric_id, binding_hash, grain, entity keys, filters, parameters, as_of_event, snapshot_id], carried_by: [metric_value_log], why: 'The resolved request of one served value. Enough to recompute it and to walk to its input rows.'}
    stat_correction_id: {prefix: sc, made_from: [metric_id, grain, entity keys, from snapshot_id, to snapshot_id], carried_by: [stat_corrections], why: 'One row per value that moved between two snapshots.'}
  rules:
    - {id: X-1, rule: 'Content, not run. No row and no file footer of a content partition holds a wall time, a run id, a host name or an absolute path. Two runs on the same inputs write byte-identical files (same writer version).', serves: [R-EN-16, R-EN-17]}
    - {id: X-2, rule: 'One key per stage output. output_key = H16 of (stage, code version, config hash, sorted slice hashes of the inputs). A stage whose key exists is skipped and logs skipped_cached.', serves: [R-EN-09]}
    - {id: X-3, rule: 'Side by side. A new version is a new folder under a new key. Nothing is overwritten, nothing is deleted without Aldemir''s yes (R-RR-08). The current pointer is an append-only log.', serves: [R-EN-07, R-SY-20]}
    - {id: X-4, rule: 'Identity is not position. An ordinal (possession number, chance number, stint number, order inside a second, the values of the dimensions possession_seq and chance_seq) is stored as a column but never used inside an id, and a change that touches only ordinals is reported as renumber, not as change.', serves: [R-EN-17, R-SY-20]}
    - {id: X-5, rule: 'One form for sides. Wide state columns end in _home / _away; side enums are home, away, none; long tables are keyed by team_id; games.home_team_id and games.away_team_id are the only mapping. A grain view may show both forms; a stored table holds one fact once.', serves: [R-MD-35, R-MD-22]}
    - {id: X-6, rule: 'Record time lives in the catalogue (pbp_versions.known_at_utc, current_pointers.known_from_utc). Views expose known_at_utc by joining it. Content partitions hold no time, or rule X-1 breaks.', serves: [R-MD-24, D19]}
    - {id: X-7, rule: 'A query session is bound to exactly one output per (table, game, pass) before the first query (snapshot_id). A version is never chosen by a WHERE clause a consumer could forget.', serves: [R-EN-18, R-SY-20]}
    - {id: X-8, rule: 'A break is counted, classified and kept. Classes: spec_fault (the machine or this pack is wrong; has a proposal), source_gap (the play-by-play lacks or contradicts something; by kind), label_fault (a team or player label of the source is wrong).', serves: [R-SY-06, R-RR-08]}
    - {id: X-9, rule: 'A change of config or code is a new key and a rebuild of the dependents, never a patch of stored rows.', serves: [R-EN-16]}
    - {id: X-10, rule: 'Licensed rows and anything built from them live under the private root (dplib.ensure_private refuses a path inside the repo). Public results pass dplib.assert_public_safe: aggregates and game codes only.', serves: [R-DQ-05]}
  layout:
    raw: '<lake>/raw/<source>/<endpoint>/<YYYY>/<MM>/<DD>/<fetched_at>_<sha256[:12]>.json.gz with every response header in the manifest line (the house style of src/msu_alpha/markets/raw_store.py)'
    processed: '<lake>/processed/<table>/stage=<stage id>/key=<output_key>/game_id=<game_id>/pass=<pass>/part-0.parquet (R-EN-07)'
    manifest: '<lake>/processed/<table>/stage=<stage id>/key=<output_key>/_manifest.json = the stage_outputs row of the partition'
    pointer: '<lake>/catalog/current_pointers/<table>/game_id=<game_id>/pass=<pass>.jsonl (append-only; the last line is current)'
    runs: '<lake>/catalog/stage_runs/<YYYY-MM-DD>/<run_id>.json (one file per run, never appended)'
    season_tables: 'A season-grain output replaces game_id=<id> by season=<year>. In 0.1.0 season grains are views, so no such partition is written.'
    file_rules: 'One Parquet file and one row group per partition for every play-by-play-tier table; rows sorted by the table''s primary key; footer key-value metadata: schema_version, output_key, config_hash, code_version, content_hash. Temp name then rename (R-EN-10).'
  resolutions:
    - {id: C1, rows: [R-EN-19, R-DQ-04], clash: 'lineage from every output row, against no per-row lineage on frame tables', resolved: 'Lineage is resolved for every row and stored per partition; key columns only on event, transition, segment, interval and aggregate rows (lineage.lineage_classes).'}
    - {id: C2, rows: [R-SY-20, R-SY-15, R-SY-12], clash: 'only where the changed clock range overlaps, against equals a full rebuild, against tables that used a changed value', resolved: 'Full re-fold of the game, change set by row identity and content, re-run by declared inputs (DD-PV-3, DD-PV-4). The clock rule survives as a causality check: no row that ends before the earliest changed instant differs.'}
    - {id: C3, rows: [R-EN-17, R-EN-11], clash: 'row id from content with clock and order, against event id from the source play id', resolved: 'One id table (cross_item.ids): events from the source play id; derived rows from the event that opened them; no id holds a clock or an ordinal.'}
    - {id: C4, rows: [R-MD-22, R-MD-25, R-MD-28, R-MD-02], clash: 'team-neutral storage, against rows that land in columns named for one programme', resolved: 'state_frame and state_second are grains of the query layer and are neutral; relative columns exist only in focus views (DD-TN-2).'}
    - {id: C5, rows: [R-MD-22, R-MK-14], clash: 'state stored home / away, against prices stored per team and never home / away', resolved: 'Rule X-5: wide state is home / away, long tables are by team_id, games is the one mapping.'}
    - {id: C6, rows: [R-SY-13, R-SY-18], clash: 'order inside a second from the source id, against the canonical rule', resolved: 'The canonical rule ORD-03 fixes order_index (order_source = canonical_rule); the source position is kept as source_order_index.'}
    - {id: C7, rows: [R-EN-18, R-EN-13], clash: 'a Shall for a view per grain, and a Should for ten common queries', resolved: 'R-EN-13 becomes the performance clause of the query layer (N-EN-27).'}
    - {id: C8, rows: [R-EN-07], clash: 'three layouts in the repo (R-EN-07, the storage line of the table specs, the K09 harness)', resolved: 'R-EN-07 is the layout (cross_item.layout); the prototypes write it.'}
    - {id: C9, rows: [R-DQ-12], clash: 'older public pages carry real game ids; this baseline allows codes only', resolved: 'Codes for everything new; the older pages are an open question for Aldemir (open_questions OQ-DP-X-1).'}

# =====================================================================================================================
# ITEM 1 - TEAM-NEUTRAL STORAGE
team_neutral:
  ask: 'Home / away storage so the system runs for ANY D-I game (Aldemir, 19 Oct; D06 option A "home/away storage, MSU views").'
  live_rows: [R-MD-35, R-MD-22]
  requirements:
    - id: R-MD-35
      kind: sharpens
      tier: Shall
      requirement: 'Every stored table names a side as home or away (wide state columns, side enums) or by team_id (long tables). No stored column, enum value, default or constant refers to one programme or to "us". games.home_team_id and games.away_team_id are the only place a side meets a team.'
      product: 'every stored table of schema/tables and of schema/platform_changes.yaml'
      unit: n/a
      exceptions: 'A column relative to the row''s own team (opponent_*, own_*) may stay when the row carries team_id and its definition says "relative to the row''s team". Raw scorebug readings are left / right until joined to the bug template of the game.'
      test: 'The audit ALG-TN-1 flags 0 columns without a disposition, and nothing this pack adds is flagged.'
      test_data: 'schema/tables (107 specs, 3,005 columns), schema/platform_changes.yaml'
      acceptance: [ACC-DP-TN-1]
    - id: N-MD-36
      kind: splits
      from: R-MD-35
      tier: Shall
      requirement: 'The pbp_only fold takes one game record and one play-by-play version and nothing else: no team name, no team-id constant, no focus team. It types every row (0 untyped transitions), leaves no segment break, rebuilds the walk''s state from its segments, and gives the same ids on a second run and with both team names replaced by codes.'
      product: 'state_transitions and state_segments per game and state_version'
      unit: count
      exceptions: 'A game that fails the game gate (N-DQ-19) is still folded and reported; it is kept out of every product.'
      test: 'On every held game: TRN-01 = 0, SEG-01..04 = 0, 0 cells differ between the view from segments and the walk, the same transitions and segments on a second run and with names replaced by codes. On a game in which the focus programme does not play: the same.'
      test_data: '37 held games (P01..P37); the non-focus game needs new pulls (OQ-DP-TN-1)'
      acceptance: [ACC-DP-TN-2, ACC-DP-TN-3, ACC-DP-TN-9]
    - id: N-MD-37
      kind: new
      tier: Shall
      requirement: 'The stored state has no preferred side. Folding a game with home and away swapped in the input gives the mirror image of every stored row (ALG-TN-3), with the same row ids.'
      product: 'the mirror test, per game'
      unit: count
      exceptions: 'none. A game whose labels are broken fails the gate first and is reported as such, not excused.'
      test: 'fold(mirror(x)) = mirror(fold(x)) on every held game that passes the game gate: 0 transitions and 0 segments differ.'
      test_data: '37 held games'
      acceptance: [ACC-DP-TN-5]
    - id: N-MD-38
      kind: splits
      from: R-MD-35
      tier: Shall
      requirement: 'Team-relative values exist only in views. A team-keyed view has one row per (game, team_id) with the other team''s values in opp_ columns. A focus view takes focus_team_id as a required parameter with no default and shows *_focus and *_other columns, margin_focus, ball_focus and site_focus. MSU is one value of that parameter, supplied by the product that asks.'
      product: 'views v_team_game, focus_game, focus_second, focus_possession'
      unit: n/a
      exceptions: 'A game the focus team does not play gives no rows, not nulls.'
      test: 'For both teams of every held game: score_focus + score_other = home_score + away_score on every row; the focus view of team A equals the focus view of team B with focus and other swapped; the focus view of one team is cell-identical on the game and on its mirror; the SQL of the query layer holds 0 team-id literals.'
      test_data: '37 held games, both teams as focus (74 focus views)'
      acceptance: [ACC-DP-TN-6, ACC-DP-QL-9]
    - id: N-DQ-19
      kind: new
      tier: Shall
      requirement: 'A game enters products only when the game gate passes (ALG-TN-4): both sides are present in the rows, the final score equals the game record, no break is a spec fault, and source-gap breaks are under their cap (pbp_status ok or ok_with_gaps). The gate writes games.pbp_status and games.lineup_status; a failed game is listed with its numbers, kept, and left out of every aggregate.'
      product: 'game_gate_results per game and state_version; games.pbp_status, games.lineup_status'
      unit: count; share
      exceptions: 'Lineup-grain metrics also need lineup_status = ok; every other grain needs only pbp_status in (ok, ok_with_gaps).'
      test: 'Every held game has a status. The game whose rows carry one team only (P03) is broken_attribution. Every break of every game has a class (rule X-8); every spec_fault has a written proposal.'
      test_data: '37 held games'
      acceptance: [ACC-DP-TN-4, ACC-DP-TN-7, ACC-DP-TN-8]
    - id: N-FD-20
      kind: new
      tier: Shall
      requirement: 'games records which team is listed home, where the listing comes from (games.home_away_source) and whether the site is neutral. At a neutral site "home" is the home-listed team of the source of record. No metric reads a side as a venue effect: venue effects read site in (home, away, neutral), which the team-keyed view derives.'
      product: 'games.home_away_source; site in v_team_game and v_player_game'
      unit: n/a
      exceptions: 'When two sources list the sides differently the source of record wins and the disagreement is a logged discrepancy, not a second row.'
      test: 'Every held neutral-site game gives site = neutral on both team rows; every other game gives one home and one away row.'
      test_data: '37 held games, 8 of them at a neutral site'
      acceptance: [ACC-DP-TN-10]
    - id: N-SY-21
      kind: new
      tier: Shall
      requirement: 'An on-floor player is given a side through team ids, never through a team name and never by default (ALG-TN-2). A label that maps to neither side is break LIN-01 and the player is left out of both lineups.'
      product: 'lineup_home and lineup_away segments; break counter LIN-01'
      unit: count
      exceptions: 'none'
      test: 'On the held games: LIN-01 counted per game; 0 players placed on a side by default; after the rule the mirror test of N-MD-37 holds on every gate-passing game.'
      test_data: '37 held games (one has 4,040 on-floor entries with a label of neither team)'
      acceptance: [ACC-DP-TN-5, ACC-DP-TN-7]
  decisions:
    - id: DD-TN-1
      question: How does a stored table name the two teams of a game?
      options:
        - {key: home_away_and_team_id, option: 'Wide state columns _home / _away, side enums home / away / none, long tables by team_id, games as the one mapping.', verdict: chosen}
        - {key: team_a_b, option: 'team_a / team_b ordered by team id (the "lands in" text of R-MD-22).', verdict: rejected, why: 'A third naming next to the home / away of the source and of config/state_machine.yaml; needs its own mapping and flips nothing useful.'}
        - {key: all_long, option: 'No wide state: every state value one row per team.', verdict: rejected, why: 'The 32 dimensions of the state machine are already wide; score_home and score_away change together on one transition and would become two rows that can disagree.'}
        - {key: relative_in_derived, option: 'Keep columns named for one programme in state_frame and state_second because they are "derived" (R-MD-22 as written).', verdict: rejected, why: 'These two are grains of the query layer: every metric reads them. 59 columns in 16 tables and 101 metrics would stay tied to one team.'}
      choice: home_away_and_team_id
      why: 'It is what the fold already emits (37 of 37 games give the same result with team names replaced by codes) and it is what the source gives.'
    - id: DD-TN-2
      question: Where may a team-relative value appear, and how is the team chosen?
      options:
        - {key: focus_parameter, option: 'Only in focus views that take focus_team_id as a required parameter; no default anywhere in the platform.', verdict: chosen}
        - {key: msu_views, option: 'Views hard-wired to one programme (*_msu), as R-MD-35 says ("MSU views are derived").', verdict: rejected, why: 'An opponent packet or any other D-I team needs a second set of views; the hard-wired id is a constant the audit would have to excuse.'}
        - {key: default_focus_in_config, option: 'A focus view with a default team read from config.', verdict: rejected, why: 'A default leaks into every run for another team without an error. A product passes its focus on purpose.'}
      choice: focus_parameter
      why: 'One set of SQL serves MSU, a scouted opponent and any D-I team; forgetting the parameter is an error, not a wrong number.'
    - id: DD-TN-3
      question: Whose "home" is stored at a neutral site?
      options:
        - {key: source_of_record_listing, option: 'The home-listed team of the source of record, with games.home_away_source and games.neutral_site; venue effects read site.', verdict: chosen}
        - {key: by_team_id, option: 'The lower team id is home at a neutral site.', verdict: rejected, why: 'Differs from every feed: home and away scores of the source rows would have to be flipped on ingest, a new place for errors.'}
        - {key: no_home, option: 'No home at a neutral site (side_a / side_b only there).', verdict: rejected, why: 'Two schemas for one table; 8 of our 37 games are neutral-site.'}
      choice: source_of_record_listing
      why: 'The rows of the source already carry the listing; the only danger is reading side as venue, and site removes it.'
    - id: DD-TN-4
      question: What decides that a folded game may be used?
      options:
        - {key: machine_and_game_gate, option: 'The machine gate (0 untyped, 0 segment breaks, view = walk) and a game gate (both sides present, final score, possession balance, break caps).', verdict: chosen}
        - {key: machine_gate_only, option: 'The test of R-MD-35 as written: 0 untyped transitions and 0 segment breaks.', verdict: rejected, why: 'Measured: the game with one team on every row passes it with 0 and 0. The two numbers test the machine, not the game.'}
        - {key: repair_by_hand, option: 'Fix broken games by hand before folding.', verdict: rejected, why: 'A hand fix is a correction without a source; a broken game is quarantined and pulled again (OQ-DP-PV-1).'}
      choice: machine_and_game_gate
      why: 'One cheap check per game stops a broken game from passing; R-SY-06 already asks that broken games are listed and skipped.'
    - id: DD-TN-5
      question: How is an on-floor entry given a side when the source gives only a team name?
      options:
        - {key: label_map_from_rows, option: 'Build {label -> side} from the rows of the same pull that carry both a team label and a home flag; unknown label = break LIN-01, player left out.', verdict: chosen}
        - {key: name_equals_home, option: 'Compare with the home team''s name of the game record; everything else is away (the K09 harness today).', verdict: rejected, why: 'The only side asymmetry found: 1 of 37 games fails the mirror test through it, and a name join breaks R-FD-02.'}
        - {key: crosswalk_names, option: 'Resolve names through the id crosswalk (R-FD-19).', verdict: rejected, why: 'Right for production, but the crosswalk is not built; the label map needs nothing outside the pull.'}
      choice: label_map_from_rows
      why: 'Symmetric by construction and it needs no table we do not have.'
    - id: DD-TN-6
      question: May a long table hold both side and team_id?
      options:
        - {key: one_stored_both_in_view, option: 'A stored table holds the form its writer knows (the fold knows sides; a box knows team ids). The grain view shows both through games.', verdict: chosen}
        - {key: both_everywhere, option: 'Every table stores side and team_id.', verdict: rejected, why: 'Two stored forms of one fact can disagree after a correction of the game record.'}
      choice: one_stored_both_in_view
      why: 'Rule X-5. The exceptions are the fold-derived box tables, which need team_id as a key: there side is a checked convenience column (invariant in ALG-TN-5).'
  schemas:
    tables:
      games: {change: changed, columns: [home_team_id, away_team_id, neutral_site, home_away_source, pbp_status, lineup_status], note: 'three columns added; game_type takes a neutral enum'}
      state_frame: {change: changed, columns: [score_home, score_away, margin_home, team_fouls_home, team_fouls_away, bonus_home, bonus_away, timeouts_left_home, timeouts_left_away, lineup_home, lineup_away], note: '16 renames, 3 enum changes, margin and players_on_floor redefined'}
      state_second: {change: changed, columns: [score_home, score_away, margin_home, share_home_ball, share_away_ball, run_home_2min, run_away_2min], note: '16 renames, 2 enum changes'}
      game_gate_results: {change: new, columns: [game_id, pass, state_version, minority_side_share, final_score_equal, possession_diff_max, breaks_spec_fault, breaks_source_gap, breaks_label_fault, breaks_lineup, unknown_floor_labels, pbp_status, lineup_status]}
      state_transitions: {change: kept, columns: [team, changes, source_event_id], note: 'already side-valued (home, away, none)'}
      state_segments: {change: kept, columns: [dimension, dim_key, value], note: 'the 32 dimensions are already home / away'}
    views:
      v_team_game: {columns: [game_id, team_id, side, site, opp_team_id, points, opp_points]}
      focus_game: {columns: [game_id, focus_team_id, other_team_id, side_focus, site_focus, score_focus, score_other, margin_focus, win_focus]}
      focus_second: {columns: [score_focus, score_other, margin_focus, ball_focus]}
      focus_possession: {columns: [possession_key, ball_focus, points]}
    change_set: 'schema/platform_changes.yaml team_neutral: 74 flagged columns = 59 changed, 7 kept as relative to the row''s team, 8 false hits; plus 14 renames the token scan cannot see, six definition fixes, schema/global_metadata.yaml and the 25 metric inputs.'
  algorithms:
    ALG-TN-1:
      name: The audit of schema/tables for team-relative columns
      steps:
        - '1. Read every table spec of schema/tables in both YAML dialects (a column list with name, or a column map).'
        - '2. Split each column name on underscores. Flag kind name when a token is one of: msu, opp, opponent, opponents, our, their, focus, own, us, them, foe, spartan, spartans.'
        - '3. Flag kind enum when a value of the column''s enum, split the same way, holds one of those tokens.'
        - '4. Each flagged column gets exactly one disposition in schema/platform_changes.yaml: rename (to), enum (values_map), drop, keep (row_relative: true) or false_hit, each with a why.'
        - '5. Fail when a flagged column has no disposition, when a disposition names a column the scan no longer flags, when a new name or value still holds a token, or when anything the pack adds (new table, added column, view column) holds one outside its allowed layer: opp_ and own_ only in team-keyed and focus views, _focus and _other only in focus views.'
    ALG-TN-2:
      name: Side of a play row and of an on-floor entry
      steps:
        - '1. Side of a row = home when its home flag is true, away when false, none when null. No team name is read.'
        - '2. Build the label map of the pull: for every row with a non-null home flag and a non-null team label, map label -> side. A label that maps to both sides makes the whole map invalid (pbp_status = broken_attribution).'
        - '3. An on-floor entry goes to the side its label maps to. A label outside the map: count break LIN-01 and leave the player out of both lineups.'
        - '4. lineup_home and lineup_away are the player ids of each side, sorted as strings, joined with "|".'
        - '5. Nothing in steps 1-4 reads the game record''s team names or any constant.'
    ALG-TN-3:
      name: The mirror operator and the mirror test
      steps:
        - '1. mirror(input): in the game record swap the home and away team fields and the home and away points; in every play row negate a non-null home flag and swap the home and away scores. Team labels, team ids and player ids are not touched.'
        - '2. mirror(output): in every transition swap home and away in team, in every key of changes that ends in _home or _away, and in every value that is the word home or away; in every segment the same on dimension and value. Re-sort by primary key.'
        - '3. Fold the game as is and fold mirror(input) with the same config. Compute ids by cross_item.ids (no side is inside a transition id).'
        - '4. Pass when the transitions of the second fold equal mirror(output) of the first on every column, ids included, and the same for the segments. Report the count of differing cells per game and dimension.'
        - '5. Focus check: for each team T of the game build focus_game and focus_possession on both folds; pass when every cell is equal.'
    ALG-TN-4:
      name: The game gate
      steps:
        - '1. Machine gate: TRN-01 breaks = 0, SEG-01..04 breaks = 0, 0 cells differ between the state rebuilt from segments and the walk. Any miss: every break is a spec_fault and the game is not ok.'
        - '2. Sides: minority_side_share = rows of the less frequent side / rows with a side. Below gate_min_minority_side_share, or an invalid label map (ALG-TN-2 step 2): pbp_status = broken_attribution; stop.'
        - '3. Score: score_home and score_away at the last transition equal the game record. Else pbp_status = broken_score; stop.'
        - '4. Classify every break by ALG-TN-6 and count by class; lineup breaks are counted apart.'
        - '5. Possession rule: the possession counts of the two sides differ by at most gate_possession_diff_max in every period group. pbp_status = ok when the machine gate passed, source_gap + label_fault = 0 and the possession rule holds. ok_with_gaps when spec_fault <= gate_max_spec_fault_breaks and source_gap + label_fault <= gate_max_source_gap_breaks (a missed possession rule is then one more counted gap). too_many_gaps otherwise. missing when the game has no play-by-play at all.'
        - '6. lineup_status = ok when lineup breaks <= gate_max_lineup_breaks and LIN-01 = 0; unreliable otherwise; missing when no row has an on-floor list.'
        - '7. Write one game_gate_results row; set games.pbp_status and games.lineup_status from the row of the current state_version.'
    ALG-TN-5:
      name: Team-keyed and focus views
      steps:
        - '1. v_game is the wide neutral row: home_team_id, away_team_id, home_score, away_score, neutral_site.'
        - '2. v_team_game = two rows per game: (team_id = home_team_id, side = home, opp_team_id = away_team_id) and the reverse. site = neutral when neutral_site, else side. Every stat x of the own row is x; the same stat of the other row is opp_x.'
        - '3. focus_game(focus_team_id) = the v_team_game row whose team_id equals the parameter: score_focus = points, score_other = opp_points, margin_focus = points - opp_points, side_focus = side, site_focus = site, other_team_id = opp_team_id. No row when the team does not play.'
        - '4. focus_second and focus_possession map every _home / _away pair through side_focus: x_focus = x_home when side_focus = home else x_away; x_other the reverse. ball_focus = focus when the possession side equals side_focus, other when it is the other side, none when none.'
        - '5. Invariant checked by the prototype: in every fold-derived box row, side equals the side of team_id in v_game (0 rows differ).'
    ALG-TN-6:
      name: Classifying a break
      steps:
        - '1. A break kind is the text of the break counter without its numbers (for example "TRN-03 <transition> from <flow state>").'
        - '2. spec_fault: TRN-01, TRN-02, SEG-01..04, and any kind for which a legal sequence of events under the rules book exists that the machine does not type.'
        - '3. label_fault: the rows are there but a team or player label is wrong (LIN-01, an event credited to the side that cannot have made it while the other side''s matching event is present).'
        - '4. source_gap, by kind: missing_dead_ball (a substitution during live play), missing_change_of_control (a shot, rebound or turnover by the side without the ball), missing_foul_or_shot (free throws from a flow state that awards none), lineup_mismatch (on-floor list against substitution rows, or not five players), timeout_count (timeouts left below zero), other.'
        - '5. A kind is classified once, after break_review_sample_n instances (or all, when fewer) were read against the rows around them; the class and the count read are written to the results file. A kind not yet read is unclassified, and unclassified counts as a failed test.'
        - '6. Every spec_fault kind gets a proposal in schema/platform_changes.yaml (state_machine_proposals or harness_proposals) with the rule number and the fix.'
  params:
    gate_min_minority_side_share: {value: 0.25, unit: share, why: 'Two teams share the rows of a game roughly evenly; a side with under a quarter of the side-credited rows is a labelling fault, not a blowout.', evidence: 'assumed: the one broken game (P03) has share 0.00; the smallest share among the other 36 games is not measured yet - replaced by the smallest value in results/platform_test/fold_all.json'}
    gate_possession_diff_max: {value: 1, unit: count, why: 'Possessions alternate, so two sides differ by at most one per period group.', evidence: 'requirement: R-IV-15; measured: 0 of 37 games exceed it (private research fold_all_games_summary.json, 11 Nov)'}
    gate_max_spec_fault_breaks: {value: 0, unit: count per game, why: 'A spec fault is ours to fix; a game with one is not ok.', evidence: 'definition: rule X-8'}
    gate_max_source_gap_breaks: {value: 50, unit: count per game, why: 'Twice the largest count among the 36 well-labelled games (25); the broken game has 133.', evidence: 'assumed: from the research run of 11 Nov (private fold_all_games_summary.json: without lineup breaks 1 to 25 per game, median 8); replaced by the 99th percentile of results/platform_test/fold_all.json once more games are held'}
    gate_max_lineup_breaks: {value: 60, unit: count per game, why: 'Two games have 245 and 243 lineup breaks; no other game has more than 29 breaks of all kinds together.', evidence: 'assumed: from the research run of 11 Nov (602 lineup breaks, 488 of them in two games); replaced by the distribution in results/platform_test/fold_all.json'}
    break_review_sample_n: {value: 20, unit: instances per break kind, why: 'Enough rows to see whether a kind is one cause or several; the 24 kinds seen so far make at most 480 rows to read.', evidence: 'assumed: reading cost of about one minute per instance; raised when a kind turns out to be mixed'}
  acceptance:
    ACC-DP-TN-1: {metric: flagged columns without a disposition and tokens introduced by the pack, scope: 'schema/tables, schema/platform_changes.yaml (ALG-TN-1)', threshold: '0 and 0', on_fail: 'spec defect - add the disposition or rename the new column', status: met, results: tests/platform/test_platform_spec.py}
    ACC-DP-TN-2: {metric: 'untyped transitions, segment breaks, view cells that differ', scope: 'every held game, pbp_only', threshold: '0, 0 and 0 in total', on_fail: 'state-machine fault - proposal to schema/platform_changes.yaml, game not ok', status: pending_prototype, results: 'results/platform_test/fold_all.json#totals.machine_gate'}
    ACC-DP-TN-3: {metric: 'games with the same transitions and segments on a second run, and with team names replaced by codes', scope: every held game, threshold: 'all games, both', on_fail: 'a hidden dependence on order or on a name - spec fault', status: pending_prototype, results: 'results/platform_test/fold_all.json#totals.repeatable'}
    ACC-DP-TN-4: {metric: 'final score equal to the game record; largest possession difference per period group', scope: every held game that passes step 2 of the gate, threshold: 'equal in every game; difference <= gate_possession_diff_max', on_fail: 'pbp_status = broken_score, or a counted source gap', status: pending_prototype, results: 'results/platform_test/fold_all.json#totals.game_facts'}
    ACC-DP-TN-5: {metric: 'cells that differ between fold(mirror(x)) and mirror(fold(x)); players given a side by default', scope: every held game that passes the game gate, threshold: '0 and 0', on_fail: 'a side asymmetry - spec fault with a proposal', status: pending_prototype, results: 'results/platform_test/fold_all.json#mirror'}
    ACC-DP-TN-6: {metric: cells that differ between the focus views of one team on a game and on its mirror, scope: 'both teams of every held game (74 focus views)', threshold: '0', on_fail: 'view defect', status: pending_prototype, results: 'results/platform_test/fold_all.json#focus_views'}
    ACC-DP-TN-7: {metric: 'games with a gate status; status of the one-sided game', scope: every held game, threshold: 'every game has pbp_status and lineup_status; P03 = broken_attribution', on_fail: 'gate defect', status: pending_prototype, results: 'results/platform_test/fold_all.json#gate'}
    ACC-DP-TN-8: {metric: 'breaks without a class; spec_fault kinds without a proposal', scope: every break of every held game, threshold: '0 and 0', on_fail: 'read the kind (ALG-TN-6) or write the proposal', status: pending_prototype, results: 'results/platform_test/fold_all.json#breaks'}
    ACC-DP-TN-9: {metric: the machine gate and the game gate on a game the focus programme does not play, scope: 'at least 10 D-I games of other teams', threshold: 'as ACC-DP-TN-2 and ACC-DP-TN-7', on_fail: 'spec fault', status: not_yet_testable, reason: 'We hold no game between two other teams and this baseline makes no network call (OQ-DP-TN-1). Name-blindness and the mirror test are the evidence until then.'}
    ACC-DP-TN-10: {metric: 'site values of the team rows', scope: every held game, threshold: 'neutral on both rows of every neutral-site game; one home and one away row elsewhere', on_fail: 'view defect', status: pending_prototype, results: 'results/platform_test/fold_all.json#neutral_site'}
  prototype:
    tool: tools/specgen/platform/fold_all.py
    results_file: results/platform_test/fold_all.json
    status: not_run
    must_report: [per game code and in total, the machine gate, the game gate with its numbers, every break kind with class and instances read, the mirror test, the focus views, neutral-site rows, the smallest minority_side_share, fold time per game]
    proved: []
  open_questions:
    - id: OQ-DP-TN-1
      question: 'The literal test of R-MD-35 needs a game the focus programme does not play. We hold none. May we pull some?'
      recommended: 'Yes, after this baseline: 10 games between other teams from 5 conferences, with 1 overtime game and 1 neutral-site game (10 play-by-play calls and at most 10 game-record calls on the licensed source).'
      status: 'Open - needs Aldemir (network calls on a licensed source).'
    - id: OQ-DP-TN-2
      question: 'At a neutral site, which source''s home listing is the source of record when sources disagree?'
      recommended: 'The ESPN listing (R-FD-02 makes the ESPN game id the game key), written to games.home_away_source.'
      status: 'Open - a one-line answer.'
    - id: OQ-DP-TN-3
      question: 'The game with one team on every row (P03): quarantine it or repair it by hand?'
      recommended: 'Quarantine (pbp_status = broken_attribution), keep it as the test case of the gate, and pull it again once (with OQ-DP-PV-1) to see whether the source has fixed it.'
      status: 'Open.'

# =====================================================================================================================
# ITEM 2 - ONE SQL QUERY LAYER BY METRIC ID
query_layer:
  ask: 'One SQL query layer that serves every stat by its metric-registry id (Aldemir, 19 Oct).'
  live_rows: [R-EN-18, R-EN-13, R-EN-07]
  requirements:
    - id: R-EN-18
      kind: sharpens
      tier: Shall
      requirement: 'Every stat leaves the platform through one entry point, metric(metric_id, grain, keys, filters, parameters, as_of_event), run in SQL (DuckDB dialect) over the Parquet lake. A view, a dashboard, a report or a model feature asks by id only and never holds a formula of its own.'
      product: 'the entry point and its answer rows (N-EN-25)'
      unit: n/a
      exceptions: 'A metric without a binding answers status not_bound; a metric whose registry formula changed after it was bound answers stale_binding. Neither returns a value.'
      test: 'Every metric id of the named list first_bindings is answered through the entry point for every held game; coverage of the registry is counted by tier and by reason (ALG-QL-6); a second consumer that asks the same id gets the same binding_hash and the same value.'
      test_data: '37 held games; config/metrics.yaml 0.7.0 (1,591 metrics, 402 with computable_now = yes)'
      acceptance: [ACC-DP-QL-1, ACC-DP-QL-2, ACC-DP-QL-8, ACC-DP-QL-11]
    - id: N-EN-22
      kind: splits
      from: R-EN-18
      tier: Shall
      requirement: 'The lake is plain Parquet files in the layout of cross_item.layout: one partition per (table, stage, output key, game, pass), a manifest per partition and an append-only current pointer. The files are the stored truth; the SQL engine only reads them. No database file is a source of truth.'
      product: 'the lake folders, manifests and pointers'
      unit: files; bytes
      exceptions: 'none'
      test: 'A manifest on 100 % of partitions; a pointer for every (table, game, pass); building the lake twice into two empty folders gives equal file hashes for every partition.'
      test_data: '37 held games, the tables of the stage graph'
      acceptance: [ACC-DP-QL-3]
    - id: N-EN-23
      kind: splits
      from: R-EN-18
      tier: Shall
      requirement: 'One view per grain of the fixed list (frame, second, event, possession, chance, lineup_stint, player_game, team_game, game, player_season, team_season). The view text is SQL in the repo. Every binding reads exactly one grain view. Season grains are aggregations of the game grains.'
      product: 'views v_event, v_possession, v_chance, v_lineup_stint, v_player_game, v_team_game, v_game, v_player_season, v_team_season; v_second and v_frame defined, not served'
      unit: n/a
      exceptions: 'v_second and v_frame are defined (columns in schema/platform_changes.yaml) and answer no_data until state_second and state_frame exist.'
      test: 'Each served view returns one row per key of its grain (0 duplicate keys) on every held game; row counts equal the stored tables.'
      test_data: '37 held games'
      acceptance: [ACC-DP-QL-4]
    - id: N-EN-24
      kind: new
      tier: Shall
      requirement: 'A metric is served only through a binding: its id, the grain view it reads, named component aggregations (sum, count, min, max over one expression each), a value expression over components or over other metric ids, the component that is n, unit, parameters with the registry defaults, the minimum n and the interval method. The binding stores the sha256 of the registry''s formula text it was written against. A rate is numerator over denominator of summed components, so it re-aggregates from game to season without a second formula.'
      product: 'the binding file and the compiled SQL text with its binding_hash'
      unit: n/a
      exceptions: 'A metric that is not a sum-then-divide (a median, a rank, a rating fitted over a season) is bound with kind: custom and a full SQL text; it must say regrain: none.'
      test: 'Every binding compiles; its formula hash equals the registry''s; for every ratio binding the team-season value equals the ratio of the summed game components, not the mean of the game values.'
      test_data: 'the bindings of first_bindings'
      acceptance: [ACC-DP-QL-5]
    - id: N-EN-25
      kind: new
      tier: Shall
      requirement: 'Every answer row carries metric_id, grain, the grain keys, value, n, the unit of n, the interval (lo, hi, method, level), min_n_met, status, unit, binding_hash, registry_version, snapshot_id and lineage_handle. A value that cannot be computed is null with status undefined (zero denominator), no_data (no input row) or not_bound; it is never 0. A value below its minimum n is returned with status below_min_n, for description only.'
      product: 'answer rows'
      unit: per metric
      exceptions: 'Counting stats have no interval (method none). A single game has no interval for a per-possession rate (the registry calls it descriptive).'
      test: 'On the held games: 0 answers with a null field among metric_id, grain, status, binding_hash, snapshot_id, lineage_handle; every zero-denominator case answers undefined; a player without a row answers no_data.'
      test_data: '37 held games; three made-up empty and zero cases in the synthetic tests'
      acceptance: [ACC-DP-QL-6]
    - id: N-EN-26
      kind: new
      tier: Shall
      requirement: 'A session is opened with as_of_known (a UTC time, or latest) and optional pins (a state_version per game, a config hash). Opening binds one output per (table, game, pass) and gives the snapshot_id (ALG-QL-1). as_of_event is an argument of the metric call: a cut inside a game (period, seconds remaining) or a cut over games (tip time before a cut-off). A needed output that is not built is an error, never a silent fall back to another version.'
      product: 'the session binding; snapshot_id'
      unit: UTC time; (period, s)
      exceptions: 'none'
      test: 'A session opened as of a time before a correction returns the pre-correction values; opened as latest, the corrected ones; both carry different snapshot ids. A pin to a version that is not built raises the error.'
      test_data: 'the synthetic corrections of item 4'
      acceptance: [ACC-DP-QL-7, ACC-DP-PV-6]
    - id: N-DQ-20
      kind: splits
      from: R-EN-18
      tier: Shall
      requirement: 'A served value equals its reference. For a metric the L4 reproduction checked: the stored reproduction value, or the published value within the published rounding. For any other bound metric: an independent computation that shares no code with the binding.'
      product: 'the comparison table of the prototype'
      unit: per metric
      exceptions: 'A mismatch with a known cause (the source defines the stat differently; the box and the play-by-play disagree) is listed with the cause and the count; it is not hidden and not counted as a match.'
      test: 'For every metric of first_bindings: matches, mismatches and causes per game and team or player. Counting stats from the official box: 100 % equal. Ratios: within value_abs_tolerance of the independent computation.'
      test_data: '37 held games; 70 official team-box rows (both teams of 35 games); the private L4 reference values'
      acceptance: [ACC-DP-QL-2]
    - id: N-EN-27
      kind: splits
      from: R-EN-13
      tier: Should
      requirement: 'A metric call over one season of one team returns within query_time_budget_s on the laptop, and opening a session over all held games within the same budget.'
      product: 'timings in the prototype result'
      unit: s
      exceptions: 'Frame and second grains are out of scope until they are served.'
      test: 'Median and largest time of the calls of first_bindings over the held games.'
      test_data: '37 held games'
      acceptance: [ACC-DP-QL-10]
  decisions:
    - id: DD-QL-1
      question: What is the stored truth and what runs the SQL?
      options:
        - {key: parquet_truth_duckdb_reader, option: 'Parquet files are the truth; DuckDB is an in-process reader that keeps nothing.', verdict: chosen}
        - {key: duckdb_database_file, option: 'Load everything into one DuckDB database file.', verdict: rejected, why: 'One file that changes on every load cannot be content-addressed, versioned side by side or diffed; a crash can lose it.'}
        - {key: dataframes_only, option: 'pandas functions per metric, no SQL.', verdict: rejected, why: 'R-EN-18 asks for SQL; Analyst Studio exports SQL (R-AS-06); a formula in Python is one more place a number is defined.'}
        - {key: warehouse_server, option: 'A database server.', verdict: rejected, why: 'A research project on one machine; the largest play-by-play table of a season is about 75,000 rows.'}
      choice: parquet_truth_duckdb_reader
      why: 'No server, nothing to back up but files, and the views are reviewable text.'
    - id: DD-QL-2
      question: Where does the SQL of a metric live, and how is it tied to the registry's formula text?
      options:
        - {key: binding_file_compiled, option: 'A binding per metric id (components and a value expression) in one YAML file, compiled to SQL by a small compiler; the binding stores the sha256 of the registry formula text.', verdict: chosen}
        - {key: sql_file_per_metric, option: 'One hand-written SQL file per metric.', verdict: rejected, why: '1,591 files; the n, the interval, the null rule and the re-aggregation of a rate would be written again in each.'}
        - {key: sql_inside_registry, option: 'A sql field in config/metrics.yaml.', verdict: rejected, why: 'The registry is the definition people read and it changes for reasons of meaning; every wording edit would be a code change and the file is already 109,000 lines.'}
        - {key: semantic_layer_tool, option: 'An outside semantic-layer tool.', verdict: rejected, why: 'Their contracts are what the binding copies; the tools add a service, and the one read in the research does not list DuckDB as a platform.'}
      choice: binding_file_compiled
      why: 'A rate is declared once as numerator over denominator and is correct at every grain; a registry edit shows up as a stale binding, not as a silently different number.'
    - id: DD-QL-3
      question: How do as_of_known and state_version enter a query?
      options:
        - {key: session_binding, option: 'When the session opens: one output per (table, game, pass) is resolved from the pointer log and the base views are created over exactly those files.', verdict: chosen}
        - {key: where_filters, option: 'Version columns in every table and a WHERE clause in every query.', verdict: rejected, why: 'One forgotten filter mixes two versions and doubles a count without an error.'}
        - {key: pointer_join_in_view, option: 'Each view joins all versions to the pointer table.', verdict: rejected, why: 'Correct, but every query opens the footers of every version, and an as-of time still needs a session value.'}
      choice: session_binding
      why: 'Rule X-7: the version is chosen once, by the platform, and named in every answer.'
    - id: DD-QL-4
      question: Which box numbers does a team-game or player-game row show when both an official box and fold-derived counts exist?
      options:
        - {key: official_then_fold, option: 'The official box when it exists (box_source = official), else the fold-derived counts (box_source = pbp_fold); the fold-derived tables stay queryable for reconciliation.', verdict: chosen}
        - {key: fold_only, option: 'Always the fold-derived counts.', verdict: rejected, why: 'R-DQ-15: counting stats equal the official box; play-by-play misses credits the box has.'}
        - {key: official_only, option: 'Only the official box.', verdict: rejected, why: 'We hold a player box for one programme only and no box at all for a game we never pulled one for; "any D-I game from play-by-play alone" would serve nothing.'}
      choice: official_then_fold
      why: 'The best number available, with its source on the row.'
    - id: DD-QL-5
      question: What does a call return when the sample is small or empty?
      options:
        - {key: value_with_status, option: 'The value (or null) with n, min_n_met and a status; the consumer must show the status.', verdict: chosen}
        - {key: suppress, option: 'No row below the minimum n.', verdict: rejected, why: 'A missing row cannot be told from a bug; a single game is always below most minimums and is still wanted, as description.'}
        - {key: zero_fill, option: '0 when there is no data.', verdict: rejected, why: 'A 0 that means "unknown" is the commonest wrong number in sports tables.'}
      choice: value_with_status
      why: 'conventions.none_value.'
    - id: DD-QL-6
      question: Which grains are the fixed list?
      options:
        - {key: eleven, option: 'The eight of R-EN-18 plus team_game, game and player_season.', verdict: chosen}
        - {key: eight, option: 'The eight of R-EN-18 as written.', verdict: rejected, why: 'Most box metrics live at team-game and game grain; without them the commonest calls have no view.'}
        - {key: free_text, option: 'Keep the registry''s free-text level.', verdict: rejected, why: 'The field has 60 different leading tokens; nothing can be routed by it.'}
      choice: eleven
      why: 'Most box metrics live at team-game and game grain and every rating at a season grain. The one-by-one mapping of the registry''s level text to the eleven is not done yet (OQ-DP-QL-2).'
  schemas:
    tables:
      team_game_pbp: {change: new, columns: [game_id, pass, team_id, side, points, points_by_period, fgm, fga, fg3m, fg3a, ftm, fta, oreb, dreb, ast, stl, blk, tov, team_tov, pf, possessions, largest_lead, game_seconds]}
      player_game_pbp: {change: new, columns: [game_id, pass, team_id, player_id, side, seconds_played, points, fgm, fga, fg3m, fg3a, ftm, fta, oreb, dreb, ast, stl, blk, tov, pf]}
      metric_value_log: {change: new, columns: [lineage_handle, metric_id, registry_version, binding_hash, grain, entity_keys, filters, parameters, as_of_known_utc, as_of_event, snapshot_id, value, n, status, consumer, served_utc]}
      team_box: {change: kept, columns: [game_id, team_id, points, fgm, fga, fg3m, fg3a, ftm, fta, oreb, dreb, ast, stl, blk, tov, team_tov, pf, largest_lead, game_minutes]}
      player_box: {change: kept, columns: [game_id, player_id, team_id, minutes, points, fgm, fga, fg3m, fg3a, ftm, fta, oreb, dreb, ast, stl, blk, tov, pf]}
    views:
      v_event: {columns: [game_id, event_id, period, game_clock_s, order_index, side, team_id]}
      v_possession: {columns: [game_id, possession_key, possession_num, team_id, points, n_chances]}
      v_chance: {columns: [game_id, chance_key, possession_key, team_id, points]}
      v_lineup_stint: {columns: [game_id, stint_key, team_id, lineup_key, duration_s, lineup_status]}
      v_player_game: {columns: [game_id, team_id, player_id, box_source, minutes, points]}
      v_team_game: {columns: [game_id, team_id, opp_team_id, box_source, possessions, opp_possessions, points, opp_points, points_h1, points_h2]}
      v_game: {columns: [game_id, home_team_id, away_team_id, pbp_status]}
      v_team_season: {columns: [season, team_id, games, wins, points, opp_points]}
      v_player_season: {columns: [season, team_id, player_id, games, minutes]}
    binding_contract:
      fields:
        metric_id: registry id (M-...)
        kind: 'count | ratio | derived | custom'
        grain_base: 'the one grain view the components are computed on'
        components: '{name: {agg: sum | count | min | max, expr: an expression over columns of the grain view, where: optional filter}}'
        value: 'an expression over component names and over other metric ids written as m("M-..."); for count: one component'
        n: 'the component that is the sample size (attempts, possessions, games, minutes)'
        n_unit: 'unit of n'
        scale: 'multiplier applied last (1, 100)'
        unit: 'unit of the value, as the registry'
        parameters: '{name: default}; the default equals the registry''s parameter_index entry'
        min_n: 'number in n_unit below which status is below_min_n; from the registry''s min_sample text'
        interval: '{method: none | wilson | normal_by_game, level: interval_level}'
        regrain: 'additive (sum the value) | ratio_of_sums | none'
        formula_sha256: 'sha256 of the registry''s formula text at binding time'
        reference: 'the L4 check this binding is compared with, or independent'
      file: 'tools/specgen/platform/sql/metric_bindings.yaml in the prototype; config/metric_bindings.yaml is the proposed place after the freeze'
    first_bindings:
      rule: 'At least first_bindings_min ids of the box and play-by-play tiers, all checked by the L4 reproduction. The prototype may add ids; it may not drop one without writing why.'
      team_game: [M-SHOOT-002, M-SHOOT-003, M-SHOOT-004, M-SHOOT-005, M-SHOOT-006, M-SHOOT-007, M-SHOOT-008, M-SHOOT-009, M-SHOOT-010, M-SHOOT-011, M-SHOOT-012, M-SHOOT-016, M-SQ-010, M-TEFF-002, M-TEFF-003, M-TEFF-010, M-TEFF-018, M-TEFF-019, M-TEFF-020, M-TEFF-031, M-TOV-001, M-TOV-002, M-TOV-003, M-TOV-006, M-TOV-011, M-REB-001, M-REB-002, M-REB-007, M-REB-013, M-FOUL-001, M-FOUL-063, M-FOUL-064, M-FOUL-065, M-FOUL-068, M-PASS-001, M-PASS-005, M-DEF-003, M-DEF-006, M-DEF-019, M-SIT-015]
      player_game: [M-PROF-013, M-IMP-044, M-REB-010, M-PROF-004]
      team_season: [M-TEFF-043, M-TRAT-043]
  algorithms:
    ALG-QL-1:
      name: Opening a session (binding a snapshot)
      steps:
        - '1. Input: lake root, as_of_known (UTC or latest), pins (optional {game_id: state_version} and config hash).'
        - '2. For every (table, game, pass) read the pointer log. Take the last line whose known_from_utc <= as_of_known (every line for latest). A pin replaces the choice for its game and for every table downstream of the fold.'
        - '3. If the chosen output was built under an older code version or config hash than the session asks for and the newer one is not built: raise E-NOT-BUILT naming table, game and key. Never fall back.'
        - '4. Verify that each chosen partition has its manifest and that the manifest''s rows equal the file''s row count.'
        - '5. snapshot_id = sn- id of the sorted list of (table, game_id, pass, output_key).'
        - '6. Create one base view per table over exactly the chosen files (a file list, not a wildcard), with the partition keys as columns; then the grain views, the team-keyed views and the focus table macros from the SQL text of the repo.'
        - '7. Return the session with snapshot_id; every answer of the session carries it.'
    ALG-QL-2:
      name: Compiling a binding to SQL
      steps:
        - '1. Load the binding; fail with stale_binding when sha256 of the registry''s formula text differs from formula_sha256.'
        - '2. Resolve m("M-...") references to the components of the referenced bindings on the same grain_base; a reference across grain views is an error.'
        - '3. Inner query: SELECT the grain keys asked for, and each component as agg(expr) FILTER (WHERE where), FROM the grain view, WHERE the call''s filters and the as_of_event cut, GROUP BY the keys.'
        - '4. Outer query: value = scale * (value expression) with every division written as a / NULLIF(b, 0); n = the n component; status by ALG-QL-4.'
        - '5. For a coarser grain than grain_base (game to season): the same inner query grouped by the coarser keys. regrain = ratio_of_sums and additive need no other text; regrain = none refuses the coarser grain.'
        - '6. Collapse white space; binding_hash = qs- id of the text. Store the text next to the hash.'
    ALG-QL-3:
      name: 'The entry point metric(metric_id, grain, keys, filters, parameters, as_of_event)'
      steps:
        - '1. Look up the binding of metric_id; none: one answer row with status not_bound.'
        - '2. Check that grain is in the fixed list and reachable from grain_base; fill parameters from the binding defaults; refuse an unknown parameter or filter column.'
        - '3. Compile (ALG-QL-2) or take the stored text with the same binding_hash; run it in the session.'
        - '4. Add interval and status (ALG-QL-4), unit, registry_version, snapshot_id.'
        - '5. lineage_handle = mv- id of (metric_id, binding_hash, grain, the row''s keys, filters, parameters, as_of_event, snapshot_id).'
        - '6. Return the rows. When the caller is a product (a view of the views catalogue, a report), append them to metric_value_log.'
    ALG-QL-4:
      name: n, interval and status of an answer row
      steps:
        - '1. No input row for the keys: value null, n null, status no_data.'
        - '2. A zero denominator: value null, status undefined.'
        - '3. n < min_n: status below_min_n, min_n_met false; the value is still returned.'
        - '4. interval none: lo and hi null. wilson (a proportion made / attempts): the Wilson score interval at interval_level. normal_by_game (a rate over at least normal_by_game_min_games games): mean of the game values weighted by n, standard error from the spread between games; below that many games: method none.'
        - '5. Otherwise status ok.'
    ALG-QL-5:
      name: Comparing a served value with its reference
      steps:
        - '1. Reference kinds, in this order: the private L4 value for the same game and team or player; the official box value; an independent computation in pandas that reads the Parquet files directly and shares no code with the compiler.'
        - '2. A counting stat matches when equal. A ratio matches the independent computation within value_abs_tolerance and a published value within half a unit of its last published digit.'
        - '3. Each mismatch gets a cause from a fixed list: source_definition (the publisher uses another formula), box_vs_pbp (the official box and the play-by-play disagree on a count), rounding, binding_fault, unknown. binding_fault and unknown fail the test.'
        - '4. Report per metric: rows compared, matches, mismatches by cause, largest absolute difference.'
    ALG-QL-6:
      name: Coverage of the registry
      steps:
        - '1. The list: every registry entry with computable_now = yes, counted from the entries (402), by data tier.'
        - '2. For each: bound and served; bindable now (every input column exists in a served view) but not yet bound; needs a table that does not exist in the lake (name the table); needs a source we do not hold (market, external).'
        - '3. Report the four counts per tier and the ten most-needed missing tables. The same for the entries with computable_now = after_pbp, as a second table.'
  params:
    first_bindings_min: {value: 40, unit: metric ids, why: 'Enough to cover counts, ratios, derived values, two-team values and three grains.', evidence: 'decision: lead''s design of baseline 6 (at least 40 registry metrics by id)'}
    value_abs_tolerance: {value: 1.0e-9, unit: absolute difference, why: 'Two correct computations of a ratio of small integers in double precision differ by rounding of the last bits only.', evidence: 'definition: double precision keeps about 15 significant digits; values here are below 10^4'}
    interval_level: {value: 0.95, unit: probability, why: 'The level the registry''s min_sample texts and R-RR-02 use.', evidence: 'requirement: R-RR-02 (95 % interval)'}
    normal_by_game_min_games: {value: 5, unit: games, why: 'Below five games a spread between games says little; the registry replaces its planning spread "after 5 games".', evidence: 'config: config/metrics.yaml min_sample texts (the measured spread replaces the planning value after 5 games, R-VA-05)'}
    query_time_budget_s: {value: 5.0, unit: s, why: 'The budget R-EN-13 gives a common query on a laptop.', evidence: 'requirement: R-EN-13 (each query under 5 s over two games)'}
    parquet_compression: {value: zstd, unit: codec, why: 'Small files and fast decompression; the same codec everywhere keeps file hashes comparable.', evidence: 'published: DuckDB performance guide, file formats (zstd and Snappy decompress fast, gzip is slow), opened 11 Nov 2026'}
    row_group_max_rows: {value: 1000000, unit: rows, why: 'One row group per play-by-play partition (a game has about 2,000 segment rows); the cap only matters for frame tables later.', evidence: 'published: DuckDB performance guide (best row-group size 100,000 to 1,000,000 rows), opened 11 Nov 2026'}
  acceptance:
    ACC-DP-QL-1: {metric: metric ids of first_bindings answered through the entry point with status ok or a stated status on every held game, scope: 'first_bindings (at least first_bindings_min ids)', threshold: 'all ids; 0 answers not_bound or stale_binding', on_fail: 'binding missing or stale', status: pending_prototype, results: 'results/platform_test/query_layer.json#served'}
    ACC-DP-QL-2: {metric: 'rows compared with a reference: matches, mismatches by cause', scope: 'first_bindings x held games x teams or players', threshold: '0 mismatches of cause binding_fault or unknown; counting stats from the official box 100 % equal', on_fail: 'binding fault - fix the binding; unknown - find the cause before the row counts', status: pending_prototype, results: 'results/platform_test/query_layer.json#reference_check'}
    ACC-DP-QL-3: {metric: 'partitions with a manifest; (table, game, pass) with a pointer; partitions with equal file hash in two builds', scope: the prototype lake, threshold: '100 %, 100 %, 100 %', on_fail: 'writer defect (rule X-1)', status: pending_prototype, results: 'results/platform_test/query_layer.json#lake'}
    ACC-DP-QL-4: {metric: 'duplicate keys per grain view; view rows minus table rows', scope: the nine served views on every held game, threshold: '0 and 0', on_fail: 'view defect', status: pending_prototype, results: 'results/platform_test/query_layer.json#views'}
    ACC-DP-QL-5: {metric: 'bindings that compile with a matching formula hash; ratio bindings whose season value equals the ratio of summed game components', scope: every binding of the prototype, threshold: 'all and all', on_fail: 'binding or compiler defect', status: pending_prototype, results: 'results/platform_test/query_layer.json#bindings'}
    ACC-DP-QL-6: {metric: 'answer rows with a null required field; zero-denominator cases not answered undefined; empty cases not answered no_data', scope: every answer of the prototype run and the synthetic cases, threshold: '0, 0 and 0', on_fail: 'entry-point defect', status: pending_prototype, results: 'results/platform_test/query_layer.json#answers'}
    ACC-DP-QL-7: {metric: 'sessions opened as of a time, as latest and with a pin: distinct snapshot ids; error on a version that is not built', scope: 'one game with two versions (a synthetic correction)', threshold: 'three distinct ids; the error is raised', on_fail: 'session defect', status: pending_prototype, results: 'results/platform_test/query_layer.json#sessions'}
    ACC-DP-QL-8: {metric: 'registry metrics with computable_now = yes: served, bindable now, needing a missing table, needing a source we do not hold - by tier', scope: 'the 402 entries; second table for after_pbp', threshold: 'every entry is in exactly one of the four counts', on_fail: 'coverage count defect', status: pending_prototype, results: 'results/platform_test/query_layer.json#coverage'}
    ACC-DP-QL-9: {metric: 'team-id literals and team names in the SQL text of views, macros and compiled bindings', scope: 'tools/specgen/platform/sql/ and every compiled text', threshold: '0', on_fail: 'a hard-wired team - remove it', status: pending_prototype, results: 'results/platform_test/query_layer.json#neutrality'}
    ACC-DP-QL-10: {metric: 'time of a metric call and of opening a session', scope: first_bindings over the held games, threshold: 'median and largest <= query_time_budget_s (reported; a Should row)', on_fail: 'reported; look at the view that is slow', status: pending_prototype, results: 'results/platform_test/query_layer.json#timing'}
    ACC-DP-QL-11: {metric: the prototype's SQL run by DuckDB itself, scope: every view and binding, threshold: 'the same values as the shim', on_fail: 'dialect fault in the SQL text', status: not_yet_testable, reason: 'DuckDB is not installed in the test environment (import fails, 11 Nov). The prototype writes DuckDB-dialect SQL and runs it through a thin pandas / pyarrow shim; OQ-DP-QL-1.'}
  prototype:
    tool: tools/specgen/platform/query_layer.py (with tools/specgen/platform/sql/)
    results_file: results/platform_test/query_layer.json
    status: not_run
    must_report: [the engine used (DuckDB or the shim), served ids, reference check per metric with causes, coverage by tier, lake checks, view checks, timing]
    proved: []
  open_questions:
    - id: OQ-DP-QL-1
      question: 'DuckDB is not in the test environment. Install it (one wheel, no server), or keep proving the SQL through a shim?'
      recommended: 'Install it. R-EN-18 names DuckDB; a shim proves the numbers but not that the SQL text runs.'
      status: 'Open - needs the lead''s or Aldemir''s yes (a new package).'
    - id: OQ-DP-QL-2
      question: 'The registry''s level field is free text (60 different leading tokens) and its count block says 399 computable-now metrics in one place and 402 in another. Who maps level to the eleven grains?'
      recommended: 'The pack maps the 93 box and play-by-play metrics the L4 reproduction checked; the registry owner adds a grain field for the rest and fixes the count block (402 by counting entries).'
      status: 'Open.'
    - id: OQ-DP-QL-3
      question: 'We hold a player box for one programme only. Is player grain for the other team in scope now?'
      recommended: 'No. Prove player grain on the fold-derived rows of both teams and on the official box of the one programme; list the other teams'' player-box pull as a later call.'
      status: 'Open.'

# =====================================================================================================================
# ITEM 3 - ROW LINEAGE
lineage:
  ask: 'Row lineage (Aldemir, 19 Oct): from any number back to the rows, files, config and code it came from.'
  live_rows: [R-EN-19, R-DQ-04, R-EN-09, R-RR-01]
  requirements:
    - id: R-EN-19
      kind: sharpens
      tier: Shall
      requirement: 'Lineage resolves for every output row: to the partition and run that wrote it, to the code version and config hash of that run, to its input partitions and raw files with their hashes, and to its input rows by the lineage class of its table (ALG-LN-2). It is stored per partition, and per row only as the key columns of its class.'
      product: 'manifests, key columns, the resolver'
      unit: count; hops
      exceptions: 'Frame and second tables are class partition: a row resolves to its whole input partitions, not to single rows (R-DQ-04).'
      test: 'For a random lineage_sample_share of the rows of every output table (at least lineage_sample_min_rows per table): 100 % resolve to input files whose hash is re-computed from the bytes, to input rows, and to the config hash and code version, in at most lineage_max_hops hops.'
      test_data: 'the prototype lake of the 37 held games (every table of the stage graph)'
      acceptance: [ACC-DP-LN-1, ACC-DP-LN-2]
    - id: N-EN-28
      kind: splits
      from: R-EN-19
      tier: Shall
      requirement: 'Stages are declared as one graph: per stage its id, the tables and slices it reads (columns, and dimensions for state tables), the tables it writes, its lineage class, the config keys and the code files it reads. The graph has no cycle and every table has one writer. A stage is handed only its declared config keys.'
      product: 'the stage graph (lineage.stage_graph here; config/pipeline.yaml after the freeze)'
      unit: n/a
      exceptions: 'none'
      test: 'Cycle check and one-writer check pass (lint); changing a config key or a code file re-runs exactly the stages that declare it and their dependents whose input slices changed.'
      test_data: 'the stage graph; one changed config key and one changed code file in the prototype'
      acceptance: [ACC-DP-LN-3, ACC-DP-LN-4]
    - id: N-RR-11
      kind: splits
      from: R-EN-19
      tier: Shall
      requirement: 'Every execution of a stage writes one run record: run id, stage, status (ok, failed, skipped_cached), start, end, duration, cost (processor seconds, GPU seconds, external calls, money), code version, git commit, config hash, every input with its key and row count, every output with its key, row count, bytes and hashes, and break counts. One file per run, written also when the run fails.'
      product: 'stage_runs (one JSON file per run)'
      unit: s; count; bytes; $
      exceptions: 'A public copy of a run record holds counts only (the house style of the markets run record).'
      test: 'Every stage execution of the prototype has a record with all fields; a forced failure leaves a record with status failed; the sum of durations is within 10 % of the wall time of the pipeline.'
      test_data: 'the prototype run on the 37 held games'
      acceptance: [ACC-DP-LN-5]
    - id: R-EN-17
      kind: sharpens
      tier: Shall
      requirement: 'Every id follows the one id table (cross_item.ids): a play-by-play event from the source''s own play id; a derived row from the event or transition that opened it; versions and keys from content. No id holds a run number, a wall time, a clock or an ordinal. Rebuilding into an empty lake gives byte-identical partitions.'
      product: 'ids of every table; the rebuild check'
      unit: count
      exceptions: 'run_id is the one id that is not content-derived; it is never written into a row of a content partition (rule X-1).'
      test: 'Two builds of the prototype lake into two empty folders: equal ids, 0 duplicate keys, equal file hash on 100 % of content partitions. A second run over a built lake writes 0 files and takes less than skip_time_share of the first run.'
      test_data: 'the prototype lake of the 37 held games'
      acceptance: [ACC-DP-LN-6]
    - id: N-DQ-21
      kind: new
      tier: Shall
      requirement: 'A changed input is found. Verifying the lake re-computes the hash of every file named in a manifest; a mismatch names the file, and the descendants of that file (ALG-LN-4) are exactly the outputs flagged.'
      product: 'the verify command and its report'
      unit: count
      exceptions: 'none'
      test: 'Change one byte of one raw input file: exactly one hash mismatch; the flagged set equals the partitions of that game and nothing of any other game.'
      test_data: 'a copy of the prototype lake; one byte flipped in one raw file per trial, 5 trials'
      acceptance: [ACC-DP-LN-7]
    - id: N-AS-13
      kind: splits
      from: R-AS-02
      tier: Shall
      requirement: 'A served metric value explains itself: from its lineage_handle the platform returns the binding text, the snapshot, the grain rows that were aggregated, the events and transitions behind those rows and the raw play rows behind those, with the config hash and code version of every step (ALG-LN-5).'
      product: 'the "why is this number" trace'
      unit: n/a
      exceptions: 'Play text is licensed: a public trace shows row addresses and made-up text only.'
      test: 'For one value per grain of first_bindings on one held game: the trace reaches raw play rows, and the count of contributing rows at each level equals an independent count.'
      test_data: 'one held game, three metric values (team-game count, team-game ratio, player-game count)'
      acceptance: [ACC-DP-LN-8]
    - id: N-EN-29
      kind: new
      tier: Should
      requirement: 'The cost of lineage is measured: bytes of key columns, manifests and run records per output row, per table, and as a share of the partition bytes.'
      product: 'the overhead table'
      unit: bytes per row; share
      exceptions: 'none'
      test: 'Overhead reported per table; total at most lineage_overhead_cap_share of the lake''s processed bytes.'
      test_data: 'the prototype lake'
      acceptance: [ACC-DP-LN-9]
  decisions:
    - id: DD-LN-1
      question: At what grain is lineage stored?
      options:
        - {key: classes, option: 'Per partition for every table; per row only the key columns of the table''s lineage class (file, key, range, rule, partition). Everything else is resolved.', verdict: chosen}
        - {key: string_per_row, option: 'A lineage string or list of input ids on every row.', verdict: rejected, why: 'R-DQ-04 forbids it on frame tables (about 1.6 million rows per game); on aggregate rows it stores 400 ids where a filter and two hashes say the same.'}
        - {key: partition_only, option: 'Only the partition manifest.', verdict: rejected, why: 'R-EN-19 asks for the inputs of a row; "the whole game" does not explain one number.'}
        - {key: edge_table, option: 'A separate table of (output row, input row) edges for every table.', verdict: rejected, why: 'The same information as the classes at many times the rows. The prototype builds it once, as the check that the classes resolve to the same sets.'}
      choice: classes
      why: 'Resolves contradiction C1: resolved for every row, stored where it costs nothing.'
    - id: DD-LN-2
      question: What may a row of a content partition carry about the run that wrote it?
      options:
        - {key: nothing, option: 'Nothing: no run id, no time. The manifest names the first run; a later run that finds the key logs skipped_cached.', verdict: chosen}
        - {key: run_id_column, option: 'A run_id (and created time) column on every row.', verdict: rejected, why: 'Two runs on the same inputs would write different bytes: no skip by key, no byte-identical rebuild (R-EN-16).'}
      choice: nothing
      why: 'Rule X-1.'
    - id: DD-LN-3
      question: What are the input keys of a stage?
      options:
        - {key: slice_hashes, option: 'The content hash of each slice the stage declares: the columns (and dimensions) it reads, rows sorted by key.', verdict: chosen}
        - {key: upstream_output_keys, option: 'The output keys of the whole upstream partitions (R-EN-09 as written).', verdict: rejected, why: 'Any upstream change re-runs everything below it, even when the content this stage reads is the same: a re-credited foul would rebuild possessions.'}
        - {key: file_times, option: 'File modification times.', verdict: rejected, why: 'Not content: a copy or a restore changes them.'}
      choice: slice_hashes
      why: 'A stage re-runs only when something it reads changed; "untouched" is proven by an equal key, not argued.'
    - id: DD-LN-4
      question: What is hashed as the config of a stage?
      options:
        - {key: declared_keys_parsed, option: 'The parsed values of the keys the stage declares.', verdict: chosen}
        - {key: file_bytes, option: 'The bytes of the config files (the K09 harness today).', verdict: rejected, why: 'A comment or a journal entry rebuilds every game.'}
        - {key: whole_file_parsed, option: 'The whole parsed file.', verdict: rejected, why: 'A param of another item in the same file rebuilds stages that never read it.'}
      choice: declared_keys_parsed
      why: 'R-EN-16: a changed config value re-runs only the dependent stages. The guard against an undeclared read: the runner hands a stage only its declared keys.'
    - id: DD-LN-5
      question: What is the code version of a stage?
      options:
        - {key: declared_files_and_lockfile, option: 'The hashes of the code files the stage declares plus the hash of the lockfile; the git commit is stored as information.', verdict: chosen}
        - {key: git_commit, option: 'The git commit of the repo.', verdict: rejected, why: 'Every commit, of a document or of another stage, would re-key every output; a dirty tree has no commit.'}
      choice: declared_files_and_lockfile
      why: 'Only the stages whose code changed re-run. The risk is an undeclared import; the byte-identical rebuild check of R-EN-17 catches a missed dependency when it changes a result.'
    - id: DD-LN-6
      question: Which lineage standard or tool?
      options:
        - {key: own_json_openlineage_nouns, option: 'Our own JSON run records with the nouns of OpenLineage (job = stage, run, input and output datasets with a version).', verdict: chosen}
        - {key: lineage_server, option: 'An OpenLineage or data-versioning server.', verdict: rejected, why: 'A service to run for one machine; the standard defines no row-level lineage, which is what the owner asked for.'}
      choice: own_json_openlineage_nouns
      why: 'Exportable later, nothing to operate now.'
  lineage_classes:
    file: 'The row is a registered raw file. Inputs: the bytes (body_sha256), the request and every response header.'
    key: 'The row carries the id of its input row(s) in a column (events.source_play_id with events.pbp_version_id; state_transitions.trigger_event_id; state_segments.opened_by_transition_id).'
    range: 'The row carries a from key and a to key; its inputs are the rows of the input table of the same game and pass whose order key lies in [from, to) (possessions.start_transition_id, possessions.end_transition_id; the same on chances and lineup_stints).'
    rule: 'The row carries only its grain keys; its inputs are the rows the stage''s declared lineage rule selects for those keys (a SQL predicate over the input table). Box rows and metric values.'
    partition: 'No row-level inputs. The row resolves to its partition''s manifest and through it to the input partitions (frame and second tables, gate results, catalogue rows).'
  stage_graph:
    note: 'The graph of the prototype pipeline. Catalogue tables (stage_runs, stage_outputs, current_pointers, pbp_versions, pbp_version_pulls) are written by the runner around every stage, not by a stage.'
    sources: [raw_file, games, team_box, player_box]
    stages:
      - {id: pbp_register, reads: [raw_file], writes: [raw_pulls], lineage_class: file, config: [], code: [tools/specgen/platform/dplib.py]}
      - {id: pbp_parse, reads: [raw_pulls], writes: [pbp_plays], lineage_class: key, config: ['config/data_platform.yaml: pbp_versions.params.field_classes'], code: [tools/specgen/platform/pbp_versions.py]}
      - {id: pbp_diff, reads: [pbp_plays], writes: [pbp_diffs], lineage_class: key, config: ['config/data_platform.yaml: pbp_versions.params.field_classes, pbp_versions.params.rekey_clock_tol_s'], code: [tools/specgen/platform/pbp_versions.py]}
      - {id: events_from_pbp, reads: [pbp_plays, games], writes: [events], lineage_class: key, config: ['config/state_machine.yaml: pbp_mapping'], code: [tools/specgen/platform/fold_all.py, tools/state/k09_fold.py]}
      - {id: state_fold, reads: [events, games], writes: [state_transitions, state_segments], lineage_class: key, config: ['config/state_machine.yaml: dimensions, transitions, pbp_mapping, integrity, constants', 'config/invariants.yaml: constants'], code: [tools/specgen/platform/fold_all.py, tools/state/k09_fold.py]}
      - {id: game_gate, reads: [state_transitions, state_segments, games], writes: [game_gate_results], lineage_class: partition, config: ['config/data_platform.yaml: team_neutral.params'], code: [tools/specgen/platform/fold_all.py]}
      - {id: possessions_chances, reads: [state_transitions, state_segments, games], writes: [possessions, chances], lineage_class: range, dimensions: [possession_team, possession_seq, chance_seq, score_home, score_away, flow_state, period], config: [], code: [tools/specgen/platform/query_layer.py]}
      - {id: lineup_stints, reads: [state_segments, possessions, games], writes: [lineup_stints], lineage_class: range, dimensions: [lineup_home, lineup_away], config: [], code: [tools/specgen/platform/query_layer.py]}
      - {id: box_from_pbp, reads: [events, state_transitions, state_segments, possessions, games], writes: [team_game_pbp, player_game_pbp], lineage_class: rule, dimensions: [player_fouls, lineup_home, lineup_away, score_home, score_away], config: [], code: [tools/specgen/platform/query_layer.py]}
      - {id: change_sets, reads: [state_transitions, state_segments, possessions, chances, lineup_stints, team_game_pbp, player_game_pbp], writes: [change_sets, stat_corrections], lineage_class: key, config: ['config/data_platform.yaml: pbp_versions.params.ordinal_dimensions'], code: [tools/specgen/platform/pbp_versions.py]}
      - {id: metric_serving, reads: [team_game_pbp, player_game_pbp, team_box, player_box, possessions, chances, lineup_stints, events, games], writes: [metric_value_log], lineage_class: rule, config: ['config/metrics.yaml: the formula text of each bound metric'], code: [tools/specgen/platform/query_layer.py]}
  schemas:
    tables:
      stage_runs: {change: new, columns: [run_id, stage, dag_node, status, started_utc, finished_utc, duration_s, cpu_s, gpu_s, api_calls, cost_usd, code_version, git_commit, config_hash, inputs, outputs, counts, error]}
      stage_outputs: {change: new, columns: [table_name, output_key, stage, game_id, pass, code_version, config_hash, inputs, rows, bytes, content_hash, file_sha256, schema_version, first_run_id, created_utc]}
      current_pointers: {change: new, columns: [table_name, game_id, pass, output_key, supersedes_output_key, set_at_utc, known_from_utc, reason, set_by_run_id]}
      raw_pulls: {change: changed, columns: [pull_id, request_key, etag, sha256_received, sha256, body_path, fetched_at_utc, headers]}
      events: {change: changed, columns: [event_id, source_play_id, source_order_index, order_index, order_source, side, pbp_version_id, source_ref]}
      state_transitions: {change: changed, columns: [transition_id, trigger_event_id, source_event_id, order_index, supersedes_id]}
      state_segments: {change: changed, columns: [segment_id, opened_by_transition_id]}
      possessions: {change: changed, columns: [possession_id, possession_key, start_transition_id, end_transition_id]}
      chances: {change: changed, columns: [chance_id, chance_key, possession_key, start_transition_id, end_transition_id]}
      lineup_stints: {change: changed, columns: [stint_num, stint_key, start_transition_id, end_transition_id]}
      run_records: {change: kept, columns: [run_id, git_commit, config_hashes, input_hashes], note: 'one row per runner run; stage_runs is the per-stage record R-EN-19 asks for'}
    views:
      v_lineage: {columns: [table_name, output_key, stage, game_id, pass, code_version, config_hash, first_run_id, content_hash, file_sha256, is_current, known_from_utc]}
  algorithms:
    ALG-LN-1:
      name: Running one stage for one game
      steps:
        - '1. Resolve the inputs: for each declared read take the bound partition of the game and compute the slice hash over the declared columns (and dimensions), rows sorted by the table''s primary key. A raw file''s key is its body_sha256.'
        - '2. config_hash = cf- id of the parsed values of the declared config keys. code_version = cv- id of the declared code files and the lockfile.'
        - '3. output_key = ok- id of (stage id, code_version, config_hash, sorted [input name, slice hash]).'
        - '4. If a manifest for (table, output_key) exists for every table the stage writes: write a run record with status skipped_cached and stop.'
        - '5. Else run the stage with only its declared config keys. Sort each output by its primary key; assert unique keys; write the Parquet file to a temp name and rename.'
        - '6. Write the manifest: the stage_outputs row with rows, bytes, content_hash, file_sha256, the input list (name, slice hash, source partition) and first_run_id.'
        - '7. If the new key differs from the current one, append a pointer line (reason first_build, pbp_correction, config_change or code_change; known_from_utc = the largest known_at_utc of the pulls the output descends from).'
        - '8. Write the run record (status ok, or failed with the error; a failed run moves no pointer).'
    ALG-LN-2:
      name: Resolving the lineage of one row
      steps:
        - '1. Hop 1, row to partition: the row''s file path gives table, stage, output_key, game_id, pass; read the manifest.'
        - '2. Hop 2, partition to run and versions: first_run_id, code_version, config_hash, and the run record with its code files and config keys.'
        - '3. Hop 3, row to input rows by the lineage class of the table: key - read the rows the key columns name; range - read the input rows with order key in [from, to); rule - run the stage''s lineage rule for the row''s grain keys; partition - none (the answer is the input partitions); file - the raw file.'
        - '4. Repeat hop 3 on each input row until a raw play row (pbp_plays: pull, file_index) or a registry row (games) is reached.'
        - '5. Last hop, to the bytes: the raw pull''s body_path; re-compute sha256 of the file and compare with body_sha256.'
        - '6. Resolved = every hop returned at least one row (or a declared empty case: the game-opened transition has the game record as its only input), every hash re-computed equal, and the number of table-to-table hops is at most lineage_max_hops.'
    ALG-LN-3:
      name: The 1 % test
      steps:
        - '1. For every table the stage graph writes: list (game, row id) of every row of the current snapshot, sorted.'
        - '2. Draw max(lineage_sample_min_rows, ceil(lineage_sample_share x rows)) rows without replacement with a generator seeded by lineage_sample_seed and the table name (all rows when the table is smaller).'
        - '3. Resolve each by ALG-LN-2. Count resolved, and for each miss the hop that failed.'
        - '4. Cross-check: for the sampled rows of class range and rule, the set of input rows equals the set an explicit edge list gives (built once by brute force in the prototype).'
        - '5. Report per table: rows, sampled, resolved, largest hop count, cross-check equal. Pass when resolved = sampled on every table.'
    ALG-LN-4:
      name: The tamper test
      steps:
        - '1. Copy the lake. Choose a raw file and a byte offset with a seeded generator; flip one bit.'
        - '2. Verify: re-compute the sha256 of every file named in a raw manifest or a partition manifest. Expect exactly one mismatch: the chosen file.'
        - '3. Descendants: every partition whose manifest input list reaches the file''s pull, transitively. Expect: the partitions of that game, in every table.'
        - '4. Expect nothing else flagged: 0 partitions of any other game, 0 catalogue rows of other games.'
        - '5. When the changed bytes still parse: re-run the pipeline on the copy; the new pull has a new body_sha256 and is a new version, the old outputs stay under their keys (this is item 4).'
    ALG-LN-5:
      name: Why is this number what it is
      steps:
        - '1. Input: a lineage_handle. Read its resolved request (metric_value_log, or the answer row itself).'
        - '2. Show the binding: registry name, formula text, compiled SQL, binding_hash, parameters.'
        - '3. Show the snapshot: for every table read, the output_key, code_version, config_hash and known_from_utc.'
        - '4. Run the binding''s inner query without the aggregation: the grain rows that were summed, each with its component values. Their sum reproduces the value.'
        - '5. For each grain row resolve one level down by ALG-LN-2 (box row to events; possession to transitions; transition to its trigger event; event to the raw play row address).'
        - '6. Output a tree: value, components, grain rows, events, raw row addresses (pull, file_index). A public copy replaces play text by made-up text and ids by codes.'
    ALG-LN-6:
      name: Measuring the storage cost of lineage
      steps:
        - '1. Per table: compressed bytes of the lineage key columns from the Parquet column metadata; bytes of the manifest; bytes of the run records of its stage divided over its partitions.'
        - '2. Per table: (key-column bytes + manifest bytes + run-record bytes) / rows = bytes per row; the same sum / partition bytes = share.'
        - '3. Total share over the processed part of the lake. The brute-force edge list of ALG-LN-3 is measured too and reported apart: it is the cost of the rejected option of DD-LN-1.'
  params:
    lineage_sample_share: {value: 0.01, unit: share of rows, why: 'The share R-EN-19 names.', evidence: 'requirement: R-EN-19 (a random 1 % of output rows)'}
    lineage_sample_min_rows: {value: 30, unit: rows per table, why: '1 % of a small table (74 team-game rows) is less than one row; thirty rows per table make a miss rate of 10 % visible with probability 0.96.', evidence: 'definition: 1 - 0.9^30 = 0.958'}
    lineage_sample_seed: {value: 20261111, unit: seed, why: 'A fixed seed makes the sample repeatable.', evidence: 'definition: the date of this pack'}
    lineage_max_hops: {value: 5, unit: hops, why: 'The bound R-DQ-04 gives. The longest chain here is metric value, box row, event, play row, raw file: 4 hops.', evidence: 'requirement: R-DQ-04 (resolves in at most 5 hops)'}
    lineage_overhead_cap_share: {value: 0.2, unit: share of processed bytes, why: 'A planning cap: key columns are short hashes that compress poorly, manifests are small against a game.', evidence: 'assumed: not measured; replaced by the total of results/platform_test/lineage.json (ALG-LN-6)'}
    skip_time_share: {value: 0.05, unit: share of the first run's wall time, why: 'The bound R-EN-09 gives a second run over built outputs.', evidence: 'requirement: R-EN-09 (second run under 5 % of the first)'}
    tamper_trials: {value: 5, unit: trials, why: 'Five different files and offsets; each must give exactly one mismatch.', evidence: 'assumed: enough to show the rule on different games; cheap to raise'}
  acceptance:
    ACC-DP-LN-1: {metric: 'sampled rows that resolve to input files (hash re-computed), input rows, config hash and code version', scope: 'every table of the stage graph, sample of ALG-LN-3', threshold: '100 % on every table', on_fail: 'lineage defect - name the hop', status: pending_prototype, results: 'results/platform_test/lineage.json#sample_test'}
    ACC-DP-LN-2: {metric: 'largest hop count; sampled rows whose input set differs from the brute-force edge list', scope: the same sample, threshold: '<= lineage_max_hops; 0', on_fail: 'a lineage rule is wrong', status: pending_prototype, results: 'results/platform_test/lineage.json#cross_check'}
    ACC-DP-LN-3: {metric: 'cycles in the stage graph; tables with two writers; reads without a writer or source', scope: lineage.stage_graph, threshold: '0, 0 and 0', on_fail: 'graph defect', status: met, results: tests/platform/test_platform_spec.py}
    ACC-DP-LN-4: {metric: 'stages re-run after one changed config key and after one changed code file', scope: the prototype lake, threshold: 'exactly the declaring stages and the dependents whose input slices changed', on_fail: 'an undeclared dependency', status: pending_prototype, results: 'results/platform_test/lineage.json#selective_rerun'}
    ACC-DP-LN-5: {metric: 'stage executions with a complete run record; a forced failure leaves a failed record', scope: the prototype run, threshold: '100 %; yes', on_fail: 'runner defect', status: pending_prototype, results: 'results/platform_test/lineage.json#run_records'}
    ACC-DP-LN-6: {metric: 'content partitions with equal file hash in two builds; duplicate keys; files written and time share of a second run', scope: the prototype lake, threshold: '100 %; 0; 0 files and <= skip_time_share', on_fail: 'something run-dependent is inside a content partition (rule X-1)', status: pending_prototype, results: 'results/platform_test/lineage.json#rebuild'}
    ACC-DP-LN-7: {metric: 'hash mismatches found; partitions flagged outside the tampered game', scope: 'tamper_trials trials of ALG-LN-4', threshold: 'exactly 1 per trial; 0', on_fail: 'verify or descendant defect', status: pending_prototype, results: 'results/platform_test/lineage.json#tamper'}
    ACC-DP-LN-8: {metric: 'traces that reach raw play rows with row counts equal to an independent count', scope: 'three metric values on one held game', threshold: '3 of 3', on_fail: 'trace defect', status: pending_prototype, results: 'results/platform_test/lineage.json#trace'}
    ACC-DP-LN-9: {metric: lineage bytes per row and as a share of processed bytes, scope: every table of the prototype lake, threshold: 'reported; total <= lineage_overhead_cap_share (a Should row)', on_fail: 'reported; drop a key column that a rule can replace', status: pending_prototype, results: 'results/platform_test/lineage.json#overhead'}
  prototype:
    tool: tools/specgen/platform/lineage.py
    results_file: results/platform_test/lineage.json
    status: not_run
    must_report: [the 1 % test per table, the cross-check, the rebuild check, the tamper trials, the selective re-run, the overhead table, one trace with made-up text]
    proved: []
  open_questions:
    - id: OQ-DP-LN-1
      question: 'schema/tables/run_records.yaml is one row per runner run. Keep it next to the new stage_runs, or replace it?'
      recommended: 'Keep both: run_records is the run of the whole pipeline (R-RR-01, with its requirement results); stage_runs is one row per stage execution and points to it.'
      status: 'Open.'
    - id: OQ-DP-LN-2
      question: 'Money cost per stage: which rates?'
      recommended: 'The cost model of R-CS-13 owns the rates. Until it exists cost_usd is 0 for the play-by-play tier (no GPU, no external call after the pull) and the fields stay in the record.'
      status: 'Open.'

# =====================================================================================================================
# ITEM 4 - PLAY-BY-PLAY CORRECTIONS
pbp_versions:
  ask: 'Play-by-play corrections pulled again and propagated (Aldemir, 19 Oct).'
  live_rows: [R-SY-20, R-SY-12, R-SY-15]
  requirements:
    - id: R-SY-20
      kind: sharpens
      tier: Shall
      requirement: 'Play-by-play is pulled again after a game on a fixed schedule. Every pull is stored; every distinct content is a version; two versions are diffed play by play. After a change the game is re-folded whole, the rows that differ from the old output are written as a change set, and only stages and metric values whose declared inputs changed are re-run. No row that ends before the earliest changed instant differs.'
      product: 'pbp_versions, pbp_version_pulls, pbp_diffs, change_sets'
      unit: s; count
      exceptions: 'A change in cosmetic fields only (pbp_versions.params field_classes) makes a new version and re-runs nothing below the parse.'
      test: 'Synthetic corrections of eight kinds on every held game (ALG-PV-6): the incremental result equals a clean full build, 0 changed rows end before the earliest changed instant, the old version is unchanged and readable, and the changed rows resolve to the new pull.'
      test_data: '37 held games x 8 kinds x synthetic_trials_per_game_kind trials'
      acceptance: [ACC-DP-PV-3, ACC-DP-PV-4, ACC-DP-PV-5, ACC-DP-PV-7]
    - id: R-SY-12
      kind: sharpens
      tier: Shall
      requirement: 'Every pull of play-by-play is stored before parsing with its body, the sha256 of the body, every response header and the fetch time. The version id is the hash of the canonical play rows in file order; a pull whose content equals the current version makes no new version and re-runs nothing.'
      product: 'raw_pulls, pbp_version_pulls, pbp_versions'
      unit: n/a
      exceptions: 'A "not modified" answer to a conditional request stores the pull without a body and keeps the version.'
      test: 'Registering the same file twice gives two pulls, one version and 0 new partitions. Every held pull has its headers stored, or is counted as a pull without headers.'
      test_data: '37 held pulls (2 of them were saved without headers)'
      acceptance: [ACC-DP-PV-1]
    - id: N-SY-22
      kind: new
      tier: Shall
      requirement: 'Two versions of a game are diffed on the source''s own play id: plays added, removed, changed (field by field with old and new value), moved inside their second, and re-keyed. Every changed field has a class (cosmetic, timing, attribution, structural) and the diff names the earliest changed instant.'
      product: 'pbp_diffs; the summary columns of pbp_version_pulls'
      unit: count
      exceptions: 'A source play id that appears twice in one pull is break ID-01; the rows are matched by id and occurrence.'
      test: 'For every synthetic correction the diff reports exactly the edit that was made (kind, play, fields) and nothing else; the source play id is unique in every held pull, or the duplicates are counted.'
      test_data: '37 held games; the synthetic corrections'
      acceptance: [ACC-DP-PV-2]
    - id: N-SY-23
      kind: new
      tier: Should
      requirement: 'A finished game is pulled again repull_offsets_days after its end and then once in the season sweep. A pull is skipped when the source answers "not modified" to the stored ETag.'
      product: 'the pull schedule; schedule_slot on every pull'
      unit: days
      exceptions: 'A game whose pbp_status is not ok is pulled again at every slot until it is.'
      test: 'Every processed game has a pull in each due slot; a slot missed by more than a day is listed.'
      test_data: 'the pull log, once real re-pulls exist'
      acceptance: [ACC-DP-PV-8]
    - id: N-SY-24
      kind: splits
      from: R-SY-15
      tier: Shall
      requirement: 'A correction between versions never edits a stored row. The new state is the fold of the corrected version (a new state_version); the change set against the old output lists every row inserted, retracted, changed or renumbered, by row identity and content. A correction that happened inside the game is one version''s own T18 transition, not a new version.'
      product: 'a new state_version; change_sets per table'
      unit: count
      exceptions: 'none'
      test: 'For every synthetic correction: applying the change set to the old output gives the new output (0 rows differ), and the new output equals a clean full build.'
      test_data: 'the synthetic corrections'
      acceptance: [ACC-DP-PV-3]
    - id: N-SY-25
      kind: new
      tier: Shall
      requirement: 'Consumers never lose the past. The old version stays on disk and readable; a session opened as of a time before the correction returns exactly what it returned before the correction was ingested; the current pointer moves forward only by appending.'
      product: 'current_pointers; the as-of session'
      unit: n/a
      exceptions: 'none'
      test: 'File hashes of every old partition are equal before and after the correction; metric values of an as-of session before the correction are equal before and after.'
      test_data: 'the synthetic corrections'
      acceptance: [ACC-DP-PV-5, ACC-DP-PV-6]
    - id: N-DQ-22
      kind: splits
      from: R-SY-12
      tier: Shall
      requirement: 'Every served metric value that differs between the snapshot before and after a correction is written to stat_corrections with old and new value, and marked when a product had shown the old value.'
      product: 'stat_corrections'
      unit: per metric
      exceptions: 'none'
      test: 'For every synthetic correction: the stat_corrections rows equal the set of first_bindings values that differ between two full computations; 0 rows for a cosmetic change.'
      test_data: 'the synthetic corrections; first_bindings'
      acceptance: [ACC-DP-PV-9]
  decisions:
    - id: DD-PV-1
      question: What is a version of a game's play-by-play?
      options:
        - {key: canonical_rows_in_file_order, option: 'The hash of the canonical JSON of the parsed play rows, in file order.', verdict: chosen}
        - {key: body_bytes, option: 'The hash of the response bytes.', verdict: rejected, why: 'A change of white space or key order at the source would be a correction with an empty diff. The body hash is kept on the pull, where it belongs.'}
        - {key: rows_sorted_by_id, option: 'The canonical rows sorted by play id.', verdict: rejected, why: 'Order inside a second is content: the last tie-break of the order rule ORD-03 reads it, so two rows that swap can change the state.'}
      choice: canonical_rows_in_file_order
      why: 'Equal version = equal content the pipeline can see; a reverted correction returns to the old id and to outputs that already exist.'
    - id: DD-PV-2
      question: How is a play matched across two versions?
      options:
        - {key: source_play_id, option: 'By the source''s own play id (and occurrence), with a second pass that pairs an unmatched removed and added play of the same period, type, side, players and score value within rekey_clock_tol_s as re-keyed.', verdict: chosen}
        - {key: surrogate_id, option: 'By the provider''s surrogate row id.', verdict: rejected, why: 'It is assigned in the provider''s own order (equal to the play-id order in 2 of 37 files) and may change when the provider ingests a game again.'}
        - {key: position, option: 'By position in the file.', verdict: rejected, why: 'One inserted play shifts every later row: the diff would report hundreds of changes.'}
      choice: source_play_id
      why: 'The play id is the upstream counter: a clock correction keeps it, so the diff says changed. Not proven on a real re-pull: we hold none (OQ-DP-PV-1).'
    - id: DD-PV-3
      question: How is the state rebuilt after a change?
      options:
        - {key: full_refold_of_the_game, option: 'Fold the whole game from the corrected version, then diff against the old output.', verdict: chosen}
        - {key: window_refold, option: 'Re-fold only from the earliest changed instant, starting from the stored state before it.', verdict: rejected, why: 'A game folds in a median of 0.06 s; a second code path that must equal the first is risk without gain at this tier.'}
        - {key: reverse_and_replay, option: 'Reverse the old events and apply the new ones (event-sourcing reversal).', verdict: rejected, why: 'The fold is not written as reversible steps.'}
      choice: full_refold_of_the_game
      why: 'Exact by construction: the incremental result IS a full rebuild of the fold. What has to be proven incremental is the downstream skip.'
    - id: DD-PV-4
      question: What is re-scored after a change?
      options:
        - {key: declared_inputs, option: 'A stage re-runs when the hash of a slice it declares changed; a metric value is recomputed when a row of its grain view for its keys is in a change set.', verdict: chosen}
        - {key: clock_window, option: 'Everything whose clock range overlaps the changed range (R-SY-20 as written).', verdict: rejected, why: 'Measured on 36 games: a 1-point score fix changes 1.6 % of segment rows, but they span 75 % of the game clock and reach the final horn in 100 % of trials; a re-credited foul reaches the horn in 100 %. The window is most of the game and still says nothing about which tables are touched.'}
        - {key: everything, option: 'Rebuild every table of the game.', verdict: rejected, why: 'Correct and cheap at this tier, but it proves nothing about what a correction touched and will not carry to the video tier.'}
      choice: declared_inputs
      why: 'The rule of R-SY-12 ("tables that used a changed value") made exact. The clock survives as a check: nothing before the change may differ.'
    - id: DD-PV-5
      question: How are ordinals kept from spreading a change to the end of the game?
      options:
        - {key: stored_not_identity, option: 'Ordinals stay stored columns; no id holds one; a row whose only difference is an ordinal is renumber in the change set; a stage that reads boundaries but not numbers declares a slice without the ordinal columns.', verdict: chosen}
        - {key: ordinals_in_views_only, option: 'Store no ordinal; number rows in the view.', verdict: rejected, why: 'possession_id is an integer key in 23 table specs and the state machine stores possession_seq as a dimension; removing them is a larger change than this baseline may propose.'}
        - {key: accept_renumbering, option: 'Treat a renumbered row as changed.', verdict: rejected, why: 'Measured: 18.5 % of 1-second clock fixes renumber possessions to the final horn; every later possession would count as corrected.'}
      choice: stored_not_identity
      why: 'Rule X-4.'
    - id: DD-PV-6
      question: When is a finished game pulled again?
      options:
        - {key: one_eight_thirty, option: '1 day, 8 days and 30 days after the game, then a season sweep; conditional on the ETag where the source honours it.', verdict: chosen}
        - {key: daily_for_a_month, option: 'Every day for 30 days.', verdict: rejected, why: '30 calls per game against a call budget of about 1,000 (978 calls were left on 19 Oct); corrections follow the one-week reporting window.'}
        - {key: never, option: 'Only the first pull.', verdict: rejected, why: 'A published final score was wrong for two days in a known case; statistics may be changed within a week.'}
      choice: one_eight_thirty
      why: 'Three calls per game, placed just after the windows in which the official statistics may change.'
    - id: DD-PV-7
      question: What happens to a number that was already shown?
      options:
        - {key: log_and_mark, option: 'The new value is served, the change is a stat_corrections row, and the row is marked when a product had shown the old value. A stored report keeps its snapshot id and can be re-opened as it was.', verdict: chosen}
        - {key: silent_update, option: 'Serve the new value and keep nothing.', verdict: rejected, why: 'A reader cannot tell a correction from a bug, and a backtest could read a value that was not known at the time (D19).'}
      choice: log_and_mark
      why: 'R-SY-12 asks that published outputs are rebuilt and marked.'
  schemas:
    tables:
      pbp_plays: {change: new, columns: [source, game_id, pbp_version_id, file_index, source_play_id, occurrence, period, seconds_remaining, source_order_index, row_sha256, fold_input_sha256, body]}
      pbp_versions: {change: new, columns: [source, game_id, pbp_version_id, plays_sha256, fold_input_sha256, n_plays, n_duplicate_source_ids, first_pull_id, known_at_utc, canonical_rule]}
      pbp_version_pulls: {change: new, columns: [pull_id, source, game_id, fetched_at_utc, schedule_slot, http_status, body_sha256, etag, pbp_version_id, prev_pbp_version_id, is_change, diff_id, n_added, n_removed, n_changed, n_moved, change_class]}
      pbp_diffs: {change: new, columns: [diff_id, game_id, from_pbp_version_id, to_pbp_version_id, source_play_id, occurrence, change_kind, field, field_class, old_value, new_value, period_old, seconds_remaining_old, period_new, seconds_remaining_new]}
      change_sets: {change: new, columns: [change_set_id, table_name, game_id, pass, from_output_key, to_output_key, row_id, op, old_row_hash, new_row_hash, dimension, period, game_clock_ds, before_earliest_change]}
      stat_corrections: {change: new, columns: [stat_correction_id, metric_id, grain, game_id, team_id, player_id, old_value, new_value, old_n, new_n, from_snapshot_id, to_snapshot_id, cause_diff_id, was_published]}
      state_corrections: {change: kept, columns: [correction_id, target_table, target_row_key, raw_value, corrected_value], note: 'corrections made by review inside one version (R-SR-15); a re-pull correction is a new version, not a row here'}
    views:
      v_version_timeline: {columns: [source, game_id, pbp_version_id, current_from_utc, current_to_utc, first_pull_id, n_plays]}
    dimensions_read: [score_home, score_away, team_fouls_home, team_fouls_away, player_fouls, possession_team, possession_seq, chance_seq, flow_state, team_control, lineup_home, lineup_away, timeouts_left_home, timeouts_left_away]
  algorithms:
    ALG-PV-1:
      name: Registering a pull and finding its version
      steps:
        - '1. Store the response before parsing: body, sha256 of the body, every header, fetch time, request key (the raw store''s manifest line). pull_id = pl- id of (source, endpoint, request key, fetch time, body sha256).'
        - '2. Parse the body into the list of play rows. Keep file order. For each row: file_index, source_play_id, occurrence (count of earlier rows with the same play id), source_order_index (count of earlier rows with the same period and seconds remaining).'
        - '3. plays_sha256 = sha256 of the canonical JSON of the list of rows. pbp_version_id = pv- id of (source, game id, plays_sha256).'
        - '4. fold_input_sha256 = sha256 of the canonical JSON of the rows projected to the fields of class structural and attribution (field_classes), in file order.'
        - '5. If the version is new: write pbp_plays for it and a pbp_versions row with known_at_utc = this pull''s fetch time. Otherwise write neither.'
        - '6. Write the pbp_version_pulls row: this version, the previous current version, is_change. When is_change: run ALG-PV-2 and fill diff_id and the counts.'
        - '7. Count rows with occurrence > 0 as break ID-01.'
    ALG-PV-2:
      name: The diff of two versions
      steps:
        - '1. Key every row of both versions by (source_play_id, occurrence).'
        - '2. Keys only in the newer version: added. Keys only in the older: removed.'
        - '3. Second pass over added and removed: pair a removed and an added row when period, play type, side, the set of participant ids and the score value are equal and the clocks differ by at most rekey_clock_tol_s; when exactly one such pair exists for a row, both become one re-keyed row. Otherwise they stay added and removed.'
        - '4. Keys in both: compare the canonical JSON of every leaf field (dotted paths; a list of objects is compared element by element in order). Each differing leaf is one pbp_diffs row with old and new value and the class of the field.'
        - '5. A row equal in every field whose source_order_index differs, or whose rank among the rows of its second differs: moved (class structural).'
        - '6. earliest changed instant = the smallest (period, seconds elapsed in the period) over the old and new positions of every row that is added, removed, moved, re-keyed or changed in a non-cosmetic field; none when all changes are cosmetic.'
        - '7. change_class of the diff = the highest class present, in the order cosmetic, timing, attribution, structural. diff_id = df- id of (older version, newer version).'
    ALG-PV-3:
      name: From a diff to what is touched
      steps:
        - '1. Predicted dimensions (an upper bound, from predicted_dimensions): the union over the changed fields; an added, removed, moved or re-keyed play predicts every dimension the play-by-play fold writes.'
        - '2. Predicted stages: every stage of the stage graph that declares a field of a changed class or, transitively, a table written by a predicted stage.'
        - '3. The prediction is a report and a check, not the mechanism: what actually re-runs is decided by slice hashes (ALG-LN-1), what actually changed by the change set (ALG-PV-4).'
        - '4. Check: the dimensions with at least one change-set row are a subset of the predicted dimensions; a miss is a fault in field_classes or predicted_dimensions.'
    ALG-PV-4:
      name: Re-fold and change set
      steps:
        - '1. If fold_input_sha256 of the new version equals that of the old: stop; no stage below the parse has a new input key.'
        - '2. Run the pipeline of the stage graph for the game by ALG-LN-1. events_from_pbp and state_fold get new keys and run on the whole game; each later stage runs only if one of its slice hashes changed.'
        - '3. For each table with a new output key: join old and new rows on row id (cross_item.ids). insert = id only in the new; retract = id only in the old; for ids in both compare the row hash over the non-ordinal columns: different = change; equal but an ordinal column differs = renumber; equal = untouched (no row).'
        - '4. For state_segments rows of the ordinal dimensions (ordinal_dimensions) the value is the ordinal: a row whose id, from key and to key are equal and whose value differs is renumber.'
        - '5. Mark before_earliest_change on every change-set row whose interval ends before the earliest changed instant. The count must be 0 (the fold is causal).'
        - '6. A changed or renumbered transition keeps its id; its supersedes_id names the same id in the old state_version. An inserted transition has none.'
        - '7. Append the pointer lines (reason pbp_correction, known_from_utc = the new version''s known_at_utc). The old partitions are not touched.'
        - '8. Check: the old output with the change set applied equals the new output (0 rows differ).'
    ALG-PV-5:
      name: Re-scoring metric values
      steps:
        - '1. Bind two snapshots: the one current before the correction and the one after.'
        - '2. Affected keys per grain view: the grain keys (game, team, player, possession) of every change-set row of a table the view reads, with op insert, retract or change. A renumber affects only bindings that read the ordinal column.'
        - '3. For each binding of first_bindings whose grain view has affected keys: recompute the value for those keys in both snapshots.'
        - '4. Write a stat_corrections row for each key whose value or n differs; was_published = the old lineage handle is in metric_value_log.'
        - '5. Check (the proof of "untouched"): recompute every binding for every key of the game in both snapshots; the set of differing values equals the stat_corrections rows.'
    ALG-PV-6:
      name: The eight synthetic corrections
      steps:
        - '1. For each game, kind and trial t = 0 .. synthetic_trials_per_game_kind - 1: seed a generator with the text "<synthetic_seed>:<game code>:<kind>:<t>"; list the eligible rows of the kind in file order; pick one uniformly. No eligible row: record not_applicable.'
        - '2. two_to_three - eligible: a made 2-point field goal. Edit: score value 3, the shot range value of a made three of the same file, +1 on the scoring side''s score on this row and on every row after it in the canonical order.'
        - '3. remove_made_shot - eligible: a made field goal. Edit: delete the row; subtract its score value from the scoring side''s score on every later row.'
        - '4. insert_turnover - eligible: a row of a side in control with a live ball (a defensive rebound). Edit: insert after it a turnover row of that side (the commonest turnover play type of the file), same period and clock, same scores, one on-floor player of the side as participant, a new play id above the largest of the file, made-up text.'
        - '5. recredit_rebound - eligible: a rebound row with one participant and at least one other on-floor player of the side. Edit: replace the participant by the on-floor teammate with the smallest different player id.'
        - '6. insert_substitution - eligible: a foul or timeout row where the side has a player seen on the floor elsewhere in the game and not on the floor now. Edit: insert a sub-out row and a sub-in row after it (same period, clock and scores, made-up text in the source''s in / out wording); swap the two players in the on-floor lists of every later row until the next substitution row that names either.'
        - '7. clock_move - eligible: a rebound or turnover row whose previous row in the file has at least clock_move_s more seconds remaining. Edit: add clock_move_s to its seconds remaining and write the matching clock text.'
        - '8. swap_in_second - eligible: two rows next to each other in the file with the same period and seconds remaining. Edit: swap them.'
        - '9. foul_changes_team - eligible: a personal foul row with a side. Edit: negate the home flag, set team id and team label to the other side''s, replace the participant by the on-floor player of the other side with the smallest player id.'
        - '10. Each edit is applied to a copy of the rows in memory; the corrected file is written only under the private scratch root. The corrected file is registered as a new pull with a fetch time one day after the first.'
    ALG-PV-7:
      name: The four checks of a correction
      steps:
        - '1. Build A: the original version, pipeline run into a lake. Build B: the corrected version registered into the same lake (incremental, ALG-PV-4 and ALG-PV-5). Build C: the corrected version alone, into an empty lake (clean full build).'
        - '2. (a) Equality: for every table, content_hash and file hash of B''s current partition equal C''s. Any difference fails.'
        - '3. (b) Reach: per table rows changed = inserts + retracts + changes (renumbers counted apart); share recomputed = rows changed / rows in the union of old and new ids. Stages skipped by key, stages run. before_earliest_change must count 0.'
        - '4. (c) The past: file hash of every partition of A is the same before and after B; a session as of a time before B''s fetch time returns the snapshot id and the first_bindings values of A.'
        - '5. (d) Lineage: every insert and change row of every change set resolves by ALG-LN-2 to B''s pull; no retracted row is in B''s current partitions.'
        - '6. Report per kind: trials, not_applicable, (a) pass count, the distribution of share recomputed per table (minimum, quartiles, maximum), stages skipped, the share of trials whose change set reaches the last transition, dimensions touched, new breaks caused.'
    ALG-PV-8:
      name: Reading as known at a time u
      steps:
        - '1. For each game: the version current at u = the pbp_version_id of the pull with the largest fetched_at_utc <= u. No pull before u: the game is not known at u and gives no rows.'
        - '2. Bind the session to the outputs built from those versions under the logic asked for (the current code and config unless pinned), by ALG-QL-1; an output that is not built is an error.'
        - '3. A model or backtest that must not see the future passes u = the decision time (D19); nothing after u can enter, because nothing after u is bound.'
  params:
    repull_offsets_days: {value: [1, 8, 30], unit: days after the game, why: 'One day catches the first clean-up; eight days is just past the one-week window in which official statistics may be changed; thirty days catches late fixes.', evidence: 'published: College Sports Communicators summary of the NCAA statistics policy (a change is reported within one week and confirmed within 10 days), opened 11 Nov 2026; the current NCAA wording is not checked yet (OQ-DP-PV-2)'}
    field_classes:
      value:
        structural: [period, secondsRemaining, playType, isHomeTeam, teamId, team, homeScore, awayScore, scoringPlay, shootingPlay, scoreValue, playText, sourceId, source_order_index]
        attribution: ['participants[].id', shotInfo.shooter.id, shotInfo.made, shotInfo.range, shotInfo.assisted, shotInfo.assistedBy.id, shotInfo.location.x, shotInfo.location.y, 'onFloor[].id', 'onFloor[].team']
        timing: [wallclock]
        cosmetic: [id, clock, homeWinProbability, 'participants[].name', 'onFloor[].name', shotInfo.shooter.name, shotInfo.assistedBy.name, gameId, gameSourceId, gameStartDate, season, seasonType, gameType, tournament, conference, teamSeed, opponentId, opponent, opponentConference, opponentSeed]
      unit: field paths of a play row
      why: 'The class of a field is set by who reads it: structural and attribution fields are read by the fold or the box stages; timing only by the clock map; cosmetic by no stage. playText is structural because the fold reads the free-throw number, the substitution direction and the challenge outcome from it.'
      evidence: 'measured: the field reads of tools/state/k09_fold.py and the 33 fields of a play row (private research note of 11 Nov, sections A3.2 and A4); the prototype checks it by ALG-PV-3 step 4'
    predicted_dimensions:
      value:
        score_fields: {fields: [homeScore, awayScore, scoreValue, scoringPlay], dimensions: [score_home, score_away]}
        participant_fields: {fields: ['participants[].id'], dimensions: [player_fouls, lineup_home, lineup_away]}
        floor_fields: {fields: ['onFloor[].id', 'onFloor[].team'], dimensions: [lineup_home, lineup_away]}
        any_other_structural: {fields: [period, secondsRemaining, playType, isHomeTeam, teamId, team, playText, source_order_index], dimensions: all}
        shot_fields: {fields: [shotInfo.shooter.id, shotInfo.made, shotInfo.range, shotInfo.assisted, shotInfo.assistedBy.id, shotInfo.location.x, shotInfo.location.y], dimensions: none}
      unit: field group to state dimensions
      why: 'An upper bound on the dimensions a changed field can move; a score field moves only the two scores, a re-credited foul only player fouls.'
      evidence: 'measured: 108 trials per kind on 36 games - a made 2 to 3 touched score_home or score_away only, a re-credited foul player_fouls only (private research synthetic_corrections_summary.json, 11 Nov); re-measured into results/platform_test/pbp_versions.json'
    ordinal_dimensions: {value: [possession_seq, chance_seq], unit: state dimensions, why: 'Their values are counters: an inserted or removed change of control shifts every later value by one without changing what happened.', evidence: 'measured: 18.5 % of 108 one-second clock fixes changed segment rows up to the final horn, all through these two dimensions (private research synthetic_corrections_summary.json, 11 Nov)'}
    rekey_clock_tol_s: {value: 5, unit: s, why: 'A play that comes back under a new id after a re-ingest is the same play when everything but id and a few seconds of clock is equal.', evidence: 'assumed: no real re-ingest is held; set from the first real diff that shows a removed and added pair (OQ-DP-PV-1)'}
    synthetic_trials_per_game_kind: {value: 3, unit: trials, why: 'Three rows per game and kind: about 110 trials per kind over the held games, the size the research run used.', evidence: 'measured: the research run of 11 Nov used 3 trials on 36 games (108 per kind) and its medians were stable across kinds'}
    synthetic_seed: {value: 20261111, unit: seed, why: 'A fixed seed makes every trial repeatable by game code, kind and trial number.', evidence: 'definition: the date of this pack'}
    clock_move_s: {value: 2, unit: s, why: 'The size of clock fix the lead''s design names; the pilot''s real fix was 1 s.', evidence: 'decision: lead''s design of baseline 6 (a play''s clock moves by 2 s); requirement: R-SY-15 names a real 1 s fix on a pilot game'}
    fold_time_per_game_s: {value: 0.06, unit: s, why: 'The number that decides DD-PV-3: a whole game re-folds faster than any bookkeeping for a partial fold.', evidence: 'measured: median over 37 games, largest 0.21 s (private research fold_all_games_summary.json, 11 Nov); re-measured into results/platform_test/fold_all.json'}
  acceptance:
    ACC-DP-PV-1: {metric: 'the same file registered twice: pulls, versions, new partitions; held pulls with stored headers', scope: every held game, threshold: '2 pulls, 1 version, 0 new partitions; pulls without headers counted', on_fail: 'version rule defect', status: pending_prototype, results: 'results/platform_test/pbp_versions.json#versions'}
    ACC-DP-PV-2: {metric: 'synthetic corrections whose diff equals the edit made; duplicate source play ids per pull', scope: every trial of ALG-PV-6; every held pull, threshold: 'all trials; duplicates counted (0 expected)', on_fail: 'diff defect, or the match key is not unique (OQ-DP-PV-1)', status: pending_prototype, results: 'results/platform_test/pbp_versions.json#diff'}
    ACC-DP-PV-3: {metric: 'trials where the incremental result equals the clean full build (content hash and file hash of every table); trials where old + change set = new', scope: every trial of ALG-PV-6, threshold: 'all and all', on_fail: 'an undeclared dependency or a writer that is not deterministic', status: pending_prototype, results: 'results/platform_test/pbp_versions.json#equality'}
    ACC-DP-PV-4: {metric: 'change-set rows that end before the earliest changed instant; dimensions changed outside the prediction; share recomputed per table and kind', scope: every trial, threshold: '0; 0; the distribution is reported per kind', on_fail: 'the fold is not causal, or field_classes is wrong', status: pending_prototype, results: 'results/platform_test/pbp_versions.json#reach'}
    ACC-DP-PV-5: {metric: old partitions whose file hash changed, scope: every trial, threshold: '0', on_fail: 'something overwrote a version (rule X-3)', status: pending_prototype, results: 'results/platform_test/pbp_versions.json#old_version'}
    ACC-DP-PV-6: {metric: 'as-of sessions before the correction whose snapshot id or first_bindings values differ after the correction was ingested', scope: every trial, threshold: '0', on_fail: 'the past changed - session or pointer defect', status: pending_prototype, results: 'results/platform_test/pbp_versions.json#as_of_known'}
    ACC-DP-PV-7: {metric: 'inserted and changed rows that do not resolve to the new pull; retracted rows still current', scope: every trial, threshold: '0 and 0', on_fail: 'lineage or pointer defect', status: pending_prototype, results: 'results/platform_test/pbp_versions.json#lineage'}
    ACC-DP-PV-8: {metric: 'real re-pulls: games with a pull in each due slot; real diffs by class', scope: processed games after their slots, threshold: 'every due slot filled; every real diff stored', on_fail: 'schedule defect', status: not_yet_testable, reason: 'No game was pulled twice from the per-game endpoint and this baseline makes no network call (OQ-DP-PV-1). The only overlap held (5,368 shooting rows through two endpoints, one to two days apart) shows 0 rows differing.'}
    ACC-DP-PV-9: {metric: 'stat_corrections rows against the values that differ between two full computations; rows for a cosmetic change', scope: 'every trial; first_bindings', threshold: 'equal sets; 0', on_fail: 're-score defect', status: pending_prototype, results: 'results/platform_test/pbp_versions.json#stat_corrections'}
  prototype:
    tool: tools/specgen/platform/pbp_versions.py
    results_file: results/platform_test/pbp_versions.json
    status: not_run
    must_report: [per correction kind - trials, not applicable, the four checks, share recomputed per table (distribution), stages skipped, reach to the last transition, dimensions touched, new breaks; uniqueness of the source play id; pulls without headers]
    proved: []
  open_questions:
    - id: OQ-DP-PV-1
      question: 'We hold no real revision of any game. May we pull again the two games of the new season and a sample of last season, and try one conditional request to see whether the source answers "not modified" and whether that costs a call?'
      recommended: 'Yes: the two new-season games (past 8 days), five older games and the one-sided game P03; one conditional request. 9 calls. It gives the first real diff, tests the match key and settles the ETag question.'
      status: 'Open - needs Aldemir (network calls on a licensed source).'
    - id: OQ-DP-PV-2
      question: 'The one-week window comes from a 2005 summary of the NCAA statistics policy. Is it still the rule?'
      recommended: 'Read the current NCAA statisticians'' manual before the schedule is called a rule; until then repull_offsets_days is a proposal.'
      status: 'Open - a reading task, no data call.'
    - id: OQ-DP-PV-3
      question: 'The row of R-SY-20 says "re-scored only where the changed clock range overlaps". The measurement says that rule is false for counting state. Reword it?'
      recommended: 'Yes, as in schema/platform_changes.yaml requirement_text_fixes: rows that differ from a full rebuild, nothing before the earliest change, re-run by declared inputs.'
      status: 'Open - needs Aldemir (a change to a Priority requirement).'
    - id: OQ-DP-PV-4
      question: 'Two of the held pulls were saved without response headers (the pull script changed between 19 Oct and 7 Nov). One writer for every pull?'
      recommended: 'Yes: every pull goes through one raw-store writer in the house style of the markets collector; ad-hoc scripts stop. Nothing to build during the freeze; the rule is R-SY-12 above.'
      status: 'Open.'

# ---------------------------------------------------------------------------------------------------------------------
open_questions:
  - id: OQ-DP-X-1
    question: 'Older public pages carry real game ids and team names (results/state_machine_test/README.md, the fixture path of R-DQ-12). Recode them to game codes?'
    recommended: 'Leave the two pilot pages (two public broadcasts, already published), use codes for everything new, and change the fixture path of R-DQ-12 to a code.'
    status: 'Open - needs Aldemir.'

journal:
  - version: 0.1.0
    date: '2026-11-11'
    entries:
      - 'First version of baseline 6. Four items as requirement rows: 7 rows for team-neutral storage, 8 for the query layer, 7 for lineage, 7 for play-by-play corrections; each with decisions (options rejected with the reason), schemas, numbered algorithms, params and acceptance rows that name the results key their prototype writes.'
      - 'One id and version scheme for all four items (cross_item.ids, 21 ids, implemented in tools/specgen/platform/dplib.py). New against the K09 harness: transition ids without clock and order index, segment ids from the opening transition, possession and chance keys from the opening transition, the state version as the output key of the fold, input keys as slice hashes.'
      - 'Team-neutral audit made executable: 74 columns flagged in 16 of 107 table specs, each with one disposition in schema/platform_changes.yaml (59 changed, 7 kept as relative to the row''s team, 8 false hits). The lint fails when a column is flagged without a disposition or a disposition goes stale.'
      - 'Three places where this pack departs from the letter of a live row, each written as a proposal: R-SY-20 (clock range replaced by change set and declared inputs; measured), R-MD-24 (record time in the catalogue and the view, not in content rows), R-EN-09 (input keys are slice hashes). Nine contradictions between live rows are resolved under cross_item.resolutions.'
      - 'Not done here by design: the four prototypes and the generated page. Every acceptance row that needs a prototype is pending_prototype; three rows are not yet testable (a game of other teams, a real re-pull, DuckDB itself) with the reason and an open question each.'
