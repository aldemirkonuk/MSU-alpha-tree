# Live game state - fields of the groups time, score and counts (the scoreboard-heavy fields).
# Part of the live_state pack (config/live_state/core.yaml holds grades, sensors, rules, profiles, limits and the index).
# Record shape: id, group, name, type, unit, domain, none_value, stored, dimension, lands_in, lands_in_proposed,
# requirements, profile, sources, update, timing, dropout / dropout_extra, max_dwell, conflict / conflict_extra,
# invariants, derived_from / recompute_on / valid_if (derived only), consumers, freshness_needed_s, params, notes.
# Every evidence string starts with a tag of core.yaml conventions.evidence_tags (measured: / assumed: / rule: /
# decision: / requirement: / config: / definition:). core.yaml inventory lists the columns a record must name in
# lands_in and the R-SR rows it must cite; the index gives its state-machine dimension.
# Profile defaults apply unless a record overrides them: `sources`, `dropout` and `conflict` REPLACE the profile's
# list; `dropout_extra` and `conflict_extra` are appended. Every limit in a dropout rule is a param of the pack.
# Checked by: python tools/specgen/live_state/lslib.py --check config/live_state/fields_scoreboard.yaml
# Twin fields (home / away) share their blocks through YAML anchors: the home record defines &name, the away
# record reuses *name. Merge keys (<<) are not used; the strict loader refuses them.
# Shot-clock limits rest on a side run of 11 Nov 2026 (withheld shot-clock readings of the same 33 broadcasts as
# results/live_state_test/measured_sensors.json; aggregates in the notes of shot_clock_s). The run is to be folded
# into tools/specgen/live_state/measure_real.py so that the lint can re-check the numbers.
fields:
  period:
    id: LS-TIME-01
    group: time
    name: Period
    type: int
    unit: period number
    domain: '0 before the opening tip; 1 and 2 are the halves; 3 and up are extra periods (state machine range 0-9)'
    none_value: unknown
    stored: segment
    dimension: period
    lands_in: ['state_segments:period', state_frame.period, state_second.period, clock_map.period, scoreboard_ocr.period_parsed]
    requirements: [R-SR-01, R-SY-01, R-IV-16, R-IV-33, R-MD-21, R-MD-23]
    profile: counter
    sources:
      - {sensor: scorebug_ocr, role: value, modes: [live, post_blind, post_anchored], resolution: 'the period label of the bug ("1ST", "2ND", an overtime label, "HALFTIME", "FINAL"), read with every clock reading'}
      - {sensor: pbp_final, role: value, modes: [post_anchored, pbp_only], resolution: 'the period of every row; the only source in pbp_only'}
      - {sensor: pbp_feed, role: confirm, modes: [live], resolution: 'the period of every row; late (feed_delay_p50_s)'}
      - {sensor: cv_events, role: timing, modes: [live, post_blind, post_anchored], resolution: 'per frame: the toss leaving the hand of the official, or the ball at the disposal of the thrower for the second half'}
    update:
      changed_by: [T00, T01, T21]
      event_instant: 'The number steps by one at the start of the period (T01): the frame the toss leaves the hand of the official for the opening tip and for every extra period, or the frame the ball is at the disposal of the thrower for the second half (Rule 5-7.1 - a period begins when the ball becomes live). From the end of a period to that frame the field still holds the period that just ended; period_phase says it is over.'
    timing:
      provisional: {by: cv_events, p50_s: 0.5, p95_s: 1.0}
      confirmed: {by: scorebug_ocr, p50_s: 1.1, p95_s: 2.1}
      evidence: 'assumed: provisional = the toss or the throw-in seen by CV (cv_make_confirm_s and cv_event_delay_p95_s stand in for every CV event). Confirmed = the first tick of the game clock below the period length: the bug shows whole seconds above 60 s, so the tick can come up to 1 s after the start, plus frame_to_state_s. The label itself changes during the intermission, before the event, so it cannot time the start. Replaced by the clock-start delay that R-SR-17 stores for every start.'
    dropout:
      - {when: scorebug hidden, rule: HOLD_UNTIL_EVENT, grade_path: [confirmed, observed, inferred, carried], limits: {}, on_return: SNAP_AND_LOG,
         evidence: 'rule: 5-7 and 5-6.1 - a period ends only when time expires, and the next one starts no sooner than the intermission (60 s before an extra period, 900 s at half time). While the lower bound of the game-clock interval (see game_clock_s) is above 0 the period cannot have changed, so the value is held as inferred at any age. Once the bound reaches 0 it is carried until the bug or a period start is seen.'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: state record principle 7 - a bug inside a replay shows a past state; it is stored raw and never used'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE,
         evidence: 'rule: 5-6.1 - one break can hide at most one period start (a period is at least 300 s of game clock). On return the label and the clock are re-read. A label one higher than the held value with the clock already below the period length means the start was not seen: the T01 instant is then inferred as no earlier than the first reading minus (period length - clock read) and logged. A label that moved by more than one is quarantined.'}
      - {when: feed stale, rule: HOLD_UNTIL_EVENT, grade_path: [confirmed, observed], limits: {}, on_return: LATE_CORRECTION, evidence: 'definition: the bug label and the clock carry the period without the feed'}
    conflict:
      - {between: [scorebug_ocr, pbp_final], tolerance: 0, value_winner: pbp_final, timing_winner: cv_events, log_to: scoreboard_flags,
         note: 'A label that disagrees with the scorebook is an OCR or template error (the label is text, not a digit); it is flagged, never averaged.'}
    invariants: [R-IV-16, R-IV-33, SEG-01, SEG-02, TRN-02]
    consumers: [live_panel, clock_map, win_probability, possession_engine, five_min_window, media_segment, foul_trouble, team_fouls_home, team_fouls_away]
    freshness_needed_s: {win_probability: 1.0}
    notes: >-
      Blind pass: fully known from the bug label, the clock at the period length (R-IV-16) and the change of baskets
      at half time; no play-by-play is needed. pbp_only: the period of the rows. Availability, measured on the two
      tournament broadcasts at one frame per 60 s: the period label was readable in 81.4 % of samples
      (results/w3_intake/README.md). The state machine names T21 in the summary line of this dimension, but only T01
      carries period in its changes list (the authoritative one); this record follows the changes list.
  period_phase:
    id: LS-TIME-02
    group: time
    name: Phase of the period
    type: enum
    unit: n/a
    domain: 'pregame (from the game record to the first period start), period (a period is being played), intermission (a period has ended and another may follow), final (the game is over)'
    none_value: unknown
    stored: segment
    dimension: period_phase
    lands_in: ['state_segments:period_phase', timeouts.timeout_type, timeouts.video_ts_ms_start, timeouts.video_ts_ms_end, timeouts.duration_s]
    lands_in_proposed: [state_frame.period_phase, state_second.period_phase, timeouts.teams_return_video_ts_ms]
    requirements: [R-SR-16, R-IV-36, R-IV-33, R-MD-21]
    profile: status
    sources:
      - {sensor: scorebug_ocr, role: value, modes: [live, post_blind, post_anchored], resolution: '0.1 s: the clock reading 0.0 (tenths are shown under 60 s) and the labels "HALFTIME" and "FINAL"'}
      - {sensor: audio, role: timing, modes: [live, post_blind, post_anchored], resolution: 'about 0.1 s: the game-clock horn at the end of a period and the horn that ends an intermission'}
      - {sensor: cv_events, role: timing, modes: [live, post_blind, post_anchored], resolution: 'per frame: the period start (toss or throw-in), and the end of a try that was in flight at the horn'}
      - {sensor: cv_tracking, role: confirm, modes: [live, post_blind, post_anchored], resolution: 'per frame: the teams leave the floor and come back (the return time R-SR-16 asks for)'}
      - {sensor: pbp_final, role: value, modes: [post_anchored, pbp_only], resolution: '1 s: the End Period and End Game rows; the only source in pbp_only'}
      - {sensor: pbp_feed, role: confirm, modes: [live], resolution: '1 s; late (feed_delay_p50_s)'}
    update:
      changed_by: [T00, T01, T20, T21, T24]
      event_instant: 'pregame from T00. period from the period start (T01, same frame as the step of period). intermission from the period end (T20): the frame time expires - the red light or the horn (Rule 5-7.2) - or, when a try is in flight at that frame, the frame the try ends (Rule 5-7.3.a). final from T24, the same instant as the last period end when the score is not tied. T21 does not change the value: it marks that another period follows and carries the bookkeeping of the intermission (team-foul reset, timeout carry, change of baskets).'
    timing:
      provisional: {by: scorebug_ocr, p50_s: 0.1, p95_s: 0.3}
      confirmed: {by: audio, p50_s: 0.2, p95_s: 0.6}
      evidence: 'assumed: provisional = the bug clock read at 0.0 (frame_to_state_s; how far the bug trails the arena clock is not measured, R-SY-14). Confirmed = the horn (audio_delay_p50_s and audio_delay_p95_s plus frame_to_state_s). Written for the period end; final is confirmed only by the "FINAL" label or the feed. Replaced by the horn-against-bug offset measured with OQ-LS-3.'
    dropout:
      - {when: scorebug hidden, rule: HOLD_UNTIL_EVENT, grade_path: [observed, inferred, carried], limits: {}, on_return: SNAP_AND_LOG,
         evidence: 'rule: 5-7 - a period cannot end while time is left. While the lower bound of the game-clock interval is above 0 the phase period is held as inferred at any age; the horn is a second change detector while audio is present. Once the bound reaches 0 with no horn heard the value is carried until the bug returns.'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: state record principle 7 - a buzzer-beater replay shows the horn again; the phase changes once, at the live horn'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried, unknown], limits: {max_dwell.pre_overtime: 60, max_dwell.halftime: 900}, step_at: [0, max_dwell.halftime], on_return: REACQUIRE,
         evidence: 'rule: 5-6.1 - the break after a period end is the intermission itself: 60 s before an extra period, 900 s at half time (1,200 s in the NCAA tournament, max_dwell.halftime_tournament). Carried up to that bound in real time; past it the next period may have started unseen and the value is unknown until the bug or play is seen. A recording with shortened breaks has no real time across the cut: the bound is not applied and the return is a full re-acquire.'}
      - {when: feed stale, rule: HOLD_UNTIL_EVENT, grade_path: [confirmed, observed], limits: {}, on_return: LATE_CORRECTION, evidence: 'definition: the clock, the horn and the labels carry the phase without the feed; only the scorebook confirmation of final arrives late'}
    max_dwell: halftime
    conflict:
      - {between: [scorebug_ocr, audio], tolerance: 1.0, value_winner: scorebug_ocr, timing_winner: audio, log_to: scoreboard_flags,
         note: 'The horn comes straight from the arena; the bug clock trails the arena clock by a lag that is not measured yet. A gap above 1 s between the bug at 0.0 and the horn is logged.'}
      - {between: [scorebug_ocr, pbp_final], tolerance: 0, value_winner: pbp_final, timing_winner: audio, log_to: scoreboard_flags, note: 'A review can put time back after the horn (Rule 11-2): the phase returns to period by a correction (T18 on the clock), never by a silent overwrite.'}
    invariants: [R-IV-16, R-IV-33, R-IV-36, SEG-01, SEG-02, TRN-03]
    consumers: [live_panel, clock_map, degradation_level, lineup_home, lineup_away, win_probability, studio]
    freshness_needed_s: {live_panel: 1.0}
    notes: >-
      R-SR-16: each intermission is stored as a stoppage row (timeouts with timeout_type = intermission, a proposed
      value) with start and end video time and the return of the teams. The companion stoppage field holds period_end
      from T20 and intermission from T21. Blind pass: known from the clock at 0.0, the horn and the labels. pbp_only:
      from the End Period and End Game rows, with T21 and the next T01 inferred. Open point for the state machine:
      its file does not say which value T20 and T21 each write; this record fixes it as above.
  game_clock_s:
    id: LS-TIME-03
    group: time
    name: Game clock
    type: float
    unit: s
    domain: '0-1200 in a half, 0-300 in an extra period; shown in whole seconds above 60 s and in tenths below'
    none_value: unknown
    stored: clock_map
    dimension: game_clock
    lands_in: ['clock_map:game', state_frame.game_clock_s, state_second.game_clock_s, state_frame.clock_inferred]
    lands_in_proposed: [state_frame.game_clock_age_s, state_frame.game_clock_lo_s, state_frame.game_clock_hi_s]
    requirements: [R-SR-01, R-SR-17, R-SY-01, R-SY-14, R-SY-15, R-IV-05, R-IV-06, R-IV-16]
    profile: clock
    sources:
      - {sensor: scorebug_ocr, role: value, modes: [live, post_blind, post_anchored], resolution: '1 s; 0.1 s under 60 s. Read on every frame near a change and at >= 2 readings per second otherwise (R-SY-01)'}
      - {sensor: pbp_final, role: confirm, modes: [post_anchored, pbp_only], resolution: '1 s; the only source in pbp_only, where the clock exists only at play rows'}
      - {sensor: pbp_feed, role: confirm, modes: [live], resolution: '1 s; late (feed_delay_p50_s)'}
      - {sensor: audio, role: timing, modes: [live, post_blind, post_anchored], resolution: 'stop instants: whistle, period horn'}
      - {sensor: cv_events, role: timing, modes: [live, post_blind, post_anchored], resolution: 'start instants: throw-in touched inbounds, jump-ball tap, missed free throw touched (R-SR-17 trigger)'}
    update:
      changed_by: continuous
      steps_by: [T18]
      event_instant: 'The value at a frame is what the official game clock shows at that frame. It runs at 1.0 s per second between a start trigger (R-SR-17) and the next whistle or horn; it steps only by an official correction (T18, Rule 5-12).'
    timing:
      provisional: {by: scorebug_ocr, p50_s: 0.1, p95_s: 0.3}
      confirmed: {by: scorebug_ocr, p50_s: 0.1, p95_s: 0.3}
      evidence: 'assumed: one OCR read per frame near changes (one frame is 33 ms at 29.97 fps). How far the broadcast bug trails the arena clock is not measured; R-SY-14 asks for it per game.'
    dropout:
      - {when: scorebug hidden, rule: DEAD_RECKON, grade_path: [observed, inferred, carried, unknown], limits: {clock_inferred_max_s: 3, clock_carried_max_s: 30}, on_return: SNAP_AND_LOG,
         evidence: 'measured: on withheld readings of 33 broadcasts the last-status estimate is within 1 s in 96.6 % after 2 s, 93.8 % after 3 s, 88.2 % after 5 s, 76.4 % after 10 s, 59.2 % after 20 s, 44.8 % after 30 s. In real hidden stretches the clock was stopped in 72-80 % of those lasting 6-20 s, so the same rule is within 1 s in 86-87 % of them.'}
      - {when: scorebug hidden and a stop or start cue arrives, rule: CUE_RECKON, grade_path: [inferred, carried, unknown], limits: {clock_inferred_max_s: 3, clock_carried_max_s: 30}, on_return: SNAP_AND_LOG,
         evidence: 'assumed: an unseen stop or start is the main error of blind reckoning (after 2 s without a reading the estimate is off by more than 1 s in 2.6 % of cases when the clock was running and in 4.6 % when it was stopped: measured_sensors.json clock_carry_on_withheld_readings). The gain of cues is swept in the replay harness (ACC-LS-H4): with stand-in stop, start and reset cues at recall 0.8 the estimate is within 1 s in 94.7 % at 4 s, 92.3 % at 6-10 s and 88.2 % at 11-20 s after the last reading, against 90.6 %, 81.7 % and 70.0 % with no cue (results/live_state_test/harness.json). A cue re-anchors the estimate and restarts the carried limit; the inferred limit stays tied to the last reading (a claim restarted at the cue fell below the promise in the replay). Measured once audio is (OQ-LS-3)'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: state record principle 7 - a clock visible inside a replay is a past clock: stored raw, never used. The live clock is stopped during most replays (dead ball); when a replay runs over live play the held value keeps its interval'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE, evidence: 'rule: 5-11.3 - the clock is stopped when a timeout is granted (media or charged); the pre-break value is exact until play resumes'}
      - {when: period end reached while hidden, rule: MAX_DWELL, grade_path: [inferred, unknown], limits: {}, on_return: SNAP_AND_LOG, evidence: 'definition: a dead-reckoned clock is floored at 0; at 0 without an observed horn (T20) the value is unknown, never a negative or a new period'}
    conflict:
      - {between: [scorebug_ocr, pbp_final], tolerance: 1.0, value_winner: scorebug_ocr, timing_winner: scorebug_ocr, log_to: scoreboard_flags,
         note: 'The scorebook gives a whole second typed by the scorer (entry jitter 1.05 s); the bug is the direct display. A gap above 1 s is logged, never averaged.'}
      - {between: [scorebug_ocr, human], tolerance: 0, value_winner: human, timing_winner: scorebug_ocr, log_to: state_corrections, note: 'review answers'}
    conflict_extra: []
    invariants: [R-IV-05, R-IV-06, R-IV-16, CLK-01, CLK-02]
    consumers: [live_panel, win_probability, clock_map, shot_clock_check, end_of_period_windows, market_join]
    freshness_needed_s: {win_probability: 1.0, live_panel: 0.5, end_of_period_windows: 0.5}
    params:
      clock_upward_confirm_reads: {value: 2, unit: readings, why: 'an upward step of the clock is an official correction only when it persists for this many consecutive readings; a single higher read is an OCR misread and is rejected (R-IV-05: every upward step needs a state_corrections row)', evidence: 'assumed: two reads, as for scorebug_up_after_reads (1.7 % of reads are rejected, so two wrong reads in a row are near 0.03 % if misreads are independent). One real correction seen so far (4:06 then 4:07, results/w3_intake/README.md). Replaced by the count of upward steps in the replay harness (ACC-LS-H2)'}
      clock_tenths_below_s: {value: 60.0, unit: s, why: 'below this the bug shows tenths and the tolerance of a reading is 0.1 s; above it the tolerance is 1 s', evidence: 'measured: results/w3_intake/scorebug_summary.md (tenths shown under 1:00; Rule 1-18.2)', mirrors: 'config/invariants.yaml:constants.tenths_display_below_s'}
    notes: >-
      The estimate always carries a guaranteed interval [lo, hi] = [last reading - elapsed video time, last reading]
      (floored at 0): the clock cannot rise and cannot fall faster than real time. While observed, lo = hi. Consumers
      that can use an interval (win probability) read it when the grade is carried. In pbp_only the clock is known
      only at play rows and is unknown between them. Real hidden stretches: median 6 s, p90 19 s, p99 110 s, about 73
      per game; 4.5 % of game-clock time (median game) is never shown on the bug. Blind pass: fully known
      wherever the bug shows it; the play-by-play adds only a check.
  game_clock_running:
    id: LS-TIME-04
    group: time
    name: Game clock running
    type: enum
    unit: n/a
    domain: 'running, stopped'
    none_value: unknown
    stored: segment
    dimension: game_clock_running
    lands_in: ['state_segments:game_clock_running', state_frame.clock_running, state_second.clock_running_share, clock_map.running]
    lands_in_proposed: [restarts.clock_start_trigger, restarts.clock_start_delay_s]
    requirements: [R-SR-17, R-IV-05, R-IV-06, R-IV-35, R-SB-01, R-SY-14]
    profile: status
    sources:
      - {sensor: scorebug_ocr, role: value, modes: [live, post_blind, post_anchored], resolution: 'two readings in a row: the digits tick or they do not. One display step is 1 s above 60 s and 0.1 s below'}
      - {sensor: audio, role: timing, modes: [live, post_blind, post_anchored], resolution: 'about 0.1 s: the whistle or horn that stops the clock (Rule 5-11)'}
      - {sensor: cv_events, role: timing, modes: [live, post_blind, post_anchored], resolution: 'per frame: the start triggers of R-SR-17 (throw-in touched inbounds, jump-ball tap, missed free throw touched) and a made field goal in the last 59.9 s'}
      - {sensor: pbp_final, role: confirm, modes: [post_anchored, pbp_only], resolution: '1 s: the events that stop the clock; in pbp_only the flag is inferred between rows'}
      - {sensor: pbp_feed, role: confirm, modes: [live], resolution: '1 s; late'}
    update:
      changed_by: [T00, T01, T05, T06, T08, T09, T13, T14, T15, T16, T20, T23]
      event_instant: 'running from the frame of a legal start (Rule 5-10.2): a thrown-in ball touched inbounds, a tossed ball legally tapped, a missed last free throw touched by a player. stopped from the frame of the whistle or horn (Rule 5-11), and from the frame the ball is through the net on a made field goal with 59.9 s or less left in the second half or an extra period (Rule 2-10.12, R-IV-06). The bug shows the change later; that delay is stored, not hidden (R-SR-17, R-SY-14).'
    timing:
      provisional: {by: audio, p50_s: 0.2, p95_s: 0.6}
      confirmed: {by: scorebug_ocr, p50_s: 1.1, p95_s: 2.1}
      evidence: 'assumed: provisional = the whistle (audio_delay_p50_s and audio_delay_p95_s plus frame_to_state_s); a start seen by CV comes at 0.5 s and 1.0 s (cv_make_confirm_s, cv_event_delay_p95_s). Confirmed = the digits: a start shows within one display step and a stop needs one missed step, 1 s above 60 s and 0.1 s below, plus frame_to_state_s. Replaced by the clock-start delay of R-SR-17 and the whistle timing of OQ-LS-3.'
    dropout:
      - {when: scorebug hidden, rule: CARRY, grade_path: [observed, inferred, carried, unknown], limits: {clock_inferred_max_s: 3, clock_carried_max_s: 30}, on_return: SNAP_AND_LOG,
         evidence: 'measured: keeping the last status is what the dead-reckoned clock does, and on withheld readings it is within 1 s in 96.6 % after 2 s, 93.8 % after 3 s and 88.2 % after 5 s (measured_sensors.json clock_carry_on_withheld_readings). In real hidden stretches the clock was stopped in 27 % of those lasting 1-2 s, 46 % of 3-5 s, 72 % of 6-10 s and 80 % of 11-20 s: a hidden bug is itself a sign of a dead ball, but not one strong enough to flip the flag without a cue.'}
      - {when: scorebug hidden and a stop or start cue arrives, rule: CUE_RECKON, grade_path: [inferred, carried, unknown], limits: {clock_inferred_max_s: 3, clock_carried_max_s: 30}, on_return: SNAP_AND_LOG,
         evidence: 'assumed: a whistle sets stopped and a seen touch or tap sets running at the cue frame; for this flag the inferred limit restarts there (the cue observes the flag; with stand-in cues the inferred flag was right in 91.6 % with no cue and 96.0 % with cues at recall 0.8 of hidden seconds in the replay harness). Whistle recall is a planning value (whistle_recall). Replaced by the measured recall and timing of OQ-LS-3 and by the cue sweep of the replay harness (ACC-LS-H4).'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: state record principle 7 - a clock ticking inside a replay is a past clock. Most replays run during a dead ball, so the held value is usually stopped.'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE, evidence: 'rule: 5-11.3 - the clock is stopped when a timeout is granted and stays stopped until the next legal start; on return the flag is re-read from two readings'}
      - {when: 'running held until the clock interval reaches 0', rule: MAX_DWELL, grade_path: [inferred, carried, unknown], limits: {}, on_return: SNAP_AND_LOG, evidence: 'rule: 5-7.3 - the clock cannot run past 0.0. When the lower bound of the game-clock interval reaches 0 a held running flag ends: the value is unknown until the horn or the bug is seen.'}
    conflict:
      - {between: [scorebug_ocr, audio], tolerance: 1.0, value_winner: scorebug_ocr, timing_winner: audio, log_to: scoreboard_flags,
         note: 'A whistle with the bug clock still ticking more than 1 s later is flag type (g) of R-SB-01 (game clock not stopped): a timing-mistake candidate under Rule 5-12, kept as a flag.'}
      - {between: [scorebug_ocr, cv_events], tolerance: 1.0, value_winner: scorebug_ocr, timing_winner: cv_events, log_to: scoreboard_flags,
         note: 'A legal touch with no tick within clock_start_flag_delay_s is the other half of type (g) (game clock not started).'}
    invariants: [R-IV-05, R-IV-06, R-IV-11, R-IV-35, CLK-01, CLK-02, SEG-01, SEG-02]
    consumers: [game_clock_s, live_panel, lineup_home, lineup_away, stint_length_s, win_probability, clock_map]
    freshness_needed_s: {game_clock_s: 0.5, live_panel: 1.0}
    params:
      clock_start_flag_delay_s: {value: 1.0, unit: s, why: 'a clock that starts or stops more than this long after its trigger is flagged as a timing-mistake candidate', evidence: 'requirement: R-SR-17 (delays above 1.0 s are flagged; Rule 5-12)'}
    notes: >-
      Measured base rate, 33 broadcasts: of 119,909 pairs of consecutive seconds with a reading, the clock ran in
      58.5 % and stood in 41.1 % (0.35 % other). The exact start and stop instants live in clock_map (segment
      boundaries); this flag is its status dimension. Blind pass: known from the digits, the whistle and CV; nothing
      needs the play-by-play. pbp_only: inferred - running between two rows on different clock seconds. Open point
      for the state machine: the start on a missed free throw is the touch (Rule 5-10.2.c), but the nearest
      transitions that list this dimension are the rebounds T06 and T08 (control), which come later; and T17 can
      follow live play without a transition that stops the clock.
  shot_clock_s:
    id: LS-TIME-05
    group: time
    name: Shot clock
    type: float
    unit: s
    domain: '0-30; shown in whole seconds, in tenths below 5 s. Holds "off" while shot_clock_status is off and "unknown" when it runs but cannot be read or reckoned'
    none_value: 'off'
    stored: clock_map
    dimension: shot_clock
    lands_in: ['clock_map:shot', state_frame.shot_clock_s, state_second.shot_clock_s, scoreboard_ocr.shot_clock_parsed_s, shot_clock_resets.value_after_s, shot_clock_resets.cause]
    lands_in_proposed: [state_frame.shot_clock_age_s]
    requirements: [R-SR-01, R-SY-01, R-SY-14, R-IV-07, R-IV-20, R-IV-21, R-IV-22, R-MB-07, R-SB-01]
    profile: clock
    sources:
      - {sensor: scorebug_ocr, role: value, modes: [live, post_blind, post_anchored], resolution: '1 s; 0.1 s below 5 s. Readable in 79 % of the seconds that have a game clock (82 % with more than 30 s left in the period)'}
      - {sensor: cv_events, role: timing, modes: [live, post_blind, post_anchored], resolution: 'per frame: the cause of a reset or a start - change of control, ring contact followed by offensive control, throw-in touched inbounds'}
      - {sensor: cv_events, role: fallback, modes: [live, post_blind, post_anchored], resolution: 'the value the reset table gives for a seen cause (30, 20, the greater of 20 and the time left, or no reset), used while the bug cannot be read'}
      - {sensor: audio, role: timing, modes: [live, post_blind, post_anchored], resolution: 'about 0.1 s: the whistle that stops it and the shot-clock horn at 0 (a horn of its own, Rule 2-11.3)'}
      - {sensor: pbp_final, role: confirm, modes: [post_anchored, pbp_only], resolution: '1 s: every reset read on the bug must map to an event (R-IV-07). In pbp_only the value is a reconstruction by rule, never a reading'}
    update:
      changed_by: continuous
      steps_by: [T03, T05, T06, T08, T11, T13, T14, T19]
      event_instant: 'The value at a frame is what the official shot clock shows at that frame. It runs at 1.0 s per second from a start (Rule 5-10.3) to the next whistle. It is set by the reset table (Rule 2-11.6; config/vocab/shot_clock_resets.yaml, 41 causes: 30, flat 20, the greater of 20 and the time left, or no reset) at the frame of the cause, not at the frame the display changes.'
    timing:
      provisional: {by: scorebug_ocr, p50_s: 0.1, p95_s: 0.3}
      confirmed: {by: scorebug_ocr, p50_s: 0.1, p95_s: 0.3}
      evidence: 'assumed: one read of the frame (frame_to_state_s, frame_to_state_p95_s). How late the bug shows a reset is not measured on the broadcasts and is counted as 0; R-SY-14 asks it per game and field. The arena shot clock, where the camera shows it, reset between 0.97 s before and 0.47 s after the ball was through the net on 9 makes, at ring contact (measured: results/w3_intake/made_basket_lag.md). Measured per run (K23).'
    dropout:
      - {when: 'scorebug hidden, CV watching the ball', rule: DEAD_RECKON, grade_path: [observed, inferred, carried, unknown], limits: {shot_clock_inferred_max_s: 1, shot_clock_carried_max_s: 10}, on_return: SNAP_AND_LOG,
         evidence: 'measured: side run of 11 Nov 2026 on withheld shot-clock readings of the same 33 broadcasts (numbers in the notes below; not yet in measured_sensors.json). With no reset inside the window the last-status estimate is within 1 s in 94.9 % after 2 s, 91.2 % after 3 s and 85.0 % after 5 s, so 3 s meets clock_inferred_promise only while a reset would be seen. That CV sees every reset is itself assumed until R-IV-07 is checked on gold-v1.'}
      - {when: scorebug hidden and a reset cause or a stop or start cue is seen, rule: CUE_RECKON, grade_path: [inferred, carried, unknown], limits: {shot_clock_inferred_max_s: 1, shot_clock_carried_max_s: 10}, on_return: SNAP_AND_LOG,
         evidence: 'assumed: a seen cause sets the value the reset table gives (Rule 2-11.6) at the cause frame and restarts the inferred limit; a whistle stops it. CV event timing is not measured on MSU film. Replaced by the reset-time error against the bug on gold-v1 (R-IV-07) and the cue sweep of the replay harness (ACC-LS-H4).'}
      - {when: 'scorebug hidden, nothing watching for a reset (tight shot, bench, ball lost)', rule: DEAD_RECKON, grade_path: [observed, inferred, carried, unknown], limits: {shot_clock_inferred_max_s: 1, shot_clock_carried_max_s: 10}, on_return: SNAP_AND_LOG,
         evidence: 'measured: replay harness (run cues_0.0_0.0_0.0) - with the whole bug hidden and no cue the reckoned shot clock is within 1 s in 96.0 % after 1 s, 81.5 % after 2 s and 76.6 % after 3 s. One second is a claim even with nothing watching for a reset; from the second second on the value is carried. The side run of 11 Nov gave 88.1 % after 2 s and 49.3 % after 10 s.'}
      - {when: shot slot unreadable while the game clock is read, rule: FOLLOW_FIELD, grade_path: [observed, inferred, carried, unknown], limits: {shot_clock_inferred_max_s: 1, shot_clock_carried_max_s: 10}, on_return: SNAP_AND_LOG,
         evidence: 'measured: replay harness, 33 broadcasts (results/live_state_test/harness.json, runs slot_*) - following the game clock is within 1 s in 96.0 % of hidden slot seconds after 1 s with no reset cue at all, and in 84.9 % after 2 s and 81.4 % after 3 s; with every reset the bug shows delivered as a cue 99.3 %, 91.5 % and 89.5 %. The side run of 11 Nov gave 92.8 % after 2 s and 90.4 % after 5 s for windows with no reset inside; the replay counts every window. Beyond 1 s it reaches the promise only at 2 s and only if every reset the bug shows is delivered as a cue (an assumption), so one limit of 1 s is kept for the slot and for the whole bug.'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: state record principle 7 - a shot clock inside a replay is a past clock'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE, evidence: 'rule: 2-11.6.a.3 - a charged or media timeout does not reset the shot clock; the value before the break is exact until play resumes'}
      - {when: held value older than a full shot-clock period, rule: MAX_DWELL, grade_path: [carried, unknown], limits: {max_dwell.shot_clock_period: 30}, on_return: SNAP_AND_LOG, evidence: 'rule: 2-11.1 and 9-11.1 - no value can stand for more than 30 s of running clock without a reset, a horn or a whistle; a chain of cue-based estimates that reaches this age has missed one of them'}
    max_dwell: shot_clock_period
    conflict:
      - {between: [scorebug_ocr, cv_events], tolerance: 1.0, value_winner: scorebug_ocr, timing_winner: cv_events, log_to: scoreboard_flags,
         note: 'A reset on the bug with no cause seen, or a cause with no reset, is flag type (h) of R-SB-01. R-MB-07: a reset to 20 after a miss says the try touched the ring when CV could not see it.'}
      - {between: [scorebug_ocr, pbp_final], tolerance: 1.0, value_winner: scorebug_ocr, timing_winner: scorebug_ocr, log_to: scoreboard_flags, note: 'The scorebook does not record the shot clock; it only explains resets.'}
    invariants: [R-IV-07, new-IV-01, new-IV-02, new-IV-03, new-IV-04, new-IV-05, R-IV-22, CLK-02]
    consumers: [live_panel, shot_clock_status, shot_clock_off, end_of_period_windows, win_probability, possession_team, expected_points, possession_engine]
    freshness_needed_s: {live_panel: 0.5, expected_points: 1.0}
    params:
      shot_clock_carried_max_s: {value: 10.0, unit: s, why: 'a held or reckoned shot clock is dropped to unknown this long after the last reading or cue: by then a blind estimate is right less than half the time', evidence: 'measured: side run of 11 Nov 2026 on the 33 broadcasts - within 1 s in 49.3 % after 10 s and 27.9 % after 20 s (withheld shot-clock readings; not yet in measured_sensors.json)'}
      shot_clock_inferred_max_s: {value: 1.0, unit: s, why: 'a shot clock that follows the game clock (slot unreadable) or is dead-reckoned (bug away) is graded inferred only this long after its last READING, whether or not CV watches for a reset cause; a reset cue re-anchors the estimate but does not restart this limit. Was 5 s (slot) and 3 s (bug away) until the replay of 20 Nov', evidence: 'measured: replay harness on the 33 broadcasts (results/live_state_test/harness.json) - within 1 s after 1 s in 96.0 % (bug hidden, no cue) and 96.0 % (slot hidden, no cue); after 2 s in 81.5 % and 84.9 %, and with every visible reset delivered as a cue still only 88.7 % and 91.5 %; after 3 s 86.7 % and 89.5 %. The promise is clock_inferred_promise (0.90) at every age'}
      shot_slot_follow_max_s: {value: 5.0, unit: s, why: 'while only the shot-clock slot is unreadable, the STATUS of the shot clock (running, stopped) follows the game-clock digits and is graded inferred this long. The shot-clock VALUE has its own, shorter limit (shot_clock_inferred_max_s)', evidence: 'measured: side run of 11 Nov 2026 on the 33 broadcasts - slot gaps are short (82 % last 3 s or less). The status claim itself is not scored by the replay harness yet (the bug gives no direct reading of it)'}
      shot_clock_tenths_below_s: {value: 5, unit: s, why: 'below this the shot clock shows tenths and a reading is good to 0.1 s; above it to 1 s', evidence: 'rule: 5-10.3.d - tenths are displayed with less than five seconds on the shot clock; seen on the bug (results/w3_intake/scorebug_summary.md)', mirrors: 'config/invariants.yaml:constants.shot_clock_tenths_below_s'}
    notes: >-
      The shot clock is much harder to reckon than the game clock, because a reset comes about every half minute of
      play and a blind system cannot see it. Side run (33 broadcasts, 1 s resolution, status from the last two
      readings, n = 86,084 at 2 s and 77,393 at 10 s): blind last-status within 1 s in 88.1 / 81.5 / 70.2 / 49.3 /
      27.9 % after 2 / 3 / 5 / 10 / 20 s. The slot was read in 81.8 % of the seconds with more than 30 s left in the
      period and in 14.7 % of the seconds with 30 s or less, where it is mostly off by rule. Blind pass: fully known
      where the bug shows it; between readings the reset table gives the value at each seen cause. pbp_only: a
      reconstruction graded inferred. The arena shot clock above the backboard is a possible second display, not used
      in 0.1.0.
  shot_clock_status:
    id: LS-TIME-06
    group: time
    name: Shot clock status
    type: enum
    unit: n/a
    domain: 'running, stopped, off. off = no shot clock exists now; unknown = it may exist but cannot be told'
    none_value: 'off'
    stored: segment
    dimension: shot_clock_status
    lands_in: ['state_segments:shot_clock_status', state_frame.shot_clock_status, state_second.shot_clock_status, clock_map.status, state_transitions.shot_clock_status]
    requirements: [R-SR-01, R-IV-07, R-IV-21, R-IV-22, R-SY-01]
    profile: status
    sources:
      - {sensor: scorebug_ocr, role: value, modes: [live, post_blind, post_anchored], resolution: '1 s: the slot is blank (off), ticks (running) or holds (stopped)'}
      - {sensor: audio, role: timing, modes: [live, post_blind, post_anchored], resolution: 'about 0.1 s: the whistle that stops it; the shot-clock horn at 0'}
      - {sensor: cv_events, role: timing, modes: [live, post_blind, post_anchored], resolution: 'per frame: the starts of Rule 5-10.3 (throw-in touched inbounds, first control after a jump ball or a missed try, change of control)'}
      - {sensor: pbp_final, role: confirm, modes: [post_anchored, pbp_only], resolution: '1 s; in pbp_only the status is inferred by rule'}
    update:
      changed_by: [T00, T01, T02, T05, T06, T08, T09, T13, T14, T15, T16, T19, T20, T23]
      event_instant: 'running from the frame of a start (Rule 5-10.3). stopped from the frame of a whistle (Rule 5-11) and from a made field goal until the throw-in is touched inbounds. off from the frame a reset is due while the game clock shows less than a full shot-clock period (Rule 2-11.8), and at every period end; back on, at 20 s, when a 2-11.6.d reset is due with at least that much game clock left (R-IV-22).'
    timing:
      provisional: {by: audio, p50_s: 0.2, p95_s: 0.6}
      confirmed: {by: scorebug_ocr, p50_s: 1.1, p95_s: 2.1}
      evidence: 'assumed: as for game_clock_running - the whistle first, then the digits (one display step of 1 s, or 0.1 s below 5 s, plus frame_to_state_s). off is known at once by rule when the game clock is read. Replaced by the reset and start delays measured per game (R-SY-14) and the whistle timing of OQ-LS-3.'
    dropout:
      - {when: shot slot unreadable while the game clock is read, rule: FOLLOW_FIELD, grade_path: [observed, inferred, carried], limits: {shot_slot_follow_max_s: 5}, on_return: SNAP_AND_LOG,
         evidence: 'rule: 5-10 and 5-11 - both clocks stop on the same whistles and start on the same touch, so the game-clock digits are a change detector for this status. The two differ after a made field goal (the game clock runs on, the shot clock waits for the throw-in) and when the shot clock is off; both follow from seen events. Slot gaps are short: 82 % last 3 s or less (side run of 11 Nov 2026).'}
      - {when: scorebug hidden, rule: CARRY, grade_path: [observed, inferred, carried, unknown], limits: {clock_inferred_max_s: 3, shot_clock_carried_max_s: 10}, on_return: SNAP_AND_LOG,
         evidence: 'measured: the game-clock status held blind is right within 1 s in 93.8 % after 3 s (measured_sensors.json clock_carry_on_withheld_readings); the shot clock adds its resets, and after 10 s a blind estimate is right less than half the time (side run of 11 Nov 2026)'}
      - {when: scorebug hidden and a stop or start cue arrives, rule: CUE_RECKON, grade_path: [inferred, carried, unknown], limits: {clock_inferred_max_s: 3, shot_clock_carried_max_s: 10}, on_return: SNAP_AND_LOG,
         evidence: 'assumed: a whistle sets stopped, a seen start sets running, at the cue frame. Replaced by the measured recall and timing of OQ-LS-3 and the cue sweep of the replay harness (ACC-LS-H4).'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: state record principle 7'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE, evidence: 'rule: 5-11.3 and 2-11.6.a.3 - stopped through a timeout, with no reset'}
      - {when: running held for a full shot-clock period, rule: MAX_DWELL, grade_path: [inferred, carried, unknown], limits: {max_dwell.shot_clock_period: 30}, on_return: SNAP_AND_LOG, evidence: 'rule: 2-11.1 - running cannot last more than 30 s without a reset, a horn or a whistle'}
    max_dwell: shot_clock_period
    conflict:
      - {between: [scorebug_ocr, cv_events], tolerance: 1.0, value_winner: scorebug_ocr, timing_winner: cv_events, log_to: scoreboard_flags, note: 'Flag type (h) of R-SB-01. A blank slot with more game clock left than a full shot clock is a hidden slot or a graphics change, not off.'}
    invariants: [R-IV-07, new-IV-01, new-IV-02, new-IV-05, R-IV-21, R-IV-22, SEG-01, SEG-02]
    consumers: [shot_clock_s, shot_clock_off, live_panel, end_of_period_windows, possession_engine]
    freshness_needed_s: {shot_clock_s: 0.5}
    notes: >-
      off can be known without the bug: it is a rule on the game clock and on reset causes. Blind pass: known from
      the slot and the game clock. Open points for the state machine: (1) only T19 lists this dimension in its
      changes, yet running and stopped change on every whistle and start - this record lists the transitions that
      really change it; (2) the values list is written with a bare off, which YAML 1.1 reads as the boolean false.
  video_ts_ms:
    id: LS-TIME-07
    group: time
    name: Video time
    type: int
    unit: ms
    domain: '0 and up: the presentation time of the frame, from the first frame of the file or stream'
    none_value: none
    stored: obs
    dimension: null
    lands_in: [state_frame.video_ts_ms, state_second.video_ts_ms_start, frames.video_ts_ms, frames.pts_raw, clock_map.from_video_ms, state_transitions.video_ts_ms]
    requirements: [R-MD-23, R-SY-11]
    profile: observation
    sources:
      - {sensor: stream, role: value, modes: [live, post_blind, post_anchored], resolution: 'per frame (33.37 ms at 29.97 fps). The time stamp comes from the decoder, not from a model'}
    update:
      changed_by: per_frame
      event_instant: 'The presentation time stamp of the frame as the container gives it; the raw value is kept in frames.pts_raw.'
    timing:
      provisional: {by: stream, p50_s: 0.0, p95_s: 0.0}
      confirmed: {by: stream, p50_s: 0.0, p95_s: 0.0}
      evidence: 'definition: the time stamp is part of the frame; it is known when the frame is. capture_to_frame_s sits outside this block (latency_budget.composition).'
    dropout:
      - {when: stream lost or decoder gap, rule: CARRY, grade_path: [observed, unknown], limits: {}, on_return: REACQUIRE, evidence: 'definition: without a frame there is no video time; level D5_no_video. A frame time is never invented.'}
      - {when: picture frozen or frames repeated, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE, evidence: 'measured: one of the two tournament replays holds a 2.3 s frozen picture during live play (results/w3_intake/README.md). The time stamps go on while the picture does not: game state is frozen as in a break and re-acquired after it.'}
    conflict: []
    invariants: []
    consumers: [clock_map, est_utc, state_frame, latency_report, every_event_table]
    notes: >-
      Video time is file time. A recording with shortened breaks removes real time at its cuts, so a difference of
      video_ts_ms across a cut is not a duration (half time kept 3.2 of 21.4 minutes in one tournament replay); the
      33 MSU recordings are of this kind. Real-time bounds (max dwell of a timeout or an intermission) are applied
      only inside a stretch without a cut. pbp_only has no video and holds none. The sensor is the stream
      itself (core.yaml sensors.stream); its health signal is the frame heartbeat (level D5_no_video). The blind
      and the anchored pass hold the same value.
  est_utc:
    id: LS-TIME-08
    group: time
    name: Estimated UTC of the instant
    type: timestamp
    unit: UTC, with est_utc_err_s in s
    domain: 'a UTC instant and a half-width est_utc_err_s (the true instant lies within the estimate plus or minus the error)'
    none_value: unknown
    stored: clock_map
    dimension: null
    lands_in: [clock_map.utc_at_from, clock_map.utc_err_s, state_transitions.est_utc, state_transitions.est_utc_err_s, state_transitions.known_at_utc]
    lands_in_proposed: [state_second.est_utc, state_second.est_utc_err_s]
    requirements: [R-MD-23, R-MD-24, R-MK-03, R-MK-07, R-SY-11]
    profile: derived
    sources:
      - {sensor: pbp_final, role: value, modes: [post_blind, post_anchored, pbp_only], resolution: 'the wallclock of each row, about 1 s jitter per entry; 13 % of rows step backward (largest 3,008 s), so only the running maximum is used'}
      - {sensor: pbp_feed, role: confirm, modes: [live], resolution: 'the arrival time of each row, late by the feed delay (OQ-LS-1)'}
      - {sensor: registry, role: fallback, modes: [live, post_blind, post_anchored, pbp_only], resolution: 'per game: the actual tip time, and the start time of a recording made by us'}
    derived_from: [video_ts_ms, period, game_clock_s, stream_delay_s]
    recompute_on: 'every frame (live); every new anchor - a play-by-play row with a wallclock, a measured stream delay, a correction'
    valid_if: >-
      est_utc_err_s is stored with every value. A join to a market price is made only when est_utc_err_s is at most
      est_utc_join_max_err_s (R-MK-03). With no anchor at all (no receive time, no wallclock, no tip time) the value
      is unknown.
    update:
      changed_by: on_input_change
      event_instant: 'Live: est_utc of a frame = the UTC at which the frame was received minus stream_delay_s of the source. Recorded: the frame is mapped to period and game clock by clock_map, and from there to UTC by a piecewise-linear map through the play-by-play wallclock anchors (running maximum), with the tip time as a check. est_utc is when it happened in the arena; known_at_utc = est_utc + stream_delay_s + processing latency is when the system could first hold it.'
    timing:
      driven_by: [video_ts_ms]
      provisional: {by: inputs, p50_s: 0.1, p95_s: 0.2}
      confirmed: {by: pbp_feed, p50_s: 20.0, p95_s: 60.0}
      evidence: 'assumed: live, the estimate exists as soon as the frame does (derived_compute_s); it is confirmed when a feed row with a wallclock for the same clock second arrives (feed_delay_p50_s, feed_delay_p95_s). Replaced by the live capture of OQ-LS-1 and OQ-LS-2.'
    dropout:
      - {when: stream delay not measured, rule: VALID_IF, grade_path: [observed, inferred], limits: {}, on_return: SNAP_AND_LOG,
         evidence: 'assumed: live, the whole error of est_utc is the error of stream_delay_s, which is not measured (OQ-LS-2). Until it is, the live value is inferred and its error is the planning range of the delay; no market join is made on it.'}
      - {when: play-by-play wallclock missing or running backward, rule: VALID_IF, grade_path: [observed, inferred, unknown], limits: {est_utc_join_max_err_s: 30}, on_return: LATE_CORRECTION,
         evidence: 'measured: 13 % of rows carry a wallclock earlier than one already seen, by up to 3,008 s (measured_sensors.json pbp_wallclock). The map uses the running maximum and stores the gap as the error; a stretch whose error is above 30 s is kept but never joined to prices.'}
      - {when: recording with shortened breaks, rule: VALID_IF, grade_path: [observed, inferred], limits: {}, on_return: SNAP_AND_LOG,
         evidence: 'measured: video time is not real time across a cut (results/w3_intake/README.md, point 4), so UTC is never interpolated on video time across one; inside a running-clock stretch it is interpolated on the game clock'}
      - {when: game clock unknown, rule: VALID_IF, grade_path: [inferred, carried, unknown], limits: {clock_carried_max_s: 30}, on_return: SNAP_AND_LOG,
         evidence: 'definition: on a recording the map runs through the game clock, so the estimate takes the grade of game_clock_s (rule WORST_INPUT) and is unknown when the clock is. Live, the receive time needs no clock.'}
    conflict: []
    invariants: []
    consumers: [market_join, stamp_known_at_utc, win_probability, latency_report]
    freshness_needed_s: {market_join: 1.0}
    params:
      est_utc_join_max_err_s: {value: 30.0, unit: s, why: 'a market price is joined to game state only when the UTC error of the state is at most this', evidence: 'requirement: R-MK-03'}
    notes: >-
      Entry jitter of the play-by-play wallclock: about 1.05 s per entry between events on one running-clock stretch
      (5,135 pairs). That is the spread, not the offset: how late the scorer types after the event is part of the
      feed delay and is not measured (OQ-LS-1). Two uses, kept apart: est_utc answers what was true; known_at_utc
      answers could we have acted (R-MK-07). Blind pass on a recording: no wallclock, so est_utc rests on the tip
      time and the game clock alone and its error is large; no market join.
  media_segment:
    id: LS-TIME-09
    group: time
    name: Media-timeout segment
    type: string
    unit: n/a
    domain: 'H<half>-S<k>, k = the number of media timeouts already taken in this half (S0 runs from the start of the half to the first one); OT<n> in an extra period'
    none_value: unknown
    stored: derived
    dimension: null
    lands_in: [state_second.media_segment_id, timeouts.media_slot, timeouts.mark_clock_s, timeouts.became_media, timeouts.first_dead_ball_after_mark]
    requirements: [R-SR-04, R-MD-13, R-IV-28, R-RR-03]
    profile: derived
    derived_from: [period, game_clock_s, stoppage, timeout_format]
    recompute_on: 'every timeout (T16) and every period start (T01)'
    valid_if: >-
      period is at least carried and every timeout of the half so far has a known kind (media, or a team timeout that
      became the media timeout). After a break whose kind is not known yet the value is unknown at grade carried:
      k may be one higher. With timeout_format = no_media the field holds H<half>-S0 for the whole half.
    update:
      changed_by: on_input_change
      event_instant: 'k steps at the frame the media timeout is granted (T16, subtype media): the first dead ball at or after a mark of the format (960, 720, 480 and 240 s left, or 900, 600 and 300 s; Rule 5-14.10). A team timeout, review or challenge that creates a dead ball within media_pre_mark_window_s before a mark becomes that media timeout, and so does the first team timeout of the second half (R-IV-28).'
    timing:
      driven_by: [stoppage]
      provisional: {by: inputs, p50_s: 0.3, p95_s: 1.1}
      confirmed: {by: inputs, p50_s: 20.1, p95_s: 60.1}
      evidence: 'assumed: provisional = the whistle at the first dead ball at or after a mark, which makes a media timeout due by rule (stoppage plus derived_compute_s; graded inferred). Confirmed = the timeout row of the feed (feed_delay_p50_s, feed_delay_p95_s plus derived_compute_s), or earlier when the broadcast is seen to leave for a break. Replaced by the live capture of OQ-LS-1 and by the share of marks at which the first dead ball was the media timeout on the 33 broadcasts.'
    dropout:
      - {when: any input below its needed grade, rule: VALID_IF, grade_path: [observed, inferred, carried, unknown], limits: {}, on_return: SNAP_AND_LOG, evidence: 'definition: rule WORST_INPUT'}
      - {when: feed stale and a break of unknown kind, rule: VALID_IF, grade_path: [inferred, carried], limits: {feed_stale_after_s: 90}, on_return: LATE_CORRECTION,
         evidence: 'assumed: without the feed a media timeout is told from a team timeout by the mark rule and by the length of the break; a team timeout near a mark can be either. Replaced by the agreement of the mark rule with the play-by-play media timeouts on the 33 broadcasts (R-SR-04 asks at least 95 %).'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE, evidence: 'definition: the break is the event; the step is made when it is granted, and the game clock on return shows which mark it served'}
    conflict: []
    invariants: [new-IV-13, R-IV-28]
    consumers: [failure_analysis_slices, possession_engine, studio, live_panel]
    params:
      media_pre_mark_window_s: {value: 30, unit: s, why: 'a team timeout, review or challenge that creates a dead ball this close before a mark becomes that media timeout', evidence: 'rule: 5-14.10 (R-IV-28)', mirrors: 'config/invariants.yaml:constants.media_pre_mark_window_s'}
    notes: >-
      The boundaries are the timeouts actually taken, not the clock marks: U16 is whatever was played between the
      first and second media timeouts. The last-240 s flag (late_240) is a clock rule and belongs to clutch
      (fields_meta). Blind pass: the mark rule and the break itself give the segment at grade inferred; the
      play-by-play confirms it in the anchored pass.
  five_min_window:
    id: LS-TIME-10
    group: time
    name: Five-minute window
    type: string
    unit: n/a
    domain: 'H<half>-W<1..4> by elapsed time in the half (W1 = the first 300 s), OT<n> for a whole extra period; with it the ten-minute bucket H<half>-A or -B, OT<n>'
    none_value: unknown
    stored: derived
    dimension: null
    lands_in: [state_second.five_min_window_id, state_second.ten_min_bucket_id]
    requirements: [R-MD-13, R-PR-01, R-PR-06]
    profile: derived
    derived_from: [period, game_clock_s]
    recompute_on: 'the game clock crossing 900, 600 or 300 s left in a half; every period start'
    valid_if: >-
      period is at least carried and both ends of the game-clock interval [lo, hi] fall in the same window. Then the
      value is exact whatever the grade of the clock. When the interval straddles a boundary the value is the window
      of the reckoned clock at grade carried.
    update:
      changed_by: on_input_change
      event_instant: 'W = 1 + floor(elapsed / five_min_window_s), capped at 4, with elapsed = 1,200 s minus game_clock_s; the window changes at the frame the official clock passes 900.0, 600.0 and 300.0 s left. A clock stopped exactly on a boundary belongs to the later window.'
    timing:
      driven_by: [game_clock_s]
      provisional: {by: inputs, p50_s: 0.2, p95_s: 0.4}
      confirmed: {by: inputs, p50_s: 0.2, p95_s: 0.4}
      evidence: 'assumed: the game clock plus derived_compute_s. Measured per run (K23).'
    dropout:
      - {when: game clock carried across a window boundary, rule: VALID_IF, grade_path: [observed, inferred, carried, unknown], limits: {clock_carried_max_s: 30}, on_return: SNAP_AND_LOG,
         evidence: 'definition: the guaranteed interval of the clock decides it - the window is exact unless the interval contains 900, 600 or 300 s. Real hidden stretches are short (median 6 s, p95 29 s: measured_sensors.json clock.hidden_runs), so the doubt lasts seconds, three times per half.'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE, evidence: 'rule: 5-11.3 - the clock is stopped during a break, so the window cannot change'}
    conflict: []
    invariants: []
    consumers: [win_probability, possession_engine, failure_analysis_slices, studio]
    params:
      five_min_window_s: {value: 300, unit: s, why: 'length of one window; four windows make a half, so the windows sum to the halves and the halves to the game exactly', evidence: 'requirement: R-MD-13 and R-PR-01'}
    notes: >-
      Analysis windows only: NCAA men play halves, not quarters. No market exists for a window (R-PR-06 scores it
      against a random-walk baseline). Blind pass: exact wherever the clock is read; the play-by-play adds nothing.
      pbp_only: exact at every row.
  score_home:
    id: LS-SCORE-01
    group: score
    name: Score of the home team
    type: int
    unit: points
    domain: &score_domain '0-200; never falls except by a logged official correction'
    none_value: unknown
    stored: segment
    dimension: score_home
    lands_in: ['state_segments:score_home', state_frame.score_msu, state_frame.score_opp, state_frame.last_score_event_id, state_second.score_msu, state_second.score_opp, score_events.delta_points, score_events.board_lag_s, scoreboard_ocr.score_home_parsed]
    lands_in_proposed: [score_events.known_at_utc]
    requirements: &score_reqs [R-SR-02, R-IV-04, R-IV-40, R-IV-42, R-SB-01, R-SB-03, R-MB-01, R-MB-04, R-SY-01, R-SY-14, R-SY-15, R-MD-22]
    profile: counter
    sources: &score_sources
      - {sensor: cv_events, role: timing, modes: [live, post_blind, post_anchored], resolution: 'per frame: the ball through the net, within 2 frames (K07). Live and blind it also gives the first value: the make adds 2 or 3 by the spot of the shooter, 1 for a free throw, at grade inferred'}
      - {sensor: scorebug_ocr, role: confirm, modes: [live, post_blind, post_anchored], resolution: '1 point: the digit change, median 1.93 s after the make; the score total is readable in 88 % (median game) of the seconds that have a clock'}
      - {sensor: pbp_feed, role: value, modes: [live], resolution: 'the score after each play, at a clock second that sits about 1 s before the make; late (feed_delay_p50_s)'}
      - {sensor: pbp_final, role: value, modes: [post_anchored, pbp_only], resolution: 'the official scorebook: wins every value (Rule 2-9.13)'}
      - {sensor: human, role: fallback, modes: [post_anchored], resolution: 'review answers on scoreboard flags (R-SB-02)'}
    update: &score_update
      changed_by: [T00, T05, T12, T17, T18]
      event_instant: 'A field goal counts at the frame the ball is fully through the net (made_basket_events.frame_index_make). A free throw the same. Points awarded without the ball going through (goaltending, basket interference) count at the whistle. A correction by the officials (T17, T18) counts at the frame the ruling is given. The digit change on the bug is an observation of the event, not the event.'
    timing: &score_timing
      provisional: {by: cv_events, p50_s: 0.5, p95_s: 1.0}
      confirmed: {by: scorebug_ocr, p50_s: 2.0, p95_s: 3.0}
      evidence: 'measured: confirmed = the make-to-bug lag, median 1.93 s and largest 2.60 s of 10 frame-precise makes (results/w3_intake/made_basket_lag.md), plus frame_to_state_s; a real p95 needs about 60 makes. The provisional value is assumed (cv_make_confirm_s, cv_event_delay_p95_s) until the emit delay is measured on gold-v1. The scorebook value arrives with the feed (planning 20 s and 60 s, OQ-LS-1).'
    dropout: &score_dropout
      - {when: 'scorebug hidden, CV watching the ball and the rim', rule: HOLD_UNTIL_EVENT, grade_path: [confirmed, observed, inferred], limits: {}, on_return: SNAP_AND_LOG,
         evidence: 'measured: the score changed during 4-7 % of real hidden stretches up to 20 s (measured_sensors.json score.changed_during_real_hidden_run); these are the changes CV has to catch. No make seen = no change, and the value keeps its grade; a make seen adds its points at grade inferred until the bug returns. How often CV is right here is the R-MB-03 target (recall at least 97 % at precision at least 98 % with the rim in view), not yet measured on MSU film.'}
      - {when: 'scorebug hidden, nothing watching the rim (tight shot, bench, ball lost)', rule: CARRY, grade_path: [confirmed, observed, carried], limits: {scorebug_down_after_s: 1, counter_stale_after_s: 20}, step_at: [scorebug_down_after_s], on_return: SNAP_AND_LOG,
         evidence: 'measured: with the bug withheld at random moments the score changed within 2 s in 4 % of cases, 5 s in 10 %, 10 s in 19 % and 20 s in 36 % (measured_sensors.json score.changed_within_withheld_window). With no change detector the value is carried from the first missed second and marked stale after 20 s; it is never guessed.'}
      - {when: 'not main camera, scorebug visible', rule: HOLD_UNTIL_EVENT, grade_path: [confirmed, observed], limits: {}, on_return: SNAP_AND_LOG,
         evidence: 'measured: the bug is the change detector; the make instant is then inferred as the digit change minus make_to_bug_p50_s (1.93 s, range 1.50-2.60 s, results/w3_intake/made_basket_lag.md), good to about 0.5 s. A change with the camera on the court and no make seen is flag type (a) of R-SB-01.'}
      - {when: bug step that is not +1 +2 or +3 or a fall, rule: QUARANTINE, grade_path: [observed, carried], limits: {scorebug_up_after_reads: 2}, on_return: SNAP_AND_LOG,
         evidence: 'measured: the score total on the bug equals the play-by-play total in 89 % (median game) of stable samples; the rest are digit misreads or scorer corrections (measured_sensors.json score.total_matches_pbp_share). A step that breaks R-IV-04 is held out and the last good value carried; if it stands for 2 readings in a row it is a correction candidate (flag type (i)), otherwise a misread.'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: state record principle 7 and R-SR-10 - a make inside a replay never scores; no make is confirmed before replay_guard_s has passed'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE, evidence: 'rule: 5-11.3 - the ball is dead during a timeout, so no goal can be scored. A different value on return is a correction made during the break (flag type (i) of R-SB-01): it is written as T18 with a state_corrections row.'}
      - {when: feed stale, rule: HOLD_UNTIL_EVENT, grade_path: [confirmed, observed], limits: {}, on_return: LATE_CORRECTION, evidence: 'definition: CV and the bug keep the value confirmed; the scorebook value arrives late and, if it differs, opens a new state_version'}
    conflict: &score_conflict
      - {between: [cv_events, scorebug_ocr], tolerance: 0, value_winner: scorebug_ocr, timing_winner: cv_events, log_to: scoreboard_flags,
         note: 'The make must show on the bug inside make_confirm_window_s (4.0 s, K02); flag types (b) to (f) of R-SB-01. CV 3 against a board +2: the board wins the value live, CV keeps the instant, and the flag stays open for the scorebook.'}
      - {between: [pbp_final, scorebug_ocr], tolerance: 0, value_winner: pbp_final, timing_winner: cv_events, log_to: scoreboard_flags,
         note: 'Against the play-by-play clock second the window is pbp_to_bug_window_s (12 s: measured p95 7 s, p99 11 s, 31 of 1,375 makes not seen within 15 s). It is a different window from the make window because the clock second of the scorer is itself about 1 s early and spread.'}
      - {between: [cv_events, pbp_final], tolerance: 0, value_winner: pbp_final, timing_winner: cv_events, log_to: cv_events_unmatched, note: 'A CV make with no scorebook row is kept in the unmatched stream (principle 4); its points leave the fused score in the anchored pass.'}
      - {between: [pbp_final, human], tolerance: 0, value_winner: human, timing_winner: cv_events, log_to: state_corrections, note: 'review answers (R-SB-02); the raw reading stays'}
    invariants: &score_invariants [R-IV-04, R-IV-36, R-IV-37, R-IV-40, R-IV-42, new-IV-31, new-IV-33, SEG-01, SEG-02, TRN-04]
    consumers: &score_consumers [live_panel, win_probability, margin, current_run, clutch, garbage_time, end_of_period_windows, expected_points, possession_engine, market_join, studio]
    freshness_needed_s: &score_fresh {win_probability: 1.0, live_panel: 1.0, market_join: 1.0}
    notes: >-
      Grades in live play: inferred when CV sees the make (about 0.5 s), observed when the bug alone shows it,
      confirmed when CV and the bug agree inside the make window (about 2 s), and the scorebook value when the feed
      row arrives. Blind pass: the score is fully known from the bug and CV; what it cannot know is the scorer (who)
      and any scorebook correction. pbp_only: from the rows, at their clock second. The existing view columns are
      MSU-relative (score_msu, score_opp); the stored value is home / away (R-MD-22). A late or corrected row never
      rewrites the past: it opens a new state_version and the as_of_known view of earlier instants stays as it was.
  score_away:
    id: LS-SCORE-02
    group: score
    name: Score of the away team
    type: int
    unit: points
    domain: *score_domain
    none_value: unknown
    stored: segment
    dimension: score_away
    lands_in: ['state_segments:score_away', state_frame.score_msu, state_frame.score_opp, state_frame.last_score_event_id, state_second.score_msu, state_second.score_opp, score_events.delta_points, score_events.board_lag_s, scoreboard_ocr.score_away_parsed]
    lands_in_proposed: [score_events.known_at_utc]
    requirements: *score_reqs
    profile: counter
    sources: *score_sources
    update: *score_update
    timing: *score_timing
    dropout: *score_dropout
    conflict: *score_conflict
    invariants: *score_invariants
    consumers: *score_consumers
    freshness_needed_s: *score_fresh
    notes: 'As score_home, for the away team. Which side of the bug is the home team is fixed before tip by scorebug_template.'
  margin:
    id: LS-SCORE-03
    group: score
    name: Margin
    type: int
    unit: points
    domain: 'home score minus away score, -200 to 200; the MSU view is MSU minus the opponent'
    none_value: unknown
    stored: derived
    dimension: null
    lands_in: [state_frame.margin, state_second.margin, possessions.margin_start]
    requirements: [R-MD-17, R-MD-22]
    profile: derived
    derived_from: [score_home, score_away]
    recompute_on: 'any change of value or grade of either score'
    valid_if: >-
      both scores are confirmed, observed, inferred or carried (not unknown, not quarantined). While a make is
      inferred and not yet on the bug, the margin carries the interval between the score with and without it.
    update:
      changed_by: on_input_change
      event_instant: 'The instant of the score event that changed it (the make frame), never the digit change.'
    timing:
      driven_by: [score_home, score_away]
      provisional: {by: inputs, p50_s: 0.6, p95_s: 1.1}
      confirmed: {by: inputs, p50_s: 2.1, p95_s: 3.1}
      evidence: 'assumed: the scores plus derived_compute_s (0.1 s). Measured per run (K23).'
    dropout:
      - {when: any input below its needed grade, rule: VALID_IF, grade_path: [observed, inferred, carried, unknown], limits: {}, on_return: SNAP_AND_LOG, evidence: 'definition: rule WORST_INPUT - the worse grade and the older age of the two scores'}
    conflict: []
    invariants: [R-IV-04]
    consumers: [live_panel, lead_changes, ties, largest_lead, close_game_measure, clutch, garbage_time, end_of_period_windows, leverage, studio]
    freshness_needed_s: {live_panel: 1.0}
    notes: 'The view columns state_frame.margin and state_second.margin are MSU-relative; for a game without MSU only the home-minus-away value exists. Blind pass: as the scores - fully known from the bug and CV.'
  current_run:
    id: LS-SCORE-04
    group: score
    name: Current run
    type: struct
    unit: points
    domain: 'points of each team in the last run_window_s of game clock (0-40 each), their difference, and a flag that is on when one team is ahead by run_net_min_points or more in that window'
    none_value: unknown
    stored: derived
    dimension: null
    lands_in: [state_second.run_msu_2min, state_second.run_opp_2min]
    lands_in_proposed: [state_second.run_flag]
    requirements: [R-MD-17]
    profile: derived
    derived_from: [score_home, score_away, period, game_clock_s]
    recompute_on: 'every score event, and the game clock passing run_window_s after one (the event leaves the window)'
    valid_if: >-
      both scores are at least carried inside counter_stale_after_s, and no score event lies inside the game-clock
      interval at the far edge of the window. When one does, the value is given both ways (event in, event out) at
      grade carried.
    update:
      changed_by: on_input_change
      event_instant: 'Rises at the frame of a score event; falls at the frame the official clock is run_window_s past an earlier one. The window is game-clock time and runs across period breaks (the first seconds of a half still see the end of the half before).'
    timing:
      driven_by: [score_home, score_away]
      provisional: {by: inputs, p50_s: 0.6, p95_s: 1.1}
      confirmed: {by: inputs, p50_s: 2.1, p95_s: 3.1}
      evidence: 'assumed: the scores plus derived_compute_s. Measured per run (K23).'
    dropout:
      - {when: any input below its needed grade, rule: VALID_IF, grade_path: [observed, inferred, carried, unknown], limits: {counter_stale_after_s: 20}, on_return: SNAP_AND_LOG, evidence: 'definition: rule WORST_INPUT. A score carried for more than 20 s with nothing watching may hide a basket (measured: 36 % of withheld 20 s windows hold a score change), and a run is made of baskets.'}
      - {when: game clock carried at the window edge, rule: VALID_IF, grade_path: [observed, carried], limits: {clock_carried_max_s: 30}, on_return: SNAP_AND_LOG, evidence: 'definition: the clock interval decides whether the oldest score event is still inside the window; outside that doubt the value does not depend on the clock grade'}
    conflict: []
    invariants: []
    consumers: [live_panel, studio, hypothesis_register, possession_engine]
    params:
      run_window_s: {value: 120.0, unit: s, why: 'length of the rolling window of game clock for the primary run definition', evidence: 'decision: K05 (primary run = net 8 or more points in 120 s; R-MD-17 definition c)'}
      run_net_min_points: {value: 8, unit: points, why: 'net points in the window from which the stretch is called a run; also the threshold for showing the broadcast form a-b', evidence: 'decision: K05'}
    notes: >-
      R-MD-17 keeps three run definitions apart. This field is the primary one (c, register run). The other two -
      (a) unanswered points since the last point of the opponent and (b) the broadcast run a-b - are views computed
      from score_events and are not part of the live state. Whether the window should run across half time is an
      open point (see the report of this baseline); here it does. Blind pass: known from the bug and CV; a basket
      missed while nothing watched is recovered at the next bug reading, with its instant inferred.
  lead_changes:
    id: LS-SCORE-05
    group: score
    name: Lead changes so far
    type: int
    unit: count
    domain: '0-100; steps when a team takes the lead and the team that last led was the other one. The first lead of the game is not a change; a tie in between does not reset who last led'
    none_value: unknown
    stored: derived
    dimension: null
    lands_in: [state_second.lead_changes]
    requirements: [R-MD-17, R-MD-25, R-MD-33]
    profile: derived
    derived_from: [margin]
    recompute_on: 'every score event'
    valid_if: &order_valid >-
      the margin is valid and the order of all score events so far is known. After a stretch in which the score
      changed unseen, the count is exact only if the team that trailed scored fewer points in the gap than the margin
      before it (no change of lead was possible); otherwise it is a lower bound at grade carried until the feed gives
      the order.
    update:
      changed_by: on_input_change
      event_instant: 'The frame of the score event that puts the new leader ahead.'
    timing: &order_timing
      driven_by: [margin]
      provisional: {by: inputs, p50_s: 0.7, p95_s: 1.2}
      confirmed: {by: inputs, p50_s: 2.2, p95_s: 3.2}
      evidence: 'assumed: the margin plus derived_compute_s. Measured per run (K23).'
    dropout: &order_dropout
      - {when: any input below its needed grade, rule: VALID_IF, grade_path: [observed, inferred, carried, unknown], limits: {}, on_return: SNAP_AND_LOG, evidence: 'definition: rule WORST_INPUT'}
      - {when: score events missed while nothing watched, rule: VALID_IF, grade_path: [observed, carried], limits: {}, on_return: LATE_CORRECTION,
         evidence: 'definition: this value depends on the order of score events, not only on the scores now. Play-by-play rows inside one second are not reliably ordered (results/state_machine_test/README.md), so even the feed fixes the order only to the second; the fold sorts by score total.'}
      - {when: an inferred make is withdrawn, rule: VALID_IF, grade_path: [inferred, carried], limits: {make_confirm_window_s: 4}, on_return: LATE_CORRECTION, evidence: 'decision: K02 - a CV make that the bug does not confirm inside 4.0 s is flagged; a count that rose on it is recomputed in a new state_version when the flag is answered'}
    conflict: []
    invariants: []
    consumers: [close_game_measure, live_panel, studio]
    notes: 'Acceptance of R-MD-25: the end-of-game value equals the published lead changes where a source publishes them; a difference is logged with the definition of the source. Blind pass: exact while every score event is seen in order; a lower bound otherwise.'
  ties:
    id: LS-SCORE-06
    group: score
    name: Times tied so far
    type: int
    unit: count
    domain: '0-100; steps each time a score event makes the margin 0. The 0-0 at the tip is not counted'
    none_value: unknown
    stored: derived
    dimension: null
    lands_in: [view]
    lands_in_proposed: [state_second.times_tied]
    requirements: [R-MD-17, R-MD-25, R-MD-33]
    profile: derived
    derived_from: [margin]
    recompute_on: 'every score event'
    valid_if: *order_valid
    update:
      changed_by: on_input_change
      event_instant: 'The frame of the score event that makes the two scores equal.'
    timing: *order_timing
    dropout: *order_dropout
    conflict: []
    invariants: []
    consumers: [close_game_measure, live_panel, studio]
    notes: 'A tie reached and left inside an unseen stretch cannot be recovered without the order of the events; the count is then a lower bound. Blind pass: as lead_changes.'
  largest_lead:
    id: LS-SCORE-07
    group: score
    name: Largest lead of each team so far
    type: struct
    unit: points
    domain: 'two values, home and away, each 0-200: the largest margin that team has held at any instant so far'
    none_value: unknown
    stored: derived
    dimension: null
    lands_in: [team_box.largest_lead]
    lands_in_proposed: [state_second.largest_lead_home, state_second.largest_lead_away]
    requirements: [R-MD-17, R-MD-25]
    profile: derived
    derived_from: [margin]
    recompute_on: 'every score event'
    valid_if: *order_valid
    update:
      changed_by: on_input_change
      event_instant: 'The frame of the score event that sets a new largest margin for that team.'
    timing: *order_timing
    dropout: *order_dropout
    conflict: []
    invariants: []
    consumers: [close_game_measure, live_panel, studio]
    notes: 'A lower bound after an unseen stretch, exact again once the order of the missed events is known. team_box.largest_lead is the end-of-game value from the box score, used as the check. Blind pass: as lead_changes.'
  close_game_measure:
    id: LS-SCORE-08
    group: score
    name: Close-game measure so far
    type: struct
    unit: points, s
    domain: 'the largest absolute margin so far (0-200), counted after the first close_game_skip_first_s of the game; the game-clock seconds spent so far with the absolute margin at or under each band of close_game_bands_pts; and a flag close_so_far that is on while that largest margin is at most close_game_max_margin_pts'
    none_value: unknown
    stored: derived
    dimension: null
    lands_in: [view]
    lands_in_proposed: [state_second.max_abs_margin, state_second.secs_margin_le_3, state_second.secs_margin_le_5, state_second.secs_margin_le_6, state_second.close_so_far]
    requirements: [R-MD-33]
    profile: derived
    derived_from: [margin, lead_changes, ties, period, game_clock_s]
    recompute_on: 'every score event; once per second of running game clock for the seconds counters'
    valid_if: >-
      the margin is valid and the order of score events is known (as for lead_changes). The seconds counters add
      game-clock time, so their error is at most the width of the game-clock interval; they are exact again at the
      next clock reading.
    update:
      changed_by: on_input_change
      event_instant: 'The largest margin changes at the frame of a score event. A seconds counter grows with the official clock while the margin is inside its band. close_so_far goes off, for good, at the frame of the score event that first takes the margin above close_game_max_margin_pts after the first close_game_skip_first_s.'
    timing:
      driven_by: [margin, lead_changes, ties]
      provisional: {by: inputs, p50_s: 0.8, p95_s: 1.3}
      confirmed: {by: inputs, p50_s: 2.3, p95_s: 3.3}
      evidence: 'assumed: lead_changes and ties plus derived_compute_s. Measured per run (K23).'
    dropout:
      - {when: any input below its needed grade, rule: VALID_IF, grade_path: [observed, inferred, carried, unknown], limits: {}, on_return: SNAP_AND_LOG, evidence: 'definition: rule WORST_INPUT'}
      - {when: game clock carried, rule: VALID_IF, grade_path: [observed, inferred, carried], limits: {clock_carried_max_s: 30}, on_return: SNAP_AND_LOG, evidence: 'definition: the seconds counters use game-clock time between score events, whose clock times are known; a carried clock only blurs the running total by the width of its interval'}
    conflict: []
    invariants: []
    consumers: [leverage, studio, possession_engine, hypothesis_register]
    params:
      close_game_max_margin_pts: {value: 6, unit: points, why: 'a game is in the close class while its largest absolute margin after the opening stretch stays at or under this', evidence: 'requirement: R-MD-33 (initial value, to calibrate). Replaced by the value that best separates late-game leverage on the season set'}
      close_game_skip_first_s: {value: 300.0, unit: s, why: 'the opening stretch that the close class ignores (an early 8-0 start does not unmake a close game)', evidence: 'requirement: R-MD-33 (initial value, to calibrate)'}
      close_game_bands_pts: {value: [3, 5, 6], unit: points, why: 'margin bands for the seconds-spent counters', evidence: 'requirement: R-MD-33'}
    notes: >-
      The 19 Oct page said only "largest margin so far, kept under 5-6". Made exact here from R-MD-33: one number
      (largest absolute margin after the first 300 s), three counters (seconds within 3, 5 and 6 points) and one flag.
      The game-level record of R-MD-33 is the last value of this field; the leverage weight of each possession is the
      leverage field (fields_meta), not this one. Blind pass: as lead_changes for the flag and the largest margin; the
      seconds counters need only the clock and the scores.
  team_fouls_home:
    id: LS-COUNT-01
    group: counts
    name: Team fouls of the home team in this half
    type: int
    unit: fouls
    domain: &tf_domain '0-40; counted per half, an extra period continues the count of the second half (Rule 5-9.4). The bug stops at team_foul_bug_cap'
    none_value: unknown
    stored: segment
    dimension: team_fouls_home
    lands_in: ['state_segments:team_fouls_home', state_frame.team_fouls_msu, state_frame.team_fouls_opp, state_second.team_fouls_msu, state_second.team_fouls_opp, foul_state.fouls_team_total, fouls.team_fouls_half_after, scoreboard_ocr.team_fouls_home_parsed]
    requirements: &tf_reqs [R-SR-03, R-IV-09, R-IV-24, R-IV-33, R-IV-41, R-SB-03, R-SB-05, R-SY-01, R-SY-14, R-MD-22]
    profile: counter
    sources: &tf_sources
      - {sensor: pbp_final, role: value, modes: [post_anchored, pbp_only], resolution: 'one row per foul with its type and the fouler; the authority for the count'}
      - {sensor: pbp_feed, role: value, modes: [live], resolution: 'the same rows, late (feed_delay_p50_s); the only live source for the foul type'}
      - {sensor: scorebug_ocr, role: confirm, modes: [live, post_blind, post_anchored], resolution: '1 foul; shown as text in 28 of 33 broadcasts and readable in 54 % of the seconds that have a clock; follows the foul by a median of 7 s'}
      - {sensor: audio, role: timing, modes: [live, post_blind, post_anchored], resolution: 'about 0.1 s: the whistle. A whistle alone does not say foul or violation'}
      - {sensor: cv_events, role: fallback, modes: [live, post_blind, post_anchored], resolution: 'the signal of the official and the walk to the free-throw line; a weak cue, not measured'}
    update: &tf_update
      changed_by: [T00, T09, T18, T21]
      event_instant: 'The count steps at the frame of the whistle that signals the foul (T09); both counts step at one whistle for a double foul. It returns to 0 at the intermission before the second half (T21) and at no other time. A flagrant foul found by review counts to the half in which it was committed (R-IV-09). An official correction is T18.'
    timing: &tf_timing
      provisional: {by: scorebug_ocr, p50_s: 7.0, p95_s: 31.0}
      confirmed: {by: pbp_feed, p50_s: 20.0, p95_s: 60.0}
      evidence: 'measured: provisional = the bug count against the play-by-play foul second, median 7 s, p90 25 s, p95 31 s (n = 566; 59 of 625 not seen within 45 s; measured_sensors.json bug_fields.team_foul_lag_vs_pbp_clock_s). The confirmed value is assumed: the feed row at the planning delay (feed_delay_p50_s, feed_delay_p95_s) until the live capture of OQ-LS-1. If the feed proves faster than the bug the two swap roles.'
    dropout: &tf_dropout
      - {when: bug count not shown or unreadable while the feed is healthy, rule: HOLD_UNTIL_EVENT, grade_path: [confirmed, observed], limits: {}, on_return: SNAP_AND_LOG,
         evidence: 'measured: the count is on the bug as text in 28 of 33 broadcasts and readable in 54 % of the seconds that have a clock (measured_sensors.json bug_fields). The feed is the change detector; the value is observed from the feed alone and confirmed again when the bug shows the same number.'}
      - {when: feed stale or absent and a whistle of unknown cause, rule: CONFIRM_WINDOW, grade_path: [observed, carried], limits: {foul_to_bug_window_s: 42}, step_at: [0], on_return: LATE_CORRECTION,
         evidence: 'measured: the bug count follows a foul by a median of 7 s, p95 31 s, p99 41 s. After a whistle the cause of which is not known the count is carried (it may be one low) until the bug shows a number: the same number after 42 s means no foul was added. In 9 % of fouls the bug did not show the new count within 45 s, so a blind count can stay carried through a whole stoppage.'}
      - {when: feed stale or absent and no whistle heard, rule: HOLD_UNTIL_EVENT, grade_path: [observed, inferred, carried], limits: {}, on_return: LATE_CORRECTION,
         evidence: 'assumed: a foul needs a whistle (Rule 5-11.1.a), so with audio present and no whistle the count is inferred unchanged; with audio away it is carried. Whistle recall is a planning value (whistle_recall 0.8). Replaced by the measured recall of OQ-LS-3.'}
      - {when: count at or above the cap of the bug, rule: HOLD_UNTIL_EVENT, grade_path: [confirmed, observed], limits: {team_foul_bug_cap: 10}, on_return: SNAP_AND_LOG,
         evidence: 'measured: both tournament broadcasts stop the number at 10 ("10+"), so from the 10th foul the bug can no longer confirm a step (results/state_machine_test/README.md; R-SB-05 compares against the smaller of the count and 10)'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: state record principle 7 - a whistle heard inside a replay is not a new foul'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE,
         evidence: 'assumed: only a technical foul can be charged during a break, which is rare; the count is re-read on return. At half time the reset to 0 is applied by rule at T21 (R-IV-09) and confirmed by the first reading of the second half. Replaced by the count of fouls charged during breaks in the play-by-play of the 33 broadcasts.'}
    conflict: &tf_conflict
      - {between: [pbp_final, scorebug_ocr], tolerance: 0, value_winner: pbp_final, timing_winner: audio, log_to: scoreboard_flags,
         note: 'The bug count must follow inside foul_to_bug_window_s (42 s); a count that never follows, or runs ahead, is a flag. Measured on the two tournament games: the bug equals the fold at 60 of 67 and 61 of 70 samples strictly, and at 67 of 67 and 66 of 70 inside 1 s of game clock.'}
      - {between: [pbp_feed, pbp_final], tolerance: 0, value_winner: pbp_final, timing_winner: audio, log_to: state_corrections, note: 'A row changed after the game (R-SY-20) opens a new state_version.'}
    invariants: &tf_invariants [R-IV-09, new-IV-07, new-IV-20, R-IV-24, R-IV-41, SEG-01, SEG-02]
    consumers: &tf_consumers [bonus_home, bonus_away, fouls_to_give, live_panel, win_probability, free_throw_state, possession_engine]
    freshness_needed_s: &tf_fresh {live_panel: 5.0, win_probability: 10.0}
    params:
      team_foul_bug_cap: {value: 10, unit: fouls, why: 'the bug shows no number above this ("10+"); from here it cannot confirm a step, and the bonus no longer changes', evidence: 'measured: both tournament broadcasts (results/w3_intake/scorebug_summary.md, results/state_machine_test/README.md). Assumed the same for the B1G+ bug until its template is read; to be measured on the 33 broadcasts (fouls above 9 were left out of the lag sample)'}
    notes: >-
      Inside a half the count only rises, so a carried count is a lower bound: true count = held count plus at most
      the number of whistles not yet explained. Blind pass: the count is known only where the bug shows it (54 % of
      clock seconds, late by a median of 7 s) and the foul type is not known at all. The view columns are
      MSU-relative (team_fouls_msu, team_fouls_opp); the stored value is home / away. The 15 s cap of R-SB-03 does
      not fit this field (OQ-LS-4).
  team_fouls_away:
    id: LS-COUNT-02
    group: counts
    name: Team fouls of the away team in this half
    type: int
    unit: fouls
    domain: *tf_domain
    none_value: unknown
    stored: segment
    dimension: team_fouls_away
    lands_in: ['state_segments:team_fouls_away', state_frame.team_fouls_msu, state_frame.team_fouls_opp, state_second.team_fouls_msu, state_second.team_fouls_opp, foul_state.fouls_team_total, fouls.team_fouls_half_after, scoreboard_ocr.team_fouls_away_parsed]
    requirements: *tf_reqs
    profile: counter
    sources: *tf_sources
    update: *tf_update
    timing: *tf_timing
    dropout: *tf_dropout
    conflict: *tf_conflict
    invariants: *tf_invariants
    consumers: *tf_consumers
    freshness_needed_s: *tf_fresh
    notes: 'As team_fouls_home, for the away team.'
  bonus_home:
    id: LS-COUNT-03
    group: counts
    name: Bonus of the home team
    type: enum
    unit: n/a
    domain: &bonus_domain 'none, one_and_one, double_bonus: the bonus this team has reached - one_and_one once the opponent has committed its 7th team foul of the half, double_bonus from its 10th. none is a real value (no bonus yet). What the NEXT foul would bring is this field together with fouls_to_give'
    none_value: unknown
    stored: derived
    dimension: bonus_home
    lands_in: &bonus_lands [state_frame.bonus_state, state_frame.msu_bonus_state, state_frame.opp_bonus_state, state_second.msu_bonus_state, state_second.opp_bonus_state, foul_state.bonus_reached_clock_s, foul_state.double_bonus_reached_clock_s, fouls.bonus_state_after]
    requirements: &bonus_reqs [R-SR-03, R-SR-11, R-IV-09, R-IV-24, R-SY-01]
    profile: derived
    sources: &bonus_sources
      - {sensor: scorebug_ocr, role: confirm, modes: [live, post_blind, post_anchored], resolution: 'the bonus label in the panel of the team; seen in 45 % of the seconds that have a clock. Its meaning is set per scorebug template (see notes)'}
      - {sensor: pbp_final, role: confirm, modes: [post_anchored, pbp_only], resolution: 'a one-and-one or two shots after a common foul shows the bonus that applied (R-IV-24)'}
    derived_from: [team_fouls_away]
    recompute_on: &bonus_recompute 'every change of value or grade of the team-foul count of the opponent'
    valid_if: &bonus_valid >-
      the team-foul count of the opponent is confirmed, observed or inferred; or it is carried and not one below a
      threshold (bonus_from_team_foul minus 1, double_bonus_from_team_foul minus 1). A carried count is a lower
      bound, so one unseen foul can change the bonus only from those two counts; there the value is unknown.
    update: &bonus_update
      changed_by: on_input_change
      event_instant: 'The whistle of the 7th team foul of the opponent in the half (one_and_one) and of its 10th (double_bonus): that foul is itself the first to bring the award (new-IV-07 counts the foul being judged). Back to none when the count resets before the second half. Player-control fouls, and team-control fouls that are not loose-ball fouls, count toward the total but award no free throws (R-SR-03c).'
    timing: &bonus_timing
      driven_by: [team_fouls_away]
      provisional: {by: inputs, p50_s: 7.1, p95_s: 31.1}
      confirmed: {by: inputs, p50_s: 20.1, p95_s: 60.1}
      evidence: 'measured: the team-foul count of the opponent plus derived_compute_s - the bug count comes a median of 7 s and a p95 of 31 s after the foul (measured_sensors.json bug_fields.team_foul_lag_vs_pbp_clock_s). The confirmed value rests on the planning feed delay (assumed, OQ-LS-1).'
    dropout: &bonus_dropout
      - {when: any input below its needed grade, rule: VALID_IF, grade_path: [observed, inferred, carried, unknown], limits: {}, on_return: SNAP_AND_LOG, evidence: 'definition: rule WORST_INPUT'}
      - {when: opponent count carried at one below a threshold, rule: VALID_IF, grade_path: [carried, unknown], limits: {}, on_return: SNAP_AND_LOG,
         evidence: 'definition: team fouls only rise inside a half (R-IV-09), so a carried count of 6 or 9 cannot rule out the foul that brings the bonus. A free-throw award seen meanwhile (a one-and-one, or two shots for a common foul) settles it at grade inferred.'}
      - {when: bug label disagrees with the count, rule: QUARANTINE, grade_path: [observed, carried], limits: {scorebug_up_after_reads: 2}, on_return: SNAP_AND_LOG,
         evidence: 'measured: on the two tournament broadcasts the label "BONUS" appears once the opponent has 6 fouls and "BONUS+" at 9 - it tells what the next foul brings, one foul ahead of this field (results/w3_intake/scorebug_summary.md). The label is compared through the offset of the template; a disagreement that stands for 2 readings is flagged, and the count wins.'}
    conflict: &bonus_conflict
      - {between: [scorebug_ocr, pbp_final], tolerance: 0, value_winner: pbp_final, timing_winner: audio, log_to: scoreboard_flags, note: 'The label is a late and coarse copy of the count; it never sets the value on its own when a count is known.'}
    invariants: &bonus_invariants [R-IV-09, R-IV-24, new-IV-07]
    consumers: &bonus_consumers [live_panel, free_throw_state, possession_engine, expected_points, end_of_period_windows, win_probability]
    params:
      bonus_from_team_foul: {value: 7, unit: fouls, why: 'the team foul of the half from which a common foul awards a one-and-one', evidence: 'rule: 8-2.1 (R-IV-09)', mirrors: 'config/invariants.yaml:constants.bonus_team_foul'}
      double_bonus_from_team_foul: {value: 10, unit: fouls, why: 'the team foul of the half from which a common foul awards two free throws', evidence: 'rule: 8-2.2 (R-IV-09)', mirrors: 'config/invariants.yaml:constants.double_bonus_team_foul'}
      bonus_label_offset_fouls: {value: 1, unit: fouls, why: 'the bonus label of the bug comes on this many fouls before the bonus itself (it announces the next foul); set per scorebug template', evidence: 'measured: the two tournament broadcasts (results/w3_intake/scorebug_summary.md). Assumed the same for the B1G+ bug until its template is read; to be measured on the 33 broadcasts against the play-by-play count'}
    notes: >-
      bonus_home depends on the fouls of the away team. With 6 fouls on the opponent this field is still none while
      fouls_to_give of the opponent is 0: the two together say what the next foul brings. Blind pass: the label and
      a seen free-throw award give the bonus without any play-by-play, at grade inferred. The schema enum of
      state_frame.bonus_state (none, bonus, double_bonus) differs from the state machine (none, one_and_one,
      double_bonus), and its dated note reads the column as what a foul would award now, which is one foul ahead of
      the state-machine rule used here; both recorded for the schema change set.
  bonus_away:
    id: LS-COUNT-04
    group: counts
    name: Bonus of the away team
    type: enum
    unit: n/a
    domain: *bonus_domain
    none_value: unknown
    stored: derived
    dimension: bonus_away
    lands_in: *bonus_lands
    requirements: *bonus_reqs
    profile: derived
    sources: *bonus_sources
    derived_from: [team_fouls_home]
    recompute_on: *bonus_recompute
    valid_if: *bonus_valid
    update: *bonus_update
    timing:
      driven_by: [team_fouls_home]
      provisional: {by: inputs, p50_s: 7.1, p95_s: 31.1}
      confirmed: {by: inputs, p50_s: 20.1, p95_s: 60.1}
      evidence: 'measured: as bonus_home - the team-foul count of the opponent plus derived_compute_s (measured_sensors.json bug_fields.team_foul_lag_vs_pbp_clock_s); the confirmed value rests on the planning feed delay (assumed, OQ-LS-1).'
    dropout: *bonus_dropout
    conflict: *bonus_conflict
    invariants: *bonus_invariants
    consumers: *bonus_consumers
    notes: 'As bonus_home with the teams swapped: it depends on the fouls of the home team.'
  player_fouls:
    id: LS-COUNT-05
    group: counts
    name: Fouls of each player
    type: int
    unit: fouls
    domain: '0-6 per player, one value per player_id of both rosters; a player is out at foul_out_count'
    none_value: unknown
    stored: segment
    dimension: player_fouls
    lands_in: ['state_segments:player_fouls', foul_state.personal_fouls_player_cum, foul_state.flagrant1_player_cum, foul_state.disqualified, fouls.personal_fouls_after, fouls.fouled_out]
    requirements: [R-SR-03, R-MD-16, R-IV-27, R-IV-15]
    profile: counter
    sources:
      - {sensor: pbp_final, role: value, modes: [post_anchored, pbp_only], resolution: 'one row per foul with the fouler and the type; the authority'}
      - {sensor: pbp_feed, role: value, modes: [live], resolution: 'the same rows, late (feed_delay_p50_s); the only live source for who fouled'}
      - {sensor: audio, role: timing, modes: [live, post_blind, post_anchored], resolution: 'about 0.1 s: the whistle'}
      - {sensor: scorebug_ocr, role: fallback, modes: [live, post_blind, post_anchored], resolution: 'the bug has no player fouls; a foul graphic shown after a whistle is read as a weak label (R-MD-16)'}
      - {sensor: cv_events, role: fallback, modes: [live, post_blind, post_anchored], resolution: 'the official reporting the number to the table; a weak cue, not measured'}
    update:
      changed_by: [T00, T09, T18]
      event_instant: 'The count of the fouler steps at the frame of the whistle that signals the foul (T09), by the fouls the rules charge to the player (personal fouls and Class A technicals count toward the limit, R-IV-27). An official correction is T18.'
    timing:
      provisional: {by: pbp_feed, p50_s: 20.0, p95_s: 60.0}
      confirmed: {by: pbp_feed, p50_s: 20.0, p95_s: 60.0}
      evidence: 'assumed: only the scorebook says who fouled, so both grades wait for the feed row (planning values feed_delay_p50_s and feed_delay_p95_s). Replaced by the live capture of OQ-LS-1.'
    dropout:
      - {when: 'feed late: a foul whistle with no row yet', rule: CARRY, grade_path: [confirmed, carried], limits: {feed_stale_after_s: 90}, on_return: LATE_CORRECTION,
         evidence: 'assumed: between the whistle and its row the count of one player on the floor is one low and it is not known whose. The counts of the ten on the floor are carried until the row arrives; after 90 s without it the feed is treated as away. Replaced by the measured feed delay (OQ-LS-1).'}
      - {when: no feed at all (blind pass), rule: CARRY, grade_path: [inferred, unknown], limits: {}, on_return: LATE_CORRECTION,
         evidence: 'definition: the bug does not show player fouls. A blind pass has the whistle and, at best, a foul graphic or the signal of the official; a count from those is inferred, and where neither is seen it is unknown. The foul-trouble flags follow it.'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: state record principle 7'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE, evidence: 'assumed: only a technical foul can be charged during a break, which is rare; the feed row carries it. Replaced by the count of fouls charged during breaks in the play-by-play of the 33 broadcasts.'}
    conflict:
      - {between: [pbp_feed, pbp_final], tolerance: 0, value_winner: pbp_final, timing_winner: audio, log_to: state_corrections, note: 'Wrong credit is a known fault of the live feed; the final file and the box score (foul_state.box_score_match) decide. A changed row opens a new state_version.'}
      - {between: [pbp_final, human], tolerance: 0, value_winner: human, timing_winner: audio, log_to: state_corrections, note: 'review answers'}
    invariants: [R-IV-27, new-IV-11, R-IV-15, SEG-01, SEG-02]
    consumers: [foul_trouble, live_panel, possession_engine, lineup_home, lineup_away, studio]
    freshness_needed_s: {live_panel: 30.0}
    params:
      foul_out_count: {value: 5, unit: fouls, why: 'a player is disqualified at this many fouls and must be replaced within max_dwell.replace_player', evidence: 'rule: 4-12 (R-IV-27)', mirrors: 'config/invariants.yaml:constants.foul_out_count'}
    notes: >-
      Identity on HOLD does not touch this field: the row names the player, not the track. It matters for showing
      the count next to a body on the floor, which is a view. Blind pass: this is the field a blind pass knows least
      about. A disqualified player still on the floor after 20 s breaks R-IV-27 and is a review item.
  foul_trouble:
    id: LS-COUNT-06
    group: counts
    name: Players in foul trouble
    type: list
    unit: player ids
    domain: 'per team, the list of players whose foul count meets the threshold of the moment (see the thresholds in params); empty list = nobody. Disqualified players are not listed'
    none_value: unknown
    stored: derived
    dimension: null
    lands_in: [state_second.foul_trouble_msu, state_second.foul_trouble_opp, foul_state.foul_trouble]
    requirements: [R-SR-11, R-SR-20, R-MD-16]
    profile: derived
    derived_from: [player_fouls, period, game_clock_s]
    recompute_on: 'every foul; the game clock passing 900 s elapsed in the first half and 600 s left in the second; every period start'
    valid_if: >-
      player_fouls is confirmed or carried from a healthy feed, and period is known. When the game-clock interval
      contains a threshold instant (900 s elapsed in the first half, 600 s left in the second), the flag of a player
      whose count lies between the two thresholds is unknown for the width of the interval. With no feed (blind pass)
      the whole value is unknown.
    update:
      changed_by: on_input_change
      event_instant: 'A player is listed while fouls >= foul_trouble_h1_fouls and the first half has run for at most foul_trouble_h1_elapsed_max_s; or fouls >= foul_trouble_h2_early_fouls with more than foul_trouble_h2_split_s left in the second half; or fouls >= foul_trouble_late_fouls with that much or less left in the second half, or in any extra period. The list changes at the whistle of a foul and at the frame the official clock passes a threshold.'
    timing:
      driven_by: [player_fouls]
      provisional: {by: inputs, p50_s: 20.1, p95_s: 60.1}
      confirmed: {by: inputs, p50_s: 20.1, p95_s: 60.1}
      evidence: 'assumed: player_fouls (the feed row, planning values) plus derived_compute_s. A change at a clock threshold is known with the clock (0.2 s). Replaced by the live capture of OQ-LS-1.'
    dropout:
      - {when: any input below its needed grade, rule: VALID_IF, grade_path: [observed, inferred, carried, unknown], limits: {}, on_return: SNAP_AND_LOG, evidence: 'definition: rule WORST_INPUT'}
      - {when: game clock carried across a threshold instant, rule: VALID_IF, grade_path: [observed, carried, unknown], limits: {clock_carried_max_s: 30}, on_return: SNAP_AND_LOG, evidence: 'definition: the guaranteed interval of the clock decides which threshold applies; outside the two threshold instants the list does not depend on the clock grade'}
    conflict: []
    invariants: []
    consumers: [live_panel, possession_engine, studio, lineup_home, lineup_away]
    params:
      foul_trouble_h1_fouls: {value: 2, unit: fouls, why: 'fouls that mean trouble early in the first half', evidence: 'decision: K10 as changed by the owner (R-SR-20)', mirrors: 'config/invariants.yaml:constants.foul_trouble.half_1.fouls'}
      foul_trouble_h1_elapsed_max_s: {value: 900, unit: s, why: 'the first-half threshold applies while the half has run for at most this long', evidence: 'decision: K10 as changed by the owner (R-SR-20)', mirrors: 'config/invariants.yaml:constants.foul_trouble.half_1.while_elapsed_s_at_most'}
      foul_trouble_h2_early_fouls: {value: 3, unit: fouls, why: 'fouls that mean trouble early in the second half', evidence: 'decision: K10 as changed by the owner (R-SR-20)', mirrors: 'config/invariants.yaml:constants.foul_trouble.half_2_early.fouls'}
      foul_trouble_h2_split_s: {value: 600, unit: s, why: 'game clock left in the second half that separates the early threshold from the late one', evidence: 'decision: K10 as changed by the owner (R-SR-20)', mirrors: 'config/invariants.yaml:constants.foul_trouble.half_2_early.while_remaining_s_above'}
      foul_trouble_late_fouls: {value: 4, unit: fouls, why: 'fouls that mean trouble late in the second half and in every extra period', evidence: 'decision: K10 as changed by the owner (R-SR-20)', mirrors: 'config/invariants.yaml:constants.foul_trouble.half_2_late_and_ot.fouls'}
    notes: >-
      The 2 / 4 rule (2 in the first half, 4 after it) is kept as a named view, read from the same config. The
      schema text of state_second.foul_trouble_msu still describes the 2 / 4 rule; recorded for the schema change
      set. Open point: K10 names no threshold for the last 300 s of the first half, so by the letter nobody is in
      foul trouble there (see the report of this baseline for the recommended answer). Blind pass: unknown.
  fouls_to_give:
    id: LS-COUNT-07
    group: counts
    name: Fouls to give of each team
    type: struct
    unit: fouls
    domain: 'two values, home and away, each 0-6: the common fouls the team can still commit in this half before the next one puts the opponent in the bonus = max(0, bonus_from_team_foul - 1 - team fouls)'
    none_value: unknown
    stored: derived
    dimension: null
    lands_in: [state_second.fouls_to_give_msu, state_second.fouls_to_give_opp, foul_state.fouls_to_give_start]
    requirements: [R-SR-03, R-SR-11]
    profile: derived
    derived_from: [team_fouls_home, team_fouls_away]
    recompute_on: 'every change of value or grade of either team-foul count'
    valid_if: >-
      the team-foul count is confirmed, observed or inferred. With a carried count the value is an upper bound (the
      true number may be one lower per whistle not yet explained); it is exact again once the count is 6 or more,
      because the value is then 0 whatever was missed.
    update:
      changed_by: on_input_change
      event_instant: 'Falls by one at the whistle of each team foul of the half until it reaches 0 at the 6th; returns to 6 when the count resets before the second half. It does not return in an extra period.'
    timing:
      driven_by: [team_fouls_home, team_fouls_away]
      provisional: {by: inputs, p50_s: 7.1, p95_s: 31.1}
      confirmed: {by: inputs, p50_s: 20.1, p95_s: 60.1}
      evidence: 'measured: the team-foul counts plus derived_compute_s (bug count a median of 7 s and a p95 of 31 s after the foul, measured_sensors.json bug_fields.team_foul_lag_vs_pbp_clock_s); the confirmed value rests on the planning feed delay (assumed, OQ-LS-1).'
    dropout:
      - {when: any input below its needed grade, rule: VALID_IF, grade_path: [observed, inferred, carried, unknown], limits: {}, on_return: SNAP_AND_LOG, evidence: 'definition: rule WORST_INPUT'}
      - {when: team-foul count carried after a whistle of unknown cause, rule: VALID_IF, grade_path: [observed, carried], limits: {foul_to_bug_window_s: 42}, step_at: [0], on_return: SNAP_AND_LOG,
         evidence: 'measured: the bug needs up to 42 s (p99 41 s plus 1 s) to show a foul. In the last minute of a half that is too slow for the foul-to-give decision, so late in a half this value is trusted only from the feed or from a count the bug has confirmed after the last whistle.'}
    conflict: []
    invariants: [R-IV-09, new-IV-07]
    consumers: [end_of_period_windows, live_panel, possession_engine, win_probability]
    freshness_needed_s: {end_of_period_windows: 5.0}
    notes: >-
      The consumer that needs it most (the end of a half, a defence with a foul to give) needs it faster than the
      bug delivers: median 7 s against a need of about 5 s. This is the strongest case in this file for measuring
      the live feed delay (OQ-LS-1). Blind pass: an upper bound from the bug count.
  timeouts_left_home:
    id: LS-COUNT-08
    group: counts
    name: Timeouts left of the home team
    type: int
    unit: timeouts
    domain: &to_domain '0-6 in total, with the split by length as a view (30 s and 60 s in the media format; 75 s and 30 s otherwise); the allotment comes from timeout_format'
    none_value: unknown
    stored: segment
    dimension: timeouts_left_home
    lands_in: &to_lands_home ['state_segments:timeouts_left_home', state_frame.timeouts_msu, state_frame.timeouts_opp, state_frame.to30_left_msu, state_frame.to60_left_msu, state_frame.to75_left_msu, state_frame.to30_left_opp, state_frame.to60_left_opp, state_frame.to75_left_opp, state_second.timeouts_msu, state_second.timeouts_opp, timeouts.left_after_msu, timeouts.left_after_opp, timeouts.halftime_carry_loss, scoreboard_ocr.timeouts_home_parsed]
    requirements: &to_reqs [R-SR-04, R-IV-10, R-IV-28, R-IV-29, R-IV-39, R-SY-01, R-SY-14, R-MD-22]
    profile: counter
    sources: &to_sources
      - {sensor: pbp_final, role: value, modes: [post_anchored, pbp_only], resolution: 'one row per timeout with the team and the kind; the authority, and the only source for who called it'}
      - {sensor: pbp_feed, role: value, modes: [live], resolution: 'the same rows, late (feed_delay_p50_s)'}
      - {sensor: scorebug_ocr, role: confirm, modes: [live, post_blind, post_anchored], resolution: '1 timeout: bars or a number per team; readable in 59 % of the seconds that have a clock'}
      - {sensor: audio, role: timing, modes: [live, post_blind, post_anchored], resolution: 'about 0.1 s: the whistle that grants it and the horns that end it'}
    update: &to_update
      changed_by: [T00, T16, T17, T21]
      event_instant: 'Falls by one at the frame the official grants a charged timeout (T16); a media timeout charges nobody unless a team timeout became it. Falls by one at the ruling of a failed challenge (T17); a challenge that succeeds keeps the timeout. At the intermission (T21): before the second half the carry rule of the format applies (in the media format at most two 30-second timeouts go over); before each extra period one timeout is added (R-IV-10).'
    timing: &to_timing
      provisional: {by: pbp_feed, p50_s: 20.0, p95_s: 60.0}
      confirmed: {by: scorebug_ocr, p50_s: 75.0, p95_s: 180.0}
      evidence: 'assumed: provisional = the feed row at the planning delay (OQ-LS-1). Confirmed = the bug read again when the broadcast returns from the break: 75 s (a full timeout) as the middle case and about 180 s (a media break) as the long one. Both are not measured. Replaced by the live capture of OQ-LS-1 and by the timeout-to-bug lag of R-SY-14 (the 33 broadcasts hold the readings; their breaks are shortened, so the lag there is in video time only).'
    dropout: &to_dropout
      - {when: bug count not shown or unreadable while the feed is healthy, rule: HOLD_UNTIL_EVENT, grade_path: [confirmed, observed], limits: {}, on_return: SNAP_AND_LOG,
         evidence: 'measured: timeouts are readable in 59 % of the seconds that have a clock (measured_sensors.json bug_fields.timeouts_read_share). A timeout cannot pass unseen: the game stops for at least 30 s. The feed says whose it was.'}
      - {when: feed stale or absent and a break whose owner is not known, rule: CARRY, grade_path: [observed, inferred, carried], limits: {}, on_return: LATE_CORRECTION,
         evidence: 'assumed: at the first dead ball at or after a media mark the break is taken to be the media timeout (Rule 5-14.10) and both counts are inferred unchanged; any other break leaves both counts carried until the bug returns. Replaced by the agreement of this rule with the play-by-play timeouts on the 33 broadcasts.'}
      - {when: review or challenge in progress, rule: CONFIRM_WINDOW, grade_path: [observed, inferred], limits: {}, on_return: SNAP_AND_LOG,
         evidence: 'measured: on the tournament bug the bar of the challenging team dropped by one during the challenge and came back when it succeeded (results/w3_intake/scorebug_summary.md). A drop seen during a challenge is held as inferred until the ruling; it is not a correction when it returns.'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: state record principle 7'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE,
         evidence: 'rule: 5-14 - the break is the event. A second timeout can follow the first inside one break (T16 is allowed from a timeout), so the count is re-read on return and a step of two is accepted when the feed or the length of the break supports it.'}
    conflict: &to_conflict
      - {between: [pbp_final, scorebug_ocr], tolerance: 0, value_winner: pbp_final, timing_winner: audio, log_to: scoreboard_flags,
         note: 'Measured on the two tournament games: the bug equals the fold at 61 of 67 and 66 of 69 samples strictly and at 66 of 67 and 69 of 69 inside 1 s of game clock; every bar change matched a team timeout of the play-by-play.'}
      - {between: [pbp_feed, pbp_final], tolerance: 0, value_winner: pbp_final, timing_winner: audio, log_to: state_corrections, note: 'A changed row opens a new state_version.'}
    invariants: &to_invariants [R-IV-10, new-IV-12, new-IV-13, new-IV-14, new-IV-28, SEG-01, SEG-02]
    consumers: &to_consumers [live_panel, win_probability, possession_engine, end_of_period_windows, challenge_available_home, challenge_available_away, studio]
    freshness_needed_s: &to_fresh {live_panel: 30.0, win_probability: 30.0}
    notes: >-
      The allotment is fixed before tip by timeout_format (three 30 s and one 60 s in the media format; four 75 s
      and two 30 s otherwise; config/invariants.yaml constants.timeouts). The split by length is a view computed
      from the kinds of the timeouts used. Blind pass: the total is known from the bug and from the breaks
      themselves; who called it and the kind are not known without the play-by-play, so the split by length is
      inferred from the length of the break. In a recording with shortened breaks that length is lost too.
  timeouts_left_away:
    id: LS-COUNT-09
    group: counts
    name: Timeouts left of the away team
    type: int
    unit: timeouts
    domain: *to_domain
    none_value: unknown
    stored: segment
    dimension: timeouts_left_away
    lands_in: ['state_segments:timeouts_left_away', state_frame.timeouts_msu, state_frame.timeouts_opp, state_frame.to30_left_msu, state_frame.to60_left_msu, state_frame.to75_left_msu, state_frame.to30_left_opp, state_frame.to60_left_opp, state_frame.to75_left_opp, state_second.timeouts_msu, state_second.timeouts_opp, timeouts.left_after_msu, timeouts.left_after_opp, timeouts.halftime_carry_loss, scoreboard_ocr.timeouts_away_parsed]
    requirements: *to_reqs
    profile: counter
    sources: *to_sources
    update: *to_update
    timing: *to_timing
    dropout: *to_dropout
    conflict: *to_conflict
    invariants: *to_invariants
    consumers: *to_consumers
    freshness_needed_s: *to_fresh
    notes: 'As timeouts_left_home, for the away team.'
  challenge_available_home:
    id: LS-COUNT-10
    group: counts
    name: Coach's challenge left, home team
    type: bool
    unit: n/a
    domain: &ch_domain 'true while the team still has a challenge: challenges_per_game at the start, and challenge_extra_if_overturned more only if the first one was overturned. Whether it can be used now also needs a timeout left (view challenge_usable)'
    none_value: unknown
    stored: segment
    dimension: challenge_available_home
    lands_in: ['state_segments:challenge_available_home', state_frame.challenge_available_msu, state_frame.challenge_available_opp, reviews.challenge_number, reviews.outcome, reviews.timeout_charged, coaches_challenges.second_challenge_earned]
    requirements: &ch_reqs [R-SR-04, R-IV-29, R-MD-22]
    profile: counter
    sources: &ch_sources
      - {sensor: pbp_final, role: value, modes: [post_anchored, pbp_only], resolution: 'the challenge row and its text (stands or overturned); the text is used where the play type disagrees with it'}
      - {sensor: pbp_feed, role: value, modes: [live], resolution: 'the same rows, late (feed_delay_p50_s)'}
      - {sensor: scorebug_ocr, role: confirm, modes: [live, post_blind, post_anchored], resolution: 'the timeout bar of the team: it drops during a challenge and comes back if the call is overturned'}
      - {sensor: cv_events, role: timing, modes: [live, post_blind, post_anchored], resolution: 'the start and end of the monitor review (officials at the table, replay segments, the ruling signal)'}
    update: &ch_update
      changed_by: [T00, T17]
      event_instant: 'Changes at the frame the ruling of a challenge is given (T17): to false when the call stands, or when a second challenge has now been used; it stays true when the first challenge is overturned (Rule 11-4.1, R-IV-29). The request itself does not change the value.'
    timing: &ch_timing
      provisional: {by: pbp_feed, p50_s: 20.0, p95_s: 60.0}
      confirmed: {by: pbp_feed, p50_s: 20.0, p95_s: 60.0}
      evidence: 'assumed: only the scorebook says that a review was a challenge and how it ended, so both grades wait for the feed row (planning values, OQ-LS-1). The bar of the bug gives the outcome earlier in the blind pass, at grade inferred. Replaced by the live capture of OQ-LS-1.'
    dropout: &ch_dropout
      - {when: 'feed late: a review seen with no row yet', rule: CARRY, grade_path: [confirmed, carried], limits: {feed_stale_after_s: 90}, on_return: LATE_CORRECTION,
         evidence: 'assumed: a monitor review is seen on the broadcast, but whether it is a challenge and by whom comes with the row; both values are carried until then. Replaced by the measured feed delay (OQ-LS-1).'}
      - {when: no feed at all (blind pass), rule: CARRY, grade_path: [observed, inferred, unknown], limits: {}, on_return: LATE_CORRECTION,
         evidence: 'measured: one challenge on the tournament bug - the bar dropped during it and came back after it succeeded (results/w3_intake/scorebug_summary.md). From the bar a blind pass infers the challenge and its outcome; with no bar in view the value is unknown after the first review of the game.'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: state record principle 7 - a review is shown through replays; the ruling is taken from live picture only'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE, evidence: 'assumed: a broadcast often leaves for a break during a long review; the ruling is then read from the feed row or from the bar on return. Replaced by the share of rulings given off air on the 33 broadcasts.'}
    conflict: &ch_conflict
      - {between: [pbp_final, scorebug_ocr], tolerance: 0, value_winner: pbp_final, timing_winner: cv_events, log_to: scoreboard_flags, note: 'Measured: the provider play type said "Stands" for both challenges of one game while the text said overturned and the bar came back; the text and the bar agree and are used (results/state_machine_test/README.md).'}
    invariants: &ch_invariants [new-IV-14, R-IV-29, SEG-01, SEG-02]
    consumers: &ch_consumers [live_panel, possession_engine, studio]
    params:
      challenges_per_game: {value: 1, unit: challenges, why: 'each team starts the game with this many challenges', evidence: 'rule: 11-4.1 (R-IV-29)', mirrors: 'config/invariants.yaml:constants.challenges.per_game'}
      challenge_extra_if_overturned: {value: 1, unit: challenges, why: 'a team gets this many more only after its first challenge is overturned', evidence: 'rule: 11-4.1 (R-IV-29)', mirrors: 'config/invariants.yaml:constants.challenges.extra_if_overturned'}
    notes: >-
      The index gives this field the counter profile; it is a boolean that changes only at a ruling. A challenge also
      needs a legal timeout: the view challenge_usable = challenge available and timeouts left of the team at least 1
      (new-IV-14). Which calls may be challenged, and until when, is R-IV-29. Blind pass: inferred from the bar and
      the review, as above.
  challenge_available_away:
    id: LS-COUNT-11
    group: counts
    name: Coach's challenge left, away team
    type: bool
    unit: n/a
    domain: *ch_domain
    none_value: unknown
    stored: segment
    dimension: challenge_available_away
    lands_in: ['state_segments:challenge_available_away', state_frame.challenge_available_msu, state_frame.challenge_available_opp, reviews.challenge_number, reviews.outcome, reviews.timeout_charged, coaches_challenges.second_challenge_earned]
    requirements: *ch_reqs
    profile: counter
    sources: *ch_sources
    update: *ch_update
    timing: *ch_timing
    dropout: *ch_dropout
    conflict: *ch_conflict
    invariants: *ch_invariants
    consumers: *ch_consumers
    notes: 'As challenge_available_home, for the away team.'
