# Names with a dot are columns of state_frame or state_second that no field carries.
out_of_scope:
  closely_guarded_hold_s: 'R-SR-19 is per touch (touches.closely_guarded_hold_s), an event measure, not a state value held at every instant.'
  frame_team: 'Named-spots follow-up 18 (the team whose attacked basket defines the frame) is a proposed state-machine dimension, not yet in config/state_machine.yaml; added to the index when the dimension lands.'
  frontcourt_status: 'R-MD-26 (frontcourt status of the team in control, per frame) is outside the four inventories of 0.1.0 and has no column yet; candidate for 0.2.0, next to backcourt_count_s.'
  secs_since_last_score: 'R-MD-28 (seconds since each team''s last made field goal and last point; Should) is outside the four inventories of 0.1.0; candidate for 0.2.0.'
  state_frame.invariant_breaks: 'Row bookkeeping - the invariants broken at this frame. Its effect on a value is that value''s grade (stamp_grade = quarantined).'
  state_frame.flag_ids: 'Row bookkeeping - pointers to scoreboard_flags rows.'
  state_frame.correction_ids: 'Row bookkeeping - pointers to state_corrections rows.'
  state_frame.model_version: 'Run bookkeeping (R-MD-09) - the same for every row of a run.'
  state_frame.created_utc: 'Run bookkeeping - when the row was written. Not the time the value became known (stamp_known_at_utc).'
  state_second.time_base: 'Row key of the per-second view (video seconds or game-clock seconds).'
  state_second.t_index: 'Row key of the per-second view.'
  state_second.invariant_breaks: 'Row bookkeeping, as in state_frame.'
  state_second.model_version: 'Run bookkeeping, as in state_frame.'
  state_second.created_utc: 'Run bookkeeping, as in state_frame.'

# ---------------------------------------------------------------------------------------------------------------------
# The audit behind ACC-LS-2, kept executable. Four inventories; each entry maps to fields of the index.
# The lint checks: every column of state_frame and state_second is under a field here or in out_of_scope; a field's
# record lists its columns in lands_in and cites its R-SR rows in requirements. (The fourth inventory, the 32
# state-machine dimensions, is the dimension key of the index.)
inventory:
  columns:   # field -> columns of state_frame (sf) and state_second (ss) that its record must list in lands_in
    game_id:            [state_frame.game_id, state_second.game_id]
    pass:               [state_frame.pass, state_second.pass]
    video_frame:        [state_frame.video_id, state_frame.frame_index, state_second.video_id]
    game_context:       [state_frame.season, state_frame.game_type]
    stamp_src:          [state_frame.period_src, state_frame.game_clock_src, state_frame.shot_clock_src, state_frame.live_ball_src, state_frame.score_src, state_frame.fouls_src, state_frame.timeouts_src, state_frame.possession_src, state_frame.ball_src, state_frame.players_src, state_frame.broadcast_src, state_frame.source, state_second.clock_src, state_second.possession_src, state_second.fouls_src, state_second.ft_src, state_second.source]
    stamp_conf:         [state_frame.period_conf, state_frame.game_clock_conf, state_frame.shot_clock_conf, state_frame.live_ball_conf, state_frame.score_conf, state_frame.fouls_conf, state_frame.timeouts_conf, state_frame.possession_conf, state_frame.ball_conf, state_frame.players_conf, state_frame.broadcast_conf, state_frame.confidence, state_second.clock_conf, state_second.possession_conf, state_second.fouls_conf, state_second.ft_conf, state_second.confidence]
    stamp_grade:        [state_frame.period_dq, state_frame.game_clock_dq, state_frame.shot_clock_dq, state_frame.live_ball_dq, state_frame.score_dq, state_frame.fouls_dq, state_frame.timeouts_dq, state_frame.possession_dq, state_frame.ball_dq, state_frame.players_dq, state_frame.broadcast_dq, state_second.clock_dq, state_second.possession_dq, state_second.fouls_dq, state_second.ft_dq]
    period:             [state_frame.period, state_second.period]
    game_clock_s:       [state_frame.game_clock_s, state_frame.clock_inferred, state_second.game_clock_s]
    game_clock_running: [state_frame.clock_running, state_second.clock_running_share]
    shot_clock_s:       [state_frame.shot_clock_s, state_second.shot_clock_s]
    shot_clock_status:  [state_frame.shot_clock_status, state_second.shot_clock_status]
    video_ts_ms:        [state_frame.video_ts_ms, state_second.video_ts_ms_start]
    media_segment:      [state_second.media_segment_id]
    five_min_window:    [state_second.five_min_window_id, state_second.ten_min_bucket_id]
    score_home:         &score [state_frame.score_msu, state_frame.score_opp, state_frame.last_score_event_id, state_second.score_msu, state_second.score_opp]
    score_away:         *score
    margin:             [state_frame.margin, state_second.margin]
    current_run:        [state_second.run_msu_2min, state_second.run_opp_2min]
    lead_changes:       [state_second.lead_changes]
    team_fouls_home:    &tf [state_frame.team_fouls_msu, state_frame.team_fouls_opp, state_second.team_fouls_msu, state_second.team_fouls_opp]
    team_fouls_away:    *tf
    bonus_home:         &bonus [state_frame.bonus_state, state_frame.msu_bonus_state, state_frame.opp_bonus_state, state_second.msu_bonus_state, state_second.opp_bonus_state]
    bonus_away:         *bonus
    foul_trouble:       [state_second.foul_trouble_msu, state_second.foul_trouble_opp]
    fouls_to_give:      [state_second.fouls_to_give_msu, state_second.fouls_to_give_opp]
    timeouts_left_home: &to [state_frame.timeouts_msu, state_frame.timeouts_opp, state_frame.to30_left_msu, state_frame.to60_left_msu, state_frame.to75_left_msu, state_frame.to30_left_opp, state_frame.to60_left_opp, state_frame.to75_left_opp, state_second.timeouts_msu, state_second.timeouts_opp]
    timeouts_left_away: *to
    challenge_available_home: &ch [state_frame.challenge_available_msu, state_frame.challenge_available_opp]
    challenge_available_away: *ch
    possession_team:    [state_frame.team_in_possession, state_second.team_in_possession]
    possession_seq:     [state_frame.possession_id, state_second.possession_id]
    chance_seq:         [state_frame.chance_id, state_frame.chance_number, state_second.chance_id, state_second.chance_number]
    ball_status:        [state_frame.live_ball]
    try_in_flight:      [state_frame.try_in_flight, state_frame.ring_contact_this_try]
    flow_state:         [state_second.phase]
    restart_pending:    [state_frame.inbound_side]
    stoppage:           [state_frame.stoppage_kind]
    arrow:              [state_frame.possession_arrow, state_second.possession_arrow]
    basket_attacked_home: [state_frame.basket_attacked]
    ball_position:      [state_frame.ball_x_m, state_frame.ball_y_m, state_frame.ball_z_m, state_frame.ball_r_m, state_frame.ball_theta_deg, state_frame.ball_inferred]
    ball_handler:       [state_frame.ball_handler_player_id]
    secs_since_control_change: [state_second.secs_since_control_change]
    free_throw_state:   [state_second.ft_state, state_second.ft_sequence_id, state_second.ft_attempt_k, state_second.ft_attempts_n, state_second.ft_predicted, state_second.ft_pred_prob]
    ball_control_state: [state_frame.ball_control_state, state_second.share_msu_ball, state_second.share_opponent_ball, state_second.share_contested, state_second.share_in_flight, state_second.share_inbound_pending, state_second.share_dead]
    lineup_home:        &five [state_frame.players_on_floor]
    lineup_away:        *five
    defense_scheme:     [state_frame.defense_scheme_state, state_frame.defense_scheme_confidence]
    clutch:             [state_second.clutch_flag, state_second.last4_flag]
    end_of_period_windows: [state_second.two_for_one_window, state_second.foul_to_extend_window, state_second.last_shot_window]
    expected_points:    [state_second.xpts_possession]
    camera_shot_type:   [state_frame.camera_shot_type, state_frame.reverse_angle]
    scorebug_visible:   [state_frame.scorebug_visible]
    replay_flag:        [state_frame.replay_flag]
    coverage_score:     [state_frame.coverage_score]
    court_mapping_conf: [state_frame.court_mapping_conf]
    ball_visible:       [state_frame.ball_visible]
    court_visible_frac: [state_frame.court_visible_frac]
  requirements:   # R-SR row -> the fields whose records must cite it (R-SR-12 and R-SR-19 are Should rows)
    R-SR-01: [period, game_clock_s, shot_clock_s, shot_clock_status, ball_status]
    R-SR-02: [score_home, score_away]
    R-SR-03: [team_fouls_home, team_fouls_away, player_fouls, bonus_home, bonus_away, fouls_to_give]
    R-SR-04: [timeouts_left_home, timeouts_left_away, challenge_available_home, challenge_available_away, timeout_format, media_segment, stoppage]
    R-SR-05: [possession_team, possession_seq, chance_seq, flow_state, secs_since_control_change, arrow]
    R-SR-06: [ball_control_state, ball_handler, try_in_flight, ball_position, ball_visible]
    R-SR-07: [lineup_home, lineup_away, player_identity, player_positions, stint_length_s, officials_positions]
    R-SR-08: [restart_pending, stoppage]
    R-SR-09: [free_throw_state]
    R-SR-10: [camera_shot_type, court_visible_frac, court_mapping_conf, scorebug_visible, replay_flag]
    R-SR-11: [end_of_period_windows, shot_clock_off, fouls_to_give, bonus_home, bonus_away, foul_trouble]
    R-SR-12: [expected_points]
