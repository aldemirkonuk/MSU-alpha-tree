# ---------------------------------------------------------------------------------------------------------------------
acceptance:
  ACC-LS-1:  {metric: lint, scope: this pack, threshold: 'tools/specgen/live_state/lslib.py --check reports 0 problems', on_fail: 'spec defect - fix before 0.1.x is accepted'}
  ACC-LS-2:  {metric: coverage of the inventory, scope: 'the 32 state-machine dimensions, the columns of state_frame and state_second, R-SR-01..20, the 10 groups of the 19 Oct page (section inventory)', threshold: 'every one maps to a field or to out_of_scope with a reason', on_fail: 'add the field'}
  ACC-LS-H1: {metric: grade honesty of the game clock and the shot clock, scope: 'real-data replay, hidden seconds graded inferred, every configuration', threshold: 'share within clock_tolerance_s >= clock_inferred_promise, pooled and at every age with at least 200 inferred seconds', on_fail: 'shorten the inferred limit until it holds; record in the journal'}
  ACC-LS-H2: {metric: impossible values, scope: 'real-data replay, every second', threshold: '0 nulls; the game clock never rises by more than clock_tolerance_s and the score never falls without a log row at that instant; no value graded observed or confirmed at an instant with no observation of it', on_fail: 'fuser or rule defect'}
  ACC-LS-H3: {metric: return behaviour, scope: 'real-data replay, every bug return', threshold: 'value equals the reading and is graded observed at the reading that follows a return (scorebug_up_after_reads); every miss beyond snap_log_tolerance_s has a log row, whatever the grade was', on_fail: 'rule defect'}
  ACC-LS-H4: {metric: benefit of the rule, scope: 'real-data replay', threshold: 'the share within clock_tolerance_s of the spec rule is not below plain last-status (on the readings the fuser accepted) at any age; reported for every run of cue_configs', on_fail: 'rule defect'}
  ACC-LS-G1: {metric: clock state on gold-v1, scope: 'R-SR-01', threshold: '>= 99.5 % of frames within 0.1 s where the bug is visible (requirement text); hidden frames reported by age and grade', on_fail: 'OCR or clock-map work'}
  ACC-LS-G2: {metric: score state on gold-v1, scope: 'R-SR-02, R-IV-04, R-MB', threshold: 'final equals the box score; every change matched; provisional makes confirmed inside make_confirm_window_s or flagged', on_fail: 'made-basket or scoreboard review'}
  ACC-LS-L1: {metric: latency report, scope: 'every processed game', threshold: 'a per-field table of event, observed and known times exists (K23 - reported, not gated)', on_fail: 'run record incomplete'}

harness:
  summary: 'Two parts. (1) Real-data replay (harness.py) - the reference fuser runs on the real 1 fps scorebug readings of the private broadcasts with extra stretches hidden on purpose, and is scored against the readings it was not shown. (2) Synthetic rule tests (tests/live_state/test_live_state_rules.py) - hand-built timelines that assert each rule, and every dropout rule and max-dwell bound of every field on the generic machine (fuse.GradeTrack).'
  inputs: 'private: ~/MSU-Alpha-3-private/work/review_tool/msu/state/<game>/ (align.json, ocr.jsonl) and the CBBD play-by-play files; aggregates only in results/live_state_test/'
  params:
    extra_hidden_share: {value: 0.15, unit: share, why: share of visible seconds hidden on purpose per game, evidence: 'assumed: enough hidden seconds per game (about 500) without changing the game'}
    hidden_length_source: {value: measured, unit: n/a, why: lengths of the extra hidden stretches are bootstrapped from the real hidden-stretch distribution, evidence: 'measured: measured_sensors.json clock.hidden_runs'}
    feed_delay_sweep_s: {value: [none, 0, 15, 45], unit: s, why: 'absolute feed latency is not measured, so the replay is run across this range. Each play-by-play score row arrives this long after the video second at which the bug clock showed its clock second; none = no feed (the cue runs)', evidence: 'assumed: brackets the planning values of OQ-LS-1'}
    cue_configs: {value: [[0.0, 0.0, 0.0], [0.8, 0.0, 0.0], [0.8, 0.8, 0.8], [1.0, 1.0, 1.0]], unit: 'recall of the stop cue, the start cue and the shot-clock reset cue', why: 'stand-ins for whistle audio and CV - the true stop and start instants of the clock and the true shot-clock resets, each delivered with this probability. Four runs: no cue; stop cues at whistle_recall; all three cues at whistle_recall; all three always (the upper bound)', evidence: 'assumed: no cue sensor is measured yet (OQ-LS-3); the sweep brackets it'}
    shot_slot_configs: {value: [0.0, 0.8, 1.0], unit: recall of the shot-clock reset cue, why: 'runs in which only the shot-clock slot is hidden while the game clock stays read (rule FOLLOW_FIELD) - with no reset detector, with resets seen at whistle_recall, and with every reset seen', evidence: 'assumed: that CV sees a reset cause is not measured; the three runs bracket it'}
    seeds: {value: 3, unit: count, why: repeat the random hiding, evidence: 'assumed: enough to show the spread between seeds; raised if the seeds disagree'}
  results_file: results/live_state_test/harness.json

journal:
  - version: 0.1.0
    date: '2026-11-11'
    entries:
      - 'First deep spec of the live game state (baseline 4). Core contract: three time axes and two as-of views, six grades and quarantine, eight sensors with health signals, a rule library, eight profiles, max-dwell bounds from the rules book, degradation levels, reconciliation windows.'
      - 'Limits set from measurements on 33 MSU broadcasts (44.6 h, 1 OCR frame per second; tools/specgen/live_state/measure_real.py): clock dead-reckoning is trusted for 3 s (93.8 % within 1 s on withheld readings), dropped after 30 s; a play-by-play make shows on the bug within 12 s (p99 11 s); the bug foul count within 42 s (p99 41 s).'
      - 'Check of the core (11 Nov). Every measured number compared with results/live_state_test/measured_sensors.json and results/w3_intake: all agree, one text was wrong - the bug is NOT rare in tight shots (31 of 37 sampled tight shots show it); corrected. Nine params now name their key in measured_sensors.json and the lint re-checks them.'
      - 'No outside research for 0.1.0 (the web step was skipped): every value without a measurement stays assumed and now names the measurement that will replace it. Every evidence string starts with a tag from conventions.evidence_tags (lint).'
      - 'Rules book check: all max-dwell rule numbers confirmed in the 2026-27 book. Corrected: the backcourt case rulings are A.R. 9-26 to 9-29 (not 9-34, 9-35); the shot clock is 2-11.1 and 9-11.1; 3-6.3.a added to the 20 s replacement; pages added. New entry halftime_tournament (1,200 s, Rule 5-8 note). Bounds that repeat config/invariants.yaml constants now mirror them (lint).'
      - 'Inventory audit made executable (section inventory). Added four fields: ball_control_state (LS-POSS-18), ball_visible (LS-OBS-10), court_visible_frac (LS-OBS-11), audio_present (LS-OBS-12). The index is 94 fields. The index now names the state-machine dimension of each of the 32 fields that carry one. Ten bookkeeping columns and two requirement rows outside the four inventories (R-MD-26, R-MD-28) are listed under out_of_scope.'
      - 'Added what the design names and the file lacked: a delay model per sensor (median and p95 as params), health.fields per sensor, the rule QUARANTINE, explicit reconciliation windows and their re-set rule, the composition rule of the latency budget, make-window bounds (3-15 s, K02).'
      - 'Corrected: requirement ids N-MD-01 / N-MD-02 are R-MD-21 / R-MD-22 in the live requirements. frame_to_state_s was 0.3 s while four profiles budget a 0.1 s median; it is now the median 0.1 s with frame_to_state_p95_s 0.3 s.'
  - version: 0.1.0
    date: '2026-11-20'
    entries:
      - 'Integration of the three fields files and the evidence step. Lint 0 problems on 94 fields; 139 params, of which the reference code reads 66 and 73 are listed under production_only_params with the reason.'
      - 'Asked for by the field authors and added: sensors stream (frame heartbeat, level D5_no_video; stream_lost_after_s moved here) and pipeline (the run - pass, state_version, stamps); rules FOLLOW_FIELD and RULE_DEFAULT; CUE_RECKON widened to the running flags and the shot-clock reset; the counter profile now says carried from the first missed second when nothing watches (20 s is only the stale mark); D5 and the feed_stale flag are set by heartbeats, outside T25; a frozen picture is level D4.'
      - 'Found and corrected: seven dropout rule texts whose `when` was cut at a comma by YAML (one in the roster profile, six in fields_play; nine field rules in all). The lint now refuses any unknown key on a dropout rule.'
      - 'New convention grade_path_timing and key step_at: how the limits of a rule time the steps of its grade path, so that code can read every rule. 16 rules carry an explicit step_at. Max-dwell bounds now say which time they count in (counts_in real or game_clock): a shot-clock period does not elapse during a timeout.'
      - 'Off-screen point estimate: 8 s (assumed) became 10 s, the value of R-DT-07, so that core and the requirement no longer differ.'
      - 'Reference fuser (fuse.py), generic grade machine, synthetic rule tests and real-data replay (harness.py) written. Replay of 33 broadcasts, 3 seeds, 10 configurations, 56,625 hidden seconds per configuration (results/live_state_test/). All five checks pass.'
      - 'Replay result, game clock: the 3 s inferred horizon stands - within 1 s in 99.7 %, 96.5 % and 93.9 % of inferred seconds at 1, 2 and 3 s, 97.1 % pooled, worst game 93.9 %.'
      - 'Limit changed by the replay, shot clock: inferred for 1 s only (new param shot_clock_inferred_max_s; was 3 s with the bug away and 5 s with only the slot unreadable). At 1 s the reckoned value is within 1 s in 96.0 % even with nothing watching for a reset; at 2 s it is 81.5 %, and 88.7 % with every visible reset delivered as a cue - below the 0.90 promise. The condition "CV watching for a reset" was dropped from the claim: it is not needed at 1 s and not enough beyond.'
      - 'Rule changed by the replay, cues: a cue re-anchors the estimate and restarts the carried limit, but no longer restarts the inferred limit of a clock value. In the run of 20 Nov with the limit restarted at the cue, inferred seconds 6-10 s after the last reading were within 1 s in 85.2 % (cues at recall 0.8) and 89.0 % (every cue delivered), and 89.3 % at 4 s with stop cues only - below the promise. The stand-in cues are known to 1 s only; a measured audio cue (OQ-LS-3) may re-open this.'
      - 'Promise made exact: it must hold pooled and at every age (clock_inferred_promise). The guaranteed clock interval held the true clock in 99.95 % of hidden seconds; the rest are clock steps the bug itself shows.'
      - 'Known limits of 0.1.0, for 0.1.1: 36 kinds of rules are read by the default convention (the step waits for its limit) and were checked by reading, not confirmed by their authors (FU-LS-09); the replay has 1 s resolution and the bug is its truth; the feed is simulated for made field goals only; no cue sensor and no feed or stream delay is measured (OQ-LS-1, OQ-LS-2, OQ-LS-3).'
      - 'Close-out (20 Nov). The page docs/data/live_game_state.md is generated from the pack by tools/specgen/live_state/gen_doc.py and checked by the tests (--check): a one-screen summary, the sensors with their measured numbers, grades, rules and profiles, levels, the 10 groups of the 19 Oct page as eight-column tables (94 fields), reconciliation, the replay, acceptance, one table of all 139 params by evidence tag, open questions and follow-ups. The generator refuses to write when a field, rule, sensor, grade, profile, level, param, acceptance id, question or follow-up is missing from the page, when a placeholder is left or when a table row is cut.'
      - 'Where the numbers stand: of 139 params 27 are measured on our recordings, 19 come from the rules book, 19 from recorded decisions, 22 from requirements, 12 mirror another config and 40 are assumed (each names the measurement that replaces it). Of 386 written dropout rules 67 rest on a measurement and 83 on an assumption. Of the 82 latency budgets written by fields, 8 are measured, 9 hold by definition and 65 are assumed: the feed delay, the stream delay, audio and CV timing are not measured yet.'
      - 'schema/live_state_changes.yaml written (proposal, not applied): 74 new columns in 14 tables (73 named by field records and state_frame.flow_state from the core audit), one new table (tracking_quality_second, 9 columns), 8 value-list changes (dq gains confirmed and unknown; src takes the sensor names so that the live feed and the final file can be told apart), 3 definition fixes. The lint checks every lands_in_proposed column against it: 0 problems on 94 fields.'
      - 'Home / away (R-MD-22): the renames of existing MSU-relative columns are owned by schema/platform_changes.yaml (baseline 6); 21 fields of this pack read a column that is renamed there, and the change set lists them. No column proposed here is relative to one programme. Corrected in fields_scoreboard: largest_lead proposed state_second.largest_lead_msu / _opp; now largest_lead_home / _away.'
      - 'New section follow_ups (FU-LS-01 to FU-LS-13): edits outside this pack found by the field authors and the replay. Checked against config/state_machine.yaml before recording: try_in_flight is missing from the changes of T13, T14 and T20; period is listed for T21 but not in its changes; shot_clock_status is only in the changes of T19; the value off of shot_clock_status loads as the boolean false.'
      - 'Not built in 0.1.0: sensors_sim.py. The design named a synthetic sensor simulator; the replay uses real readings with stand-in cues and the rule tests use hand-built timelines, so nothing reads it yet (FU-LS-11). Two questions added for the lead: lineups as a win-probability input (OQ-LS-25) and quarantine on the live panel (OQ-LS-26).'

open_questions:
  - id: OQ-LS-1
    question: 'How late is the live play-by-play feed against real time? Every "confirmed by the feed" latency here is a planning value (20 s median, 60 s p95).'
    recommended: 'Measure it at one live game - record the stream with UTC stamps and note when each play-by-play row appears.'
    status: 'Allowed by Aldemir on 11 Nov 2026 (a measurement, not a build). Planned for the next live MSU game; until then the values stay assumed.'
  - id: OQ-LS-2
    question: 'How late is the B1G+ stream against real time (stream_delay_s)? It decides whether any live number could ever be acted on before a market moves.'
    recommended: 'Measure at the same live game (horn or tip time on the stream against UTC).'
    status: 'Allowed by Aldemir on 11 Nov 2026; same live game as OQ-LS-1.'
  - id: OQ-LS-3
    question: 'Audio (whistle, horn) and CV stop / start cues are assumed, not measured. The replay shows how much they would help the clock.'
    recommended: 'Measure whistle recall on two MSU broadcasts when the freeze allows a measurement pilot.'
    status: 'Open. Nothing here depends on MSU staff data (no reply as of 11 Nov 2026); the measurement uses our own recordings.'
  - id: OQ-LS-4
    question: 'R-SB-03 caps every scorebug window at 15 s. The bug team-foul count is far slower than the score: median 7 s, p95 31 s, p99 41 s after the play-by-play foul second (n = 566). A 15 s cap would flag about one foul in four as late.'
    recommended: 'Keep the 3-15 s bounds for the score (make window) only. Give the team-foul count its own window (42 s now, re-set per game by the same p99 + 1.0 s rule) and say so in R-SB-03.'
    status: 'Open - needs Aldemir (a change to a requirement).'
  - id: OQ-LS-5
    question: 'K10 names no foul-trouble threshold for the last 300 s of the first half (2 fouls count only while the half has run at most 900 s). By the letter nobody is flagged there.'
    recommended: 'Use 3 fouls for the last 300 s of the first half.'
    status: 'Open - needs Aldemir (raised by the scoreboard step, 11-20 Nov 2026).'
  - id: OQ-LS-6
    question: 'With 6 team fouls on the opponent, is the bonus ''none'' (the count rule, used here) or ''what the next foul brings'' (the note on state_frame.bonus_state)?'
    recommended: 'Keep the count rule; fouls_to_give = 0 carries the next-foul meaning.'
    status: 'Open - needs Aldemir (raised by the scoreboard step, 11-20 Nov 2026).'
  - id: OQ-LS-7
    question: 'Does the 120 s run window run across half time?'
    recommended: 'Yes, with a flag when it spans the break (as R-MD-28 does for droughts). The record does this now.'
    status: 'Open - needs Aldemir (raised by the scoreboard step, 11-20 Nov 2026).'
  - id: OQ-LS-8
    question: 'R-MD-02 lets frames off the main camera carry the last ball-control state as inferred with no limit. The pack is stricter: inferred only while the bug clocks vouch, else carried 5 s, then unknown.'
    recommended: 'Keep the stricter rule and edit R-MD-02 to match.'
    status: 'Open - needs Aldemir (raised by the play step, 11-20 Nov 2026).'
  - id: OQ-LS-9
    question: 'Seconds since change of control: counted from the last change of possession (not reset by an offensive rebound), in game-clock seconds?'
    recommended: 'Yes; transition measures keep their own start.'
    status: 'Open - needs Aldemir (raised by the play step, 11-20 Nov 2026).'
  - id: OQ-LS-10
    question: 'May the live panel show a lineup that is unverified after a break?'
    recommended: 'Yes, marked unverified, with no player stat credited until it is verified.'
    status: 'Open - needs Aldemir (raised by the play step, 11-20 Nov 2026).'
  - id: OQ-LS-11
    question: 'Is a pending throw-in during a timeout or review ''dead'' or ''inbound pending'' in the six-state ball label?'
    recommended: 'Dead until the timeout ends (T26).'
    status: 'Open - needs Aldemir (raised by the play step, 11-20 Nov 2026).'
  - id: OQ-LS-12
    question: 'Off-screen point estimate: kept 10 s (R-DT-07, now in core) or 8 s (the first proposal)?'
    recommended: '10 s until the coverage-against-age curve is measured on MSU film.'
    status: 'Open - needs Aldemir (raised by the play step, 11-20 Nov 2026).'
  - id: OQ-LS-13
    question: 'A set whose template is not yet confirmed on current film: show only the compositional name live (R-ST-11)?'
    recommended: 'Yes.'
    status: 'Open - needs Aldemir (raised by the play step, 11-20 Nov 2026).'
  - id: OQ-LS-14
    question: 'Leverage has three wordings: the 19 Oct page (best against worst outcome), R-PR-12 (expected change) and R-MD-33 (score against stop).'
    recommended: 'Store score against stop (the Shall row); keep the other two as views.'
    status: 'Open - needs Aldemir (raised by the meta step, 11-20 Nov 2026).'
  - id: OQ-LS-15
    question: 'Garbage time: R-MD-30 says above 0.98 / below 0.02, the vocabulary file says at or above / at or below.'
    recommended: 'Strict, as the requirement; correct the vocabulary file.'
    status: 'Open - needs Aldemir (raised by the meta step, 11-20 Nov 2026).'
  - id: OQ-LS-16
    question: 'What does a live run write as pass?'
    recommended: 'Keep the three pass values: live with the feed writes anchored, live without writes blind; add run_records.mode and run_records.pbp_source to tell live from post runs.'
    status: 'Open - needs Aldemir (raised by the meta step, 11-20 Nov 2026).'
  - id: OQ-LS-17
    question: 'state_version during a live game.'
    recommended: 'A provisional id while the run is open and a hash at seal; a late row that only confirms opens no new version, only a contradiction does (the reference fuser does this).'
    status: 'Open - needs Aldemir (raised by the meta step, 11-20 Nov 2026).'
  - id: OQ-LS-18
    question: 'R-MD-09 gives official play-by-play confidence 1.'
    recommended: 'Keep 1 for pbp_final in the anchored pass as a mark of authority; a live feed row carries its measured agreement (bug total equals the play-by-play total in 89 % of stable samples, median game).'
    status: 'Open - needs Aldemir (raised by the meta step, 11-20 Nov 2026).'
  - id: OQ-LS-19
    question: 'OQ-LS-2 needs a named outside time reference; the play-by-play wallclock cannot be it (13 % of rows step backward).'
    recommended: 'Note the opening tip or a period horn against a UTC-synced clock, by someone watching the arena feed or in the building, at the same live game as OQ-LS-1.'
    status: 'Open - needs Aldemir (raised by the meta step, 11-20 Nov 2026).'
  - id: OQ-LS-20
    question: 'Coverage formula: R-VI-05 asks for a fixed formula and no config holds one.'
    recommended: 'Start with 0.6 x players of 10 + 0.2 x half-court share + 0.2 x ball; re-fit on gold-v1.'
    status: 'Open - needs Aldemir (raised by the meta step, 11-20 Nov 2026).'
  - id: OQ-LS-21
    question: 'Foul-up-3 cell: R-SR-11 gives no clock limit and no bins.'
    recommended: '60 s, with the bins of the record, until play-by-play gives cells with n >= 30 (R-PE-07).'
    status: 'Open - needs Aldemir (raised by the meta step, 11-20 Nov 2026).'
  - id: OQ-LS-22
    question: 'Grade honesty: must the 0.90 promise hold only pooled over all inferred seconds, or also at every age inside the horizon? The replay tests both; the stricter reading is what cut the shot clock to 1 s.'
    recommended: 'Both, as now written in clock_inferred_promise.'
    status: 'Open - needs Aldemir (raised by the evidence step, 11-20 Nov 2026).'
  - id: OQ-LS-23
    question: 'Should a stop or start cue restart the inferred limit of the clock value? With stand-in cues (known to 1 s) it did not keep the promise, so 0.1.0 says no; the estimate still improves a lot (within 1 s in 92.3 % against 81.7 % at 6-10 s).'
    recommended: 'Keep it off until whistle timing is measured (OQ-LS-3); then re-run the replay with real cue instants.'
    status: 'Open - needs Aldemir (raised by the evidence step, 11-20 Nov 2026).'
  - id: OQ-LS-24
    question: 'The clutch constants (300 s, 5 points, 240 s) sit only in this pack; K06 has no home in config/invariants.yaml.'
    recommended: 'Add them to config/invariants.yaml constants and mirror them here (a config edit outside this pack).'
    status: 'Open - needs Aldemir (raised by the meta step, 11-20 Nov 2026).'
  - id: OQ-LS-25
    question: 'Should the live win probability read the five on the floor? The lineup records name win_probability as a consumer, but in 0.1.0 it is not an input: an unverified lineup after a break would move the number on a guess.'
    recommended: 'Not in 0.1.0. Add the lineups as an input only after the offline comparison of R-PE-10 shows they improve the number, and then only verified lineups.'
    status: 'Open - for the lead; no answer from Aldemir is needed unless the lead disagrees (raised by the meta step, recorded 20 Nov 2026).'
  - id: OQ-LS-26
    question: 'A quarantined value in live mode: the panel shows it as unknown, and it leaves quarantine only by a new observation that agrees with the authority or by a review answer. Is that the wanted behaviour?'
    recommended: 'Yes. Showing the contradicted value, even marked, invites reading it; the raw reading stays stored for the review.'
    status: 'Open - for the lead (wording of the core step, recorded 20 Nov 2026).'

