pack: live_state
version: 0.1.0
date: '2026-11-11'
owner: Mac session for Aldemir
status: proposal under the build freeze (baseline 4 of 8). Every limit is an engineering proposal; each one says whether it is measured (and where) or assumed (and why).
scope: >-
  The live game state: every value the system holds at every instant of a game. For each value this pack fixes its
  source, when it updates, how late it is known, and what it becomes when a sensor disappears (the dropout rule). It
  deepens the one-page proposal of 19 Oct 2026 (docs/data/live_game_state.md, now generated from this pack) and sits on
  the K09 stored truth (config/state_machine.yaml - state_transitions, state_segments, clock_map).
requirement:
  ask: 'Board 2026-10-20: baseline 4 = live game state deep spec (per field - source, update timing, latency, dropout rule).'
  the_rule: >-
    A value is never shown or used as better than it is. Every value carries a grade, an age and the time it became
    known. When its sensors go away the grade moves down a fixed ladder at measured limits; it never moves up without a
    new observation. A value that cannot be known is "unknown" (or "off" / "none"), never empty and never a guess.
  requirements: [R-SR-01..20, R-IV-01..49, R-SB-01..05, R-MB-01..08, R-SY-01, R-SY-11, R-SY-14, R-SY-15, R-SY-19, R-SY-20, R-MD-01, R-MD-21, R-MD-22, R-MD-24, R-MK-03, R-MK-07, R-MM-03, R-AU-05, R-PR-11, R-PR-15]
  ids_note: 'Ids are those of the live requirements, rev 563 of 11 Nov 2026. R-MD-21 was N-MD-01 and R-MD-22 was N-MD-02 (older repo files still use the N- names).'
files:
  core: config/live_state/core.yaml (this file - conventions, grades, sensors, rules, profiles, limits, index, inventory)
  fields: [config/live_state/fields_scoreboard.yaml, config/live_state/fields_play.yaml, config/live_state/fields_meta.yaml]
  implementation: tools/specgen/live_state/ (lslib.py loader and lint, fuse.py reference fuser, harness.py real-data replay, measure_real.py, gen_doc.py). Every parameter below is read by the reference code or listed under production_only_params.
  tests: tests/live_state/
  results: results/live_state_test/ (measured_sensors.json, harness.json, README.md)
  doc: docs/data/live_game_state.md (generated by tools/specgen/live_state/gen_doc.py; do not edit by hand)
  schema_changes: schema/live_state_changes.yaml (proposed, not applied)
