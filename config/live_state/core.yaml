# Names with a dot are columns of state_frame or state_second that no field carries.
out_of_scope:
  closely_guarded_hold_s: 'R-SR-19 is per touch (touches.closely_guarded_hold_s), an event measure, not a state value held at every instant.'
  frame_team: 'Named-spots follow-up 18 (the team whose attacked basket defines the frame) is a proposed state-machine dimension, not yet in config/state_machine.yaml; added to the index when the dimension lands.'
  frontcourt_status: 'R-MD-26 (frontcourt status of the team in control, per frame) is outside the four inventories of 0.1.0 and has no column yet; candidate for 0.2.0, next to backcourt_count_s.'
  secs_since_last_score: 'R-MD-28 (seconds since each team''s last made field goal and last point; Should) is outside the four inventories of 0.1.0; candidate for 0.2.0.'
  state_frame.invariant_breaks: 'Row bookkeeping - the invariants broken at this frame. Its effect on a value is that value''s grade (stamp_grade = quarantined).'
  state_frame.flag_ids: 'Row bookkeeping - pointers to scoreboard_flags rows.'
  state_frame.correction_ids: 'Row bookkeeping - pointers to state_corrections rows.'
  state_frame.model_version: 'Run bookkeeping (R-MD-09) - the same for every row of a run.'
  state_frame.created_utc: 'Run bookkeeping - when the row was written. Not the time the value became known (stamp_known_at_utc).'
  state_second.time_base: 'Row key of the per-second view (video seconds or game-clock seconds).'
  state_second.t_index: 'Row key of the per-second view.'
  state_second.invariant_breaks: 'Row bookkeeping, as in state_frame.'
  state_second.model_version: 'Run bookkeeping, as in state_frame.'
  state_second.created_utc: 'Run bookkeeping, as in state_frame.'

# ---------------------------------------------------------------------------------------------------------------------
# The audit behind ACC-LS-2, kept executable. Four inventories; each entry maps to fields of the index.
# The lint checks: every column of state_frame and state_second is under a field here or in out_of_scope; a field's
# record lists its columns in lands_in and cites its R-SR rows in requirements. (The fourth inventory, the 32
# state-machine dimensions, is the dimension key of the index.)
inventory:
  columns:   # field -> columns of state_frame (sf) and state_second (ss) that its record must list in lands_in
    game_id:            [state_frame.game_id, state_second.game_id]
