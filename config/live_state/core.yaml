    what: 'When the team-neutral change set of schema/platform_changes.yaml is applied, re-point the 21 fields that read a renamed column (score_msu becomes score_home, and so on; the list is in schema/live_state_changes.yaml, team_neutral).'
    why: 'R-MD-22: stored state is home / away. The inventory maps to the column names of today and goes stale on that day; the lint will say so.'
