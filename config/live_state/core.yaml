  - id: FU-LS-02
    where: 'config/state_machine.yaml (changes lists)'
    what: 'Add try_in_flight to the changes of T13, T14 and T20 (a try ends out of bounds, in a held ball, with the period). Take period out of the changed_by of T21 or add it to the changes of T21. List shot_clock_status on the transitions that start and stop it, not only T19. Bring the changed_by summaries of possession_team, team_control, ball_status, restart_pending, stoppage and arrow in line with the changes lists.'
