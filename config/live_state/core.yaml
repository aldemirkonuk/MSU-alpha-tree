  page_rows:   # rows of the 19 Oct page (docs/data/live_game_state.md before this pack), by its 10 groups -> fields
    keys: {game_id: [game_id], pass: [pass], state_version: [state_version], 'video_id, frame_index': [video_frame], rules_edition: [rules_edition], 'src, conf, dq per group': [stamp_src, stamp_conf, stamp_grade]}
