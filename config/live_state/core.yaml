    time: {'period, period_phase': [period, period_phase], game_clock_s: [game_clock_s], game_clock_running: [game_clock_running], shot_clock_s: [shot_clock_s], shot_clock_status: [shot_clock_status], video_ts_ms: [video_ts_ms], est_utc: [est_utc], 'media segment, 5-min window': [media_segment, five_min_window]}
