# ---------------------------------------------------------------------------------------------------------------------
conventions:
  time_axes:
    event_time: The instant the fact became true in the game - a video frame (and its game clock). Example - the frame the ball is fully through the net.
    observed_time: The instant a sensor showed it. Example - the frame the scorebug digit starts to change.
    known_time: The instant the fused state first held the value at a given grade (known_at). Latency = known_time - event_time.
    stored_as: 'R-SY-11: every transition stores its effective frame (event), the observed frame per source and known_at_utc. R-MD-24: every row that can be revised carries known_at_utc.'
  as_of_views:
    as_of_event: What was true at t. For describing games, for training labels and for the anchored pass. May use values that became known later.
    as_of_known: What the system knew at t. The only view a live panel, a live model input, a backtest of a live decision or a market comparison may read (no leakage, principle 6 of the state record).
  utc:
    est_utc: 'Estimated real-world UTC of an event (clock_map.utc_at_from with utc_err_s). R-MK-03: a market price is joined to game state only when the UTC error is at most 30 s.'
    known_at_utc: 'est_utc of the event + stream_delay_s of the video source + processing latency. A price at time u may be compared with a model value only if that value''s known_at_utc <= u ("could we have acted", R-MK-07); est_utc is used for "what was true".'
    stream_delay_s: Delay of the recorded or streamed video against real time, per video source. Not measured yet (open question OQ-LS-2).
  modes:
    live: Causal. Video and feeds arrive in time order; only as_of_known exists while the game runs. This pack is written for this mode.
    post_blind: Whole video, no play-by-play. Same rules; a value may be revised with later video (as_of_event); the as_of_known view is still rebuilt for backtests.
    post_anchored: Whole video plus the final play-by-play. The scorebook wins values; CV and audio win instants.
    pbp_only: No video. Only what the play-by-play fold can write (coarse flow states, counts, score); every CV-only field is unknown.
  storage: Stored state is home / away (R-MD-22, was N-MD-02). MSU-relative names (score_msu, margin, MSU ball) are views.
  none_value: A field that cannot exist holds "off" or "none"; a field that exists but cannot be known holds "unknown". No field is ever null.
  latency_policy: K23 - latency is measured and reported per field and per game, not a gate. The budgets below exist so measured numbers have something to be compared with.
  replays: A replay never changes game state (state record principle 7).
  units: seconds (s), milliseconds (ms), metres (m), probability 0-1. No feet.
  evidence_tags:
    rule: 'Every evidence string starts with one of these tags and a colon. The lint rejects any other start.'
    tags:
      measured: on our own data; names the result file
      assumed: not measured; says why this value and which measurement will replace it
      rule: a rule of the 2026-27 rules book (docs/rules/PRMBB_RulesBook.pdf), with its number
      decision: a recorded decision (K01-K29, D01-D45, an owner answer)
      requirement: a live-requirement id or a state-record principle
      config: mirrors a value of another config file of the repo
      definition: true by construction (a rule of this pack, an identity)
      published: an outside source with a citation (none yet - the web research step was skipped for 0.1.0)
      vendor claim: a number a vendor states about its own product (none yet)
  param_links:
    mirrors: 'A param that repeats a value of another config names it as mirrors: <file>:<dotted key>. The lint checks that both are equal.'
    measured_key: 'A param taken straight from results/live_state_test/measured_sensors.json names its key (measured_key, with measured_round decimals and measured_plus offset). The lint checks the value against the file, so a re-run of measure_real.py that moves a number fails the lint until the param follows.'
  grade_path_timing: >-
    How a dropout rule is read. grade_path lists the grades a value passes while the condition of `when` lasts. A path
    that starts with confirmed, observed names the two grades the value may hold when the condition starts (one start,
    not a step). Each later grade is one step down. step_at gives the age (seconds since the condition started) of
    each step - 0, the name of a limit, or on_return (the step is taken when the condition ends). Without step_at the default applies - the limits whose unit is seconds, in
    the order written, are the ages of the LAST steps; a step with no limit happens when the condition starts. A rule
    with steps and more time limits than steps must write step_at (lint); a rule with no step reads its limits as
    thresholds. Limits that are not times (a count, a share, a number
    of readings) are thresholds the rule reads, never step ages. The reference code (fuse.py, class GradeTrack) reads
    every rule this way.
  record_keys:
    next_value: 'On a dropout rule - the value the field takes when the old value ends (rule MAX_DWELL or FREEZE_ON_BREAK), with its grade. grade_path is the path of the OLD value.'
    step_at: 'On a dropout rule - see grade_path_timing.'
    max_dwell_by_value: 'On a field - {value of the field: entry of the max_dwell table} when different values of one status have different rule bounds.'
    computed_from: 'On a meta field that is computed from other meta fields - its inputs. (derived_from is for the derived profile only.)'
    panel: 'On a situation field - what the live panel shows when the value is valid, degraded or unknown.'
  invariant_ids: 'A field''s invariants are ids of config/invariants.yaml (R-IV-01..16, new-IV-01..34) or of the integrity rules of config/state_machine.yaml (SEG, TRN, CLK). R-IV-17..49 of the live requirements are accepted too; config/invariants.yaml still carries them under new-IV names.'

# ---------------------------------------------------------------------------------------------------------------------
# Grades: the quality of one value at one instant. Rank 1 is best. A value moves down the ladder as its age grows and
# its sensors stay away; it moves up only when a new observation arrives.
grades:
  ladder: [confirmed, observed, inferred, carried, imputed, unknown]
  aside: [quarantined]
  defs:
    confirmed:   {rank: 1, dq_enum: observed, meaning: 'Observed, and agreed by a second independent sensor inside the confirm window.', may_feed: [live_panel, live_models, stats, training_labels]}
    observed:    {rank: 2, dq_enum: observed, meaning: 'Read from a sensor that can see it, inside that sensor''s freshness window.', may_feed: [live_panel, live_models, stats, training_labels]}
    inferred:    {rank: 3, dq_enum: inferred, meaning: 'Derived by a named rule before any sensor shows it (a made basket seen by CV adds the points), or dead-reckoned inside the measured safe horizon. An inferred value is a claim - the rule states how often it must be right (promise).', may_feed: [live_panel, live_models]}
    carried:     {rank: 4, dq_enum: carried, meaning: 'The last value, held while its sensors are away, with its age and (where the profile gives one) a guaranteed interval. Not a claim that nothing changed.', may_feed: [live_panel_marked_stale, live_models_with_interval]}
    imputed:     {rank: 5, dq_enum: imputed, meaning: 'A model estimate beyond the carry limit (off-screen positions).', may_feed: [live_panel_marked_estimate]}
    unknown:     {rank: 6, dq_enum: imputed, meaning: 'Nothing reliable. The explicit value "unknown" is stored.', may_feed: []}
    quarantined: {rank: 9, dq_enum: quarantined, meaning: 'Contradicted by another source or by an invariant; held out of every consumer until reviewed.', may_feed: []}
  rules:
    - A grade path only moves down the ladder. Any move up needs a new observation (or a review answer for quarantined).
    - Stats and training labels read only confirmed and observed values of the anchored pass.
    - The existing dq enum (observed, inferred, carried, imputed, quarantined) is kept; confirmed and unknown are proposed additions (schema/live_state_changes.yaml). Until they exist, dq_enum above is the value written.
  stamps: 'Every group of fields carries src (sensor), conf (0-1), grade, age_s (seconds since the last observation of that value) and known_at_utc.'

# ---------------------------------------------------------------------------------------------------------------------
# Sensors. delay = the observation-delay model (true event to the sensor showing it); p50 and p95 name params.
# health.fields = the fields of this pack that carry the health signal (they drive the dropout rules).
sensors:
  scorebug_ocr:
    gives: [period, game clock, shot clock, score per team, team fouls, bonus label, timeouts left, alternating-possession arrow]
    resolution: '1 s (0.1 s under 60 s on the game clock, under 5 s on the shot clock); one reading per sampled frame'
    availability: 'measured: game clock readable in 79 % of in-period seconds (33 broadcasts; median game 82 %, worst 42 %, best 92 %). In the seconds with a clock: shot clock 79 %, team fouls 54 % (shown as text in 28 of 33 broadcasts), timeouts 59 %, score total 88 % (median game) (results/live_state_test/measured_sensors.json). By shot type, 2 tournament games sampled once per 60 s: main wide 93 of 95, tight 31 of 37, crowd or bench 20 of 21, replay 0 of 17 (results/w3_intake/scorebug_summary.md).'
    delay: {of: 'made basket to the first changed score digit', p50: make_to_bug_p50_s, p95: make_to_bug_p95_s, note: 'Team-foul count - foul_to_bug_p50_s and foul_to_bug_p95_s, against the play-by-play second. Score against the play-by-play second - pbp_to_bug_p50_s and pbp_to_bug_p95_s. How far the bug clock trails the arena clock is not measured (R-SY-14 asks it per game).'}
    failure_modes: [hidden in replays breaks and graphics, sponsor strap in its place, digit misreads, operator lag, operator mistakes, layout differs per broadcaster and season]
    health: {signal: scorebug_visible, fields: [scorebug_visible], down_when: 'no accepted clock reading for scorebug_down_after_s', up_when: 'scorebug_up_after_reads consecutive accepted readings'}
    params:
      ocr_reject_share: {value: 0.017, unit: share, why: share of parsed clock reads rejected as inconsistent with their neighbours, evidence: 'measured: measured_sensors.json clock.ocr_reject_share_pooled', measured_key: summary.clock.ocr_reject_share_pooled, measured_round: 3}
      scorebug_down_after_s: {value: 1.0, unit: s, why: one missed second is the commonest gap (1,074 of 3,189 hidden stretches last 1-2 s); the bug is treated as away after a full second without an accepted reading, evidence: 'measured: measured_sensors.json clock.hidden_runs'}
      scorebug_up_after_reads: {value: 2, unit: readings, why: two agreeing readings before the bug is trusted again - a single read after a gap is where digit errors and animations sit, evidence: 'assumed: OCR reject share 1.7 % per read; two reads bring a false re-acquire near 0.03 % if misreads are independent. Replaced by the misses counted at bug returns in the replay harness (ACC-LS-H3)'}
      make_to_bug_p50_s: {value: 1.93, unit: s, why: ball through the net to the first changed score digit, evidence: 'measured: results/w3_intake/made_basket_lag.md (n = 10, frame precision, range 1.50-2.60 s)'}
      make_to_bug_p95_s: {value: 2.6, unit: s, why: 'upper end of the same lag; with 10 makes the largest value stands in for the p95', evidence: 'measured: results/w3_intake/made_basket_lag.md (largest of n = 10 is 2.604 s; a real p95 needs about 60 makes - R-SB-03 measures it per game)'}
      digit_animation_s: {value: 0.30, unit: s, why: a score digit animates for 9-10 frames; reads inside the animation are rejected, evidence: 'measured: results/w3_intake/made_basket_lag.md'}
      pbp_to_bug_p50_s: {value: 3.0, unit: s, why: 'play-by-play clock second of a made field goal to the score on the bug', evidence: 'measured: measured_sensors.json score.made_fg_lag_vs_pbp_clock_s (n = 1,344, 1 s resolution; p90 6 s)', measured_key: summary.score.made_fg_lag_vs_pbp_clock_s.p50}
      pbp_to_bug_p95_s: {value: 7.0, unit: s, why: 'same lag, 95th percentile; 31 of 1,375 makes were not seen on the bug within 15 s', evidence: 'measured: measured_sensors.json score.made_fg_lag_vs_pbp_clock_s', measured_key: summary.score.made_fg_lag_vs_pbp_clock_s.p95}
      foul_to_bug_p50_s: {value: 7.0, unit: s, why: the bug foul count follows the play-by-play foul second slowly (p90 25 s), evidence: 'measured: measured_sensors.json bug_fields.team_foul_lag_vs_pbp_clock_s (n = 566, 1 s resolution)', measured_key: summary.bug_fields.team_foul_lag_vs_pbp_clock_s.p50}
      foul_to_bug_p95_s: {value: 31.0, unit: s, why: 'same lag, 95th percentile; 59 of 625 fouls were not seen on the bug within 45 s', evidence: 'measured: measured_sensors.json bug_fields.team_foul_lag_vs_pbp_clock_s', measured_key: summary.bug_fields.team_foul_lag_vs_pbp_clock_s.p95}
  pbp_feed:
    gives: [who and what - scorer foul type rebounder substitution timeout, score after each play, the game-clock second of each play]
    resolution: '1 s of game clock; rows inside one second are not reliably ordered'
    availability: 'assumed: a live feed exists for every MSU game; its delay against real time is not measured (OQ-LS-1)'
    delay: {of: 'scorer entry to the row arriving', p50: feed_delay_p50_s, p95: feed_delay_p95_s, note: 'Planning values until the live measurement of OQ-LS-1.'}
    failure_modes: [late rows, rows out of order inside a second, wrong credit, missing events, later corrections, wallclock running backwards]
    health: {signal: feed_heartbeat, fields: [feed_heartbeat], down_when: 'no new row for feed_stale_after_s while the game clock is running or a whistle was heard', up_when: 'a new row arrives'}
    params:
      feed_delay_p50_s: {value: 20.0, unit: s, why: planning value for scorer entry to row arrival, evidence: 'assumed: not measured. Replaced by the live capture of OQ-LS-1 (stream recorded with UTC stamps, arrival time of each row noted)'}
      feed_delay_p95_s: {value: 60.0, unit: s, why: planning value, evidence: 'assumed: three times the planning median. Replaced by the same live capture (OQ-LS-1)'}
      feed_stale_after_s: {value: 90.0, unit: s, why: 'longer than the assumed p95 delay plus a quiet stretch; beyond it the feed is treated as away', evidence: 'assumed: feed_delay_p95_s + 30 s. Re-set from the measured gap between rows at the live capture (OQ-LS-1)'}
      entry_jitter_sigma_s: {value: 1.05, unit: s, why: spread of scorer entry time between events on one running-clock stretch, evidence: 'measured: measured_sensors.json pbp_wallclock.entry_jitter (5,135 pairs)', measured_key: summary.pbp_wallclock.entry_jitter.robust_sigma_single_entry_s}
      wallclock_backward_share: {value: 0.13, unit: share, why: 'share of rows whose wallclock is earlier than the row before; wallclock is never joined to prices raw (the clock map uses the running maximum)', evidence: 'measured: measured_sensors.json pbp_wallclock (15,864 rows, largest step 3,008 s)', measured_key: summary.pbp_wallclock.backward_step_share, measured_round: 2}
      pbp_clock_leads_make_s: {value: 1.0, unit: s, why: 'the play-by-play clock second of a made field goal sits about 1 s before the make (bug change median 3 s after the play-by-play second against 1.93 s after the make)', evidence: 'measured: measured_sensors.json score.made_fg_lag_vs_pbp_clock_s against results/w3_intake/made_basket_lag.md (two different samples; a direct measure needs frame-precise makes on the MSU broadcasts)'}
  pbp_final:
    gives: [the official scorebook as published after the game - the authority for values]
    resolution: '1 s of game clock'
    availability: 'measured: every one of the 33 broadcasts had a play-by-play file; right after a game it can be missing for a while'
    delay: {of: 'end of the game to the published file', p50: n/a, p95: n/a, note: 'Post-game only, never a live sensor. Every later pull is a new version (R-SY-20).'}
    failure_modes: [row order inside a second, missing whistles and turnovers, later revisions (R-SY-20)]
    health: {signal: pbp_version, fields: [], down_when: 'file absent', up_when: 'file pulled; every revision is a new version', note: 'A fact of the whole game (it decides which pass can run), not a value that changes during it.'}
    params: {}
  cv_tracking:
    gives: [player positions, ball position, who holds the ball, basket attacked, camera shot type, court mapping]
    resolution: 'per frame (33.37 ms at 29.97 fps; 16.68 ms at 59.94 fps)'
    availability: 'assumed: main wide camera only; two to five players are often off screen (K15); not measured on MSU film during the freeze'
    delay: {of: 'frame captured to its positions in the state', p50: frame_to_state_s, p95: frame_to_state_p95_s, note: 'Processing time only; a position is seen in the frame it is true.'}
    failure_modes: [occlusion, off-screen players, camera cuts, identity on HOLD, court mapping lost in tight shots]
    health: {signal: coverage_score and camera_shot_type, fields: [coverage_score, camera_shot_type, court_mapping_conf], down_when: 'camera_shot_type is not main_wide, or court_mapping_conf below mapping_min_conf', up_when: 'main_wide and mapping confident for tracking_up_after_s'}
    params:
      mapping_min_conf: {value: 0.8, unit: probability, why: same gate the identity pack uses for height from the calibrated frame (court calibration confidence at least 0.8), evidence: 'assumed: config/identity_pack.yaml cue height_build validity and config/invariants.yaml new-IV-34 use the same 0.8; to be measured on MSU film'}
      tracking_up_after_s: {value: 0.5, unit: s, why: a few frames of stable mapping before positions are trusted after a cut, evidence: 'assumed: 15 frames at 29.97 fps. Replaced by the measured time to a stable court mapping after cuts on MSU film'}
  cv_events:
    gives: [made basket frame, ring contact, try release, throw-in touch, jump-ball tap, change of control]
    resolution: 'per frame; a made basket is fixed to +-2 frames (K07)'
    availability: 'assumed: main wide camera with the rim in view (10 of 10 makes in the first audit were shown live with rim and net in view)'
    delay: {of: 'event frame to the event being emitted', p50: cv_make_confirm_s, p95: cv_event_delay_p95_s, note: 'Includes frame_to_state_s.'}
    failure_modes: [missed makes, false makes on replays, hand over the rim on dunks, ball not visible]
    health: {signal: ball_visible and camera_shot_type, fields: [ball_visible, camera_shot_type], down_when: 'ball not tracked for ball_lost_after_s or not main_wide', up_when: 'ball tracked again'}
    params:
      cv_make_confirm_s: {value: 0.5, unit: s, why: 'time from the ball passing the ring plane to the make being emitted (net motion, ball below the ring; includes frame_to_state_s)', evidence: 'assumed: K07 tolerance +-2 frames plus a short confirm run. Replaced by the measured emit delay on gold-v1 makes'}
      cv_event_delay_p95_s: {value: 1.0, unit: s, why: '95th percentile of the same emit delay, used for every CV event until each kind is measured', evidence: 'assumed: twice the planning median. Replaced by the measured emit delay on gold-v1'}
      ball_lost_after_s: {value: 1.0, unit: s, why: a ball unseen this long cannot vouch that no shot was taken, evidence: 'assumed: a try from the three-point line is in the air about 1 s. Replaced by the measured share of ball-lost stretches that hide a try on MSU film'}
  audio:
    gives: [whistle (clock stops), horn (shot clock or period), buzzer]
    resolution: 'about 0.1 s'
    availability: 'assumed: broadcast audio is present; crowd noise masks some whistles; not measured (R-MM-03 and R-AU-05 set the targets)'
    delay: {of: 'whistle or horn onset to the cue in the state', p50: audio_delay_p50_s, p95: audio_delay_p95_s}
    failure_modes: [crowd noise, music, commentary over the whistle, whistles from the stands, replays with audio]
    health: {signal: audio_present, fields: [audio_present], down_when: 'audio muted or a break is detected', up_when: 'game audio returns'}
    params:
      whistle_recall: {value: 0.8, unit: probability, why: 'planning value used only in the replay harness sweep (stop cue delivered with this probability); set below the R-MM-03 target of 0.90 on purpose', evidence: 'assumed: not measured. Replaced by whistle recall on two MSU broadcasts (OQ-LS-3)'}
      audio_delay_p50_s: {value: 0.1, unit: s, why: an onset needs about 0.1 s of sound to be told from noise, evidence: 'assumed: R-MM-03 and R-AU-05 ask the onset within 0.1 s. Replaced by the measured detection delay (OQ-LS-3)'}
      audio_delay_p95_s: {value: 0.3, unit: s, why: 'a masked whistle is confirmed later, from its tail', evidence: 'assumed: three times the planning median. Replaced by the measured detection delay (OQ-LS-3)'}
  registry:
    gives: [everything fixed before tip - game type, venue, crew, rosters, pre-game card, timeout format, scorebug template and side mapping]
    resolution: 'per game'
    availability: 'the registry row exists before any video is touched (foundation layer)'
    delay: {of: 'n/a - set before tip', p50: n/a, p95: n/a}
    failure_modes: [late roster or venue changes]
    health: {signal: registry_row, fields: [], down_when: 'row missing', up_when: 'row present', note: 'A game without its registry row is not processed.'}
    params: {}
  human:
    gives: [review answers and corrections]
    resolution: 'per correction'
    availability: 'after review; never live'
    delay: {of: 'n/a - after review', p50: n/a, p95: n/a}
    failure_modes: [late, wrong]
    health: {signal: review_queue, fields: [], down_when: 'n/a', up_when: 'n/a', note: 'Never a live sensor.'}
    params: {}
  stream:
    gives: [decoded frames, the frame index and presentation time stamp, our receive time of each frame]
    resolution: 'per frame (33.37 ms at 29.97 fps)'
    availability: 'measured: the 33 MSU recordings and the 2 tournament replays decode end to end; one tournament replay holds a 2.3 s frozen picture during live play (results/w3_intake/README.md). Stalls of a live stream are not measured (OQ-LS-2)'
    delay: {of: 'frame shown by the source to the frame in our hands', p50: capture_to_frame_s, p95: n/a, note: 'Decode and hand-over only. The delay of the stream against real time is the field stream_delay_s, not a sensor delay; it shifts known_at_utc, not video time. The p95 is measured per run (K23).'}
    failure_modes: [stream lost, rebuffering, frozen picture, repeated frames, a new file starting]
    health: {signal: frame heartbeat, fields: [degradation_level], down_when: 'no decoded frame for stream_lost_after_s (level D5_no_video)', up_when: 'frames arrive again; every field is then re-acquired (REACQUIRE)'}
    params:
      stream_lost_after_s: {value: 2.0, unit: s, why: 'no decoded frame for this long means the stream is lost (level D5_no_video)', evidence: 'assumed: longer than a stall inside normal play-out, short against every carry limit of this pack. Replaced by the frame-arrival gaps logged at the live capture (OQ-LS-2)'}
  pipeline:
    gives: [the run itself - pass, mode, state_version, the stamps of every value (src, conf, grade, age, known time)]
    resolution: 'per run; stamps per value'
    availability: 'definition: a value without a run record is not written'
    delay: {of: 'n/a - written with the value', p50: n/a, p95: n/a}
    failure_modes: [a run that stops before it seals its version]
    health: {signal: run_record, fields: [], down_when: 'run record missing or not sealed', up_when: 'run record sealed', note: 'A fact of the run, not a value that changes during a game. An unsealed live run keeps its provisional version id (field state_version).'}
    params: {}

# ---------------------------------------------------------------------------------------------------------------------
# Rule library. Profiles and fields refer to these names.
rules:
  HOLD_UNTIL_EVENT: 'A piecewise-constant value keeps its grade for as long as at least one sensor that would see it change is watching (a change detector). When no change detector is watching, CARRY applies.'
  CARRY: 'Keep the last value; grade carried; age_s counts up from the last observation. Past the field''s carried limit the value becomes unknown (or stays carried with its interval where the profile says so).'
  DEAD_RECKON: 'Clock only. While the running flag is running, the estimate advances 1.0 s per second of video; while stopped it holds. Grade inferred up to the inferred limit, then carried. The estimate always carries the guaranteed interval [last reading - elapsed video time, last reading] (floored at 0).'
  CUE_RECKON: 'Clocks, their running flags and the shot-clock reset. A stop cue (whistle, horn, CV dead ball), a start cue (throw-in touch, tap) or a reset cause seen by CV while the bug is away sets the running flag (or the reset value) at the cue instant and re-anchors the reckoning there. The cue is an observation of the flag, not of the clock value: the flag is inferred from the cue and its limits count from the cue; for the clock VALUE only the carried limit counts from the cue, the inferred limit still counts from the last READING, and the grade never rises (a value already carried stays carried). The estimate itself gets better with cues; the claim does not get longer (replay harness, journal of 20 Nov).'
  FOLLOW_FIELD: 'A value whose own sensor is away follows another field that is still observed and moves with it by rule (the shot clock runs and stops with the game clock, Rule 2-11). It is graded inferred while the rule gives a limit, then carried. The followed field must itself be observed.'
  RULE_DEFAULT: 'A value that no source states takes the default a rule or a requirement gives, at grade inferred, and is flagged. It stays inferred until a source states it (LATE_CORRECTION if the source differs).'
  SNAP_AND_LOG: 'When the sensor returns, the value snaps to the new reading after scorebug_up_after_reads agreeing readings. The first reading after a gap is held at grade inferred; the agreeing reading that follows makes it observed. If the reading differs from the held estimate by more than the field''s tolerance, the miss is logged (a latency_report row always; a state_corrections row when a stored transition is replaced) and the held stretch is re-graded in the as_of_event view only.'
  CONFIRM_WINDOW: 'A provisional value from the fast sensor is confirmed when the slower independent sensor shows the same change inside the window. If the window closes without it, a flag is raised (scoreboard_flags) and the value stays provisional (inferred), never silently confirmed.'
  FREEZE_ON_REPLAY: 'While replay_flag is on, no game-state field changes; observations are stored raw and marked replay. Transitions are held back until the replay detector has had replay_guard_s to object.'
  FREEZE_ON_BREAK: 'During a break (ad, studio, full-screen graphic) every game-state field is carried at its last value; on return REACQUIRE applies.'
  REACQUIRE: 'After a break or a cut back to the main camera - period, clocks, score and counts are re-read from the bug (SNAP_AND_LOG); lineups are unverified until play-by-play substitution rows or identity locks confirm them; possession and ball state are unknown until the first observed control.'
  MAX_DWELL: 'A carried status value may not outlive the longest time the rules or physics allow for it (max_dwell table). Past that time the old value becomes unknown; where the rules give what follows, the rule names it as next_value, at grade inferred.'
  AUTHORITY: 'When sources disagree on a VALUE - official scorebook (pbp_final, then pbp_feed) > arena scoreboard > broadcast scorebug > CV inference (Rule 2-9.13). On an INSTANT - cv_events and audio > scorebug change time minus its measured lag > play-by-play clock second. Raw readings are never overwritten.'
  QUARANTINE: 'A value that a higher authority contradicts beyond the field''s tolerance, or that breaks an invariant whose action is quarantine, takes the grade quarantined: no consumer reads it and the live panel shows it as unknown. It leaves quarantine only by a new observation that agrees with the authority, or by a review answer (state_corrections). The raw reading stays.'
  LATE_CORRECTION: 'A late or corrected source row writes new transitions with supersedes_id and a new state_version; the old version stays readable, and as_of_known never changes for instants already past.'
  WORST_INPUT: 'A derived value takes the worst grade and the oldest age of its inputs; it is recomputed whenever an input changes value or grade.'
  VALID_IF: 'A derived value is published only while its valid_if holds; otherwise it is shown with a wider band (when the profile allows) or withheld as unknown.'
  LOCK_OR_HOLD: 'Identity-dependent fields show a locked identity or HOLD with candidates, never a provisional label (identity pack OD-10).'

# ---------------------------------------------------------------------------------------------------------------------
# Profiles: a field names one profile and overrides only what differs.
# latency = the budget for known_time - event_time in live mode (sensor delay + frame_to_state_s; see latency_budget).
profiles:
  fixed:
    summary: Set before tip; never changes in a game.
    sources: [{sensor: registry, role: value}]
    update: {changed_by: [T00]}
    dropout: [{when: registry row missing, rule: CARRY, grade_path: [observed, unknown], limits: {}, on_return: SNAP_AND_LOG, evidence: 'definition: a game without its registry row is not processed (foundation layer)'}]
    conflict: [{between: [registry, human], value_winner: human, timing_winner: n/a, log_to: registry_change_log}]
    latency: {provisional: {by: registry, p50_s: 0, p95_s: 0}, confirmed: {by: registry, p50_s: 0, p95_s: 0}, evidence: 'definition: known before tip'}
  counter:
    summary: Piecewise constant; changes only by known steps at events (score, fouls, timeouts, period, sequence numbers).
    sources: [{sensor: pbp_final, role: value}, {sensor: pbp_feed, role: value}, {sensor: scorebug_ocr, role: confirm}, {sensor: cv_events, role: timing}]
    update: {changed_by: per field}
    dropout:
      - {when: 'scorebug hidden, a change detector watching (CV on the ball and rim, or a healthy feed)', rule: HOLD_UNTIL_EVENT, grade_path: [confirmed, observed], limits: {}, on_return: SNAP_AND_LOG, evidence: 'definition: rule HOLD_UNTIL_EVENT - no change seen means no change; a change seen by CV is added at grade inferred until the bug or the feed shows it'}
      - {when: 'scorebug hidden, no change detector watching', rule: CARRY, grade_path: [confirmed, observed, carried], limits: {scorebug_down_after_s: 1, counter_stale_after_s: 20}, step_at: [scorebug_down_after_s], on_return: SNAP_AND_LOG, evidence: 'measured: the score changed during 4-7 % of real hidden stretches up to 20 s and 13-16 % of longer ones (measured_sensors.json score.changed_during_real_hidden_run). The value is carried from the first missed second and marked stale after counter_stale_after_s; it stays carried and is never guessed'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: state record principle 7'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE, evidence: 'rule: 5-11 - the clocks are stopped and the ball is dead during a timeout; nothing can change during a break of a full broadcast'}
      - {when: feed stale, rule: HOLD_UNTIL_EVENT, grade_path: [confirmed, observed], limits: {}, on_return: LATE_CORRECTION, evidence: 'definition: the scorebug and CV keep the value observed; the scorebook value arrives late'}
    conflict: [{between: [pbp_final, scorebug_ocr], tolerance: 0, value_winner: pbp_final, timing_winner: cv_events, log_to: scoreboard_flags}]
    latency: {provisional: {by: cv_events, p50_s: 0.5, p95_s: 1.0}, confirmed: {by: scorebug_ocr, p50_s: 2.0, p95_s: 3.0}, evidence: 'assumed: provisional = cv_make_confirm_s and cv_event_delay_p95_s (not measured on MSU film). Confirmed = the make-to-bug lag rounded up (measured: 1.93 s median, 2.60 s largest of 10, results/w3_intake/made_basket_lag.md). Written for the score; a counter with a slower bug (team fouls) overrides it'}
    params:
      counter_stale_after_s: {value: 20.0, unit: s, why: 'with no change detector watching a counter is carried from the first missed second; after this long it is also marked stale (it stays carried - a counter is never guessed). Up to here holding was right in 93-96 % of real hidden stretches', evidence: 'measured: measured_sensors.json score.changed_during_real_hidden_run'}
      make_confirm_window_s: {value: 4.0, unit: s, why: 'a CV made basket must show on the bug inside this window (K02 start value; then per field p99 + window_margin_s, kept inside make_window_min_s and make_window_max_s)', evidence: 'decision: K02 and R-SB-03; measured largest lag 2.60 s of 10 (results/w3_intake/made_basket_lag.md)', mirrors: 'config/invariants.yaml:constants.scoreboard_lag_window_initial_s'}
      make_window_min_s: {value: 3.0, unit: s, why: the make window is never re-set below this, evidence: 'decision: K02 and R-SB-03', mirrors: 'config/invariants.yaml:constants.scoreboard_lag_window_bounds_s.0'}
      make_window_max_s: {value: 15.0, unit: s, why: 'the make window is never re-set above this. It bounds the make-to-bug window only; the foul-count window below needs more (OQ-LS-4)', evidence: 'decision: K02 and R-SB-03', mirrors: 'config/invariants.yaml:constants.scoreboard_lag_window_bounds_s.1'}
      window_margin_s: {value: 1.0, unit: s, why: 'a confirm window is the measured 99th percentile of its lag plus this margin', evidence: 'decision: K02'}
      pbp_to_bug_window_s: {value: 12.0, unit: s, why: 'a play-by-play made field goal must show on the bug inside this window, referenced to the play-by-play clock second (p99 11 s + window_margin_s). It is a different parameter from make_confirm_window_s because the scorer''s clock second is itself off', evidence: 'measured: measured_sensors.json score.made_fg_lag_vs_pbp_clock_s (n = 1,344; 98.7 % within 10 s)', measured_key: summary.score.made_fg_lag_vs_pbp_clock_s.p99, measured_plus: 1.0}
      foul_to_bug_window_s: {value: 42.0, unit: s, why: 'the bug team-foul count must follow a play-by-play foul inside this window (p99 41 s + window_margin_s)', evidence: 'measured: measured_sensors.json bug_fields.team_foul_lag_vs_pbp_clock_s (n = 566)', measured_key: summary.bug_fields.team_foul_lag_vs_pbp_clock_s.p99, measured_plus: 1.0}
  clock:
    summary: Piecewise linear (game clock, shot clock). Read from the bug; dead-reckoned while the bug is away.
    sources: [{sensor: scorebug_ocr, role: value}, {sensor: pbp_final, role: confirm}, {sensor: audio, role: timing}, {sensor: cv_events, role: timing}]
    update: {changed_by: continuous}
    dropout:
      - {when: scorebug hidden, rule: DEAD_RECKON, grade_path: [observed, inferred, carried, unknown], limits: {clock_inferred_max_s: 3, clock_carried_max_s: 30}, on_return: SNAP_AND_LOG, evidence: 'measured: withheld readings - last-status reckoning within 1 s in 96.6 % after 2 s, 93.8 % after 3 s, 88.2 % after 5 s, 76.4 % after 10 s, 59.2 % after 20 s (measured_sensors.json clock_carry_on_withheld_readings)'}
      - {when: scorebug hidden and a stop or start cue arrives, rule: CUE_RECKON, grade_path: [inferred, carried, unknown], limits: {clock_inferred_max_s: 3, clock_carried_max_s: 30}, on_return: SNAP_AND_LOG, evidence: 'assumed: a cue removes the main error source (an unseen stop or start). The replay harness sweeps it with stand-in cues (ACC-LS-H4): the estimate improves at every age past 3 s, but a claim restarted at the cue fell below the promise, so the inferred limit stays tied to the last reading. Measured once audio is (OQ-LS-3)'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: state record principle 7 - the clock in a replay is a past clock; it is stored raw and never used'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE, evidence: 'rule: 5-11 - clocks are stopped during a break'}
    conflict: [{between: [scorebug_ocr, pbp_final], tolerance: 1.0, value_winner: scorebug_ocr, timing_winner: scorebug_ocr, log_to: scoreboard_flags}]
    latency: {provisional: {by: scorebug_ocr, p50_s: 0.1, p95_s: 0.3}, confirmed: {by: scorebug_ocr, p50_s: 0.1, p95_s: 0.3}, evidence: 'assumed: one read of the frame (frame_to_state_s, frame_to_state_p95_s). How far the bug trails the arena clock is not measured and is counted as 0 until R-SY-14 gives it per game'}
    params:
      clock_inferred_max_s: {value: 3.0, unit: s, why: 'a dead-reckoned clock is graded inferred (a claim) only this long after the last reading; the claim is "within clock_tolerance_s in at least clock_inferred_promise of cases"', evidence: 'measured: 93.8 % within 1 s after 3 s, 88.2 % after 5 s (withheld readings, 33 broadcasts)'}
      clock_inferred_promise: {value: 0.90, unit: share, why: 'share of inferred clock values that must be within clock_tolerance_s (grade honesty). It must hold pooled over all inferred seconds and at every age inside the horizon (an age is tested with at least 200 seconds). The shot clock is held to the same promise', evidence: 'measured: met at 3 s (93.8 %), not at 5 s (88.2 %)'}
      clock_tolerance_s: {value: 1.0, unit: s, why: 'the bug shows whole seconds above 1:00, so 1 s is the resolution floor of every reading', evidence: 'measured: resolution of the sensor (results/w3_intake/scorebug_summary.md)'}
      clock_carried_max_s: {value: 30.0, unit: s, why: 'after this long without a reading or a cue the dead-reckoned value is dropped to unknown; only the guaranteed interval is kept', evidence: 'measured: within 1 s in 44.8 % after 30 s and 18.2 % after 60 s (withheld readings)'}
      snap_log_tolerance_s: {value: 1.0, unit: s, why: a returning reading further than this from the held estimate is logged as a miss, evidence: 'measured: resolution floor of the sensor (1 s above 1:00)'}
  status:
    summary: An enum changed by typed transitions (ball status, control, possession, flow state, restart, stoppage, try in flight, arrow).
    sources: [{sensor: cv_events, role: value}, {sensor: cv_tracking, role: value}, {sensor: pbp_feed, role: confirm}, {sensor: audio, role: timing}]
    update: {changed_by: per field}
    dropout:
      - {when: not main camera, rule: CARRY, grade_path: [observed, carried, unknown], limits: {status_carried_max_s: 5}, on_return: REACQUIRE, evidence: 'assumed: a tight shot hides the play; MAX_DWELL caps every carried status by its rule bound. Replaced by the measured share of tight shots during live play on MSU film'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, carried], limits: {}, on_return: REACQUIRE, evidence: 'requirement: state record principle 7'}
      - {when: break, rule: FREEZE_ON_BREAK, grade_path: [observed, carried, unknown], limits: {}, step_at: [0, on_return], on_return: REACQUIRE, evidence: 'definition: a break hides the restart. The value is carried while the break lasts (or until its max dwell) and is unknown from the first frame back until it is observed again; state after a break is re-acquired, not assumed'}
      - {when: ball not visible, rule: CARRY, grade_path: [observed, inferred, carried], limits: {status_carried_max_s: 5}, on_return: SNAP_AND_LOG, evidence: 'assumed: a ball hidden for a moment does not change hands. Replaced by the measured share of ball-lost stretches that hide a change on MSU film'}
    conflict: [{between: [cv_events, pbp_final], tolerance: 0, value_winner: neither, timing_winner: cv_events, log_to: cv_events_unmatched}]
    latency: {provisional: {by: cv_events, p50_s: 0.2, p95_s: 1.0}, confirmed: {by: pbp_feed, p50_s: 20.0, p95_s: 60.0}, evidence: 'assumed: a change of status needs a few frames (about 6 at 29.97 fps) to be told from noise; p95 = cv_event_delay_p95_s. Confirmed = feed_delay_p50_s and feed_delay_p95_s (OQ-LS-1)'}
    params:
      status_carried_max_s: {value: 5.0, unit: s, why: 'default time a status may be carried without sight of the play before it is unknown; each field replaces it by its max_dwell bound where one exists', evidence: 'assumed: the shortest rule bound that applies to most statuses (throw-in 5 s, Rule 7-6.6). Replaced by the measured rate of unseen status changes on MSU film'}
  roster:
    summary: The five on the floor per team. Changes only at dead balls.
    sources: [{sensor: pbp_final, role: value}, {sensor: pbp_feed, role: value}, {sensor: cv_tracking, role: confirm}]
    update: {changed_by: [T22]}
    dropout:
      - {when: live ball, rule: HOLD_UNTIL_EVENT, grade_path: [confirmed, observed], limits: {}, on_return: SNAP_AND_LOG, evidence: 'requirement: R-IV-03 - substitutions happen only at dead balls; a lineup held through live play cannot change'}
      - {when: 'dead ball out of view (replay, tight shot, break)', rule: CARRY, grade_path: [observed, carried], limits: {lineup_unverified_after_s: 3}, on_return: REACQUIRE, evidence: 'assumed: a substitution needs a dead ball and a beckon; any dead ball unseen for longer than this may hide one. Replaced by the shortest substitution seen on MSU film'}
      - {when: feed stale, rule: CARRY, grade_path: [confirmed, carried], limits: {}, on_return: LATE_CORRECTION, evidence: 'definition: identity locks can confirm five players without the feed (identity pack)'}
    conflict: [{between: [pbp_final, cv_tracking], tolerance: 0, value_winner: neither, timing_winner: cv_tracking, log_to: identity_review}]
    latency: {provisional: {by: cv_tracking, p50_s: 2.2, p95_s: 8.0}, confirmed: {by: pbp_feed, p50_s: 20.0, p95_s: 60.0}, evidence: 'assumed: time for identity to lock the entering player after a substitution; p95 = sub_window_s. Replaced by the time to lock measured by the identity harness on MSU film. Confirmed = feed delay (OQ-LS-1)'}
    params:
      lineup_unverified_after_s: {value: 3.0, unit: s, why: a dead ball out of view for longer than this marks both lineups unverified (carried) until substitution rows or identity locks confirm them, evidence: 'assumed: a player needs about 3 s to run on from the scorer''s table. Replaced by the shortest substitution seen on MSU film'}
      sub_window_s: {value: 8.0, unit: s, why: 'play-by-play substitution times lag or lead the real change; same value as the identity pack', evidence: 'config: config/identity_pack.yaml cue lineup, sub_window_s', mirrors: 'config/identity_pack.yaml:cues.lineup.params.sub_window_s.value'}
  observation:
    summary: Per-frame measurements (positions, ball, identity confidence, officials).
    sources: [{sensor: cv_tracking, role: value}]
    update: {changed_by: per_frame}
    dropout:
      - {when: player or ball off screen, rule: CARRY, grade_path: [observed, imputed, unknown], limits: {offscreen_imputed_max_s: 10}, on_return: SNAP_AND_LOG, evidence: 'decision: K15 - off-screen estimates at 10 Hz with a 95 % region and an is_imputed flag'}
      - {when: not main camera, rule: CARRY, grade_path: [observed, imputed, unknown], limits: {offscreen_imputed_max_s: 10}, on_return: REACQUIRE, evidence: 'assumed: same limit as one player off screen. Replaced by the measured error of the K15 estimate against age on MSU film'}
      - {when: replay, rule: FREEZE_ON_REPLAY, grade_path: [observed, unknown], limits: {}, on_return: REACQUIRE, evidence: 'requirement: state record principle 7 - positions in a replay are past positions'}
      - {when: identity on HOLD, rule: LOCK_OR_HOLD, grade_path: [observed, unknown], limits: {}, on_return: SNAP_AND_LOG, evidence: 'config: config/identity_pack.yaml outputs.live_panel (OD-10)'}
    conflict: []
    latency: {provisional: {by: cv_tracking, p50_s: 0.1, p95_s: 0.3}, confirmed: {by: cv_tracking, p50_s: 0.1, p95_s: 0.3}, evidence: 'assumed: frame_to_state_s and frame_to_state_p95_s; measured per run (K23)'}
    params:
      offscreen_imputed_max_s: {value: 10.0, unit: s, why: 'an off-screen point estimate is kept this long (its 95 % region grows with time). Beyond it the point is unknown; the 10 Hz row is still written with the region only, marked weak (R-DT-07 asks a row for every missing player-second)', evidence: 'requirement: R-DT-07 (more than 10 s off screen: region only, weak). Was 8 s (assumed, one half-court trip) until the integration of 11 Nov; the age at which the K15 region stops covering 95 % on MSU film may shorten it'}
  derived:
    summary: Computed from other fields (margin, run, bonus, foul trouble, clutch, win probability, leverage, expected points, situation flags).
    sources: []
    update: {changed_by: on_input_change}
    dropout: [{when: any input below its needed grade, rule: VALID_IF, grade_path: [observed, inferred, carried, unknown], limits: {}, on_return: SNAP_AND_LOG, evidence: 'definition: rule WORST_INPUT'}]
    conflict: []
    latency: {provisional: {by: inputs, p50_s: 0.1, p95_s: 0.2}, confirmed: {by: inputs, p50_s: 0.1, p95_s: 0.2}, evidence: 'assumed: the compute time alone (derived_compute_s). A derived field states its own timing - its slowest input plus derived_compute_s - and the lint checks that it is not earlier than any input'}
    params:
      derived_compute_s: {value: 0.1, unit: s, why: time added on top of the slowest input, evidence: 'assumed: one model evaluation per state change. Measured per run (K23)'}
  meta:
    summary: Observability fields that drive every other dropout rule (camera shot type, scorebug visible, replay flag, coverage, feed heartbeat, degradation level).
    sources: [{sensor: cv_tracking, role: value}]
    update: {changed_by: [T25]}
    dropout: [{when: detector unsure, rule: CARRY, grade_path: [observed, inferred, unknown], limits: {meta_unsure_max_s: 1}, on_return: SNAP_AND_LOG, evidence: 'assumed: while the shot type is unsure the stricter level applies (a possible replay is treated as a replay). Replaced by the measured decision time on gold-v1 shot-type labels'}]
    conflict: []
    latency: {provisional: {by: cv_tracking, p50_s: 0.1, p95_s: 0.5}, confirmed: {by: cv_tracking, p50_s: 0.5, p95_s: 1.0}, evidence: 'assumed: a cut is seen in the frame it happens; telling a replay from live play takes up to replay_guard_s. Replaced by the decision time on gold-v1 shot-type labels (R-SR-10)'}
    params:
      meta_unsure_max_s: {value: 1.0, unit: s, why: 'an unsure shot type is resolved toward the stricter level for this long, then unknown', evidence: 'assumed: same as replay_guard_s. Replaced by the decision time on gold-v1 shot-type labels (R-SR-10)'}
      replay_guard_s: {value: 1.0, unit: s, why: 'no transition is confirmed before the replay detector has had this long to object; a replayed make must never score twice', evidence: 'assumed: R-SR-10 asks >= 99 % replay recall; the guard is the detector''s decision time, to be measured on gold-v1'}

# ---------------------------------------------------------------------------------------------------------------------
# Longest time a state can last under the rules. A carried status past its bound must degrade (rule MAX_DWELL).
# Rule numbers and pages checked against docs/rules/PRMBB_RulesBook.pdf (2026-27) on 11 Nov 2026.
max_dwell:
  try_in_flight:       {counts_in: real, value: 4.0,  unit: s, rule: physics, why: 'a try from half court is in the air under 3 s; 4 s covers a high arc plus ring time', evidence: 'assumed: projectile time. Replaced by the longest release-to-result time on gold-v1'}
  throw_in:            {counts_in: real, value: 5.0,  unit: s, rule: '7-6.6 and 9-4.1.d', why: five seconds from the ball at the thrower's disposal to the release, evidence: 'rule: 7-6.6 (pdf p. 88) and 9-4.1.d (pdf p. 96)', mirrors: 'config/invariants.yaml:constants.throw_in_count_s'}
  free_throw_attempt:  {counts_in: real, value: 10.0, unit: s, rule: '8-5.1.a and 9-1.1.a', why: ten seconds from the ball at the free-thrower's disposal to the release, evidence: 'rule: 8-5.1.a (pdf p. 92) and 9-1.1.a (pdf p. 94)', mirrors: 'config/invariants.yaml:constants.free_throw_release_s'}
  backcourt_control:   {counts_in: game_clock, value: 10.0, unit: s, rule: '9-10 and 2-7.9', why: 10-second backcourt count; it resets on most stoppages of the game clock, evidence: 'rule: Rule 9 Section 10 (pdf p. 99) and 2-7.9 (pdf p. 40); Case Book A.R. 9-26 to 9-29', mirrors: 'config/invariants.yaml:constants.backcourt_count_s'}
  closely_guarded:     {counts_in: real, value: 5.0,  unit: s, rule: '9-14.2', why: closely guarded holder in the frontcourt, evidence: 'rule: 9-14.2 (pdf p. 101)', mirrors: 'config/invariants.yaml:constants.closely_guarded_count_s'}
  shot_clock_period:   {counts_in: game_clock, value: 30.0, unit: s, rule: '2-11.1 and 9-11.1', why: a team's control without a reset cannot outlast the shot clock, evidence: 'rule: 2-11.1 (pdf p. 43) and 9-11.1 (pdf p. 99)', mirrors: 'config/invariants.yaml:constants.shot_clock_full_s'}
  timeout_30:          {counts_in: real, value: 30.0, unit: s, rule: '5-14.4.c', why: charged 30-second timeout, evidence: 'rule: 5-14.4.c (pdf p. 74)', mirrors: 'config/invariants.yaml:constants.timeout_length_s.to30'}
  timeout_60:          {counts_in: real, value: 60.0, unit: s, rule: '5-14.4.b', why: 60-second timeout in the media format, evidence: 'rule: 5-14.4.b (pdf p. 74)', mirrors: 'config/invariants.yaml:constants.timeout_length_s.to60'}
  timeout_75:          {counts_in: real, value: 75.0, unit: s, rule: '5-14.4.a', why: full timeout without the media format, evidence: 'rule: 5-14.4.a (pdf p. 74)', mirrors: 'config/invariants.yaml:constants.timeout_length_s.to75'}
  replace_player:      {counts_in: real, value: 20.0, unit: s, rule: '4-12.5, 2-10.9 and 3-6.3.a', why: time limit to replace a disqualified or injured player, evidence: 'rule: 4-12.5 (pdf p. 55), 2-10.9 (pdf p. 42) and 3-6.3.a (pdf p. 50)', mirrors: 'config/invariants.yaml:constants.disqualified_replace_s'}
  halftime:            {counts_in: real, value: 900.0, unit: s, rule: '5-6.1', why: 15-minute halftime intermission, evidence: 'rule: 5-6.1 (pdf p. 69)'}
  halftime_tournament: {counts_in: real, value: 1200.0, unit: s, rule: '5-8 note', why: 'halftime of an NCAA Division I tournament game may be five minutes longer', evidence: 'rule: Rule 5 Section 8, note (pdf p. 70)'}
  pre_overtime:        {counts_in: real, value: 60.0, unit: s, rule: '5-6.1', why: one-minute intermission before each extra period, evidence: 'rule: 5-6.1 (pdf p. 69)'}
  note: 'Media timeouts and monitor reviews have no fixed bound in the book (a media timeout lasts as long as the media agreement says, Rule 5-14.10); they end on an observed restart (T26), never on a timer. A bound in this table is the latest moment the state can still hold; a broadcast that returns late from a break only delays the observation, it does not extend the state. counts_in says which time the bound runs in: real (video time inside a stretch without a cut) or game_clock (only while the clocks run - the bound does not elapse during a timeout or an intermission, Rule 5-11).'

# ---------------------------------------------------------------------------------------------------------------------
# What the broadcast is showing decides what can be known. The level is itself a field (degradation_level).
degradation_levels:
  D0_full:      {when: 'main wide camera, bug readable, feed healthy', clocks: observed, counters: confirmed, status: observed, roster: confirmed, observation: observed, derived: observed, panel: 'everything'}
  D1_bug_away:  {when: 'main wide camera, bug hidden or unreadable', clocks: 'inferred up to clock_inferred_max_s, then carried, then unknown', counters: 'observed while CV watches the ball and rim, else carried', status: observed, roster: observed, observation: observed, derived: worst input, panel: 'clock shown with its age; score marked provisional'}
  D2_off_main:  {when: 'tight shot, bench, crowd, reverse angle (play may be live)', clocks: 'as read if the bug is visible, else D1', counters: 'as read if the bug is visible, else carried', status: 'carried up to its max dwell, then unknown', roster: 'observed in live play, unverified after an unseen dead ball', observation: 'imputed, then unknown', derived: worst input, panel: 'positions hidden; counts as read'}
  D3_replay:    {when: 'replay or slow motion', clocks: carried, counters: carried, status: carried, roster: carried, observation: unknown, derived: carried, panel: 'frozen state, marked replay'}
  D4_break:     {when: 'ad break, studio, full-screen graphic, frozen picture or repeated frames', clocks: carried, counters: carried, status: 'carried, then unknown', roster: 'carried, unverified on return', observation: unknown, derived: carried, panel: 'frozen state, marked break'}
  D5_no_video:  {when: 'stream lost', clocks: 'unknown after clock_carried_max_s', counters: 'carried; from the feed if healthy', status: unknown, roster: 'from the feed if healthy', observation: unknown, derived: worst input, panel: 'feed-only view'}
  feed_stale:   {when: 'a flag on top of any level - no feed row for feed_stale_after_s', effect: 'scorebook-only values (who, what, foul type, substitutions) stop updating; confirmed values that needed the feed stay observed'}
  rule: 'When the shot type is unsure the stricter level applies (meta profile). Levels D0 to D4 change only through T25 (what the broadcast shows). D5_no_video and the feed_stale flag are set by the heartbeats of the stream and of the feed, outside the typed transitions: T25 of config/state_machine.yaml lists camera cuts, replays, graphics and the bug only. A worse level applies at once; a better one waits for the return rule of the field (SNAP_AND_LOG, REACQUIRE). The columns are the profiles: clocks = clock, counters = counter, and so on. Fixed fields are not degraded at any level. Meta fields are what sets the level; they follow the meta profile.'

# ---------------------------------------------------------------------------------------------------------------------
reconciliation:
  value_authority: [pbp_final, pbp_feed, arena_scoreboard, scorebug_ocr, cv_events]
  timing_authority: [cv_events, audio, scorebug_ocr, pbp_final]
  authority_note: 'The arena scoreboard is in the order because Rule 2-9.13 names it; it is not a sensor of this pack (it is seen only when the camera shows it).'
  windows:
    make_to_bug: make_confirm_window_s
    pbp_second_to_bug: pbp_to_bug_window_s
    foul_to_bug_count: foul_to_bug_window_s
    reset_rule: 'K02 and R-SB-03 - after each game a window is re-set to the measured 99th percentile of its lag plus window_margin_s. The make window stays inside make_window_min_s and make_window_max_s.'
  tolerances: 'Counters 0 (any difference is a flag). Clocks clock_tolerance_s (R-SB-03 tightened: scorebug against play-by-play within +-1 s of game clock).'
  logging:
    scoreboard_flags: a confirm window that closed without its confirmation, or a bug value that disagrees with the scorebook
    state_corrections: a stored value replaced after review or by an official correction (the raw reading stays)
    cv_events_unmatched: a CV event with no play-by-play row (never discarded, principle 4; R-SR-14)
    identity_review: a lineup from the scorebook that the identity locks contradict (review item of the identity pack)
    registry_change_log: a registry value changed after it was first set
    latency_report: 'per game and field - event, observed and known times, per grade (K23)'
  versions: 'LATE_CORRECTION - new state_version; old versions stay readable; as_of_known is immutable for instants already past'

# ---------------------------------------------------------------------------------------------------------------------
latency_budget:
  policy: K23 - reported, not a gate.
  per_profile: 'see profiles.<name>.latency (provisional and confirmed, median and p95, live mode)'
  composition: 'A timing block of a profile or a field is known_time - event_time in video time: the delay of the sensor named in "by" plus frame_to_state_s. A derived field is its slowest input plus derived_compute_s; when some inputs are much slower than the ones that move the value, the field lists the inputs its timing is written for under timing.driven_by. capture_to_frame_s and state_to_view_s sit outside the block: together with stream_delay_s they turn video time into known_at_utc and into what a viewer sees.'
  end_to_end:
    capture_to_frame_s:  {value: 0.2, unit: s, why: decode and hand-over of a frame, evidence: 'assumed: a few frames of buffer. Measured per run (K23)'}
    frame_to_state_s:    {value: 0.1, unit: s, why: 'median time for OCR, CV and fusion on one frame', evidence: 'assumed: detection alone takes 0.026 s per frame on an L4 (measured: results/00_smoke/metrics.json); OCR, tracking and fusion are not measured. Measured per run (K23)'}
    frame_to_state_p95_s: {value: 0.3, unit: s, why: '95th percentile of the same', evidence: 'assumed: three times the planning median. Measured per run (K23)'}
    state_to_view_s:     {value: 0.2, unit: s, why: write and render, evidence: 'assumed: one write and one screen refresh. Measured per run (K23)'}

