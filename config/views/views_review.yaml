# Views catalogue, review surface (baseline 5). Post-game and film-room views, reports, cards, scouting and market views.
# Contract and index: config/views/core.yaml. Lint: python tools/specgen/views/vwlib.py --check config/views/views_review.yaml
# The first record is the worked example of this file. The other records of the index are written by the view author.
file: views_review
version: 0.1.0
date: '2026-11-20'

views:
  possession_explorer:
    id: VW-REV-01
    name: Possession explorer
    surface: review
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: What happened in this possession, and how much did each action change its value?
    grain: possession
    as_of: {view: as_of_event, pass: [anchored, blind]}
    refresh: {class: per_frame}
    min_width_px: 1280
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'RECORDED, as of event, the pass, the state version, the play-by-play version, and the level of the stretch under the playhead.'
        inputs: {}
      - key: possession_list
        kind: table
        shows: 'The possessions left by the filter, in game order: period and clock at the start, team, start type, chances, points, value at the start, share of the possession seen on the main camera.'
        inputs:
          tables: [possessions.possession_id, possessions.team_id, possessions.start_period, possessions.start_game_clock_s, possessions.start_type_code, possessions.n_chances, possessions.points, possessions.value_start, possessions.coverage_mean, possessions.usable_flag]
          metrics: [M-TEFF-024]
        number_rule:
          - {class: official, source: 'points from the final play-by-play, with its version', as_of: the anchored pass, link: frames}
          - {class: model, band: printed beside the value at the start, model_version: in the column head, link: frames}
        grade_rule: contract
        notes: A possession that is not usable (too little seen) stays in the list, greyed, with the reason.
      - key: possession_header
        kind: tile
        shows: 'The chosen possession: team, start type, after a timeout or not, length, chances, shot clock at the start of each chance and time used, points, value at the start, break state and its value when it is a transition.'
        inputs:
          tables: [possessions.team_id, possessions.start_type_code, possessions.after_timeout, possessions.duration_s, possessions.n_chances, possessions.points, possessions.value_start, possessions.transition_class, chances.chance_number, chances.shot_clock_start_s, chances.time_used_s, chances.end_type, transition_numbers.numbers_label, transition_numbers.value_xpts]
          metrics: [M-TEFF-024, M-TEFF-013]
          events: ['transition:numbers_advantage']
        requirements: [R-PS-11, R-TR-26]
        number_rule:
          - {class: official, source: the final play-by-play, as_of: the anchored pass, link: frames}
          - {class: model, band: printed beside each value, model_version: under the tile, link: frames}
          - {class: measurement, unit: seconds, error: 'the clock tolerance of the stretch (1 s above 1:00)', link: frames}
        grade_rule: contract
      - key: video
        kind: video
        component: video_player
        shows: The broadcast video of the possession, from the private store, with the clip window of the possession.
        inputs:
          tables: [clip_index.in_s, clip_index.out_s, clip_index.key_frame, clip_index.replay_ids]
        requirements: [R-VZ-01]
        grade_rule: contract
      - key: court
        kind: court
        component: top_down_court
        shows: 'Ten players and the ball from above, in step with the video, in the named-spots frame. Regions and spots can be switched on.'
        inputs:
          tables: [player_positions.player_id, player_positions.team_id, player_positions.spot]
          spots: ['layer:zone_scheme:court_region', 'layer:spot', elbow, low_post, corner_three]
        requirements: [R-VZ-01]
        identity_rule: probable_flagged_offline
        grade_rule: contract
        by_grade:
          observed: Filled marker with the jersey number.
          imputed: 'Hollow marker with its 95 % region, for at most offscreen_marker_max_s; then the marker is removed.'
          unknown: 'No marker. The count "8 of 10 shown" is printed in the corner.'
      - key: trails_and_arrows
        kind: overlay
        shows: 'On court and video: a trail for every player, an arrow for every pass with its value change, a mark at every screen, a mark at every switch, the drive line.'
        inputs:
          tables: [movement_primitives.player_id, movement_primitives.primitive_type, movement_primitives.start_x_m, movement_primitives.start_y_m, movement_primitives.end_x_m, movement_primitives.end_y_m, movement_primitives.path_shape, passes.passer_id, passes.receiver_id, passes.start_x_m, passes.start_y_m, passes.end_x_m, passes.end_y_m, passes.pass_type, passes.outcome, passes.value_delta, screens.screen_kind, screens.x_m, screens.y_m, screens.screen_moment_frame, screens.strict_rule_fired, screens.loose_rule_fired, defensive_matchups.defender_id, defensive_matchups.attacker_id, defensive_matchups.switched_this_second]
          metrics: [M-PASS-039, M-DEF-071]
          events: ['ball_actions:pass', 'ball_actions:drive', 'cuts:cut', 'screens:screen', 'screens:ball_screen', 'defense:switch', 'defense:matchup']
        layers: [trails, pass arrows, screen marks, switch marks, drive lines]
        definitions: ['screen: the mark says whether the strict or the loose rule fired']
        requirements: [R-VZ-04]
        identity_rule: probable_flagged_offline
        number_rule: {class: model, band: 'printed in the inspector; the arrow carries only the sign and size of the change', model_version: in the inspector, link: frames}
        grade_rule:
          imputed: 'A trail through an off-screen stretch is dotted and hollow. No arrow starts or ends at an imputed point.'
          unknown: The trail stops. It is not joined across the gap.
      - key: value_curve
        kind: chart
        component: value_curve
        shows: 'Possession value in expected points across the possession, with its band, and a mark at every action with the change it made and who is credited.'
        inputs:
          tables: [possession_value.p_shot_part, possession_value.p_pass_part, possession_value.p_turnover_part, possession_value.calibration_bin, value_credits.player_id, value_credits.share]
          metrics: [M-IMP-063, M-IMP-065, M-PASS-039, M-PASS-041, M-IMP-066, M-IMP-067, M-SPACE-045, M-TOV-023]
        requirements: [R-VZ-04, R-VL-01, R-VL-02]
        identity_rule: locked_or_hold
        number_rule: {class: model, band: 'a fading band round the line; never bare bar ends', model_version: printed in the chart corner, link: frames}
        grade_rule:
          carried: 'Through a replay or a break the line holds its last value and is marked "held".'
          unknown: 'A gap in the line with the reason. The line is not joined across it.'
        notes: 'The credits of one action sum to its value change (R-VL-02). A credit reads locked identities only; a probable label never enters it.'
      - key: action_list
        kind: table
        shows: 'Every action of the possession in order: clock, shot clock, who, what, value before and after, the change.'
        inputs:
          tables: [events.event_id, events.event_type_code, events.game_clock_s, events.shot_clock_s, events.player_id_1, events.value_before, events.value_after, events.frame_index]
          metrics: [M-IMP-065]
        identity_rule: locked_or_hold
        number_rule: {class: model, band: printed beside each change, model_version: in the table foot, link: frames}
        grade_rule: contract
      - key: set_overlay
        kind: overlay
        shows: 'For a matched set: the path of the template drawn faintly beside the real paths, the set name and the confidence of the match, the step where the possession left the template. Nothing for an unmatched set.'
        inputs:
          tables: [set_instances.set_code, set_instances.family_code, set_instances.compositional_name, set_instances.match_confidence, set_instances.template_version, set_instances.mirrored, set_instances.departure_step, set_instance_phases.phase_name, set_instance_phases.start_ts_ms, set_instance_phases.end_ts_ms]
          events: ['composition:set_match', 'composition:departure', 'composition:template_format']
        requirements: [R-VZ-05, R-ST-07]
        numbers: true
        number_rule: {class: label, confidence: printed beside the set name, version: the template version beside it, link: frames}
        grade_rule: contract
      - key: matchups
        kind: table
        shows: 'Who guarded whom through the possession, each switch, and the mismatch of each pair in height and speed.'
        inputs:
          tables: [defensive_matchups.defender_id, defensive_matchups.attacker_id, defensive_matchups.matchup_prob, defensive_matchups.switched_this_second, defensive_matchups.mismatch_height_cm, defensive_matchups.mismatch_speed_mps]
          metrics: [M-DEF-072]
          events: ['defense:matchup', 'defense:switch']
        requirements: [R-MX-01]
        identity_rule: locked_or_hold
        number_rule:
          - {class: label, confidence: the matchup probability of each pair, version: in the inspector, link: frames}
          - {class: measurement, unit: 'centimetres for height, metres per second for speed', error: printed beside each gap, link: frames}
        grade_rule: contract
      - key: timeline
        kind: timeline
        component: timeline
        shows: 'The possession on one time scale: chances, events, shot clock, set phases, and shaded replays.'
        inputs:
          tables: [set_instance_phases.phase_name, frames.is_replay]
          events: ['dim:flow_state', 'dim:shot_clock_status', 'dim:try_in_flight']
        grade_rule: contract
      - key: filter_bar
        kind: control
        component: filter_bar
        shows: 'Filters by player, lineup, set, coverage, opponent, game, period and state. Each definition in use is named.'
        inputs: {}
        definitions: ['clutch (K06)', 'garbage time (K28)', 'run (K05)', 'transition class (the repo rule; other definitions are named when chosen)']
        requirements: [R-VZ-06e]
      - key: clip_export
        kind: control
        component: clip_export
        shows: 'Export of the possession or of one action: a clip reference with the overlay spec, or a top-down render.'
        inputs: {}
        requirements: [R-VZ-06f, R-VZ-10]
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected object: value, grade and confidence, source and as-of, version, lineage, history.'
        inputs: {}
    interactions:
      - {action: filter, at: filter_bar, target: narrows the possession list}
      - {action: select, at: possession_list, target: 'opens the possession in the header, the video, the court and the curve'}
      - {action: scrub, at: timeline, target: 'video, court, overlays and the playhead of the value curve move together'}
      - {action: select, at: view, target: 'any marker, arrow, mark, point of the curve or table cell opens the inspector'}
      - {action: brush, at: value_curve, target: 'a time range of the possession; the selection is a query'}
      - {action: toggle_layer, at: trails_and_arrows, target: each overlay on or off}
      - {action: toggle_layer, at: set_overlay, target: the template path on or off}
      - {action: inspect_query, at: value_curve, target: the rows and the query behind the curve}
      - {action: drill_down, at: action_list, target: the action in the Studio at its frame, to: studio_game_canvas}
      - {action: export, at: clip_export, target: a clip reference of the possession or the action, produces: clip_reference}
      - {action: export, at: court, target: a top-down drawing of one moment, produces: top_down_render}
    degraded:
      D1_bug_away: default
      D2_off_main: 'Video plays. The court shows hollow markers with regions up to the limit, then removes them and prints how many of ten are shown. Trails are dotted, then stop. The value curve keeps the play-by-play layer and says the tracking layer is off.'
      D3_replay: 'Video shows the replay. Court, overlays and curve stay at the last live instant, marked REPLAY. The replay is offered as linked evidence of the same play.'
      D4_break: default
      D5_no_video: 'A card "no video for this possession". The header, the action list from play-by-play and the play-by-play value layer stay.'
      feed_stale: default
    empty_state: 'No possession matches the filter: "no possession matches" with the filter in words and a button to clear it. Game not processed: "this game has no tracking yet - play-by-play only", and the list, header and action list still show.'
    requirements: [R-VZ-01, R-VZ-02, R-VZ-03, R-VZ-04, R-VZ-05, R-VZ-06e, R-VZ-06f, R-VZ-10, R-ST-07, R-MX-01, R-PS-11, R-TR-26, R-VL-01, R-VL-02, R-PR-19]
    decisions: [K05, K06, K12, K15, K28, OD-8]
    depends_on:
      baselines: [named_spots, movement_grammar, state_machine, identity_pack, metrics, live_state]
      tables: [possessions, chances, transition_numbers, clip_index, video_files, frames, clock_map, player_positions, ball_states, movement_primitives, passes, screens, defensive_matchups, possession_value, value_credits, events, set_instances, set_instance_phases, state_segments, state_transitions, run_records]
    phase: P2
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-R2, ACC-VW-R4, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-G1, ACC-VW-G2, ACC-VW-P1]
    wireframe: docs/data/views/possession_explorer.svg
    notes: >-
      First renderable at P2 with video, court, play-by-play events and the play-by-play value layer; trails, passes
      and screens at P3 and P4; the tracking value layer and credits at P5. Desktop view: video and court side by
      side, the value curve under both, the lists at the side.

  # -------------------------------------------------------------------------------------------------------------------
  matchup_board:
    id: VW-REV-02
    name: Matchup board
    surface: review
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: Who guarded whom in this game, for how long, and what did each pairing give up?
    grain: game
    as_of: {view: as_of_event, pass: [anchored, blind]}
    refresh: {class: post_game}
    min_width_px: 1280
    definitions:
      - 'matchup: the assignment of defense:matchup, one defender per attacker per second, with its probability. A second below the gate of that rule is counted as "unassigned". It is never given to the likeliest defender.'
      - 'switch: the rule defense:switch. An exchange of three or more defenders is one defense:multi_switch.'
      - 'observed, not predicted: this board shows who did guard whom. The forecast made before the game is the mismatch map of the pre-game card.'
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'RECORDED, as of event, the pass, the state version, the play-by-play version, and the share of defensive seconds that could be matched.'
        inputs: {}
      - key: filter_bar
        kind: control
        component: filter_bar
        shows: 'Defending team, period, lineup, opponent player, state. The scope can be one game or the season. Each definition in use is named.'
        inputs: {}
        definitions: ['clutch (K06)', 'garbage time (K28)']
        requirements: [R-VZ-06e]
      - key: pair_grid
        kind: table
        shows: 'A grid for one defending team: defenders in rows, attackers in columns. Each cell: seconds matched, share of the floor time of the attacker, possessions matched and the mean assignment probability. Two extra rows count the seconds unassigned and the seconds not seen.'
        inputs:
          tables: [defensive_matchups.defender_id, defensive_matchups.attacker_id, defensive_matchups.matchup_prob, defensive_matchups.second_index, defensive_matchups.possession_id, defensive_matchups.is_on_ball, defensive_matchups.assignment_entropy, lineup_stints.player_ids, lineup_stints.duration_s]
          metrics: [M-DEF-052, M-DEF-060, M-DEF-058, M-DEF-056, M-DEF-059]
          events: ['defense:matchup']
        requirements: [R-VZ-06a, R-MX-01]
        identity_rule: locked_or_hold
        number_rule:
          - {class: measurement, unit: seconds, error: 'the seconds below the assignment gate, printed as "unassigned" beside every row total', link: frames}
          - {class: label, confidence: the mean assignment probability of the cell, version: 'the grammar version of defense:matchup, in the grid foot', link: frames}
        grade_rule:
          imputed: 'A second in which the defender or the attacker is off the main camera is not matched. It is counted in the row "not seen".'
          unknown: 'A pair that shared no observed floor time shows a dash. It never shows 0 s.'
      - key: pair_outcomes
        kind: table
        phase: P5
        shows: 'For each pair above the minimum count: points allowed and created per 100 matched possessions, shrunk toward the position-group prior; shots defended with makes and expected points; fouls; turnovers forced; the value credited to the defender. A pair below the minimum shows "too few" and n.'
        inputs:
          tables: [value_credits.player_id, value_credits.value_delta_xpts, value_credits.credit_role, shots.shooter_id, shots.closest_defender_id, shots.made, shots.shot_quality_xpts, shots.contest_distance_m, fouls.fouler_id, fouls.fouled_id, turnovers.player_id, turnovers.stealer_id]
          metrics: [M-DEF-061, M-DEF-062, M-DEF-063, M-DEF-065, M-DEF-044, M-DEF-046, M-DEF-128, M-PASS-085]
        requirements: [R-VL-07, R-VA-05, R-VL-12, R-VL-16]
        identity_rule: locked_or_hold
        number_rule:
          - {class: estimate, n: 'matched possessions, and the effective sample size after shrinkage', interval: the posterior interval printed after the value, level: 0.95, link: rows, min_n: registry}
          - {class: official, source: 'made shots, fouls and turnovers of the final play-by-play', as_of: the anchored pass, link: frames}
          - {class: model, band: printed beside each credited value, model_version: in the table foot, link: frames}
        grade_rule: contract
        notes: 'R-VL-07: shown only above the minimum count of R-VA-05. One game rarely reaches it; the season scope does. The prior and the shrinkage factor of every estimate are in the inspector (R-VL-12).'
      - key: assignment_timeline
        kind: timeline
        component: timeline
        shows: 'For the chosen attacker: one row per defender across game time, a mark at every switch, the substitutions, and shaded replays and breaks.'
        inputs:
          tables: [defensive_matchups.defender_id, defensive_matchups.attacker_id, defensive_matchups.switched_this_second, defensive_matchups.second_index, substitutions.player_in_id, substitutions.player_out_id, substitutions.game_clock_s]
          events: ['defense:switch', 'defense:matchup_change_log', T22]
        identity_rule: locked_or_hold
        grade_rule:
          imputed: 'A stretch with either player off the main camera is drawn as a hatched gap in the row.'
      - key: switch_log
        kind: table
        shows: 'Every switch of the game in order: clock, the two defenders, the screen or action that caused it, the coverage, the mismatch it made in height and speed, how long it lasted, whether the offense attacked it and what came of it.'
        inputs:
          tables: [defensive_matchups.switched_this_second, defensive_matchups.mismatch_height_cm, defensive_matchups.mismatch_speed_mps, defensive_matchups.defender_id, defensive_matchups.attacker_id, screens.screen_id, screens.screen_kind, screens.coverage_coarse, screens.coverage_fine_code, possessions.points]
          metrics: [M-DEF-071, M-DEF-072, M-DEF-070, M-SIT-086, M-PLAY-065]
          events: ['defense:switch', 'defense:multi_switch', 'defense:ball_screen_coverage_rule', 'screens:ball_screen']
        definitions: ['coverage: the 4 coarse classes always; the fine class only at confidence 0.8 or more, else the coarse class is shown (K04)']
        requirements: [R-MX-01, R-MX-02, R-MX-03, R-MX-04, R-DF-16]
        identity_rule: locked_or_hold
        number_rule:
          - {class: label, confidence: 'the probability of the switch and of the coverage class, beside each', version: the grammar version in the table foot, link: frames}
          - {class: measurement, unit: 'centimetres for height, metres per second for speed, seconds for duration', error: 'a listed height carries none and says "listed"; a speed prints its error', link: frames}
          - {class: official, source: points of the final play-by-play, as_of: the anchored pass, link: frames}
        grade_rule: contract
      - key: video
        kind: video
        component: video_player
        shows: The clip of the selected second, switch or shot, from the private store.
        inputs:
          tables: [clip_index.in_s, clip_index.out_s, clip_index.key_frame]
        requirements: [R-VZ-01]
        grade_rule: contract
      - key: court
        kind: court
        component: top_down_court
        shows: 'Ten players at the playhead with a line from each defender to the attacker he is assigned to. The line is dashed below the assignment gate and missing when a player is not seen.'
        inputs:
          tables: [defensive_matchups.defender_id, defensive_matchups.attacker_id, defensive_matchups.dist_to_man_m, defensive_matchups.goal_side, defensive_matchups.in_gap]
          spots: ['layer:zone_scheme:court_region']
          events: ['defense:matchup']
        requirements: [R-VZ-01]
        identity_rule: probable_flagged_offline
        grade_rule: contract
        by_grade:
          imputed: 'Hollow marker with its 95 % region. No assignment line starts or ends at it.'
          unknown: 'No marker. The count "8 of 10 shown" is printed in the corner.'
      - key: clip_export
        kind: control
        component: clip_export
        shows: 'Export of the selected switch or matched stretch as a clip reference, or the court at one moment as a top-down render.'
        inputs: {}
        requirements: [R-VZ-06f]
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected cell, switch or pair: value, grade and confidence, prior and shrinkage, source and as-of, version, lineage.'
        inputs: {}
    interactions:
      - {action: filter, at: filter_bar, target: 'narrows the seconds counted, by team, period, lineup and state'}
      - {action: select, at: pair_grid, target: 'a pair; the timeline, the outcome row and the switch log narrow to it'}
      - {action: drill_down, at: pair_grid, target: the matched possessions of the pair as a list, to: possession_explorer}
      - {action: select, at: switch_log, target: the video and the court jump to the switch}
      - {action: scrub, at: assignment_timeline, target: video and court move together}
      - {action: drill_down, at: pair_outcomes, target: the rows behind an estimate; each row links to its frames}
      - {action: inspect_query, at: pair_outcomes, target: the rows and the query with metric ids}
      - {action: export, at: clip_export, target: a clip reference of the selected stretch, produces: clip_reference}
      - {action: export, at: court, target: a top-down drawing of one moment, produces: top_down_render}
    degraded:
      D1_bug_away: default
      D2_off_main: 'Seconds off the main camera are not matched. The grid counts them as "not seen" and the banner prints the share of defensive seconds matched. An estimate keeps only matched possessions and shows its n.'
      D3_replay: default
      D4_break: default
      D5_no_video: 'A card "no video: no matchups for this game". Only the official counts of the outcome table stay (fouls, steals and blocks by player).'
      feed_stale: default
    empty_state: 'Game without tracking or before matchup detection (P4): "no matchups for this game yet". Filter with no matched second left: "no matched second in this filter" with the filter in words and a button to clear it.'
    requirements: [R-VZ-06a, R-VZ-01, R-VZ-02, R-VZ-03, R-VZ-06e, R-VZ-06f, R-MX-01, R-MX-02, R-MX-03, R-MX-04, R-VL-07, R-VA-05, R-VL-12, R-VL-16, R-DF-16, R-PR-19]
    decisions: [K04, K06, K12, K15, K28, OD-8]
    depends_on:
      baselines: [named_spots, movement_grammar, state_machine, identity_pack, metrics, live_state]
      tables: [defensive_matchups, lineup_stints, value_credits, shots, fouls, turnovers, substitutions, screens, possessions, chances, events, clip_index, video_files, frames, clock_map, player_positions, ball_states, state_segments, state_transitions, run_records]
    phase: P4
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-R2, ACC-VW-R4, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-G2, ACC-VW-P1]
    wireframe: null
    notes: >-
      Grid, timeline and switch log at P4; the outcome table at P5 with the value credits. The requirement test says
      "renders from the state tables"; this board reads the matchup and event tables, and the record lists them.

  # -------------------------------------------------------------------------------------------------------------------
  lineup_board:
    id: VW-REV-03
    name: Lineup board
    surface: review
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: Which five-player units played, for how long, and how did each do, given how few possessions each had?
    grain: lineup stint
    as_of: {view: as_of_event, pass: [anchored, pbp_only]}
    refresh: {class: post_game}
    min_width_px: 1280
    definitions:
      - 'lineup board (decided here, open question OQ-VW-1): lineup plus-minus with n, the stints and the composition of each unit. Who guarded whom is the matchup board.'
      - 'scope: one game or the season to date. In the game scope almost no unit reaches the minimum n, so the rating cell reads "too few" and the counts are shown; the season scope shows the rating.'
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'RECORDED, as of event, the pass, the play-by-play version, and the scope (this game, or the season through a date).'
        inputs: {}
      - key: filter_bar
        kind: control
        component: filter_bar
        shows: 'Team, scope, opponent, period, state, and a player who must be in or out of the unit. Each definition in use is named.'
        inputs: {}
        definitions: ['garbage time (K28): off by default; when a flag is on, its name is printed in the table head', 'clutch (K06)']
        requirements: [R-VZ-06e]
      - key: lineup_plus_minus
        kind: table
        shows: 'One row per five-player unit: the five names, seconds together, offensive and defensive possessions, points for and against, plus-minus, and net points per 100 possessions with n and interval. Below the minimum n the rating cell shows "too few" and n.'
        inputs:
          tables: [lineup_stints.lineup_key, lineup_stints.player_ids, lineup_stints.team_id, lineup_stints.duration_s, lineup_stints.off_possessions, lineup_stints.def_possessions, lineup_stints.points_for, lineup_stints.points_against, lineup_stints.opponent_lineup_key, lineup_stints.player_count_error, lineup_stints.season_seconds_together_before]
          metrics: [M-IMP-008, M-IMP-009, M-IMP-010, M-TEFF-039, M-TEFF-048, M-IMP-006]
        requirements: [R-VZ-06j, R-PR-14, R-VA-05]
        identity_rule: locked_or_hold
        number_rule:
          - {class: official, source: 'points and substitutions of the final play-by-play, with its version', as_of: 'the anchored pass, or pbp_only where the game has no video', link: rows}
          - {class: estimate, n: 'offensive and defensive possessions, each in its own column', interval: 'printed after the net rating, and drawn as a fading band in the bar', level: 0.95, link: rows, min_n: default}
        grade_rule:
          unknown: 'A stint whose five players do not add up (lineup_stints.player_count_error) is listed as "lineup unsure". Its seconds are counted. It enters no rating.'
      - key: stint_timeline
        kind: timeline
        component: timeline
        shows: 'The stints of both teams across game time, one row per unit in order of first use, with the margin line above and a mark at every substitution.'
        inputs:
          tables: [lineup_stints.stint_num, lineup_stints.lineup_key, lineup_stints.start_period, lineup_stints.start_game_clock_s, lineup_stints.end_game_clock_s, substitutions.game_clock_s, substitutions.player_in_id, substitutions.player_out_id, score_events.game_clock_s, score_events.delta_points, score_events.team]
          events: [T22, 'dim:lineup_home', 'dim:lineup_away']
        identity_rule: locked_or_hold
        grade_rule: contract
      - key: composition
        kind: table
        shows: 'For the chosen unit: mean, tallest and shortest listed height, height difference to the opposing unit, counts by listed position, bigs, shooters and ball handlers as of the date, mean class year and the archetype label.'
        inputs:
          tables: [lineup_stints.mean_height_cm, lineup_stints.max_height_cm, lineup_stints.min_height_cm, lineup_stints.height_diff_cm, lineup_stints.n_listed_g, lineup_stints.n_listed_f, lineup_stints.n_listed_c, lineup_stints.n_bigs, lineup_stints.n_shooters_asof, lineup_stints.n_ball_handlers_asof, lineup_stints.mean_class_year, lineup_stints.archetype]
          metrics: [M-IMP-014, M-PROF-045, M-PHYS-091, M-PASS-086, M-FOUL-067]
        requirements: [R-MD-29]
        number_rule:
          - {class: official, source: 'listed heights, positions and class years of the roster snapshot', as_of: the date of the roster snapshot, link: none_fixed}
          - {class: descriptive, n: the five players of the unit, descriptive_mark: 'the word "descriptive" in the column head of every as-of count', link: rows}
        grade_rule: contract
      - key: combinations
        kind: table
        shows: 'Groups of two and three players, and each player on and off the floor: seconds together, possessions, net points per 100 with n and interval, and the adjusted rating where a model version exists.'
        inputs:
          tables: [lineup_stints.player_ids, lineup_stints.off_possessions, lineup_stints.def_possessions, lineup_stints.points_for, lineup_stints.points_against]
          metrics: [M-IMP-001, M-IMP-002, M-IMP-003, M-IMP-007, M-IMP-017, M-IMP-016, M-IMP-019]
        identity_rule: locked_or_hold
        number_rule:
          - {class: estimate, n: possessions with the group on the floor, interval: printed after each rating, level: 0.95, link: rows, min_n: default}
          - {class: model, band: printed beside each adjusted rating, model_version: in the column head, link: rows}
        grade_rule: contract
      - key: starters_bench
        kind: tile
        shows: 'Starting five against bench units: minutes share, points, distinct units used and the size of the rotation.'
        inputs:
          tables: [team_box.bench_points, team_box.bench_minutes_share, player_box.starter, player_box.minutes]
          metrics: [M-IMP-015, M-COACH-040, M-COACH-043, M-PROF-047, M-PROF-048]
        requirements: [R-OS-06]
        number_rule:
          - {class: official, source: the official box of the game, as_of: the pull time of the box, link: rows}
          - {class: descriptive, n: the games of the scope, descriptive_mark: 'the word "descriptive" under the tile', link: rows}
        grade_rule: contract
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected unit, stint or number: value, n and interval, source and as-of, version, lineage.'
        inputs: {}
    interactions:
      - {action: filter, at: filter_bar, target: 'narrows the stints counted; the count of possessions left is printed'}
      - {action: select, at: lineup_plus_minus, target: 'a unit; the timeline marks its stints and the composition table opens'}
      - {action: drill_down, at: lineup_plus_minus, target: the possessions of the unit as a list, to: possession_explorer}
      - {action: brush, at: stint_timeline, target: 'a stretch of the game; the tables count only that stretch'}
      - {action: drill_down, at: combinations, target: the stints behind a group; each stint links to its possessions}
      - {action: inspect_query, at: lineup_plus_minus, target: the rows and the query with metric ids}
      - {action: export, at: lineup_plus_minus, target: 'the table of units, aggregates only', produces: aggregate_table}
    degraded:
      D1_bug_away: 'No change. A stint edge that rests on an estimated clock prints the clock interval.'
      D2_off_main: 'No change. Units come from the substitution rows. Where tracking exists and disagrees with them, the stint carries a flag.'
      D3_replay: 'No change. Replays enter no stint.'
      D4_break: 'No change. Breaks enter no stint.'
      D5_no_video: 'No change. The board needs no video and says "play-by-play only" in the banner.'
      feed_stale: default
    empty_state: 'No final play-by-play: "no lineups before the final play-by-play". Filter with no stint left: "no stint matches" with the filter in words and a button to clear it.'
    requirements: [R-VZ-06j, R-PR-14, R-VZ-02, R-VZ-03, R-VZ-06e, R-MD-29, R-OS-06, R-VA-05, R-PR-19]
    decisions: [K06, K12, K28]
    depends_on:
      baselines: [state_machine, identity_pack, metrics, live_state]
      tables: [lineup_stints, substitutions, score_events, team_box, player_box, state_segments, state_transitions, events, possessions, chances, run_records]
    phase: P0p
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-G2, ACC-VW-P1]
    wireframe: null
    notes: >-
      Renders from play-by-play alone. A number here links to rows (the possessions of the unit); each possession
      links to its frames once the game has video.

  # -------------------------------------------------------------------------------------------------------------------
  heat_maps:
    id: VW-REV-04
    name: Heat maps
    surface: review
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: Where on the court does this player, lineup or set spend its time, touch the ball, shoot and gain value?
    grain: player-game
    as_of: {view: as_of_event, pass: [anchored, pbp_only]}
    refresh: {class: post_game}
    min_width_px: 1280
    definitions:
      - 'subject and scope: one player, one lineup, one set or one team; one game or the season to date. Both are printed in the title of every map.'
      - 'cell: one cell of the fine grid, in the named-spots frame, both ends of the floor folded onto the attacked rim.'
      - 'scales: the sequential scale for seconds and counts; the diverging scale for value, with zero at the mid stop. A cell that was never observed takes the no-data style. No data is not zero.'
      - 'what is binned: only positions whose error is at most position_sigma_max_m of the display contract (R-CG-08). The legend prints the share of floor seconds binned.'
      - 'court partition: the legend names it (fine grid, court region or named spot).'
    params:
      cell_m: {value: 0.25, unit: m, why: 'side of one heat-map cell', evidence: 'requirement: live requirements, court geometry section, bins and grid (fine grid of 0.25 m cells, 115 x 61 over the full court, for heat maps and storage)'}
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'RECORDED, as of event, the pass, the state version, the subject and the scope.'
        inputs: {}
      - key: filter_bar
        kind: control
        component: filter_bar
        shows: 'Subject (player, lineup, set, team), scope, offense or defense, period, state. Each definition in use is named.'
        inputs: {}
        definitions: ['garbage time (K28)', 'transition class (the repo rule; other definitions are named when chosen)']
        requirements: [R-VZ-06e]
      - key: layer_picker
        kind: control
        component: layer_toggle
        shows: 'The maps that can be drawn for the subject: shot density, time on the floor, touches, value. A map that cannot be drawn for this game is greyed with the reason.'
        inputs: {}
        layers: [shot density, time on the floor, touches, value]
        requirements: [R-AS-12]
      - key: shot_density
        kind: court
        shows: 'Shot attempts of the subject on the half court as a density, from play-by-play coordinates. Makes and misses can be drawn as points with two shapes.'
        inputs:
          tables: [shots.release_x_m, shots.release_y_m, shots.made, shots.shooter_id, shots.team_id, shots.location_source, shots.value_attempted, shots.is_heave, shots.video_vs_espn_diff_m, games.shot_coords_available]
          metrics: [M-SQ-001, M-SHOOT-023, M-SQ-008]
          spots: ['layer:zone_scheme:court_region']
        requirements: [R-VZ-06b]
        identity_rule: locked_or_hold
        number_rule:
          - {class: official, source: 'shot rows of the final play-by-play; the location source of the shots is named in the legend', as_of: the anchored pass or pbp_only, link: frames}
          - {class: measurement, unit: metres, error: 'the location error of the source, printed in the legend (play-by-play coordinates against video where both exist)', link: frames}
        grade_rule:
          unknown: 'A shot with no location is in no cell. The legend counts such shots.'
      - key: occupancy
        kind: court
        phase: P1
        shows: 'Seconds on the floor per cell for the subject, offense and defense apart, on the sequential scale.'
        inputs:
          tables: [player_positions.x_m, player_positions.y_m, player_positions.observed, player_positions.on_main_camera, player_positions.player_id, player_positions.team_id, player_positions.sigma_m, player_positions.court_region, player_positions.named_spot]
          metrics: [M-SPACE-016, M-SPACE-014, M-PROF-027, M-PHYS-003]
          spots: ['layer:zone_scheme:court_region', 'layer:spot']
        requirements: [R-VZ-06b, R-CG-08, R-CG-05]
        identity_rule: locked_or_hold
        number_rule: {class: measurement, unit: seconds per cell, error: 'only positions within the error limit are binned; the share of floor seconds binned is printed in the legend', link: frames}
        grade_rule:
          inferred: Not binned.
          carried: Not binned.
          imputed: 'Never binned. Imputed seconds are counted in the legend as "not seen".'
          unknown: 'Not binned. A cell with no observed second takes the no-data style.'
      - key: touch_map
        kind: court
        phase: P3
        shows: 'Where the subject caught the ball and where his drives began and ended, as marks per cell.'
        inputs:
          tables: [touches.catch_x_m, touches.catch_y_m, touches.player_id, touches.touch_time_s, touches.end_how, drives.start_x_m, drives.start_y_m, drives.end_x_m, drives.end_y_m, drives.player_id]
          metrics: [M-PASS-053, M-PASS-058, M-PASS-059, M-PASS-060, M-PASS-068, M-PASS-050]
          spots: ['layer:spot', elbow, low_post, mid_post]
          events: ['ball_actions:touch', 'ball_actions:catch', 'ball_actions:drive', 'ball_actions:paint_touch']
        identity_rule: locked_or_hold
        number_rule:
          - {class: label, confidence: 'the confidence of the touch and drive rows, as a range in the legend', version: the grammar version in the legend, link: frames}
          - {class: descriptive, n: the touches and drives of the subject in the scope, descriptive_mark: 'the word "descriptive" in the legend', link: rows}
        grade_rule:
          imputed: 'A touch whose catch point is imputed is not drawn. It is counted in the legend.'
      - key: value_map
        kind: court
        phase: P5
        shows: 'Value gained per cell: the sum of the value changes of the actions the subject started in the cell, per 100 touches there, on the diverging scale round zero.'
        inputs:
          tables: [events.actor_x_m, events.actor_y_m, events.value_before, events.value_after, value_credits.player_id, value_credits.value_delta_xpts, possession_value.value_xpts, possession_value.model_version]
          metrics: [M-IMP-063, M-IMP-065, M-SPACE-038]
          spots: ['layer:zone_scheme:court_region']
        requirements: [R-AS-12, R-VL-02]
        identity_rule: locked_or_hold
        number_rule:
          - {class: model, band: 'a cell whose band crosses zero is drawn in the mid stop', model_version: in the legend, link: rows}
          - {class: estimate, n: touches in the cell, interval: printed in the cell read-out, level: 0.95, link: rows, min_n: default}
        grade_rule: contract
      - key: zone_table
        kind: table
        shows: 'The same numbers as text, by court region and by named spot: seconds, touches, attempts and makes, value, each with its count. So no number has to be read from a colour.'
        inputs:
          tables: [shots.release_spot, shots.release_ring_0p5m, shots.release_sector_15deg, shots.made, player_positions.court_region, player_positions.named_spot, touches.catch_spot]
          metrics: [M-SHOOT-027, M-SQ-004, M-SQ-005]
          spots: ['layer:zone_scheme:court_region', 'layer:spot']
        number_rule:
          - {class: official, source: made and attempted shots of the final play-by-play, as_of: the anchored pass or pbp_only, link: frames}
          - {class: estimate, n: attempts or touches in the zone, interval: printed after each rate, level: 0.8, link: rows, min_n: registry}
          - {class: measurement, unit: seconds, error: the share of floor seconds binned, link: frames}
        grade_rule: contract
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected cell or zone: its numbers, the rows behind them, source and as-of, version, lineage.'
        inputs: {}
    interactions:
      - {action: filter, at: filter_bar, target: 'chooses the subject and the scope; the count of seconds, touches and shots left is printed'}
      - {action: toggle_layer, at: layer_picker, target: each map on or off}
      - {action: lasso, at: shot_density, target: 'a court area; the selection is a query and the zone table counts only it'}
      - {action: select, at: view, target: 'a cell or a zone opens the inspector with its rows'}
      - {action: drill_down, at: zone_table, target: 'the shots, touches or seconds of the zone as a list with clip links', to: possession_explorer}
      - {action: inspect_query, at: zone_table, target: the rows and the query with metric ids}
      - {action: export, at: shot_density, target: 'the drawn map of the subject, with its legend', produces: top_down_render}
    degraded:
      D1_bug_away: 'No change to the maps: a position does not depend on the scorebug. A filter by game clock uses the clock of the pass named in the banner, and a stretch on an estimated clock prints its interval.'
      D2_off_main: 'Seconds off the main camera are not binned. The legend prints the share of floor seconds binned. The shot layer does not change: it reads play-by-play coordinates.'
      D3_replay: Replays never enter a map.
      D4_break: Breaks never enter a map.
      D5_no_video: 'Only the shot layer is drawn. The other maps are greyed in the layer list with "no video".'
      feed_stale: default
    empty_state: 'Nothing in the filter: the empty court with "nothing to draw for this subject and scope" and the filter in words. Game without shot coordinates: "this game has no shot locations".'
    requirements: [R-VZ-06b, R-VZ-02, R-VZ-03, R-VZ-06e, R-VZ-07, R-CG-05, R-CG-08, R-AS-12, R-VL-02, R-PR-19]
    decisions: [K12, K15, K28]
    depends_on:
      baselines: [named_spots, movement_grammar, identity_pack, metrics, live_state]
      tables: [shots, games, player_positions, touches, drives, events, value_credits, possession_value, run_records]
    phase: P0p
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-G2, ACC-VW-P1]
    wireframe: null
    notes: >-
      A family of maps on one court, not four views. Shot density at P0p from play-by-play coordinates; time on the
      floor at P1; touches at P3; value at P5. The court is never redrawn by hand: regions and spots come from
      config/named_spots.yaml.

  # -------------------------------------------------------------------------------------------------------------------
  passing_network:
    id: VW-REV-05
    name: Passing network
    surface: review
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: Who passes to whom on this team, how often, and how much value do those passes carry?
    grain: game
    as_of: {view: as_of_event, pass: [anchored, pbp_only]}
    refresh: {class: post_game}
    min_width_px: 1280
    definitions:
      - 'edge: an official assist (play-by-play layer) or a completed pass (tracking layer). The legend says which layer is drawn. The two are never added.'
      - 'drawing: a player is a node with his number as a direct label; edge width is the count; edge colour is value on the diverging scale. Team colour is not used inside one team.'
      - 'centrality numbers describe the graph of this scope. They carry the word "descriptive".'
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'RECORDED, as of event, the pass, the play-by-play version, the layer drawn and the share of live seconds seen.'
        inputs: {}
      - key: filter_bar
        kind: control
        component: filter_bar
        shows: 'Team, scope (game or season), lineup, period, state, set. Each definition in use is named.'
        inputs: {}
        definitions: ['garbage time (K28)', 'transition class (the repo rule)']
        requirements: [R-VZ-06e]
      - key: network
        kind: chart
        shows: 'The team as a graph: one node per player, one edge per passer and receiver pair. Layers: official assists; tracked passes; pass value.'
        inputs:
          tables: [shots.assister_official_id, shots.shooter_id, shots.made, shots.assisted_official, passes.passer_id, passes.receiver_id, passes.outcome, passes.pass_type, passes.value_delta, passes.is_official_assist]
          metrics: [M-PASS-073, M-PASS-074, M-PASS-077, M-PASS-078, M-PASS-083, M-PASS-023, M-PASS-075, M-PASS-076, M-PASS-080, M-PASS-039]
          events: ['ball_actions:pass', 'ball_actions:potential_assist', 'ball_actions:hockey_assist']
        layers: [official assists, tracked passes, pass value]
        requirements: [R-VZ-06c]
        identity_rule: locked_or_hold
        number_rule:
          - {class: official, source: official assists of the final play-by-play, as_of: the anchored pass or pbp_only, link: frames}
          - {class: label, confidence: 'the confidence of the pass rows, as a range in the legend', version: the grammar version in the legend, link: frames}
          - {class: model, band: 'in the pair table; an edge carries only the sign and size of the value', model_version: in the legend, link: rows}
          - {class: descriptive, n: the edges and passes of the scope, descriptive_mark: 'the word "descriptive" beside every centrality number', link: rows}
        grade_rule:
          imputed: 'A pass with either end off the main camera is not an edge of the tracking layer.'
        notes: 'The official-assist layer is drawn from P0p. The tracked-pass layer needs P3 and the value layer P5.'
      - key: pair_table
        kind: table
        shows: 'One row per passer and receiver pair: passes, completed, led to a shot, official assists, potential assists, the gap between video and official assists, and value added per pass with its band. Below the minimum n a rate shows "too few" and n.'
        inputs:
          tables: [passes.passer_id, passes.receiver_id, passes.outcome, passes.value_delta, passes.is_official_assist, passes.receiver_first_action, shots.assister_official_id, shots.assister_video_id]
          metrics: [M-PASS-023, M-PASS-024, M-PASS-025, M-PASS-026, M-PASS-040, M-PASS-052, M-PASS-039, M-PASS-073]
        requirements: [R-VL-02, R-VL-03]
        identity_rule: locked_or_hold
        number_rule:
          - {class: official, source: official assists of the final play-by-play, as_of: the anchored pass or pbp_only, link: frames}
          - {class: estimate, n: passes of the pair, interval: printed after each rate, level: 0.95, link: rows, min_n: default}
          - {class: model, band: printed beside the value per pass, model_version: in the table foot, link: frames}
        grade_rule: contract
      - key: player_table
        kind: table
        shows: 'One row per player: assists and assist percentage, passes made and received, potential and secondary assists, touches, turnovers, and his centrality in the graph.'
        inputs:
          tables: [player_box.player_id, player_box.ast, player_box.tov, player_box.minutes, touches.player_id, touches.touch_id]
          metrics: [M-PASS-001, M-PASS-002, M-PASS-021, M-PASS-022, M-PASS-025, M-PASS-027, M-PASS-053, M-PASS-075, M-PASS-077, M-TOV-009]
        identity_rule: locked_or_hold
        number_rule:
          - {class: official, source: the official box of the game, as_of: the pull time of the box, link: rows}
          - {class: estimate, n: 'possessions on the floor, or passes', interval: printed after each rate, level: 0.95, link: rows, min_n: default}
          - {class: descriptive, n: the passes of the scope, descriptive_mark: 'the word "descriptive" in the head of the centrality columns', link: rows}
        grade_rule: contract
      - key: court_arrows
        kind: court
        phase: P3
        shows: 'The passes of the selected pair or player on the half court, each an arrow from release point to catch point, coloured by value change.'
        inputs:
          tables: [passes.start_x_m, passes.start_y_m, passes.end_x_m, passes.end_y_m, passes.value_delta, passes.pass_type, passes.passer_id, passes.receiver_id]
          spots: ['layer:zone_scheme:court_region', 'layer:spot']
          events: ['ball_actions:pass', 'ball_actions:skip_pass', 'ball_actions:kick_out', 'ball_actions:entry_pass']
        identity_rule: locked_or_hold
        grade_rule:
          imputed: No arrow starts or ends at an imputed point.
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected player, edge or number: value, n and interval or band, source and as-of, version, lineage.'
        inputs: {}
    interactions:
      - {action: filter, at: filter_bar, target: 'narrows the passes counted; the count left is printed'}
      - {action: toggle_layer, at: network, target: 'official assists, tracked passes or pass value'}
      - {action: select, at: network, target: 'a player or an edge; both tables and the court arrows narrow to it'}
      - {action: drill_down, at: pair_table, target: the passes of the pair as a list with clip links, to: possession_explorer}
      - {action: inspect_query, at: pair_table, target: the rows and the query with metric ids}
      - {action: export, at: network, target: the page of the network with its tables, produces: page}
    degraded:
      D1_bug_away: 'No change to the counts: a pass does not depend on the scorebug. A filter by game clock uses the clock of the pass named in the banner.'
      D2_off_main: 'A pass with either end off the main camera is not in the tracking layer. The banner prints the share of live seconds seen. The assist layer does not change.'
      D3_replay: Replays enter no count.
      D4_break: Breaks enter no count.
      D5_no_video: 'Only the official-assist layer is drawn, and the banner says "play-by-play only".'
      feed_stale: default
    empty_state: 'No assisted make and no tracked pass in the filter: the nodes of the players who were on the floor, no edge, and "no pass matches" with the filter in words.'
    requirements: [R-VZ-06c, R-VZ-02, R-VZ-03, R-VZ-06e, R-VL-02, R-VL-03, R-PR-19]
    decisions: [K12, K15, K28]
    depends_on:
      baselines: [named_spots, movement_grammar, identity_pack, metrics, live_state]
      tables: [shots, passes, player_box, touches, run_records]
    phase: P0p
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-G2, ACC-VW-P1]
    wireframe: null

  # -------------------------------------------------------------------------------------------------------------------
  win_probability_chart:
    id: VW-REV-06
    name: Layered win-probability chart
    surface: review
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: How did the chance to win move through this game, at the level of the game, the half and the five-minute window, and which plays moved it most?
    grain: game
    as_of: {view: mixed, pass: [anchored, pbp_only]}
    refresh: {class: post_game}
    min_width_px: 1280
    definitions:
      - 'layers: game, half and five-minute window, all from one simulation, so the windows add up to the halves and the halves to the game (R-PR-01).'
      - 'two as-of rules on one view: the curve is the offline model on the recorded game (as of event). The forecast of a half or a window is the one frozen before that span began (as known). Each element says which.'
      - 'run shading: the register rule M-SIT-025 is the shade; the broadcast a-b form M-SIT-024 is the label on it; the legend names both (K05).'
      - 'garbage time: the three flags of K28 can each be drawn as a shade, each named. None is on by default.'
      - 'no market price is on this view. Market comparisons are on the edge report, which only the owner sees (R-MK-24).'
    params:
      swing_plays_n: {value: 5, unit: count, why: 'plays listed by realised change in win probability', evidence: 'requirement: R-PR-12 (the 5 largest swing plays)'}
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'RECORDED, the pass, the play-by-play version, the model version of the curve, and the line "curve: as of event; forecasts: as known before each span".'
        inputs: {}
      - key: tree
        kind: control
        component: tree_navigator
        shows: 'The walk down: game, half, five-minute window, possession, player. Each level prints its count of possessions.'
        inputs: {}
        requirements: [R-AS-07]
      - key: wp_curve
        kind: chart
        as_of: as_of_event
        shows: 'Home win probability across game time with its band, for one named model version. Runs are shaded, timeouts, lead changes and period ends are marked, and the pre-game probability is the first point.'
        inputs:
          tables: [predictions.wp_home_live, predictions.wp_band_lo, predictions.wp_band_hi, predictions.model_family, predictions.level, possessions.pre_win_prob, score_events.game_clock_s, score_events.period, score_events.delta_points, score_events.team, runs.definition_code, runs.start_game_clock_s, runs.end_game_clock_s, runs.pts_for, runs.pts_against, runs.team_id, timeouts.game_clock_s, timeouts.team, state_second.margin, state_second.lead_changes]
          metrics: [M-SIT-055, M-SIT-023, M-SIT-024, M-SIT-025, M-SIT-017, M-SIT-052, M-SIT-072, M-SIT-073, M-TRAT-059]
          events: [T05, T12, T16, T20, T24]
        layers: [curve, band, run shading, timeouts, garbage-time shading]
        requirements: [R-VZ-06d, R-PR-02, R-PR-11, R-MD-17]
        number_rule:
          - {class: model, band: 'a fading band round the line; never bare bar ends', model_version: printed in the chart corner, link: frames}
          - {class: official, source: score events of the final play-by-play, as_of: the anchored pass or pbp_only, link: frames}
        grade_rule:
          carried: 'Through a replay, a review or a break the line holds its value and is marked "held".'
          unknown: 'A gap with the reason where the model had no input. The line is not joined across it.'
      - key: half_and_windows
        kind: chart
        as_of: as_of_known
        shows: 'Under the curve, one bar per half and per five-minute window: the probability that the home team wins that span as forecast before it began, its band, the realised margin of the span, and the random-walk baseline of the window.'
        inputs:
          live_state: [five_min_window]
          tables: [predictions.window_id, predictions.target, predictions.horizon, predictions.point_value, predictions.interval95, predictions.quantiles, predictions.outcome_value, predictions.made_at_utc, predictions.frozen_sha256, state_second.five_min_window_id]
          metrics: [M-SIT-004, M-SIT-005]
        requirements: [R-PR-01, R-PR-02, R-PR-06]
        number_rule:
          - {class: model, band: the interval of the forecast drawn as a fading band on the bar, model_version: 'model family, level and simulation id under the bars', link: rows}
          - {class: official, source: the realised margin from the final play-by-play, as_of: the anchored pass or pbp_only, link: rows}
        grade_rule:
          unknown: 'A span with no forecast frozen before it began shows a dash and "no forecast before this span". A forecast made later is never drawn in its place.'
      - key: leverage_strip
        kind: chart
        as_of: as_of_event
        shows: 'The leverage of each possession as a strip under the curve: how far apart a score and a stop would put the win probability.'
        inputs:
          tables: [possessions.leverage, possessions.leverage_expected, possessions.pre_win_prob, state_second.leverage]
          metrics: [M-SIT-060, M-SIT-063]
        requirements: [R-PR-12]
        number_rule: {class: model, band: printed in the inspector for the selected possession, model_version: in the chart corner, link: frames}
        grade_rule: contract
      - key: swing_plays
        kind: table
        as_of: as_of_event
        shows: 'The five plays with the largest realised change in win probability: clock, score, who, what, the change with its band, and the clip reference.'
        inputs:
          tables: [events.event_id, events.event_type_code, events.period, events.game_clock_s, events.player_id_1, events.home_score_after, events.away_score_after, events.surprise_nats, clip_index.in_s, clip_index.out_s, clip_index.key_frame]
          metrics: [M-SIT-058, M-SIT-059, M-IMP-062, M-SIT-076]
        requirements: [R-PR-12]
        identity_rule: locked_or_hold
        number_rule:
          - {class: model, band: printed beside each change, model_version: in the table foot, link: frames}
          - {class: official, source: clock and score of the final play-by-play, as_of: the anchored pass or pbp_only, link: frames}
        grade_rule: contract
      - key: game_flow
        kind: tile
        as_of: as_of_event
        shows: 'Lead changes, ties, the largest lead of each team, the share of the game each team led, and the time-weighted mean win probability.'
        inputs:
          tables: [state_second.lead_changes, state_second.times_tied, state_second.largest_lead_home, state_second.largest_lead_away]
          metrics: [M-SIT-015, M-SIT-017, M-SIT-018, M-SIT-019, M-SIT-072]
        number_rule:
          - {class: official, source: the score sequence of the final play-by-play, as_of: the anchored pass or pbp_only, link: rows}
          - {class: model, band: printed beside the mean win probability, model_version: under the tile, link: rows}
        grade_rule: contract
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected point, bar or play: value, band, model version, the inputs of the model at that instant, source and as-of, lineage.'
        inputs: {}
    interactions:
      - {action: filter, at: tree, target: 'a half, a window or a possession; the curve zooms to it and the swing plays and tiles count only it'}
      - {action: select, at: wp_curve, target: 'a point; the inspector shows value, band, model version and the play under it'}
      - {action: brush, at: wp_curve, target: 'a stretch of the game; the selection is a query'}
      - {action: toggle_layer, at: wp_curve, target: 'band, run shading, timeouts and each garbage-time flag'}
      - {action: drill_down, at: half_and_windows, target: the possessions of the half or window, to: possession_explorer}
      - {action: drill_down, at: swing_plays, target: the play in its possession with video, to: possession_explorer}
      - {action: inspect_query, at: wp_curve, target: the rows and the query with metric ids}
      - {action: export, at: wp_curve, target: the page of the chart with its swing plays, produces: page}
    degraded:
      D1_bug_away: default
      D2_off_main: 'The curve keeps its play-by-play inputs. Where the model version reads tracking, the stretch is marked "tracking off" on the curve.'
      D3_replay: 'The line holds its last value through the replay, marked "held". Nothing ticks.'
      D4_break: 'The line holds through the break, marked "held". The axis is game time, so a break is a mark, not a width.'
      D5_no_video: 'The play-by-play model version is drawn and named. Swing plays keep their rows and have no clip.'
      feed_stale: default
    empty_state: 'No model for this game (before P6, or the game is not scored yet): "no win-probability model for this game yet". The margin line with runs, timeouts and the game-flow tile is still drawn; it needs no model.'
    requirements: [R-VZ-06d, R-VZ-02, R-VZ-03, R-PR-01, R-PR-02, R-PR-06, R-PR-09, R-PR-11, R-PR-12, R-MD-17, R-MK-24, R-AS-07, R-PR-19]
    decisions: [K05, K06, K12, K28]
    depends_on:
      baselines: [state_machine, identity_pack, metrics, live_state]
      tables: [predictions, possessions, chances, events, score_events, runs, timeouts, state_second, clip_index, run_records]
    phase: P6
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-G2, ACC-VW-P1]
    wireframe: docs/data/views/layered_tree.svg
    notes: >-
      The R-VZ-06d render test uses the offline model on a recorded pilot game (R-PR-09 allows no live model before
      P6). The live strip is a tile of the live panel, not this view. A stored live curve (as known) is not drawn
      here; comparing it with this curve is a Studio task.

  # -------------------------------------------------------------------------------------------------------------------
  shot_chart:
    id: VW-REV-07
    name: Shot chart by sector and ring
    surface: review
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: From which sectors and rings does this player or team shoot, how well, and what were those shots worth?
    grain: player-game
    as_of: {view: as_of_event, pass: [anchored, pbp_only]}
    refresh: {class: post_game}
    min_width_px: 1280
    definitions:
      - 'partition: 15-degree sectors by 0.5 m rings from the attacked rim (R-CG-05). It is named in the legend. The court-region partition and the provider crosswalk labels can be chosen instead and are then named (R-CG-17).'
      - 'a cell: attempts as the size of the mark; shrunk make rate as colour on the diverging scale round the D-I rate of that cell; makes and attempts as text.'
      - 'interval: 80 % on a shrunk make rate (R-PC-23). The level is printed.'
      - 'heaves are left out by default (M-SQ-007) and counted in a line under the chart.'
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'RECORDED, as of event, the pass, the play-by-play version, the location source of the shots, the subject and the scope.'
        inputs: {}
      - key: filter_bar
        kind: control
        component: filter_bar
        shows: 'Player or team, offense or defense, scope, shot context (transition, putback, after a timeout, half court), period, state.'
        inputs: {}
        definitions: ['transition class (the repo rule; other definitions are named when chosen)', 'clutch (K06)', 'garbage time (K28)']
        requirements: [R-VZ-06e]
      - key: chart
        kind: court
        shows: 'The half court cut into sectors and rings, one mark per cell. A cell below its minimum n is hatched and prints "too few" and n.'
        inputs:
          tables: [shots.release_sector_15deg, shots.release_ring_0p5m, shots.release_x_m, shots.release_y_m, shots.made, shots.value_attempted, shots.shooter_id, shots.team_id, shots.location_source, shots.is_heave, shots.shot_type_code, player_shooting_sector_ring.player_id, player_shooting_sector_ring.sector_15deg, player_shooting_sector_ring.ring_0p5m, player_shooting_sector_ring.fga, player_shooting_sector_ring.fgm, player_shooting_sector_ring.rate_shrunk, player_shooting_sector_ring.prior_code, player_shooting_sector_ring.shot_context, player_shooting_sector_ring.as_of_date, games.shot_coords_available]
          metrics: [M-SHOOT-022, M-SHOOT-021, M-SQ-005, M-SQ-046, M-SQ-001, M-SQ-007]
          spots: ['layer:zone_scheme:court_region', 'layer:landmark']
        requirements: [R-VZ-06i, R-CG-05, R-PC-23]
        identity_rule: locked_or_hold
        number_rule:
          - {class: official, source: 'made and attempted shots of the final play-by-play, with the location source', as_of: the anchored pass or pbp_only, link: frames}
          - {class: estimate, n: attempts in the cell, interval: printed in the cell read-out with its level, level: 0.8, link: rows, min_n: registry}
        grade_rule:
          unknown: 'A shot with no location is in no cell. It is counted in the line "location unknown" under the chart.'
      - key: quality_layer
        kind: court
        shows: 'A second colouring of the same cells: expected points per shot for an average D-I shooter, and the shot-making residual (points minus expected points).'
        inputs:
          tables: [shots.shot_quality_xpts, shots.shot_making_residual, shots.contest_distance_m, shots.contest_class]
          metrics: [M-SQ-060, M-SQ-061, M-SQ-063, M-SQ-066, M-SHOOT-040, M-SQ-052]
          spots: ['layer:zone_scheme:court_region', 'layer:landmark']
        requirements: [R-VL-04, R-VL-14]
        number_rule:
          - {class: model, band: printed in the cell read-out, model_version: 'in the legend, with the layer it used (location only, or contest-aware)', link: rows}
          - {class: estimate, n: attempts in the cell, interval: printed in the cell read-out, level: 0.95, link: rows, min_n: default}
        grade_rule: contract
        notes: 'The location-only layer is drawn from P0p. The contest-aware layer needs P5 and is greyed until then.'
      - key: zone_table
        kind: table
        shows: 'The same shots by court region and by distance band: attempts, share of attempts, makes, field-goal and effective field-goal percentage, points per shot, expected points, and the label other providers give the region.'
        inputs:
          tables: [shots.release_spot, shots.ncaa_shot_zone, shots.cbbd_range, shots.made, shots.value_attempted, shots.assisted_official]
          metrics: [M-SHOOT-027, M-SHOOT-024, M-SHOOT-025, M-SHOOT-026, M-SHOOT-011, M-SQ-004, M-SQ-006, M-SQ-010, M-SQ-011, M-SQ-012, M-SQ-014, M-SQ-023]
          spots: [restricted_area, paint_non_ra, short_mid, long_mid_baseline, long_mid_wing, long_mid_top, corner_three, wing_three, slot_three, top_three, 'layer:zone_scheme:ctg', 'layer:zone_scheme:nba_basic', 'layer:zone_scheme:pbpstats']
        requirements: [R-CG-17]
        number_rule:
          - {class: official, source: made and attempted shots of the final play-by-play, as_of: the anchored pass or pbp_only, link: frames}
          - {class: estimate, n: attempts in the region, interval: printed after each rate with its level, level: 0.8, link: rows, min_n: registry}
        grade_rule: contract
      - key: shot_list
        kind: table
        shows: 'The shots of the selection in order: period and clock, shooter, shot type, distance in metres, made or missed, expected points, and the clip reference.'
        inputs:
          tables: [shots.shot_id, shots.period, shots.game_clock_s, shots.shooter_id, shots.shot_type_code, shots.made, shots.value_attempted, shots.shot_quality_xpts, shots.assisted_official, clip_index.in_s, clip_index.out_s]
          metrics: [M-SQ-002, M-SQ-061]
        identity_rule: locked_or_hold
        number_rule:
          - {class: official, source: the shot rows of the final play-by-play, as_of: the anchored pass or pbp_only, link: frames}
          - {class: measurement, unit: metres, error: the location error of the source of the shot, link: frames}
          - {class: model, band: printed beside the expected points, model_version: in the table foot, link: frames}
        grade_rule: contract
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected cell, region or shot: counts, rate with prior and shrinkage, expected points, source and as-of, version, lineage.'
        inputs: {}
    interactions:
      - {action: filter, at: filter_bar, target: 'chooses the subject and narrows the shots; the count left is printed'}
      - {action: select, at: chart, target: 'a cell; the shot list narrows to it and the inspector opens'}
      - {action: lasso, at: chart, target: 'a court area; the selection is a query'}
      - {action: toggle_layer, at: quality_layer, target: 'make rate, expected points or shot-making residual as the colour'}
      - {action: drill_down, at: shot_list, target: the shot in its possession with video, to: possession_explorer}
      - {action: inspect_query, at: zone_table, target: the rows and the query with metric ids}
      - {action: export, at: chart, target: 'the drawn chart with its legend', produces: top_down_render}
    degraded:
      D1_bug_away: 'No change. A shot location does not depend on the scorebug.'
      D2_off_main: 'A shot released off the main camera keeps its play-by-play location and says so. The contest-aware layer has no value for it.'
      D3_replay: 'No change. A shot seen only in a replay keeps its play-by-play location; the replay is linked as evidence.'
      D4_break: No change.
      D5_no_video: 'The chart is drawn from play-by-play coordinates alone and says so. The contest-aware layer is greyed with "no video".'
      feed_stale: default
    empty_state: 'No shot in the filter: the empty court with "no shot matches" and the filter in words. Game without shot coordinates: "this game has no shot locations", and the zone table from play-by-play shot types only.'
    requirements: [R-VZ-06i, R-VZ-02, R-VZ-03, R-VZ-06e, R-CG-05, R-CG-17, R-PC-23, R-VL-04, R-VL-14, R-DQ-15, R-PR-19]
    decisions: [K06, K12, K28]
    depends_on:
      baselines: [named_spots, identity_pack, metrics, live_state]
      tables: [shots, player_shooting_sector_ring, games, clip_index, run_records]
    phase: P0p
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-G2, ACC-VW-P1]
    wireframe: null
    notes: >-
      Three court partitions exist for shots: sector and ring (this chart), named spots (the spot shooting map of the
      player card) and provider crosswalk labels (the zone table). Each is named where it is used. A team aggregate
      built from play-by-play alone may be published only through the published-number gate (R-DQ-15).

  # -------------------------------------------------------------------------------------------------------------------
  physical_load:
    id: VW-REV-08
    name: Physical load
    surface: review
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: How far and how fast did each player move in this game, and how much of his floor time did we actually see?
    grain: player-game
    as_of: {view: as_of_event, pass: [anchored, blind]}
    refresh: {class: post_game}
    min_width_px: 1280
    definitions:
      - 'movement only: the footer of the view says "movement only: no health or injury inference". No number here is a statement about fitness, fatigue as a medical state, or injury (R-PC-15, display contract rule 7).'
      - 'bands: the primary speed bands of R-PL-11 are a view on the stored 0.1 m/s bins of R-PL-09. Another band scheme can be chosen and is then named.'
      - 'coverage first: every number prints the share of the floor time of the player that was observed. A stint under the coverage key of R-PL-05 is left out of every sum and listed (R-PL-14).'
      - 'acceleration: counts by band are shown only where the K03 gate passes. Elsewhere the cell says "unresolved" and counts the efforts left out (R-PL-18).'
      - 'one game: a change of high-speed running below the limit of R-PL-17 between two games is not coloured and not called a change.'
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'RECORDED, as of event, the pass, the state version, and the share of player floor seconds observed in this game.'
        inputs: {}
      - key: filter_bar
        kind: control
        component: filter_bar
        shows: 'Team, player, period, stint, offense or defense, band scheme, and the denominator (minutes played, live time, total time on the floor).'
        inputs: {}
        definitions: ['denominator: minutes played is the headline; the other two are named when chosen (R-PL-15)']
        requirements: [R-VZ-06e]
      - key: coverage_table
        kind: table
        shows: 'One row per player: official minutes, seconds on the floor, seconds observed and the observed share, the stints left out for low coverage, the tracked point and the filter used.'
        inputs:
          tables: [load_stint_bins.player_id, load_stint_bins.stint_num, load_stint_bins.observed_frac, load_stint_bins.excluded_low_coverage, load_stint_bins.stint_minutes_played, load_stint_bins.stint_on_court_time_s, load_stint_bins.stint_live_time_s, load_stint_bins.tracked_point, load_stint_bins.filter_name, player_box.minutes]
          metrics: [M-PHYS-003, M-PHYS-006]
        requirements: [R-PL-05, R-PL-10, R-PL-14]
        identity_rule: locked_or_hold
        number_rule:
          - {class: official, source: minutes of the official box, as_of: the pull time of the box, link: rows}
          - {class: measurement, unit: seconds and percent of floor time, error: 'one second per stint edge; the stints left out are listed with their observed share', link: frames}
        grade_rule: contract
      - key: distance_bands
        kind: chart
        shows: 'Per player, stacked bars of distance and of time in each speed band, per minute played, with the observed share printed beside each bar. Seconds not seen are a hatched segment and enter no total.'
        inputs:
          tables: [load_stint_bins.player_id, load_stint_bins.team_id, load_stint_bins.period, load_stint_bins.speed_bin_lo_mps, load_stint_bins.distance_m, load_stint_bins.time_s, load_stint_bins.observed_frac, load_stint_bins.fps]
          metrics: [M-PHYS-018, M-PHYS-020, M-PHYS-021, M-PHYS-022, M-PHYS-023, M-PHYS-025, M-PHYS-026, M-PHYS-028]
          events: ['kinematics:kin_speed_bands', 'kinematics:high_speed', 'kinematics:sprint']
        requirements: [R-PL-01, R-PL-09, R-PL-11, R-PL-15, R-PL-18]
        identity_rule: locked_or_hold
        number_rule: {class: measurement, unit: 'metres, seconds, and metres per minute played', error: 'the propagated error of each band; a band whose error is more than half its width shows "unresolved"', link: frames}
        grade_rule:
          inferred: Not summed.
          carried: Not summed.
          imputed: 'Never summed. Imputed seconds are the hatched segment "not seen".'
          unknown: 'Not summed. A player with no observed second shows a dash and "not seen", never 0 m.'
      - key: efforts
        kind: table
        shows: 'Per player: high-speed and sprint efforts, the robust top speed, speed relative to his own reference speed, and acceleration and deceleration efforts by band where they can be resolved.'
        inputs:
          tables: [accel_efforts.player_id, accel_efforts.band, accel_efforts.sign, accel_efforts.peak_mps2, accel_efforts.duration_s, accel_efforts.start_speed_mps, accel_efforts.start_ts_ms, accel_efforts.continuous_minutes_at_start, player_positions.speed_mps]
          metrics: [M-PHYS-029, M-PHYS-031, M-PHYS-027, M-PHYS-033, M-PHYS-034, M-PHYS-042, M-PHYS-043]
          events: ['kinematics:hsr_effort', 'kinematics:sprint_effort', 'kinematics:accel_effort', 'kinematics:decel_effort', 'kinematics:kin_vref', 'kinematics:kin_validity']
        requirements: [R-PL-12, R-PL-16, R-PL-18]
        identity_rule: locked_or_hold
        number_rule: {class: measurement, unit: 'metres per second, metres per second squared, seconds, counts per minute played', error: 'printed beside each speed; a count prints how many efforts were left out as unresolved', link: frames}
        grade_rule: contract
        notes: 'The relative-speed column is provisional until the player has the games R-PL-16 asks for; until then it carries "prov" and the count of games used.'
      - key: decline
        kind: chart
        shows: 'Top speed and five-second distance of the chosen player by period and by continuous minutes on the floor.'
        inputs:
          tables: [accel_efforts.continuous_minutes_at_start, load_stint_bins.period, load_stint_bins.stint_num, load_stint_bins.distance_m, load_stint_bins.time_s]
          metrics: [M-PHYS-084, M-PHYS-009, M-PHYS-037]
        requirements: [R-PL-03, R-PL-17, R-PL-23]
        number_rule:
          - {class: descriptive, n: the stints and minutes of this game, descriptive_mark: 'the word "descriptive" in the chart title in the game scope', link: rows}
          - {class: estimate, n: games and stints in the season scope, interval: a fading band round the line, level: 0.95, link: rows, min_n: default}
        grade_rule: contract
      - key: footer
        kind: tile
        numbers: none
        shows: 'The line "movement only: no health or injury inference", and the frame rate, tracked point and filter the numbers were made with.'
        inputs:
          tables: [load_stint_bins.fps, load_stint_bins.tracked_point, load_stint_bins.filter_name]
        requirements: [R-PL-10]
        grade_rule: contract
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected bar, effort or number: value with error, observed share, the band scheme and its version, source and as-of, lineage.'
        inputs: {}
    interactions:
      - {action: filter, at: filter_bar, target: 'team, player, period, band scheme and denominator; the observed share of the selection is printed'}
      - {action: select, at: distance_bands, target: 'a player; the effort table and the decline chart narrow to him'}
      - {action: drill_down, at: efforts, target: 'the effort at its start frame, with video and court', to: studio_game_canvas}
      - {action: select, at: view, target: any number opens the inspector}
      - {action: inspect_query, at: distance_bands, target: the bins and the query with metric ids}
    degraded:
      D1_bug_away: 'No change to distance and speed: they do not depend on the scorebug. Live time, the denominator of one rate, rests on an estimated clock in the stretch and prints its interval.'
      D2_off_main: 'Seconds off the main camera count as not observed. They lower the observed share and add no distance. A stint under the coverage key is left out and listed.'
      D3_replay: Replays never enter a number.
      D4_break: Breaks never enter a number. Time on the bench is not load.
      D5_no_video: 'A card "no video: no load numbers for this game". The coverage table keeps the official minutes.'
      feed_stale: default
    empty_state: 'Game without tracking: "no load numbers before tracking (P1)". Every stint of a player under the coverage key: his row shows a dash and "seen too little", with the observed share.'
    requirements: [R-PL-01, R-PL-03, R-PL-05, R-PL-09, R-PL-10, R-PL-11, R-PL-12, R-PL-14, R-PL-15, R-PL-16, R-PL-17, R-PL-18, R-PL-23, R-VZ-02, R-VZ-03, R-VZ-06e, R-PC-15, R-PR-19]
    decisions: [K03, K12, K15]
    depends_on:
      baselines: [movement_grammar, identity_pack, metrics, live_state]
      tables: [load_stint_bins, accel_efforts, player_box, player_positions, run_records]
    phase: P1
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-G2, ACC-VW-P1]
    wireframe: null
    notes: >-
      An individual player output: private to MSU staff and the owner, no export. The view has no video of its own; a
      number links to its frames through the Studio canvas.

  # -------------------------------------------------------------------------------------------------------------------
  telestrator_freeze_frame:
    id: VW-REV-09
    name: Telestrator freeze-frame
    surface: review
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: What did the floor look like at this one moment, and where was everyone about to go?
    grain: frame
    as_of: {view: as_of_event, pass: [anchored, blind]}
    refresh: {class: post_game, budget_s: 2.0, evidence: 'assumed: a still drawn on request should appear as fast as an edit of possession scope (on_edit budget, R-AS-04 proposal); replaced by the render time measured on the pilot games. Reported, not a gate (decision K23)'}
    min_width_px: 375
    definitions:
      - 'a drawing, never a frame: the output is a top-down diagram on our own court. It holds no broadcast pixel, so it may pass the rights gate (R-RG-02).'
      - 'arrows show what happened next, not a forecast: the movement of each player and of the ball over the next arrow_horizon_s, read from the stored tracks.'
      - 'labels come from the broadcast vocabulary layer only (R-MD-31). A label below its confidence gate is not drawn.'
      - 'export: locked identities only. A player on HOLD, or with only a probable label, is drawn as "?" with his team mark.'
    params:
      arrow_horizon_s: {value: 2.0, unit: s, why: 'length of the movement each arrow shows', evidence: 'requirement: R-VZ-11 (arrows of the next 2 s of movement)'}
      position_match_max_m: {value: 0.1, unit: m, why: 'a drawn marker sits within this distance of the stored position', evidence: 'requirement: R-VZ-11 (positions match the state within 0.1 m)'}
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'RECORDED, as of event, the pass, the state version, the period and game clock of the frame, and how many of ten players are shown.'
        inputs: {}
      - key: moment_picker
        kind: control
        shows: 'The possession and the moment: chosen by game clock, by stepping frames, or by the key frame of an event (screen moment, help moment, release).'
        inputs:
          tables: [possessions.possession_id, events.event_id, events.frame_index, clip_index.row_ref, clip_index.key_frame]
      - key: diagram
        kind: court
        component: top_down_court
        shows: 'All ten players and the ball at the chosen frame, the attacked rim at the origin, with one arrow per player and one for the ball showing the movement of the next 2 s.'
        inputs:
          tables: [player_positions.player_id, player_positions.team_id, player_positions.vx_mps, player_positions.vy_mps, player_positions.heading_deg, player_positions.spot, movement_primitives.player_id, movement_primitives.primitive_type, movement_primitives.start_x_m, movement_primitives.start_y_m, movement_primitives.end_x_m, movement_primitives.end_y_m, movement_primitives.path_shape, passes.start_x_m, passes.start_y_m, passes.end_x_m, passes.end_y_m, passes.pass_type]
          spots: ['layer:zone_scheme:court_region', 'layer:spot', 'layer:landmark']
          events: ['cuts:cut', 'ball_actions:pass', 'ball_actions:drive', 'screens:screen']
        requirements: [R-VZ-11, R-CG-02]
        identity_rule: locked_or_hold
        grade_rule:
          imputed: 'Hollow marker with its 95 % region. No arrow starts or ends at an imputed point.'
          unknown: 'No marker. The drawing prints "9 of 10 shown", and keeps that line when exported.'
      - key: labels
        kind: overlay
        phase: P3
        shows: 'Labels in broadcast words: the set or action, the ball-screen coverage, and the named spot of each player involved.'
        inputs:
          tables: [set_instances.set_code, set_instances.compositional_name, set_instances.match_confidence, screens.screen_kind, screens.coverage_coarse, screens.coverage_fine_code, scheme_states.l1_base_scheme_code, scheme_states.l1_conf, player_positions.named_spot]
          spots: ['layer:spot']
          events: ['composition:set_match', 'composition:compositional_name', 'screens:ball_screen', 'defense:ball_screen_coverage_rule', 'defense:scheme_fingerprint']
        layers: [set name, coverage, spot names]
        definitions: ['coverage: the coarse class always; the fine class only at confidence 0.8 or more (K04)']
        requirements: [R-MD-31, R-DF-16, R-GU-04]
        grade_rule:
          inferred: 'Drawn with "prov".'
          unknown: 'Not drawn. No label is guessed.'
      - key: export_drawing
        kind: control
        component: clip_export
        shows: 'Export of the drawing as a top-down render with its caption (game, period, clock, how many of ten shown), or of the moment as a clip reference.'
        inputs: {}
        requirements: [R-VZ-06f, R-RG-02]
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected player, arrow or label: position with its error, grade and confidence, identity state, version, lineage.'
        inputs: {}
    interactions:
      - {action: select, at: moment_picker, target: a possession and a frame}
      - {action: step, at: view, target: 'one frame or one second forward or back; the drawing is redrawn'}
      - {action: select, at: diagram, target: 'a player, an arrow or the ball opens the inspector'}
      - {action: toggle_layer, at: labels, target: 'set name, coverage and spot names, each on or off'}
      - {action: drill_down, at: diagram, target: the same frame with video beside it, to: possession_explorer}
      - {action: export, at: export_drawing, target: the drawing of the moment, produces: top_down_render}
      - {action: export, at: export_drawing, target: the moment as a clip reference, produces: clip_reference}
    degraded:
      D1_bug_away: 'The drawing does not change. The clock in the caption carries its grade: provisional, or greyed with its interval.'
      D2_off_main: 'Players off the main camera are hollow with their region up to the limit, then left out. The drawing prints how many of ten are shown and keeps that line when exported.'
      D3_replay: 'No drawing from a replay frame. The picker moves to the last live frame before the replay and says so.'
      D4_break: 'No drawing inside a break. The picker offers the last live frame before it and the first after it.'
      D5_no_video: 'A card "no video at this moment: no positions to draw".'
      feed_stale: default
    empty_state: 'No tracked game: "no tracked game yet". A frame where the court is not mapped: "court not mapped in this frame", and the nearest mapped frame is offered.'
    requirements: [R-VZ-11, R-VZ-06f, R-VZ-07, R-MD-31, R-RG-02, R-CG-02, R-DF-16, R-GU-04, R-PR-19]
    decisions: [K04, K15, K23, OD-8]
    depends_on:
      baselines: [named_spots, movement_grammar, identity_pack, live_state]
      tables: [possessions, events, clip_index, video_files, player_positions, ball_states, frames, movement_primitives, passes, set_instances, screens, scheme_states, run_records]
    phase: P1
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-R4, ACC-VW-S1, ACC-VW-S2, ACC-VW-G1, ACC-VW-G2, ACC-VW-P1, ACC-VW-P2, ACC-VW-L1]
    wireframe: null
    notes: >-
      Decided here: the view is listed for MSU staff and the owner, because it shows real positions and identities.
      A drawing leaves the private store only as an export through the rights gate. Positions and arrows at P1; set
      and coverage labels at P3 and P4. The drawing shows no number, so it has no number rule. It is one drawing,
      so it is specified to work at reading width although it sits on the review surface.

  # -------------------------------------------------------------------------------------------------------------------
  season_simulation:
    id: VW-RPT-16
    name: Rest-of-season simulation
    surface: report
    audience: [owner, analyst]
    privacy: owner_only
    question: Against which of the remaining opponents is Michigan State favoured, and how sure is that?
    grain: season
    as_of: {view: mixed, pass: [pbp_only]}
    refresh: {class: post_game}
    min_width_px: 375
    definitions:
      - 'two as-of rules: a remaining game shows a forecast (as known at the time of the simulation). A played game shows its result (as of event) beside the forecast that was frozen before tip.'
      - 'one simulation at a time: the view names the simulation, its time, its model versions and its count of simulated seasons. Two simulations are compared in their own table, never mixed in one column.'
      - 'two model variants are kept apart: without any market input, and with line movement as a feature (R-MK-08). The variant is named in the title.'
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'The simulation id, the time it was run, the last game it knows, the model variant, and the line "forecasts: as known; results: as of event".'
        inputs: {}
      - key: remaining_games
        kind: table
        as_of: as_of_known
        shows: 'One row per remaining game: date, opponent, site, win probability with its band, predicted margin with its interval, and whether Michigan State is favoured.'
        inputs:
          tables: [games.tip_scheduled_utc, games.home_team_id, games.away_team_id, games.neutral_site, games.status, predictions.target, predictions.level, predictions.point_value, predictions.interval95, predictions.made_at_utc, predictions.sim_id, simulation_runs.sim_id, simulation_runs.n_sims, simulation_runs.as_of_utc, simulation_runs.uses_market_input, simulation_runs.model_versions, simulation_runs.param_uncertainty]
          metrics: [M-TRAT-058, M-TRAT-059, M-TRAT-056, M-TRAT-031]
        requirements: [R-PR-10, R-PR-01, R-PR-02]
        number_rule: {class: model, band: 'printed beside each probability and margin; parameter and simulation uncertainty are named apart', model_version: 'the simulation id and model versions in the table head', link: rows}
        grade_rule:
          unknown: 'A game the simulation could not price (opponent with no rating yet) shows a dash and the reason.'
      - key: played_games
        kind: table
        as_of: as_of_event
        shows: 'One row per played game: the result, and the win probability and margin that were frozen before tip.'
        inputs:
          tables: [games.home_score, games.away_score, games.status, games.tip_actual_utc, predictions.point_value, predictions.interval95, predictions.outcome_value, predictions.made_at_utc, predictions.frozen_sha256]
          metrics: [M-TRAT-043, M-TRAT-052]
        requirements: [R-MK-07, R-CX-09]
        number_rule:
          - {class: official, source: final scores of the official record, as_of: the pull time of the record, link: rows}
          - {class: model, band: the frozen interval beside each forecast, model_version: in the table head, link: rows}
        grade_rule: contract
      - key: season_outlook
        kind: chart
        as_of: as_of_known
        shows: 'The distribution of final wins over the simulated seasons, with the projected overall and conference record.'
        inputs:
          tables: [simulation_runs.n_sims, simulation_runs.seed, predictions.quantiles, predictions.target]
          metrics: [M-TRAT-062, M-TRAT-063, M-TRAT-064, M-TRAT-054]
        requirements: [R-PR-10]
        number_rule: {class: model, band: the full distribution is drawn; the interval is printed under it, model_version: in the chart corner, link: rows}
        grade_rule: contract
      - key: change_since_last
        kind: table
        as_of: as_of_known
        shows: 'For each remaining game: the win probability of the previous simulation, of this one, the difference, and the inputs that moved (rating change, availability, site).'
        inputs:
          tables: [predictions.point_value, predictions.sim_id, predictions.made_at_utc, simulation_runs.as_of_utc, simulation_runs.input_hashes]
          metrics: [M-TRAT-015, M-TRAT-013, M-TRAT-060]
        number_rule: {class: model, band: both bands are printed; a difference inside both bands is marked "inside the band", model_version: both simulation ids in the table head, link: rows}
        grade_rule: contract
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected game or number: the simulation, its inputs and hashes, the model versions, the seed, and whether a replay of the simulation was exact.'
        inputs: {}
    interactions:
      - {action: select, at: remaining_games, target: 'a game; the inspector shows the simulation and its inputs'}
      - {action: drill_down, at: remaining_games, target: the pre-game card of the game, to: pregame_card}
      - {action: drill_down, at: played_games, target: the win-probability chart of the game, to: win_probability_chart}
      - {action: inspect_query, at: remaining_games, target: the rows and the query with metric ids}
      - {action: export, at: remaining_games, target: 'the table of remaining games, aggregates only', produces: aggregate_table}
    degraded:
      D1_bug_away: Not applicable. The view reads results and frozen forecasts, not video.
      D2_off_main: Not applicable. The view reads no positions.
      D3_replay: Not applicable.
      D4_break: Not applicable.
      D5_no_video: 'No change. A model version that reads video features says so in the banner; games without video use the version that does not.'
      feed_stale: 'A game whose final score is not yet in the official record stays under "remaining" and says "result pending".'
    empty_state: 'No simulation yet (no model before P6): "no simulation yet", and the schedule with dates and sites only. Season over: the played table only, and "no game remains".'
    requirements: [R-PR-10, R-PR-01, R-PR-02, R-PR-09, R-MK-07, R-MK-08, R-CX-09, R-VZ-02, R-VZ-03, R-PR-19]
    decisions: [K12]
    depends_on:
      baselines: [metrics, live_state]
      tables: [games, predictions, simulation_runs, run_records]
    phase: P6
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-P1]
    wireframe: null
    notes: >-
      A report, not a film-room view: it has no video and reads top to bottom at 375 px. A forecast is as known and a
      result is as of event, so the record is mixed and every element says which rule it reads. The view names
      Michigan State because the requirement does (R-PR-10); stored state stays home and away.

  # -------------------------------------------------------------------------------------------------------------------
  postgame_notes:
    id: VW-RPT-02
    name: Post-game notes sheet
    surface: report
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: What are the ten things about this game most worth telling a coach, each with its proof?
    grain: game
    as_of: {view: as_of_event, pass: [anchored, pbp_only]}
    refresh: {class: post_game}
    min_width_px: 375
    definitions:
      - 'a note: one sentence, one number with the parts its class asks for, the definition of the number by metric id, and one clip reference.'
      - 'ranking: by value change and by novelty. Novelty is the distance of the number from the same team over the season to date. Both scores are printed beside the note.'
      - 'words: terms of the vocabulary map and broadcast phrases only. Words that are not measured ("momentum", "wanted it more") are not used (R-GU-04).'
      - 'gate: a note leaves the private store only after the published-number gate (R-DQ-15). The sheet says for each note whether it passed.'
      - 'time to notes: the seconds from the full video being in the private store to the sheet. Measured and printed; not a gate (K23).'
    params:
      notes_n: {value: 10, unit: count, why: 'notes on one sheet', evidence: 'requirement: R-VZ-09 (ten notes per game)'}
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'RECORDED, as of event, the pass, the state version, the play-by-play version and its pull time.'
        inputs: {}
      - key: data_basis
        kind: tile
        shows: 'What the sheet is built from: the share of possessions seen in full on the main camera, the share of game seconds at each level, and the count of open flags on this game.'
        inputs:
          tables: [possessions.usable_flag, possessions.coverage_mean, possessions.n_camera_cuts, state_second.degradation_level, scoreboard_flags.status, pbp_versions.pbp_version_id, pbp_versions.known_at_utc]
          metrics: [M-TEFF-045]
        number_rule: {class: descriptive, n: the possessions and game seconds of the game, descriptive_mark: 'the word "descriptive" under the tile', link: rows}
        grade_rule: contract
      - key: notes_list
        kind: table
        shows: 'Ten rows in rank order: the sentence, its number with n and interval (or the parts of its class), the metric id with its definition in words, the value-change score, the novelty score, the gate result and the clip reference.'
        inputs:
          tables: [metric_value_log.metric_id, metric_value_log.value, metric_value_log.n, metric_value_log.status, metric_value_log.lineage_handle, profile_snapshots.metric_code, profile_snapshots.value, profile_snapshots.ci95, profile_snapshots.n, possession_value.value_xpts, clip_index.row_ref, clip_index.in_s, clip_index.out_s, clip_index.key_frame]
          metrics: [M-TEFF-018, M-TEFF-028, M-TEFF-029, M-TEFF-030, M-TEFF-031, M-TRN-002, M-TRN-004, M-SIT-025, M-SIT-039, M-DEF-102, M-DEF-103, M-PLAY-060, M-REB-024, M-TOV-016, M-TOV-021, M-FOUL-003, M-SQ-063, M-SQ-066, M-IMP-065, M-TREE-009, M-TREE-013]
        definitions: ['a note may cite any metric of the registry; the ids listed here are the pool the first version draws from']
        requirements: [R-VZ-09, R-GU-04, R-DQ-15]
        identity_rule: locked_or_hold
        number_rule:
          - {class: estimate, n: printed in the note, interval: printed in the note with its level, level: 0.95, link: frames, min_n: registry}
          - {class: official, source: the official box or the final play-by-play, as_of: the pull time printed in the banner, link: frames}
          - {class: model, band: printed in the note, model_version: under the note, link: frames}
          - {class: descriptive, n: printed in the note, descriptive_mark: 'the word "descriptive" at the end of the sentence', link: frames}
        grade_rule:
          inferred: 'No note is written on a value that is still provisional after the anchored pass.'
          carried: No note is written on a carried value.
          imputed: No note is written on imputed positions.
          unknown: 'Fewer than ten rows, and the line "n of 10" (see the empty state).'
      - key: left_out
        kind: table
        shows: 'The next ten candidates with their two scores and the reason each was left out: below its minimum n, failed the gate, or the same finding as a higher note.'
        inputs:
          tables: [metric_value_log.metric_id, metric_value_log.value, metric_value_log.n, metric_value_log.status]
        number_rule:
          - {class: estimate, n: printed in the row, interval: printed in the row, level: 0.95, link: rows, min_n: registry}
          - {class: descriptive, n: printed in the row, descriptive_mark: 'the word "descriptive" in the row', link: rows}
        grade_rule: contract
        notes: 'For the owner and the analyst: it lets the ranking be checked. It is not part of the sheet a coach reads.'
      - key: build_line
        kind: tile
        shows: 'The seconds from full video to sheet, the run that built it, and how many of the ten notes passed the published-number gate.'
        inputs:
          tables: [run_records.run_id, run_records.start_utc, run_records.end_utc, run_requirement_results.requirement_id, run_requirement_results.result]
        requirements: [R-DQ-15]
        number_rule: {class: measurement, unit: seconds, error: 'none: the difference of two logged times', link: rows}
        grade_rule: contract
      - key: inspector
        kind: control
        component: inspector
        shows: 'The number of the selected note: metric id, registry definition, n, interval or band, the rows behind it, version, lineage.'
        inputs: {}
    interactions:
      - {action: select, at: notes_list, target: 'the number of a note opens the inspector'}
      - {action: drill_down, at: notes_list, target: the clip of the note in its possession, to: possession_explorer}
      - {action: inspect_query, at: notes_list, target: the rows and the query with the metric id}
      - {action: export, at: notes_list, target: 'the sheet as a page, notes that passed the gate only', produces: page}
      - {action: export, at: notes_list, target: the clip references of the ten notes, produces: clip_reference}
    degraded:
      D1_bug_away: default
      D2_off_main: default
      D3_replay: default
      D4_break: default
      D5_no_video: 'Notes are written from play-by-play metrics only, and the sheet says "no video: play-by-play notes". A note has no clip reference; it links to its play-by-play rows.'
      feed_stale: default
    empty_state: 'Fewer than ten findings pass their checks: the sheet shows those that do and the line "n of 10: the rest failed minimum n or the gate". No final play-by-play yet: "no notes before the final play-by-play".'
    requirements: [R-VZ-09, R-VZ-02, R-VZ-03, R-GU-04, R-DQ-15, R-MD-31, R-PT-01, R-PR-19]
    decisions: [K12, K23]
    depends_on:
      baselines: [identity_pack, metrics, live_state]
      tables: [possessions, state_second, scoreboard_flags, pbp_versions, metric_value_log, profile_snapshots, possession_value, clip_index, run_records, run_requirement_results]
    phase: P0p
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-G2, ACC-VW-P1, ACC-VW-L1]
    wireframe: null
    notes: >-
      Play-by-play notes at P0p; tracking notes as their metrics arrive, in full at P5. Decided here: the sheet never
      pads. A game with seven findings that pass has seven notes.

  # -------------------------------------------------------------------------------------------------------------------
  postgame_report:
    id: VW-RPT-03
    name: Post-game report
    surface: report
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: What happened in this game, from the final score down to the possessions and players that decided it?
    grain: game
    as_of: {view: as_of_event, pass: [anchored, pbp_only]}
    refresh: {class: post_game}
    min_width_px: 375
    definitions:
      - 'post-game report (decided here, open question OQ-VW-2): one page that holds the box and four factors, the walk down the game, and at reading width the win-probability chart, shot charts, lineups, matchups, the offense, transition and defense tables, the ten notes, the clip list and a line on stat corrections.'
      - 'a held view keeps its own record: an element that embeds another view shows a cut of it and links to it. Its numbers obey the record of that view.'
      - 'one-game rates are descriptions: a rate of one game is printed with its counts and the word "descriptive". The season value beside it is the estimate.'
      - 'transition class: our state rule is the headline. The play-by-play clock definitions are columns beside it and are never merged (R-TR-18).'
      - 'coverage: the 4 coarse ball-screen classes always; the fine class only at confidence 0.8 or more (K04).'
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'RECORDED, as of event, the pass, the state version, the play-by-play version and its pull time, and which sections are "no video".'
        inputs: {}
      - key: data_basis
        kind: tile
        shows: 'The share of possessions seen in full, the share of game seconds at each level, the official-record checks that passed, and the count of open flags.'
        inputs:
          tables: [possessions.usable_flag, possessions.coverage_mean, state_second.degradation_level, scoreboard_flags.status, run_requirement_results.requirement_id, run_requirement_results.result]
          metrics: [M-TEFF-045, M-TEFF-004]
        requirements: [R-VA-03]
        number_rule: {class: descriptive, n: the possessions and game seconds of the game, descriptive_mark: 'the word "descriptive" under the tile', link: rows}
        grade_rule: contract
      - key: box_and_factors
        kind: table
        shows: 'Both teams: the official box, counted possessions, points per possession, the four factors with the counts they are made of, points in the paint, off turnovers, on the break and on second chances, and the season value of each rate before this game.'
        inputs:
          tables: [team_box.points, team_box.fgm, team_box.fga, team_box.fg3m, team_box.fg3a, team_box.ftm, team_box.fta, team_box.oreb, team_box.dreb, team_box.ast, team_box.stl, team_box.blk, team_box.tov, team_box.pf, team_box.points_in_paint, team_box.fast_break_points, team_box.points_off_turnovers, team_box.largest_lead]
          metrics: [M-TEFF-001, M-TEFF-018, M-TEFF-019, M-TEFF-020, M-TEFF-028, M-TEFF-029, M-TEFF-030, M-TEFF-031, M-TEFF-052, M-TEFF-053, M-SHOOT-011, M-REB-007, M-REB-008, M-REB-024, M-TOV-006, M-TOV-021, M-FOUL-003, M-FOUL-065, M-TRN-013, M-TRN-016, M-SQ-024]
        requirements: [R-PR-14, R-VA-03]
        number_rule:
          - {class: official, source: 'the official box, with the play-by-play version it was checked against', as_of: the pull time of the box, link: rows}
          - {class: descriptive, n: 'the count under each rate (attempts, possessions, rebound chances)', descriptive_mark: 'the word "descriptive" in the head of the game column', link: rows}
          - {class: estimate, n: games played before this game, interval: printed beside the season value, level: 0.95, link: rows, min_n: default}
        grade_rule:
          unknown: 'A count on which the box and the folded play-by-play disagree is shown from the box, marked, and listed in the data basis.'
      - key: player_lines
        kind: table
        shows: 'One row per player of both teams: minutes, points, shooting made-attempted, rebounds, assists, steals, blocks, turnovers, fouls, plus-minus, usage and true-shooting percentage.'
        inputs:
          tables: [player_box.player_id, player_box.starter, player_box.minutes, player_box.points, player_box.fgm, player_box.fga, player_box.fg3m, player_box.fg3a, player_box.ftm, player_box.fta, player_box.oreb, player_box.dreb, player_box.ast, player_box.stl, player_box.blk, player_box.tov, player_box.pf]
          metrics: [M-PROF-004, M-PROF-013, M-SHOOT-012, M-IMP-001, M-IMP-044]
        identity_rule: locked_or_hold
        number_rule:
          - {class: official, source: the official box, as_of: the pull time of the box, link: rows}
          - {class: descriptive, n: 'the count under each rate (attempts, possessions on the floor)', descriptive_mark: 'the word "descriptive" in the head of the rate columns', link: rows}
        grade_rule: contract
      - key: tree
        kind: control
        component: tree_navigator
        shows: 'The walk down the game: game, half, five-minute window, possession, chance, action, player. Each level prints its count and one headline number: points and points per possession for a span, points and value at the start for a possession, the value change for an action.'
        inputs:
          metrics: [M-SIT-004, M-TEFF-018, M-TEFF-024, M-IMP-065]
        requirements: [R-AS-07]
        number_rule:
          - {class: official, source: points of the final play-by-play, as_of: the anchored pass or pbp_only, link: rows}
          - {class: descriptive, n: the possessions of the span, descriptive_mark: 'the word "descriptive" beside a rate of one span', link: rows}
          - {class: model, band: printed beside each value, model_version: under the tree, link: frames}
        notes: 'The owner asked for layers from the game down to the player and a tree to walk down (docs/user_inputs.md). The branch chosen here filters every section of the report.'
      - key: win_probability
        kind: chart
        embeds: win_probability_chart
        phase: P6
        shows: 'The win-probability curve of the game with run shading, and the five swing plays, at reading width.'
        inputs: {}
        requirements: [R-VZ-06d]
        number_rule: {class: model, band: a fading band round the line, model_version: in the chart corner, link: frames}
        grade_rule: contract
      - key: shot_charts
        kind: court
        embeds: shot_chart
        shows: 'The sector and ring shot chart of each team for this game, side by side.'
        inputs: {}
        requirements: [R-VZ-06i]
        grade_rule: contract
      - key: lineups
        kind: table
        embeds: lineup_board
        shows: 'The units of each team in this game: seconds, possessions, points for and against. The rating of a unit is the season value, with n.'
        inputs: {}
        requirements: [R-VZ-06j]
        number_rule:
          - {class: official, source: points and substitutions of the final play-by-play, as_of: the anchored pass or pbp_only, link: rows}
          - {class: estimate, n: possessions of the unit in the season to date, interval: printed after the rating, level: 0.95, link: rows, min_n: default}
        grade_rule: contract
      - key: matchups
        kind: table
        embeds: matchup_board
        phase: P4
        shows: 'The pair grid of each defending team for this game: seconds matched per pair and the switches.'
        inputs: {}
        requirements: [R-VZ-06a]
        number_rule:
          - {class: measurement, unit: seconds, error: the seconds unassigned and not seen, link: frames}
          - {class: label, confidence: the mean assignment probability of the cell, version: in the table foot, link: frames}
        grade_rule: contract
      - key: offense_breakdown
        kind: table
        phase: P3
        shows: 'Per team: the play-type mix with points per possession, the sets run with their count and points per chance, how often a set was completed or countered, and the first set after each timeout.'
        inputs:
          tables: [set_instances.set_code, set_instances.family_code, set_instances.match_confidence, set_instances.points, set_instances.departure_step, set_instances.situation, play_calls.after_timeout, play_calls.mapped_set_code]
          metrics: [M-PLAY-014, M-PLAY-015, M-PLAY-004, M-PLAY-049, M-PLAY-060, M-PLAY-063, M-PLAY-066, M-SIT-039, M-COACH-015]
          events: ['composition:set_match', 'composition:departure', 'screens:ball_screen', 'transition:ato']
        requirements: [R-ST-25]
        number_rule:
          - {class: label, confidence: 'the share of chances whose set or play type is above its gate, in the table head', version: the grammar and template versions in the table foot, link: frames}
          - {class: descriptive, n: the chances of each row, descriptive_mark: 'the word "descriptive" in the head of the game columns', link: rows}
        grade_rule:
          unknown: 'A chance with no matched set is counted in the row "no set matched". It is not forced into a set.'
      - key: transition_breakdown
        kind: table
        shows: 'Per team: how possessions started, the share and points per possession in transition under our state rule and under each play-by-play definition side by side, numbers advantages and what was done with them, breaks passed up with the value at stake, and the seconds the defense took to get set.'
        inputs:
          tables: [possessions.start_type_code, possessions.transition_class, possessions.is_transition_ncaa_engine, possessions.points, transition_phases.transition_class, transition_phases.tr_state_repo, transition_phases.tr_ncaa_engine, transition_phases.tr_hoopmath_10s, transition_phases.tr_synergy_like, transition_phases.numbers_at_t0, transition_phases.pushed, transition_phases.passed_up_category, transition_phases.value_at_stake_xpts, transition_phases.seconds_to_defense_set, transition_numbers.numbers_label, transition_numbers.value_xpts]
          metrics: [M-TRN-001, M-TRN-002, M-TRN-003, M-TRN-004, M-TRN-005, M-TRN-015, M-TRN-018, M-TRN-019, M-TRN-034, M-TRN-036, M-TRN-037, M-TRN-038, M-TRN-044, M-PLAY-003]
          events: ['transition:transition_phase', 'transition:numbers_advantage', 'transition:primary_break', 'transition:secondary_break', 'transition:push', 'transition:pull_back', 'transition:passed_up_break', 'defense:transition_defense_chain', 'defense:get_back']
        requirements: [R-TR-09, R-TR-10, R-TR-16, R-TR-17, R-TR-18, R-TR-24, R-TR-26]
        number_rule:
          - {class: official, source: 'the play-by-play clock definitions, each named in its column head', as_of: the anchored pass or pbp_only, link: rows}
          - {class: label, confidence: 'the share of possessions whose transition class is above its gate, in the table head', version: the grammar version in the table foot, link: frames}
          - {class: descriptive, n: the possessions of each row, descriptive_mark: 'the word "descriptive" in the head of the game columns', link: rows}
          - {class: model, band: printed beside the value at stake, model_version: in the table foot, link: frames}
        grade_rule: contract
        notes: 'The play-by-play columns are drawn from P0p. The state-rule columns, numbers advantages and passed-up breaks need P3 and are marked "no tracking yet" before it.'
      - key: defense_breakdown
        kind: table
        phase: P4
        shows: 'Per team on defense: the scheme mix with points per possession allowed, the ball-screen coverage mix with its outcome, scheme changes with their trigger and lag, and closeouts, help and rotations with their rates.'
        inputs:
          tables: [scheme_states.l1_base_scheme_code, scheme_states.l1_conf, scheme_states.l2_active_coverages, scheme_states.press_code, scheme_states.possession_id, screens.coverage_coarse, screens.coverage_fine_code, screens.drop_depth_m, screens.value_delta, scheme_changes.scheme_before, scheme_changes.scheme_after, scheme_changes.trigger_type, scheme_changes.lag_s, reaction_events.closeout_distance_m, reaction_events.closeout_speed_mps, reaction_events.latency_s]
          metrics: [M-DEF-002, M-DEF-006, M-DEF-110, M-DEF-111, M-DEF-102, M-DEF-103, M-DEF-104, M-DEF-112, M-DEF-113, M-DEF-034, M-DEF-038, M-DEF-091, M-DEF-097]
          events: ['defense:scheme_fingerprint', 'defense:ball_screen_coverage_rule', 'defense:drop_coverage', 'defense:show', 'defense:blitz', 'defense:ice', 'defense:switch', 'defense:closeout', 'defense:help_and_recover', 'defense:rotate', 'defense:zone_slide', 'defense:press_pickup']
        requirements: [R-DF-14, R-DF-16]
        number_rule:
          - {class: label, confidence: 'the confidence of each scheme and coverage class, beside its share', version: the grammar version in the table foot, link: frames}
          - {class: descriptive, n: the possessions or screens of each row, descriptive_mark: 'the word "descriptive" in the head of the game columns', link: rows}
          - {class: measurement, unit: 'metres, metres per second and seconds', error: printed beside each mean, link: frames}
        grade_rule: contract
      - key: notes
        kind: table
        embeds: postgame_notes
        shows: 'The ten notes of the game, each with its number and clip reference.'
        inputs: {}
        requirements: [R-VZ-09]
        number_rule:
          - {class: estimate, n: printed in the note, interval: printed in the note with its level, level: 0.95, link: frames, min_n: registry}
          - {class: descriptive, n: printed in the note, descriptive_mark: 'the word "descriptive" at the end of the sentence', link: frames}
        grade_rule: contract
      - key: clip_browser
        kind: table
        shows: 'Every clip of the game by row type (possession, chance, event, action): period and clock, what, in and out seconds, key frame and linked replays. It can be sorted and filtered; a row opens its clip.'
        inputs:
          tables: [clip_index.row_ref, clip_index.video_id, clip_index.in_s, clip_index.out_s, clip_index.key_frame, clip_index.replay_ids, events.event_type_code, events.period, events.game_clock_s]
        requirements: [R-VZ-10]
        number_rule: {class: measurement, unit: video seconds and a frame number, error: 'the window round the key frame comes from config per event type; the key frame is exact to one frame', link: frames}
        grade_rule:
          unknown: 'A row with no clip times shows a dash and "no clip". The count of such rows is printed above the list.'
        notes: 'The clip index is a data product with no screen of its own (core.yaml out_of_scope). This element is the place where a person browses it.'
      - key: stat_corrections
        kind: tile
        shows: 'The numbers of this report that changed after a stat correction: old value, new value, the play-by-play versions, and whether the old value had been published.'
        inputs:
          tables: [stat_corrections.metric_id, stat_corrections.old_value, stat_corrections.new_value, stat_corrections.was_published, stat_corrections.cause_diff_id, pbp_versions.pbp_version_id, pbp_versions.known_at_utc, pbp_diffs.change_kind]
        requirements: [R-SY-20]
        number_rule: {class: official, source: the two play-by-play versions named in the row, as_of: the pull time of each version, link: rows}
        grade_rule: contract
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected number: metric id, registry definition, the parts of its class, the rows behind it, version, lineage.'
        inputs: {}
    interactions:
      - {action: filter, at: tree, target: 'a branch of the walk down; every section narrows to it and the count of possessions left is printed'}
      - {action: drill_down, at: tree, target: one possession with video, to: possession_explorer}
      - {action: drill_down, at: win_probability, target: the full chart, to: win_probability_chart}
      - {action: drill_down, at: shot_charts, target: the full shot chart, to: shot_chart}
      - {action: drill_down, at: lineups, target: the full board, to: lineup_board}
      - {action: drill_down, at: matchups, target: the full board, to: matchup_board}
      - {action: drill_down, at: notes, target: the full sheet, to: postgame_notes}
      - {action: drill_down, at: clip_browser, target: the clip in its possession, to: possession_explorer}
      - {action: select, at: view, target: any number opens the inspector}
      - {action: inspect_query, at: box_and_factors, target: the rows and the query with metric ids}
      - {action: export, at: view, target: the report as a page without video frames, produces: page}
    degraded:
      D1_bug_away: default
      D2_off_main: default
      D3_replay: default
      D4_break: default
      D5_no_video: 'The box, the factors, the player lines, the lineups, the shot charts from play-by-play coordinates, the play-by-play columns of the transition table and the stat corrections stay. Matchups, offense, defense and the clip list are marked "no video".'
      feed_stale: default
    empty_state: 'No final play-by-play yet: "report not built: waiting for the final play-by-play". Game not processed on video: the play-by-play sections only, each video section marked "no video".'
    requirements: [R-PR-14, R-VZ-02, R-VZ-03, R-VZ-06a, R-VZ-06d, R-VZ-06i, R-VZ-06j, R-VZ-09, R-VZ-10, R-SY-20, R-VA-03, R-AS-07, R-ST-25, R-TR-09, R-TR-10, R-TR-16, R-TR-17, R-TR-18, R-TR-24, R-TR-26, R-DF-14, R-DF-16, R-DQ-15, R-PR-19]
    decisions: [K04, K05, K12, K23, K28]
    depends_on:
      baselines: [movement_grammar, identity_pack, metrics, live_state]
      tables: [possessions, chances, events, state_second, scoreboard_flags, run_requirement_results, team_box, player_box, set_instances, play_calls, transition_phases, transition_numbers, scheme_states, screens, scheme_changes, reaction_events, clip_index, stat_corrections, pbp_versions, pbp_diffs, run_records]
    phase: P0p
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-G2, ACC-VW-P1, ACC-VW-L1]
    wireframe: null
    notes: >-
      First version at P0p: banner, data basis, box and factors, player lines, the tree down to the possession, shot
      charts, lineups, the play-by-play transition columns, notes and stat corrections. Offense at P3, matchups and
      defense at P4, the win-probability section at P6. The schema has no half scope on team_box, so the half
      level of the tree is folded from play-by-play rows.

  # -------------------------------------------------------------------------------------------------------------------
  opponent_scouting_packet:
    id: VW-RPT-04
    name: Opponent scouting packet
    surface: report
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: What does this opponent normally do, who does it, and where can it be hurt, as known before tip?
    grain: opponent
    as_of: {view: as_of_known, pass: [pbp_only, anchored]}
    refresh: {class: pre_game, budget_s: 86400, evidence: 'requirement: R-OS-07 and the pre_game class of config/views/core.yaml (the packet is ready 24 h before tip; its snapshot is taken at that time)'}
    min_width_px: 375
    definitions:
      - 'frozen: the packet reads only games played before the target game, and ratings dated on or before the day before tip. It prints its snapshot time and shows nothing dated after it (R-FD-07, R-CX-09).'
      - 'no footage: our video covers an opponent only in its games against Michigan State. A section that needs video is built from those games alone and says how many; with none, it carries "no footage: play-by-play and public data only" (R-OS-05).'
      - 'population: a number shows its D-I rank or percentile where a population source exists; else "this team only".'
      - 'pre-game report: the name R-OS-03 uses. It is this packet plus the pre-game card. There is no third view.'
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'FROZEN, the snapshot time, "as known", the last game included, and the as-of time of every source block.'
        inputs: {}
      - key: data_basis
        kind: tile
        shows: 'What the packet is built from: games used and their dates, how many have play-by-play, shot locations and our video, and whether any value falls back on last season.'
        inputs:
          tables: [profile_snapshots.games_used, profile_snapshots.as_of_date, profile_snapshots.source_basis, profile_snapshots.prior_season_fallback, games.pbp_available, games.shot_coords_available, games.primary_video_id]
        number_rule: {class: descriptive, n: the games of the opponent before the snapshot, descriptive_mark: 'the word "descriptive" under the tile', link: rows}
        grade_rule: contract
      - key: opponent_normal
        kind: table
        shows: 'The normal game of the opponent on offense and defense: efficiency, tempo, four factors, shot mix, foul rate, free-throw percentage, transition share, bench share, each with n games, interval and D-I rank, and the adjusted ratings of the named system.'
        inputs:
          tables: [profile_snapshots.entity_id, profile_snapshots.entity_type, profile_snapshots.metric_code, profile_snapshots.value, profile_snapshots.ci95, profile_snapshots.n, ratings_snapshots.system, ratings_snapshots.metric_code, ratings_snapshots.value, ratings_snapshots.rank, ratings_snapshots.as_of_date, ratings_snapshots.is_point_in_time, team_box.bench_points, team_box.bench_minutes_share]
          metrics: [M-TEFF-010, M-TEFF-018, M-TEFF-019, M-TEFF-028, M-TEFF-029, M-TEFF-030, M-TEFF-031, M-TEFF-035, M-TEFF-036, M-TRAT-001, M-TRAT-002, M-SQ-010, M-SQ-011, M-SQ-012, M-FOUL-003, M-FOUL-065, M-TRN-002, M-TRN-004, M-REB-007, M-TOV-006, M-TOV-010, M-COACH-041, M-COACH-042]
        requirements: [R-OS-01, R-OS-06, R-FD-06, R-FD-07]
        number_rule:
          - {class: estimate, n: games and possessions before the snapshot, interval: printed after each value, level: 0.95, link: rows, min_n: default}
          - {class: official, source: 'the rating system named in the row, from its snapshot dated on or before the day before tip', as_of: the date of the rating snapshot, link: none_fixed}
        grade_rule:
          carried: 'A value that falls back on last season is greyed and says "prior season".'
      - key: style
        kind: table
        shows: 'The style of the opponent: its style class and what dictates tempo, the start-type mix of its possessions, seconds to the first shot, efficiency by shot-clock band, and from games with footage the play-type mix and the sets it runs most.'
        inputs:
          tables: [profile_snapshots.metric_code, profile_snapshots.value, profile_snapshots.n, set_instances.set_code, set_instances.family_code, set_instances.team_id, transition_phases.transition_class]
          metrics: [M-TRAT-074, M-TRAT-075, M-TRAT-079, M-TRN-019, M-TRN-021, M-SIT-043, M-PLAY-014, M-PLAY-015, M-PLAY-029, M-PLAY-060, M-TREE-016]
          events: ['composition:style_measures', 'composition:set_match']
        requirements: [R-OS-02, R-ST-25]
        number_rule:
          - {class: estimate, n: possessions before the snapshot, interval: printed after each value, level: 0.95, link: rows, min_n: default}
          - {class: label, confidence: 'the share of chances with a matched set, in the section head', version: the template version in the section foot, link: frames}
        grade_rule:
          unknown: 'A row that needs video and has none shows a dash and "no footage".'
      - key: defense_profile
        kind: table
        phase: P4
        shows: 'How the opponent defends: what it allows by shot zone, its forced-turnover rate, and from games with footage its scheme mix by context (after a make or a miss, by score, by period), zone and press use, and its ball-screen coverage mix.'
        inputs:
          tables: [profile_snapshots.metric_code, profile_snapshots.value, profile_snapshots.ci95, profile_snapshots.n, scheme_states.l1_base_scheme_code, scheme_states.l1_conf, scheme_states.press_code, scheme_states.zone_family_probs, screens.coverage_coarse, screens.coverage_fine_code]
          metrics: [M-DEF-006, M-DEF-008, M-DEF-009, M-DEF-010, M-TOV-010, M-DEF-110, M-DEF-111, M-DEF-102, M-DEF-112, M-DEF-132]
          events: ['defense:scheme_fingerprint', 'defense:ball_screen_coverage_rule']
        definitions: ['coverage: the 4 coarse classes always; the fine class only at confidence 0.8 or more (K04)']
        requirements: [R-DF-14, R-DF-16, R-OS-03]
        number_rule:
          - {class: estimate, n: games and possessions before the snapshot, interval: printed after each value, level: 0.95, link: rows, min_n: default}
          - {class: label, confidence: the confidence of each scheme and coverage class, version: the grammar version in the section foot, link: frames}
        grade_rule:
          unknown: 'A row that needs video and has none shows a dash and "no footage".'
        notes: 'The play-by-play rows (shooting allowed by zone, forced turnovers) are drawn from P0p. See the notes of the record on R-OS-03.'
      - key: players
        kind: table
        embeds: player_card
        shows: 'One short row per rotation player from his frozen player card: role, minutes share, usage, shooting by zone, and the tendencies that are above their reliability n.'
        inputs: {}
        requirements: [R-OS-02]
        identity_rule: locked_or_hold
        number_rule: {class: estimate, n: games and attempts on the card, interval: printed after each value, level: 0.95, link: rows, min_n: registry}
        grade_rule: contract
      - key: spot_game_plan
        kind: court
        shows: 'For each opponent player: his best and worst spots against the D-I average, with his share of shots there. For each of our defenders: the make rate opponents had at each spot against him.'
        inputs:
          tables: [player_shooting_sector_ring.player_id, player_shooting_sector_ring.sector_15deg, player_shooting_sector_ring.ring_0p5m, player_shooting_sector_ring.fga, player_shooting_sector_ring.fgm, player_shooting_sector_ring.rate_shrunk, player_shooting_sector_ring.prior_code, player_shooting_sector_ring.as_of_date, shots.release_spot, shots.shooter_id, shots.closest_defender_id, shots.made]
          metrics: [M-SHOOT-021, M-SHOOT-022, M-SQ-046, M-SQ-047, M-DEF-044]
          spots: ['layer:spot', 'layer:zone_scheme:court_region']
        requirements: [R-PC-24, R-PC-23]
        identity_rule: locked_or_hold
        number_rule: {class: estimate, n: attempts at the spot, interval: printed under each rate with its level, level: 0.8, link: rows, min_n: registry}
        grade_rule: contract
        notes: 'The part per opponent player needs only play-by-play coordinates (P0p). The part per defender needs the closest defender of each shot (P5).'
      - key: coach
        kind: tile
        embeds: coach_card
        shows: 'The opposing head coach in four lines from his frozen coach card: tenure and record, system tags, timeouts against runs, and the first set after a timeout.'
        inputs: {}
        requirements: [R-CH-07]
        number_rule: {class: descriptive, n: the games on the card, descriptive_mark: 'the word "descriptive" beside every reaction number', link: rows}
        grade_rule: contract
      - key: head_to_head
        kind: table
        shows: 'Earlier meetings of the two teams and of the two head coaches: date, site, score, pace, the four factors of each side, and from our video the sets and schemes used.'
        inputs:
          tables: [games.season, games.tip_scheduled_utc, games.neutral_site, games.home_team_id, games.away_team_id, games.home_score, games.away_score, games.home_head_coach_id, games.away_head_coach_id, team_box.points, team_box.fga, team_box.tov, team_box.oreb, team_box.fta]
          metrics: [M-COACH-094, M-TRAT-078, M-TEFF-010, M-TEFF-052]
        requirements: [R-CC-05]
        number_rule:
          - {class: official, source: the official box of each earlier game, as_of: the pull time of each box, link: rows}
          - {class: descriptive, n: the earlier meetings, descriptive_mark: 'the word "descriptive" in the section head', link: rows}
        grade_rule: contract
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected number: metric id, n, prior and shrinkage, interval, the games behind it, source and as-of, lineage.'
        inputs: {}
    interactions:
      - {action: select, at: view, target: any number opens the inspector}
      - {action: drill_down, at: opponent_normal, target: the games behind a number as a list}
      - {action: drill_down, at: players, target: the frozen card of the player, to: player_card}
      - {action: drill_down, at: coach, target: the frozen card of the coach, to: coach_card}
      - {action: drill_down, at: head_to_head, target: the report of an earlier meeting, to: postgame_report}
      - {action: drill_down, at: spot_game_plan, target: the shots at a spot, to: shot_chart}
      - {action: inspect_query, at: opponent_normal, target: the rows and the query with metric ids}
      - {action: export, at: view, target: the packet as a page without video frames, produces: page}
    degraded:
      D1_bug_away: default
      D2_off_main: default
      D3_replay: default
      D4_break: default
      D5_no_video: 'Sections that need video carry "no footage: play-by-play and public data only". For most opponents that is the normal state of the packet (R-OS-05).'
      feed_stale: 'The packet prints the as-of time of every source block. A game whose final play-by-play was not in at the snapshot is listed as "not included".'
    empty_state: 'Opponent with no game this season before the snapshot: values of last season, each marked "prior season", and the line "no game this season yet". Opponent outside the sources: "no data for this opponent" with the sources that were tried.'
    requirements: [R-PR-14, R-OS-01, R-OS-02, R-OS-03, R-OS-05, R-OS-06, R-OS-07, R-PC-23, R-PC-24, R-DF-14, R-DF-16, R-ST-25, R-CC-05, R-CH-07, R-FD-06, R-FD-07, R-CX-09, R-VZ-02, R-VZ-03, R-PR-19]
    decisions: [K04, K12]
    depends_on:
      baselines: [named_spots, movement_grammar, identity_pack, metrics, live_state]
      tables: [profile_snapshots, ratings_snapshots, games, team_box, set_instances, transition_phases, scheme_states, screens, player_shooting_sector_ring, shots, run_records]
    phase: P0p
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-P1, ACC-VW-L1]
    wireframe: null
    notes: >-
      From play-by-play alone at P0p for every Big Ten opponent (R-OS-07). R-OS-03 asks how the opponent defended
      our most-used sets when other teams ran them; R-OS-05 says those games are not recorded. Decided here: that
      section is built only from this opponent's games against Michigan State, and says so. The conflict is recorded
      for the open questions. The predicted pairings are the mismatch map of the pre-game card (R-MX-06).

  # -------------------------------------------------------------------------------------------------------------------
  edge_report:
    id: VW-RPT-05
    name: Edge report per market
    surface: report
    audience: [owner, analyst]
    privacy: owner_only
    question: Where did our frozen probability differ from the fair market probability, and did the closing line then move our way?
    grain: market-game
    as_of: {view: mixed, pass: [pbp_only]}
    refresh: {class: post_game}
    min_width_px: 375
    definitions:
      - 'frozen first: a prediction enters only if it was made and hashed before the market snapshot it is compared with (R-MK-07). A prediction with no hash, or with a later time, is listed as "not frozen" and enters no number.'
      - 'fair probability: the bookmaker margin is removed by the default method chosen under R-MK-32. The method is named in every column head; the power and Shin values are both stored and can both be shown (R-MK-04).'
      - 'two variants, never pooled: the model without any market input, and the model with line movement as a feature (R-MK-08).'
      - 'no edge claim: a market with fewer priced events than min_priced_events shows its numbers with the line "no edge claim" and never a verdict (R-PR-08).'
      - 'paper only: staking is a simulation on stored prices. Nothing on this view is an order, an account action or advice.'
      - 'as-of: predictions and prices are read as known at the snapshot. The two elements that need the result of the game read it as of event and say so.'
      - 'private: raw prices never leave the private store. Only derived statistics (closing-line value, calibration, skill scores) may be published, through the calibration report or the pitch package (R-MK-24).'
    params:
      min_priced_events: {value: 200, unit: count, why: 'no edge claim on a market with fewer priced events', evidence: 'requirement: R-PR-08 (proposal; unless the test was registered before with a power calculation)'}
      kelly_fraction_max: {value: 0.25, unit: fraction, why: 'largest share of the Kelly stake the paper simulation may use', evidence: 'requirement: R-MK-09 (at most quarter Kelly and a stake cap)'}
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'The season and date range, the model variant, the fair-probability method, the snapshot the predictions are compared with, and the count of predictions that were not frozen in time.'
        inputs: {}
      - key: filter_bar
        kind: control
        component: filter_bar
        shows: 'Market type (moneyline, spread, total, first half, player prop), model variant, engine level, season, walk-forward fold or the held-out season, and the snapshot (open, 24 h, 1 h, close).'
        inputs: {}
        definitions: ['held-out season: 2025-26 is scored once per model family; the banner prints the date it was scored (R-PR-04)']
      - key: market_table
        kind: table
        as_of: as_of_known
        shows: 'One row per market type and model variant: priced events, mean edge with interval, mean closing-line value with interval, log loss of the model and of the market, and the line "no edge claim" where the count is too low.'
        inputs:
          tables: [predictions.edge, predictions.clv, predictions.log_loss, predictions.compared_snapshot_key, predictions.priced_events_in_market, predictions.made_at_utc, predictions.frozen_sha256, predictions.level, predictions.model_family, predictions.target, predictions.is_holdout_2025_26, market_snapshots.market, market_snapshots.market_phase, market_snapshots.snapshot_label, market_snapshots.snapshot_time_utc, market_snapshots.fair_prob_power, market_snapshots.fair_prob_shin, market_snapshots.fair_prob_mult, simulation_runs.uses_market_input]
          metrics: [M-MKT-067, M-MKT-070, M-MKT-071, M-MKT-073, M-MKT-015, M-MKT-016, M-MKT-022, M-MKT-027, M-MKT-087, M-MKT-055]
        requirements: [R-MK-04, R-MK-05, R-MK-06, R-MK-07, R-MK-08, R-PR-08]
        number_rule:
          - {class: estimate, n: priced events of the market, interval: printed after the mean edge and the mean closing-line value, level: 0.95, link: rows, min_n: 200}
          - {class: model, band: printed in the game rows for each probability, model_version: 'model family, level and variant in the row', link: rows}
        grade_rule:
          unknown: 'A market with no closing snapshot shows a dash for closing-line value and "no close".'
      - key: game_rows
        kind: table
        as_of: as_of_known
        shows: 'One row per market and game: our probability with its interval, the fair market probability at the compared snapshot, the edge, the closing fair probability and the closing-line value, with the book or consensus named.'
        inputs:
          tables: [predictions.prediction_id, predictions.point_value, predictions.interval95, predictions.edge, predictions.clv, predictions.made_at_utc, predictions.compared_snapshot_key, market_snapshots.book, market_snapshots.price_american, market_snapshots.line, market_snapshots.implied_prob, market_snapshots.fair_prob_power, market_snapshots.snapshot_label, market_snapshots.line_is_integer, market_snapshots.dq_flags]
          metrics: [M-MKT-001, M-MKT-021, M-MKT-023, M-MKT-024, M-MKT-025, M-MKT-026, M-MKT-027, M-MKT-033, M-MKT-067, M-MKT-070]
        requirements: [R-MK-05, R-MK-06]
        number_rule:
          - {class: model, band: the interval printed beside our probability, model_version: in the row, link: rows}
          - {class: official, source: 'the book or consensus named in the row, with the snapshot label', as_of: the snapshot time, link: rows}
        grade_rule:
          unknown: 'A price row that failed a contract or carries a data-quality flag is not compared. The row shows a dash and the flag.'
      - key: clv_chart
        kind: chart
        as_of: as_of_known
        shows: 'Closing-line value over the season for each model variant: the distribution per market type and the running mean with its band.'
        inputs:
          tables: [predictions.clv, predictions.made_at_utc, predictions.target, predictions.model_family]
          metrics: [M-MKT-070, M-MKT-072, M-MKT-074]
        requirements: [R-MK-06]
        number_rule: {class: estimate, n: priced events to date, interval: a fading band round the running mean, level: 0.95, link: rows, min_n: 200}
        grade_rule: contract
      - key: graded_results
        kind: table
        as_of: as_of_event
        shows: 'Per game and market, after the final: the result against the line (cover, push, over or under) and the margin against the spread.'
        inputs:
          tables: [predictions.outcome_value, games.home_score, games.away_score, games.status, market_snapshots.line, market_snapshots.snapshot_label]
          metrics: [M-MKT-060, M-MKT-061, M-MKT-063]
        number_rule: {class: official, source: the final score of the official record and the closing line of the named source, as_of: the pull time of the record, link: rows}
        grade_rule: contract
      - key: paper_staking
        kind: chart
        as_of: as_of_event
        shows: 'The paper bankroll over the season under the staking rule: units gained, return, largest drawdown, and the count of paper stakes. Each variant has its own line.'
        inputs:
          tables: [predictions.paper_stake_frac, predictions.outcome_value, predictions.edge, predictions.made_at_utc]
          metrics: [M-MKT-069, M-MKT-076, M-MKT-078, M-MKT-079, M-MKT-080, M-MKT-081]
        requirements: [R-MK-09]
        number_rule:
          - {class: descriptive, n: the graded paper stakes, descriptive_mark: 'the words "paper simulation, descriptive" in the chart title', link: rows}
          - {class: estimate, n: the graded paper stakes, interval: printed after the return, level: 0.95, link: rows, min_n: 200}
        grade_rule: contract
      - key: in_game_divergence
        kind: chart
        as_of: as_of_event
        shows: 'For games with exchange prices joined to the game clock: our in-game win probability and the exchange-implied one over game time, and the gap between them.'
        inputs:
          tables: [market_snapshots.market_phase, market_snapshots.bid, market_snapshots.ask, market_snapshots.last, market_snapshots.source_time_utc, clock_map.utc_at_from, clock_map.utc_err_s, predictions.wp_home_live, predictions.wp_band_lo, predictions.wp_band_hi]
          metrics: [M-MKT-043, M-MKT-044, M-MKT-049, M-MKT-085]
        requirements: [R-MK-03]
        number_rule:
          - {class: model, band: a fading band round our line, model_version: in the chart corner, link: frames}
          - {class: official, source: 'the exchange named, mid price with its bid-ask spread', as_of: 'the source time of each price; a price is joined only inside the UTC error limit of R-MK-03', link: rows}
        grade_rule:
          unknown: 'A stretch where the UTC error of the clock map is over the limit has no joined price. The exchange line has a gap there, with the reason.'
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected row or number: the prediction with its hash and time, the snapshot row, the margin-removal method, the rows behind an aggregate, lineage.'
        inputs: {}
    interactions:
      - {action: filter, at: filter_bar, target: 'market type, variant, level, season and snapshot; the count of priced events left is printed'}
      - {action: select, at: market_table, target: 'a market and variant; the game rows and the charts narrow to it'}
      - {action: drill_down, at: market_table, target: 'the priced events behind a mean, shown as the game rows'}
      - {action: drill_down, at: game_rows, target: the pre-game card of the game, to: pregame_card}
      - {action: inspect_query, at: market_table, target: the rows and the query with metric ids}
      - {action: export, at: market_table, target: 'derived statistics only: closing-line value and scores per market, no price', produces: aggregate_table}
    degraded:
      D1_bug_away: Not applicable. The pre-game part reads no video.
      D2_off_main: Not applicable.
      D3_replay: Not applicable.
      D4_break: Not applicable.
      D5_no_video: 'No change to the pre-game part. The in-game chart needs the clock map of a processed game; without it the chart says "no clock map for this game".'
      feed_stale: 'A game with no closing snapshot from any enabled source shows "no close" and enters no closing-line value. The count of such games is printed in the banner.'
    empty_state: 'No frozen prediction with a market snapshot (before P7): "no priced prediction yet". A market under the minimum count is still listed, with "no edge claim".'
    requirements: [R-MK-03, R-MK-04, R-MK-05, R-MK-06, R-MK-07, R-MK-08, R-MK-09, R-MK-24, R-MK-32, R-PR-04, R-PR-07, R-PR-08, R-VZ-02, R-VZ-03, R-PR-19]
    decisions: [K12]
    depends_on:
      baselines: [metrics, live_state]
      tables: [predictions, market_snapshots, simulation_runs, games, clock_map, run_records]
    phase: P7
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-P1, ACC-VW-P2]
    wireframe: null
    notes: >-
      Owner only. The view is mixed: prices and frozen predictions are as known, and the three elements that read a
      result are as of event; every element says which. The matchup layer (player props, R-PR-07) is a market type
      of the filter, not a view of its own.

  # -------------------------------------------------------------------------------------------------------------------
  calibration_report:
    id: VW-RPT-06
    name: Calibration and scoring report
    surface: report
    audience: [owner, analyst, msu_staff]
    privacy: shareable_aggregate
    question: When this model said 70 percent, did it happen 70 percent of the time, and does it beat the ratings baseline and the closing line?
    grain: model version
    as_of: {view: as_of_event, pass: [pbp_only]}
    refresh: {class: post_game}
    min_width_px: 375
    definitions:
      - 'what is scored: predictions frozen before the event, against results from the official record. A prediction that was not frozen in time is not scored and is counted in the banner.'
      - 'baselines: a ratings model as of the day before, and the closing line itself (R-PR-03). Both are in every score table.'
      - 'walk-forward: every score is out of sample. The held-out season 2025-26 is scored once per model family and the date is printed (R-PR-04).'
      - 'aggregates only: the view holds no player row, no video and no raw price. Its page may be published through the published-number gate (R-DQ-15, R-MK-24).'
    params:
      reliability_bins: {value: 10, unit: count, why: 'bins of the reliability curve and of the calibration error', evidence: 'requirement: R-PR-05a (10-bin ECE)'}
      ece_target: {value: 0.03, unit: probability, why: 'reference line for the calibration error of win probabilities', evidence: 'requirement: R-PR-05a (proposal)'}
      rolling_games: {value: 10, unit: games, why: 'window of the rolling calibration monitor', evidence: 'requirement: R-VA-14 (rolling 10-game ECE)'}
      rolling_ece_alert: {value: 0.05, unit: probability, why: 'alert line on the rolling monitor', evidence: 'requirement: R-VA-14 (alert when rolling 10-game ECE is above 0.05)'}
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'The model family, version and level, the layer scored, the period, the last game scored, and the count of predictions left out as not frozen.'
        inputs: {}
      - key: scope_bar
        kind: control
        component: filter_bar
        shows: 'Model family and version, engine level, layer (game, half, five-minute window), target (win, margin, total), walk-forward fold or the held-out season.'
        inputs: {}
      - key: reliability_curve
        kind: chart
        shows: 'Forecast probability against observed frequency in ten bins, with the count and a band in each bin, the diagonal, and the calibration error printed beside its reference line.'
        inputs:
          tables: [predictions.point_value, predictions.outcome_value, predictions.target, predictions.level, predictions.model_family, predictions.horizon, predictions.made_at_utc, predictions.frozen_sha256, predictions.is_holdout_2025_26]
          metrics: [M-MKT-089, M-MKT-091, M-MKT-092, M-MKT-093]
        requirements: [R-PR-05a]
        number_rule: {class: estimate, n: predictions in each bin, interval: a fading band per bin, level: 0.95, link: rows, min_n: default}
        grade_rule: contract
      - key: score_table
        kind: table
        shows: 'One row per layer and target: log loss, Brier score and skill, ranked probability score, error of the predicted margin, each for the model, the ratings baseline and the closing line, with n and the interval of each difference.'
        inputs:
          tables: [predictions.log_loss, predictions.crps, predictions.point_value, predictions.outcome_value, predictions.level, predictions.target, hypothesis_results.hypothesis_id, hypothesis_results.estimate, hypothesis_results.ci95, hypothesis_results.n, hypothesis_results.p_adjusted]
          metrics: [M-MKT-087, M-MKT-088, M-MKT-090, M-MKT-094, M-MKT-095, M-MKT-099, M-MKT-100, M-MKT-102, M-TRAT-065]
        requirements: [R-PR-03, R-PR-04, R-MK-32]
        number_rule: {class: estimate, n: predictions scored, interval: printed after each difference to a baseline, level: 0.95, link: rows, min_n: default}
        grade_rule: contract
      - key: pit_histogram
        kind: chart
        shows: 'For margin and total distributions: the histogram of the probability integral transform against the flat line, with the count per bar.'
        inputs:
          tables: [predictions.pit, predictions.crps, predictions.quantiles, predictions.target]
          metrics: [M-MKT-095, M-MKT-096]
        requirements: [R-PR-05b]
        number_rule: {class: estimate, n: predictions per bar, interval: the band a flat histogram would give at this n, level: 0.95, link: rows, min_n: default}
        grade_rule: contract
      - key: window_scores
        kind: table
        shows: 'Five-minute windows: the score of the model against the pace-scaled random-walk baseline, per window of the game.'
        inputs:
          tables: [predictions.window_id, predictions.point_value, predictions.outcome_value, predictions.log_loss]
          metrics: [M-SIT-005, M-MKT-097, M-MKT-098]
        requirements: [R-PR-06]
        number_rule: {class: estimate, n: windows scored, interval: printed after each difference, level: 0.95, link: rows, min_n: default}
        grade_rule: contract
      - key: rolling_monitor
        kind: chart
        shows: 'The calibration error over the last ten scored games as a line, with the alert line, one point per game.'
        inputs:
          tables: [run_requirement_results.requirement_id, run_requirement_results.metric, run_requirement_results.value, run_requirement_results.ci95_lo, run_requirement_results.ci95_hi, run_requirement_results.n, run_requirement_results.result]
          metrics: [M-MKT-091]
        requirements: [R-VA-14]
        number_rule: {class: estimate, n: predictions in the ten games, interval: a fading band round the line, level: 0.95, link: rows, min_n: default}
        grade_rule: contract
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected bin, score or point: its predictions as rows, the model card of the version, the baselines used, lineage.'
        inputs: {}
    interactions:
      - {action: filter, at: scope_bar, target: 'model, level, layer, target and period; the count of predictions scored is printed'}
      - {action: select, at: reliability_curve, target: 'a bin; the inspector lists its predictions and results'}
      - {action: drill_down, at: score_table, target: the predictions behind a score as rows}
      - {action: drill_down, at: rolling_monitor, target: the win-probability chart of one game, to: win_probability_chart}
      - {action: inspect_query, at: score_table, target: the rows and the query with metric ids}
      - {action: export, at: score_table, target: 'the scores per layer, aggregates only', produces: aggregate_table}
      - {action: export, at: view, target: the report as a page, produces: page}
    degraded:
      D1_bug_away: Not applicable. Scores read frozen predictions and official results.
      D2_off_main: Not applicable.
      D3_replay: Not applicable.
      D4_break: Not applicable.
      D5_no_video: 'No change. A model version that reads video features is scored only on games with video; the banner prints how many.'
      feed_stale: 'A game whose final score is not in the official record is not scored. The count of unscored games is printed in the banner.'
    empty_state: 'No model scored yet (before P6): "no model scored yet", and the two baselines scored against each other where their data exists. A bin or bar with too few predictions shows "too few" and n.'
    requirements: [R-PR-03, R-PR-04, R-PR-05a, R-PR-05b, R-PR-06, R-VA-14, R-MK-24, R-MK-32, R-DQ-15, R-VZ-02, R-VZ-03, R-PR-19]
    decisions: [K12]
    depends_on:
      baselines: [metrics, live_state]
      tables: [predictions, hypothesis_results, run_requirement_results, run_records]
    phase: P6
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-P1, ACC-VW-P2]
    wireframe: null
    notes: >-
      The only view of this file whose class is shareable aggregate. Its link from a number goes to rows
      (predictions), not to video.

  # -------------------------------------------------------------------------------------------------------------------
  pitch_package:
    id: VW-RPT-07
    name: Pitch package
    surface: report
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: What can this system show Michigan State that it does not have today, and how well has it predicted so far?
    grain: season
    as_of: {view: as_of_event, pass: [anchored, pbp_only]}
    refresh: {class: on_run}
    min_width_px: 375
    definitions:
      - 'rights gate: the package is built only after the owner signs the gate. It holds numbers, drawings on our own top-down court and clip references. It never holds a broadcast frame, audio, a face image or a raw market price (R-RG-02, R-MK-24).'
      - 'every number passes the published-number gate (R-DQ-15) before it is on a page.'
      - 'a held view keeps its own record: each section embeds a view of this catalogue and obeys its rules.'
      - 'no edge claim below the count of R-PR-08: the results table prints n beside every number and the line "no edge claim" where it applies.'
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'The date the package was built, the run it reports, the processed game it shows, and the date and name on the rights gate.'
        inputs: {}
      - key: gate_line
        kind: tile
        numbers: none
        shows: 'The rights gate and the published-number gate: signed or not, by whom and when, what the package holds and what it never holds.'
        inputs:
          tables: [run_requirement_results.requirement_id, run_requirement_results.result, run_records.run_id, run_records.end_utc]
        requirements: [R-RG-02, R-DQ-15]
        grade_rule:
          unknown: 'Gate not signed: the package shows only this line and "not released" (see the empty state).'
      - key: walk_forward_results
        kind: table
        shows: 'Engine levels L1 to L3 against closing lines, out of sample: closing-line value, log loss against the market and against the ratings baseline, each with interval and n.'
        inputs:
          tables: [predictions.level, predictions.clv, predictions.log_loss, predictions.priced_events_in_market, predictions.is_holdout_2025_26, predictions.model_family]
          metrics: [M-MKT-070, M-MKT-087, M-MKT-088, M-MKT-090, M-MKT-091]
        requirements: [R-PT-01, R-PR-08, R-MK-24]
        number_rule: {class: estimate, n: priced events per level and market, interval: printed after each value, level: 0.95, link: rows, min_n: 200}
        grade_rule: contract
      - key: calibration
        kind: chart
        embeds: calibration_report
        shows: 'The reliability curve of the chosen model version with its calibration error.'
        inputs: {}
        number_rule: {class: estimate, n: predictions in each bin, interval: a fading band per bin, level: 0.95, link: rows, min_n: default}
        grade_rule: contract
      - key: processed_game
        kind: table
        embeds: postgame_report
        shows: 'One fully processed Michigan State game: its post-game report at reading width.'
        inputs: {}
        requirements: [R-PT-01]
        number_rule:
          - {class: official, source: the official box of the game, as_of: the pull time of the box, link: rows}
          - {class: descriptive, n: the count under each rate, descriptive_mark: 'the word "descriptive" in the head of the game columns', link: rows}
        grade_rule: contract
      - key: halftime
        kind: tile
        embeds: halftime_packet
        shows: 'The half-time packet of that game as it was known at the half, with the seconds it took to build.'
        inputs: {}
        requirements: [R-VZ-08]
        number_rule: {class: official, source: the half-time box known at the snapshot of the packet, as_of: the snapshot time of the packet, link: rows}
        grade_rule: contract
      - key: notes
        kind: table
        embeds: postgame_notes
        shows: 'The ten post-game notes of that game, those that passed the gate.'
        inputs: {}
        requirements: [R-VZ-09]
        number_rule:
          - {class: estimate, n: printed in the note, interval: printed in the note with its level, level: 0.95, link: frames, min_n: registry}
          - {class: descriptive, n: printed in the note, descriptive_mark: 'the word "descriptive" at the end of the sentence', link: frames}
        grade_rule: contract
      - key: what_video_adds
        kind: table
        shows: 'For the processed game, the numbers that exist only with video (who guarded whom, ball-screen coverages, numbers advantages, value credits) beside the play-by-play numbers of the same game, with the share of possessions seen in full.'
        inputs:
          tables: [possessions.usable_flag, possessions.coverage_mean]
          metrics: [M-TEFF-045, M-DEF-060, M-DEF-102, M-TRN-036, M-IMP-065, M-TEFF-018]
        requirements: [R-PT-01]
        number_rule:
          - {class: descriptive, n: the possessions of the game and the share seen in full, descriptive_mark: 'the word "descriptive" in the table head', link: rows}
          - {class: label, confidence: the confidence of each class shown, version: the grammar version in the table foot, link: frames}
        grade_rule: contract
      - key: drawings
        kind: court
        embeds: telestrator_freeze_frame
        shows: 'Top-down drawings of chosen moments of that game, each with its caption. Drawings only; locked identities only.'
        inputs: {}
        requirements: [R-VZ-11, R-RG-02]
        identity_rule: locked_or_hold
        grade_rule: contract
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected number: metric id, definition, n and interval, the gate result, the rows behind it.'
        inputs: {}
    interactions:
      - {action: select, at: view, target: any number opens the inspector}
      - {action: drill_down, at: processed_game, target: the full report of the game, to: postgame_report}
      - {action: drill_down, at: calibration, target: the full calibration report, to: calibration_report}
      - {action: drill_down, at: notes, target: the full notes sheet, to: postgame_notes}
      - {action: export, at: view, target: 'the package as a page: numbers, drawings and clip references', produces: page}
      - {action: export, at: drawings, target: one drawing, produces: top_down_render}
    degraded:
      D1_bug_away: default
      D2_off_main: default
      D3_replay: default
      D4_break: default
      D5_no_video: 'The processed game is chosen among games with video. With none, the package has no game section and says "no processed game yet".'
      feed_stale: default
    empty_state: 'Rights gate not signed: only the gate line and "not released: the rights gate is not signed". No processed game: the walk-forward results and the calibration section only.'
    requirements: [R-PT-01, R-RG-02, R-DQ-15, R-MK-24, R-PR-08, R-VZ-08, R-VZ-09, R-VZ-11, R-VZ-02, R-VZ-03, R-PR-19]
    decisions: [K12, K23]
    depends_on:
      baselines: [identity_pack, metrics, live_state]
      tables: [run_requirement_results, run_records, predictions, possessions]
    phase: P8
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-P1, ACC-VW-P2]
    wireframe: null
    notes: >-
      Decided here: class MSU staff, because the processed game holds player-level findings, and stricter than the
      class allows: no video element and no video export. A public cut would be the calibration report page and
      drawings that passed the gate; whether one is wanted is an open question. Built once, on the run it reports,
      or earlier on the owner's word.

  # -------------------------------------------------------------------------------------------------------------------
  player_card:
    id: VW-CARD-01
    name: Player card
    surface: card
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: Who is this player, what does he tend to do, and how sure are we of each tendency, as of this date?
    grain: player-season
    as_of: {view: as_of_known, pass: [pbp_only, anchored]}
    refresh: {class: pre_game}
    min_width_px: 375
    definitions:
      - 'frozen: one card per player per game date. Every field carries its source and date. Nothing dated after the snapshot is on it (R-PC-14).'
      - 'not public: a field that is not published says "not public". It is never estimated.'
      - 'no face image: the identity block is name, number, team mark and listed measures. No headshot is shown or needed (decision of 11 Nov 2026).'
      - 'excluded by design: race, ethnicity or proxies for them, face data, private health, private social media (R-PC-15).'
      - 'population: a metric shows its D-I percentile where a population source exists; else the label "MSU games only" (R-PC-18).'
      - 'every estimate states its prior, its effective sample size and its shrinkage factor in the inspector (R-VL-12).'
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'FROZEN, the snapshot date, "as known", the last game included, and the as-of date of every source block.'
        inputs: {}
      - key: identity_block
        kind: tile
        shows: 'Name as the broadcast says it, jersey numbers with their dates, listed position, class and eligibility year, age at tip, listed height and weight with their source, shooting hand, transfer origin and seasons in the program.'
        inputs:
          tables: [players.broadcast_name, players.full_name, players.shooting_hand, rosters.listed_position, rosters.class_year, rosters.eligibility_year, rosters.listed_height_cm, rosters.listed_height_source, rosters.listed_weight_kg, rosters.transfer_origin_team_id, rosters.is_walk_on, jersey_history.jersey_number, jersey_history.valid_from, jersey_history.valid_to, player_game_context.age_at_tip_years]
          metrics: [M-PROF-021, M-PROF-042, M-PROF-059, M-PROF-061, M-PROF-063, M-PROF-076]
        requirements: [R-PC-01, R-PC-14, R-PC-15, R-FD-12]
        number_rule: {class: official, source: the roster listing or the public source named on each field, as_of: the date on each field, link: none_fixed}
        grade_rule:
          unknown: 'A field that is not public shows "not public". It is never estimated.'
        notes: 'The birth date is not shown; only the age at tip. The roster table has a headshot link column; no view reads it.'
      - key: role_and_usage
        kind: table
        shows: 'Games and starts, minutes share, usage, his rank in the rotation, the share of minutes at each position, and his role cluster where the cluster is stable.'
        inputs:
          tables: [profile_snapshots.entity_id, profile_snapshots.metric_code, profile_snapshots.value, profile_snapshots.ci95, profile_snapshots.n, profile_snapshots.games_used, profile_snapshots.as_of_date, profile_snapshots.source_basis]
          metrics: [M-PROF-001, M-PROF-002, M-PROF-005, M-PROF-013, M-PROF-020, M-PROF-024, M-PROF-037, M-PROF-049]
        requirements: [R-PC-18]
        number_rule: {class: estimate, n: games and possessions used, interval: the posterior interval after each value, level: 0.95, link: rows, min_n: registry}
        grade_rule:
          unknown: 'A role cluster that is not stable is not shown. The row says "role not stable yet" and n.'
      - key: production
        kind: table
        shows: 'Per 100 possessions: scoring, effective field-goal and true-shooting percentage, projected free-throw percentage, assist and turnover rates, rebound rates, fouls; and his on-court and on-off numbers with n.'
        inputs:
          tables: [profile_snapshots.metric_code, profile_snapshots.value, profile_snapshots.ci95, profile_snapshots.n, profile_snapshots.prior_season_fallback]
          metrics: [M-PROF-009, M-SHOOT-011, M-SHOOT-012, M-SHOOT-017, M-FOUL-066, M-FOUL-003, M-PASS-002, M-TOV-009, M-REB-010, M-REB-011, M-IMP-002, M-IMP-003, M-TEFF-040]
        requirements: [R-PC-18]
        number_rule: {class: estimate, n: games and possessions used, interval: the posterior interval after each value, level: 0.95, link: rows, min_n: registry}
        grade_rule:
          carried: 'A value that falls back on last season is greyed and says "prior season".'
      - key: tendencies
        kind: table
        shows: 'Drive direction, finishing hand, shot-clock use, pass or shoot by zone, first action after the catch and its latency: each with n, as-of date, the shrunk estimate and its reliability. A tendency below its reliability n is hidden.'
        inputs:
          tables: [profile_snapshots.metric_code, profile_snapshots.value, profile_snapshots.ci95, profile_snapshots.n, profile_snapshots.as_of_date, drives.direction, drives.hand_side, touches.decision_latency_s, touches.end_how]
          metrics: [M-PROF-043, M-PROF-040, M-PROF-070, M-PASS-045, M-PASS-050, M-SHOOT-069, M-SQ-022, M-TREE-001, M-TREE-002]
          events: ['ball_actions:drive_direction', 'ball_actions:touch', 'ball_actions:drive']
        requirements: [R-PC-11, R-PC-18, R-VL-12, R-CO-01]
        number_rule: {class: estimate, n: the actions behind the tendency, interval: the posterior interval after each value, level: 0.95, link: rows, min_n: registry}
        grade_rule:
          unknown: 'A tendency below its reliability n shows "too few" and n, never a value (R-PC-11).'
        notes: 'Shot-clock use and finishing from play-by-play at P0p. The tendencies that need tracking arrive at P3 to P5 and are hidden until they reach their n.'
      - key: spot_shooting_map
        kind: court
        shows: 'The half court with the named spots: at each spot attempts, makes and the shrunk make rate with its 80 % interval. A spot below its minimum n is hatched with "too few" and n.'
        inputs:
          tables: [player_shooting_sector_ring.player_id, player_shooting_sector_ring.sector_15deg, player_shooting_sector_ring.ring_0p5m, player_shooting_sector_ring.fga, player_shooting_sector_ring.fgm, player_shooting_sector_ring.rate_shrunk, player_shooting_sector_ring.prior_code, player_shooting_sector_ring.shot_context, player_shooting_sector_ring.as_of_date, player_shooting_sector_ring.location_source, shots.release_spot, shots.shooter_id, shots.made]
          metrics: [M-SHOOT-021, M-SHOOT-022, M-SQ-046]
          spots: ['layer:spot', 'layer:zone_scheme:court_region']
        definitions: ['partition: the named spots of config/named_spots.yaml. The sector and ring chart is the shot chart view.']
        requirements: [R-PC-23]
        identity_rule: locked_or_hold
        number_rule: {class: estimate, n: attempts at the spot, interval: printed under the rate with its level, level: 0.8, link: rows, min_n: registry}
        grade_rule:
          unknown: 'A shot with no location is at no spot. The count of such shots is printed under the map.'
      - key: defense_block
        kind: table
        phase: P5
        shows: 'Block and steal rates, and from tracking the field-goal percentage allowed at the rim, rim attempts deterred per 100 possessions and how many positions he guards.'
        inputs:
          tables: [profile_snapshots.metric_code, profile_snapshots.value, profile_snapshots.ci95, profile_snapshots.n]
          metrics: [M-DEF-020, M-TOV-012, M-DEF-047, M-DEF-048, M-DEF-069, M-PROF-058]
        requirements: [R-VL-17, R-PC-18]
        number_rule: {class: estimate, n: possessions or shots defended, interval: the posterior interval after each value, level: 0.95, link: rows, min_n: registry}
        grade_rule:
          unknown: 'Before tracking the rim rows show a dash and "needs tracking". Block and steal rates are shown from the box.'
      - key: availability_line
        kind: tile
        shows: 'His status for the game (available, out, questionable, minutes limit, suspended) with the as-of time and the public source.'
        inputs:
          tables: [availability.status, availability.known_at_utc, availability.reason_public, availability.source_link, availability.minutes_limit_note, availability.is_private_note]
          metrics: [M-PROF-003]
        requirements: [R-FD-05, R-RG-06]
        number_rule: {class: official, source: the public report named on the line, as_of: the as-of time of the status, link: none_fixed}
        grade_rule:
          unknown: 'No public report: the line says "no public report". Health is never inferred.'
        notes: 'A private note of the owner (availability.is_private_note) is shown to the owner alone and is marked private.'
      - key: background
        kind: tile
        shows: 'Recruiting rank, and a name, image and likeness value where one is published, with its source, publication date and kind (estimate or reported).'
        inputs:
          tables: [player_card_template.nil_source, player_card_template.nil_as_of_date, player_card_template.nil_kind]
          metrics: [M-PROF-074, M-MKT-112]
        requirements: [R-PC-22, R-FD-12]
        number_rule: {class: official, source: 'the publication named, with its kind', as_of: the publication date, link: none_fixed}
        grade_rule:
          unknown: 'Nothing published: "not public".'
        notes: 'Never a model input (decision D24).'
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected number: metric id, n, prior, effective sample size, shrinkage, interval, percentile source, the rows behind it.'
        inputs: {}
    interactions:
      - {action: select, at: view, target: any number opens the inspector}
      - {action: drill_down, at: tendencies, target: the plays behind a tendency as a list with clip links, to: possession_explorer}
      - {action: drill_down, at: spot_shooting_map, target: the shots at a spot, to: shot_chart}
      - {action: inspect_query, at: production, target: the rows and the query with metric ids}
      - {action: export, at: view, target: the card as a page, produces: page}
    degraded:
      D1_bug_away: default
      D2_off_main: default
      D3_replay: default
      D4_break: default
      D5_no_video: default
      feed_stale: default
    empty_state: 'A player with no D-I game before the snapshot: the identity block, the line "no game yet", and every tendency as "too few".'
    requirements: [R-PR-14, R-PC-01, R-PC-11, R-PC-14, R-PC-15, R-PC-18, R-PC-22, R-PC-23, R-FD-05, R-FD-12, R-VL-12, R-VL-17, R-CO-01, R-RG-06, R-VZ-02, R-VZ-03, R-PR-19]
    decisions: [K12]
    depends_on:
      baselines: [named_spots, movement_grammar, identity_pack, metrics, live_state]
      tables: [players, rosters, jersey_history, player_game_context, profile_snapshots, drives, touches, player_shooting_sector_ring, shots, availability, player_card_template, run_records]
    phase: P0
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-P1, ACC-VW-P2]
    wireframe: docs/data/views/player_card.svg
    notes: >-
      Version 1 at P0: identity block, role, production from public data, availability. Spot shooting map and
      play-by-play tendencies at P0p. Tracking tendencies and the defense block at P5. An individual output: private
      to MSU staff and the owner.

  # -------------------------------------------------------------------------------------------------------------------
  coach_card:
    id: VW-CARD-02
    name: Coach card
    surface: card
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: How does this coach run a game, and which of those habits are measured, as of this date?
    grain: coach
    as_of: {view: as_of_known, pass: [pbp_only, anchored]}
    refresh: {class: pre_game}
    min_width_px: 375
    definitions:
      - 'frozen: computed only from games played before the target game; the card prints its snapshot date (R-FD-07).'
      - 'descriptive unless designed: a number about a reaction (a timeout during a run, a substitution after a mistake, a scheme change) carries the word "descriptive". An effect is shown only when a registered identification design stands behind it, and the design is named (R-HY-08).'
      - 'run: the register rule M-SIT-025 unless another definition is chosen and named (K05).'
      - 'not on the card: timeout purpose (R-CC-07 is excluded for now) and sideline reactions seen on video (R-CC-04), until staff respond and the labels exist.'
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'FROZEN, the snapshot date, "as known", the games included, and how many of them have our video.'
        inputs: {}
      - key: profile
        kind: tile
        shows: 'Name, role, seasons at the school, career record and record this season, record in the conference, and the offense and defense families he uses most.'
        inputs:
          tables: [coaches.name, coaches.role, coaches.season, coaches.team_id, coaches.tenure_start_season, coaches.career_wins_asof, coaches.career_losses_asof, coaches.system_offense_codes, coaches.system_defense_codes]
          metrics: [M-COACH-081, M-COACH-091, M-COACH-092, M-COACH-095]
        requirements: [R-CC-01]
        number_rule: {class: official, source: the public record named on the tile, as_of: the snapshot date, link: none_fixed}
        grade_rule: contract
      - key: timeouts_and_runs
        kind: table
        shows: 'Timeouts by type; how large the opponent run was when he called one; the lag from the run reaching its threshold to the timeout, in game-clock seconds and in possessions; the share of his timeouts called during a run; and what the next possessions gave.'
        inputs:
          tables: [timeouts.team, timeouts.timeout_type, timeouts.called_by, timeouts.period, timeouts.game_clock_s, timeouts.became_media, runs.definition_code, runs.timeouts_during, runs.pts_for, runs.pts_against, runs.start_game_clock_s, runs.end_game_clock_s]
          metrics: [M-COACH-001, M-COACH-010, M-COACH-011, M-COACH-012, M-COACH-015, M-COACH-016, M-COACH-024, M-SIT-040]
          events: [T16, T26]
        requirements: [R-CC-02, R-HY-08]
        number_rule:
          - {class: descriptive, n: the timeouts and runs counted, descriptive_mark: 'the word "descriptive" beside every count, share and lag', link: rows}
          - {class: estimate, n: the matched timeouts of the registered design, interval: printed after the effect, level: 0.95, link: rows, min_n: default}
        grade_rule: contract
        notes: 'The effect column is empty, with "no registered design yet", until the design of R-HY-08 exists.'
      - key: after_timeout_sets
        kind: table
        phase: P3
        shows: 'The first set after each timeout: which set, how often, and the points per chance it gave; and how often he goes to a counter.'
        inputs:
          tables: [timeouts.ato_set_instance_id, play_calls.after_timeout, play_calls.mapped_set_code, set_instances.set_code, set_instances.family_code, set_instances.match_confidence, set_instances.points, set_instances.counter_code]
          metrics: [M-PLAY-066, M-COACH-069, M-COACH-070, M-TREE-009]
          events: ['transition:ato', 'composition:set_match']
        requirements: [R-CH-06]
        number_rule:
          - {class: label, confidence: the match confidence of each set, version: the template version in the table foot, link: frames}
          - {class: descriptive, n: the timeouts with a matched set, descriptive_mark: 'the word "descriptive" in the table head', link: rows}
        grade_rule:
          unknown: 'A timeout with no matched set is counted in the row "no set matched".'
      - key: substitutions_and_fouls
        kind: table
        shows: 'Substitutions per game and when; the size of the rotation; how often a player is pulled at the first dead ball after a mistake; and for each player in foul trouble whether he sat, for how long, and when he came back.'
        inputs:
          tables: [substitutions.period, substitutions.game_clock_s, substitutions.player_in_id, substitutions.player_out_id, substitutions.reason_inferred, substitutions.during_timeout, foul_state.foul_trouble, foul_state.personal_fouls_player_cum]
          metrics: [M-COACH-037, M-COACH-043, M-COACH-044, M-COACH-046, M-COACH-050, M-COACH-053, M-FOUL-115]
          events: [T22, T09]
        requirements: [R-CC-03, R-CC-06]
        identity_rule: locked_or_hold
        number_rule: {class: descriptive, n: the substitutions and foul-trouble cases counted, descriptive_mark: 'the word "descriptive" in the table head', link: rows}
        grade_rule: contract
      - key: adjustments
        kind: table
        phase: P4
        shows: 'The half-time adjustment (the change from the end of the first half to the start of the second), scheme changes with their trigger and lag, and how often a timeout is followed by a scheme change.'
        inputs:
          tables: [scheme_changes.trigger_type, scheme_changes.scheme_before, scheme_changes.scheme_after, scheme_changes.lag_s, scheme_changes.opp_ppp_before, reaction_events.trigger_type, reaction_events.latency_s]
          metrics: [M-COACH-077, M-COACH-075, M-COACH-078, M-COACH-030, M-DEF-113]
          events: ['defense:scheme_fingerprint']
        requirements: [R-CH-06, R-CH-10]
        number_rule:
          - {class: descriptive, n: the games and changes counted, descriptive_mark: 'the word "descriptive" in the table head', link: rows}
          - {class: measurement, unit: seconds, error: printed beside each lag, link: frames}
        grade_rule: contract
        notes: 'The half-time row is drawn from play-by-play at P0p; the scheme rows need P4.'
      - key: end_game
        kind: table
        shows: 'Late-game choices: two-for-one attempts, fouling when up three, use of fouls to give, and coach challenges with their success rate.'
        inputs:
          tables: [coaches_challenges.outcome, coaches_challenges.play_type, coaches_challenges.timeout_charged, state_second.two_for_one_window, state_second.foul_up_3_cell]
          metrics: [M-COACH-032, M-COACH-055, M-COACH-059, M-COACH-060, M-COACH-066]
        number_rule: {class: descriptive, n: the cases of each choice, descriptive_mark: 'the word "descriptive" in the table head', link: rows}
        grade_rule: contract
      - key: head_to_head
        kind: table
        shows: 'His record against the opposing head coach, with the date, site and score of each meeting.'
        inputs:
          tables: [games.home_head_coach_id, games.away_head_coach_id, games.tip_scheduled_utc, games.neutral_site, games.home_score, games.away_score]
          metrics: [M-COACH-094]
        requirements: [R-CC-05, R-CH-07]
        number_rule: {class: official, source: the official record of each meeting, as_of: the snapshot date, link: rows}
        grade_rule: contract
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected number: metric id, n, the definition of the run or window used, the design behind an effect, the rows behind it.'
        inputs: {}
    interactions:
      - {action: select, at: view, target: any number opens the inspector}
      - {action: drill_down, at: timeouts_and_runs, target: 'the timeouts as a list; each opens in the chart of its game', to: win_probability_chart}
      - {action: drill_down, at: after_timeout_sets, target: the possessions after a timeout, to: possession_explorer}
      - {action: drill_down, at: head_to_head, target: the report of an earlier meeting, to: postgame_report}
      - {action: inspect_query, at: timeouts_and_runs, target: the rows and the query with metric ids}
      - {action: export, at: view, target: the card as a page, produces: page}
    degraded:
      D1_bug_away: default
      D2_off_main: default
      D3_replay: default
      D4_break: default
      D5_no_video: default
      feed_stale: default
    empty_state: 'A coach in his first game at the school: the profile from public records, and every table as "too few" with n. A coach with no public record: "no public record" with the sources tried.'
    requirements: [R-CC-01, R-CC-02, R-CC-03, R-CC-05, R-CC-06, R-CH-06, R-CH-07, R-CH-10, R-HY-08, R-FD-07, R-VZ-02, R-VZ-03, R-PR-19]
    decisions: [K05, K12]
    depends_on:
      baselines: [movement_grammar, state_machine, identity_pack, metrics, live_state]
      tables: [coaches, timeouts, runs, play_calls, set_instances, substitutions, foul_state, scheme_changes, reaction_events, coaches_challenges, state_second, games, run_records]
    phase: P0
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-P1]
    wireframe: null
    notes: >-
      Version 1 at P0: profile and head-to-head from public records. Timeouts, substitutions, foul trouble and end
      game from play-by-play at P0p. Sets after timeouts at P3, scheme changes at P4. The grain coach is one coach
      as of the snapshot date, over the seasons the card names.

  # -------------------------------------------------------------------------------------------------------------------
  pregame_card:
    id: VW-CARD-03
    name: Pre-game card
    surface: card
    audience: [owner, analyst, msu_staff]
    privacy: msu_staff
    question: What is known about this game before tip, and what does each prediction layer say, with which drivers?
    grain: game
    as_of: {view: mixed, pass: [pbp_only]}
    refresh: {class: pre_game}
    min_width_px: 375
    definitions:
      - 'one record, one view: the card renders the frozen record pregame_cards. The "pre-game report" of R-OS-03 is this card plus the opponent packet.'
      - 'two snapshots: the frozen card of the day before, and the snapshot at 900 s before tip with announced starters and availability updates when public. Both are kept; the banner says which one is shown (R-CX-18).'
      - 'nothing after the snapshot: every block prints its as-of time. A value dated after the snapshot is never on the card (R-CX-09, R-MR-03).'
      - 'mismatch map: predicted before the game. Who did guard whom is the matchup board.'
      - 'officials: tendencies only. The card holds no judgement of calls and no "missed call" number.'
      - 'no market price is on the card. The market comparison is on the edge report, which only the owner sees (R-MK-24).'
    params:
      drivers_n: {value: 3, unit: count, why: 'drivers listed under each prediction', evidence: 'requirement: R-PR-13 (top 3 drivers in points of margin)'}
    elements:
      - key: as_of_banner
        kind: control
        component: as_of_banner
        shows: 'FROZEN, which snapshot (day before, or 900 s before tip), its time, the hash of the card, and the as-of time of every block.'
        inputs:
          live_state: [pregame_card]
          tables: [pregame_cards.frozen_at_utc, pregame_cards.horizon, pregame_cards.card_sha256]
      - key: context
        kind: tile
        as_of: as_of_known
        shows: 'Game type, conference or not, tournament and round, seeds, site (home, away or neutral), venue, days of rest and games in the last week for each team, travel distance, time zones crossed and altitude difference.'
        inputs:
          live_state: [game_context, venue_site, rest_travel]
          tables: [games.game_type, games.conference_game, games.tournament_name, games.tournament_round, games.home_seed, games.away_seed, games.neutral_site, games.tip_scheduled_utc, games.venue_id, venues.name, venues.city, venues.elevation_m, venues.capacity, team_game_context.days_rest, team_game_context.games_last_7d, team_game_context.travel_from_prev_km, team_game_context.campus_to_venue_km, team_game_context.time_zones_crossed, team_game_context.altitude_diff_m, team_game_context.is_rivalry]
          metrics: [M-SIT-082, M-SIT-083, M-SIT-092, M-SIT-094, M-SIT-099]
        requirements: [R-MD-14]
        number_rule:
          - {class: official, source: the schedule and venue registry, as_of: the snapshot time, link: none_fixed}
          - {class: measurement, unit: 'kilometres, metres and days', error: 'none stated: computed from registry coordinates and the schedule', link: none_fixed}
        grade_rule: contract
      - key: ratings
        kind: table
        as_of: as_of_known
        shows: 'Both teams in each rating system as of the day before: adjusted efficiency on offense and defense, tempo, rank, and the gap between the teams.'
        inputs:
          tables: [ratings_snapshots.system, ratings_snapshots.entity_id, ratings_snapshots.metric_code, ratings_snapshots.value, ratings_snapshots.rank, ratings_snapshots.as_of_date, ratings_snapshots.is_point_in_time, ratings_snapshots.snapshot_kind, pregame_cards.rating_snapshot_ids]
          metrics: [M-TRAT-001, M-TRAT-002, M-TRAT-004, M-TRAT-056, M-TEFF-011, M-TEFF-015, M-TEFF-035, M-TEFF-036]
        requirements: [R-FD-06]
        number_rule: {class: official, source: 'the rating system named in the row; a snapshot that is not point-in-time is marked', as_of: the date of the rating snapshot, link: none_fixed}
        grade_rule:
          carried: 'When the snapshot of the day before is missing, the nearest earlier one is shown, greyed, with its date.'
      - key: availability
        kind: table
        as_of: as_of_known
        shows: 'Each rotation player of both teams: status at the snapshot, the as-of time and source of the status, and whether he is an announced starter.'
        inputs:
          live_state: [rosters_cards]
          tables: [availability.player_id, availability.team_id, availability.status, availability.known_at_utc, availability.reason_public, availability.source_link, availability.minutes_limit_note, availability.is_private_note, player_game_context.is_starter, pregame_cards.availability_refs, pregame_cards.player_card_snapshot_ids]
          metrics: [M-PROF-003, M-TRAT-013]
        requirements: [R-FD-05, R-CX-18, R-RG-06]
        identity_rule: locked_or_hold
        number_rule: {class: official, source: the public report named in the row, as_of: the as-of time of the status, link: none_fixed}
        grade_rule:
          unknown: 'No public report: "no public report". A status is never inferred.'
        notes: 'A private note of the owner is shown to the owner alone and is marked private.'
      - key: officials_crew_sheet
        kind: table
        as_of: as_of_known
        shows: 'The crew when announced: each official with games worked, and the tendencies of the crew and of each official as of the date: fouls per 100 possessions, free-throw attempts per field-goal attempt, the away-minus-home foul split and reviews per game, each shrunk, with n games and interval.'
        inputs:
          live_state: [officials_crew]
          tables: [game_officials.official_id, game_officials.is_crew_chief, game_officials.listed_position, game_officials.known_at_utc, officials.name, officials.first_season_seen, pregame_cards.officials_announced, profile_snapshots.entity_type, profile_snapshots.metric_code, profile_snapshots.value, profile_snapshots.ci95, profile_snapshots.n]
          metrics: [M-FOUL-121, M-FOUL-122, M-FOUL-123, M-FOUL-124, M-FOUL-125, M-FOUL-126, M-FOUL-128, M-FOUL-130]
        requirements: [R-RF-06, R-RF-18, R-FD-08]
        number_rule:
          - {class: estimate, n: games worked before the snapshot, interval: printed after each tendency, level: 0.95, link: rows, min_n: default}
          - {class: official, source: the public listing of the crew, as_of: the as-of time of the listing, link: none_fixed}
        grade_rule:
          unknown: 'Crew not announced at the snapshot: "crew not announced" and no tendency.'
      - key: predictions
        kind: table
        as_of: as_of_known
        phase: P6
        shows: 'Per layer (game, half, five-minute window): win probability, the margin distribution and the total distribution, each with its interval, beside the ratings baseline. The model variant and the simulation are named.'
        inputs:
          tables: [predictions.target, predictions.level, predictions.horizon, predictions.window_id, predictions.point_value, predictions.interval95, predictions.quantiles, predictions.made_at_utc, predictions.frozen_sha256, predictions.model_family, predictions.sim_id, pregame_cards.prediction_ids, simulation_runs.n_sims, simulation_runs.pregame_card_sha256, simulation_runs.uses_market_input, simulation_runs.param_uncertainty]
          metrics: [M-TRAT-057, M-TRAT-058, M-TRAT-059, M-TEFF-038]
        requirements: [R-PR-01, R-PR-02, R-PR-09, R-MK-07]
        number_rule: {class: model, band: 'the interval beside each value; parameter and simulation uncertainty are named apart', model_version: 'model family, level and simulation id in the row', link: rows}
        grade_rule:
          unknown: 'Before P6, or when no prediction was frozen for this card: a dash and "no model before P6".'
      - key: prediction_drivers
        kind: table
        as_of: as_of_known
        phase: P6
        shows: 'Under the predicted margin: its three largest drivers in points of margin (for example rating gap, site, rest, availability) and the remainder, which add up to the predicted margin.'
        inputs:
          tables: [predictions.point_value, predictions.target, pregame_cards.context_feature_values, pregame_cards.context_feature_asof]
          metrics: [M-TRAT-060, M-TRAT-061, M-TRAT-013]
        requirements: [R-PR-13]
        number_rule: {class: model, band: printed beside each driver, model_version: in the table foot, link: rows}
        grade_rule: contract
      - key: mismatch_map
        kind: table
        as_of: as_of_known
        phase: P4
        shows: 'The predicted pairings from the player cards and the expected lineups: who is likely to guard whom, the probability of each pairing, and the gaps of each pair in listed height, weight and measured top speed.'
        inputs:
          tables: [rosters.player_id, rosters.listed_height_cm, rosters.listed_weight_kg, rosters.listed_position, pregame_cards.player_card_snapshot_ids, profile_snapshots.metric_code, profile_snapshots.value, profile_snapshots.n, defensive_matchups.defender_id, defensive_matchups.attacker_id, defensive_matchups.matchup_prob]
          metrics: [M-DEF-063, M-DEF-068, M-DEF-072, M-PHYS-029, M-TREE-004]
          events: ['defense:matchup']
        requirements: [R-MX-06, R-MX-07]
        identity_rule: locked_or_hold
        number_rule:
          - {class: model, band: the probability of each predicted pairing, model_version: in the table foot, link: rows}
          - {class: measurement, unit: 'centimetres, kilograms, metres per second', error: 'a listed value carries none and says "listed"; a measured speed prints its error and n', link: rows}
        grade_rule:
          unknown: 'A pair with no history and no rule to place it shows a dash and "no basis".'
      - key: mismatch_check
        kind: table
        phase: P4
        as_of: as_of_event
        shows: 'After the game: each predicted pairing beside the share of matched seconds it really had, and the share of predicted pairings that came true.'
        inputs:
          tables: [defensive_matchups.defender_id, defensive_matchups.attacker_id, defensive_matchups.matchup_prob, defensive_matchups.second_index]
          metrics: [M-DEF-060]
        requirements: [R-MX-06]
        identity_rule: locked_or_hold
        number_rule:
          - {class: measurement, unit: seconds and percent of matched seconds, error: the seconds unassigned and not seen, link: frames}
          - {class: descriptive, n: the predicted pairings of the game, descriptive_mark: 'the word "descriptive" beside the share that came true', link: rows}
        grade_rule: contract
        notes: 'This block is added after the game and reads what happened. It is not part of the frozen card and never changes it.'
      - key: snapshot_changes
        kind: table
        as_of: as_of_known
        shows: 'What changed between the frozen card and the snapshot at 900 s before tip: starters announced, a status that moved, the crew announced.'
        inputs:
          tables: [pregame_cards.horizon, pregame_cards.frozen_at_utc, pregame_cards.card_sha256, availability.status, availability.known_at_utc, player_game_context.is_starter]
        requirements: [R-CX-18]
        number_rule: {class: official, source: the public reports named in each row, as_of: the time of each snapshot, link: none_fixed}
        grade_rule: contract
      - key: inspector
        kind: control
        component: inspector
        shows: 'The selected value: its source and as-of time, the hash of the card it belongs to, the simulation and model version behind a prediction, lineage.'
        inputs: {}
    interactions:
      - {action: select, at: view, target: any value opens the inspector}
      - {action: drill_down, at: availability, target: the frozen card of the player, to: player_card}
      - {action: drill_down, at: predictions, target: the simulation rows behind a prediction}
      - {action: drill_down, at: mismatch_map, target: the matchup board of earlier games of the pair, to: matchup_board}
      - {action: drill_down, at: ratings, target: the opponent packet, to: opponent_scouting_packet}
      - {action: inspect_query, at: predictions, target: the rows and the query with metric ids}
      - {action: export, at: view, target: the card as a page, produces: page}
    degraded:
      D1_bug_away: default
      D2_off_main: default
      D3_replay: default
      D4_break: default
      D5_no_video: default
      feed_stale: default
    empty_state: 'Card not frozen yet: "card not frozen: snapshot due at <time>", and the blocks already known, each with its as-of time. No prediction (before P6): the prediction blocks show a dash and "no model before P6".'
    requirements: [R-PR-14, R-CX-18, R-CX-09, R-MD-14, R-MR-03, R-FD-05, R-FD-06, R-FD-08, R-RF-06, R-RF-18, R-MX-06, R-MX-07, R-PR-01, R-PR-02, R-PR-09, R-PR-13, R-MK-07, R-MK-24, R-RG-06, R-VZ-02, R-VZ-03, R-PR-19]
    decisions: [K12]
    depends_on:
      baselines: [movement_grammar, identity_pack, metrics, live_state]
      tables: [pregame_cards, games, venues, team_game_context, ratings_snapshots, availability, player_game_context, game_officials, officials, profile_snapshots, predictions, simulation_runs, rosters, defensive_matchups, run_records]
    phase: P0
    acceptance: [ACC-VW-1, ACC-VW-R1, ACC-VW-N1, ACC-VW-N2, ACC-VW-N3, ACC-VW-S1, ACC-VW-G1, ACC-VW-P1, ACC-VW-P2]
    wireframe: null
    notes: >-
      Version 1 at P0: context, ratings, availability and officials. Mismatch map at P4, prediction blocks at P6.
      The schema has no table for the predicted pairings; the map is drawn from the player-card snapshots and
      earlier matchups until the table pregame_matchups of schema/views_changes.yaml exists. The card is mixed: all
      of it is as known at the snapshot except the mismatch check, which is filled after the game (as of event).
