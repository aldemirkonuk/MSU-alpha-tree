    - {item: 'Stat category TRAT, team ratings', metric_category: TRAT, view: metric_browser}
    - {item: 'Stat category SHOOT, shooting', metric_category: SHOOT, view: metric_browser}
    - {item: 'Stat category SQ, shot quality', metric_category: SQ, view: metric_browser}
    - {item: 'Stat category PASS, playmaking', metric_category: PASS, view: metric_browser}
    - {item: 'Stat category TOV, turnovers and steals', metric_category: TOV, view: metric_browser}
    - {item: 'Stat category REB, rebounding', metric_category: REB, view: metric_browser}
    - {item: 'Stat category FOUL, fouls and free throws', metric_category: FOUL, view: metric_browser}
    - {item: 'Stat category DEF, defense', metric_category: DEF, view: metric_browser}
    - {item: 'Stat category TRN, transition', metric_category: TRN, view: metric_browser}
    - {item: 'Stat category PLAY, play types', metric_category: PLAY, view: metric_browser}
    - {item: 'Stat category SPACE, spacing and off-ball', metric_category: SPACE, view: metric_browser}
    - {item: 'Stat category PHYS, physical', metric_category: PHYS, view: metric_browser}
    - {item: 'Stat category IMP, impact', metric_category: IMP, view: metric_browser}
    - {item: 'Stat category PROF, player profile', metric_category: PROF, view: metric_browser}
    - {item: 'Stat category SIT, situational', metric_category: SIT, view: metric_browser}
    - {item: 'Stat category COACH, coaching', metric_category: COACH, view: metric_browser}
    - {item: 'Stat category MKT, market', metric_category: MKT, view: metric_browser}
    - {item: 'Stat category TREE, decision trees', metric_category: TREE, view: metric_browser}
    # owner inputs
    - {item: 'Owner input: layers from game to player, a tree to walk down', view: studio_game_canvas, element: tree_navigator, component: tree_navigator}
    - {item: 'Owner input: the layered tree on the win-probability chart', req: [R-AS-07], view: win_probability_chart, element: tree, component: tree_navigator}
    - {item: 'Owner input: the layered tree on the post-game report', req: [R-AS-07], view: postgame_report, element: tree, component: tree_navigator}
    - {item: 'Owner input: flag uncertain moments for him to label', view: review_queue}
    - {item: 'Owner input: court geometry in metres and degrees', view: possession_explorer, element: court, component: top_down_court}
    # not views
    - {item: Game-day run book, req: [R-EN-26], out_of_scope: game_day_run_book}
    - {item: Weekly digest, req: [R-RR-09], out_of_scope: weekly_digest}
    - {item: Generated spec pages and stat catalogue pages, out_of_scope: spec_pages}
    - {item: Views catalogue page, req: [R-PR-17], out_of_scope: views_catalogue_page}
    - {item: Requirements tree, out_of_scope: requirements_tree}
    - {item: JEV verification packet, req: [R-HR-18], out_of_scope: jev_verification_packet}
    - {item: Labelling guides, req: [R-HR-15], out_of_scope: labelling_guides}
    - {item: Code and data of the private review tools, out_of_scope: private_review_tools_code}
    - {item: Movement fingerprint profile (goal 9), req: [R-FP-01], future: movement_fingerprint_profile}

# ---------------------------------------------------------------------------------------------------------------------
acceptance:
  - {id: ACC-VW-1, level: lint, runnable_now: true, metric: lint, scope: this pack, threshold: 'tools/specgen/views/vwlib.py --check reports 0 problems', on_fail: spec defect - fix before 0.1.x is accepted, requirement: R-PR-17}
  - {id: ACC-VW-2, level: lint, runnable_now: true, metric: coverage of the inventory, scope: 'the R-VZ and R-AS rows, R-PR-14 to 16, the review screens, the cards and packets, the 10 live-state groups, the registry categories, the platform screens', threshold: 'every one maps to a view, an element, a component, out_of_scope or future_views; every required row is cited by a record', on_fail: add the view or the reason, requirement: R-PR-17}
  - {id: ACC-VW-3, level: lint, runnable_now: true, metric: palette contrast, scope: every pair of text_pairs and graphic_pairs in both themes and every categorical colour on the chart surface, threshold: 'text at least 4.5:1, marks at least 3:1, the stored ratio equals the computed one', on_fail: change the token, requirement: R-VZ-07}
  - {id: ACC-VW-4, level: lint, runnable_now: true, metric: the catalogue pages are current, scope: docs/data/views_catalogue.md and docs/data/views_catalogue_reference.md, threshold: 'tools/specgen/views/gen_doc.py --check passes: both pages equal what the pack generates; every view id, element key, component, contract rule and acceptance id is on them; no placeholder is left; the first page stays under 450 000 bytes', on_fail: run the generator and read the diff, requirement: R-PR-17}
  - {id: ACC-VW-R1, level: render, runnable_now: false, metric: render test, scope: every view; first the ten of R-VZ-06, threshold: 'the view renders from the stored tables of a pilot game with no missing input', on_fail: view or input defect, requirement: R-VZ-06a}
  - {id: ACC-VW-R2, level: render, runnable_now: false, metric: sync, scope: views with video and court, threshold: 'at 100 random instants video frame, court and state panel refer to the same game-clock instant; offset at most 1 frame on a whistle check', on_fail: clock-map or player defect, requirement: R-AS-01}
  - {id: ACC-VW-R3, level: render, runnable_now: false, metric: panel equals the as-of view, scope: the live panel at any instant of a recorded game, threshold: 0 differences from the as_of_known view of the stored truth on the pilot games, on_fail: panel defect, requirement: R-PR-15}
  - {id: ACC-VW-R4, level: render, runnable_now: false, metric: overlay alignment, scope: every overlay, threshold: 'within 0.1 m of its track and within 1 frame of the video', on_fail: overlay defect, requirement: R-VZ-04}
  - {id: ACC-VW-N1, level: audit, runnable_now: false, metric: number-link audit, scope: 20 random numbers per view, threshold: every one clicks through to the right moment, on_fail: link defect, requirement: R-VZ-02}
  - {id: ACC-VW-N2, level: audit, runnable_now: false, metric: number completeness, scope: every number on every view, threshold: 'no number without the parts its class asks for; no estimate below its minimum n drawn on a scale', on_fail: view defect, requirement: R-VZ-03}
  - {id: ACC-VW-N3, level: audit, runnable_now: false, metric: numbers resolve to ids, scope: every number on every view, threshold: '0 numbers defined only in a view; a number equals the value of its metric id from the query layer', on_fail: move the definition to the registry, requirement: R-PR-14}
  - {id: ACC-VW-S1, level: style, runnable_now: false, metric: style check, scope: every rendered view, threshold: 'metric labels only, palette tokens only, text contrast at least 4.5:1, reading views usable at 375 px', on_fail: style defect, requirement: R-VZ-07}
  - {id: ACC-VW-S2, level: style, runnable_now: true, metric: wireframe check, scope: every wireframe of docs/data/views, threshold: 'every wireframe a record names exists, parses, and equals what gen_wireframes.py generates; it labels only element keys of its view, uses only colour tokens of this file, holds no text wider than its box at the stated width and no text below the caption size, names no banned unit and shows no real game data', on_fail: wireframe defect, requirement: R-VZ-07}
  - {id: ACC-VW-G1, level: render, runnable_now: false, metric: grade honesty, scope: a seeded value at each grade on each view, threshold: 'drawn with the appearance of its grade; never a better one; a quarantined value shown nowhere but the review screens', on_fail: view defect, requirement: R-PR-15}
  - {id: ACC-VW-G2, level: render, runnable_now: false, metric: degraded states, scope: a seeded stretch at each level D1-D5 and a stale feed on each view, threshold: 'the view shows what its record says; it is never blank without a reason', on_fail: view defect, requirement: R-PR-15}
  - {id: ACC-VW-I1, level: audit, runnable_now: false, metric: identity display, scope: the live panel and every stat, threshold: '0 provisional or probable labels on a live view; 0 stats that read a probable label', on_fail: view defect, requirement: R-ID-19}
  - {id: ACC-VW-P1, level: audit, runnable_now: false, metric: privacy audit, scope: every export path and every view, threshold: '0 video frames and 0 face crops outside the private store; exports write only what the privacy class allows', on_fail: block the export, requirement: R-PR-19}
  - {id: ACC-VW-P2, level: lint, runnable_now: true, metric: access class, scope: every record, threshold: 'every view has a privacy class and an audience the class allows; no video and no player grain in a shareable or public view', on_fail: spec defect, requirement: R-PR-19}
  - {id: ACC-VW-L1, level: audit, runnable_now: false, metric: latency, scope: every view with a refresh budget, threshold: 'measured and reported per game beside its budget; not a gate (K23)', on_fail: report only, requirement: R-VZ-08}
  - {id: ACC-VW-H1, level: audit, runnable_now: false, metric: half-time box equality, scope: the half-time packet on the 3 pilot games, threshold: '100 % of counting numbers equal the official half-time box; the time from the first-half horn to the page is reported beside its budget', on_fail: packet or fold defect, requirement: R-VZ-08}
  - {id: ACC-VW-B1, level: audit, runnable_now: false, metric: label honesty, scope: every stored label and every review item, threshold: 'every label carries who, when, the guide version, the tool version and the model version; 0 gold items without the confirmation of the owner (decision of 11 Nov 2026); the guess is hidden on 100 % of audit items and blind re-shows until the answer is stored', on_fail: review tool defect, requirement: R-HR-05}
  - {id: ACC-VW-E1, level: render, runnable_now: false, metric: edits are drafts, scope: every edit action, threshold: 'the current state version stays byte-identical until promotion; undo restores the previous version byte for byte', on_fail: Studio defect, requirement: R-AS-03}
  - {id: ACC-VW-Q1, level: render, runnable_now: false, metric: selection to query, scope: every selection, threshold: 'exports its SQL; running it again returns the same rows', on_fail: Studio defect, requirement: R-AS-06}

journal:
  - date: '2026-11-20'
    step: core
    entries:
      - 'Core contract written: eight rules, 13 components, 19 actions, 7 refresh classes, the index of 40 views (1 live, 10 review, 10 studio, 15 report, 4 card), 1 future view, 9 out-of-scope items and an inventory of 116 rows.'
      - 'Number classes added to rule 3 (official, live_state, estimate, model, label, measurement, descriptive). The requirement text "every number with n and interval" cannot hold for a score or a foul count.'
      - 'Refresh classes on_edit and on_run added to the five of the design (Studio edits, platform reports).'
      - 'Three worked records: live_game_state_panel (12 elements, all 94 live-state fields), possession_explorer (14 elements), studio_game_canvas (13 elements).'
      - 'schema/views_changes.yaml seeded with the proposed table clip_index (R-VZ-10): every number link and the clip export read it.'
  - date: '2026-11-20'
    step: views
    entries:
      - 'All 40 records written by three authors: views_live 2 views and 24 elements (the panel grew from 12 to 15 elements: bench board, win-probability and leverage strip, flag feed), views_review 19 views and 172 elements, views_studio 19 views and 173 elements.'
      - 'Screens without an index entry became elements: audit log and live recompute (draft_diff_promote), privacy lane (monitoring_board), identity review and the two private tools (variants of review_item), label counts and gold-set status (review_queue), learning curve (model_bench), latency and invariant breaks (game_processing_report), clip browser, tree and three breakdown tables (postgame_report).'
  - date: '2026-11-20'
    step: doc
    entries:
      - 'Integration. Asked by the authors and applied: grains team-half and coach; refresh classes half_time and on_select; mixed as-of allowed on reports and cards (edge_report and pregame_card are now mixed, 11 elements state their as-of); the FROZEN line of the as-of banner; 18 inventory rows for elements; acceptance tests ACC-VW-H1 (half-time box) and ACC-VW-B1 (label honesty).'
      - 'season_simulation moved from the review surface to the report surface (VW-REV-10 became VW-RPT-16; no id was published before). It has no video and reads at 375 px. The index is now 1 live, 9 review, 10 studio, 16 report, 4 card.'
      - 'The future view lives in one place: future_views of this file now holds what the movement fingerprint profile will read; the copy in views_review.yaml is removed.'
      - 'Lint additions: unknown key in a number_rule block; by_grade for every grade on a live-panel tile; a court names its named-spots layers; wireframe_states; reported requirement rows (R-HR, R-PR-17 to 19) are cited or have a reason.'
      - 'Wireframes: tools/specgen/views/gen_wireframes.py draws 8 wireframes and the grade legend from the records and this file (live panel at D0, D1 and D3, possession explorer, Studio canvas with the inspector open, the layered tree, the review item, the player card). ACC-VW-S2 runs now.'
      - 'Pages: tools/specgen/views/gen_doc.py writes docs/data/views_catalogue.md and docs/data/views_catalogue_reference.md with --check (ACC-VW-4). Two pages because one would pass 500 KiB, where a rendered Markdown page is cut off; the first page is kept under 450 000 bytes by a check.'
      - 'schema/views_changes.yaml completed from the three reports: new tables, column additions and one removal, each with why and requirement id; none applied.'
      - 'Not applied, with the reason: an audience per element (only two elements hold an owner-only line; they say so in their notes); a by_grade rule for views other than the live panel.'
      - 'Court orientation fixed in the contract (visual_standard.court_drawing): overhead, rim at the top. The named-spots picture is a mirrored plot; see OQ-VW-40 and FU-VW-13.'
      - 'Scale stops (cividis, purple-orange) compared again with the published listings from memory; no tool in the test environment can confirm them, so they stay tagged assumed.'

open_questions:
  - id: OQ-VW-1
    topic: reports
    raised_by: core
    question: 'What is the "lineup board" of R-PR-14?'
    recommended: 'Lineup plus-minus with n, stints and composition. The matchup board (who guarded whom) stays a separate view.'
    status: open
  - id: OQ-VW-2
    topic: reports
    raised_by: core
    question: 'What is the "post-game report" of R-PR-14?'
    recommended: 'A container page: box and four factors, win-probability chart, shot chart, lineup board, matchup board, the ten notes, swing plays and a stat-corrections line.'
    status: open
  - id: OQ-VW-3
    topic: live
    raised_by: core
    question: 'Are the foul tracker and timeouts left their own views?'
    recommended: 'No. They are tiles of the one live panel (R-PR-15). Each keeps its own render test.'
    status: open
  - id: OQ-VW-4
    topic: contract
    raised_by: core
    first: true
    question: 'Does the 375 px rule bind the Studio and the film-room views?'
    recommended: 'No. It binds reading views (panel, packets, notes, cards). The Studio and review views are desktop, 1280 px or wider.'
    status: open
  - id: OQ-VW-5
    topic: contract
    raised_by: core
    question: 'What does "clip export" produce?'
    recommended: 'A clip reference and a top-down render. A video file is written only inside the private store.'
    status: open
  - id: OQ-VW-6
    topic: contract
    raised_by: core
    question: 'One interval level on screen or two?'
    recommended: 'Keep both (80 % for shrunk shooting rates, 95 % elsewhere) and print the level beside every interval.'
    status: open
  - id: OQ-VW-7
    topic: studio
    raised_by: core
    question: 'May the Studio show probable identity labels?'
    recommended: 'Yes, on the video and court layers only, flagged "probable", offline. The embedded game-state panel keeps the live rule: locked or HOLD.'
    status: open
  - id: OQ-VW-8
    topic: contract
    raised_by: core
    first: true
    question: 'Dark or light surface for court and charts?'
    recommended: 'Dark in both themes. Four of the eight colour-blind-safe colours fail contrast on white; none fails on the dark surface (measured).'
    status: open
  - id: OQ-VW-9
    topic: studio
    raised_by: core
    question: 'Is the model guess prefilled on every review item?'
    recommended: 'Prefilled on normal items. Hidden on the 10 % audit share and on the 5 % blind re-shows.'
    status: open
  - id: OQ-VW-10
    topic: contract
    raised_by: core
    question: 'Are staff views listed now although staff are excluded?'
    recommended: 'Yes. Audience msu_staff, status excluded until staff respond. Tests run with the owner as viewer.'
    status: open
  - id: OQ-VW-11
    topic: requirement text
    raised_by: core
    question: 'R-PR-17 says the catalogue is one file. This baseline is a pack. Which stands?'
    recommended: 'Keep the pack. Generate one catalogue page from it and check it in CI. Ask the requirements keeper to adjust the wording.'
    status: open
  - id: OQ-VW-12
    topic: requirement text
    raised_by: core
    first: true
    question: 'R-VZ-03 says no number without n and interval. A score has neither. Accept number classes?'
    recommended: 'Yes. Accept the seven number classes of rule 3. Read the R-VZ-03 test as: no estimate without n and interval, no official value without source and as-of.'
    status: open
  - id: OQ-VW-13
    topic: live
    raised_by: core
    first: true
    question: 'Should the live win-probability tile be drawn before the model exists?'
    recommended: 'No. The tile shows a dash with "no model before P6" (R-PR-09). No wireframe shows a made-up live probability as if it existed.'
    status: open
  - id: OQ-VW-14
    topic: live
    raised_by: live
    first: true
    question: 'K12 asks n of at least 30 before a rate is drawn. One half rarely gives 30 cases, yet R-VZ-08 asks the four factors at the half. Which rule wins on the half-time packet?'
    recommended: 'Show the half rates as descriptive: the counts, the rate, the word "descriptive", no interval. Do not blank them as "too few".'
    status: open
  - id: OQ-VW-15
    topic: live
    raised_by: live
    question: 'Which foul-trouble flag goes on the half-time packet?'
    recommended: 'The cut-off of the first second of the second half, with the plain 2 and 4 foul counts beside it. K10 has no cut-off for the last 300 s of the first half; that stays open in the live-state pack.'
    status: open
  - id: OQ-VW-16
    topic: live
    raised_by: live
    question: 'What is the "value change" that ranks the top 3 possessions of R-VZ-08?'
    recommended: 'The total value credit of the possession (M-IMP-065), ranked by size, with its sign printed.'
    status: open
  - id: OQ-VW-17
    topic: live
    raised_by: live
    question: 'What planning time does the half-time packet get?'
    recommended: '300 s after the horn, a third of the 900 s intermission. Reported, not a gate (K23).'
    status: open
  - id: OQ-VW-18
    topic: live
    raised_by: live
    question: 'May MSU staff see the live flag feed?'
    recommended: 'Yes. It tells them what not to trust. Labelling stays with the owner, after the game.'
    status: open
  - id: OQ-VW-19
    topic: live
    raised_by: live
    question: 'The four factors of the packet carry a season-to-date column, frozen before tip. Keep it?'
    recommended: 'Keep it. It is the only estimate on the page, and the half is never coloured against it.'
    status: open
  - id: OQ-VW-20
    topic: reports
    raised_by: review
    question: 'R-OS-03 asks how the opponent defended our sets when other teams ran them. R-OS-05 says those games are not recorded. What does the scouting packet show?'
    recommended: 'Build that section only from the opponent''s games against Michigan State, and say so on the page.'
    status: open
  - id: OQ-VW-21
    topic: reports
    raised_by: review
    question: 'The notes sheet asks for ten findings. What if fewer pass their checks?'
    recommended: 'Show fewer, with "n of 10". Never pad.'
    status: open
  - id: OQ-VW-22
    topic: reports
    raised_by: review
    question: 'Is a public cut of the pitch package wanted as its own view?'
    recommended: 'No. The calibration page and the gated drawings serve a public reader.'
    status: open
  - id: OQ-VW-23
    topic: reports
    raised_by: review
    question: 'May a freeze-frame drawing with player numbers go public?'
    recommended: 'Only through the rights gate, with locked identities only. Staff-only by default.'
    status: open
  - id: OQ-VW-24
    topic: reports
    raised_by: review
    question: 'Do market prices appear on staff views such as the win-probability chart and the pre-game card?'
    recommended: 'No. Prices are on the edge report only, which the owner alone sees (R-MK-24).'
    status: open
  - id: OQ-VW-25
    topic: reports
    raised_by: review
    question: 'Heat maps bin positions in 0.25 m cells; the position error limit is 0.5 m. Keep the finer cell?'
    recommended: 'Keep 0.25 m and print the share of seconds that could be binned.'
    status: open
  - id: OQ-VW-26
    topic: reports
    raised_by: review
    question: 'The owner''s private availability notes sit on cards that staff may see. Who sees the note?'
    recommended: 'The owner alone. The line is marked private and is left off every export.'
    status: open
  - id: OQ-VW-27
    topic: reports
    raised_by: review
    question: 'The coach card leaves off timeout purpose (R-CC-07) and sideline reactions (R-CC-04) until staff respond. Agreed?'
    recommended: 'Yes. Both need staff input; the card says "not collected".'
    status: open
  - id: OQ-VW-28
    topic: studio
    raised_by: studio
    question: 'Should the review screens print a probable name in a table row?'
    recommended: 'No. Read it on the clip and court layers, flagged. Revisit if reviewing probable runs proves slow.'
    status: open
  - id: OQ-VW-29
    topic: requirement text
    raised_by: studio
    first: true
    question: 'R-AS-03 lets the Studio relabel an identity. R-ID-17 says a locked label never swaps. Which stands?'
    recommended: 'Both: a relabel is an offline correction row in the switch log plus a draft version. Nothing changes in place.'
    status: open
  - id: OQ-VW-30
    topic: requirement text
    raised_by: studio
    first: true
    question: 'R-HR-20 says a run with JEV off is byte-identical. JEV disputes join the review queue. Is that a conflict?'
    recommended: 'Say in the requirement that the review queue is not a pipeline output under R-HR-20. If not, keep JEV disputes in their own table.'
    status: open
  - id: OQ-VW-31
    topic: studio
    raised_by: studio
    question: 'Should the model card have a public edition?'
    recommended: 'Later, through the rights gate, without source detail or clip links. Owner-only now.'
    status: open
  - id: OQ-VW-32
    topic: studio
    raised_by: studio
    question: 'May Claude sessions open and amend drafts in the Studio?'
    recommended: 'Yes. Only the owner promotes a draft.'
    status: open
  - id: OQ-VW-33
    topic: studio
    raised_by: studio
    question: 'Coach quiz: hide the court and the system''s answer until the coach has answered?'
    recommended: 'Yes.'
    status: open
  - id: OQ-VW-34
    topic: studio
    raised_by: studio
    question: 'Can an alert on the monitoring board be closed by hand?'
    recommended: 'No. An alert closes when its rule clears.'
    status: open
  - id: OQ-VW-35
    topic: studio
    raised_by: studio
    question: 'Is 30 labels the line under which a label class counts as thin?'
    recommended: 'Yes (K12 reused), until the learning curve gives a number per label type.'
    status: open
  - id: OQ-VW-36
    topic: contract
    raised_by: doc
    question: 'The wireframes are drawn in the dark theme only. Enough for now?'
    recommended: 'Yes. The tokens of both themes are in the contract and checked; a light set is drawn when a product screen is designed.'
    status: open
  - id: OQ-VW-37
    topic: contract
    raised_by: doc
    question: 'The layered-tree wireframe shows a post-game win-probability curve with made-up numbers, although no model exists before P6. Acceptable?'
    recommended: 'Yes. It is marked made-up and "from P6". The live tile still shows a dash until the model exists (OQ-VW-13).'
    status: open
  - id: OQ-VW-38
    topic: requirement text
    raised_by: doc
    question: 'Pipeline quality scores (HOTA, IDF1, identity accuracy, kappa) have no id in the metric registry, so rule 8 cannot bind them. Add them?'
    recommended: 'Yes: a registry category for pipeline quality, added by the registry owner. Until then the views name them by requirement id.'
    status: open
  - id: OQ-VW-39
    topic: contract
    raised_by: doc
    question: 'Should an element be able to narrow the audience of its view (an owner-only line inside a staff card)?'
    recommended: 'Not yet. Two elements need it and say so in their notes. Add the key when a third case appears.'
    status: open
  - id: OQ-VW-40
    topic: contract
    raised_by: doc
    first: true
    question: 'Which way up is a court drawn? The named-spots picture has the rim at the bottom with +x on the right. That is the mirror image of what a camera above the floor sees.'
    recommended: 'Overhead: rim at the top, the attacker''s right on the right. Every court of the wireframes is drawn so. Coordinates and ids do not change; the named-spots picture is redrawn or labelled as a mirrored plot (FU-VW-13).'
    status: open

