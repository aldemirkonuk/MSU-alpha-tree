# Proposed complete NCAA men's court constants, metres, 2026-27 rules book.
# Status: PROPOSAL (2026-10-18). Does NOT replace config/court_ncaa_men.yaml (left untouched); see
# docs/data/court_constants_check.md for the check of every existing value and the derivations.
# Source: docs/rules/PRMBB_RulesBook.pdf Rule 1 (pdf 21-31, printed 18-28), court diagrams (pdf 18-19, printed 15-16),
# restricted-area illustration (pdf 20, printed 17). 1 ft = 0.3048 m, 1 in = 0.0254 m (exact).
# Frame for *_y_m / *_x_m: origin on the floor under the rim centre; x along end line; y toward half court.
# Edge convention: each value says which edge (inner/outer/centre) it measures, as the book does.

