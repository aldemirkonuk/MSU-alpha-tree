planned_work:
- id: PW-1
  lever: 60 fps recordings
  why: 'Coverage lever (OD-8): twice the frames per jersey sighting window and less motion blur raise jersey_sightings_per_s; the zero-swap bar stays.'
  measure: re-run the harness with a 60 fps cue profile once MSU 60 fps footage gives a measured read rate (OQ-3)
- id: PW-2
  lever: more jersey reads (OCR on front and back, partial digits, more crops per sighting)
  why: 'Coverage lever (OD-8): jersey sightings are the only cue that separates same-build teammates (twin rule) and the main driver of re-confirmation after crossings.'
  measure: jersey read rate and OCR error on the first labelled MSU game (OQ-3), then the harness coverage at the measured rate
- id: PW-3
  lever: better position precision during encounters
  why: 'Coverage falls with sigma_p (section 1); two players closer than about 4 sigma cannot be kept apart by motion.'
  measure: 'pairwise position noise on MSU film (metric pairwise_sigma_p): standard deviation of (tracked minus hand-clicked foot point) differences between two players within 3 m, per frame. The identity layer needs <= 0.30 m (ACC-R2); at 0.50 m it labels about a quarter of the boxes and at 0.75 m under a tenth'
- id: PW-4
  lever: per-game self-supervised re-ID fine-tuning from pure tracklets
  why: 'Coverage lever: positives inside one tracklet, negatives from tracklets visible at the same time; the SoccerNet 2023 tracking winner (Maglo et al.) reached HOTA 75.61 against 69.54 this way. It needs no identity labels and no forbidden cue.'
  measure: 'single-crop rank-1 among on-court teammates before and after fine-tuning on the first labelled MSU game (OQ-7), then the harness coverage at the measured rank-1'

review_round_1:
- id: RV-01
  finding: 'Cutting both tracklets at every frame of a close encounter (pair-swap test) made 1.6 tracklets per frame: a defender 1 m from his man restarted his identity every frame, and every child had dozens of parents.'
  fix: Encounter groups - a failing track continues as an unlabelled amb segment and leaves the group as one clean tracklet with explicit parents after clear_s.
  evidence: 'SportVU game G1, first 5 min, sigma_p 0.3: 12,054 tracklets -> 3,117; offline coverage 0.00 -> 0.48.'
- id: RV-02
  finding: 'Hidden-person swaps: a track whose own box is missing takes the box of a teammate who was hidden behind someone (no active track, so no pair test); clean tracklets were impure at their edges.'
  fix: Jump test, contested-detection likelihood test (contest_s, v_err_mps, a_max_mps2, contest_prior_nats), newcomer test, leading and trailing guards, decision delay of clear_s. A first, radius-based contest test was rejected (it left 50-60 % of boxes in amb segments).
  evidence: 'Impure clean tracklets (5 min, sigma_p 0.15 / 0.3): 144 -> 2 / 1; full-game offline swap events fell from 6-10 per game to 1-8 before RV-05.'
- id: RV-03
  finding: Opponent pairs (most close encounters - a defender on his man) were cut like teammates, leaving about 40 % of boxes on HOLD at sigma_p 0.3.
  fix: Opponent pairs with confident, different classes are not cut; team colour separates them, with a colour veto in the pair test, a per-box colour HOLD (confidence rule f) and a live class alarm (class_window_s); every encounter stays a split point.
  evidence: 5 min, sigma_p 0.3, offline coverage 0.48 -> 0.56; the colour HOLD removed the 1-2 frame opponent tails that were the last full-game swaps.
- id: RV-04
  finding: SportVU itself re-assigns player ids at some substitutions without a wall-clock gap (players teleport 6 m in 0.04 s); the harness scored the source's own swap.
  fix: sportvu_truth marks a gap (camera cut) where the on-court set changes or any player moves more than 1 m in one frame.
  evidence: 'Game G1 one substitution: players 0, 5, 8 exchange positions; gaps 105 -> 123.'
- id: RV-05
  finding: 'A group child inherited a parent''s label when a teammate hidden for longer than link_window_s stepped out of the encounter (the true identity was not in the group); with leak 0.02 the prior alone almost locked.'
  fix: Adaptive leak (leak_min + leak_eps x unseen candidates / candidates) and the own-cue support rule (own_margin_nats - priors can speed a lock, never decide it).
  evidence: 'Full games, sigma_p 0.15-0.5: pure-chain mislabels of 4-46 frames disappeared; a tolerance version (own cues may disagree by 1 nat) still let one through.'
- id: RV-06
  finding: 'One confusable misread (8 read as 3, 7 read as 80) locked a label: a single sighting carried about 4-7 nats.'
  fix: sighting_cap_nats 4 for locking (two agreeing sightings needed); uncapped sightings for the offline change-point test, where more evidence only adds splits.
  evidence: Full game G1, sigma_p 0.15 - chain labelled 16 for player 20 from one confusable read.
- id: RV-07
  finding: Same-team same-build pairs (the twins hard case) swapped on appearance alone, because template noise biases the appearance evidence the same way every frame.
  fix: Per-game confusable pairs from the reference pack (confusable_rate) - a lock against a confusable teammate needs twin_jersey_nats (5) of own jersey evidence.
  evidence: 'Game G3, sigma_p 0.3: twin 0 labelled 3 for 46 frames offline -> 0.'
- id: RV-08
  finding: When an offline split had equally good candidate points (no evidence between them), the first was taken and the frames up to the true swap were mislabelled.
  fix: Every point within split_tie_nats of the best is equally plausible; the stretch between them stays unlabelled.
  evidence: test_injected_tracker_swap_is_split_offline.
- id: RV-09
  finding: Offline labels used only forward information (parents to children); a chain confirmed late could not help its parents.
  fix: Offline forward and backward identity messages through the chain graph (directional_mixtures), each using only its own direction so no cue is counted twice.
  evidence: '5 min, sigma_p 0.15: offline coverage 0.48 -> 0.71 before the safety rules of RV-05 to RV-07 (which brought it back to about 0.6).'
- id: RV-10
  finding: Catching swaps after the fact does not replace prevention.
  fix: Kept as a harness config (naive_tracklets_full_catch) and stated in the doc; alarms and splits are the safety net, not the mechanism.
  evidence: See section 1 results.

review_round_2:
- id: RV-11
  finding: 'ACC-H1 (0 offline swaps at sigma_p 0.15 and 0.30 m) held for seed 1 only: the harness ran one random draw per game (--seeds 1), and three games give 8.9-11.4 labelled player-hours, which bound the rate at 0.76 swap events per 40-minute game, not at zero. With seeds 1-5 the unchanged 0.1.1 rules make 1 offline swap event at 0.15 m and 4 at 0.30 m (5 of 30 game-runs; live 0 and 6).'
  fix: 'harness.params.seeds 5 is the default of --seeds. ACC-H1 covers seeds 1-5 and every game-run; a zero on fewer runs is not a pass. Every summary row carries its exposure (game-runs, minutes, labelled player-hours, crossings, chains) and the one-sided 95 % upper bound on the swap rate per labelled player-hour, per crossing and per 40-minute game (metric swap_rate_bound, metrics.exposure, params bound_confidence, game_minutes). The page computes the ACC-H1 verdict from the results (met / NOT met / not evaluated) and never prints "met" on an incomplete run.'
  evidence: 'Gate before any edit (gates/baseline.json; 3 games x seeds 1-5 x 0.15 / 0.30 m, config full, good, 783 min of play per noise level): offline swap events 1 / 4 (G3 0.15 seed 3; G1 0.30 seeds 2 and 4, G2 0.30 seed 3, G3 0.30 seed 4), live 0 / 6, wrong frames 1 / 7 offline; coverage offline 0.607 / 0.460, live 0.380 / 0.272; IDF1 0.678 / 0.560; re-confirm median 1.16 / 2.2 s; invariants 0. Offline exposure 58.5 / 44.4 labelled player-hours, 25,580 crossings: 0.05 / 0.20 events per game, upper bounds 0.24 / 0.47 per game. Tests test_seeds_default_is_five_and_acc_h1_covers_every_seed, test_zero_swaps_is_reported_with_exposure_and_an_upper_bound, test_full_config_has_no_swaps_seed2 (strict xfail until the assigner batches clear it), test_harness_rows_carry_exposure_mechanisms_and_cue_stats.'
- id: RV-12
  finding: 'Truth-leak audit of the simulator (14 paths): the lineup feed was never wrong (true changes within -1 to 4 s), every overlap was either dropped or flagged with no cue, the assigner was told sigma_p exactly, each team had exactly one look-alike pair and every other pair far apart, appearance error decorrelated in 0.4 s, and nobody in team kit was in view except the ten players.'
  fix: 'Each case is now an option of the cue profile (harness.cue_profile_options), off by default and drawn from a side random stream: pbp_late_share / pbp_missing_share / pbp_wrong_player_share (lineup rows), p_overlap_unflagged (the near player''s colour, number and appearance inside the far player''s box), sigma_told_range, twin_delta with twin_pairs_per_team (graded look-alikes), app_slow_noise (error lasting 10 s), bystanders_per_team (same-kit non-player just inside the far sideline; any label on him is a swap). New profile hard switches them all on with stated assumptions; acceptance ACC-H3; metric swap_mechanism attributes every swap event (metrics.swap_mechanisms). No assigner rule changed.'
  evidence: 'Stored profiles reproduce bit for bit: simulator fingerprint equal to the 0.1.1 code (test_stored_profiles_reproduce_bit_for_bit) and the gate after the change (gates/after_H.json) equal to gates/baseline.json in every field of all 60 rows. Hard gate (gates/after_H_hard.json = baseline_hard.json; seeds 1-5, 783 min per noise level; lineup rows 1,180, of which 353 late, 52 missing, 50 wrong player): offline swap events 965 / 801 at 0.15 / 0.30 m in 15 / 15 of 15 game-runs (live 843 / 688), 49 / 41 per 40-minute game; by mechanism lineup_wrong 550 / 483, same_kit_non_player 116 / 123, colour_run 112 / 73, jersey_misread 84 / 52, overlap_unflagged 51 / 40, official 29 / 18, other 23 / 12; 138 / 89 events labelled a player of the other team (R-ID-08). Coverage offline 0.487 / 0.374, live 0.284 / 0.208; IDF1 0.578 / 0.475; re-confirm median 1.56 / 2.4 s; invariants 0; probable-tier error rate 4.3 / 5.1 %. Single options on good, 3 games x 15 min: every lineup row late by 10-30 s (0.15 m) 16 offline / 10 live events, all lineup_wrong. Tests test_lineup_rows_can_be_late_missing_or_wrong, test_unflagged_overlap_carries_the_near_players_cues, test_same_kit_non_player_is_in_view_and_not_on_the_roster, test_sigma_told_factor_and_graded_lookalikes, test_swap_mechanism_attribution, test_hard_profile_switches_every_option_on_and_options_are_documented.'
- id: RV-13
  finding: 'Leak L2: boxes inside a frame reached the assigner sorted by true roster index (officials last). Wherever a tie is broken by position in the list (forced labelling), the order carried identity.'
  fix: 'harness.params.shuffle_box_order (true): the simulator shuffles the boxes of every frame with a side random stream. False gives the 0.1.1 order.'
  evidence: 'G1, 15 min, 0.30 m, seed 2: config full gives the same label on every box with and without the shuffle (live and offline); full_forced live 655 -> 656 swap events, offline unchanged. The whole good gate is unchanged (RV-12). Test test_box_order_is_shuffled_and_the_spec_does_not_depend_on_it.'
- id: RV-14
  finding: 'Team-colour errors were independent per frame at 1 % (good), a third of the published per-crop error (3.4-4.4 %; Vats 2021, PRTreID 2024), while real errors cluster on overlapped crops. With runs of opponent colour the unchanged rules label a player as an opponent (RV-03 does not hold under runs).'
  fix: 'Simulator only in this batch: team_burst_per_s, team_burst_len_s, team_burst_hit (a player reads as the opponent for 0.4-1.5 s; an official or bystander reads as a team); hard uses them with e_team 0.03, the YAML''s own planning value. The rule that stops a chain entering the wrong team''s problem is left to the assigner batch.'
  evidence: 'good plus team_burst_per_s 0.02 only (1.5 % of frames), 3 games x 15 min, 0.30 m: 4 live and 4 offline swap events, all labelled as a player of the other team (the published-evidence lens measured 5 / 5 on 3 x 12 min). Hard gate: colour_run 112 / 73 offline events (RV-12). A plain synthetic scene (1-2 s of opponent colour on a standing player, also right after a cut) did not reproduce it; the harness does. Test test_colour_errors_come_in_runs.'
- id: RV-15
  finding: 'Two reads of one chain more than sighting_gap_s 0.2 s apart count as independent sightings, and two capped sightings lock. Published tracklet accuracy after voting over about 19 s is 79-93 % (Koshkina and Elder 2024; SoccerNet 2023), so misreads persist; the simulator never repeated a read outcome.'
  fix: 'Simulator only in this batch: p_repeat with repeat_gap_s (the same view interrupted and resumed, outcome repeated) and p_misread_persist with misread_persist_s (the same wrong number at the next sighting). The sighting-independence rule is left to the assigner batch; OQ-3 lists the repeat rate as a first measurement.'
  evidence: 'Synthetic (team colour and jersey only): number 23 read as 11 twice, 0.3 s apart, labels the player as the teammate who wears 11 on 211 boxes live and 301 offline (test_repeated_misread_within_one_view_never_locks, strict xfail for the assigner batch). good plus p_trunc 0.10, p_partial 0.10, p_repeat 0.5, 3 games x 15 min, 0.30 m: 3 live / 2 offline swap events, all jersey_misread. Hard gate: jersey_misread 84 / 52 offline events. Test test_truncated_and_persistent_jersey_misreads.'
- id: RV-16
  finding: 'The main published jersey confusion, a two-digit number read as a full one-digit number (Koshkina and Elder 2024, sec 3.4.4), was missing from the simulator (a half-hidden number was always flagged partial) and from the likelihood (such a read counts 7.5 nats against the truth). 28 of the 44 two-digit players of the three harness rosters have a digit that is a teammate''s number (count of the published-evidence lens).'
  fix: 'Simulator only in this batch: p_trunc (hard: 0.10 with p_partial 0.10). The truncation term of the likelihood and the hard case are left to the assigner batch; OQ-3 lists the truncation rate.'
  evidence: 'Synthetic (team colour and jersey only): two full reads 3 on the chain of 23 while number 3 is on the floor label him 3 on 203 boxes live and 301 offline (test_truncated_read_never_locks_the_one_digit_teammate, strict xfail for the assigner batch). Harness numbers under RV-15.'
- id: RV-17
  finding: 'Appearance, not the jersey, carries most of the harness coverage, and the good profile implies a single-crop rank-1 of 0.90 among on-court teammates: the level of the best published re-ID on unmasked crops (PRTreID 89.6 %, SoccerNet 91.3 %), which may use the skin and head cues this pack forbids. No number exists for skin-masked crops, so the coverage quoted for good video is an upper estimate.'
  fix: 'metrics.cue_stats measures what a profile assumes in literature units and the page prints it per profile (section 14). New profile masked_app (rank-1 about 0.73, assigner kappa_app 14.7). OQ-7 and the gold-sample plan ask for the rank-1 measurement before any tuning; PW-4 records self-supervised re-ID fine-tuning from pure tracklets as a lever.'
  evidence: 'Measured on the simulated detections (30 runs): good rank-1 0.908 (look-alike pairs 0.839), hard 0.762. masked_app, 3 games x 15 min, 0.30 m, seed 1: rank-1 0.739, coverage offline 0.464 -> 0.384, live 0.273 -> 0.203, 0 swap events (the lens measured 0.470 -> 0.405 on 3 x 12 min). Test test_cue_stats_are_in_literature_units.'
- id: RV-18
  finding: 'The good profile gives a jersey read in almost every 6 s of visibility (6.5 % of 6.37 s windows without a read; 9.6 % of player boxes legible), while hockey broadcast at 720p shows no number in 50.4 % of 6.4 s tracklets and 5.9 % of images are legible. The e_ocr rationale mixed per-read and tracklet accuracy and named a source that is not in the pack.'
  fix: 'New profile lit_jersey (0.16 sighting starts per second, 0.2-0.9 s, e_ocr 0.10, assigner told 0.10). e_ocr rationale rewritten with the published per-crop and tracklet numbers; the unknown source removed. OQ-3 lists what to measure on the first labelled MSU game; the page prints the same statistics per profile.'
  evidence: 'lit_jersey, 3 games x 15 min, 0.30 m, seed 1: 5.5 % of player boxes legible, 45 % of windows without a read; coverage offline 0.464 -> 0.430, live 0.273 -> 0.237; 1 offline swap event (15 boxes), 0 live (the lens measured 0.470 -> 0.430 and 0 swaps on 3 x 12 min). Test test_cue_stats_are_in_literature_units.'
- id: RV-19
  finding: 'The sigma_p grid (0.15 / 0.30 / 0.50 m) had no citation and no definition. Published absolute errors of broadcast tracking start at 0.44 m (soccer; Crang et al. 2025) and basketball court registration at 1.27 m RMS (KaliCalib); just above the grid the pack labels almost nothing.'
  fix: 'conventions.terms defines sigma_p as the part of the position error not shared with neighbours. Grid extended to 0.75 m as a stress row with noise_grid_note. Metric pairwise_sigma_p, acceptance ACC-R2 (<= 0.30 m, proposal), PW-3 measure rewritten, two sources added with the caveat that they are upper bounds.'
  evidence: 'good, config full, 3 games x 15 min, seed 1, sigma_p 0.75 m: coverage offline 0.086, live 0.040, 1 swap event each (the lens measured 0.087 / 0.041 on 3 x 12 min). Test test_review_round_2_recorded.'
- id: RV-20
  finding: 'The stored results were stamped spec 0.1.0 under a 0.1.1 page and nothing compared them. Three sentences of the page said more than the table (cue coverage "without adding swaps" from one cell; invariants "over every config" without naive_tracker and after the duplicate guard; "ACC-H1: met"). Simulator constants lived in the code although the YAML is the single source of truth.'
  fix: 'harness.py writes the spec version, the YAML sha256 and a parameter hash (parameters, cue profiles, configs; prose excluded) with every run and row; the page prints them and marks the results stale when the hash differs. The cue sentence lists swaps at every noise level and both modes; the invariant sentence covers every config and gives the duplicate-guard count; an acceptance table gives a harness verdict per ACC row; minutes use the dt of the results. Twenty-one simulator and metric constants moved to harness.params (position noise mix, occlusion run length, sighting distance and blur factors, misread shares, reference noises, look-alike deltas, teleport, crossing and re-confirm definitions, calibration bins). Left as literals: referee paths, height-outlier shape, the 1 s merge gap and the 3 s context window (open item AI-3).'
  evidence: 'results/identity_test/sportvu_harness.json reads spec_version 0.1.0; a preview of the page on it prints "stale" and "ACC-H1: not evaluated (6 of 30 game-runs)". Fingerprint and gate unchanged after moving the constants (RV-12). Tests test_results_carry_spec_version_and_hashes, test_param_names_unique_and_read_by_code.'
- id: RV-21
  finding: 'Simulation optimism ranked by measured effect on the unchanged rules (statistics lens, 90 min of play, 0.15 m, offline swap events): colour errors in runs 3-153, late lineup rows 4-30, truncated and repeated jersey reads 1-24, appearance error lasting 10-60 s 6-7, cue parameters refitted to the simulated world 1 (6 live), sigma_p told 1.5 x 1. The assigner is about four times less confident than the simulated world, and that hidden margin, not calibration, protects the result; the posterior is 3 to 50 times under-confident and the calibration table cannot fail.'
  fix: 'The ranking sets the hard profile (RV-12) and the paragraph harness.cannot_show, printed on the page as "What this harness cannot show". No parameter of the assigner changed.'
  evidence: 'Statistics lens notes (sections 3 and 4) and their outputs; my own runs of the three top-ranked options reproduce the direction and size (RV-12, RV-14, RV-15). Not reproduced here: the refit and calibration tables (they need the lens''s patched assigner).'
