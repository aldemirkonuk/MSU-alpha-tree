pack: identity_pack
version: 0.1.1
date: '2026-10-25'
owner: Mac session for Aldemir
status: proposal under the build freeze (baseline 3 of 8). Every numeric value is an engineering proposal until measured on MSU film; the harness numbers below come from simulated cues on real NBA SportVU motion.
scope: >-
  Player identity layer: the per-player reference pack, the cues it holds, the identity state machine (enter, lock, hold
  through occlusion, re-confirm after every crossing, release on exit), the assignment method, confidence and abstention,
  hard cases, outputs, metrics and acceptance tests. It sits between the multi-object tracker (anonymous boxes) and every
  downstream label (named spots, movement grammar, live state). It is the implementation of requirements section
  "Player identity and appearance layer" and of the tracking-quality lines (ID switches, HOTA, identity accuracy per
  player per game).
requirement:
  owner_rule: 'Aldemir, 23 Oct 2026: "we cannot allow ID swap". Lock a player''s identity when he enters the frame, keep it through occlusions, release it only when he leaves the frame; when re-acquisition could fail, use measurements (jersey number, team colour, build/height, gait/posture) so re-labelling is exact.'
  reading: >-
    Zero ID swaps means zero committed wrong labels: a detection may carry a player id only when the evidence makes that id
    near certain; otherwise it carries HOLD (a candidate set) and no id. An abstention is a coverage loss, never a swap.
    Coverage is maximised subject to the zero-swap constraint, not traded against it.
  zero_swaps: 'Owner decision 25 Oct 2026 (OD-8): zero swaps stays absolute for locked labels. Coverage is raised by planned work (planned_work), never by lowering p_lock; a separately flagged probable tier (assignment rule, offline only) may show more boxes to viewers but never feeds stats.'
  recording_standard:
    rule: 'Owner decision 25 Oct 2026 (OD-9): any game that feeds player-level numbers must be recorded at >= 1080p and >= 60 fps (59.94). Below that standard the game feeds team-level numbers only, or its player labels are shown probable-only (no locked labels, no player-level stats).'
    min_resolution: 1080p
    min_fps: 59.94
    below_standard: team-level numbers only, or probable-only player labels (flagged, viewer-only)
    why: 'harness: on poor video (720p, dim, blur) locked coverage falls to 2-12 % of player boxes and an assigner not refitted for it swaps (profile poor_uncalibrated); 60 fps doubles jersey-read chances and halves motion blur (cues.jersey validity)'
    acceptance: ACC-R1
  docs_requirements: docs/requirements.md lines 132-180 (identity layer), 742 (no face recognition), 801 (flag low identity confidence), 911-912 (HOTA, ID switches, identity accuracy)
implementation: tools/specgen/identity/ (idlib.py reference assigner and metrics, obsmodel.py cue simulator, sportvu_truth.py, harness.py, gen_doc.py). Every param below is read at import; this file is the single source of truth.
tests: tests/identity/ (synthetic rule tests for every state-machine rule and hard case; spec-schema checks; a SportVU smoke test that skips when the private data is absent)
doc: docs/data/identity_pack.md (generated by tools/specgen/identity/gen_doc.py; do not edit by hand)
production_only_params: [review_hold_s, calibration_slack, candidate_min_p, height_min_frames, lineup_check_interval_s, merged_box_iou, min_readable_px, ocr_min_score, template_min_crops]
production_only_note: these parameters act on pixels, OCR scores, crop banks or gold-sample evaluation; the SportVU harness has no pixels, so the reference assigner does not read them (a spec test checks that every other parameter is read by the code).

conventions:
  units: metres, seconds, radians only inside code; degrees in prose; probabilities in [0, 1]; log-likelihoods in nats
  frame: absolute court frame of the tracker (metres, origin at a court corner). Identity does not depend on the attacked-rim frame of config/named_spots.yaml.
  time_base: production 29.97 or 59.94 fps; the SportVU harness runs at 25 Hz. Every duration is written in seconds and converted with the source dt (frames = round(seconds / dt)).
  terms:
    detection: one person box on the floor in one frame, with its cue observations; no id
    tracklet: detections linked by motion only, cut at every ambiguity, so a tracklet never contains two people (purity by construction)
    chain: tracklets joined by unambiguous continuations (single parent, single child, nobody else in reach); the unit that carries one identity
    group: the set of chains that ended together in an ambiguity (crossing, merge, pile-up); its members' identities pass to its children as a mixture prior
    label: a roster player id (season roster, per game); HOLD = no label, with a candidate set
    lock: the state of a chain whose label posterior reached p_lock; it keeps the label until release or a swap alarm
    swap: a committed label on a detection of a different person (or of a non-player); the quantity that must be zero
  probability_model: >-
    Cue observations are treated as independent given the identity, each tempered by a factor tau <= 1 for unmodelled
    correlation between frames; the label posterior of a chain is computed jointly with every other visible chain of the
    same team under the one-person-one-label constraint (exact enumeration over the on-court candidates).

standing_constraints:
- No face data of any kind (no face crops, face embeddings or face recognition), requirements line 742.
- 'No race or ethnicity proxies: skin tone, hair colour and hair texture are not cues and are masked out of appearance crops (torso and legs only, skin pixels removed).'
- No private health data; injury or bandage status only from public reports, and tape/sleeves are appearance cues, not health labels.
- Player data limited to public information (roster, listed height, number) and what the broadcast shows.
- Generated or synthetic studio images (Nano Banana idea) are not identity references; they may only augment the team-colour classifier.
forbidden_cues: [face, face_embedding, skin_tone, hair_colour, hair_texture, ethnicity, race, health_status, tattoos]

research:
  summary: >-
    Commercial in-arena systems (SportVU, Second Spectrum, Hawk-Eye) do not publish their identity methods; what is
    public is that optical tracking still relies on human operators to correct identities after close encounters, and
    that the academic broadcast pipelines combine tracklets that are pure by construction, team colour, rarely visible
    jersey numbers voted over tracklets, and a mutual-exclusion constraint (one player at most once per frame). We adopt
    all four, add the play-by-play lineup as a hard candidate constraint, make the re-confirmation after occlusions
    explicit (frame matching before and after), and add abstention so that no label is committed without evidence.
  sources:
  - {ref: 'Lu, Ting, Murphy, Little. Identifying Players in Broadcast Sports Videos using Conditional Random Fields. CVPR 2011.', url: 'https://www.cs.ubc.ca/~murphyk/Papers/cvpr2011-camera.pdf', supports: 'broadcast NBA, faces about 15x15 px and numbers rarely visible; tracklets + appearance (colour, SIFT, MSER) + CRF with mutual-exclusion edges (a player appears once per frame); up to 85 % identification accuracy. Our joint per-frame posterior is the same exclusion idea solved exactly.'}
  - {ref: 'Muller, Manger, Metzler. Recognition of Soccer Players after Occlusions using Temporal Color Signatures. IPCV 2011 (Fraunhofer IOSB).', url: 'https://publica-rest.fraunhofer.de/server/api/core/bitstreams/bf9096de-423b-4131-a081-7372ab0c5daa/content', supports: 'human operators correct tracker output after close encounters; merge-and-split handling re-assigns identities with appearance signatures gathered over many frames. Their cues include skin and hair colour, which we exclude (standing constraint).'}
  - {ref: 'Hayashi et al. BasketLiDAR: LiDAR-camera multimodal dataset for professional basketball MOT. arXiv 2508.15299, 2025.', url: 'https://arxiv.org/abs/2508.15299', supports: 'occlusion sessions detected from the drop and return of the active-ID count; for each, the clearest frame before and after is searched and pre/post appearance features are matched (cosine) to restore IDs; this is our frame matching across occlusions (group -> children).'}
  - {ref: 'Somers et al. SoccerNet Game State Reconstruction. CVPRW 2024, arXiv 2404.11335.', url: 'https://arxiv.org/html/2404.11335v1', supports: 'jersey number read per detection and majority-voted within each tracklet; GS-HOTA requires role, team and jersey to match. We vote per sighting, not per frame, because consecutive reads are correlated.'}
  - {ref: 'Vats, Walters, Fani, Clausi, Zelek. Player Tracking and Identification in Ice Hockey. arXiv 2110.03090, 2021.', url: 'https://arxiv.org/abs/2110.03090', supports: 'team identification network about 97 %, player identification from box sequences 83 % with the game roster as a constraint; identity from roster + temporal evidence, not faces.'}
  - {ref: 'Luiten et al. HOTA: A Higher Order Metric for Evaluating Multi-Object Tracking. IJCV 2021, arXiv 2009.07736.', url: 'https://arxiv.org/abs/2009.07736', supports: 'HOTA = sqrt(DetA x AssA); AssA isolates association (identity) quality; IDF1 over-weights association, MOTA over-weights detection.'}
  - {ref: 'Ristani et al. Performance Measures and a Data Set for Multi-Target, Multi-Camera Tracking. ECCVW 2016, arXiv 1609.01775.', url: 'https://arxiv.org/abs/1609.01775', supports: 'IDF1, IDP, IDR from the optimal one-to-one matching of true and predicted identities.'}
  - {ref: 'TrackID3x3 (3x3 basketball tracking with identification), 2025.', url: 'https://www.themoonlight.io/en/review/trackid3x3-a-dataset-and-algorithm-for-multi-player-tracking-with-identification-and-pose-estimation-in-3x3-basketball-full-court-videos', supports: 'identity annotated mainly by jersey number; ID switches under occlusion reported as the open problem (secondary review page, not the paper).'}
  provider_note: >-
    Aldemir asked how broadcast providers (he named Peacock) do it. Streaming providers show tracking graphics bought from
    the league's in-arena vendor; no public document describes their identity logic. ShotTracker (MSU's in-arena system)
    uses wearable sensors, so identity there is hardware-assigned; if MSU staff share it, it is the best identity truth
    for NCAA film and the gold sample below should use it.

design_principles:
- id: DP1
  rule: Abstain rather than guess. A label is emitted only when its joint posterior is >= p_lock; otherwise the detection carries HOLD with its candidate set.
  why: zero swaps is a hard requirement; coverage is the variable that pays for it.
- id: DP2
  rule: Tracklets are pure by construction. The motion tracker cuts every tracklet involved in an ambiguity (pair-swap test, merge, nearby miss, camera cut) instead of guessing through it.
  why: a standard tracker that extends tracks through crossings is where swaps are born (harness config naive_tracker shows it).
- id: DP3
  rule: Identity is a constrained labelling of chains, not a property of the tracker. Constraints are hard - team, on-court lineup, one label per person per frame, at most five labels per team per frame.
  why: the lineup turns a 13-way choice into a 5-way choice and makes elimination possible (four locked teammates leave one label).
- id: DP4
  rule: Re-confirm after every crossing. Teammate crossings - children of a group inherit only the mixture of the group's identities and must be confirmed by their own cues before a label is emitted again. Opponent crossings - re-confirmed on every frame by team colour (colour veto, per-box colour HOLD, class alarm) and still recorded as split points.
  why: Aldemir's lock-and-keep rule needs a re-check at exactly the moments where a keep would be a guess.
- id: DP5
  rule: Lock from entry to exit. A locked chain keeps its label through unambiguous gaps; the identity is released on frame exit, camera cut, substitution or long loss.
  why: the owner rule (lock on entry, release on exit).
- id: DP6
  rule: Every label change is logged with its evidence; a swap alarm (locked label contradicted by cues) demotes the chain, splits it at the last close encounter and sends it to review.
  why: requirements - every identity switch logged and reviewed.
- id: DP7
  rule: Offline (post-game) labels use the whole chain's evidence, both before and after each frame; live labels use evidence so far. Both are scored; reports use offline labels.
  why: frame matching after the occlusion corrects provisional live labels retroactively.

reference_pack:
  summary: One pack per player per season, plus one appearance card per player per game and one kit card per team per game. The pack holds measurements and broadcast crops (torso and legs, skin masked); never faces.
  per_player_season:
    fields:
      player_id: {type: 'string', source: 'roster registry (ESPN/CBBD id crosswalk)', why: 'join key'}
      team_id: {type: 'string', source: 'roster', why: 'team constraint'}
      jersey_number: {type: 'string', source: 'official roster; checked against the box score each game', why: 'strongest single cue; ''00'' and ''0'' are different numbers'}
      jersey_history: {type: 'list of (number, from_date, to_date)', source: 'roster changes', why: 'numbers can change mid-season'}
      listed_height_m: {type: 'float', unit: 'm', source: 'public roster', why: 'build prior; listed heights are biased up by about 0.02-0.05 m, so only relative height within the floor is trusted'}
      measured_height_m: {type: 'float', unit: 'm', source: 'median over confirmed broadcast frames with court calibration (standing, upright pose only)', why: 'replaces the listed height after >= height_min_frames confirmed frames'}
      build_index: {type: 'float', unit: '1', source: 'shoulder width / height from pose on confirmed frames', why: 'separates same-height teammates; no body-composition or health inference'}
      gait_signature: {type: 'vector', source: 'pose keypoints on confirmed running frames (stride frequency, stride length / height, arm swing amplitude)', why: 'weak cue that works with the back turned and the number hidden'}
      shooting_hand: {type: 'enum [left, right, unknown]', source: 'confirmed shots', why: 'role-context cue; tie-breaker only'}
      reid_template: {type: 'vector (embedding of torso and legs, skin masked)', source: 'mean of 50-200 confirmed broadcast crops per season (labelling loop)', why: 'appearance cue for same-kit teammates'}
      crop_bank: {type: 'list of crop ids with game, frame, pose, view (front/back/side)', source: 'labelling loop', why: 're-training and audits; private, never committed'}
      headshot_ref: {type: 'url', source: 'ESPN', why: 'human checking of labels only; never a model input (no face data)'}
  per_player_game_card:
    filled: at tip-off, at every substitution entry and after every camera cut, from the first confirmed frames of each player (warm-up shirts excluded) - the per-game lock of appearance Aldemir asked for
    fields:
      shoe_colour: {type: 'Lab colour (2 dominant)', why: 'changes game to game; strong within-game cue'}
      sleeve: {type: 'enum [none, left, right, both] + colour', why: 'within-game appearance cue'}
      headband: {type: 'enum [none, headband, bandana] + colour', why: 'within-game accessory cue'}
      tights_or_knee_sleeve: {type: 'enum [none, left, right, both] + colour', why: 'within-game cue'}
      tape_or_wrist: {type: 'enum [none, left, right, both]', why: 'within-game cue; never interpreted as an injury'}
      game_template: {type: 'vector', why: 'reid_template updated with the first confirmed crops of this game (season template + game delta)'}
      confusable_pairs: {type: 'list of (player_id, player_id)', why: 'teammates the soft cues cannot separate (assignment.confusable_rate); a lock between them needs jersey evidence (twin_jersey_nats); refreshed with the game templates'}
  per_team_game_kit:
    fields:
      kit_colour_primary: {type: 'Lab colour', why: 'team classifier centre, normalised per arena'}
      kit_colour_secondary: {type: 'Lab colour', why: 'trim and numbers'}
      number_colour: {type: 'Lab colour', why: 'number detector contrast'}
      uniform_variant: {type: 'enum [home_light, road_dark, alternate, throwback]', why: 'hard case uniform variants'}
      arena_colour_norm: {type: '3x3 matrix + offset', why: 'lighting and floor glare normalisation per arena'}
  privacy: the pack lives in the private store; the repo holds only this schema. Crops are broadcast-derived and copyrighted (research use only).

cues:
- id: team_colour
  order: 1
  observation: per detection, a class in {team_A, team_B, official_or_other} from kit colours clustered per game after arena normalisation; no labels needed.
  model: P(obs = true class) = 1 - e_team; errors spread evenly over the other classes.
  params:
    e_team: {value: 0.03, unit: probability, why: 'assumed classifier error at broadcast distance after arena normalisation (hockey team-ID reports about 3 %; Vats et al. 2021)'}
    tau_team: {value: 0.5, unit: '1', why: consecutive frames of one person share lighting and pose, so votes are correlated; halve their weight}
    p_team: {value: 0.999, unit: probability, why: 'a chain joins a team''s assignment only above this class posterior; below it the chain stays HOLD (referee, coach, mascot, mixed box)'}
  validity: skipped on frames flagged merged (two people in one box).
  hard_cases: [same number on both teams (team decides first), referees and staff (class official_or_other), uniform variants, arena lighting]
- id: lineup
  order: 2
  observation: the five players of each team on the floor from play-by-play substitutions (CBBD / ESPN PBP), plus the starting five.
  model: hard candidate constraint; inside a substitution window the candidates are the union of outgoing and incoming players and the five-count is relaxed.
  params:
    sub_window_s: {value: 8.0, unit: s, why: 'PBP substitution times can lag or lead the real change by a few seconds (R-DQ-09 says 1 s for timing, but subs are logged at the dead ball, not when the player steps on); the window must cover the worst lag'}
    lineup_check_interval_s: {value: 2.0, unit: s, why: how often the emitted labels are compared with the PBP lineup (per-possession agreement output)}
  validity: live play only; during dead balls the bench, warm-up shirts and shooting shirts may be in frame (class official_or_other or bench zone).
  hard_cases: [substitutions during dead balls, injury or blood exits pending replacement, PBP substitution missing or late]
- id: jersey_number
  order: 3
  observation: a read (full number or partial single digit with its position) from the front or back of the jersey, with the OCR score; a sighting is a run of consecutive reads of the same detection chain without a gap > sighting_gap_s.
  model: >-
    Each sighting contributes once (its reads are correlated): full read r -> P(r | n) = 1 - e_ocr if r == n, else e_ocr
    x conf_share(r, n), where confusable digit pairs (1/7, 3/8, 6/8, 5/6, 0/8, 1/4) get confusable_share of the error mass
    and every other number shares the rest; partial read d -> P(d | n) = (1 - e_ocr) / len(digits(n)) when d is a
    digit of n, else e_partial. Reads below ocr_min_score are discarded (counted for the read-rate metric).
  params:
    e_ocr: {value: 0.1, unit: probability, why: 'assumed full-read error after the score gate at 1080p; SoccerNet and Basket-AI report about 79-90 % read accuracy, so 10 % is the planning value until measured on MSU film'}
    confusable_share: {value: 0.5, unit: probability, why: 'half of OCR errors go to a visually confusable number (digit shape pairs); the rest spread uniformly'}
    e_partial: {value: 0.05, unit: probability, why: probability of a partial digit that is not in the true number (fold, arm across the chest)}
    sighting_gap_s: {value: 0.2, unit: s, why: reads closer than this are the same view of the jersey and are counted once}
    tau_jersey: {value: 1.0, unit: '1', why: sightings are already de-correlated}
    sighting_cap_nats: {value: 4.0, unit: nats, why: 'one sighting may favour a number by at most this (about 55:1); a single confusable misread (8 read as 3) must not lock an identity on its own - two agreeing sightings, or one sighting plus appearance or a group prior, are needed (SportVU harness, review round 1)'}
    ocr_min_score: {value: 0.5, unit: score, why: reject gate for the OCR head; measured read rate and error are reported above this gate}
    min_readable_px: {value: 18, unit: px number height, why: 'proposal; requirements line 157 says the minimum readable size is measured, not assumed - the measurement replaces this value'}
  validity: no reads while the detection is merged; both front and back count (NCAA rule 1-22 requires numbers front and back); sighting rates fall with distance from the camera, back-or-side orientation and motion blur (prefer 60 fps recordings).
  hard_cases: [number partly hidden (partial reads kept), folded jersey, back turned, small players far from camera, motion blur at 30 fps, same number on both teams]
- id: height_build
  order: 4
  observation: standing height from the calibrated image scale (head top to floor contact) on upright frames, every cue_stride_s; build index from pose.
  model: robust likelihood (1 - o) N(h_obs; h_ref, sigma_h) + o U(h_lo, h_hi); posture outliers (bent, jumping, landing) fall in the outlier term.
  params:
    sigma_h: {value: 0.06, unit: m, why: 'height from a calibrated broadcast frame at 1080p: about 3-4 px of 200 px for a 2 m player, plus foot-contact error'}
    outlier_h: {value: 0.2, unit: probability, why: share of frames whose height is posture-corrupted (crouch, jump, lean)}
    h_lo: {value: 1.5, unit: m, why: outlier support lower bound}
    h_hi: {value: 2.4, unit: m, why: outlier support upper bound}
    tau_height: {value: 0.3, unit: '1', why: consecutive height estimates share calibration and pose error}
    height_min_frames: {value: 30, unit: frames, why: confirmed upright frames before measured_height_m replaces the listed height}
  validity: only frames with court calibration confidence >= 0.8 and an upright pose; not on merged frames.
  hard_cases: [same-team same-build pairs (height alone never decides), mid-jump, on the floor]
- id: appearance_reid
  order: 5
  observation: a re-ID embedding of the torso and legs crop (skin pixels masked, head excluded), every cue_stride_s; compared with the player's game template (season template + game card).
  model: von Mises-Fisher-like LL = tau_app x kappa_app x cos(e_obs, template); constants cancel across labels.
  params:
    kappa_app: {value: 20.0, unit: 1/cos, why: 'concentration of the per-sample embedding around its template; refit on MSU crops (the harness uses the simulator''s own value)'}
    tau_app: {value: 0.25, unit: '1', why: consecutive crops of one player are strongly correlated (same pose, same lighting)}
    template_min_crops: {value: 20, unit: crops, why: a game template needs this many confirmed crops before it replaces the season template}
  validity: not on merged frames; crops below min_crop_px tall are skipped.
  hard_cases: [same-team same-build pairs, warm-up and shooting shirts, uniform variants, arena lighting]
- id: gait_posture
  order: 6
  observation: a short gait descriptor (stride frequency, stride length / height, arm swing) from pose over the last 1 s while the player runs; posture class (upright, crouched) for the height gate.
  model: weak vMF-like LL = tau_gait x kappa_gait x cos(g_obs, g_ref); only when speed >= gait_min_speed_mps.
  params:
    kappa_gait: {value: 2.0, unit: 1/cos, why: gait is weak at broadcast resolution; it may only tip a decision when other cues agree}
    tau_gait: {value: 0.3, unit: '1', why: overlapping 1 s windows}
    gait_min_speed_mps: {value: 2.0, unit: m/s, why: below a jog, stride features are undefined}
  validity: running frames only; not on merged frames.
  hard_cases: [jersey hidden, back turned]
- id: role_context
  order: 7
  observation: who brings the ball up, who sets screens, shooting hand.
  model: not used for assignment in 0.1.0 (it would make identity depend on the labels it feeds); kept as a review-queue hint only.
  params: {}
  validity: review hints only.
  hard_cases: []
cue_common:
  params:
    cue_stride_s: {value: 0.2, unit: s, why: appearance, height and gait are sampled at 5 Hz; denser samples add correlation, not information}
    merged_box_iou: {value: 0.5, unit: IoU, why: a box overlapping another person's box above this is flagged merged and gives no cues}

tracklets:
  summary: Motion-only linking of detections frame to frame with a pair-swap likelihood test; any track involved in an ambiguity is cut, so tracklets are pure.
  rule: |
    Per frame: predict each active track with an alpha-beta (constant-velocity) filter; cost = squared distance to each
    detection; gate = gate_base_m x gap + gate_k x sigma_pair (sigma_pair = max(sqrt(2) x sigma_p, sigma_floor_m), grown
    with the gap); Hungarian assignment.
    PAIR-SWAP TEST: for every two assigned pairs (track i -> det j, track k -> det l), the log-likelihood ratio of the
    swapped assignment is LLR = [c(i,l) + c(k,j) - c(i,j) - c(k,l)] / (2 sigma_pair^2); LLR < swap_llr_min fails.
    MERGE TEST: a track without a detection, or matched to a merged / no-cue box, fails together with every track within
    merge_base_m + merge_k x sigma_pair (two people in one box, or a person hidden behind another).
    ENCOUNTER GROUP: a track that fails a test ends its clean tracklet (reason ambiguous) and continues as an amb segment
    (motion kept, identity unknown, never labelled); failing pairs join one encounter group (union of the identities that
    entered it, including tracks that vanished inside it). A track that passes every test for clear_s leaves the group
    as a new clean tracklet whose explicit parents are all identities that entered the group (it must be re-confirmed).
    This replaces cutting at every frame of a long close encounter (a defender 1 m from his man would otherwise create
    a new tracklet every frame).
    JUMP TEST: a one-frame innovation above jump_k x sigma_pair moves the track into an encounter group (with every
    person that vanished within reach). CONTESTED DETECTION: a matched detection near the predicted position of a
    same-class person that vanished less than contest_s ago does the same. NEWCOMER: a detection that starts a new
    track within the merge radius of a tracked person makes both ambiguous.
    COLOUR: an opponent pair (both tracks confidently of different classes) is not cut by the pair-swap or merge
    test; team colour separates them, and a detection whose observed class contradicts its track's class during such an
    encounter (colour veto) makes the pair ambiguous. Every encounter is still recorded as a candidate split point.
    LEADING GUARD: a new track that starts from a detection with another detection within isolation_m starts as an amb
    segment (group = identities that vanished within reach) and becomes clean after clear_s; TRAILING GUARD: a track
    that is lost next to another detection gives its last clear_s detections to an amb segment.
    DECISION DELAY: entering a group moves the last clear_s detections of the clean tracklet into the amb segment, so a
    swap made up to clear_s before a test fires never reaches a labelled tracklet (labels are emitted clear_s late).
    NO COASTING (pure): an unmatched track ends (lost, or fov_exit within fov_edge_m of the frame edge); the chain linker
    decides any continuation.
    CAMERA CUT: every track ends (reason cut); no link crosses a cut.
  params:
    gate_base_m: {value: 0.6, unit: m, why: 'at 10 m/s a player moves 0.33 m per frame at 29.97 fps (0.4 m at 25 Hz); the base covers it'}
    gate_k: {value: 4.0, unit: sigma, why: '4 sigma of pair noise keeps the miss probability below 1e-3'}
    swap_llr_min: {value: 9.2, unit: nats, why: 'ln(1e4): a pair is kept only when the swapped assignment is 10,000 times less likely; a cut costs coverage, a swap is forbidden'}
    jump_k: {value: 3.0, unit: sigma, why: 'JUMP TEST: a matched detection more than jump_k x sigma_pair from the one-frame prediction is a jump (the box moved to another person whose own box was hidden); the track enters an encounter group with every person that vanished within reach'}
    merge_base_m: {value: 1.0, unit: m, why: 'two box centres closer than about 1 m merge in the broadcast view'}
    merge_k: {value: 3.0, unit: sigma, why: noise margin on the merge distance}
    contest_s: {value: 0.5, unit: s, why: 'a matched detection near the predicted position of a same-class person who vanished less than this ago is contested (the hidden person re-appears in this track''s box while its own person is hidden); longer losses are handled by the chain linker'}
    v_err_mps: {value: 1.5, unit: m/s, why: 'velocity error of the alpha-beta filter at the moment a track is lost; the vanished person''s position sigma grows as sigma_pair + (v_err t + a_max t^2 / 2) / 3'}
    contest_prior_nats: {value: 5.3, unit: nats, why: 'prior log-odds against the hidden-person swap at a given frame: P(own box missing) about 0.05 x P(the hidden person re-appears in this frame) about 0.1; the detection is contested when log N(own track) - log N(vanished person) + this < swap_llr_min'}
    a_max_mps2: {value: 6.0, unit: m/s^2, why: 'a player cannot deviate from his predicted path by more than about a_max t^2 / 2 (sprint starts and cuts reach 5-7 m/s^2)'}
    isolation_m: {value: 2.5, unit: m, why: nobody else this close means a gap cannot hide a swap}
    coast_max_s: {value: 0.0, unit: s, why: 'pure tracklets never coast (a gap ends the tracklet; the chain linker decides the continuation with the isolation tests); the naive tracker coasts link_window_s'}
    clear_s: {value: 0.12, unit: s, why: 'a track leaves its encounter group after passing every test for this long (3 frames at 25-30 fps); shorter re-enters on noise'}
    pos_alpha: {value: 0.6, unit: '1', why: 'alpha-beta filter position gain: smooths position noise for prediction while following sharp cuts within a frame or two'}
    vel_beta: {value: 0.05, unit: '1', why: 'alpha-beta velocity gain; per-frame differences of a 0.3 m noisy position are about 10 m/s, so velocity must be heavily smoothed'}
    sigma_floor_m: {value: 0.1, unit: m, why: 'minimum pair sigma in the swap test (filter lag on sharp cuts is about 0.1 m even with exact positions)'}
    fov_edge_m: {value: 1.5, unit: m, why: tracks ending this close to the frame edge are treated as leaving the frame}
  outputs: [tracklet_id, start_frame, end_frame, end_reason (cut | ambiguous | lost | fov_exit | end), amb (encounter segment), encounter_group, explicit_parents, encounter_frames]

chains:
  summary: Tracklets are joined into chains only by unambiguous continuations; all other starts receive a mixture prior from the group that may contain them.
  rule: |
    A clean tracklet that leaves an encounter group has explicit parents (the group's identities). Any other new
    tracklet starting at frame s at position p takes as parent candidates the tracklets that ended within link_window_s
    before s (no camera cut in between, not ended by fov_exit) whose last position is within reach = reach_base_m +
    v_max_mps x gap + 3 sigma_pair of p; an amb segment in reach contributes all identities of its group.
    UNIQUE CONTINUATION: no explicit parents, exactly one parent candidate, that parent has exactly one child candidate,
    the parent ended with reason lost, and both the parent's last detection and the new first detection are isolated
    (no other detection within isolation_m in that frame) -> the tracklet joins the parent's chain (lock inherited).
    GROUP CHILD: otherwise a new chain with prior = (1 - leak) x mean over parent chains of their posterior at their
    end + leak x uniform over the on-court candidates of the class (adaptive leak, see leak_eps). No parents (start, after a cut, frame entry):
    uniform prior.
    AMB SEGMENTS are chains of their own, never labelled (HOLD with the group as candidate set).
    FOV ENTRY: a chain that starts within fov_edge_m of the frame edge has no parents (released identities are not
    inherited across an exit; entering players are re-acquired by cues).
  params:
    link_window_s: {value: 1.5, unit: s, why: 'longest occlusion that is still bridged by a group prior; longer losses re-acquire from scratch'}
    reach_base_m: {value: 1.0, unit: m, why: body width}
    v_max_mps: {value: 9.0, unit: m/s, why: 'top sprint speed of D-I players is about 9-10 m/s'}
    leak_eps: {value: 0.1, unit: probability, why: 'ADAPTIVE LEAK: prior mass left for an identity that was not in the group = leak_min + leak_eps x (team candidates not visible anywhere in the frame) / (team candidates). A teammate who is not on screen may be hiding behind someone; 0.02 everywhere let a group child lock on the group prior plus noise when a hidden teammate stepped out (SportVU harness)'}
    leak_min: {value: 0.002, unit: probability, why: 'leak when every candidate of the team is visible (nobody can be hiding); at 0.002 a one-identity group child (opponent crossing, solo merge) keeps a prior of 0.998 and stays above p_lock under the joint constraint on team colour alone'}

assignment:
  summary: Per frame and per team, the joint label posterior of all visible chains of that team over the on-court candidates under one-person-one-label; labels are emitted only above p_lock.
  rule: |
    Chain score S[c, L] = log prior(c, L) + sum over the chain's cue samples so far (live) or over the whole chain
    (offline) of the tempered cue log-likelihoods. Live prior = the group mixture of the parents' joint marginals at
    their end; offline prior = forward mixture (parents) x backward mixture (children), each direction computed from
    its own side only so no cue is counted twice. Jersey sightings are capped at sighting_cap_nats each. Class: a chain enters team T's problem when its class posterior for T
    >= team_colour.p_team; otherwise it is HOLD.
    Candidates: the on-court players of T from the PBP lineup; inside a substitution window, the union of outgoing and
    incoming players. When the chains outnumber the candidates, dummy labels with score log(dummy_eps) absorb the extras.
    Joint posterior: P(c -> L) = sum over injective maps of chains to labels containing (c -> L) of exp(sum S) / Z,
    enumerated exactly (<= 2,520 maps for 5 chains and 7 candidates). When the map count exceeds max_enum (pile-ups with
    many fragments), each chain's posterior is its own softmax and the Hungarian MAP enforces exclusivity (logged).
    Because the joint marginals of one label sum to <= 1 over chains, at most one chain can hold a label above 0.5: two
    chains can never emit the same label in a frame (checked by invariant ID-INV-1).
    LOCK (live) / EMIT (offline) needs all of: joint posterior >= p_lock; chain margin (S without the one-label
    constraint) >= min_evidence_nats; own-cue support (at least one cue sample of the chain's own and its own cues favour
    the label by >= own_margin_nats); for a label with a confusable teammate among the candidates, own jersey evidence
    >= twin_jersey_nats against that teammate; the box itself is not merged and does not show another team's colour.
    Offline label of a chain: the label with the highest mean marginal over its frames, emitted on the frames where all
    the conditions hold (one label per chain, so no within-chain flicker).
    PROBABLE TIER (owner decision 25 Oct 2026, OD-8; offline only, never live): on a frame of that chain where the lock
    conditions fail, the same label is emitted as a separate, flagged probable label when joint posterior >= p_probable,
    chain margin >= probable_min_evidence_nats, own cues (>= one sample) favour it by >= probable_own_margin_nats and the
    jersey evidence against a confusable teammate is >= probable_twin_jersey_nats. A probable label never repeats a locked
    or another probable label in the frame (dropped to HOLD). It lives in its own output field: the locked label field,
    swap_events, idsw, IDF1, HOTA, coverage and every stat read locked labels only; probable labels are shown to viewers
    flagged as probable, and a wrong probable label is logged (harness: probable_wrong_frames / probable_wrong_events)
    but is not a locked swap.
  params:
    p_lock: {value: 0.995, unit: probability, why: 'emission and lock threshold; at the harness'' 1e5 chain decisions per game a 0.5 % residual error would still be too many, so the posterior must also be calibrated (calibration metric) - the threshold is the knob, not the guarantee'}
    p_unlock: {value: 0.5, unit: probability, why: 'a locked chain is demoted (swap alarm) when its locked label falls below this; at 0.5 no other chain can hold the same label, so exclusivity is never broken by stickiness'}
    dummy_eps: {value: 1.0e-4, unit: probability, why: cost of explaining a chain as nobody on the lineup (fragment, misclassified official)}
    max_enum: {value: 20000, unit: maps, why: exact enumeration limit per team per frame}
    min_evidence_nats: {value: 2.0, unit: nats, why: 'a chain locks only if its chain score without the one-label-per-person constraint (own cues + the directional priors from its parents and, offline, its children) favours the label over the runner-up by this margin; elimination alone (four teammates locked, so the fifth must be the fifth) never locks a chain'}
    confusable_rate: {value: 1.0, unit: nats/s, why: 'CONFUSABLE PAIRS (per-game confusion list of the reference pack): teammates whose expected appearance + height log-likelihood ratio grows slower than this (tau_app kappa_app (1 - cos of templates) + tau_height (dh/sigma_h)^2/2, per cue sample) cannot be told apart by soft cues within a possession'}
    twin_jersey_nats: {value: 5.0, unit: nats, why: 'a label with a confusable teammate among the candidates locks only when the chain''s own jersey evidence favours it over that teammate by this much (more than one capped sighting: one misread confusable with the twin''s number, 7 read as 80 for 30, locked a twin in the harness); template bias made the SportVU twins swap on appearance alone (review round 1)'}
    own_margin_nats: {value: 0.5, unit: nats, why: 'OWN-CUE SUPPORT: a chain locks a label only if it has at least one cue sample of its own and its own cues favour that label over every other candidate by at least this; priors (group mixture, children, elimination) can speed a lock up, never decide it (a group child inherited a teammate''s label when a hidden teammate stepped out; tolerance 1.0 against still let it through)'}
    class_window_s: {value: 1.0, unit: s, why: 'live swap catch for opponents: a locked chain whose last 1 s of team-colour evidence is confidently the other class raises a class alarm (opponent pairs are not cut by the tracklet layer, see tracklets.rule)'}
    p_probable: {value: 0.9, unit: probability, why: 'PROBABLE TIER (owner decision 25 Oct 2026, OD-8; offline only): a detection the locked tier leaves on HOLD gets a flagged probable label when the chain''s joint posterior for its offline label is >= this and the lower bars below hold. Probable labels are shown to viewers flagged as probable and never feed stats or any metric that counts locked identity'}
    probable_min_evidence_nats: {value: 1.0, unit: nats, why: 'probable tier: chain margin without the one-label constraint (min_evidence_nats is 2.0 for a lock); elimination alone still never gives a probable label'}
    probable_own_margin_nats: {value: 0.0, unit: nats, why: 'probable tier: at least one own cue sample and the chain''s own cues may not favour another candidate (own_margin_nats is 0.5 for a lock)'}
    probable_twin_jersey_nats: {value: 0.0, unit: nats, why: 'probable tier: against a confusable teammate the own jersey evidence may not point to the twin (twin_jersey_nats is 5.0 for a lock)'}
  outputs: [label or HOLD, posterior, candidate set (labels with posterior >= 0.05), lock state, evidence breakdown per cue, 'probable label (offline only, flagged; OD-8)']

state_machine:
  summary: Per chain; identities are locked on entry (after confirmation), held through occlusions, re-confirmed after every crossing and released on exit.
  states:
    ENTER: chain started with no parent (frame entry, start of play, after a camera cut); candidates = free on-court labels of its class
    CONFIRMING: posterior of the best label < p_lock; output HOLD with candidates
    LOCKED: label emitted every frame while the chain is visible
    HELD: the chain ended inside a group (crossing, merge, pile-up); the identity is reserved for the group's children for link_window_s
    RECONFIRM: a group child; prior = mixture of the group's identities; output HOLD until p_lock (cues confirm which member it is)
    ALARM: a LOCKED chain's label fell below p_unlock (contradicting cues); output HOLD, chain split at its last encounter, review record written
    RELEASED: frame exit, camera cut, substitution, or loss longer than link_window_s; the identity is free
  transitions:
  - {id: SM-1, from: ENTER, to: CONFIRMING, when: first frame of a chain without parents}
  - {id: SM-2, from: CONFIRMING, to: LOCKED, when: 'joint posterior >= p_lock, chain margin >= min_evidence_nats and own-cue support (own_margin_nats, at least one cue sample)'}
  - {id: SM-3, from: LOCKED, to: LOCKED, when: unique continuation after a short gap (single parent, single child, isolated) - the lock is inherited}
  - {id: SM-4, from: LOCKED, to: HELD, when: the chain ends with reason ambiguous (pair-swap test failed, merge, nearby miss)}
  - {id: SM-5, from: HELD, to: RECONFIRM, when: a child tracklet starts within reach and link_window_s}
  - {id: SM-6, from: RECONFIRM, to: LOCKED, when: 'joint posterior >= p_lock with own evidence margin; time from the group end to this frame is the time-to-reconfirm metric'}
  - {id: SM-7, from: LOCKED, to: ALARM, when: posterior of the locked label < p_unlock}
  - {id: SM-8, from: ALARM, to: CONFIRMING, when: next frame (the chain is split; the split part starts as a group child of the encounter)}
  - {id: SM-9, from: [LOCKED, CONFIRMING, HELD, RECONFIRM], to: RELEASED, when: 'camera cut, FOV exit, PBP substitution of the label, or HELD longer than link_window_s'}
  - {id: SM-10, from: RELEASED, to: ENTER, when: the player is seen again (new chain, no parents)}
  invariants:
  - {id: ID-INV-1, rule: 'no label is emitted twice in one frame'}
  - {id: ID-INV-2, rule: 'at most five labels per team per frame outside substitution windows (R-IV-01)'}
  - {id: ID-INV-3, rule: 'every emitted label is in the PBP lineup or the substitution window union'}
  - {id: ID-INV-4, rule: 'a chain emits at most one label over its life offline; live label changes only through ALARM, and every change is logged'}
  - {id: ID-INV-5, rule: 'no label on a chain whose class posterior is below p_team (officials, coaches, mascots, band, bench)'}

swap_catch:
  summary: How swaps are caught and corrected - frame matching across occlusions.
  rule: |
    1. Prevention: pair-swap and merge tests cut tracklets, so a group child is matched to the group's members by cues
       (frame matching: the members' evidence before the group vs the child's evidence after it), never by motion alone.
    2. Live catch: a LOCKED chain whose posterior for its label drops below p_unlock raises ALARM; the chain is split at
       its last close encounter (encounter_frames from the tracklet layer) and the part after it is re-confirmed.
    3. Offline catch (change-point): for every chain and every close encounter in it, the split log-likelihood gain
       G = max_L1 S_before[L1] + max_L2 S_after[L2] - max_L S_all[L] is computed; the best split with G >= split_llr_min is
       applied, and the search repeats on each part (at most max_splits). When several split points are equally good
       (within split_tie_nats: no evidence between them), the stretch between the first and the last of them stays
       unlabelled - the swap happened there but the evidence cannot say where. This catches swaps made by an upstream
       tracker that did not cut.
    4. Review: every ALARM, every offline split, every chain whose offline label differs from its live label, every
       on-court player left on HOLD for longer than review_hold_s while in view (requirements line 801: low identity
       confidence is flagged) and every ID-INV break goes to the identity review queue with the frames before and after, the cue evidence per side and the
       group membership.
  params:
    split_llr_min: {value: 6.9, unit: nats, why: 'ln(1000): a split is applied only when two identities explain the chain 1,000 times better than one'}
    max_splits: {value: 3, unit: splits, why: per chain per pass}
    review_hold_s: {value: 10.0, unit: s, why: 'a player in view who carries no label for this long is flagged to the human-in-the-loop queue (one possession of HOLD is worth a human look)'}
    split_tie_nats: {value: 1.0, unit: nats, why: 'every candidate split point whose gain is within this of the best is equally plausible (no evidence between them); the detections between the first and the last such point stay unlabelled'}
    encounter_m: {value: 1.5, unit: m, why: tracks closer than this record an encounter (candidate split point)}

confidence_and_abstention:
  rule: |
    Per-frame confidence = the joint posterior of the emitted label. HOLD is emitted when (a) the class is unsure, (b) no
    label reaches p_lock, (c) the chain margin is below min_evidence_nats or the chain's own cues do not favour the label (own_margin_nats),
    (d) the box is merged or occluded (no cues), (e) the chain is in ALARM or inside an encounter group, or (f) the box's
    own team-colour observation contradicts its chain's team (a one-frame swap with an opponent or an official at a
    chain edge, or a colour misread; costs about e_team of the boxes). HOLD carries the candidate set (labels with posterior >= 0.05). Downstream consumers use
    candidate sets for counting (a HOLD in a two-player group still counts both players on the floor) and never guess.
    Live panel (owner decision 25 Oct 2026, OD-10): when unsure the live panel shows HOLD with the candidate list; no
    provisional or probable label is ever shown live. The probable tier (assignment rule, OD-8) exists offline only and is
    flagged as probable wherever it is shown; it never feeds stats.
    Calibration: on the gold sample the emitted posteriors are binned and the observed error rate per bin must stay below
    the bin's mean (1 - posterior) x calibration_slack.
  params:
    calibration_slack: {value: 2.0, unit: '1', why: tolerated over-confidence before p_lock is raised}
    candidate_min_p: {value: 0.05, unit: probability, why: smallest posterior listed in a HOLD candidate set}

hard_cases:
- id: HC-crossing
  case: Two players cross or screen (one passes behind the other)
  handling: pair-swap test cuts both tracklets; the children inherit the 2-member mixture; jersey sightings, appearance and height re-confirm (SM-5, SM-6); live labels HOLD until then.
  test: test_crossing_reconfirmed_by_jersey, test_crossing_without_evidence_holds
- id: HC-pileup
  case: Pile-up (scramble, rebound scrum, jump ball) - three or more players within merge distance
  handling: one group with all members; children re-confirm against the whole group; when detections merge, HOLD until the group dissolves.
  test: test_pileup_group_of_four
- id: HC-twins
  case: Same-team, same-build pair with similar appearance (twins problem)
  handling: height and appearance cannot separate them; only jersey sightings (or elimination with own-evidence margin) lock them; otherwise HOLD.
  test: test_same_build_pair_needs_jersey
- id: HC-jersey-hidden
  case: Jersey hidden (arm across chest, back to the wall, folded number)
  handling: partial digits kept as evidence; appearance, height and gait accumulate; lock only above p_lock with own evidence.
  test: test_partial_digit_reads_count
- id: HC-same-number
  case: Same number on both teams
  handling: team class decides first (chains enter one team's problem only above p_team); the number then disambiguates within that team.
  test: test_same_number_both_teams
- id: HC-camera-cut
  case: Camera cuts, replays, close-ups and the dead-ball gap
  handling: every track ends and every identity is RELEASED (no link across a cut); re-acquisition from cues with the lineup constraint; replays are not main-wide frames and give no detections.
  test: test_camera_cut_releases_and_reacquires
- id: HC-fov
  case: Player leaves and re-enters the broadcast field of view
  handling: exit releases (owner rule); entry starts a new chain with no parents; re-acquired by cues.
  test: test_fov_exit_releases
- id: HC-substitution
  case: Substitutions during dead balls (and late PBP entries)
  handling: lineup candidates widen to outgoing + incoming inside sub_window_s; a released player's label is not available after his substitution leaves the window.
  test: test_substitution_window
- id: HC-timeout
  case: Timeouts and huddles
  handling: dead ball - camera leaves the main wide view; RELEASE on return; bench zone detections are class official_or_other or excluded by court zone.
  test: test_camera_cut_releases_and_reacquires
- id: HC-free-throw
  case: Free-throw line-ups (players stand still in lane spaces, close together, often after a cut)
  handling: lane-space positions are fixed and well separated (about 0.9 m spaces), so pair tests pass; re-acquisition after the cut uses jersey sightings, which are frequent because players stand still facing the camera or the basket.
  test: test_free_throw_lineup_reacquired
- id: HC-officials
  case: Referees, coaches, mascots, band members on the floor
  handling: class official_or_other; never enter a team problem (ID-INV-5).
  test: test_referee_never_labelled
- id: HC-tracker-swap
  case: The upstream tracker swaps two tracks without cutting
  handling: live ALARM when cues contradict the lock; offline change-point split at the encounter (swap_catch 2-3).
  test: test_injected_tracker_swap_is_split_offline

outputs:
  per_frame:
    fields: [game_id, frame, pts, detection_id, chain_id, label (player_id or HOLD), posterior, candidates, lock_state, class, class_posterior, evidence_by_cue, merged_flag, 'tier (locked | probable | hold)', 'probable_label (player_id or null; offline only)', probable_posterior]
    rule: 'label holds locked identities only; every stat, every count of locked identity and every metric of the metrics section reads label. probable_label is filled offline only (OD-8), flagged probable wherever it is shown, and never feeds stats.'
  live_panel:
    fields: [frame, detection_id, label (player_id or HOLD), candidates (when HOLD, posterior >= candidate_min_p), lock_state]
    rule: 'Owner decision 25 Oct 2026 (OD-10): the live panel shows a locked label or HOLD with the candidate list; it never shows a provisional, unconfirmed or probable label.'
  probable_log:
    fields: [game_id, frame_start, frame_end, chain_id, probable_label, mean_posterior, review_status]
    rule: 'OD-8: every probable run is logged; when truth exists (gold sample, harness) a wrong probable run is counted as probable_wrong_events, never as a locked swap.'
  per_possession:
    fields: [possession_id, lineup_pbp (10 ids), lineup_seen (labels emitted at least once), agreement (labels seen subset of lineup), unexplained_holds_s, abstention_share]
    rule: agreement must be 1.0 (ID-INV-3); a disagreement goes to review with the PBP row.
  switch_log:
    fields: [game_id, frame, chain_id, from_label, to_label, kind (alarm | offline_split | live_vs_offline | invariant_break), evidence_before, evidence_after, group_members, review_status]
    rule: every label change, every alarm and every offline correction is a row; nothing is overwritten silently.
  per_game:
    fields: [confusion_list (pairs of players with any alarm or split between them), identity accuracy per player, coverage per player, read rate of jersey numbers]
  per_season:
    fields: [accuracy per player, weak identities (lowest coverage) -> more labelled crops]

metrics:
- id: idsw
  name: ID switches (CLEAR-MOT definition on labels)
  definition: for each true player, the sequence of emitted labels on his detections (HOLD skipped); every change between two consecutive emitted labels counts one switch.
- id: swap_events
  name: Swap events (the zero-swap quantity)
  definition: maximal runs of frames in which a true player's detection carries a wrong label (or an official's detection carries any label), runs closer than 1 s merged. Target 0.
- id: wrong_label_frames
  name: Wrong-label frames
  definition: detections with an emitted label different from the true player.
- id: idf1
  name: IDF1, IDP, IDR
  definition: 'optimal one-to-one matching between true players and emitted labels over the game (Ristani 2016); IDTP = matched co-occurrences; ground truth = every frame the player is on court inside the field of view (occluded frames count as misses).'
- id: hota
  name: HOTA, DetA, AssA (source-matched)
  definition: 'Luiten 2021 at a single localisation threshold with each detection matched to the person it was made from (the harness knows it); TP = emitted labels on a true player''s detection, FN = in-view true-player frames without a TP, FP = labels on officials or fragments; AssA = mean over TPs of TPA / (TPA + FNA + FPA).'
- id: id_accuracy_player_game
  name: Identity accuracy per player per game
  definition: correct labelled frames / in-view frames of that player (coverage-weighted accuracy), plus precision = correct / emitted for that player.
- id: coverage
  name: Coverage
  definition: share of player detections that carry a label (1 - abstention share); offline and live separately.
- id: time_to_reconfirm
  name: Time to re-confirm after a crossing
  definition: 'for every true crossing (pair centre distance < 1.0 m with bearing flip >= 90 deg, the id_swap_risk crossed attribute of config/movement_grammar/bigs.yaml), the time from the end of the encounter to the first correctly labelled frame of each player; median, p90 and share within 2 s.'
- id: calibration
  name: Posterior calibration
  definition: error rate per posterior bin of emitted labels vs 1 - mean posterior.
- id: probable_coverage_gain
  name: Probable-tier coverage gain (OD-8)
  definition: share of player detections that carry a probable label where the locked tier abstains (offline); coverage_with_probable = coverage + this gain. Reported apart from coverage.
- id: probable_error_rate
  name: Probable-tier error rate (OD-8)
  definition: 'wrong probable labels / probable labels (offline); wrong runs (merged within 1 s) are probable_wrong_events. Logged, never added to swap_events.'
- id: recording_standard
  name: Recording standard (OD-9)
  definition: per game, the source resolution and frame rate of the main wide recording.

acceptance:
- {id: ACC-1, metric: swap_events, scope: 'gold sample (>= 5 MSU games, >= 20 min of labelled live play each, all 10 players labelled per frame)', threshold: '== 0 (offline labels)', on_fail: 'every swap gets a review record; the root cause (cue, rule, threshold) is fixed and the gold sample re-run; a swap is never waived'}
- {id: ACC-2, metric: swap_events, scope: gold sample, threshold: '<= 1 per game (live labels)', on_fail: the live/offline difference must be caught by an ALARM or an offline split}
- {id: ACC-3, metric: idf1, scope: gold sample, threshold: '>= 0.80 (offline)', on_fail: coverage work (more cues, better OCR), never a lower p_lock}
- {id: ACC-4, metric: coverage, scope: gold sample, threshold: '>= 0.85 of in-view player frames (offline)', on_fail: as ACC-3}
- {id: ACC-5, metric: id_accuracy_player_game, scope: gold sample, threshold: 'precision 1.0 for every player; coverage >= 0.70 for every player with >= 5 min on court', on_fail: weak identities get more labelled crops (per-season output)}
- {id: ACC-6, metric: time_to_reconfirm, scope: gold sample, threshold: 'median <= 1.0 s, p90 <= 3.0 s, share within 2 s >= 0.80 (offline)', on_fail: cue rates or pair-test thresholds revisited}
- {id: ACC-7, metric: invariants, scope: every game, threshold: 'ID-INV-1..5 zero breaks', on_fail: quarantine affected frames (identity_review queue, R-IV-01)}
- {id: ACC-8, metric: calibration, scope: gold sample, threshold: 'observed error <= calibration_slack x (1 - mean posterior) in every bin with >= 1,000 labels', on_fail: raise p_lock and re-tune taus}
- {id: ACC-H1, metric: swap_events, scope: 'SportVU harness, cue profile good, sigma_p 0.15 and 0.30 m, all three games, config full (offline)', threshold: '== 0', on_fail: spec defect - fix before 0.1.x is accepted}
- {id: ACC-P1, metric: probable_error_rate, scope: 'SportVU harness (every cue profile and sigma_p, config full) and the gold sample, offline', threshold: 'reported with probable_coverage_gain on every run; probable labels never enter swap_events, idsw, IDF1, HOTA, coverage or any stat', on_fail: 'a probable label found in a stat input is a defect; a probable error rate above 1 % on the gold sample raises p_probable'}
- {id: ACC-R1, metric: recording_standard, scope: every game that feeds player-level numbers, threshold: '>= 1080p and >= 59.94 fps (OD-9)', on_fail: 'team-level numbers only, or probable-only player labels for that game'}
- {id: ACC-H2, metric: idsw, scope: 'SportVU harness, config naive_tracker, cue profile good, sigma_p 0.30 m', threshold: '> 0 (the harness must be able to produce swaps; otherwise it cannot test the rules)', on_fail: harness defect}
gold_sample:
  plan: >-
    Hand-label all ten players every 0.5 s on >= 5 MSU games (>= 20 min live play each, including at least 20 crossings
    and 5 substitution windows per game) in the local review tool; ShotTracker player ids, if MSU staff share them, replace
    hand labels as truth. Frames between labels are interpolated only inside one labelled chain.

harness:
  summary: >-
    tools/specgen/identity/harness.py simulates the identity problem on NBA SportVU 2015-16 tracking (true ids known):
    ids stripped, position noise added, broadcast camera field of view, camera-model occlusions and merged boxes, dead-ball
    gaps as camera cuts, PBP lineup with lag, referees as distractors, and cue observations drawn from configurable error
    models. The reference assigner (tools/specgen/identity/idlib.py) implements this spec. Aggregates only are written to
    results/identity_test/; per-player outputs stay in the private folder.
  data: '~/MSU-Alpha-3-private/data/research/sportvu_2015_16/json (3 games, private, never copied); 25 Hz; dead-ball moments are collapsed by the loader, so every wall-clock gap > dead_gap_s is a camera cut'
  params:
    dead_gap_s: {value: 0.2, unit: s, why: wall-clock jump between consecutive kept moments that marks a dead ball (always treated as a camera cut)}
    live_cut_rate_per_min: {value: 0.1, unit: 1/min, why: rare live-play cuts (alternate angle, close-up) on top of dead-ball cuts}
    live_cut_s: {value: [1.0, 3.0], unit: s, why: duration range of a live-play cut}
    fov_width_m: {value: 18.0, unit: m, why: 'main wide broadcast shot shows about 55-60 ft of the 94 ft court'}
    fov_tau_s: {value: 1.0, unit: s, why: camera pan smoothing (exponential) following the ball}
    camera_xy_m: {value: [14.33, -8.0], unit: m, why: 'main camera at mid-court, 8 m behind the near sideline (SportVU y = 0 side)'}
    occl_lateral_m: {value: 0.45, unit: m, why: two players whose lines of sight from the camera are closer than this laterally overlap}
    occl_depth_m: {value: 3.0, unit: m, why: overlap only matters within this depth difference (elevated camera)}
    p_occl_drop: {value: 0.7, unit: probability, why: share of overlapped far players whose box is lost (else detected with no cues)}
    merge_m: {value: 0.6, unit: m, why: centres closer than this give one box at the midpoint with the near player's cues}
    p_miss: {value: 0.01, unit: probability per frame, why: detector drop-out start probability}
    miss_len_s: {value: [0.04, 0.3], unit: s, why: drop-out duration range}
    pbp_lag_s: {value: [-1.0, 4.0], unit: s, why: PBP substitution time minus true change (the lineup feed the assigner sees)}
    n_referees: {value: 3, unit: persons, why: officials on the floor as distractors (D-I three-person crews)}
    e_ref_class: {value: 0.02, unit: probability, why: officials misclassified as a team}
    reach_dist_ref_m: {value: 14.0, unit: m, why: camera distance at which jersey sighting rates are quoted; rates fall linearly to 30 % at 28 m}
  noise_grid_sigma_p_m: [0.15, 0.30, 0.50]
  calibration_note: 'assigner_overrides are the cue parameters the production system would fit on labelled crops of that recording quality (kappa_app about 1 / app_noise^2 scaled to the good profile, sigma_h, e_team, e_ocr). The assigner must be calibrated per recording quality: poor video read with good-video parameters is overconfident (profile poor_uncalibrated).'
  cue_profiles:
    good:
      note: 1080p main wide camera, normal arena light
      e_team: 0.01
      jersey_sightings_per_s: 0.6
      jersey_sighting_len_s: [0.12, 0.4]
      e_ocr: 0.05
      p_partial: 0.2
      app_dims: 16
      app_w_ind: 0.35
      app_w_game: 0.15
      app_noise: 0.12
      app_rho: 0.9
      game_card: true
      template_crops: 50
      sigma_h: 0.05
      outlier_h: 0.15
      gait_noise: 0.6
      twin_pairs_per_team: 1
      assigner_overrides: {}
    poor:
      note: 720p or low bitrate, dim arena, heavy motion blur
      e_team: 0.04
      jersey_sightings_per_s: 0.2
      jersey_sighting_len_s: [0.08, 0.25]
      e_ocr: 0.15
      p_partial: 0.35
      app_dims: 16
      app_w_ind: 0.25
      app_w_game: 0.15
      app_noise: 0.2
      app_rho: 0.9
      game_card: false
      template_crops: 30
      sigma_h: 0.08
      outlier_h: 0.25
      gait_noise: 0.9
      twin_pairs_per_team: 1
      assigner_overrides: {kappa_app: 7.2, sigma_h: 0.08, outlier_h: 0.25, e_team: 0.06, e_ocr: 0.15}
    poor_uncalibrated:
      note: the poor recording read with the assigner still calibrated for good video (kappa_app, sigma_h, e_ocr not refitted)
      e_team: 0.04
      jersey_sightings_per_s: 0.2
      jersey_sighting_len_s: [0.08, 0.25]
      e_ocr: 0.15
      p_partial: 0.35
      app_dims: 16
      app_w_ind: 0.25
      app_w_game: 0.15
      app_noise: 0.2
      app_rho: 0.9
      game_card: false
      template_crops: 30
      sigma_h: 0.08
      outlier_h: 0.25
      gait_noise: 0.9
      twin_pairs_per_team: 1
  height_by_position_m:
    G: [1.91, 0.06]
    F: [2.03, 0.05]
    C: [2.11, 0.04]
  configs:
    naive_tracker: {tracklets: naive, cues: [team, jersey, appearance, height, gait], lineup: true, abstain: false, alarms: false, splits: false, note: 'standard tracker: links through crossings, labels once at first confirmation and keeps them'}
    motion_team: {tracklets: pure, cues: [team], lineup: false, abstain: true, alarms: true, splits: true}
    motion_team_lineup: {tracklets: pure, cues: [team], lineup: true, abstain: true, alarms: true, splits: true}
    plus_jersey: {tracklets: pure, cues: [team, jersey], lineup: true, abstain: true, alarms: true, splits: true}
    plus_appearance: {tracklets: pure, cues: [team, jersey, appearance], lineup: true, abstain: true, alarms: true, splits: true}
    full: {tracklets: pure, cues: [team, jersey, appearance, height, gait], lineup: true, abstain: true, alarms: true, splits: true}
    full_no_jersey: {tracklets: pure, cues: [team, appearance, height, gait], lineup: true, abstain: true, alarms: true, splits: true}
    full_no_lineup: {tracklets: pure, cues: [team, jersey, appearance, height, gait], lineup: false, abstain: true, alarms: true, splits: true}
    full_forced: {tracklets: pure, cues: [team, jersey, appearance, height, gait], lineup: true, abstain: false, alarms: true, splits: true, note: 'emit the argmax always (no abstention)'}
    naive_tracklets_full_catch: {tracklets: naive, cues: [team, jersey, appearance, height, gait], lineup: true, abstain: true, alarms: true, splits: true, note: 'a standard tracker upstream; tests whether alarms and offline splits catch its swaps'}
  results_file: results/identity_test/sportvu_harness.json

journal:
- version: 0.1.0
  date: '2026-10-25'
  changes:
  - First version of the identity pack (baseline 3), from the requirements identity section, Aldemir's zero-swap rule (23 Oct) and a short survey of broadcast identification work.
  - Reference assigner, cue simulator, SportVU harness and synthetic rule tests written against this file; the design was iterated on the harness (RV-01 to RV-10 below).
  - 'Independent review pass (requirements and hard cases): standing-constraint YAML item fixed (it parsed as a mapping), assignment rule text completed (directional priors, lock conditions), DP4 split into teammate and opponent crossings, game card refreshed at substitution entries, low-confidence review trigger (review_hold_s), orientation and blur noted for jersey sightings, ID-INV-2 and posterior calibration added to the harness metrics.'
- version: 0.1.1
  date: '2026-10-25'
  changes:
  - 'Owner decisions of 25 Oct 2026 (OD-8 .. OD-10; answers to OQ-2, OQ-4, OQ-5, OQ-6): zero swaps absolute with a flagged offline probable tier; minimum recording standard and the ShotTracker action item; live panel HOLD with candidates.'
  - 'harness.py writes G1 / G2 / G3 codes (game_code) in the repo results and keeps real ids in the private output only; the repo results record game counts per run.'
  decisions:
  - id: OD-8
    what: >-
      Zero swaps stays absolute (requirement.zero_swaps). New probable tier (assignment rule and params p_probable 0.9,
      probable_min_evidence_nats 1.0, probable_own_margin_nats 0.0, probable_twin_jersey_nats 0.0): offline only, emitted
      on frames where the locked tier abstains but the chain's offline label passes the lower bar; its own output field
      (Result.probable; outputs per_frame tier / probable_label, probable_log), never repeated in a frame, never written
      to the locked label, so swap_events, idsw, IDF1, HOTA, coverage and stats are unchanged. New metrics
      probable_coverage_gain and probable_error_rate (metrics.probable_metrics, harness rows and summary), acceptance
      ACC-P1. Coverage levers recorded as planned work PW-1 (60 fps), PW-2 (more jersey reads), PW-3 (position
      precision).
    why: >-
      owner decision 25 Oct 2026 (OQ-5): keep the zero-swap rule absolute and treat coverage as the thing to improve; a
      separately flagged probable tier may be shown to viewers but never feeds stats or any metric that counts locked
      identity; its coverage gain and its error rate are both reported, and wrong probable labels are logged, not
      counted as locked swaps.
    evidence: >-
      SportVU harness (3 games G1-G3, config full, offline, 251 s wall, 4 workers): every locked metric of all 228 result
      rows identical before / after (swap_events, idsw, wrong-label frames, IDF1, HOTA, coverage, re-confirm, alarms,
      splits). Probable tier, good video, sigma_p 0.15 / 0.30 / 0.50 m: coverage 0.593 / 0.463 / 0.255 -> with probable
      0.694 / 0.547 / 0.319 (gain +0.102 / +0.084 / +0.064); probable labels wrong 161 of 176,224 / 182 of 145,295 / 82 of
      111,230 (error rate 0.09 / 0.13 / 0.07 %; 13 / 14 / 10 wrong runs; 2 probable frames on officials at 0.50).
      Poor video (calibrated): gain +0.299 / +0.202 / +0.117 (coverage 0.120 / 0.091 / 0.024 -> 0.419 / 0.293 / 0.141),
      error rate 0.18 / 0.06 / 0.06 % (42 / 18 / 15 wrong runs). Poor video read with good-video parameters
      (poor_uncalibrated): error rate 1.39 / 1.00 / 1.28 % (148 / 87 / 86 wrong runs), so calibration per recording
      quality applies to the probable tier too. Threshold check on 12 min of G1 (good 0.15 / 0.30 / 0.50, poor 0.30):
      (p 0.8, margin 0.5) raised the gain by 0.01-0.04 but wrong labels rose 32 -> 54 at good 0.30 and 11 -> 129 on poor;
      (0.95, 1.5, own 0.25) cut the gain by about a fifth with the same 32 wrong at good 0.30. Tests test_od8_single_sighting_gives_a_probable_label_not_a_lock,
      test_od8_elimination_never_gives_a_probable_label, test_od8_probable_tier_never_changes_locked_labels,
      test_owner_decisions_25_oct_recorded.
  - id: OD-9
    what: >-
      requirement.recording_standard: any game that feeds player-level numbers needs >= 1080p and >= 59.94 fps; below it
      the game feeds team-level numbers only or probable-only player labels (acceptance ACC-R1, metric
      recording_standard). Action items AI-1 (ask MSU staff for ShotTracker player ids as identity truth) and AI-2
      (agree the recording standard with whoever records MSU games), both owned by Aldemir.
    why: >-
      owner decision 25 Oct 2026 (OQ-6, OQ-4): poor recordings stop appearance from separating teammates, and exact
      identity truth for MSU games would replace hand labels in the gold sample.
    evidence: >-
      Harness, full offline, poor vs good video at sigma_p 0.30 m: locked coverage 0.091 vs 0.463; read with good-video
      parameters (poor_uncalibrated) 1 / 1 / 4 swap events at 0.50 / 0.30 / 0.15 m (section 1). Test
      test_owner_decisions_25_oct_recorded.
  - id: OD-10
    what: >-
      outputs.live_panel: the live panel shows a locked label or HOLD with the candidate list (candidate_min_p); never a
      provisional, unconfirmed or probable label. confidence_and_abstention rule and outputs per_frame say so; the
      solver's live result carries no probable label (Result.probable is None live).
    why: 'owner decision 25 Oct 2026 (OQ-2): HOLD with candidates is acceptable live; provisional labels would invite stats from guesses.'
    evidence: Live labels and live metrics unchanged (harness rows identical). Tests test_od8_single_sighting_gives_a_probable_label_not_a_lock (live carries no probable label), test_owner_decisions_25_oct_recorded.

open_questions:
- id: OQ-1
  question: Hair (style, colour) is listed as an appearance cue in requirements line 151 but can act as an ethnicity proxy; 0.1.0 excludes hair and skin entirely (head and skin masked). Keep the exclusion?
- id: OQ-2
  question: 'Live labels: is HOLD acceptable on the live panel (with the candidate set), or do you want a provisional label marked "unconfirmed"? The zero-swap rule is met only if provisional labels never feed stats.'
  decision: 'Decided 25 Oct 2026 (OD-10): the live panel shows HOLD with the candidate list when unsure; no provisional labels (outputs.live_panel).'
- id: OQ-3
  question: Jersey read rate and OCR error at our recording quality are the largest unknowns (the harness assumes 0.6 sightings per second and 5 % error for good video). Measure them on the first labelled MSU game before tuning anything else?
- id: OQ-4
  question: ShotTracker ids from MSU staff would give exact identity truth for MSU home games; ask staff?
  decision: 'Decided 25 Oct 2026 (OD-9): yes - action item AI-1 (open_items).'
- id: OQ-5
  decision: 'Decided 25 Oct 2026 (OD-8): zero swaps stays absolute; a flagged probable tier is added (offline, viewer-only, never feeds stats; coverage gain and error rate measured on the harness); coverage levers (60 fps, more jersey reads) are planned work PW-1 / PW-2.'
  question: 'Zero swaps costs coverage. On the harness the spec labels about 59 % / 46 % / 26 % of player boxes offline at sigma_p 0.15 / 0.30 / 0.50 m (good video) and only 2-12 % on poor video, against ACC-3/ACC-4 targets of IDF1 >= 0.80 and coverage >= 0.85. Keep the zero-swap rule absolute and treat coverage as the thing to improve (better position precision during encounters, 60 fps, more jersey reads), or allow a separately flagged "probable" label tier for analysis that never feeds stats?'
- id: OQ-6
  question: 'Poor recordings (720p, low bitrate, dim): appearance stops separating teammates, so labels wait for two jersey sightings. Should we set a minimum recording standard (1080p, 60 fps) for any game that feeds player-level numbers?'
  decision: 'Decided 25 Oct 2026 (OD-9): yes - requirement.recording_standard and acceptance ACC-R1 (below it: team-level only or probable-only).'

open_items:
- id: AI-1
  action: Ask MSU staff for ShotTracker player ids (per-player tracking ids of MSU home games) as identity truth for the gold sample and for re-measuring coverage and probable-tier errors on MSU video.
  owner: Aldemir (owner decision 25 Oct 2026, OD-9)
  status: open
  feeds: [gold_sample, ACC-1, ACC-P1]
- id: AI-2
  action: 'Agree the recording standard (1080p, 59.94 fps main wide camera) with whoever records MSU games; until a game meets it, it feeds team-level numbers only or probable-only labels (ACC-R1).'
  owner: Aldemir (owner decision 25 Oct 2026, OD-9)
  status: open
  feeds: [requirement.recording_standard, ACC-R1]

planned_work:
- id: PW-1
  lever: 60 fps recordings
  why: 'Coverage lever (OD-8): twice the frames per jersey sighting window and less motion blur raise jersey_sightings_per_s; the zero-swap bar stays.'
  measure: re-run the harness with a 60 fps cue profile once MSU 60 fps footage gives a measured read rate (OQ-3)
- id: PW-2
  lever: more jersey reads (OCR on front and back, partial digits, more crops per sighting)
  why: 'Coverage lever (OD-8): jersey sightings are the only cue that separates same-build teammates (twin rule) and the main driver of re-confirmation after crossings.'
  measure: jersey read rate and OCR error on the first labelled MSU game (OQ-3), then the harness coverage at the measured rate
- id: PW-3
  lever: better position precision during encounters
  why: 'Coverage falls with sigma_p (section 1); two players closer than about 4 sigma cannot be kept apart by motion.'
  measure: tracker sigma_p on MSU film (movement noise model)

review_round_1:
- id: RV-01
  finding: 'Cutting both tracklets at every frame of a close encounter (pair-swap test) made 1.6 tracklets per frame: a defender 1 m from his man restarted his identity every frame, and every child had dozens of parents.'
  fix: Encounter groups - a failing track continues as an unlabelled amb segment and leaves the group as one clean tracklet with explicit parents after clear_s.
  evidence: 'SportVU game G1, first 5 min, sigma_p 0.3: 12,054 tracklets -> 3,117; offline coverage 0.00 -> 0.48.'
- id: RV-02
  finding: 'Hidden-person swaps: a track whose own box is missing takes the box of a teammate who was hidden behind someone (no active track, so no pair test); clean tracklets were impure at their edges.'
  fix: Jump test, contested-detection likelihood test (contest_s, v_err_mps, a_max_mps2, contest_prior_nats), newcomer test, leading and trailing guards, decision delay of clear_s. A first, radius-based contest test was rejected (it left 50-60 % of boxes in amb segments).
  evidence: 'Impure clean tracklets (5 min, sigma_p 0.15 / 0.3): 144 -> 2 / 1; full-game offline swap events fell from 6-10 per game to 1-8 before RV-05.'
- id: RV-03
  finding: Opponent pairs (most close encounters - a defender on his man) were cut like teammates, leaving about 40 % of boxes on HOLD at sigma_p 0.3.
  fix: Opponent pairs with confident, different classes are not cut; team colour separates them, with a colour veto in the pair test, a per-box colour HOLD (confidence rule f) and a live class alarm (class_window_s); every encounter stays a split point.
  evidence: 5 min, sigma_p 0.3, offline coverage 0.48 -> 0.56; the colour HOLD removed the 1-2 frame opponent tails that were the last full-game swaps.
- id: RV-04
  finding: SportVU itself re-assigns player ids at some substitutions without a wall-clock gap (players teleport 6 m in 0.04 s); the harness scored the source's own swap.
  fix: sportvu_truth marks a gap (camera cut) where the on-court set changes or any player moves more than 1 m in one frame.
  evidence: 'Game G1 one substitution: players 0, 5, 8 exchange positions; gaps 105 -> 123.'
- id: RV-05
  finding: 'A group child inherited a parent''s label when a teammate hidden for longer than link_window_s stepped out of the encounter (the true identity was not in the group); with leak 0.02 the prior alone almost locked.'
  fix: Adaptive leak (leak_min + leak_eps x unseen candidates / candidates) and the own-cue support rule (own_margin_nats - priors can speed a lock, never decide it).
  evidence: 'Full games, sigma_p 0.15-0.5: pure-chain mislabels of 4-46 frames disappeared; a tolerance version (own cues may disagree by 1 nat) still let one through.'
- id: RV-06
  finding: 'One confusable misread (8 read as 3, 7 read as 80) locked a label: a single sighting carried about 4-7 nats.'
  fix: sighting_cap_nats 4 for locking (two agreeing sightings needed); uncapped sightings for the offline change-point test, where more evidence only adds splits.
  evidence: Full game G1, sigma_p 0.15 - chain labelled 16 for player 20 from one confusable read.
- id: RV-07
  finding: Same-team same-build pairs (the twins hard case) swapped on appearance alone, because template noise biases the appearance evidence the same way every frame.
  fix: Per-game confusable pairs from the reference pack (confusable_rate) - a lock against a confusable teammate needs twin_jersey_nats (5) of own jersey evidence.
  evidence: 'Game G3, sigma_p 0.3: twin 0 labelled 3 for 46 frames offline -> 0.'
- id: RV-08
  finding: When an offline split had equally good candidate points (no evidence between them), the first was taken and the frames up to the true swap were mislabelled.
  fix: Every point within split_tie_nats of the best is equally plausible; the stretch between them stays unlabelled.
  evidence: test_injected_tracker_swap_is_split_offline.
- id: RV-09
  finding: Offline labels used only forward information (parents to children); a chain confirmed late could not help its parents.
  fix: Offline forward and backward identity messages through the chain graph (directional_mixtures), each using only its own direction so no cue is counted twice.
  evidence: '5 min, sigma_p 0.15: offline coverage 0.48 -> 0.71 before the safety rules of RV-05 to RV-07 (which brought it back to about 0.6).'
- id: RV-10
  finding: Catching swaps after the fact does not replace prevention.
  fix: Kept as a harness config (naive_tracklets_full_catch) and stated in the doc; alarms and splits are the safety net, not the mechanism.
  evidence: See section 1 results.
