  - id: composition
    research_id: DM-RULE-08
    level: rule
    name: Composition grammar for defensive chains
    aliases: [compositional coverage name]
    actors: all
    t0: first event of the chain
    rule: >-
      A chain is an ordered list of this family's events sharing one trigger, or linked within 1.5 s (45 frames) where
      each next event's actors intersect the previous one's. Name = ' -> '.join(kind[class]) in t0 order; stored as
      set_instances.compositional_name and action_sequence = [{kind, actors, t0, start, end, conf, attrs}]. One
      'unknown' placeholder of <= 1.5 s keeps a chain alive; a chain ends at a shot, turnover, foul, SET_DEF or a 3.0 s gap.
      Chain conf = product of member confs (MP-16 sets).
    params: {}
    min_duration_s: null
    outputs: [compositional_name, action_sequence]
    confidence: proposal
    noise: a missed middle event splits a chain unless the placeholder bridges it
    conflicts_resolved: []
    sources:
      - {url: "repo:schema/tables/set_instances.yaml (compositional_name, action_sequence)", supports: "name plus full sequence storage (R-ST-06)"}
    status: proposal
    detectability: rule
    detector: null

  # ------------------------------------------------------------------------------------------------ primitives
  - id: def_locomotion
    research_id: DM-P01
    level: primitive
    name: Defensive locomotion relative to the facing proxy (forward / lateral / backpedal)
    aliases: [slide (proxy), backpedal, turn and run]
    actors: any defender
    t0: first frame of the class run
    rule: >-
      Facing proxy (no pose): toward H for the defender whose top-1 is the holder, else toward the midpoint of man and
      ball. angle = angle between velocity and facing. def_forward <= forward_max_deg, def_lateral between,
      def_backpedal >= backward_min_deg; only at speed >= v_min (one gate: heading is invalid below 1.0 m/s, check
      fix) and significantly moving (stationary_s2 >= stand_s2, MP-09); class held >= min_s with exit gaps <=
      exit_gap_s bridged; the run's window-mean P(speed >= v_min) must reach p_move_min (loop 1 DEF-T11). Slide vs crossover run needs pose (foot order)
      and is not emitted.
    params:
      v_min: {value: 1.0, unit: m/s}
      min_s: {value: 0.4, unit: s}
      forward_max_deg: {value: 45, unit: deg}
      backward_min_deg: {value: 135, unit: deg}
      exit_gap_s: {value: 0.233, unit: s}
      proxy_conf_factor: {value: 0.8, unit: "1", note: "proxy facing is not torso facing"}
      p_move_min: {value: 0.75, unit: "1", note: "loop 1 DEF-T11: window mean of P(smoothed speed >= v_min | sigma_speed) over the class run; harness NEG_slow_shuffle (true 0.78 m/s) runs score ~0.64, real slides / step-ups >= 0.9"}
    min_duration_s: 0.4
    outputs: [class, mean_speed, facing_source, alternatives]
    confidence: "window mean of P(angle in band) with sigma_heading = sigma_speed / speed, x window mean P(speed >= v_min), x proxy_conf_factor"
    noise: The proxy is wrong when the defender turns his head to the ball off-ball. sim.py heading RMSE jog 8-9 deg.
    conflicts_resolved:
      - "Heading gate 0.5 vs 1.0 m/s: 1.0 m/s for every class (check fix)."
      - "KINEMATICS family owns body-frame backpedal / defensive slide; this item is the ball-relative proxy class."
    sources:
      - {url: "repo:config/vocab/actions_extra.yaml:152-163", supports: "movement direction classes, 0.40 s"}
    status: proposal
    detectability: xy
    detector: detect_def_locomotion
    kinds: [def_forward, def_lateral, def_backpedal]

  - id: closeout
    research_id: DM-P02
    level: primitive
    name: CLOSEOUT (pass-triggered approach to the receiver)
    aliases: [close out, closeout to shooter]
    actors: closer D, receiver A
    t0: t_catch of A
    rule: >-
      Window W = [t_rel - pre_release_s, min(t_catch + window_after_catch_s, next pass or shot release)]. For every
      defender: t_s = first frame in W with v_to(A) >= v_start held >= start_hold_s; t_pk = argmax smoothed speed in
      [t_s, W_end]; t_e = first frame after t_pk where D is stationary (s2 < stand_s2; else W_end). The defender with the largest
      distance reduction is the closer. Gates (5-frame means): dist(t_s) >= start_dist_min; chord |D(t_e) - D(t_s)| >=
      chord_min; dist(t_s) - dist(t_e) >= dist_drop_min; smoothed peak >= peak_speed_min (sprint flag at
      sprint_flag_speed); end dist <= end_dist_max. The landing angle at A between A->D and A->rim is a quality
      attribute, not a gate (loop 1 DEF-T15): landing_side rim_side when P(angle <= landing_angle_max) >= 0.5, else
      high_side (named_spots closeout_landing side test).
    params:
      pre_release_s: {value: 0.2, unit: s}
      window_after_catch_s: {value: 1.5, unit: s}
      v_start: {value: 1.5, unit: m/s}
      start_hold_s: {value: 0.2, unit: s}
      v_end: {value: 1.0, unit: m/s}
      start_dist_min: {value: 3.0, unit: m}
      chord_min: {value: 2.5, unit: m}
      dist_drop_min: {value: 2.0, unit: m}
      peak_speed_min: {value: 2.5, unit: m/s, note: "CA-RTS smoothed; sim.py 2.5 m chord in 1.0 s peaks 3.39 smoothed"}
      peak_speed_min_q10: {value: 2.0, unit: m/s, note: "q = 10 smoother tier (loop 2, NEW-R1): sim.py 2.5 m chord in 1.0 s peaks 3.13 +- 0.39 smoothed at sigma 0.3 (q30) and 2.52 +- 0.41 at sigma 0.5 (q10), 60 seeds; 2.5 x 2.52 / 3.13 = 2.0"}
      sprint_flag_speed: {value: 3.5, unit: m/s, note: "smoothed (research 4.0 m/s true was unreachable)"}
      end_dist_max: {value: 2.0, unit: m, note: "one event owns hard / standard / short (check fix)"}
      landing_angle_max: {value: 60, unit: deg}
    min_duration_s: 0.3
    outputs: [latency_s, closeout_distance_m, closeout_speed_mps, end_dist_m, angle_deg, landing_side, p_rim_side, sprint, t_s, t_e, gates]
    confidence: "P_cond = product of the five gate probabilities; conf x edge x gap. Gate sigmas (loop 2 NEW-R1): start / end dist sigma_rel; dist_drop (a pair-distance change) sqrt(2) sigma_rel; chord (ONE track's displacement) sigma_own = max(K_CAL sqrt(2 mean var_p), k_floor sigma_p); peak speed sigma_speed against peak_speed_min, or peak_speed_min_q10 in the q = 10 tier"
    noise: Chord, not path length (path inflates under noise). End distances 0.8 vs 1.2 m are about 1 sigma_rel apart.
    conflicts_resolved:
      - "Peak >= 4 m/s (defense 0.4) unreachable for short closeouts and further cut by smoothing: 2.5 m/s smoothed gate, 3.5 m/s sprint flag."
      - "End gate 1.5 -> 2.0 m so short closeouts are not split between CLOSEOUT and RECOVER (check fix)."
    sources:
      - {url: "repo:docs/taxonomy/defense_full.md 0.4 CLOSEOUT, A0 RECOVER, F7.5", supports: "2.5 m, 1.5 m, RECOVER 1.5/2.0"}
      - {url: "repo:config/named_spots.yaml closeout_landing", supports: "landing within 1.5 m, rim side <= 60 deg"}
      - {url: "https://cleaningtheglass.com/how-do-nba-defensive-rotations-work/", supports: "hard vs short closeouts (concept)"}
    status: proposal
    detectability: xy
    detector: detect_closeout
    kinds: [closeout]

  - id: closeout_length
    research_id: DM-P03
    level: primitive
    name: Closeout length class (hard / standard / short)
    aliases: [hard closeout, short closeout, long closeout]
    actors: D, A
    t0: t_catch (same event as closeout)
    rule: >-
      e = 5-frame mean dist(D, A) at t_e of the CLOSEOUT. closeout_hard e <= hard_max; closeout_standard hard_max < e <=
      standard_max; closeout_short standard_max < e <= short_max. The class is the band containing e (loop 1: the argmax
      of the band probabilities never picks the 0.4 m standard band once sigma_rel ~ 0.4 m); soft band probabilities
      with sigma_rel are the alternatives; tight_p =
      P(hard) + P(standard) is also stored because the 0.8 m edge sits near the two-body floor.
    params:
      hard_max: {value: 0.8, unit: m}
      standard_max: {value: 1.2, unit: m}
      short_max: {value: 2.0, unit: m}
    min_duration_s: null
    outputs: [length_class, alternatives, tight_p, end_dist_m]
    confidence: "closeout P_cond x P(class)"
    noise: Centre-to-centre distance floor about 0.5 m; expect many standard calls; keep probabilities.
    conflicts_resolved:
      - "Sprint-stop 0.6-1.0, hard <= 0.8, choppy 0.8-1.2, short 1.2-2.0 overlapped in the repo: length lives on this axis only."
    sources:
      - {url: "repo:docs/taxonomy/defense_full.md A0 RECOVER, M-4, M-1(c)", supports: "hard <= 0.8, short 1.2-2.0"}
      - {url: "repo:config/named_spots.yaml closeout_landing", supports: "length classes listed with the landing spot"}
    status: proposal
    detectability: xy
    detector: detect_closeout_length
    kinds: [closeout_hard, closeout_standard, closeout_short]

  - id: closeout_profile
    research_id: DM-P04a/DM-P04b
    level: primitive
    name: Closeout deceleration profile (sprint-stop / mixed / choppy)
    aliases: [sprint and stop, one-two stop, choppy feet, stutter closeout]
    actors: D
    t0: t_catch (same event as closeout)
    rule: >-
      Only when the smoothed peak >= profile_min_peak. i_l = last frame after the peak with speed >= 0.8 v_pk; i_s =
      first later frame with speed <= 1.0 m/s; d_dec = 3-frame mean chord i_l -> i_s; implied mean deceleration a_dec =
      ((0.8 v_pk)^2 - 1.0^2) / (2 d_dec). closeout_sprint_stop a_dec >= sprint_stop_min_decel; closeout_choppy a_dec <=
      choppy_max_decel; closeout_mixed between. sigma(a_dec) propagated from sigma_speed and sigma_rel (floor 0.3).
    params:
      profile_min_peak_q10: {value: 2.3, unit: m/s, note: "loop 1 DEF-T13: q = 10 tier. 60 runs each: choppy peak p10 2.83 -> 2.54, sprint-stop p10 3.82 -> 3.02, walk-up mean 2.28 -> 2.19 (q30 sigma 0.3 -> q10 sigma 0.5)"}
      choppy_max_decel_q10: {value: 2.9, unit: m/s^2, note: "loop 1 DEF-T13: q = 10 tier. Implied deceleration, 60 runs at sigma 0.5 (q10): choppy 2.45 +- 0.64, sprint-stop 3.80 +- 0.71 (q30 sigma 0.3: 2.57 / 5.73)"}
      sprint_stop_min_decel_q10: {value: 3.3, unit: m/s^2, note: "loop 1 DEF-T13: q = 10 tier (see choppy_max_decel_q10); d prime ~2.0, reported with alternatives only"}
      profile_min_peak: {value: 2.5, unit: m/s}
      choppy_max_decel: {value: 3.5, unit: m/s^2, note: "sim.py (24 seeds): fastest physical min-jerk stop 5.4 +- 0.8, 1.5x slower 3.4 +- 0.8; calibrate on film"}
      sprint_stop_min_decel: {value: 4.5, unit: m/s^2, note: "class separation d' ~ 2.4 at sigma_p 0.3 AR(1): keep the soft output"}
    min_duration_s: null
    outputs: [profile_class, a_dec_mps2, d_dec_m, t_dec_s, alternatives]
    confidence: "closeout P_cond x P(class)"
    noise: CA-RTS spreads a sharp stop over about 0.3 s; the implied deceleration uses distance, not peak acceleration.
    conflicts_resolved:
      - "Research d_dec <= 0.6 m and t_dec <= 0.4 s scale with v_pk^2 and mislabel long crisp closeouts as choppy (check, high): replaced by a_dec."
    sources:
      - {url: "repo:docs/taxonomy/defense_full.md F7.5, M-1(c)", supports: "sprint-stop and choppy signatures (MSU choppy documented)"}
    status: proposal
    detectability: xy
    detector: detect_closeout_profile
    kinds: [closeout_sprint_stop, closeout_mixed, closeout_choppy]

  - id: closeout_fly_by
    research_id: DM-P04c
    level: primitive
    name: Closeout profile fly-by
    aliases: [run-by, contest and run past]
    actors: D, receiver / shooter A
    t0: closest-approach frame (shot release offset stored)
    rule: >-
      After a pass to A, within [t_catch, t_catch + window_after_catch_s]: closest approach of D to A (interior
      minimum) with 3-frame mean distance <= cpa_max, smoothed speed at the approach >= cpa_speed_min, overshoot =
      max over [t_cpa, t_cpa + overshoot_window_s] of (D - A(t_cpa)) . u_heading >= overshoot_min, and speed >=
      keep_speed_min for keep_speed_s after the approach. on_shot = a shot by A within shot_sync_s.
    params:
      span_before_cpa_s: {value: 0.5, unit: s, note: "event start before the closest approach (was a literal, DEF-T20)"}
      window_after_catch_s: {value: 1.5, unit: s}
      cpa_max: {value: 1.0, unit: m}
      cpa_speed_min: {value: 2.5, unit: m/s, note: "research 3.0 true; smoothed calibration"}
      overshoot_window_s: {value: 0.6, unit: s}
      overshoot_min: {value: 1.0, unit: m}
      keep_speed_s: {value: 0.3, unit: s}
      keep_speed_min: {value: 1.75, unit: m/s, note: "research 2.0 true; smoothed calibration"}
      shot_sync_s: {value: 0.3, unit: s}
    min_duration_s: null
    outputs: [min_dist_m, speed_at_cpa_mps, overshoot_m, on_shot]
    confidence: "product of the four gates"
    noise: Bodies pass within 1 m; identity swaps likely (require id confidence >= 0.8 when available). No jump flag without z.
    conflicts_resolved:
      - "t0 at the closest approach (measurement-defined, MP-17) instead of the shot release, so pump-fake fly-bys are kept."
    sources:
      - {url: "repo:docs/taxonomy/defense_full.md F7.5 Fly-by", supports: "within 1 m, continues >= 1 m"}
      - {url: "https://cleaningtheglass.com/how-do-nba-defensive-rotations-work/", supports: "closeouts that fly past shooters (concept)"}
    status: proposal
    detectability: xy
    detector: detect_closeout_fly_by
    kinds: [closeout_fly_by]

  - id: closeout_smart
    research_id: DM-P04d
    level: primitive
    name: Smart / fake closeout and zone on-and-off
    aliases: [fake closeout, stop-and-lunge, bump back]
    actors: "D, A (zone: D, D2)"
    t0: stop frame
    rule: >-
      SMART: D stops (s2 < 5.99) at dist 1.5-2.5 m from A, then lunges >= 0.5 m toward A within 0.6 s. ZONE_ON_OFF
      (zone posterior >= 0.6): D closes to <= 1.5 m of the holder, a teammate arrives within 1.5 m, D retreats >= 1.5 m
      within 1.5 s.
    params: {}
    min_duration_s: null
    outputs: [stop_dist_m, lunge_m]
    confidence: low
    noise: The 0.5 m lunge is at the AR(1) noise floor (check DM-RULE-03); zone on-off needs the zone posterior.
    conflicts_resolved: []
    sources:
      - {url: "repo:docs/taxonomy/defense_full.md F7.5 Smart closeout, Zone on and off", supports: "definitions"}
    status: proposal
    detectability: needs_data
    needs_data: ["measured noise model (noise_model) or pose for the 0.5 m lunge", "zone posterior (zone family) for zone_on_off"]
    detector: detect_closeout_smart

  - id: recover
    research_id: DM-P07
    level: primitive
    name: RECOVER (help-to-man return)
    aliases: [recover, get back to your man]
    actors: D, matchup A
    t0: start of the approach (v_to(A) >= v_start held >= start_hold_s)
    rule: >-
      Any approach of D to A (v_to(A) >= v_start held >= start_hold_s) with A = D's jointly assigned attacker (one-to-one
      assignment over all defenders, loop 1 DEF-T17) both pre_matchup_s before the start and at the end (else it is a
      rotation); chord >= chord_min, distance drop >= dist_drop_min, start dist >= start_dist_min, end dist <=
      end_dist_max; end as in closeout (first frame after the peak with stationary_s2 < stand_s2) within tail_s after
      the approach; one recover per defender within dedupe_s.
      Approaches already labelled CLOSEOUT are excluded (closeout = the pass-triggered case).
    params:
      dedupe_s: {value: 1.0, unit: s, note: "one recover per defender within this (was a literal, DEF-T20)"}
      v_start: {value: 1.5, unit: m/s}
      start_hold_s: {value: 0.2, unit: s}
      tail_s: {value: 1.5, unit: s}
      pre_matchup_s: {value: 1.0, unit: s}
      chord_min: {value: 1.5, unit: m}
      dist_drop_min: {value: 1.0, unit: m}
      start_dist_min: {value: 2.5, unit: m}
      end_dist_max: {value: 2.0, unit: m}
    min_duration_s: 0.3
    outputs: [chord_m, end_dist_m, peak_speed]
    confidence: "product of four gates"
    noise: A 1.5 m chord is safe at sigma_p <= 0.5 m.
    conflicts_resolved:
      - "RECOVER is no longer a superset of CLOSEOUT; pass-triggered approaches are CLOSEOUT (check fix)."
    sources:
      - {url: "repo:docs/taxonomy/defense_full.md A0 RECOVER", supports: "1.5 m / 2.0 m"}
    status: proposal
    detectability: xy
    detector: detect_recover
    kinds: [recover]

  - id: sink
    research_id: DM-P08
    level: primitive
    name: Sink / sag (dynamic)
    aliases: [sink, sag, drop to the lane, shrink]
    actors: off-ball D, matchup A, handler H
    t0: onset of D's movement toward the rim (v_r >= onset_v_r held >= onset_hold_s); trigger frame stored
    rule: >-
      Trigger: drive or post catch. hd = r_A - r_D. SINK if hd rises >= delta_hd_min within window_s of the trigger
      (5-frame means), D's own r falls >= own_dr_min, and D stays > min_dist_handler from H (else the help ladder owns
      it). End spot: named_spots sink_sag evaluated at the peak. Team shrink = >= 3 sinks within one trigger (composition).
    params:
      window_s: {value: 1.2, unit: s, note: "research 0.7 s unreachable from a stance (check, high): 0.25 + sqrt(2*1.5/4.5) = 1.07 s"}
      delta_hd_min: {value: 1.5, unit: m}
      own_dr_min: {value: 1.0, unit: m}
      min_dist_handler: {value: 2.0, unit: m}
      onset_v_r: {value: 1.0, unit: m/s}
      onset_v_r_q10: {value: 1.4, unit: m/s, note: "q = 10 tier (sigma_p >= 0.45, loop 2 NEW-R2): onset frame vs truth (v_r >= 1.0) over wing_sink / corner_fills_wing x 20 seeds x 2 mirrors: threshold 1.0 bias -4.7 frames, 82 % within 0.3 s; 1.4 bias -1.2 frames, 97 % (q30 at sigma 0.3: 1.0 gives 100 %)"}
      onset_hold_s: {value: 0.2, unit: s}
    min_duration_s: 0.3
    outputs: [delta_hd_m, latency_s, end_spot_sink_sag]
    confidence: "product of three gates: help-depth rise with sqrt(2) sigma_rel, own r change with sigma_own (one track), min dist to H with sigma_rel(D, H) (loop 2 NEW-R1; was sqrt(2) sigma_rel for all three). t0 onset threshold onset_v_r_q10 in the q = 10 tier"
    noise: If A cuts outward hd rises with no D movement; the own-r gate prevents that.
    conflicts_resolved:
      - "F7.3 dynamic sink and named_spots sink_sag agree on 1.5 m; window lengthened by the physics check."
    sources:
      - {url: "repo:docs/taxonomy/defense_full.md F7.3", supports: "help depth >= 1.5 m"}
      - {url: "repo:config/named_spots.yaml sink_sag", supports: "static sink geometry"}
    status: proposal
    detectability: xy
    detector: detect_sink
    kinds: [sink]

