      the frames within lock distance; loop 1 DEF-T09: a defender shooting the gap under the screen also leads the
      cutter but sits on the screener's side).
      Otherwise the research lambda/s crossing (DM-RULE-05) with U = C: lambda = (p - P_s).u along C's travel, n
      toward the side C crosses on; at the defender's first crossing s_X = (X - S).n >= -class_margin -> trail,
      else under; no_cross. (The ball-screen S -> X-big axis is not used: on curls it runs parallel to the cut.) Jam and step-under need body
      contact / sub-noise moves and are not emitted.
    params:
      lock_lat_tol: {value: 0.5, unit: m, note: "loop 1 DEF-T09: mean offset toward the screener's side of the cutter's path must be <= this. Harness pin-down truth over [t0 - 1 s, t0]: top-lock 0.0 m, under 0.99 m (min 0.72); 0.5 m is the midpoint (0.3 m cut top-lock recall to 14/20 at sigma 0.3)"}
      defender_back_s: {value: 0.5, unit: s, note: "cutter / screener defenders read this long before t0 (was a literal, DEF-T20)"}
      span_after_s: {value: 1.0, unit: s, note: "event end after t0 (was a literal, DEF-T20)"}
      lock_back_s: {value: 1.0, unit: s}
      lock_lead_min: {value: 0.3, unit: m, note: "sub-noise: a true 0.5 m lead is detected in 5/12 seeds at sigma_p 0.3 AR(1)"}
      lock_dist_max: {value: 1.0, unit: m}
      lock_min_s: {value: 0.4, unit: s}
    min_duration_s: 0.4
    outputs: [class, alternatives, lock_s]
    confidence: "P(class)"
    noise: the 0.3 m lead is sub-noise; soft output
    conflicts_resolved: ["named_spots offball_top_lock / offball_trail / offball_under_gap are deferred to this event layer."]
    sources:
      - {url: "repo:docs/taxonomy/defense_full.md F5, OB-3", supports: "thresholds"}
      - {url: "repo:config/named_spots.yaml offball_top_lock", supports: "deferred definition"}
    status: proposal
    detectability: xy
    detector: detect_offball_screen_coverage
    kinds: [top_lock, trail, under, no_cross]

