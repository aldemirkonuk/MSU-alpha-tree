  - id: trap
    research_id: DM-RULE-07
    level: action
    name: TRAP (two on the ball)
    aliases: [double team, blitz core]
    actors: D1, D2, holder H
    t0: entry frame
    rule: >-
      Enter: dist(D1, H) <= enter_dist and dist(D2, H) <= enter_dist and dist(D1, D2) <= pair_dist while H holds (<= 3
      frame holder gaps bridged); exit when any distance exceeds its threshold + exit_h (gaps <= dwell_frames bridged);
      hold >= min_s. Loop 4: no hold while the ball XY is within rim_ball_r of either rim or H is inside the restricted area
      (shot / tip / rebound scramble, L4-TRAP-RIM); no trap when H's median smoothed speed over the stay > handler_v_max
      (a drive or a transition push past two defenders, L4-TRAP-MOVING). No trap when H's own shot reaches a rim within shot_after_s of the stay end with no other holder in between (a contested drive / post move, L4-TRAP-SHOT). Commitment (loop 1 DEF-T01): when both 5-frame-mean distances stay inside enter_dist for less than
      trap_commit_s and H still holds the ball after the stay, a trapper who retreats >= trap_release_dist from his
      closest distance within trap_release_s makes it a dig / show, not a trap. t0 is back-dated from the entry while
      both 5-frame-mean distances are inside the middle of the hysteresis band (enter_dist + exit_h / 2, pair_dist +
      exit_h / 2), H holds and the trappers are still closing, at most backdate_max_s (loop 2, DEF-T18). Existence (p_emit) uses the middle of
      the hysteresis band (enter_dist + exit_h / 2); conf uses the entry threshold enter_dist (loop 1 DEF-T02c,
      DEF-T12b). Location: press (y > HALF_Y), corner (m <= corner_angle_max_deg and y <= BREAK_Y), sideline (|x| >=
      sideline_abs_x_min, y > BREAK_Y), baseline (y <= baseline_y_max), post_area (r <= post_r_max), middle.
    params:
      trap_commit_s: {value: 1.0, unit: s, note: "loop 1 DEF-T01: a stay shorter than this that one defender abandons while H keeps the ball is no trap"}
      trap_release_s: {value: 0.5, unit: s, note: "loop 1 DEF-T01: release window after the stay"}
      trap_release_dist: {value: 1.0, unit: m, note: "loop 1 DEF-T01: retreat from H within trap_release_s that marks a dig / show"}
      corner_angle_max_deg: {value: 12, unit: deg, note: "location: corner when the handler is within this angle of the baseline (was a literal, DEF-T20)"}
      sideline_abs_x_min: {value: 5.5, unit: m, note: "location: sideline (was a literal, DEF-T20)"}
      baseline_y_max: {value: 1.0, unit: m, note: "location: baseline (was a literal, DEF-T20)"}
      post_r_max: {value: 4.5, unit: m, note: "location: post area (was a literal, DEF-T20)"}
      enter_dist: {value: 1.5, unit: m}
      pair_dist: {value: 2.5, unit: m}
      exit_h: {value: 0.3, unit: m}
      min_s: {value: 0.6, unit: s}
      handler_v_max: {value: 2.0, unit: m/s, note: "loop 4 L4-TRAP-MOVING: median smoothed handler speed over the stay <= the walk edge (kinematics walk < 2.0 m/s, walk-run transition)"}
      shot_after_s: {value: 1.5, unit: s, note: "loop 4 L4-TRAP-SHOT: no trap when H's own shot reaches a rim (ball XY within globals.rim_ball_r, no other attacker holding in between) within this long after the stay end; a 3-6 m release at 7-10 m/s reaches the rim in < 1 s plus a gather step"}
    min_duration_s: 0.6
    outputs: [location, handler_dr_m, duration_s]
    confidence: "window mean of P(d1 <= enter_dist) x P(d2 <= enter_dist) (entry threshold, loop 1); p_emit at enter_dist + exit_h / 2; interp_short carry x 0.8"
    noise: three bodies within 1.5 m cause merges; carry one trapper up to the MP-05 short gap
    conflicts_resolved: ["named_spots pnr_big_blitz uses 1.5 m to the handler: consistent."]
    sources:
      - {url: "repo:docs/taxonomy/defense_full.md 0.4 TRAP, A0 FAKE_TRAP, F6.3", supports: "1.5 m / 2.5 m / 0.6 s"}
    status: canonical
    detectability: xy
    detector: detect_trap
    kinds: [trap]

