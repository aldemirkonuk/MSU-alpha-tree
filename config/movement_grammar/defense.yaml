  - id: jump_to_ball
    research_id: DM-P13
    level: primitive
    name: Jump to the ball (on a pass)
    aliases: [jump to the ball, move on the flight]
    actors: passer's defender D, passer P, receiver
    t0: pass release
    rule: >-
      D = passer's top defender 0.2 s before release. Onset = first frame displaced >= onset_disp from the release
      position (displacement onset replaces the 1.5 m/s^2 acceleration onset, check fix); it must come by max(t_catch,
      t_rel + t_react + sqrt(2 onset_disp / a_first_step)) + onset_slack_s (move on the flight, physics-bounded for
      short passes). Displacement (5-frame means) >= total_min by t_catch + after_catch_s, toward the receiver's side
      (soft, loop 1 DEF-T16: max of P(projection on the pass direction > 0) and P(r_D <= r_P - below_passer_min) x
      P(projection on the direction D -> receiver > 0)), ending with r_D <= r_P - below_passer_min. The in-flight displacement is
      reported (jump_m_in_flight) but not gated: 0.5 m in a 0.5 s flight is unreachable after a 0.25 s reaction.
    params:
      defender_back_s: {value: 0.2, unit: s, note: "passer's defender read this long before release (was a literal, DEF-T20)"}
      after_catch_s: {value: 0.6, unit: s, note: "research 0.4 s; 1.0 m needs 0.25 + sqrt(2/4.5) = 0.92 s after release"}
      onset_slack_s: {value: 0.1, unit: s}
      total_min: {value: 1.0, unit: m}
      below_passer_min: {value: 0.8, unit: m}
      onset_disp: {value: 0.3, unit: m}
    min_duration_s: null
    outputs: [jump_m_in_flight, jump_m_total, latency_s]
    confidence: "product of gates"
    noise: Flights shorter than 0.4 s give little time (t_react 0.25 s); expect low in-flight probability then.
    conflicts_resolved:
      - "Onset by acceleration (M-1(b) 1.5 m/s^2, about 1 sigma under correlated noise) replaced by a displacement onset."
    sources:
      - {url: "repo:docs/taxonomy/defense_full.md M-5, M-1(b)", supports: "0.5 / 1.0 m jump; latency target"}
    acceptance: "latency within +-80 ms of hand timing on the R-DF-08 gold set (offline)"
    status: proposal
    detectability: xy
    detector: detect_jump_to_ball
    kinds: [jump_to_ball]

  - id: deny
    research_id: DM-P14
    level: primitive
    name: Deny hold (on the line)
    aliases: [deny, on the line, ball-you-man denial]
    actors: D, man A (one pass away), ball
    t0: first frame of the hold
    rule: >-
      Enter on named_spots deny_on_the_line (perp <= 0.6 m, tau 0.05-0.35, within 2.0 m of the man, not two passes
      away); stay while perp <= 0.6 + h, tau within [0.05 - tau_hyst, 0.35 + tau_hyst] and dist <= 2.0 + h; frames
      inside an emitted FACE_GUARD event of the defender are excluded (face_guard owns them; a pass through the
      face-guard region that is no face-guard hold does not block the deny, loop 1 DEF-T04); loop 4 (L4-PERIMETER): no
      frame with the ball beyond half court or with the man in the named_spots post area (r <= 4.5 m; post_position owns
      it), neither for entry nor stay; held >= min_s with exit
      gaps <= dwell_frames; t0 back-dated over the frames where the 5-frame-mean features to the hold's attacker already
      meet the entry predicate (loop 1 DEF-T18), then further while they meet the relaxed stay predicate (+h,
      +tau_hyst) and D is still closing on the man (5-frame-mean distance non-increasing), at most backdate_max_s
      (backdate_max_s_q10 = 0 in the q = 10 tier; loop 2). P_cond / p_emit are measured from the strict entry; FACE_GUARD
      owns frames from its strict entry (attr strict_start), not its back-dated approach. The 0.6 / 0.05 / 0.35 / 2.0 numbers are read from the named_spots
      expression, never copied.
    params:
      min_s: {value: 1.0, unit: s}
      tau_hyst: {value: 0.05, unit: "1"}
    min_duration_s: 1.0
    outputs: [duration_s, mean_perp_m, mean_tau]
    confidence: "window mean of P(perp <= 0.6 m) x P(tau in band) x window-mean matchup posterior (loop 1 DEF-T12a); p_emit = window mean of P(perp <= 0.6 m)"
    noise: perp 0.6 m vs sigma_rel ~0.25-0.42 m; soft only. Tau unstable when man and ball < 3 m apart.
    conflicts_resolved:
      - "named_spots bands are priority-resolved, not contiguous (check fix): a defender with perp <= 0.6 and tau in
        (0.35, 0.75] has no one-away label ('deep on line' hole) - raised for named_spots 0.3.3; F7.1/pack-line use 0.8 m."
    sources:
