# Movement grammar: DEFENSIVE MOVEMENT family.
# Detectors: tools/specgen/movement/detectors/defense.py (reads every params value from this file at import).
# Tests: tests/movement/test_defense.py (synthetic scenarios, validation tier V0).
family: DEFENSIVE MOVEMENT
id: defense
version: 0.3.0
date: 2026-10-23
owner: Mac session
status: proposal
frame: >-
  Attacked-rim frame of the offence (named_spots 0.3.2), metres, rim at (0, 0), y up the floor; the defence
  defends that rim. 29.97 fps, DT = 1001/30000 s; elapsed durations are (n_frames - 1) * DT.
depends_on:
  - "tools/specgen/movement/mvlib.py: CA-RTS smoothing (MP-04), validity-gated features (MP-07), K_CAL 1.8 (MP-09),
    hysteresis (MP-11), window_conf / edge_factor / gap_factor (MP-16), sigma_dist / closing_speed (MP-19)"
  - "config/named_spots.yaml 0.3.2: every position (relative entries) is read, never redefined"
summary: >-
  64 research items plus 8 items added from the check (minor excursion rung, guard-two, press pickup, zone slide,
  contest verticality, weak coverage, noise model, anchors). 43 items have XY detectors; the rest are rules,
  composition-engine outputs or need data we do not have (pose, ball z, roster, zone posterior). Every event carries
  a calibrated-to-be confidence (P_cond x edge x gap, MP-16), reasons with thresholds and units, and class
  alternatives where classes compete.
changes_from_research:
  - "Kinematics: the research's Gaussian sigma_t 5/8 ladder is replaced by the shared CA-RTS (MP-04) so the whole
    grammar reads one smoother; every speed threshold below is stated against the CA-RTS smoothed speed."
  - "Check fix (high, DM-RULE-01/03): no sqrt(n/10) window-mean claim. Distance sigmas use sigma_rel =
    max(sigma_dist, 0.25 m): the RTS covariance x K_CAL under-states AR(1) error (measured on sim.py: per-axis RMSE
    0.157 m vs K_CAL*sqrt(var_p) 0.124 m at sigma_p 0.3); MP-19 gives 0.24 m pair error."
  - "Check fix (high, peak-speed bias): CA-RTS cuts short peaks (sim.py: 2.5 m in 0.8 s true 5.86 -> 3.58 m/s;
    2.5 m in 1.0 s 4.69 -> 3.39). Closeout peak gate 2.5 m/s smoothed, sprint flag 3.5 m/s smoothed; fly-by,
    hedge recovery and back-pressure speeds recalibrated the same way."
  - "Check fix (high, closeout profile): profile from the implied mean deceleration a = ((0.8 v_pk)^2 - 1)/(2 d_dec),
    not from d_dec / t_dec (which grow with v_pk^2). sim.py, 24 seeds: fastest physical minimum-jerk stop 5.4 +- 0.8
    m/s^2, 1.5x slower approach 3.4 +- 0.8 m/s^2 (d' 2.4); the closeout ends when D is stationary (s2 < 5.99), not at
    speed <= 1.0 m/s, so choppy closeouts are not cut before their last steps."
  - "Check fix (high, physics): every trigger-to-movement window obeys t_min = t_react + sqrt(2 d / a_first_step)
    with t_react 0.25 s and a_first_step 4.5 m/s^2 (proposal): sink 1.5 m within 1.2 s, sink-and-fill 1.2 s,
    hard switch closing from >= 1.5 m to <= 0.8 m within 0.8 s (no absolute 3 m/s gate), step-release onset <= 0.65
    s, jump-to-ball onset deadline max(catch, release + 0.62 s) and 1.0 m by catch + 0.6 s."
  - "Check fix (high, switch timing): switches are timed at the geometric exchange (closest approach of the two
    defenders), not at the HMM flip; the decoder lag is reported (hmm_flip_lag_s); a very_late class (> 2.5 s) and
    an unclassified class close the band gap."
  - "Check fix (medium, ladder): minor_excursion rung added; the trigger (middle dribble) decides step_release vs
    stunt; dig carries the 1.5 m approach; step-release measured threshold 0.35 m (behavioural 0.5 m reported)."
  - "Check fix (medium, closeout ownership): one CLOSEOUT event (pass-triggered) with end <= 2.0 m owns all three
    length classes; RECOVER is the non-pass help-to-man return. Length classes stay soft (tight_p = hard + standard)."
  - "Check fix (medium, X-ball path): the lambda/s crossing bands of DM-RULE-05 leave THROUGH empty whenever X-big
    drops below the screen (s(Xbig) ~ s(S)); the path is now classified on the P_s -> X-big axis (through = between
    the screen point and X-big), the BS-3 segment test made continuous, measured from the fixed screen point because
    the screener may already be rolling. Off-ball screens keep the research lambda/s test (there the S -> d_scr
    axis runs parallel to a curl)."
  - "Check fix (medium, depth frame): drop depth is measured on the named_spots S -> rim axis (canonical positions);
    the handler-velocity axis is kept only for the lateral 'into the path' offset of shows and for the switch
    exchange lambda. R-DF-16 bands are kept as event classes; only 1.83-3.05 m is sourced (coaching blog via repo
    N3), 0.6 and 3.05+ edges are heuristic."
  - "Check fix (medium, box-out): the named_spots box_out_position hold (>= 0.4 s, start between release and rim
    contact) is adopted as canonical instead of 0.30 s."
  - "Check fix (medium, HMM): Franks' emission is applied to half-court frames; frames with the attacker or the
    defender beyond half court use a 2x wider emission (sigma_fit_transition 3.0 m, proposal); rho 0.985 is a
    starting value to be refitted by EM, as Franks did."
  - "Check fix (low, trap): one trapper may be Kalman-carried (interp_short) with conf x 0.8 instead of abstaining."
  - "Check fix (low, hedge recovery): hard hedge recovery = chord >= 2.0 m within 1.2 s and smoothed peak >= 2.5
    m/s; soft show retreat >= 1.0 m and peak >= 2.0 m/s."
globals:
  params:
    k_floor: {value: 0.8, unit: "1", note: "pair-distance sigma floor = k_floor x sigma_p (mean of the two tracks, estimated from the RTS covariance); 0.8 x 0.3 = 0.24 m reproduces MP-19 AR(1) at sigma_p 0.3 (loop 1, DEF-T14; replaces the constant sigma_rel_floor 0.25 m)"}
    sigma_rel_min: {value: 0.10, unit: m, note: "absolute minimum of the pair-distance sigma floor (loop 1, DEF-T14)"}
    conf_abstain_eps: {value: 1.0e-6, unit: "1", note: "abstain (no event) when P_cond x c_edge x c_gap <= this, e.g. t0 within 5 frames of a segment edge (loop 1, DEF-T21)"}
    subnoise_abstain_sigma_p: {value: 0.45, unit: m, note: "sub-metre rungs (minor_excursion, step_release) abstain when a track's estimated sigma_p >= this (mvlib high-noise tier, loop 1, DEF-T13)"}
    backdate_max_s: {value: 0.6, unit: s, note: "hold / trap t0 back-dating over the relaxed stay predicate while the defender is still closing, at most this long before the strict entry (loop 2, DEF-T18)"}
    backdate_max_s_q10: {value: 0.0, unit: s, note: "q = 10 tier: no relaxed back-dating (loop 2, DEF-T18). At sigma 0.5 a 0.3 s limit moved deny t0 too early (corner deny 14 -> 11, wing deny 12 -> 10 of 20) for face_guard 3 -> 6; 0.6 s: deny 26 -> 21, face_guard 3 -> 7"}
    high_noise_abstain_kinds: {value: [blitz, hard_hedge, soft_show, post_front, post_three_quarter_high, post_three_quarter_low, post_behind, lob_protection, face_guard, dig, stunt], unit: "-", note: "event kinds that abstain (no event) when any actor track was smoothed in the q = 10 tier (sigma_p >= 0.45), as minor_excursion / step_release already do (loop 2, HIGH-NOISE-TIER). Rule: harness precision at sigma 0.5 below 0.6 after loop 2 (blitz 0.38, show 0.58, post_position 0.33, lob_protection 0.46, face_guard 0.27, dig 0.50, stunt 0.33). Lift a kind from the list once its q10 precision is >= 0.85 on gold labels."}
    hyst_h_min: {value: 0.25, unit: m, note: "named_spots loader.temporal.defaults.relative h_min"}
    hyst_k_sigma: {value: 0.75, unit: "1", note: "named_spots relative h_k_sigma"}
    dwell_frames: {value: 7, unit: frames, note: "named_spots relative dwell 233 ms; bridged exit gap for holds"}
    stand_s2: {value: 5.99, unit: "1", note: "stationary when s2 = v^T P_v^-1 v < 5.99 (chi-square 2 dof, 95 %; MP-09/MP-12), never raw speed < 0.3"}
    q_obs_min: {value: 0.6, unit: "1", note: "abstain when the observed share in the critical window is lower"}
    possession_hold_s: {value: 1.0, unit: s, note: "loop 4 L4-POSSESSION: possession changes to the team whose player is nearest the raw ball within mvlib HOLD_R (1.0 m) on >= possession_share of a 1.0 s window (dated at the window start); make_event abstains (reason dposs) when t0 is in a possession of the labelled defence. Window 0.5 / 1.0 s checked against PBP changes of possession on 3 NBA games (see changes_loop4 L4-POSSESSION)"}
    rim_ball_r: {value: 0.9, unit: m, note: "loop 4: ball XY within this of either rim centre = ball over the rim (shot, tip, rebound; rim radius 0.23 m + ball 0.12 m + a layup / tip reach): nobody controls or holds it in XY (L4-POSSESSION control frames, L4-TRAP-RIM trap holds). SportVU check: 54 of 96 rim-area trap holds with the ball above 7.5 ft for >= 30 % of the hold had the ball XY within 0.6 m of a rim"}
    rim_phase_back_s: {value: 1.0, unit: s, note: "loop 4 L4-FLIP-REBOUND: no matchup flip (rotate / switch / x_out) with the ball over a rim (rim_ball_r) from this long before the flip ..."}
    rim_phase_fwd_s: {value: 0.5, unit: s, note: "loop 4 L4-FLIP-REBOUND: ... to this long after it (shot-to-rebound phase: defenders hit the nearest man)"}
    possession_margin_min: {value: 0.5, unit: m, note: "loop 4 L4-POSSESSION: a control frame needs the controlling player nearer to the raw ball than every opponent by max(this, possession_margin_k x median track sigma_p). SportVU vs PBP flips precision 0.81 (no margin) -> 0.85 (0.5 m), recall unchanged within 2 rows; harness sigma 0.5 side PnR: with no margin noise gave the tight on-ball defender 0.9 s of 'control' in 1 of 10 seeds"}
    possession_margin_k: {value: 1.5, unit: "1", note: "loop 4 L4-POSSESSION: noise scaling of the control margin (0.75 m at sigma_p 0.5)"}
    possession_share: {value: 0.8, unit: "1", note: "loop 4 L4-POSSESSION: share of the possession_hold_s window (control frames) needed for a change; robust to a tightly guarded dribble and to tracker flicker"}
    emit_p_min: {value: 0.5, unit: "1", note: "emit when P_cond >= 0.5 (DM-RULE-03)"}
    t_react: {value: 0.25, unit: s, note: "reaction time in every trigger-to-movement window (proposal; check missing item)"}
    a_first_step: {value: 4.5, unit: m/s^2, note: "defender first-step acceleration (repo M-5 arithmetic, NOT measured; measure on MSU film / LPS)"}
  confidence_model: >-
    conf = P_cond x c_edge x c_gap (MP-16), minimum over the actors. P_cond = product of the gate probabilities,
    each p_above / p_below(value, threshold, sigma) with window-mean values (5-frame means for positions) and
    sigma = sigma_rel for distances, sigma_speed (RTS x K_CAL x k_edge) for speeds; band classes use
    Phi(hi) - Phi(lo) renormalised over the competing classes, which are stored as alternatives. Abstain (no
    event) when the observed share q_obs < 0.6 in the window, or when P_cond x c_edge x c_gap <= conf_abstain_eps.
    Where existence and label differ (class labels, holds, traps, shows) p_emit (existence) gates emission and conf
    is the probability of the exact label. sigma_rel = max(sigma_dist, k_floor x sigma_p), sigma_p estimated per track
    from the RTS covariance (noise_of). Raw conf is mapped to a calibrated probability by isotonic regression on hand
    labels before release (R-ST-10), fitted per noise tier (sigma_p < 0.45 with q 30 / >= 0.45 with q 10, loop 1
    DEF-T12d). V0 reliability baseline (tester harness, 164 cases x 10 seeds x 2 mirrors; fraction of emitted labels
    correct in the conf bins 0.5-0.7 / 0.7-0.9 / >= 0.9): before loop 1 sigma 0.2 0.85 / 0.95 / 0.94, 0.3 0.83 / 0.84
    / 0.89, 0.5 0.55 / 0.64 / 0.78; after loop 1 sigma 0.2 0.75 / 0.98 / 0.99, 0.3 0.73 / 0.95 / 0.96, 0.5 0.62 /
    0.80 / 0.84. The 0.5-0.7 bin is now the honest low-confidence bin (most near-edge labels fall there).
  acceptance_default: >-
    Per item: >= 50 gold labels from >= 5 games, two coaches, Cohen kappa >= 0.6 on the label; detector precision
    >= 0.85 and recall >= 0.75 at conf >= 0.5; expected calibration error <= 0.05 after isotonic mapping; t0 error
    p90 <= 0.2 s against hand timing. Items below may tighten this.
  window_rule: >-
    Any 'within T s of a trigger' gate for a movement of d metres must satisfy T >= t_react + sqrt(2 d / a_first_step)
    (0.25 + 0.67 s for 1.0 m, 0.25 + 0.82 s for 1.5 m, 0.25 + 0.94 s for 2.0 m).
changes_loop1:
  # Loop 1: fixes from the independent tester's report (scratchpad movement/synth.json element 5, harness
  # movement/test_defense/harness.py: 164 new cases x seeds 1-10 x {as written, mirrored} at sigma_p 0.2 / 0.3 / 0.5).
  # Evidence numbers are hits per 20 runs (sigma 0.2 | 0.3 | 0.5) before -> after, re-measured with the tester's harness.
  - id: DEF-T01 trap-swallows-dig
    what: "TRAP commitment test: when both 5-frame-mean distances stay inside enter_dist for < trap_commit_s (1.0 s) and H still holds the ball after the stay, a trapper who retreats >= trap_release_dist (1.0 m, measured from his closest distance) within trap_release_s (0.5 s) makes it a dig, not a trap. _traps_cached uses the same filtered list, so the ladder keeps the dig. The drive-corridor test of the ladder now also needs lane fraction tau > 0 (a digger just behind H sat within the half width of the clamped segment end)."
    why: "A dig at the fastest physical pace stays within 1.5 m of H for 0.77 s and was published as a TRAP; _ladder then dropped it. The tester's release test (from the distance at the stay end) missed most digs because the stay ends at the 1.8 m exit threshold, already part of the way back."
    evidence: "XNEG_dig_is_not_a_trap false traps 20 | 20 | 16 -> 0 | 0 | 2; dig recall 0.00 | 0.00 | 0.00 -> 1.00 | 0.85 | 0.15; PLAUS dig with 0.2 s hold 0 | 0 | 0 -> 17 | 13 | 5; corner / press / occluded trap recall unchanged or better (trap P/R 0.67/0.93 | 0.55/0.80 | 0.47/0.57 -> 0.93/0.93 | 0.81/0.78 | 0.67/0.55)."
  - id: DEF-T02 show-becomes-trap-blitz
    what: "(a) DEF-T01 commitment. (b) Blitz needs no retreat >= soft_retreat_min within blitz_retreat_s (0.5 s) after the trap while H still holds (soft factor). (c) Trap conf on the entry threshold enter_dist; existence (p_emit) at enter_dist + exit_h / 2. Blitz conf = P(depth) x P(no retreat) x trap P_cond, as the YAML already stated but the code did not apply."
    why: "A soft show / hard hedge was in TRAP's exit band for >= 0.6 s and became trap + blitz; a big stopping 1.75 m from H made blitzes from noise dips."
    evidence: "XNEG_soft_show_is_not_a_trap 3 | 7 | 10 -> 0 | 0 | 2; XNEG_soft_show_is_not_a_blitz 3 | 4 | 6 -> 0 | 0 | 1; XNEG_hard_hedge_is_not_a_blitz 1 | 2 | 5 -> 0 | 0 | 0; NEG_big_stops_2m_show blitz 4 | 6 | 7 -> 1 | 5 | 5 (the remaining ones are AR(1) noise dips of the 1.75 m true distance to 1.3-1.4 m for > 0.6 s); blitz precision 0.71 | 0.53 | 0.22 -> 0.95 | 0.72 | 0.38."
  - id: DEF-T03 rotate-on-excursion-return
    what: "_flips skips the flip back to the attacker of the run before when the intermediate run was shorter than persist_s (A -> B -> A is a help excursion that returned). persist_s is passed from rotate (1.0 s) and switch (1.5 s)."
    why: "A help defender who went 2.8 m toward another attacker and came back produced a censored ROTATE back to his own man."
    evidence: "NEG_brief_excursion_back false rotates 17 | 13 | 12 -> 0 | 0 | 2; rotate precision 0.54 | 0.61 | 0.62 -> 1.00 | 1.00 | 0.91, recall unchanged 1.00."
  - id: DEF-T04 deny-entry-excludes-raw-faceguard
    what: "detect_deny excludes only the frames inside emitted FACE_GUARD events of the defender, not every frame meeting the per-frame face_guard predicate."
    why: "An approach to a tau 0.2 deny passes through the face-guard region; deny entry was blocked for the whole approach (t0 0.9 s late, hold cut)."
    evidence: "wing_deny_ball_in_corner 15 | 10 | 10 -> 17 | 12 | 12; deny P/R 0.88/0.88 | 0.69/0.68 | 0.75/0.60 -> 1.00/0.93 | 0.85/0.72 | 0.79/0.65. The remaining misses are runs where the AR(1)-biased track sits in the face-guard region for > 1.0 s (a real FACE_GUARD event then owns the frames)."
  - id: DEF-T05 contain-slowdown-window
    what: "contain.window_s 1.0 -> 1.5 s; slow_tail_s 0.5 s; vmax = max speed over the window, drop measured from the peak to window_s + slow_tail_s; the hard-coded frames(0.5) is gone."
    why: "Drives still accelerate for 0.5-0.8 s and the beat-to-the-spot slow-down comes after 1.0 s."
    evidence: "beat_to_spot_handler_stops 8 | 8 | 6 -> 20 | 19 | 17; both contain negatives stay at 0 | 0 | <= 1."
  - id: DEF-T06 show-hold-and-gate-product
    what: "Show hold on 5-frame-mean depth / lateral with relative hysteresis (stay + h) and dwell bridging; hard_hold_max_s 1.5 -> 2.0 s; existence of a show (p_emit) = shape (min depth <= soft_depth_max, lateral >= soft_lat_min) x went back (recovery chord or retreat); P(class | show) from depth, lateral, hold and (hard only) the smoothed recovery peak; the soft-show peak is the quick_recovery attribute."
    why: "Raw-mask holds broke on 0.25 m lateral noise and included approach / exit frames (a 0.9 s stay measured ~1.6 s > 1.5); five multiplied near-edge gates gave P ~0.45 with no noise."
    evidence: "side_pnr_soft_show 14 | 7 | 0 -> 19 | 17 | 3; side_pnr_hard_hedge 11 | 9 | 3 -> 14 | 12 | 5; PLAUS hard hedge held 0.9 s 3 | 2 | 2 -> 14 | 11 | 4. Remaining hard-hedge misses: measured max lateral 0.3-0.75 m for a true 1.0 m (handler-velocity axis noise), labelled soft_show / show_unclassified."
  - id: DEF-T07 drop-deep-r-override
    what: "r(X-big) <= deep_r_max promotes only a standard drop to deep, softly: P(r <= deep_r_max) x P(depth > high_max) mixed into drop_deep."
    why: "An elbow PnR high drop (1.1 m below the screen, r 4.2 m) was forced to drop_deep with conf 0.999."
    evidence: "PLAUS_elbow_pnr_high_drop_1.1m 0 | 0 | 0 (20 | 20 | 19 drop_deep) -> 20 | 20 | 17 drop_high; side_pnr_drop_deep unchanged 20 | 20 | 20."
  - id: DEF-T08 blitz-depth-at-entry
    what: "Blitz depth gate on the shallowest 5-frame-mean X-big depth during the trap; depth_at_entry_m reported."
    why: "A big coming up from a 2 m drop is still arriving at trap entry."
    evidence: "PLAUS_blitz_big_comes_up_from_2m_drop 8 | 9 | 2 -> 20 | 19 | 12."
  - id: DEF-T09 top-lock-no-lateral-gate
    what: "top_lock needs P(mean lead >= lock_lead_min) x P(mean offset toward the screener's side <= lock_lat_tol 0.5 m) >= 0.5, means over the frames within lock distance; otherwise the crossing classifier decides and top_lock is an alternative."
    why: "A defender shooting the gap under the screen also leads the cutter. The tester's gate as written (offset >= -0.3 m) points the wrong way: in the harness pin-down the under defender's truth offset toward the screener is +0.99 m (min 0.72) over [t0 - 1 s, t0], the top-locker's 0.0 m, so the gate must be an upper bound. 0.3 m cut top-lock recall to 14/20 at sigma 0.3; 0.5 m is the midpoint."
    evidence: "XNEG_under_is_not_top_lock 3 | 3 | 1 -> 0 | 0 | 0; pin_down_under 17 | 17 | 19 -> 20 | 20 | 20; pin_down_top_lock_0.6m 20 | 19 | 14 -> 20 | 19 | 11; level trailer still trail 18 | 16 | 16 -> 20 | 17 | 17."
  - id: DEF-T10 xball-crossing-not-debounced
    what: "_xball_path and _lambda_path cross on the 5-frame-mean side / lambda and accept a crossing only when the new sign holds cross_hold_frames (5); q and s_X from 5-frame means."
    why: "Single-frame sign flips near the axis set q and t0 from the wrong frame."
    evidence: "xball_path P/R 0.94 | 0.89 | 0.75 -> 0.95 | 0.89 | 0.74 (side_pnr_over 16 | 15 | 10 -> 16 | 15 | 9). Over is not noise-flip limited: its true crossing q is about -0.5 m against the -0.3 m class margin (estimates -0.05 to -0.99 m), so 'through' wins in ~25 % of runs. The debounce removes the frame-choice error the tester found (unit test test_t10)."
  - id: DEF-T11 locomotion-on-noise
    what: "Moving = smoothed speed >= v_min AND stationary_s2 >= stand_s2 (MP-09); P_cond includes the window-mean P(speed >= v_min); a class run needs window-mean P(speed >= v_min) >= p_move_min (0.75)."
    why: "The tester's per-frame mask p_above(speed, v_min, sigma) >= 0.5 is the same test as speed >= v_min, so it alone does not change anything (measured: NEG_slow_shuffle 2 | 8 | 9 with only the s2 gate and the P(speed) factor). Noise lifts a 0.78 m/s shuffle above 1.0 m/s for ~0.4 s with window-mean P ~0.64; real slides / step-ups score >= 0.9."
    evidence: "NEG_slow_shuffle_0.8mps 2 | 8 | 23 -> 1 | 1 | 3; def_locomotion P/R 0.93/1.00 | 0.75/0.97 | 0.42/0.88 -> 0.98/1.00 | 0.95/0.97 | 0.78/0.88."
  - id: DEF-T12 overconfident-conf
    what: "(a) deny / face_guard conf = window mean P(perp) x P(tau in band) x window-mean matchup posterior (p_emit stays P(perp)). (b) trap conf on the entry threshold (DEF-T02c), blitz conf includes trap P_cond. (d) isotonic map fitted per noise tier; the harness reliability is recorded as the V0 baseline in globals.confidence_model. (c) a t0-uncertainty factor is NOT added: it needs a per-detector entry-gate slope model and a calibration set (deferred to the isotonic fit on gold labels)."
    why: "Events with conf >= 0.9 were correct 94 / 89 / 78 % of the time."
    evidence: "Accuracy in the conf >= 0.9 bin 0.94 | 0.89 | 0.78 -> 0.99 | 0.96 | 0.84; 0.7-0.9 bin 0.95 | 0.84 | 0.64 -> 0.98 | 0.95 | 0.80 (all emitted labels, plausibility cases excluded)."
  - id: DEF-T13 q10-thresholds-not-recalibrated
    what: "noise_of(k) recovers sigma_p and the smoother tier (q 30 / 10) from the RTS covariance (the Scene keeps no raw sigma_p); tier_param reads <name>_q10 when a track was smoothed with q = 10. Measured q10 values: profile_min_peak_q10 2.3, choppy_max_decel_q10 2.9, sprint_stop_min_decel_q10 3.3, hard_recovery_peak_q10 2.2, soft_recovery_peak_q10 1.6. minor_excursion and step_release abstain when sigma_p >= subnoise_abstain_sigma_p (0.45)."
    why: "At sigma_p >= 0.45 mvlib smooths with q = 10, which smears decelerations and peaks; the sprint-stop closeout became choppy."
    evidence: "sim.py via the harness, 60 runs per scene: sprint-stop implied deceleration 5.73 +- 0.70 (q30, sigma 0.3) -> 3.80 +- 0.71 (q10, sigma 0.5); choppy 2.57 -> 2.45; recovery peak hard hedge 5.11 -> 4.47, soft show 2.32 -> 1.85. corner_closeout_sprint_stop at sigma 0.5 6 -> 16 of 20, choppy 18 -> 18; closeout_profile P/R at 0.5 0.67/0.60 -> 0.87/0.85. noise_of: 0.297 at sigma_p 0.3 (q30), 0.477 at 0.5 (q10). Sub-metre rungs at sigma 0.5: minor_excursion P 0.50 -> abstain, step_release recall 0.05 -> abstain."
  - id: DEF-T14 constant-sigma-rel-floor
    what: "globals.sigma_rel_floor (0.25 m) replaced by k_floor 0.8 x sigma_p (mean of the two tracks, from noise_of) with sigma_rel_min 0.10 m; safety_back / protect_rim single-track floors use the same rule."
    why: "A constant 0.25 m floor capped sub-metre rungs on good tracking and under-stated the error at sigma 0.5."
    evidence: "minor_excursion recall at sigma 0.2 0.60 -> 0.70, step_release 0.45 -> 0.55, stunt 0.90 -> 0.95, dig n/a -> 1.00; at sigma 0.5 the honest wider sigma lowers product-of-gates recall (closeout 0.93 -> 0.82, closeout_length 0.47 -> 0.38) while precision of the high-conf bin rises 0.78 -> 0.84. The length class now comes from the band containing the estimate: with sigma_rel ~0.4 m the argmax of band probabilities never chose the 0.4 m standard band (corner_closeout_standard at 0.5 fell to 4/20; band-of-estimate 8/20; 0.25 m floor baseline 10/20; at sigma 0.3 standard 14 -> 18, hard 17 -> 14, short 12 -> 13 of 20)."
  - id: DEF-T15 closeout-landing-hard-gate
    what: "Landing angle removed from the closeout gates and P_cond; attrs landing_side (rim_side / high_side) and p_rim_side."
    why: "A closeout landing on the high side is a bad closeout, still a closeout."
    evidence: "PLAUS_closeout_lands_high_side 1 | 3 | 4 -> 20 | 19 | 15; NEG_help_stunt_at_catch_ends_2.6m stays 0 | 0 | 0."
  - id: DEF-T16 jump-to-ball-side-x-only
    what: "Side gate = max(P(displacement . pass direction > 0), P(r_D <= r_P - below_passer_min) x P(displacement . (receiver - D) > 0)), soft, instead of sign(dx_D x dx_pass)."
    why: "A drop toward the ball-side block on a wing -> corner pass moves against the pass dx."
    evidence: "PLAUS_wing_to_corner_drop_to_ball 1 | 1 | 3 -> 20 | 17 | 7; NEG_moves_0.4m stays 0."
  - id: DEF-T17 recover-needs-joint-assignment
    what: "joint_top1: per-frame one-to-one defender -> attacker assignment (minimum total -log posterior, exhaustive over permutations, flicker absorbed). RECOVER (pre and end) and _flips (ROTATE / SWITCH / X-OUT) use it."
    why: "The per-defender HMM has no one-to-one constraint; a nail helper was matched to the ball handler and his recover to the corner was dropped as a rotation."
    evidence: "PLAUS_nail_help_recover_to_corner 0 | 0 | 0 -> 20 | 20 | 20; rotate / switch / x_out / guard_two unchanged (switch 18 | 17 | 14, x_out 20 | 20 | 20) with joint flips vs top-1 flips."
  - id: DEF-T18 hold-t0-lag-and-splits
    what: "max_gap = dwell_frames in trap, guard_two, back_pressure, press_pickup and set_def; guard_two stays on balance_max + h and between_max + h; deny / face_guard t0 back-dated over the frames where the 5-frame-mean features to the hold's attacker already meet the entry predicate (backdated_s attribute)."
    why: "Noise split guard-two holds and delayed hold onsets."
    evidence: "guard_two weak_side_wing_and_corner 20 fp0 | 18 fp5 | 16 fp4 -> 20 fp0 | 20 fp0 | 19 fp1. Not fixed by back-dating: face_guard t0 at sigma 0.3 (11 | 11 of 20 before / after) and corner-trap entries 0.6-1.0 s late - the smoothed defender-attacker distance sits 0.3-0.6 m above truth for > 0.5 s (AR(1) noise, e.g. seed 3: truth 0.60 m, smoothed 1.33 m at the true entry), so no window-mean predicate is met earlier."
  - id: DEF-T19 overrides-typeerror
    what: "_setup takes a tuple of item ids (item first wins on shared names); drop_coverage / show / blitz / xball_path / ice / tag / offball_screen_coverage read ball_screen, closeout_length / closeout_profile read closeout, sink reads help_ladder; merged_params replaces the ad-hoc merges."
    why: "detect_drop_coverage(sc, level_max=0.7) raised TypeError although the docstring promises per-call overrides."
    evidence: "test_t19_shared_parameters_can_be_overridden."
  - id: DEF-T20 hardcoded-literals-and-text-mismatches
    what: "named_spots numbers (deny / face_guard perp, tau, dist; box-out 1.0 / 0.5; protect_rim 1.8; stop_ball 2.0) are parsed from the named_spots expressions (SPOT_NUM, error if absent). New params: trap location constants, ladder span_after_peak_s / rot_persist_s, recover dedupe_s, ball_screen hold_tail_s / no_man_behind_s / pre_screen_s, rotate guard_two_margin_s / move_back_s, jump_to_ball defender_back_s, post bands front_max_deg / behind_min_deg, post_double pre_catch_s, box_out effect_pre_s, tag origin_back_s / corner_angle_max_deg, fly-by span_before_cpa_s, offball defender_back_s / span_after_s, anchors screen_pre_s. Texts fixed: x_out and rotate pair flips with switch.pair_max_s 2.0 (the code's behaviour; a 1.0 s x_out pairing would re-open the HMM-lag misses that set 2.0 s for switch), recover ends at stationary_s2, post_double window starts pre_catch_s before the catch."
    why: "The docstring promised every numeric parameter comes from the YAML; four rule texts disagreed with the code."
    evidence: "test_t20_spot_numbers_are_read_from_named_spots; grep of defense.py for frames(<literal>) leaves none."
  - id: DEF-T21 zero-conf-events
    what: "make_event abstains (returns None) when P_cond x c_edge x c_gap <= conf_abstain_eps."
    why: "Events at t0 within 5 frames of a segment edge were emitted with conf 0.0 (phantom labels for counters and chains)."
    evidence: "test_t21_no_zero_confidence_events."
  - id: DEF-T22 test-env
    what: "tests/movement/test_defense.py sets OMP / OPENBLAS / MKL / VECLIB thread counts to 1 before numpy is imported."
    why: "Under a load average of ~300 multithreaded BLAS made one scene take 16 s. tests/conftest.py, the closed-form 3x3 solve in mvlib.ca_rts and the broken .venv symlink are outside this family's files: not changed here (to do by the mvlib / repo owner)."
    evidence: "Family suite 133 tests run single-threaded."

changes_loop2:
  # Loop 2: the independent confirmer's verdict on loop 1 (scratchpad loop2/confirm_defense.json). Measured with the tester's
  # harness (byte-identical copy in movement/confirm_defense/): 164 cases x seeds 1-10 x {as written, mirrored} at sigma_p
  # 0.2 / 0.3 / 0.5. Evidence is P/R per detector (sigma 0.2 | 0.3 | 0.5) or hits of 20, before -> after; scripts in
  # scratchpad movement/fix2_defense/ (run_all.py, pr.py, floor_meas.py, diff_meas.py, peak_meas.py, onset_meas.py).
  - id: L2-NEW-R1 k_floor-inflates-gate-sigmas-at-0.5
    what: "k_floor stays 0.8 (no tier value). Each gate now uses the sigma of what it measures: sigma_own(k, a, b) = max(K_CAL sqrt(2 mean var_p), k_floor x sigma_p) for ONE track's displacement (closeout chord, help-ladder excursion peak, sink own r change); sigma_rel for a pair-distance level (sink min dist to H, was sqrt(2) sigma_rel); sqrt(2) sigma_rel kept for pair-distance changes (closeout dist_drop, ladder returns, sink help-depth rise). closeout.peak_speed_min_q10 2.0 m/s."
    why: "The confirmer's fix (k_floor 0.5) under-states the error: measured pair-distance error of the smoothed 5-frame means is 0.82 / 0.78 / 0.74 sigma_p at sigma 0.2 / 0.3 / 0.5 (k_floor 0.5 gives 0.24 m at 0.5 against a measured 0.354 m). With k_floor_q10 0.5 the sigma 0.5 grid gained 36 TP for 12 FP but the 0.5-0.7 / 0.7-0.9 conf bins fell from 0.62 / 0.80 to 0.55 / 0.73 accuracy. The real defect: one-track displacements were given sqrt(2) x the pair sigma, while their measured error (0.84 / 0.80 / 0.74 sigma_p per axis over 1 s) is the size of the level error; pair-distance changes over >= 1 s measure 1.36-1.44 x the level error, so their sqrt(2) is right (the confirmer's 'drop sqrt(2) on dist_drop' is not applied). The q = 10 smoother lowers a 2.5 m / 1.0 s closeout's smoothed peak from 3.13 +- 0.39 to 2.52 +- 0.41 m/s (60 seeds): 2.5 x 2.52 / 3.13 = 2.0."
    evidence: "closeout 1.00/1.00 | 1.00/1.00 | 1.00/0.82 -> 1.00/1.00 | 1.00/1.00 | 1.00/0.97 (corner_closeout and derived anchors 16 -> 19, skip closeout 17 -> 20 at 0.5); closeout_length at 0.5 0.57/0.38 -> 0.60/0.47 (short 4 -> 7); closeout_profile 0.87/0.85 -> 0.88/0.88; minor_excursion 0.93/0.70 | 0.64/0.35 -> 0.94/0.75 | 0.67/0.40 with no new FP; no change at 0.2 / 0.3 for the other closeout items, NEG_walk_up_closeout stays 0."
  - id: L2-NEW-R2 sink_and_fill-double-penalty
    what: "sink.onset_v_r_q10 1.4 m/s (t0 in the q = 10 tier); sink_and_fill existence p_emit = min(sink P_cond, P(fill)) with conf = their product (unchanged), attr p_fill; detect_sink_and_fill forwards its global overrides to the inner SINK."
    why: "Half of the misses were t0, not gates: in the q = 10 tier the smoothed v_r crosses 1.0 m/s 4.7 frames early on average (82 % within 0.3 s; 1.4 m/s: -1.2 frames, 97 %; q30 at sigma 0.3 is 100 % with 1.0). The other half: sink 0.7 x fill 0.7 < 0.5 although both parts are more likely than not. The confirmer's 'p_emit = sink P_cond' would emit a sink with no fill (NEG_no_fill), and its 'drop sqrt(2) on the fill shift' contradicts the measured 1.36-1.44 x error of a pair-distance change: neither applied."
    evidence: "sink 1.00/0.95 | 1.00/0.95 | 0.80/0.40 -> 1.00/0.95 | 1.00/0.95 | 1.00/0.65 (wing_sink 8 fp2 -> 13 fp0 at 0.5); sink_and_fill 1.00/0.95 | 1.00/0.80 | 0.67/0.10 -> 1.00/0.95 | 1.00/0.85 | 1.00/0.50 (corner_fills_wing 2 -> 10 at 0.5); NEG_filler_moves_0.5m and NEG_no_fill stay 0 FP."
  - id: L2-TAG contact-window-q10
    what: "tag.contact_to_s_q10 2.0 s (window end in the q = 10 tier)."
    why: "At sigma 0.5 the smoothed P(d <= 1.0 m) first reaches contact_p 0.7 at frames 95-103 for a true first contact at frame 87 (1.6 s after the screen), past the 1.8 s window end, so most runs had no contact at all. Lowering contact_p (0.5 / 0.6) gave a similar recall with an extra FP; at sigma 0.3 a 2.0 s window changes nothing, so q30 keeps 1.8 s."
    evidence: "tag 1.00/1.00 | 1.00/0.90 | 0.82/0.45 -> 1.00/1.00 | 1.00/0.90 | 0.88/0.70 (weak_low_man_tags_roller 9 -> 14 at 0.5); both negatives unchanged."
  - id: L2-DEF-T18 hold-and-trap-t0-backdating
    what: "_position_hold walks t0 back over the relaxed stay predicate (5-frame means, +h / +tau_hyst) while D is still closing (dA5 non-increasing), at most globals.backdate_max_s 0.6 s (backdate_max_s_q10 0); P_cond / p_emit stay on the strict entry; FACE_GUARD events carry strict_start and DENY excludes face-guard frames from there. detect_trap walks t0 back while both 5-frame-mean distances are within enter_dist + exit_h / 2 (pair_dist + exit_h / 2), H holds and the trappers are closing, at most backdate_max_s; attr backdated_s."
    why: "face_guard t0 was 0.33-0.6 s late in 9/20 at sigma 0.3 and corner / press trap entries 0.6-1.0 s late. Variants measured: the confirmer's trap band (enter_dist + exit_h) moved blitz t0 (= trap t0) 7-10 frames early (blitz 1.00 -> 0.70 recall at 0.2), the band middle costs blitz one run per tier; conf over the back-dated window dropped two deny emissions (fixed by the strict window); the back-dated face-guard window blocked deny entries (fixed by strict_start); in the q = 10 tier any back-dating moved deny t0 early (0.3 s: deny 26 -> 21 of 40, 0.6 s: 26 -> 21), so it is off there; backdate_max_s 0.4 / 0.5 lost trap hits at 0.3."
    evidence: "face_guard 0.95/0.95 | 0.55/0.55 -> 1.00/1.00 | 1.00/1.00 (corner_face_guard at 0.3 11 fp9 -> 20 fp0); deny 1.00/0.93 | 0.85/0.72 -> 0.97/0.90 | 0.91/0.78 (one 0.2 run 10 frames early); trap 0.93/0.93 | 0.81/0.78 | 0.67/0.55 -> 0.98/0.98 | 0.88/0.85 | 0.67/0.55; blitz 0.95/1.00 | 0.72/0.90 -> 0.90/0.95 | 0.74/0.85 (blitz t0 mean 3 frames earlier)."
  - id: L2-SWITCH exchange-search-on-moving-frames
    what: "detect_switch takes the geometric exchange (closest approach of D1, D2) only over frames where at least one of them moves (MP-09 s2 >= stand_s2); all frames if none."
    why: "The confirmer blamed a left-censored first HMM run in _flips. Measured: in every failing run the joint flips are at frames 48-52 (truth 46) and the censoring patch it proposed changed nothing (switch 18 | 17 | 14 of 20 before and after). The early t0 (frames 5-15) came from the closest-approach search: the true dip is shallow (2.33 -> 1.77 m) and a 0.25 m AR(1) dip while both defenders still stood won the argmin."
    evidence: "switch 0.90/0.90 | 0.85/0.85 | 0.74/0.70 -> 1.00/1.00 | 1.00/1.00 | 0.80/0.80 (cross_screen_switch_no_ball_screen 18 fp2 | 17 fp3 | 14 fp5 -> 20 fp0 | 20 fp0 | 16 fp4); rotate / x_out unchanged."
  - id: L2-SHOW hard-vs-soft-margin
    what: "ball_screen.class_margin_min 0.2: a show with |P(hard | show) - P(soft | show)| < 0.2 is show_unclassified (abstain, the existing class) instead of the argmax."
    why: "A coin-flip between hard_hedge and soft_show was labelled. The remaining 0.2 confusions are confident (margin >= 0.2): the measured lateral of a 1.0 m hard hedge is 0.3-0.75 m (handler-velocity axis noise, loop 1); margins 0.3 / 0.4 lost more right labels than wrong ones."
    evidence: "show P/R 0.87/0.82 | 0.91/0.72 | 0.53/0.20 -> 0.89/0.82 | 0.91/0.72 | 0.58/0.17 (margin 0.3: 0.89/0.82 | 0.91/0.72 | 0.60/0.15 with PLAUS hard hedge held 0.9 s 11 -> 9 at 0.3; 0.4: 0.89/0.82 | 0.90/0.68 | 0.50/0.10)."
  - id: L2-HIGH-NOISE-TIER abstain-by-default
    what: "globals.high_noise_abstain_kinds: make_event returns no event for blitz, hard_hedge, soft_show, the four post_position kinds, lob_protection, face_guard, dig and stunt when any actor track was smoothed in the q = 10 tier (sigma_p >= 0.45), as minor_excursion / step_release already did."
    why: "After the fixes above these labels are still below P 0.6 at sigma 0.5 (blitz 0.38, show 0.58, post_position 0.33 with 47 FP, lob_protection 0.46, face_guard 0.27, dig 0.50, stunt 0.33) and they drove the over-confident top bin (0.84 correct at mean conf 0.97). Tier values were tried for dig / stunt first and rejected: dig_dist_max_q10 1.4 (equal-z boundary of the measured smoothed min distance, dig 1.08 +- 0.27 vs stunt 1.90 +- 0.43) cut stunt 8 -> 5 and doubled dig-scene FP; stunt_return_min_q10 0.4 gave +1 TP for +1 FP. The planned isotonic map is not fitted on this harness: it is the synthetic test set (fitting it there would tune to the test), it needs gold labels per tier."
    evidence: "sigma 0.5, all core cases: TP 940 -> 868, FP 273 -> 155, precision 0.775 -> 0.848; conf bins 0.5-0.7 / 0.7-0.9 / >= 0.9 accuracy 0.62 / 0.81 / 0.84 -> 0.66 / 0.88 / 0.93 (mean conf 0.60 / 0.80 / 0.97); deny at 0.5 0.79/0.65 -> 0.78/0.72 (face guard no longer owns its frames there). sigma 0.2 / 0.3 unchanged by this rule."
  - id: L2-DEF-T22 conftest-and-mvlib
    what: "Not changed: tests/movement/conftest.py and the mvlib.ca_rts solve are outside this family's three files (the family test file keeps setting the BLAS thread variables)."
    why: "Owner of mvlib / the test tree."
    evidence: "Family suite runs single-threaded (DEF-T22 loop 1)."
  - id: L2-not-addressed
    what: "help_and_recover precision at 0.3 (0.89, 2 FPs on XRUNG_dig_on_elbow_drive), closeout_fly_by NEG_run_by_1.45m_wide 1/20 at 0.3, trap / show recall at sigma 0.5."
    why: "Low severity or no measured fix that is net better in all three tiers within this pass."
    evidence: "Unchanged rows of the loop 2 grid."

changes_loop4:
  # Loop 4: calibration on real tracking (3 NBA 2015-16 SportVU games, private research data, 6855 s of clock-running
  # play, sigma told 0.15 m). Only aggregate rates per 48 min (both teams) and short anonymised descriptions here.
  # Rates: before = loop 3 code, after = this file; '/n0.3' / '/n0.5' = the same run with added noise 0.3 / 0.5 m.
  # Synthetic check: tester harness (164 core cases + cross negatives x seeds 1-10 x {as written, mirrored}) at sigma_p
  # 0.2 / 0.3 / 0.5: TOTAL core TP / FP 1281 / 30 | 1207 / 87 | 868 / 163 before -> 1281 / 30 | 1207 / 87 | 868 / 162
  # after (the only changed cell: XNEG_soft_show_is_not_a_trap at 0.5, 2 -> 1 FP). Reference rates: NBA teams trap /
  # blitz and face-guard rarely (a few per game, coverage reports from Second Spectrum / Synergy describe switching and
  # drop as the dominant ball-screen coverages); PBP gives ~188 possessions, ~24 turnovers, ~85 rebounds per game.
  - id: L4-POSSESSION defence-has-the-ball
    what: "globals possession_hold_s 1.0, possession_share 0.8, possession_margin_min 0.5, possession_margin_k 1.5, rim_ball_r 0.9: per-frame control (nearest player within HOLD_R of the raw ball, nearer than every opponent by the margin, none with the ball over a rim); possession changes on >= 80 % control frames in a 1.0 s window. make_event abstains (reason dposs) when t0 falls in a possession of the labelled defence; detect_all reports it under 'abstained'."
    why: "SportVU clock-running stretches (and video clips cut across a rebound or steal) contain possessions of the 'defence'; every defensive label there was a false positive (the defence was attacking). The scene contract (offence has the ball) is broken by real data, not by the synthetic scenes."
    evidence: "Flips vs PBP changes of possession (dreb, steal, made FG, dead-ball turnover): flip precision 0.805 (no margin) -> 0.853 (0.5 m margin), recall dreb 0.87, steal 0.88, made FG 0.89; latency PBP - flip median -0.96 s. Matchup 2680 -> 1644 / 48 with 1036 / 48 reported as abstain_dposs:matchup; synthetic grid unchanged (all scenes are offence possessions)."
  - id: L4-TRAP-RIM no-trap-over-the-rim
    what: "detect_trap: no hold frame while the ball XY is within rim_ball_r of a rim or H stands in the restricted area."
    why: "Putbacks / tip scrambles under the rim put two defenders within 1.5 m of the nearest attacker (holder relation is XY only)."
    evidence: "SportVU: 54 of 96 rim-area trap holds with the ball above 7.5 ft on >= 30 % of the hold had the ball XY within 0.6 m of a rim. Trap 78.2 -> 17.6 / 48 together with L4-POSSESSION and L4-TRAP-MOVING (cumulative; per-change split not preserved from the interrupted run). Test test_l4_trap_not_at_the_rim."
  - id: L4-TRAP-MOVING no-trap-on-a-drive
    what: "trap.handler_v_max 2.0 m/s: no trap when H's median smoothed speed over the stay is above the walk edge."
    why: "A trap stops the ball; a driver or a transition push with two defenders running alongside was labelled a trap."
    evidence: "Cumulative trap rate above; synthetic trap 0.98/0.98 | 0.88/0.85 | 0.67/0.55 unchanged. Test test_l4_trap_not_on_a_drive."
  - id: L4-TRAP-SHOT no-trap-ending-in-the-handlers-shot
    what: "trap.shot_after_s 1.5 s: no trap when H's own shot reaches a rim (ball XY within rim_ball_r, no other attacker holding in between) within 1.5 s of the stay end."
    why: "Sample of 15 remaining real traps + full tabulation of 43: 23 were post-area 'traps', 14 of them ended with the handler's shot within 1.5 s (help collapsing on a drive / post move, a contest, not a trap that takes the ball out of his hands). XY-only rule (production has no ball z): the ball reaching the rim."
    evidence: "Trap 18.1 -> 11.7 / 48 (n0.3 15.5 -> 11.7: stable under noise); post_double (traps on a post catch) 9.7 -> 6.7. Trap vs PBP steals / dead-ball turnovers: no match before or after (traps rarely end in a turnover; not a usable truth). Synthetic grid unchanged. Test test_l4_trap_not_on_a_post_shot."
  - id: L4-G2-SEP guard-two-needs-separated-attackers
    what: "guard_two.sep_min 3.0 m: the two attackers' 5-frame-mean distance >= this."
    why: "A defender next to a screener and the man he screens for (1.5-2.5 m apart) satisfied 'between two attackers' on every screen, hand-off and stack."
    evidence: "guard_two 369.3 -> 31.1 / 48 together with L4-G2-OUTNUMBERED (n0.3 31.1, n0.5 37.8); 64 of the 74 remaining holds do not end in a shot within 1.5 s. Synthetic guard_two unchanged. Test test_l4_guard_two_needs_separated_attackers."
  - id: L4-G2-OUTNUMBERED cover-two-is-a-numbers-disadvantage
    what: "A transition guard-two hold (cover_two) needs D outnumbered on >= half its frames: every other defender farther from the rim than the farther of the two attackers."
    why: "In real transition the other defenders are usually back; one defender near two attackers with help behind him is no cover-two."
    evidence: "Cumulative with L4-G2-SEP above. Test test_l4_cover_two_needs_outnumbered_defender."
  - id: L4-PERIMETER deny-and-face-guard-are-half-court-perimeter
    what: "deny / face_guard: no entry or stay frame with the ball beyond half court or with the man in the post area (r <= 4.5 m, post_position owns it)."
    why: "Bigs sealing near the rim with a defender on their ball side, and backcourt pick-ups, matched the face-guard geometry (on the line, within 0.9 m) without being perimeter denial."
    evidence: "face_guard 100.4 -> 18.0 / 48 (n0.3 14.3; n0.5 0 with 11.8 / 48 reported abstain_q10), deny 98.7 -> 18.5 (n0.3 19.7, n0.5 21.9). Synthetic deny / face_guard unchanged. Tests test_l4_post_area_is_not_face_guard_or_deny, test_l4_no_face_guard_with_ball_in_backcourt."
  - id: L4-POST post-holds-are-half-court-and-stationary
    what: "post_position.post_v_max 2.0 m/s and ball in the frontcourt: the post's median smoothed speed over the hold <= the walk edge."
    why: "Cutters and rollers running through the post area with their defender on the ball side were labelled front / three-quarter holds; transition runs to the rim too."
    evidence: "post_front 141.2 -> 88.2, 3/4 low 96.6 -> 66.0, 3/4 high 89.9 -> 65.6, behind 41.6 -> 27.3 / 48; lob_protection (one per front / 3/4-high hold) 231.1 -> 153.8; n0.3 within 15 %. Synthetic post_position unchanged. Test test_l4_cutter_is_not_posting."
  - id: L4-FLIP-HALFCOURT no-rotation-in-transition
    what: "rotate / switch / x_out: a flip needs the ball in the frontcourt and the old run >= old_min_s of frontcourt frames."
    why: "Matchups picked up in transition are not rotations of an established half-court assignment."
    evidence: "rotate 313.8 -> 68.5, switch 121.4 -> 47.9, x_out 11.7 -> 5.1 / 48 together with L4-FLIP-REBOUND and L4-POSSESSION (rotate 109.7 -> 68.5 for the two flip rules alone); n0.3 rotate 66.8, switch 54.6. Synthetic rotate / switch / x_out unchanged. Test test_l4_no_rotation_in_the_backcourt."
  - id: L4-FLIP-REBOUND no-rotation-in-the-rebound-phase
    what: "globals rim_phase_back_s 1.0, rim_phase_fwd_s 0.5: no matchup flip with the ball over a rim within [t - 1.0 s, t + 0.5 s]."
    why: "From a shot to the rebound, defenders hit whoever is nearest; those flips are rebound assignments."
    evidence: "Cumulative with L4-FLIP-HALFCOURT above. Test test_l4_no_rotation_in_the_rebound_phase."
  - id: L4-Q10-REPORT abstentions-are-reported
    what: "make_event records q10 / dposs abstentions; detect_all returns them under 'abstained' as 'abstain_<reason>:<kind>' events (conf 0). detect_lob_protection also reports abstain_q10:lob_protection for every q10-abstained front / three-quarter-high hold >= its min_s."
    why: "Under noise 0.5 nine coverage kinds abstain to zero (intended, L2-HIGH-NOISE-TIER); an empty list must be distinguishable from 'nothing happened'. lob_protection rides on the post holds and was silently empty."
    evidence: "n0.5 real run: post_front 0 with 78.5 / 48 abstain_q10, 3/4 high 40.7, 3/4 low 50.8, behind 21.8, face_guard 11.8, stunt 32.8, dig 3.0, hard_hedge 3.4, soft_show 2.1, blitz 0.4, lob_protection 0 -> 119.3 / 48 abstain_q10 reported. Tests test_l4_q10_abstention_is_reported, test_l4_q10_lob_protection_abstention_is_reported."
  - id: L4-not-addressed
    what: "post_double grows with added noise (6.7 / 17.2 / 24.0 per 48 at n0 / n0.3 / n0.5); closeout_fly_by (33 -> 65 at n0.3), contain (8 -> 19) and jump_to_ball (148 -> 190) are noise-sensitive; post holds (~250 / 48 summed over four classes) have no real truth here."
    why: "No PBP truth for these kinds and no measured root-cause fix within this pass; flagged for the next real-data loop (hand labels)."
    evidence: "Rates above; box_out vs PBP missed FG precision 0.60 -> 0.63, recall 0.24 -> 0.22 (unchanged within noise)."

validation_v0:
  method: >-
    tests/movement/test_defense.py scenes (sim.scenario, sigma_p 0.3 m, white + AR(1) rho 0.9, every leg physically
    timed: minimum-jerk peak acceleration <= 10 m/s^2 and speed <= 9.5 m/s; asymmetric speed profiles for the
    closeout profile scenes) re-run over seeds 1-12; a pass = kind, actors, t0 within +-0.3 s and conf in range.
    The committed tests use seed 7. Unphysical legs (e.g. 2.7 m in 0.45 s) make the CA-RTS gate reject
    observations and overshoot by up to 2 m, so the physics guard is part of the test harness.
  detection_rate_12_seeds:
    "12/12": [closeout, closeout_profile sprint_stop, closeout_fly_by, dig, deny,
              beaten, contain, back_pressure, get_back, safety_back, rotate, switch, x_out, xball_path through,
              drop_coverage standard / high / deep, blitz, ice, jump_to_ball, set_def, transition_matched,
              press_pickup, stop_ball, offball trail]
    "11/12": [closeout_length hard / short, closeout_profile choppy, stunt, step_release, sink, sink_and_fill,
              box_out, guard_two, post_front, post_behind, lob_protection, protect_rim, hard_hedge, xball_path over /
              under]
    "10/12": [recover, face_guard, soft_show, trap, post_double, derived drive + screen anchors]
    "9/12": [minor_excursion (0.7 m), help_and_recover, at_level, post_three_quarter_high, tag (true contact 0.56 m)]
    "5/12": [top_lock (0.5 m lead: sub-noise, as the check predicted)]
  false_positive_rate_12_seeds: "still-defender ladder negatives fire in 1/12 seeds (minor_excursion, step_release); all other negatives 0/12"
  takeaways:
    - "Sub-metre gates (top-lock lead, 0.5-0.7 m excursions, 1.0 m contacts) are the weak spot at sigma_p 0.3 AR(1); keep them soft and abstain-by-default at tier C/D until noise_model is measured."
    - "Closeout profile classes separate with d' ~ 2.4 only; sprint-stop vs choppy is reported with alternatives, never as a hard label."
    - "The matchup HMM lags geometric exchanges by up to ~1.7 s for a defender lingering between two attackers; switch timing uses the geometric exchange."
items:
  # ------------------------------------------------------------------------------------------------ rules
  - id: kinematics
    research_id: DM-RULE-01
    level: rule
    name: Defensive kinematics on the shared CA-RTS smoother
    aliases: [kinematic features, smoothing]
    actors: every player
    t0: n/a (per-frame features)
    rule: >-
      All defensive rules read mvlib Kin features: CA-RTS (MP-04, q_j 30 m^2/s^5, 10 when sigma_p >= 0.45), speed,
      sigma_speed = K_CAL sqrt(var_v) k_edge, heading valid at speed >= 1.0 m/s, accel_along valid at >= 0.5 m/s,
      v_r positive toward the rim, stationary by s2 = v^T P_v^-1 v < 5.99 (never raw speed < 0.3, which CA-RTS biases
      upward at rest: sim.py mean smoothed speed of a still player 0.43 m/s). Direction changes use the MP-13 pre/post
      mean velocities that skip the plant phase. No defensive rule reads per-frame acceleration; decelerations are
      measured as implied mean deceleration over a distance (closeout profile) and onsets by displacement.
    params: {}
    min_duration_s: null
    outputs: [x, y, vx, vy, speed, sigma_speed, heading, v_r, stationary_s2]
    confidence: high (mathematics of the shared smoother); thresholds per item
    noise: >-
      Correlated (AR(1) rho 0.9) noise makes RTS sigmas optimistic; K_CAL 1.8 plus the sigma_rel floor compensate
      until MP-18 measures sigma_p and rho on our footage. Smoothed peaks of short efforts are 15-40 % low.
    conflicts_resolved:
      - "Research DM-RULE-01 Gaussian sigma_t 2/5/8 ladder vs MP-04 CA-RTS: CA-RTS adopted so all families share one
        pipeline; the research's noise gains (white noise only) are superseded by the MP-08 error budget."
    sources:
      - {url: "repo:tools/specgen/movement/mvlib.py", supports: "CA-RTS, features, gates"}
      - {url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC6720027/", supports: "+-2 m/s^2 acceleration cut-offs in basketball LPS (20 Hz); not transferred to CV data without filtering"}
    status: canonical
    detectability: rule
    detector: null

  - id: noise_model
    research_id: check.missing
    level: rule
    name: Measured noise model (prerequisite for releasing soft probabilities)
    aliases: [noise floor, autocorrelation]
    actors: tracker output
    t0: n/a
    rule: >-
      Before any defensive label is released for a game: measure sigma_p and the lag-1 autocorrelation of raw floor
      positions on >= 50 hand-marked stationary windows (MP-18 (1)); the ID-swap rate per player-minute versus
      inter-player distance (bins 0-0.6, 0.6-1.0, 1.0-1.5 m); then refit k_floor (and sigma_rel_min) so that 95 % intervals of pair
      distance cover 93-97 %. Until then the sub-noise primitives (moves <= 0.6 m, perp gates <= 0.6 m) carry
      abstain_by_default = true at tier C/D.
    params: {}
    min_duration_s: null
    outputs: [sigma_p, rho_lag1, id_swap_rate_by_distance, k_floor_fitted]
    confidence: proposal
    noise: This item is the noise model.
    conflicts_resolved: []
    sources:
      - {url: "repo:config/named_spots.yaml rule_position_sigma_model", supports: "sigma tiers 0.15/0.30/0.50/1.0 m"}
    status: proposal
    detectability: rule
    detector: null

  - id: matchup
    research_id: DM-RULE-02
    level: rule
    name: Matchup backbone (per-defender HMM, forward-backward)
    aliases: [matchup posterior, guarding assignment, defensive matchups]
    actors: each defender x the offensive players
    t0: first frame of a stable top-1 run
    rule: >-
      Emission D ~ N(mu, s2 I): mu = w_o A + w_b B + (1 - w_o - w_b) R with R = rim = (0, 0) (named_spots
      canonical_defender_point), or mu = w_o_holder A when A holds the ball (a corollary of the same fit when O and B
      coincide, not a separate fit). s2 = sigma_fit^2 + K_CAL^2 var_p(D) + w_o^2 K_CAL^2 var_p(A); sigma_fit_transition
      replaces sigma_fit on frames with A or D beyond half court (Franks fitted half court only). Transition: stay
      rho_stay per 29.97 fps frame, the rest shared equally. Forward-backward offline (forward-only live). Event
      'matchup' = top-1 run (flicker shorter than flicker_s absorbed) lasting >= min_s.
    params:
      w_o: {value: 0.62, unit: "1", note: "Franks et al. weight on the man"}
      w_b: {value: 0.11, unit: "1", note: "weight on the ball"}
      w_o_holder: {value: 0.73, unit: "1", note: "weight on the man when he holds the ball"}
      rho_stay: {value: 0.985, unit: "1/frame", note: "rho25 0.96-0.99 -> rho30 0.966-0.992; refit by EM"}
      sigma_fit: {value: 1.5, unit: m, note: "emission spread, proposal; refit on ~300 hand-labelled defender-seconds"}
      sigma_fit_transition: {value: 3.0, unit: m, note: "beyond half court (proposal)"}
      flicker_s: {value: 0.3, unit: s, note: "top-1 runs shorter than this are absorbed"}
      min_s: {value: 1.0, unit: s}
    min_duration_s: 1.0
    outputs: [defensive_matchups.matchup_prob (per frame internally, per second stored), top1, mean_posterior, censoring flags]
    confidence: "conf = mean posterior of the top-1 attacker over the run x edge x gap (edge taken at the first interior frame for left-censored runs)"
    noise: >-
      Screen overlaps (< 1 m) make the posterior oscillate; persistence gates in rotate / switch absorb it. A
      defender guarding two players splits the posterior: see guard_two, which suppresses ROTATE between those two.
    conflicts_resolved:
      - "rho quoted at 25 fps; converted and set mid-range (0.985) until an EM refit on MSU data."
      - "Transition: Franks' emission is half-court only; a wider emission is used beyond half court (check fix)."
    sources:
      - {url: "https://arxiv.org/pdf/1405.0231", supports: "0.62 O + 0.11 B + 0.27 H; 0.73/0.27 with the ball; rho 0.96-0.99 at 25 fps; half-court fitting"}
      - {url: "repo:config/named_spots.yaml canonical_defender_point", supports: "same canonical point"}
      - {url: "repo:docs/requirements_review/proposals_consolidated.yaml R-DF-01", supports: "top-1 >= 85 % on 300 defender-seconds"}
    acceptance: "top-1 accuracy >= 85 % on 300 hand-labelled defender-seconds (R-DF-01)"
    status: canonical
    detectability: xy
    detector: detect_matchup
    kinds: [matchup]

  - id: confidence_model
    research_id: DM-RULE-03
    level: rule
    name: Confidence, hysteresis and abstention
    aliases: [soft labels, event probability]
    actors: all events
    t0: per event
    rule: >-
      See globals.confidence_model. Spatial holds enter on the named_spots predicate and stay while the relaxed gate
      (threshold + h, h = max(hyst_h_min, hyst_k_sigma x sigma_rel)) holds, bridging exit gaps of up to dwell_frames.
      Durations come from mvlib.hysteresis (elapsed (n - 1) DT).
    params: {}
    min_duration_s: null
    outputs: [conf, p_cond, q_obs, alternatives, reasons]
    confidence: proposal
    noise: >-
      Gates near the noise floor (deny perp 0.6 m, box-out seg 0.5 m, step 0.35 m) are soft only; window means do not
      shrink AR(1) error much (check: 0.92 / 0.87 / 0.80 of sigma for 5 / 9 / 15 frames), so no sqrt(n) credit is taken.
    conflicts_resolved:
      - "Research sqrt(n/10) window-mean reduction removed (check, high)."
    sources:
      - {url: "repo:config/named_spots.yaml loader.temporal.defaults.relative", supports: "h_min 0.25 m, h_k_sigma 0.75, dwell 233 ms / 467 ms"}
    status: canonical
    detectability: rule
    detector: null

  - id: anchors
    research_id: DM-RULE-04
    level: rule
    name: Event anchors consumed by defensive rules (XY proxies)
    aliases: [triggers]
    actors: upstream events
    t0: see rule
    rule: >-
      Real anchors come from other families and are passed as anchors=... (a supplied key replaces the derived list).
      XY proxies (derive_anchors): holder runs from mvlib (ball within HOLD_R 1.0 m of an attacker), short None
      flicker (<= holder_merge_gap_frames) bridged. PASS: holder A -> (flight) -> holder B != A; t_rel = last frame of
      A, t_catch = first frame of B; skip when x_A x_B < 0 and |x| >= skip_abs_x for both. SHOT: a flight after A whose
      smoothed ball comes within shot_rim_r of the rim; t_rim = frame of minimum ball r (needs ball z for the true
      rim contact). DRIVE: holder v_r >= drive_v_r for >= drive_min_s with r falling >= drive_min_dr, start back-dated
      while v_r >= drive_backdate_v_r. MIDDLE DRIBBLE
      (proxy for dribble start/end): holder moving at >= move_v for >= move_min_s with |x| falling >= middle_dx (a
      moving holder must be dribbling; pick-up time is the stop, which is a proxy). BALL SCREEN: teammate S within
      screen_xball_r of the on-ball defender and screen_h_r of the holder, S nearly still (mean speed <=
      screen_still_v over +-5 frames); t0 = minimum S-to-X-ball distance (defense A0); one screen per screener and
      handler within screen_merge_s. Change of possession is
      never derived from XY.
    params:
      screen_pre_s: {value: 0.5, unit: s, note: "X-ball / X-big read this long before the derived screen t0 (was a literal, DEF-T20)"}
      holder_merge_gap_frames: {value: 2, unit: frames}
      shot_rim_r: {value: 1.0, unit: m}
      skip_abs_x: {value: 3.0, unit: m}
      drive_v_r: {value: 2.0, unit: m/s}
      drive_min_s: {value: 0.3, unit: s}
      drive_min_dr: {value: 1.0, unit: m}
      drive_backdate_v_r: {value: 1.0, unit: m/s, note: "drive start back-dated to where v_r first exceeded this"}
      move_v: {value: 1.0, unit: m/s}
      move_min_s: {value: 0.2, unit: s}
      middle_dx: {value: 0.8, unit: m}
      screen_xball_r: {value: 1.2, unit: m}
      screen_h_r: {value: 3.0, unit: m}
      screen_still_v: {value: 1.5, unit: m/s}
      screen_merge_s: {value: 1.0, unit: s}
    min_duration_s: null
    outputs: ["anchor dicts: pass, shot, drive, middle_dribble, screen, cop"]
    confidence: high for definitions; proxy quality limited (dribble state and rim contact need ball z)
    noise: Ball occluded at the catch gives +-2-3 frames; sequencing windows allow +-0.2 s (MP-17).
    conflicts_resolved: []
    sources:
      - {url: "repo:docs/taxonomy/defense_full.md A0 header", supports: "screen t0 = minimum screener-to-on-ball-defender distance"}
      - {url: "repo:schema/tables/reaction_events.yaml", supports: "trigger_type enum"}
    status: proposal
    detectability: rule
    detector: null

  - id: ball_screen
    research_id: DM-RULE-05
    level: rule
    name: Ball-screen measurement frame and coverage classifier
    aliases: [screen frame, level offset]
    actors: handler H, screener S, X-ball, X-big
    t0: screen t0
    rule: >-
      P_s = 5-frame mean S(t0). Depth axis e_r = unit(P_s -> rim) (named_spots pnr_big_* frame): depth(p) = (p -
      P_s).e_r, positive toward the rim. Path axis u = unit of H's mean velocity over [t0 - 0.5, t0] when >=
      u_min_speed, else the perpendicular to e_r pointing from H toward S; lateral(p) = (p - P_s).u (positive = ahead
      of the screen in H's path). X-ball path: the first sign change, in [t0 - cross_back_s, t0 + cross_fwd_s], of
      X-ball's side of the line through S along e = unit(S -> X-big) (or e_r when X-big is within big_near of S); at
      that frame q = (X - P_s).e (P_s fixed: the screener may already be rolling): over q < -class_margin, through -class_margin..d_big - class_margin, under beyond
      (no through when X-big is within big_near); no_cross if no sign change. Coverage class (mutually exclusive,
      priority blitz > hard_hedge > soft_show > flat > at_level > drop bands): blitz = TRAP(X-ball, X-big, H) starting
      in [t0 - blitz_back_s, t0 + blitz_fwd_s] (see blitz); a show exists (p_emit) when min depth <= soft_depth_max and
      lateral >= soft_lat_min and the big then goes back (recovery chord >= recovery_chord_min or retreat >=
      soft_retreat_min within recovery_s); given a show, hard_hedge = min depth over [t0 - show_back_s, t0 +
      show_fwd_s] <= hard_depth_max, max lateral >= hard_lat_min, hold in [hard_hold_min_s, hard_hold_max_s] and
      smoothed recovery peak >= hard_recovery_peak; soft_show = not hard and min depth >= soft_depth_min (the soft
      recovery peak >= soft_recovery_peak is the quick_recovery attribute). The hold is measured on 5-frame means with
      relative hysteresis (enter depth <= hold_depth and lateral >= hold_lat, stay within + h, dwell_frames bridged)
      until show_fwd_s + hold_tail_s (loop 1 DEF-T06). Peaks use the *_q10 values when X-big was smoothed with q = 10
      (loop 1 DEF-T13); flat = depth at t0 + depth_at_s in [0, level_max] with lateral >=
      flat_lat_min; a depth < -level_max that is no show is show_unclassified (abstain: no label); at_level =
      |depth| <= level_max; drop_high level_max..high_max, drop_standard high_max..standard_max, drop_deep >
      standard_max; r(X-big) <= deep_r_max promotes a standard drop to deep with probability P(r <= deep_r_max) x
      P(depth > high_max), never a high drop (loop 1 DEF-T07). The crossing is accepted on the 5-frame-mean side only
      when the new sign holds cross_hold_frames (loop 1 DEF-T10). Switches are labelled by detect_switch.
    params:
      pre_screen_s: {value: 0.5, unit: s, note: "X-ball / X-big / H velocity read this long before t0 (was a literal, DEF-T20)"}
      cross_hold_frames: {value: 5, unit: frames, note: "loop 1 DEF-T10: a crossing of the 5-frame-mean side must hold this long"}
      blitz_retreat_s: {value: 0.5, unit: s, note: "loop 1 DEF-T02: a big retreating >= soft_retreat_min this soon after the trap while H holds showed, not blitzed"}
      hold_tail_s: {value: 1.0, unit: s, note: "hold searched until show_fwd_s + this (was a literal, DEF-T20)"}
      no_man_behind_s: {value: 2.0, unit: s, note: "window of no_man_behind_share (was a literal, DEF-T20)"}
      hard_recovery_peak_q10: {value: 2.2, unit: m/s, note: "loop 1 DEF-T13: q = 10 smoother tier (sigma_p >= 0.45). Harness side_pnr_hard_hedge, 60 runs: smoothed recovery peak 5.11 m/s (q30, sigma 0.3) -> 4.47 (q10, sigma 0.5), ratio 0.875 x 2.5"}
      soft_recovery_peak_q10: {value: 1.6, unit: m/s, note: "loop 1 DEF-T13: q = 10 tier. Harness side_pnr_soft_show, 60 runs: 2.32 m/s (q30) -> 1.85 (q10), ratio 0.8 x 2.0"}
      u_min_speed: {value: 1.0, unit: m/s}
      big_near: {value: 1.0, unit: m}
      cross_back_s: {value: 0.5, unit: s}
      cross_fwd_s: {value: 2.0, unit: s, note: "research 1.0 s; an under path of 5-6 m needs >= 1.9 s (min-jerk at <= 10 m/s^2)"}
      class_margin: {value: 0.3, unit: m}
      hip_max: {value: 0.8, unit: m, note: "over: X-ball within 0.8 m of S while crossing = hip, else wide"}
      blitz_back_s: {value: 0.2, unit: s}
      blitz_fwd_s: {value: 1.5, unit: s}
      blitz_depth_max: {value: 0.5, unit: m}
      show_back_s: {value: 0.2, unit: s}
      show_fwd_s: {value: 0.8, unit: s}
      hold_depth: {value: -0.6, unit: m, note: "hold = time at the hard-hedge position itself (depth and lateral gates)"}
      hold_lat: {value: 0.8, unit: m}
      recovery_s: {value: 1.2, unit: s}
      hard_depth_max: {value: -0.6, unit: m}
      hard_lat_min: {value: 0.8, unit: m}
      hard_hold_min_s: {value: 0.5, unit: s}
      hard_hold_max_s: {value: 2.0, unit: s, note: "loop 1 DEF-T06: 1.5 -> 2.0 s; the measured hold includes approach / exit frames (a true 0.9 s stay measures ~1.6 s)"}
      hold_sigma_s: {value: 0.25, unit: s, note: "soft hold window: P(min <= hold <= max) with this sigma (gate-crossing jitter, proposal)"}
      recovery_chord_min: {value: 2.0, unit: m}
      hard_recovery_peak: {value: 2.5, unit: m/s, note: "CA-RTS smoothed (research 4.0 m/s true was unreachable)"}
      soft_depth_max: {value: 0.5, unit: m}
      soft_depth_min: {value: -1.0, unit: m, note: "research soft show -1.0 <= lambda_min"}
      soft_lat_min: {value: 0.5, unit: m}
      soft_retreat_min: {value: 1.0, unit: m}
      class_margin_min: {value: 0.2, unit: "1", note: "show: hard_hedge / soft_show only when |P(hard | show) - P(soft | show)| >= this, else show_unclassified (abstain; loop 2 SHOW-hard-vs-soft)"}
      soft_recovery_peak: {value: 2.0, unit: m/s}
      depth_at_s: {value: 0.3, unit: s}
      level_max: {value: 0.6, unit: m}
      flat_lat_min: {value: 0.5, unit: m}
      high_max: {value: 1.83, unit: m, note: "heuristic edge (R-DF-16)"}
      standard_max: {value: 3.05, unit: m, note: "1.83-3.05 m sourced from a coaching blog (repo N3); 3.05 edge heuristic"}
      deep_r_max: {value: 4.5, unit: m}
    min_duration_s: null
    outputs: [depth_m, lateral_m, path class + probs, coverage class + probs, frame_dir_source]
    confidence: medium (geometry repo F3.0; margins proposal)
    noise: >-
      Identity swaps between X-ball and S (closer than 0.6 m) flip over/under; require tracker identity confidence >=
      0.8 in [t0 - 0.5, t0 + 1.0] when available. The 0.3 m margins are below sigma_rel: soft classes only.
    conflicts_resolved:
      - "lambda frame (handler velocity) vs named_spots pnr_big_* (S -> rim): depth uses the named_spots axis
        (canonical positions); the velocity axis is used only for lateral offsets and the switch exchange lambda."
      - "Research crossing bands left THROUGH empty under a drop; replaced by the S -> X-big axis test (BS-3 segment
        test made continuous)."
      - "Depth bands R-DF-16 (0.6/1.83/3.05) vs named_spots pnr_big_* (-0.6/1.0/3.5, r <= 5.5): event classes use
        R-DF-16 (the live requirement); the per-frame named_spots labels may disagree in 1.0-1.83 and 3.05-3.5 m
        (open question for named_spots 0.3.3)."
    sources:
      - {url: "repo:docs/taxonomy/defense_full.md F3.0, F3.1, F3.2, BS-1, BS-3, BS-4, BS-9", supports: "screen geometry and coverage signatures"}
      - {url: "repo:config/named_spots.yaml pnr_big_hedge, pnr_big_at_level, pnr_big_high_drop, pnr_big_deep_drop, pnr_big_blitz", supports: "rim-direction depth axis"}
      - {url: "repo:docs/requirements_review/proposals_consolidated.yaml R-DF-16", supports: "bands 0.6/1.83/3.05 at t0 + 0.3 s"}
      - {url: "https://www.sloansportsconference.com/research-papers/recognizing-and-analyzing-ball-screen-defense-in-the-nba", supports: "prior automated screen-defense classification of 270,823 NBA screens (classes not verified)"}
    status: proposal
    detectability: rule
    detector: null

  - id: help_ladder
    research_id: DM-RULE-06
    level: rule
    name: Help-excursion ladder (one event, graded commitment)
    aliases: [help commitment scale]
    actors: off-ball defender D (matchup A), handler H
    t0: excursion onset
    rule: >-
      Triggers: middle dribble, drive, ball screen, post catch (receiver r <= post_catch_r); one trigger per handler per
      trigger_merge_s (a middle dribble wins). For every off-ball defender (not H's top defender, matchup A != H): onset
      = first frame in [t, t + onset_window_s] with v_to(H) >= onset_v_to held >= onset_hold_s. Peak = largest 5-frame
      mean displacement from the pre-onset baseline (baseline_back_s before the onset) within excursion_max_s; it must point toward H (component >=
      dir_cos_min x peak), and when the defender never comes within sink_owner_min_dh of H and moved more toward the
      rim than toward H, SINK owns it. return = drop of dist(D, A) after the peak within return_window_s
      (stunt_return_s for the stunt). A persistent matchup change at peak + restore_s means ROTATE (no ladder label); a
      TRAP containing D means a double. Rungs (exactly one, highest met): help_and_recover (dist(D, A) at peak >=
      har_off_man_min, D inside the 1.5 m drive corridor ahead of H (beside the H -> rim segment with lane fraction tau >
      0, loop 1: a digger just behind H is not in the corridor), or the nearest defender to H while H's own
      defender is beaten (r_onb > r_H), for >= har_near_s,
      return >= har_return_min, matchup A restored at peak + restore_s); dig (not nearest; approach >=
      dig_approach_min, min dist(D, H) <= dig_dist_max (hard <= hard_dig_max), return >= dig_return_min);
      step_release (middle-dribble trigger; peak >= step_min, release >= step_release_min, onset <= step_onset_max_s
      after the dribble start, reversal start (v_to(A) >= onset_v_to held >= onset_hold_s) <= step_release_lag_max_s
      after the dribble end, never within dig_dist_max);
      stunt (other triggers; peak >= stunt_min, return >= stunt_return_min within stunt_return_s, min dist > dig_dist_max;
      fake_trap flag when min dist <= fake_trap_dist); minor_excursion (other triggers; minor_min <= peak < stunt_min,
      return >= minor_return_min); minor_excursion and step_release abstain when the defender's or handler's estimated
      sigma_p >= subnoise_abstain_sigma_p (loop 1 DEF-T13). When no rung reaches emit_p_min but the rung probabilities sum to >= emit_p_min (an
      excursion surely happened, its rung is ambiguous), the most probable rung is emitted with conf = P(rung) and
      all rung probabilities as alternatives.
    params:
      span_after_peak_s: {value: 0.3, unit: s, note: "min dist / help share / trap overlap measured until peak + this (was a literal, DEF-T20)"}
      rot_persist_s: {value: 0.5, unit: s, note: "a new top-1 at peak + restore_s must hold this long to make the excursion a rotation (was a literal, DEF-T20)"}
      post_catch_r: {value: 4.5, unit: m}
      trigger_merge_s: {value: 1.0, unit: s}
      onset_window_s: {value: 1.5, unit: s}
      onset_v_to: {value: 0.7, unit: m/s, note: "CA-RTS attenuates 0.5 m out-and-back steps: smoothed peaks ~1.0-1.3 m/s (sim.py)"}
      onset_hold_s: {value: 0.15, unit: s}
      baseline_back_s: {value: 0.2, unit: s, note: "displacement baseline = 5-frame mean position this long before the onset (not after it)"}
      excursion_max_s: {value: 3.0, unit: s}
      return_window_s: {value: 1.5, unit: s}
      return_min_frac: {value: 0.4, unit: "1", note: "excursion closes when dist(D, A) has dropped by 40 % of the peak"}
      stunt_return_s: {value: 1.0, unit: s}
      corridor_half_width: {value: 0.75, unit: m}
      restore_s: {value: 2.0, unit: s}
      dir_cos_min: {value: 0.5, unit: "1"}
      sink_owner_min_dh: {value: 2.0, unit: m}
      har_near_s: {value: 0.3, unit: s}
      har_off_man_min: {value: 2.0, unit: m}
      har_return_min: {value: 1.0, unit: m}
      dig_approach_min: {value: 1.5, unit: m}
      dig_dist_max: {value: 1.2, unit: m}
      hard_dig_max: {value: 0.8, unit: m}
      dig_return_min: {value: 1.0, unit: m}
      step_min: {value: 0.35, unit: m, note: "measured threshold below the 0.5 m behavioural size (check fix); ROC-calibrate"}
      step_release_min: {value: 0.3, unit: m}
      step_onset_max_s: {value: 0.65, unit: s, note: "0.4 s + t_react"}
      step_release_lag_max_s: {value: 0.8, unit: s, note: "0.5 s + proxy dribble-end jitter"}
      stunt_min: {value: 1.0, unit: m}
      stunt_return_min: {value: 0.5, unit: m}
      minor_min: {value: 0.35, unit: m}
      minor_return_min: {value: 0.3, unit: m}
      fake_trap_dist: {value: 2.0, unit: m}
    min_duration_s: 0.2
    outputs: [rung, peak_disp_m, min_dist_to_handler_m, latency_s, return_censored, hard_dig, fake_trap, alternatives]
    confidence: "P_cond = product of the rung's gates: distances to H / A sigma_rel, returns (pair-distance changes) sqrt(2) sigma_rel, the excursion peak (ONE track's displacement) sigma_own (loop 2 NEW-R1); all rung probabilities stored as alternatives. dig and stunt abstain in the q = 10 tier (globals.high_noise_abstain_kinds)"
    noise: Rungs 0-1 are near the noise floor (abstain_by_default at tier C/D until noise_model is measured).
    conflicts_resolved:
      - "STEP_RELEASE vs STUNT: the trigger decides (check fix), so no defender-moment carries two labels."
      - "DIG vs HELP_AND_RECOVER: disjoint by whether D became the nearest defender / corridor defender."
      - "Unclassified 0.5-1.0 m excursions: minor_excursion rung (check fix)."
