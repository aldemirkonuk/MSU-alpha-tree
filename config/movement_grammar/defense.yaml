  # ------------------------------------------------------------------------------------------------ actions
  - id: rotate
    research_id: DM-A01
    level: action
    name: ROTATE (single persistent matchup change)
    aliases: [rotation, pick up]
    actors: D, A_old -> A_new
    t0: first frame of the new top-1 run (posterior crossing)
    rule: >-
      Top-1 runs (flicker < flicker_s absorbed); flips are taken between consecutive stable runs (>= old_min_s), so a
      transitional run while D passes another attacker's canonical point is skipped; t0 = first frame after the old
      run with P(new) > P(old); new run persists >= persist_s (or >=
      censored_min_s when it reaches the clip end); P(A_new) >= p_new_min at t0 + check_s; not reciprocal within
      switch.pair_max_s = 2.0 s (SWITCH / X-OUT); not inside a guard_two interval (+- guard_two_margin_s) for the same
      two attackers. Runs come from the one-to-one joint assignment (joint_top1, loop 1 DEF-T17); a flip back to the
      attacker of the run before a run shorter than persist_s (A -> B -> A) is a help excursion that returned, not a
      rotation (loop 1 DEF-T03). Loop 4: a flip needs the ball in the frontcourt and the old run >= old_min_s of
      frontcourt frames (transition pick-ups are not rotations, L4-FLIP-HALFCOURT), and no ball over a rim within
      [t - rim_phase_back_s, t + rim_phase_fwd_s] (rebound assignments, L4-FLIP-REBOUND); both apply to switch and x_out
      through the shared flips. Trigger = latest pass / drive /
      screen within trigger_lookback_s; latency = first frame D moves toward A_new at >= move_v minus the trigger.
    params:
      guard_two_margin_s: {value: 1.0, unit: s, note: "guard-two suppression extends this far around the hold (was a literal, DEF-T20)"}
      move_back_s: {value: 1.5, unit: s, note: "latency search starts this long before t0 (was a literal, DEF-T20)"}
      flicker_s: {value: 0.3, unit: s}
      old_min_s: {value: 0.5, unit: s}
      persist_s: {value: 1.0, unit: s}
      censored_min_s: {value: 0.5, unit: s}
      check_s: {value: 0.5, unit: s}
      p_new_min: {value: 0.6, unit: "1"}
      move_v: {value: 1.0, unit: m/s}
      trigger_lookback_s: {value: 3.0, unit: s}
    min_duration_s: 1.0
    outputs: [from, to, trigger, latency_s, chord_m, censored]
    confidence: "window mean of P(A_new) over the new run"
    noise: Zone schemes make HMM rotations meaningless; suppress when the zone posterior >= 0.6 (zone family).
    conflicts_resolved: ["Guard-two (one defender between two unguarded attackers) suppresses ROTATE between them (check missing item)."]
    sources:
      - {url: "repo:docs/taxonomy/defense_full.md 0.4 ROTATE", supports: "persist >= 1.0 s"}
    status: canonical
    detectability: xy
    detector: detect_rotate
    kinds: [rotate]

  - id: switch
    research_id: DM-A02
    level: action
    name: SWITCH with timing (pre / on-time / late / very late) and intensity (hard / soft / neutral)
    aliases: [switch, exchange, hard switch, soft switch, late switch, jump switch]
    actors: D1, D2 exchanging A1 <-> A2
    t0: geometric exchange = closest approach of D1 and D2 in [first flip - exchange_back_s, last flip + exchange_fwd_s], over the frames where at least one of them moves (s2 >= stand_s2, loop 2)
    rule: >-
      Reciprocal top-1 flips <= pair_max_s apart, both persisting >= persist_s (or censored >= censored_min_s), and not
      an X-out. Timing vs the nearest screen involving A1 or A2: pre_switch [pre_lo_s, pre_hi_s], on_time (pre_hi_s,
      on_time_hi_s], late (on_time_hi_s, late_hi_s], very_late > late_hi_s, unclassified otherwise, no_screen without a
      screen. Intensity of the new defender of the handler (or of the attacker nearer the ball): hard = closes from >=
      hard_from_min to <= hard_to_max within hard_window_s (no absolute speed gate, check fix) or exchange lambda <= 0 on the
      handler-velocity axis; soft = cushion >= soft_cushion_min held soft_hold_s and lambda > soft_lambda_min;
      neutral otherwise. coverage_label when persistence >= coverage_persist_s. Jump switch needs no speed gate: it
      is a hard switch with lambda <= -0.5 m (attr exchange_lambda_m).
    params:
      flicker_s: {value: 0.3, unit: s}
      old_min_s: {value: 0.5, unit: s}
      pair_max_s: {value: 2.0, unit: s, note: "research 1.0 s; under the 0.985 stay prior the second flip lags when one defender lingers between the two attackers (sim.py: 1.4-1.75 s apart in 3/12 seeds); t0 comes from the geometric exchange"}
