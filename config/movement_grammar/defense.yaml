  - id: guard_two
    research_id: check.missing
    level: action
    name: Guard-two (one defender between two otherwise unguarded attackers)
    aliases: [zone-in-man, cover two, sag off the non-shooter, tag and stay]
    actors: D, A1, A2
    t0: first frame of the hold
    rule: >-
      D within between_max of segment A1-A2, |dist(D, A1) - dist(D, A2)| <= balance_max, both <= reach_max, and no other
      defender within others_min of A1 or A2; stay with balance_max + h and between_max + h (relative hysteresis) and
      gaps <= dwell_frames bridged (loop 1 DEF-T18); held >= min_s (half court) or >= min_s_transition (transition:
      cover_two).
      Loop 4: the attackers are >= sep_min apart (5-frame mean), and a transition hold (cover_two) needs D outnumbered on
      >= half of its frames: every other defender farther from the rim than the farther of the two attackers.
      While it holds, ROTATE between A1 and A2 for D is suppressed (the HMM posterior legitimately oscillates).
    params:
      balance_max: {value: 1.0, unit: m}
      reach_max: {value: 5.0, unit: m}
      between_max: {value: 1.5, unit: m}
      others_min: {value: 2.5, unit: m}
      sep_min: {value: 3.0, unit: m, note: "loop 4 L4-G2-SEP: 5-frame-mean distance between the two attackers >= this (twice the 1.5 m between_max: closer attackers are both within reach of one defender, i.e. a screen / hand-off / stack, not two men to guard)"}
      min_s: {value: 1.0, unit: s}
      min_s_transition: {value: 0.5, unit: s}
    min_duration_s: 0.5
    outputs: [variant, transition]
    confidence: "window mean of P(|d1 - d2| <= 1.0)"
    noise: none specific
    conflicts_resolved: ["Adds the rule the check found missing for defenders guarding two players."]
    sources:
