  - id: post_position
    research_id: DM-A17
    level: action
    name: Post defence positions (front, three-quarter high / low, behind)
    aliases: [front, 3/4 high, 3/4 low, play behind]
    actors: post defender, post attacker (r <= 4.5, off-ball)
    t0: first frame of the hold
    rule: >-
      Class per frame from named_spots post_full_front / post_three_quarter_high / post_three_quarter_low / post_behind
      (defender's top-1 man, holder and ball as context); hold >= min_s with dwell_frames gaps; abstain when the mean
      distance < abstain_dist (the angle is noise). Flips (front <-> behind routes) are compositions of consecutive holds.
      Loop 4 (L4-POST): only with the ball in the frontcourt, and the post's median smoothed speed over the hold <=
      post_v_max (posting, not cutting). The post area (r <= 4.5 m) belongs to these labels: deny and face_guard exclude it.
    params:
      front_max_deg: {value: 45, unit: deg, note: "angle at the post between post->defender and post->ball: front band (was a literal, DEF-T20)"}
      behind_min_deg: {value: 135, unit: deg, note: "behind band (was a literal, DEF-T20)"}
      min_s: {value: 0.5, unit: s}
      abstain_dist: {value: 0.4, unit: m}
      post_v_max: {value: 2.0, unit: m/s, note: "loop 4 L4-POST: the post's median smoothed speed over the hold <= the walk edge (kinematics walk < 2.0 m/s); faster men in the post area are cutting / rolling"}
    min_duration_s: 0.5
    outputs: [class, alternatives (front / three_quarter / behind), mean_dist_m]
    confidence: "window mean of P(angle band) with sigma_phi = sigma_rel / dist x share of frames in the class"
    noise: bodies in contact swap identities
    conflicts_resolved: ["F6.1 front (tau, perp <= 0.5) vs named_spots (angle <= 45 deg, <= 1.2 m): named_spots."]
    sources:
      - {url: "repo:config/named_spots.yaml post_full_front, post_three_quarter_high, post_three_quarter_low, post_behind", supports: "geometry"}
      - {url: "repo:docs/taxonomy/defense_full.md F6.1, M-2(c)", supports: "flip trigger"}
    status: canonical
    detectability: xy
    detector: detect_post_position
    kinds: [post_front, post_three_quarter_high, post_three_quarter_low, post_behind]

