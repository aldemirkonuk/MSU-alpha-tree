    frame is the frame of largest |l| on the other side within [a - window_s, set-up], taken among runs of >= show_frames consecutive frames with |l| >= min_offset_m, s within max_sh_m of h and screener speed < show_speed_mps (a show; loop 1, SCR-T09 - a run-past is not a flip); |l| >= min_offset_m there and over the last 5 frames
