- id: pin_down
  level: action
  name: Pin-down, wide pin-down and other pin-down
  aliases: [pin down, wide pin-down, corner pin, other_pin_down, wide_pin_down]
  research_ids: [SCR-O02]
  actors: {screener: s, user: u, defender: D_u}
