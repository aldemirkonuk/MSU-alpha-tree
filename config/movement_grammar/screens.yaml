- id: dho_pitch_disambiguation
  level: rule
  name: Dribble handoff vs short pitch vs ball screen
  aliases: [pitch vs DHO]
  research_ids: [check missing pitch]
  actors: {hander: a, receiver: b}
  t0: t_ex
  rule: |
    For a possession change a -> b (cleaned holder runs). Air time and travel come from the raw ball track (loop 1, SCR-T15) - release = last frame of a's segment whose 5-frame median d(raw ball, a) <= hand_r_m, catch = first later frame within hand_r_m of b (fallback - the holder-segment gap); the exchange frame is min(raw catch, start of b's holder segment). DHO when dist(a, b) <= 1.0 m and air time <= 0.3 s (dho); PITCH when it is not a DHO and air time <= pitch_max_air_s
    and ball travel <= pitch_max_travel_m; otherwise PASS. A ball screen needs no possession change (holder = u throughout [t_s - 0.15, t_s + 0.15]); a hander who keeps the ball is
    a fake DHO / keep. CTG names this pitch/DHO/screen confusion as its main error source.
  params:
