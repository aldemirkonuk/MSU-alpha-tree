- id: flare_screen
  level: action
  name: Flare screen
  aliases: [flare, fade screen, pinch fade]
  research_ids: [SCR-O03]
  actors: {screener: s, user: u, defender: D_u}
  t0: t_s
  rule: Off-ball screen (passed and close) where angle(d_u, u->ball) >= flare_deg with |d_u| >= disp_m over [t_s - 0.3, t_s + 1.2], the user ends at r >= end_r_m or |x| grows by >= dx_m, and n . unit(ball - P_s) >= n_ball_min (D_u not on the far side of the screener from the ball) and n_r > n_r_min (not a down-screen orientation; loop 1, SCR-T05). A user who fades straight away from the screener counts as passed (screen_frame away use). Needs the ball tracked. Ghost flare (no SET) is not detected in 0.1.0.
  params:
    flare_deg: {value: 100.0, unit: deg, note: 'loop 1 SCR-T05: was 120; a slot-to-corner flare with the ball on the opposite wing makes about 116 deg to u->ball'}
    disp_m: {value: 2.0, unit: m}
    end_r_m: {value: 6.6, unit: m}
    dx_m: {value: 1.5, unit: m}
    n_ball_min: {value: 0.0, unit: cosine, note: 'SCR-T05: n . unit(ball - P_s) >= this (n = unit(D_u - s): D_u is not on the far side of the screener from the ball, so the screener blocks his chase of the fading user; a pin-down fade has n toward the rim). Loop 2: was 0.5; n is averaged over the stand while D_u still moves, so a true 0.69 reads 0.11-0.57 and 0.5 dropped most real flares'}
    n_r_min: {value: -0.5, unit: cosine, note: 'loop 1 SCR-T05: n_r > n_r_min (not a down-screen orientation); V0 flares have n_r -0.2..0.0, users popping off a double to the weak-side wing -0.97'}
  min_duration_s: 0.3
  outputs: [geometry = flare, user end spot]
  confidence: {level: medium, p_terms: [screen p terms]}
  noise: Ball position errors flip u->ball; the ball must be tracked in the window.
  conflicts_resolved:
  - offense section 0.2 / F8.1 angle > 120 deg kept
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/off-ball-screens', supports: flare screen}
  status: canonical
  detector: detect_flare_screen
