family: screens
version: 0.6.1
date: '2026-10-25'
owner: Mac session
status: proposal under the build freeze (items marked canonical are the family's canonical definitions; every numeric value is an engineering proposal until fitted on MSU film)
scope: one canonical screen detector with strict and loose outputs (R-ST-17), the screen moment, ball screens, off-ball screens, handoffs, screen angle, and defender response as attributes
frame: attacked-rim frame of config/named_spots.yaml 0.3.2 (metres, rim at the origin, y toward half court); 29.97 fps, DT = 1001/30000 s; elapsed time = (n_frames - 1) * DT
implementation: tools/specgen/movement/detectors/screens.py (reads every param below at import; this file is the single source of truth)
tests: tests/movement/test_screens.py (V0 synthetic scenarios from tools/specgen/movement/sim.py, sigma_p 0.3 m, fixed seeds)
conventions:
  kinematics: every speed, heading, acceleration and stand test comes from mvlib (CA-RTS smoothing per MP-04, validity gates per MP-07). Never raw per-frame differences.
  stand: per-frame stand = mvlib stationary_s2 < 5.99 (chi-square 2 dof, 95 %), not raw speed < 0.3, because CA-RTS speed is biased upward at rest (Rayleigh floor).
  direction_change: 'pre/post mean velocities skip the plant phase (MP-13): pre = [t-0.6, t-0.1] s, post = [t+0.1, t+0.6] s unless an item says otherwise.'
  confidence: every Event.conf = mvlib.window_conf(p, start, end) x min over actors of edge_factor(t0) x min over actors of gap_factor(start, end) (MP-16), where p is the per-frame product of the item's p_terms; events with conf below emit_min_conf are not emitted.
  probabilities: distance gates use p_below/p_above with mvlib.sigma_dist x screen_noise_calibration.dist_sigma_scale; speed gates on a window use the Rice posterior P(true |v| < thr | v_hat, sigma_win) (2-D Gaussian error, flat prior), not Phi on the magnitude (fixes check SCR-R01-b).
  spots: every location label is a named_spots id evaluated with spotlib (never redefined here); band gates written as r/m numbers are movement gates taken from the cited rows, not spots.
  symbols: s = screener, u = user (h = handler for on-ball), D_u = user's defender (D_h for on-ball), D_s = screener's defender, b = ball; t_s = screen moment; P_s = screen point (screen_frame); r = hypot(x, y); m = degrees(atan2(y, |x|)); v_r > 0 = toward the rim (mvlib).
  benchmarks: 'Keshri et al. (NESSIS 2017) ball-screen HMM: accuracy 0.868; the check re-read Table 3 as precision 0.94 / recall 0.77 (the research had them transposed). McQueen et al. recall 0.82 / precision 0.80 is research-reported via the hex-map DHO paper. CourtMotion (arXiv 2512.01478) AP 0.82-0.85 is a pick-prediction score against its own heuristic labels, not a detection bar, and is cited only for the side-crossing definition.'
  acceptance: R-ST-02 proposal, STRICT precision >= 0.90 and recall >= 0.85 on gold (>= 50 labelled screens per class, >= 5 games, R-ST-10).
fixed_check_errors:
- 'SCR-R01/R02-a (high): stationarity is no longer v_thr + sigma_v. The loose/strict flags threshold the LS estimate itself (|v_LS| <= v_thr), only when testable (v_thr / sigma_win >= testable_ratio), else NULL; the moving-screen hint fires only on the lower bound P(|v| > 0.6) >= 0.9, so the two bands cannot overlap.'
- 'SCR-R01-b (high): p_stat is the Rice posterior P(|v| < thr), not Phi((thr - |v|)/sigma).'
- 'SCR-R01-c (medium): sigma_win is the empirical window-velocity sigma of the actual smoother: K_CAL * sqrt(mean var_v) * sqrt(Nc / (Nc + N)), Nc = 27 frames fitted on V0 noise (white + AR(1) 0.9); refit on film (screen_noise_calibration).'
- 'SCR-R01-d (medium): one minimum LS window (15 frames); the stop ends on the s2 stay test (99.9 %) or a displacement > max(1.0 m, 3 sigma) from the stop anchor; roll and slip detectors measure displacement explicitly.'
- 'SCR-R00/P02-between (high): between() replaced by a path-blocking test (screener within 0.8 m of D_u''s straight route to u(t + 0.5 s)) OR contact_likely, plus the user passing the screen line.'
- 'SCR-R00/R03-circular (medium): D_u is frozen at the SET stop onset a - 1.0 s, then t_s is computed.'
- 'SCR-P02-gate (medium): the 1.2 m user gate uses the median of 3 frames around the closest approach, not the window minimum (5 frames inflate a sharp V at 5 m/s).'
- 'SCR-P01-contact-gap (medium): contact classes are contiguous (likely <= 0.80, possible <= 1.20, unlikely <= 1.50, none > 1.50); TOUCH duration is pose-only.'
- 'SCR-P03-deflect (medium): DEFLECT needs pre speed >= 2.5 m/s and a change >= max(30 deg, 2.5 sigma_heading); SEP_GAIN is a residual against the user''s own acceleration.'
- 'SCR-R02-keshri, SCR-R00-courtmotion, SCR-R03-ctg (medium/low): benchmarks and citations corrected (see conventions.benchmarks and screen_moment).'
- 'SCR-D01-bands (medium): deep_drop_high band added (depth >= 3.5, r > 5.5), precedence blitz > contain > hedge > at_level > high_drop > deep_drop > deep_drop_high, CTG mapping table added.'
- 'SCR-A01-location (low): location comes only from the named_spots pnr_location partition (first match in that layer); handlers outside it get location none plus court_region.'
- 'SCR-O07/R04-y (low): cross gates use y < 2.5 in both places.'
- 'SCR-R05-hyst (low): re-screen split hysteresis is 0.4 m (about 2 sigma_d of smoothed pairs) with a 3-frame dwell.'
- 'SCR-A05-slip (low): slip speed is tested as displacement (delta r <= -1.0 m within 0.5 s = 15 frames), not a 9-frame v_r.'
- 'unverified-citations (medium): coachhoops, coachesclipboard and UMich pages were not opened by the research and are not cited; hex-map DHO numbers are marked research-reported.'
changes_loop1:
- id: SCR-T01-crash-screener_far
  severity: critical
  what: '_coverage_on: coverage_coarse = min over the candidates that are in the precedence order, else none (''screener_far'' has no coarse class).'
  why: order.index('screener_far') raised ValueError whenever a switch was detected with the screener > 1.5 m from the handler and killed detect_all.
  evidence: slot_switch seed 7 crashed at sigma_p 0.2/0.3/0.5 (4 crashes in the tester sweep); 0 crashes in 5250 runs after. Test test_t01_switch_with_far_screener_does_not_crash.
- id: SCR-T02-ice-unreachable
  severity: high
  what: detect_ball_screen_coverage iterates on-ball rows that are screens OR read reject (p = p_set for rejects).
  why: 'ICE requires read = reject, which requires d_su_ca > 1.2 m, while is_screen requires <= 1.2 m: the ice branch, ice_s and ice_lateral_m were dead.'
  evidence: 'wing_reject_ice: route ice on 4 of 5 seeds at sigma_p 0.3 (0 of 10 before). Test test_t02_ice_is_reachable_on_a_rejected_ball_screen.'
- id: SCR-T03-closest-approach-not-motion-gated
  severity: high
  what: '_build: t_c = argmin d_su over frames where the user moves (displacement speed >= tsu_min_speed_mps), the screener stands (t >= a) and the user is not inside / within screen.user_arrive_s
    before a stand of his own; plain argmin only when no frame qualifies. step_up_screen: the n_y > 0.3 gate became the attribute n_y_setup.'
  why: The stationary set-up next to a standing handler was taken as the closest approach (user speed ~0.2 m/s), so step-ups and tight screens failed and rejects read unused. user_arrive_s
    was added in this loop because the motion gate alone let two screeners arriving side by side read as a screen (side-by-side FPs rose 20 -> 29 at sigma_p 0.3). The n_y gate held only
    for wing step-ups; at the slot D_h is beside the screener and n_y at d_sD ~0.9 m is noise (-0.81..0.0 over seeds); 'from below' is already below_m + approach_vy_mps.
  evidence: 'tester scenes (scratchpad test_screens/scenes.py, 175 scenes incl. mirrored/shifted author scenes), seeds 1-10, sigma_p 0.2/0.3/0.5; P/R before -> after: step_up_screen
    R .47/.35/.15 -> .95/.80/.38 (P 1.0 -> .97/.97/1.0); side_ball_screen R .81/.71/.34 -> .96/.90/.55; ball_screen R .92/.85/.54 -> .99/.93/.60; screen P .95/.93/.89 -> .97/.97/.94
    and R .95/.91/.79 -> .99/.95/.86; wing_reject_ice reads reject 4 of 5. Tests test_t03_*.'
- id: SCR-T04-matchup-reassigned-after-first-screen
  severity: high
  what: '_records: a stop that follows an earlier SET row of the same screener within screen_window.window_s reuses that row''s freeze frame (unless the first screen was switched or
    the ball changed hands); the cost of (D, s) also drops frames where s stood screening D in earlier rows (_matchup_excl).'
  why: The 2 s matchup window of the second screen covered the first, where D_h stood next to the screener, so P(D_h guards s) ~0.5 >= own_man_p and the used second screen was dropped.
    The tester's exclusion alone was not enough (the screener also passes within ~1 m of D_h while stepping off), so its alternative (reuse the first row's freeze) was added too.
  evidence: 'rescreen_same_side: the second screen row now exists on 4 of 5 seeds (screen, ball_screen recovered). re_screen itself stays ~0.5 recall on that scene because its two t_s
    are 3.3-3.5 s apart, outside the canonical CTG 3 s screen_window (not changed). Test test_t04_rescreen_after_an_unused_first_screen_is_kept.'
- id: SCR-T05-flare-never-fires
  severity: high
  what: flare_deg 120 -> 100 (flare_screen and screen_angle); off-ball 'away use' in screen_frame (away_use_deg 60, away_speed_s 0.5); _is_flare requires n . unit(ball - P_s) >= n_ball_min
    0.5 and n_r > n_r_min -0.5.
  why: A slot-to-corner flare makes ~116 deg to u->ball; a fading user never crosses the screen line, so geometry flare came with read unused. n_ball (tester) removes pin-down fades;
    n_r (added here) removes users popping off a double to the weak-side wing, which the 100 deg threshold let in.
  evidence: 'Author flare scene 7 of 7 seeds; new flare_away scene (ball - D_u - s - u) 6 of 7 with read use on 4 of 7 via the away use. On the tester scenes flare FPs 7/9/20 -> 0/0/13 (sigma_p 0.2/0.3/0.5). The tester''s right_flare stays at 0 recall by
    design: it puts the screener on the ball side of D_u (n . ball = -0.7), where he does not block D_u''s chase to the corner; the tester''s own formula (n . ball >= 0.5) is kept because
    it matches the author scene and excludes pin-down fades. Tests test_t05_flare_away_use, test_positive[flare_screen-flare].'
- id: SCR-T06-role-reversal-false-sets
  severity: high
  what: 'screen_set: D within set_def_radius_m on >= def_contact_frames (5) frames of the stand itself (was: anywhere in the padded window); role-reversal veto (role_reversal_s 1.0:
    u starts a stand without the ball next to D_s within 1 s after t_s); screen_the_screener needs a used second screen by a third player.'
  why: 'Runners into a double/stagger/elevator and cutters stopping past a defender produced ''u screens s'' rows (46 % of screen_set FPs). The holder exception was added here because
    the veto first killed switched PnRs (the handler stops next to D_s after a switch: slot_switch screen 0 of 5).'
  evidence: 'tester scenes (scratchpad test_screens/scenes.py, 175 scenes incl. mirrored/shifted author scenes), seeds 1-10, sigma_p 0.2/0.3/0.5; P/R before -> after: screen_set P .71/.68/.65
    -> .86/.83/.72 (R unchanged .99-1.0 at 0.2/0.3); screen_read P .73/.69/.68 -> .88/.84/.75; screen_interaction FPs 28/30/37 -> 16/15/20; screen_the_screener P .38/.39/.38 -> .95/.91/.81.
    Tests test_t06_*.'
- id: SCR-T07-offball-coverage-on-unused
  severity: medium
  what: detect_off_ball_screen_coverage emits unused/rejected rows only when the coverage is top_lock, switch or pre_switch.
  why: Every unused SET (stacks, teammates who never came) got a coverage row with coverage none.
  evidence: 'tester scenes (scratchpad test_screens/scenes.py, 175 scenes incl. mirrored/shifted author scenes), seeds 1-10, sigma_p 0.2/0.3/0.5; P/R before -> after: off_ball_screen_coverage
    P .27/.26/.26 -> .68/.67/.53 (FP 688/745/750 -> 123/127/217), R 1.0/1.0/1.0 -> 1.0/.98/.96. Test test_t07_offball_coverage_rows_only_for_screens_or_real_coverage.'
- id: SCR-T08-drag-height-and-phase
  severity: high
  what: drag_screen.ps_r_hi_m 7.5 -> 9.5; new trail_start_y_m 10.0 (screener y at a - trail_s); phase_checked stays false.
  why: A drag set 8.3 m from the rim was never found; a half-court screener running down from the top was labelled drag.
  evidence: 'tester scenes (scratchpad test_screens/scenes.py, 175 scenes incl. mirrored/shifted author scenes), seeds 1-10, sigma_p 0.2/0.3/0.5; P/R before -> after: drag_screen P .58/.61/.60
    -> 1.0/1.0/1.0, R .95/.70/.30 -> .95/.85/.50; double_drag R .45/.40/.10 -> .85/.85/.30. Test test_t08_drag_height_and_trailer_origin.'
- id: SCR-T09-flip-runthrough
  severity: medium
  what: 'flip_screen: the first side needs a show of >= show_frames (6) consecutive frames with |offset| >= min_offset_m, d(s, h) <= max_sh_m and screener speed < show_speed_mps (3.0).'
  why: A screener running past the handler's middle side on the way to his set was called a flip. The tester's 9 frames at 2.0 m/s dropped flip recall 0.95 -> 0.30 (CA-RTS speed is biased
    up near a plant); measured runs below 3.0 m/s are 9-28 frames on real flips and 0 on run-throughs.
  evidence: 'tester scenes (scratchpad test_screens/scenes.py, 175 scenes incl. mirrored/shifted author scenes), seeds 1-10, sigma_p 0.2/0.3/0.5; P/R before -> after: flip_screen P .70/.76/.64
    -> 1.0/1.0/1.0, R .97/.85/.23 -> 1.0/.82/.20. Test test_t09_runthrough_is_not_a_flip.'
- id: SCR-T10-veer-same-stop
  severity: medium
  what: 'veer_screen: the off-ball row must come from a new stand (r2.stop.a > r1.stop.b); the 0.6 s lower bound is dt_min_s.'
  why: 'The unused off-ball row created by the same Detroit stand counted as a veer. The tester''s extra ''r2 used or rejected'' was not applied: the author''s veer scenario (and the
    YAML rule, ''any user'') has an unused second screen.'
  evidence: 'tester scenes (scratchpad test_screens/scenes.py, 175 scenes incl. mirrored/shifted author scenes), seeds 1-10, sigma_p 0.2/0.3/0.5; P/R before -> after: veer_screen P .43/.55/.62
    -> 1.0/1.0/1.0, R 1.0/.85/.40 -> 1.0/.85/.30. Test test_t10_veer_needs_a_new_stand.'
- id: SCR-T11-approach-after-set
  severity: medium
  what: '_approaches skips t when s ended a >= strict_dwell_s stand within after_stop_s (1.5) or had a screen row for h within after_screen_s (2.0); ghost: r rises by >= ghost_dr_m 0.8
    within rise_window_s 1.5 (was 1.0 m within 1.0 s).'
  why: 'Post-screen rolls and pops were re-read as slip/fake approaches. The tester''s ghost test (mean v_r <= -1.0 m/s over 0.5 s) failed on the tester''s own slot_ghost (-0.3 to -0.9:
    the screener plants at the approach in V0), so the rise test was re-fitted instead: ghosts rise 0.95-2.5 m in 1.5 s, fake-lateral exits <= 0.66 m. The fake ''lateral'' pop_arc exclusion
    was not applied: it would drop the author''s fake_lateral (exit at r 6.9, inside pop_arc_zone), and ghosts are now caught first.'
  evidence: 'tester scenes (scratchpad test_screens/scenes.py, 175 scenes incl. mirrored/shifted author scenes), seeds 1-10, sigma_p 0.2/0.3/0.5; P/R before -> after: slip_screen P .58/.62/.42
    -> 1.0/1.0/.79; fake_screen P .44/.45/.29 -> .94/.91/.82; ghost_screen R .65/.53/.30 -> .95/.78/.38. Test test_t11_no_approach_right_after_a_screen_and_ghost_rise.'
- id: SCR-T12-fake-dho-gate-mismatch
  severity: medium
  what: 'fake candidates: d <= approach_m (the code added 0.3 m); receiver_close_mps 0.5 (b comes to the ball); after_screen_s 1.5 (no candidate right after a used ball screen for a).'
  why: Code and YAML disagreed; a driver passing a static spot-up and a handler attacking a second big became fake DHOs / keeps.
  evidence: 'tester scenes (scratchpad test_screens/scenes.py, 175 scenes incl. mirrored/shifted author scenes), seeds 1-10, sigma_p 0.2/0.3/0.5; P/R before -> after: dho_keep P .59/.56/.50
    -> 1.0/1.0/1.0; fake_dho P .89/.85/.77 -> 1.0/1.0/.89 (R .88 -> .82 at 0.3). Test test_t12_driver_past_a_static_spot_up_is_not_a_fake_handoff.'
- id: SCR-T13-holder-noise-fake-dho
  severity: medium
  what: holder switch margin = max(0.15, holder_margin_k 1.5 x K_CAL x sqrt(var_p_a + var_p_b)); holder_min_run_frames 9 -> 12; DHO needs hander_hold_s and receiver_hold_s 0.5; the exchange
    frame is min(raw-ball catch, holder segment start).
  why: At sigma_p 0.5 the holder flipped between handler and screener and made spurious DHOs and handoff chains. 15 frames (tester) fragmented real possessions at sigma_p 0.5 (ucla .62
    -> .50, shuffle .57 -> .42, slip .80 -> .65 recall vs 9 frames); 12 keeps the DHO precision. Anchoring the exchange on the raw-ball catch recovers DHOs whose receiver segment started
    late.
  evidence: 'tester scenes (scratchpad test_screens/scenes.py, 175 scenes incl. mirrored/shifted author scenes), seeds 1-10, sigma_p 0.2/0.3/0.5; P/R before -> after: dho P .97/.82/.34
    -> 1.0/.95/.67 (R .68 -> .60 at 0.5); handoff_chain P 1.0/.79/.21 -> 1.0/1.0/.60. Test test_t13_t22_holder_does_not_flip_on_ball_screens_at_high_noise.'
- id: SCR-T14-blind-hint-noise
  severity: medium
  what: blind_deg 90 -> 120 and blind_p_min 0.8 on p_above(facing angle, blind_deg, sigma_angle), sigma_angle = degrees(sigma_d / d) x sqrt 2. Author back_blind scene moved squarely
    behind D_u (it sat at 122 deg) and its rate test relaxed 8/10 -> 6/10.
  why: Any screener slightly behind the shoulder line of a stationary defender counted as blind.
  evidence: 'tester scenes (scratchpad test_screens/scenes.py, 175 scenes incl. mirrored/shifted author scenes), seeds 1-10, sigma_p 0.2/0.3/0.5; P/R before -> after: FP 176/177/143
    -> 45/36/33. Precision stays ~0.08 on the tester''s labels and recall fell .85/.75/.50 -> 0/.15/.10, because the tester''s only positive (blind_back_left, 122 deg) sits at its own
    new 120 deg limit; a grid over 90-120 deg x p 0.5-0.8 never beat precision 0.12, since the remaining ''FPs'' are screeners squarely behind a stationary defender within 0.8 m (157-175
    deg), which Rule 4-35.3 does call blind. Test test_t14_side_behind_ball_screen_is_not_blind, test_blind_hint_detection_rate.'
- id: SCR-T15-transfer-air-travel-biased
  severity: medium
  what: _transfers measures release / catch on the raw ball track (hand_r_m 0.6, 5-frame median) instead of the holder-segment gap.
  why: HOLD_R 1.0 m absorbed ~2 m of flight; a 2.8 m / 0.5 s pitch measured 1.1-1.6 m / 0.13-0.23 s.
  evidence: 'pitch scene (tester pitch_not_dho) at sigma_p 0.3, seeds 1-5: air 0.23-0.43 s, travel 1.4-2.4 m, type pitch 5 of 5. Residual bias ~2 x hand_r_m remains (documented, not
    corrected). Test test_t15_pitch_air_time_from_the_raw_ball.'
- id: SCR-T16-out-double-labels-down
  severity: medium
  what: off_ball_screen_other OUT requires not _is_down(r).
  why: An elbow down screen was also emitted as an out screen.
  evidence: 'tester scenes (scratchpad test_screens/scenes.py, 175 scenes incl. mirrored/shifted author scenes), seeds 1-10, sigma_p 0.2/0.3/0.5; P/R before -> after: off_ball_screen_other
    P .50/.47/.38 -> 1.0/.91/.62. Test test_t16_elbow_down_screen_is_not_out.'
- id: SCR-T17-location-at-ts
  severity: low
  what: _location reads pnr_location at the handler's set-up frame (_t_dir), like direction.
  why: At t_s the handler is already turning the corner; slot screens were labelled high.
  evidence: 'slot_pnr_middle: location slot 5 of 5. Test test_t17_slot_location_read_at_the_set_up.'
- id: SCR-T18-brittle-spot-gates
  severity: low
  what: zipper start in low_post/block/mid_post (start_r_max_m removed); flex screener in low_post/mid_post/block; pin_down geometry no longer splits into other_pin_down (attribute high_screen_point);
    stagger accepts later screens with is_screen and passed.
  why: '0.1-0.3 m margins: a 0.3 m shift of the author scenes cut zipper and flex recall; pin_down flipped at m = 40 deg; the second stagger screen with a trailing defender failed the
    blocking term.'
  evidence: 'tester scenes (scratchpad test_screens/scenes.py, 175 scenes incl. mirrored/shifted author scenes), seeds 1-10, sigma_p 0.2/0.3/0.5; P/R before -> after: zipper R .80/.80/.70
    -> 1.0/1.0/.85; flex .55/.65/.60 -> 1.0/.95/.80; stagger .88/.72/.62 -> .97/.93/.75; pin_down strict R .72/.70/.70 -> 1.0/.93/.78. Tests test_t18_*.'
- id: SCR-T19-yaml-params-unused
  severity: low
  what: 'flex window_s and screen_moment.pad_s are read; constants promoted to params: veer dt_min_s, hammer user_r_min_m/user_m_lo/user_m_hi, wedge n_r_min, iverson curl_r_m/loose_band_*,
    post-action roll_vr_window_s/roll_ctg_r_m/stand_frames/pop_arc_r_m, coverage near_h_m/blitz_window_s/contain_speed_mps/screener_far_m/deep_drop_high_m, double_ball_screen sink_r_m/trade_r_m,
    fake_dho backdoor_r_m/backdoor_dr_m/between_m, handoff_chain handback_*/weave_*, blind mutual_m, ghost arc_r_m.'
  why: The module claims the YAML is the single source of truth.
  evidence: Every YAML param name is referenced in screens.py except the three calibration/acceptance values marked 'not read by the detectors'. Test test_t19_every_yaml_param_is_read_by_the_detectors.
- id: SCR-T20-moving-hint-arrivals
  severity: low
  what: moving_screen_hint also needs D's mean speed >= def_speed_mps (1.0) and D's velocity toward s >= def_closing_mps (0.5) over [t_c - along_pre_s, t_c - along_post_s].
  why: 'Trailers decelerating into a set next to an arriving defender fired. The tester''s second change (p_moving on the window ending at t_c - 0.1) was not applied: that window sees
    more of the approach and raises p_moving for exactly these decelerating arrivals.'
  evidence: 'tester scenes (scratchpad test_screens/scenes.py, 175 scenes incl. mirrored/shifted author scenes), seeds 1-10, sigma_p 0.2/0.3/0.5; P/R before -> after: moving_screen_hint
    P .58/.45/.19 -> .97/.76/.40, R unchanged .95/.85/.35. Test test_t20_moving_hint_needs_the_defender_moving_into_the_path.'
- id: SCR-T21-env-numpy
  severity: low
  what: rice_below uses _trapz = np.trapezoid or np.trapz.
  why: numpy 1.26 has no np.trapezoid. pyproject.toml was not edited (outside this family's files); numpy should be declared there by the owner.
  evidence: Test test_t21_rice_integration_has_a_numpy_1_fallback.
- id: SCR-T22-untested-branches
  severity: low
  what: handback needs raw-ball air >= handback_min_air_s (0.2) on both legs.
  why: 'Holder flicker made spurious handbacks in Detroit sets at sigma_p 0.5. The other untested branches (zoom, miami, weave, double_high trade/sink, pin_in, baseline_exit, boundary_parallel,
    snake/split/retreat) still have no scenario: left open for loop 2.'
  evidence: 'detroit / high_pnr at sigma_p 0.5: no handoff_chain or dho on seeds 1-5. Test test_t13_t22_holder_does_not_flip_on_ball_screens_at_high_noise.'
changes_loop2:
- id: REG-fake_dho-receiver-gate
  severity: medium
  what: 'fake_dho receiver_close_mps (0.5) is tested on the peak receiver_mean_frames (5) running mean of b velocity toward a over [t_c - receiver_window_s (1.2), t_c - 0.1], not on the mean over [t_c - 0.6, t_c - 0.1].'
  why: 'Loop-1 regression: a backdoor receiver comes up and plants just before the fake, so the 0.5 s mean read 0.05-0.29 m/s and the candidate was dropped (fake_dho_backdoor__M 10 -> 7 at sigma_p 0.2). The confirmer proposed 0.2 m/s; the peak window keeps the 0.5 m/s meaning (b came to the ball) and scored better.'
  evidence: 'Tester sweep (175 scenes x 10 seeds x sigma_p 0.2/0.3/0.5, both harnesses give identical results): fake_dho R .93/.82/.20 -> 1.00/.90/.20, P 1.0/1.0/.89 unchanged; dho_keep R .90 -> .93 at 0.2. On the 27 handoff scenes 0.2 m/s gave 39/36/8 hits, the peak window 40/36/8, both with no new FP. Test test_l2_fake_dho_receiver_who_plants_before_the_fake (mirrored backdoor 7 -> 10 of 10 at 0.2); test_t12 still passes.'
- id: REG-location-logo-flip
  severity: medium
  what: 'ball_screen location: when the set-up label is pnr_location_logo but the screen point P_s is not at logo depth, the P_s label is used (side and direction still from the set-up).'
  why: 'Loop-1 regression (SCR-T17): a handler waiting at r 8.8-9.4 m for a screen set at r 7.2-7.8 m was labelled logo, so high_ball_screen was not emitted.'
  evidence: 'high_ball_screen R .98/.93/.45 -> 1.00/.95/.57 (P 1.0/1.0/.93 -> 1.0/1.0/.94); ball_screen strict hits 314/285/152 -> 315/286/159. Scene high_wait_deep (handler at r 9.4 m) high_ball_screen 0/2/0 -> 10/9/7 of 10. Test test_l2_ball_screen_depth_comes_from_the_screen; test_t17 (slot) still passes.'
- id: SCR-T05-flare-n_ball
  severity: high
  what: 'flare_screen n_ball_min 0.5 -> 0.0 (D_u not on the far side of the screener from the ball); n_r > n_r_min and the 100 deg test still exclude pin-down fades.'
  why: 'n is averaged over the stand while D_u is still moving, so a correctly oriented flare (true n_ball 0.69) read 0.11-0.57 and 0.5 removed most real flares (confirmer). The tester''s right_flare scene stays invalid as a positive (screener on the wrong side of D_u; author and confirmer agree), so harness flare recall stays near 0 by design.'
  evidence: 'Corrected flare (D_u ball-side of s, scratch supplement + its mirror, 20 runs per sigma): 10/10/9 -> 19/19/16 hits. Full sweep with 0.0: flare FPs unchanged 0/0/13, no other detector changed. Variants 0.2 and -0.3 on all scenes: 0.2 recovers fewer flares (19/16/14), -0.3 adds pin-down FPs. Test test_l2_flare_with_the_defender_on_the_ball_side (corr_flare 3 -> 9 of 10 at 0.3; pin_down and iverson stay silent).'
- id: SCR-T04-re_screen-window
  severity: medium
  what: 'screen_window.rescreen_gap_s 1.5 s: a later row of the same (s, u) whose stand starts within 1.5 s after the earlier stand ends is linked as a split re-screen even when the t_s gap exceeds window_s (never merged). A later used row from a new stand after an unused / rejected first row is split, not merged (the merge hid the used screen).'
  why: 'rescreen_same_side has t_s 3.3-3.5 s apart (> window_s 3 s), so rescreen_of was never set; once the loop-2 off-ball vetoes removed a spurious earlier row, a used second screen 2.6 s after an unused one was merged and dropped from screen.'
  evidence: 're_screen R .47/.55/.38 -> .95/.85/.45, P 1.0/1.0/.94 -> 1.0/1.0/.95; the split rule alone added 4/1 screen, 4/2 ball_screen and 4/2 ball_screen_coverage hits at sigma_p 0.3/0.5 with no FP. Test test_l2_rescreen_linked_beyond_the_window_by_the_stand_gap (re_screen 2 -> 7 of 10 at 0.3).'
- id: SCR-T06-role-reversal-residual
  severity: medium
  what: 'screen_set off-ball vetoes: (a) s holds the ball on >= holder_veto_frames of t_s +- holder_veto_s; (b) u stands through it (a stop covers t_s +- still_cover_s and peak 5-frame median speed over [t_s - still_pre_s, t_s + still_post_s] < still_user_mps); (c) u, without passing the screener, settles into a stand starting within still_cover_s of t_s and never moves again in the window. screen_read reject also needs that peak speed >= still_user_mps. veer_screen keeps reading the rows vetoed by (b)/(c).'
  why: 'NEG_cutter_brush, NEG_back_short_cut (+__M) and NEG_A_double_drag_late__M gave screen_set / screen_read / off_ball_screen_coverage FPs on 27-30 of 30 runs (a cutter stopping next to a standing teammate''s defender, the ball holder as an off-ball screener); in double_side_by_side the second screener screened the first while both arrived.'
  evidence: 'screen_set P .86/.83/.72 -> .98/.90/.80; screen_read P .88/.84/.75 -> .97/.90/.82; off_ball_screen_coverage P .68/.67/.53 -> .88/.78/.58; screen P .97/.97/.94 -> .99/.98/.94; screen_interaction FPs 16/15/20 -> 3/5/20; no hit lost on any detector. Without the veer carve-out veer R fell 1.0/.85/.30 -> 0/.10/.10 (the veer leg is a stand for a standing corner player); still_pre_s 1.0 -> 0.3 removed 16 more FPs with no hit lost; branch (c) without the passed condition cost 3 stagger hits (users stopping right after the last screener), with it none. Tests test_l2_no_off_ball_set_for_a_standing_user_or_by_the_ball_holder, test_l2_veer_keeps_its_stand_for_a_standing_teammate, test_l2_a_reject_is_a_move, test_l2_screeners_arriving_side_by_side_are_no_screen_for_each_other.'
- id: back_screen-on-flex
  severity: low
  what: back_screen returns nothing when the row is a flex cut (flex_screen takes precedence for baseline screens).
  why: back_screen fired on 25-28 of 30 flex runs (A_flex__M, NEG_A_flex_from_wing__M, A_flex__S).
  evidence: 'back_screen P .60/.63/.65 -> .78/.77/.78, R 1.0/.93/.90 unchanged; flex scene back_screen 10/9/3 -> 0/0/0 of 10. Test test_l2_flex_cut_is_not_a_back_screen.'
- id: SCR-T22-untested-branches
  severity: low
  what: 'Positive and near-miss scenes for handoff_chain weave (two perimeter DHOs; near miss: the second exchange is a pass) and miami (DHO, then the hander screens for the receiver; near miss: a pass instead of the DHO).'
  why: The weave and miami branches were never exercised.
  evidence: 'weave 4 of 5, miami 3 of 5 at sigma_p 0.3; near misses 0. Test test_l2_handoff_chain_weave_and_miami. Still without a scene: zoom, handback positive, double_high trade/sink, pin_in, baseline_exit, boundary_parallel. numpy is still not declared in pyproject.toml (outside this family''s files).'
- id: declined-loop2
  severity: info
  what: 'Not changed: blind_screen_hint thresholds (SCR-T14) and dho.holder_min_run_frames 12 (the loop-1 trade-off behind the ucla / shuffle / dho / veer / flip / spain drops at sigma_p 0.5).'
  why: 'Blind hint: a label dispute, not a detector bug. The remaining FPs are screeners squarely behind a stationary D_h at 0.4-0.8 m (157-179 deg), which Rule 4-35.3 calls blind; the tester''s only positive (blind_back_left) measures 111-121 deg, at the visual-field limit (the confirmer agrees and recommends fixing the labels). Holder runs: the shorter minimum recovers the sigma_p 0.5 recall of ucla / shuffle / veer / flip but loses core screen recall at the same noise tier, so a noise-tier-aware value cannot separate them.'
  evidence: 'Full tester sweeps (loop-2 code before the still_pre_s and settling-veto refinements, which do not touch the holder) with holder_min_run_frames 9: hits -34, FP -42, screen R at 0.5 .86 -> .83 (514 -> 499), dho 36 -> 32; with 10: hits -3, strict +12, FP -23, but screen / screen_set R at 0.5 -8 while ucla +2, shuffle +4. Blind hint P/R unchanged 0/.08/.06 and 0/.15/.10.'
changes_loop4:
- id: SCR-L4-01-stand-variance-floor
  severity: high
  what: 'screen_stationarity: the stand statistic is s2 = |v|^2 / (K_CAL^2 max(var_v, s2_var_v_floor_sigma_mps^2)) with the floor 0.183 m/s (the CA-RTS steady-state velocity sigma at sigma_p 0.2, the lowest production tier), instead of mvlib stationary_s2 with the raw var_v.'
  why: 'Real SportVU (vendor-smoothed, told sigma 0.15) has a tiny var_v, so enter / stay meant |v| < 0.40-0.70 m/s and brief NBA screen plants (smoothed minimum 0.6-0.8 m/s) never formed a stand, while the same plant stands at sigma_p >= 0.2: the stand test was stricter on precise tracks than on video tracks. In an independent geometric ball-screen candidate pass (handler 4-12.5 m from the rim, his nearest defender within 2.5 m, a slow teammate within 1.2 m of that defender), 35 of 166 unmatched candidates had no stand at all (screener minimum speed 0.42-1.49 m/s).'
  evidence: 'Real data, 3 games, 114 tracked min, per 48 both teams (runner, sigma told 0.15): screen 58.4 -> 60.5 and ball_screen 14.7 -> 16.4 with this change alone. Synthetic sweep (175 scenes x 10 seeds x sigma_p 0.2/0.3/0.5): identical to without it on the regressed scenes and no detector changed (the floor is below every production var_v). Synthetic brief plant (screener drifts 0.6 m through the set at 0.67 m/s): stand found on 2 / 5 / 10 of 10 seeds at sigma 0.05 / 0.10 / 0.30 before, 10 / 10 / 10 after. Test test_l4_brief_plant_forms_a_stand_on_precise_tracks.'
- id: SCR-L4-02-on-ball-defender
  severity: high
  what: 'screen_target_defender on-ball override: when d is the defender nearest the ball holder h (h a teammate of s, holding on >= onball_hold_frac of [a - onball_window_s, a]) on >= onball_def_frac of the holder frames, within onball_def_max_m, and nearer h than s on average, P(d guards h) is set to that fraction and the other attackers share the rest in proportion.'
  why: 'The 2 s mean-distance matchup still read the previous man of a defender who had just picked up the ball (switch, transition pick-up, help and recover), so the screen on the handler''s defender became an own-man stop or an off-ball row with the wrong user. In the candidate funnel 40 unmatched candidates were own-man and 33 had another user; 42 of the handler-defender cases did contact the screener with P(guards h) 0.00-0.47.'
  evidence: 'Real data: screen 60.5 -> 67.6 and ball_screen 16.4 -> 18.9 per 48 with SCR-L4-01 in place (unmatched candidates 153 -> 143). Synthetic sweep: spain_pnr / back_screen / screen_the_screener FPs 4 / 32 / 6 -> 0 / 28 / 2 summed over sigma_p, re_screen and ball_screen hits +1 at 0.5, and 16 new double_drag FPs on NEG_A_double_drag_late (fixed by SCR-L4-03). Synthetic switch scene (D_h picks up the handler 1.1 s before the set): ball_screen 0 -> 10 / 10 / 6 of 10 at sigma_p 0.2 / 0.3 / 0.5. Test test_l4_ball_defender_is_the_defender_on_the_ball.'
- id: SCR-L4-03-double-drag-set-before
  severity: medium
  what: 'double_drag.set_before_s 0.5 s: each screener has stood at least 0.5 s (t_s - stand onset) before his screen moment.'
  why: 'Once SCR-L4-02 named D_h correctly, a second trailer still running in when D_h (trailing the handler over the first drag) brushed him became the second screen of a double drag 0.3-0.8 s after the first; a screener who is still arriving is a moving screener, not a set second screen. 0.5 s is the strict dwell of screen_stationarity.'
  evidence: 'NEG_A_double_drag_late__M double_drag FPs 6 (before loop 4) / 22 (with SCR-L4-02) -> 0 of 30; double_drag hits unchanged 17 / 17 / 6 of 20 at sigma_p 0.2 / 0.3 / 0.5. Real data: no double_drag before or after. Test test_l4_double_drag_needs_a_set_second_screener.'
- id: loop4-summary
  severity: info
  what: 'Net effect of SCR-L4-01..03. Real data (3 SportVU games 2015-16, 6855 s tracked; runner, sigma told 0.15, rates per 48 min both teams): screen_set 222.2 -> 229.8, screen 58.4 -> 67.6, ball_screen 14.7 -> 18.9, high / side ball screen 2.9 / 2.9 -> 3.8 / 3.8, off_ball_screen_coverage 84.4 -> 88.6, dho 14.3 unchanged. With added noise 0.3: screen_set 281.1 -> 283.6, screen 60.5 -> 61.3, ball_screen 8.4 -> 8.4. Synthetic sweep (5250 runs): hits 12612 -> 12618, strict 11832 -> 11837, FPs 1139 -> 1122, no detector worse at any sigma_p, 0 crashes.'
  why: 'Reference: Second Spectrum counts just under 70 picks per game per offense in a recent season, no team below 54 (Raptors Republic, https://www.raptorsrepublic.com/?p=133298); 2015-16 used fewer, so 90-140 ball screens per 48 for both teams is the reference band. Synergy-style play-type splits put pick-and-roll ball handler plus roll man at about a quarter of possessions that end in a play type. Ball screens remain 5-7x under the band. play-by-play has no screen labels, so there is no PBP precision / recall for this family.'
  evidence: 'Open (not fixed this loop): (1) on-ball SET rows are about 63 per 48 and only 70 of 150 are used; 45 of the unused fail the d_su_max_m 1.2 m centre gate only or with notpassed (median d_su 1.5 m on unused on-ball rows), a threshold question left for gold labels; (2) 50 of 143 unmatched geometric candidates have no stand (screener minimum speed 0.42-1.49 m/s: rolling / slipping screeners); (3) under added noise 0.3 ball_screen halves (18.9 -> 8.4) and screen_set rises 23 %, so the usage gates lose on-ball screens to noise; (4) off-ball unused rows are 289 of 492 screen_read rows, which inflates screen_set relative to used screens.'
changes_mastery_r1:
- id: SCR-M1-01-possession
  severity: critical
  what: 'New possession (ball_screen_model poss_*): 5-frame median raw-ball distance, radius HOLD_R + poss_k x the clip''s robust ball sigma, sticky owner, None gaps up to poss_bridge_s filled, runs < poss_min_run_frames removed. Used by the on-ball kind, the on-ball defender override and the contact candidates; DHO / pass logic keeps the cleaned holder.'
  why: 'Holder collapse was the main noise failure: on real tracks with sigma_p 0.3 / 0.5 added, cleaned holder coverage fell 0.55 -> 0.42 -> 0.15 and 32 / 49 of the 54 clean ball screens became off-ball rows.'
  evidence: 'Synthetic high PnR at sigma_p 0.5: ball_screen 7 -> 10 of 10, possession covers >= 0.9 of the hold (test_m1_01). Real data (below): ball_screen 22.7 / 10.5 / 2.9 -> 44.5 / 47.5 / 44.1 per 48 at noise 0 / 0.3 / 0.5.'
- id: SCR-M1-02-contact-candidates
  severity: critical
  what: 'Stage 1 adds on-ball contact candidates (_contact_rows): for every possession run of h and teammate s, contact episodes with the ball defender (5-frame median d(s, d) <= contact_on_m + contact_k x sigma_d for >= contact_min_frames), not covered by an on-ball stand row of the pair, s not holding or catching the ball; the episode is a synthetic stop (plant attribute moving / loose, source contact). Kept only when the on-ball decision accepts it, with the stricter moving-screener terms (speed <= moving_screener_max_mps, blocking, interaction or close contact). An off-ball row of the same pair at the same contact is replaced.'
  why: 'Rolling / moving screeners never form a stand (real diagnosis: 352 on-ball candidates with no stand, about 16 real ball screens per 48 there).'
  evidence: 'Synthetic rolling screener (about 1.1 m/s) ball_screen 1 / 3 / 4 -> 7 / 8 / 9 of 10 at sigma_p 0.2 / 0.3 / 0.5, brush screen (about 1.6 m/s) 0 -> 5 / 4 / 8, runner through D_h at 3.5 m/s stays 0 (test_m1_02). Judged real contact rows: the moving-screener terms removed drives with a big alongside and pass-and-cut traffic (10-row inspection: 4 real / 5 ambiguous / 1 not before, 3 real / 2 ambiguous kept after).'
- id: SCR-M1-03-onball-decision
  severity: critical
  what: 'Stage 2 for every on-ball row (_onball_decision): screen = sigma-aware contact on D_h AND d(s, h) <= near_m AND possession of h AND handler peak speed >= 1.0 m/s AND read use / snake / split (or a retreat inside the old gate) AND screener speed at t_s <= screener_max_mps; USE allows a crossing within use_near_m (2.0 m); p = max(p_loose, plant_floor) x p_contact x p_use. On-ball REJECT no longer needs d_su_ca > 1.2 m.'
  why: 'The off-ball 1.2 m centre gate dropped real ball screens where the handler goes wide (4 real, 2 ambiguous of 8 judged not_geo rows); the plant was a gate although moving screens are screens; an ICE handler who brushes the screener and turns away could not be a reject.'
  evidence: 'Synthetic wide PnR (closest approach 1.6 m) 0-1 -> 4-5 of 5 at every sigma_p; wing_reject_ice coverage rows restored (test_m1_03, test_t02).'
- id: SCR-M1-04-unused-row-guards
  severity: high
  what: 'An off-ball row that is not a used screen is kept only when D guards u (mean d(D, u) over [t_s - 1.5, t_s - 0.3] <= offball_du_max_m and the joint assignment or the nearest-defender test gives D to u) and u comes within reject_approach_m of s; an on-ball row that is not a screen only when D is within bd_max_m of the handler over [t_s - 1, t_s].'
  why: 'screen_set was 196 per 48 against about 110 true screens (diagnosis): stands next to help defenders, scrums and pairs with the user 3-5 m away were unused SET rows; under noise they grew to 244 / 264.'
  evidence: 'Real screen_set 196.2 / 244.1 / 263.8 -> 121.4 / 134.9 / 131.5 per 48 (noise 0 / 0.3 / 0.5); in a 10-row inspection of unused off-ball rows before this rule most were stands with the user 2.5-4.6 m away who never came (no screen), the rest ambiguous. Synthetic help-defender stand 1-2 of 5 -> 0 (test_m1_04).'
- id: SCR-M1-05-coincident-tracks
  severity: medium
  what: 'A row is dropped when (s, D), (s, u) or (u, D) stay below coincident_m (5-frame median) for coincident_frames consecutive frames within t_s +- 0.5 s, tested only when the pair distance sigma is <= coincident_sigma_max_m.'
  why: 'Coincident-track pile-ups (0.00-0.04 m) were 3 of 114 judged real candidates. On noisy tracks a real contact at 0.2-0.4 m reads as coincident, so the test is limited to precise tracking.'
  evidence: 'Real clean data, one game: 7 rows caught (pairs at 0.016-0.051 m for 10-24 frames, 5 with the final 8-frame rule). Synthetic merged-identity scene at sigma_p 0.05: screen 10 -> <= 4 of 10; no change at sigma_p >= 0.2 by design (test_m1_05). A first 0.15 m / 9-frame version vetoed V0 flex screens (defenders scripted 0.1-0.15 m from the screener), hence 0.08 m and the sigma gate.'
- id: SCR-M1-06-handoff-rows
  severity: medium
  what: 'An on-ball row is kind handoff when s handed the ball to u within [t_s - handoff_s, t_s + 0.3] at close range: a transfer with d_ab <= handoff_d_m and air <= handoff_air_s, or (noise-robust) a possession change s -> u with the pair within handoff_d_m.'
  why: 'Pitch-typed handoffs (1.2-1.6 m exchanges) were judged ball-screen false positives (2 handoffs among the stand-based rows; 1 more at noise 0.3).'
  evidence: 'Synthetic pitched handoff then stand: ball_screen 1 / 3 -> 0 / <= 1 of 10 at sigma_p 0.3 / 0.5 (test_m1_06); the noise-0.3 judged sample lost its handoff false positive.'
- id: SCR-M1-07-assignment
  severity: medium
  what: 'Joint one-to-one defender assignment (_assignment, minimum summed mean distance) as the own-man veto of the contact path, with the research D_h override (nearest the handler within bd_max_m on >= bd_frac of [t - bd_pre_s, t - bd_post_s]).'
  why: 'The softmax matchup scores each defender alone, so a ball defender sagging into the screener''s approach read as the screener''s own man (judged own_man stratum: 1 real moving, 4 ambiguous of 8).'
  evidence: 'Synthetic sagging D_h: ball_screen 4 / 4 / 0 -> 5 / 5 / 4 of 5 at sigma_p 0.2 / 0.3 / 0.5 (test_m1_07).'
- id: SCR-M1-08-offball-used
  severity: high
  what: 'Off-ball screen rows are used screens: passed (or the away use of a fade) at >= user_speed_off_mps at the closest approach, or the peak within +-offball_use_win_s with an interaction; away use reads the distance gain instead of the angle to u0 - P_s; hammer_screen also reads passed fast SET rows.'
  why: 'Unused off-ball rows labelled screens (geometry only) were post scrums, pairs jogging side by side and slow drifts; the diagnosis estimated off-ball precision at 50-80 %. The angle test of a fade is noise when the user starts within 1 m of the screener (70-84 deg on true 0-deg fades at sigma_p 0.3).'
  evidence: 'Real off-ball screens 39.5 / 46.2 / 50.8 -> 25.6 / 23.9 / 22.3 per 48 (the old rate grew with noise; the new one does not). Synthetic slow drift 1-2 of 5 -> 0; flare_away 8 of 10 at sigma_p 0.3 (test_m1_08).'
- id: SCR-M1-09-fragments-and-rescreens
  severity: medium
  what: 'fragment_gap_s: a used on-ball screen cut in two by noise is one row; a contact candidate within window_s of a row of the pair needs a relocation > split_move_m + hyst_m.'
  why: 'At sigma_p 0.5 the new on-ball decision turned stand fragments into merged re-screens (re_screen false positives 1 -> 7 in the sweep).'
  evidence: 're_screen false positives at sigma_p 0.5 back to 1 (base 1); high PnR at sigma_p 0.5 has no re_screen in 10 seeds; rescreen 6 -> 8 of 10 at 0.5 (test_m1_09).'
- id: SCR-M1-10-offball-rim
  severity: low
  what: 'offball_r_min_m 1.2: no off-ball used screen with the screen point under the rim.'
  why: 'Judged off-ball rows at r_s 0.6-0.9 m were rebound and post scrums.'
  evidence: 'Synthetic cutter under the rim past a teammate at r 0.6 m: screen 10 -> 0 of 10 (test_m1_10).'
- id: mastery-r1-summary
  severity: info
  what: 'Net effect. Real data (3 SportVU games 2015-16, 194 chunks, 6855 s tracked, runner default team_ends, sigma told 0.15, per 48 min both teams, noise 0 / 0.3 / 0.5): ball_screen 22.7 / 10.5 / 2.9 -> 44.5 / 47.5 / 44.1; screen (all kinds) 63.0 / 58.0 / 53.8 -> 73.5 / 75.2 / 71.0; off-ball used screens 39.5 / 46.2 / 50.8 -> 25.6 / 23.9 / 22.3; screen_set 196.2 / 244.1 / 263.8 -> 121.4 / 134.9 / 131.5; screener_post_action 9.2 / 4.6 / 1.3 -> 17.2 / 23.1 / 18.1; ball_screen_coverage 23.9 / 10.1 / 2.5 -> 45.4 / 50.0 / 46.6; high_ball_screen 5.9 -> 13.4, side_ball_screen 4.6 -> 9.2 (clean).'
  why: 'Hand-judged precision (position-only numeric strips, no video; R real, A ambiguous counted 0.5, N not): ball screens clean, 40-event random sample 31 R / 8 A / 1 N = 0.875 (A-bounds 0.78-0.98); noise 0.3, 30-event sample, 29 still emitted after SCR-M1-06: 19 R / 7 A / 3 N = 0.78 (0.66-0.90); off-ball used screens clean, 30-event sample 22 R / 7 A / 1 N = 0.85 (0.73-0.97), the N removed by SCR-M1-10; the 3 rows SCR-M1-08 added later were judged 1 A / 2 N (population estimate about 0.84). On the diagnosis''s judged candidate universe (114 candidates) the stratified estimate of captured true ball screens rose 21.6 -> 46.3 per 48 at precision 0.95 -> 0.80-0.91 (small strata, wide intervals).'
  evidence: 'Defensible band: the diagnosis estimated 71 true ball screens per 48 (95 % 51-96; 47.6 with every ambiguous call counted as not a screen); 44.5 at 0.875 precision is about 39 true per 48 against that lower bound, and the rate holds within 7 % at noise 0.3 and 1 % at 0.5. Synthetic sweep (175 scenes x 10 seeds x sigma_p 0.2 / 0.3 / 0.5, 5250 runs, 0 crashes): hits 12618 -> 13213, strict 11837 -> 12432, false positives 1122 -> 684; ball_screen at sigma_p 0.5 206 -> 302 of 340. Downstream bigs (real, noise 0 / 0.3): roll 13.4 / 13.9 -> 16.4 / 21.0, pop_arc 1.3 / 0.4 -> 3.4 / 4.6, short_roll 3.4 / 1.3 -> 5.9 / 5.5, no errors; composition builds its own proxy screens and is unchanged. Not fixed this round: see open_mastery_r1.'
open_mastery_r1:
- 'Ball-screen recall: the remaining gap to the 71 per 48 estimate sits in strata judged mostly ambiguous from positions (no_stop, own_man); gold labels or video are needed to move further. Screens at the rim (r_s < 3.05 m, CTG 10 ft) stay excluded by design.'
- 'Sweep cells with one fewer hit than base at sigma_p 0.5 only: cross_screen 19 -> 18 of 20, re_screen 18 -> 17 of 40 (strict 14 -> 16), off_ball_screen_coverage 249 -> 247 of 260; false positives up at 0.5: ball_screen_coverage 2 -> 6, ball_screen 0 -> 2, screen_the_screener 2 -> 3. Every cell at sigma_p 0.2 / 0.3 has at least the base hits.'
- 'The coincident-track veto cannot be applied on noisy tracks (sigma_p >= 0.2); artefacts there need the tracker''s own identity-confidence output.'
- 'Unused off-ball SET rows (35 per 48 clean) have no judged precision yet; they are kept as the screen_set layer for coverage and veer_screen.'
changes_mastery_r2:
- id: SCR-M2-02-fast-brush
  severity: low
  what: 'A contact row (no stand) whose screener moves at moving_screener_max_mps .. screener_max_mps (2.0-2.5 m/s) through the contact is kept when the contact is close (<= screen_set.contact_likely_m + contact_k x sigma_d / 2) and the use is close (d_su_ca <= screen.d_su_max_m).'
  why: 'Judged SportVU contact rows rejected only for screener speed 2.0-2.5 m/s: 4 real and 4 ambiguous of 8; with both close terms 4 real and 1 ambiguous. Rows above 2.5 m/s stayed out (11 not screens, 5 ambiguous of 16 judged).'
  evidence: 'Real clean: +4 judged-real ball screens. Synthetic fast_brush (2.2 m/s) 1 -> 5 of 10 at sigma_p 0.2 (test_m2_02); runner_through stays 0.'
- id: SCR-M2-03-handler-travels
  severity: high
  what: 'An on-ball screen needs the handler to get >= use_disp_m from his position at t_s - 0.5 within [t_s - 0.5, t_s + use_disp_post_s] (smoothed positions), except a retreat read.'
  why: 'Confirm r1 CR1-02. In an all-events hand judgment of the 106 r1 clean ball screens (position strips, no video) the not-screens were a handler dribbling in place beside the screener, one who stopped at him, a catch-and-stand after a cut and a handler who handed the ball on: their largest displacement was 1.6-2.2 m; judged real uses 2.8-8 m.'
  evidence: 'Real clean: 4 judged not-screens removed, no judged-real row lost. Synthetic sweep: no ball-screen cell below r1 (test_m2_03).'
- id: SCR-M2-04-reverse-handoff
  severity: medium
  what: 'A row whose handler hands the ball to the screener within [t_s - 0.3, t_s + handoff_rev_post_s] at <= handoff_d_m (transfer or possession change), with the screener keeping it handoff_keep_s and the ball not coming straight back, is dropped (a DHO u -> s).'
  why: 'Judged r1 row: the handler handed the ball to the screener 0.45 s after t_s. Without the keep / flip-back tests the veto removed 34 synthetic ball screens at sigma_p 0.5, where the possession flips to a screener 0.2 m from the handler for a few frames; a wider window removed pocket passes to the roller.'
  evidence: 'Synthetic: high PnR >= 9 of 10 at sigma_p 0.3 / 0.5, reverse_handoff <= 1 (test_m2_04).'
- id: SCR-M2-05-screener-speed
  severity: medium
  what: 'Screener speed of the on-ball decision = median of his 5-frame median speed over t_s +- screener_win_s; for a stand row whose stand overlaps t_s +- contact_win_s, the stand''s window speed.'
  why: 'Confirm r1 CR1-05 (a 0.15 s screener track jump at the contact read 4.5 m/s: 10 -> 0 of 10) and judged J34 (a real screen whose screener planted 0.5 s before the handler''s closest approach and rolled at 2.6 m/s by it).'
  evidence: 'coincident_brief at sigma_p 0.05: 0 -> 10 of 10; plant_then_roll 2 -> 10 of 10; J34 recovered on real data; runners through D_h stay 0 (test_m2_05).'
- id: SCR-M2-06-pass-and-screen
  severity: info
  what: 'Attribute pass_and_screen: the screener passed to the handler (catch in [t_s - pass_screen_s, t_s]) and then screened for him.'
  why: 'Confirm r1 CR1-02 asked for pass-and-follow rows to be typed. Judged r1 rows of this pattern: 12 real, 5 ambiguous, 2 handoffs of 19, so it is an attribute and not a veto; the kind stays on_ball (bigs maps kinds to screen classes).'
  evidence: 'test_m2_06.'
- id: SCR-M2-07-offball-possession
  severity: medium
  what: 'Off-ball used screens need an attacker owning the ball (noise-robust possession) on >= offball_poss_frac of [t_s - offball_poss_pre_s, t_s + offball_poss_post_s].'
  why: 'Confirm r1 CR1-04: box-out and rebound plays emitted off-ball screens (synthetic box-out 7 / 4 / 4 / 1 of 10 at sigma_p 0.05 / 0.2 / 0.3 / 0.5; 6 of 61 real used screens had no offensive possession).'
  evidence: 'Box-out 0 of 10 at every sigma_p (test_m2_07).'
- id: SCR-M2-08-coincident-pairs
  severity: low
  what: 'Coincident-track veto on the screener pairs (s, D) and (s, u) only, over [t_s - coincident_pre_s, t_s + 0.5].'
  why: 'Confirm r1: judged J35 (a real screen) was lost to a (u, D) merge; judged J03 was a screener pile-up just before the old t_s +- 0.5 window. Rule text corrected (CR1-06: the veto needs coincident_frames consecutive frames and the sigma gate).'
  evidence: 'J35 recovered on real data; early pile-up detected by the new window (test_m2_08).'
- id: SCR-M2-09-screener-came
  severity: low
  what: 'The own-man veto (stand rows: the proxy says D guards s; contact rows: the joint assignment gives D to s) is lifted when the screener came to D (came_s, came_m, came_ratio) and D was not nearer s than any other attacker at the start; such rows must be used on-ball screens and yield to any other row of the pair within window_s.'
  why: 'Confirm r1 CR1-01: judged J34 (D beside the handler''s path; the screener ran 2.5 m to him) was a real screen lost to the own-man veto. A first version without the use / yield / start tests created rows on the screener''s own dropping defender and cost 11 synthetic hits.'
  evidence: 'J34 recovered; synthetic sweep unchanged (test_m2_09).'
- id: SCR-M2-10-sigma-use
  severity: low
  what: 'On-ball USE needs d_su_ca <= use_near_m - min(use_k x sigma_d, use_k_cap_m).'
  why: 'Confirm r1 CR1-03 (noise-only rows). An uncapped 1 sigma removed mostly ambiguous rows at 1.7-2.0 m but also the synthetic wide use (test_m1_03), so the tightening is capped at 0.1 m.'
  evidence: 'Real: a few ambiguous rows at 1.9-2.0 m removed at noise 0 / 0.3.'
- id: SCR-M2-11-offball-block-guard
  severity: high
  what: 'A used off-ball row needs a block of D_u''s route, an interaction with him or a user passing at >= offball_fast_use_mps; the peak-speed fallback of SCR-M1-08 needs a block; on precise tracks (pair sigma <= offball_guard_sigma_max_m) D_u must guard u (assignment, nearest defender or mean distance <= offball_du_close_m).'
  why: 'Confirm r1 CR1-04 (off-ball precision 0.725). All 59 r2-candidate clean off-ball rows were hand judged: rows with neither block nor interaction at 2.0-2.7 m/s and rows on a defender who guarded someone else were ambiguous or not screens. On noisy tracks the guard test cost synthetic stack / stagger users their screens, hence the sigma gate.'
  evidence: 'Real clean off-ball rows 61 -> 54; hand-judged precision of all emitted rows 0.79 (see summary). Synthetic composites at r1 level (test_m2_11).'
- id: SCR-M2-12-offball-contact
  severity: info
  what: 'Off-ball used screens need CONTACT on D_u (min 5-frame median d(s, D_u) over t_s +- contact_win_s <= contact_on_m + contact_k x sigma_d), as research OFF-BALL requires.'
  why: 'Research alignment; every emitted row already met it on the SportVU sample.'
  evidence: 'No rate change.'
- id: SCR-M2-13-rescreen-link
  severity: low
  what: 'A used on-ball screen within window_s of a row already merged into an earlier one (a reset of the same screen), from a new stand, is linked as its re-screen. offball_r_min_m 1.2 -> 1.0.'
  why: 'Confirm r1 regressions at sigma_p 0.5: re_screen 18 -> 17 and cross_screen 19 -> 18 of 20 (cross screens at the block read r_s 1.15-1.2 under noise; judged rim scrums sit at 0.6-0.9 m).'
  evidence: 'Synthetic sigma_p 0.5: re_screen 17 -> 20 of 40, cross_screen 18 -> 19, off_ball_screen_coverage 247 -> 249 (test_m2_13).'
- id: mastery-r2-summary
  severity: info
  what: 'Real data (3 SportVU games 2015-16, 194 chunks, 6855 s, team_ends, sigma told 0.15, per 48 min both teams, noise 0 / 0.3 / 0.5), r1 -> r2: ball_screen 44.5 / 47.5 / 44.1 -> 45.0 / 47.1 / 43.3 (noise 0.3 within +5 % of clean, 0.5 within -4 %); screen 73.5 / 75.2 / 71.0 -> 70.2 / 74.8 / 69.3; off-ball used screens 25.6 / 23.9 / 22.3 -> 22.7 / 23.9 / 21.4; screen_set 121.4 / 134.9 / 131.5 -> 121.4 / 134.9 / 130.2; ball_screen_coverage 45.4 / 50.0 / 46.6 -> 45.8 / 49.6 / 45.8. Downstream (same runs): bigs roll 16.4 / 21.0 / 17.2 -> 16.8 / 21.0 / 16.8, pop_arc 3.4 / 4.6 / 2.9 -> 2.9 / 4.6 / 2.9, slip 2.5 / 0.8 / 2.1 -> 2.1 / 0.8 / 2.1, composition pnr_location 37.0 / 40.8 / 36.1 unchanged (composition builds its own proxy screens).'
  why: 'Hand-judged precision (position-only numeric strips, no video; R real, A ambiguous = 0.5, N / H not). Every one of the 106 r1 clean ball screens was judged (74 R, 25 A, 5 N, 2 H = 0.82) and every row r2 added; r2 clean ball screens 107: 81 R / 23 A / 1 N / 2 H = 0.86 (A-bounds 0.76-0.97). Noise 0.3: 112 rows (clean labels carried by actors and time, 13 noise-only rows judged) = 0.81; noise 0.5: 103 rows = 0.83. Off-ball used screens, clean, all 54 rows judged: 33 R / 19 A / 2 N = 0.79 (A-bounds 0.61-0.96); at noise 0.3 about 0.64 (18 noise-only rows judged 4 R / 8 A / 6 N).'
  evidence: 'Synthetic tester sweep (175 scenes x 10 seeds x sigma_p 0.2 / 0.3 / 0.5, 5250 runs, 0 crashes) against r1: hits 13213 -> 13224, strict 12432 -> 12441, false positives 684 -> 679; no detector below r1 except screen_read at sigma_p 0.5 594 -> 593 (a noise row with the wrong defender). Against the pre-r1 base: every cell at or above base hits except screen_set strict at sigma_p 0.3 570 -> 569 (one seed whose stand onset moved 0.5 s); false positives at sigma_p 0.5 ball_screen 0 -> 1, ball_screen_coverage 2 -> 5, high_ball_screen 2 -> 3, screen_the_screener 2 -> 3 (total false positives 1122 -> 679). Thresholds of SCR-M2-02/03/10/11 were set on judged rows of these same 3 games (in-sample, see open_mastery_r2).'
open_mastery_r2:
- 'Ball-screen recall (CR1-01): 45 per 48 against the diagnosis estimate of 71 (95 % 51-96). On the diagnosis''s judged candidate universe the r2 engine captures 14 of the 16 sampled candidates judged real (R / RM); the rest of the estimated gap is candidates judged ambiguous from positions (own-man, no-stand, not-geo strata). Moving further needs gold labels (video or the user''s manual labels).'
- 'In-sample tuning (CR1-07): use_disp_m, use_k_cap_m, offball_fast_use_mps, offball_du_close_m, the fast-brush terms, came_* and every r1 parameter listed by the confirmer were chosen on judged rows of the same 3 games, with precision judged on the same games by the same (position-only) judge. Only 3 SportVU games are available; all of these values are provisional until a held-out source (another season or the UConn-MSU film) is labelled.'
- 'Off-ball precision under noise: about 0.64 at sigma_p 0.3 (noise-only rows: missing ball, wrong defender, screener pile-ups and pairs jogging together). The guard test is limited to precise tracks because it removed real synthetic stack / stagger screens under noise.'
- 'Off-ball recall: the judged-universe estimate of captured true off-ball screens fell 24.0 -> 18.5 per 48 (precision 0.81 -> 0.83); most removed rows were judged ambiguous.'
- 'Position-only judging: ambiguous calls (D sagging 2 m below the handler, defender glued to the user through the screen) are a quarter of the ball-screen rows and bound every precision figure above (A-bounds).'
changes_mastery_r3:
- id: SCR-M3-01-pocket-pass
  severity: high
  what: 'A catch by the screener right after t_s is a pocket pass to the roller (not a reverse handoff and not a SET receive) when the screener moves toward the rim at >= pocket_roll_mps, the pair separates into the catch (nearer by pocket_sep_m within [catch - pocket_sep_win_s, catch - 0.15 s]) and the passer still attacks the rim at >= pocket_handler_vr_mps; radial speeds from smoothed positions. Lifts the SCR-M2-04 reverse-handoff veto and the SET / contact-row receive veto.'
  why: 'Confirm r2 regression: a true PnR with a pocket pass to the rolling big 0.35 s after the handler passed him was vetoed as a handoff u -> s (r1 -> r2: 10 -> 6 of 10 at sigma_p 0.05, 2 -> 0 at 0.2 and 0.3, 5 -> 3 at 0.5); at sigma_p >= 0.2 the SET receive veto (catch within [a - pad_s, b + receive_s]) also removed it. A first version without the passer term reopened the reverse handoff (0 -> 1 / 1 / 2 of 10 at sigma_p 0.2 / 0.3 / 0.5: under noise its detected catch lags 0.2-0.35 s, when the pair has already separated and the big drives).'
  evidence: 'Pocket pass 0 / 0 / 3 -> 10 / 10 / 9 of 10 at sigma_p 0.2 / 0.3 / 0.5 (6 at 0.05, unchanged: the CA-RTS filter loses manoeuvring players at sigma_p <= 0.1); reverse handoff 0 of 10 at 0.05 / 0.2 / 0.3 / 0.5 (test_m3_01). Real SportVU ball screens unchanged (no judged row moved).'
- id: SCR-M3-03-offball-contact
  severity: high
  what: 'A used off-ball screen needs CONTACT on D_u at min 5-frame median d(s, D_u) over t_s +- contact_win_s <= offball_contact_m + offball_contact_k x sigma_d (about 1.05 m on SportVU, 1.2 m at sigma_p 0.3, 1.35 m at 0.5) instead of the on-ball 1.2 m + 1 sigma.'
  why: 'Confirm r2: off-ball precision 0.79 against the 0.8 bar. Every hand-judged real SportVU used row had D_u within 0.80 m of the screener; rows whose D_u never came nearer than 0.9-1.2 m were ambiguous or not screens (the defender went under or trailed wide). offball_contact_k 1.0 cost synthetic back / rip screens scripted at 1.0-1.05 m (sigma_p 0.2) and a second stagger screen at sigma_p 0.5, hence 1.5.'
  evidence: 'Real clean off-ball used rows 54 -> 50 (with SCR-M3-04): removed 3 judged ambiguous and 1 not a screen, no judged-real row lost; synthetic sweep unchanged (test_m3_03, test_m3_rule_scenes_keep_their_rates).'
- id: SCR-M3-04-offball-pass-by
  severity: medium
  what: 'A used off-ball screen needs the user to pass the screener: displacement of u relative to s over t_s +- offball_rel_win_s >= offball_rel_pass_m + offball_rel_k x sigma_d.'
  why: 'Confirm r2 adversarial: two teammates jogging 0.9 m apart up the lane line and stopping side by side read off-ball screens at sigma_p 0.2 / 0.3 / 0.5 (1 / 2 / 3 of 10). A 0.6 s window with 2 sigma cost slow cross and elbow-down screens at sigma_p 0.3 / 0.5 (users at 1.6-2.6 m/s), hence 0.8 s and 1.5 sigma.'
  evidence: 'Jog pair 1 / 2 / 3 -> 0 / 0 / 0 of 10 (test_m3_04); real clean: 1 judged not-screen removed.'
- id: SCR-M3-05-ball-dropout
  severity: medium
  what: 'When the raw ball is observed on < offball_ball_obs_min of the off-ball possession window (tracker dropout), the possession gate of SCR-M2-07 has no evidence; the used row is then kept only for a user who leaves the rim by >= offball_dropout_dr_m.'
  why: 'Confirm r2: a down screen with the ball missing for the whole clip went 8 -> 0 of 10 at every sigma_p (production ball dropouts). Without the leave-the-rim term a box-out with the ball lost after the shot became a screen (0 -> 2 of 10 at sigma_p 0.3 / 0.5).'
  evidence: 'Pin-down with ball dropout 0 -> 8 / 10 / 8 / 8 of 10 at sigma_p 0.05 / 0.2 / 0.3 / 0.5; box-out with and without ball 0 of 10 (test_m3_05). SportVU tracks the ball: no real change.'
- id: SCR-M3-06-retreat-travel
  severity: low
  what: 'A retreat read is exempt from the handler-travel test (SCR-M2-03) only when the handler travels >= retreat_travel_m.'
  why: 'Tester sweep at sigma_p 0.5 (NEG_logo_pnr seed 10): a handler standing beside the screener at the rim read a retreat from velocity noise (0.9 m of travel) and kept a ball screen on the screener''s own defender (ball_screen false positives 0 -> 1 since r1).'
  evidence: 'Sweep ball_screen false positives at sigma_p 0.5 1 -> 0 (test_m3_06).'
- id: SCR-M3-07-reject-travel
  severity: low
  what: 'An on-ball reject read needs the handler to travel >= screen_read.reject_disp_m from h(t_s - 0.5) within [t_s - 0.5, t_s + use_disp_post_s].'
  why: 'At sigma_p 0.5 a standing handler''s unused set-up read a reject from speed noise (0.9-1.1 m/s peak) and became a ball_screen_coverage row (sweep false positives 2 -> 5 since r1).'
  evidence: 'Sweep ball_screen_coverage false positives at sigma_p 0.5 5 -> 0; ICE reject coverage kept (test_m3_07). One sweep cell (NEG_wing_step_down seed 9 at sigma_p 0.5) loses a coverage hit that was that kind of row: a reject read 2 s after the screen with the handler 1 m from his start.'
- id: SCR-M3-08-set-onset
  severity: info
  what: 'A contact row that replaces an off-ball stand row of the same pair (SCR-M1-02) keeps that stand as its screen_set onset (attribute set_stop).'
  why: 'Sweep regression since r1: A_side_step_up seed 6 at sigma_p 0.3 reported the screen_set onset at the contact-episode start, 0.5 s early (strict 570 -> 569).'
  evidence: 'screen_set strict at sigma_p 0.3 back to 570 (test_m3_08).'
- id: mastery-r3-summary
  severity: info
  what: 'Real data (3 SportVU games 2015-16, 194 chunks, 6855 s, team_ends, sigma told 0.15, per 48 min both teams, noise 0 / 0.3 / 0.5), r2 -> r3: ball_screen 45.0 / 47.1 / 43.3 unchanged (noise 0.3 +5 %, 0.5 -4 % of clean); off-ball used screens 22.7 / 23.9 / 21.4 -> 21.0 / 23.5 / 21.4; screen 70.2 / 74.8 / 69.3 -> 68.5 / 74.4 / 69.3; screen_set 121.4 / 134.9 / 130.2 unchanged; ball_screen_coverage 45.8 / 49.6 / 45.8 -> 45.4 / 47.9 / 45.4. Downstream bigs roll 16.8 / 21.0 / 16.8, pop_arc 2.9 / 4.6 / 2.9, short_roll 5.5 / 5.5 / 8.4, slip 2.1 / 0.8 / 2.1 and composition pnr_location 37.0 / 40.8 / 36.1 unchanged.'
  why: 'Hand-judged precision (position-only strips, no video; R real, A ambiguous = 0.5): ball screens clean, every one of the 107 rows judged: 81 R / 23 A / 1 N / 2 H = 0.86 (A-bounds 0.76-0.97); noise 0.3, 112 rows (106 labelled) = 0.81; noise 0.5 = 0.83. Off-ball used screens clean, all 50 rows judged: 33 R / 16 A / 1 N = 0.82 (A-bounds 0.66-0.98), up from 0.79; at noise 0.3 about 0.65 (noise-only rows).'
  evidence: 'Synthetic tester sweep (175 scenes x 10 seeds x sigma_p 0.2 / 0.3 / 0.5, 5250 runs, 0 crashes): hits 13224 -> 13223, strict 12441 -> 12443, false positives 679 -> 656; every cell at or above r2 hits and strict except ball_screen_coverage at sigma_p 0.5 320 -> 319 (SCR-M3-07). Against the pre-r1 base every hit and strict cell is at or above base; false positives above base remain only at sigma_p 0.5: high_ball_screen 2 -> 3 (a DHO keep whose giver passes the receiver at 1.3 m, ball_screen is do-not-care there) and screen_the_screener 2 -> 3 (a double drag whose second screener meets the rolling first screener''s defender). Confirm-r2 adversarial scenes: pocket pass restored, ball dropout restored, jog pair 0, box-out with and without ball 0, every other scene equal to r2.'
open_mastery_r3:
- 'Ball-screen recall (CR1-01, high): 45 per 48 at precision 0.86 (about 39 true per 48) against the diagnosis estimate of 71 (95 % 51-96; 47.6 counting every ambiguous call as not a screen). On the judged candidate universe the engine captures 14 of 16 candidates judged real; the estimated gap sits in strata judged ambiguous from positions (no-stand, own-man, not-geo). The confirmer asked not to loosen thresholds without gold labels: this needs video or the user''s manual labels (a labelling queue of these candidates is the next step).'
- 'Off-ball precision under noise: about 0.65 at sigma_p 0.3 and 0.68 at 0.5 (noise-only rows: curls and fades at 2-3 m/s with the defender trailing, missing-ball and wrong-defender rows); clean precision 0.82. Off-ball recall on the judged universe: 14.8 per 48 captured (A-bounds 11.1-18.5) of about 40 estimated; several judged-real misses pass the user 1.2-1.25 m from the screener (d_su_max_m 1.2 against the research 2.0 m).'
- 'In-sample tuning (CR1-07): offball_contact_m was set on judged rows of the same 3 games as every r1 / r2 threshold; all stay provisional until a held-out source is labelled.'
- 'Confirm-r2 adversarial a_offreb_crash (1 / 3 / 5 of 10 at sigma_p 0.2 / 0.3 / 0.5) is not fixable from the scene: its ball flies from the shooter to himself along his own path, so the tracking shows him holding it; on real tracks a shot leaves no owner and SCR-M2-07 applies. a_snake_short (info) stays out: the handler gets 1.9-2.3 m from his start, inside the SCR-M2-03 band of judged not-screens.'
- 'Two false-positive cells above the pre-r1 base at sigma_p 0.5 (high_ball_screen, screen_the_screener, one run each) are unchanged from r1 / r2.'
changes_mastery_r4:
  # Mastery r4 (25 Oct 2026): the SCR-T22 gap closed. Branches that had no V0 scene since loop 1 / 2 (zoom, handback
  # positive, double_high trade / sink / plain, pin_in, baseline_exit, boundary_parallel) each get a positive scene and a
  # near miss in tests/movement/test_screens.py (sc_zoom, sc_handback, sc_double_high, sc_pin_in, sc_baseline_exit,
  # sc_baseline_wall), counted over seeds 1-10 at sigma_p 0.2 / 0.3 / 0.5 (hits of 10). One detector bug found and fixed
  # (SCR-M4-03); every other branch fired as written. No real-data change (SCR-M4-03 sub_labels: 0 real double_ball_screen events).
  - id: SCR-M4-01-zoom
    severity: low
    what: 'Scene sc_zoom: pin-down for the block player, who comes straight off it into a DHO from the slot (0.9 s after t_s); near miss zoom_late: the same DHO 2.5 s later (outside zoom_s 1.5 s). No code change.'
    why: SCR-T22 (loop 1 / 2) listed zoom as a branch with no scenario.
    evidence: 'handoff_chain zoom 9 / 8 / 5 of 10 (sigma_p 0.2 / 0.3 / 0.5); zoom_late 0 / 0 / 0 while its DHO is still found 10 / 9 / 6. Tests test_m4_rare_branch_positive_rate[zoom-*], test_m4_rare_branch_near_miss[zoom-*], test_m4_near_misses_keep_the_parent_event.'
  - id: SCR-M4-02-handback
    severity: low
    what: 'Scene sc_handback: a 3 m pass at the top (0.45 s in the air) returned after 0.5 s; near miss handback_hold: returned after 2.0 s (outside handback_s). No code change.'
    why: SCR-T22 had only handback negatives (Detroit sets at sigma_p 0.5, test_t13_t22); the positive branch was never exercised.
    evidence: 'handback 10 / 7 / 4 of 10; handback_hold 0 / 0 / 0. The measured air time of a 0.45 s pass is 0.2-0.35 s (the holder radius trims the flight); a 2.4 m / 0.3 s pass reads 0.13-0.2 s and fails handback_min_air_s 0.2, as intended (pitch, not a pass). Tests test_m4_rare_branch_*[handback-*].'
  - id: SCR-M4-03-double-high-trade-needs-movement
    severity: medium
    what: 'double_ball_screen: double_high_trade also needs the first screener to move >= trade_move_m (new param, 1.5 m) from his t_s1 position while r >= trade_r_m (6.75 m) within 2.0 s; a first screener who stays is plain double_high.'
    why: 'The pre-screen gate admits first screeners at r 4.5-8.0 m, and the usual double-high spot is above the arc (r 7-8 m), so "reaches r >= 6.75" was true from t_s1 on: in sc_double_high with s1 standing at r 7.9 m every detected double high read double_high_trade (8 / 7 / 7 of 10) and plain double_high was unreachable for any first screener set above the arc. The YAML rule says the screener reaches the arc, i.e. moves there.'
    evidence: 'sc_double_high (s1 at the top, s2 at the right slot 2.9 m apart, uses 1.1 s apart): trade (s1 pops 2.9 m to the left slot) double_high_trade 8 / 7 / 7 before and after; sink (s1 rolls) double_high_sink 8 / 7 / 5 (unchanged); stay: double_high_trade 8 / 7 / 7 -> 0 / 0 / 0, double_high 0 / 0 / 0 -> 8 / 7 / 7. Detroit counts unchanged (sub_label branch order is detroit first). No downstream family reads double_ball_screen. Real data: changes sub_labels only, never the event count; measured on 3 SportVU games (194 chunks, 6855 s, team_ends): double_ball_screen fires 0 times before and after, clean and at added noise 0.3 (all screens rates identical, ball_screen 45.0 / 47.1 per 48 clean / n0.3), so no real event changes. Tests test_m4_rare_branch_*[double_high*], test_m4_03_trade_needs_the_first_screener_to_move.'
  - id: SCR-M4-04-pin-in
    severity: low
    what: 'Scene sc_pin_in: u spots up on the right wing, his defender sags to the top and sprints back, the screener comes out of the lane (r 1.3 -> 6.1 m) and pins him inside; u jabs and steps out. Near miss pin_in_cut: u cuts to the rim (moves more than pin_in_user_move_m). No code change.'
    why: SCR-T22 listed pin_in as a branch with no scenario. Its gates need the defender delayed at the screen (speed_post <= 0.7 speed_pre, drop >= 0.8 m/s) at a t_s near the contact, so the scene times the user's jab to the contact.
    evidence: 'pin_in 7 / 7 / 2 of 10; pin_in_cut 0 / 0 / 0. The sigma_p 0.5 misses are the delay test (the smoothed defender speed after the stop stays above 0.7 x before) and t_s moving with the noisy closest approach. Tests test_m4_rare_branch_*[pin_in-*].'
  - id: SCR-M4-05-baseline-exit
    severity: low
    what: 'Scene sc_baseline_exit: u runs along the baseline from under the rim to the left corner off a screen at the left block (P_s y 0.9 m); near miss baseline_exit_wing: the same screen, u curls up to the left wing. No code change.'
    why: SCR-T22 listed baseline_exit as a branch with no scenario.
    evidence: 'baseline_exit 10 / 9 / 8 of 10; baseline_exit_wing 0 / 0 / 0 while its screen (screener s, user u) is found 10 / 10 / 10. Tests test_m4_rare_branch_*[baseline_exit-*], test_m4_near_misses_keep_the_parent_event.'
  - id: SCR-M4-06-boundary-parallel
    severity: low
    what: 'Scene sc_baseline_wall: two screeners 0.8 m apart on a line parallel to the baseline, 1.45 m inside it (screen_boundary_6ft_band), u runs along the baseline behind them; near miss baseline_wall_angled: the second screener 0.75 m higher (pair line about 50 deg off the baseline). No code change.'
    why: SCR-T22 listed boundary_parallel (Rule 4-35.7) as a branch with no scenario.
    evidence: 'blind_screen_hint boundary_parallel 9 / 8 / 5 of 10; angled 0 / 0 / 0. The misses are a second screener row with no u record (the user passes s2 beyond the contact radius) or a P_s read beyond the 6 ft band (1.83 m) at sigma_p 0.5. Tests test_m4_rare_branch_*[boundary_parallel-*].'
  - id: mastery-r4-summary
    severity: info
    what: 'version 0.6.0 -> 0.6.1, date 2026-10-25. Rule text of double_ball_screen updated (trade_move_m). 13 scenes, 50 tests added; test_screens.py 286 -> 336 tests, all pass.'
    why: Close SCR-T22 (rare branches without a V0 scene) as an (a) item of the minor_left inventory.
    evidence: 'Floors in R4_POS are the measured counts minus one (minimum 1); near misses must stay at 0. Still without a scene: none of the SCR-T22 list (zoom, handback positive, double_high trade / sink, pin_in, baseline_exit, boundary_parallel).'
v0_results: 'sigma_p 0.3, seeds 1-5, 53 positive cases (48 detectors): 242 / 265 = 91 % pass kind + actors + t0 within 0.3 s + conf 0.2-1 + attributes; no detector fires on the null scenario (10 moving players, ball passed) for any of the 5 seeds. Weakest: side/step-up PnR 3/5 (handler wraps the screener, closest approach ambiguous), the rest 4-5/5. Synthetic only (V0): no claim about film until gold labels exist. Loop 1 (independent tester report, 22 failures): 196 tests pass (163 + 33 regression tests); on the tester''s 175 scenes x 10 seeds x sigma_p 0.2/0.3/0.5 (5250 runs) 0 crashes (4 before); per-item before/after numbers are in changes_loop1. Loop 2 (confirmer report on loop 1): on the same sweep hits 12539 -> 12612, strict 11756 -> 11832, FPs 1818 -> 1139, no detector worse at any sigma_p; see changes_loop2.'
noise_driven_design (V0 findings of this task, each documented at its item):
- 'smoothed positions under V0 noise (white + AR(1) 0.9, sigma_p 0.3) have 0.17 m per-axis error (median 2-D error 0.23 m, p90 0.44 m) with slow drift; pair distances wander 0.3-0.5 m for up to 1 s, so every distance gate has a probability and the screen moment uses a contact window, not a bare argmin'
- 'the CA-RTS filter (mvlib, MP-03 gate 13.8) loses manoeuvring players at sigma_p <= 0.1 (errors up to 2.6 m): reported to the measurement family; tests stay at sigma_p 0.3'
- 'holder: mvlib nearest-player holder plus a sticky switch (max(0.15 m, 1.5 x K_CAL x sqrt(var_p_a + var_p_b)) since loop 1) and 12-frame minimum runs (9 before loop 1), so a screener brushing past the handler does not take the ball'
- 'screen candidates need the user moving at the closest approach; adjacent standing teammates (stacks, Detroit) are not screens for each other'
added_missing_items:
- dho_pitch_disambiguation (dribble pitch vs DHO vs ball screen)
- screen_target_defender (zone fallback when the matchup is ambiguous; pre-switch flag)
- screen_inbound_context (screens while the ball is out of bounds)
- screen_noise_calibration (measured sigma_v and NULL-rate study before STRICT is used for reports)
- off_ball_screen_coverage outputs pre_switch; ball_screen_coverage carries the CTG route/coverage/switch mapping including none, late and normal
- screen_record_schema links composite sets (Horns, Chicago, Floppy, Pistol, pick-the-picker) to action ids
- elevator_screen noise floor (gap-change test is primary; the 0.6 m closed gap is an attribute)
- screen (false-positive budget) and screen_pose_legality (pose-only legality items as explicit needs_data)
items:
# ======================================================================================
# Rules (shared measurement; no events of their own)
# ======================================================================================
- id: screen_frame
  level: rule
  name: Shared screen notation and per-screen measurement frame
  aliases: [screen frame, F3.0 measurement frame]
  research_ids: [SCR-R00]
  actors: {screener: s, user: u, defender: D_u, screener_defender: D_s, ball: b}
  t0: t_s (screen_moment)
  rule: |
    Per candidate (s, u, D_u) on smoothed tracks:
    - d_su(t) = dist(s, u); d_sD(t) = dist(s, D_u); sep(t) = dist(u, D_u).
    - n window: [t_s - n_avg_pre_s, t_s + n_avg_post_s] clipped to start at the stop onset.
    - P_s = the screen point: mean of s over the stop frames within +-ps_avg_s of t_s (s(t_s) when t_s is outside the stop). n = unit(D_u - s) averaged over the n
      window (the side the screener blocks).
    - n_r = n . unit(P_s - rim). d_hat = unit(u(t_s + disp_post_s) - u(t_s - disp_pre_s)) (user path direction; falls back to unit(P_s - u(t_s - disp_pre_s)) when the displacement is < min_disp_m).
    - u_hat_pre = unit mean velocity of u over [t_s - 0.5, t_s - 0.1] s (MP-13); replaced by d_hat when that mean speed < 1.0 m/s.
    - screen line = line through P_s perpendicular to d_hat; lambda(obj, t) = (obj(t) - P_s) . d_hat, positive = beyond the screen.
    - away use (off-ball only, loop 1, SCR-T05) - u moves straight away from the screener (angle(displacement, u(t_s - disp_pre_s) - P_s) <= away_use_deg, |displacement| >= screen_angle.flare_disp_m) and sep_gain >= screen_interaction.sep_gain_m; this counts as passed with t_h = t_s (a flare user never crosses the screen line).
    - passed = lambda_u goes from <= -pass_margin_m to >= +pass_margin_m inside [t_s - pass_pre_s, t_s + pass_post_s] and, at the crossing (t_h = first frame
      lambda_u >= 0), u is within pass_lateral_m of P_s along the screen line.
    - blocking = for >= block_min_frames frames in [t_s - 0.3, t_s + 0.5] s, seg_dist(s(t), D_u(t), u(t + block_lookahead_s)) <= block_radius_m (the screener stands on the defender's route to where the user is going), or contact_likely.
    This replaces the research between() test, which fails for back and down screens (check SCR-R00/P02-between).
  params:
    ps_avg_s: {value: 0.5, unit: s, note: 'P_s = mean of the standing screener over the stop frames within +-ps_avg_s of t_s (noise; s(t_s) when outside the stop)'}
    n_avg_pre_s: {value: 0.6, unit: s, note: 'research 0.2 s; widened (clipped to the stop) because n is noisy at d_sD < 1 m (n_r noise about +-0.3 at 0.2 s)'}
    n_avg_post_s: {value: 0.1, unit: s}
    disp_pre_s: {value: 0.5, unit: s}
    disp_post_s: {value: 1.0, unit: s}
    min_disp_m: {value: 0.5, unit: m}
    pass_margin_m: {value: 0.3, unit: m, note: 'about one smoothed position sigma; stops jitter around the line counting as a pass'}
    pass_lateral_m: {value: 1.5, unit: m, note: 'the crossing must happen within this lateral distance of P_s (a user attacking away crosses the line far from the screen)'}
    pass_pre_s: {value: 1.0, unit: s}
    pass_post_s: {value: 1.0, unit: s}
    block_radius_m: {value: 0.8, unit: m}
    block_lookahead_s: {value: 0.5, unit: s}
    block_min_frames: {value: 3, unit: frames}
    away_use_deg: {value: 60.0, unit: deg, note: 'off-ball away use (flare/fade, SCR-T05): angle(user displacement, u0 - P_s) <= this, |displacement| >= screen_angle.flare_disp_m and sep_gain >= screen_interaction.sep_gain_m count as passed (t_h = t_s)'}
    away_speed_s: {value: 0.5, unit: s, note: 'away use: the user speed gate of screen_read is the peak 5-frame median speed over [t_c, t_c + away_speed_s] (the closest approach of a fade is its first step)'}
  min_duration_s: null
  outputs: [P_s, n, n_r, d_hat, u_hat_pre, lambda_u, lambda_D, passed, t_h, blocking, blocking_margin_m]
  confidence: {level: high, model: deterministic geometry; uncertainty propagates through sigma_dist in the detectors that use it}
  noise: n is unstable when d_sD < 0.5 m, hence the window average; lambda crossings need the 0.3 m margin at sigma_p 0.3.
  conflicts_resolved:
  - F3.0 lambda (along the user direction) vs named_spots pnr_big_* depth (along screener->rim) are both kept; named_spots is canonical for coverage labels, lambda is secondary.
  - research between() replaced by blocking + passed (check high error).
  sources:
  - {url: 'https://arxiv.org/pdf/2512.01478', supports: side-crossing pick definition (stationary teammate, handler crosses the teammate-basket line within 1 s; handler outside the arc)}
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/defense_full.md', supports: F3.0 screen point, screen line and level offset}
  status: canonical
  detector: null
- id: ball_screen_model
  level: rule
  name: Two-stage on-ball screen model (possession, contact candidates, probabilistic decision) and screen-row vetoes
  aliases: [on-ball screen model, PnR model, mastery r1]
  research_ids: [SCR-M1-01, SCR-M1-02, SCR-M1-03, SCR-M1-04, SCR-M1-05, SCR-M2-02, SCR-M2-03, SCR-M2-04, SCR-M2-05, SCR-M2-06, SCR-M2-07, SCR-M2-08, SCR-M2-09, SCR-M2-10, SCR-M2-11, SCR-M2-12, SCR-M2-13, SCR-M3-01, SCR-M3-03, SCR-M3-04, SCR-M3-05, SCR-M3-06, SCR-M3-08]
  actors: {screener: s, handler: h, defender: D_h, user: u, user_defender: D_u}
  t0: t_s (screen_moment)
  rule: |
    Mastery round 1 (real SportVU diagnosis: ball screens found at about 30 % recall and 90 % precision; under added noise 0.3 / 0.5 the
    rate fell 22.7 -> 10.5 -> 2.9 per 48). Stage 1 generates candidates generously, stage 2 decides with sigma-aware terms.
    POSSESSION (SCR-M1-01): poss(t) = the attacker whose 5-frame median raw-ball distance (poss_med_frames) is smallest and <= HOLD_R +
    poss_k x ball sigma (the MAD of raw minus smoothed ball over the clip); the owner is sticky (a teammate takes over only when nearer
    by poss_switch_margin_m); None gaps up to poss_bridge_s between runs of the same attacker are filled (a dribble); runs shorter than
    poss_min_run_frames are removed. It replaces the cleaned holder in the on-ball kind test (u holds on >= screen.onball_frames of the
    9 frames around t_s), in the on-ball defender override (screen_target_defender) and in the contact candidates. DHO / pass logic
    keeps the cleaned holder.
    CONTACT CANDIDATES (SCR-M1-02): for every possession run of h and teammate s, episodes of >= contact_min_frames frames (gaps <=
    contact_gap_frames bridged) where the 5-frame median d(s, d) <= contact_on_m + contact_k x sigma_d (sigma_d = mvlib sigma_dist x
    screen_noise_calibration.dist_sigma_scale) for a defender d that guards the ball at the episode onset (screen_target_defender on-ball
    override: nearest the holder on >= onball_def_frac of the holder frames of [onset - onball_window_s, onset], within onball_def_max_m,
    nearer h than s - this is also the own-man veto). Skipped when a stand-based row of the same (s, h) covers the episode, s has the
    ball on half of it, or s catches the ball. The episode is a synthetic stop (attribute plant = moving / loose, source = contact); t_s
    from screen_moment. Only rows that pass the decision below are kept, so this path never adds unused or rejected SET rows.
    ON-BALL DECISION (SCR-M1-03), for every on-ball row (stand or contact): USE = the handler crosses the screen line within
    max(screen_frame.pass_lateral_m, use_near_m) of P_s, d_su_ca <= use_near_m, the screener blocks D_h's route or is in contact, and the
    handler speed at the closest approach >= screen.user_speed_on_mps. screen = CONTACT (min 5-frame median d(s, D_h) over t_s +-
    contact_win_s <= contact_on_m + contact_k x sigma_d) AND min d(s, h) over the same window <= near_m AND possession of h on >=
    hold_frac of [t_s - 0.5, t_s + 0.3] AND the handler's peak 5-frame median speed over [t_s - 0.5, t_s + handler_post_s] >=
    screen.user_speed_on_mps AND read in (use, snake, split) or a retreat with d_su_ca <= screen.d_su_max_m AND the screener's 5-frame
    median speed at the contact <= screener_max_mps. p = max(p_loose, plant_floor) x p_below(contact, contact_on_m + contact_k x
    sigma_d, sigma_d) x p_below(d_su_ca, use_near_m, sigma_d) x ambiguity_penalty: the plant is a likelihood term, not a gate.
    OFF-BALL GUARD (SCR-M1-04): an unused off-ball SET row needs D_u to guard u before the screen - mean d(D_u, u) over [t_s -
    offball_guard_pre_s, t_s - offball_guard_post_s] <= offball_du_max_m, and the joint one-to-one assignment (_assignment) gives D_u
    to u or D_u is the defender nearest u on >= offball_guard_frac of that window (Hojo: the assignment and the nearest defender) -
    and u must come within screen_read.reject_approach_m of s (min d(s, u) over [t_s - 1.0, t_s + 1.5]). An unused / rejected
    on-ball row needs mean d(D, h) over [t_s - 1.0, t_s] <= bd_max_m. A stand next to a help defender is not a row.
    Mastery r2 (SCR-M2-11): a USED off-ball row (an off-ball screen) also needs D_u to guard u on precise tracks (pair distance
    sigma <= offball_guard_sigma_max_m; mean d(D_u, u) <= offball_du_close_m also suffices), the screener to block D_u's route
    or interact with him or the user to pass at >= offball_fast_use_mps, the peak-speed fallback of SCR-M1-08 only with a block,
    CONTACT on D_u (min 5-frame median d(s, D_u) over t_s +- contact_win_s <= contact_on_m + contact_k x sigma_d; SCR-M2-12) and
    the offense owning the ball (noise-robust possession) on >= offball_poss_frac of [t_s - offball_poss_pre_s, t_s +
    offball_poss_post_s] (SCR-M2-07: box-outs and rebound scrums are not screens).
    COINCIDENT TRACKS (SCR-M1-05, SCR-M2-08): a row is dropped when the 5-frame median distance of the screener pairs (s, D) or
    (s, u) stays below coincident_m for >= coincident_frames consecutive frames of [t_s - coincident_pre_s, t_s + 0.5] (a tracker
    pile-up or merged identity; centre-to-centre distance cannot go below about 0.45 m). Tested only when the pair distance sigma
    is <= coincident_sigma_max_m (precise tracking): on noisy tracks a close contact reads as coincident. (u, D) is not tested
    (a defender glued to the handler does not fake a screen).
    MASTERY R2 additions to the on-ball decision: the screener speed is the median of his 5-frame median speed over t_s +-
    screener_win_s, or the stand's window speed when the row's stand overlaps t_s +- contact_win_s (SCR-M2-05); the handler
    gets >= use_disp_m from h(t_s - 0.5) within [t_s - 0.5, t_s + use_disp_post_s] unless the read is a retreat (SCR-M2-03);
    USE needs d_su_ca <= use_near_m - min(use_k x sigma_d, use_k_cap_m) (SCR-M2-10); a contact row moving between
    moving_screener_max_mps and screener_max_mps needs a close contact and d_su_ca <= screen.d_su_max_m (SCR-M2-02); a row
    whose handler hands the ball to the screener within [t_s - 0.3, t_s + handoff_rev_post_s] at <= handoff_d_m, keeping it
    handoff_keep_s without it coming back, is dropped (a DHO u -> s; SCR-M2-04). The own-man veto of a stand row (proxy says
    D guards s) and of a contact row (assignment gives D to s) is lifted when the screener came to D (SCR-M2-09: over
    [onset - came_s, onset] s moved >= came_m toward D, D moved <= came_ratio of that toward s, and D was not nearer s than to
    any other attacker at the start); such a row must be a used on-ball screen and yields to any other row of the pair within
    screen_window.window_s. Attribute pass_and_screen: s passed to h (catch in [t_s - pass_screen_s, t_s]) and screened for him
    (SCR-M2-06).
    MASTERY R3: a catch by the screener is a pocket pass to the roller, not a handoff back to him, when he moves toward the rim at
    >= pocket_roll_mps over [catch - pocket_win_s / 2, catch + pocket_win_s], the pair was nearer by pocket_sep_m within [catch -
    pocket_sep_win_s, catch - 0.15 s] and the passer still attacks the rim at >= pocket_handler_vr_mps over [catch - pocket_win_s,
    catch] (radial speeds from smoothed positions); such a catch lifts both the reverse-handoff veto and the SET receive veto
    (SCR-M3-01). A retreat read is exempt from use_disp_m only with >= retreat_travel_m of handler travel (SCR-M3-06). A USED
    off-ball row needs CONTACT on D_u at min 5-frame median d(s, D_u) <= offball_contact_m + offball_contact_k x sigma_d
    (SCR-M3-03, tighter than the on-ball contact) and the user to pass the screener - displacement of u relative to s over t_s +-
    offball_rel_win_s >= offball_rel_pass_m + offball_rel_k x sigma_d (SCR-M3-04: teammates jogging or stopping side by side).
    When the raw ball is observed on < offball_ball_obs_min of the possession window (tracker dropout), the possession gate has no
    evidence and the used row is kept only for a user who leaves the rim by >= offball_dropout_dr_m (SCR-M3-05). A contact row
    that replaces an off-ball stand row of the same pair reports that stand as its screen_set onset (attribute set_stop,
    SCR-M3-08).
  params:
    poss_k: {value: 1.5, unit: sigma, note: 'possession radius = HOLD_R + poss_k x the clip''s robust raw-ball sigma (1.0-1.1 m on SportVU, about 1.45 m with V0 sigma_p 0.3)'}
    poss_med_frames: {value: 5, unit: frames, note: 'median of the raw ball-player distance (a single noisy ball frame does not end the hold)'}
    poss_switch_margin_m: {value: 0.3, unit: m, note: 'a teammate takes the ball only when nearer than the current owner by this margin (a screener brushing the handler)'}
    poss_bridge_s: {value: 0.7, unit: s, note: 'None gaps up to this long between two runs of the same attacker are a dribble, not a loss of possession'}
    poss_min_run_frames: {value: 8, unit: frames, note: 'shorter possession runs are removed (the cleaned holder uses 12; the gap filling makes 8 safe)'}
    contact_on_m: {value: 1.2, unit: m, note: 'CONTACT: 5-frame median screener-defender distance (research CONTACT 1.2 m; CTG 4 ft)'}
    contact_k: {value: 1.0, unit: sigma, note: 'contact threshold widened by contact_k x sigma_d: about 1.45 m at sigma_p 0.3 (research: 1.5 m when sigma_p >= 0.3)'}
    contact_min_frames: {value: 5, unit: frames, note: 'research: >= 5 frames (0.17 s)'}
    contact_gap_frames: {value: 3, unit: frames}
    contact_win_s: {value: 0.5, unit: s, note: 'the contact and the screener-handler distance are read over t_s +- this window'}
    near_m: {value: 3.05, unit: m, note: 'research ON-BALL: d(s, h) <= 10 ft somewhere in t_s +- 0.5 s'}
    use_near_m: {value: 2.0, unit: m, note: 'on-ball USE: the handler passes within this distance of the screener (soft term; 4 of 8 judged real screens rejected by the 1.2 m gate went wide at 1.3-1.8 m)'}
    use_k: {value: 1.0, unit: sigma, note: 'mastery r2 (SCR-M2-10): on-ball USE needs d_su_ca <= use_near_m - use_k x sigma_d (1.85 m on SportVU, about 1.6 m at sigma_p 0.3)'}
    use_k_cap_m: {value: 0.1, unit: m, note: 'mastery r2 (SCR-M2-10): the tightening use_k x sigma_d is capped here: an uncapped 1 sigma (0.25-0.35 m under noise) removed mostly ambiguous rows at 1.7-2.0 m but also the synthetic wide use (1.6 m path read 1.89 m at sigma_p 0.3, test_m1_03)'}
    hold_frac: {value: 0.5, unit: fraction, note: 'possession of h over [t_s - 0.5, t_s + 0.3]'}
    handler_post_s: {value: 1.2, unit: s, note: 'handler motion window [t_s - 0.5, t_s + handler_post_s] (research HANDLER READ window)'}
    screener_win_s: {value: 0.4, unit: s, note: 'mastery r2 (SCR-M2-05): the screener speed is the median of his 5-frame median speed over t_s +- this window (a 0.15 s track jump is a minority of the 25 frames)'}
    use_disp_m: {value: 2.3, unit: m, note: 'mastery r2 (SCR-M2-03): the handler gets at least this far from his position at t_s - 0.5 within [t_s - 0.5, t_s + use_disp_post_s] (judged SportVU rows of a handler dribbling in place, stopping at the screener or catching and standing were not screens, 1.6-2.2 m; judged real uses 2.8-8 m)'}
    use_disp_post_s: {value: 1.5, unit: s}
    retreat_travel_m: {value: 1.2, unit: m, note: 'mastery r3 (SCR-M3-06): a retreat read is exempt from use_disp_m only when the handler travels at least this far (a retreat dribble backs off 1-2 m; at sigma_p 0.5 a handler standing beside the screener read a retreat from velocity noise, 0.9 m of travel)'}
    screener_max_mps: {value: 2.5, unit: m/s, note: 'screener 5-frame median speed at the contact; rolling / brush screens run 0.6-1.5 m/s, cutters and sprinters through the ball faster'}
    moving_screener_max_mps: {value: 2.0, unit: m/s, note: 'contact candidates (no stand): screener speed at the contact; with the blocking test and an interaction or a close contact (judged SportVU contact rows: runners at 2.2-2.9 m/s were drives with a big alongside or rushed traffic)'}
    plant_floor: {value: 0.5, unit: probability, note: 'p uses max(p_loose, plant_floor): a moving screener halves the confidence instead of removing the screen'}
    offball_guard_pre_s: {value: 1.5, unit: s}
    offball_guard_post_s: {value: 0.3, unit: s}
    offball_guard_frac: {value: 0.5, unit: fraction, note: 'D_u is the defender nearest u on at least this fraction of [t_s - 1.5, t_s - 0.3]'}
    offball_du_max_m: {value: 4.0, unit: m, note: 'mean d(u, D_u) over the same window'}
    offball_du_close_m: {value: 1.2, unit: m, note: 'mastery r2 (SCR-M2-11): used off-ball rows also need D_u to guard u (offball_guard_*), which a mean d(D_u, u) <= this satisfies on its own (a screener''s defender may stand nearer u in a stack)'}
    offball_guard_sigma_max_m: {value: 0.16, unit: m, note: 'mastery r2 (SCR-M2-11): the D_u-guards-u test of used off-ball rows runs only when the pair distance sigma is at most this (precise tracking, as coincident_sigma_max_m)'}
    offball_fast_use_mps: {value: 3.0, unit: m/s, note: 'mastery r2 (SCR-M2-11): a used off-ball row needs the screener to block D_u or interact with him, or the user to pass at >= this speed (a sprint off a second stagger screener whose defender already trails)'}
    offball_use_win_s: {value: 0.3, unit: s, note: 'SCR-M1-08: an off-ball used screen needs the user speed at his closest approach >= screen.user_speed_off_mps, or the peak 5-frame median speed within +-this of it >= that gate together with an interaction with D_u (research USED: >= 2.0 m/s around the screen; the peak alone added 8 rows on the SportVU sample, 6 judged not screens)'}
    offball_r_min_m: {value: 1.0, unit: m, note: 'SCR-M1-10: an off-ball used screen has its screen point at least this far from the rim (judged SportVU off-ball rows under the rim, r_s 0.6-0.9 m, were rebound and post scrums; cross screens at the block sit at r 1.5-2.5 m)'}
    coincident_m: {value: 0.08, unit: m, note: 'real SportVU pile-ups sit at 0.02-0.05 m for 10-24 frames; V0 defenders scripted on the user''s path come within 0.1-0.15 m'}
    coincident_pre_s: {value: 1.5, unit: s, note: 'mastery r2 (SCR-M2-08): the screener pairs (s, D) and (s, u) are tested over [t_s - coincident_pre_s, t_s + 0.5]'}
    coincident_frames: {value: 8, unit: frames, note: 'the pair stays below coincident_m for at least this many consecutive frames (0.27 s): a user brushing through the screener''s centre is not a pile-up'}
    bd_pre_s: {value: 1.5, unit: s, note: 'SCR-M1-07 contact path ball defender: window [t - bd_pre_s, t - bd_post_s] before the contact onset (research D_h override [t_s - 1.5, t_s - 0.5])'}
    bd_post_s: {value: 0.3, unit: s}
    bd_max_m: {value: 3.7, unit: m, note: 'research: the defender nearest h within 12 ft'}
    bd_frac: {value: 0.6, unit: fraction, note: 'd is nearest h on at least this fraction of the possession frames of the window (or the joint assignment gives d to h); the joint assignment must not give d to s (own man)'}
    came_s: {value: 1.5, unit: s, note: 'mastery r2 (SCR-M2-09): own-man veto revisited - window [onset - came_s, onset] for the screener-came test'}
    came_m: {value: 1.5, unit: m, note: 'mastery r2 (SCR-M2-09): the screener moved at least this far toward the defender (projection on the direction to the defender''s position at the onset)'}
    came_ratio: {value: 0.5, unit: fraction, note: 'mastery r2 (SCR-M2-09): and the defender moved toward the screener by at most this fraction of that (a defender who guards s follows him)'}
    coincident_sigma_max_m: {value: 0.16, unit: m, note: 'SCR-M1-05 is tested only when the pair distance sigma (sigma_dist x dist_sigma_scale) is at most this: about 0.14 m on SportVU told 0.15, 0.17-0.25 m from sigma_p 0.2 up'}
    handoff_s: {value: 1.0, unit: s, note: 'SCR-M1-06: an on-ball row whose screener handed the ball to the handler (catch in [t_s - handoff_s, t_s + 0.3]) at close range is a handoff row'}
    handoff_d_m: {value: 1.6, unit: m, note: 'SCR-M1-06: exchange distance of that transfer (the dho gate is 1.0 m; pitch-typed handoffs measure 1.2-1.6 m; mastery r2 tried 1.8 m: one more judged SportVU handoff, but at sigma_p 0.5 the noisy possession then typed real ball screens as handoffs)'}
    handoff_rev_post_s: {value: 0.5, unit: s, note: 'mastery r2 (SCR-M2-04): a row whose handler hands the ball to the screener within [t_s - 0.3, t_s + this] at close range is a DHO (u -> s), not a ball screen; later close passes are pocket passes to the roller'}
    handoff_keep_s: {value: 0.6, unit: s, note: 'mastery r2 (SCR-M2-04): the possession-based reverse handoff (u hands to s) needs s to keep the ball on >= 80 % of this window after the change (at sigma_p 0.5 the possession flips between handler and screener for a few frames)'}
    pocket_roll_mps: {value: 1.5, unit: m/s, note: 'mastery r3 (SCR-M3-01): a reverse-handoff catch while the screener moves toward the rim at >= this (median radial speed over [catch - pocket_win_s, catch]) is a pocket pass to the roller and keeps the ball screen (research ROLL: v_r >= 1.5 m/s)'}
    pocket_win_s: {value: 0.4, unit: s, note: 'radial speed window [catch - pocket_win_s / 2, catch + pocket_win_s]'}
    pocket_sep_win_s: {value: 0.6, unit: s, note: 'mastery r3 (SCR-M3-01): a pocket pass is thrown after the handler went past the screener - the pair was closer by pocket_sep_m within [catch - pocket_sep_win_s, catch - 0.15 s]; a handoff is exchanged at the closest approach'}
    pocket_sep_m: {value: 0.3, unit: m}
    pocket_handler_vr_mps: {value: 0.5, unit: m/s, note: 'mastery r3 (SCR-M3-01): the passer of a pocket pass still attacks the rim through the catch (median radial speed toward the rim over [catch - pocket_win_s, catch]); a handoff giver steps out'}
    pass_screen_s: {value: 3.0, unit: s, note: 'mastery r2 (SCR-M2-06): attribute pass_and_screen - the screener passed to the handler (catch in [t_s - pass_screen_s, t_s]) and then screened for him; judged SportVU rows of this pattern were 12 real, 5 ambiguous, 2 handoffs of 19, so it is an attribute, not a veto'}
    offball_poss_pre_s: {value: 1.0, unit: s, note: 'mastery r2 (SCR-M2-07): off-ball used screens need an attacker owning the ball on >= offball_poss_frac of [t_s - offball_poss_pre_s, t_s + offball_poss_post_s]'}
    offball_poss_post_s: {value: 0.5, unit: s}
    offball_poss_frac: {value: 0.5, unit: fraction}
    offball_ball_obs_min: {value: 0.3, unit: fraction, note: 'mastery r3 (SCR-M3-05): when the raw ball is observed on fewer than this fraction of the possession window (tracker dropout) the possession gate has no evidence; the used screen is then accepted only for a user who leaves the rim by >= offball_dropout_dr_m (a down / pin-down / flare exit), never for a crash to the rim (a box-out with the ball lost after the shot)'}
    offball_dropout_dr_m: {value: 0.5, unit: m}
    offball_contact_m: {value: 0.85, unit: m, note: 'mastery r3 (SCR-M3-03): off-ball CONTACT = min 5-frame median d(s, D_u) over t_s +- contact_win_s <= this + offball_contact_k x sigma_d (about 1.05 m on SportVU, 1.2 m at sigma_p 0.3, 1.35 m at 0.5); every judged real SportVU used row was <= 0.80 m (in-sample, provisional)'}
    offball_contact_k: {value: 1.5, unit: sigma, note: 'mastery r3 (SCR-M3-03): widening of the off-ball contact by the pair sigma (1.0 cost synthetic back / rip screens scripted at 1.0-1.05 m at sigma_p 0.2 and a second stagger screen at sigma_p 0.5)'}
    offball_rel_pass_m: {value: 1.2, unit: m, note: 'mastery r3 (SCR-M3-04): the user passes the screener - displacement of u relative to s over t_s +- offball_rel_win_s (teammates jogging or stopping side by side never pass each other; a cut at 2 m/s moves about 3 m relative to him over 1.6 s)'}
    offball_rel_win_s: {value: 0.8, unit: s}
    offball_rel_k: {value: 1.5, unit: sigma, note: 'the relative displacement is a difference of four smoothed positions: widened by offball_rel_k x the pair distance sigma (about 1.4 m on SportVU, 1.7 m at sigma_p 0.5)'}
    handoff_air_s: {value: 0.4, unit: s, note: 'SCR-M1-06: raw-ball air time of that transfer'}
  min_duration_s: 0.17
  outputs: [source (stand | contact), plant (strict | loose | moving | unknown), contact_min_m, d_sh_min_m, handler_peak_mps, screener_mps, handler_disp_m, pass_and_screen, screener_came]
  confidence: {level: medium, p_terms: ['max(p_loose, plant_floor)', 'p_below(contact_min, contact_on_m + contact_k sigma_d, sigma_d)', 'p_below(d_su_ca, use_near_m, sigma_d)', ambiguity_penalty]}
  noise: The possession radius and the contact threshold scale with the measured noise of the clip, so the on-ball decision keeps its meaning from SportVU (sigma about 0.05-0.15 m) to video tracking (sigma_p 0.2-0.5 m).
  conflicts_resolved:
  - research ON-BALL SCREEN and HANDLER READ (screens_mastery notes section 3) adopted for on-ball rows; the off-ball rows keep the screen / screen_read gates
  - research PLANT is an attribute and a likelihood term, not a gate (contact candidates); the stand-based SET keeps its moving veto (walk-by)
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: screener 10-45 ft from the rim, 4 ft relocation, own-man screens are not ball screens}
  - {url: 'https://www.nessis.org/nessis17/Keshri_adj.pdf', supports: ball-screen detection from screener-defender and handler distances}
  status: proposal
  detector: null
- id: screen_target_defender
  level: rule
  name: Target defender assignment (D_u), own-man screens, zone fallback and pre-switch
  aliases: [D_u, screened defender, matchup freeze]
  research_ids: [SCR-R00, check missing zone/pre-switch]
  actors: {defender: D_u, user: u, screener: s}
  t0: SET stop onset a (freeze at a - freeze_offset_s)
  rule: |
    Matchup proxy (until the defense_full section 0.3 HMM exists): at frame t, c(d, o) = mean distance of defender d to attacker o over [t - matchup_window_s, t];
    P(d guards o) = exp(-c^2 / (2 tau^2)) normalised over attackers o. Frozen at t_f = a - freeze_offset_s (a = SET stop onset; fixes the circular t_s definition).
    Loop 1 (SCR-T04): when an earlier SET row of the same s ended within screen_window.window_s before this stop, with no switch on it and no ball transfer since, its freeze frame is reused; and the frames where s stood screening d in earlier rows (d within set_def_radius_m of the standing s) are dropped from the cost of the pair (d, s) - contact with a standing screener is not guarding him. For a defender d within set_def_radius_m of the stopped screener: u = argmax_o P(d guards o). If u == s or P(d guards s) >= own_man_p, the stop is an own-man stop and no screen row is made.
    On-ball override (loop 4, SCR-L4-02): when d is the defender nearest the ball holder h (h != s) over [a - onball_window_s, a] (see params) and the proxy names another attacker, P(d guards h) = that nearest fraction and the other attackers share the rest in proportion; the ball-handler's defender is defined by the ball, not by a 2 s mean distance.
    Mastery r1: the on-ball override reads the noise-robust possession (ball_screen_model, SCR-M1-01); the contact candidates use the research D_h override
    (nearest the handler within ball_screen_model.bd_max_m over [t - bd_pre_s, t - bd_post_s]) with a one-to-one defender assignment (minimum summed mean
    distance) as the own-man veto (SCR-M1-07); the same assignment is one of the two guard tests of unused off-ball rows (SCR-M1-04).
    Zone fallback: if max_o P(d guards o) < ambiguous_p, D_u_ambiguous = true, both top-2 attackers are stored, u = the top-1 attacker, and every p term is multiplied by ambiguity_penalty.
    pre_switch flag: the defender nearest u over [t_s - 0.5, t_s] is D_s, not D_u (the defense switched before the screen).
  params:
    freeze_offset_s: {value: 1.0, unit: s}
    matchup_window_s: {value: 2.0, unit: s, note: 'stands in for HMM persistence; a defender caught on a screener for 0.5 s is not reassigned to him'}
    matchup_tau_m: {value: 1.5, unit: m}
    own_man_p: {value: 0.5, unit: probability}
    ambiguous_p: {value: 0.5, unit: probability}
    ambiguity_penalty: {value: 0.8, unit: factor}
    onball_window_s: {value: 1.0, unit: s, note: 'loop 4 (SCR-L4-02): on-ball override window [a - onball_window_s, a] before the stand onset'}
    onball_hold_frac: {value: 0.5, unit: fraction, note: 'loop 4: one teammate of s holds the ball on at least this fraction of the window'}
    onball_def_frac: {value: 0.7, unit: fraction, note: 'loop 4: d is the defender nearest the holder (within onball_def_max_m) on at least this fraction of the holder frames; P(d guards h) is then set to this fraction and the other attackers share the rest in proportion'}
    onball_nearer_holder: {value: true, unit: bool, note: 'loop 4: and d is nearer the holder than the screener on average over those frames (a help defender who dropped with his own man at the rim is not the ball defender)'}
    onball_def_max_m: {value: 2.5, unit: m, note: 'loop 4: on-ball defender distance (NBA on-ball defenders play 0.6-2.0 m off the ball; help defenders are further)'}
  min_duration_s: null
  outputs: [D_u, P_D_u, D_u_ambiguous, top2, D_s, pre_switch]
  confidence: {level: medium, model: softmax over mean distances (proxy); replaced by the HMM posterior when available}
  noise: Zone and scramble defenses give ambiguous matchups; the fallback keeps the row but lowers confidence. A pre-switch makes the frozen D_u the wrong man; the flag exposes it.
  conflicts_resolved:
  - research froze D_u at t_s - 1.0 while t_s depended on D_u (circular); freeze moved to a - 1.0 s.
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/defense_full.md', supports: section 0.3 matchup HMM (the proxy stands in until it is built)}
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: own-man screens are not ball screens}
  status: proposal
  detector: null
- id: screen_stationarity
  level: rule
  name: Noise-aware screener stationarity (stand intervals, LS window speed, strict/loose flags)
  aliases: [stationary, stand, screener stationarity]
  research_ids: [SCR-R01]
  actors: {player: any (screener)}
  t0: stop onset a
  rule: |
    Stand interval: mvlib.hysteresis(enter = s2 < s2_max, stay = s2 < s2_stay (s2 = mvlib stationary_s2 with var_v floored at s2_var_v_floor_sigma_mps^2, loop 4), min_s = loose_dwell_s, max_gap_frames = stand_gap_frames), then split
    where the smoothed position leaves the anchor (mean of the first anchor_frames frames) by more than max(exit_disp_m, exit_k_sigma x K_CAL x sqrt(2 mean var_p)).
    Window speed: v_LS = least-squares slope of the smoothed x and y over the stop interior (trim trim_frames at each end when at least min_ls_frames remain; never fewer than
    min_ls_frames, centred on the stop). sigma_win = K_CAL * sqrt(mean var_v) * sqrt(vel_err_corr_frames / (vel_err_corr_frames + N)).
    Flags: loose = |v_LS| <= loose_v_mps when loose_v_mps / sigma_win >= testable_ratio, else NULL; strict = |v_LS| <= strict_v_mps and dwell >= strict_dwell_s when
    strict_v_mps / sigma_win >= testable_ratio, else NULL (FALSE when the dwell is short). A NULL is stored as null, never as false.
    Probabilities: p_loose = P(|v| < loose_v_mps), p_strict = P(|v| < strict_v_mps), Rice posterior with sigma_win. testable_ratio 1.8 means a truly still player passes the flag >= 80 % of the time.
  params:
    s2_max: {value: 5.99, unit: chi-square 2 dof, note: 'enter (95 %)'}
    s2_stay: {value: 13.82, unit: chi-square 2 dof, note: 'stay (99.9 %); correlated noise gives runs of moderate s2 at rest'}
    s2_var_v_floor_sigma_mps: {value: 0.183, unit: m/s, note: 'loop 4 (SCR-L4-01): the stand statistic uses s2 = |v|^2 / (K_CAL^2 max(var_v, floor^2)); 0.183 m/s is the CA-RTS steady-state velocity sigma at sigma_p 0.2 m (the lowest production tier), so enter / stay mean |v| below 0.80 / 1.22 m/s at worst and the stand test is no stricter on precise tracks (SportVU, sigma 0.05-0.15: 0.40-0.70 / 0.61-1.06 m/s) than on video tracks'}
    stand_gap_frames: {value: 3, unit: frames}
    loose_v_mps: {value: 0.6, unit: m/s}
    strict_v_mps: {value: 0.3, unit: m/s}
    loose_dwell_s: {value: 0.3, unit: s}
    strict_dwell_s: {value: 0.5, unit: s}
    min_ls_frames: {value: 15, unit: frames}
    trim_frames: {value: 5, unit: frames, note: 'drops the arrival/departure tails from the LS window'}
    anchor_frames: {value: 9, unit: frames}
    exit_disp_m: {value: 1.0, unit: m, note: 'V0 correlated noise wanders the smoothed position by up to 0.5 m within 1 s at rest (seen in this task), so 0.6 m split real stops'}
    exit_k_sigma: {value: 3.0, unit: sigma, note: 'exit threshold = max(exit_disp_m, exit_k_sigma x K_CAL x sqrt(2 mean var_p))'}
    vel_err_corr_frames: {value: 27, unit: frames, note: 'fitted on V0 noise (white + AR(1) rho 0.9, sigma_p 0.3) - window sigma 0.33 m/s at N 15, 0.26 at N 30'}
    testable_ratio: {value: 1.8, unit: ratio}
  min_duration_s: 0.3
  outputs: [stop_start, stop_end, dwell_s, v_ls_mps, sigma_win_mps, p_loose, p_strict, loose (true|false|null), strict (true|false|null)]
  confidence: {level: medium, model: Rice posterior on the window speed; flags are point decisions}
  noise: |
    V0 simulation (this task, CA-RTS q 30, sigma_p 0.3 m, white + AR(1) noise): per-frame s2 < 5.99 passes 98 % of still frames, 80 % at 0.6 m/s and 41 % at 1.0 m/s, so the
    per-frame test cannot reject slow walkers on its own; the window LS speed separates still (median 0.32 m/s at N 30) from 1.0 m/s walkers (median 1.05). STRICT (0.3 m/s) needs
    sigma_win <= 0.167 m/s and is NULL at sigma_p 0.3 for every stop shorter than several seconds; it becomes testable at about sigma_p 0.1.
  conflicts_resolved:
  - "'Stationary' values <0.5 (M-SPACE-043, SEAL, R-ST-02 live), <=0.3 / <0.6 (screens), 1.0 (named_spots slow_speed), <1.94-2.0 (stand-walk band): screens use 0.30 strict / 0.60 loose on the LS window speed; the per-frame stand is the mvlib s2 test."
  - check SCR-R01-a/b/c/d fixes (see fixed_check_errors)
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/research/load_thresholds.md', supports: calibration step 2 (measured sigma_p)}
  status: canonical
  detector: null
- id: screen_noise_calibration
  level: rule
  name: Measured noise model and STRICT NULL-rate study (calibration plan)
  aliases: [sigma_v calibration]
  research_ids: [check missing noise model]
  actors: {player: any}
  t0: n/a
  rule: |
    Before STRICT is used for reports: (1) measure sigma_win(N) on >= 200 stationary player-intervals of MSU film (free throws, dead balls) per camera/tracker version;
    (2) refit vel_err_corr_frames; (3) report the expected NULL rate of strict and loose against the measured stop-duration distribution of labelled screens;
    (4) if the strict NULL rate exceeds max_strict_null_rate, reports use LOOSE + interaction (or pose) and say so.
  params:
    min_stationary_intervals: {value: 200, unit: count, note: 'calibration-plan value (not read by the detectors)'}
    max_strict_null_rate: {value: 0.2, unit: fraction, note: 'calibration-plan value (not read by the detectors)'}
    dist_sigma_scale: {value: 1.4, unit: factor, note: 'V0 fit (this task): mvlib.sigma_dist (K_CAL x sqrt(var_a + var_b)) = 0.17 m vs the measured pair-distance error 0.24 m under white + AR(1) noise; every distance p term uses sigma_dist x this factor until film calibration'}
  min_duration_s: null
  outputs: [sigma_win table, null rates]
  confidence: {level: n/a, model: n/a}
  noise: Every threshold in this file assumes V0 noise until this study runs.
  conflicts_resolved: []
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/research/load_thresholds.md', supports: calibration steps}
  status: proposal
  detector: null
  needs_data: [MSU film with tracked stationary players]
- id: screen_window
  level: rule
  name: Screen search window, re-screen merge/split, de-duplication and false-positive budget
  aliases: [screen window, rescreen merge]
  research_ids: [SCR-R05]
  actors: {screener: s, user: u, defender: D_u}
  t0: t_s
  rule: |
    Candidates: every SET (screen_set) of an offensive player s whose stand interval has a defender of a teammate within set_def_radius_m. De-duplicate rows with the same
    (s, u) and |t_s difference| <= dedupe_s. A later row of the same (s, u) with t_s gap in (dedupe_s, window_s] is MERGED into the first (rescreen_count + 1) unless it is split:
    s moved more than split_move_m + hyst_m from P_s between the two, or dist(s, D_u) exceeded split_def_m + hyst_m for >= hyst_dwell_frames frames, or the ball changed hands, or (loop 2) the first row was unused / rejected and the later one, from a new stand, is not.
    A later row of the same (s, u) whose t_s gap exceeds window_s but whose stand starts within rescreen_gap_s after the earlier stand ends is a split re-screen as well (loop 2).
    A split row stores rescreen_of = the first row. Double screens give one row per screener.
    Mastery r1 (SCR-M1-09): a later on-ball row of the same (s, u, kind) whose stand starts within fragment_gap_s after a used row's stand ends, at the same
    spot (P_s within split_move_m), is that screen cut in two by noise and is dropped; a contact candidate within window_s of a row of the pair is kept only
    when the screener relocated by more than split_move_m + hyst_m.
    False-positive budget: on V0 null scenarios (8 players moving, no screens) the expected number of emitted screens is 0; on film, track false SETs per possession (target <= fp_budget_per_poss).
  params:
    dedupe_s: {value: 0.6, unit: s}
    window_s: {value: 3.0, unit: s}
    fragment_gap_s: {value: 0.3, unit: s, note: 'mastery r1 (SCR-M1-09): an on-ball row whose stand starts within this time after the stand of a used row of the same (s, u, kind) ends, at the same spot (P_s within split_move_m), is that screen cut in two by noise and is dropped (sigma_p 0.5: 2 re_screen FPs on rescreen_same_side)'}
    rescreen_gap_s: {value: 1.5, unit: s, note: 'loop 2 (SCR-T04 re_screen): a later row whose stand starts within this time after the earlier stand ends is linked as a re-screen (rescreen_of, never merged) even when the t_s gap exceeds window_s'}
    split_move_m: {value: 1.22, unit: m}
    split_def_m: {value: 3.05, unit: m}
    hyst_m: {value: 0.4, unit: m, note: 'about 2 sigma_d of smoothed pair distances (check SCR-R05-hyst)'}
    hyst_dwell_frames: {value: 3, unit: frames}
    fp_budget_per_poss: {value: 0.2, unit: count, note: 'film acceptance target (not read by the detectors)'}
  min_duration_s: null
  outputs: [rescreen_count, rescreen_of, merged]
  confidence: {level: high, model: deterministic}
  noise: Distance gates near 1.22 / 3.05 m chatter; the 0.4 m band and 3-frame dwell absorb it.
  conflicts_resolved:
  - no repo values; CTG 4 ft (1.22 m), 10 ft (3.05 m), 3 s adopted
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: 4 ft relocation and 10 ft defender split of re-screens; 3 s window; one screening frame per screen}
  status: canonical
  detector: null
- id: screen_confidence
  level: rule
  name: Screen confidence model
  aliases: [screens.confidence]
  research_ids: [SCR-R06]
  actors: {all: all}
  t0: t_s
  rule: |
    Event.conf follows MP-16: window_conf(p) x edge_factor x gap_factor, with p = p_stat (Rice posterior of the loose band) x p_below(d_su_ca, d_su_max_m, sigma_d)
    x p_below(d_sD(t_s), set_def_radius_m, sigma_d) x ambiguity_penalty (if D_u_ambiguous). The research logistic score is stored as attrs.p_logit with the hand weights below,
    for retraining (logistic regression on gold, R-ST-10, then isotonic calibration). Rows whose actors are Kalman-bridged (gap_factor) are down-weighted by mvlib.gap_factor; camera
    cuts end segments, so no event spans a cut.
  params:
    b0: {value: -1.5, unit: logit}
    b1_z_stat: {value: 1.0, unit: logit per z}
    b2_user_gate: {value: 1.0, unit: logit per z}
    b3_def_gate: {value: 0.8, unit: logit per z}
    b4_deflect: {value: 0.7, unit: logit}
    b5_delay: {value: 0.7, unit: logit}
    b6_sep_gain: {value: 1.0, unit: logit per m}
    b7_use: {value: 0.5, unit: logit}
    emit_min_conf: {value: 0.15, unit: probability}
  min_duration_s: null
  outputs: [conf, p_logit, features]
  confidence: {level: low until fitted, model: see rule}
  noise: Weights are guesses until fitted; paint occlusion lowers recall for interior screens.
  conflicts_resolved:
  - research p = sigmoid(...) kept as an attribute; Event.conf uses the MP-16 form required by the movement grammar
  sources:
  - {url: 'https://global-uploads.webflow.com/5f1af76ed86d6771ad48324b/622770e864911f5635f56f75_Using%20Hex%20Maps%20to%20Classify%20%20Cluster%20Dribble%20Hand-off%20Variants%20in%20the%20NBA%202.pdf', supports: rules generate candidates and a classifier decides (research-reported)}
  status: proposal
  detector: null
- id: screen_inbound_context
  level: rule
  name: Screens while the ball is out of bounds (SLOB/BLOB)
  aliases: [inbound screen, SLOB screen, BLOB screen]
  research_ids: [check missing inbound]
  actors: {screener: s, user: u, inbounder: holder out of bounds}
  t0: t_s
