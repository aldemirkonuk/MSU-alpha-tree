- id: screen_window
  level: rule
  name: Screen search window, re-screen merge/split, de-duplication and false-positive budget
  aliases: [screen window, rescreen merge]
  research_ids: [SCR-R05]
  actors: {screener: s, user: u, defender: D_u}
  t0: t_s
  rule: |
    Candidates: every SET (screen_set) of an offensive player s whose stand interval has a defender of a teammate within set_def_radius_m. De-duplicate rows with the same
    (s, u) and |t_s difference| <= dedupe_s. A later row of the same (s, u) with t_s gap in (dedupe_s, window_s] is MERGED into the first (rescreen_count + 1) unless it is split:
    s moved more than split_move_m + hyst_m from P_s between the two, or dist(s, D_u) exceeded split_def_m + hyst_m for >= hyst_dwell_frames frames, or the ball changed hands, or (loop 2) the first row was unused / rejected and the later one, from a new stand, is not.
    A later row of the same (s, u) whose t_s gap exceeds window_s but whose stand starts within rescreen_gap_s after the earlier stand ends is a split re-screen as well (loop 2).
    A split row stores rescreen_of = the first row. Double screens give one row per screener.
    False-positive budget: on V0 null scenarios (8 players moving, no screens) the expected number of emitted screens is 0; on film, track false SETs per possession (target <= fp_budget_per_poss).
  params:
    dedupe_s: {value: 0.6, unit: s}
    window_s: {value: 3.0, unit: s}
    rescreen_gap_s: {value: 1.5, unit: s, note: 'loop 2 (SCR-T04 re_screen): a later row whose stand starts within this time after the earlier stand ends is linked as a re-screen (rescreen_of, never merged) even when the t_s gap exceeds window_s'}
    split_move_m: {value: 1.22, unit: m}
    split_def_m: {value: 3.05, unit: m}
    hyst_m: {value: 0.4, unit: m, note: 'about 2 sigma_d of smoothed pair distances (check SCR-R05-hyst)'}
    hyst_dwell_frames: {value: 3, unit: frames}
    fp_budget_per_poss: {value: 0.2, unit: count, note: 'film acceptance target (not read by the detectors)'}
  min_duration_s: null
  outputs: [rescreen_count, rescreen_of, merged]
  confidence: {level: high, model: deterministic}
  noise: Distance gates near 1.22 / 3.05 m chatter; the 0.4 m band and 3-frame dwell absorb it.
  conflicts_resolved:
  - no repo values; CTG 4 ft (1.22 m), 10 ft (3.05 m), 3 s adopted
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: 4 ft relocation and 10 ft defender split of re-screens; 3 s window; one screening frame per screen}
  status: canonical
  detector: null
- id: screen_confidence
  level: rule
  name: Screen confidence model
  aliases: [screens.confidence]
  research_ids: [SCR-R06]
  actors: {all: all}
  t0: t_s
  rule: |
    Event.conf follows MP-16: window_conf(p) x edge_factor x gap_factor, with p = p_stat (Rice posterior of the loose band) x p_below(d_su_ca, d_su_max_m, sigma_d)
    x p_below(d_sD(t_s), set_def_radius_m, sigma_d) x ambiguity_penalty (if D_u_ambiguous). The research logistic score is stored as attrs.p_logit with the hand weights below,
    for retraining (logistic regression on gold, R-ST-10, then isotonic calibration). Rows whose actors are Kalman-bridged (gap_factor) are down-weighted by mvlib.gap_factor; camera
    cuts end segments, so no event spans a cut.
  params:
    b0: {value: -1.5, unit: logit}
    b1_z_stat: {value: 1.0, unit: logit per z}
    b2_user_gate: {value: 1.0, unit: logit per z}
