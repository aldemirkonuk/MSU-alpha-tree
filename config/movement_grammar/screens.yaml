# ======================================================================================
# Defender response (attributes; also emitted as their own events)
# ======================================================================================
- id: ball_screen_coverage
  level: action
  name: On-ball coverage and defender routes (over / under / through / ice / switch / drop / hedge / blitz / contain)
  aliases: [coverage_coarse, coverage_fine_code, ballhandler_defender_route]
  research_ids: [SCR-D01]
  actors: {handler_defender: D_h, screener_defender: D_s, handler: h, screener: s}
  t0: t_s
  rule: |
    ROUTE of D_h at the frame it crosses the screen line in [t_s - 0.3, t_s + route_post_s]: w = lateral coordinate along the screen line (sign = side where h passed P_s).
    OVER = w_D on the handler side (w_D > 0); THROUGH = w_D between 0 and w(D_s) on the other side; UNDER = beyond D_s (or no D_s and w_D < 0). margin = distance to the nearest
    boundary; route_unresolved when |margin| < sigma_d. ICE = D_h stays between h and P_s (lambda_D < 0, within ice_lateral_m of the screen side) for >= ice_s in [t_s - 1.0, t_s]
    and the read is reject. Rejected ball screens are coverage rows too (p = p_set; loop 1, SCR-T02 - before, only is_screen rows were iterated, so ICE was unreachable). No crossing and no ice = none (CTG none).
    D_s DEPTH at t_s + depth_delay_s: the named_spots pnr_big_* label (x, y = D_s; ax_, ay_ = s; hx, hy = h), precedence blitz > contain > hedge > at_level > high_drop >
    deep_drop > deep_drop_high; blitz also needs D_h within near_h_m of h for >= blitz_dh_s over [t_s, t_s + blitz_window_s] (TRAP); contain = D_s within near_h_m of h with speed >= contain_speed_mps and D_h not within near_h_m; deep_drop_high = depth >= deep_drop_high_m with r > 5.5 (gap band, check SCR-D01-bands); screener_far when s is > screener_far_m from h (no pnr_big label applies; coarse class none - loop 1, SCR-T01 fixed a crash on it).
    SWITCH = reciprocal matchup exchange (D_h -> s, D_s -> h, P >= switch_p) by t_s + 1.0 persisting >= switch_hold_s; late switch when the exchange happens in
    (t_s + 1.0, t_s + 2.5]; switch_held_2s flag. coverage_coarse precedence: switch > blitz > ice > hedge > contain > at_level > drop bands.
    CTG mapping (proposal): route {over: over, under: under, through: under, ice: ice, none: none}; coverage {blitz: blitz, hedge: hedge (bluff when D_s is back within 1.0 m of s
    within 1.0 s), contain: contain, at_level: drop_contest, high_drop / deep_drop / deep_drop_high: drop, screener_far: none, switch: switch (late / normal)}.
  params:
    route_post_s: {value: 1.0, unit: s}
    ice_s: {value: 0.5, unit: s}
    ice_lateral_m: {value: 1.5, unit: m}
    depth_delay_s: {value: 0.3, unit: s}
    blitz_dh_s: {value: 0.6, unit: s}
    switch_p: {value: 0.6, unit: probability, note: 'on the softmax matchup proxy (flatter than the HMM posterior); 0.8 when the defense_full HMM exists'}
    switch_hold_s: {value: 1.5, unit: s}
    late_switch_s: {value: 2.5, unit: s}
    switch_window_s: {value: 0.5, unit: s, note: 'short matchup window for switch detection (the freeze uses 2.0 s)'}
    near_h_m: {value: 1.5, unit: m, note: 'D_s near the handler (contain) and D_h near the handler (blitz) radius (was hard-coded)'}
    blitz_window_s: {value: 1.5, unit: s, note: 'D_h near-handler time is counted over [t_s, t_s + blitz_window_s]'}
    contain_speed_mps: {value: 1.0, unit: m/s}
    screener_far_m: {value: 1.5, unit: m, note: 'screener more than this from the handler at t_s + depth_delay_s and no pnr_big band: big = screener_far (coverage_coarse none)'}
    deep_drop_high_m: {value: 3.5, unit: m}
  min_duration_s: 0.5
  outputs: [route, route_margin_m, route_unresolved, big (blitz | contain | hedge | at_level | high_drop | deep_drop | deep_drop_high | screener_far), drop_depth_m, switch (none | normal | late), switch_held_2s, coverage_coarse, ctg_route, ctg_coverage]
  confidence: {level: medium, p_terms: [screen p terms, 'route: Phi(|margin| / sigma_d)']}
  noise: Route labels depend on which side of a 0.5-1 m gap D_h passes, close to the noise; the signed margin is kept. Matchup lag delays switch detection by about 0.5 s.
  conflicts_resolved:
  - SWITCH persistence defense section 0.4 >= 1.5 s vs F3.4 >= 2 s -> 1.5 s + switch_held_2s flag
  - depth reference named_spots pnr_big_* canonical; F3.0 -lambda depth secondary
  - bands made contiguous and ordered (check SCR-D01-bands)
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: coverage, ballhandler-defender route and switch labels}
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml', supports: pnr_big_* depth labels}
  status: canonical
  detector: detect_ball_screen_coverage
- id: off_ball_screen_coverage
  level: action
  name: Off-ball screen coverage (chase, top-lock, under, switch, bump, pre-switch)
  aliases: [off-ball screen defense, lock and trail, top lock]
  research_ids: [SCR-D02]
  actors: {defender: D_u, screener_defender: D_s, user: u, screener: s}
  t0: t_s
  rule: |
    First match: SWITCH = matchup exchange (D_u -> s, D_s -> u) within switch_within_s of t_s persisting >= 1.5 s; PRE_SWITCH = screen_target_defender.pre_switch;
    TOP_LOCK = at t_s - 0.5 D_u is within toplock_m of segment(u, ball) with projection 0.05-0.6 (between u and the ball) and the read is reject or unused;
    UNDER = D_u crosses the screen line with r_D < r_s - under_margin_m (rim side of s) and reaches u(t_s + 1.0) within under_lag_s of u;
    CHASE = mean dist(D_u, u) over [t_s - 0.3, t_s + 0.7] <= chase_m and D_u crosses the screen line on u's side of s;
    BUMP = D_s steps >= bump_m across the screen line direction within 0.5 s of t_s and is back nearer its start by t_s + 1.5 s. Otherwise none. Rows - every off-ball screen; an unused or rejected SET only when its coverage is top_lock, switch or pre_switch (loop 1, SCR-T07).
  params:
    switch_within_s: {value: 0.8, unit: s}
    toplock_m: {value: 0.8, unit: m}
    under_margin_m: {value: 0.3, unit: m}
    under_lag_s: {value: 0.4, unit: s}
    chase_m: {value: 1.5, unit: m}
    bump_m: {value: 1.0, unit: m}
  min_duration_s: 0.5
  outputs: [offball_coverage (switch | pre_switch | top_lock | under | chase | bump | none), margins, switch timing]
  confidence: {level: low-medium, p_terms: [screen p terms]}
  noise: Same side-of-gap ambiguity as ball_screen_coverage; top-lock needs a tracked ball.
  conflicts_resolved:
  - chase distance 1.0 m (research) relaxed to a 1.5 m window mean (noise; proposal)
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/defense_full.md', supports: off-ball screen coverages}
  status: proposal
  detector: detect_off_ball_screen_coverage
