- id: screen_set
  level: primitive
  name: SCREEN_SET (screener stops near a teammate's defender)
  aliases: [set_screen, screen_set, set a screen]
  research_ids: [SCR-P01]
  actors: {screener: s, defender: D_u, user: u (intended)}
  t0: stop onset a
  rule: |
    Fires for s on its stand interval [a, b] (screen_stationarity) when: s does not catch the ball within [a - pad_s, b + receive_s]; the stop is not confidently moving (P(|v| > loose_v_mps) < moving_p_min; the loose
    flag itself is reported, and p_loose enters the confidence); s is not the holder on >= holder_frac of the stop; a defender D whose frozen matchup
    (screen_target_defender) is a teammate u != s is within set_def_radius_m of s on >= def_contact_frames frames of the stand [a, b] (loop 1, SCR-T06 - was anywhere in [a - pad_s, b + pad_s]); the row is not role-reversed (u does not start a stand of his own, without the ball, within role_reversal_s after t_s with median d(u, D_s) <= set_def_radius_m - u was running in to screen for s); s is in bounds; for on-ball screens r_s in
    [on_ball_r_min_m, on_ball_r_max_m] (CTG 10-45 ft); for off-ball screens y_s - y_ball <= off_ball_upcourt_max_m (CTG 40 ft); y_s <= frontcourt_y_m + drag_allowance_m.
    Contact class from the 5-frame median of d_sD at t_s: likely <= contact_likely_m, possible <= contact_possible_m, unlikely <= set_def_radius_m, none above.
    Loop 2 (SCR-T06 residual): an off-ball row is dropped when s holds the ball on >= holder_veto_frames of [t_s - holder_veto_s, t_s + holder_veto_s], or when u stands through it (a stop of u
    covers [t_s - still_cover_s, t_s + still_cover_s] and u's peak 5-frame median speed over [t_s - still_pre_s, t_s + still_post_s] is below still_user_mps; or u, who does not pass
    the screener, settles into a non-moving stop that starts within still_cover_s of t_s, lasts past t_s + still_post_s, and his speed stays below still_user_mps from its onset - two
    screeners arriving side by side). These rows are kept aside for veer_screen only.
    Unused and rejected screens are kept as SET rows (CTG under-captures them).
    Mastery r1 (SCR-M1-04): an off-ball row that is not a used screen is kept only when D guards u before t_s (ball_screen_model.offball_*: within
    offball_du_max_m and the joint assignment or the nearest-defender test gives D to u) and u comes within screen_read.reject_approach_m of s; an
    on-ball row that is not a screen only when D is within ball_screen_model.bd_max_m of the handler over [t_s - 1, t_s] (stands next to help defenders
    are not SET rows).
  params:
    set_def_radius_m: {value: 1.5, unit: m}
    pad_s: {value: 0.5, unit: s}
    holder_frac: {value: 0.5, unit: fraction}
    receive_s: {value: 0.3, unit: s, note: 'no SET when s catches the ball within [a - pad_s, b + receive_s] (DHO receiver or catch)'}
    moving_p_min: {value: 0.9, unit: probability, note: 'stop excluded when P(|v| > loose_v_mps) >= this (the moving-screen lower bound); loose=false stops below it stay as low-confidence SETs'}
    on_ball_r_min_m: {value: 3.05, unit: m}
    on_ball_r_max_m: {value: 13.72, unit: m}
    off_ball_upcourt_max_m: {value: 12.19, unit: m}
    frontcourt_y_m: {value: 12.7, unit: m}
    drag_allowance_m: {value: 2.0, unit: m}
    contact_likely_m: {value: 0.8, unit: m}
    contact_possible_m: {value: 1.2, unit: m}
    def_contact_frames: {value: 5, unit: frames, note: 'SCR-T06: D within set_def_radius_m of s on >= this many frames inside the stand [a, b] (was: anywhere in the padded window)'}
    role_reversal_s: {value: 1.0, unit: s, note: 'SCR-T06: row (s, u) dropped when u starts a stand within this time after t_s with median d(u, D_s) <= set_def_radius_m over its first loose_dwell_s (u was running in to screen for s)'}
    holder_veto_s: {value: 0.2, unit: s, note: 'loop 2 (SCR-T06 residual): an off-ball row is dropped when s holds the ball on >= holder_veto_frames frames of [t_s - holder_veto_s, t_s + holder_veto_s]'}
    holder_veto_frames: {value: 5, unit: frames, note: 'loop 2: see holder_veto_s'}
    still_cover_s: {value: 0.5, unit: s, note: 'loop 2 (SCR-T06 residual): an off-ball row is dropped when a stop of u covers [t_s - still_cover_s, t_s + still_cover_s] and u never moves (still_user_mps)'}
    still_pre_s: {value: 0.3, unit: s, note: 'loop 2: start of the user-speed window, before t_s (0.3 vs 1.0: 16 fewer FPs at sigma_p 0.3/0.5 on the tester sweep, no hit lost)'}
    still_post_s: {value: 1.5, unit: s, note: 'loop 2: end of the user-speed window, after t_s'}
    still_user_mps: {value: 1.0, unit: m/s, note: 'loop 2: peak 5-frame median user speed over [t_s - still_pre_s, t_s + still_post_s] below this = the user stood (also required for screen_read reject; the 1.0 m/s moving gate of screen_moment, below screen.user_speed_off_mps 2.0 which gates a use)'}
  min_duration_s: 0.3
  outputs: [screener, intended user, defender, stop interval, dwell_s, v_ls_mps, strict, loose, contact_distance_m (centre-to-centre), contact_class, P_s court_region]
  confidence: {level: medium, p_terms: [p_loose, 'p_below(d_sD_min, set_def_radius_m, sigma_d)', ambiguity_penalty]}
  noise: Clustered bigs and post seals give false SETs (seal rules resolve them); centre-to-centre distance cannot go below about 0.45 m, so 0.80 m is the contact proxy (2 sigma_d).
  conflicts_resolved:
  - "actions_extra 'contact_distance_m <= 0.30' is a surface gap (centre - 0.5 m); centre-to-centre 0.80 m here"
  - CTG own-man exclusion adopted; contact bands made contiguous (check SCR-P01-contact-gap)
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: screener 10-45 ft from the rim}
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/off-ball-screens', supports: off-ball screener no more than 40 ft up-court; unused screens captured at a much lower rate}
  status: canonical
  detector: detect_screen_set
- id: screen
  level: primitive
  name: SCREEN, the canonical screen with STRICT and LOOSE outputs (R-ST-17)
  aliases: [SCREEN, SCR, SCREEN_strict, SCREEN_loose, R-ST-17, R-ST-02]
  research_ids: [SCR-R02]
  actors: {screener: s, user: u, defender: D_u}
  t0: t_s (screen_moment)
  rule: |
    One row per (s, u, t_s) where a SET exists and the user comes to the screen: d_su_ca (ca_median_frames median at the closest approach in [t_s - 0.3, t_s + 1.0], taken over frames where the user moves, the screener stands and the user is not settling into a stand of his own - user_arrive_s; loop 1, SCR-T03) <= d_su_max_m,
    the user is moving there (displacement speed over +-0.3 s >= user_moving_mps; added gate, false-positive budget: adjacent standing teammates in a stack or Detroit
    alignment are not screens for each other) and dist(s, D_u)(t_s) <= set_def_radius_m. Both flags are stored on every row:
    LOOSE = screen_stationarity.loose AND d_su_ca <= d_su_max_m AND D_u within set_def_radius_m at t_s (NULL when stationarity is untestable).
    STRICT = screen_stationarity.strict (|v_LS| <= 0.30 m/s, dwell >= 0.5 s) AND d_su_ca <= d_su_max_m AND user speed at the closest approach >= user_speed_on_mps (on-ball) or
    user_speed_off_mps (off-ball) AND screen_interaction with (d_sD <= strict_contact_m or DEFLECT or DELAY). NULL when stationarity is untestable and every other term holds.
    Reports use STRICT; LOOSE is the sensitivity view. kind = handoff when s handed the ball to u (dho) around the stop, on_ball when u holds the ball on >= 5 of
    the 9 frames around t_s, else off_ball.
    Mastery r1 (0.4.0): the on-ball kind reads the noise-robust possession (ball_screen_model, SCR-M1-01) and a close pitched exchange s -> u within
    ball_screen_model.handoff_s before t_s also makes kind handoff (SCR-M1-06). On-ball rows (stand-based or contact candidates of moving screeners,
    SCR-M1-02) are screens by the ball_screen_model decision (sigma-aware contact on D_h, handler use within use_near_m, plant as a likelihood term;
    SCR-M1-03), not by the 1.2 m centre gate. Off-ball rows are USED screens only (SCR-M1-08): the gate above AND the user comes through (passed, or the
    away use of a fade) at >= user_speed_off_mps at the closest approach (or the peak within +-ball_screen_model.offball_use_win_s of it with an
    interaction with D_u) AND P_s at least ball_screen_model.offball_r_min_m from the rim (SCR-M1-10); unused and rejected off-ball rows stay in
    screen_set / screen_read. Rows whose tracks coincide (ball_screen_model.coincident_*) are dropped (SCR-M1-05).
  params:
    user_arrive_s: {value: 0.5, unit: s, note: 'SCR-T03: the closest approach t_c is taken over frames where the user moves (displacement speed >= screen_moment.tsu_min_speed_mps), the screener stands (t >= a) and the user is not inside, or within user_arrive_s before, a stand of his own'}
    d_su_max_m: {value: 1.2, unit: m}
    strict_contact_m: {value: 1.0, unit: m}
    user_speed_on_mps: {value: 1.0, unit: m/s}
    user_speed_off_mps: {value: 2.0, unit: m/s}
    ca_pre_s: {value: 0.3, unit: s}
    ca_post_s: {value: 1.0, unit: s}
    ca_median_frames: {value: 3, unit: frames, note: 'median around the closest approach (removes the window-minimum bias; 5 frames inflate a sharp V at 5 m/s)'}
    onball_frames: {value: 5, unit: frames of 9}
    user_moving_mps: {value: 1.0, unit: m/s, note: 'displacement speed of the user over +-0.3 s at the closest approach; two standing teammates side by side are not a screen'}
  min_duration_s: 0.3
  outputs: [kind, strict_rule_fired, loose_rule_fired, rule_values_used (v_ls, sigma_win, dwell, d_su_ca, d_sD_min, user_speed), read, interaction, screen_angle_deg, dir_class_generic, location, rescreen_count, p_logit]
  confidence: {level: medium, p_terms: [p_loose, 'p_below(d_su_ca, d_su_max_m, sigma_d)', 'p_below(d_sD(t_s), set_def_radius_m, sigma_d)', ambiguity_penalty]}
  noise: At sigma_p 0.3 strict is NULL (untestable) on typical 0.5-1.5 s stops; a strict NULL rate above 20 % on film means reports need pose or LOOSE + interaction (screen_noise_calibration).
  conflicts_resolved:
  - 1) requirements.md:377 'within about 1 m' kept as prose; numeric value 1.2 m
  - 2) R-ST-02 live text (<0.5 m/s, >=0.3 s, 1.0 m) retired; R-ST-02 cites R-ST-17 (quality_review C7)
  - 3) offense section 0.2 SCREEN_loose (<0.6 m/s, >=0.3 s, 1.2 m) kept as LOOSE
  - 4) offense A0 / A11.18 / motion_starts / screens.yaml:565 (<=0.3 m/s, >=0.5 s, 1.2 m) kept as STRICT
  - 5) set_taxonomy section 0 (2 ft/s, 0.3 s, 4 ft) = LOOSE in feet; superseded
  - defender-test variants unified in screen_interaction; speeds measured on the LS window, never per frame
  - A0 user speed 2.0 m/s kept off-ball only; on-ball 1.0 m/s (handlers slow at the screen)
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/requirements_review/proposals_consolidated.yaml', supports: R-ST-17 / R-ST-02 texts}
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/requirements_review/quality_review.md', supports: C7 resolution}
  - {url: 'https://www.nessis.org/nessis17/Keshri_adj.pdf', supports: 'ball-screen detection from screener speed, screener-defender distance and handler distance; accuracy 0.868 (P 0.94 / R 0.77 on the standard reading of Table 3)'}
  status: canonical
  detector: detect_screen
- id: screen_moment
  level: primitive
  name: Screen moment t_s (single reference frame for offense, defense and legality labels)
  aliases: [screen moment, screening frame, contact time t0, screen_moment_ts_ms]
  research_ids: [SCR-R03]
  actors: {screener: s, defender: D_u, user: u}
  t0: t_s
  rule: |
    Dips of d_sD(t) over [a - pad_s, b + pad_s] (smoothed tracks; [a, b] = SET stop) are local minima <= screen.d_su_max_m separated by a rise of >= screen_window.hyst_m.
    The dip used is the one nearest the user's closest approach to the screener (argmin d_su over frames from the stop onset a on whose displacement speed over
    +-tsu_half_s is >= tsu_min_speed_mps; a trailer running past the handler before he stops is not the use),
    or, when the user never moves (unused screen), the first frame from the stop onset inside the earliest dip's contact window (contact is made while the screener
    stands; a flat dip has no meaningful argmin); a later screen by the same screener is a later stop and a separate row (re-screens through screen_window; CTG: the first
    screen sets the frame). Inside the dip's contact window (contiguous frames with d_sD <= max(dip minimum + dip_band_m, screen_set.set_def_radius_m), the defender
    still engaged) t_s is the frame nearest that closest approach: for a sharp dip this is the argmin of
    d_sD (R-ST-20); for a flat dip (defender parked on the screener) it is the use, which keeps t_s stable under noise and close to CTG's screening frame. If D_u is bridged for
    more than occl_max_s, t_s = argmin d_su and
    t_s_source = user_fallback. DHO: t_s = argmin d(hander, D_receiver) in [t_ex - 0.5, t_ex + 1.0]. Uncertainty = half the dip width. t_su_min is stored for CTG comparison.
  params:
    pad_s: {value: 0.5, unit: s}
    occl_max_s: {value: 0.5, unit: s}
    dip_band_m: {value: 0.4, unit: m, note: 'about 2 sigma_d of smoothed pair distances at sigma_p 0.3'}
    tsu_min_speed_mps: {value: 1.0, unit: m/s, note: 'the user''s closest approach is taken over frames where the user moves (when there are any)'}
    tsu_half_s: {value: 0.3, unit: s, note: 'moving = displacement over [t - 0.3, t + 0.3] s / 0.6 s >= tsu_min_speed_mps (a corner plant does not count as standing)'}
  min_duration_s: null
  outputs: [screen_moment_frame, t_s_source, t_s_uncertainty_s, d_sD_min, t_su_min]
  confidence: {level: high, p_terms: [same as screen_set]}
  noise: A flat minimum (defender attached for 0.5 s) gives up to about +-0.25 s jitter; the dip width is stored.
  conflicts_resolved:
  - R-ST-20 (min screener-defender distance) adopted over offense A3/A4 minimum handler-screener distance, which is stored as t_su_min
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: one screening frame per screen; the first screen sets the frame}
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/requirements_review/proposals_consolidated.yaml', supports: R-ST-20}
  status: canonical
  detector: detect_screen_moment
- id: screen_read
  level: primitive
  name: SCREEN_USE / REJECT / UNUSED and handler reads (snake, split, retreat)
  aliases: [use_screen, use, turn the corner, reject, refuse, unused]
  research_ids: [SCR-P02]
  actors: {user: u, screener: s, defender: D_u}
  t0: t_s
  rule: |
    USE: d_su_ca <= screen.d_su_max_m AND passed (screen_frame) AND blocking (screen_frame) AND user speed at the closest approach >= 1.0 m/s on-ball / 2.0 m/s off-ball.
    REJECT: u comes within reject_approach_m of s in [t_s - 1.0, t_s + 1.5], d_su_ca > d_su_max_m, u does not pass, and u's attack direction (mean velocity over 0.5 s from
    the first frame after t_s - 0.5 at which u moves, displacement speed >= 1.0 m/s) makes >= reject_turn_deg with the direction from u to the screen point. Loop 2: a reject also needs u to move (peak 5-frame median speed over [t_s - screen_set.still_pre_s, t_s + screen_set.still_post_s] >= screen_set.still_user_mps).
    UNUSED: SET exists and neither USE nor REJECT within unused_s.
    Mastery r1 (SCR-M1-03): on-ball USE = d_su_ca <= ball_screen_model.use_near_m, passed with a crossing within max(pass_lateral_m, use_near_m) of P_s,
    blocking or contact, user speed >= 1.0 m/s; on-ball REJECT drops the d_su_ca > d_su_max_m term (a handler who brushes the screener and turns away
    without crossing is a reject). Off-ball away use (SCR-M1-08): 'straight away' = the user-screener distance grows by >= cos(away_use_deg) x |displacement|.
    On-ball extras: SNAKE = USE (the handler crosses the rim->screener line), then he crosses back over it by >= screen_frame.pass_margin_m within snake_s; SPLIT = handler within split_seg_m of segment(D_h, D_s) while they
    are < split_gap_m apart; RETREAT = handler v_r <= -retreat_vr_mps (away from the rim) mean over retreat_s after t_s. Mastery r3 (SCR-M3-07): an on-ball REJECT also needs the handler to travel >= reject_disp_m from h(t_s - 0.5) within [t_s - 0.5, t_s + ball_screen_model.use_disp_post_s]. Precedence: retreat > snake > split > use > reject > unused.
    Exit class (off-ball): curl = end r < r_s - curl_dr_m; fade = exit angle to u->ball > fade_deg; straight otherwise.
  params:
    reject_approach_m: {value: 2.5, unit: m}
    reject_turn_deg: {value: 90.0, unit: deg}
    unused_s: {value: 3.0, unit: s}
    snake_s: {value: 1.5, unit: s}
    split_gap_m: {value: 2.0, unit: m}
    split_seg_m: {value: 0.5, unit: m, note: 'handler within this distance of the D_h-D_s segment (projection 0.15-0.85)'}
    retreat_vr_mps: {value: 1.5, unit: m/s}
    retreat_s: {value: 0.5, unit: s}
    reject_disp_m: {value: 1.5, unit: m, note: 'mastery r3 (SCR-M3-07): an on-ball reject needs the handler to travel at least this far from h(t_s - 0.5) within [t_s - 0.5, t_s + ball_screen_model.use_disp_post_s] (smoothed positions; a standing handler read rejects from speed noise at sigma_p 0.5)'}
    curl_dr_m: {value: 1.0, unit: m}
    fade_deg: {value: 120.0, unit: deg}
  min_duration_s: 0.2
  outputs: [read (use | reject | unused | snake | split | retreat), d_su_ca, t_h, user_speed, exit (curl | straight | fade)]
  confidence: {level: medium, p_terms: ['use: p_close x p_stat', 'reject: p_above(d_su_ca, d_su_max_m, sigma_d) x p_stat', 'unused: p_above(d_su_min, reject_approach_m, sigma_d)']}
  noise: A user at a true 1.5 m passes a window-minimum 1.2 m gate about 31 % of the time at sigma_p 0.3 (check); the 3-frame median at the closest approach removes the min bias.
  conflicts_resolved:
  - between() replaced (check high error); CourtMotion side-crossing kept only as the passed test
  sources:
  - {url: 'https://arxiv.org/pdf/2512.01478', supports: side-crossing use test}
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: handler reads; rejects and unused screens}
  status: canonical
  detector: detect_screen_read
- id: screen_interaction
  level: primitive
  name: Defender interaction (contact proxy, deflection, delay, separation gain)
  aliases: [screen effectiveness, defender deflected or delayed, screen_absorbed]
  research_ids: [SCR-P03]
  actors: {defender: D_u, screener: s, user: u}
  t0: t_s
  rule: |
    Pre window [t_s - 0.6, t_s - 0.1] s, post window [t_s + 0.1, t_s + 0.6] s (MP-13). CONTACT: d_sD(t_s) 5-frame median <= contact_m. DEFLECT: |heading(pre mean v) -
    heading(post mean v)| >= max(deflect_deg, deflect_sigma_k * sigma_heading) with pre speed >= deflect_min_speed_mps. DELAY: |post mean v| <= delay_ratio * |pre mean v| and drop
    >= delay_drop_mps. SEP_GAIN = sep(t_s + 0.7) - sep(t_s - 0.3) (5-frame medians); residual = SEP_GAIN - reaction_lag_s * max(0, user speed gain), fires when >= sep_gain_m.
    interaction = dist(s, D_u)(t_s) <= radius_m AND (CONTACT or DEFLECT or DELAY or residual SEP_GAIN). Continuous: defender_delay_s (time D_u within radius_m of s while
    lambda_u > 0 in [t_s, t_s + 2.0]); detour_m (D_u path length minus chord over [t_s - 0.3, t_s + 0.7]).
  params:
    contact_m: {value: 0.8, unit: m}
    radius_m: {value: 1.5, unit: m}
    deflect_deg: {value: 30.0, unit: deg}
    deflect_sigma_k: {value: 2.5, unit: sigma}
    deflect_min_speed_mps: {value: 2.5, unit: m/s}
    delay_ratio: {value: 0.7, unit: ratio}
    delay_drop_mps: {value: 0.8, unit: m/s}
    sep_gain_m: {value: 0.5, unit: m}
    reaction_lag_s: {value: 0.5, unit: s}
  min_duration_s: 0.5
  outputs: [interaction, contact_class, deflect_deg, delay_ratio, sep_gain_m, residual_sep_gain_m, defender_delay_s, detour_m]
  confidence: {level: medium, p_terms: [screen p terms, 'p_below(d_sD(t_s), radius_m, sigma_d)']}
  noise: Heading noise is about 17 deg on a pre-post difference at 1.5 m/s, hence the 2.5 m/s floor; separation gain is the most robust test (positions only).
  conflicts_resolved:
  - radius 1.5 m (offense section 0.2, motion_starts) kept; A5 1.0 m is the strict contact gate
  - speed drop 30 % (A5) vs 40 % (motion_starts) -> 30 % plus an absolute 0.8 m/s floor
  - DEFLECT floor raised and SEP_GAIN made residual (check SCR-P03-deflect)
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/motion_starts.md', supports: heading change > 30 deg / speed drop within 1.5 m}
  status: canonical
  detector: detect_screen_interaction
- id: screener_post_action
  level: primitive
  name: Screener post-action (roll, short roll, pop to the arc, pop mid)
  aliases: [roll, dive, deep roll, short roll, pop, pick-and-pop, pop mid]
  research_ids: [SCR-P04, SCR-P05]
  actors: {screener: s, user: u}
  t0: t_h (user crosses the screen line); fallback t_s
  rule: |
    After an on-ball screen (or a DHO by the hander), first match in order:
    ROLL: mean v_r over a 15-frame window >= roll_vr_mps starting within roll_start_s after t_h, r <= roll_r_m within roll_window_s of t_s, and min r - r(P_s) <= -roll_dr_m.
    deep_roll flag r <= deep_r_m within 1.5 s; roll_ctg flag r <= 4.27 m (14 ft).
    SHORT_ROLL: min r - r(P_s) <= -short_dr_m and s stands (s2 stand >= 5 frames) or holds the ball inside short_roll_zone (named spot) within roll_window_s.
    POP_ARC: s inside pop_arc_zone (named spot) within roll_window_s, displacement from P_s >= pop_move_m, r never < pop_min_r_m, end r >= r(P_s).
    POP_MID: displacement >= pop_move_m outward and a stand at pop_mid_r_lo_m <= r < pop_mid_r_hi_m within roll_window_s.
  params:
    roll_vr_mps: {value: 1.5, unit: m/s}
    roll_start_s: {value: 1.0, unit: s}
    roll_r_m: {value: 2.5, unit: m}
    roll_window_s: {value: 2.0, unit: s}
    roll_dr_m: {value: 2.0, unit: m}
    deep_r_m: {value: 2.0, unit: m}
    short_dr_m: {value: 1.0, unit: m}
    pop_move_m: {value: 1.5, unit: m}
    pop_min_r_m: {value: 5.5, unit: m}
    pop_mid_r_lo_m: {value: 4.0, unit: m}
    pop_mid_r_hi_m: {value: 6.6, unit: m}
    roll_vr_window_s: {value: 0.5, unit: s, note: 'roll start: mean v_r over this window (15 frames; was hard-coded)'}
    roll_ctg_r_m: {value: 4.27, unit: m, note: 'roll_ctg flag: min r <= 14 ft (CTG roll)'}
    stand_frames: {value: 10, unit: frames, note: 'short roll / pop mid: a stand run of this length'}
    pop_arc_r_m: {value: 6.6, unit: m, note: 'pop_arc p term p_above(r at window end, pop_arc_r_m)'}
  min_duration_s: 0.3
  outputs: [action (roll | short_roll | pop_arc | pop_mid), deep_roll, roll_ctg, min_r, end spot]
  confidence: {level: medium, p_terms: ['roll: p_below(min r, roll_r_m, sigma_p)', 'pop: p_above(end r, 6.6, sigma_p)']}
  noise: Paint occlusion; Kalman bridging over 0.5 s gives roll_unconfirmed via gap_factor.
  conflicts_resolved:
  - A11.18 + motion_starts roll gates combined; F5.4 r < 2 within 1.5 s = deep_roll flag; CTG 14 ft = roll_ctg flag
  - POP and SHORT_ROLL zones = named_spots pop_arc_zone / short_roll_zone; shared with the screener/big-actions family, which owns the canonical definition
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: roll within about 14 ft; pop}
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml', supports: short_roll_zone and pop_arc_zone}
  status: proposal
  detector: detect_screener_post_action
# ======================================================================================
# Ball screens
# ======================================================================================
- id: ball_screen
  level: action
  name: Ball screen (pick-and-roll) with location, direction and the F5 5-tuple
  aliases: [PnR, on-ball screen, pick]
  research_ids: [SCR-A01]
  actors: {screener: s, handler: h, defender: D_h}
  t0: t_s
  rule: |
    A screen (either flag) with kind on_ball. Location = the first zone_scheme:pnr_location label (named_spots pnr_location_*) at the handler's position at his set-up frame (as for direction; loop 1, SCR-T17); when that label is pnr_location_logo but the screen point P_s is not at logo depth, the P_s label is used (loop 2, REG-location: logo only when the screen itself is set at logo depth), else none
    (court_region stored). Direction = ball_screen_to_middle / ball_screen_to_sideline (named_spots, screener position with hx, hy = handler) at the handler's set-up frame:
    the last frame within dir_search_s before t_s with handler speed < dir_setup_speed_mps (else t_s - dir_lead_s); at t_s he is already turning the corner. empty_side = no teammate
    with sign(x) = sign(x_s) and |x| > empty_side_x_m at t_s. Pre-action: sprint_up when the screener's mean speed over [a - 1.0, a] > sprint_up_mps and y(a - 1.0) < sprint_up_y_m.
  params:
    empty_side_x_m: {value: 3.0, unit: m}
    sprint_up_mps: {value: 3.5, unit: m/s}
    sprint_up_y_m: {value: 1.0, unit: m}
    dir_setup_speed_mps: {value: 1.5, unit: m/s, note: 'handler set-up = last frame before t_s slower than this'}
    dir_search_s: {value: 1.5, unit: s}
    dir_lead_s: {value: 0.5, unit: s, note: 'fallback set-up frame t_s - dir_lead_s when the handler never slows'}
  min_duration_s: 0.3
  outputs: [location, direction, empty_side, pre_action, post_action, read, coverage, screen_angle_deg, strict, loose]
  confidence: {level: medium, p_terms: [screen p terms]}
  noise: Handler possession errors misassign u; on-ball needs the holder on >= 5 of 9 frames around t_s.
  conflicts_resolved:
  - F5.1 bands superseded by the named_spots pnr_location partition (no r-free overlaps, check SCR-A01-location)
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml', supports: pnr_location_*, ball_screen_to_middle / _sideline}
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: ball-screen definition}
  status: canonical
  detector: detect_ball_screen
- id: high_ball_screen
  level: action
  name: High PnR (middle / top ball screen)
  aliases: [middle ball screen, top PnR, high pick-and-roll]
  research_ids: [SCR-A02]
  actors: {screener: s, handler: h, defender: D_h}
  t0: t_s
  rule: ball_screen with location pnr_location_high. double_tag = two teammates at |x| > 3.0 m with sign(x) = the handler's exit side at t_s.
  params:
    tag_x_m: {value: 3.0, unit: m}
  min_duration_s: 0.3
  outputs: [as ball_screen, double_tag]
  confidence: {level: medium, p_terms: [screen p terms]}
  noise: The slot/high boundary at m 75 flickers; the label is read once at t_s.
  conflicts_resolved: []
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md', supports: high PnR}
  status: canonical
  detector: detect_high_ball_screen
- id: side_ball_screen
  level: action
  name: Side (wing) PnR
  aliases: [wing PnR, side pick-and-roll]
  research_ids: [SCR-A02]
  actors: {screener: s, handler: h, defender: D_h}
  t0: t_s
  rule: ball_screen with location pnr_location_side. shake = the strong-side corner player (m <= 15 at t_s - 0.5) lifts r by >= shake_dr_m or m by >= shake_dm_deg toward the
    wing in [t_s - 0.5, t_s + 2.0]; empty_side as ball_screen.
  params:
    shake_dr_m: {value: 1.5, unit: m}
    shake_dm_deg: {value: 15.0, unit: deg, note: 'or the corner player lifts by this much in m (corner to wing along the arc keeps r)'}
  min_duration_s: 0.3
  outputs: [as ball_screen, shake, empty_side]
  confidence: {level: medium, p_terms: [screen p terms]}
  noise: as high_ball_screen
  conflicts_resolved: []
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md', supports: side PnR, shake A5.19}
  status: canonical
  detector: detect_side_ball_screen
- id: step_up_screen
  level: action
  name: Step-up screen
  aliases: [step up, sprint-up step-up]
  research_ids: [SCR-A03]
  actors: {screener: s, handler: h, defender: D_h}
  t0: t_s
  rule: |
    ball_screen where: y_s(a - 1.0) <= y_h(t_s) - below_m (arrives from below; a = stop onset, restated from t_s - 1.0 because long stops hide the approach); the screener's mean
    v_y over [a - 1.0, a - 0.1] >= approach_vy_mps; handler location pnr_location_side or pnr_location_slot; handler mean v_y over [t_s, t_s + 1.0] < 0;
    ball_screen_to_sideline at the handler's set-up. n_y (n averaged over n_avg_s at the handler's set-up frame) is stored as the attribute n_y_setup;
    it is no longer a gate (changes_loop1 SCR-T03-stepup).
  params:
    below_m: {value: 1.5, unit: m}
    approach_vy_mps: {value: 1.0, unit: m/s}
    n_avg_s: {value: 0.5, unit: s, note: 'n averaged over [set-up - n_avg_s, set-up] inside the stop'}
  min_duration_s: 0.3
  outputs: [pre_action = step_up, screener start spot, delta_y_approach]
  confidence: {level: medium, p_terms: [screen p terms]}
  noise: A sprint-up from the block also arrives from below; both flags may be true.
  conflicts_resolved:
  - approach window anchored on the stop onset (proposal)
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md', supports: step-up F5.3}
  status: canonical
  detector: detect_step_up_screen
- id: flip_screen
  level: action
  name: Flip (screener changes side before contact)
  aliases: [flip, flip the screen]
  research_ids: [SCR-A04]
  actors: {screener: s, handler: h, defender: D_h}
  t0: t_s
  rule: |
    ball_screen where l(t) = signed offset of s from the line (handler at its set-up frame) -> rim (5-frame mean) has the opposite sign before the set: the pre-flip
    frame is the frame of largest |l| on the other side within [a - window_s, set-up], taken among runs of >= show_frames consecutive frames with |l| >= min_offset_m, s within max_sh_m of h and screener speed < show_speed_mps (a show; loop 1, SCR-T09 - a run-past is not a flip); |l| >= min_offset_m there and over the last 5 frames
    before the set-up; the direction labels (ball_screen_to_middle / _sideline) at the pre-flip and set-up frames both exist and differ. Pose option (shoulders
    rotate > 60 deg) needs pose.
  params:
    window_s: {value: 1.5, unit: s}
    min_offset_m: {value: 0.4, unit: m}
    max_sh_m: {value: 2.0, unit: m}
    show_frames: {value: 6, unit: frames, note: 'SCR-T09: the first side needs >= show_frames consecutive frames with |offset| >= min_offset_m, d(s, h) <= max_sh_m and screener speed < show_speed_mps (a show, not a run-past). V0 sigma_p 0.3: real flips give 9-28 such frames, run-throughs 0'}
    show_speed_mps: {value: 3.0, unit: m/s, note: 'tester proposed 9 frames at 2.0 m/s; that dropped flip recall 0.95 -> 0.30 on the tester scenes (CA-RTS speed is biased up near a plant)'}
  min_duration_s: 0.3
  outputs: [flip, offset trajectory]
  confidence: {level: low-medium, p_terms: [screen p terms, 'p_above(|l_pre|, min_offset_m, sigma_p) x p_above(|l_post|, min_offset_m, sigma_p)']}
  noise: Offset noise about 0.4 m; the label change plus both margins are required.
  conflicts_resolved: []
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md', supports: flip (repo definition; no external one found)}
  status: proposal
  detector: detect_flip_screen
- id: re_screen
  level: action
  name: Re-screen (second screen by the same screener for the same handler)
  aliases: [re-screen, rescreen, twist]
  research_ids: [SCR-A04, SCR-R05]
  actors: {screener: s, handler: h, defender: D_h}
  t0: t_s of the second screen
  rule: |
    A ball screen that follows an earlier on-ball SET row (used or not) of the same (s, h) with t_s2 - t_s1 in (screen_window.dedupe_s, screen_window.window_s]. merged = not split by screen_window; rescreen_opposite when
    the direction label flips, rescreen_same otherwise; trigger = under (D_h went under on the first) or reject (handler rejected the first). TWIST = two ball screens by
    different screeners from opposite directions within twist_s (attribute twist_with).
  params:
    twist_s: {value: 2.0, unit: s}
  min_duration_s: 0.3
  outputs: [rescreen_of, merged, rescreen_side, trigger, twist_with]
  confidence: {level: low-medium, p_terms: [second screen p terms]}
  noise: Relies on two separate stops; a screener who drifts without a second stop is merged.
  conflicts_resolved:
  - F5.2 'same pair, second screen <= 3 s' kept; CTG merge/split decides the row
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: re-screen split at 4 ft / 10 ft}
  status: canonical
  detector: detect_re_screen
- id: slip_screen
  level: action
  name: Slip (screener leaves for the rim before a full screen) with touch flag
  aliases: [slip, slip the screen, touch]
  research_ids: [SCR-A05]
  actors: {screener: s, handler: h, defender: D_h}
  t0: t_a (closest approach of s to D_h)
  rule: |
    APPROACH: holder h; s (not the holder) with d(s, h) <= approach_h_m or d(s, D_h) <= approach_d_m at t_a = local argmin d(s, D_h) (or d(s, h) when D_h is unknown), and
    the screener's own velocity toward h >= approach_speed_mps over [t_a - 1.0, t_a - 0.1]; not a handoff approach (h heading within 30 deg of s with speed >= 1.0 m/s);
    no strict-length stand (>= 0.5 s) within [t_a - 0.5, t_a + 0.5], none ending within after_stop_s before t_a, and no screen row (s, h) with t_s in [t_a - after_screen_s, t_a] (loop 1, SCR-T11 - post-screen movement is not a new approach); s does not receive the ball within [t_a - 0.5, t_a + 1.0]; the pair is not a fake_dho
    approach (h bringing the ball to s) within 1.0 s.
    SLIP: r(t + 0.5 s) - r(t) <= -slip_dr_m for a start t in [t_a - 0.5, t_a + slip_start_max_s], and r <= slip_r_m within slip_window_s of t_a. quick = loose
    stationarity never fired near t_a; slow = a stop of 0.3-0.5 s with loose = true (CTG quick/slow). TOUCH flag = d_sD(t_a) <= 0.8 (contact duration < 0.2 s is pose-only).
  params:
    approach_h_m: {value: 2.0, unit: m}
    approach_d_m: {value: 1.5, unit: m}
    approach_speed_mps: {value: 1.0, unit: m/s}
    slip_dr_m: {value: 1.0, unit: m}
    slip_start_max_s: {value: 0.5, unit: s}
    slip_r_m: {value: 3.0, unit: m}
    slip_window_s: {value: 1.5, unit: s}
    after_stop_s: {value: 1.5, unit: s, note: 'SCR-T11: no approach at t when s ended a stand of >= strict_dwell_s within this time before t (post-screen movement)'}
    after_screen_s: {value: 2.0, unit: s, note: 'SCR-T11: or s screened h (screen row) within this time before t'}
  min_duration_s: 0.3
  outputs: [slip_type (quick | slow), touch, peak v_r, dwell before exit]
  confidence: {level: medium, p_terms: ['p_below(min r, slip_r_m, sigma_p)', 'p_below(d(s,h) or d(s,D_h) at t_a, approach gate, sigma_d)']}
  noise: The 0.3-0.5 s dwell sits where stationarity is least testable; the displacement test (1.0 m in 15 frames) is about 4 sigma at sigma_p 0.3.
  conflicts_resolved:
  - SLIP dwell A0 < 0.5 s vs F5.4 < 0.3 s -> < 0.5 s with quick/slow sub-flags
  - SLIP speed A0 v_r <= -2.0 vs motion_starts >= 3 m/s -> 2.0 m/s as displacement (check SCR-A05-slip)
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: slips (quick / slow)}
  status: canonical
  detector: detect_slip_screen
- id: ghost_screen
