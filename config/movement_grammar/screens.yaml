  rule: |
    PIN_DOWN = down_screen where the user starts low (y_u <= low_y_m at the user's set-up, or r_u <= low_r_m). WIDE_PIN_DOWN (checked first) = off-ball screen with
    n_y <= wide_n_y_max, user start
    m <= wide_user_m_max and r >= wide_user_r_min_m, screener arrived from above (y(a) - y(a - 1.5) <= -wide_arrive_dy_m) and P_s at wide_ps_r_lo_m..wide_ps_r_hi_m with
    m wide_ps_m_lo..wide_ps_m_hi (wide_pin_screen_spot capture stored). high_screen_point attribute = a pin_down with P_s m > wide_ps_m_hi (loop 1, SCR-T18 - was the geometry other_pin_down, which flipped under noise at m = 40 deg).
  params:
    wide_n_y_max: {value: -0.3, unit: unit-vector component, note: 'the defender is pinned below the screener (n_y); n_r cannot express below at m 15-40 (straight down has n_r = -sin m)'}
    low_y_m: {value: 1.8, unit: m}
    low_r_m: {value: 3.0, unit: m}
    wide_user_m_max: {value: 25.0, unit: deg}
    wide_user_r_min_m: {value: 6.0, unit: m}
