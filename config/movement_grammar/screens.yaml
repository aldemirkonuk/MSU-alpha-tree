- id: screen_set
  level: primitive
  name: SCREEN_SET (screener stops near a teammate's defender)
  aliases: [set_screen, screen_set, set a screen]
  research_ids: [SCR-P01]
  actors: {screener: s, defender: D_u, user: u (intended)}
  t0: stop onset a
  rule: |
    Fires for s on its stand interval [a, b] (screen_stationarity) when: s does not catch the ball within [a - pad_s, b + receive_s]; the stop is not confidently moving (P(|v| > loose_v_mps) < moving_p_min; the loose
    flag itself is reported, and p_loose enters the confidence); s is not the holder on >= holder_frac of the stop; a defender D whose frozen matchup
    (screen_target_defender) is a teammate u != s is within set_def_radius_m of s on >= def_contact_frames frames of the stand [a, b] (loop 1, SCR-T06 - was anywhere in [a - pad_s, b + pad_s]); the row is not role-reversed (u does not start a stand of his own, without the ball, within role_reversal_s after t_s with median d(u, D_s) <= set_def_radius_m - u was running in to screen for s); s is in bounds; for on-ball screens r_s in
    [on_ball_r_min_m, on_ball_r_max_m] (CTG 10-45 ft); for off-ball screens y_s - y_ball <= off_ball_upcourt_max_m (CTG 40 ft); y_s <= frontcourt_y_m + drag_allowance_m.
    Contact class from the 5-frame median of d_sD at t_s: likely <= contact_likely_m, possible <= contact_possible_m, unlikely <= set_def_radius_m, none above.
    Loop 2 (SCR-T06 residual): an off-ball row is dropped when s holds the ball on >= holder_veto_frames of [t_s - holder_veto_s, t_s + holder_veto_s], or when u stands through it (a stop of u
    covers [t_s - still_cover_s, t_s + still_cover_s] and u's peak 5-frame median speed over [t_s - still_pre_s, t_s + still_post_s] is below still_user_mps; or u, who does not pass
    the screener, settles into a non-moving stop that starts within still_cover_s of t_s, lasts past t_s + still_post_s, and his speed stays below still_user_mps from its onset - two
    screeners arriving side by side). These rows are kept aside for veer_screen only.
    Unused and rejected screens are kept as SET rows (CTG under-captures them).
  params:
    set_def_radius_m: {value: 1.5, unit: m}
    pad_s: {value: 0.5, unit: s}
    holder_frac: {value: 0.5, unit: fraction}
    receive_s: {value: 0.3, unit: s, note: 'no SET when s catches the ball within [a - pad_s, b + receive_s] (DHO receiver or catch)'}
    moving_p_min: {value: 0.9, unit: probability, note: 'stop excluded when P(|v| > loose_v_mps) >= this (the moving-screen lower bound); loose=false stops below it stay as low-confidence SETs'}
    on_ball_r_min_m: {value: 3.05, unit: m}
    on_ball_r_max_m: {value: 13.72, unit: m}
    off_ball_upcourt_max_m: {value: 12.19, unit: m}
    frontcourt_y_m: {value: 12.7, unit: m}
    drag_allowance_m: {value: 2.0, unit: m}
    contact_likely_m: {value: 0.8, unit: m}
    contact_possible_m: {value: 1.2, unit: m}
    def_contact_frames: {value: 5, unit: frames, note: 'SCR-T06: D within set_def_radius_m of s on >= this many frames inside the stand [a, b] (was: anywhere in the padded window)'}
    role_reversal_s: {value: 1.0, unit: s, note: 'SCR-T06: row (s, u) dropped when u starts a stand within this time after t_s with median d(u, D_s) <= set_def_radius_m over its first loose_dwell_s (u was running in to screen for s)'}
    holder_veto_s: {value: 0.2, unit: s, note: 'loop 2 (SCR-T06 residual): an off-ball row is dropped when s holds the ball on >= holder_veto_frames frames of [t_s - holder_veto_s, t_s + holder_veto_s]'}
    holder_veto_frames: {value: 5, unit: frames, note: 'loop 2: see holder_veto_s'}
    still_cover_s: {value: 0.5, unit: s, note: 'loop 2 (SCR-T06 residual): an off-ball row is dropped when a stop of u covers [t_s - still_cover_s, t_s + still_cover_s] and u never moves (still_user_mps)'}
    still_pre_s: {value: 0.3, unit: s, note: 'loop 2: start of the user-speed window, before t_s (0.3 vs 1.0: 16 fewer FPs at sigma_p 0.3/0.5 on the tester sweep, no hit lost)'}
    still_post_s: {value: 1.5, unit: s, note: 'loop 2: end of the user-speed window, after t_s'}
    still_user_mps: {value: 1.0, unit: m/s, note: 'loop 2: peak 5-frame median user speed over [t_s - still_pre_s, t_s + still_post_s] below this = the user stood (also required for screen_read reject; the 1.0 m/s moving gate of screen_moment, below screen.user_speed_off_mps 2.0 which gates a use)'}
  min_duration_s: 0.3
  outputs: [screener, intended user, defender, stop interval, dwell_s, v_ls_mps, strict, loose, contact_distance_m (centre-to-centre), contact_class, P_s court_region]
  confidence: {level: medium, p_terms: [p_loose, 'p_below(d_sD_min, set_def_radius_m, sigma_d)', ambiguity_penalty]}
  noise: Clustered bigs and post seals give false SETs (seal rules resolve them); centre-to-centre distance cannot go below about 0.45 m, so 0.80 m is the contact proxy (2 sigma_d).
  conflicts_resolved:
  - "actions_extra 'contact_distance_m <= 0.30' is a surface gap (centre - 0.5 m); centre-to-centre 0.80 m here"
  - CTG own-man exclusion adopted; contact bands made contiguous (check SCR-P01-contact-gap)
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: screener 10-45 ft from the rim}
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/off-ball-screens', supports: off-ball screener no more than 40 ft up-court; unused screens captured at a much lower rate}
  status: canonical
  detector: detect_screen_set
- id: screen
  level: primitive
  name: SCREEN, the canonical screen with STRICT and LOOSE outputs (R-ST-17)
  aliases: [SCREEN, SCR, SCREEN_strict, SCREEN_loose, R-ST-17, R-ST-02]
  research_ids: [SCR-R02]
  actors: {screener: s, user: u, defender: D_u}
  t0: t_s (screen_moment)
  rule: |
    One row per (s, u, t_s) where a SET exists and the user comes to the screen: d_su_ca (ca_median_frames median at the closest approach in [t_s - 0.3, t_s + 1.0], taken over frames where the user moves, the screener stands and the user is not settling into a stand of his own - user_arrive_s; loop 1, SCR-T03) <= d_su_max_m,
    the user is moving there (displacement speed over +-0.3 s >= user_moving_mps; added gate, false-positive budget: adjacent standing teammates in a stack or Detroit
    alignment are not screens for each other) and dist(s, D_u)(t_s) <= set_def_radius_m. Both flags are stored on every row:
    LOOSE = screen_stationarity.loose AND d_su_ca <= d_su_max_m AND D_u within set_def_radius_m at t_s (NULL when stationarity is untestable).
    STRICT = screen_stationarity.strict (|v_LS| <= 0.30 m/s, dwell >= 0.5 s) AND d_su_ca <= d_su_max_m AND user speed at the closest approach >= user_speed_on_mps (on-ball) or
    user_speed_off_mps (off-ball) AND screen_interaction with (d_sD <= strict_contact_m or DEFLECT or DELAY). NULL when stationarity is untestable and every other term holds.
    Reports use STRICT; LOOSE is the sensitivity view. kind = handoff when s handed the ball to u (dho) around the stop, on_ball when u holds the ball on >= 5 of
    the 9 frames around t_s, else off_ball.
  params:
    user_arrive_s: {value: 0.5, unit: s, note: 'SCR-T03: the closest approach t_c is taken over frames where the user moves (displacement speed >= screen_moment.tsu_min_speed_mps), the screener stands (t >= a) and the user is not inside, or within user_arrive_s before, a stand of his own'}
    d_su_max_m: {value: 1.2, unit: m}
    strict_contact_m: {value: 1.0, unit: m}
    user_speed_on_mps: {value: 1.0, unit: m/s}
    user_speed_off_mps: {value: 2.0, unit: m/s}
    ca_pre_s: {value: 0.3, unit: s}
    ca_post_s: {value: 1.0, unit: s}
    ca_median_frames: {value: 3, unit: frames, note: 'median around the closest approach (removes the window-minimum bias; 5 frames inflate a sharp V at 5 m/s)'}
    onball_frames: {value: 5, unit: frames of 9}
    user_moving_mps: {value: 1.0, unit: m/s, note: 'displacement speed of the user over +-0.3 s at the closest approach; two standing teammates side by side are not a screen'}
  min_duration_s: 0.3
  outputs: [kind, strict_rule_fired, loose_rule_fired, rule_values_used (v_ls, sigma_win, dwell, d_su_ca, d_sD_min, user_speed), read, interaction, screen_angle_deg, dir_class_generic, location, rescreen_count, p_logit]
  confidence: {level: medium, p_terms: [p_loose, 'p_below(d_su_ca, d_su_max_m, sigma_d)', 'p_below(d_sD(t_s), set_def_radius_m, sigma_d)', ambiguity_penalty]}
  noise: At sigma_p 0.3 strict is NULL (untestable) on typical 0.5-1.5 s stops; a strict NULL rate above 20 % on film means reports need pose or LOOSE + interaction (screen_noise_calibration).
  conflicts_resolved:
  - 1) requirements.md:377 'within about 1 m' kept as prose; numeric value 1.2 m
  - 2) R-ST-02 live text (<0.5 m/s, >=0.3 s, 1.0 m) retired; R-ST-02 cites R-ST-17 (quality_review C7)
