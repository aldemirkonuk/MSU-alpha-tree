- id: screen_moment
  level: primitive
  name: Screen moment t_s (single reference frame for offense, defense and legality labels)
  aliases: [screen moment, screening frame, contact time t0, screen_moment_ts_ms]
  research_ids: [SCR-R03]
  actors: {screener: s, defender: D_u, user: u}
  t0: t_s
  rule: |
    Dips of d_sD(t) over [a - pad_s, b + pad_s] (smoothed tracks; [a, b] = SET stop) are local minima <= screen.d_su_max_m separated by a rise of >= screen_window.hyst_m.
    The dip used is the one nearest the user's closest approach to the screener (argmin d_su over frames from the stop onset a on whose displacement speed over
    +-tsu_half_s is >= tsu_min_speed_mps; a trailer running past the handler before he stops is not the use),
    or, when the user never moves (unused screen), the first frame from the stop onset inside the earliest dip's contact window (contact is made while the screener
    stands; a flat dip has no meaningful argmin); a later screen by the same screener is a later stop and a separate row (re-screens through screen_window; CTG: the first
    screen sets the frame). Inside the dip's contact window (contiguous frames with d_sD <= max(dip minimum + dip_band_m, screen_set.set_def_radius_m), the defender
    still engaged) t_s is the frame nearest that closest approach: for a sharp dip this is the argmin of
    d_sD (R-ST-20); for a flat dip (defender parked on the screener) it is the use, which keeps t_s stable under noise and close to CTG's screening frame. If D_u is bridged for
    more than occl_max_s, t_s = argmin d_su and
    t_s_source = user_fallback. DHO: t_s = argmin d(hander, D_receiver) in [t_ex - 0.5, t_ex + 1.0]. Uncertainty = half the dip width. t_su_min is stored for CTG comparison.
  params:
    pad_s: {value: 0.5, unit: s}
    occl_max_s: {value: 0.5, unit: s}
    dip_band_m: {value: 0.4, unit: m, note: 'about 2 sigma_d of smoothed pair distances at sigma_p 0.3'}
    tsu_min_speed_mps: {value: 1.0, unit: m/s, note: 'the user''s closest approach is taken over frames where the user moves (when there are any)'}
    tsu_half_s: {value: 0.3, unit: s, note: 'moving = displacement over [t - 0.3, t + 0.3] s / 0.6 s >= tsu_min_speed_mps (a corner plant does not count as standing)'}
  min_duration_s: null
  outputs: [screen_moment_frame, t_s_source, t_s_uncertainty_s, d_sD_min, t_su_min]
  confidence: {level: high, p_terms: [same as screen_set]}
  noise: A flat minimum (defender attached for 0.5 s) gives up to about +-0.25 s jitter; the dip width is stored.
  conflicts_resolved:
  - R-ST-20 (min screener-defender distance) adopted over offense A3/A4 minimum handler-screener distance, which is stored as t_su_min
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: one screening frame per screen; the first screen sets the frame}
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/requirements_review/proposals_consolidated.yaml', supports: R-ST-20}
  status: canonical
  detector: detect_screen_moment
- id: screen_read
  level: primitive
  name: SCREEN_USE / REJECT / UNUSED and handler reads (snake, split, retreat)
  aliases: [use_screen, use, turn the corner, reject, refuse, unused]
  research_ids: [SCR-P02]
  actors: {user: u, screener: s, defender: D_u}
  t0: t_s
  rule: |
    USE: d_su_ca <= screen.d_su_max_m AND passed (screen_frame) AND blocking (screen_frame) AND user speed at the closest approach >= 1.0 m/s on-ball / 2.0 m/s off-ball.
    REJECT: u comes within reject_approach_m of s in [t_s - 1.0, t_s + 1.5], d_su_ca > d_su_max_m, u does not pass, and u's attack direction (mean velocity over 0.5 s from
    the first frame after t_s - 0.5 at which u moves, displacement speed >= 1.0 m/s) makes >= reject_turn_deg with the direction from u to the screen point. Loop 2: a reject also needs u to move (peak 5-frame median speed over [t_s - screen_set.still_pre_s, t_s + screen_set.still_post_s] >= screen_set.still_user_mps).
    UNUSED: SET exists and neither USE nor REJECT within unused_s.
    On-ball extras: SNAKE = USE (the handler crosses the rim->screener line), then he crosses back over it by >= screen_frame.pass_margin_m within snake_s; SPLIT = handler within split_seg_m of segment(D_h, D_s) while they
    are < split_gap_m apart; RETREAT = handler v_r <= -retreat_vr_mps (away from the rim) mean over retreat_s after t_s. Precedence: retreat > snake > split > use > reject > unused.
    Exit class (off-ball): curl = end r < r_s - curl_dr_m; fade = exit angle to u->ball > fade_deg; straight otherwise.
  params:
    reject_approach_m: {value: 2.5, unit: m}
    reject_turn_deg: {value: 90.0, unit: deg}
    unused_s: {value: 3.0, unit: s}
    snake_s: {value: 1.5, unit: s}
    split_gap_m: {value: 2.0, unit: m}
    split_seg_m: {value: 0.5, unit: m, note: 'handler within this distance of the D_h-D_s segment (projection 0.15-0.85)'}
    retreat_vr_mps: {value: 1.5, unit: m/s}
    retreat_s: {value: 0.5, unit: s}
    curl_dr_m: {value: 1.0, unit: m}
    fade_deg: {value: 120.0, unit: deg}
  min_duration_s: 0.2
  outputs: [read (use | reject | unused | snake | split | retreat), d_su_ca, t_h, user_speed, exit (curl | straight | fade)]
  confidence: {level: medium, p_terms: ['use: p_close x p_stat', 'reject: p_above(d_su_ca, d_su_max_m, sigma_d) x p_stat', 'unused: p_above(d_su_min, reject_approach_m, sigma_d)']}
  noise: A user at a true 1.5 m passes a window-minimum 1.2 m gate about 31 % of the time at sigma_p 0.3 (check); the 3-frame median at the closest approach removes the min bias.
  conflicts_resolved:
  - between() replaced (check high error); CourtMotion side-crossing kept only as the passed test
  sources:
  - {url: 'https://arxiv.org/pdf/2512.01478', supports: side-crossing use test}
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: handler reads; rejects and unused screens}
  status: canonical
  detector: detect_screen_read
- id: screen_interaction
  level: primitive
  name: Defender interaction (contact proxy, deflection, delay, separation gain)
  aliases: [screen effectiveness, defender deflected or delayed, screen_absorbed]
  research_ids: [SCR-P03]
  actors: {defender: D_u, screener: s, user: u}
  t0: t_s
  rule: |
    Pre window [t_s - 0.6, t_s - 0.1] s, post window [t_s + 0.1, t_s + 0.6] s (MP-13). CONTACT: d_sD(t_s) 5-frame median <= contact_m. DEFLECT: |heading(pre mean v) -
    heading(post mean v)| >= max(deflect_deg, deflect_sigma_k * sigma_heading) with pre speed >= deflect_min_speed_mps. DELAY: |post mean v| <= delay_ratio * |pre mean v| and drop
    >= delay_drop_mps. SEP_GAIN = sep(t_s + 0.7) - sep(t_s - 0.3) (5-frame medians); residual = SEP_GAIN - reaction_lag_s * max(0, user speed gain), fires when >= sep_gain_m.
    interaction = dist(s, D_u)(t_s) <= radius_m AND (CONTACT or DEFLECT or DELAY or residual SEP_GAIN). Continuous: defender_delay_s (time D_u within radius_m of s while
    lambda_u > 0 in [t_s, t_s + 2.0]); detour_m (D_u path length minus chord over [t_s - 0.3, t_s + 0.7]).
  params:
    contact_m: {value: 0.8, unit: m}
    radius_m: {value: 1.5, unit: m}
    deflect_deg: {value: 30.0, unit: deg}
    deflect_sigma_k: {value: 2.5, unit: sigma}
    deflect_min_speed_mps: {value: 2.5, unit: m/s}
    delay_ratio: {value: 0.7, unit: ratio}
    delay_drop_mps: {value: 0.8, unit: m/s}
    sep_gain_m: {value: 0.5, unit: m}
    reaction_lag_s: {value: 0.5, unit: s}
  min_duration_s: 0.5
  outputs: [interaction, contact_class, deflect_deg, delay_ratio, sep_gain_m, residual_sep_gain_m, defender_delay_s, detour_m]
  confidence: {level: medium, p_terms: [screen p terms, 'p_below(d_sD(t_s), radius_m, sigma_d)']}
  noise: Heading noise is about 17 deg on a pre-post difference at 1.5 m/s, hence the 2.5 m/s floor; separation gain is the most robust test (positions only).
  conflicts_resolved:
  - radius 1.5 m (offense section 0.2, motion_starts) kept; A5 1.0 m is the strict contact gate
  - speed drop 30 % (A5) vs 40 % (motion_starts) -> 30 % plus an absolute 0.8 m/s floor
  - DEFLECT floor raised and SEP_GAIN made residual (check SCR-P03-deflect)
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/motion_starts.md', supports: heading change > 30 deg / speed drop within 1.5 m}
  status: canonical
  detector: detect_screen_interaction
- id: screener_post_action
  level: primitive
  name: Screener post-action (roll, short roll, pop to the arc, pop mid)
  aliases: [roll, dive, deep roll, short roll, pop, pick-and-pop, pop mid]
  research_ids: [SCR-P04, SCR-P05]
  actors: {screener: s, user: u}
  t0: t_h (user crosses the screen line); fallback t_s
  rule: |
    After an on-ball screen (or a DHO by the hander), first match in order:
    ROLL: mean v_r over a 15-frame window >= roll_vr_mps starting within roll_start_s after t_h, r <= roll_r_m within roll_window_s of t_s, and min r - r(P_s) <= -roll_dr_m.
    deep_roll flag r <= deep_r_m within 1.5 s; roll_ctg flag r <= 4.27 m (14 ft).
    SHORT_ROLL: min r - r(P_s) <= -short_dr_m and s stands (s2 stand >= 5 frames) or holds the ball inside short_roll_zone (named spot) within roll_window_s.
    POP_ARC: s inside pop_arc_zone (named spot) within roll_window_s, displacement from P_s >= pop_move_m, r never < pop_min_r_m, end r >= r(P_s).
    POP_MID: displacement >= pop_move_m outward and a stand at pop_mid_r_lo_m <= r < pop_mid_r_hi_m within roll_window_s.
  params:
    roll_vr_mps: {value: 1.5, unit: m/s}
    roll_start_s: {value: 1.0, unit: s}
    roll_r_m: {value: 2.5, unit: m}
    roll_window_s: {value: 2.0, unit: s}
    roll_dr_m: {value: 2.0, unit: m}
    deep_r_m: {value: 2.0, unit: m}
    short_dr_m: {value: 1.0, unit: m}
    pop_move_m: {value: 1.5, unit: m}
    pop_min_r_m: {value: 5.5, unit: m}
    pop_mid_r_lo_m: {value: 4.0, unit: m}
    pop_mid_r_hi_m: {value: 6.6, unit: m}
    roll_vr_window_s: {value: 0.5, unit: s, note: 'roll start: mean v_r over this window (15 frames; was hard-coded)'}
    roll_ctg_r_m: {value: 4.27, unit: m, note: 'roll_ctg flag: min r <= 14 ft (CTG roll)'}
    stand_frames: {value: 10, unit: frames, note: 'short roll / pop mid: a stand run of this length'}
    pop_arc_r_m: {value: 6.6, unit: m, note: 'pop_arc p term p_above(r at window end, pop_arc_r_m)'}
  min_duration_s: 0.3
  outputs: [action (roll | short_roll | pop_arc | pop_mid), deep_roll, roll_ctg, min_r, end spot]
  confidence: {level: medium, p_terms: ['roll: p_below(min r, roll_r_m, sigma_p)', 'pop: p_above(end r, 6.6, sigma_p)']}
  noise: Paint occlusion; Kalman bridging over 0.5 s gives roll_unconfirmed via gap_factor.
  conflicts_resolved:
  - A11.18 + motion_starts roll gates combined; F5.4 r < 2 within 1.5 s = deep_roll flag; CTG 14 ft = roll_ctg flag
  - POP and SHORT_ROLL zones = named_spots pop_arc_zone / short_roll_zone; shared with the screener/big-actions family, which owns the canonical definition
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: roll within about 14 ft; pop}
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml', supports: short_roll_zone and pop_arc_zone}
  status: proposal
  detector: detect_screener_post_action
