- id: blind_screen_hint
  level: rule
  name: Blind screen, too-close-to-moving-opponent and boundary-parallel legality hints (Rule 4-35.3 / 4-35.7)
  aliases: [blind screen, 4-35.3, 4-35.7]
  research_ids: [SCR-L02]
  actors: {screener: s, defender: D_u}
  t0: SET stop onset a
  rule: |
    Facing of D_u at a: heading if speed >= facing_speed_mps, else unit(midpoint(u, ball) - D_u). BLIND = p_above(angle(facing, D_u -> s), blind_deg, sigma_angle) >= blind_p_min with sigma_angle = degrees(sigma_d / d(s, D_u)(a)) x sqrt(2) (loop 1, SCR-T14 - was a point test at 90 deg).
    contact_likely here = 5-frame median d(s, D_u) <= 0.80 m at the stop onset or at t_s.
    BLIND_NO_STEP: blind, D_u speed < facing_speed_mps, d(s, D_u)(a) < step_m, contact_likely.
    TOO_CLOSE_MOVING: blind, D_u speed >= facing_speed_mps, d(s, D_u)(a) < step_m + stride_s * closing speed, contact_likely.
    BOUNDARY_PARALLEL: two screeners in screen_boundary_6ft_band (named spot), mutual distance <= mutual_m, joining line within parallel_deg of the boundary, contact_likely.
  params:
    facing_speed_mps: {value: 1.0, unit: m/s}
    blind_deg: {value: 120.0, unit: deg, note: 'loop 1 SCR-T14: was 90; human visual field about +-100-120 deg; gated by probability (blind_p_min)'}
    step_m: {value: 0.9, unit: m, note: 'unverified (Rule 4-35.3.a says only ''a normal step'')'}
    stride_s: {value: 0.5, unit: s}
    parallel_deg: {value: 20.0, unit: deg}
    blind_p_min: {value: 0.8, unit: probability, note: 'SCR-T14: p_above(facing angle, blind_deg, sigma_angle) >= this, sigma_angle = degrees(sigma_d / d(s, D)(a)) x sqrt(2)'}
    mutual_m: {value: 1.2, unit: m, note: 'boundary-parallel pair distance (was hard-coded)'}
  min_duration_s: null
  outputs: [hint (blind_no_step | too_close_moving | boundary_parallel), blind, facing_deg]
  confidence: {level: low, p_terms: ['p_below(d(s, D_u)(a), step_m, sigma_d)', 'p_below(d_sD(t_s), 0.8, sigma_d)']}
  noise: Facing from velocity is unreliable for slow defenders; pose improves it.
  conflicts_resolved:
  - A5 blind spacing 0.7-1.0 m vs fouls.yaml 0.9 m -> 0.9 m, flagged unverified
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/rules/PRMBB_RulesBook.pdf', supports: Rule 4-35.3 blind screens and 4-35.7}
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml', supports: screen_boundary_6ft_band}
  status: proposal
  detector: detect_blind_screen_hint
