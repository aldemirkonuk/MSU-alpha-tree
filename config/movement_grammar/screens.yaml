- id: ball_screen
  level: action
  name: Ball screen (pick-and-roll) with location, direction and the F5 5-tuple
  aliases: [PnR, on-ball screen, pick]
  research_ids: [SCR-A01]
  actors: {screener: s, handler: h, defender: D_h}
  t0: t_s
  rule: |
    A screen (either flag) with kind on_ball. Location = the first zone_scheme:pnr_location label (named_spots pnr_location_*) at the handler's position at his set-up frame (as for direction; loop 1, SCR-T17); when that label is pnr_location_logo but the screen point P_s is not at logo depth, the P_s label is used (loop 2, REG-location: logo only when the screen itself is set at logo depth), else none
    (court_region stored). Direction = ball_screen_to_middle / ball_screen_to_sideline (named_spots, screener position with hx, hy = handler) at the handler's set-up frame:
    the last frame within dir_search_s before t_s with handler speed < dir_setup_speed_mps (else t_s - dir_lead_s); at t_s he is already turning the corner. empty_side = no teammate
    with sign(x) = sign(x_s) and |x| > empty_side_x_m at t_s. Pre-action: sprint_up when the screener's mean speed over [a - 1.0, a] > sprint_up_mps and y(a - 1.0) < sprint_up_y_m.
  params:
    empty_side_x_m: {value: 3.0, unit: m}
    sprint_up_mps: {value: 3.5, unit: m/s}
    sprint_up_y_m: {value: 1.0, unit: m}
    dir_setup_speed_mps: {value: 1.5, unit: m/s, note: 'handler set-up = last frame before t_s slower than this'}
    dir_search_s: {value: 1.5, unit: s}
    dir_lead_s: {value: 0.5, unit: s, note: 'fallback set-up frame t_s - dir_lead_s when the handler never slows'}
  min_duration_s: 0.3
  outputs: [location, direction, empty_side, pre_action, post_action, read, coverage, screen_angle_deg, strict, loose]
  confidence: {level: medium, p_terms: [screen p terms]}
  noise: Handler possession errors misassign u; on-ball needs the holder on >= 5 of 9 frames around t_s.
  conflicts_resolved:
