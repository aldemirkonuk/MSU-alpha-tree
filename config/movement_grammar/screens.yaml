    wide_ps_m_hi: {value: 40.0, unit: deg}
  min_duration_s: 0.3
  outputs: [geometry (pin_down | wide_pin_down | other_pin_down), wide_pin_screen_spot, read]
  confidence: {level: medium, p_terms: [screen p terms]}
  noise: Corner starts sit near the boundary where homography error is larger.
  conflicts_resolved:
