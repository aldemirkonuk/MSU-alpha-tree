- id: re_screen
  level: action
  name: Re-screen (second screen by the same screener for the same handler)
  aliases: [re-screen, rescreen, twist]
  research_ids: [SCR-A04, SCR-R05]
  actors: {screener: s, handler: h, defender: D_h}
