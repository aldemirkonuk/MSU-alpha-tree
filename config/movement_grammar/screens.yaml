- id: screen_angle
  level: rule
  name: Screen angle, orientation and generic off-ball direction class (SCREEN_DIR)
  aliases: [screen_angle_deg, SCREEN_DIR, flat / angled screen]
  research_ids: [SCR-R04]
  actors: {screener: s, user: u, defender: D_u}
  t0: t_s
  rule: |
    screen_angle_deg = angle(n, -u_hat_pre) in [0, 180] (0 = square to the user's path, > glancing_deg glancing). orientation_deg = angle of n from +y; flat when <= flat_deg,
    angled when angled_lo_deg..angled_hi_deg. With shoulder keypoints the shoulder normal replaces n (orientation_source = pose).
    Generic class with d = u(t_s + 1.0) - u(t_s - 0.5), dr_u = r_u(t_s + 1.0) - r_u(t_s - 0.5), first match: FLARE angle(d, u->ball) >= 120 and |d| >= 2.0; BACK n_r >= 0.5 and
    dr_u <= -1.5; DOWN n_r <= -0.5 and dr_u >= 1.0; CROSS y_s < 2.5 and y_u < 2.5 and |dx| >= 2|dy| and |dx| >= 2.0; MIDDLE angle(d, u->ball) < 60; else OTHER.
    Implemented as attributes of every screen row (attrs.screen_angle_deg, attrs.dir_class_generic); named geometry items override the generic class and both are stored.
  params:
    glancing_deg: {value: 60.0, unit: deg}
    flat_deg: {value: 20.0, unit: deg}
    angled_lo_deg: {value: 25.0, unit: deg}
    angled_hi_deg: {value: 65.0, unit: deg}
    flare_deg: {value: 100.0, unit: deg, note: 'loop 1 SCR-T05: was 120 (see flare_screen.flare_deg)'}
    flare_disp_m: {value: 2.0, unit: m}
    n_r_back: {value: 0.5, unit: cosine}
    n_r_down: {value: -0.5, unit: cosine}
    back_dr_m: {value: -1.5, unit: m}
    down_dr_m: {value: 1.0, unit: m}
    cross_y_m: {value: 2.5, unit: m}
    cross_dx_m: {value: 2.0, unit: m}
    middle_deg: {value: 60.0, unit: deg}
    user_start_search_s: {value: 1.5, unit: s, note: 'user start position (start gates of named geometries) = last frame within this time before t_s with displacement speed < 1.0 m/s, else t_s - 0.5 s'}
  min_duration_s: null
  outputs: [screen_angle_deg, angle_class (square | glancing), orientation_deg, orientation_class (flat | angled | other; n folded to 0-90 deg from the y axis), orientation_source, dir_class_generic, n_r, dr_u, dx_u, dy_u]
  confidence: {level: medium, model: attribute of the screen row}
  noise: n unstable when d_sD < 0.5 m or D_u occluded (window mean); dr over 1.5 s is robust.
  conflicts_resolved:
  - offense section 0.2 y-sign rule restated radially (n_r, dr) so wing and corner screens classify correctly; CROSS y gate 2.5 m (check SCR-O07/R04-y)
  sources:
  - {url: 'https://arxiv.org/pdf/2512.01478', supports: shoulder-normal orientation (pose option)}
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/off-ball-screens', supports: off-ball screen direction types}
  status: canonical
  detector: null
