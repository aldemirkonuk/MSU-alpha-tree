  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md', supports: STS}
  status: proposal
  detector: detect_screen_the_screener
- id: off_ball_screen_other
  level: action
  name: Pin-in, Out, Baseline exit and Middle (residual) off-ball screens
  aliases: [pin_in, out, exit, baseline_exit, middle]
  research_ids: [SCR-O18]
  actors: {screener: s, user: u, defender: D_u}
  t0: t_s
  rule: |
    First match. PIN_IN: the screener moved dr > +pin_in_dr_m from r < 4.5 and stands at r 4.0-6.5 between the defender and the shooter; the shooter moves <= pin_in_user_move_m at
    r >= 6.6; r_D < r_u - 1.0; DELAY. OUT: screener at r out_ps_r_lo_m..out_ps_r_hi_m, m >= out_ps_m_min; the cutter passes (close) with dr >= out_dr_m ending r >= 6.6, angle change
    <= out_turn_deg, no crossing of x = 0. An elbow down screen (down_screen) is not OUT (loop 1, SCR-T16). BASELINE_EXIT: y_s < base_y_m and the user moves to m <= base_m_max along the baseline. MIDDLE (residual): displacement within 60 deg of
    u->ball and |x| reduced >= middle_dx_m; not claimed by another geometry.
  params:
    pin_in_dr_m: {value: 1.5, unit: m}
    pin_in_user_move_m: {value: 1.5, unit: m}
    out_ps_r_lo_m: {value: 3.8, unit: m}
    out_ps_r_hi_m: {value: 5.2, unit: m}
    out_ps_m_min: {value: 55.0, unit: deg}
    out_dr_m: {value: 2.5, unit: m}
    out_turn_deg: {value: 35.0, unit: deg}
    base_y_m: {value: 1.0, unit: m}
    base_m_max: {value: 12.0, unit: deg}
    middle_dx_m: {value: 1.5, unit: m}
  min_duration_s: 0.3
  outputs: [geometry (pin_in | out | baseline_exit | middle)]
  confidence: {level: low-medium, p_terms: [screen p terms]}
  noise: Pin-in is seen only through the defender (needs a reliable D_u).
  conflicts_resolved: []
  sources:
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/off-ball-screens', supports: completes the 13 CTG off-ball types}
  status: proposal
  detector: detect_off_ball_screen_other
# ======================================================================================
# Handoffs
# ======================================================================================
- id: dho
  level: action
  name: Dribble handoff (DHO), standard and strict
  aliases: [DHO, handoff, hand-off]
  research_ids: [SCR-H01]
  actors: {hander: a, receiver: b, defender: D_b}
  t0: t_ex = first frame of b's possession
  rule: |
    Possession transfer a -> b (cleaned holder runs) with dist(a, b) <= dist_max_m (closest 3-frame median within +-exch_win_s of t_ex), air time (holder-less frames) <= air_max_s, ball travel <= travel_max_m, and at
    least one of a, b at speed > min_speed_mps, and real holds on both sides (a held >= hander_hold_s before, b keeps >= receiver_hold_s after; loop 1, SCR-T13). strict = dist <= strict_dist_m and air <= strict_air_s; conventional = receiver speed > conventional_mps; post_dho flag r_a <
    post_r_m. The hander acts as screener: t_s = argmin d(a, D_b) in [t_ex - 0.5, t_ex + 1.0]; hander post-action from screener_post_action; the hander stop near D_b is a screen row of kind handoff. D_b coverage (F6 over / ice / switch / under) is not computed in 0.1.0.
    handoff_exchange_spot (named spot, giver >= 5.5 m from the rim) stored.
  params:
    dist_max_m: {value: 1.0, unit: m}
    exch_win_s: {value: 0.2, unit: s, note: 'exchange distance = closest 3-frame median within +-exch_win_s of the catch'}
    air_max_s: {value: 0.3, unit: s}
    travel_max_m: {value: 1.5, unit: m}
    min_speed_mps: {value: 1.0, unit: m/s}
    strict_dist_m: {value: 0.6, unit: m}
    strict_air_s: {value: 0.2, unit: s}
    conventional_mps: {value: 2.0, unit: m/s}
    post_r_m: {value: 4.0, unit: m}
    holder_min_run_frames: {value: 12, unit: frames, note: '0.4 s (loop 1, SCR-T13; was 9). The tester proposed 15; on the tester scenes at sigma_p 0.5 15 frames fragmented real possessions (ucla 0.62 -> 0.50, shuffle 0.57 -> 0.42, slip 0.80 -> 0.65 recall vs 9) while 12 keeps dho precision 0.67 (9: 0.64) with dho recall 0.60 (9: 0.53)'}
    holder_switch_margin_m: {value: 0.15, unit: m, note: 'sticky holder - a teammate takes the ball only when nearer to it by this margin (or the holder is beyond mvlib.HOLD_R)'}
    holder_margin_k: {value: 1.5, unit: sigma, note: 'SCR-T13: switch margin = max(holder_switch_margin_m, holder_margin_k x K_CAL x sqrt(var_p_a + var_p_b))'}
    hander_hold_s: {value: 0.5, unit: s, note: 'SCR-T13: a DHO needs the hander to hold the ball for this long before the exchange'}
    receiver_hold_s: {value: 0.5, unit: s, note: 'SCR-T13: and the receiver to keep it this long after'}
  min_duration_s: 0.1
  outputs: [t_ex, t_s, dist at exchange, air time, strict, conventional, post_dho, hander post-action]
  confidence: {level: medium, p_terms: ['p_below(d_ab(t_ex), dist_max_m, sigma_d)']}
  noise: The ball is occluded in the hands; holder = nearest offensive player within 1.0 m (mvlib) with runs < 5 frames removed (3-frame hysteresis in the research). A quick pitch looks like a DHO; air time separates them (dho_pitch_disambiguation).
  conflicts_resolved:
  - set_taxonomy < 0.91 m; offense / motion_starts <= 1.0 m; A11.18 <= 1.0 m / air <= 0.3 s canonical; 1.5 m flight only as a sanity gate
  sources:
  - {url: 'https://global-uploads.webflow.com/5f1af76ed86d6771ad48324b/622770e864911f5635f56f75_Using%20Hex%20Maps%20to%20Classify%20%20Cluster%20Dribble%20Hand-off%20Variants%20in%20the%20NBA%202.pdf', supports: 'DHO candidates by possession radius 5 ft and transfer within about 8 moments (research-reported; skeptic could not verify)'}
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/ball-screens', supports: handoffs counted with ball screens}
  status: canonical
  detector: detect_dho
- id: fake_dho
  level: action
  name: Fake DHO (receiver goes away or backdoor)
  aliases: [fake handoff, fake_handoff, wheel]
  research_ids: [SCR-H02]
  actors: {hander: a, receiver: b, defender: D_b}
  t0: t_c (closest approach without transfer)
  rule: |
    APPROACH: a holds the ball and moves toward b (mean heading over [t_c - 0.6, t_c - 0.1] within heading_deg of a -> b, speed >= 1.0 m/s); d(a, b) at t_c (5-frame median)
    <= approach_m (loop 1, SCR-T12 - the code no longer adds 0.3 m); mean closing speed >= closing_mps; b comes to the ball (mean velocity toward a over [t_c - 0.6, t_c - 0.1] >= receiver_close_mps); not within after_screen_s after a used ball screen for a; no transfer to b in [t_c - 0.3, t_c + 0.5] and a holds on >= 5 of the 9 frames after t_c; b is not standing as a
    ball screener for a (no screen_set row with s = b, u = a within screen_excl_s of t_c: that is a ball screen, not a handoff).
    AWAY: b moves >= away_m from its t_c position within away_s and d(a, b) grows. BACKDOOR: b's post heading turns >= backdoor_turn_deg from its pre heading (MP-13) and b
    reaches r < backdoor_r_m with dr <= -backdoor_dr_m within 1.5 s; D_b within between_m of segment b-a at t_c flag stored.
  params:
    heading_deg: {value: 30.0, unit: deg}
    screen_excl_s: {value: 1.0, unit: s, note: 'no fake handoff when b is a ball screener for a (SET row) within this time of t_c'}
    approach_m: {value: 1.5, unit: m}
    closing_mps: {value: 1.0, unit: m/s}
    away_m: {value: 3.0, unit: m}
    away_s: {value: 1.5, unit: s}
    backdoor_turn_deg: {value: 120.0, unit: deg}
    receiver_close_mps: {value: 0.5, unit: m/s, note: 'SCR-T12: b mean velocity toward a over [t_c - 0.6, t_c - 0.1] >= this (the receiver comes to the ball)'}
    after_screen_s: {value: 1.5, unit: s, note: 'SCR-T12: no candidate within this time after a used ball screen for a (the handler attacking a second big)'}
    receiver_window_s: {value: 1.2, unit: s, note: 'REG-fake_dho (loop 2): receiver_close_mps is tested on the peak receiver_mean_frames mean of b velocity toward a over [t_c - receiver_window_s, t_c - 0.1]'}
    receiver_mean_frames: {value: 5, unit: frames, note: 'REG-fake_dho (loop 2): length of the running mean for the receiver approach'}
    backdoor_r_m: {value: 2.0, unit: m, note: 'backdoor: b reaches r < backdoor_r_m (was hard-coded)'}
    backdoor_dr_m: {value: 4.0, unit: m}
    between_m: {value: 1.0, unit: m, note: 'defender_between flag: D_b within this of segment b-a'}
  min_duration_s: 0.3
  outputs: [sub_label (away | backdoor), t_c, d_ab at t_c]
  confidence: {level: medium, p_terms: ['p_below(d_ab(t_c), approach_m, sigma_d)']}
  noise: A missed transfer (occlusion) makes a real DHO look fake; the 5-of-9 holder check guards it.
  conflicts_resolved:
  - motion_starts FAKE_DHO and F6 keep merged as sub-labels; keep is its own detector (dho_keep)
  sources:
  - {url: 'https://global-uploads.webflow.com/5f1af76ed86d6771ad48324b/622770e864911f5635f56f75_Using%20Hex%20Maps%20to%20Classify%20%20Cluster%20Dribble%20Hand-off%20Variants%20in%20the%20NBA%202.pdf', supports: fake handoffs about 5.2 % of candidates (research-reported)}
  status: canonical
  detector: detect_fake_dho
- id: dho_keep
  level: action
  name: Keep (hander fakes the handoff and drives)
  aliases: [keep, refuse handoff]
  research_ids: [SCR-H02]
  actors: {hander: a, receiver: b}
  t0: t_c
  rule: The fake_dho APPROACH holds and a drives within keep_s of t_c (r(a) drops by >= keep_dr_m within 0.5 s, i.e. v_r >= 2.0 m/s on a 15-frame window) while still holding the ball.
  params:
    keep_s: {value: 1.0, unit: s}
    keep_dr_m: {value: 1.0, unit: m}
  min_duration_s: 0.3
  outputs: [drive start, d_ab at t_c]
  confidence: {level: medium, p_terms: ['p_below(d_ab(t_c), approach_m, sigma_d)']}
  noise: as fake_dho
  conflicts_resolved: []
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md', supports: keep F6}
  status: canonical
  detector: detect_dho_keep
- id: handoff_chain
  level: set_component
  name: Handoff chains - Get, Handback, Zoom (Chicago), Miami, Weave
  aliases: [get, chase, throw-and-go, handback, zoom, Chicago, Miami, weave]
  research_ids: [SCR-H03]
  actors: {a: a, b: b, screener: s (zoom)}
  t0: first event in the chain
  rule: |
    GET: pass a -> b, then DHO b -> a with t_ex - catch in [get_lo_s, get_hi_s]. HANDBACK: pass a -> b, then pass or pitch b -> a (raw-ball air handback_min_air_s..handback_air_s on the return, >= handback_min_air_s on the first leg; travel <= handback_travel_m) within handback_s, both at r >= handback_r_m (loop 1, SCR-T22). ZOOM: down_screen or pin_down on u, then a DHO to u within zoom_s of t_s. MIAMI: DHO a -> b, then a sets a ball screen for b within miami_s.
    WEAVE: >= 2 DHOs within weave_s at r weave_r_lo_m..weave_r_hi_m, m >= weave_m_min.
  params:
    get_lo_s: {value: 0.3, unit: s}
    get_hi_s: {value: 2.0, unit: s}
    zoom_s: {value: 1.5, unit: s}
    miami_s: {value: 1.5, unit: s}
    weave_s: {value: 5.0, unit: s}
    handback_s: {value: 1.5, unit: s, note: 'handback: return pass within this time (was hard-coded)'}
    handback_air_s: {value: 0.5, unit: s}
    handback_min_air_s: {value: 0.2, unit: s, note: 'SCR-T22: both legs are real passes (raw-ball air time, SCR-T15)'}
    handback_travel_m: {value: 2.5, unit: m}
    handback_r_m: {value: 6.75, unit: m}
    weave_r_lo_m: {value: 6.5, unit: m, note: 'weave DHOs at r in [lo, hi] and m >= weave_m_min (was hard-coded)'}
    weave_r_hi_m: {value: 9.0, unit: m}
    weave_m_min: {value: 45.0, unit: deg}
  min_duration_s: 0.5
  outputs: [chain (get | handback | zoom | miami | weave), ordered action ids]
  confidence: {level: medium, p_terms: [product of the linked events' conf]}
  noise: Inherits DHO and pass detection errors.
  conflicts_resolved:
  - GET 0.5-1.5 s widened to 0.3-2.0 s from the catch (proposal)
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md', supports: handoff chains, weave A11.16}
  status: proposal
  detector: detect_handoff_chain
# ======================================================================================
# Legality hints (never foul calls)
# ======================================================================================
- id: moving_screen_hint
  level: rule
  name: Moving-screen legality hint (Rule 4-35.4)
  aliases: [moving screen, illegal screen hint]
  research_ids: [SCR-L01]
  actors: {screener: s, defender: D}
  t0: t_c (closest approach of s to D, <= contact_m)
  rule: |
    For an offensive non-holder s and a defender D who does not guard s, at a local minimum t_c of d(s, D) with 5-frame median <= contact_m: (a) P(|v| > 0.6 m/s) >= p_moving
    on the LS window of min_ls_frames centred at t_c - 0.1 s (lower-bound test, disjoint from the loose band), (b) mean of v_s(t) . unit(D(t) - s(t)) over
    [t_c - along_pre_s, t_c - along_post_s] >= along_n_mps (moving into the defender), (b2) over the same window D's mean speed >= def_speed_mps and D's velocity toward s >= def_closing_mps (the defender moves into the screener's path; loop 1, SCR-T20), (c)
    contact_likely, (d) D is delayed or deflected (screen_interaction tests around t_c). A hint with a probability, never a foul.
  params:
    contact_m: {value: 0.8, unit: m}
    p_moving: {value: 0.9, unit: probability}
    along_n_mps: {value: 0.5, unit: m/s}
    along_pre_s: {value: 0.4, unit: s}
    along_post_s: {value: 0.1, unit: s, note: 'velocity toward D averaged over [t_c - along_pre_s, t_c - along_post_s] (at the closest approach the direction to D is perpendicular to a pass-by)'}
    def_speed_mps: {value: 1.0, unit: m/s, note: 'SCR-T20: D mean speed over [t_c - along_pre_s, t_c - along_post_s] >= this'}
    def_closing_mps: {value: 0.5, unit: m/s, note: 'SCR-T20: and D velocity toward s >= this (the defender moves into the screener path; two players arriving side by side are not a moving screen)'}
  min_duration_s: null
  outputs: [moving_screen_hint, p_moving, v_ls, v_along_n, d_sD_min]
  confidence: {level: low, p_terms: ['P(|v| > 0.6)', 'p_below(d_sD, contact_m, sigma_d)']}
  noise: At sigma_p 0.3 and 0.5 s windows only clearly moving screens (about > 1.2 m/s) are flagged; precision first.
  conflicts_resolved:
  - fouls.yaml 'speed > 0.5 m/s at contact' overlapped LOOSE (< 0.6); the hint now needs the lower bound above 0.6, contact, motion toward the defender and a delay
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/rules/PRMBB_RulesBook.pdf', supports: Rule 4-35.4 screener stationary at contact}
  status: proposal
  detector: detect_moving_screen_hint
- id: blind_screen_hint
  level: rule
  name: Blind screen, too-close-to-moving-opponent and boundary-parallel legality hints (Rule 4-35.3 / 4-35.7)
  aliases: [blind screen, 4-35.3, 4-35.7]
  research_ids: [SCR-L02]
  actors: {screener: s, defender: D_u}
  t0: SET stop onset a
  rule: |
    Facing of D_u at a: heading if speed >= facing_speed_mps, else unit(midpoint(u, ball) - D_u). BLIND = p_above(angle(facing, D_u -> s), blind_deg, sigma_angle) >= blind_p_min with sigma_angle = degrees(sigma_d / d(s, D_u)(a)) x sqrt(2) (loop 1, SCR-T14 - was a point test at 90 deg).
    contact_likely here = 5-frame median d(s, D_u) <= 0.80 m at the stop onset or at t_s.
    BLIND_NO_STEP: blind, D_u speed < facing_speed_mps, d(s, D_u)(a) < step_m, contact_likely.
    TOO_CLOSE_MOVING: blind, D_u speed >= facing_speed_mps, d(s, D_u)(a) < step_m + stride_s * closing speed, contact_likely.
    BOUNDARY_PARALLEL: two screeners in screen_boundary_6ft_band (named spot), mutual distance <= mutual_m, joining line within parallel_deg of the boundary, contact_likely.
  params:
    facing_speed_mps: {value: 1.0, unit: m/s}
    blind_deg: {value: 120.0, unit: deg, note: 'loop 1 SCR-T14: was 90; human visual field about +-100-120 deg; gated by probability (blind_p_min)'}
    step_m: {value: 0.9, unit: m, note: 'unverified (Rule 4-35.3.a says only ''a normal step'')'}
    stride_s: {value: 0.5, unit: s}
    parallel_deg: {value: 20.0, unit: deg}
    blind_p_min: {value: 0.8, unit: probability, note: 'SCR-T14: p_above(facing angle, blind_deg, sigma_angle) >= this, sigma_angle = degrees(sigma_d / d(s, D)(a)) x sqrt(2)'}
    mutual_m: {value: 1.2, unit: m, note: 'boundary-parallel pair distance (was hard-coded)'}
  min_duration_s: null
  outputs: [hint (blind_no_step | too_close_moving | boundary_parallel), blind, facing_deg]
  confidence: {level: low, p_terms: ['p_below(d(s, D_u)(a), step_m, sigma_d)', 'p_below(d_sD(t_s), 0.8, sigma_d)']}
  noise: Facing from velocity is unreliable for slow defenders; pose improves it.
  conflicts_resolved:
  - A5 blind spacing 0.7-1.0 m vs fouls.yaml 0.9 m -> 0.9 m, flagged unverified
  sources:
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/rules/PRMBB_RulesBook.pdf', supports: Rule 4-35.3 blind screens and 4-35.7}
  - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml', supports: screen_boundary_6ft_band}
  status: proposal
  detector: detect_blind_screen_hint
