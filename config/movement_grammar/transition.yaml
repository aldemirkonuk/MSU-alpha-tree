    < 2.0 m/s for >= 3.0 s while >= 3 teammates are at r >= 6.75 and slow. Without the clock gate a slow half-court
    handler is not a hold, so the label needs the clock.
  params: {}
  min_duration_s: 3.0
  outputs: hold duration, clocks
