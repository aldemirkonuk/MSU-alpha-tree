  rule: >-
    t_toss (ball rises above the official's head + 0.3 m) and t_tap (ball-velocity change >= 2 m/s at z > 2.5 m)
    need ball z. Pre-move candidate (fix TRN-P20/pre-move): smoothed mean position over [t_toss - 1.0, t_toss - 0.3]
    vs [t_toss - 0.3, t_toss] differs by > 3 sigma_mean_diff. release: a non-jumper upcourt run onset in [t_tap -
    0.2, t_tap + 1.0] reaching y <= 5.0 within 2.0 s.
  params: {}
  min_duration_s: null
  outputs: t_toss, t_tap, releasers, candidates
  confidence: needs ball z
  noise: Officials among the players at the circle.
