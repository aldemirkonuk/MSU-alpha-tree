- id: press_safety
  ref: TRN-P24
  level: primitive
  name: Press-break safety behind the ball
  aliases: [trailing outlet, safety valve]
  actors: 1 attacker
  t0: first frame of the press interval
  rule: >-
    During a press_active interval (ball y > half_y), from the inbound's first touch when the interval contains a
    throw-in (nobody can be behind an out-of-bounds thrower): the attacker (not the holder) with y > y_ball +
    behind_m and distance to the ball <= near_m on the largest share of frames; label when the share >= min_share
    and the interval >= min_duration_s.
