    v_in_mps: {value: 1.0, unit: m/s}
    return_s: {value: 3.0, unit: s}
  min_duration_s: null
  outputs: t_step_in - t_release, return_catch
  confidence: 'window_conf(p_above(boundary distance, d_in_m, sigma)) over [t, t + 0.2 s] x q_obj(thrower)'
  noise: Sideline homography error (tier C); hysteresis 0.25 m.
  conflicts_resolved: []
  sources:
  - {url: 'repo:config/named_spots.yaml#pb_inbounder_return', supports: return band within 2 s}
  - {url: 'file://docs/rules/PRMBB_RulesBook.pdf (Rule 7-6.8.d)', supports: thrower stays until the ball crosses the plane}
  status: canonical
  detector: detect_inbounder_step_in

- id: run_endline
  ref: TRN-P16
  level: primitive
  name: Run the end line after a made goal
  aliases: [run the baseline]
  actors: thrower
  t0: t_disposal
  rule: >-
    Throw-in from behind the far end line (y >= FAR_END_Y): between t_disposal and t_release the thrower's |delta x|
    >= min_dx_m at mean speed >= min_speed_mps. violation_candidate when the restart is not after a made goal (the
    designated-spot thrower may not leave the 3-ft spot, Rule 7-6.8.c).
  params:
    min_dx_m: {value: 2.0, unit: m}
    min_speed_mps: {value: 1.0, unit: m/s}
  min_duration_s: 0.3
  outputs: delta_x, mean speed, after_make, violation_candidate, endline_relay
  confidence: 'Phi((|dx| - min_dx_m) / sigma_dx) x q_obj(thrower)'
  noise: The far end line is often out of view after a make (unknown).
  conflicts_resolved: []
  sources:
  - {url: 'file://docs/rules/PRMBB_RulesBook.pdf (Rule 7-4.6.a/b, 7-6.8.c)', supports: run the end line after a goal}
  status: canonical
  detector: detect_run_endline

- id: inbound_get_open
  ref: TRN-P17
  level: primitive
  name: Throw-in receiver get-open (V-cut, flash, pop, basket cut)
  aliases: [V-cut, flash to the ball, pop]
  actors: in-bounds attacker (+ thrower as the ball)
  t0: plant frame (v_cut) or start of the final leg
  rule: >-
    In [t_disposal - pre_s, t_first_touch]. v_cut: find the last run of frames passing an MP-13 reversal test (pre /
    post mean displacements over pre_post_s that skip skip_s on each side, both legs >= leg_min_disp_m, turn >=
    vcut_deg; fix TRN-P17/heading-reversal: heading is undefined at the plant, so it is never read there); the plant
    p is the frame farthest from the thrower within [run start - 0.2 s, run end + 0.3 s] (the run itself is biased
    toward the longer leg); the player moved >= leg_m away from the thrower in the second before p and >= leg_m back
    toward him after p (to the catch + 0.3 s) with peak speed >= vcut_speed_mps; t0 = p. Otherwise the final leg =
    last run of smoothed speed >= move_mps (gaps <= 2 frames bridged, chord >= 0.5 m) starting before the touch:
    flash when it closes >= flash_m on the thrower at peak >= flash_speed_mps; basket_cut when it ends at r <= 2.0
    with peak v_r >= 2.5 m/s; pop when it increases r by >= pop_m; t0 = leg start. receives = the first touch is
    his.
  params:
    pre_s: {value: 1.0, unit: s}
    move_mps: {value: 1.0, unit: m/s}
    leg_m: {value: 1.5, unit: m}
    vcut_speed_mps: {value: 2.0, unit: m/s}
    vcut_deg: {value: 120.0, unit: deg}
    pre_post_s: {value: 0.4, unit: s}
    skip_s: {value: 0.15, unit: s}
    leg_min_disp_m: {value: 0.5, unit: m}
    flash_m: {value: 2.0, unit: m}
    flash_speed_mps: {value: 2.5, unit: m/s}
    pop_m: {value: 1.5, unit: m}
  min_duration_s: 0.3
  outputs: class, receives, angle, leg lengths
  confidence: 'window_conf(p_above(speed, move_mps, sigma_speed)) over the final leg x Phi(primary margin / sigma) x q_obj(player)'
  noise: BLOB boxes are tight clusters; require re-ID confidence >= 0.7 in production.
  conflicts_resolved: ['Reversal window 0.6 s (motion_starts) over 0.4 s (offense A5).']
  sources:
  - {url: 'repo:docs/taxonomy/offense_full.md F13.2/F13.3', supports: BLOB/SLOB cuts}
  status: proposal
  detector: detect_inbound_get_open

- id: ft_lane_entry
  ref: TRN-P18
  level: primitive
  name: Free-throw lane entry and early-entry candidate
  aliases: [FT crash, lane violation candidate]
  actors: lane-space occupants
  t0: entry frame
  rule: >-
    FT release proxy: the ball leaves a holder standing in ft_shooter (stationary) and comes within 1.0 m of the
    origin rim. Reference position = mean over [t_ft - ref_from_s, t_ft - ref_to_s] for each player in
    ft_lane_space_1..3 (either side). entry = first frame after t_ft - 0.5 s at which |x| is below the reference by
    >= enter_m, held >= hold_s. early_entry_candidate when entry < t_ft and the inward move exceeds max(early_m, 3
    sigma_move) on >= 2 frames of [entry, entry + hold_s + ref_to_s] (the smoothed track trails a fast 0.8 m step by
    about 0.2 m, so a step ending at the release reads about 0.5 m by then), sigma_move = sqrt(sigma_ref^2 / n_eff +
    sigma_t^2) with n_eff = reference length / corr_s (the reference is a window mean, the current position one
    frame; loop 1, TRN-T17) (only a candidate: feet decide violations). ft_crash when an attacker reaches r <= 1.5
    within 1.0 s of t_rim.
  params:
    ref_from_s: {value: 1.0, unit: s}
    ref_to_s: {value: 0.3, unit: s}
    enter_m: {value: 0.5, unit: m}
    hold_s: {value: 0.2, unit: s}
    early_m: {value: 0.6, unit: m}
    window_s: {value: 1.5, unit: s}
    corr_s: {value: 0.3, unit: s, note: 'smoothed-track correlation time for the reference-mean sigma (loop 1, TRN-T17)'}
  min_duration_s: null
  outputs: space id, entry - t_ft, early_entry_candidate, ft_crash
  confidence: 'window_conf(p_above(inward move, enter_m, sigma_move)) over [entry, entry + 0.2 s] x q_obj(player)'
  noise: Lane-space marks are thin; centroids cannot decide a violation.
  conflicts_resolved:
  - 'Lane counts per named_spots ft_lane_occupancy_rule (NCAA Rule 8-5).'
  - 'Entry threshold 0.25 m (research) is about 2 sigma of the smoothed centroid at sigma_p 0.3 and fired on static V0 lanes; 0.5 m held 0.2 s.'
  sources:
  - {url: 'file://docs/rules/PRMBB_RulesBook.pdf (Rule 8-5.1, 8-5.2)', supports: no lane entry before release}
  - {url: 'repo:config/named_spots.yaml#ft_lane_space_1', supports: spaces}
  status: proposal
  detector: detect_ft_lane_entry

- id: ft_release_runner
  ref: TRN-P19
  level: primitive
  name: Free-throw release runner (leak or safety retreat off an FT)
  aliases: [FT leak, FT break runner]
  actors: 1 player
  t0: run onset
  rule: >-
    At the FT release proxy, a player inside ft_leak_out or ft_perimeter_* starts a run away from the shooting rim
    (vy_bar >= run_vy_mps, sustained >= min_duration_s, exit below run_vy_mps - 1.0 m/s for 0.3 s) with onset in
    [t_ft
    - pre_s, t_rim + post_s]. The shooter's team = ft_safety_retreat, the opponent = ft_leak.
  params:
    run_vy_mps: {value: 3.0, unit: m/s}
    pre_s: {value: 0.5, unit: s}
    post_s: {value: 1.0, unit: s}
  min_duration_s: 0.5
  outputs: role (ft_leak | ft_safety_retreat), onset - t_ft
  confidence: 'window_conf(p_above(vy_bar, run_vy_mps, sigma_vbar)) over [onset, onset + 0.5 s] x q_obj(player)'
  noise: Usually off-screen (the camera frames the lane).
  conflicts_resolved: []
  sources:
  - {url: 'repo:config/named_spots.yaml#ft_leak_out', supports: region and team semantics}
  status: proposal
  detector: detect_ft_release_runner

- id: jump_ball_release
  ref: TRN-P20
  level: primitive
  name: Jump-ball release and jumper hold
  aliases: [tip streak]
  actors: all 10
