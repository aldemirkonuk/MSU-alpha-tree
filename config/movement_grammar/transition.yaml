- id: ft_alignment
  ref: TRN-S15
  level: set_component
  name: Free-throw alignment
  aliases: [FT lineup]
  actors: all
  t0: FT release proxy
  rule: >-
    At the FT release proxy (see ft_lane_entry): occupancy of ft_lane_space_1..3 and ft_lane_open_low per side and
    team, ft_perimeter_top / wing, ft_leak_out, the shooter (ft_shooter); requires >= min_lane lane-space occupants.
