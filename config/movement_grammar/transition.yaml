  min_duration_s: null
  outputs: t - t0, before_cross flag, already_back, flag_25 frame
  confidence: 'window_conf(p_below(r, arrive_r_m, sigma_r)) over [t, t + 0.2 s] x q_obj(defender)'
  noise: After an offensive rebound the team is attacking; skipped (only D -> O changes are scanned).
  conflicts_resolved: ['Rim radius: named_spots zone 1.8 / arrival 1.5 over 2.5 (kept as flag_25).']
  sources:
  - {url: 'repo:config/named_spots.yaml#transition_protect_rim', supports: 'r <= 1.8 zone, arrival r <= 1.5'}
  status: canonical
  detector: detect_protect_rim

- id: inbounder_step_in
  ref: TRN-P15
  level: primitive
  name: Inbounder step-in (return after the throw-in)
  aliases: [inbounder return]
  actors: thrower
  t0: t_step_in
  rule: >-
    Within window_s after t_release, the thrower's smoothed position is inside every boundary by >= d_in_m with an
    inward window velocity >= v_in_mps; return_catch when he holds the ball again within return_s of t_release.
  params:
    window_s: {value: 2.0, unit: s}
