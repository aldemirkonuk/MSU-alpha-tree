# ====================================================================================================== actions
- id: outlet_pass
  ref: TRN-A01
  level: action
  name: Outlet pass (ball-side, middle, long) or dribble-out
  aliases: [first pass, kick-ahead, touchdown pass]
  actors: rebounder, receiver
  t0: pass release
  rule: >-
    After a dreb possession change, the first pass by the rebounder. delay = t_release - t_dreb (quick when <=
    quick_s). Catch spot: outlet_ballside, outlet_middle, long_outlet_zone (catch y <= 10.2616); long_len15 when
    length >= long_len_m; ballside = sign(x_catch) == sign(x_rebound); outlet_height_m = FAR_END_Y - y_catch for
    every outlet, ctg_compatible flag when the receiver is the primary initiator (he then holds the ball across
    half_y) (fix TRN-A01/outlet_height; CTG gives feet, 47 ft = 14.33 m). dribble_out (kind) when the rebounder
    dribbles >= dribble_m before any pass. Pass vs handoff: length < 1.0 m goes to the DHO family.
  params:
    quick_s: {value: 1.5, unit: s}
    long_len_m: {value: 15.0, unit: m}
    dribble_m: {value: 3.0, unit: m}
    min_len_m: {value: 1.0, unit: m}
  min_duration_s: null
  outputs: delay, length, spot class, ballside, outlet_height_m, ctg_compatible, quick, long flags
  confidence: 'window_conf(p hold of the receiver) over [catch, catch + 0.2 s] x q_obj(rebounder, receiver, ball)'
  noise: A long outlet can leave the frame; catch-side continuity.
  conflicts_resolved: ['Outlet delay <= 1.5 s (offense F1 and transition_full agree).']
  sources:
  - {url: 'repo:docs/taxonomy/offense_full.md:110', supports: ball-side outlet <= 1.5 s}
  - {url: 'https://docs.cleaningtheglass.com/pro/data-sets/transition-opportunities', supports: outlet_height}
  status: canonical
  detector: detect_outlet_pass

- id: hit_ahead
  ref: TRN-A02
  level: action
  name: Hit-ahead / pitch-ahead pass
  aliases: [pitch ahead, pass ahead]
  actors: passer, receiver
  t0: pass release
  rule: >-
    Within window_s of t0_poss, a pass between attackers with delta y <= max_dy_m, released before the passer
    crosses half_y or <= after_cross_s after his crossing; passed_before_timeline when the passer is at y > half_y.
  params:
    max_dy_m: {value: -8.0, unit: m}
    after_cross_s: {value: 1.5, unit: s}
    window_s: {value: 8.0, unit: s}
  min_duration_s: null
  outputs: delta_y, length, passed_before_timeline, receiver separation
  confidence: 'Phi((max_dy_m - dy) / sigma_dy) x window_conf(p hold of the receiver) x q_obj(passer, receiver, ball)'
  noise: Same as outlet_pass.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/research/transition_full.md §2.2 Hit-ahead', supports: delta_y <= -8 m}
  status: canonical
  detector: detect_hit_ahead

- id: drag_screen
  ref: TRN-A03
  level: action
  name: Drag screen (transition ball screen)
  aliases: [drag, '7', transition ball screen, drag flare, drag slip, inverted drag]
  actors: handler, screener
  t0: screen contact (first frame of the stationary screener within contact_m of the handler)
  rule: >-
    Within window_s of t0_poss and during transition or <= after_phase_s after it: a non-handler attacker who had
    vy_bar <= run_vy_mps in the run_back_s before contact, stays set from contact (stationary_s2 < 5.99 on >= 60% of
    [contact, contact + 0.3 s] and within contact_m + 0.25 m of the handler throughout; fix
    TRN-A06/A03-stationary-at-noise-floor), within contact_m of the ball handler (fix TRN-A03/drag-geometry: no
    absolute screener radius), with the handler at r > handler_r_m and y <= half_y + 2.0 (drag_screen_spot).
    Screener role: trailer, rim runner who came back, or late_runner (3rd to 5th across half court and not the
    handler at his crossing; loop 1: trailer ranks now count the handler, TRN-T07, and a big crossing 3rd just ahead
    of the handler keeps his drag eligibility). Screener action within action_s: roll (r < roll_r_m, or r drops by
    >= roll_dr_m: a drag near half court cannot reach r < 3 in 1.5 s), pop (r >= 6.75 and moving away), else none.
    drag_at_arc flag: screener 6.0 <= r <= 8.5. moving_screen_candidate only when the screener's speed at contact >
    1.0 m/s.
  params:
    window_s: {value: 8.0, unit: s}
    after_phase_s: {value: 2.0, unit: s}
    run_vy_mps: {value: -3.0, unit: m/s}
    run_back_s: {value: 1.5, unit: s}
    contact_m: {value: 1.5, unit: m}
    handler_r_m: {value: 7.5, unit: m}
    action_s: {value: 1.5, unit: s}
    roll_r_m: {value: 3.0, unit: m}
    roll_dr_m: {value: 3.0, unit: m}
  min_duration_s: null
  outputs: screener role, contact r / theta, drag_at_arc, screener action, side
  confidence: 'window_conf(p_below(dist, contact_m, sigma_dist)) over contact +- 0.15 s x q_obj(handler, screener)'
  noise: A jogging trailer can fail strict stationarity; the screen family's loose rule is inherited.
  conflicts_resolved: ['Time gate: transition or <= 2.0 s after, and <= 8.0 s after t0.', 'Screen rule C7 inherited from the screen family.']
  sources:
  - {url: 'https://www.coachesclipboard.net/HoibergTransition-DragScreen.html', supports: trailing rebounder sets the drag and rolls}
  - {url: 'repo:config/named_spots.yaml#drag_screen_spot', supports: handler region}
  status: canonical
  detector: detect_drag_screen

- id: double_drag
  ref: TRN-A04
  level: action
  name: Double drag ('77')
  aliases: ['77', double stagger ball screen]
  actors: handler, 2 screeners
  t0: first contact
  rule: >-
    Two drag_screen contacts on the same handler <= gap_s apart, with the screeners at the second contact (both set;
    the second is still arriving at the first) separated by min_sep_m < separation <= max_sep_m (fix TRN-A04/gap:
    bands contiguous; > max_sep_m is a stagger ball screen of the screen family). second_pops when the second
    screener reaches r >= 6.75 within 1.5 s.
  params:
    gap_s: {value: 1.5, unit: s}
    min_sep_m: {value: 0.5, unit: m}
    max_sep_m: {value: 1.75, unit: m}
  min_duration_s: null
  outputs: gap_s, separation_m, screeners
  confidence: 'min of the two drag confs x Phi((max_sep_m - sep) / sigma_dist)'
  noise: Two screeners close together can merge into one detection.
  conflicts_resolved: ['0.7-1.5 m (double drag) vs 2-5 m (stagger) left a gap; contiguous at 1.75 m.']
  sources:
  - {url: 'repo:docs/research/transition_full.md §2.2', supports: double drag}
  status: proposal
  detector: detect_double_drag

- id: trailer_pitch_back
  ref: TRN-A05
  level: action
  name: Trailer pitch-back (pass back to the trailer)
  aliases: [pitch-back, trailer three]
  actors: handler, trailer
  t0: catch
  rule: >-
    A pass from an attacker to a trailer (trailer event) caught at r_min_m <= r <= r_max_m, theta in [70, 110] (m >=
    70), within window_s of t0_poss, with y_catch >= y_release - flat_tol_m (backward or flat).
  params:
    r_min_m: {value: 6.75, unit: m}
    r_max_m: {value: 8.5, unit: m}
    window_s: {value: 8.0, unit: s}
    flat_tol_m: {value: 0.5, unit: m}
  min_duration_s: null
  outputs: catch spot, delay after t0
  confidence: 'window_conf(p hold) x Phi(r margin / sigma_r) x q_obj(passer, trailer, ball)'
  noise: Trailer usually on camera once the ball returns.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/research/transition_full.md §9.3', supports: pitch-back region}
  status: canonical
  detector: detect_trailer_pitch_back

- id: rim_runner_hit
  ref: TRN-A06
  level: action
  name: Rim-runner hit (seal pass, big-to-big, lob)
  aliases: [hit the rim runner, seal pass, big-to-big]
  actors: passer, rim runner
  t0: catch
  rule: >-
    A pass caught by a rim_run actor at r <= catch_r_m within after_arrive_s of his arrival and window_s of t0_poss.
    seal_pass when his net displacement over seal_s before the catch < seal_disp_m (displacement test, fix
    TRN-A06/A03-stationary-at-noise-floor) at r < 2.5; big_to_big when the passer is a trailer; lob needs ball z.
  params:
    catch_r_m: {value: 3.0, unit: m}
    after_arrive_s: {value: 2.0, unit: s}
    window_s: {value: 8.0, unit: s}
    seal_s: {value: 0.8, unit: s}
    seal_disp_m: {value: 0.4, unit: m}
  min_duration_s: null
  outputs: sub-type, catch r, delay after arrival
  confidence: 'window_conf(p hold) x Phi((catch_r_m - r) / sigma_r) x q_obj(passer, runner, ball)'
  noise: Lob sub-type unknown without ball z.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/research/transition_full.md §9.7', supports: big-to-big within 6 s at r < 3}
  status: canonical
  detector: detect_rim_runner_hit

- id: stop_ball
  ref: TRN-A07
  level: action
  name: Stop the ball (defensive pickup of the handler)
  aliases: [stop ball, pick up the ball, half back]
  actors: handler, defender
  t0: first contact frame
  rule: >-
    After t0_poss (window_s): the first defender within pickup_m of the ball handler (hysteresis +0.25 m) AND
    goal-side (defender y < handler y), with the handler in the open court (y <= FAR_RIM_Y - open_court_dy_m; nearer
    his own rim it is a jam_rebounder) and the handler's vbar(0.5) < slow_mps within slow_within_s of the contact.
    turned_to_side when the handler's |x| >= 3.0 within 2.0 s.
  params:
    pickup_m: {value: 2.0, unit: m}
    hyst_m: {value: 0.25, unit: m}
    slow_mps: {value: 3.0, unit: m/s}
    slow_within_s: {value: 1.5, unit: s}
    window_s: {value: 8.0, unit: s}
    open_court_dy_m: {value: 6.75, unit: m}
  min_duration_s: null
  outputs: t_stop - t0, pickup y (backcourt flag), turned_to_side
  confidence: 'window_conf(p_below(dist, pickup_m, sigma_dist)) over [t, t + 0.3 s] x p_below(vbar05, slow_mps) x q_obj(handler, defender)'
  noise: 2.0 m radius sigma about 0.42 m at sigma_p 0.3 raw; smoothed tracks are better.
  conflicts_resolved: ['Goal-side test kept (otherwise a trailing defender counts).']
  sources:
  - {url: 'repo:config/named_spots.yaml#transition_stop_ball', supports: 'within 2.0 m, handler < 3.0 m/s'}
  status: canonical
  detector: detect_stop_ball

- id: jam_rebounder
  ref: TRN-A08
  level: action
  name: Jam the rebounder
  aliases: [tag the rebounder]
  actors: rebounder, defender
  t0: first frame of the jam
  rule: >-
    In [t_dreb, t_dreb + window_s], a scene.defense player within jam_m of the rebounder and his nearest opponent
    for >= min_duration_s.
  params:
    jam_m: {value: 1.5, unit: m}
    window_s: {value: 2.0, unit: s}
  min_duration_s: 0.5
  outputs: jam duration, outlet delay
  confidence: 'window_conf(p_below(dist, jam_m, sigma_dist)) over the jam x q_obj(rebounder, defender)'
  noise: Rebound scrums; nearest-opponent requirement.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/research/transition_full.md §2.3 Jam', supports: within 1.5 m for >= 0.5 s}
  status: canonical
  detector: detect_jam_rebounder

- id: matchup
  ref: TRN-A09
  level: action
  name: Match-up on the fly / cross-match / automatic pickup
  aliases: [match up, cross-match, find your man]
  actors: 10 players
  t0: t_matched
  rule: >-
    After t0_poss: t_matched = first frame from which every attacker has a defender within near_m (attacker r >= 3)
    or close_m (r < 3) for >= min_duration_s. Assignment = minimum-cost one-to-one matching on distance at
    t_matched; pre-change pairing = the same matching at t0_poss - pre_s (each defender of the new offense to his
    man). cross_matches = number of pairs that differ; automatic_pickup when 0.
  params:
    near_m: {value: 2.5, unit: m}
    close_m: {value: 1.5, unit: m}
    pre_s: {value: 1.0, unit: s}
    window_s: {value: 12.0, unit: s}
  min_duration_s: 1.0
  outputs: t_matched - t0, assignment, cross_matches, automatic_pickup
  confidence: 'window_conf(min over attackers of p_below(nearest defender distance, radius, sigma_dist)) x q_obj(all)'
  noise: Off-screen weak-side pairs are unknown.
  conflicts_resolved: ['t_matched radii 2.5 / 1.5 m kept beside the defense-set test.']
  sources:
  - {url: 'repo:docs/research/transition_full.md §2.3 Match up', supports: radii}
  status: proposal
  detector: detect_matchup

- id: tandem_stack
  ref: TRN-A10
  level: action
  name: Tandem 3v2 stack (outnumbered defense)
  aliases: [tandem, stack, I-formation]
  actors: 2 defenders
  t0: first frame of the stack
  rule: >-
    While numbers_advantage is active: two defenders with |dx| <= max_dx_m and |dy| >= min_dy_m for >=
    min_duration_s, both nearer the rim than the ball. top = larger y (ball stopper), bottom = first pass; top_drop
    when the top defender reaches r <= 2.5 within 1.5 s of the first pass. cover_two is a proposal not detected
    here.
  params:
    max_dx_m: {value: 1.5, unit: m}
    min_dy_m: {value: 2.0, unit: m}
  min_duration_s: 0.5
  outputs: top, bottom
  confidence: 'window_conf(min(p_below(|dx|, max_dx_m), p_above(|dy|, min_dy_m))) x q_obj(top, bottom)'
  noise: Fast motion; the 0.5 s dwell.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/research/transition_full.md §9.8', supports: 3v2 stack}
  status: proposal
  detector: detect_tandem_stack

- id: run_out
  ref: TRN-A11
  level: action
  name: Run-out / breakaway
  aliases: [breakaway, runout, coast-to-coast]
  actors: attacker (handler)
  t0: first frame of the open lane
  rule: >-
    Start type steal or block_to_break, or a dreb with the rebound at r_far >= long_reb_m. Within within_s of t0,
    the handler is at y > 2.0, moves toward the rim (window radial speed vbar_back(0.5) >= move_mps, loop 1 TRN-T09:
    a standing rebounder or stealer is not a run-out) and no defender with y < y_att lies within seg_m of the
    attacker-to-rim segment (segment geometry; the triangle geometry is stored), for >= min_duration_s.
  params:
    long_reb_m: {value: 6.0, unit: m}
    within_s: {value: 3.0, unit: s}
    seg_m: {value: 1.5, unit: m}
    move_mps: {value: 3.0, unit: m/s, note: 'handler window speed toward the rim (loop 1, TRN-T09)'}
  min_duration_s: 0.3
  outputs: variant, t - t0, chase defender (nearest behind)
  confidence: 'window_conf(min of p_above(vbar_back, move_mps, sigma) and, over defenders ahead, p_above(segment distance, seg_m, sigma_dist)) x q_obj(handler)'
  noise: Needs all five defenders; estimated defenders cap conf in production.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/research/transition_full.md §2.2 Run-out', supports: proposed signature}
  status: proposal
  detector: detect_run_out

- id: screen_the_inbounder
  ref: TRN-A13
  level: action
  name: Screen the inbounder
  aliases: [inbounder screen]
  actors: inbounder, screener
  t0: screen contact
  rule: >-
    After an inbounder_step_in: within contact_after_s of t_step_in a stationary teammate (stationary_s2 < 5.99) is
    within contact_m of the inbounder, and the inbounder catches within catch_s of the contact or reaches r <= 2.0 /
    r >= 6.75.
  params:
    contact_after_s: {value: 2.0, unit: s}
    contact_m: {value: 1.2, unit: m}
    catch_s: {value: 1.5, unit: s}
  min_duration_s: null
  outputs: timings, catch flag
  confidence: 'window_conf(p_below(dist, contact_m, sigma_dist)) over contact +- 0.15 s x q_obj(inbounder, screener)'
  noise: Tight clusters near the end line.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/taxonomy/offense_full.md F13.2', supports: MSU Screen the Inbounder}
  status: proposal
  detector: detect_screen_the_inbounder

- id: press_trap
  ref: TRN-A14a
  level: action
  name: Press trap
  aliases: [trap, double team]
  actors: handler, 2 defenders
  t0: t_trap_on (second defender within trap_m)
  rule: >-
    Enter when, over the last entry_window_s with the same holder throughout, the MEDIAN distances of the handler to
    his two nearest defenders are within trap_m and their median pair distance within pair_m, each threshold widened
    by entry_sigma_k x the window-median MP-19 pair sigma (loop 2 TRN-T10: noise-tier aware, a hard per-frame
    conjunction of three smoothed distances failed on noise alone); t0 = the window centre. Stay while the same
    holder (holder hysteresis, loop 1 TRN-T02) keeps the window medians within trap_m + hyst_m and pair_m + hyst_m
    plus the same sigma margin (gaps <= gap_s bridged), for >= min_duration_s. The joint entry probability p_enter
    = p_below(d1, trap_m) x p_below(d2, trap_m) x p_below(pair, pair_m) is stored, not gated on (a >= 0.5 gate would
    only remove entries, see changes_loop1 TRN-T10). Location (ball at the middle of the trap) from named_spots
    traps (backcourt_corner_trap, trap_backcourt_corner, backcourt_sideline_trap, trap_halfcourt_backcourt_corner,
    trap_coffin_corner, frontcourt_halfcourt_corner_trap, baseline_corner_trap). Loop 4 (TRN-L4-trapzone): entry only
    in press territory, i.e. the handler in the backcourt outside rim_clear_m of the far rim, or inside one of those
    trap spots; two defenders around a handler in the paint or at the arc are help, a post double or a ball-screen
    show (defense family), not a press trap.
  params:
    trap_m: {value: 1.5, unit: m}
    pair_m: {value: 2.5, unit: m}
    hyst_m: {value: 0.25, unit: m}
    gap_s: {value: 0.2, unit: s, note: 'bridged gap (was a code literal)'}
    entry_window_s: {value: 0.27, unit: s, note: 'loop 2 TRN-T10: entry and stay use window medians of the three distances over this window (8 intervals = 9 frames; 0.30 s = 10 frames measured slightly worse at sigma_p 0.5); t0 = window centre'}
    entry_sigma_k: {value: 2.0, unit: sigma_dist, note: 'loop 2 TRN-T10: thresholds widened by this x the median MP-19 pair sigma over the window (noise-tier aware: about 0.14 m at sigma_p 0.1, 0.48 m at sigma_p 0.5); loop 3: 1.0 -> 2.0'}
    stay_sigma_k: {value: 1.0, unit: sigma_dist, note: 'loop 4 (confirm-3 NEW-T10): the STAY test uses this margin instead of entry_sigma_k, so the window does not run past the defenders leaving trap_m and dilute conf below 0.5'}
    rim_clear_m: {value: 4.2, unit: m, note: 'loop 4 (TRN-L4-trapzone): entry only in press territory: handler in the backcourt farther than this from the far rim (NBA free-throw line: 19 ft from the baseline - 5.25 ft rim centre = 13.75 ft = 4.19 m), or inside a TRAP_SPOTS location'}
  min_duration_s: 0.6
  outputs: location ids, duration, defenders, p_enter
  confidence: 'window_conf(min of the two p_below(dist, trap_m, sigma_dist)) over the trap x q_obj(handler, d1, d2)'
  noise: The 1.5 m radius is sensitive; 0.6 s dwell.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/taxonomy/defense_full.md:58 (TRAP)', supports: thresholds}
  - {url: 'repo:config/named_spots.yaml#backcourt_corner_trap', supports: locations}
  status: canonical
  detector: detect_press_trap

- id: trap_breaker_pass
  ref: TRN-A14b
  level: action
  name: Trap-breaker pass
  aliases: [beat the trap]
  actors: passer, receiver
  t0: pass release
  rule: >-
    A pass released at t >= t_trap_on - lead_s while the trap holds (or within hold_after_s of its end). delay =
    t_release - t_trap_on; target class middle (|x_catch| < 3.0), reversal (dy >= 1.0), sideline (|x| >= 5.0),
    over_the_top (dy <= -8.0).
  params:
    lead_s: {value: 0.2, unit: s}
    hold_after_s: {value: 0.2, unit: s}
  min_duration_s: null
  outputs: delay, target class
  confidence: 'press_trap conf x window_conf(p hold of the receiver) x q_obj(receiver, ball)'
  noise: Same as press_trap.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/requirements_review/proposals_consolidated.yaml:5793 (R-ST-24)', supports: pass after the second defender arrives}
  status: canonical
  detector: detect_trap_breaker_pass

- id: press_reversal
  ref: TRN-A15
  level: action
  name: Press reversal (pass back or across)
  aliases: [reverse it]
  actors: passer, receiver
  t0: pass release
  rule: >-
    Ball in the backcourt and a press_trap active or started <= recent_s before: a pass with dy >= back_dy_m, or
    |dx| >= across_dx_m with dy >= -1.0.
  params:
    recent_s: {value: 1.0, unit: s}
    back_dy_m: {value: 1.0, unit: m}
    across_dx_m: {value: 6.0, unit: m}
  min_duration_s: null
  outputs: direction, length
  confidence: 'window_conf(p hold of the receiver) x q_obj(receiver, ball)'
  noise: Same as press_trap.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/taxonomy/offense_full.md F12.1', supports: reverse when trapped}
  status: proposal
  detector: detect_press_reversal

- id: home_run_inbound
  ref: TRN-A16
  level: action
  name: Home-run inbound (full-court long pass)
  aliases: [baseball pass, long inbound]
  actors: thrower, receiver
  t0: t_release
  rule: >-
    A throw_in from behind the far end line (y >= FAR_END_Y) with pass length >= min_len_m and catch y <= half_y;
    pb_home_run_target when the catch is at |x| <= 3.0 and 2.0 <= y <= 6.5.
  params:
    min_len_m: {value: 15.0, unit: m}
  min_duration_s: null
  outputs: length, catch spot, target flag
  confidence: 'throw_in conf x Phi((len - min_len_m) / sigma_dist)'
  noise: The ball can leave the frame mid-flight.
  conflicts_resolved: []
  sources:
  - {url: 'repo:config/named_spots.yaml#pb_home_run_target', supports: 'target, >= 15 m'}
  status: canonical
  detector: detect_home_run_inbound

- id: jump_ball_tip
  ref: TRN-A17
  level: action
  name: Jump-ball tip (control and direction)
  aliases: [tip]
  actors: jumpers, receivers
  t0: t_tap
  rule: Needs t_tap from ball z (jump_ball_release); tip_controlled_by = team of the first has_ball after t_tap.
  params: {}
  min_duration_s: null
  outputs: winner, direction, controller
  confidence: needs ball z
  noise: The tap may fall between frames at 29.97 fps.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/taxonomy/offense_full.md F13.7', supports: tip play}
  status: proposal
  needs_data: true
  detector: detect_jump_ball_tip (returns [])

- id: ft_box_out
  ref: TRN-A18
  level: action
  name: Free-throw box-out
  aliases: [block out on the FT]
  actors: defender, attacker
  t0: first frame of the box-out
  rule: >-
    From the FT release proxy to t_rim + after_rim_s: a defender within lateral_m of an attacker's attacker-to-rim
    segment, nearer the rim, with separation sep_min_m-sep_max_m, for >= min_duration_s, starting after the release
    (the static lane alignment already has that geometry) while the attacker goes for the rim (his 7-frame mean r
    drops by >= attacker_move_m in the window; nothing is boxed out if nobody crashes; a speed test sits at the
    noise floor).
  params:
    after_rim_s: {value: 1.0, unit: s}
    lateral_m: {value: 1.5, unit: m}
    sep_min_m: {value: 0.3, unit: m}
    sep_max_m: {value: 1.2, unit: m}
    attacker_move_m: {value: 0.8, unit: m}
  min_duration_s: 0.5
  outputs: pairs, duration
  confidence: 'window_conf(min(p sep in band, p nearer the rim)) x q_obj(defender, attacker)'
  noise: Contact clusters and centroid swaps.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/taxonomy/offense_full.md F13.6', supports: FT roles}
  status: proposal
  detector: detect_ft_box_out

- id: take_foul
  ref: TRN-A19
  level: action
  name: Take foul / foul to stop the clock / foul up 3 / stop-the-break foul
  aliases: [take foul, intentional foul to stop the break]
  actors: defender, handler
  t0: foul time (PBP)
  rule: >-
    A PBP personal foul on the defense with a tracked approach (closing speed >= 2.0 m/s, distance <= 1.0 m within
    2.0 s before the whistle, no shot). Classes: foul_to_stop_clock, foul_up_3 (leading by 3, <= 12 s),
    transition_take_foul / stop_break_foul (numbers advantage active, before t_scoring_zone).
  params: {}
  min_duration_s: null
  outputs: class, clocks
  confidence: needs PBP foul alignment
  noise: Foul type is not inferable from XY.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/taxonomy/offense_full.md F13.4', supports: foul up 3}
  status: proposal
  needs_data: true
  detector: detect_take_foul (returns [])

- id: tag_and_recover
  ref: TRN-A20 (new, skeptic missing list)
  level: action
  name: Tag and recover on a leak-out
  aliases: [tag the leaker]
  actors: defender, leaker
  t0: tag frame
  rule: >-
    While the ball is at y > half_y after t0_poss: a defender comes within tag_m of the leak_out runner, and within
    recover_s afterwards closes on the ball at >= recover_mps for >= 0.3 s while moving away from the leaker.
  params:
    tag_m: {value: 2.0, unit: m}
    recover_s: {value: 1.5, unit: s}
    recover_mps: {value: 1.0, unit: m/s}
  min_duration_s: null
  outputs: tag frame, recover onset
  confidence: 'window_conf(p_below(dist, tag_m)) over [tag, tag + 0.2 s] x window_conf(p_above(closing, recover_mps)) x q_obj(defender, leaker)'
  noise: The leaker is often off-screen.
  conflicts_resolved: []
  sources: []
  status: proposal
  detector: detect_tag_and_recover
# ============================================================================================== set components
- id: primary_break
  ref: TRN-S01
  level: set_component
  name: Primary break (numbers break)
  aliases: [fast break, numbers break]
  actors: team
  t0: possession_change t0
  rule: >-
    A numbers_advantage episode active when the ball crosses half_y (or started at y <= half_y) with a shot proxy
    before the episode ends + grace_s, or a run_out whose shot follows within runout_shot_s of the run-out end with
    no pull_back of the possession before the shot (loop 1, TRN-T05: a run-out pulled back and shot 10 s later is a
    half-court possession). Flags prim_time_2_3s (shot within 3.0 s) and prim_time_3_9s. Name = '<start_type> ->
    <advance_mode> -> <AvD> -> shot'.
  params:
    grace_s: {value: 0.5, unit: s}
    runout_shot_s: {value: 3.0, unit: s, note: 'shot within this of the run-out end (loop 1, TRN-T05)'}
  min_duration_s: null
  outputs: name, action_sequence, config, time flags
  confidence: 'min(possession_change conf, numbers_advantage conf)'
  noise: Off-screen defenders inflate the advantage.
  conflicts_resolved: ['Primary window 2-3 s (coaching) vs 3-9 s (Fotinakis): both flags.']
  sources:
  - {url: 'repo:docs/research/transition_full.md §2.1, §3.1', supports: definitions}
  status: canonical
  detector: detect_primary_break

- id: secondary_break
  ref: TRN-S02
  level: set_component
  name: Secondary break, flow and pull-back
  aliases: [secondary, flow]
  actors: team
  t0: first structured transition action
  rule: >-
    No primary_break, and >= 1 structured transition action (drag_screen, double_drag, trailer_pitch_back) before
    defense_set or t0 + 12.0 s. flow when no interval >= stall_s with ball speed < 0.5 m/s follows before the next
    action; otherwise pull_back -> half-court set.
  params:
    stall_s: {value: 1.0, unit: s}
  min_duration_s: null
  outputs: actions, flow flag
  confidence: max conf of the structured actions
  noise: Ball-speed stall needs the visible ball; handler proxy.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/research/transition_full.md §2.1 Secondary, Flow', supports: thresholds}
  status: proposal
  detector: detect_secondary_break

- id: early_offense_sequence
  ref: TRN-S03
  level: set_component
  name: Early-offense naming grammar (compositional name + action sequence)
  aliases: [early offense name]
  actors: team
  t0: possession_change t0
  rule: >-
    Name slots: [start_type] -> [outlet class | inbound] -> [advance: push | pass_ahead | walk] -> [break: primary |
    secondary | none] -> [first early action: drag | 77 | pitch_back | none]. A missing slot gives a shorter name,
    never a guessed one. action_sequence = every TRN event in the possession, ordered, with t - t0.
  params: {}
  min_duration_s: null
  outputs: compositional_name, action_sequence, situation = transition_flow
  confidence: possession_change conf
  noise: n/a
  conflicts_resolved: []
  sources:
  - {url: 'repo:schema/tables/set_instances.yaml:219,240,409', supports: 'compositional_name, action_sequence'}
  status: proposal
  detector: detect_early_offense_sequence

- id: push_after_make
  ref: TRN-S04
  level: set_component
  name: Push after a made basket / made FT
  aliases: [push off a make, quick inbound]
  actors: inbounder, team
  t0: t_net proxy (t_rim)
  rule: >-
    Start made_fg: inbound_delay = t_release - t_net <= quick_s AND t_cross_half - t_net <= cross_s. press_present
    when >= 2 defenders at y > half_y at the release. Reported excluding end_of_period by default (needs clock).
  params:
    quick_s: {value: 2.0, unit: s}
    cross_s: {value: 5.0, unit: s}
  min_duration_s: null
  outputs: inbound_delay, cross time, press_present
  confidence: 'throw_in conf (t_net without ball z is a proxy: q_anchor 0.6 stored)'
  noise: t_net needs ball z.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/research/transition_full.md §7.4', supports: 'inbound <= 2.0 s, cross <= 5.0 s'}
  status: canonical
  detector: detect_push_after_make

- id: passed_up_break
  ref: TRN-S05
  level: set_component
  name: Passed-up break (declined / denied / failed)
  aliases: [declined break]
  actors: team
  t0: frame the passed-up condition fires
  rule: >-
    Opportunity: a numbers_advantage episode starting no later than opp_s after the ball crosses half_y (t0 when it
    never crosses; loop 1, TRN-T06: after a far-rim rebound the attackers count only near the ball, 2-3 s after t0).
    Passed-up conditions: slow_crossing (t_cross_half > t0 +
    slow_cross_s), held_ball (handler vbar(0.5) < held_mps for >= held_s before the crossing), pull_back with
    advantage. Category: failed when the other team takes control (a hold >= control_min_s) after t0 and before the
    defense-set time (else the set timeout) (implemented loop 1, TRN-T16), denied when a jam_rebounder or press_trap
    occurred, declined otherwise.
  params:
    opp_s: {value: 1.5, unit: s, note: 'after t_cross_half (t0 if the ball never crosses), loop 1 TRN-T06'}
    slow_cross_s: {value: 6.0, unit: s}
    held_mps: {value: 1.0, unit: m/s}
    held_s: {value: 1.0, unit: s}
  min_duration_s: null
  outputs: condition, category
  confidence: 'numbers_advantage conf x condition probability'
  noise: Ignored-runner relies on off-screen leaks (not implemented in V0).
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/research/transition_full.md §8', supports: rules}
  status: proposal
  detector: detect_passed_up_break

- id: defensive_transition_scheme
  ref: TRN-S06
  level: set_component
  name: Defensive transition scheme (one back, two back, shooter back, send the house)
  aliases: [floor balance scheme]
  actors: shooting team
  t0: t_rel
  rule: >-
    Per shot proxy by scene.defense, from shot_rebound_decision and safety: crash_n = CI; one_back: safety count ==
    1 and crash_n >= 3; two_back: safety count == 2; shooter_back: shooter is the safety and crash_n >= 3;
    send_house: crash_n >= 4 and no safety; everyone_back: crash_n <= 1; else balanced. no_mans_land = defenders at
    y > half_y when the ball first reaches r <= 6.75.
  params: {}
  min_duration_s: null
  outputs: label, crash_n, safety count, no_mans_land
  confidence: mean of the member confs
  noise: As shot_rebound_decision and safety.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/research/transition_full.md §9.8, §9.10', supports: conventions}
  status: proposal
  detector: detect_defensive_transition_scheme

- id: press_active
  ref: TRN-S07a
  level: set_component
  name: Press active (full-court pressure context)
  aliases: [press, full-court press]
  actors: defense
  t0: first frame of the active interval
  rule: >-
    >= min_defenders defenders at y > half_y while the ball is at y > half_y AND the ball's nearest defender within
    engage_m (F9.0); loop 4: only in an offense possession that started with a throw-in (t_disposal until the next
    defense hold; a press is set against an inbound, after a live rebound or steal it is transition defense) and
    counting only defenders that are not retreating (window speed toward their own rim < max_back_mps); enter after >= min_duration_s, exit after >= exit_s false. press_present_loose = >= 2 defenders
    at y > half_y at a backcourt t_disposal (stored by press_break_alignment). Depth from the first engagement: full
    (y >= 21.2598), three_quarter, half_court.
  params:
    min_defenders: {value: 3, unit: players}
    engage_m: {value: 2.0, unit: m}
    exit_s: {value: 1.0, unit: s}
    max_back_mps: {value: 2.0, unit: m/s, note: 'loop 4: a backcourt defender counts only while his window speed toward his own rim is below this (= retreat.onset_mps: a retreating defender is getting back, not pressing)'}
  min_duration_s: 0.5
  outputs: interval, depth
  confidence: 'window_conf(p_below(nearest defender distance, engage_m, sigma_dist)) x q_obj(ball)'
  noise: Backcourt defenders before the inbound are often off-screen.
  conflicts_resolved: ['Press presence F9.0 (>= 3 and an engaged handler defender) canonical; >= 2 loose stored.']
  sources:
  - {url: 'repo:docs/taxonomy/defense_full.md F9.0, A0', supports: press detection}
  - {url: 'repo:config/named_spots.yaml#press_backcourt_zone', supports: region}
  status: canonical
  detector: detect_press_active

