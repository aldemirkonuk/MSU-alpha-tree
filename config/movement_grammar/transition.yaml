- id: press_break_alignment
  ref: TRN-S08
  level: set_component
  name: Press-break alignment templates ('80', '60', 4-Across, Diamond)
  aliases: [press break]
  actors: 4 in-bounds attackers
  t0: t_disposal
  rule: >-
    Backcourt throw-in with press_present_loose (>= 2 defenders at y > half_y at t_disposal). Snapshot = mean
    positions over [t_disposal, t_disposal + snap_s]; minimum-cost matching of the 4 in-bounds attackers to each
    template (and its x mirror); accept the best when mean error < max_err_m and the next template is worse by >=
    margin_m. Templates (attacked-rim frame): 4_across (+-6, 20.5), (+-2, 20.5); 80 (-7, 12.5), (7, 12.5), (0, 4.0),
    (2.5, 23.0); diamond (+-3, 21.26), (+-6.5, 12.7); 60 (0, 17.0), (+-6.5, 13.0), (3.0, 23.0).
  params:
    snap_s: {value: 0.5, unit: s}
    max_err_m: {value: 1.8, unit: m}
    margin_m: {value: 0.4, unit: m}
  min_duration_s: null
  outputs: template, fit error, margin, press_present_loose
  confidence: 'Phi((max_err_m - err) / sigma_fit) x Phi(margin / sigma_fit), sigma_fit = median calibrated position sigma (K_CAL x sqrt(var_p)) of the four over the snapshot / 2 (loop 1, TRN-T16: was a hard-coded 0.3 m)'
  noise: Templates come from coaching sources, not MSU-verified; unmatched instances go to clustering.
  conflicts_resolved: []
  sources:
  - {url: 'repo:docs/taxonomy/offense_full.md F12.2', supports: named press breaks}
  status: proposal
  detector: detect_press_break_alignment

- id: blob_alignment
  ref: TRN-S09
  level: set_component
  name: BLOB alignment
  aliases: [baseline out of bounds, box, stack, line, 4 low]
  actors: 4 in-bounds attackers
  t0: t_disposal
  rule: >-
    Throw-in from behind the attacked end line (y <= END_Y). Snapshot = mean positions over the snap_s before the
    first cut (an in-bounds attacker moving >= cut_mps for >= 3 frames) after t_disposal, else the last snap_s
    before t_release (the set alignment, not the first cut). box: one attacker in blob_box_high on each side and one
    in blob_box_low on each side; line: 4 with |dx| < line_dx_m; stack: >= 3 with |dx| < line_dx_m; 4_low: all four
    at y <= 1.5 (four_low_band) with x spread >= spread_m; else other. Actions after release are matched by the set
    family; name = 'BLOB <alignment> -> ...'.
  params:
    snap_s: {value: 0.5, unit: s}
    cut_mps: {value: 1.5, unit: m/s}
    line_dx_m: {value: 1.0, unit: m}
    spread_m: {value: 9.0, unit: m}
  min_duration_s: null
  outputs: alignment, slots, safety (blob_safety_top) id
  confidence: 'mean over the 4 of Phi(slot margin / sigma_p) x throw_in conf'
  noise: Close clusters in the lane; identity swaps.
  conflicts_resolved: ['BLOB spot: named_spots blob_designated_spot over offense §0.1.']
  sources:
  - {url: 'repo:config/named_spots.yaml#blob_box_high, #blob_box_low, #four_low_band', supports: regions}
  - {url: 'repo:docs/taxonomy/offense_full.md F13.2', supports: templates}
  status: proposal
  detector: detect_blob_alignment

- id: slob_alignment
  ref: TRN-S10
  level: set_component
  name: SLOB alignment
  aliases: [sideline out of bounds]
  actors: 4 in-bounds attackers
  t0: t_disposal
  rule: >-
    Throw-in from beyond a sideline (|x| >= SIDE_X). Snapshot as blob_alignment. line: 4 with |dx| < line_m or |dy|
    < line_m; stack: >= 2 in slob_stack_region; box: two pairs with |dy| < line_m * 1.5 separated by >= 2.5 m in y;
    else spread. backcourt flag when the thrower is at y > half_y.
  params:
    snap_s: {value: 0.5, unit: s}
    cut_mps: {value: 1.5, unit: m/s}
    line_m: {value: 1.0, unit: m}
  min_duration_s: null
  outputs: alignment, backcourt flag
  confidence: 'mean slot margin probability x throw_in conf'
  noise: Bench-side sideline partly occluded.
  conflicts_resolved: []
  sources:
  - {url: 'repo:config/named_spots.yaml#slob_stack_region', supports: stack region}
  - {url: 'repo:docs/taxonomy/offense_full.md F13.3', supports: templates}
  status: proposal
  detector: detect_slob_alignment

