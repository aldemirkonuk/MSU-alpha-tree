  rule: |
    A CUT with: Dr from t_onset to the min-r frame <= dr_max_m; min r <= rim_end_r_m (variant rim) or <= partial_r_max_m (variant partial); mean |angle(v, bearing to rim)| <= bearing_max_deg over main-leg frames with speed >= bearing_min_mps; start outside the paint (sd_paint_out > 0 or r >= start_out_r_m).
    Not emitted when the cutter was a ball screener within screener_precedence_s before onset (ROLL/SLIP). A stationary teammate near the path does not suppress it (loop 1, F06: a wing cut past a standing post got no label at all); when a screen-cut class also fires, cu_precedence ranks it above the basket cut. The contacts are stored (screen_contacts).
