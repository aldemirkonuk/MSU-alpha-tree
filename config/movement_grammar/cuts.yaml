- id: cut_backdoor
  level: primitive
  name: "Backdoor (back cut), standard and short"
  aliases: [OB.P6, back cut, backdoor, dribble_at_backdoor]
  actors: {cutter: off-ball attacker, defender: matched defender, ball_handler: holder at t_rev}
  t0: "t_rev (plant frame of the reversal, or the cut onset for the deny-only branch)"
  rule: |
    Set-up: (step) a pre-chord >= setup_chord_m with Dr >= +setup_dr_m or distance-to-ball decrease >= setup_dr_m, or (deny) for >= deny_min_s in the 1.0 s before t_rev the matched defender is in the passing lane: within deny_lane_m of the cutter -> ball segment at a projection fraction in [deny_frac_lo, deny_frac_hi], and within deny_dist_m of the cutter (loop 1, F10: the bearing test accepted a defender trailing on the high side).
    A candidate t_rev is skipped when the cutter contacts an off-ball screener in [t_rev - screen_skip_before_s, min-r frame]: chin, UCLA and shuffle own those cuts (F10). A deny-only candidate must start rim-ward: Dr over [t_rev, t_rev + deny_rimward_s] <= -deny_rimward_dr_m (loop 2, R1: the onset of a step-out set-up is not a deny cut). Candidates within dedup_s of an emitted one are skipped; the event starts start_before_s before t_rev.
    Reversal: chord turn |A| >= turn_min_deg (fix OB.P6: plant-tolerant), or a rim-ward cut onset from rest for the deny-only branch.
    After t_rev within rim_within_s: min r <= 2.0 m and Dr <= -dr_m.
    Start: r(t_rev) >= start_r_m or d3 >= start_d3_m -> standard; short_r_min_m <= r < start_r_m -> variant short (dunker-line backdoors).
    Behind: the defender overplays at t_rev - 0.3 s (angular margin |angle(def, rim)| - |angle(def, ball)| > 0 deg seen from the cutter), and the cutter then gets nearer the rim than the defender. No defender or ambiguous -> test skipped, conf capped at 0.6.
    dribble_at flag: the holder closes >= dribble_at_close_m on the cutter in the dribble_at_s before t_rev. pass_fake and lob need data (null).
  params:
    turn_min_deg: {value: 120, unit: deg}
    setup_chord_m: {value: 0.8, unit: m}
    setup_dr_m: {value: 0.5, unit: m}
    deny_dist_m: {value: 2.0, unit: m}
    deny_min_s: {value: 0.3, unit: s}
    deny_lane_m: {value: 1.0, unit: m}
    deny_frac_lo: {value: 0.1, unit: fraction}
    deny_frac_hi: {value: 0.7, unit: fraction}
    deny_rimward_s: {value: 0.5, unit: s}  # loop 2 R1
    deny_rimward_dr_m: {value: 0.5, unit: m}  # loop 2 R1
    screen_skip_before_s: {value: 0.5, unit: s}
    start_before_s: {value: 0.5, unit: s}
    dedup_s: {value: 1.0, unit: s}
    rim_within_s: {value: 2.0, unit: s}  # loop 2 R1 (was 1.5): a 7-8 m rim leg takes 2.0-2.1 s at peak <= 7 m/s
    dr_m: {value: 3.0, unit: m}
    start_r_m: {value: 5.5, unit: m}
    start_d3_m: {value: -1.25, unit: m}
    short_r_min_m: {value: 3.0, unit: m}
    dribble_at_s: {value: 1.5, unit: s}
    dribble_at_close_m: {value: 1.5, unit: m}
  min_duration_s: 0.8
  outputs: "t_rev, Dpsi_rev, setup_kind, deny_duration_s, r_rev, min_r, variant (standard|short), behind, dribble_at, received_ball, t_catch"
  confidence: "tests: reversal, setup, min_r, Dr, start, defender_overplay, passes_defender_r; cap 0.6 without a clean defender."
  noise: "Simulation (this file's tests): a step-out, 0.1 s plant and rim cut reads |A| 150-175 deg at 0.3 m noise, versus 0-4 % detection for the velocity-window test. Cutter-defender ID swaps are the main failure (they are within 1 m)."
  observability: "Needs both cutter and defender in frame at t_rev."
  conflicts_resolved:
    - "Reversal size/time: >120 deg (F8.2), >120 deg within 0.6 s (motion_starts), >= 120 deg within 0.4 s (A5): >= 120 deg on the chord turn (0.6 s span), r <= 2.0 within 1.5 s."
    - "Start r >= 6 (A0) vs dunker-line backdoors: standard r >= 5.5 or d3 >= -1.25; short variant 3.0-5.5 m keeps MSU dunker-line backdoors as their own label."
  sources:
    - {url: "https://assets.fiba.basketball/image/upload/documents-corporate-regional-offices-europe-programs-fiba-europe-coaching-certificate-fiba-europe-basketball-terminology.pdf", supports: "Backdoor: step away drawing the defender, then cut behind him to the basket"}
    - {url: "https://www.thehoopsgeek.com/basketball-cuts", supports: "backdoor behind an overplaying defender; dribble-at backdoor"}
  status: proposal
  detector: true

