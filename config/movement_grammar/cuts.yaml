# Movement grammar: cuts and off-ball paths family (CU).
# Single source of truth for tools/specgen/movement/detectors/cuts.py (parameters are loaded at import).
# Frame: named_spots attacked-rim frame (metres, rim at the origin, +y up the floor, theta/m in degrees).
# Time base: 29.97 fps (dt = 1001/30000 s). Elapsed durations are (n_frames - 1) x dt.
family: cuts_and_off_ball_paths
version: 0.9.0
date: 2026-10-23
owner: Mac session
status: proposal
research_input: "families.json element 'Cuts and off-ball paths' (items OB.R0-OB.R5, OB.P1-OB.P20, OB.A1-OB.A13) plus its skeptic check (14 errors, 8 missing items). Ids are renamed OB.* -> CU.*; every high/critical error is fixed in the item it concerns and listed under fixed_check_errors."
conventions:
  conf: "MP-16: conf = P_cond x edge_factor(t0) x gap_factor(window). P_cond = min(window_conf of the rule's per-frame condition, min_i Phi(z_i)) over the rule's tests (weakest link, CU.R1). An event is emitted only if every test passes at its nominal value and conf >= min_conf (0.50); strict when conf >= 0.80."
  stationary: "MP-09 chi-square statistic stationary_s2 < 5.99 (2 dof, 95 %), majority of a 0.3 s window. Raw CA-RTS speed is biased upward at rest (0.3-1.2 m/s at sigma_p 0.3 m), so speed < 0.3 m/s is never used."
  direction_change: "MP-13 chord turn: signed angle between the displacement over [t-0.6, t-0.1] s and over [t+0.1, t+0.6] s (each chord >= 0.5 m). The 0.1 s around t (the plant) is skipped, so a stop-and-reverse keeps its full angle. Per-frame turn rate is never thresholded."
  mirroring: "Rules are written for the ball on the +x side where a side matters; mirrored spots are tested on either side and the side is checked with sign(x) x ball_side."
  ball_side: "ball_side = sign(bx) with the named_spots 0.9 m dead band; bx is the ball track, or the holder's position when the ball track is missing. strong: x x ball_side >= 0.9; weak: <= -0.9."
  has_ball: "has_ball(p, t) = scene.holder[t] == p. While the ball is in flight nobody has it, so a passer-cutter is off-ball from the first frame after release (fixes check 'missing: has_ball state for passer-cutters')."
  units: "m, s, m/s, deg, 1/m; fractions are 0-1."
  min_duration: "Every item's min_duration_s is enforced at emission: an event with (end - start) x dt < min_duration_s is dropped (loop 1, F18)."
# REnn codes in loop-9 evidence are individual real SportVU events; the code-to-event key is kept in the private evidence folder, never in this repo.
changes_loop9:
  # Loop 9 (structural redesign of the transition carry): the loop-8 confirmer's C8-1..C8-3, plus the low items C7-3 residual
  # and L8-05. Real data = 3 NBA 2015-16 SportVU games, 6855 s of clock-running play, sigma told 0.15 m, realdata.py --frame
  # team_ends (default), rates per 48 min, both teams, clean | n0.3 | n0.5, all from the official realdata.py runner
  # (--families cuts). Synthetic = the five scratch harness copies (9,660 runs each at sigma_p 0.2 / 0.3 / 0.5), the loop-6..8
  # fixer and confirmer adversarial scenes (10 or 20 seeds per sigma) and 7 loop-9 scenes. Only aggregate counts are kept here.
  # No constant was fitted on the 3 games: carry_push_mps / carry_push_chord_s / carry_push_span_s are transition TRN-P08's push
  # definition, carry_post_s is the confirmer's ~1.3 s post-release segment, carry_post_k is a 1-sigma one-sided test.
  - id: L9-00 frame re-measure (team_ends) and loop-8 baseline
    what: "No code change. Loop-4 code re-run under nearest_player and team_ends (clean), loop-8 code under team_ends (clean | n0.3 | n0.5), before any fix."
    why: "realdata.py defaults to --frame team_ends (12/12 team-halves agree with PBP; nearest_player mislabelled about 25 % of chunks); the loop-9 baseline is loop-8 code on the official runner."
    evidence: "Loop-4 code, clean, nearest_player -> team_ends: cut 533.1 -> 528.9, cut_basket 80.7 -> 97.0, cut_fade 87.4 -> 52.1, cut_i 37.8 -> 37.8, cut_banana 35.7 -> 37.4, cut_veer 18.1 -> 20.2, cut_straight 14.7 -> 12.6, cut_v 11.3 -> 11.3, fill 10.1 -> 13.0, relocate 160.1 -> 183.2 (identical to loops 5-8). Loop-8 code, official realdata.py, team_ends: cut 485.2 | 452.9 | 442.8, cut_basket 91.2 | 89.9 | 87.8, cut_i 16.8 | 17.6 | 34.0, cut_veer 12.2 | 17.6 | 36.1, cut_banana 26.9 | 23.1 | 25.2, cut_shallow 4.6 | 5.0 | 4.2, relocate 171.0 | 175.2 | 194.9 (identical to the loop-8 fixer and confirmer). 0 errors."
  - id: L9-01 push vs pass-and-cut by structure; burst margin removed (C8-1)
    what: "cu_postrules transition carry: after a run over half court, a handler who released the ball out of a push (every 1.0 s chord ending in the last 0.5 s before the release >= carry_push_mps 4.0 m/s, the TRN-P08 push: vbar(1.0) >= 4.0 m/s for 1.5 s while holding) and keeps running after it is the transition, whatever he does next (sprints, accelerates, fills). After a jog-up (no push) the pass is the phase change and carry_burst_ratio 1.25 is only a secondary cue among handlers who keep running: a burst (whole-label median >= 1.25 x the carry median, L7-02 form) is a half-court pass-and-cut, a steady continuation the transition. carry_burst_k (L8-03) is removed. XY only; ball_z is not used."
    why: "Loops 6-8 separated the hit-ahead push (synthetic N1) from the jog-up pass-and-burst by re-tuning a pace ratio; L8-03's 1-sigma margin raised the effective ratio to 1.5-1.8 at sigma 0.3-0.5 and cut genuine pass-and-cut recall (confirmer C8-1). The push itself is the structural transition cue: N1 and every push negative release the ball at 4.6-5.5 m/s (1.0 s chord), every walk-up or jog-up positive at 1.7-3.7 m/s. Evaluated and declined: (a) a hit-ahead requirement on the release pass (receiver nearer the attacked rim, TRN-A02 timing): identical decisions on all 166 | 172 | 211 real carry candidates and on every synthetic scene, and a push that kicks laterally and fills the corner (real clean g492) is still the break, so direction is not required; (b) defense set by defenders behind the ball at the label start: 5 of 5 on almost every real carry candidate, so it does not separate jog-up continuations from pass-and-cuts (rule (2) is unchanged); (c) treating every jog-up continuation as half-court when the defense is set: about +33 clean labels, several clear transition runs on inspection (a push that kicks and drifts to the corner, a run-catch-pass-run), declined."
    evidence: "Synthetic hits (10 or 20 seeds, sigma 0.2 | 0.3 | 0.5), loop 8 -> loop 9: N1 push / hit-ahead / accelerate 0 | 0 | 0 -> 0 | 0 | 0 (0 of 30 seeds); new N1b 4.9 m/s push, hit-ahead, 1.2x acceleration 1 | 1 | 1 -> 0 | 0 | 0 of 20 (0 | 0 | 1 of 30); confirmer C6 (ratio 1.47) 12 | 7 | 3 -> 18 | 14 | 12 of 20 and C7 (1.36) 3 | 2 | 2 -> 11 | 9 | 7 of 20 (both the loop-7 best); P3 0 | 0 | 0 -> 2 | 1 | 1 (loop-7 best); l7_jog_pass_burst 10 | 9 | 7 -> 10 | 10 | 10; C1 / C2 / C4 / C5, N2 / N3, push / jog push / lane / defense-back / ball-backcourt negatives stay 0. Real n0.3 | n0.5: the 5 genuine pass-and-cuts the L8-03 margin lost come back (RE01 at n0.3 and n0.5, RE02, RE03, RE04 at n0.5; clean positions: walk or jog 2.0-3.4 m/s, pass, burst 4.1-5.0 m/s to the rim). Tests test_l9_01_push_is_a_structural_transition_and_the_burst_has_no_margin (fails on loop 8: C6 rate 0.5), test_l8_03 updated, test_l7_02 stability now perturbs the ratio +-0.1, carry_post_k +-0.5 and carry_push_mps +-0.25."
  - id: L9-02 keeps running judged on the post-release segment (C8-2)
    what: "The transition carry's 'keeps running pace' test uses the label's first carry_post_s 1.3 s (the post-release segment up to the settle), not the whole-label median. For a handler after a jog-up the post-release median must clear carry_run_mps by carry_post_k 1.0 sigma of that median (one-sided, sigma = 1.2533 x chord sigma / sqrt(n_eff)); pushes (L9-01) and off-ball runners (L9-03) use the plain test."
    why: "A label that ends in a settle has a whole-label median below the gait speed even when the actor ran 4 m/s for 1.3 s after the pass (real n0.5 RE05: a lateral pass, a 3.9-4.3 m/s run down the side to the corner and a settle, labelled cut_banana by loop 8). The post-release window alone lets a 1.7-1.9 m/s relocation read as a run on noise (plain post test: synthetic C9 12 | 9 | 8 -> 10 | 7 | 7, P4b 2 | 5 | 4 -> 2 | 4 | 3), so the jog-up handler's test is one-sided: the default after his pass is the half-court reading unless the run is significant."
    evidence: "Synthetic: new C13 push, hit-ahead, 4.5 m/s run to the corner, settle: cut 5 | 1 | 2 -> 0 | 0 | 0 of 20 (relocate 0 | 0 | 1 -> 0); P4 5 | 5 | 5 -> 5 | 5 | 6; P4b 2 | 5 | 4 -> 2 | 5 | 4; C8 7 | 7 | 6 unchanged; C9 12 | 9 | 8 -> 14 | 11 | 10 of 20. Real: RE05 n0.5 cut_banana removed (correct). Cost on clean: 2 relocations whose first second after the pass is a 2.3-2.6 m/s jog (RE06, RE07; they come back at n0.3 / n0.5 where the margin is wider) and 1 borderline drive-kick-drift cut (RE08). Test test_l9_02_keeps_running_is_judged_on_the_post_release_segment (fails on loop 8: C13 cut rate 0.13; its relocation part fails without carry_post_k: 12 of 20 vs >= 16)."
  - id: L9-03 off-ball runner who slows after the crossing is half-court (C8-3)
    what: "An off-ball runner whose run carried over half court is the transition only while he keeps running pace in the label's first carry_post_s (median chord >= carry_run_mps); one who slows to a walk starts a half-court action, guarded by rules (2) defense not set and (3) ball beyond half court as before."
    why: "Loop 8 restored the walk-pace relocation after a jog-up only for handlers; the same motion by an off-ball runner (confirmer C10) was still dropped as a transition carry, an asymmetry with no structural reason."
    evidence: "Synthetic: carry decision on the C10 motion (off-ball jog 2.8 m/s into a 1.5 m/s relocation vs a set defense) transition 10 | 10 | 10 -> 1 | 1 | 2 of 10; with 2 defenders still back (new C11) 10 | 10 | 10 unchanged (rule (2)); C10 itself emits no relocate label in either loop (no trigger: a detection limit, not the carry). Off-ball sprint, lane-run and flight-past-runner negatives stay 0. Real: clean +3 labels (RE01 relocate after a 3.3 m/s run, RE09 cut_i after a 4.4 m/s run that stops, RE10 cut_backdoor after a tracking jump in the carry window), n0.3 +2, n0.5 +6: on clean positions every runner had slowed to 0.3-1.8 m/s before or in the label's first second, so the phase is half-court; at n0.5 the added kinds are 4 cut_i and 2 cut_veer whose kind is the known high-noise-tier weakness (one, RE11, ends a sprint to the corner and is borderline). Test test_l9_03_off_ball_runner_who_slows_after_the_crossing_is_half_court (fails on loop 8: 0 of 20 half-court)."
  - id: L9-04 dribble with a holder dropout is on-ball
    what: "After a run, when the actor's next ball touch after his holder run is his own and starts inside the label (no pass, no shot, nobody else touched the ball), the ball was never released: on-ball, the carry keeps the label out (extends L8-02)."
    why: "Without the L8-03 margin two real n0.5 dribble drives came in as cuts (RE12, RE13: on clean positions the actor holds the ball through the label; the raw ball and the smoothed handler drift > 1.0 m apart for 0.5-1 s, so his holder run breaks just before the label start and resumes inside it). A ball-proximity test (median ball-handler distance <= mvlib HOLD_R over 0.5 s) was tried first and caught neither (the same drift), so the structural next-touch rule is used."
    evidence: "Real n0.5: both on-ball drives removed (0 other real changes at any noise level). Synthetic: new D1 drive with a 0.5 s ball dropout cut 0 | 0 | 2 -> 0 | 0 | 0 of 20; jog-up pass-and-cut and give-and-go positives unchanged (the next touch is another player's). Test test_l9_04_dribble_with_a_holder_dropout_is_on_ball (fails on loop 8, 19 of 20, and without the rule)."
  - id: L9-05 C7-3 residual and L8-05 rim-zone cost documented as resolution limits (no code change)
    what: "No code change. The near-threshold lateral I in-legs (60 deg rule) and the small L8-05 rim-zone recall cost are kept as documented resolution limits."
    why: "C7-3 residual: the remaining false I-cuts read their in-leg chord at 53-61.6 deg, a 63-70 deg true chord with 4-8 deg of direction noise; any tighter chord test costs 30-55 deg I-cut recall (loop-8 chord / axis agreement test: -2 FP of 60 for -1-2 TP of 60). L8-05: a 55 deg dunker-spot I into the rim zone 8 | 4 | 2 -> 6 | 3 | 2 of 20 is the price of the radial-depth test that removed the under-rim shuffles; short rim-zone I recall is low in any case. No structural cue was found that separates them (the I geometry is the whole evidence)."
    evidence: "Loop 9 changes no cut_i path: the I scenes of every adversarial set (I1 2 | 3 | 0, slot 63 deg, corner 68 deg, I_c dunker 55 deg, radial rim-zone I) and every harness cut_i aggregate (38 | 30 | 21 of 40) are identical to loop 8; real cut_i changes come only from L9-03 (carry phase), clean 16.8 -> 17.2."
  - id: loop9-summary
    what: "Real per 48, official realdata.py, team_ends, loop 8 -> loop 9, clean | n0.3 | n0.5: cut 485.2 | 452.9 | 442.8 -> 484.8 | 452.9 | 444.9; cut_basket 91.2 | 89.9 | 87.8 -> 91.2 | 90.3 | 89.1; cut_i 16.8 | 17.6 | 34.0 -> 17.2 | 18.1 | 35.7; cut_veer 12.2 | 17.6 | 36.1 -> 12.2 | 18.1 | 37.0; cut_banana 26.9 | 23.1 | 25.2 -> 26.9 | 23.5 | 25.2; cut_shallow 4.6 | 5.0 | 4.2 -> 4.6 | 5.5 | 5.0; relocate 171.0 | 175.2 | 194.9 -> 170.6 | 176.4 | 196.2; cut_straight, cut_v, cut_curl, fill unchanged. 0 errors. Label diffs (move excluded): clean +3 / -3, n0.3 +9 / -1, n0.5 +20 / -1."
    why: "Acceptance check after the structural redesign; every changed real event was inspected on clean positions."
    evidence: "Synthetic: the five harness copies (9,660 runs each, 0 errors) have aggregates identical to loop 8; every adversarial scene outside the carry rule is identical. Real inspection (clean positions, 30 unique changed events): the 5 lost pass-and-cuts recovered, the n0.5 transition fill (RE05 cut_banana) removed, half-court relocations after a pass restored at n0.3 / n0.5, off-ball runners that stopped before their label half-court. Residual: 1 n0.5 transition FP (RE14: a 4.0-4.2 m/s carry, hit-ahead pass and a steady 4.0 m/s run to the rim; noise compresses its carry to 3.5 m/s, below the push speed, so it reads as a 1.29x burst), 3 borderline n0.3 / n0.5 additions (a jog-up then 4.2 m/s basket cut, RE10; a pass and drift down the side, RE15; the end of a sprint to the corner, RE11) and the 3 clean removals of L9-02."
changes_loop8:
  # Loop 8 (final targeted pass): the loop-7 confirmer's C7-1..C7-4 and synthetic N1. Real data = 3 NBA 2015-16 SportVU
  # games, 6855 s of clock-running play, sigma told 0.15 m, --frame team_ends; rates per 48 min, both teams, clean | n0.3 |
  # n0.5, all from the official realdata.py runner (--families cuts). Synthetic = the five scratch harness copies (9,660
  # runs each at sigma_p 0.2 / 0.3 / 0.5) plus the loop-6 / loop-7 fixer and confirmer adversarial scenes and 4 loop-8
  # scenes (10 seeds per sigma). Only aggregate counts are kept here. No new constant was fitted on the 3 games.
  - id: L8-00 frame re-measure (team_ends) and loop-7 baseline
    what: "No code change. Loop-4 code re-run under nearest_player and team_ends (clean), loop-7 code under team_ends (clean | n0.3 | n0.5), before any fix."
    why: "realdata.py defaults to --frame team_ends (12/12 team-halves agree with PBP; nearest_player mislabelled about 25 % of chunks); the loop-8 baseline is loop-7 code on the official runner."
    evidence: "Loop-4 code, clean, nearest_player -> team_ends: cut 533.1 -> 528.9, cut_basket 80.7 -> 97.0, cut_fade 87.4 -> 52.1, cut_i 37.8 -> 37.8, cut_banana 35.7 -> 37.4, cut_veer 18.1 -> 20.2, cut_straight 14.7 -> 12.6, cut_v 11.3 -> 11.3, fill 10.1 -> 13.0, relocate 160.1 -> 183.2 (identical to loops 5-7). Loop-7 code, official realdata.py: cut 484.4 | 452.9 | 446.2, cut_basket 91.2 | 90.3 | 89.1, cut_i 17.2 | 18.1 | 36.1, cut_veer 12.6 | 18.1 | 36.5, cut_banana 26.5 | 23.5 | 24.8, cut_shallow 4.6 | 5.5 | 5.0, cut_curl 0.8 | 2.5 | 4.6, relocate 169.7 | 175.2 | 194.9 (matches the loop-7 fixer and confirmer)."
  - id: L8-01 carry exemption only while the actor is the ball handler (C7-1)
    what: "cu_postrules transition carry, rule (a): after a run carried over half court, a handler who released the ball by the label start is judged on his own phase after the pass, not on his pre-pass carry pace: the crossing is a transition only when the label keeps running pace (label median 0.5 s chord >= carry_run_mps, the 2.0 m/s gait speed, no sigma allowance since noise biases chord speed up) and is not a burst. (L8-01b) The run itself also needs its median chord >= carry_run_mps (the -carry_sustain_k sigma allowance stays on the slowest chord only). Off-ball runners keep the loop-7 rule. XY only."
    why: "L7-02 dropped every label after a run unless the handler burst, so a handler who jogged the ball up, passed and slowed into a walk-pace relocation, banana or veer lost a half-court label (the documented rule says a jog-up that slows into the pass is half-court; only a push that keeps its pace is the transition), and the -1 sigma allowance (0.2 m/s on clean tracks) turned a 1.8-1.9 m/s walk-up into a run."
    evidence: "Real clean +6 labels (relocate +3, cut +2, cut_banana +1), the same 6 restored on the 167 clean carry candidates offline; inspected by position: 3 jog-ups (2.9-3.4 m/s) that pass at y 10.8-11.5 and walk (1.0-2.0 m/s) to a wing (relocate), one 3.5 m/s jog-up that passes and walks into a banana, the 1.8-2.0 m/s walk-up that passes and cuts (L8-01b), and one 4-4.9 m/s drive that kicks out at the top of the key and drifts at 1.5-3.1 m/s to the left wing (post-pass relocation, borderline). These are 5 of the 10 unique clean loop-7 removals the loop-7 confirmer flagged (4 walk-pace post-pass moves and the sub-gait walk-up); the other 5 keep running at 2.5-3.5 m/s after the pass and stay transition. n0.3 +1 cut, n0.5 +1 cut_banana. Synthetic, 0.2 | 0.3 | 0.5 of 10: confirmer P4 (jog 2.8, pass, slow relocate) 0 | 0 | 0 -> 5 | 5 | 5, P4b (jog 2.5) 0 | 1 | 1 -> 2 | 5 | 4 (loop 6 2 | 5 | 4; the remaining misses have no raw relocate event, detection not the carry); walk-up pass-and-cut 10 | 10 | 9, jog-up pass-and-cut G5 10 | 10 | 10, off-ball walk-up 10 | 10 | 10, arrive-settle 10 | 10 | 8 unchanged; every transition negative (push, jog push, lane sprint, 3.4 m/s lane run, defense back, ball in the backcourt, jog that keeps its pace) stays 0. Test test_l8_01_post_pass_slow_down_is_judged_on_its_own_phase (loop 7: P4 relocate 0.0, carry rule on the sub-gait walk-up 0 of 10 half-court)."
  - id: L8-02 burst exemption needs a release by the label start (C7-2)
    what: "cu_postrules transition carry: a holder run of the actor (mvlib holder runs, blips dropped, gaps bridged) that goes on past the label start makes the label on-ball: the run keeps the carry, no handler exemption. Releasing on the label's first frame is a release; a catch that starts inside the label is allowed."
    why: "L7-02 only checked that the actor had the ball in [crossing - 1 s, start], so a handler who kept dribbling into the label got a burst-restored cut_veer / cut_curl (dribble drives tagged as off-ball cuts)."
    evidence: "Clean carry candidates: of 116 handler candidates 106 release on the label's first frame or the frame before it, 7 earlier, and 3 hold the ball 21-32 frames into the label (one loop-7 kept cut_veer, two cut_i already dropped). Real clean -1 cut_veer (a 3.7 -> 5.0 m/s dribble drive holding the ball 0.7 s into the label); n0.3 -2 and n0.5 -3 (cut_curl / cut_veer / cut on the same kind of drive; all three inspected hold the ball to the rim on clean tracks). Test test_l8_02_burst_exception_needs_a_release_before_the_label (loop 7: 14 of 20 dribble-drive windows read as half-court)."
  - id: L8-03 a burst must be significant (synthetic N1)
    what: "cu_postrules transition carry: the handler's burst is label median chord >= carry_burst_ratio x carry median by carry_burst_k 1.0 sigma of the two medians (sigma of a median = 1.2533 x chord sigma / sqrt(n_eff), n_eff = frames the chords span / chord length; the 1-sigma convention of carry_sustain_k). Declined variant: the carry pace taken over [crossing - carry_hold_back_s, start] (more chords) restored the confirmer's P3 to 7 | 4 | 3 of 30 but dropped a clean jog-up that slows to 2 m/s into the pass and then cuts, and readmitted two n0.5 dribble drives."
    why: "The confirmer's N1 push (4.5 m/s, hit-ahead pass, then 5.6 m/s to the rim, ratio 1.24) passed the nominal 1.25 ratio on noise (0 | 2 | 0 of 10). Over 30 seeds its burst z peaks at 0.38 | 0.69 | -0.18, so a 1-sigma margin keeps it out at every sigma; the formula sigma is within 1.0-1.4x of the empirical spread of the median difference (N1, P3, N4, 40 seeds)."
    evidence: "Synthetic N1 0 | 2 | 0 -> 0 | 0 | 0; N2-N4 and every push stays 0. Cost: confirmer P3 (3.0 -> 4.0 m/s, truth ratio about 1.27, z median -0.2) 2 | 1 | 1 -> 0 | 0 | 0, the loop-6 level. Real clean unchanged (every clean pass-and-burst has z >= 1.2); n0.3 -4 and n0.5 -12 labels. Inspected by clean position (14 unique noisy events across L8-02 / L8-03): 4 steady continuations or pushes that keep 3-4 m/s after the pass (correct, consistent with clean), 4 on-ball drives (L8-02, correct), 1 borderline, and 3-4 jog-up pass-and-bursts (clean ratio 1.5-1.9) whose noisy ratio falls to 1.25-1.45 (recall lost at noise; loop 6 did not keep them either). The synthetic 1.6x jog-up pass-and-burst (l7_jog_pass_burst) reads 10 | 9 | 7 of 10 (loop 7 10 | 10 | 10). The L7-02 stability test now perturbs the ratio by +-0.05 and carry_burst_k by +-0.5 (at ratio 1.35 the margin drops that scene to 0.8). Test test_l8_03_push_that_hits_ahead_and_accelerates_stays_a_transition (loop 7: 0.067)."
  - id: L8-04 cut_i chord tolerance bounded (C7-3)
    what: "cut_i in_dir: the in-leg chord's own angle to the rim bearing from its start <= in_dir_max_deg + min(in_dir_tol_k x its direction sigma, in_dir_tol_max_deg 2.0 deg). The bound is the tolerance's value for a 1.8 m leg at the lowest production tier (sigma_p 0.2, direction sigma about 4 deg)."
    why: "Unbounded, the tolerance grew with the noise (0.5 x 4-9 deg at sigma 0.2-0.5), so a 67-70 deg lateral in-leg whose out-leg overshoots past the start (axis 58 deg) passed in_dir on noise (confirmer I1 0 | 1 | 0 -> 3 | 3 | 1)."
    evidence: "Synthetic I1 3 | 3 | 1 -> 2 | 3 | 0; 60 seeds raw in-leg tests: I1 3 | 9 | 7 -> 2 | 7 | 5, lateral back-out 2 | 7 | 4 -> 1 | 4 | 3; 55 deg I-cuts lose 0-2 of 60 per sigma (I5 corner 0 | 0 | 2, slot 2 | 0 | 0). The remaining I1 hits read their in-leg chord at 53-61.6 deg (inside 60 + 2): a 67 deg measured chord with 4-8 deg of direction noise, the resolution limit of the 60 deg rule, not the tolerance; a chord / axis agreement test (chord - axis <= 1.5 sigma) removed 2 more of 60 at sigma 0.2 and 0.3 but cost 1-2 of 60 on the 30-55 deg I-cuts and was declined. Real: clean 0, n0.3 -1, n0.5 -2 cut_i (all three are loitering wing / handler moves on clean tracks). Harness cut_i unchanged. Test test_l8_04_i_cut_chord_tolerance_is_bounded (loop 7: chords to 63.1 deg emitted, lateral overshoot 0.23)."
  - id: L8-05 rim-zone I-cut needs radial depth (C7-4)
    what: "cut_i in_depth: when the I reaches the rim zone (r < cut_basket.rim_end_r_m 2.0 m at its start, apex or axis midpoint) the in-leg also needs -Dr / L1 >= cos(in_dir_max_deg) (the L6-03 form, z-test with sigma_disp / L1). No new constant: the zone is the family's rim-end radius and the depth is the 60 deg rule."
    why: "Near the rim the bearing is ill-defined (a 1-1.5 m leg ending under the rim spans 40-90 deg of bearing, and sigma_p / r is 15-25 deg at sigma_p 0.5), so under-rim shuffles and lateral drifts passed the L7-01 angles at added noise (loop-7 confirmer: 3 of 8 sampled n0.5 additions)."
    evidence: "Real n0.5 -3 cut_i: the confirmer's three under-rim cases (a run under the rim and back out, a baseline shuffle under the rim, an under-rim drift; all three clean-inspected). Clean -1: a 1.6 m down-and-up toward the baseline at the left block (depth 0.497, ambiguous). Synthetic: under-rim lateral shuffle 2 | 1 | 0 -> 0 | 0 | 0, under-rim drift and back 3 | 3 | 1 -> 0 | 0 | 1; radial I into the rim zone unchanged (block 9 | 3 | 1, confirmer I4 rim dip 7 | 4 | 3, harness cut_i 38 | 30 | 21 of 40). Test test_l8_05_rim_zone_i_cut_needs_radial_depth (loop 7: shuffle 0.15)."
  - id: loop8-summary
    what: "Official realdata.py, per 48, loop 7 -> loop 8, clean | n0.3 | n0.5: cut 484.4 | 452.9 | 446.2 -> 485.2 | 452.9 | 442.8; cut_basket 91.2 | 90.3 | 89.1 -> 91.2 | 89.9 | 87.8; cut_i 17.2 | 18.1 | 36.1 -> 16.8 | 17.6 | 34.0; cut_veer 12.6 | 18.1 | 36.5 -> 12.2 | 17.6 | 36.1; cut_banana 26.5 | 23.5 | 24.8 -> 26.9 | 23.1 | 25.2; cut_shallow 4.6 | 5.5 | 5.0 -> 4.6 | 5.0 | 4.2; cut_curl 0.8 | 2.5 | 4.6 -> 0.8 | 2.1 | 4.2; relocate 169.7 | 175.2 | 194.9 -> 171.0 | 175.2 | 194.9; cut_straight 10.9 | 13.0 | 13.4 and cut_v 8.8 | 13.9 | 16.8 unchanged. Labels (move excluded) clean +6 / -2, n0.3 +1 / -7, n0.5 +1 / -20; 0 errors."
    why: "Open (known limits): the high-noise cut_veer / cut_i residual of L7-05 (n0.5 / clean 3.0 and 2.0); pass-and-burst recall at n0.5 (L8-03); I1-type 65-70 deg lateral in-legs at the 60 deg rule's resolution (L8-04)."
    evidence: "Synthetic: all five harness copies 9,660 / 9,660 runs, 0 errors, aggregates identical to loop 7 (cut_i 38 | 30 | 21 of 40, cut_veer 40 | 35 | 21, cut_straight 60 | 60 | 53). Adversarial changes only on the scenes listed in L8-01..05 (and the 55 deg slot I 9 -> 8 at sigma 0.2, the fast sideline down-and-up probe 8 | 5 -> 6 | 4 at 0.3 | 0.5); the loop-5/6 regressions stay fixed: walk-up pass-and-cut 10 | 10 | 9, confirmer I5 corner 55 deg 9 | 7 | 2 (loop-7 c6) and 10 | 10 | 7 (c7)."
changes_loop7:
  # Loop 7 (regression-only finishing pass): the loop-6 confirmer's C6-1..C6-4. Real data = 3 NBA 2015-16 SportVU games,
  # 6855 s of clock-running play, sigma told 0.15 m, --frame team_ends; rates per 48 min, both teams, clean | n0.3 | n0.5,
  # all from the official realdata.py runner (--families cuts, sequential noise RNG). Synthetic = the five scratch harness
  # copies (9,660 runs each at sigma_p 0.2 / 0.3 / 0.5, run without shims) plus the loop-6 fixer and confirmer adversarial
  # scenes and 7 loop-7 scenes (10 seeds per sigma). Only aggregate counts are kept here.
  - id: L7-00 frame re-measure (team_ends) and loop-6 baseline
    what: "No code change. Loop-4 code re-run under nearest_player and team_ends (clean), loop-6 code under team_ends (clean | n0.3 | n0.5), before any fix."
    why: "realdata.py defaults to team_ends since loop 4 (12/12 team-halves agree with PBP; nearest_player mislabelled about 25 % of chunks); the loop-7 baseline is the official runner."
    evidence: "Loop-4 code, clean, nearest_player -> team_ends: cut 533.1 -> 528.9, cut_basket 80.7 -> 97.0, cut_fade 87.4 -> 52.1, cut_i 37.8 -> 37.8, cut_banana 35.7 -> 37.4, cut_veer 18.1 -> 20.2, cut_straight 14.7 -> 12.6, cut_v 11.3 -> 11.3, fill 10.1 -> 13.0 (identical to loops 5 and 6). Loop-6 code, official realdata.py: cut 485.2 | 452.9 | 444.9, cut_basket 90.7 | 89.5 | 87.8, cut_i 16.8 | 19.7 | 34.0, cut_veer 12.2 | 18.1 | 37.0, cut_straight 10.9 | 13.0 | 13.4, cut_v 8.8 | 13.9 | 17.2, cut_banana 27.3 | 23.5 | 25.6, relocate 171.0 | 176.0 | 196.6 (matches the loop-6 confirmer)."
  - id: L7-01 I-cut 60 deg rule as the documented angular test (C6-1)
    what: "cut_i: the L6-03 floor Dr <= -in_dir_frac x L1 is replaced by two angle tests against the bearing to the rim: in_axis, the I's axis (midpoint of its two outer ends -> apex) within in_dir_max_deg 60 of the bearing from that midpoint (z-test, sigma from the axis and bearing noise); in_dir, the in-leg chord within 60 + in_dir_tol_k 0.5 x its direction sigma of the bearing from its start. The L5-02 significance margin Dr <= -in_dr_k x sigma_disp stays."
    why: "Dr / L1 >= 0.5 is the angle at the chord's midpoint bearing; the radial turns along an off-radial leg, so from the start the cutoff was 50-53 deg for a 2 m leg at r 7 m and a corner I-cut 55 deg off its start radial failed (confirmer I5 10 | 10 | 3 -> 3 | 4 | 3). Measured from the start the 55 deg I and the 65 deg sideline walk are 10 deg apart with 5.5-6 deg of direction noise at sigma 0.2 (estimators compared on 20 seeds: chord, thirds-mean and line fit all 5.5-5.7 deg); the axis uses the out-leg as a second look at the same line (4.5 deg). Axis alone let a lateral in-leg whose out-leg comes back elsewhere read 57 deg (clean real arc slide, chord 73 deg), hence the chord guard; its tolerance 1.0 sigma let that shape back (3 of 20), 0 cost the 55 deg corner I (16 -> 13 of 20)."
    evidence: "Real cut_i 16.8 | 19.7 | 34.0 -> 17.2 | 18.1 | 36.1. Inspected by position: 12 clean events near the 60 deg boundary (the one clean removal is a corner sideline walk at x -7.3 that L6-03 kept; the gains are a 54 deg wing-low down-and-up and an under-rim dip; the axis-only arc slide is rejected by the chord guard) and 21 noisy changes (n0.3: 4 removed events with a clean I counterpart, axis 60-62 deg; n0.5: 11 added, 10 without a clean counterpart, 5 of them under the rim at r < 3 m: part of the documented high-noise I-cut residual). Adversarial, 0.2 | 0.3 | 0.5 of 10: confirmer I5 corner 55 deg 3 | 4 | 3 -> 9 | 7 | 2; wing 55 deg 5 | 5 | 2 -> 8 | 6 | 2; corner 55 deg mirrored 6 | 6 | 4 -> 8 | 6 | 3; slot 55 deg 5 | 5 | 2 -> 9 | 6 | 1; wing 50 deg 8 | 5 | 3 -> 10 | 9 | 3; 45 deg wing 10 | 8 | 4 -> 10 | 9 | 4; 40 deg 10 | 9 | 4 -> 10 | 9 | 5; 30 deg, radial, short and baseline I unchanged; negatives: corner sideline walk (65 deg) 2 | 2 | 1 -> 2 | 2 | 2, 65 deg wing 1 | 2 | 1 -> 2 | 3 | 1, 70 deg corner 0 | 0 | 1 -> 0 | 1 | 1, 70 deg wing 0 | 1 | 1 unchanged, wing-to-corner-and-back 0 | 0 | 1 unchanged, rim shuffle and step-back 0 | 0 | 0-1 unchanged. Probe: a fast 2 m down-and-up along the sideline from the wing-low spot (x 7, y 5 -> 3) is 54 deg off the start radial, inside the documented 60 deg, and now reads as an I-cut (2 | 3 | 4 -> 10 | 8 | 5); a slow walk of that shape still fails out_peak below the high-noise tier. Harness cut_i unchanged in all five (38 | 30 | 21 of 40). Test test_l7_01_i_cut_angle_is_the_documented_60_deg (loop 6: corner 55 deg 0.35 at sigma 0.2 / 0.3)."
  - id: L7-02 carry run test without a speed inside the jog-up band (C6-2)
    what: "cu_postrules transition carry, rule (a): every 0.5 s chord from the crossing to the label start >= carry_run_mps 2.0 - 1 sigma (walk-run gait transition, Froude 0.5), and, when the actor had the ball in [crossing - carry_hold_back_s 1.0 s, start], no burst after the pass (label median chord pace < carry_burst_ratio 1.25 x the carry's median chord pace). carry_sustain_mps 3.0 is removed. Rules (b) defense not set and (c) ball in the backcourt are unchanged. XY only."
    why: "carry_sustain_mps 3.0 sat inside the dense 2.5-3.5 m/s band of real jog-up speeds (kept carry labels 33 / 48 / 69 at 2.5 / 3.0 / 3.5). No kinematic feature of the 166 clean carry candidates has a natural gap (chord min speed, pace retention, defender retreat speed, defenders goal-side all continuous); the defense-based alternatives were declined: all-defenders-goal-side restored about 50 lane runs and pushes at 3-6 m/s, and the defender retreat speed is as dense (kept 58 / 68 / 83 at 0.75 / 1.0 / 1.25 m/s). The split that holds is ball-holder status: a handler who passes and then bursts (the label pace 1.4-2x the carry) starts a half-court action, a handler who passes and keeps his pace is the transition run. Below the gait speed nobody is in a transition run, and the gait speed lies under the band. Decelerating after the pass was tried as a change of pace too and declined: it restored the tails of 4-6 m/s pushes."
    evidence: "Real cut 485.2 | 452.9 | 444.9 -> 484.4 | 452.9 | 446.2; cut_basket 90.7 | 89.5 | 87.8 -> 91.2 | 90.3 | 89.1; relocate 171.0 | 176.0 | 196.6 -> 169.7 | 175.2 | 194.9; cut_banana 27.3 | 23.5 | 25.6 -> 26.5 | 23.5 | 24.8. Kept carry candidates (clean | n0.3 | n0.5) 48 | 42 | 48 -> 45 | 43 | 46. Stability on the 166 | 173 | 212 candidates: carry_run_mps 1.75 / 2.0 / 2.25 keeps 45 / 45 / 47 clean (n0.3 38 / 43 / 43); carry_burst_ratio 1.2 / 1.25 / 1.3 keeps 49 / 45 / 44 clean (n0.3 49 / 43 / 43, n0.5 50 / 46 / 39; 1.1 / 1.4: 50 / 38 clean); the loop-6 3.0 m/s rule moved 33 / 48 / 69 for 2.5 / 3.0 / 3.5. Official realdata.py, clean, 2524 labels (move excluded): carry_run_mps 1.75 / 2.25 changes 0 / +2 labels (cut 484.4 / 484.8), carry_burst_ratio 1.15 / 1.35 changes +5 / -7 (cut 486.1 / 483.5); the loop-6 rule at 2.5 / 3.5 m/s moved cut 485.2 to 482.7 / 489.4 (loop-6 confirmer). Inspected by position (clean, 19 changed candidates): gains are handlers who jog the ball up at 2.8-3.7 m/s, pass at y 9-13 and burst to the rim at 4.4-5.1 m/s against a set defense (pass-and-cuts); losses are handlers who keep a steady 2.6-3.0 m/s after the pass and 3 decelerating relocations after a jog-up. Adversarial: walk-up pass and cut 10 | 10 | 9, off-ball walk-up 10 | 10 | 10, arrive-settle-cut 10 | 10 | 10 -> 10 | 10 | 8, jog-up pass and cut (confirmer G5) 10 | 10 | 10, defense set 10 | 10 | 10; every transition negative (push, jog push, lane sprint, 3.4 m/s lane run, defense back, ball in the backcourt) stays 0. Harnesses unchanged. Test test_l7_02_carry_rule_has_no_speed_in_the_jog_up_band (loop 6: jog-up pass-and-burst 1 of 20)."
  - id: L7-03 high-noise veer recall (item 3; tried, not recovered)
    what: "No change. Alternatives to the L6-02 joint evidence z(turn) + z(approach) >= 2.0 were tested for the strong veer (4 -> 3 of 10) and the long-approach veer (4 -> 3 of 10) at sigma 0.5."
    why: "On 30 seeds at sigma 0.5 the L6-02 test drops 1 of 13 strong-veer runs and 1 of 15 long-approach runs; the rest of their recall loss is detection itself. Every relaxation that recovers them readmits noise: sum >= 1.5 (+1 strong veer, +1 long approach; jogs past a defender +3 of 30), or an explosive-exit alternative z(away) >= 4 (+1 strong veer, 0 synthetic negatives, but +13 real n0.5 veers of which 1 is a veer on clean tracks), z(away) >= 5 (+10 real, 1 clean-matched)."
    evidence: "Synthetic sigma 0.5, 30 seeds (positive scene runs with an event passing the rule): strong veer 12 / 13 / 13, long approach 14 / 15 / 14 for sum >= 2.0 / sum >= 1.5 / sum >= 2.0 or z(away) >= 4; the jog negatives 7 + 12 + 5 / 8 + 14 + 5 / 7 + 12 + 5. Real n0.5 high-noise veer candidates 128: kept 88 (13 clean-matched) under L6-02, 101 (14) with the z(away) >= 4 alternative."
  - id: L7-04 provenance and harness hygiene (C6-4)
    what: "No detector change. The loop-6 summary now carries the official realdata.py rates next to the scratch per-chunk-seeded ones, and every loop-7 rate is official. Scratch harness copies: the obsolete AT.leave fill branch is removed from test_cuts/run.py and fix5_cuts/h_test/run.py (AT.CASES carries the mirror-invariant leave_from t0fn), and every copy uses a 4-worker pool."
    why: "The loop-6 YAML noisy rates came from the scratch runner, 2-5 % above the official ones; fix5_cuts/h_test crashed on the renamed AT.leave unless a runner shim patched it (only test_cuts had been fixed), and the confirm copies used 11-worker pools."
    evidence: "Every harness copy run by its own run.job without shims: 9,660 / 9,660 runs, 0 errors, for loop-6 and loop-7 code; the loop-6 aggregates equal the loop-6 confirmer's shimmed runs. Official loop-6 rates as in L7-00."
  - id: L7-05 documented high-noise residual inflation (known limit)
    what: "No change. cut_veer and cut_i stay inflated in the mvlib high-noise tier."
    why: "Kept as a known limit of the high-noise smoother (apex bias, closest-approach look-elsewhere); consumers should use strict-conf veers and I-cuts there. L7-03 found no recall-for-precision trade worth taking."
    evidence: "Official, loop 7: cut_veer 12.6 | 18.1 | 36.5 (n0.5 / clean 2.9); cut_i 17.2 | 18.1 | 36.1 (2.1); cut_v 8.8 | 13.9 | 16.8 (1.9); cut_straight 10.9 | 13.0 | 13.4 (1.2). Loop-6 confirmer hand samples: about 55-65 % of noise-only n0.5 veers and about 65 % of noise-only n0.5 I-cuts are not the labelled move."
changes_loop6:
  # Loop 6 (finishing pass): the loop-5 confirmer's residuals. Real data = 3 NBA 2015-16 SportVU games, 6855 s of
  # clock-running play, sigma told 0.15 m, --frame team_ends; rates per 48 min, both teams, clean | n0.3 | n0.5 (added
  # noise, per-chunk seeded scratch runner; the official realdata.py noisy rates are 2-5 % lower, see loop6-summary). Synthetic =
  # the five scratch harness copies (test_cuts, confirm_cuts, confirm2_cuts and the two fix5 copies; 9,660 runs each at
  # sigma_p 0.2 / 0.3 / 0.5) plus a 33-check adversarial set (10 seeds per sigma). Only aggregate counts are kept here.
  - id: L6-00 frame re-measure (team_ends) and loop-5 baseline
    what: "No code change. Loop-4 code re-run under nearest_player and team_ends, and loop-5 code under team_ends, before any fix."
    why: "realdata.py now defaults to team_ends (offense = the team attacking the chunk's end; 12/12 team-halves agree with PBP); nearest_player mislabelled about 25 % of chunks."
    evidence: "Loop-4 code, clean, nearest_player -> team_ends: cut 533.1 -> 528.9, cut_basket 80.7 -> 97.0, cut_fade 87.4 -> 52.1, cut_i 37.8 -> 37.8, cut_banana 35.7 -> 37.4, cut_veer 18.1 -> 20.2, cut_straight 14.7 -> 12.6, cut_v 11.3 -> 11.3, fill 10.1 -> 13.0 (identical to the loop-5 re-measure). Loop-4 code, team_ends, n0.3 | n0.5: cut_i 37.8 | 78.6, cut_veer 32.3 | 111.7, cut_straight 19.7 | 26.0, cut_v 14.7 | 18.5. Loop-5 code, team_ends, clean | n0.3 | n0.5: cut 476.8 | 465.1 | 458.3, cut_basket 87.0 | 86.5 | 85.7, cut_i 26.5 | 23.1 | 41.2, cut_veer 11.8 | 21.4 | 53.8, cut_straight 10.9 | 16.8 | 21.0, cut_v 8.8 | 12.6 | 15.1 (reproduces the loop-5 numbers exactly)."
  - id: L6-01 half-court gate on where the action happens (L5-01 regression)
    what: "cu_postrules half-court gate: the primary actor must be in the frontcourt on every frame of [start, end]; the 2 s transition carry (frames of [start - transition_carry_s, start) beyond half court) drops the label only when the crossing belonged to a transition: (a) a sustained run, every 0.5 s chord speed from the last backcourt frame to the label start >= carry_sustain_mps 3.0 - 1 sigma; (b) the defense not set, >= 2 defenders beyond half court on a frame of the carry window (with >= 3 tracked defenders); (c) the ball still beyond half court during the label. XY only, no ball height."
    why: "L5-01 applied the carry to every frame, so a handler who walked or jogged the ball over half court and passed and cut within 2 s lost every half-court label (confirmer: synthetic walk-up pass-and-cut 10 | 10 | 9 -> 0 | 0 | 0; 16 real handler walk-ups below 2.5 m/s were half-court pass-and-cuts). Inspection of the 163 clean carry-only removals by crossing speed, defenders back and ball position: handlers entering at 2.8-3.6 m/s into a set defense and slowing into the pass were half-court entries (about 14 of 16 inspected); runs that stayed at 3.3-4 m/s from the backcourt into the label, defenses still retreating (2-5 defenders beyond half court), and cutters ahead of a ball still in the backcourt were transition (about 30 of 35 inspected); players who arrived fast and settled before the label were half-court actions. A first variant (carry only for a crossing chord speed >= 4 m/s) was declined: about 6 of 18 inspected restorations were steady 3.8-4 m/s pushes or ahead of the ball."
    evidence: "Real clean | n0.3 | n0.5 vs loop 5: cut 476.8 | 465.1 | 458.3 -> 485.2 | 472.6 | 466.3; cut_basket 87.0 | 86.5 | 85.7 -> 90.7 | 90.3 | 87.8; cut_banana 25.6 | 21.8 | 23.1 -> 27.3 | 23.9 | 23.9; cut_thru 5.5 | 5.5 | 5.0 -> 6.3 | 6.3 | 5.5; cut_front 6.7 | 4.6 | 7.1 -> 7.6 | 5.5 | 7.6; relocate 168.5 -> 171.0. The rule only restores events: 47 | 46 | 49 added, none removed. Inspected 18 restored clean events: about 15-16 half-court pass-and-cuts, cuts after a settle or arrive-and-relocate, 1 next to a tracking teleport, 1-2 borderline pushes. Adversarial (sigma 0.2 | 0.3 | 0.5, of 10): walk-up pass then basket cut 0 | 0 | 0 -> 10 | 10 | 9; walk-up give-and-go 0 | 0 | 0 -> 10 | 9 | 5; walk-up cut_thru 0 | 0 | 0 -> 10 | 10 | 10; off-ball walk-up then basket cut 0 | 0 | 0 -> 10 | 10 | 10; fast arrival, settle, basket cut 0 | 0 | 1 -> 10 | 10 | 10; negatives (5.4 m/s push, steady 4 m/s push, 6 m/s off-ball lane run, walk-up with three defenders still back) 0 everywhere, as in loop 5. All five harnesses: no change. Test test_l6_01_walk_up_pass_and_cut_keeps_its_half_court_labels (loop 5: 0 of 20 walk-up pass-and-cuts); test_l5_01's carry case now uses the sustained jog push (l5_carry_veer stops on the wing before it veers, a half-court action under the new rule)."
  - id: L6-02 high-noise veer needs joint turn and approach evidence
    what: "cut_veer in the mvlib high-noise tier: z(turn) + z(approach) >= evidence_k_high_noise 2.0 (the approach z is already taken against approach_m + 1 sigma, L5-03); unchanged below the tier."
    why: "Per test, the n0.5 events that are not veers on clean tracks sat near both veer-defining edges (turn z median 0.75, approach z 1.8, against 1.3 and 3.1 on events that are also clean veers); away and near_defender did not separate them. Declined: away >= away_m + 1 sigma (removed 17 more noise-only events but cost the harness veer_slot mirror 7 -> 3 of 10 at sigma 0.5); a defender-distance gain after the turn (cost synthetic veers, real noise-only and clean veers both gain little distance); approach_k 0 or 0.5 with evidence 2.0-3.0 (jogs back or veers lost)."
    evidence: "Real n0.5 cut_veer 55.5 (after L6-01) -> 38.2 per 48 (loop 5 53.8; clean 12.2, ratio 4.5 -> 3.1); clean and n0.3 unchanged (below the tier). Of 132 n0.5 events, 9 of 11 that are also clean veers are kept. Inspected (clean positions) 16 removed n0.5 events: 4-5 plausible veers, the rest stand-and-be-approached, stops, V-type reversals or no approach; 16 kept: about 9-10 show an approach, a turn and a move away. Synthetic sigma 0.5: harness cut_veer recall 24 -> 21 of 40 (0.60 -> 0.53; floor 0.40), 0.2 / 0.3 unchanged; jogs past an always-near defender 9 -> 3 of 30; adversarial 2 m approach veer 4 -> 3, 1.3 m approach veer 1 -> 1 of 10. Test test_l6_02_high_noise_veer_needs_joint_turn_and_approach_evidence (loop 5: a veer_slot event with turn z 0.02 + approach z 0.29)."
  - id: L6-03 I-cut in-leg must point at the rim (geometry-scaled margin)
    what: "cut_i in_Dr: Dr(in-leg) <= -max(in_dr_k x sigma_disp, in_dir_frac x L1), in_dir_frac 0.5 (the in-leg within 60 deg of rimward)."
    why: "The loop-5 margin scaled only with sigma, so at low noise a corner player walking down the sideline and back (Dr -0.4 to -0.6 m on a 1.5-2.4 m leg) and wing or top players sliding along the arc read as I-cuts: 23 of 63 clean real cut_i had the in-leg more than 60 deg off the radial (-Dr / L1 < 0.5); 16 of them inspected were all sideline walks, arc slides or under-rim shuffles. A sigma-relaxed floor (in_dir_frac x L1 - 1 sigma) was declined: it let the sideline walk back at sigma 0.3 (2 -> 3) and the wing slide (0 -> 2) for one I-cut at 0.3."
    evidence: "Real cut_i clean | n0.3 | n0.5: 26.5 | 23.1 | 42.0 (after L6-01) -> 16.8 | 17.6 | 35.7 (loop 5 26.5 | 23.1 | 41.2); removed 23 | 13 | 15, all inspected n0.5 removals (15) were corner sideline walks, arc slides or baseline / under-rim moves. Adversarial (0.2 | 0.3 | 0.5): corner down-and-up 10 | 6 | 2 -> 2 | 2 | 1, wing-to-corner-and-back 4 | 3 | 1 -> 0 | 0 | 1; I-cut 50 deg off the radial 10 | 9 | 4 -> 10 | 8 | 4, 30 deg 10 | 7 | 5 unchanged, baseline I 10 | 9 | 2 unchanged. Harness cut_i unchanged in all five (1.00/0.95 | 1.00/0.75 | 1.00/0.53). Test test_l6_03_i_cut_in_leg_points_at_the_rim (loop 5: corner down-and-up 16 of 20 at sigma 0.2 / 0.3)."
  - id: L6-04 straight cut needs joint contact and heading evidence (item 6)
    what: "cut_straight: z(contact) + z(heading_change) >= evidence_k 2.0 at every sigma. Declined: the cut_v analogue z(turn) + z(out_peak) >= 2.0 (or 1.5)."
    why: "The n0.3 / n0.5 cut_straight events that are not clean events were borderline pass-bys with a borderline straight exit (contact z median 1.2 / 0.8, heading z p25 0.4 / 0.55); every clean real cut_straight has a sum >= 2.0. For cut_v the same test removed 4 of 13 (n0.3) and 7 of 22 (n0.5) noise-only events but also 2 of 17 and 1 of 15 events that are clean V-cuts, a soft 145 deg synthetic V fell 8 -> 4 of 10 at sigma 0.5 and the harness v_slot mirror 8 -> 7: not a net gain."
    evidence: "Real cut_straight clean | n0.3 | n0.5: 10.9 | 16.8 | 21.0 -> 10.9 | 13.0 | 13.0 (noise ratio 1.54 | 1.93 -> 1.19 | 1.19); events that are also clean straights kept 15 of 16 (n0.3) and 13 of 14 (n0.5), noise-only kept 16 of 24 and 18 of 36. Inspected at n0.5 (clean positions, user and screener): 10 removed, about 2-3 plausible straight reads; 10 kept, about 3-4 (n0.5 cut_straight stays a low-precision label). Synthetic: harness cut_straight at sigma 0.5 54 -> 53 of 60 (pop_low 10 -> 9), 0.2 / 0.3 unchanged, no new false positives. cut_v unchanged: 8.8 | 12.6 | 15.5 (n0.5 / clean 1.76). Test test_l6_04_straight_cut_needs_joint_contact_and_heading_evidence (loop 5: an event with contact z 0.21 + heading z 1.59)."
  - id: L6-05 recall recovery at sigma 0.5 (attempted, not recovered)
    what: "No change. Attempts to recover the 45 deg I-cut (6 -> 4 of 10 under L5-02) and the 1.3 m-approach veer (3 -> 1 of 10 under L5-03) at sigma 0.5, and the harness cut_i recall at 0.5 (0.53)."
    why: "The oblique I is bounded twice: in_dr_k 2 alone and the L6-03 geometric floor alone each give 4 of 10 (neither: 6); in_dr_k 1.5 or 1.25 gave 4 of 10 (the direction noise of a 1.1 m smoothed leg is binding) and the sigma-relaxed floor was declined under L6-03. The short-approach veer reads 1 of 10 under every approach_k (0, 0.5, 1.0) and evidence_k (2.0-3.0) tried: its turn + approach evidence equals that of a jog past the defender. The cut_i 0.5 recall is the high-noise smoother's apex bias (a 1.5 m out-and-back reads 0.9 m)."
    evidence: "Synthetic sigma 0.5: oblique I 4 of 10 at in_dr_k 2.0 / 1.5 / 1.25 with the floor, 6 with neither; short-approach veer 1 of 10 for every variant; harness cut_i 1.00/0.53 unchanged. Real n0.5 cut_i at in_dr_k 1.25: 36.1 vs 35.7 per 48 (no recall gained, so no change)."
  - id: L6-06 original test_cuts harness copy (scratch only)
    what: "No detector change. The original scratch copy test_cuts/run.py builds author scenes with the test file's scenario() / mirror_spec() (as the fix5 copy does), skips the renamed AT.leave fill shim, and uses a 4-worker pool."
    why: "360 of its 9,660 runs failed at build with KeyError 'wp' (author scenes defined with 'start' + 'legs')."
    evidence: "All five harness copies: 9,660 / 9,660 runs, 0 errors, at sigma_p 0.2 / 0.3 / 0.5."
  - id: loop6-summary
    what: "Real per 48 from the official realdata.py runner (--families cuts, sequential noise RNG; loop-7 re-run, provenance fix L7-04), loop 5 -> loop 6, clean | n0.3 | n0.5: cut 476.8 | 445.3 | 436.5 -> 485.2 | 452.9 | 444.9; cut_basket 87.0 | 86.5 | 85.3 -> 90.7 | 89.5 | 87.8; cut_i 26.5 | 27.7 | 43.3 -> 16.8 | 19.7 | 34.0; cut_veer 11.8 | 17.6 | 52.1 -> 12.2 | 18.1 | 37.0; cut_straight 10.9 | 15.5 | 18.5 -> 10.9 | 13.0 | 13.4; cut_v 8.8 | 13.9 | 16.8 -> 8.8 | 13.9 | 17.2; cut_banana 25.6 | 22.3 | 24.8 -> 27.3 | 23.5 | 25.6. The noisy figures in L6-00..L6-04 above are from the scratch per-chunk-seeded runner (clean figures are identical); its noisy rates sit 2-5 % above the official ones (cut n0.3 472.6 vs 452.9)."
    why: "Open: cut_veer at n0.5 is still 3.1 x clean with about 60 % plausible veers; cut_i n0.5 / clean rose to 2.1 because the clean geometric cleanup removed proportionally more clean than noisy events (the remaining n0.5 excess is rimward jiggles); cut_v n0.5 / clean 1.76; recall at sigma 0.5 for the oblique I and the short-approach veer is at the measurement limit."
    evidence: "Synthetic, five harnesses, loop 5 -> loop 6: only cut_veer (0.60 -> 0.53 recall at 0.5) and cut_straight (0.90 -> 0.88 at 0.5) change; no false positives added; 0.2 / 0.3 identical. Adversarial: walk-up and settle half-court cuts restored (0 -> 9-10 of 10), transition negatives stay 0. pytest tests/movement/test_cuts.py passes."
changes_loop5:
  # Loop 5 (finishing pass): the loop-4 confirmer's residuals C4-A..C4-F. Real data = 3 NBA 2015-16 SportVU games,
  # 6855 s of clock-running play, sigma told 0.15 m, loaded with the new realdata.py default frame team_ends (offense =
  # the team attacking the chunk's end in this half). Rates per 48 min, both teams, written clean | n0.3 | n0.5 (added
  # noise). Synthetic = test_cuts (KeyError 'wp' fixed, see L5-06) + confirm2_cuts harnesses, 9,660 runs each at sigma_p
  # 0.2 / 0.3 / 0.5. 'Inspected' samples were judged from clean positions; only aggregate counts are kept here.
  - id: L5-00 frame re-measure (team_ends)
    what: "No code change. Loop-4 code re-measured under --frame team_ends before any fix."
    why: "realdata.py now labels the offense by the end it attacks (12/12 team-halves agree with PBP); the old nearest_player rule mislabelled about 25 % of chunks, so loop-4 rates were measured partly on the wrong team."
    evidence: "Loop-4 code, nearest_player -> team_ends (clean | n0.3 | n0.5): move 1415 | 1670 | 1840 -> 1361 | 1604 | 1747; cut 533 | 512 | 517 -> 529 | 513 | 515; cut_basket 81 | 85 | 82 -> 97 | 98 | 95; cut_fade 87 | 91 | 94 -> 52 | 58 | 60; fill 10.1 | 13.9 | 10.9 -> 13.0 | 17.2 | 14.7; cut_i 37.8 | 35.7 | 78.6 -> 37.8 | 37.8 | 78.6; cut_straight 14.7 | 26.5 | 34.0 -> 12.6 | 19.7 | 26.0; cut_veer 18.1 | 31.1 | 115.1 -> 20.2 | 32.3 | 111.7; cut_banana 35.7 | 29.4 | 32.3 -> 37.4 | 32.3 | 34.0. Under team_ends, events lying entirely beyond half court (clean): cut_banana 11/89, cut_veer 8/48, cut_i 5/90, cut_straight 3/30, cut_curl 2/4 (n0.5: cut_veer 34/266, cut_i 14/187, cut_straight 10/62, cut_curl 10/16)."
  - id: L5-01 half-court gate for every half-court label (C4-A, C4-F)
    what: "cu_postrules: every registered detector except exempt_kinds (move, rim_run, sprint_to_corner) drops an event whose primary actor is beyond half court (y > cut.frontcourt_y_max_m) on any frame of [start - cut.transition_carry_s, end]. Applied once, in the DETECTORS wrapper, so turn-, arc- and contact-anchored detectors (I, V, L, veer, banana, straight, curl, flare, fade, relocate, ...) share it with the CUT windows of L4-02."
    why: "L4-02 only gated the CUT-window builder. In every inspected backcourt event (8/8) the player was running up from under the defended rim after a rebound or an inbound (y 19-27 m) and the I / veer / banana / straight / curl geometry was the start of a transition run; the 18 inspected frontcourt events that started < 2 s after a half-court crossing were sprints in transition, but that sample missed the handler walk-up (corrected in loop 6, L6-01: the loop-5 confirmer found 16 handler walk-ups below 2.5 m/s and about 12 actions per 48 min with the handler crossing below 3.5 m/s that are real half-court pass-and-cuts, all removed by the 2 s carry). C4-F (offense inbounding under its own defended rim) is the same case once the frame is team_ends; 20/20 sampled kept generic cuts are now frontcourt, own-possession cuts."
    evidence: "Real (L5-01 with L5-04): move 1361 | 1604 | 1747 -> 1336 | 1581 | 1730 (move is a carrier, ungated; the drop is the glitch rule); cut 529 | 513 | 515 -> 477 | 465 | 458; cut_banana 37.4 | 32.3 | 34.0 -> 25.6 | 21.8 | 23.1; cut_veer 20.2 | 32.3 | 111.7 -> 11.8 | 21.4 | 79.4; cut_i 37.8 | 37.8 | 78.6 -> 31.1 | 29.8 | 65.1; cut_straight 12.6 | 19.7 | 26.0 -> 10.9 | 16.8 | 21.0; cut_curl 1.7 | 6.3 | 6.7 -> 0.8 | 2.5 | 2.5; cut_basket 97 -> 87; cut_shallow 6.3 -> 4.2; rim_run / sprint_to_corner unchanged (exempt). After the gate no gated kind has an event with a backcourt frame in its window (clean). Synthetic: no recall changes in either harness. Test test_l5_01_no_half_court_labels_beyond_half_court (loop 4: cut_i 24/30, cut_veer 24/30, cut_banana 27/30 on the shifted scenes)."
  - id: L5-02 I-cut in-leg must step toward the rim (C4-B)
    what: "cut_i test in_Dr: Dr(in-leg) <= -in_dr_k x sigma_disp (in_dr_k 2.0), was Dr <= 0."
    why: "At added noise 0.5 real cut_i was 38 -> 79 per 48. Of the n0.5 events not present clean, the clean positions show loitering wing / corner / baseline players (clean median speed 0.6-1.8 m/s, path 1.3-3.6 m in 2 s), not standing players: noise turns their small sideways or into-the-corner moves into >= 150 deg reversals with 1.0-1.6 m legs. No speed or leg-length feature separates them from a true I under the high-noise smoother (the synthetic I at sigma 0.5 reads legs 0.8-1.6 m and peak 1.3-2.2 m/s, below the false events' 1.3-5.1 m/s), but the in-leg rimward margin does (z 2.9-6.7 on every synthetic I at 0.5; median 2.2 on the noise-only events). The FIBA I-cut is a step toward the basket, so the test is the definition made significant."
    evidence: "Real cut_i 31.1 | 29.8 | 65.1 -> 26.5 | 23.1 | 41.2 (n0.5 / clean 2.1 -> 1.55). Removed clean events 11/11 inspected: reversals under the rim, along the baseline or sideline, or lateral jabs along the arc (no rimward step). Removed n0.5 events, 15 inspected: 11 lateral / corner reversals, 3 rim-finish-and-step-back (basket cuts), 1 ambiguous. Synthetic cut_i unchanged in both harnesses (1.00/0.95 | 1.00/0.75 | 1.00/0.53); cut_v / cut_l unchanged. Test test_l5_02_i_cut_needs_a_significant_step_toward_the_rim (loop 4: lateral out-and-back fired 11/30)."
  - id: L5-03 high-noise veer needs a significant approach (C4-C)
    what: "cut_veer approach in the mvlib high-noise tier: closing >= approach_m + approach_k_high_noise x sigma (k 1.0); unchanged below the tier."
    why: "The F08r pad takes the defender tests at the closest approach inside +-0.3 s of t_turn, a look-elsewhere selection that biases the closing distance up, and a real defender is nearly always within 1.5 m, so jogs past him passed approach at 1.0 m by chance. Among n0.5 events, the approach z of noise-only events had a 25th percentile of 0.67 against a minimum of 1.29 for every synthetic veer at sigma 0.5."
    evidence: "Real cut_veer 11.8 | 21.4 | 79.4 -> 11.8 | 21.4 | 53.8 (n0.5 / clean 6.7 -> 4.6). Of the 61 removed n0.5 events only 2 match a clean veer; 15 inspected had clean chord turns < 30 deg or no turn, or kept closing on the defender after the 'turn'. Synthetic cut_veer unchanged in both harnesses (1.00/1.00 | 1.00/0.88 | 1.00/0.60). Test test_l5_03_high_noise_veer_needs_a_significant_approach (loop 4: jogs past the defender 13/30 at 0.5 and events with sub-sigma closing)."
  - id: L5-04 de-duplication and tracking glitches (C4-D)
    what: "cu_postrules: (a) per (kind, actors) only the highest-conf event within dedup_t0_s (10 frames) of t0 is kept; (b) an event is dropped when its primary actor's smoothed speed exceeds glitch_max_mps 10 m/s inside it."
    why: "Neighbouring contact intervals of the same pair and neighbouring turn peaks gave the same label twice (synthetic: shake on lift_bs 2-7 of 10 runs, straight / pop_out on pop_low, blade on blade_slot). 15/15 inspected real events with a > 10 m/s smoothed speed were tracking teleports (jumps of 3-15 m in 1-3 frames: corner-to-corner id swaps, a fade 'from' the rim to half court), and they made cut, fill, flash, weak-baseline, fade, veer and relocate events."
    evidence: "Real near-duplicates (team_ends, loop 4): clean cut 1, relocate 1, fill 1; n0.3 cut_straight 1/47, relocate 3, lift 1, fill 4/41; n0.5 cut_straight 5/62, relocate 3, lift 2, fill 4/35 -> 0 everywhere. Events with > 10 m/s in the window, clean: 60 (non-move) -> 0. Synthetic FPs removed (no recall change): shake 2 | 6 | 10 -> 0 | 0 | 5, cut_straight / cut_pop_out 1 | 1 | 0 -> 0, cut_blade at 0.5 4 -> 3, cut_veer at 0.5 1 -> 0. Tests test_l5_04_one_event_per_kind_actor_and_moment, test_l5_04b_tracking_teleport_is_not_a_cut (loop 4: cut, cut_backdoor and relocate on the teleport)."
  - id: L5-05 peak speed under the smoother (item 6; no change, one variant declined)
    what: "No change to mvlib (shared). Measured where cuts uses a smoothed peak speed (cut_v out_peak, cut_weak_baseline, cut_iverson, cut_rub; the CUT gate and the transition runs already use the 0.5 s window-mean chord speed, F21). Declined: cut_v out_peak replaced by the best 0.5 s window speed with a one-sigma allowance in the high-noise tier."
    why: "The 45-70 % peak loss is a short-burst effect (an I-cut's 0.6 s out-leg). On real events re-read with added noise the smoothed peak of sustained legs is not lowered: n0.5 / clean ratio p10 / p50 / p90 0.75 / 0.99 / 1.18 (cut_v out-leg), 0.92 / 1.02 / 1.13 (weak baseline), 0.96 / 1.01 / 1.13 (Iverson), 0.89 / 1.02 / 1.13 (CUT window), the same as the window-mean speed. The one short-burst test (cut_i out_peak) is already off in the high-noise tier and L5-02 adds displacement evidence there."
    evidence: "Declined variant: synthetic cut_v at sigma 0.5 34 -> 37 of 40 but real n0.5 cut_v 15.1 -> 18.5 per 48 (clean 8.8), i.e. more noise-only events than recovered recall; reverted."
  - id: L5-06 test_cuts harness coverage (C4-E, scratch harness only)
    what: "No detector change. The scratch copy of the test_cuts harness builds author scenes with the test file's own scenario() / mirror_spec() (which accept 'start' + 'legs' actors), as confirm2_cuts does; sim.scenario / H.mirror_spec need 'wp'."
    why: "360 of 9,660 runs (auth:turnout, turnout_high, banana, loop, sprint_trans, rim_run and mirrors) failed at build with KeyError 'wp' on loop-3 and loop-4 code, so those scenes had no noise-sweep coverage."
    evidence: "0 errors in 9,660 runs. Final code, both mirrors, 20 runs per sigma 0.2 | 0.3 | 0.5: cut_turnout (turnout) 20 | 20 | 20; turnout_high negative 0 | 0 | 0 fires; cut_banana 20 | 19 | 14 with cut_loop never firing on it; cut_loop 20 | 20 | 14; sprint_to_corner (sprint_trans) 20 | 20 | 20; rim_run 20 | 20 | 20. Identical on loop-4 code."
  - id: loop5-summary
    what: "Real rates per 48 (loop-4 code under team_ends -> loop 5, clean | n0.3 | n0.5): move 1361 | 1604 | 1747 -> 1336 | 1581 | 1730; cut 529 | 513 | 515 -> 477 | 465 | 458; cut_basket 97 | 98 | 95 -> 87 | 87 | 86; cut_fade 52 | 58 | 60 -> 45 | 52 | 53; cut_i 37.8 | 37.8 | 78.6 -> 26.5 | 23.1 | 41.2; cut_banana 37.4 | 32.3 | 34.0 -> 25.6 | 21.8 | 23.1; cut_veer 20.2 | 32.3 | 111.7 -> 11.8 | 21.4 | 53.8; cut_straight 12.6 | 19.7 | 26.0 -> 10.9 | 16.8 | 21.0; fill 13.0 | 17.2 | 14.7 -> 12.2 | 15.1 | 12.6; rim_run 3.8 -> 3.4 (glitch rule only)."
    why: "Open: cut_veer is still x4.6 at n0.5 and cut_straight x1.9; cut_v x1.7."
    evidence: "Synthetic, both harnesses, loop 4 -> loop 5: every recall identical; only false positives removed (shake, cut_straight, cut_pop_out, cut_blade, cut_veer, all near-duplicates). pytest tests/movement/test_cuts.py passes."
changes_loop4:
  # Loop 4: calibration on real tracking (3 NBA 2015-16 SportVU games, 6855 s of clock-running play, runner sigma told
  # 0.15 m; private research data, only aggregate rates here). Rates are per 48 min, both teams. 'pre' = loop-3 code
  # at sigma 0.15; 'n0.3' / 'n0.5' = the same games with added noise. Synthetic check = test_cuts + confirm2_cuts
  # harnesses (322 scenarios x 10 seeds x sigma_p 0.2/0.3/0.5, 9,660 runs each); P/R written s0.2 | s0.3 | s0.5.
  - id: L4-01 team possession mask
    what: "_Ctx.own: per-frame team possession from the raw ball (poss_ctrl_r_m 1.0 m, poss_margin_m 0.5 m, poss_switch_s 0.5 s); offball(o) = not the holder AND own possession. Every MOVE / cut / contact is therefore offense-only."
    why: "scene.holder looks only at offensive players, and a runner chunk is a clock-running stretch with one majority offense, so the other team's possessions, rebounds and steals were scored as off-ball offense: over all pre-loop-4 events 31-38 % of move/cut events (44 % of cut_fade, 49 % of cut_veer, 54 % of cut_straight) fell in frames where the defense controlled the ball (players running back after a shot read as cuts away from or toward the rim)."
    evidence: "Real (pre -> with L4-01 and L4-02): move 2025 -> 1415, cut 1027 -> 533, cut_basket 154 -> 81, cut_fade 145 -> 88, cut_i 77 -> 50, cut_veer 36 -> 18, cut_straight 25 -> 12. The one PBP-true assisted rim finish whose cut match was lost was, on inspection, a player sprinting back on defense after the shot (a false match). Synthetic: no detector changed on either harness. Test test_l4_01_no_cut_while_the_defense_has_the_ball (loop 3: 10/10 cuts while a defender holds the ball)."
  - id: L4-02 backcourt and transition runs
    what: "CUT windows (frontcourt_y_max_m 12.70 m): a MOVE that starts in the backcourt yields no half-court cut window until transition_carry_s 2.0 s after it crosses half court, and a window whose end is back over half court is dropped."
    why: "Clips start at clock-running stretches, so sprints up the floor became cut_basket / cut_shallow (89 % of cut_shallow and 35 % of cut_basket events started < 3 s after leaving the backcourt); those runs belong to the transition family (rim_run, lane fill)."
    evidence: "Real: cut_shallow 23.5 -> 4.6, cut_basket share 'from_backcourt < 3 s' 0.35 -> 0 (counts in L4-01). Synthetic: unchanged. Test test_l4_02_backcourt_run_is_not_a_half_court_cut (loop 3: 10/10)."
  - id: L4-03 stationary point-speed cap
    what: "stationary(): also point speed <= stationary_max_mps 1.0 m/s (the MOVE exit speed)."
    why: "s2 = v^2 / var_v loses power as sigma grows; at sigma_p 0.3 a teammate jogging 1.0-1.5 m/s passed as a set screener, so noise added screen cuts (cut_straight / cut_curl)."
    evidence: "Synthetic: auth:flex cut_flex at 0.5 10 -> 9 of 10 (one run, within noise), nothing else. Real: cut_front 7.1 -> 7.6 (with L4-06 in place, see there). Test test_l4_06 (jogger never stationary at sigma 0.05-0.3)."
  - id: L4-04 I-cut out-leg burst
    what: "cut_i test out_peak: peak smoothed speed over the out-leg >= out_peak_mps 2.0 m/s (sigma = median sig_speed), not applied in the mvlib high-noise tier. Supersedes the interrupted run's 2.5 m/s version applied at every sigma."
    why: "In a 25-event real sample (cut_i with L4-01/02 only) 6 out-legs peaked below 2.0 m/s (1.58-1.79 m/s, legs 1.1-1.3 m: jab-and-reset shuffles), 7 at 2.0-2.5 and 12 above 2.5 (2.7-7.0 m/s); an I-cut is a burst out. The smoother lowers a 0.6 s burst's peak (a 5.9 m/s truth peak reads 2.9-3.9 m/s at sigma_p 0.2 and 2.4-3.4 at 0.3; a 1.8 m/s shuffle reads 1.4-2.0), so 2.0 m/s separates them below the high-noise tier; in that tier the I-cut (1.1-2.9 m/s) and the shuffle (1.1-2.7) overlap, so the test is dropped there. The 2.5 m/s version took cut_i recall to 0.65 / 0.35 / 0.00 (tester) and failed the family's noise-sweep test."
    evidence: "Real cut_i 50 -> 38 (n0.3 36, n0.5 79: the high-noise tier keeps the shuffles, see not-fixed below). Synthetic cut_i (tester) 1.00/0.90 | 1.00/0.60 | 1.00/0.50 -> 1.00/0.90 | 1.00/0.55 | 1.00/0.50 (i_slot_M 6 -> 5 of 10 at 0.3; the 2.5 m/s version: 0.65 | 0.35 | 0.00). Test test_l4_04_shuffle_is_not_an_i_cut (loop 3: shuffle cut_i 5/10 at 0.2)."
  - id: L4-05 fill needs a settled vacator and a settled filler
    what: "fill: A's median speed while in the arrive_m disc <= occupy_max_mps 1.0 + occupy_sig_k 1.0 x median sig_speed; B within arrive_m on >= stay_frac 0.5 of stay_s 1.0 s after t_arrival (window cut at the clip end, >= occupy_s); t_vacate and t_arrival in own possession. Replaces the interrupted run's 'every frame within arrive_m for occupy_s' and fixed 1.0 m/s, which cost fill recall at sigma_p 0.3 / 0.5 (1.00 -> 0.95 / 0.85)."
    why: "In a 30-event real sample 26 'vacators' were only running through the 1.2 m disc (median speed 1.4-6.5 m/s, occupancy 0.3-1.8 s) and 17 'fillers' ran through the spot (within it < 0.5 s of the next 1 s); nothing was vacated or filled. The smoothed speed of a resting player is biased up by about its sigma (median 0.4-0.9 m/s at rest at sigma_p 0.3, up to 1.5 at 0.5), so the vacator limit adds k x sig_speed, and the filler test is a fraction, not a max."
    evidence: "Real fill 160 -> 10 (n0.3 14, n0.5 11: stable). Synthetic fill (tester) 1.00/1.00 | 1.00/1.00 | 0.95/1.00 -> 1.00/1.00 | 1.00/1.00 | 1.00/0.90 (fill_slot and its mirror 10 -> 9 of 10 at 0.5; fill_short_M FP 1 -> 0). Test test_l4_05_fill_needs_a_settled_vacator_and_a_settled_filler (loop 3: 10/10 and 9-10/10 fills on the pass-through scenes)."
  - id: L4-06 stationary variance floor
    what: "stationary(): s2 = |v|^2 / (K_CAL^2 max(var_v, stationary_var_v_floor_mps^2)), floor 0.183 m/s (CA-RTS steady-state velocity sigma at sigma_p 0.2, the lowest production tier; the screens family's SCR-L4-01 value)."
    why: "On vendor-smoothed tracks var_v is tiny and s2 < 5.99 meant |v| < 0.4-0.7 m/s, so a screener still settling at 0.6-1.0 m/s was a mover on clean tracks and a screener once noise was added: of 20 sampled cut_straight events present only at added noise 0.3, 11 had a clean screener speed of 0.5-1.0 m/s and 7 of 1.0-1.25 m/s (the latter pass only through noise; L4-03 caps them at the point speed). The stand test must not be stricter on precise tracks than on video tracks (synthetic: a 0.75 m/s settling screener was stationary on 0 % of frames at sigma 0.05 vs 56-75 % at 0.2-0.3; now 56-75 % at every sigma)."
    evidence: "Real cut_straight 11.8 -> 14.7, n0.3 26.5 (ratio n0.3 / clean 2.2 -> 1.8; loop-3 rates at sigma told 0.05: 8.8 -> 55.9 at 0.35, x6.4), cut_pop_out 5.5 -> 6.7. Synthetic: no detector changed (the floor is below every production var_v). Test test_l4_06_stationary_is_no_stricter_on_precise_tracks."
  - id: L4-07 veer away window in the high-noise tier (declined)
    what: "No change. Tested: in the high-noise tier, away measured over any away_s window starting in [t_turn, t_turn + pad] instead of over away_s + pad."
    why: "At added noise 0.5 real cut_veer is 18 -> 115 per 48 (x6.4). Of 40 noise-only events, 33 % had a clean chord turn < 20 deg (noise turns) and 48 % < 30 deg; the rest are real turns whose clean run failed approach / near / away. The F08r pad (defender tests at the closest approach within +-0.3 s, away over 1.1 s, i.e. 1.8 m/s) admits jogs at 1.2-2.5 m/s past a defender, which real defenders (always near) satisfy. Tightening the away window cut synthetic veer recall at 0.5 from 0.4 / 0.8 to 0.3 / 0.2 (the smoother lags the acceleration), below the family floors."
    evidence: "Open: needs a defender-relative turn (heading change relative to the defender line) or a fused tracker with lower noise; reported in not-fixed."
  - id: loop4-summary
    what: "Real rates per 48 (pre -> loop 4, clean | n0.3 | n0.5): move 2025 | 2305 | - -> 1415 | 1670 | 1840; cut 1027 | 991 -> 533 | 512 | 517; cut_basket 154 | 152 -> 81 | 85 | 82; fill 160 | 164 -> 10 | 14 | 11; cut_fade 145 | 143 -> 87 | 91 | 94; cut_i 77 | 89 -> 38 | 36 | 79; cut_straight 25 | 48 -> 15 | 27 | 34; cut_veer 36 | 50 -> 18 | 31 | 115. With a possession-split loader (scratch, single-team segments with the right attacked rim): cut 791, cut_basket 144, fill 20, cut_i 47 per 48."
    why: "Reference: Synergy 2015-16 'Cut' finishing play type is about 6-8 % of possessions (Toronto 6.40 %, 24th of 30, Raptors Republic Dec 2015, https://raptorsrepublic.com/2015/12/17/what-types-of-plays-do-the-raptors-run/; league PPP 1.21, https://www.brewhoop.com/2016/10/11/13155094/milwaukee-bucks-offensive-style), i.e. 11-15 possessions per 48 for both teams (~188 possessions) END in a cut finish. Most basket cuts are not passed to, so 80-145 cut_basket per 48 is 6-10 cuts per finished cut. Cleaning the Glass defines a basket cut as an off-ball move toward the rim, excluding screener rolls and cuts off off-ball screens, ending when the player stops closing on the rim (https://docs.cleaningtheglass.com/pro/data-sets/cuts), and a 2015-16 SportVU study used speed >= 1.81 m/s, a distance-to-rim reduction >= 0.77 of the path, a start 2.6-7.1 m and an end <= 2.6 m from the rim (Modeling the formation of defensive gaps, PMC9904462, https://pmc.ncbi.nlm.nih.gov/articles/PMC9904462/), consistent with CU.P2/P3. No published per-game count of all off-ball cuts exists for 2015-16, so cut / move volumes are checked against possession structure, not a target number."
    evidence: "PBP truth (covered FGAs; cut matched when the shooter's event ends 3.5 s before to 1.5 s after the shot): 11 'Cutting' shots and 15 assisted non-driving rim finishes, but only 4 and 6 of them have the shooter on the runner chunk's labelled offense (upstream loader issue), so recall is not measurable (in-offense: any cut 2/4 and 3/6, basket family 1/4 and 1/6, unchanged within one event of loop 3). Tests: tests/movement/test_cuts.py (L4 regression scenes, synthetic only)."
changes_loop2:
  # Loop 2: the confirmer's regressions and still-failing items (scratchpad/loop2/confirm_cuts.json).
  # Evidence: both harnesses re-run on the same 322 scenarios x 10 seeds x sigma_p 0.2 / 0.3 / 0.5 (9,660 runs), version
  # 0.2.0 vs this one; 'tester' = the tester's 92 new scenarios + mirrors (prefix new:), 'all' = the confirmer's set
  # (new + the author's scenarios + mirrors). P/R written s0.2 | s0.3 | s0.5. A change was kept only when the net result
  # was better on both harnesses; events of a kind on scenarios without that label were counted as an extra precision check.
  - id: R1 backdoor rim window and deny onset
    what: "cut_backdoor.rim_within_s 1.5 -> 2.0 s; a deny-only candidate must start rim-ward: Dr over [t_rev, t_rev + deny_rimward_s 0.5 s] <= -deny_rimward_dr_m 0.5 m (test deny_rimward)."
    why: "Since F08 put t_rev at the real plant, a realistic 7-8 m rim leg (2.0-2.1 s at peak <= 7 m/s) did not reach r <= 2.0 m within 1.5 s, so the backdoor and the blind pig failed. Widening the window alone let the step-out onset of a short backdoor (a CUT onset moving away from the rim, ~0.7 s before the plant) pass as a deny cut and claim the dedup_s window. The confirmer's 'step candidates first' ordering fixed blind_pig but cost bd_deny_M at 0.5; a conf-ranked dedup cost bd_short 2-6 of 10 at every sigma; the rim-ward test removes the bad candidate itself."
    evidence: "blind_pig recall 0.95 / 0.80 / 0.50 -> 1.00 / 0.90 / 0.75 (all); cut_backdoor (all) 1.00/0.98 | 0.96/0.92 | 0.92/0.77 -> 1.00/1.00 | 0.98/0.97 | 0.91/0.83; tester 1.00/1.00 | 0.95/0.93 -> 0.97/0.95 | 0.89/0.78 -> 0.86/0.75. The tester-only drop at 0.5 is one seed of bd_deny_M whose deny onset reads 0.53 s early (tolerance 0.5 s). Extra backdoor events appear only in the blind-pig scenarios (real backdoors, 129 -> 161 over the three sigmas) and chin_noscreen (55 -> 58), plus 3 elsewhere; bk_wing negatives unchanged."
  - id: R2 duplicate chord-turn events
    what: "_Ctx.turns merges NMS peaks whose >= 90 % plateaus collapse onto the same slowest frame (keeps the larger |A|)."
    why: "detect_cut_v / detect_cut_i emitted identical events (same kind, actor, t0), scored as false positives."
    evidence: "exact duplicate events in the full run: cut_i 7 -> 0, cut_v 2 -> 0; cut_i precision (all) 0.93 / 0.97 / 0.92 -> 1.00 / 1.00 / 1.00, cut_v at 0.5 0.97 -> 1.00 (all) and 0.94 -> 1.00 (tester)."
  - id: F08r veer and I-cut in the high-noise tier
    what: "cut_veer: for tracks in the mvlib high-noise tier the away window is away_s + turn_pad_high_noise_s (0.3 s), approach / near_defender are measured at the closest approach to the defender within +-turn_pad_high_noise_s of t_turn, and t0 is that closest approach. cut_i: in that tier both legs are tested against leg_min_high_noise_m 0.7 m and a leg_balance test min(in, out) / max(in, out) >= leg_ratio_high_noise 0.6 is added. Default-tier behaviour is unchanged. The proposed '2 sigma_p margin on leg lengths' was not used: it would put the leg floor at 0 m."
    why: "At sigma_p 0.5 t_turn scatters 0.3-0.8 s along an unplanted veer (the away leg then ends early and the defender is not yet near), and the Q_HIGH_NOISE smoother cuts the apex of a short out-and-back: the 1.48 m I in-leg reads 0.91 m on average (0.32-1.39 m over 10 seeds; 1.31 m at sigma_p 0.2), a bias, not noise. With a lower leg floor alone, a run that stops reads a spurious >= 150 deg reversal with a 0.7-0.9 m jitter out-leg after a 2.5-4 m in-leg (cut_i events on scenarios with no I label 17 -> 72 over 3 seeds at sigma_p 0.5 with a 0.6 m floor), which the leg-balance test removes."
    evidence: "cut_veer at 0.5: tester 1.00/0.05 -> 0.93/0.70, all 1.00/0.20 -> 0.96/0.60; veer events on scenarios without a veer label 7 -> 13 (ucla, front_pass, chin_wing). cut_i at 0.5: tester 1.00/0.20 -> 1.00/0.50, all 0.92/0.30 -> 1.00/0.53; cut_i on scenarios without an I label 90 -> 104 at 0.5 (+4 are V-cuts read as I), so the I precision against every I event still rises (12/102 -> 21/125). sigma_p 0.2 / 0.3 unchanged. Sweep floors raised: cut_i 0.1 -> 0.5, cut_veer 0.0 -> 0.4."
  - id: F09r flare / fade contact search
    what: "cut_flare.pre_s and cut_fade.pre_s 0.3 -> 1.0 s (screen contacts searched from 1.0 s before the MOVE)."
    why: "The flare user stands next to the screener before he leaves; at high noise the MOVE onset is late, so a 0.3 s look-back missed the standing contact and the run became a fade. The proposed 'emit only one of flare / fade' is already the case (flare needs a ball-side contact p >= 0.5, the fade needs every p < 0.5), so it would change nothing."
    evidence: "cut_flare recall (all) 0.85 / 0.78 / 0.65 -> 0.93 / 0.90 / 0.82, (tester) 0.70 / 0.60 / 0.60 -> 0.85 / 0.80 / 0.70; cut_fade precision (all) 0.87 / 0.82 / 0.74 -> 0.93 / 0.89 / 0.81, (tester) 0.77 / 0.71 / 0.71 -> 0.87 / 0.83 / 0.77, fade recall unchanged (1.00 / 1.00 / 0.97). flare_elbow residual: the screener stands 1.12 m away against the 1.2 m edge, so a split remains (fade 2 of 10 at sigma_p 0.2 / 0.3)."
  - id: F21r CUT look-elsewhere margin
    what: "cut.lookelse_k 1.0: the mean-speed edge is raised by lookelse_k x sigma x sqrt(ln n_windows) (0 for the first window) and the best speed_window_s speed edge by lookelse_k x sigma x sqrt(ln n_ind), n_ind = (t_b - t_a) / speed_window_s."
    why: "Both speeds are maxima over several noisy windows (the sliding search, and the best 0.5 s window), so a 1.7 m/s jog reached 2.5 m/s at z 0.2-0.4 and passed with conf 0.51-0.67. Under the weakest-link conf any positive margin gives conf > 0.5, so the correction has to move the edge. The proposed min_conf 0.6 would leave the conf-0.67 run at sigma_p 0.5, a first window (nwin 1) whose best 0.5 s speed is the max over three windows."
    evidence: "jog_rim_slow cut / cut_basket 1-2 of 10 -> 0 at every sigma, mirrored too; cut and cut_basket precision (all) 0.95 / 0.95 -> 1.00 / 1.00 at sigma_p 0.3 / 0.5 and 0.98 / 0.98 -> 1.00 / 1.00, recall 1.00 unchanged. Cost: cut_shallow recall at 0.5 0.93 -> 0.90 (one run of auth shallow_M). 'cut' events on scenarios without a cut label 3305 -> 3162 at 0.5."
  - id: C1 curl t0
    what: "cut_curl t0 = centre of the run of frames around t_s whose pair distance is <= d_min + t0_flat_k (1.5) x sigma_pair; one curl per (user, screener) within turn_window_s (the higher conf)."
    why: "The confirmer's diagnosis ('tight variant anchors t0 at the turn plateau') is wrong: every variant already used t_s, the closest approach. A curl wraps around the screener, so the pair distance is flat along the wrap and its argmin is placed by noise (0.25-0.6 s late on the author's curl at sigma_p 0.5). With the centred t0 two contact pieces of one wrap could share a t0, hence the per-pair dedup."
    evidence: "cut_curl (all) 1.00/0.97 | 0.97/0.93 | 0.94/0.72 -> 1.00/0.97 | 1.00/0.95 | 1.00/0.78 (tester unchanged); author's curl t0 within 0.5 s at sigma_p 0.5 8/10 -> 10/10; no duplicate curl events."
  - id: F13r banana recall at sigma_p 0.5 (declined)
    what: "No change. Tested: roundness floor 0.5 m and corner edge 75 deg in the high-noise tier (the smoother shrinks the sagitta: banana_slot median 0.88 -> 0.73 m, author's banana 1.59 -> 1.31 m from sigma_p 0.2 to 0.5), and the confirmer's soft roundness."
    why: "Every pass/fail test here must pass at its nominal value, so a 'soft' roundness only changes conf; recall only moves when an edge moves. Moving the edges admits real corners: the veer's 66 deg turn, curved_basket and laker_wing."
    evidence: "banana at 0.5 (10 seeds): R 0.53 -> 0.68 for +6 hits, but banana events on scenarios without a banana label 42 -> 71 (+29), so precision against every banana event falls 0.33 -> 0.28 and F1 0.41 -> 0.39; roundness 0.5 alone +2 hits / +7 events. Banana recall at 0.5 stays a known noise limit."
  - id: F14r rub pass-by (declined)
    what: "No change."
    why: "The proposed gate p_below(d, pass_by_m, sigma_pair) >= 0.5 is the same as the existing nominal test d <= pass_by_m. The measured pass-by distances overlap: rub_wide (true 1.1 m) reads 0.47-1.29 m at sigma_p 0.5 and 0.69-1.15 m at 0.3, the rubs (true 0.4-0.6 m) 0.05-0.96 m. Any margin removes true rubs at the same rate as the false ones (false-positive z 0.0-0.65, true-positive z 0.16-0.54 at the low end). A path-deflection test is not in the rub definition (a rub cut brushes the post on a straight line)."
    evidence: "rubstat (fix2_cuts/rubstat.py), sigma_p 0.3 / 0.5, 10 seeds per scenario; the false positives stay capped below strict (F14)."
