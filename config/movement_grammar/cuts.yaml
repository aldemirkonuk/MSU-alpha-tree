  confidence: "tests: CUT tests, Dr, min_r, rim_bearing, start_outside_paint."
  noise: "min r <= 2.0: margin |r - 2.0| / sigma_pos is 1-2 sigma for cuts ending at r 1.8-2.2 (dunker and lob catches), so flicker near the edge is expected; min_r is stored continuously."
  observability: "Rim area is usually in frame; occlusion under the basket raises sigma."
  conflicts_resolved:
