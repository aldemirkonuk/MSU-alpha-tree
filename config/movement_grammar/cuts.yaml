  level: primitive
  name: "Rim run (transition rim runner)"
  aliases: [OB.P20, rim runner, rim_run_path]
  actors: {runner: usually a big}
  t0: "possession t0 (scene.possession_t0); the departure frame as a flagged proxy when absent"
  rule: "named_spots rim_run_lane / rim_run_path: the runner starts a run from r_own <= start_r_own_m (own rim at y = 25.45 m in this frame; start = last slow frame of that stay) in [t0 - start_before_s, t0 + start_within_s], reaches r <= end_r_m; path length >= length_m; mean |x| <= mean_abs_x_m; mean speed >= mean_mps; best speed_window_s-mean >= peak_mps; arrival no later than after_ball_s after the ball first reaches r < 6.75 (when the ball is tracked). rim_run_repo flag: speed >= repo_mps for >= repo_s."
  params:
    start_r_own_m: {value: 4.0, unit: m}
    start_within_s: {value: 2.0, unit: s}
    start_before_s: {value: 1.0, unit: s}
    end_r_m: {value: 2.5, unit: m}
    length_m: {value: 20.0, unit: m}
    mean_abs_x_m: {value: 3.0, unit: m}
    mean_mps: {value: 4.0, unit: m/s}
    peak_mps: {value: 5.0, unit: m/s}
    speed_window_s: {value: 0.5, unit: s}
    after_ball_s: {value: 1.0, unit: s}
    repo_mps: {value: 5.5, unit: m/s}
    repo_s: {value: 2.0, unit: s}
  min_duration_s: 3.0
  outputs: "t_start, t_arrival, path_length, mean_speed, best_0p5s_speed, t0_proxy, arrival_vs_ball_s, rim_run_repo, first_big_down (needs roster roles: null)"
  confidence: "tests: path_length, mean_abs_x, mean_speed, best_0p5s_speed, arrival_vs_ball."
  noise: "Far court tier C/D inflates path length; 0.25 m resampling suppresses it."
  observability: "Camera cuts in transition are common; long gaps zero the gap_factor."
  conflicts_resolved: ["Geometry: from the edge of r_own <= 4.0 to r <= 2.5 is at most 18.95 m straight, so length >= 20 m is measured from the start of the run (the last slow frame of the own-rim stay, else its first frame), not from the r_own = 4.0 crossing; in effect the runner starts within about r_own 2.9 m (normal after a defensive rebound).", "rim_run_repo (>= 5.5 m/s for 2 s) vs rim_run_path: path rule plus mean >= 4.0 and 0.5 s peak >= 5.0 m/s; 5.5 m/s for 2 s is about 88 % of an NCAA centre's maximum (6.23 m/s, Stone et al. 2022 via transition_full), so the repo rule is a stored flag."]
  sources:
    - {url: "/Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/research/transition_full.md", supports: "rim_run_repo and rim_run_path; NCAA centre max speed 6.23 m/s"}
    - {url: "/Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml", supports: "rim_run_lane"}
  status: proposal
  detector: true

