    exit_inside_m: {value: 1.0, unit: m}
    tight_d_m: {value: 0.8, unit: m}
    tight_r_m: {value: 3.0, unit: m}
    wide_r_m: {value: 4.27, unit: m}
  min_duration_s: 0.6
  outputs: "t_s, closest_approach_m, cum_turn_pm1s, kappa_3m, exit_r, variant, defender_path, received_ball, t_catch"
