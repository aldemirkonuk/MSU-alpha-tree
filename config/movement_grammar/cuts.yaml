changes_loop1:
  # Loop 1: fixes from the independent tester (synth.json element 2 'test': failures F01-F21, noise_curve).
  # Evidence numbers: tester harness re-run on its 92 new scenarios (+ mirrors), 10 seeds x sigma_p 0.2 / 0.3 / 0.5,
  # match = kind + actor + |t0 error| <= 0.5 s; 'before' is the tester's run, 'after' the re-run of this version.
  - id: F01 cut_ucla no-screen variant
    what: "ucla_path_no_screen only when a teammate stands in elbow / high_post_strip / pinch_post on the ball side at t_pass within no_screen_path_m (2.0 m) of the cutter's path; that variant capped at identity_cap and ranked below cut_basket (cu_precedence 'cut_ucla:ucla_path_no_screen'); soft contact search (1.2 m + 2 sigma_pair, p_contact in the contact test); t0 = closest approach to the high-post player in both variants (t_pass stored as attr)."
    why: "Any pass followed by a basket cut was a UCLA (precision 0.50, 70 % of the false positives strict); a borderline contact moved t0 by about 1.2 s."
    evidence: "cut_ucla P/R 0.25/0.50 -> 1.00/1.00 at every sigma_p (new scenarios); pass_cut_noscreen fires 0/30. Deviation from the proposed fix (c): t0 = t_pass would put every UCLA 0.8-1.2 s from the tester's own truth (closest approach to the screener) and from this item's t0 definition, so both variants anchor on the high-post pass-by instead, which is equally immune to a borderline contact."
  - id: F02 screen-cut within rounding
    what: "flex, zipper, pin-down, turnout 'within' and V / L / I 'whole' compare frame counts (e - a <= F(total_s)); the end search already used F(total_s)."
    why: "F(2.0) x dt = 2.002 s > 2.0 s, so the seconds comparison failed deterministically when the cutter was still moving at the window limit (the same bug made wing_l unreachable: two 1.5 s legs = 3.003 s)."
    evidence: "cut_turnout recall at sigma_p 0.5 0.20 -> 0.90, flex 0.80 -> 0.90, zipper 0.70 -> 0.85; wing_l on l_wing 0/30 -> 25/30 (with F20)."
  - id: F03 screen-cut departure
    what: "Start a = start of the MOVE containing t_s when it lies in the start-region run, else the last chi-square-stationary frame of the run, else its first frame (cu_features (6a))."
    why: "The last frame with raw speed < 1.0 m/s landed 0.3-0.7 s before the true departure at sigma_p 0.5, so total_s expired before the end region."
    evidence: "with F02: turnout_lane recall at sigma_p 0.5 4/20 -> 18/20; pindown_wl 0.45 -> 0.75."
  - id: F04 fill arrival and displacement
    what: "t_arrival = closest frame to the anchor within settle_s (1.0 s) of the first entry; 'moved' and 'arrive' are measured there; windows pre_s, vacate_before_s, vacate_after_s are params."
    why: "Measured at the first 1.2 m crossing, a filler starting < 3.2 m away (wing->slot 2.86 m, slot->top 3.06 m) could never pass and conf was pinned near 0.5."
    evidence: "fill recall 0.05 / 0.15 / 0.50 -> 1.00 / 1.00 / 1.00 (fill_slot); fill_short stays 0/30."
  - id: F05 margins at their extremum
    what: "cut_loop tests the cumulative turn at its maximum within within_s (sigma cum_turn_sig_deg); cut_weak_baseline tests Dx at its maximum within within_s; sprint_to_corner half-court tests travel from the farthest frame of the window and starts the event at the run start (MOVE start)."
    why: "Tests evaluated at the threshold-crossing frame pin z at about 0 and conf at about 0.5."
    evidence: "median TP conf at sigma_p 0.3 (10 seeds): loop_back 0.55 -> >= 0.8, wb_under >= 0.8, sprint_half_real 1.0 (tests/movement/test_cuts.py::test_f05_*)."
  - id: F06 basket cut past a standing teammate
    what: "_basket no longer returns None on any stationary contact; contacts are stored (screen_contacts) and cu_precedence ranks screen cuts above it."
    why: "A wing cut passing 1.1 m from a standing post got no label at all in 60-70 % of runs."
    evidence: "cut_basket recall 0.90 / 0.89 / 0.88 -> 1.00 / 1.00 / 1.00 (new scenarios); bk_past_post 0.3-0.4 -> >= 0.8."
  - id: F07 curl direction near 180 deg
    what: "When |chord turn| > wrap_deg (150) the integrated heading over [t_s - 1, t_s + 1] gives the size (max of the two) and the sign; the screener side is measured against the user's tangent over +-side_chord_s at t_s; the contact p enters conf."
    why: "Tight curls read 167-178 deg, so sign(turn) was random; the pre-chord side reference was also near 180 deg on curl_down (screener behind the pre-chord), which the proposed fix alone did not cure."
    evidence: "curl_down recall 0.65 / 0.80 / 0.70 -> 1.00 / 1.00 / 0.75 (with mirrors)."
  - id: F08 chord turn in the high-noise tier
    what: "cu_features turn_skip_high_noise_s 0.2 s used (turn curve, leg ends, backdoor set-up chord, circle approach, backdoor stance) when the player's track is in the mvlib high-noise tier, detected from the Kin by median sqrt(var_p / var_v) >= high_noise_ratio_s 0.38 s."
    why: "mvlib switches to Q_HIGH_NOISE at median sigma_p >= 0.45 m and smooths the corner beyond 0.1 s: planted turns read 15 deg low."
    evidence: "planted 90 / 120 / 135 / 160 deg at sigma_p 0.5 read 75 / 104 / 119 / 145 -> 89 / 113 / 127 / 151 (sigma_p 0.2-0.3 unchanged: 95/125/139/160, 93/123/136/158); cut_l recall at 0.5 0.40 -> 0.80, circle 0.70 -> 0.80. Not fixed by this item: cut_veer (0.05) and cut_i (0.15) at sigma_p 0.5 now pass the turn test and fail on leg length (veer 'away' 2.55 m in exactly 0.8 s with a t_turn 0.1-0.15 s early; I-cut legs 1.3-1.4 m vs 1.0 m); band edges not recalibrated (bias <= 9 deg < sigma_A)."
  - id: F09 soft screen contact
    what: "contacts(): pair sigma = contact_sigma_scale (1.4) x hypot(sigma_pos); optional candidates to 1.2 m + contact_widen_k (2) sigma_pair; every contact carries p = P(true d <= 1.2). All screen cuts (incl. curl, straight, pop-out) test it; flare carries p_contact, fade carries 1 - max p_contact and is capped at 0.6 when a standing teammate is within 1.2 m + 2 sigma_pair; p_flare_vs_fade stored."
    why: "A binary 1.2 m mask on a pair distance with 0.25-0.5 m noise flipped flare/fade and gave strict (0.97) fade false positives. contact_sigma_scale: the measured pair-distance error SD for two standing players is 1.35-1.45 x the CA-RTS model sigma at sigma_p 0.2 / 0.3 / 0.5 under sim.observe's AR(1) noise (0.167/0.124, 0.240/0.174, 0.353/0.244)."
    evidence: "flare_elbow fade false positives keep firing in 40 % of runs (the screener is at 1.12 m against the 1.2 m edge and the measured standing distance reads 1.4-1.7 m in those seeds), but now conf <= 0.6, never strict (was 0.97 strict); flare recall there stays about 0.6, which the 1.2 m edge implies. cut_fade precision 0.62 -> 0.77 at sigma_p 0.2."
  - id: F10 backdoor deny branch
    what: "Deny stance = defender within deny_lane_m (1.0) of the cutter->ball segment at projection fraction [0.1, 0.7] and within deny_dist_m, for >= deny_min_s in the 1.0 s before t_rev; a candidate t_rev is skipped when the cutter contacts an off-ball screener in [t_rev - 0.5 s, min-r frame]; start_before_s and dedup_s are params."
    why: "The bearing test accepted a defender trailing on the high side, and back-screen rim cuts (chin) were backdoors."
    evidence: "cut_backdoor on auth chin / chin_wing -> 0 at sigma_p 0.2-0.5. Tester claim rejected for chin_noscreen: with no screener, the cutter cuts to the rim while his defender stands 0.9 m away inside the cutter->ball lane (projection 0.10, perpendicular 0.2 m), which is a backdoor by this item's definition; it still fires there (8-9/10) and the precedence keeps chin first when a screen exists."
  - id: F11 down-screener arrival
    what: "Screener descent = max y over [t_s - scr_arrive_back_s (3.0 s), t_s] - y(t_s), for zipper, pin-down and fade_off_downscreen; stored as screener_Dy_arrival."
    why: "A fixed 1.5 s look-back measured only 0.85-1.36 m for a screener who came down 3.4 m and held 1 s."
    evidence: "pindown_wl recall 0.75 / 0.65 / 0.45 -> 1.00 / 0.90 / 0.75."
  - id: F12 front cut at the pass-by
    what: "Ball-side margin evaluated at the first frame with r(cutter) <= r(defender), else the closest approach after the cutter moved >= pass_by_moved_m (1.0 m)."
    why: "With normal 1 m spacing the closest approach fell at the onset, before the cutter passed his man."
    evidence: "cut_front recall 0.65 / 0.60 / 0.45 -> 1.00 / 0.90 / 0.65."
  - id: F13 banana turn measure
    what: "Turn = angle between the chords of the first and last end_frac (0.25) of the arc length / (1 - end_frac); local-curvature test kappa_local_max <= 0.8 1/m over 1.0 m of arc; roundness >= max(0.6, 0.10 x chord); window enters at 1.0 m/s; banana sigmas are params; kappa_min_mps removed."
    why: "The heading sum over frames >= 2 m/s dropped the slow ends (true 70 deg read 34-80 deg); rounded corners passed the mean-curvature band."
    evidence: "cut_banana recall on the new scenarios 0.90 / 0.55 / 0.40 -> 1.00 / 0.65 / 0.35, on all scenarios 1.00 / 0.80 / 0.53; banana_slot turn now reads 43-91 deg (median 68) at sigma_p 0.3; planted corners (lcut, curved_basket) rejected at sigma_p 0.2-0.3. Deviations: local-curvature edge 0.8 not 0.6 (noise alone reads 0.6-0.75 on straight paths and real arcs reach 0.63 at sigma_p 0.3); chord fraction 0.10 not 0.12 (0.12 lowered recall from 0.55 to 0.45 at sigma_p 0.3). Rejected part of the claim: the tester's front_pass, chin_noscreen and laker_corner paths are Chaikin limit curves (quadratic B-spline arcs, local curvature 0.2-0.5 1/m), geometrically banana-shaped, not rounded L/V corners; they still read as banana, and cu_precedence ranks front / chin / laker above it. Recall stays roundness-limited (0.84 m sagitta reads 0.52-0.93 m at sigma_p 0.3)."
  - id: F14 rub pass-by in confidence
