  status: proposal
  detector: true

- id: blind_pig
  level: set_component
  name: "Blind pig (high-post flash + backdoor)"
  aliases: [blind pig, high-post flash and backdoor]
  actors: {handler: first passer, big: high-post receiver, cutter: backdoor cutter}
  t0: "entry pass release"
  rule: "PASS to a receiver catching in high_post_area or elbow; a cut_backdoor by a third player with t0 in [t_catch - 0.5, t_catch + backdoor_within_s]; PASS big -> cutter within feed_within_s of the backdoor t0. big_flashed flag: the big rose >= flash_dy_m in the 2.0 s before the catch."
  params:
    backdoor_within_s: {value: 1.5, unit: s}
    feed_within_s: {value: 1.5, unit: s}
    flash_dy_m: {value: 2.5, unit: m}
  min_duration_s: 1.0
  outputs: "t_entry, t_rev, t_feed, big_flashed"
