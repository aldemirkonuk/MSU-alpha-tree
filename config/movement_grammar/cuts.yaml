    why: "conf ignored how close the pass-by was; 1.1 m pass-bys came out 29 % strict."
    evidence: "rub_wide / bk_past_post false positives at sigma_p 0.3-0.5 still occur (2-3 of 10 runs) but now with conf 0.60-0.74, never strict (were 29 % strict); 0/10 at sigma_p 0.2. cut_rub precision (all scenarios) 0.97 / 0.88 / 0.72."
  - id: F15 acceptance scenarios
    what: "Every smoke scenario retimed to a truth peak <= 7.0 m/s (asserted <= 7.5 per actor); banana, loop and the transition runs use smooth legs; 22 tester scenarios ported for regression tests; noise sweep of every case over 10 seeds x sigma_p 0.2 / 0.3 / 0.5 plus mirrored copies at 0.3 with recall floors and negative ceilings; exact-mirror test."
    why: "42 of 70 scenarios had peaks of 7.6-16.6 m/s and only 2 seeds at sigma_p 0.3 were tested."
    evidence: "tests/movement/test_cuts.py: test_scenario_truth_speed_is_realistic, test_noise_sweep_recall_and_negatives, test_exact_mirror_symmetry, test_f01-test_f21."
  - id: F16 fade_off_downscreen on baseline exits
    what: "fade_off_downscreen requires the screener to have come down >= down_scr_dy_m within down_scr_back_s and to stand above the user's start."
    why: "It fired 10/10 on baseline exits to the corner, whose screener is a baseline screener."
