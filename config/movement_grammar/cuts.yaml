  rule: "A chord turn of turn_lo_deg-turn_hi_deg; in the approach_s before it the cutter closes >= approach_m on the matched defender and is within near_m of him at the turn; then moves >= away_m in away_s. Loop 2 (F08 residual): for tracks in the mvlib high-noise tier the away window is away_s + turn_pad_high_noise_s, and approach / near are measured at the closest approach to the defender within +-turn_pad_high_noise_s of t_turn; there the closing must reach approach_m + approach_k_high_noise x sigma (loop 5, L5-03: the closest-approach search is a look-elsewhere selection), and the summed z of the turn and approach tests must reach evidence_k_high_noise (loop 6, L6-02: joint veer evidence). Needs the defender track (no defense -> no events). Namespaced cut_veer: the ball-screen 'Veer' (same screener re-screens) belongs to the screens family."
