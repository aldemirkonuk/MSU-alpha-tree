    why: "Weak-side baseline runners were secondary 'low' flashes."
    evidence: "low flash on the author's baseline scenario 4/10 -> 0/30."
  - id: F18 min_duration_s enforced
    what: "_emit drops an event with (end - start) x dt < the item's min_duration_s."
    why: "No item's minimum duration was read (sprint_to_corner emitted at 0.97 s against 1.0 s)."
    evidence: "test_f18_min_duration_is_enforced; the half-court sprint now starts at the MOVE start (F05), so real sprints keep >= 1.0 s."
  - id: F19 hardcoded thresholds
    what: "New params: lift.screener_precedence_s, shake.within_s, rim_run.start_before_s, cut_backdoor.start_before_s / dedup_s, fill windows, banana sigmas, zipper / pin-down scr_arrive_back_s, flare / fade pre_s, rub before_s, loop cum_turn_sig_deg, UCLA ball_side_tol_m; flash stack test uses named_spots LANE_X."
    why: "Numbers in the code were absent from the YAML or differed from the rule text."
    evidence: "test_f19_thresholds_live_in_the_yaml (presence and call-time overrides)."
  - id: F20 wing_l band
    what: "turn_wing_lo_deg 35 for the wing_l variant (standard L keeps 60-120)."
    why: "Real arc-then-corner paths turn 45-55 deg, so wing_l was never labelled."
    evidence: "l_wing labelled wing_l in 9 / 8 / 8 of 10 runs at sigma_p 0.2 / 0.3 / 0.5 (with the F02-class 'whole' fix); l_high stays 0/30."
  - id: F21 CUT gate speed test
    what: "mean_speed = disp / (t_b - t_a) >= mean_mps 2.0 and peak_speed = best 0.5 s window mean >= 2.5 (sqrt2 sigma_pos / W); disp sigma x sqrt(1 + ln n_windows)."
    why: "The instantaneous peak is biased about +1 sigma, and the sliding window selects the luckiest displacement."
    evidence: "jog_rim_slow 'cut' 20-40 % -> 10-20 % (conf 0.51-0.67, never strict); CUT precision (all scenarios) 0.94 / 0.91 -> 0.95 / 0.95 at sigma_p 0.3 / 0.5. The remaining near-threshold passes are a look-elsewhere effect that a conf-only correction cannot remove (any positive margin gives conf > 0.5)."

items:
# ======================================================================================
# Rules (no detector)
# ======================================================================================
- id: cu_features
  level: rule
  name: "Shared kinematics, turn measure, ball events and screen contacts for the family"
  aliases: [OB.R0]
  actors: every player and the ball
  t0: "n/a (feature layer)"
  rule: |
    (1) Positions, velocities and sigmas come from mvlib CA-RTS (MP-04); sigma_pos = K_CAL x sqrt(var_p), sigma_speed = Kin.sigma_speed.
    (2) speed, heading (valid at speed >= 1.0 m/s), v_r (+ toward the rim), r, m = atan2(y, |x|), d3 and sd_paint_out (named_spots rule_continuous_coordinates).
    (3) Chord turn A(t): signed angle between [t - skip - turn_window_s, t - skip] and [t + skip, t + skip + turn_window_s] displacements, each >= turn_min_chord_m. skip = turn_skip_s, or turn_skip_high_noise_s when the player's track is in the mvlib high-noise tier (raw median sigma_p >= 0.45 m, Q_HIGH_NOISE): that tier smooths the corner beyond 0.1 s and the chord under-read planted turns by 15 deg (loop 1, F08). The tier is read from the Kin: median sqrt(var_p / var_v) >= high_noise_ratio_s (<= 0.35 s in the default tier for every sigma_p < 0.45 m, >= 0.41 s in the high-noise tier). Turn events are local maxima of |A| (NMS +-turn_nms_s); t_turn is the slowest frame of the >= 90 % peak plateau (the plant).
    (4) Leg extent from a turn: skip the plant (slow frames, at most plant_max_s), then walk while speed >= move_exit_mps until settled (move_exit_frames slow frames).
    (5) Stationary (screener): stationary_s2 < stationary_s2_max on >= stationary_frac of a stationary_window_s window, with s2 = |v|^2 / (K_CAL^2 max(var_v, stationary_var_v_floor_mps^2)) and point speed <= stationary_max_mps (loop 4, L4-03 / L4-06).
    (5b) Team possession (loop 4, L4-01): own(t) is True while the offense has the ball (raw ball within poss_ctrl_r_m of an offensive player no farther than the nearest defender; defense control when a defender is within poss_ctrl_r_m and every offensive player >= poss_margin_m farther; a switch needs poss_switch_s of sustained control, back-dated). Off-ball frames (MOVE, cuts, contacts) are restricted to own(t).
    (6a) Screen-cut start (flex, zipper, pin-down, turnout, cross, baseline exit, shuffle): the departure from the start-region run that ends last within back_s before t_s, i.e. the start of the MOVE that contains t_s when it lies in that run, else the last chi-square-stationary frame of the run, else the run's first frame (loop 1, F03: raw speed at rest reads 0.3-1.2 m/s, so 'speed < 1.0' put the start 0.3-0.7 s early at sigma_p 0.5). The end is the first end-region frame, advanced while the cutter keeps moving (speed >= 1.0 m/s) inside the end region and within total_s; every 'within' test compares frame counts, e - a <= F(total_s) (F02).
    (6) Off-ball screen contact: off-ball mover (inside one of his MOVEs) within screen_contact_m of a stationary off-ball teammate; screen moment t_s = closest approach in the contact interval. Consumer proxy of the screens family R-ST-17 (loose); the screens family owns the definition. Soft contact (loop 1, F09): sigma_pair = contact_sigma_scale x hypot(sigma_pos(u), sigma_pos(s)); each contact stores p = P(true d <= screen_contact_m); where a rule needs borderline contacts (flare/fade, UCLA, rub) candidates are taken to screen_contact_m + contact_widen_k x sigma_pair. Every screen cut's 'contact' test passes when d <= 1.2 m and carries that p.
    (7) Ball events from scene.holder: holder runs (blips < 3 frames dropped, e.g. the ball passing a screener; gaps <= holder_gap_s with the same holder on both sides are bridged, because a fast dribbler's smoothed position and the noisy ball can separate by > 1.0 m for a few frames); PASS = run A ends, flight of 2 frames to pass_max_flight_s, run B (B != A) starts; t_rel = last frame of A, t_catch = first frame of B. DRIVE (motion_starts) = holder from r >= drive_out_r_m to r < drive_in_r_m within drive_max_s, t = last frame at r >= 6.1; baseline drive when m at entry < baseline_drive_m_deg. Ball screen = handler within screen_contact_m of a stationary teammate while the handler moves (>= 1.0 m/s within 0.3 s); contact pieces of the same pair less than 1.0 s apart are one screen. Paint touch = holder enters the paint.
    (8) Matched defender: smallest mean distance over the rule's window; ambiguous when the runner-up is within def_ambiguous_m (proxy for the defense_full HMM).
    (9) Frontcourt: y <= HALF_Y (12.70 m, named_spots; repo 12.73 superseded).
  params:
    min_conf: {value: 0.5, unit: prob}
    strict_conf: {value: 0.8, unit: prob}
    identity_cap: {value: 0.6, unit: prob}
    move_enter_mps: {value: 1.5, unit: m/s}
    move_enter_sigma_k: {value: 3.0, unit: sigma}
    move_enter_frames: {value: 3, unit: frames}
    move_exit_mps: {value: 1.0, unit: m/s}
    move_exit_frames: {value: 6, unit: frames}
    leg_min_s: {value: 0.3, unit: s}
    cut_peak_mps: {value: 2.5, unit: m/s}
    turn_skip_s: {value: 0.1, unit: s}
    turn_skip_high_noise_s: {value: 0.2, unit: s}
    high_noise_ratio_s: {value: 0.38, unit: s}
    turn_window_s: {value: 0.5, unit: s}
    turn_min_chord_m: {value: 0.5, unit: m}
    turn_nms_s: {value: 0.3, unit: s}
    plant_max_s: {value: 0.4, unit: s}
    stationary_s2_max: {value: 5.99, unit: chi2_2dof}
    stationary_window_s: {value: 0.3, unit: s}
    stationary_frac: {value: 0.6, unit: fraction}
    stationary_max_mps: {value: 1.0, unit: m/s}
    stationary_var_v_floor_mps: {value: 0.183, unit: m/s}  # loop 4 (L4-06): var_v floor of the stationary s2 (CA-RTS steady state at sigma_p 0.2; screens SCR-L4-01)
    screen_contact_m: {value: 1.2, unit: m}
    contact_widen_k: {value: 2.0, unit: sigma}
    contact_sigma_scale: {value: 1.4, unit: ratio}
    rim_end_r_m: {value: 2.0, unit: m}
    ball_dead_band_m: {value: 0.9, unit: m}
    def_ambiguous_m: {value: 0.5, unit: m}
    drive_out_r_m: {value: 6.1, unit: m}
    drive_in_r_m: {value: 3.05, unit: m}
    drive_max_s: {value: 2.5, unit: s}
    baseline_drive_m_deg: {value: 30, unit: deg}
    pass_max_flight_s: {value: 3.0, unit: s}
    holder_gap_s: {value: 0.3, unit: s}
    poss_ctrl_r_m: {value: 1.0, unit: m}
    poss_margin_m: {value: 0.5, unit: m}
    poss_switch_s: {value: 0.5, unit: s}
  min_duration_s: null
  outputs: "per-frame features; turn events {t, t_peak, A, chord_pre, chord_post, sigma_A}; passes, drives, ball screens, paint touches, contacts"
  confidence: "n/a (inputs). sigma_A = hypot(sqrt2 sigma_pos / chord_pre, sqrt2 sigma_pos / chord_post) rad."
  noise: "At sigma_p 0.3 m a standing player's CA-RTS speed is 0.3-1.2 m/s and sigma_speed about 0.40 m/s, so MOVE enters at 1.5 m/s for 3 frames (about 3.7 sigma) and screens use the chi-square test. Chords of 0.5 m over 0.5 s give sigma_A of about 25-35 deg at worst, 5-10 deg for 1.5 m legs. Real CV noise is correlated (AR 0.9): treat these as lower bounds until measured on UConn/Louisville clicks."
  observability: "Weak-side players are often out of the broadcast frame; mvlib gap states give gap_factor 0 for long gaps, so weak-side labels (weak baseline, flex, shuffle, fade, drift) lose recall, not precision. Report recall per class with the share of frames observed."
  conflicts_resolved:
    - "Velocity source: research proposed a derivative-of-Gaussian velocity; the family uses mvlib CA-RTS (MP-04), the project measurement pipeline, so every family shares one kinematic layer."
    - "Turn measure: research Dpsi over 0.3 s velocity windows (fails across a plant, under-reads 13-15 %) replaced by the chord turn with the plant skipped (MP-13)."
  sources:
    - {url: "/Users/aldemirkonuk/Projects/MSU-Alpha-3/tools/specgen/movement/mvlib.py", supports: "CA-RTS, sigma model, stationary_s2, window_conf/edge_factor/gap_factor"}
    - {url: "/Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml", supports: "rule_continuous_coordinates (d3, sd_paint_out), ball dead band 0.9 m, HALF_Y 12.70, slow_speed_mps 1.0"}
    - {url: "/Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/motion_starts.md", supports: "DRIVE: dribble from r > 6.1 reaching r < 3.05"}
  status: proposal
  detector: false

- id: cu_confidence
  level: rule
  name: "Confidence model shared by every label"
  aliases: [OB.R1]
  actors: n/a
  t0: n/a
  rule: |
    Each label is a conjunction of tests v_i (>=|<=) T_i. z_i = s_i (v_i - T_i) / sigma_i; p_i = Phi(z_i).
    sigma_i: positions and r -> sigma_pos; displacement -> hypot(sigma_pos(a), sigma_pos(b)); window-mean speed over W -> sqrt(2) sigma_pos / W; peak speed -> sigma_speed at the peak; chord angle -> sigma_A; fraction-of-frames tests -> f = mean of per-frame p_k, sigma_f = sqrt(9 sum p_k(1-p_k)) / n (Poisson-binomial, variance x9 for 0.3 s correlation), floor 0.01.
    P_cond = min(window_conf(per-frame condition), min_i p_i); conf = P_cond x edge_factor(t0) x gap_factor(window) (MP-16).
    Emit when every test passes at its nominal value and conf >= 0.50; strict when conf >= 0.80.
    Identity cap: defender-relative or crowd-crossing labels with no defender track or an ambiguous matched defender are capped at 0.60 (never strict; decided explicitly).
    Mutually exclusive pairs report p for each side (V/L: p_v_vs_l, p_l_vs_v).
    Once >= 50 labels per class exist (R-ST-10), conf is isotonic-calibrated per class; margins z_i and binding_test are stored for audit.
  params: {}
  min_duration_s: null
  outputs: "conf, strict, margins {test: z}, binding_test, p_cond, edge, gap, cap"
  confidence: self
  noise: "Weakest-link is conservative when many tests are marginal; accepted (precision over recall, as CTG)."
  observability: n/a
  conflicts_resolved:
    - "q_track multiplier (research) dropped: tier D (0.5) could never emit. Track quality enters through gap_factor and edge_factor (MP-16)."
  sources:
    - {url: "https://docs.cleaningtheglass.com/pro/data-sets/off-ball-screens", supports: "CTG off-ball screen data favours precision over recall"}
  status: proposal
  detector: false

- id: cu_triggers
  level: rule
  name: "Ball-event trigger association and timing"
  aliases: [OB.R2]
  actors: all
  t0: "per label"
  rule: |
    dt_trigger = t_onset - t_trigger (negative = anticipatory). Cuts: dt in [-0.5, +1.0] s. Relocations: dt in [-0.5, +2.5] s (the research text '[t_onset - 0.5, t_onset + 2.5]' was a sign slip; named_spots lift uses the same window measured from the trigger).
    Trigger kinds: own pass, pass by others, catch by a teammate, DRIVE start, ball-screen moment, paint touch (from cu_features (7)); DHO, shot release and change of possession need event data (needs_data) and are taken from scene attributes when present (possession_t0).
    Class priors: UCLA, shuffle, thru, laker, give-and-go = own pass; chin = reversal pass; drift, hammer = drive; shake, blade = ball screen; backdoor = deny or dribble-at; lift = drive or ball screen. Ties go to the smallest |dt|.
  params: {}
  min_duration_s: null
  outputs: "trigger_kind, trigger_actor, dt_trigger_s"
  confidence: n/a
  noise: "Pass release and catch from the ball track carry 2-4 frames of error, small against the windows. With the ball occluded the holder's position is the ball proxy."
  observability: "DHO and pass fakes are not separable from XY at broadcast resolution (needs_data)."
  conflicts_resolved: []
  sources:
    - {url: "https://docs.cleaningtheglass.com/pro/data-sets/cuts", supports: "CTG stores outcomes of the cutter's touch and is_direct; setup cuts are flagged, not deleted"}
  status: proposal
  detector: false

- id: cu_postrules
  level: rule
  name: "Shared post-emission rules: half-court gate, de-duplication, tracking glitches (loop 5)"
  aliases: [CU.R6]
  actors: n/a
  t0: n/a
  rule: |
    Applied to the output of every registered detector (DETECTORS), in this order:
    1. Glitch (L5-04b): drop the event when the primary actor's smoothed speed exceeds glitch_max_mps on any frame of [start, end] (tracking teleport).
    2. Half-court gate (L5-01, carry rule L6-01, run test L7-02, structure L9-01..04): except for exempt_kinds (transition labels and the MOVE carrier), the primary actor must be in the frontcourt (y <= cut.frontcourt_y_max_m) on every frame of [start, end] (where the action happens). If he was beyond half court on a frame of [start - cut.transition_carry_s, start) (the transition carry), the label is dropped only when that crossing was part of a transition: (a) a run carried into the label: every carry_sustain_chord_s chord speed from his last backcourt frame to the label start >= carry_run_mps - carry_sustain_k x its sigma and their median >= carry_run_mps (carry_run_mps 2.0 m/s is the human walk-run gait transition, Froude number 0.5, below the 2.5-3.5 m/s band of real jog-ups), and then the phase is read from the structure of the action, not from a burst-ratio threshold (loop 9): on-ball, the actor still holds the ball after the label start (L8-02) or his next ball touch after his holder run is his own inside the label (L9-04, a dribble whose holder flag dropped out): transition; 'keeps running' is judged on the post-release segment, the label's first carry_post_s (L9-02), not the whole label; an off-ball runner (no holder run of his in [crossing - carry_hold_back_s, start)) is the transition while he keeps running pace (median post-release chord >= carry_run_mps), and a runner who slows to a walk after the crossing starts a half-court action (L9-03); a handler who released the ball by the label start out of a push (L9-01: every carry_push_chord_s chord ending in the last carry_push_span_s before the release >= carry_push_mps, the TRN-P08 push speed) and keeps running is the transition, whatever he does next (the push that hits ahead and sprints or accelerates to the rim); after a jog-up the pass is the phase change: the handler keeps running only when the post-release median clears carry_run_mps by carry_post_k sigma of that median (one-sided), and only a steady continuation (whole-label median chord < carry_burst_ratio x the carry median, a secondary cue without margin) stays a transition, while a slow-down or a burst after the pass is a half-court action; (b) the defense not set, >= carry_def_unset_n defenders beyond half court on a frame of the carry window (only with >= carry_def_min_tracked tracked defenders); or (c) the ball beyond half court during the label. A walk-up, or a jog-up that slows into or after the pass, the catch or the set-up, or that bursts after the pass, is a half-court phase, so a handler who walks or jogs the ball over and passes and cuts within 2 s keeps his label. XY only (no ball height). This extends L4-02 (CUT windows only) to the turn-, arc- and contact-anchored labels (V, L, I, veer, banana, straight, curl, flare, fade, ...).
    3. De-duplication (L5-04): per (kind, actors) only the highest-conf event within dedup_t0_s of its t0 is kept.
  params:
    exempt_kinds: {value: [move, rim_run, sprint_to_corner], unit: list}
    dedup_t0_s: {value: 0.334, unit: s}  # 10 frames
    glitch_max_mps: {value: 10.0, unit: m/s}
    carry_run_mps: {value: 2.0, unit: m/s}  # loop 7 (L7-02, was carry_sustain_mps 3.0): the carry rejects a label after a run at >= walk-run gait speed (Froude 0.5; loop 8: also its median chord) ...
    carry_burst_ratio: {value: 1.25, unit: ratio}  # loop 7 (L7-02); loop 9 (L9-01): secondary cue only, after a jog-up handler's pass at running pace: a burst (whole-label median chord pace >= this x the carry's) is a half-court pass-and-cut, a steady continuation the transition; no sigma margin (L8-03 carry_burst_k removed)
    carry_hold_back_s: {value: 1.0, unit: s}  # loop 7 (L7-02): ball-holder status is looked up from crossing - this to the label start
    carry_sustain_chord_s: {value: 0.5, unit: s}  # ... (every 0.5 s chord from the crossing to the label start ...
    carry_sustain_k: {value: 1.0, unit: sigma}  # ... >= carry_run_mps - k x chord sigma), or ...
    carry_def_unset_n: {value: 2, unit: players}  # ... or while >= this many defenders are beyond half court (defense not set)
    carry_def_min_tracked: {value: 3, unit: players}  # the defense test needs at least this many tracked defenders
    carry_post_s: {value: 1.3, unit: s}  # loop 9 (L9-02, C8-2): 'keeps running' is judged on the label's first carry_post_s (the post-release segment up to the settle), not on the whole-label median
    carry_post_k: {value: 1.0, unit: sigma}  # loop 9 (L9-02): after a jog-up handler's pass the post-release median must clear carry_run_mps by this many sigma of that median (one-sided; pushes and off-ball runners use the plain test)
    carry_push_mps: {value: 4.0, unit: m/s}  # loop 9 (L9-01, C8-1): push speed of transition TRN-P08 (vbar(1.0) >= 4.0 m/s for 1.5 s while holding) ...
    carry_push_chord_s: {value: 1.0, unit: s}  # ... on every chord of this length (TRN-P08 vbar(1.0)) ...
    carry_push_span_s: {value: 0.5, unit: s}  # ... ending in the last carry_push_span_s before the release (the chords cover 1.5 s, TRN-P08 min_duration_s)
  min_duration_s: null
  outputs: "filters events; no new attributes"
  confidence: n/a
  noise: "The gate tests smoothed y against a line 12.7 m from the rim, far from any half-court spot (top of the arc 7.24 m), so position noise does not move half-court labels across it."
  observability: n/a
  conflicts_resolved: []
  sources: []
  status: proposal
  detector: false

- id: cu_precedence
  level: rule
  name: "Precedence, exclusivity and multi-label policy"
  aliases: [OB.R3]
  actors: n/a
  t0: n/a
  rule: |
    1. Screen-family labels on the screener (ROLL, SLIP, POP) win: basket/dive/flash are not emitted when the player was a ball screener within 1.0 s before onset.
    2. One primary label per (actor, overlapping interval) in the order below ('kind:variant' entries rank a variant on its own: a half-court corner sprint ranks below fill and drift); every other label on that actor and interval is kept as secondary (attrs primary = false, secondary_of = winner). move and cut are carriers and never ranked.
    3. Rim cuts behind a high-post screener: UCLA (own pass to the same-side wing) > shuffle (weak-side diagonal or hawk dribble) > chin (reversal by others). The unscreened UCLA path (cut_ucla:ucla_path_no_screen) ranks below cut_basket.
    4. Exclusive pairs report both probabilities: V vs L (turn 120 deg edge), lift vs drift (sign of Dm), shake vs blade, curl vs flare vs straight vs pop_out at one screen moment.
    5. Hierarchical multi-labels: dive -> basket, 45 -> basket, front -> basket, I -> V when both fire, hammer -> drift.
    6. Relocation sub-labels outrank relocate; transition labels outrank half-court labels.
    7. X-cut / scissors (post split) belongs to the screens family; the cuts it contains are labelled here as basket/curl cuts.
  params:
    order:
      unit: list
      value: [rim_run, "sprint_to_corner:transition", blind_pig, give_and_go, wiper, cut_ucla, cut_shuffle, cut_chin, cut_iverson,
              cut_flex, cut_zipper, cut_pin_down, cut_turnout, cut_cross_screen, cut_baseline_exit, cut_loop, cut_blade, cut_laker,
              cut_circle, cut_rub, cut_curl, cut_flare, cut_hammer, cut_straight, cut_pop_out, cut_backdoor, cut_thru, cut_i, cut_v,
              cut_l, cut_shallow, cut_weak_baseline, cut_flash, cut_veer, cut_dive, cut_45, cut_front, cut_basket,
              "cut_ucla:ucla_path_no_screen", cut_banana, cut_fade,
              shake, drift, lift, dunker_slide, fill, "sprint_to_corner:half_court", relocate]
  min_duration_s: null
  outputs: "primary (bool), secondary_of"
  confidence: n/a
  noise: "Precedence errors propagate from the screen detector; secondary labels are kept so re-ranking needs no re-detection."
  observability: n/a
  conflicts_resolved: []
  sources:
    - {url: "https://fansided.com/2017/09/08/nylon-calculus-understanding-synergy-play-type-data/", supports: "Synergy separates screen cuts (UCLA, flex) from off-screen curls"}
  status: proposal
  detector: false

- id: cu_storage_eval
  level: rule
  name: "Storage, tokens and evaluation protocol"
  aliases: [OB.R4 composition part, OB.R5]
  actors: n/a
  t0: n/a
  rule: |
    Every event stores its evidence (attrs), margins and binding test; MOVE stores a cubic Bezier (4 control points). Each label is a token LABEL[variant](actors, t0, dt_prev) in action_sequence; set naming follows R-ST-06.
    Evaluation per class on held-out games: match = same actor(s), same kind, |t0_pred - t0_true| <= 0.5 s; report F1, t0 error distribution and end-r error. R-ST-01 F1 >= 0.85 overall; new-ST-3 F1 >= 0.80 per named cut on >= 50 instances; rarer classes ship as unvalidated.
    Synthetic acceptance (V0): tests/movement/test_cuts.py: smoke cases at sigma_p 0.3 m, seeds 1-2, t0 within +-0.3 s; a noise sweep of every case over 10 seeds x sigma_p 0.2 / 0.3 / 0.5 plus mirrored copies, matched at |t0 error| <= 0.5 s, with recall floors (0.8 at 0.2 and 0.3, 0.5 at 0.5) and negative fire-rate ceilings (0.1, 0.1, 0.2); every scenario's truth peak speed <= 7.5 m/s; exact mirror symmetry (loop 1, F15).
  params: {}
  min_duration_s: null
  outputs: "movement_primitives rows, actions rows, set_instances.action_sequence"
  confidence: n/a
  noise: n/a
  observability: n/a
  conflicts_resolved:
    - "schema primitive_type enum needs the new codes (new-ST-3); path_shape should become continuous straightness, roundness_m and cum_turn columns (schema owner decision)."
  sources:
    - {url: "https://squared2020.com/2017/10/25/the-art-of-sketching-trajectory-analysis/", supports: "Possession Sketches: segment words and a 250-curve Bezier dictionary"}
    - {url: "/Users/aldemirkonuk/Projects/MSU-Alpha-3/schema/tables/movement_primitives.yaml", supports: "primitive_type enum, path_shape and curvature_per_m columns"}
  status: proposal
  detector: false

# ======================================================================================
# Primitives
# ======================================================================================
- id: move
  level: primitive
  name: "MOVE (off-ball movement segment with legs)"
  aliases: [OB.P1, off-ball move]
  actors: {player: off-ball attacker}
  t0: "t_onset = first frame of the enter run"
  rule: |
    Off-ball frames only (has_ball = 0, observed or short-interpolated). Enter when speed >= max(move_enter_mps, move_enter_sigma_k x sigma_speed) for move_enter_frames consecutive frames; stay while speed >= move_exit_mps, exit after move_exit_frames consecutive slow frames (hysteresis). Minimum duration leg_min_s.
    Legs: split at chord-turn events with |A| >= split_turn_deg; a leg is valid when chord >= leg_min_chord_m and duration >= leg_min_s. A MOVE with no valid leg is dropped. Catch, long gap or camera cut end the MOVE (mvlib segments).
  params:
    split_turn_deg: {value: 60, unit: deg}
    leg_min_chord_m: {value: 1.0, unit: m}
    leg_min_s: {value: 0.3, unit: s}
  min_duration_s: 0.3
  outputs: "t_onset, t_end, legs [{start, end, chord}], L, C, straightness, roundness_m, roundness_side (+ rim side), Dr, Dm, mean/peak speed, start/end region, received_ball, bezier_ctrl"
  confidence: "tests: best leg chord >= 1.0 m; per-frame condition P(speed > 1.0)."
  noise: "False onsets at 0.3 m are rare (enter is about 3.7 sigma for 3 frames); at 0.5 m the sigma-adaptive threshold rises to 3 x 0.7 = 2.1 m/s, which removes the 36/min false onsets found by the check. Chord gating removes jitter-inflated path length."
  observability: "Weak-side MOVEs vanish when out of frame (gap_factor 0)."
  conflicts_resolved:
