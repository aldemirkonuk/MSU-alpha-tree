- id: cut
  level: primitive
  name: "CUT gate (generic off-ball cut)"
  aliases: [OB.P2, cut]
  actors: {cutter: off-ball attacker}
  t0: "t_onset"
  rule: |
    Inside a MOVE: a window [t_a, t_b] with t_b - t_a <= window_s and |p(t_b) - p(t_a)| >= disp_m, window-mean speed disp / (t_b - t_a) >= mean_mps, best speed_window_s-mean speed in the window >= peak_mps, y(t_a) <= frontcourt_y_max_m. The displacement sigma is inflated by sqrt(1 + ln n) for the n windows searched in the MOVE so far (loop 1, F21); the mean-speed edge is raised by lookelse_k x sigma x sqrt(ln n) (zero for the first window) and the best-window speed edge by lookelse_k x sigma x sqrt(ln n_ind), n_ind = (t_b - t_a) / speed_window_s (loop 2, F21r: best-of-n selection bias); the instantaneous peak is stored only.
    t_onset = latest upward crossing of 1.5 m/s at or before t_a (search back <= onset_search_s), else the MOVE start.
    t_end = first of: catch; MOVE exit; a chord turn >= end_turn_deg after t_b; for rim-directed cuts (Dr <= -rim_dir_dr_m so far) the first frame of a run of rim_stop_s with v_r <= rim_stop_vr_mps (CTG: stops getting closer); t_onset + max_s.
    hard_cut flag: speed >= hard_cut_mps for >= hard_cut_s. delayed_cut flag: onset 1-3 s after a teammate's DRIVE start. stampede flag: caught while speed >= hard_cut_mps.
  params:
    disp_m: {value: 3.0, unit: m}
    window_s: {value: 1.5, unit: s}
    peak_mps: {value: 2.5, unit: m/s}
    mean_mps: {value: 2.0, unit: m/s}
    lookelse_k: {value: 1.0, unit: ratio}  # loop 2 F21r: look-elsewhere margin (x sigma x sqrt(ln n)) on the mean and best-window speed edges
    speed_window_s: {value: 0.5, unit: s}
    frontcourt_y_max_m: {value: 12.70, unit: m}
    transition_carry_s: {value: 2.0, unit: s}
    onset_search_s: {value: 1.0, unit: s}
    end_turn_deg: {value: 60, unit: deg}
    rim_dir_dr_m: {value: 2.0, unit: m}
    rim_stop_vr_mps: {value: 0.3, unit: m/s}
    rim_stop_s: {value: 0.2, unit: s}
    max_s: {value: 4.0, unit: s}
    hard_cut_mps: {value: 3.9, unit: m/s}
    hard_cut_s: {value: 0.4, unit: s}
  min_duration_s: 0.4
  outputs: "t_onset, t_a, t_b, t_end, displacement_m, mean/peak speed, hard_cut, received_ball, t_catch, start/end region, start_r, end_r, Dr, Dm, roundness_m, straightness, defender_id, defender_ambiguous, separation_gain_m, ball_side_at_onset, delayed_cut, stampede"
  confidence: "tests: disp >= 3.0 (sigma_disp x sqrt(1 + ln n_windows)), mean_speed >= 2.0 (sqrt2 sigma_pos / W), peak_speed = best 0.5 s window mean >= 2.5 (sqrt2 sigma_pos / 0.5 s); per-frame P(speed > 1.0) over the cut."
  noise: "3 m against sigma_disp 0.16-0.27 m is robust. The instantaneous peak was biased about +1 sigma (a 1.8 m/s jog passed it); the 0.5 s window mean is not. Near-threshold jogs still pass in 10-20 % of runs at sigma_p 0.3-0.5 with conf 0.51-0.67 (never strict); the sliding-window search is a look-elsewhere effect that only the inflated sigma reports."
  observability: "Cuts that start off-frame get edge_factor < 1 near the segment start."
  conflicts_resolved:
    - "CUT displacement 3.0 m in <= 1.5 s (offense 0.2, motion_starts, actions_extra) vs 10 ft (set_taxonomy): 3.0 m."
    - "Speed: mean >= 2.5 m/s (actions_extra) vs hard cut 3.9 m/s for 0.4 s (offense A5): gate on peak >= 2.5 m/s; 3.9 m/s is the hard_cut flag."
  sources:
    - {url: "https://docs.cleaningtheglass.com/pro/data-sets/cuts", supports: "basket cut ends when the player stops moving closer to the rim; setup cuts flagged"}
    - {url: "/Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md", supports: "CUT >= 3 m in <= 1.5 s; hard cut >= 3.9 m/s for >= 0.4 s"}
  status: proposal
  detector: true

