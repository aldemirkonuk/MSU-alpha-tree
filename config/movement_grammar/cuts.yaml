- id: cut_i
  level: primitive
  name: "I-cut (in, then straight back out)"
  aliases: [OB.P10, I-cut, 1-cut]
  actors: {cutter: off-ball attacker}
  t0: "t_turn"
  rule: "Loop 8 (L8-04, L8-05): the in_dir tolerance is bounded by in_dir_tol_max_deg, and an I that reaches the rim zone (r < cut_basket.rim_end_r_m at its start, apex or axis midpoint) also needs radial depth -Dr / L1 >= cos(in_dir_max_deg) (in_depth), since the bearing to the rim is ill-defined there. Loop 7 (L7-01, replaces the L6-03 Dr / L1 >= in_dir_frac form): the in-leg points within in_dir_max_deg (60 deg) of the rim, tested as angles: (in_axis) the I's axis, from the midpoint of its two outer ends to the apex, is within in_dir_max_deg of the bearing to the rim from that midpoint (z-test with the axis direction and bearing sigma), and (in_dir) the in-leg chord is within in_dir_max_deg + min(in_dir_tol_k x its direction sigma, in_dir_tol_max_deg) of the bearing to the rim from its start. Loop 6 (L6-03): the in-leg must point within 60 deg of the rim (a corner player walking down the sideline and back, or a slide along the arc, is not an I). Loop 5 (L5-02): the in-leg must step toward the rim, Dr <= -in_dr_k x sigma_disp. Loop 4 (L4-04): out-leg peak speed >= out_peak_mps outside the mvlib high-noise tier. Chord turn |A| >= turn_min_deg; in-leg chord >= leg_min_m with Dr <= -in_dr_k x sigma_disp and the L7-01 angle tests; out-leg chord >= leg_min_m; mean perpendicular offset of the out-leg points from the in-leg line <= offset_max_m; roundness of both legs <= roundness_max_m; whole <= max_s. Loop 2 (F08 residual): for tracks in the mvlib high-noise tier both legs are tested against leg_min_high_noise_m (the Q_HIGH_NOISE smoother cuts the apex of a short out-and-back by ~0.6 m) and min(in, out) / max(in, out) >= leg_ratio_high_noise (a run that stops reads a spurious reversal with a 0.7-0.9 m jitter out-leg). The 150 deg and same-line parts are the repo convention (proposal, fix OB.P10); I and V multi-label."
  params:
    turn_min_deg: {value: 150, unit: deg}
    leg_min_m: {value: 1.0, unit: m}
    leg_min_high_noise_m: {value: 0.7, unit: m}  # loop 2 (F08 residual): legs in the mvlib high-noise tier (smoother apex bias)
    leg_ratio_high_noise: {value: 0.6, unit: ratio}  # loop 2: min(in, out) / max(in, out) in the high-noise tier (stop artefact)
    leg_max_s: {value: 1.0, unit: s}
    offset_max_m: {value: 0.5, unit: m}
    roundness_max_m: {value: 0.4, unit: m}
    max_s: {value: 2.0, unit: s}
    out_peak_mps: {value: 2.0, unit: m/s}  # loop 4 (L4-04): out-leg peak speed floor, not applied in the high-noise tier
    in_dr_k: {value: 2.0, unit: sigma}  # loop 5 (L5-02): in-leg Dr <= -in_dr_k x sigma_disp (a significant step toward the rim)
    in_dir_max_deg: {value: 60, unit: deg}  # loop 7 (L7-01; L6-03 used in_dir_frac 0.5 = Dr / L1): angle between the I's axis (midpoint of its two outer ends -> apex) and the bearing to the rim from that midpoint <= this (z-test with the axis and bearing sigma)
    in_dir_tol_k: {value: 0.5, unit: sigma}  # loop 7 (L7-01): the in-leg chord's own angle to the rim bearing from its start <= in_dir_max_deg + this x its direction sigma
    in_dir_tol_max_deg: {value: 2.0, unit: deg}  # loop 8 (L8-04, C7-3): the chord tolerance in_dir_tol_k x sigma is bounded by this (its value for a 1.8 m leg at the lowest production tier, sigma_p 0.2)
  min_duration_s: 0.5
  outputs: "t_turn, Dpsi_turn, in_len, out_len"
  confidence: "tests: turn, in_leg, in_Dr, in_axis, in_dir, in_depth (rim zone), out_leg, out_peak (below the high-noise tier), leg_balance (high-noise tier), lateral_offset, roundness, whole."
  noise: "1.0 m legs give sigma_A up to about 25 deg; expect low recall at 0.5 m noise."
  observability: "as cut_v"
  conflicts_resolved: ["FIBA I-cut (step toward the basket, cut to the perimeter) has no angle; the 150 deg / same-line geometry is actions_extra's."]
  sources:
    - {url: "https://assets.fiba.basketball/image/upload/documents-corporate-regional-offices-europe-programs-fiba-europe-coaching-certificate-fiba-europe-basketball-terminology.pdf", supports: "I-cut: step toward the basket drawing the defender, then cut to the perimeter"}
    - {url: "/Users/aldemirkonuk/Projects/MSU-Alpha-3/config/vocab/actions_extra.yaml", supports: "cut_i: step in >= 1.0 m then back out >= 1.0 m, heading change >= 150 deg"}
  status: proposal
  detector: true

- id: cut_banana
