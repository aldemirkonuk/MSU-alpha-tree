- id: give_and_go
  level: set_component
  name: "Give-and-go"
  aliases: [OB.R4, pass and cut]
  actors: {cutter: passer, receiver: first receiver}
  t0: "first pass release"
  rule: "PASS a -> b, a CUT by a with onset in [t_pass - 0.3, t_pass + cut_within_s], and a PASS b -> a released within return_within_s of the onset; the catch at r <= catch_r_m."
  params:
    cut_within_s: {value: 1.0, unit: s}
    return_within_s: {value: 2.0, unit: s}
    catch_r_m: {value: 2.5, unit: m}
  min_duration_s: 1.0
  outputs: "t_pass, t_onset, t_return"
  confidence: "tests: CUT tests, catch_r."
  noise: "Pass timing error 2-4 frames."
  observability: "in frame"
  conflicts_resolved: []
  sources:
