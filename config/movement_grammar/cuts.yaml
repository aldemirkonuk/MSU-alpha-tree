- id: fill
  level: action
  name: "Fill / replace / refill / fill_slide_arc into a vacated perimeter spot"
  aliases: [OB.A13, fill, replace, refill, fill_slide]
  actors: {vacator: A, filler: B}
  t0: "t_vacate (A first > leave_m from the anchor)"
  rule: "Loop 4 (L4-05): A must be settled while in the disc (median speed <= occupy_max_mps + occupy_sig_k x median sig_speed) and B must stay within arrive_m on >= stay_frac of stay_s after t_arrival, both during own possession. named_spots fill_slide: A occupies a perimeter anchor (corner_three, wing_three, slot_three, top_three anchors and mirrors; within arrive_m for >= occupy_s), then leaves (> leave_m) at t_vacate; within within_s teammate B (not already there) arrives within arrive_m; t_arrival = his closest frame to the anchor within settle_s of the first entry, and he moved >= move_m to it from his positions in the pre_s before t_vacate (loop 1, F04: measured at the first 1.2 m crossing, a wing->slot fill of 2.86 m could never pass). kind: fill (A drove or cut), replace (A was a ball screener), refill (otherwise), each within [t_vacate - vacate_before_s, t_vacate + vacate_after_s]; fill_slide_arc when B's |Dr| <= slide_dr_m."
  params:
    arrive_m: {value: 1.2, unit: m}
    leave_m: {value: 2.0, unit: m}
    occupy_s: {value: 0.233, unit: s}
    within_s: {value: 2.0, unit: s}
    move_m: {value: 2.0, unit: m}
    slide_dr_m: {value: 0.8, unit: m}
    settle_s: {value: 1.0, unit: s}
    pre_s: {value: 1.0, unit: s}
    vacate_before_s: {value: 1.5, unit: s}
    vacate_after_s: {value: 0.5, unit: s}
    occupy_max_mps: {value: 1.0, unit: m/s}  # loop 4 (L4-05): vacator's median speed while in the disc (settled, not passing through)
    occupy_sig_k: {value: 1.0, unit: sigma}  # loop 4: + k x median sig_speed (rest-speed bias of the smoother)
    stay_s: {value: 1.0, unit: s}  # loop 4: filler stay window after t_arrival
    stay_frac: {value: 0.5, unit: fraction}  # loop 4: share of stay_s within arrive_m
  min_duration_s: 0.5
  outputs: "spot_id, anchor, kind, fill_slide_arc, dt_fill_s, t_arrival"
  confidence: "tests: filler_move, arrive."
  noise: "1.2 m arrival is about 5 sigma of point distance; fillers 1.3 m away are missed (store the miss distance when calibrating)."
  observability: "Perimeter spots usually in frame."
  conflicts_resolved: ["FIBA 'lift' (refill the driver's spot) is labelled fill."]
  sources:
