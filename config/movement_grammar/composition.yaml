    ALIGN: an attacker with no usable position costs missing_slot_penalty_m for his slot (4 x 5 assignment).
    Lattice: events from positions predicted more than 0.5 s into an occlusion are excluded (named_spots
    rule_occlusion_handling); proxies inherit mvlib gap_factor (0 for interp_long or no track). Matcher: deleting a
    step whose bound actor has gap_factor 0 over the step window costs unobservable_factor x w_del and is flagged
    'unobservable'; such deletions never create a departure on their own because the remaining steps decide.
  params: {}
  min_duration_s: null
  outputs: [unobservable flags on the path]
  confidence: contract
  noise_notes: Under-rim occlusion (Floppy) and baseline occlusion (Flex) are the main cases.
  conflicts_resolved: []
  sources: []
  status: proposal
  detector: null
  implemented_by: align_frame (penalty), match_template (unobservable deletions)

