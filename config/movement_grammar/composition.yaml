  - {url: https://vuir.vu.edu.au/48805/, supports: HoopTransformer self-supervised pretraining; 81.5 % / 97.5 %}
  - {url: https://dspace.mit.edu/handle/1721.1/100664, supports: Kates 2014 sliding-block SVM, 6 plays + other, 72.6 %}
