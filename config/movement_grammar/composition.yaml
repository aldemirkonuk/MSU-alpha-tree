    prediction + reconstruction), mirror augmentation always on, fine-tuned on template pseudo-labels with P >=
    0.9 (weight 0.3) and coach labels (weight 1.0), split by game. Fusion log P = a log P_template + b log P_nn +
    c; a confirmed template with C_hat <= 0.3 overrides. Enabled only with >= 3 percentage points top-1 gain on
    held-out games and ECE <= 0.05 after fusion (R-ST-13). Camera cuts: mask missing agents, no imputation beyond
    0.5 s.
  params:
