# --------------------------------------------------------------------------------------------------------------
# Starter template library (template_format). Step kinds: lattice event kinds (PASS, DHO, DRIVE, CUT, SCR.on,
# SCR.down/back/flare/cross, ROLL, POP, SLIP) or set-component kinds (lowercase). roles map event actor keys to
# template role variables (never player ids, R-ST-12). window_s is relative to the previous matched step in the
# same lane (a new lane is anchored at the set t0). Boxes are in mirror-signed coordinates (x x sign).
# Sources are the repo taxonomy rows each template converts; all timings are [HEURISTIC] (motion_starts 0.3).
# --------------------------------------------------------------------------------------------------------------
templates:
- id: horns_pnr
  name: Horns PnR
  namespace: gen.
  family_code: OFF.F3.2
  status: documented
  mirror: asymmetric
  alignments: [horns, horns_stack]
  align_slots: {handler: top, s1: elbow}
  source: docs/taxonomy/offense_full.md F3.2 'Horns PnR / PnP' (Horns snapshot, then a ball screen by an elbow player <= 3 s; roll/pop split)
  steps:
  - {id: ball_screen, kind: SCR.on, roles: {screener: s1, user: handler}, weight: required, window_s: [0.0, 3.0], region: {role: s1, box: {r: [5.0, 9.5]}}}
  - {id: read, kind: [ROLL, POP], roles: {screener: s1}, weight: required, window_s: [0.0, 0.5], counters: [{kind: SLIP, code: slip, cost: 0.3}]}
- id: horns_twist
  name: Horns Twist
  namespace: gen.
  family_code: OFF.F3.2
  status: documented
  mirror: asymmetric
  alignments: [horns, horns_stack]
  align_slots: {handler: top, s1: elbow, s2: elbow}
  source: docs/taxonomy/offense_full.md F3.2 'Horns Twist' (two ball screens from opposite directions on the same handler <= 2 s apart)
  steps:
  - {id: screen_1, kind: SCR.on, roles: {screener: s1, user: handler}, weight: required, window_s: [0.0, 3.0]}
  - {id: screen_2, kind: SCR.on, roles: {screener: s2, user: handler}, weight: required, window_s: [0.3, 2.5]}
  - {id: roll_1, kind: [ROLL, POP], roles: {screener: s1}, weight: optional, lane: s1_read, window_s: [0.0, 0.5]}
- id: horns_elbow_chase
  name: Horns Elbow Chase
  namespace: gen.
  family_code: OFF.F3.2
  status: documented
  mirror: symmetric
  alignments: [horns, horns_stack]
  align_slots: {handler: top, big: elbow}
  source: docs/taxonomy/offense_full.md F3.2 'Horns Elbow Chase' (pass top -> elbow, then a DHO elbow -> original passer <= 2 s)
  steps:
  - {id: elbow_entry, kind: PASS, roles: {passer: handler, receiver: big}, weight: required, window_s: [0.0, 3.0], region: {role: big, box: {x: [-2.9, 2.9], y: [3.0, 5.6]}}}
  - {id: chase_dho, kind: DHO, roles: {giver: big, receiver: handler}, weight: required, window_s: [0.0, 2.0]}
- id: one_four_high_pnr
  name: 1-4 High PnR
  namespace: gen.
  family_code: OFF.F3.1
  status: documented
  mirror: asymmetric
  alignments: [one_four_high]
  align_slots: {handler: top, s1: elbow}
  source: docs/taxonomy/offense_full.md F3.1 '1-4 High' + docs/taxonomy/motion_starts.md O15 '4-Up (1-4 elbow get-and-roll)'
  steps:
  - {id: ball_screen, kind: SCR.on, roles: {screener: s1, user: handler}, weight: required, window_s: [0.0, 3.0], region: {role: s1, box: {r: [5.0, 9.5]}}}
  - {id: read, kind: [ROLL, POP], roles: {screener: s1}, weight: optional, window_s: [0.0, 0.5]}
- id: iverson
  name: Iverson
  namespace: gen.
  family_code: OFF.F8.2
  status: documented
  mirror: asymmetric
  alignments: [one_four_high, horns, box]
  source: docs/taxonomy/offense_full.md F3.1 'Iverson start (4-high)' and F8.2 'Iverson'; motion_starts O05
  steps:
  - {id: iverson_cut, kind: iverson, roles: {cutter: c, screener: s1}, weight: required}
  - {id: catch, kind: PASS, roles: {receiver: c}, weight: optional, window_s: [0.0, 2.5]}
  - {id: step_up, kind: SCR.on, roles: {screener: s1}, weight: optional, lane: big, window_s: [0.0, 3.5]}
- id: floppy
  name: Floppy
  namespace: gen.
  family_code: OFF.F3.1
  status: documented
  mirror: symmetric
  alignments: [floppy]
  source: docs/taxonomy/offense_full.md F3.1 'Floppy' (shooters under the rim; one side single, one side stagger)
  steps:
  - {id: exit, kind: floppy, roles: {shooter: sh, screener: s1}, weight: required}
  - {id: catch, kind: PASS, roles: {receiver: sh}, weight: optional, window_s: [0.0, 2.5]}
- id: spain_pnr
  name: Spain PnR
  namespace: gen.
  family_code: OFF.F5.7
  status: documented
  mirror: asymmetric
  alignments: any
  source: docs/taxonomy/offense_full.md F5.7 'Spain' (back screen on the roller's defender, then the back-screener pops)
  steps:
  - {id: spain, kind: spain, roles: {handler: handler, screener: s1, back_screener: s2}, weight: required}
  - {id: kick, kind: PASS, roles: {receiver: s2}, weight: optional, window_s: [0.0, 3.0]}
- id: ucla
  name: UCLA
  namespace: gen.
  family_code: OFF.F4.1
  status: documented
  mirror: asymmetric
  alignments: [two_three_high, two_one_two, one_four_high]
  source: docs/taxonomy/offense_full.md F4.1 'UCLA high-post' (guard -> wing pass, passer cuts off a high-post screen to the block)
  steps:
  - {id: ucla_cut, kind: ucla, roles: {cutter: c, screener: post, receiver: w}, weight: required}
  - {id: feed, kind: PASS, roles: {passer: w, receiver: c}, weight: optional, window_s: [0.0, 2.0]}
- id: flex
  name: Flex
  namespace: gen.
  family_code: OFF.F4.1
  status: documented
  mirror: asymmetric
  alignments: any
  repeat: {block: [flex_cycle], min: 1, max: 6}
  source: docs/taxonomy/offense_full.md F4.1 'Flex' (flex cut, then a down screen on the flex screener; >= 2 repetitions = continuity)
  steps:
  - {id: flex_cycle, kind: flex, roles: {cutter: f, screener: b, sts_screener: d}, weight: required}
  - {id: catch, kind: PASS, roles: {receiver: f}, weight: optional, window_s: [0.0, 2.0]}
- id: zipper
  name: Zipper
  namespace: gen.
  family_code: OFF.F8.2
  status: documented
  mirror: asymmetric
  alignments: any
  source: docs/taxonomy/offense_full.md F3.1 'Zipper start' and F8.2 'Zipper'
  steps:
  - {id: zip, kind: zipper, roles: {cutter: z, screener: s}, weight: required}
  - {id: catch, kind: PASS, roles: {receiver: z}, weight: optional, window_s: [0.0, 2.0]}
- id: zipper_middle_pnr
  name: Zipper middle PnR
  namespace: gen.
  family_code: OFF.F5.7
  status: documented
  mirror: asymmetric
  alignments: any
  source: docs/taxonomy/offense_full.md F5.7 'Zipper -> middle ball screen' (ball screen by the down-screener or the zipper cutter <= 1.5 s after the cut)
  steps:
  - {id: zip, kind: zipper, roles: {cutter: z, screener: s}, weight: required}
  - {id: catch, kind: PASS, roles: {receiver: z}, weight: optional, window_s: [0.0, 2.0]}
  - {id: middle_screen, kind: SCR.on, roles: {screener: s}, roles_alt: [{screener: z}], weight: required, lane: screen, window_s: [0.0, 3.0]}
- id: ram_pnr
  name: Ram PnR
  namespace: gen.
  family_code: OFF.F5.3
  status: documented
  mirror: asymmetric
  alignments: any
  source: docs/taxonomy/offense_full.md F5.3 'Ram' and A2.3 'Ram PnR' (screen for the screener, then the ball screen)
  steps:
  - {id: ram, kind: ram, roles: {ram_screener: r, big: s, handler: handler}, weight: required}
  - {id: read, kind: [ROLL, POP], roles: {screener: s}, weight: optional, window_s: [0.0, 3.0]}
- id: elevator
  name: Elevator
  namespace: gen.
  family_code: OFF.F8.1
  status: documented
  mirror: symmetric
  alignments: any
  source: docs/taxonomy/offense_full.md F3.1 'Elevator start' and A11.18 (canonical elevator primitive)
  steps:
  - {id: gate, kind: elevator, roles: {user: u, screener_1: s1, screener_2: s2}, weight: required}
  - {id: catch, kind: PASS, roles: {receiver: u}, weight: optional, window_s: [-0.5, 1.5]}
- id: stagger
  name: Stagger
  namespace: gen.
  family_code: OFF.F8.1
  status: documented
  mirror: asymmetric
  alignments: any
  source: docs/taxonomy/motion_starts.md section 0.3 STAGGER and V01; offense_full F8.1 'Stagger'
  steps:
  - {id: stagger, kind: stagger, roles: {user: u, screener_1: s1, screener_2: s2}, weight: required}
  - {id: catch, kind: PASS, roles: {receiver: u}, weight: optional, window_s: [0.0, 2.5]}
- id: chicago
  name: Chicago
  namespace: gen.
  family_code: OFF.F6
  status: documented
  mirror: asymmetric
  alignments: any
  source: docs/taxonomy/offense_full.md F6 'Zoom / Chicago' (pin-down into an immediate DHO)
  steps:
  - {id: pin_dho, kind: chicago, roles: {user: u, screener: s, giver: g}, weight: required}
  - {id: attack, kind: [DRIVE, SCR.on], roles: {}, weight: optional, window_s: [0.0, 3.0]}
- id: hammer
  name: Hammer
  namespace: gen.
  family_code: OFF.F8.1
  status: documented
  mirror: asymmetric
  alignments: any
  source: docs/taxonomy/offense_full.md F8.1 'Hammer' (baseline drive + weak-side flare toward the corner)
  steps:
  - {id: hammer, kind: hammer, roles: {driver: h, shooter: u, screener: s}, weight: required}
  - {id: thrown, kind: PASS, roles: {passer: h, receiver: u}, weight: optional, window_s: [0.0, 1.5]}

# --------------------------------------------------------------------------------------------------------------
# Items
# --------------------------------------------------------------------------------------------------------------
items:
- id: event_lattice
  research_id: CE-R03
  level: rule
  name: Event lattice (input contract) with proxy primitives and cold start
  aliases: [lattice, action lattice]
  actors: per event (screener/user, passer/receiver, giver/receiver, cutter, handler)
  t0: each event's t_ref (time_base)
  rule: >-
    One lattice per set window: mvlib.Event objects with kind (PASS, DHO, DRIVE, CUT, SCR.on, SCR.down, SCR.back,
    SCR.flare, SCR.cross, ROLL, POP, SLIP, or a set-component kind), actors, t0 = t_ref, start, end, conf = p in
    [0, 1] and attrs (evidence class strict | loose | proxy | proposal, positions, sigma_t_ref_s). Events with
    p < p_min_keep are dropped and logged to the unmatched stream. Upstream family detectors replace the proxies
    when passed to build_lattice(events=...); both screen evidence levels (strict, loose) are kept as separate
    likelihoods (R-ST-17); the matcher takes at most one of two alternatives over the same span.
    Proxy primitives (used until the screens, cuts and ball-action families are wired; status proposal):
    holder runs from a sticky holder (mvlib nearest attacker within HOLD_R, but the current holder keeps the ball
    unless another attacker is nearer by >= hold_switch_margin_m; a NEW holder run cannot start while the CA-RTS
    ball velocity relative to that player exceeds catch_max_ball_mps, so a ball in flight past a cutter or a
    roller under the rim is not caught; gaps <= hold_bridge_frames bridged, runs < hold_min_frames dropped);
    DHO = holder change (ball at the catch >= dho_min_r_m from the rim, loop 4 L10) with a minimum giver-receiver gap <= dho_max_gap_m within +-dho_gap_window_s of the
    transfer and air time <= dho_max_air_s, or <= dho_max_air_short_travel_s when the ball travelled <
    pass_min_flight_m (holder flicker at high noise); conf x p_below(air_s, dho_max_air_short_travel_s,
    dho_air_sigma_s); PASS = holder change with
    ball travel >= pass_min_flight_m (skip if it crosses x = 0 with |dx| > skip_min_dx_m); loose screen = a
    teammate passes within scr_contact_m of a player who is set (window mean of P(set) >= scr_stat_frac over a
    window of length scr_stat_pre_s + scr_stat_post_s ending between t - scr_set_lookback_s + scr_stat_post_s and t +
    scr_stat_post_s + scr_set_lookahead_s (loop 4 L8); P(set) = max(P(stationary), P(speed < scr_set_max_mps)), loop 4 L6) while moving >= scr_user_min_mps and displacing >=
    scr_user_min_disp_m over +-scr_dir_half_s, t_ref = minimum distance (t_ref_proxy), on-ball when the user holds
    the ball within +-on_ball_frames (loop 5 C2: holder with hysteresis, the run extended over holder-less frames with
    the ball within HOLD_R + on_ball_hold_ext_k x sigma_dist; a ball-screen contact may also come from the widened
    gate scr_contact_m + scr_on_contact_k x sigma_dist when the handler's defender meets the screener within
    scr_on_wide_def_m, and its contact probability uses scr_on_pc_k x sigma_dist; loop 6 C2: the handler's defender is
    the sustained matchup - the defense family's matchup over [t - scr_on_def_match_s, t] when detect_all gets one,
    else the lowest mean distance over [t - scr_on_def_match_s, t - scr_on_def_match_end_s], counted only when his
    mean distance over the last scr_on_def_lookback_s is <= scr_on_def_max_m), with the screener at r >= scr_on_min_r_m and y <= HALF_Y + scr_on_max_past_half_m (loop 4 L7: otherwise dropped), else cross (|dx| > cross_dx_ratio |dy|, screener y < cross_max_y_m), flare
    (geometry, not the ball angle: the user's mean heading over [t - flare_pre_s, t] vs [t, t + scr_dir_half_s]
    turns >= flare_min_turn_deg and he leaves toward the outside, |x| increasing, with |v_x| >= |v_y|), down
    (dy > 0) or back; per-frame P(stationary) = logistic of s2 with width stat_logistic_width; CUT = off-ball move (speed hysteresis enter > move_enter_mps, stay > move_stay_mps, >=
    move_min_s) with displacement >= cut_min_disp_m; DRIVE = holder run from r > drive_start_r_m to r <
    drive_end_r_m, onset backtracked while v_r > drive_backtrack_vr_mps (baseline if y <= drive_baseline_y_m at rim
    arrival); ROLL = screener reaches r <=
    roll_end_r_m within roll_window_s with dr <= -roll_min_dr_m; POP = within pop_window_s the screener stays at r
    >= pop_min_r_inside_m, ends at r >= pop_end_r_m with dr >= 0, and the screener himself moves >= pop_min_away_m
    while his distance to the handler grows (motion_starts 0.3: a screener who only holds is neither). Cold start (missing item): an upstream event without calibrated p takes cold_start_p of
    its evidence class until >= 500 labelled primitives allow recalibration (R-ST-01).
  params:
    s2_stationary: {value: 5.99, unit: chi2 (2 dof)}
    hold_switch_margin_m: {value: 0.3, unit: m}
    hold_bridge_frames: {value: 3, unit: frames}
    hold_min_frames: {value: 8, unit: frames}
    dho_max_air_s: {value: 0.3, unit: s}
    dho_max_gap_m: {value: 1.5, unit: m}
    dho_gap_window_s: {value: 0.3, unit: s}
    pass_min_flight_m: {value: 1.0, unit: m}
    skip_min_dx_m: {value: 8.0, unit: m}
    p_dho: {value: 0.85, unit: probability}
    p_pass: {value: 0.95, unit: probability}
    move_enter_mps: {value: 2.0, unit: m/s}
    move_stay_mps: {value: 1.0, unit: m/s}
    move_min_s: {value: 0.3, unit: s}
    move_bridge_frames: {value: 3, unit: frames}
    cut_min_disp_m: {value: 3.0, unit: m}
    basket_cut_end_r_m: {value: 2.0, unit: m}
    p_cut: {value: 0.9, unit: probability}
    scr_contact_m: {value: 1.2, unit: m}
    scr_stat_pre_s: {value: 0.4, unit: s}
    scr_stat_post_s: {value: 0.1, unit: s}
    scr_stat_frac: {value: 0.6, unit: fraction}
    scr_set_max_mps: {value: 1.0, unit: 'm/s (loop 4 L6: physical set bound; per-frame P(set) = max(P(stationary), P(speed < bound)))'}
    scr_set_lookback_s: {value: 0.8, unit: 's (loop 4 L6: the set window may end up to this long before the minimum distance)'}
    scr_set_lookahead_s: {value: 0.4, unit: 's (loop 4 L8: the set window may also end up to this long after t + scr_stat_post_s; the screen acts on the trailing defender)'}
    scr_on_min_r_m: {value: 4.0, unit: 'm (loop 4 L7: an on-ball screen needs the screener at least this far from the rim; inside is a shot / rebound scrum)'}
    scr_on_max_past_half_m: {value: 1.0, unit: 'm (loop 4 L7: an on-ball screen needs the screener at most this far past the half-court line; beyond is backcourt bring-up / inbound traffic)'}
    scr_on_contact_k: {value: 2.0, unit: 'x sigma_dist (loop 5 C2: a ball-screen contact may also come from the widened gate scr_contact_m + this x sigma_dist; off-ball screens keep scr_contact_m)'}
    scr_on_wide_def_m: {value: 1.2, unit: 'm (loop 5 C2: a widened ball-screen contact needs the handler''s defender within this distance of the screener)'}
    scr_on_def_lookback_s: {value: 1.0, unit: 's (loop 5 C2: the handler''s defender = smallest mean distance to him over this window before t)'}
    scr_on_def_after_s: {value: 0.7, unit: 's (loop 5 C2: the defender-screener meeting may come up to this long after t; the defender trails the handler)'}
    scr_on_def_match_s: {value: 3.0, unit: 's (loop 6 C2: the handler''s defender = sustained matchup, lowest mean distance to him over [t - this, t - scr_on_def_match_end_s], or the defense family''s matchup over [t - this, t] when passed in)'}
    scr_on_def_match_end_s: {value: 0.5, unit: 's (loop 6 C2: the sustained-matchup window ends this long before the screen moment, before a hedging screener-defender steps toward the handler)'}
    scr_on_def_max_m: {value: 2.4, unit: 'm (loop 6 C2: the sustained-matchup defender counts only when his mean distance to the handler over the last scr_on_def_lookback_s is <= this; the loop-5 2 x scr_contact_m cap)'}
    scr_on_pc_k: {value: 2.0, unit: 'x sigma_dist (loop 5 C2: sigma of the ball-screen contact probability p_below(d, scr_contact_m, .))'}
    on_ball_hold_ext_k: {value: 2.5, unit: 'x sigma_dist(holder, ball) (loop 5 C2: on-ball test uses the holder with hysteresis, iso.hold_ext_k rule)'}
    scr_user_min_mps: {value: 1.0, unit: m/s}
    scr_user_min_disp_m: {value: 1.0, unit: m}
    p_screen_loose: {value: 0.9, unit: probability}
    drive_start_r_m: {value: 6.1, unit: m}
    drive_end_r_m: {value: 3.05, unit: m}
    drive_baseline_y_m: {value: 2.0, unit: m}
    p_drive: {value: 0.9, unit: probability}
    roll_window_s: {value: 2.0, unit: s}
    roll_end_r_m: {value: 2.5, unit: m}
    roll_min_dr_m: {value: 2.0, unit: m}
    pop_window_s: {value: 1.5, unit: s}
    pop_min_r_inside_m: {value: 5.5, unit: m}
    pop_end_r_m: {value: 6.75, unit: m}
    pop_min_away_m: {value: 1.5, unit: m}
    p_min_keep: {value: 0.2, unit: probability}
    cold_start_p: {value: {strict: 0.8, loose: 0.6, proxy: 0.6, proposal: 0.5}, unit: probability per evidence class}
    stat_logistic_width: {value: 1.5, unit: chi2 units (logistic width of per-frame P(stationary))}
    scr_dir_half_s: {value: 0.5, unit: s (user displacement / velocity window +- around the screen moment)}
    on_ball_frames: {value: 3, unit: frames (+- window for on-ball holder and user-speed tests)}
    contact_bridge_frames: {value: 2, unit: frames (gaps bridged inside one contact interval)}
    cross_dx_ratio: {value: 2.0, unit: ratio (|dx| > ratio x |dy| = lateral)}
    cross_max_y_m: {value: 3.0, unit: m (cross screens are set below this y)}
    flare_min_turn_deg: {value: 45.0, unit: deg}
    flare_pre_s: {value: 1.0, unit: s (approach window for the flare heading)}
    drive_backtrack_vr_mps: {value: 1.0, unit: m/s}
    catch_max_ball_mps: {value: 6.0, unit: m/s (ball speed relative to the new holder)}
    hold_cert_frames: {value: 5, unit: frames}
    dho_max_air_short_travel_s: {value: 0.6, unit: s}
    dho_air_sigma_s: {value: 0.15, unit: s}
    dho_gap_noise_k: {value: 3.0, unit: sigma_dist (short-travel transfers only)}
    dho_min_r_m: {value: 4.0, unit: 'm (loop 4 L10: no DHO when the ball is this close to the rim at the catch; tip / rebound scrum)'}
  min_duration_s: null
  outputs: [lattice events (kind, actors, t0, start, end, conf, attrs), dropped-event log]
  confidence: proxy conf = window_conf of the defining per-frame condition x p_<kind> x edge x gap; upstream conf passes through (cold_start_p when missing)
  noise_notes: Holder flicker at release / catch is bridged (3 frames). At sigma_p 0.3 m a standing player's CA-RTS speed reads 0.4-1.1 m/s; screens therefore test s2, not speed. Pair distances near 1.2 m carry sigma_dist about 0.25 m, so contact enters through p_below, not a hard gate alone.
  conflicts_resolved:
  - Screen rule (R-ST-02 0.5 m/s / 0.3 s / 1.0 m; SCREEN_loose < 0.6 m/s / 0.3 s / 1.2 m; strict <= 0.3 m/s / 0.5 s / 1.2 m) - the engine consumes strict and loose as two evidence levels; the proxy implements the loose level with the s2 stationarity test.
