- id: time_base
  research_id: CE-R04
  level: rule
  name: Time base and t0 hierarchy
  aliases: [t_ref, t0]
  actors: n/a
  t0: SCR screen moment; PASS release; DHO transfer; CUT onset; DRIVE first frame of the dribble with r decreasing from > 6.1 m; ROLL / POP / SLIP the parent screen moment; POST seal start; set t0 = t_ref of the first matched template step
  rule: >-
    Frame clock f at 29.97 fps, t = f x 1001/30000 s; windows in seconds are converted with round(s x 29.97)
    (0.33 s = 10 f, 0.5 s = 15 f, 1.0 s = 30 f, 1.5 s = 45 f, 2.0 s = 60 f). Set t0 = t_ref of the first matched
    template step (motion_starts 0.3); ALIGN t_snap is stored separately. When the screened defender is unknown the
    screen moment is the minimum screener-user distance with flag t_ref_proxy; its sigma_t_ref (default
    matcher.sigma_t_ref_default_s 0.1 s, 0.2-0.3 s when the defender sticks close) enters the matcher timing sigma.
  params: {}  # sigma_t_ref_default_s lives in matcher (single source, loop 1 F12)
  min_duration_s: null
  outputs: [t_ref_f, t_ref_s, t_ref_proxy flag]
  confidence: contract
  noise_notes: The minimum-distance screen moment is flat when the defender sticks close; propagate sigma_t_ref.
  conflicts_resolved:
  - t0 definition (motion_starts 0.3 first action vs set_taxonomy half-court + 1-2 s) - first matched step; ALIGN t_snap kept separately.
  sources:
  - {url: docs/taxonomy/motion_starts.md, supports: 't0 = the first action named in the sequence'}
  status: canonical
  detector: null
  implemented_by: mvlib.DT, mvlib.frames, match_template (t0)

- id: mirror
  research_id: CE-R05
  level: rule
  name: Mirror canonicalisation
  aliases: [left/right, strong/weak side]
  actors: n/a
  t0: set t0
  rule: >-
    Every template is scored twice, with event positions as is (sign +1) and mirrored (x -> -x, sign -1); mirrored
    = the cheaper. side_ambiguous = |C(+) - C(-)| < ambiguous_cost. Canonical storage uses strong / weak side:
    strong = the side of x_ball at set t0 (dead band |x_ball| < dead_band_m, then the side of the first pass receiver,
    screen or cut). Display names render left / right from the raw sign. Learned models train with x -> -x
    augmentation always on. Corner, wing and pnr_location tests call the named_spots 0.3.2 labels, never an angle.
  params:
    ambiguous_cost: {value: 0.5, unit: cost}
    dead_band_m: {value: 0.9, unit: m (|x_ball| below this = no side; used by every ball-side and reversal test)}
  min_duration_s: null
  outputs: [mirrored, strong_side_sign, side_ambiguous]
  confidence: contract
  noise_notes: With the ball near x = 0 (top PnR) the side flips on noise; scoring both mirrors avoids a hard decision.
  conflicts_resolved:
  - Corner angle (theta <= 12 vs <= 15 deg) - named_spots corner labels are used instead of either angle.
  sources:
  - {url: https://vision.fe.uni-lj.si/docs/matejp/CVIU_perse_2008.pdf, supports: 34 templates = 17 plays x left / right versions}
  status: canonical
  detector: null
  implemented_by: score_templates (both signs), storage_row (strong_side_sign)

- id: align_snapshot
  research_id: CE-R06
  level: set_component
  name: ALIGN snapshot (role-free Hungarian, mirror-aware, probabilistic, accept flag)
  aliases: [ALIGN, alignment, formation snapshot]
  actors: five attackers bound to template slots (slot -> player)
  t0: t_snap = the earliest scan frame whose best error is within snap_tie_m of the scan minimum
  rule: >-
    Frontcourt: ball y <= HALF_Y for frontcourt_hold_frames consecutive frames. Trigger: the first frame after it
    where the ball is in named_spots alignment_snap_zone and the holder's CA-RTS speed is < trigger_enter_mps for
    >= trigger_hold_frames (stay <= trigger_exit_mps). Fallbacks in order: release of the first PASS after the
    crossing; crossing + fallback_after_cross_s. Scan [trigger - scan_pre_s, trigger + scan_post_s] every
    scan_stride_frames frames. Per frame and per alignment (asymmetric ones in both mirrors) solve the 5 x 5
    assignment exactly (all 120 permutations, cost sum of squared distances, Cartesian metres; the repo text says
    (r, theta), the change to Cartesian is deliberate so errors are in metres); err = mean slot distance; an
    occluded attacker costs missing_slot_penalty_m for his slot. Probabilities are ALWAYS emitted: log L_A =
    -sum d_j^2 / (2 slot_sigma_m^2) (best mirror), softmax with a 'free' class log L = -5 accept_err_m^2 / 2; top-3
    stored. accepted (used only for the display name and the matcher's alignment term) = err <= accept_err_m and
    runner-up err - err >= accept_margin_m and the best code is the same on >= stable_frames consecutive evaluated
    frames (5 x stride 3 = 12 frames = 0.40 s). Near-ties stay in the top-3 with accepted = false.
  params:
    frontcourt_hold_frames: {value: 10, unit: frames}
    trigger_enter_mps: {value: 2.0, unit: m/s}
    trigger_exit_mps: {value: 2.5, unit: m/s}
    trigger_hold_frames: {value: 10, unit: frames}
    fallback_after_cross_s: {value: 2.0, unit: s}
    scan_pre_s: {value: 0.5, unit: s}
    scan_post_s: {value: 1.0, unit: s}
    scan_stride_frames: {value: 3, unit: frames}
    snap_tie_m: {value: 0.1, unit: m}
    accept_err_m: {value: 1.8, unit: m}
    accept_margin_m: {value: 0.4, unit: m}
    stable_frames: {value: 5, unit: evaluated frames}
    slot_sigma_m: {value: 1.0, unit: m}
    missing_slot_penalty_m: {value: 1.5, unit: m}
  min_duration_s: 0.33
  outputs: [code, display, probs_top3, err_m, margin_m, accepted, mirrored, stable_frames, trigger, slot -> player actors]
  confidence: conf = P(top-1 code) from the softmax x edge x gap (worst attacker)
  noise_notes: sigma_p 0.2-0.5 m adds about 0.3-0.4 m to the mean error, inside the 1.8 m accept. The scan plus the stability requirement stops mid-cut snapshots. 4 of 5 visible attackers -> penalty slot.
  conflicts_resolved:
  - ALIGN timing (set_taxonomy half court + 1-2 s vs R-ST-19 handler < 2 m/s with ball y < 9 m) - R-ST-19 with the named_spots alignment_snap_zone; crossing + 2.0 s only as the last fallback.
  - Accept rule (offense 3.1 header +-1.5 m vs mean < 1.8 m and margin > 0.4 m) - 1.8 / 0.4 is the accept rule; +-1.5 m read as per-slot guidance (slot sigma 1.0 m).
  - Margin vs near-ties (skeptic CE-R06) - probabilities always emitted; accepted is a separate display flag.
  sources:
  - {url: https://arxiv.org/pdf/1710.02255, supports: permutation alignment of agents to a template by Hungarian assignment on Euclidean cost}
  - {url: https://openaccess.thecvf.com/content_cvpr_2013/papers/Lucey_Representing_and_Discovering_2013_CVPR_paper.pdf, supports: role-based (not identity) representation is compact and robust to noisy detections}
  - {url: https://www.cs.toronto.edu/~zemel/documents/1536-Classifying-NBA-Offensive-Plays-Using-Neural-Networks.pdf, supports: Horns is spotted from its set-up while other plays disambiguate late}
  - {url: docs/taxonomy/offense_full.md, supports: section 3.1 alignment templates and the 1.8 m / 0.4 m accept rule}
  status: proposal
  detector: detect_align_snapshot

- id: role_binding
  research_id: CE-R07
  level: rule
  name: Role binding by unification (roster-free), with one tracker-swap rebind
  aliases: [player casting, unification]
  actors: template roles (handler, s1, s2, c, u, ...)
  t0: bound at the first step that mentions the role
  rule: >-
    Template roles are variables bound to offensive track ids step by step; a step binds its unbound roles to the
    event's actors and requires already-bound roles to match. Distinct roles must be distinct players unless the
    template lists them in equal_roles. The ALIGN slots are a soft prior: matcher.binding_disagree_cost per role
    whose player is not in the template's align_slots group. Position-class priors (roster height) may add at most
    0.2 per role, never a hard constraint (R-ST-12). Player ids never appear in a template. Re-binding inside a set
    only through a declared exchange step, or once when the tracker reports an id swap of the two players
    (t_f, a, b[, window_s]) whose ambiguity window is <= swap_window_s (cost swap_rebind_cost; needs the tracker's
    swap flags, missing item 'id-swap'). The binding search is the matcher's beam, not an enumeration of 5!
    bindings.
  params:
    swap_window_s: {value: 1.0, unit: s}
    swap_rebind_cost: {value: 0.5, unit: cost}
  min_duration_s: null
  outputs: ['role_binding {role: player_track_id}', binding_cost]
  confidence: contract
  noise_notes: An id swap mid-set breaks unification; the swap rebind needs tracker flags (not in the XY scene).
  conflicts_resolved: []
  sources:
  - {url: https://vision.fe.uni-lj.si/docs/matejp/CVIU_perse_2008.pdf, supports: player casting to template roles before the Levenshtein cost}
  status: proposal
  detector: null
  implemented_by: match_template (unification, equal_roles), _align_cost (slot prior)

- id: template_format
  research_id: CE-R08
  level: rule
  name: Template format (timed role grammar with lanes)
  aliases: [template DSL]
  actors: template roles
  t0: the first matched step
  rule: >-
    A template has id, name, namespace (R-ST-22), family_code, status {documented, confirmed, retired} (R-ST-11),
    mirror, alignments (codes or any), align_slots, equal_roles, repeat (continuity), source, and ordered steps.
    A step has id, kind (one kind or a list = free alternatives), roles {actor key: role}, roles_alt (alternative
    role maps tried in order, e.g. a screen 'by s or by z'), weight (required =
    w_required, optional = w_optional), window_s [lo, hi] relative to the previous matched step of the same lane
    (default matcher.default_window_s; a lane's first step is anchored at the set t0), region {role, box {x, y, r}} in
    mirror-signed coordinates, group (parallel group: steps of one group match in any order with t_ref within
    matcher.parallel_tol_s), counters [{kind, code, cost <= 0.5}]. Lanes (missing item 'concurrent actions'): steps with
    different lane names run in parallel with independent timing, so weak-side and ball-side actions may overlap
    by more than 0.75 s. Every timing window is [HEURISTIC] (no source gives seconds) and is refit per team
    (team_priors). Starter library: the 16 templates under 'templates' in this file.
  params: {}  # default_window_s and parallel_tol_s live in matcher (single source, loop 1 F12)
  min_duration_s: null
  outputs: [template_version (file hash), template rows]
  confidence: contract; windows low until fitted
  noise_notes: Over-tight windows from coaching diagrams are the main risk; the Gaussian timing penalty gives partial credit outside them.
  conflicts_resolved:
  - Set signatures (R-ST-21 motion_starts canonical) vs offense A11.18 canonical primitives - templates reference set-component kinds by id and never restate primitive thresholds.
  sources:
  - {url: docs/taxonomy/offense_full.md, supports: section 0.3 template row format; F3-F8 rows converted into the starter library}
  status: proposal
  detector: null
  implemented_by: TEMPLATES (this file), match_template

- id: matcher
  research_id: CE-R09
  level: rule
  name: Matcher - role-bound timed weighted edit distance (beam search over the lattice)
  aliases: [template matcher, edit distance]
  actors: bound template roles
  t0: t_ref of the event matched to the first matched step
  rule: >-
    For template T, mirror sign and binding over lattice events in t_ref order:
    C = C_align + C_bind + sum_matched [min(-ln p, neglogp_cap) + 2 S + 0.5 (dt_out / sigma_t)^2 + 0.5 (d_sp / sigma_s)^2]
    + sum_deleted w_del + C_ins.
    dt_out = max(0, lo - dt, dt - hi), sigma_t = sqrt(sigma_t_s^2 + sigma_t_ref^2); d_sp = distance (m) of the
    region role's position at t_ref to the step box (0 inside), sigma_s = sqrt(sigma_s_m^2 + sigma_track^2) with
    sigma_track = K_CAL sqrt(var_p). A listed counter replaces 2 S by its cost. w_del = w_required or w_optional,
    times unobservable_factor when the bound actor has no usable track in the step window (4-of-5 visible, camera
    cut; missing item 'occlusion'). Insertions (fixed): only lattice events with t_ref inside [first matched t_ref,
    last matched t_end], not explained by a matched event (a component whose span overlaps and whose actors include the event's, an alternative component sharing >= 2 actors, or the screener's own CUT during a matched ROLL / POP), weighted w_ins_ball
    (PASS, DHO, DRIVE, SCR.on involving a bound role), w_ins_bound_offball (other events of bound roles),
    w_ins_spacer (events of unbound players); C_ins capped at ins_cap_frac x W. C_align = -ln P(alignment in
    T.alignments) from the ALIGN softmax, capped at c_align_cap; c_align_missing when no snapshot exists; 0 for
    alignments: any. W = sum of step weights; C_hat = C / W is the ONLY normalisation (ranking and acceptance).
    Search: beam search over steps (keep the beam best hypotheses), each step either deleted or matched to an
    unused event that unifies and falls within 3 sigma_t of its window. The full path (matched event or deleted,
    with cost parts) is kept. Prefilter (CE-R20 fix, implemented in loop 1): a template none of whose steps can be filled by any
    lattice kind (substitution S < 1 or a listed counter) skips the beam and takes its all-deleted path directly
    (exact: the beam would return the same path and cost).
  params:
    w_required: {value: 2.0, unit: cost}
    w_optional: {value: 0.5, unit: cost}
    w_ins_ball: {value: 1.0, unit: cost}
    w_ins_bound_offball: {value: 0.6, unit: cost}
    w_ins_spacer: {value: 0.1, unit: cost}
    ins_cap_frac: {value: 0.25, unit: fraction of W}
    sigma_t_s: {value: 0.5, unit: s}
    sigma_t_ref_default_s: {value: 0.1, unit: s}
    sigma_s_m: {value: 1.5, unit: m}
    default_window_s: {value: [0.0, 2.5], unit: s}
    parallel_tol_s: {value: 0.75, unit: s}
    neglogp_cap: {value: 3.0, unit: nats}
    beam: {value: 64, unit: hypotheses}
    unobservable_factor: {value: 0.5, unit: factor}
    c_align_missing: {value: 1.0, unit: cost}
    c_align_cap: {value: 3.0, unit: cost}
    binding_disagree_cost: {value: 0.3, unit: cost per role}
  min_duration_s: null
  outputs: [C, C_hat, W, 'path [(step_id, event index | None, cost parts)]', insertions, binding, t0, span, frac_required]
  confidence: contract (scores feed probability)
  noise_notes: Spurious events inside the span cost at most 0.25 W in total; outside the span they cost nothing, so window length does not decide the match (tested). Missed events cost w_del; substitutions give partial credit.
  conflicts_resolved:
  - Skeptic CE-R09 insertion scale - span-limited, role-weighted, capped insertions (chosen among the three proposed fixes and tested on a long synthetic window).
  sources:
  - {url: https://vision.fe.uni-lj.si/docs/matejp/CVIU_perse_2008.pdf, supports: modified Levenshtein between trajectory-generated and template symbol strings; nearest template if below a threshold}
  - {url: https://squared2020.com/2019/09/09/warping-play-registration/, supports: DTW temporal alignment combined with spatial alignment as a play distance}
  status: proposal
  detector: null
  implemented_by: match_template

- id: substitution
  research_id: CE-R10
  level: rule
  name: Substitution similarity matrix S (0 = same, 1 = unrelated)
  aliases: [S matrix]
  actors: n/a
  t0: n/a
  rule: >-
    S(a, b) from 'pairs' (symmetric); a kind that matches the step pattern exactly or as a sub-kind (SCR.down
    matches SCR) costs 0; every other pair 1.0 (not substituted: deletion + insertion is used instead). A listed
    counter at a step replaces 2 S by the counter cost. Re-estimation after >= 300 labelled chances:
    S(a, b) = -ln P(detected b | gold a) / -ln P_min, clipped to [0, 1].
  params:
    pairs:
      value: [[ROLL, SHORT_ROLL, 0.3], [POP, POP_MID, 0.3], [ROLL, SLIP, 0.4], [ROLL, POP, 0.8], [SCR.on, GHOST, 0.4],
              [SCR.on, DHO, 0.5], [DHO, FAKE_DHO, 0.5], [DHO, PASS, 0.6], [SCR.down, SCR.flare, 0.7], [SCR.back, SCR.down, 0.8],
              [stagger, elevator, 0.4], [SCR.back, ucla, 0.3], [CUT, iverson, 0.6], [zipper, CUT, 0.6], [chicago, DHO, 0.5],
              [horns_pnr, one_four_high_pnr, 0.2]]
      unit: S in [0, 1]
  min_duration_s: null
  outputs: [S matrix version]
  confidence: low (initial values); high once re-estimated
  noise_notes: ROLL / SHORT_ROLL / POP are split by r thresholds that noise blurs; low S stops one threshold miss from breaking a set.
  conflicts_resolved: []
  sources: []
  status: proposal
  detector: null
  implemented_by: _subst

- id: probability
  research_id: CE-R11
  level: rule
  name: Probability, NULL class, acceptance floor and calibration
  aliases: [set probability, null class]
  actors: n/a
  t0: evaluated at every lattice update and at window close
  rule: >-
    Candidates are templates (best mirror) with frac_required >= floor_required_frac (>= 75 % of required steps
    matched; with 4 required steps at least 3). Score s_T = -C_hat_T / tau + ln pi(T) + len_prior x
    n_matched_required; s_NULL = -c_null / tau. P = softmax over candidates + NULL; top-5 stored, top-3 shown.
    Accept a set name when C_hat <= c_null AND the floor holds AND P >= p_probable; 'probable' when P <
    p_display; unqualified display when P >= p_display. tau and c_null are refit jointly by NLL on game-split
    validation (R-ST-10), target ECE <= 0.05 on 15 equal-mass bins (R-ST-05); p_display 0.70 is an initial value
    to be re-derived from the calibrated reliability curve. Unconfirmed (documented) templates may name a set but
    are excluded from value and prediction (R-ST-11).
  params:
    tau: {value: 0.15, unit: C_hat units}
    c_null: {value: 0.45, unit: C_hat}
    floor_required_frac: {value: 0.75, unit: fraction}
    len_prior: {value: 0.5, unit: nats per matched required step}
    p_probable: {value: 0.4, unit: probability}
    p_display: {value: 0.7, unit: probability}
  min_duration_s: null
  outputs: [set_code (top-1), match_confidence P, top_k, probable flag, null_prob, accepted]
  confidence: P itself; calibration pending gold (R-ST-05 targets top-1 >= 80 %, top-3 >= 95 % on 300 MSU chances)
  noise_notes: 'c_null 0.45 was set from synthetic sweeps on this scale: clean matches at p 0.6-0.9 give C_hat 0.05-0.30 (the sim Horns PnR at sigma_p 0.3 m: 0.06-0.12); one of four required steps deleted gives 0.30-0.45; the floor rejects two of four deleted whatever C_hat says.'
  conflicts_resolved:
  - Perse threshold 0.6 - not transferred (different distance scale); kept only as provenance.
  sources:
  - {url: https://www.cs.toronto.edu/~zemel/documents/1536-Classifying-NBA-Offensive-Plays-Using-Neural-Networks.pdf, supports: '11 classes; RNN top-1 0.656, top-3 0.806; at threshold 0.7 precision 0.90 / recall 0.59 (their RNN softmax; not transferable to this score)'}
  - {url: https://vision.fe.uni-lj.si/docs/matejp/CVIU_perse_2008.pdf, supports: 'recognition 100 % on 71 operator-corrected segments of 3 offense types, 91.8 % after adding +500 % spurious symbols; average matched distance <= 0.51 vs smallest mismatched average 0.634 (a small test set)'}
  - {url: https://vuir.vu.edu.au/48805/, supports: 'HoopTransformer 81.5 % top-1 / 97.5 % top-3 on 632 SportVU games; class count not stated on the opened page, so not directly comparable'}
  status: proposal
  detector: null
  implemented_by: score_templates

- id: set_match
  research_id: CE-R09/CE-R11
  level: rule
  name: Named set per set window
  aliases: [set call, set recognition]
  actors: role binding of the accepted template
  t0: t_ref of the first matched step
  rule: >-
    For every set window, build the window lattice (events with t0 inside the window, the ALIGN event of the
    first window), score all templates (matcher + probability) and emit one 'set' event per accepted template
    (top-5 considered). attrs carry set_code (namespace + id), P, C_hat, frac_required, mirrored, side_ambiguous,
    probable flag, top_k, null_prob, the alignment path, insertions, counter codes and the departure record.
  params: {}
  min_duration_s: 0.5
  outputs: ['set events: set_code, name, P, c_hat, top_k, path, insertions, counter_codes, departure, status']
  confidence: conf = P(T) x edge x gap (worst bound actor over the matched span)
  noise_notes: Depends on component and primitive calibration; at sigma_p 0.3 m the synthetic Horns PnR is accepted on 20/20 seeds (C_hat 0.06-0.12, P 0.9+), the component sets with P 0.55-0.95.
  conflicts_resolved: []
  sources: []
  status: proposal
  detector: detect_set_match

- id: departure
  research_id: CE-R12
  level: rule
  name: Departure step, counters and broken plays
  aliases: [broken play, counter]
  actors: bound roles of the departed template
  t0: t_ref of the departure step's event, or the end of the last matched step when the departure step was deleted
  rule: >-
    On the path of the best template (most required steps matched, then lowest C_hat), step k is the departure
    step when it is required, is not a listed counter, and is deleted, or costs > step_cost, or is late by >
    late_s; and the mean cost of the steps after k (per required weight) stays > c_null (one detector miss with
    good later steps is not a departure). start_matched_continuation_unknown = the required steps before k are
    all matched, at least prefix_min_steps of them, with mean cost / w_required <= c_null; the name then renders
    '<Set> (start) -> ...'. Counters: a listed counter with cost <= 0.5 sets counter_code and is not a departure;
    canonical codes slip, reject, ghost, re_screen, keep, backdoor_vs_deny, pop_for_roll, curl_vs_straight,
    flare_vs_down, split, snake, retreat. Cause order: switch_induced (SWITCH within [t_k - 1.0, t_k + 0.5] s),
    deny_induced, early_shot, late_clock (shot clock <= 7 s), else 'read'; from XY alone only 'read' is
    assigned (the others need defender matchups, PBP or the shot clock).
  params:
    step_cost: {value: 1.5, unit: cost}
    late_s: {value: 1.0, unit: s}
    prefix_min_steps: {value: 2, unit: steps}
  min_duration_s: null
  outputs: [departure_step, counter_code, departure_cause, start_matched_continuation_unknown]
  confidence: conf = (1 - P(best template)) x edge x gap
  noise_notes: Requiring the remaining steps to stay bad stops a single missed event from creating a departure.
  conflicts_resolved: []
  sources:
  - {url: https://fansided.com/2017/09/08/nylon-calculus-understanding-synergy-play-type-data/, supports: Synergy logs only the final action; counters and departures are not represented}
  status: proposal
  detector: detect_departure

- id: segmentation
  research_id: CE-R13
  level: rule
  name: Multi-set segmentation inside a window (semi-Markov)
  aliases: [segments, phases]
  actors: per segment binding
  t0: the first matched step of the segment's set (time_base), else the t_ref of the segment's first event
  rule: >-
    Candidate boundaries inside a set window: resets (they already split windows) and gaps >= min_gap_s between
    the end of all earlier events and the next event's t_ref. Dynamic programme over candidate boundaries
    minimising sum(segment cost + lambda_seg), segment cost = min(C of the best accepted template, chunk cost of
    the compositional cover). A segment needs >= min_events events or >= min_s. Transition / early segments
    always precede half-court segments. Each segment is one set_instances row (segment_seq).
  params:
    min_gap_s: {value: 1.0, unit: s}
    min_events: {value: 2, unit: events}
    min_s: {value: 1.0, unit: s}
    lambda_seg: {value: 1.0, unit: cost}
  min_duration_s: 1.0
  outputs: [segment_seq, name, set_code, segment_cost]
  confidence: conf = P(segment set) x window conf, or 0.5 x window conf for compositional segments
  noise_notes: lambda_seg penalises over-segmentation when a pause looks like a boundary.
  conflicts_resolved: []
  sources:
  - {url: https://arxiv.org/pdf/1902.08081, supports: several plays may develop and fail within one possession (DeepHoops)}
  status: proposal
  detector: detect_segments

- id: compositional_name
  research_id: CE-R14
  level: rule
  name: Compositional naming (MDL chunk cover, at most 4 tokens)
  aliases: [name grammar, compositional name]
  actors: n/a
  t0: window (or segment) start
  rule: >-
    Lexicon = the set-component kinds (Iverson, Zipper, Chicago, Spain PnR, Elevator, Floppy, Hammer, Pistol,
    Drag, Stagger, Get, DHO chain, UCLA, Flex, Ram) + single-action tokens ('<pnr_location> PnR', 'DHO',
    'down screen', 'back screen', 'flare', 'cross screen', 'drive baseline', 'drive middle', 'skip', 'basket
    cut'). Over events not explained by a matched set, choose chunks greedily by gain (single tokens they replace
    minus their own cost -ln p + chunk_penalty; deterministic tie-break), then name a remaining nameable event
    when -ln p + chunk_penalty < w_uncovered. Render: [situation prefix] + alignment display if ALIGN accepted
    (omitted when the matched set's template lists that alignment; 'Free' when ALIGN is not accepted and no set
    matched; no head in a transition_early window) + ' -> ' + tokens in t_ref order; a screener's own cut during a matched roll / pop is part of the read;
    tokens < join_s apart are joined with ' + ' ball-side first; a matched set renders its name, ' (code
    counter)' and ' [broke at k: cause]'; at most max_tokens tokens after the alignment, extras ' -> (+n)'.
    Spacer actions (relocate, lift, drift, non-basket cuts, ordinary passes, roll / pop reads) are not named but
    stay in action_sequence. A component overlapping a matched component with >= 2 shared actors is an
    alternative reading of the same action (stored, not named). Loop 5 C6 (lead decision): names are
    emitted for half-court set windows only; a transition_early window carries the fixed name 'transition_early'
    (on its set_window and segment events) and gets no name or style event, so names count about one per
    half-court possession (the 'Early: ' prefix is no longer rendered). When no set is accepted, special classes found in the window (motion label,
    '<Motif> xN' continuity, 'ISO' / 'Clear-out ISO') lead the name and primary_name_kind = special_class.
    Same lattice + library version -> same string.
  params:
    chunk_penalty: {value: 0.7, unit: cost per chunk}
    w_uncovered: {value: 1.0, unit: cost}
    join_s: {value: 0.5, unit: s}
    max_tokens: {value: 4, unit: tokens}
  min_duration_s: null
  outputs: [compositional_name, name_tokens, primary_name_kind, storage row]
  confidence: deterministic; conf = P(set) when a set is primary, else 1 - P(top template), times window conf
  noise_notes: When two covers are within 0.3 cost, store the runner-up in alternatives rather than flip.
  conflicts_resolved: []
  sources: []
  status: proposal
  detector: detect_compositional_name

- id: name_precedence
  research_id: CE-R15
  level: rule
  name: Name precedence and namespacing
  aliases: [primary name]
  actors: n/a
  t0: n/a
  rule: >-
    Primary name = the set name when the set is accepted with P >= probability.p_display and coverage >= min_coverage
    (coverage = share of window events involving bound roles that the path explains); 
    'probable_set' when accepted with probability.p_probable <= P < p_display (single source: probability); 'prefix' ('<Set> (start) -> ...') when the best template departed
    after a clean prefix; 'special_class' when motion / continuity / ISO names the window; else 'compositional'. The compositional name and the full action sequence are always
    stored (R-ST-06). set_code always carries its namespace (gen., MSU., zone., blob., slob., press., def.;
    R-ST-22); 'gen.' is proposed for the generic college starter library. European / NBA synonyms are secondary
    labels (R-ST-15).
  params:
    min_coverage: {value: 0.7, unit: fraction}
  min_duration_s: null
  outputs: [primary_name, primary_name_kind]
  confidence: contract
  noise_notes: n/a
  conflicts_resolved: []
  sources: []
  status: proposal
  detector: null
  implemented_by: name_precedence, detect_compositional_name

- id: continuity
  research_id: CE-R16
  level: set_component
  name: Continuity offence (repeated motif with reversals)
  aliases: [Flex continuity, pattern continuity]
  actors: cutter of the first cycle
  t0: t_ref of the first motif event of cycle 1
  rule: >-
    Motif = a set component that a continuity template repeats (starter: flex). Consecutive motif events form
    cycles when their t_ref gap is within period_s and the ball changes side (REVERSAL: sign of x_ball with a
    0.9 m dead band; a DHO or dribble reversal counts) between them; label the continuity when >= min_cycles
    cycles fall within max_span_s. Output cycle_count and mean period, e.g. 'Flex x3'.
  params:
    period_s: {value: [3.0, 10.0], unit: s}
    max_span_s: {value: 25.0, unit: s}
    min_cycles: {value: 2, unit: cycles}
  min_duration_s: 3.0
  outputs: [code, cycle_count, cycle_period_s]
  confidence: conf = minimum motif conf
  noise_notes: A missed reversal splits one continuity into partial cycles; the ball-side test uses smoothed ball x.
  conflicts_resolved: []
  sources:
  - {url: docs/taxonomy/offense_full.md, supports: 'F4.1 Flex: >= 2 repetitions = continuity; 1 = flex action'}
  status: proposal
  detector: detect_continuity

- id: motion
  research_id: CE-R16
  level: set_component
  name: Generic motion (5-out / 4-out 1-in motion)
  aliases: [motion offense, free motion]
  actors: none (team label)
  t0: t_ref of the first off-ball action in the window
  rule: >-
    Label motion when off-ball screens + cuts >= min_rate_per_10s per 10 s over a span >= min_window_s (span =
    first to last off-ball action, at least min_window_s), on-ball screens and DHOs are < max_on_ball_share of all
    actions, and no set template is accepted. Label '5-out motion' or '4-out 1-in motion' from the accepted ALIGN
    code, else 'motion'. Store the rate measures. Loop 4 L9: only actions inside half-court set windows count.
    Loop 5 C5: detect_all(scene, cuts=...) may pass the cuts family's events; motion then counts the real cut
    events of cut_kinds (with the proxy off-ball screens) instead of the proxy CUT, which stays the fallback;
    attrs.cut_source says which was used.
  params:
    min_window_s: {value: 8.0, unit: s}
    min_rate_per_10s: {value: 3.0, unit: actions per 10 s}
    max_on_ball_share: {value: 0.5, unit: fraction}
    conf_scale: {value: 0.9, unit: factor}
    cut_kinds: {value: [cut], unit: 'cuts-family event kinds that count as cuts when detect_all(scene, cuts=...) passes them (loop 5 C5; generic CU.P2 cut = one event per cut)'}
  min_duration_s: 8.0
  outputs: [label, rate_per_10s, on_ball_share, alignment]
  confidence: conf = conf_scale x min(1, rate / threshold) x edge (at the span midpoint) x gap
  noise_notes: Rates depend on screen / cut recall; loose screen evidence is used so strict-screen misses do not suppress motion.
  conflicts_resolved: []
  sources: []
  status: proposal
  detector: detect_motion

- id: iso
  research_id: CE-R17
  level: set_component
  name: Isolation / clear-out isolation
  aliases: [ISO, clear-out]
  actors: handler
  t0: the handler's catch (start of the holder run)
  rule: >-
    A holder run >= min_hold_s with: no on-ball screen evidence (loose or strict) on the handler with p >=
    screen_p_exclude; window mean of P(no teammate within no_teammate_within_m) >= min_clear_conf (product over
    teammates of p_above(distance, 3.0, sigma_dist)); >= min_spacers teammates at d3 >= spacer_min_d3_m or on the
    weak side (x x side < -weak_side_min_x_m) for >= spaced_frac of the frames; at most max_offball_actions
    off-ball screens or cuts with p >= screen_p_exclude during the hold (teammates space and wait; screening and
    cutting action is motion; one relocation is the clear-out). Clear-out variant: a teammate's
    distance to the handler grows by >= clear_out_min_m between clear_out_lookback_s before the catch and
    clear_out_after_s after it. Loop 4 L4: the hold is the longest frontcourt stretch of the holder run (ball y <=
    HALF_Y; the bring-up does not count) and a hold whose median handler r over the first post_window_s is <
    post_max_r_m is a post-up, not an ISO (Synergy logs post-ups as their own play type). Loop 4 L5: the handler attacks -
    at some frame of the hold he is at d3 <= attack_max_d3_m (a hold 2-3 m behind the arc while the play is called is
    not an isolation). Loop 5 C1 (noise robustness): the hold extends over holder-less frames while the ball stays
    within HOLD_R + hold_ext_k x sigma_dist(holder, ball) and does not leave him faster than catch_max_ball_mps (a
    dribble the hard radius drops under noise); backcourt flickers <= fc_bridge_frames do not cut the frontcourt
    stretch; off-ball actions are the teammates' (not the handler's own moves), counted per teammate, and a CUT counts
    only when P(speed > move_enter_mps) >= cut_peak_p at some frame. Loop 6 C1: the hold ends where the ball starts
    leaving the holder (radial speed v_r = d/dt dist(ball, holder) > release_vr_mps on the run's final >=
    release_min_frames frames) and starts where the arriving ball slows under it (v_r < -release_vr_mps on the first
    frames), so the frames of a soft pass (~4.3 m/s, under catch_max_ball_mps) are not hold; the attack test also
    looks at those catch / release frames. Loop 7 C1: release / arrival evidence is P(v_r beyond release_vr_mps) >=
    release_p with sigma_vr, up to release_gap_frames frames without evidence do not end the stretch, and for a flight
    faster than catch_max_ball_mps the cut is where v_r crosses half the flight's radial speed (release_half_peak, the
    centre of the smoothed velocity step; never into frames with the ball beyond HOLD_R and only within
    release_peak_s of the first-evidence frame); the post-up window starts at the untrimmed hold start (the catch).
  params:
    min_hold_s: {value: 3.0, unit: s}
    screen_p_exclude: {value: 0.3, unit: probability}
    no_teammate_within_m: {value: 3.0, unit: m}
    min_clear_conf: {value: 0.7, unit: probability}
    spacer_min_d3_m: {value: -0.5, unit: m}
    weak_side_min_x_m: {value: 1.5, unit: m}
    min_spacers: {value: 3, unit: players}
    spaced_frac: {value: 0.7, unit: fraction}
    clear_out_lookback_s: {value: 2.0, unit: s}
    clear_out_min_m: {value: 4.0, unit: m}
    max_offball_actions: {value: 1, unit: off-ball screens + cuts during the hold}
    clear_out_after_s: {value: 1.0, unit: s}
    post_max_r_m: {value: 4.6, unit: 'm (loop 4 L4: a hold starting inside 15 ft of the rim is a post-up)'}
    post_window_s: {value: 1.0, unit: 's (loop 4 L4: median handler r over the first second of the hold)'}
    attack_max_d3_m: {value: 1.5, unit: 'm (loop 4 L5: the handler must come within this distance outside the three-point line during the hold)'}
    hold_ext_k: {value: 2.5, unit: 'x sigma_dist(holder, ball) (loop 5 C1: the hold extends over holder-less frames with the ball within HOLD_R + this x sigma)'}
    fc_bridge_frames: {value: 9, unit: 'frames (loop 5 C1: backcourt flickers of the ball up to this long do not cut the frontcourt stretch; the frontcourt rule holds 10 frames)'}
    cut_peak_p: {value: 0.9, unit: 'probability (loop 5 C1: a proxy CUT counts as an off-ball action when P(speed > move_enter_mps) reaches this at some frame)'}
    release_vr_mps: {value: 2.0, unit: 'm/s (loop 6 C1: the hold ends where the ball starts leaving the holder at a radial speed above this, and starts where an arriving ball slows under it; a soft 4.3 m/s pass ends / starts the hold)'}
    release_min_frames: {value: 3, unit: 'frames (loop 6 C1: a boundary flight stretch shorter than this is not cut)'}
    release_p: {value: 0.5, unit: 'probability (loop 7 C1: a frame is release / arrival evidence when P(v_r beyond release_vr_mps) >= this, p_above / p_below with sigma_vr)'}
    release_gap_frames: {value: 1, unit: 'frames (loop 7 C1: frames without release evidence tolerated inside a boundary flight stretch)'}
    release_half_peak: {value: true, unit: 'bool (loop 7 C1: cut a boundary flight at the frame where v_r crosses half of the flight radial speed, the centre of the smoothed velocity step)'}
    release_peak_s: {value: 0.2, unit: 's (loop 7 C1: the flight speed is the peak |v_r| over the stretch and this long past the run edge, about the smoothed step width of 4-5 frames)'}
  min_duration_s: 3.0
  outputs: [handler, clear_out, spaced_frac]
  confidence: conf = window mean P(no teammate within 3 m) x edge x gap
  noise_notes: 'Fixed skeptic CE-R17: a stationary screener next to the handler blocks ISO through either the screen evidence or the 3 m clearance; strict screens are not required.'
  conflicts_resolved:
  - ISO exclusion (strict screen rule vs loose) - any screen evidence weighted by p, plus the clearance test.
  sources:
  - {url: https://fansided.com/2017/09/08/nylon-calculus-understanding-synergy-play-type-data/, supports: Synergy logs broken-down actions (long delay after a ball screen, jabs after a catch) as isolation}
  status: proposal
  detector: detect_iso

- id: scramble
  research_id: CE-R17
  level: set_component
  name: Scramble / free play classes
  aliases: [scramble, putback chance]
  actors: n/a
  t0: chance open
  rule: >-
    SCRAMBLE = a chance opened by an offensive rebound or loose ball (state_machine K08; the NCAA men's 20 s shot
    clock reset after an offensive rebound that hits the rim) whose terminal event comes within 4.0 s and no ALIGN
    is accepted. FREE = ALIGN not accepted, no template matched and fewer than 2 chunks (rendered 'Free -> ...' by
    compositional_name). The chance opening needs PBP / the state machine; not decidable from XY alone.
  params:
    terminal_within_s: {value: 4.0, unit: s}
  min_duration_s: null
  outputs: [special_class]
  confidence: n/a until chance boundaries are available
  noise_notes: n/a
  conflicts_resolved: []
  sources: []
  status: proposal
  needs_data: chance boundaries (state_machine chance_seq K08) and terminal events (PBP)
  detector: detect_scramble

- id: set_window
  research_id: CE-R01
  level: rule
  name: Set window (unit of composition)
  aliases: [chance window]
  actors: none
  t0: t_open = the earlier of the ALIGN t_snap and the first frontcourt action's t_ref
  rule: >-
    Unit = chance (state_machine chance_seq, K08; an offensive rebound or a shot-clock reset opens a new chance;
    the chance is at most 30 s, or 20 s after an offensive rebound that hits the rim). Frontcourt = ball y <=
    HALF_Y for 10 consecutive frames. t_open = min(ALIGN t_snap, t_ref of the first lattice event after the
    frontcourt frame). Lattice events between team control (first holder frame) and t_open (backcourt, named_spots
    rule_transition_window / early phase) form a separate transition_early window (state_machine flow states S4a /
    S4b; window_index -1); it carries attrs.name 'transition_early' and gets no name / style event (loop 5 C6).
    Loop 5 C3: a first half-court window shorter than scramble_max_s that opens within scramble_lookback_s of the
    ball at the rim (XY: within scramble_rim_r_m; optionally ball_z above rim height with use_ball_z) is a putback /
    tip scramble, not a set, and is not emitted. Loop 6 C3 (scramble_inbound_excl): lookback frames with the ball
    out of bounds (y < END_Y or |x| > SIDE_X) are not rim frames, and a lookback in which an attacker holds the ball
    while standing out of bounds (median position) is a dead-ball inbound - the window is a set (BLOB / SLOB). Loop 7
    C3: out of bounds means beyond the line by inbound_oob_k calibrated sigmas; over his whole inbound hold, the
    inbound needs either the ball median out (dead-ball evidence: the ball held outside; or scene.clock_stop_start
    where a source has the clock) with the mean of the holder and ball medians beyond the line by inbound_oob_k sigma,
    or (loop 8 C3) the holder median alone beyond the line by inbound_oob_k x sigma_holder with the ball median within
    inbound_reach_m of the line (an inbounder just behind the line holds the ball out over the plane). t_close = the
    first of: the ball back in the backcourt for >= 10 frames, shot proxy (a ball flight with no holder for >=
    shot_min_free_frames frames moving toward the rim, then the ball within shot_end_r_m of the rim within
    shot_holder_grace_s after the flight's last free frame, so a roller under the rim who 'holds' the arriving
    ball does not hide the shot; PBP shot / turnover / foul times override it when aligned), clip or period end.
    Resets (CE-R02) split the window. A window shorter than min_window_s is merged into its neighbour; a lone
    half-court window shorter than min_window_s is dropped (loop 4 L3). Offense retreat (loop 4 L3): when the window
    would close because the ball goes back to the backcourt while an attacker holds it within +-retreat_holder_s of
    the crossing (the offense itself carries or passes the ball back: a violation in a real frame, and on SportVU
    the signature of a stretch whose attacked end belongs to the other team), the span yields no window.
  params:
    retreat_holder_s: {value: 0.3, unit: 's (loop 4 L3: +- window around the backcourt crossing in which an offensive holder marks an offense retreat)'}
    shot_end_r_m: {value: 1.0, unit: m}
    min_window_s: {value: 1.0, unit: s}
    shot_min_free_frames: {value: 4, unit: frames}
    shot_holder_grace_s: {value: 0.2, unit: s}
    scramble_max_s: {value: 3.0, unit: 's (loop 5 C3: a first half-court window shorter than this that opens after the ball was at the rim is a putback / tip scramble, not a set)'}
    scramble_lookback_s: {value: 1.5, unit: 's (loop 5 C3: rim test window before t_open)'}
    scramble_rim_r_m: {value: 3.0, unit: 'm (loop 5 C3: ball within this XY distance of the rim = at the rim; the measured default)'}
    use_ball_z: {value: false, unit: 'bool (loop 5 C3: optionally also use scene.ball_z where the source has it; video does not)'}
    rim_z_m: {value: 3.05, unit: 'm (loop 5 C3: rim height, used only with use_ball_z)'}
    scramble_rim_z_r_m: {value: 4.5, unit: 'm (loop 5 C3: with use_ball_z, a ball above rim height this close to the rim also counts)'}
    scramble_inbound_excl: {value: true, unit: 'bool (loop 6 C3: lookback frames with the ball out of bounds are not rim frames, and a lookback with an out-of-bounds holder - median position behind the baseline or past a sideline - is a dead-ball inbound, never a scramble)'}
    inbound_oob_k: {value: 1.0, unit: 'sigma (loop 7 C3, loop 8 C3: out of bounds = beyond the line by this many calibrated position sigmas, each sigma the median per-frame K_CAL sqrt(var_p) over the holder run. The inbound test passes by either route: (a) the ball median out of bounds (no margin) and the mean of the holder and ball medians beyond the line by inbound_oob_k x 0.5 hypot(sigma_holder, sigma_ball); or (b) the holder median alone beyond the line by inbound_oob_k x sigma_holder with the ball median within inbound_reach_m of the line. _rim_before drops a lookback frame as out of bounds when the ball is beyond the line by inbound_oob_k x its own sigma. One sigma, so that at SportVU precision (~0.05 m) the margin is about the 5 cm line width, which itself is out of bounds)'}
    inbound_reach_m: {value: 0.75, unit: 'm (loop 8 C3: arm reach, body centre to the centre of a ball held out in front - half torso depth ~0.1 m + an extended arm to the ball centre ~0.65 m; on the holder route the ball median may be up to this far in bounds, because an inbounder just behind the line holds the ball over the plane; geometry, not fitted)'}
  min_duration_s: 1.0
  outputs: [t_open_f, t_close_f, 'close_reason {shot_proxy, backcourt, reset, clip_end, halfcourt_open} (offense_retreat windows are not emitted)', 'segment_kind {halfcourt, transition_early}', window_index, transition_early_f]
  confidence: conf = gap factor over the window x edge factor at the window midpoint, worst attacker (loop 1 F8; the edge factor of a window that opens at clip frame 0 is not evidence)
  noise_notes: Ball-control noise moves the half-court crossing; the 10-frame hold guards it. A missing ball track at the shot gives a late t_close; fall back to the PBP shot time.
  conflicts_resolved:
  - Transition / early split - reuse state_machine S4a / S4b / S4c and named_spots rule_transition_window / rule_early_offense_phase instead of a new definition.
  sources:
  - {url: config/state_machine.yaml, supports: flow_state S4a / S4b / S4c split and chance_seq}
  - {url: config/named_spots.yaml, supports: rule_transition_window, rule_early_offense_phase, alignment_snap_zone}
  status: proposal
  detector: detect_set_window

- id: possession_split
  research_id: null
  level: rule
  name: Possession split of a multi-possession clip and defence-aware ball control (loop 4)
  aliases: [possession spans, team control]
  actors: none
  t0: span start
  rule: >-
    Offensive ball control (event_lattice holder) is refused at a frame where the nearest defender is nearer to the
    ball than the attacker by more than def_margin_m + def_noise_k x the pair position sigma (MP-19, K_CAL
    inflated): a steal, a defensive rebound or the defence's own possession is not an offensive hold. Defensive
    control = no offensive holder, the nearest defender within HOLD_R of the ball and nearer than every attacker by
    that margin. A clip is cut at every defensive control run >= def_control_min_s (gaps <= def_bridge_frames
    bridged); each remaining span >= min_span_s with >= min_control_s of offensive holder frames is run through every
    detector as its own clip (detect_all; events are returned in clip frames). A clip without such a run - every
    single-possession clip, and every scene without defender tracks - is one span and runs unchanged.
  params:
    def_margin_m: {value: 0.3, unit: m (fixed part of the defender-nearer margin)}
    def_noise_k: {value: 1.0, unit: x pair sigma (K_CAL x sqrt(var_p attacker + var_p defender))}
    def_control_min_s: {value: 0.5, unit: s (defensive control run that ends a possession span)}
    def_bridge_frames: {value: 3, unit: frames}
    min_span_s: {value: 1.0, unit: s}
    min_control_s: {value: 1.0, unit: 's (offensive holder frames a span needs; SportVU: spans with a momentary offensive touch inside the defence''s possession opened 0.1-2 s windows)'}
  min_duration_s: 1.0
  outputs: [possession spans (a, b) in clip frames]
  confidence: n/a (segmentation); events keep their own conf
  noise_notes: >-
    The margin grows with the pair sigma, so at production noise (sigma_p 0.5) the defender must be clearly nearer
    before control flips; a contest at the shot or a reach-in shorter than def_control_min_s does not cut the clip.
  conflicts_resolved:
  - One clip = one possession (CE-R01 chance unit) vs SportVU clock-running stretches holding 2-6 possessions of both teams - the split restores the contract instead of changing every detector.
  sources:
  - {url: config/state_machine.yaml, supports: chance_seq and possession boundaries the split approximates from XY}
  status: proposal
  detector: null
  implemented_by: possession_spans, sub_scene, detect_all, _H

- id: reset
  research_id: CE-R02
  level: rule
  name: Reset / phase boundary inside a chance
  aliases: [reset, re-set, pull back]
  actors: handler
  t0: the first frame at which all conditions hold
  rule: >-
    At frame t, over [t - quiet_s, t]: (1) no screen, cut, drive, DHO, roll or pop event is open (no such event
    with end >= t - quiet_s and start <= t); (2) ball d3 >= ball_min_d3_m (d3 only); (3) the handler's mean speed
    over the last handler_window_s < handler_max_mps; (4) relative slow-down: team mean speed over [t - quiet_s, t] <
    team_slow_frac x the team mean over the preceding prev_window_s; (5) an ALIGN template is accepted at t
    and the ball went back out (d3 >= re_align_min_ball_d3_m) or was pulled >= re_align_pull_out_m away from the
    rim since its closest point in the last quiet_s + prev_window_s (re_align; a team standing still after a PnR
    is not a reset), or the handler made a retreat dribble (v_r <= -retreat_min_mps for >= retreat_min_s inside the
    window, ending at r >= retreat_end_r_m). Allowed only >= min_after_set_s after the current set's t0 (first
    action after the window opens); any action with t_ref in (t, t + cancel_window_s] cancels it. Each reset
    closes the current set window and opens the next.
  params:
    quiet_s: {value: 1.5, unit: s}
    prev_window_s: {value: 3.0, unit: s}
    ball_min_d3_m: {value: 0.0, unit: m}
    handler_max_mps: {value: 2.0, unit: m/s}
    team_slow_frac: {value: 0.6, unit: fraction}
    retreat_min_mps: {value: 1.5, unit: m/s}
    retreat_min_s: {value: 0.5, unit: s}
    retreat_end_r_m: {value: 8.0, unit: m}
    min_after_set_s: {value: 3.0, unit: s}
    cancel_window_s: {value: 0.5, unit: s}
    handler_window_s: {value: 1.0, unit: s}
    re_align_min_ball_d3_m: {value: 1.0, unit: m}
    re_align_pull_out_m: {value: 1.5, unit: m}
  min_duration_s: 1.5
  outputs: [reset_f, 'trigger {re_align, retreat_dribble}', team_speed_mps, team_speed_before_mps]
  confidence: conf = window mean of p_below(team speed, 0.6 x before, team sigma) x edge x gap
  noise_notes: Fixed skeptic CE-R02 - an absolute 2.0 m/s team-mean test is almost always true in a half court (walking 1.4 m/s); the relative test discriminates. CA-RTS team-mean speed sigma is about 0.1-0.2 m/s.
  conflicts_resolved:
  - Stationary speed for a reset (0.5 M-SPACE-043, 1.0 named_spots slow_speed_mps, 2.0 stand-walk band) - replaced by the relative 60 % test.
  sources:
  - {url: https://arxiv.org/pdf/1902.08081, supports: a play develops within about 5 s and the offense resets if it fails}
  - {url: https://squared2020.com/2017/10/25/the-art-of-sketching-trajectory-analysis/, supports: 'Miller & Bornn segment trajectories at low-velocity stretches (secondhand), far below our noise floor'}
  status: proposal
  detector: detect_reset

- id: unmatched_clustering
  research_id: CE-R18
  level: rule
  name: Unmatched clustering and template induction
  aliases: [open-set discovery]
  actors: n/a
  t0: segment t0
  rule: >-
    Input: segments with C_hat > c_null or P(NULL) top-1. Representation: canonical token sequence (TF-IDF 1-3
    grams), role-aligned trajectory tensor (5 attackers + ball, 5 Hz, 8 s, tree Hungarian alignment depth <= 6,
    K 2-10 by silhouette) and the learned embedding. d = 0.5 normalised token edit distance + 0.3 soft-DTW (gamma
    0.1, median-normalised) + 0.2 (1 - cosine). HDBSCAN min_cluster_size 5, min_samples 3; queue clusters with >=
    5 members from >= 2 games (R-ST-09). Induced template: progressive MSA, step required if in >= 60 % of members,
    optional 30-60 %, window [P10, P90] + 0.3 s, region median +- max(1.5 m, 2 MAD), status documented (R-ST-11).
  params:
    min_cluster_size: {value: 5, unit: segments}
    min_samples: {value: 3, unit: segments}
    min_games: {value: 2, unit: games}
    required_share: {value: 0.6, unit: fraction}
    optional_share: {value: 0.3, unit: fraction}
  min_duration_s: null
  outputs: [unmatched_cluster_id, induced_template_id]
  confidence: n/a until a corpus exists
  noise_notes: Clusters dominated by one game are blocked by the >= 2 games rule.
  conflicts_resolved: []
  sources:
  - {url: https://arxiv.org/pdf/1710.02255, supports: iterative template learning with Hungarian alignment and hierarchical partitioning}
  - {url: https://arxiv.org/abs/1703.01541, supports: soft-DTW for clustering under DTW geometry}
  - {url: https://www.sloansportsconference.com/research-papers/possession-sketches-mapping-nba-strategies, supports: Possession Sketches vocabulary of short registered actions}
