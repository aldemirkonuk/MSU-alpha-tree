family: composition
version: 0.8.0
date: '2026-10-23'
owner: Mac session (msu-colab) for Aldemir
status: proposal under the build freeze
scope: >-
  Composition engine (primitives -> actions -> set components -> named sets): ALIGN snapshot, event lattice,
  template format and starter library, matcher, probabilities, departures and counters, compositional naming,
  continuity / motion / iso / reset rules, live belief with commit hysteresis and revision log, storage contract.
  Reference implementation: tools/specgen/movement/detectors/composition.py (reads every parameter below at import).
  Tests: tests/movement/test_composition.py (sim.scenario, sigma_p 0.3, fixed seeds).
frame: >-
  Attacked-rim frame of config/named_spots.yaml 0.3.2 (metres; x to the attacker's right, y from the end line toward
  half court; rim at the origin). 29.97 fps, dt = 1001/30000 s; elapsed time = (n_frames - 1) x dt. Spot labels are
  read through tools/specgen/named_spots/spotlib.py and never redefined here. ALIGN works in Cartesian metres (the
  repo text, offense_full section 0.2, says (r, theta)); the change is declared in align_snapshot.
conventions:
  stationary: >-
    'Stationary' always means the MP-09 statistic stationary_s2 < 5.99 (chi-square, 2 dof, 95 %), never raw CA-RTS
    speed < 0.3 m/s: CA-RTS speed is biased upward at rest (0.4-1.1 m/s at sigma_p 0.3 m in sim). Per-frame
    P(stationary) = 1 / (1 + exp((s2 - 5.99) / 1.5)) (proposal); 'stationary over a window' = window mean >= 0.6 (screens; sim at sigma_p 0.3 m: a
    standing player passes a 0.5 s window 99 % of the time, a player moving >= 2 m/s never; a 1.0 m/s walker sits near 0.5).
  direction_change: Direction changes use pre/post mean velocities that skip the plant phase (MP-13); this family does not define its own.
  confidence: >-
    Every detector returns mvlib.Event with conf = window_conf x edge_factor x gap_factor (MP-16). A composite
    (component, set) multiplies in the evidence of its parts: the minimum part probability, or the set
    probability P for 'set' events. Composite edge / gap factors take the worst actor. Set-component events then
    report conf = P(correct | detected) from the calibration item's per-kind, per-noise-band isotonic tables
    (raw conf kept in attrs.conf_raw; loop 1 F10).
  speeds: >-
    The research note's speed-noise numbers (13-frame Gaussian derivative 3.98 x sigma_p; window regression
    0.632 x sigma_p / T^1.5) describe the old repo smoother. This file uses mvlib CA-RTS (MP-04) speeds and their
    calibrated sigma (sigma_speed = K_CAL sqrt(var_v) x k_edge) instead; window-mean speeds stand in for
    regression speeds where the research asked for them.
  research_input: scratchpad movement/families.json, family 'COMPOSITION ENGINE' (27 rules CE-R01..CE-R27, 15
    components CE-C01..CE-C15) plus its skeptic check (13 errors, 10 missing items); every high and medium error is
    fixed below (see fixed_skeptic_errors) and every missing item that belongs here is added.
fixed_skeptic_errors:
- CE-R09/CE-R11 (high) normalised-cost scale: Perse's 0.6 is not carried over. c_null = 0.45 on this file's C_hat scale (set from synthetic sweeps, fit on gold later) AND a hard floor of >= 75 % required steps matched; a template with half its required steps deleted can never be accepted (tested).
- CE-R09 (high) insertions on long windows: insertions only count between the first matched t_ref and the last matched t_end, only for events not explained by a matched component, weighted by role (ball 1.0, bound off-ball 0.6, unbound 0.1), total capped at 0.25 x W. Extra ball events outside the matched span cost 0 (tested on a long window).
- CE-R11 (medium) two normalisations: ranking and acceptance both use C_hat = C / W; ranking adds only explicit priors (ln pi(T), length prior 0.5 nat per matched required step); NULL uses the same C_hat scale (s_NULL = -c_null / tau).
- CE-R11 Perse citation restated (see probability.sources).
- CE-R06 (medium) margin vs near-ties: ALIGN probabilities (top-3 + free) are always emitted; 'accepted' is a separate flag used only for the display name; stability 5 evaluated frames = 12 frames = 0.40 s; Cartesian frame declared.
- CE-C01 (medium) Iverson bands: one consistent set (start / end |x| >= 3.0 m on opposite sides, |dx| >= 6.0 m, 0.6-4.0 s between the |x| = 3 crossings since loop 1 F1, crossing y 4.0-7.0); the redundant speed test is dropped.
- CE-C05 (medium) Elevator false closes: gap must fall >= 40 % from g0 (5-frame medians), the drop significant at 2 sqrt(2) sigma_track, the user crossing confirmed; the 0.6 m (1.0 m wide) target is soft evidence only.
- CE-R17 vs CE-R26 (medium) ISO and strict screens: ISO is excluded by any ball-screen evidence (loose or strict) with p >= 0.3, and by a teammate within 3.0 m (probabilistic, window mean >= 0.7).
- CE-R02 (medium) reset speed test: the absolute 2.0 m/s team-mean test is replaced by a relative test (team mean over the last 1.5 s < 60 % of the preceding 3.0 s); d3 only.
- CE-R01 (low) 20 s reset clock and S4a/b/c reference added; CTG snippet source dropped.
- CE-C08/CE-C09 (low) one early-offense window (12.0 s, named_spots rule_early_offense_phase) for Pistol and Drag; drag thresholds reconciled with docs/research/transition_full.md drag row.
- CE-R20 (low) latency figures marked proposals; candidate prefilter (ALIGN top-3 + kind index) added.
- CE-R03/CE-R08 citations: wustl homepage, the Intille TR-489 and Ivanov-Bobick pages (not shown opened) and the unverified Wang-Zemel '2x data' claim removed.
- CE-R11 display threshold: 0.70 kept as an initial value only, to be re-derived from the calibrated reliability curve.

changes_loop1:
# Loop 1 = fixes for the independent tester's report (synth.json element 7, failures F1-F17). Evidence figures are
# from that harness (115 scenario rows x 10 seeds x sigma_p 0.2 / 0.3 / 0.5) re-run on this version, plus the
# regression tests named test_f* in tests/movement/test_composition.py.
- id: F1-iverson-duration
  what: iverson.duration_s [1.0, 4.0] -> [0.6, 4.0] s; iverson.min_duration_s 1.0 -> 0.6.
  why: A 7.5-8 m/s wing-to-wing cut crosses the middle 6 m (|x| = 3 to |x| = 3) in 0.80-0.87 s; the 1.0 s floor assumed a 6 m/s ceiling.
  evidence: 'Iverson recall 0.33/0.33/0.37 -> 1.00/1.00/0.97, precision 1/1/1, near-miss negatives (baseline, over the top, elbows leave, handler dribble) 0 FP; test_f1_iverson_fast_sprint.'
- id: F2-drag-vy-rule
  what: >-
    detect_drag - the mean v_y <= -3.0 m/s run-in test is replaced by a trailer-run test (screener y fell >= min_drop_m 6.0 over
    run_window_s 3.0 before contact, p_above with sqrt(2) sigma_track >= 0.5), handler-screener relative speed >= min_rel_mps 1.5,
    screen_r_m [6.0, 7.5] -> [6.0, 9.0], and contacts of one pair within pair_merge_s 2.5 merged keeping the last; params
    vy_window_s and max_vy_mps removed; attrs vy_mps -> drop_m.
  why: Only a screener still sprinting through the handler (an illegal moving screen) passed the v_y rule; legal and rolling drags read -0.4 and -2.1 m/s.
  evidence: 'Drag recall 0/0/0 -> 0.95/0.95/0.68, precision 1.00/1.00/0.90 (the tester expected about 0.7 before the pair merge; the merge needed 2.5 s, not read_window_s 1.5 s, because the trailer runs past the handler 1.6-1.7 s before he sets the screen); half-court step-up and rim-run negatives 0/0/1 FP; author test unchanged; test_f2_drag_legal_and_rolling.'
- id: F3-spain-proxy-static-post
  what: detect_spain requires s2 to arrive (moved >= spain.arrive_min_m 1.0 within [t1 - arrive_from_s 1.5, t2]) in both modes, tried per candidate; _contacts computes its contact probability with the contact_m that gates.
  why: A teammate standing on the roll path all possession was labelled a Spain back-screener at the same conf as true Spains; the proxy gate (1.5 m) and its conf (1.2 m) disagreed.
  evidence: 'spain_neg_static_post FP 10/10/7 -> 0/0/1; Spain precision 0.78/0.80/0.77 -> 1.00/1.00/0.96, recall 0.97/1.00/0.60 -> 1.00/1.00/0.60; test_f3_spain_static_post_is_not_a_back_screen, test_f3_contacts_conf_uses_gating_distance.'
- id: F4-dho-chain-continuity
  what: dho_chain needs the receiver of DHO k to give DHO k+1 within chain_within_s of DHO k (gap from the last DHO); final receiver added to the actors; a DHO already in a chain does not start a suffix chain.
  why: Two unrelated DHOs within 5 s (right side, then a pass and a DHO on the left) were a chain at the same conf as a true chain.
  evidence: 'dho_chain_neg_independent FP 10/10/11 -> 0/0/0; get_dho_chain precision 0.74/0.73/0.63 -> 1.00/1.00/1.00, chain recall kept (10/10/9); test_f4_dho_chain_needs_continuity.'
- id: F5-stagger-suffix-duplicates
  what: detect_stagger - a screen already inside an emitted chain does not start another chain (the tester's simpler alternative).
  why: A triple stagger o2 -> o3 -> o5 was also emitted as o3 -> o5 (precision 0.50) and named twice.
  evidence: 'Stagger precision 0.50/0.50/0.45 -> 1.00/1.00/0.81, recall unchanged 0.90/0.90/0.85; test_f5_f14_triple_stagger_once_and_not_a_flare.'
- id: F6-flex-corner-single-frame
  what: detect_flex tests the weak-corner start on any frame of [onset - flex.corner_lookback_s 0.5, onset].
  why: Corner players stand 0.1-0.3 m behind the line; one noisy frame flipped the corner label and lost the cycle.
  evidence: 'Continuity recall 0.65/0.50/0.40 -> 0.85/0.70/0.50, flex recall 0.80/0.75/0.85 -> 0.85/0.80/0.85, no new FP; test_f6_flex_corner_start_behind_the_line, test_continuity.'
- id: F7-holder-ball-in-flight-shot-proxy
  what: >-
    _H - a NEW holder run cannot start while the ball's CA-RTS velocity relative to that player exceeds
    event_lattice.catch_max_ball_mps 6.0 (relative, not absolute ball speed, so a player catching on the run is not blocked); shot proxy =
    >= set_window.shot_min_free_frames 4 no-holder frames moving toward the rim, then the ball inside shot_end_r_m within
    shot_holder_grace_s 0.2 of the flight's last free frame.
  why: A roller under the rim 'held' the arriving shot, so the window closed at clip end.
  evidence: 'set_window_shot_close close_reason shot_proxy 2/3/6 -> 10/10/10 of 10; set_window precision and recall 0.73/0.77/0.87 -> 1/1/1; no detection changed elsewhere except pistol_dho at sigma 0.3 (6 -> 5 of 10); test_f7_shot_past_roller_closes_window.'
- id: F8-window-conf-zero-at-clip-edge
  what: set_window conf = gap factor over the window x edge factor at the window midpoint (_window_conf); motion conf also reads the edge factor at its span midpoint.
  why: A window opening at clip frame 0 got conf 0 from the boundary frame's edge factor, which zeroed name, style, commit and segment confs.
  evidence: 'name / style conf on the 8 s passes scenario 0.00/0.00/0.25 -> 1.00/1.00/1.00; compositional_name precision 0.65/0.83/0.65 -> 1.00/1.00/0.73 (with F16); test_f8_window_conf_not_zero_at_clip_edge.'
- id: F9-proxy-DHO-high-noise
  what: >-
    A holder change whose ball travel is < pass_min_flight_m is a DHO with air time up to dho_max_air_short_travel_s 0.6
    (conf x p_below(air_s, 0.6, dho_air_sigma_s 0.15)) AND with a noise-widened gap gate dho_max_gap_m + dho_gap_noise_k 3.0 x
    sigma_dist (conf x p_below(gap, gate, sigma_dist)); transfers with travel >= 1 m keep the old gates.
  why: >-
    The tester attributed the sigma 0.5 losses to holder-flicker air time. Re-measured on 'chicago_dribble_handoff' the holder
    runs are clean (air 0.03 s); the real cause is smoother lag inflating the smoothed giver-receiver gap at the hand-off (true
    0.64 m reads 0.8-1.2 m at sigma_p 0.3 and 1.4-1.9 m at 0.5, against the 1.5 m gate, while sigma_dist says 0.17-0.24 m). Both
    parts are kept: the tester's air-time relief (holder flicker does occur) and the gap fix that the scenario needs.
  evidence: 'chicago recall at sigma 0.5 0.40 -> 1.00 and 0.10 -> 0.90 (mirror), no new FP on any negative; dho_chain_continuous 7 -> 9 of 10 at 0.5. pistol_dho (4/10) and get (6/10) at 0.5 are unchanged: there the holder switch itself is 0.4-1.1 s late (sticky holder while both players move together), not a DHO-classification miss; test_f9_dho_with_long_air_time_on_short_travel, test_f9_chicago_handoff_at_high_noise.'
- id: F10-conf-not-calibrated
  what: >-
    New calibration item - every set-component event reports conf = isotonic P(correct | detected) per kind and noise band (low /
    mid / high from the scene's median K_CAL sqrt(var_p), edges 0.106 / 0.157 m = sigma_p 0.25 / 0.40), raw conf kept in
    attrs.conf_raw; tables fit with fit_isotonic (PAV, ties pooled, Laplace prior 1) on the tester harness; spain.proxy_conf_factor
    0.6 -> 0.96 (measured proxy-mode precision 52/54).
  why: Composite confs were fixed priors; false positives scored like true positives and proxy Spains were under-confident.
  evidence: 'Fit on 2190 harness runs (1142 component events). Detection outcomes on the harness are identical with and without the tables (the matcher sees calibrated confs). Examples - drag mid 0.78-0.94, high 0.50-0.69; floppy high 0.20-0.86; iverson 0.98 in every band; test_f10_calibration_tables_and_application. V0 only: re-fit on gold (R-ST-05).'
- id: F11-pnr-location-single-frame-label
  what: pnr_location uses the median screener position over +-loc_median_half_s 0.3 and emits location_probs (loc_samples 200 fixed standard-normal draws of N(position, sigma_track), seed loc_seed) and location_alternatives (top-2 when the runner-up >= loc_alt_min_p 0.2).
  why: A one-frame hard label flipped near the side / slot boundary with no alternative.
  evidence: 'The hard label of the harness rows is unchanged (pnr_side 8/10 at 0.3, 3/10 at 0.5), but the flips now carry the right label as the runner-up with its probability; test_f11_pnr_location_probabilities.'
- id: F12-yaml-param-hygiene
  what: >-
    min_duration_s enforced on (end - start) x dt in _dedup for every component (values made consistent with each detector's span -
    zipper 0.8 -> 0.4, floppy 1.0 -> 0.5, ucla 0.8 -> 0.5, flex 1.5 -> 1.0, pistol 0.5 -> null); a tracker swap (t_f, a, b,
    window_s) re-binds only when window_s <= role_binding.swap_window_s; exact CE-R20 prefilter in match_template (no step can be
    filled -> all-deleted path without the beam); duplicates removed (template_format.default_window_s / parallel_tol_s,
    time_base.sigma_t_ref_default_s, role_binding.binding_disagree_cost -> matcher; name_precedence.p_display / p_probable ->
    probability); role_binding.max_bindings_per_template removed (the binding search is the beam).
  why: Unused, duplicated or unenforced parameters can drift from the code.
  evidence: 'Harness detections unchanged by the min_duration enforcement; test_f12_min_duration_swap_window_prefilter_single_source.'
- id: F13-hard-coded-constants
  what: >-
    New params - event_lattice.stat_logistic_width 1.5, scr_dir_half_s 0.5, on_ball_frames 3, contact_bridge_frames 2,
    cross_dx_ratio 2.0, cross_max_y_m 3.0, drive_backtrack_vr_mps 1.0, hold_cert_frames 5; mirror.dead_band_m 0.9;
    spain.matchup_lookback_s 1.0; ucla.catch_within_s 1.0, cut_lead_s 0.3; flex.sts_dir_window_s 0.33; stagger.exit_after_s 1.0;
    iso.clear_out_after_s 1.0; motion.conf_scale 0.9; reset.handler_window_s 1.0; zipper.block_lookback_s 0.5.
  why: Thresholds in code only cannot be reviewed or tuned from the single source of truth.
  evidence: Same values as the old literals (no behaviour change); test_f13_constants_live_in_the_yaml.
- id: F14-flare-class-by-ball-angle
  what: SCR.flare by geometry - the user's mean heading over the approach [t - event_lattice.flare_pre_s 1.0, t] vs the exit [t, t + scr_dir_half_s] turns >= flare_min_turn_deg 45 and he leaves toward the outside (|x| increasing) with |v_x| >= |v_y|; the ball angle is no longer used.
  why: Stagger-away exits near 110-130 deg to the ball were labelled flare. The approach window is 1.0 s, not the tester's +-0.5 s, because the minimum screener-user distance often falls on the way out (a +-0.5 s pre-window then sees only the exit; measured turn 42 deg on a clear flare).
  evidence: 'stagger_triple exit flare -> straight; harness detections unchanged; test_f14_flare_geometry, test_f5_f14_triple_stagger_once_and_not_a_flare.'
- id: F15-spain-defender-mode-timing
  what: >-
    Defender reaction = at any frame e of the back-screen window with the defender within scr_contact_m of s2, his mean velocity
    over [e - react_window_s 0.5, e] (>= defender_min_mps 1.0) vs [e, e + 0.5] turns > defender_turn_deg or drops >=
    defender_slow_frac (pre / post means, MP-13).
  why: The minimum-distance frame falls late in the stuck phase, so the mode never fired at sigma 0.05. The tester's proposal (first entry frame only) was tried and does not fire on the tester's own scenario - the defender is already within contact range when he starts following the roll, so the entry frame is his acceleration, not the hold (pre 0.7 m/s, post 2.0 m/s).
  evidence: 'spain_defender_mode_flag evidence_mode defender at sigma 0.05 0/10 -> 10/10, at 0.2/0.3/0.5 9/10/6 -> 10/10/6; test_f15_spain_defender_mode_at_low_noise.'
- id: F16-reset-free-windows
  what: A re_align reset also needs the ball back out (d3 >= reset.re_align_min_ball_d3_m 1.0) or pulled >= re_align_pull_out_m 1.5 away from the rim since its closest point in the last quiet_s + prev_window_s.
  why: A team standing still after a PnR (handler at r 6.9 m) re-aligned by chance and split the window, adding a 'Free' name.
  evidence: 'name_14high_mirror extra windows 9/2 (and 7/4 mirrored) -> 0/0 at sigma 0.2/0.3; reset recall unchanged 1/1/1 and the author reset test passes; test_f16_no_reset_when_the_team_stands_after_a_pnr.'
- id: F17-author-tests-unrealistic-speeds
  what: >-
    Test file - scene_of asserts every waypoint segment has a minimum-jerk peak 1.875 x distance / time <= 8.0 m/s; test_continuity
    rewritten with a pass reversal (o1 -> o2 top -> o5) instead of the 11 m / 0.8 s 'dribble' (25.8 m/s), plus a negative; reset,
    ram, flex, motion, hammer, floppy, elevator, drag spacers and the Horns roll retimed (truth windows follow).
  why: Detectors tuned on impossible paths hide speed-band problems (F1 was one).
  evidence: test_f17_all_author_scenarios_feasible; every author test passes on the retimed paths with its original seed except the elevator (seed 81 kept, path 1.9 -> 3.55 s; elevator recall stays about 50-60 % at sigma_p 0.3, the open question below).
- id: version
  what: version 0.1.0 -> 0.2.0 (same date).
  why: Parameters, rules and outputs changed (storage rows carry the version).
  evidence: test_yaml_contract.

changes_loop2:
# Loop 2 = fix pass 2 on the confirmer's verdict for loop 1 (scratchpad loop2/confirm_composition.json: 1 regression,
# 3 low still_failing items). Evidence: the tester harness and the confirmer harness (identical run.py / scenarios.py,
# 116 scenario rows x 10 seeds x sigma_p 0.2 / 0.3 / 0.5) re-run before and after on this version (scratchpad
# movement/fix2_composition base.json -> after.json). P / R per detector; every row not named below is identical.
- id: R1-pistol-dho-action-radius
  what: detect_pistol measures a DHO's action location at the giver (pistol.dho_location_actor giver), not at the receiver; a screen is still measured at the screener.
  why: >-
    Regression of loop 1 (pistol_dho 6 -> 5 of 10 at sigma 0.3). The receiver is already running up past the hand-off at
    t0 (r 8.5-9.3 m against action_r_m [6.5, 8.5]); the giver - where the ball is handed off - reads r 7.6-8.4 m in all 30
    runs. The confirmer's alternative (action_r_m -> [6.5, 9.5]) was not taken: it would also widen the screen gate.
  evidence: 'pistol_dho TP 8/5/4 -> 10/8/7 of 10; pistol P 1/1/1 (unchanged), R 0.93/0.83/0.70 -> 1.00/0.93/0.80; the remaining misses are t0 0.37-0.57 s late (DHO holder switch), with loose matches 10/10/10; pistol_neg_paint / pistol_neg_late 0 FP; test_r1_pistol_dho_action_at_the_giver.'
- id: R3-drag-role-swap-false-positives
  what: detect_drag - the handler must hold the ball in more frames than the screener over +- drag.holder_window_s 1.0 around the contact.
  why: >-
    The three sigma 0.5 drag false positives the confirmer listed (drag_legal_stop, drag_legal_stop_L, drag_neg_halfcourt)
    were all role swaps (screener o1 = the ball handler, 'handler' o5 = the trailer): the holder flickered to the trailer
    for 0.2-0.7 s while the two passed within 0.2 m, and the ball handler's own run up the floor satisfied the
    trailer-run drop. 0.5 s still let the 0.7 s flicker through (drag_legal_stop seed 1008); 1.0 s removes it.
  evidence: 'drag FP at sigma 0.5 3 -> 0 (drag precision 0.90 -> 1.00 at 0.5; 1.00 at 0.2 / 0.3 unchanged); no TP lost; test_r3_drag_handler_holds_the_ball.'
- id: R4-drag-two-approaches-in-one-contact
  what: >-
    detect_drag splits a contact interval at every local minimum of the smoothed pair distance separated by a rise >=
    max(drag.split_rise_min_m 0.2, drag.split_rise_k 1.0 x median sigma_dist) (noise-scaled, _distance_minima); the
    existing pair merge then keeps the last approach.
  why: >-
    Found while fixing R3 (not in the confirmer's list): drag_rolling_L was 8/8/3 of 10 with loose matches 10/10/10 and t0
    0.2-0.6 s early. The trailer passes the handler (true distance 0.70 m) about 1 s before the screen (0.54 m); at
    contact_m 2.0 both approaches form ONE interval, so its global minimum - often the run-past - became t0 and the
    pair merge (which keeps the last contact) never saw two contacts. The rise is noise-scaled because the bump between
    the two minima is 0.3-0.6 m and sigma_dist is 0.12-0.24 m.
  evidence: 'drag R 0.95/0.95/0.68 -> 1.00/0.97/0.80 with R3 (split alone, R3 kept: drag_rolling_L 8/8/3 -> 10/9/5, drag_rolling 0.5 8 -> 9, drag_legal_stop_L 0.5 6 -> 8); no negative fires; test_r4_drag_split_keeps_the_screen_not_the_run_past.'
- id: R2-pnr-location-spread
  what: >-
    pnr_location samples N(median position, (pnr_location.loc_sigma_inflation[noise band] x sigma_track)^2), inflation
    low 1.2 / mid 1.3 / high 1.7 per calibration band; the top-1 label is unchanged.
  why: >-
    The confirmer's fix (add std / sqrt(n) of the window) was measured and does not help: that term is about 0.01 m. The
    0.6 s median's real error is 1.18 / 1.29 / 1.66 x sigma_track at sigma_p 0.2 / 0.3 / 0.5 (40 / 40 / 30 screens), so
    the labels were over-confident (seed 1008 at 0.5: slot 0.91 with no side alternative). The tester's pnr_side truth sits
    0.2-0.35 m from the side / slot boundary (x 4.55 / y 5.75 at the screener's (4.8, 5.4)) while the median errs by
    0.28 m rms per axis at sigma_p 0.5 (with a +0.2 m y bias from the tracker), so its top-1 label is ambiguous by
    construction there; the YAML aim is alternatives where ambiguous, so top-2 is the honest score.
  evidence: 'Top-1 unchanged (pnr_location P/R 1/1, 0.90/0.90, 0.80/0.60). Top-2 (truth in location_alternatives, among found screens): pnr_side 10/10/7 of 10/10/7 and pnr_side_L 10/10/6 of 10/10/6 (was 10/10/6 of 7 for pnr_side at 0.5 - seed 1008); clear slot screens never get an alternative (0 of 57). Recall at 0.5 (7/6 of 10 found) is the SCR.on primitive (stationary-screener window), see R5; test_r2_pnr_location_alternative_at_high_noise.'
- id: R5-high-noise-recall-known-limits
  what: sim_validation.known_limits_sigma_0_5 records the sigma_p 0.5 recall of elevator, live_belief, departure, set_match, floppy, ucla, pnr_location and continuity; no detector change.
  why: >-
    The confirmer marked these low and said no code change is required this loop. The common cause (the loose-screen
    primitive's stationary-window test and the holder switch) is shared by most components, so a change there must be
    a separate item with its own full re-calibration; the calibration high band already lowers conf where it has a table.
  evidence: 'Numbers from the after.json sweep; test_r5_known_limits_are_recorded.'
- id: version
  what: version 0.2.0 -> 0.3.0 (same date); drag and pistol calibration tables re-fit on the patched detectors (fix2 harness, 120 / 87 events, same fit_isotonic).
  why: Parameters, rules and outputs changed; the drag high band rose (0.50-0.69 -> 0.67-0.84) because its false positives are gone.
  evidence: test_yaml_contract, test_f10_calibration_tables_and_application.

changes_loop4:
# Loop 4 = calibration on real tracking: SportVU, 3 NBA 2015-16 games (private research data; only aggregate rates
# and anonymised descriptions here), sportvu.py chunks = clock-running stretches in the attacked-rim frame, sigma told
# 0.15 m, 6855 s of play. Truth: play-by-play possessions matched on (period, clock) overlap (>= 8 s inside a chunk,
# offense team of the chunk). Rates are per 48 min (both teams of the chunk's offense side). Every change was re-run
# on the 3 games clean and with --noise 0.3 and on the synthetic harness (116 scenario rows x 10 seeds x sigma_p
# 0.2 / 0.3 / 0.5; identical to the loop 1-3 tester and confirmer harnesses). Synthetic totals loop 3 -> loop 4:
# TP 731 / 707 / 578 -> 733 / 710 / 604, FP 0 / 5 / 30 -> 0 / 5 / 24 (no row lost a TP).
- id: L1-defence-aware-holder
  what: event_lattice holder (_H) is None at a frame where the nearest defender is nearer to the ball than the attacker by def_margin_m + def_noise_k x pair sigma (possession_split params).
  why: >-
    mvlib's holder is the nearest attacker within HOLD_R; on real clips the defence's own possessions, steals and
    defensive rebounds were offensive holds, so windows, ISOs and transfers ran through the other team's ball.
  evidence: 'Together with L2 (not separable: L2 uses the same control test). Real: set_window 103 -> 200 / 48 before L3; test_l1_l2_possession_split.'
- id: L2-possession-split
  what: detect_all cuts a clip at every defensive-control run >= def_control_min_s and runs every detector per offense span (sub_scene, shift_event); spans < min_span_s or with < min_control_s of offensive holds are dropped. A single-possession clip runs unchanged. sub_scene carries ball_z.
  why: >-
    One clip = one chance (CE-R01) is the engine's contract; SportVU stretches hold 2-6 possessions of both teams,
    so set windows merged possessions (close reason clip_end) and the first window hid the later ones.
  evidence: >-
    PBP, offense-team half-court possessions: set_window recall 0.51 -> 0.80, precision 0.76 -> 0.90 (all chunks);
    on chunks whose frame agrees with ball control (frame check >= 0.6) recall 0.60 -> 0.97, precision 0.93 -> 0.98.
    Synthetic unchanged (every scene is one span). test_l1_l2_possession_split.
- id: L3-offense-retreat-and-lone-short-window
  what: set_window yields no window for a span whose window would close because an attacker carries / passes the ball back over half court (retreat_holder_s); a lone half-court window shorter than min_window_s is dropped.
  why: A backcourt return by the offense itself is a violation in a real frame and, on SportVU, the signature of a stretch whose attacked end belongs to the other team; sub-second windows were touches before a shot, not sets.
  evidence: 'Real: set_window 190.7 -> 165.1 / 48 with PBP precision 0.90 kept; synthetic unchanged; test_l3_offense_retreat_yields_no_window.'
- id: L4-iso-half-court-hold-and-post-up
  what: detect_iso uses only the longest frontcourt stretch of a holder run and rejects holds starting inside post_max_r_m (median r over post_window_s).
  why: Bringing the ball up with teammates spread out passed every ISO test, and post-ups are their own Synergy play type.
  evidence: 'Real: iso 49.6 -> 23.9 / 48; test_l4_l5_iso_needs_a_half_court_attacking_hold.'
- id: L5-iso-attacks
  what: detect_iso needs the handler within attack_max_d3_m of the three-point line at some frame of the hold.
  why: A guard holding the ball 2-3 m behind the arc while the play is called is not an isolation (sampled real ISOs before the fix were mostly this).
  evidence: >-
    Real: iso 23.9 -> 16.4 / 48 (now 14.7 after L7-L8 removed screen evidence; 11.8 at --noise 0.3); every ISO lies in an
    offense possession (PBP precision 1.00); 13-16 % of offense half-court possessions hold one (Synergy terminal ISO
    ~7-9 % of plays; a non-terminal ISO component is more frequent). test_l4_l5_iso_needs_a_half_court_attacking_hold.
- id: L6-set-by-speed-bound
  what: per-frame P(screener set) = max(P(stationary), P(speed < scr_set_max_mps)); the set window may end up to scr_set_lookback_s before the closest approach.
  why: >-
    The MP-09 stationarity test asks whether any motion is significant, so with precise tracking a screener shuffling
    at 0.4-0.8 m/s failed it while the same screen passed at sigma_p 0.3-0.5; real screeners set, then roll while the
    handler is still coming off.
  evidence: 'Real: pnr_location 13.0 -> 35.3 / 48 (but see L7); synthetic TP +13 / FP -4 at sigma 0.5 (stagger_triple, pistol, ram, segment rows).'
- id: L7-ball-screen-location
  what: an on-ball screen needs the screener at r >= scr_on_min_r_m and y <= HALF_Y + scr_on_max_past_half_m; otherwise the contact is dropped.
  why: >-
    Of 84 real on-ball screens after L6, 15 had the screener within 3 m of the rim (the 'handler' was a shooter or
    rebounder with the ball at the rim) and 34 were 2-12 m past half court (bring-up / inbound traffic); a ball screen
    is a half-court action set away from the rim.
  evidence: >-
    Real: pnr_location 35.3 -> 14.7 / 48; plausible share (the handler's defender passes within 1.5 m of the screener
    and was within 2.5 m of the handler 1 s before) 0.69 -> 0.89. Synthetic unchanged. The gap 3-5 m in the r histogram
    holds no events, so the 4.0 m value is not tuned to a count. test_l7_ball_screen_only_in_the_half_court_away_from_the_rim.
- id: L8-set-window-lookahead
  what: the screener's set window may also end up to scr_set_lookahead_s after t + scr_stat_post_s.
  why: >-
    The screen acts on the user's defender, who trails the user by 0.2-0.4 s. 147 real candidates (handler with the
    ball passes a teammate within 2 m, his defender passes within 1.5 m of that teammate) were 31 detections; 98 misses
    failed only the set test, typically a screener sprinting in at 2-4 m/s who plants (0.3-0.6 m/s) just as the
    handler passes, then rolls.
  evidence: >-
    Real: pnr_location 14.7 -> 24.8 / 48 with plausible share 0.88; stable under noise (--noise 0.3: 24.4; before
    L7-L8 it moved 35.3 -> 45.0). Synthetic sigma 0.5: TP 587 -> 604, FP 26 -> 24 (name_14high_mirror, set_14high_pnr,
    spain, departure rows), 0.2 / 0.3 unchanged or +1. test_l6_l8_screener_planting_as_the_handler_passes.
- id: L9-motion-in-half-court-windows
  what: detect_motion counts off-ball screens and cuts per half-court set window (segment_kind halfcourt) instead of over the whole clip.
  why: Four players sprinting up the floor register as four CUTs, so the transition part made almost every real possession 'motion'.
  evidence: 'Real: motion 86.5 -> 34.4 / 48 (--noise 0.3: 93.7 -> 41.6), PBP precision 0.97 -> 0.99; synthetic unchanged; test_l9_motion_counts_half_court_actions_only.'
- id: L10-dho-rim-and-backcourt
  what: no DHO primitive when the ball is within dho_min_r_m of the rim at the catch; get / dho_chain use only PASS / DHO with the ball at y <= HALF_Y + max_past_half_m.
  why: 20 of 20 sampled real dho_chains were tip / rebound scrums at the rim (ball y < 2 m) or outlet / inbound hand-offs 10-12 m past half court.
  evidence: 'Real: dho_chain 8.8 -> 0.8 / 48 (--noise 0.3: 15.1 -> 0.8), get 3.4 -> 1.7; synthetic unchanged; test_l10_no_dho_at_the_rim_and_no_backcourt_chain.'
- id: L11-known-limits
  what: recorded, not changed.
  why: >-
    (1) sportvu.py's default frame (nearest_player) puts the attacked rim at the wrong end in about 22 % of chunks;
    with realdata --frame team_ends set_window precision / recall on offense possessions are 1.00 / 0.98. (2) Only the
    chunk's offense team is analysed, so the other team's possessions in the same stretch are lost (all-team recall
    0.49-0.61). (3) motion still rests on the proxy CUT (any off-ball move >= 2 m/s over >= 3 m); 32-38 % of offense
    half-court possessions read as motion. (4) transition_early windows (any lattice event before the half-court open)
    exist in ~60 % of possessions and each gets a name, so name / style rates are ~1.6 per possession. (5) drag 5.5 ->
    3.4 / 48 under --noise 0.3 (sampled clean drags were plausible trailer screens).
  evidence: Owned by sportvu.py / realdata.py (1, 2) and the cuts family (3); (4) is a design question for the window contract.
- id: version
  what: version 0.3.0 -> 0.4.0, date 2026-10-23.
  why: Parameters, rules and detect_all changed.
  evidence: test_yaml_contract.

changes_loop5:
# Loop 5 = finishing pass on real tracking (same 3 SportVU 2015-16 games, private; aggregates only, 6855 s of play, sigma
# told 0.15 m). realdata.py now defaults to --frame team_ends (offense = the team attacking the chunk's end in this
# half). Re-measured loop-4 code, per 48 min, clean / --noise 0.3 / --noise 0.5: nearest_player (loop-4 report)
# set_window 165.5 / 173.5 / 175.6, pnr_location 24.8 / 26.0 / 18.1, iso 14.7 / 9.2 / 9.7, drag 5.5 / 4.2 / 4.2,
# motion 34.9 / 39.1 / 39.1; team_ends set_window 194.5 / 196.6 / 196.6 (half-court 122.3 / 122.7 / 124.8),
# pnr_location 34.0 / 31.5 / 22.7, iso 18.1 / 12.2 / 10.9, drag 6.7 / 5.0 / 4.6, motion 41.6 / 45.4 / 45.8,
# get 2.5 / 4.2 / 3.4, dho_chain 0.8 / 1.7 / 2.1; half-court set_window PBP precision 1.00 / 0.99 / 0.99, offense
# possession coverage 0.99 / 0.98 / 0.98. Every change below was re-run clean / 0.3 / 0.5 on real data and on the
# synthetic harness (116 rows x 10 seeds x sigma_p 0.2 / 0.3 / 0.5, md5-identical to the loop 1-4 harnesses, plus
# 4 new iso_dribble rows): TP 733 / 710 / 604 -> 733 / 710 / 609, FP 0 / 5 / 24 -> 0 / 5 / 24, no row lost a TP or
# gained an FP. Churn = clean events with no overlapping event of the same actors in the noisy run.
- id: C1-iso-noise-churn
  what: >-
    detect_iso: the hold extends over holder-less frames with the ball within HOLD_R + hold_ext_k x sigma_dist(holder,
    ball) that does not leave him faster than catch_max_ball_mps (_extend_holds); frontcourt flickers <= fc_bridge_frames
    do not cut the stretch; off-ball actions exclude the handler's own moves, are counted per teammate, and a proxy CUT
    counts only when P(speed > move_enter_mps) >= cut_peak_p at some frame (_clear_cut).
  why: >-
    Tracking 43 clean ISOs through --noise 0.5: 7 lost to min_hold_s (noisy dribble outside the hard 1 m radius;
    hold shrink median 0.10 s, p90 0.88 s; 3.0-3.6 s holds kept >= 3 s only 66 %), 8 to the off-ball count (11 of
    19 counted actions had no clean counterpart: the handler's own move read as a CUT when holder dropouts left him
    under half its frames, a relocation split in two, a 1.6-2.1 m/s walk lifted over the 2 m/s entry), the rest to
    marginal clear / spaced values (0.64-0.75 vs 0.7) that no noise model fixes.
  evidence: >-
    Real iso 18.1 / 12.2 / 10.9 -> 21.8 / 19.3 / 18.1 per 48 (retention at 0.5: 0.60 -> 0.83), PBP precision 1.00
    at every level; churn lost 18 / 22 of 43 -> 14 / 23 of 52 (rate fixed, event churn near the gates remains).
    Sampled 20 clean ISOs: 15 with the handler holding >= 0.9 of the hold, frontcourt, defender on him and no
    teammate within 1.4 m. New synthetic rows iso_dribble_3.1 / 3.3 / 3.6 (dribbled ball, holds 3.1-3.6 s):
    3.3 s at sigma 0.5 6/10 -> 10/10, all 10/10 at 0.2 / 0.3 / 0.5; iso_dribble_neg_2.7 0 FP.
    test_c1_iso_short_dribbled_hold_under_noise.
- id: C2-pnr-location-noise-churn
  what: >-
    Ball screens: contacts also from the widened gate scr_contact_m + scr_on_contact_k x sigma_dist, a widened
    contact (minimum beyond scr_contact_m) only when the handler's defender (_defender_meets) comes within
    scr_on_wide_def_m of the screener; on-ball uses the holder with hysteresis (_soft_holder, on_ball_hold_ext_k);
    the ball-screen contact probability uses scr_on_pc_k x sigma_dist. Off-ball screens are unchanged.
  why: >-
    Of 81 clean ball screens 42 were lost at --noise 0.5: 17 with the noisy minimum distance at 1.22-1.53 m (hard
    1.2 m gate), 12 by the set test, 10 because the hard-radius holder was empty around the screen (dribble under
    noise), 2 screener-holds. The CA-RTS posterior sigma understates the smoothed error of the AR(1) noise (measured
    rms 0.25-0.34 m per axis at 0.5 against sqrt(var_p) 0.10 m), so the widening is 2 sigma_dist; the defender
    requirement keeps the synthetic 1.5 m pass-by negative (pnr_neg_no_contact) at 0 FP, which a widening alone
    turned into 4 / 5 FP of 10.
  evidence: >-
    Real pnr_location 34.0 / 31.5 / 22.7 -> 37.0 / 41.2 / 36.1 per 48 (0.5 / clean 0.67 -> 0.98); plausibility
    (the handler's defender meets the screener within 1.5 m, clean positions) 0.95 / 0.92 / 0.91 -> 0.95 / 0.94 /
    0.93; PBP precision 0.99; churn lost 22 / 42 of 81 -> 12 / 27 of 88. Variants tried: debiased set speed (0.5:
    67 events, lost 39), on-ball hysteresis alone (69, lost 33), widening without the defender (FP above).
    Synthetic sigma 0.5: pnr_side_L 5 -> 6, pnr_slot_stepup_L 8 -> 9, pistol_screen 9 -> 10, ram_right 9 -> 10,
    ram_right_L 8 -> 9, no FP change. test_c2_ball_screen_noise_widened_contact_needs_the_defender.
- id: C3-set-window-putback-scramble
  what: set_window drops a first half-court window shorter than scramble_max_s that opens within scramble_lookback_s of the ball within scramble_rim_r_m of the rim (XY default; ball_z only with use_ball_z, off).
  why: >-
    Under team_ends the loop-4 wrong-team short windows are gone (wrong-team half-court windows 1 / 2 / 2 of
    ~290; short < 2 s windows all correct-team). Of 18 clean windows < 2.5 s, 16 are quick shots after a
    transition window (open at r 5.5-11.6 m) and 2 open on a ball at the rim (r 0.3-2.7 m, ball_z 3.4-3.6 m): putback
    scrambles (CE-R01 / state_machine K08: an offensive-rebound chance is a scramble, not a set); at 0.5, 5 such.
    Raising min_window_s to 2 s would have dropped 9 correct quick-shot windows. ball_z agreed with XY on every
    rim case, so the XY test is the default and ball_z stays optional.
  evidence: 'Real half-court windows 122.3 / 122.7 / 124.8 -> 121.4 / 120.6 / 122.3 per 48, PBP precision 1.00 / 0.99 / 0.99 and possession coverage 0.99 / 0.98 / 0.98 unchanged; synthetic set_window rows unchanged; test_c3_putback_window_is_no_set.'
- id: C4-dho-chain-ball-supported-link
  what: a dho_chain link needs the ball nearer to the receiver than to the giver by >= chain_min_lead_m (median over the receiver's holder run, _ball_lead).
  why: >-
    Under team_ends the 2 clean chains are A -> B -> A hand-backs that the ball supports (B holds 1.2-1.3 s, ball
    1.1 m nearer B); the doubtful loop-4 case came from the nearest_player frame. Under noise one chain had the
    two attackers 0.45 m apart with the ball 0.09 m nearer the giver during the 'receiver's' run: label flicker.
    The receiver already holds >= hold_min_frames after each DHO, so the suggested hold test would not separate it.
  evidence: 'Real dho_chain 0.8 / 1.7 / 2.1 -> 0.8 / 1.7 / 1.7 per 48 (all 11 inspected chains listed by holder sequence; the removed one is the flicker); synthetic dho_chain rows unchanged; test_c4_dho_chain_needs_a_ball_supported_holder_change.'
- id: C5-motion-from-cuts-family
  what: detect_all(scene, cuts=...) and detect_motion(scene, cuts=...) take the cuts family's events; motion then counts cut events of motion.cut_kinds (default [cut], the generic CU.P2 cut) plus the proxy off-ball screens; without cuts the proxy CUT is the fallback; attrs.cut_source records the source.
  why: The proxy CUT (any off-ball move >= 2 m/s over >= 3 m) rises with noise; the cuts family's cut has its own noise-scaled tests.
  evidence: >-
    Real (cuts family run first on every chunk, scratch runner): motion proxy 41.6 / 45.4 / 45.8 vs cuts 34.4 / 32.3
    / 28.1 per 48; PBP precision 0.98 / 0.99 / 0.99 vs 0.99 / 1.00 / 1.00; offense-possession coverage 0.39 / 0.43
    / 0.44 vs 0.33 / 0.31 / 0.27; churn lost 15 / 21 of 99 vs 18 / 33 of 82 (the cuts family's own cut rate falls
    477 -> 445 -> 437 per 48 with noise). 71 of 82 cuts-based windows are also proxy motion. The proxy stays the
    default until the families are wired in production. test_c5_motion_from_cuts_family_events.
- id: C6-transition-early-names
  what: >-
    name and style events are emitted for half-court set windows only; transition_early windows keep their
    set_window (attrs.name 'transition_early') and segment events (name 'transition_early'); the 'Early: ' prefix
    is no longer rendered.
  why: Decision by the lead (L11 item 4); every transition_early window was named, ~1.6 names per possession.
  evidence: 'Real name / style 194.5 / 196.6 / 196.6 -> 121.4 / 120.6 / 122.3 per 48 = the half-court windows (one per half-court possession: possession coverage 0.99 / 0.98 / 0.98); test_c6_transition_windows_carry_a_fixed_name.'
- id: C7-drag-noise
  what: detect_drag uses the C2 ball-screen contact rule (widened gate with the defender requirement, holder with hysteresis, scr_on_pc_k).
  why: Of 12 drags lost at --noise 0.3 / 0.5, 9 had the noisy handler-trailer minimum at 1.21-1.73 m (the same hard 1.2 m gate as C2) and 1 an empty holder; the drop was not drag-specific.
  evidence: 'Real drag 6.7 / 5.0 / 4.6 -> 7.6 / 6.7 / 8.0 per 48, PBP precision 1.00; churn lost 5 / 7 of 16 -> 4 / 6 of 18; synthetic drag rows unchanged; test_c7_drag_uses_the_ball_screen_contact_rule.'
- id: C8-known-limits
  what: recorded, not changed.
  why: >-
    (1) iso event churn stays ~45 % at 0.5 (lost 23 of 52): clean ISOs sit near the mean clearance / spacing gates.
    (2) mvlib CA-RTS var_p understates the smoothed error of AR(1)-correlated noise ~2-3x at --noise 0.3-0.5, so
    every sigma-scaled gate is under-widened; the k factors here (2.0-2.5) compensate locally. (3) Possession spans
    split slightly more under noise (328 -> 344 spans at 0.5; adding the ball variance to the defender gate gives
    341, not adopted). (4) The proxy remains the motion default.
  evidence: Measured in the loop-5 scratch runs (aggregates above).
- id: version
  what: version 0.4.0 -> 0.5.0, date 2026-10-23.
  why: Parameters, rules, outputs (names / styles per half-court window) and the detect_all signature changed.
  evidence: test_yaml_contract.

changes_loop6:
# Loop 6 = finishing pass (same 3 SportVU 2015-16 games, private; aggregates only, 194 chunks, 6855 s of play, sigma told
# 0.15 m, realdata.py default --frame team_ends). Loop-4 code re-measured per 48 min, clean / --noise 0.3 / 0.5:
# nearest_player (loop-4 report) set_window 165.5 / 173.5 / 175.6, pnr_location 24.8 / 26.0 / 18.1, iso 14.7 / 9.2 /
# 9.7, drag 5.5 / 4.2 / 4.2, motion 34.9 / 39.1 / 39.1; team_ends set_window 194.5 / 196.6 / 196.6 (half-court 122.3 /
# 122.7 / 124.8), pnr_location 34.0 / 31.5 / 22.7, iso 18.1 / 12.2 / 10.9, drag 6.7 / 5.0 / 4.6, motion 41.6 / 45.4 /
# 45.8, dho_chain 0.8 / 1.7 / 2.1. Loop-5 code (0.5.0) team_ends: half-court windows 121.4 / 120.6 / 122.3,
# pnr_location 37.0 / 41.2 / 36.1, iso 21.8 / 19.3 / 18.1, drag 7.6 / 6.7 / 8.0, dho_chain 0.8 / 1.7 / 1.7.
# Every change below was re-run on real data (clean / 0.3 / 0.5, official realdata.py) and on the synthetic harnesses
# at sigma_p 0.2 / 0.3 / 0.5: the 116-row standard set (md5-identical in test_, confirm_, confirm2_, fix2_, real_,
# confirm4_ and confirm5_composition) TP 733 / 710 / 609 and FP 0 / 5 / 24, unchanged, no row changed; the loop-5
# iso_dribble rows; the 18 loop-5 adversarial scenes (also at sigma_p 0.05). Churn = clean events with no overlapping
# event of the same actors in the noisy run (1 s slack); noisy-only = noisy events with no clean counterpart.
- id: C3-set-window-dead-ball-inbound
  what: >-
    _rim_before ignores lookback frames with the ball out of bounds (y < END_Y or |x| > SIDE_X), and returns False
    when an attacker holds the ball in the lookback while standing out of bounds (median position, _inbound_in): a
    dead-ball inbound opens a set, never a putback scramble (set_window.scramble_inbound_excl).
  why: >-
    The loop-5 putback rule read a baseline out-of-bounds inbounder 2.0 m from the rim as a ball at the rim and dropped
    the quick-hitter window (adversarial adv_sw_pos_blob_quick_shot 10/10 -> 0/10 at every sigma; from the lane corner,
    3.2 m out, 10/9/7/4 at 0.05 / 0.2 / 0.3 / 0.5 because noise pulls the ball inside 3 m). The frame test alone
    leaves 9/10 at 0.5 (noise moves the ball back over the line), the inbound test makes it 10/10.
  evidence: >-
    Synthetic: blob_quick_shot 0/0/0/0 -> 10/10/10/10 and blob_corner 10/9/7/4 -> 10/10/10/10 (sigma 0.05 / 0.2 /
    0.3 / 0.5); the putback negatives stay rejected (sw_neg_putback_block FP 0/0/0/1, unchanged; loop-5 test_c3
    putback scene still no set); oreb_reset_long 10/10. Real: half-court windows 121.4 / 120.6 / 122.3 per 48,
    identical event by event to loop 5 (the 3 games hold no short window that opens on a baseline inbound; confirm5
    found 2 of 290 first windows with an out-of-bounds ball in the lookback, both longer than 6 s), PBP precision
    0.997 / 0.993 / 0.993. test_c3_loop6_baseline_inbound_is_a_set_not_a_scramble.
- id: C7-drag-widened-contact-needs-reach
  what: >-
    detect_drag: a widened contact (minimum beyond scr_contact_m) also needs p_below(d, scr_contact_m, wide_reach_k
    x sigma_dist) >= wide_reach_p (P that the trailer reached the handler; 1.0 x sigma_dist, 0.25), besides the
    handler's defender meeting him (now the sustained matchup, C2).
  why: >-
    Of all widened drag candidates (defender check off) 3 / 8 / 11 at clean / 0.3 / 0.5, only 2 had a clean
    handler-trailer minimum <= 1.2 m, 5 had 1.24-1.31 m and 15 had 1.39-1.87 m (trailers running past). The loop-5
    defender check kept 12 of the 22 (clean minima 1.06-1.84 m): the noisy defender-trailer minimum of a true 1.3 m
    reads <= 1.2 m. The reach probability separates them: the 13 candidates with a clean minimum >= 1.39 m have P
    0.02-0.25; reach >= 0.25 keeps 7 (clean 1.09-1.66 m) and with the defender check 1 (clean 1.09 m). The other
    plausible candidate (clean 1.06 m, noisy 1.49 m, P 0.06) is lost.
  evidence: >-
    Real drag 7.6 / 6.7 / 8.0 -> 6.7 / 5.5 / 5.9 per 48 (16 / 13 / 14 events; loop 4 16 / 12 / 11), PBP precision
    1.00; noisy-only drags 2 / 7 -> 2 / 3 at 0.3 / 0.5, clean drags lost 4 / 6 of 18 -> 5 / 5 of 16 (retention at 0.5
    0.67 -> 0.69). The 10 removed drags (2 clean, 3 at 0.3, 5 at 0.5), judged on clean raw positions: clean minimum
    1.03 m (1, the only one inside scr_contact_m), 1.27-1.39 m (3), 1.59-1.88 m (6); with the confirm5 criterion
    (minimum <= 1.6 m, defender at the screener <= 1.5 m) 5 of 10 plausible. Synthetic: adv_drag_neg_rimrun_1.7m FP
    0/0/3/4 -> 0/0/0/2 (= loop 4); the loop-5 1.26 m wide-drag positive (trailer outside scr_contact_m) 10/10/7 ->
    8/8/6 of 10 at 0.2 / 0.3 / 0.5 (wide_reach_p 0.2: 9/9/6 with rim-run FP 3 at 0.5; 0.3: 6/7/6), standard drag rows
    unchanged. test_c7_loop6_widened_drag_contact_needs_the_trailer_to_reach_the_handler (and test_c7 seeds updated).
- id: C2-handler-defender-sustained-matchup
  what: >-
    _handler_defender: the handler's defender for a widened ball-screen / drag contact is the defender with the lowest
    mean distance to him over [t - scr_on_def_match_s, t - scr_on_def_match_end_s] (3.0 s to 0.5 s before t), kept
    when his mean distance over the last scr_on_def_lookback_s is <= scr_on_def_max_m; detect_all(scene,
    matchup=...) takes the defense family's per-frame matchup (e.g. defense.joint_top1), and then the defender matched
    to the handler on most frames of [t - 3 s, t] is used.
  why: >-
    The 1 s nearest picked the screener's hedging defender, who steps toward the handler before the pass-by, over the
    handler's own sagging defender, and that defender met the screener trivially (adversarial hedger negative: FP
    0/1/2/3 vs loop 4 0/0/2/3). A first version capped the sustained mean itself at 2.4 m; that removed 13
    ball screens (2 / 7 / 4 at clean / 0.3 / 0.5), 12 of them with the same defender under both windows (handler
    coming from far away) and was
    replaced by the recent-window cap.
  evidence: >-
    Real pnr_location 37.0 / 41.2 / 36.1 -> 37.0 / 40.8 / 36.1 per 48; the one removed event (0.3) is a hedge case: the
    1 s defender was the screener's own (mean 1.8 m to the screener over 3 s), the clean handler-screener minimum
    1.34-1.40 m and the handler's sustained defender never came within 3 m of the screener. PBP precision 0.99, churn
    unchanged (lost 12 / 25 of 88, noisy-only 22 / 25 -> 21 / 25). Synthetic: hedger FP at 0.2 1 -> 0 (the remaining
    2 / 3 at 0.3 / 0.5 are hard-gate contacts, noisy minimum 0.95-1.19 m, equal to the passby_def_away control);
    pnr_pos_wide1.3 7/7/7 and pnr_pos_contact_with_hedge 10/10/10 unchanged; standard pnr rows unchanged.
    test_c2_loop6_handler_defender_is_the_sustained_matchup.
- id: C1-iso-soft-pass-hold-and-retention
  what: >-
    detect_iso trims each (extended) hold where the ball starts leaving the holder (_trim_flights: radial speed v_r =
    d/dt dist(ball, holder) > release_vr_mps over the run's final >= release_min_frames frames) and where the arriving
    ball has not yet slowed under it (v_r < -release_vr_mps over the first frames); the attack test keeps the trimmed
    catch / release frames (a catch on the arc is an attack position).
  why: >-
    A slow pass (4.3 m/s, under catch_max_ball_mps 6) is within HOLD_R for ~0.25 s at each end and inside the loop-5
    hold hysteresis even longer, so 2.6-2.8 s holds read as >= 3 s ISOs (adversarial softpass negatives FP 10/10 at
    every sigma, loop 4 10/9/9/6). Trimming only at run boundaries leaves a dribble's outward bounce mid-hold alone.
    A first version applied every gate to the trimmed hold; 1 clean 5.2 s ISO then failed the attack test (the
    handler was near the arc only at the catch), hence the attack window.
  evidence: >-
    Synthetic: softpass_hold2.6 FP 10/10/10/10 -> 0/0/0/0, softpass_hold2.8 10/10/10/10 -> 0/0/0/2 (sigma 0.05 /
    0.2 / 0.3 / 0.5); iso_dribble_3.3 / 3.6 10/10 at every sigma, iso_dribble_3.1 10/10/10 -> 10/10/9 (a 3.1 s hold
    with 0.1 s margin), dribble_3.4_def and hold6 10/10, all iso negatives 0 FP. Real iso 21.8 / 19.3 / 18.1 -> 19.7 /
    18.1 / 18.1 per 48, PBP precision 1.00. Clean: 7 removed, 2 added; 6 of the removed are 3.07-3.20 s holds whose
    first / last 0.1-0.3 s are the arriving / leaving pass (v_r -5 .. -2 and +2 .. +6 m/s), i.e. holds under
    min_hold_s once the flight frames are out (5 of the 7 otherwise pass the confirm5 core criteria), 1 is a 4.1 s
    hold whose trimmed clearance falls under min_clear_conf. Honest retention (event level, not a rate ratio): clean
    ISOs kept at 0.3 / 0.5 were 38 / 29 of 52 (0.73 / 0.56) in loop 5 and are 35 / 31 of 47 (0.74 / 0.66) now;
    noisy-only ISOs 8 / 14 -> 8 / 12. The loop-5 wording 'retention at 0.5: 0.60 -> 0.83' was the rate ratio
    18.1 / 21.8; event retention was 0.49 -> 0.56 in loop 5. Of the 28 ISOs added or removed at any noise level,
    judged on clean raw positions with the confirm5 criteria: added 6 of 10 plausible, removed 8 of 18 plausible.
    test_c1_loop6_soft_pass_frames_are_not_hold.
- id: C4-dho-chain-minimum-hand-back
  what: a dho_chain link needs the receiver's holder run containing the DHO to last >= chain_min_hold_s (0.4 s, _receiver_run_s).
  why: >-
    The noisy-only chain at --noise 0.3 was A -> B -> A with A's last run 0.30 s (on clean positions B kept the ball:
    label flicker that the loop-5 lead test let through). The receiver runs of the clean chain links last 0.53-2.84 s.
  evidence: >-
    Real dho_chain 0.8 / 1.7 / 1.7 -> 0.8 / 1.3 / 1.7 per 48 (2 / 3 / 4 events; the removed one is that flicker chain;
    the 2 clean chains are kept at every level, noisy-only 2 / 2 -> 1 / 2; the remaining noisy-only
    chains are real holder changes ~2.5 s apart, boundary churn). Synthetic: chain rows and adv_chain_pos_tight_giver
    10/10 unchanged. test_c4_loop6_short_hand_back_is_no_chain_link.
- id: C8-known-limits-and-decisions
  what: recorded; motion source decided, no code change.
  why: >-
    (1) iso event churn: 12 / 16 of 47 clean ISOs still have no noisy counterpart at 0.3 / 0.5; the trimmed holds now
    put the 3.0-3.2 s holds that churned under min_hold_s on both sides, and the rest sit near the clearance /
    spacing gates (marginal values, no bias a noise model removes). (2) drag churn: 5 / 5 of 16 lost at 0.3 / 0.5,
    noisy-only 2 / 3; with 11-16 events per run nothing finer is measurable. Hard-gate noise contacts remain (a true
    1.7 m pass-by reads 0.9-1.1 m in 2 of 10 seeds at 0.5, as in loop 4). (3) Motion source: motion uses the cuts
    family's cut events whenever detect_all / detect_motion receive them, and the proxy CUT only as the fallback; this
    stays. The proxy rate rises with noise (41.6 / 45.4 / 45.8 per 48, noisy-only windows 24 / 31) because position
    noise lifts relocations over the 2 m/s CUT entry, the cuts family's cut has its own noise-scaled tests and owns
    the cut definition; its recall loss under noise (loop 5: motion 34.4 / 32.3 / 28.1, cut rate 477 -> 437 per 48)
    is an upstream issue of the cuts family, not a reason to keep a proxy composition would have to maintain. The
    official realdata.py run still gets the proxy because it does not pass cuts (upstream wiring). (4) The k factors
    (2.0-2.5 sigma_dist) and the new thresholds were measured on these 3 games with sim AR(1) noise.
  evidence: Measured in the loop-6 scratch runs (aggregates above); motion numbers from the loop-5 cuts-wired runs (C5).
- id: version
  what: version 0.5.0 -> 0.6.0, date 2026-10-23.
  why: Parameters (set_window.scramble_inbound_excl; event_lattice.scr_on_def_match_s, scr_on_def_match_end_s, scr_on_def_max_m; drag.wide_reach_k, wide_reach_p; iso.release_vr_mps, release_min_frames; get_dho_chain.chain_min_hold_s), rules and the detect_all signature (matchup=) changed.
  evidence: test_yaml_contract.

changes_loop7:
# Loop 7 = regression-only finishing pass (same 3 SportVU 2015-16 games, private; aggregates only, 194 chunks, 6855 s,
# sigma told 0.15 m, realdata.py default --frame team_ends). Loop-4 code (0.4.0 tree) re-run clean, per 48:
# nearest_player set_window 165.5, pnr_location 24.8, iso 14.7, drag 5.5, motion 34.9, get 1.7, dho_chain 0.8 (= the
# loop-4 report); team_ends 194.5, 34.0, 18.1, 6.7, 41.6, 2.5, 0.8 (0.3 / 0.5 from the confirm5 loop-4-tree runs:
# set_window 196.6 / 196.6, pnr 31.5 / 22.7, iso 12.2 / 10.9, drag 5.0 / 4.6). Every change was re-run on real data
# (clean / --noise 0.3 / 0.5, official realdata.py) and on every synthetic harness at sigma_p 0.2 / 0.3 / 0.5: the
# 116-row standard set (scenarios md5 50d06ada in test_, confirm_, confirm2_ h_test / h_confirm, real_ and confirm4_;
# there is no confirm3_composition) TP 733 / 710 / 609, FP 0 / 5 / 24, no row changed; the loop-5 cal harness
# (360 rows incl. iso_dribble); the 18 loop-5 and 26 confirm6 adversarial scenes (also at sigma_p 0.05).
- id: C3-inbound-needs-sigma-margin-and-dead-ball
  what: >-
    _inbound_in: over the holder's whole inbound hold (his holder runs touching the lookback, _run_frames), the ball
    median must be out of bounds (dead-ball evidence: the ball held outside; or scene.clock_stop_start, an optional
    hook nothing sets yet) and the mean of the holder and ball medians beyond the line by inbound_oob_k (1.0) x
    0.5 hypot(sigma_holder, sigma_ball), each sigma the median per-frame calibrated K_CAL sqrt(var_p). _rim_before's
    out-of-bounds frame exclusion needs the ball beyond the line by inbound_oob_k x its own sigma.
  why: >-
    The loop-6 test took the holder's median over the lookback frames only - one frame when the window opens at clip
    frame 0 - with no margin, so an in-bounds offensive rebounder 0.15 m inside the baseline read out of bounds and his
    putback scramble became a set. Holder and ball are independent measurements of the inbound spot; the sigma of a
    median over a <= 1 s hold is not reduced by sqrt(n) because smoothed errors are correlated (synthetic rebounder:
    median error sd 0.15-0.18 m at sigma_p 0.5 vs per-frame 0.19-0.22 m). One sigma: at SportVU precision the margin is
    about the 5 cm line width (the line is out of bounds). Requiring holder AND ball each one sigma out (tried first)
    cost the BLOB inbounder 0.2 m behind the line 10 -> 2 of 10 at 0.5.
  evidence: >-
    Synthetic (sigma 0.05 / 0.2 / 0.3 / 0.5, FP or TP of 10): rebounder y -1.45 FP 0/1/1/4 -> 0/0/0/0, y -1.35 FP
    0/0/0/1 -> 0, y -1.0 and corner kick-outs 0; BLOB 0.2 m behind 10/10/10/10 -> 10/10/10/9, 0.7 m behind 10/10/10/8
    unchanged, loop-5 blob_quick_shot and blob_corner 10/10/10/10 -> 10/10/10/9 (the 0.5 misses read the inbound
    within 0.01 m of the margin), putback_block FP 0/0/0/1 and oreb_reset_long 10/10 unchanged. Real: half-court windows
    121.4 / 120.6 / 122.3 per 48, identical event by event (no short window opens on an inbound in these games).
    test_c3_loop7_inbounds_rebounder_near_the_baseline_stays_a_scramble.
- id: C1-iso-post-window-and-robust-flight-trim
  what: >-
    (a) The post-up window (median r over post_window_s) starts at the untrimmed hold start, like the attack test.
    (b) _trim_flights: release / arrival evidence is P(v_r beyond release_vr_mps) >= release_p (0.5) with sigma_vr =
    K_CAL sqrt(var_v(ball) + var_v(holder)); release_gap_frames (1) frames without evidence inside the stretch do not
    end it; for a flight faster than catch_max_ball_mps (6 m/s) the cut moves to where v_r crosses half the flight's
    radial speed (peak over the stretch and release_peak_s past the run edge), never into frames with the ball beyond
    HOLD_R and only when the restored frames fit in release_peak_s (0.2 s).
  why: >-
    (a) The trim moved the post window later and a short-corner back-down caught at r ~4.6 m (1 real clean event) slid out of it
    into an ISO. (b) The symmetric RTS smoother spreads a fast pass's velocity step over ~4-5 frames centred on the true
    catch / release; cutting at the first v_r > 2 m/s frame removed 3-5 held frames (true 3.25 s hold -> 2.97 s at
    sigma_p 0.5) - the half-speed point is the step's centre. A soft pass's flight is in the run itself, so below
    catch_max_ball_mps the first-evidence cut stays; a ramp longer than the step width is the ball really slowing into
    the hands (1 real catch at 0.5: -6 -> -2 m/s over 17 frames; without the limit the hold took in an off-ball action
    and a clean ISO was lost). A frame-level threshold raised with sigma (release_p 0.7 / 0.84) recovered the fast pass
    too but put the 2.75 m/s soft-pass negatives back to 9-10 of 10, so it was not kept.
  evidence: >-
    Synthetic (sigma 0.05 / 0.2 / 0.3 / 0.5): fastpass_hold3.25 10/10/10/8 -> 10/10/10/10; iso_dribble_3.1 10/10/9 ->
    10/10/10 (0.2 / 0.3 / 0.5); verysoft_hold2.7 FP 0/4/7/9 -> 0/3/7/9; softpass 2.6 / 2.8, verysoft 2.85, soft
    3.25 / 3.4, dribble rows unchanged; hard_dribble_3.25 (2.0 and 1.3 Hz) stays 10/10/9/9 - its seed-1008 miss is a
    holder run that starts 0.27-0.84 s after the catch (the ball read 1.5 m from the dribbler at 12 m/s after the
    scene's dribble offset jumps in at the catch), leaving a 2.5-3.04 s run; the trim then only removes the true
    release flight (0.06 s), so it is a hold-radius / scene effect, not the trim. Real iso 19.7 / 18.1 / 18.1 -> 20.2 / 19.3 / 18.5 per 48 (48 / 46 /
    44 events), PBP precision 1.00 at lag 0 (0.979 / 1.0 / 1.0 at the 2.5 s lag). Clean: the short-corner back-down removed (post-up,
    catch r 4.51 m untrimmed), 2 added - 3.07 s and 3.00 s holds between fast passes (peak 7.7-11.9 m/s) that the
    loop-6 cut put at 2.97 / 2.87 s. Event retention at 0.3 / 0.5: 35 / 31 of 47 -> 37 / 30 of 48, noisy-only 8 / 12
    -> 9 / 14; the changed noisy events are min_hold_s and post_max_r_m boundary cases (a 2.97 s clean hold read 3.00 s;
    catches at r 4.54-4.66 m and 4.20 m that noise moves across 4.6 m), and 2 more clean ISOs are now kept
    at 0.3. 15 ISO events inspected on positions. test_c1_loop7_post_window_is_anchored_at_the_catch,
    test_c1_loop7_fast_pass_trim_cuts_at_the_half_speed_point, test_c1_loop7_release_stretch_tolerates_one_noisy_frame.
- id: C7-drag-band-is-the-physical-contact-width
  what: >-
    detect_drag: the contact gate is scr_contact_m + wide_body_m + scr_on_contact_k x sigma_dist and a widened contact
    (d > scr_contact_m) needs p_below(d, scr_contact_m + wide_body_m, wide_reach_k x sigma_dist) >= wide_reach_p
    (wide_body_m 0.2 m, wide_reach_p 0.5), besides the handler's defender meeting the screener.
  why: >-
    The loop-6 reach test p_below(d, 1.2, 1.0 sigma_dist) >= 0.25 is a band of 1.2 + 0.67 sigma_dist, ~1.2-1.34 m at
    the told sigma, which dropped plausible 1.27-1.39 m drags (one at 1.39 m with the defender into the screener at 0.05 m).
    A widened contact already requires the handler's defender at the screener, i.e. his body between the two
    attackers, so the handler's centre may pass one defender torso depth (~0.2 m chest depth) beyond the 1.2 m direct
    brush: the band edge is 1.4 m, a geometric width, with the noise allowance in the gate. p 0.5 because the minimum
    of a noisy distance is already biased low (true 1.6 m stops read 1.37-1.40 m at sigma_p 0.2). A set-screener
    requirement for widened contacts (tried) removed the extra rim-run FP but also 2 real moving drags (1 clean, 1 at
    0.5), so it was not kept.
  evidence: >-
    Synthetic (sigma 0.05 / 0.2 / 0.3 / 0.5): stop-drag 1.35 m TP 1/5/6/5 -> 10/9/8/5; loop-5 1.26 m wide drag 2/8/8/6
    -> 10/10/10/6; 1.0 / 1.15 m unchanged; rim run 1.45 m FP 0/0/0/3 unchanged; costs: 1.6 m stop with defender brush
    FP 0/0/2/3 -> 0/2/2/4, rim run 1.7 m with defenders 0/0/0/2 -> 0/0/0/3, test rim run 0/0/0/2 -> 0/0/0/3 (loop 5:
    0/2/4/4 and 0/0/3/4); standard drag rows unchanged. Real drag 6.7 / 5.5 / 5.9 -> 7.6 / 5.5 / 5.9 per 48 (18 / 13 /
    14): 2 clean drags added (minimum 1.39 m and 1.31 m, defender at the screener 0.05 / 0.66 m); noisy runs event-identical;
    clean drags kept at 0.3 / 0.5 11 / 11 of 16 -> 13 / 12 of 18, noisy-only 2 / 3 -> 0 / 2. PBP precision 1.00 at lag
    0; 17 of 18 at the 2.5 s lag (the 1.39 m drag lies 0-2.5 s after the possession change: right at lag 0 and 1.6 s). All 18
    clean and 19 noisy (0.5) drag candidates inspected; candidates at 1.58-1.62 m (rim runs, pass-bys) stay out.
    test_c7_loop7_widened_drag_band_is_the_physical_contact_width.
- id: C9-overfit-caveat
  what: recorded, no code change.
  why: >-
    Thresholds that rest on 1-22 real events from 3 games are provisional until validated on more games: loop 6
    chain_min_hold_s 0.4 (1 real event), scr_on_def_match_s / scr_on_def_match_end_s / scr_on_def_max_m 3.0 / 0.5 /
    2.4 (1 real event), wide_reach_k / wide_reach_p (22 widened candidates), release_vr_mps 2.0 and
    release_min_frames 3 (7 changed ISOs); loop 7 wide_body_m 0.2 and wide_reach_p 0.5 (justified from body geometry,
    then checked on 18 real drags), inbound_oob_k 1.0 (no real inbound event; synthetic only), release_gap_frames 1,
    release_half_peak and release_peak_s 0.2 (smoother step width, checked on 15 real ISOs). The loop-5 k factors
    (2.0-2.5 sigma_dist) compensate an under-stated var_p (mvlib CA-RTS vs AR(1) noise) that is not fixed here. The
    detect_all(matchup=) path is not exercised by realdata.py. Report PBP precision at lag 0 and at the 2.5 s lag.
    iso and drag event churn stay as documented in loop 6 C8.
  evidence: Counts as in the entries above and in changes_loop6.
- id: version
  what: version 0.6.0 -> 0.7.0, date 2026-10-23.
  why: Parameters (set_window.inbound_oob_k; iso.release_p, release_gap_frames, release_half_peak, release_peak_s; drag.wide_body_m; drag.wide_reach_p 0.25 -> 0.5) and rules (set_window, iso, drag) changed.
  evidence: test_yaml_contract.

changes_loop8:
# Loop 8 = final targeted pass (same 3 SportVU 2015-16 games, private; aggregates only, 194 chunks, 6855.4 s, sigma
# told 0.15 m, realdata.py default --frame team_ends). Loop-4 code (0.4.0 tree) re-run clean, per 48: nearest_player
# set_window 165.5, pnr_location 24.8, iso 14.7, drag 5.5, motion 34.9, get 1.7, dho_chain 0.8; team_ends 194.5,
# 34.0, 18.1, 6.7, 41.6, 2.5, 0.8 (= the loop-7 re-measure). 0.8.0 real data is event-identical to 0.7.0 at clean,
# --noise 0.3 and --noise 0.5 (2115 / 2150 / 2146 events). Synthetic: 10 seeds, Pool(4), sigma_p 0.2 / 0.3 / 0.5
# (adversarial sets also 0.05). No new 3-game-fitted constant.
- id: C3-holder-route
  what: >-
    set_window._inbound_in passes by either of two routes over the holder's whole inbound hold: (a) unchanged - the
    ball median out of bounds and the mean of the holder and ball medians beyond the line by inbound_oob_k x 0.5
    hypot(sigma_holder, sigma_ball); (b) new - the holder median alone beyond the line by inbound_oob_k x
    sigma_holder with the ball median no farther than inbound_reach_m (0.75 m, arm reach) in bounds. The duplicated
    comment line in _inbound_in is removed and the inbound_oob_k unit text now describes the code.
  why: >-
    An inbounder just behind the line holds the ball out in front of his body over the plane, so the ball is in
    bounds and is no measurement of where he stands; loop 7's ball-median-out clause lost that BLOB (holder 0.35 m
    behind, ball 0.10 m in: TP 10/10/10/10 on 0.6.0 -> 0/1/2/2). Making the holder clause only an alternative
    dead-ball evidence inside the mean test (tried first) recovered 10/9/8/6 at 0.05 / 0.2 / 0.3 / 0.5, because the
    forward ball drags the mean back over the line; the holder route needs no mean. A rebounder can pass route (b)
    only when noise moves his median more than one sigma beyond the line. inbound_reach_m is body geometry (half torso
    depth ~0.1 m + an extended arm to the ball centre ~0.65 m), not fitted.
  evidence: >-
    Synthetic TP/FP of 10 at sigma 0.05 / 0.2 / 0.3 / 0.5. Gains: c3_pos_blob_ball_over_line 0/1/2/2 -> 10/10/10/8;
    new holder 0.3 m behind with the ball 0.2 m in 0/0/0/1 -> 10/10/9/8 and 0.5 m behind 0/0/0/1 -> 10/10/10/7.
    Unchanged: rebounders y -1.35 / -1.45 FP 0/0/0/0, y -1.50 0/0/0/1, ball_swung_behind 10/0/1/1 (the 0.05 FP is
    old behaviour), y -1.0 and both sideline kick-outs 0; BLOB 0.2 m behind, blob_quick_shot and blob_corner stay
    10/10/10/9 (the 0.5 miss is seed 1004 in all three: the holder median reads 0.3 m inside its true spot, ~1.6
    median sigmas, so neither route can pass it without admitting the 0.15 m-inside rebounder). Cost: a new
    rebounder 0.1 m inside holding the ball 0.45 m forward FP 0/0/0/1 (0.7.0: 0/0/0/0). The 0.5 misses on the
    over-line rows are noise (seed 1004) or a late first holder frame (seed 1003, no inbound lookback at all). Real
    data: 273 / 253 holder evaluations in the scramble lookback (clean / 0.5), none passes either route (closest real
    holder 1.18 m inside the line clean, 0.36 m at 0.5; 16 nearest inspected per run), so no real event changes;
    there is still no real inbound behind this rule. Test: test_c3_loop8_inbounder_holding_the_ball_over_the_line_opens_a_set.
- id: C1-softin-fastout-boundary
  what: No code change. The soft-entry / fast-exit 2.85 s ISO false positive is recorded as a known boundary cost.
  why: >-
    The half-peak restore already acts per side, only on a side whose flight is faster than catch_max_ball_mps, and is
    capped at release_peak_s per side. On this scene it never moves the soft arrival edge (identical with and without
    release_half_peak in 30 of 30 runs) and puts the release cut at the true release frame (+-2 frames). The FP comes
    from the soft arrival side, which noise under-trims by 5-7 frames (0.17-0.23 s), so the run reads 2.90-2.97 s
    before and 3.00-3.04 s after the correct release restore. A per-hold cap on restored frames cannot remove it
    (1-3 frames restored here) without cutting the both-sides-fast holds that the restore exists for.
  evidence: >-
    c1_neg_softin_fastout_hold2.85 FP 0/0/1/2 (unchanged from 0.7.0); in the 3 FP runs the arrival edge is 5-7
    frames early and the release edge within 0-1 frame of truth. c1_pos_fastpass_hold3.15 10/10/10/9 and
    fastpass 3.25 10/10/10/10 unchanged.
- id: C7-reach-edge
  what: >-
    drag: the reach test of a widened contact is the measured minimum d <= scr_contact_m + wide_body_m
    (wide_reach_test, default true; false switches it off). wide_reach_k and wide_reach_p are removed.
  why: >-
    With wide_reach_p 0.5, p_below(d, 1.4, wide_reach_k x sigma_dist) >= 0.5 is exactly d <= 1.4 m and wide_reach_k had
    no effect, so the parameterisation claimed a noise model it did not have. A p != 0.5 was measured and is no net
    gain: p 0.6 stop-drag 1.35 m TP 9/8/5 -> 7/6/5 at 0.2 / 0.3 / 0.5 for 1.5 m FP 2/5/5 -> 2/3/5; p 0.4 1.5 m FP
    2 -> 4 at 0.2. The minimum of a noisy distance is biased low and the noise allowance sits in the contact gate.
    Known cost: the 1.5 m stop-drag with the handler's defender at the screener FP 0/2/5/5 (no defender 0/0/2/4,
    1.6 m 0/2/2/4). At sigma_p >= 0.3, sigma_dist (0.25-0.4 m) is larger than the 0.15 m between that scene and
    the 1.35 m positive, and the other evidence (defender meets screener, screener stopped) is the same in both by
    construction, so no edge separates them.
  evidence: >-
    Behaviour-neutral: every drag row in the standard, cal5 and adversarial harnesses is unchanged, and real drags are
    event-identical (18 / 13 / 14 events clean / 0.3 / 0.5). Test: test_c7_loop8_reach_test_is_the_measured_minimum_edge;
    the loop-6 and loop-7 drag tests now switch with wide_reach_test / wide_body_m.
- id: version
  what: version 0.7.0 -> 0.8.0, date 2026-10-23.
  why: Parameters (set_window.inbound_reach_m added; drag.wide_reach_test replaces drag.wide_reach_k / wide_reach_p) and rules (set_window, drag) changed; set_window.inbound_oob_k unit text rewritten.
  evidence: test_yaml_contract.

sim_validation:
  tier: V0 synthetic (tools/specgen/movement/sim.py, minimum-jerk paths, white + AR(1) noise, sigma_p 0.3 m)
  method: >-
    The scenario of each detector's pytest case, re-run on 20 further seeds (positive variant / negative variant);
    counts are detections. Proxy primitives are used (no upstream family detectors yet). Not a substitute for
    gold labels (evaluation item).
  recall_and_false_alarms:
    align_snapshot: {positive: 20/20, false: 0/20}
    set_match (Horns PnR): {positive: 20/20, false: 0/20, c_hat: 0.06-0.12}
    departure: {positive: 19/20, false: 0/20}
    live_belief: {positive: 19/20, false: 0/20}
    reset: {positive: 20/20, false: 0/20}
    motion: {positive: 20/20, false: 0/20}
    iso: {positive: 20/20, false: 0/20}
    iverson: {positive: 19/20, false: 0/20}
    zipper: {positive: 19/20, false: 0/20}
    chicago: {positive: 20/20, false: 0/20}
    spain (proxy mode): {positive: 19/20, false: 0/20}
    elevator: {positive: 10/20, false: 0/20, note: 30-seed run 15/30 vs 2/30 false; the weakest component at 0.3 m noise}
    floppy: {positive: 20/20, false: 0/20}
    hammer: {positive: 20/20, false: 0/20}
    pistol: {positive: 19/20, false: 0/20}
    drag: {positive: 20/20, false: 0/20}
    pnr_location: {positive: 19/20, false: 0/20}
    stagger: {positive: 19/20, false: 0/20}
    get_dho_chain: {positive: 17/20, false: 0/20}
    ucla: {positive: 19/20, false: 0/20}
    flex: {positive: 18/20, false: 0/20}
    ram: {positive: 20/20, false: 0/20}
  loop1_tester_harness:
    method: >-
      Independent tester harness (scratchpad movement/test_composition: 115 scenario rows x 10 seeds x sigma_p 0.2 / 0.3 / 0.5; P = precision, R = recall per sigma); the rows above are the author's own 20-seed runs of version 0.1.0 and are kept for provenance.
    precision_recall_0.2_0.3_0.5:
      iverson: {P: 1/1/1, R: 1.00/1.00/0.97}
      drag: {P: 1.00/1.00/0.90, R: 0.95/0.95/0.68}
      spain: {P: 1.00/1.00/0.96, R: 1.00/1.00/0.60}
      stagger: {P: 1.00/1.00/0.81, R: 0.90/0.90/0.85}
      get_dho_chain: {P: 1/1/1, R: 0.93/0.90/0.67}
      chicago: {P: 1/1/1, R: 1.00/1.00/0.95}
      flex: {P: 1/1/1, R: 0.85/0.80/0.85}
      continuity: {P: 1/1/1, R: 0.85/0.70/0.50}
      set_window: {P: 1/1/1, R: 1/1/1}
      compositional_name: {P: 1.00/1.00/0.73, R: 1.00/1.00/0.73}
      elevator: {P: 1.00/1.00/0.80, R: 0.90/0.80/0.20}
      unchanged_by_loop1: align_snapshot, zipper, floppy, hammer, pistol (sigma 0.3 6 -> 5 of 10 on pistol_dho), pnr_location, ucla, ram, iso, motion, reset, set_match, live_belief, style_measures
  loop2_harness:
    method: Same harness (116 rows x 10 seeds), version 0.3.0 (scratchpad movement/fix2_composition after.json); only drag and pistol rows changed.
    precision_recall_0.2_0.3_0.5:
      drag: {P: 1/1/1, R: 1.00/0.97/0.80}
      pistol: {P: 1/1/1, R: 1.00/0.93/0.80}
  known_limits_sigma_0_5:
    note: >-
      Recall at sigma_p 0.5 that loop 1 and loop 2 did not change (P / R at 0.5; 0.2 / 0.3 are >= 0.70). Detections at this
      noise level carry the calibration 'high' band conf where the kind has a table. Not defects of a single rule: most
      come from a missed loose screen (stationary-window test) or a late holder switch, shared by many components.
    elevator: {P: 0.80, R: 0.20, note: also the author's open question at 0.3}
    live_belief: {P: 1.00, R: 0.20}
    departure: {P: 0.92, R: 0.55}
    set_match: {P: 1.00, R: 0.60}
    floppy: {P: 0.86, R: 0.62}
    ucla: {P: 1.00, R: 0.60}
    pnr_location: {P: 0.80, R: 0.60, note: top-1; 3-4 of 10 SCR.on primitives missed, the rest carry the truth in location_alternatives}
    continuity: {P: 1.00, R: 0.50}
  misses: >-
    Almost every miss is a missed loose screen: a standing screener's s2 window mean falls below 0.6 in about 1-2 %
    of 0.5 s windows with this noise model, and one missed screen removes the component.

