- id: calibration
  research_id: loop 1 F10 (R-ST-05)
  level: rule
  name: Confidence calibration of set-component events (V0 sim, per kind and noise band)
  aliases: [calibrated confidence, isotonic map]
  actors: n/a
  t0: n/a
  rule: >-
    Every set-component event (iverson .. ram, get, dho_chain) keeps its raw conf (window_conf x evidence x edge x
    gap) in attrs.conf_raw and reports conf = P(correct | detected) from an isotonic map of raw conf, per kind and
    per noise band. Band from the scene's median calibrated position sigma (K_CAL sqrt(var_p) over the attackers):
    low <= band_edges_m[0] < mid <= band_edges_m[1] < high (sim: sigma_p 0.2 m -> 0.088, 0.25 -> 0.106, 0.3 ->
    0.123, 0.4 -> 0.157, 0.5 -> 0.176). Tables are fit with fit_isotonic (PAV, Laplace prior 1, at most 6 knots)
    on the independent tester's V0 harness (tester scenarios: positives, mirrored positives and near-miss
    negatives, 10 seeds at sigma_p 0.2 / 0.3 / 0.5; correct = right kind, actors, attrs and t0 within the
    scenario tolerance, every other event of the kind is incorrect) and are piecewise linear between knots,
    constant outside. A V0 table says only how often the detector is right on synthetic paths; it is re-fit on
    gold chances (R-ST-05: ECE <= 0.05 on 15 equal-mass bins) before any value or prediction use. Kinds without a
    table pass through unchanged.
  params:
    band_edges_m: {value: [0.106, 0.157], unit: m (median K_CAL sqrt(var_p); sim sigma_p 0.25 / 0.40)}
    tables:
      unit: 'kind -> band -> [[raw conf, P(correct)], ...] (fit 2026-10-20 on 2190 tester-harness runs, 1142 events)'
      value:
        chicago:
          low: [[0.845, 0.955]]
          mid: [[0.84, 0.955]]
          high: [[0.801, 0.952]]
        dho_chain:
          low: [[0.85, 0.917]]
          mid: [[0.85, 0.917]]
          high: [[0.81, 0.5], [0.849, 0.9]]
        drag:  # loop 2 R3/R4: re-fit on the patched detector (120 events)
          low: [[1.0, 0.976]]
          mid: [[0.991, 0.8], [1.0, 0.971]]
          high: [[0.938, 0.667], [0.999, 0.667], [1.0, 0.84]]
        elevator:
          low: [[0.599, 0.95]]
          mid: [[0.59, 0.944]]
          high: [[0.405, 0.333], [0.717, 0.833]]
        flex:
          low: [[0.925, 0.947]]
          mid: [[0.904, 0.944]]
          high: [[0.864, 0.947]]
        floppy:
          low: [[0.93, 0.976]]
          mid: [[0.884, 0.905], [0.967, 0.952]]
          high: [[0.627, 0.2], [0.895, 0.621], [0.969, 0.667], [0.975, 0.857]]
        get:
          low: [[0.85, 0.95]]
          mid: [[0.85, 0.947]]
          high: [[0.85, 0.929]]
        hammer:
          low: [[0.89, 0.952]]
          mid: [[0.888, 0.947]]
          high: [[0.866, 0.944]]
        iverson:
          low: [[0.94, 0.984]]
          mid: [[0.915, 0.984]]
          high: [[0.864, 0.983]]
        pistol:  # loop 2 R1: re-fit on the patched detector (87 events)
          low: [[0.846, 0.969]]
          mid: [[0.808, 0.85], [0.872, 0.929]]
          high: [[0.83, 0.81], [0.87, 0.9]]
        ram:
          low: [[0.844, 0.955]]
          mid: [[0.834, 0.955]]
          high: [[0.784, 0.944]]
        spain:
          low: [[0.833, 0.976]]
          mid: [[0.819, 0.976]]
          high: [[0.666, 0.762], [0.805, 0.909]]
        stagger:
          low: [[0.839, 0.95]]
          mid: [[0.817, 0.95]]
          high: [[0.63, 0.571], [0.755, 0.769], [0.863, 0.857]]
        ucla:
          low: [[0.773, 0.941]]
          mid: [[0.754, 0.938]]
          high: [[0.771, 0.929]]
        zipper:
          low: [[0.935, 0.976]]
          mid: [[0.919, 0.975]]
          high: [[0.89, 0.972]]
  min_duration_s: null
  outputs: [conf (calibrated), attrs.conf_raw, attrs.calibration_band]
  confidence: the map itself; V0 only
  noise_notes: Precision on V0 is high once the loop 1 fixes are in, so most tables are flat near the measured precision; sparse bands are Laplace-smoothed toward 0.5.
  conflicts_resolved:
  - Raw composite confs were dominated by fixed priors (p_dho 0.85, p_screen_loose 0.9, proxy_conf_factor 0.6), so false positives scored like true ones (tester F10); the map replaces them with measured precision.
  sources: []
  status: proposal
  detector: null
  implemented_by: calibrate, _calibrated, fit_isotonic, sigma_band

# --------------------------- set components (CE-C01 .. CE-C15) ---------------------------
- id: iverson
  research_id: CE-C01
  level: set_component
  name: Iverson (wing-to-wing cut over the elbows)
  aliases: [Iverson cut, Iverson start]
  actors: {cutter: c, screener: first elbow teammate passed}
  t0: frame of closest approach to the first elbow / high-post screener
  rule: >-
    For a player c whose x changes sign at frame fc: fa = last frame before fc with |x| >= side_absx_m on the
    start side, fb = first frame after fc with |x| >= side_absx_m on the other side; (fb - fa) x dt in
    duration_s; |x(fb) - x(fa)| >= min_abs_dx_m; y(fa) in start_y_m; y(fc) in cross_y_m; c holds the ball on <
    50 % of [fa, fb]; c passes within contact_m of >= 1 stationary teammate standing on the named_spots elbow,
    high_post_strip or nail_area labels (fallback y in elbow_fb_y, |x| <= elbow_fb_absx). double = a second such
    screener within double_within_s.
  params:
    side_absx_m: {value: 3.0, unit: m}
    duration_s: {value: [0.6, 4.0], unit: s}
    min_abs_dx_m: {value: 6.0, unit: m}
    start_y_m: {value: [2.5, 7.5], unit: m}
    cross_y_m: {value: [4.0, 7.0], unit: m}
    double_within_s: {value: 2.0, unit: s}
    elbow_fb_y: {value: [3.5, 5.5], unit: m}
    elbow_fb_absx: {value: 2.5, unit: m}
    contact_m: {value: 1.2, unit: m}
  min_duration_s: 0.6
  outputs: [cutter, screeners, crossing_y, double, start_side, duration_s]
  confidence: conf = P(crossing y in band | sigma_track) x screener stationarity-contact conf x edge x gap
  noise_notes: Crossing y has about 0.2-0.3 m error; p_above / p_below give partial credit near the band edges. A curl over an elbow fails the opposite-side test.
  conflicts_resolved:
  - Iverson y band (offense 3.1 4-6 m; motion_starts 4-7 m; A5.16 4.6-7.0 m; actions_extra 3.5-7.5 m) - motion_starts 4.0-7.0 m (R-ST-21) with |dx| >= 6 m.
  - Skeptic CE-C01 - start / end |x| relaxed to 3.0 m, duration 0.6-4.0 s between the |x| = 3 crossings (6 m at a 10 m/s sprint ceiling .. 1.5 m/s; loop 1 F1 lowered the 1.0 s floor, which rejected 7.5-8 m/s cuts), speed test dropped as redundant.
  sources:
  - {url: docs/taxonomy/motion_starts.md, supports: 'CUT Iverson path class: wing -> opposite wing at y 4-7 m'}
  - {url: docs/taxonomy/offense_full.md, supports: 'F3.1 Iverson start; detection signature |dx| >= 6.0 m, passes within 1.2 m of one or two stationary players near the elbows'}
  status: proposal
  detector: detect_iverson

- id: zipper
  research_id: CE-C02
  level: set_component
  name: Zipper (block-to-slot cut off a down screen)
  aliases: [zipper cut, zip]
  actors: {cutter: z, screener: s}
  t0: screen moment of the down screen (closest approach z - s)
  rule: >-
    During a move of z: z was (at the move onset or within block_lookback_s before it) on the named_spots block or
    low_post label (fallback y <= block_fb_y_max, |x| in
    block_fb_absx) up to fa; first frame fb with y >= end_min_y_m and d3 >= end_min_d3_m; (fb - fa) x dt <=
    max_duration_s; path length fa..fb >= min_path_m; z passes within contact_m of a stationary teammate at y in
    screener_y_m. catch = z holds the ball within catch_within_s of fb; follow_up 'middle_pnr' = a ball screen by s
    or z within follow_pnr_within_s of fb.
  params:
    block_fb_y_max: {value: 1.5, unit: m}
    block_fb_absx: {value: [1.0, 3.0], unit: m}
    end_min_y_m: {value: 5.5, unit: m}
    end_min_d3_m: {value: -0.5, unit: m}
    max_duration_s: {value: 2.5, unit: s}
    min_path_m: {value: 4.0, unit: m}
    screener_y_m: {value: [2.0, 5.0], unit: m}
    catch_within_s: {value: 1.0, unit: s}
    follow_pnr_within_s: {value: 1.5, unit: s}
    contact_m: {value: 1.2, unit: m}
    block_lookback_s: {value: 0.5, unit: s}
  min_duration_s: 0.4  # enforced on end - start (loop 1 F12): last block frame to y >= 5.5 m, >= 4 m of path at <= 10 m/s
  outputs: [cutter, screener, catch, follow_up, path_m]
  confidence: conf = screener stationarity-contact conf x edge x gap
  noise_notes: Lift / drift relocations from the block are separated by the screen evidence.
  conflicts_resolved: []
  sources:
  - {url: docs/taxonomy/offense_full.md, supports: 'F3.1 Zipper start: block player moves up the lane line >= 4 m with a stationary teammate above'}
  status: proposal
  detector: detect_zipper

- id: chicago
  research_id: CE-C03
  level: set_component
  name: Chicago / Zoom (pin-down into DHO)
  aliases: [Zoom, Chicago action]
  actors: {user: u, screener: down screener, giver: DHO giver}
  t0: t1 = down-screen moment
  rule: >-
    A down screen (SCR.down) on u at t1, then a DHO giver -> u with transfer t2 in [t1, t1 + dho_within_s] and u
    at r in dho_r_m at t2. variant 'chicago' when the giver is not the down-screener, else
    'down_then_dho_by_screener' (Veer / Ram style chunk). A DHO with air time > 0.3 s is a PASS (S = 0.5 vs DHO).
  params:
    dho_within_s: {value: 2.0, unit: s}
    dho_r_m: {value: [6.0, 9.0], unit: m}
  min_duration_s: 0.5
  outputs: [user, screener, giver, delay_s, variant]
  confidence: conf = min(screen conf, DHO conf) x edge x gap
  noise_notes: Short passes mislabelled as DHOs are split by the air-time rule.
  conflicts_resolved:
  - DHO delay (offense F6 row <= 1.5 s vs research 2.0 s) - 2.0 s (heuristic, wider for noise).
  sources:
  - {url: docs/taxonomy/offense_full.md, supports: 'F6 Zoom / Chicago: SCREEN(down) on u, then DHO to u'}
  status: proposal
  detector: detect_chicago

- id: spain
  research_id: CE-C04
  level: set_component
  name: Spain PnR (PnR + back screen on the roller's defender)
  aliases: [Spain, Stack PnR, Bamberg]
  actors: {handler: h, screener: s1, back_screener: s2}
  t0: t1 = ball-screen moment
  rule: >-
    SCR.on s1 -> h at t1, s1 ROLLs. s2 must arrive: he moved >= arrive_min_m within [t1 - arrive_from_s, t2] (a
    teammate standing on the roll path all along is a post, not a back-screener). Defender mode: s1's defender =
    the defender with the smallest mean distance to s1 over the matchup_lookback_s before t1 (< matchup_max_m); s2
    passes within contact range of that defender while stationary in [t1 + back_window_s[0], t1 +
    back_window_s[1]], and at some frame e of that window with the defender within scr_contact_m of s2 his mean
    velocity over [e - react_window_s, e] (>= defender_min_mps) vs [e, e + react_window_s] turns >
    defender_turn_deg or drops by >= defender_slow_frac (pre / post means, MP-13). Proxy mode (no tracked or no
    reacting defender): the roller passes within proxy_path_m of a stationary s2 in that window (the contact conf
    uses the same proxy_path_m that gates); conf x proxy_conf_factor (= measured proxy-mode precision). s2_pop = s2 reaches d3 >=
    pop_min_d3_m within pop_within_s.
  params:
    back_window_s: {value: [-0.3, 1.5], unit: s}
    matchup_max_m: {value: 3.0, unit: m}
    defender_turn_deg: {value: 30.0, unit: deg}
    defender_slow_frac: {value: 0.3, unit: fraction}
    proxy_path_m: {value: 1.5, unit: m}
    proxy_conf_factor: {value: 0.96, unit: factor (measured proxy-mode precision, loop 1 F10)}
    pop_within_s: {value: 2.0, unit: s}
    pop_min_d3_m: {value: -0.5, unit: m}
    arrive_min_m: {value: 1.0, unit: m}
    arrive_from_s: {value: 1.5, unit: s (before the ball-screen moment)}
    matchup_lookback_s: {value: 1.0, unit: s}
    react_window_s: {value: 0.5, unit: s}
    defender_min_mps: {value: 1.0, unit: m/s (pre-contact mean speed for a reaction)}
  min_duration_s: 1.0
  outputs: [handler, screener, back_screener, s2_pop, evidence_mode]
  confidence: raw conf = min(ball-screen conf, back-screen conf) x edge x gap (x proxy_conf_factor in proxy mode); reported conf = calibration table (spain)
  noise_notes: Defender tracks near the paint are the most occluded; proxy mode keeps the chunk as weaker evidence.
  conflicts_resolved: []
  sources:
  - {url: docs/taxonomy/offense_full.md, supports: 'F5.7 Spain: back screen on the roller''s defender, then the back-screener pops'}
  status: proposal
  detector: detect_spain

- id: elevator
  research_id: CE-C05
  level: set_component
  name: Elevator (closing double screen)
  aliases: [gate, elevator doors]
  actors: {user: u, screener_1: s1, screener_2: s2}
  t0: frame u crosses the s1 - s2 segment
  rule: >-
    s1, s2 stationary over the pre_window_s before the crossing (window mean >= event_lattice.scr_stat_frac); g0 = 5-frame median gap at
    the window start, g0 in g0_m; u crosses the segment (sign change of the cross product with projection in
    [0, 1]); g_end = minimum 5-frame median gap within close_window_s (close_window_wide_s when g0 >
    standard_g0_max_m) after the crossing; require g0 - g_end >= min_drop_frac x g0 and >= drop_sigma_k x sqrt(2)
    x sigma_track. g_end < target_m (target_wide_m when wide) is soft evidence (conf x target_miss_factor when
    missed).
  params:
    pre_window_s: {value: 0.5, unit: s}
    g0_m: {value: [0.9, 3.0], unit: m}
    standard_g0_max_m: {value: 1.6, unit: m}
    close_window_s: {value: 0.5, unit: s}
    close_window_wide_s: {value: 0.6, unit: s}
    end_median_frames: {value: 5, unit: frames}
    min_drop_frac: {value: 0.4, unit: fraction}
    drop_sigma_k: {value: 2.0, unit: sigma}
    target_m: {value: 0.6, unit: m}
    target_wide_m: {value: 1.0, unit: m}
    target_miss_factor: {value: 0.7, unit: factor}
  min_duration_s: 0.3
  outputs: [user, screeners, g0_m, g_min_m, close_time_s, variant, target_met]
  confidence: conf = stationarity x P(drop > 0.4 g0) x soft target x edge x gap
  noise_notes: 'Fixed skeptic CE-C05: a static pair rarely shows a significant 40 % drop at sigma_p 0.3 m (sim: 2/30 false), but recall is only about 50 % for a 1.2 -> 0.5 m close, because the AR(1) noise wanders the measured gap by 0.2-0.3 m; looser settings (30-35 % drop, 0.8 s window) raise recall to 80 % and false alarms to 13 %. Kept strict until real noise is measured (noise_acceptance).'
  conflicts_resolved:
  - ELEVATOR (motion_starts DOUBLE <= 1.2 m to < 0.6 m in 0.5 s vs offense A11.18 0.9-1.6 m to < 0.6 m in 0.5 s, wide 1.6-3.0 m to < 1.0 m in 0.6 s) - A11.18 bands, with the drop test as the decision and the targets as soft evidence.
  sources:
  - {url: docs/taxonomy/offense_full.md, supports: F3.1 Elevator start (gate closes after the cutter passes) and A11.18}
  status: proposal
  detector: detect_elevator

- id: floppy
  research_id: CE-C06
  level: set_component
  name: Floppy (shooters from under the rim, choice of side)
  aliases: [floppy action]
  actors: {shooter: sh, screener: first screener}
  t0: first move frame of the shooter from r < start_r_m
  rule: >-
    A shooter at r < start_r_m for >= dwell_s (half the frames) before a move; within exit_within_s of the onset
    he reaches d3 >= end_min_d3_m or the named_spots corner_three label, passing within contact_m of >= 1
    stationary teammate. side_choice = single (one screener), double (two screeners <= double_gap_m apart) or
    stagger.
  params:
    start_r_m: {value: 1.5, unit: m}
    dwell_s: {value: 0.3, unit: s}
    exit_within_s: {value: 3.0, unit: s}
    end_min_d3_m: {value: -0.5, unit: m}
    double_gap_m: {value: 1.2, unit: m}
    contact_m: {value: 1.2, unit: m}
  min_duration_s: 0.5  # enforced on end - start (loop 1 F12): move onset (speed > 2 m/s) to d3 >= -0.5 m, about 5 m at <= 10 m/s
  outputs: [shooter, screeners, side_choice, exit_side]
  confidence: conf = screener conf x under-rim dwell conf x edge x gap
  noise_notes: Under-rim occlusion; positions predicted > 0.5 s never decide (gap_factor).
  conflicts_resolved: []
  sources:
  - {url: docs/taxonomy/offense_full.md, supports: F3.1 Floppy (shooters under the rim at the set moment; one side single, one side stagger)}
  status: proposal
  detector: detect_floppy

- id: hammer
  research_id: CE-C07
  level: set_component
  name: Hammer (baseline drive + weak-side flare to the corner)
  aliases: [hammer action]
  actors: {driver: h, shooter: u, screener: flare screener}
  t0: drive reaching r < 3.05 m
  rule: >-
    A baseline DRIVE by h on side s; a teammate u passes within contact_m of a stationary teammate at y <=
    screener_max_y_m, |x| in screener_absx_m on side -s, within +- screen_window_s of the drive's rim arrival; u
    is on the named_spots corner_three label on side -s within corner_within_s of the screen. thrown = PASS h -> u
    within thrown_within_s of the rim arrival.
  params:
    screen_window_s: {value: 1.0, unit: s}
    screener_max_y_m: {value: 3.0, unit: m}
    screener_absx_m: {value: [2.0, 5.0], unit: m}
    corner_within_s: {value: 1.5, unit: s}
    thrown_within_s: {value: 1.5, unit: s}
    contact_m: {value: 1.2, unit: m}
  min_duration_s: 1.0
  outputs: [driver, shooter, screener, thrown, drive_side]
  confidence: conf = min(drive conf, screen conf) x edge x gap
  noise_notes: The corner label avoids the theta 12 vs 15 deg conflict.
  conflicts_resolved:
  - Corner angle (Hammer row theta <= 12 deg vs <= 15 deg elsewhere) - named_spots corner_three label.
  sources:
  - {url: docs/taxonomy/offense_full.md, supports: 'F8.1 Hammer: simultaneous baseline DRIVE and weak-side flare toward the corner'}
  status: proposal
  detector: detect_hammer

- id: pistol
  research_id: CE-C08
  level: set_component
  name: Pistol / 21 (early side action)
  aliases: [21, pistol action]
  actors: {handler: h, wing: w, big: teammate at the top}
  t0: the screen or DHO moment
  rule: >-
    Within the early-offense window (drag.early_window_s after team control): a ball screen (w screens h) or a DHO
    (h -> w) with the action location (the screener w for a screen; for a DHO the dho_location_actor, default the giver
    h, since the receiver is already running past the hand-off - loop 2 R1) at r in action_r_m and |x| >= action_min_absx_m; h was at y > handler_from_y_m earlier in the
    possession; a third attacker at r in top_r_m with m >= top_min_m_deg; no attacker in the paint (|x| <= LANE_X,
    y <= FT_Y) at the action. Roster roles (guard / big) are never hard constraints.
  params:
    handler_from_y_m: {value: 9.0, unit: m}
    action_r_m: {value: [6.5, 8.5], unit: m}
    action_min_absx_m: {value: 2.0, unit: m}
    top_r_m: {value: [6.0, 8.0], unit: m}
    top_min_m_deg: {value: 70.0, unit: deg}
    dho_location_actor: {value: giver, unit: 'giver | receiver (loop 2 R1: whose position at t0 is the DHO action location)'}
  min_duration_s: null  # loop 1 F12: the span is one screen or DHO moment (a DHO span is its air time), so no floor
  outputs: [handler, wing, big, action_kind, side, since_control_s]
  confidence: conf = action conf x edge x gap
  noise_notes: Overlaps Drag and Get; separated by participants and position.
  conflicts_resolved:
  - Early window (Pistol <= 10 s vs Drag <= 8 s) - one window, 12.0 s, from named_spots rule_early_offense_phase.
  sources:
  - {url: docs/taxonomy/offense_full.md, supports: F3.1 Pistol (one-side triangle, 5-out) and F2.2 Pistol family}
  status: proposal
  detector: detect_pistol

- id: drag
  research_id: CE-C09
  level: set_component
  name: Drag / double drag (trailer ball screen in early offense)
  aliases: [drag screen, 77, double drag]
  actors: {handler: h, screener: trailer, screener_2: second trailer}
  t0: the (first) screen moment (minimum screener-handler distance)
  rule: >-
    Within early_window_s of team control (default: the first holder frame): the screener comes within
    scr_contact_m of the handler (who holds the ball within +-on_ball_frames); trailer run: the screener's y fell
    by >= min_drop_m over the run_window_s before contact (p_above with sqrt(2) sigma_track >= 0.5; he may stop
    to set a legal screen or roll into it); handler-screener relative speed at contact >= min_rel_mps (two
    players running side by side are not a screen); contact at r in screen_r_m (moving and set screens: no
    stationarity test); a contact interval holding two approaches is split at local distance minima separated by a
    rise >= max(split_rise_min_m, split_rise_k x sigma_dist) (loop 2 R4), and contacts of the same pair within
    pair_merge_s are merged keeping the last (a trailer running past the handler before he sets the screen); the
    handler holds the ball in more frames than the screener over +- holder_window_s (loop 2 R3). Loop 5 C7: the
    contact uses the ball-screen rule of event_lattice (loop 5 C2): gate scr_contact_m + scr_on_contact_k x
    sigma_dist, a contact beyond scr_contact_m needs the handler's defender at the screener (scr_on_wide_def_m),
    the on-ball test uses the holder with hysteresis and pc = p_below(d, scr_contact_m, scr_on_pc_k x sigma_dist).
    Loop 6 C7: a contact beyond scr_contact_m also needs evidence that the trailer reached the handler,
    p_below(d, scr_contact_m, wide_reach_k x sigma_dist) >= wide_reach_p, and the handler's defender is the
    sustained matchup of event_lattice (loop 6 C2). Loop 7 C7: the drag contact gate is scr_contact_m + wide_body_m
    + scr_on_contact_k x sigma_dist and the widened band is the physical contact width (the handler's defender, who
    must meet the screener, is the body between the two attackers) with the noise allowance in the gate. Loop 8 C7:
    the reach test is the measured minimum d <= scr_contact_m + wide_body_m (wide_reach_test), a hard 1.4 m edge;
    the loop-6/7 probability form was that edge at wide_reach_p 0.5 and its wide_reach_k had no effect. Double
    drag: a second screener on the same handler within double_within_s, contact points double_gap_m apart. read =
    roll (r < roll_r_m within read_window_s), pop (r >= ARC_R at the end) or none.
  params:
    early_window_s: {value: 12.0, unit: s}
    run_window_s: {value: 3.0, unit: s}
    min_drop_m: {value: 6.0, unit: m}
    min_rel_mps: {value: 1.5, unit: m/s}
    pair_merge_s: {value: 2.5, unit: s}
    screen_r_m: {value: [6.0, 9.0], unit: m}
    read_window_s: {value: 1.5, unit: s}
    roll_r_m: {value: 3.0, unit: m}
    double_within_s: {value: 1.5, unit: s}
    double_gap_m: {value: [0.7, 1.5], unit: m}
    holder_window_s: {value: 1.0, unit: 's (loop 2 R3: +- window in which the handler must hold the ball in more frames than the screener; 0.5 s let a 0.7 s holder flicker to the trailer through at sigma_p 0.5)'}
    split_rise_min_m: {value: 0.2, unit: 'm (loop 2 R4: floor of the rise that separates two approaches inside one contact interval)'}
    split_rise_k: {value: 1.0, unit: 'x median sigma_dist over the interval (loop 2 R4: noise-scaled rise; the larger of the two applies)'}
    wide_body_m: {value: 0.2, unit: 'm (loop 7 C7: physical width a widened drag contact may add to scr_contact_m - one defender torso depth (~0.2 m chest depth): the widened contact needs the handler''s defender at the screener, i.e. his body between the two attackers, so the handler''s centre may pass that much further out than the 1.2 m direct-brush contact; the drag contact gate is scr_contact_m + wide_body_m + scr_on_contact_k x sigma_dist and the reach test d <= scr_contact_m + wide_body_m on the measured minimum (loop 8))'}
    wide_reach_test: {value: true, unit: 'bool (loop 8 C7: a widened drag contact (minimum beyond scr_contact_m) needs the measured minimum d <= scr_contact_m + wide_body_m - a hard geometric edge, the noise allowance sits in the contact gate. Replaces wide_reach_k / wide_reach_p: at wide_reach_p 0.5 the probability test was this edge exactly and wide_reach_k had no effect; false switches the reach test off (loop-5 rule))'}
  min_duration_s: 0.5
  outputs: [handler, screener(s), double, read, drop_m, since_control_s]
  confidence: raw conf = P(contact) x P(drop >= min_drop_m) x edge x gap; reported conf = calibration table (drag)
  noise_notes: Moving screens fail stationarity tests by design; contact distance and the trailer's run from the backcourt decide. Loop 1 F2 (tester) - the old mean v_y <= -3.0 m/s rule only passed a screener still sprinting through the handler (legal drag -0.4 m/s, rolling drag -2.1 m/s; both 0/10); the 7.5 m r bound missed drags set 0.5-1.5 m above the arc.
  conflicts_resolved:
  - Drag (research <= 8 s, 1.0 s v_y window, d3 >= -0.5, double 1.5-5.0 m) vs docs/research/transition_full.md drag row (v_y <= -3.0 m/s in the 1.5 s before contact, r 6.0-7.5 m, within 8 s, double 0.7-1.5 m apart) - transition_full double-drag spacing and the single 12 s early window kept; the v_y run-in test and r <= 7.5 m are replaced (loop 1 F2) by the trailer-run drop and r <= 9.0 m, because the v_y test describes an illegal moving screen.
  sources:
  - {url: docs/research/transition_full.md, supports: drag and double drag signature}
  - {url: config/named_spots.yaml, supports: rule_early_offense_phase 12.0 s cap}
  status: proposal
  detector: detect_drag

- id: pnr_location
  research_id: CE-C10
  level: set_component
  name: PnR location and side qualifiers
  aliases: [top PnR, side PnR, slot PnR]
  actors: {screener: s, handler: h}
  t0: screen moment
  rule: >-
    For each ball screen: location = the named_spots zone_scheme:pnr_location label of the screener's median
    position over [t - loc_median_half_s, t + loc_median_half_s]; location_probs = label shares over loc_samples
    fixed standard-normal draws (seed loc_seed) of N(median position, (loc_sigma_inflation[noise band] x sigma_track)^2); location_alternatives = the
    top-2 labels when the runner-up share is >= loc_alt_min_p (high -> 'top', side, slot, corner, logo -> 'deep'; 'inside' when no label applies); strong side = sign
    of the handler's x. empty_side: every other attacker has x x side < empty_side_min_x_m. step_up: the screener
    was at y <= step_up_from_y_m within step_up_lookback_s and screens at y >= step_up_to_y_m. re_screen: the same
    pair screened within re_screen_within_s before.
  params:
    empty_side_min_x_m: {value: 1.83, unit: m}
    step_up_lookback_s: {value: 2.0, unit: s}
    step_up_from_y_m: {value: 3.0, unit: m}
    step_up_to_y_m: {value: 5.0, unit: m}
    re_screen_within_s: {value: 3.0, unit: s}
    loc_median_half_s: {value: 0.3, unit: s}
    loc_samples: {value: 200, unit: draws}
    loc_seed: {value: 0, unit: rng seed (fixed draws, deterministic)}
    loc_alt_min_p: {value: 0.2, unit: probability}
    loc_sigma_inflation: {value: {low: 1.2, mid: 1.3, high: 1.7}, unit: 'x sigma_track per calibration noise band (loop 2 R2: measured rms error of the 0.6 s median / sigma_track = 1.18 / 1.29 / 1.66 at sigma_p 0.2 / 0.3 / 0.5)'}
  min_duration_s: null
  outputs: [location, label, location_probs, location_alternatives, strong_side_sign, empty_side, step_up, re_screen]
  confidence: conf = ball-screen conf
  noise_notes: Spot-boundary flicker is handled by named_spots hysteresis in production; here a 0.6 s median position and the label probabilities stand in for it (loop 1 F11).
  conflicts_resolved: []
  sources:
  - {url: config/named_spots.yaml, supports: zone_scheme:pnr_location labels}
  status: proposal
  detector: detect_pnr_location

- id: stagger
  research_id: CE-C11
  level: set_component
  name: Stagger / triple stagger
  aliases: [stagger screen, stagger away]
  actors: {user: u, screener_1: s1, screener_2: s2, screener_3: s3}
  t0: first screen moment
  rule: >-
    >= 2 off-ball screens on the same user by different screeners, consecutive contacts 0 < dt <=
    second_within_s apart, screener positions gap_m apart; triple = three. A screen already inside an emitted
    chain does not start another chain, so a triple stagger is one event, not also its 2-screen suffix. away = the user ends on the side
    opposite the ball's side at the first screen. exit = curl (r < curl_end_r_m exit_after_s after the last screen),
    flare (the last screen classed SCR.flare by geometry), or straight.
  params:
    second_within_s: {value: 1.5, unit: s}
    gap_m: {value: [2.0, 5.0], unit: m}
    curl_end_r_m: {value: 4.0, unit: m}
    exit_after_s: {value: 1.0, unit: s}
  min_duration_s: 0.5
  outputs: [user, screeners, triple, away, exit, gaps_m]
  confidence: conf = minimum screen conf
  noise_notes: A 4.0 m upper bound clips real staggers at 0.3-0.5 m noise; 5.0 m keeps them.
  conflicts_resolved:
  - Stagger spacing (offense F8.1 2-4 m vs motion_starts 2-5 m) - 2-5 m (R-ST-21 canonical shared-set signature).
  sources:
  - {url: docs/taxonomy/motion_starts.md, supports: 'STAGGER: two SCR on the same user, screeners 2-5 m apart, second contact <= 1.5 s'}
  status: proposal
  detector: detect_stagger

- id: get_dho_chain
  research_id: CE-C12
  level: set_component
  name: Get / chase and DHO chain
  aliases: [get, chase, handoff chain]
  actors: get {passer, receiver}; dho_chain {giver_1, giver_2, ..., receiver}
  t0: get = the pass release; dho_chain = the first DHO transfer
  rule: >-
    get: PASS a -> b, then DHO b -> a within get_within_s. dho_chain: >= chain_min DHOs with distinct givers in which
    the receiver of DHO k gives DHO k+1 within chain_within_s of DHO k (the gap is measured from the last DHO); only transfers with the ball at y <= HALF_Y + max_past_half_m take part (loop 4 L10); a chain link needs the ball nearer to the receiver than to the giver by >= chain_min_lead_m (median over the receiver's holder run; loop 5 C4: two attackers standing 0.3-0.5 m apart trade the nearest-attacker label without a hand-off) and the receiver keeps the ball >= chain_min_hold_s (his holder run containing the DHO; loop 6 C4: a shorter hand-back is label flicker);
    actors giver_1.. and the final receiver; a DHO already inside a chain does not start a suffix chain. Weave uses offense A11.16 (referenced, not redefined).
  params:
    get_within_s: {value: 2.0, unit: s}
    chain_within_s: {value: 5.0, unit: s}
    chain_min: {value: 2, unit: DHOs}
    max_past_half_m: {value: 1.0, unit: 'm (loop 4 L10: PASS / DHO with the ball more than this beyond the half-court line do not take part)'}
    chain_min_lead_m: {value: 0.3, unit: 'm (loop 5 C4: a chain link needs the ball nearer to the receiver than to the giver by this much, median over the receiver''s run; = event_lattice.hold_switch_margin_m)'}
    chain_min_hold_s: {value: 0.4, unit: 's (loop 6 C4: a chain link needs the receiver to keep the ball this long - his holder run starting at the DHO; a shorter hand-back is label flicker)'}
  min_duration_s: 1.0
  outputs: [kind get | dho_chain, participants, chain_length, delay_s]
  confidence: conf = minimum part conf
  noise_notes: DHO vs short pass confusion; S = 0.6.
  conflicts_resolved:
  - Weave / double-high windows in old blocks - A11.16 / A11.17 only.
  sources:
  - {url: docs/taxonomy/offense_full.md, supports: 'F4.1 DHO / Chase motion: get/chase = pass and follow for the handoff'}
  status: proposal
  detector: detect_get_dho_chain

- id: ucla
  research_id: CE-C13
  level: set_component
  name: UCLA (top to block cut over a high-post screen)
  aliases: [UCLA cut]
  actors: {cutter: c, screener: high post, receiver: wing}
  t0: closest approach to the high-post screener
  rule: >-
    PASS c -> w with c at y >= passer_min_y_m and w at |x| >= receiver_min_absx_m; a move of c starting within
    [-cut_lead_s, cut_within_s] s of the release reaches the block (y <= end_max_y_m and |x| <= end_max_absx_m, or r <
    end_r_m) within cut_max_s of its onset, passing within contact_m of a stationary teammate at y in screener_y_m,
    |x| <= screener_max_absx_m. catch = c holds the ball within catch_within_s of the block arrival.
  params:
    passer_min_y_m: {value: 5.5, unit: m}
    receiver_min_absx_m: {value: 3.5, unit: m}
    cut_within_s: {value: 1.5, unit: s}
    end_max_y_m: {value: 1.5, unit: m}
    end_max_absx_m: {value: 2.5, unit: m}
    end_r_m: {value: 2.5, unit: m}
    cut_max_s: {value: 2.0, unit: s}
    screener_y_m: {value: [3.5, 5.5], unit: m}
    screener_max_absx_m: {value: 2.5, unit: m}
    contact_m: {value: 1.2, unit: m}
    cut_lead_s: {value: 0.3, unit: s}
    catch_within_s: {value: 1.0, unit: s}
  min_duration_s: 0.5  # enforced on end - start (loop 1 F12): pass release to block arrival
  outputs: [cutter, screener, receiver, catch]
  confidence: conf = min(pass conf, screen conf) x edge x gap
  noise_notes: Back screen vs UCLA naming has S = 0.3.
  conflicts_resolved: []
  sources:
  - {url: docs/taxonomy/offense_full.md, supports: 'F8.2 UCLA: top -> low post over a high-post screen'}
  - {url: https://fansided.com/2017/09/08/nylon-calculus-understanding-synergy-play-type-data/, supports: Synergy logs UCLA and flex screens as cuts}
  status: proposal
  detector: detect_ucla

- id: flex
  research_id: CE-C14
  level: set_component
  name: Flex cycle (flex cut + screen-the-screener)
  aliases: [flex cut, flex action]
  actors: {cutter: f, screener: block screener, sts_screener: down screener}
  t0: flex screen moment (closest approach cutter - block screener)
  rule: >-
    A move of f starting on the named_spots corner_three label on the weak side (opposite the ball's side; any
    frame of the corner_lookback_s before the onset, since corner players stand 0.1-0.3 m behind the line) reaches
    the ball side with |x| <= block_max_absx_m and y <= block_max_y_m, never above path_max_y_m, passing within
    contact_m of a stationary block screener b (y <= screener_max_y_m, |x| in screener_absx_m); within
    sts_within_s b passes a stationary teammate while moving up (y at +sts_dir_window_s > y at -sts_dir_window_s):
    the down screen on the flex screener.
  params:
    block_max_absx_m: {value: 3.0, unit: m}
    block_max_y_m: {value: 1.5, unit: m}
    path_max_y_m: {value: 2.0, unit: m}
    screener_max_y_m: {value: 2.0, unit: m}
    screener_absx_m: {value: [1.0, 3.0], unit: m}
    sts_within_s: {value: 2.0, unit: s}
    contact_m: {value: 1.2, unit: m}
    corner_lookback_s: {value: 0.5, unit: s}
    sts_dir_window_s: {value: 0.33, unit: s}
  min_duration_s: 1.0  # enforced on end - start (loop 1 F12): move onset to the later of block arrival and the STS contact
  outputs: [cutter, screener, sts_screener, ball_side]
  confidence: conf = min(flex screen conf, STS conf) x edge x gap
  noise_notes: Baseline occlusion under the basket; the block screener may be loose evidence.
  conflicts_resolved:
  - STS delay (offense F4.1 <= 1.2 s vs research 2.0 s) - 2.0 s (heuristic, noise margin).
  sources:
  - {url: docs/taxonomy/offense_full.md, supports: 'F4.1 Flex: flex cut from the weak-side corner along y < 1 to the ball-side block, then a down screen on the flex screener'}
  status: proposal
  detector: detect_flex

- id: ram
  research_id: CE-C15
  level: set_component
  name: Ram (screen for the screener into a ball screen)
  aliases: [ram screen, ram PnR]
  actors: {ram_screener: first screener, big: s, handler: h}
  t0: the off-ball screen moment
  rule: >-
    s uses an off-ball screen (as user) and then sets a ball screen within ball_screen_within_s. veer = s (the
    big) then sets an off-ball screen within veer_within_s after the ball screen.
  params:
    ball_screen_within_s: {value: 2.0, unit: s}
    veer_within_s: {value: 2.0, unit: s}
  min_duration_s: 0.5
  outputs: [ram_screener, big, handler, veer, delay_s]
  confidence: conf = min(off-ball screen conf, ball-screen conf)
  noise_notes: Two bigs in a crowded paint; id swaps are the main risk.
  conflicts_resolved: []
  sources:
  - {url: docs/taxonomy/offense_full.md, supports: F5.3 Ram (screen for the screener into a ball screen)}
  status: proposal
  detector: detect_ram

