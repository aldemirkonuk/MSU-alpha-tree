    Per half-court set window (loop 5 C6: not for transition_early windows; >= min_window_s used as the denominator floor): rates per 10 s of passes, ball screens,
    off-ball screens, cuts, DHOs, drives, ball reversals (side changes of x_ball with a 0.9 m dead band) and
    paint touches (ball inside |x| <= LANE_X, y <= FT_Y for >= paint_touch_min_s). Aggregated per team-season to
    satisfy R-ST-25. R-ST-16: every item in this file has a detector, an implementing function or a needs_data
    tag.
