    stationary_s2 (MP-09), speed thresholds use CA-RTS speeds with their calibrated sigma through p_below /
    p_above, and window means stand in for regression speeds. Matcher spatial sigma sqrt(1.5^2 + sigma_track^2),
    timing sigma sqrt(0.5^2 + sigma_t_ref^2). sigma_track per game from stationary references (players during
