- id: live_belief
  research_id: CE-R20
  level: rule
  name: Live belief, commit hysteresis and revision log
  aliases: [live labelling, belief stream]
  actors: binding of the committed template
  t0: the commit frame
  rule: >-
    Updates every update_every_frames frames inside a window (only when the visible lattice changed; candidate
    prefilter by kind). An event is visible from max(end, t0 + confirm_delay_s[kind]) (SCR +0.5 s after the screen
    moment, DHO +0.2 s, ROLL / POP +2.0 s, PASS at the catch, CUT / components at their end). Display: the top-1
    accepted template; the shown name switches only when the new top-1 P beats the shown name's current P by >=
    switch_margin for >= switch_hold_frames. Commit when the shown name's P >= commit_p holds for >=
    commit_hold_s. Final online label at window close + final_after_close_s; the offline smoothed pass is final.
    Revisions are append-only {revision_number, t_f, label, P, reason in new_evidence | window_close |
    offline_smoothing | coach_correction, previous}. KPIs (proposals): median shown-name changes per chance <= 1;
    median first-required-step-to-commit <= 3.0 s; online / offline top-1 disagreement <= 10 %. Latency budgets
    (smoothing <= 100 ms, <= 20 ms per update) are proposals to be profiled.
  params:
    update_every_frames: {value: 3, unit: frames}
    confirm_delay_s: {value: {SCR: 0.5, DHO: 0.2, ROLL: 2.0, POP: 2.0, PASS: 0.0, CUT: 0.0, DRIVE: 0.0}, unit: s}
    switch_margin: {value: 0.15, unit: probability}
    switch_hold_frames: {value: 15, unit: frames}
    commit_p: {value: 0.8, unit: probability}
    commit_hold_s: {value: 1.0, unit: s}
    final_after_close_s: {value: 2.0, unit: s}
  min_duration_s: null
  outputs: [belief stream (t_f, top-3, P), commit event, revision log]
  confidence: conf = committed P x window conf
  noise_notes: Here the lattice is the offline-smoothed one gated by confirmation delays (an emulation); live Kalman lag at cuts is not modelled.
  conflicts_resolved: []
  sources:
  - {url: https://www.cs.toronto.edu/~zemel/documents/1536-Classifying-NBA-Offensive-Plays-Using-Neural-Networks.pdf, supports: some plays are identifiable from the set-up, others only late, which motivates a running belief}
  status: proposal
  detector: detect_live_belief

