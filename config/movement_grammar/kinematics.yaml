    sprint_effort: 'told 0.05 1.000 / 0.899; told 0.15 0.994 / 0.889; noise 0.3 0.963 / 0.783; noise 0.5 0.932 / 0.687'
    jump_vs_pbp_fga: 'clean 0.808 / 0.529; noise 0.3 0.772 / 0.504 (runner noise draw 0.752 / 0.496); noise 0.5 0.649 / 0.406; FGA + rebounds 0.33 recall clean'
    jump_vs_pbp_fga_loop5: 'team_ends frame, 446-FGA matcher, precision / recall: loop 4 clean 0.885 / 0.516, noise 0.3 0.828 / 0.487, noise 0.5 0.699 / 0.386 -> loop 5 0.898 / 0.516, 0.846 / 0.491, 0.796 / 0.428 (z-shot precision 0.949 / 0.911 / 0.904, z-recall 0.775 / 0.732 / 0.681); optional ball-height path 0.918 / 0.603, 0.840 / 0.554, 0.784 / 0.480'
    efforts_noise_0.3_precision: 'stated per the loop-4 confirmer: the KIN4-EFFORT additions at noise 0.3 are 0.76 (hsr) / 0.64 (sprint) precise on near-truth; overall hsr 0.967 -> 0.951 and sprint 0.935 -> 0.915 precision against loop 3 on that truth, for recall +0.05 / +0.04 (KIN5-EFFORT-NOT-KEPT: tightening only traded recall for precision)'
    runner_noise_draw: 'the noise 0.3 figures above use a per-chunk noise draw shared by before / after; the runner''s sequential draw gives hsr 0.961 / 0.801, sprint 0.944 / 0.773, stand 0.649 / 0.864, start 0.359 / 0.764, stop 0.316 / 0.677'
  open_findings:
  - >-
    start / stop / stand under noise (not fixed): with the told sigma matched to the data the three agree with the
    near-truth (0.89-0.93 precision); the rate rise under noise (start x2.2, stop x2.3, stand x1.3 at noise 0.3 against
    told 0.05; x1.26 / x1.44 / x1.06 against told 0.15) is slow walking read as standing: over the 0.5 s before a start the near-truth
    speed was < 0.5 m/s in 47% of the starts at noise 0.3, 0.5-0.8 in 36%, 0.8-1.2 in 15% (74% / 25% / 0% at told
    0.15). The 0.5 s window mean of speed has a sigma of about 0.27 m/s at sigma_p 0.3, the same as the gap between the
    0.5 m/s edge and a slow walk; neither a core displacement check nor stricter duration counting separated them
    (KIN4-NOT-KEPT). Telling sigma 0.15 on 2 mm data over-corrects the Rician floor (v_c reads 0.6 m/s walks as 0.4),
    which is why told 0.15 reads more stands than told 0.05.
  - >-
    stop_and_go / burst / brake under noise: the extra stop_and_go events at noise 0.5 are dips whose near-truth gain is
    < 1.5 m/s (47% of events, against 14% clean): q 10 tier dv_min_q10 / trough_min_q10 accept noise dips of walking
    players. Not changed in this loop (the tier values were set on synthetic attenuation; a real-data trade-off needs
    labelled film).
  - 'jump: about 40% of FGA are released within 2 m of the rim (not separable in XY); rebound and block jumps are invisible to the proxy.'
  - >-
    high_speed emits nothing at noise 0.5 with sigma told hypot(0.15, 0.5) = 0.52 m (also before this loop; 132 per 48
    with told 0.50 in the loop-3 rates): the band is 0.83 m/s wide and its best membership 2 Phi(0.415 / sigma_L) - 1
    stays below p_enter 0.7 once sigma_L >= 0.40 m/s at the q 10 tier. Decided 25 Oct (changes_decisions_oct25 D1):
    reported as abstain_unresolvable:high_speed, no tier-aware p_enter.
confirmer_disputed:
# Items of the loop-1 confirmer report not changed, with the evidence.
- id: KIN-STAND-FP (1) creep
  finding: 'Agreed with the confirmer: the 0.45 m/s creep is below stand_speed 0.5, so stand is the label by spec; the harness truth (stand must not fire) should mark it ambiguous. It accounts for 30 / 36 / 32 of the stand false events per sigma_p; the by-spec view is reported in KIN2-STAND.'
- id: KIN-CURVE-COD-OVERLAP radius rule
  finding: 'Not applied: radius < 3 m with a cod >= 60 deg inside also matches every curl (radius 2.0-2.4 m, inside cod 95-138 deg); replaced by the apex-share test (KIN2-CURVE).'
- id: KIN-BACKPEDAL-CONF
  finding: 'Not a confidence problem: backpedal emit_min is 0.3 and every retreat clip emits an event (conf 0.44-0.53). The 4 misses at sigma_p 0.3 are coverage misses: the harness truth is the whole 1.0-3.0 s minimum-jerk leg, whose speed is under the 0.8 m/s class floor until about 1.36 s and after 2.64 s, and the 50% rule needs 1.0 s; the detected segments cover 0.87-1.1 s of the 1.28 s above the floor. Lowering emit_min would not change them. Unchanged.'
- id: 'cod FP on banana / 35 deg redirection'
  finding: 'Residual 1 / 2 / 5 events: dpsi 45-50 deg with apex share 0.47 (between the 0.45 cod and 0.52 arc edges, so cod carries alternative curved_run) or no arc fit at all at sigma_p 0.5. Left as the documented ambiguity band.'

