    0.5, while true stands keep 0.78-0.95; (3) high_speed / sprint band segments on 4.7 / 5.6 m/s runs at
    sigma_p <= 0.3 are unchanged (MP-10 band machine; only the q 10 correlation time changed);
    (4) defensive_slide false events are slide fragments in the acceleration phases of a 4 m/s crossover
    run; (5) plant_step fires on 2-4 of 10 shallow 65 deg cuts at sigma_p 0.2-0.3 (see plant_step
    noise_notes); (6) curved_run t0 of a 1.4 s banana is late by 0.4-0.7 s in about a third of the clips
    (back-dating stops where the window arms are not yet both on the arc). All rates assume the simulator noise.

validation_v0:
  superseded_by: validation_v1 (loop 1; the scenes below hid the smoothing blur, see KIN-T16)
  how: >-
    Synthetic scenes (tools/specgen/movement/sim.py noise: white + AR(1) rho 0.9, CA-RTS q30/q10),
    30 seeds per positive scene and 15 x 10 s per negative scene, script kept in the session scratchpad
    (calibration is to be repeated on hand-labelled MSU film, R-ST-01). Positive scenes: stand-sprint-stop
    profile, change of pace 5 -> 2.5 -> 5 m/s, V-cut through a plant, 1.2 s arc R 4 m at 4.5 m/s,
    waypoint stand-run-stand, defender slide and backpedal against a held ball.
  recall_and_t0_error:
    # kind: [recall within 0.6 s at sigma_p 0.3, median t0 error s, p90 |error| s, recall at 0.5, median, p90]
    burst: [1.00, +0.05, 0.20, 1.00, +0.05, 0.23]
    brake: [1.00, -0.03, 0.36, 0.90, -0.06, 0.39]
    hsr_effort: [1.00, 0.00, 0.13, 1.00, 0.00, 0.10]
    sprint_effort: [1.00, +0.03, 0.13, 1.00, +0.10, 0.17]
    stop: [0.97, +0.03, 0.31, 0.90, +0.13, 0.37]
    start: [0.97, +0.03, 0.17, 0.93, -0.05, 0.28]
    stand: [0.93, 0.00, 0.29, 0.93, +0.03, 0.44]
    hesitation: [0.67, -0.08, 0.34, 0.50, -0.30, 0.54]
    cod: [1.00, 0.00, 0.07, 1.00, +0.04, 0.10]
    plant_step: [1.00, +0.04, 0.04, 0.93, +0.07, 0.11]
    curved_run: [0.80, +0.12, 0.29, 0.77, +0.17, 0.37]
    defensive_slide: [0.97, 0.00, 0.30, 0.97, -0.07, 0.43]
    backpedal: [1.00, -0.02, 0.17, 1.00, -0.03, 0.27]
    decel_effort_view: [1.00, +0.02, 0.40, 1.00, 0.00, 0.44]
  false_events_per_player_minute:
    # straight constant-speed paths (no true event of these kinds); sigma_p 0.3 / 0.5
    still: {all: [0, 0]}
    walk_1p5: {cod: [0, 0], brake: [0.4, 0], start: [0, 0.8], decel_effort_view: [0.8, 1.2]}
    jog_3p0: {brake: [0.4, 0.4], hesitation: [0.4, 0], curved_run: [0, 0.4], decel_effort_view: [1.2, 2.0]}
    run_4p5: {brake: [0.4, 0.4], hesitation: [0.4, 0], hsr_effort: [0, 1.6], decel_effort_view: [0.8, 1.6]}
  notes: >-
    Before the z_psi gate the cod detector produced 1.6 / 2.8 false cuts per player-minute on straight
    walks at 1.5 m/s (sigma_dpsi was well calibrated, sd(z) 1.01-1.03, but 45 deg is only 2.4 sigma at
    that speed). Hesitation recall is limited by smoothing attenuation of a 2.5 m/s change of pace
    (measured 1.1-2.4 m/s). hsr_effort false efforts at sigma_p 0.5 come from 1 s AR(1) excursions of
    speed_L above 5.0 at a true 4.5 m/s. A circle of radius 6 m at 4.5 m/s (kappa 0.167, a true curved
    run) is labelled in fragments because kappa sits one sigma above the 0.15 edge. All rates assume the
    simulator noise; homography drift and pan bias are not modelled.

