v0_sweep:
  description: >-
    Every positive / negative case of tests/movement/test_ball_actions.py re-run on 30 seeds (sigma_p
    0.3 m, white + AR(1) noise). Counts are failures out of 30; cases not listed failed 0 / 30. Most are
    attribute flips at a boundary or late control starts when a defender is in contact.
  date: '2026-10-20'
  failures_of_30:
    contested_ball (tie-up positive): 4
    contested_ball (holder + on-ball defender negative): 4
    drive_direction (baseline label): 3
    pass (one-touch delivery / missed 0.2 s touch): 3
    post_up (defense_position or contact gate): 3
    live_ball_turnover (strip t0 > 0.3 s late): 3
    kick_out (post source; depends on post_up): 2
    post_seal (contact gate under AR noise): 2
    drive_depth, paint_touch, drive_defender_reaction, hockey_assist, catch_and_shoot (cs_set): 1 each
