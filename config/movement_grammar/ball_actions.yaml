  min_duration_s: null
  outputs: dx_m, skip_true, n_skipped, skipped_ids
  confidence: min(pass conf, P(|dx| > 8), P(r >= 5.5)) x c_edge x c_gap (ball)
  noise: 8 m is far above the noise; top-to-corner passes (|dx| ~ 7 m) are not skips.
  conflicts_resolved: []
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/motion_starts.md', supports: 'SKIP: crosses x = 0 with |dx| > 8 m'}
