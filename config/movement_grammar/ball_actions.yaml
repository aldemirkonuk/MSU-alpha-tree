open_questions:
  - How does the CV pipeline produce ball XY (floor homography of the ball pixel vs 3D)? It decides dribble_bounce method B, the shot rim-reach test and paint-touch ball bias.
  - Ball sigma tier and tracker error autocorrelation must be measured (variogram) before any sigma_v figure is final.
  - Deflection / tap detection needs a changepoint test on the ball track (piecewise-linear fits >= 6 frames each side, likelihood ratio) calibrated on labelled passes; not in 0.1.0.
  - Matchup assignment (defensive_matchups) should replace the nearest-defender proxy in drive_defender_reaction, post_up, post_seal and isolation, carrying its probability.
  - Post moves (BA-63 back-down with median contact <= 0.9 m and dr <= -0.5 m over >= 1.0 s, BA-64 drop step, BA-65 spin) and post double teams (BA-67) are deferred to 0.2.0.
  - Handoff family items (BA-75..BA-77) are owned by the SCREENS family; the pass detector only excludes the exchanges.
  - Shot-family finishes (floater, layup, dunk, hook, step-back, fadeaway) need the shot family or z / pose; the floater range is resolved in drive_depth only.
  - The hidden-dribble priors of catch_and_shoot / held_jumper and the potential-assist dribble prior must be measured on SportVU (z) before use.
