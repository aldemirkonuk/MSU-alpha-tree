- id: post_seal
  research_id: BA-60
  level: primitive
  name: Post seal
  aliases: [SEAL, deep seal]
  actors: {post: offensive non-holder, defender: nearest defender (mode over the run)}
  t0: first frame of the qualifying run
  status: proposal
  detectable: xy
  rule: |
    Per frame, for every offensive player P who is not the holder while a teammate holds the ball:
    (a) P in post_area_rule or r <= gate_r_m; (b) still: stationary_s2 < s2_max; (c) nearest defender D within
    contact_radius_m; (d) phi = angle at P between (D - P) and (ball - P) >= phi_min_deg (D on the far side
    from the ball; aligned with 'behind', checker BA-60/62); (e) ball at r >= ball_min_r_m. Run >= min_s
    with gaps <= max_gap_frames, and displacement over the first min_s <= max_disp_m.
    deep_seal flag (named_spots deep_seal); seal_strict flag = old motion_starts r < 2.5.
  params:
    min_s: {value: 0.8, unit: s}
    gate_r_m: {value: 3.25, unit: m}
    s2_max: {value: 5.99, unit: chi2(2)}
    max_disp_m: {value: 0.8, unit: m}
    contact_radius_m: {value: 1.2, unit: m, note: one contact radius key for seal and post-up}
    phi_min_deg: {value: 135, unit: deg}
    ball_min_r_m: {value: 4.5, unit: m}
    max_gap_frames: {value: 3, unit: frames}
    seal_strict_r_m: {value: 2.5, unit: m, note: 'changes_loop1 BA-T18: seal_strict flag radius (was hard-coded)'}
  min_duration_s: 0.8
  outputs: post, defender, phi_median_deg, duration_s, deep_seal, spot, seal_strict
  confidence: min(window P(contact), window P(phi), fraction still, P(displacement)) x c_edge x c_gap (post)
  noise: phi sigma ~30 deg at |P - D| 0.8 m, hence the persistence and the median phi; contact = ID-swap risk.
  conflicts_resolved:
    - motion_starts r < 2.5 and speed < 0.5 m/s -> post_area_rule or r <= 3.25 with stationary_s2 and displacement.
    - geometry.py post_zone superseded by named_spots.
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/motion_starts.md', supports: 'SEAL: post r < 2.5 m, speed < 0.5 m/s for >= 0.8 s, body between defender and ball'}
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml', supports: deep_seal, post_area_rule}
  validation: Labelled seals; phi class vs coach labels.

- id: post_up
  research_id: BA-61 (+ BA-62 attribute)
  level: primitive
  name: Post-up (post touch)
  aliases: [post up, post touch, back-to-basket, face-up post]
  actors: {post: holder, defender: nearest defender at the catch, passer: entry passer or null}
  t0: catch frame
  status: proposal
