- id: entry_pass
  research_id: BA-46
  level: primitive
  name: Entry passes (high-low, post entry, entry, wing entry)
  aliases: [ENTRY, POST_ENTRY, high-low, feed the post, wing entry]
  actors: {passer: player, receiver: teammate}
  t0: refined release frame
  status: proposal
  detectable: xy
  rule: |
    Priority high_low > post_entry > entry > wing_entry:
    - high_low: passer in high_post_strip or elbow, receiver in low_post / mid_post / deep_seal /
      block_outside_lane, y_passer - y_receiver >= high_low_dy_m.
    - post_entry: receiver in post_area_rule or r < post_receiver_r_m, a post_up starts at this catch (+-0.5 s)
      or the receiver held a post_seal ending <= seal_lookback_s before the catch, passer r >= passer_min_r_m.
    - entry: receiver r < post_receiver_r_m without post evidence (flash / cut catch).
    - wing_entry: the team's first pass in the clip, from the top (m >= wing_top_m_deg, r >= wing_top_r_m)
      to a wing (wing_m_lo_deg <= m <= wing_m_hi_deg, r >= wing_r_m); proxy for 'first pass after ALIGN'.
    changes_loop1 BA-T16: 'entry' needs passer r >= passer_min_r_m, no passer drive within drive_exclusion_s, and not a lob_pass or dump_off.
  params:
