- id: isolation
  research_id: BA-70
  level: action
  name: Isolation
  aliases: [iso, ISO, 1-on-1, clear out]
  actors: {handler: holder, defender: nearest defender at t0}
  t0: first frame of the qualifying window
  status: proposal
  detectable: xy
  rule: |
    Offensive holder in control with the nearest defender <= defender_max_m and no teammate within
    teammate_min_m, for >= min_s (gaps <= 2 frames). No screen: the screens table when available; proxy
    here = no teammate within screen_proxy_m of the handler during the screen_lookback_s before t0.
    clear flag: <= 1 teammate on the ball side (same x sign, |x| >= clear_abs_x_m) within clear_ballside_m.
    from_broken_action: a retreat run (vr >= retreat_vr_mps for >= retreat_s) in the broken_lookback_s
    before t0 (Synergy reclass).
    changes_loop1 BA-T5: the window must contain an attack (drive, shot, or a tight dribble that gains toward the rim; attack_* params); spot-up drives after a catch and edge windows are excluded; attrs.attack.
    changes_loop2: windows starting within touch.clip_start_s of the clip start are dropped (no screen lookback).
    changes_loop3 BA-I1: the teammate-clear distance and the attacking-dribble gain bound widen with the handler's pair sigma (teammate_noise_k, attack_gain_noise_k).
  params:
    min_s: {value: 2.0, unit: s}
    defender_max_m: {value: 2.5, unit: m}
    teammate_min_m: {value: 4.0, unit: m}
    teammate_noise_k: {value: 1.0, unit: sigma, note: 'changes_loop3 BA-I1: the no-teammate test needs dT >= teammate_min_m + this x the handler''s pair sigma (sqrt(2) x calibrated sigma): a teammate 3.3-3.8 m away read >= 4.0 m at sigma_p 0.5 and stretched a 1.6 s window to 2.0 s (S03). k = 2 shifted S26 windows past the clip-start drop at sigma 0.2 (2 new FPs), so 1.0'}
    screen_lookback_s: {value: 3.0, unit: s}
    screen_proxy_m: {value: 1.5, unit: m}
    clear_ballside_m: {value: 6.0, unit: m}
    clear_abs_x_m: {value: 1.0, unit: m}
    broken_lookback_s: {value: 2.0, unit: s}
    retreat_vr_mps: {value: 1.0, unit: m/s}
    retreat_s: {value: 0.5, unit: s}
    max_gap_frames: {value: 2, unit: frames, note: 'changes_loop1 BA-T18: gaps bridged in the qualifying run (was hard-coded)'}
    attack_before_s: {value: 0.5, unit: s, note: 'changes_loop1 BA-T5: the attack may start this long before the window ...'}
    attack_after_s: {value: 1.0, unit: s, note: 'BA-T5: ... or up to this long after it'}
    attack_def_m: {value: 1.5, unit: m, note: 'BA-T5: dribble attack = inferred dribble with the defender within this ...'}
    attack_dribble_min_s: {value: 1.0, unit: s, note: 'BA-T5: ... for at least this long'}
    catch_drive_exclusion_s: {value: 1.0, unit: s, note: 'BA-T5: a window starting this soon after a catch that is followed this soon by a drive is a spot-up drive, not an iso'}
    attack_dribble_gain_m: {value: 1.0, unit: m, note: 'BA-T5: the attacking dribble must also gain this much toward the rim (r at its start minus r_min); a dribble reversal with a shadowing defender is not an attack'}
    attack_gain_noise_k: {value: 1.0, unit: sigma, note: 'changes_loop3 BA-I1: the attacking-dribble gain bound is attack_dribble_gain_m + this x the pair sigma at the window start (a start-minus-minimum of a noisy r series is biased upward); a dribble reversal across the top truly cuts 0.7 m inside the arc, and read >= 1.0 m at sigma_p 0.3 / 0.5 (S26)'}
  min_duration_s: 2.0
  outputs: handler, defender, clear, from_broken_action, screen_check, duration_s
  confidence: min(window P(defender <= 2.5), window P(teammates >= 4.0), touch conf) x c_edge x c_gap
  noise: A missed screen makes a false iso; the proxy is conservative (any teammate within 1.5 m blocks).
  conflicts_resolved: []
  sources:
    - {url: 'https://fansided.com/2017/09/08/nylon-calculus-understanding-synergy-play-type-data/', supports: isolation incl. broken actions}
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md', supports: 'Isolation: >= 2 s holding with no screen'}
  validation: Labelled isos; terminal play type vs Synergy-style labels.

