    front_max_deg: {value: 45, unit: deg}
    unresolved_margin: {value: 0.2, unit: probability, note: 'changes_loop2 BA-T6b: defense_position_status unresolved when the two most likely positions are within this'}
    gate_r_max_m: {value: 4.2, unit: m, note: 'changes_loop1 BA-T6: the |x| / FT-line gate clause also needs r <= this'}
  min_duration_s: 1.0
  outputs: post, defender, passer, touch_duration_s, end_kind, post_depth, spot, defense_position, posture, defender_rim_side
  confidence: min(window P(contact), P(quiet), touch conf) x c_edge x c_gap (post)
  noise: Perimeter defence also puts D rim-side; the contact and quiet gates plus the post gate separate wing catches.
