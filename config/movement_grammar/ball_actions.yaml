  aliases: [C&S, spot-up jumper]
  actors: {shooter: player}
  t0: release frame (window starts at the catch)
  status: proposal
  detectable: xy
  rule: |
    Jump shot (release r > min_r_m) from a touch that began with a pass / handoff catch, no inferred dribble,
    catch-to-release <= max_touch_s. Without z a stationary dribble is invisible: conf x (1 -
    p_hidden_dribble_short) for touches <= short_touch_s, x (1 - p_hidden_dribble_long) otherwise, and the
    alternatives list pull_up with that probability. cs_set (catch speed <= set_speed_mps), cs_on_move
    (>= move_speed_mps), one_motion (<= one_motion_s).
  params:
    min_r_m: {value: 3.048, unit: m}
    max_touch_s: {value: 2.0, unit: s}
    short_touch_s: {value: 1.0, unit: s}
    p_hidden_dribble_short: {value: 0.05, unit: probability, note: proposal prior}
    p_hidden_dribble_long: {value: 0.2, unit: probability, note: proposal prior}
    set_speed_mps: {value: 1.0, unit: m/s}
    move_speed_mps: {value: 2.0, unit: m/s}
    one_motion_s: {value: 0.6, unit: s}
    catch_speed_window_s: {value: 0.4, unit: s, note: 'changes_loop1 BA-T18: catch speed window for cs_set / cs_on_move (was hard-coded)'}
