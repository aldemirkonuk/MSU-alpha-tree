# L2: drives
# ======================================================================================
- id: drive
  research_id: BA-30
  level: primitive
  name: Drive
  aliases: [DRIVE, penetration, attack the basket, R-EV-06, short_drive]
  actors: {driver: offensive holder, defender: nearest defender at t0 (matchup proxy)}
  t0: onset - first frame (walking back from the sustained run) with vr < onset_vr_mps, not before the touch start; end = t1 (end of the approach)
  status: canonical
  detectable: xy
  rule: |
    Inside one offensive touch (the holder controls the ball; travelling that far implies dribbling):
    (a) a sustained run vr <= vr_max_mps for >= sustain_s (gaps <= run_max_gap_frames bridged);
    (b) t0 = onset (above); search end = the first frame after the run where vr > 0 for >= retreat_s (or
        the touch end: pickup / release / loss); r_min = minimum r on [t0, search end]; t1 = end of the
        approach = first frame after the run with vr >= end_vr_mps, capped at the r-minimum frame (a
        driver standing still at the end must not move t1 to a noise minimum; -1.0 rather than the
        -0.5 onset value offsets the smoother's lag at the stop);
    (c) start r(t0) >= start_r_min_m and gain r(t0) - r(t1) >= gain_min_m and depth ceiling
        r_min <= r_min_max_m or d3(t1) <= d3_min_max_m (checker BA-30);
    (d) mean vr over the run <= vr_max_mps, mean vr over the whole approach -(r(t0) - r(t1)) / (t1 - t0)
        <= vr_max_mps (a slow walk-in with a few noisy fast frames is not a drive), and (t1 - t0) >=
        min_duration_s.
    short_drive subtype: short_start_r_min_m <= r(t0) < start_r_min_m and gain >= short_gain_min_m.
    changes_loop2 BA-T14b: (b) after the s2-gated walk-back the onset continues up to onset_s2_lag_s while
        vr < onset_lag_vr_mps in the low-noise tiers (calibrated sigma <= onset_s2_lag_sigma_max_m); te
        (event t0 of drive_depth / drive_outcome) = first frame after the run's peak with vr above
        end_vr_mps - end_vr_sigma_slope x (sigma - end_vr_sigma_ref_m), capped at t1; t1 itself (geometry) is
        unchanged.
    changes_loop3 BA-T14c: onset_lag_vr_mps 0.0 -> -0.2 (the allowance no longer runs on a still player's noise).
    Flags: nba_drive (r0 >= 6.096 and r_min <= 3.048, not transition); closeout_attack (t0 <= 1.0 s after
    a catch at which the nearest defender closed >= 3.0 m/s over 0.5 s); transition_drive (handler in the
    backcourt within transition_lookback_s; proxy until the transition family's window exists).
  params:
    start_r_min_m: {value: 5.5, unit: m}
    gain_min_m: {value: 3.0, unit: m, note: R-EV-06}
    vr_max_mps: {value: -1.5, unit: m/s}
    sustain_s: {value: 0.3, unit: s}
    run_max_gap_frames: {value: 6, unit: frames}
    onset_vr_mps: {value: -0.5, unit: m/s}
    end_vr_mps: {value: -1.0, unit: m/s}
    retreat_s: {value: 0.3, unit: s}
    min_duration_s: {value: 0.5, unit: s}
    r_min_max_m: {value: 5.0, unit: m, note: checker BA-30}
    d3_min_max_m: {value: -1.0, unit: m, note: checker BA-30}
    short_start_r_min_m: {value: 3.5, unit: m}
    short_gain_min_m: {value: 2.0, unit: m}
    nba_start_r_m: {value: 6.096, unit: m}
    nba_rmin_m: {value: 3.048, unit: m}
    closeout_window_s: {value: 1.0, unit: s}
    closeout_speed_mps: {value: 3.0, unit: m/s}
    transition_lookback_s: {value: 3.0, unit: s}
    onset_s2_min: {value: 5.99, unit: chi2 (2 dof), note: 'changes_loop1 BA-T14: onset walk-back also needs stationary_s2 >= this'}
    onset_s2_lag_s: {value: 0.2, unit: s, note: 'changes_loop2 BA-T14b: after the s2-gated walk-back, continue at most this much further while vr < onset_lag_vr_mps (chi-square latency and the slow ramp on a start from rest)'}
    onset_lag_vr_mps: {value: -0.2, unit: m/s, note: 'changes_loop2 BA-T14b: during the onset_s2_lag_s allowance the walk-back continues while vr < this (the ramp from rest back to zero radial speed). changes_loop3 BA-T14c: 0.0 -> -0.2: after 2.6 s at rest (S17) the smoothed vr of a still player is below 0 on about half of the frames, so the allowance ran its full 0.2 s on noise; -0.2 keeps the S18 slow-ramp fix (drive at sigma 0.2 unchanged)'}
    onset_s2_lag_sigma_max_m: {value: 0.15, unit: m, note: 'changes_loop2 BA-T14b: the onset_s2_lag_s allowance applies only when the driver''s calibrated position sigma at the onset is <= this (sigma_p 0.2 / 0.3 tiers: 0.09 / 0.12 m; 0.5 tier: 0.18 m)'}
    end_vr_sigma_ref_m: {value: 0.09, unit: m, note: 'changes_loop2 BA-T14b: calibrated position sigma (sigma_p 0.2 tier) at which the approach-end time te uses end_vr_mps unchanged'}
    end_vr_sigma_slope: {value: 11.0, unit: (m/s)/m, note: 'changes_loop2 BA-T14b: te threshold = end_vr_mps - this x (sigma - end_vr_sigma_ref_m); te (event t0 of drive_depth / drive_outcome) is the first frame after the run peak with vr above it, capped at t1. Fit on the harness drives: -1.0 / -1.5 / -2.0 m/s best at sigma_p 0.2 / 0.3 / 0.5'}
    handoff_lookback_s: {value: 0.5, unit: s, note: 'changes_loop1 BA-T11: after a handoff the onset may walk back to the giver-receiver closest approach in [giver end - this, touch start]'}
    closeout_closing_window_s: {value: 0.5, unit: s, note: 'changes_loop1 BA-T18: closing-speed window before the catch (was hard-coded)'}
  min_duration_s: 0.5
  outputs: driver, defender, subtype, start_r, r_min, gain_m, mean_v_r, duration_s, nba_drive, closeout_attack, transition_drive, start_spot, criteria, end_kind
  confidence: min(P(start r), P(gain), window P(vr <= -1.5), P(duration), P(depth ceiling), touch conf) x c_edge x c_gap (driver)
  noise: Gain test robust (3 m vs ~0.2 m smoothed sigma); onset jitter ~0.1-0.2 s (AR noise); post back-downs excluded by the 5.5 m start.
  conflicts_resolved:
    - NBA 20 ft -> 10 ft (offense_full, motion_starts) vs R-EV-06 3 m gain -> canonical 3 m gain + 5.5 m start + vr; nba_drive kept as a flag.
    - No r_min ceiling labelled arc attacks as drives -> r_min <= 5.0 or d3 <= -1.0 (checker).
  sources:
    - {url: 'https://en.wikipedia.org/wiki/Player_tracking_(NBA)', supports: drive = touch starting >= 20 ft from the hoop dribbled within 10 ft, excluding fast breaks}
    - {url: 'https://www.nba.com/stats/help/glossary', supports: drive = attack off the dribble in the half court (no distances given)}
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/schema/tables/drives.yaml', supports: grain = gaining >= 3 m toward the rim}
  validation: R-EV-06 drives found >= 90%; onset error <= 0.3 s on 90%.

- id: drive_direction
  research_id: BA-31 + BA-32
  level: primitive
  name: Drive direction (baseline / middle / straight / top) and side (left / right)
  aliases: [drive_baseline, drive_middle, drive side]
  actors: {driver: player}
  t0: drive t0
  status: canonical
  detectable: xy
  rule: |
    (hx, hy) = driver at drive t0, (x, y) = driver at t1. Per position sample (samples, sigma = calibrated
    position sigma at each end): 'baseline' if named_spots drive_baseline holds, else 'middle' if
    drive_middle holds, else 'top' when |hx| < top_abs_x_m (both spots need |hx| >= 0.9), else 'straight'.
    Label = argmax (unresolved within the margin). Side: u = unit start->rim, d = end - start,
    lat = cross(u, d); left if lat > side_deadband_m, right if lat < -side_deadband_m, else straight.
  params:
    samples: {value: 256, unit: count}
    unresolved_margin: {value: 0.15, unit: probability}
    top_abs_x_m: {value: 0.9, unit: m, note: mirrors the |hx| >= 0.9 gate inside drive_baseline / drive_middle}
    side_deadband_m: {value: 0.5, unit: m}
  min_duration_s: null
  outputs: label, status, alternatives, side, lateral_m
  confidence: min(P(label), drive P_cond) x c_edge x c_gap
  noise: 10 deg at r ~ 4 m is ~0.7 m lateral (several smoothed sigmas); sampling gives the boundary probability.
  conflicts_resolved: []
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml', supports: drive_baseline / drive_middle relative entries}
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/schema/tables/drives.yaml', supports: direction and side enums}
  validation: R-EV-06 direction >= 95% on labelled drives.

- id: drive_depth
  research_id: BA-33
  level: primitive
  name: Drive depth class
  aliases: [depth reached]
  actors: {driver: player}
  t0: drive t1 (end of the approach, where r_min is reached)
  status: canonical
  detectable: xy
  rule: |
    Complete partition at the r_min position (checker fix): rim (post_depth_deep) > floater (floater_zone)
    > paint (paint) > baseline_dead (dunker_spot or short_corner) > outside_lane_short (post_depth_standard
    outside the paint) > short (everything else). Class probability by position sampling.
  params:
    samples: {value: 256, unit: count}
    unresolved_margin: {value: 0.15, unit: probability}
  min_duration_s: null
  outputs: label, status, alternatives, r_min, sd_paint_out
  confidence: P(label) x c_edge x c_gap
  noise: Near boundaries the sampled distribution is stored, not a boolean.
  conflicts_resolved:
    - floater class was unreachable behind paint; outside-lane 1.83-3.05 m had no class (checker BA-33).
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml', supports: post_depth_deep, floater_zone, paint, dunker_spot, short_corner, post_depth_standard}
  validation: Depth class vs labels on the probe grid and labelled drives.

- id: paint_touch
  research_id: BA-34
  level: primitive
  name: Paint touch
  aliases: [PAINT_TOUCH]
  actors: {holder: player}
  t0: first touch frame with P_in(paint) >= p_in_min
  status: canonical
  detectable: xy
  rule: |
    Offensive touch with the holder's stance centre in the paint, P_in = Phi(-sd_paint_out / sigma) (named
    spots continuous coordinate, half-plane case), >= p_in_min on one consecutive run of >= min_dwell_s
    (gaps <= max_gap_frames) whose window confidence is also >= p_in_min (changes_loop1 BA-T15; 0.1.0 counted
    cumulative frames, so noise flicker of a post on the block added up). One per touch. via = catch (caught in the lane), drive (a drive active), other. nba_paint_touch flag = caught
    inside the lane (NBA glossary definition, comparability).
  params:
    min_dwell_s: {value: 0.2, unit: s}
    p_in_min: {value: 0.5, unit: probability, note: 'changes_loop1 BA-T15: 0.7 was tried (early fires on a block post 2/5/10 -> 2/2/5 of 20 at sigma 0.2/0.3/0.5) but cut harness recall 0.97 -> 0.92 at sigma 0.3; kept at 0.5'}
    max_gap_frames: {value: 2, unit: frames, note: 'changes_loop1 BA-T15: gaps bridged inside the consecutive in-paint run'}
  min_duration_s: 0.2
  outputs: holder, via, dwell_s, nba_paint_touch
  confidence: window_conf of P_in over the qualifying run x c_edge x c_gap
  noise: Without z the ball XY is biased along the camera ray, so the stance centre is used (not the ball).
  conflicts_resolved:
    - NBA Paint Touch (receives in the lane) differs from the 0.2 s dwell -> nba_paint_touch flag (checker).
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md', supports: 'PAINT_TOUCH: ball inside the paint >= 0.2 s'}
    - {url: 'https://www.nba.com/stats/help/glossary', supports: Paint touches = touches that start in the lane}
  validation: Per-chance paint-touch counts vs labelled possessions.

- id: drive_defender_reaction
  research_id: BA-35
  level: primitive
  name: Drive defender reaction and help
  aliases: [beaten, contained, recovered, help arrival]
  actors: {driver: player, defender: nearest defender at t0 (matchup proxy), help: first other defender within help radius}
  t0: drive t0
  status: proposal
  detectable: xy
  rule: |
    D = nearest defender at drive t0 (until defensive_matchups exists). beaten: r_driver < r_D -
    beaten_margin_m and |driver - D| >= beaten_sep_m for >= beaten_min_s. recovered: beaten, then D rim-side
    (r_D <= r_driver + rim_side_margin_m) again for >= recovered_min_s before t1. contained (checker fix): not
    beaten and D rim-side on >= contained_frac of the drive frames (no gain cap). Else unresolved.
    help = first other defender within help_radius_m of the driver during [t0, t1]; help_arrival_s.
  params:
    beaten_margin_m: {value: 0.5, unit: m}
    beaten_sep_m: {value: 0.8, unit: m}
    beaten_min_s: {value: 0.1, unit: s}
    rim_side_margin_m: {value: 0.3, unit: m}
    contained_frac: {value: 0.9, unit: fraction}
    recovered_min_s: {value: 0.3, unit: s}
    help_radius_m: {value: 1.5, unit: m, note: drives.yaml}
  min_duration_s: null
  outputs: label, help, help_arrival_s, matchup source
  confidence: min(window P(beaten geometry) or mean P(rim-side), drive P_cond) x c_edge x c_gap; matchup confidence to be multiplied when available
  noise: Bodies within 0.8 m risk ID swaps; matchup errors assign the wrong D.
  conflicts_resolved:
    - contained required gain < 3.5 m, leaving a gap with beaten (checker BA-35).
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/schema/tables/drives.yaml', supports: help within 1.5 m; reaction enum contained, beaten, fouled, stripped}
  validation: Reaction class vs labels; help arrival error <= 0.2 s.

- id: drive_outcome
  research_id: BA-36
  level: action
  name: Drive outcome
  aliases: [drive result]
  actors: {driver: player}
  t0: drive t1
  status: canonical
  detectable: xy
  rule: |
    First of, from t0 to t1 + window_s: shot (shot_release), kick_out_pass (kick_out), dump_off_pass
    (dump_off), other_pass, turnover (next control by the opponent); else reset when the driver's r returns
    to >= reset_r_m within the window; else continue (or unresolved_clip_end). foul_drawn needs PBP.
  params:
    window_s: {value: 1.0, unit: s, note: unified with kick_out and dump_off (checker BA-48)}
    reset_r_m: {value: 5.5, unit: m}
  min_duration_s: null
  outputs: label, foul_drawn (needs_pbp)
  confidence: drive P_cond x c_edge x c_gap
  noise: Inherits from its parts.
  conflicts_resolved:
    - BA-36 1.5 s vs BA-48 1.0 s window -> 1.0 s everywhere.
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/schema/tables/drives.yaml', supports: result enum}
  validation: Outcome vs labels on drives.

# ======================================================================================
# L2: passes
# ======================================================================================
- id: pass
  research_id: BA-40 + BA-41
  level: primitive
  name: Completed pass (with delivery)
  aliases: ['PASS(a->b)', one_touch, off_dribble, pitch]
  actors: {passer: player, receiver: teammate}
  t0: refined release frame
  status: canonical
  detectable: xy
  rule: |
    Touch of A, FLIGHT, touch of teammate B != A with no LOOSE phase >= loose_min_s, travel >= min_travel_m,
    air >= min_air_s. Handoff (excluded, screens family): air <= handoff_max_air_s and |A - B| <=
    handoff_max_dist_m at the exchange (checker BA-40 closes the pass/handoff gap); adjacent control
    segments with no free frame are handoffs too.
    delivery: one_touch if A caught the ball and released <= one_touch_max_s later; off_dribble_inferred if
    A's inferred dribble ended <= off_dribble_max_s before the final gather; else from_hold.
    pitch flag: air in [pitch_air_min_s, pitch_air_max_s] and travel in [pitch_dist_min_m, pitch_dist_max_m].
    lane_openness_m = nearest defender's distance to the release-catch segment at mid-flight.
    advantage_pass: receiver's nearest defender at the catch >= open_dist_m and >= the passer's at release +
    advantage_gain_m.
    changes_loop1 BA-T11: handoff distance is the closest approach over [A.b - handoff_lookback_s, B.a]; travel <= handoff_max_travel_m with that approach <= handoff_max_dist_m is a handoff.
  params:
    min_travel_m: {value: 1.0, unit: m}
    min_air_s: {value: 0.10, unit: s}
    handoff_max_air_s: {value: 0.3, unit: s, note: offense_full A11.18}
    handoff_max_dist_m: {value: 1.5, unit: m, note: checker BA-40}
    one_touch_max_s: {value: 0.30, unit: s}
    off_dribble_max_s: {value: 0.30, unit: s}
    pitch_air_min_s: {value: 0.3, unit: s}
    pitch_air_max_s: {value: 0.7, unit: s}
    pitch_dist_min_m: {value: 1.0, unit: m}
    pitch_dist_max_m: {value: 3.5, unit: m}
    open_dist_m: {value: 1.83, unit: m, note: 6 ft closely guarded}
    advantage_gain_m: {value: 0.5, unit: m}
    handoff_lookback_s: {value: 0.5, unit: s, note: 'changes_loop1 BA-T11: handoff distance = closest approach over [passer end - this, receiver start]'}
    handoff_max_travel_m: {value: 1.5, unit: m, note: 'BA-T11: ball travel <= this with closest approach <= handoff_max_dist_m is a handoff whatever the air time'}
  min_duration_s: 0.1
  outputs: passer, receiver, distance_m, travel_m, air_s, speed_mps, delivery, pitch, lane_openness_m, passer_def_m, receiver_def_m, advantage_pass, release / catch xy, spots, catch_region
  confidence: min(passer conf, receiver conf, P(travel >= 1.0), P(air >= 0.1)) x c_edge(ball) x c_gap(ball)
  noise: Overhead passes without z can look like a catch by a player under the flight (velocity gate blocks most); deflections need a changepoint test (open question).
  conflicts_resolved:
    - Pass vs handoff gap at 1.0-1.5 m (checker BA-40).
  sources:
    - {url: 'https://www.stat.cmu.edu/cmsac/conference/2020/assets/pdf/nba_tracking_data.pdf', supports: pass detection logic and the 72% / 85.8% baseline (SportVU with ball z)}
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/vocab/actions_extra.yaml', supports: one_touch / off_dribble <= 0.30 s}
  validation: Pass recall / precision >= 95 / 95 on visible passes.

- id: pass_incomplete
  research_id: BA-40 (incomplete)
  level: primitive
  name: Incomplete pass (intercepted / thrown away)
  aliases: [interception, bad pass, thrown away]
  actors: {passer: player, intended: teammate or null, defender: interceptor or null}
  t0: refined release frame
  status: canonical
  detectable: xy
  rule: |
    A non-shot FLIGHT whose next control is an opponent with no LOOSE phase (intercepted), or whose ball
    crosses out of bounds (named_spots court_region out_of_bounds: thrown_away_oob), or that ends in a LOOSE
    phase >= loose_min_s before another player's control (thrown_away_loose). Intended receiver = teammate
    with the smallest angle between the release heading (first 4 flight frames) and his bearing, if <
    intended_max_angle_deg. Deflections need a changepoint test (open question).
  params:
    intended_max_angle_deg: {value: 20, unit: deg}
    heading_frames: {value: 4, unit: frames, note: 'changes_loop1 BA-T18: release heading measured over this many frames (was hard-coded)'}
  min_duration_s: null
  outputs: label, intended, intended_angle_deg
  confidence: passer conf (and interceptor conf) x c_edge(ball) x c_gap(ball)
  noise: Out-of-bounds needs the ball observed past the line; balls leaving view stay unresolved.
  conflicts_resolved: []
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/motion_starts.md', supports: PASS ending in b's control}
  validation: Against PBP bad-pass turnovers and steals.

- id: lob_pass
  research_id: BA-42
  level: primitive
  name: Lob pass (XY proxy)
  aliases: [LOB, alley-oop pass, R-ST-26]
  actors: {passer: player, receiver: teammate}
  t0: refined release frame
  status: proposal
  detectable: xy
  rule: |
    With z: apex >= 3.5 m (R-ST-26); not implemented here. Without z, a completed pass is a lob when
    (tof) air >= tof_min_s, distance <= tof_max_dist_m and a lob target (checker): catch r < target_r_max_m
    or receiver vr (mean 0.4 s before catch) <= target_vr_max_mps; or
    (proxy) catch r < proxy_catch_r_m with receiver vr <= proxy_vr_mps and air >= proxy_min_air_s.
    A long pass without a lob target (high skip) is not a lob. No-bounce check needs z. apex estimate =
    g T^2 / 8 above release (equal release / catch heights). lob_to_rim flag = catch r < 1.5 m.
    changes_loop1 BA-T13: air time corrected by refine_radius / speed at both ends (closing speed at the catch) before the tof test.
  params:
    tof_min_s: {value: 1.03, unit: s, note: g T^2 / 8 = 1.30 m above a ~2.2 m release}
    tof_max_dist_m: {value: 12.0, unit: m}
    target_r_max_m: {value: 3.0, unit: m}
    target_vr_max_mps: {value: -2.0, unit: m/s}
    proxy_catch_r_m: {value: 1.5, unit: m}
    proxy_vr_mps: {value: -3.0, unit: m/s}
    proxy_min_air_s: {value: 0.7, unit: s}
    catch_jitter_frames: {value: 2, unit: frames}
    max_conf_xy: {value: 0.8, unit: probability, note: 'multiplier on the lob conf without z (changes_loop1 BA-T18: it was described as a cap but is applied as a factor)'}
    receiver_vr_window_s: {value: 0.4, unit: s, note: 'changes_loop1 BA-T18: receiver v_r averaged over this window before the catch (was hard-coded)'}
    lob_to_rim_r_m: {value: 1.5, unit: m, note: 'BA-T18: lob_to_rim flag radius (was hard-coded)'}
  min_duration_s: null
  outputs: method {tof, proxy}, apex_above_release_est_m, catch_r, receiver_v_r, lob_to_rim, bounce_checked (needs_ball_z)
  confidence: min(P(air), P(target), pass conf) x max_conf_xy x c_edge x c_gap (ball)
  noise: The proxy also matches bounce passes to cutters (no z); report precision on that hard set.
  conflicts_resolved:
    - motion_starts apex > 3.5 AND r < 1.5 vs R-ST-26 OR form -> OR form plus the lob_to_rim flag.
    - Apex-only and time-of-flight routes matched high skip passes (checker BA-42).
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/requirements_review/proposals_consolidated.yaml', supports: R-ST-26 lob apex >= 3.5 m or proxy (catch r < 1.5 moving rimward >= 3 m/s)}
  validation: Precision on bounce passes to cutters and on overhead skips (SportVU z truth).

- id: pass_height_type
  research_id: BA-43 + BA-44
  level: primitive
