family: ball_actions
research_family: BALL ACTIONS
version: 0.1.4
date: '2026-10-22'
owner: Mac session (msu-colab) for Aldemir
status: proposal under the build freeze
detectors: tools/specgen/movement/detectors/ball_actions.py
tests: tests/movement/test_ball_actions.py
frame: >-
  Attacked-rim frame of config/named_spots.yaml 0.3.2 (metres, rim at the origin, +y toward half court).
  29.97 fps, DT = 1001/30000 s; elapsed durations are (n_frames - 1) * DT. Positions are CA-RTS smoothed
  stance centres (MP-04, mvlib.smooth); the ball is one smoothed track. Every spot label, zone and continuous
  coordinate (d3, sd_paint_out) comes from named_spots.yaml through spotlib; this file never redefines a spot.
conventions:
  v_r: >-
    Research v_r is negative toward the rim. mvlib.Kin.v_r is positive toward the rim, so detectors use
    vr = -Kin.v_r and every v_r threshold below is in the research sign (negative = toward the rim).
  stationary: >-
    'Still' tests use the MP-09 chi-square statistic stationary_s2 < 5.99 (2 dof, 95%) per frame plus a
    displacement bound over the window, never raw speed < 0.3-0.5 m/s (CA-RTS speed is Rician, biased up at rest).
  confidence: see rule ba_confidence.
  label_items: >-
    Classifier items (drive_direction, drive_depth, entry_pass, rebound_control, ...) emit one event whose
    kind is the item and whose attrs.label is the class; attrs.alternatives holds the class distribution and
    attrs.status is 'unresolved' when the top two are within unresolved_margin.
  needs_data: >-
    Items marked detectable: needs_data have a detector that returns [] until the named input exists
    (ball z, pose keypoints, PBP, restart state). They are never guessed from XY.
checker_fixes:
  BA-R0: impulse frame-difference segmenter dropped; flight/control from holder-proximity hysteresis on the CA-RTS ball track (ba_kinematics_noise).
  BA-R0-sigma: sigma_v taken from the CA-RTS covariance x K_CAL (MP-09) instead of the white-noise windowed formula; measured variogram is a validation task.
  BA-00: 0.4 s forward-window relative-speed gate (not 0.2 s) on the frames where the candidate is the nearest player; pass-completion team prior; team-change confirmation (0.6 s); exit after 2 frames beyond 1.5 m; occlusion hold 0.5 s; no flight spans a cut.
  BA-14: hesitation restated (slow phase >= 0.3 s, displacement-deficit form) inside dribble_move_type (needs_ball_z).
  BA-03: pickup = no bounce >= max(0.5 s, 1.5 x local period); band 1.0-5.5 Hz; method B gated on the CV ball-XY method (dribble_bounce, needs_ball_z).
  BA-33: depth partition reordered rim > floater > paint > baseline_dead > outside_lane_short > short (complete).
  BA-48: drive_pass parent with kick_out three / mid and dump_off children; 1.0 s window everywhere (BA-36 too).
  BA-42: lob needs a lob target (catch r < 3.0 or receiver v_r <= -2.0); proxy needs air >= 0.7 s; high skip passes are not lobs.
  BA-61: post gate restricted (post_area_rule or |x| <= 4.0 below the FT line), contact <= 1.2 m for >= 0.5 s, quiet holder; posture unknown without pose.
  BA-63: not implemented in 0.1.0 (post moves deferred); fix recorded in open_questions.
  BA-10: hand switch only with hand keypoints (dribble_move_type, needs pose).
  BA-R1: min over criteria instead of product; candidates emitted on the point rule, no p >= 0.5 gate before calibration; PBP as log-odds.
  BA-30: r_min <= 5.0 or d3_min <= -1.0 ceiling; 20 ft / 10 ft cited to Wikipedia only.
  BA-35: contained = not beaten and rim-side on >= 90% of frames (no gain cap); recovered class added.
  BA-40: handoff when air <= 0.3 s and players <= 1.5 m apart (no pass/handoff gap); CMU baseline had ball z.
  BA-47: dribble_reversal separate item; swing on polar theta.
  BA-60/BA-62: seal at phi >= 135 deg (= behind); one contact radius key (1.2 m) for seal and post-up.
  BA-50: outlet 3.0 s with outlet_quick (<= 1.5 s, 6-15 m) flag.
  BA-02: release kind order shot > lost > intercepted > pass.
  summary-citations: NBA C&S numbers cited to Wikipedia Player_tracking_(NBA) only; nba_paint_touch flag added.
missing_items_added:
  - shot family (catch_and_shoot, pull_up, held_jumper, shot_release with gather) as XY proxies with alternatives
  - turnover / steal (live_ball_turnover, pass_incomplete) and violations (violation_turnover, needs_data)
  - rebounds (rebound_control); tip and box-out deferred to needs_ball_z / defense family
  - fakes and footwork declared needs_data (pose)
  - noise model and ball sigma tiers (ba_kinematics_noise)
  - ground-truth test plan (validation field on every item and ba_validation_plan)
  - camera-cut handling (touch rule and ba_kinematics_noise)
  - jump ball / held ball (contested_ball) with the possession arrow from PBP
  - precedence table (ba_precedence)
items:
# ======================================================================================
# Rules (shared)
# ======================================================================================
- id: ba_kinematics_noise
  research_id: BA-R0
  level: rule
  name: Ball-action kinematics and noise budget (shared)
  aliases: [noise budget, windowed kinematics]
  actors: all objects
  t0: n/a
  status: proposal
  detectable: rule
  rule: |
    1. Players and ball are smoothed with the MP-04 CA-RTS smoother per segment (mvlib.smooth); a camera cut
       or a gap > 2.0 s starts a new segment, and no FLIGHT, catch or release may span a segment edge
       (frames with edge == 0 inside a free-ball interval make that interval 'unknown').
    2. The ball is NOT segmented at impulses by frame differences (checker: a 3-frame velocity difference
       fires on 70-92% of frames at sigma 0.3 m). Control and flight come from the holder-proximity
       hysteresis of item touch; the smoother's lag at a catch or release (about 3-6 frames) is absorbed by
       the refine step (back / forward extrapolation to d_bp = refine_radius_m) and by t0 tolerances.
    3. Every speed / heading sigma is the CA-RTS covariance inflated by K_CAL = 1.8 (MP-09), times k_edge
       near segment edges. The research windowed formula sigma_vW = sqrt(2) sigma_pos / W is kept only as an
       upper bound (1.06 / 0.85 / 0.42 m/s at W 0.4 / 0.5 / 1.0 s, sigma_pos 0.3 m); the measured value
       (0.16-0.68 m/s in the skeptic simulation) depends on the tracker's error autocorrelation and must be
       measured from a variogram on static players and known-path drills, stored per sigma tier.
    4. Ball sigma is tracked separately from player sigma (ball_sigma_tiers); the ball is small, blurred and
       occluded, so its tier is usually one step worse than the players'.
  params:
    k_cal: {value: 1.8, unit: '1', note: MP-09 default until measured}
    ball_sigma_tiers: {value: [0.15, 0.30, 0.50, 1.0], unit: m, note: named_spots rule_position_sigma_model tiers, applied to the ball separately}
    sigma_vw_upper_w04: {value: 1.06, unit: m/s, note: white-noise bound at W 0.4 s, sigma 0.3 m}
  min_duration_s: null
  outputs: per-object smoothed x, y, v, a, var_p, var_v, edge, state (mvlib.Kin)
  confidence: n/a (feeds every item)
  noise: Correlated (AR) tracker noise inflates real velocity errors by up to 1.8x over the filter's own covariance; K_CAL covers this until measured.
  conflicts_resolved:
    - Instantaneous stationary cut-offs (0.3 / 0.5 / 0.6 m/s) are replaced by stationary_s2 < 5.99 plus displacement bounds.
    - Impulse segmentation by 3-frame velocity differences is dropped (checker BA-R0).
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml', supports: rule_position_sigma_model tiers 0.15 / 0.30 / 0.50 / 1.0 m}
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/tools/specgen/movement/mvlib.py', supports: CA-RTS smoother, K_CAL 1.8, stationary_s2}
  validation: Variogram of residuals on static players and on known-path drills (both games with footage); report per sigma tier.

- id: ba_confidence
  research_id: BA-R1
  level: rule
  name: Confidence model for every ball-action instance
  aliases: [p_raw, calibration]
  actors: n/a
  t0: n/a
  status: proposal
  detectable: rule
  rule: |
    conf = P_cond x c_edge x c_gap (MP-16), clipped to [0, 1].
    - P_cond = MIN over the item's criteria of each criterion's probability: Phi(margin / sigma) for point
      tests, mvlib.window_conf of the per-frame probability for held conditions, Phi((run - min) / 1 frame)
      for duration criteria, class frequency under position sampling for label items. Min, not product:
      criteria share the same noisy positions (r and v_r of one track), and a product of 5 criteria at a
      1-sigma margin is 0.42, which the checker showed cuts recall.
    - c_edge = mvlib.edge_factor at t0 (0 within 5 frames of a segment edge), c_gap = mvlib.gap_factor
      over [start, end] (0.8 with short interpolation, 0 with long gaps).
    - Composite items take the min of their constituents (MP-16 actions).
    - Emission: an instance is emitted when its point-estimate rule holds; conf is attached and is NOT a gate
      before calibration. Review queue: conf < 0.6 (requirements.md:587).
    - Calibration: isotonic regression per item, conf -> p_cal, on >= 50 labels per class from >= 5 games
      (R-ST-10); until then conf is a raw score.
    - PBP anchoring (ba_pbp_anchor) enters as a likelihood ratio in log-odds, never as a multiplier.
    - Label items: argmax class; status 'unresolved' when the top two are within unresolved_margin (0.15).
    - Every event carries the criteria margins it was decided on (attrs.criteria where computed).
  params:
    unresolved_margin: {value: 0.15, unit: probability}
    review_below: {value: 0.6, unit: probability}
  min_duration_s: null
  outputs: Event.conf, attrs.criteria, attrs.status, attrs.alternatives
  confidence: n/a
  noise: Independence is not assumed; isotonic calibration absorbs residual mis-scaling per item.
  conflicts_resolved:
    - Research p_raw = product of Phi with a 0.5 gate replaced by min and no pre-calibration gate (checker BA-R1).
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml', supports: rule_probabilistic_membership P_in = Phi(d / sigma), sampling for complex regions}
  validation: Reliability diagram per item on the labelled sample; ECE <= 0.05 after isotonic calibration.

- id: ba_precedence
  research_id: new (checker missing item)
  level: rule
  name: Precedence when several ball actions claim the same frames
  aliases: [overlap resolution]
  actors: n/a
  t0: n/a
  status: proposal
  detectable: rule
  rule: |
    Applied by consumers (composition engine); detectors emit every instance with its conf.
    1. shot_release beats pass on the same flight; an alley-oop catch (teammate control <= 0.4 s after the
       ball reaches the rim, at r <= 1.5 m) makes the flight a pass (lob_pass), not a shot.
    2. Handoff exchange (air <= 0.3 s, players <= 1.5 m apart) beats pass; handoffs belong to the screens family.
    3. post_up beats drive and isolation for the same touch (post_iso is a post_up attribute).
    4. kick_out / dump_off (drive or post source) beat swing_pass and skip_pass as the pass's role; skip_pass
       and swing_pass stay as geometric attributes of the same pass.
    5. A reversal by skip is reported once as ball_reversal(via=skip); the skip_pass event is kept.
    6. catch_and_shoot / pull_up / held_jumper are mutually exclusive for one shot (decided by inferred
       dribble and touch time); a stationary-dribble pull-up cannot be separated from a held jumper without
       ball z, so held_jumper carries both alternatives.
    7. drive_outcome uses the first of: shot, kick_out, dump_off, other pass, turnover, reset within 1.0 s.
    8. A team change of control without a shot is a live_ball_turnover; after a shot it is a rebound.
  params: {}
  min_duration_s: null
  outputs: n/a
  confidence: n/a
  noise: n/a
  conflicts_resolved: []
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md', supports: 'DHO thresholds, drive-and-kick 1 s window'}
  validation: Count overlapping claims per possession on labelled games; every overlap must resolve to one terminal label.

- id: ba_pbp_anchor
  research_id: BA-R2
  level: rule
  name: PBP anchoring, blind and anchored outputs
  aliases: [anchoring]
  actors: n/a
  t0: n/a
  status: proposal
  detectable: needs_data
  needs: [pbp]
  rule: |
    Every ball action is produced blind first. Anchoring matches CBBD rows (1 s resolution) with a Hungarian
    assignment on time: shot +-2.0 s, turnover / steal +-2.0 s of a LOOSE or opponent control, assist =
    the last completed pass to the shooter in the chance, DREB = the control flip. Anchoring changes conf by
    a likelihood ratio in log-odds (proposal: LR 3 for a matching row, 1/3 for a contradicting row) and never
    moves frames by more than 1.0 s. Both versions are stored; disagreements go to cv_events_unmatched (R-SR-14).
  params:
    shot_window_s: {value: 2.0, unit: s}
    turnover_window_s: {value: 2.0, unit: s}
    max_shift_s: {value: 1.0, unit: s}
    lr_match: {value: 3.0, unit: '1', note: proposal}
  min_duration_s: null
  outputs: blind and anchored rows, anchor_event_id, disagreement flag
  confidence: log-odds update of conf
  noise: PBP clock errors and late logging; Hungarian matching, not nearest.
  conflicts_resolved:
    - Research 1.15 / 0.7 multipliers replaced by log-odds (checker BA-R1).
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/schema/tables/passes.yaml', supports: blind / anchored / none column}
  validation: Agreement rate blind vs anchored per item on games with PBP.

- id: ba_validation_plan
  research_id: new (checker missing item)
  level: rule
  name: Ground-truth test plan for the family
  aliases: [acceptance]
  actors: n/a
  t0: n/a
  status: proposal
  detectable: rule
  rule: |
    V0 (now): synthetic scenarios (sim.scenario, sigma_p 0.3 m, fixed seeds) with a positive and a negative
    case per detector (tests/movement/test_ball_actions.py).
    V1: SportVU 2015-16 (ball z present) for control, pass, catch, release, shot and dribble presence; z
    gives the truth for bounce / lob / dribble count that XY proxies are scored against.
    V2: 'MSU footage (UConn, Louisville webm): >= 50 labelled instances per class from >= 5 games (R-ST-10),'
    with explicit hard sets: dribbles through traffic, inbounds, overhead skips, bounce passes to cutters,
    handoffs vs short passes, post catches vs wing catches with the defender rim-side.
    Acceptance (proposal): holder correct on >= 97% of visible in-control frames per ball sigma tier; passes
    >= 95% recall and precision (baseline 72% / 85.8%, CMU 2020, SportVU with z); drives >= 90% found,
    direction >= 95%; post-up >= 85% F1; C&S vs pull-up >= 90% where dribble presence is visible.
  params:
    min_labels_per_class: {value: 50, unit: count}
    min_games: {value: 5, unit: count}
  min_duration_s: null
  outputs: n/a
  confidence: n/a
  noise: n/a
  conflicts_resolved: []
  sources:
    - {url: 'https://www.stat.cmu.edu/cmsac/conference/2020/assets/pdf/nba_tracking_data.pdf', supports: 546 passes, 72% found, 85.8% precision; one game; ball z used}
  validation: n/a

# ======================================================================================
# L0 / L1: control state and ball events
# ======================================================================================
- id: touch
  research_id: BA-00 + BA-04
  level: primitive
  name: Ball control segment (holder state) and touch record
  aliases: [possession state, ball holder, touch, R-BL-02, R-BL-03, R-EV-04]
  actors: {holder: player, team: offense|defense}
  t0: refined catch frame when the touch follows a flight (else the first control frame)
  status: canonical
  detectable: xy
  rule: |
    d_bp(t) = |ball_xy - player_xy| (smoothed). Decode per frame, all ten players:
    - Enter control by p: d_bp <= enter_radius_m for enter_frames consecutive frames, p nearest to the ball by
      >= nearest_margin_m over every other player, and the minimum |v_ball - v_p| over the frames of the
      rel_speed_window_s after the run start on which p is the nearest player and the ball is within
      enter_radius_m of him is <= rel_speed_max_mps (a pass flying past a defender in the lane is his only
      while fast; once it sits with the receiver it is the receiver's; a catch, even a 0.2 s
      one-touch that the smoother smears to ~4 m/s, matches his velocity at some frame; a failed gate
      restarts the run on the next frame).
    - Stay while d_bp <= exit_radius_m; exit after exit_frames consecutive frames beyond it (segment ends at
      the last frame inside). Ball unobserved: hold the state for occlusion_hold_s, then close.
    - Takeover (handoff, strip): another player within enter_radius_m and nearer than the holder by
      nearest_margin_m for takeover_frames frames (same velocity gate) takes control at the run start.
    - Entry team prior: when the nearest player belongs to the team that last controlled the ball and
      every rival within nearest_margin_m is an opponent, the margin is waived (pass-completion prior; a
      defender in contact with the receiver must not take the catch).
    - Same-player segments separated by <= merge_gap_s with ball travel < merge_max_travel_m are merged.
    - Team-change confirmation: a segment of one team shorter than team_change_confirm_s between two
      segments of the other team is contact (deflection, reach-in, a defender next to a driver whose
      smoothed ball lags), not a possession change; it is dropped and the holder's segments on both sides
      are merged when <= contact_merge_max_s apart.
    - Segments shorter than min_touch_s are taps (not touches); flights pass through them.
    Free-ball interval between two segments: 'exchange' (adjacent, no free frame), 'flight' (mean smoothed
    ball speed over the first 3 free frames >= flight_min_speed_mps and the ball moving away from the
    releaser), 'loose' otherwise, 'unknown' when it contains a segment edge (cut) or unobserved ball.
    Refine: release = the later of (a) the last frame within refine_window_s before the control end with
    d_bp <= refine_radius_m and (b) the control end minus (exit_radius - refine_radius) / v, with v = ball
    travel / air between the control frames; catch = the earlier of the mirrored pair. (a) is right for
    slow exchanges (handoffs, pitches) where (b) over-corrects, (b) when noise pushes the ball beyond
    0.5 m for a few frames next to the hands. Flight travel and
    air time are measured between the refined frames (the control frames sit 1.5 m and 1.0 m from the
    hands, which would understate short passes by up to 2.5 m).
    Touch record: start_kind {pass, handoff, steal, interception, rebound, loose_ball, regather, clip_start,
    unknown}; end_kind {pass, shot, handoff, turnover, lost, pass_unresolved, regather, dead, unknown};
    touch_time_s = last control frame - t0.
    changes_loop1: rim finishes split a segment (BA-T1, rim_finish_* params); a short opponent segment followed by a slow receding ball (BA-T3, deflect_*) or by a shot flight (BA-T10) is contact.
    changes_loop2: offence possession prior (BA-T10b, possession_prior_frac): a defence segment with one offensive player within exit_radius_m on >= that fraction of its frames is that player's control (contact), except after a shot-like flight; handoff cut (BA-T11b): consecutive teammates' segments are split at their closest approach when it is <= pass.handoff_max_dist_m with the ball within exit_radius_m of both (an exchange); the BA-T3 deflection test also applies when the recoverer's control is adjacent (BA-T3b).
    changes_loop3: the prior is not applied to a real steal (BA-T10c): when the next control is the defence's, is itself not absorbed and is not reached on a shot-like path at the attacked rim, or when the ball moves >= possession_prior_upcourt_m away from the rim over the segment; the team-change confirmation runs again after the prior (BA-T3c).
  params:
    enter_radius_m: {value: 1.0, unit: m, note: proposal (2.4 sigma_rel at 0.3 m)}
    exit_radius_m: {value: 1.5, unit: m, note: R-IV-13}
    enter_frames: {value: 3, unit: frames}
    takeover_frames: {value: 9, unit: frames, note: 0.3 s; a takeover from a current holder must persist (tie-ups, contact)}
    exit_frames: {value: 2, unit: frames}
    nearest_margin_m: {value: 0.3, unit: m}
    rel_speed_max_mps: {value: 4.0, unit: m/s}
    rel_speed_window_s: {value: 0.4, unit: s, note: checker BA-00 (>= 0.4 s)}
    occlusion_hold_s: {value: 0.5, unit: s}
    min_touch_s: {value: 0.1, unit: s}
    flight_min_speed_mps: {value: 3.0, unit: m/s}
    loose_min_s: {value: 0.3, unit: s}
    refine_radius_m: {value: 0.5, unit: m}
    refine_window_s: {value: 0.5, unit: s}
    merge_gap_s: {value: 0.2, unit: s}
    merge_max_travel_m: {value: 1.0, unit: m}
    team_change_confirm_s: {value: 0.6, unit: s, note: proposal}
    contact_merge_max_s: {value: 1.0, unit: s}
    rim_finish_reach_m: {value: 0.75, unit: m, note: 'changes_loop1 BA-T1: ball r at which a close finish is released (= shot_release rim_reach_m)'}
    rim_finish_holder_gap_m: {value: 0.4, unit: m, note: 'BA-T1: holder stance at least this much farther from the rim than the ball'}
    rim_finish_approach_m: {value: 0.5, unit: m, note: 'BA-T1: ball r must have fallen by this much ...'}
    rim_finish_approach_s: {value: 0.5, unit: s, note: 'BA-T1: ... over this window'}
    rim_finish_resume_s: {value: 0.6, unit: s, note: 'BA-T1: the finisher''s control resumes this long after the rim frame (own rebound)'}
    rim_finish_releaser_r_max_m: {value: 2.5, unit: m, note: 'BA-T1: a free interval reaching the rim from a releaser this close is a flight even when slow'}
    deflect_recede_m: {value: 0.6, unit: m, note: 'changes_loop1 BA-T3: ball recedes from the deflector by this much over his segment'}
    deflect_max_s: {value: 1.5, unit: s, note: 'BA-T3: longest segment that can still be a deflection contact'}
    deflect_slow_frames: {value: 9, unit: frames, note: 'BA-T3: window after the segment over which the mean ball speed is < flight_min_speed_mps'}
    clip_start_s: {value: 0.5, unit: s, note: 'changes_loop1 BA-T18: a touch starting this close to the clip start is start_kind clip_start'}
    possession_prior_frac: {value: 0.8, unit: fraction, note: 'changes_loop2 BA-T10b: a defence segment with one offensive player within exit_radius_m of the ball on >= this fraction of its frames is that player''s control (offence possession prior)'}
    possession_prior_frontcourt_r_m: {value: 7.5, unit: m, note: 'changes_loop4 BA-R4h: the possession prior favours the defence list (its players absorb an offence-list segment) when the ball at the segment start is within this distance of the defence list''s basket (its half-court offence, about the 3-point distance); otherwise it favours the offence list as before. On real SportVU clips the fixed offence-list prior handed passes of the far-basket team to a nearby offence-list defender (false live-ball turnovers)'}
    possession_prior_lead_m: {value: 0.0, unit: m, note: 'changes_loop4 BA-R4i (loop-3 open item, guard a): guard (a) frees a defence segment only when, over the last possession_prior_lead_s, the ball is on average at least this much nearer the defender than the absorbing offensive player (0.3 lost quick strip-and-outlets, P1 and l3_strip_outlet, where the victim stays glued to the stripper)'}
    possession_prior_lead_s: {value: 0.3, unit: s, note: 'changes_loop4 BA-R4i: window at the end of the defence segment for the lead test of guard (a)'}
    possession_prior_upcourt_m: {value: 3.0, unit: m, note: 'changes_loop3 BA-T10c: the prior is not applied when the ball moves at least this much away from the attacked rim over the defence segment (a stealer heading up-court with the victim chasing); absorbed contact segments move it <= 1.0 m outward on the harness (max over 1980 scenes), real chased steals 4.5-5.6 m'}
    rim_goalside_min_players: {value: 4, unit: players, note: 'changes_loop4 BA-R4b: the goal-side vote is used only when both teams have at least this many players tracked; with 2-3 per side one help defender behind his man or a trap outweighs the team shape (adversarial 2-on-2 scenes N01 / N07 voted the wrong basket on 21 / 24 and 24 / 24 seeds)'}
    rim_goalside_min_s: {value: 1.0, unit: s, note: 'changes_loop4 BA-R4b: the goal-side vote (frames with all players in one half where the defence list is nearer that half''s basket than the offence list, minus frames where it is not; signed by which half) decides the team baskets when its absolute net reaches this; otherwise the BA-R4a control-frame fallback runs. On 194 real SportVU clock-running chunks it agrees with the per-half basket of each team on every decided chunk (1 short chunk undecided), clean and at added noise 0.5 m'}
  min_duration_s: 0.1
  outputs: touch events (holder, team, start_kind, end_kind, touch_time_s, x, y, spot); per-frame holder array; free-ball intervals
  confidence: window_conf of P(d_bp <= exit radius) over the segment x c_edge(ball) x c_gap(ball)
  noise: >-
    sigma_rel ~ 0.42 m raw; after smoothing, AR tracker noise still leaves pair-distance errors of
    0.2-0.5 m that persist for ~1 s (V0 sim), so a defender in contact with the receiver or the driver is
    regularly measured nearer to the ball than the holder - hence the team prior and the team-change
    confirmation. The ball and the holder are smoothed separately: under hard acceleration (> ~15 m/s^2)
    their CA-RTS lags differ by up to 1.7 m (V0 sim), which can drop control for a few frames. The 1.0 m
    enter gate fires late by <= 3 frames; the smoother spreads a 20 m/s pass over ~10 frames; a 0.2 s
    one-touch is smeared to a ~4 m/s relative-speed minimum (the gate's margin).
  conflicts_resolved:
    - Possession radius R-IV-13 1.5 m vs squared2020 3 ft (0.91 m) -> hysteresis 1.0 m enter / 1.5 m exit.
    - HMM decode is the target; this hard-threshold decoder is the reference implementation (proposal).
  sources:
    - {url: 'https://squared2020.com/2017/05/07/identifying-player-possession-in-spatio-temporal-data', supports: 3 ft possession radius, PBP offence filter, failure modes (defenders, overhead passes, handoffs)}
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/requirements_review/proposals_consolidated.yaml', supports: R-IV-13 holder within 1.5 m}
    - {url: 'https://www.nba.com/stats/help/glossary', supports: Touches = gets and holds the ball}
  validation: Holder accuracy per frame per ball sigma tier (SportVU, then MSU labels); target >= 97%.

- id: team_possession
  research_id: BA-00 (team_in_control)
  level: primitive
  name: Team in control
  aliases: [possession, team_in_control]
  actors: {team: offense|defense}
  t0: first control frame of the team's first touch
  status: canonical
  detectable: xy
  rule: |
    Maximal run of consecutive touches by players of one team; flights, loose balls and shots between
    teammates are bridged (an offensive rebound continues the possession). Ends at the first touch by the
    other team. PBP possession changes (made FG, DREB, turnover, period end) anchor it (ba_pbp_anchor).
  params:
    min_s: {value: 0.1, unit: s}
  min_duration_s: 0.1
  outputs: team, holders, n_touches
  confidence: min touch conf x c_edge(ball)
  noise: A false defender touch splits a possession; the takeover margin limits it.
  conflicts_resolved: []
  sources:
    - {url: 'https://squared2020.com/2017/05/07/identifying-player-possession-in-spatio-temporal-data', supports: offence filter via change-of-possession events}
  validation: Possession boundaries vs PBP change events.

- id: ball_flight
  research_id: BA-00 (FLIGHT)
  level: primitive
  name: Ball flight
  aliases: [FLIGHT, air]
  actors: {from: releaser, to: next controller or null}
  t0: refined release frame
  status: canonical
  detectable: xy
  rule: |
    A free-ball interval of kind flight (touch rule) with travel >= min_travel_m and air >= min_air_s.
    attrs.shot from shot_release; attrs.loose_s = longest slow run (< flight speed) before the next control.
  params:
    min_air_s: {value: 0.10, unit: s}
    min_travel_m: {value: 1.0, unit: m}
  min_duration_s: 0.1
  outputs: from, to, travel_m, air_s, shot, loose_s
  confidence: min(P(travel >= 1.0 m), releaser conf) x c_edge(ball) x c_gap(ball)
  noise: Smoother lag shortens the measured air time by ~2-4 frames at each end; refine compensates.
  conflicts_resolved: []
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/motion_starts.md', supports: 'PASS: ball flight > 1.0 m'}
  validation: Flight start / end vs SportVU ball z events.

- id: loose_ball
  research_id: BA-00 (LOOSE)
  level: primitive
  name: Loose ball
  aliases: [LOOSE, free ball]
  actors: {last_holder: player, recovered_by: player or null}
  t0: first slow free frame
  status: canonical
  detectable: xy
  rule: |
    Inside a free-ball interval: smoothed ball speed < max_speed_mps for >= min_s (hysteresis run).
    changes_loop1 BA-T12: out-of-bounds frames are not loose.
  params:
    max_speed_mps: {value: 3.0, unit: m/s}
    min_s: {value: 0.3, unit: s}
  min_duration_s: 0.3
  outputs: last_holder, recovered_by, after_shot, duration_s
  confidence: window_conf of P(speed < 3.0) x c_edge x c_gap (ball)
  noise: A ball bouncing near a player at low speed can be read as loose for a few frames before the enter run completes.
  conflicts_resolved: []
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/requirements_review/proposals_consolidated.yaml', supports: ball_states enum (loose)}
  validation: Loose-ball recoveries vs PBP turnovers / rebounds.

- id: contested_ball
  research_id: BA-00 (CONTESTED) + checker missing (jump ball / held ball)
  level: primitive
  name: Contested ball and held-ball candidate
  aliases: [CONTESTED, tie-up, held ball, jump ball]
  actors: {offense: player, defense: player}
  t0: first contested frame
  status: proposal
  detectable: xy
  rule: |
    Ball slower than ball_max_speed_mps, the moving means (mean_window_s) of the nearest offensive and
    the nearest defensive player's distances to the ball both <= radius_m and within margin_m of each
    other (both on the ball, no unique controller), for >= min_frames frames (gaps <= max_gap_frames).
    held_ball_candidate when it lasts >= held_ball_min_s. The research form (both within 1.0 m) fires on
    ordinary on-ball defence: with AR tracking noise a defender 1.0 m from the ball is measured at
    0.55-0.6 m for 0.3 s stretches, so the symmetric margin is what separates a tie-up (proposal). The
    NCAA possession arrow (alternating
    possession) and the jump-ball restart need PBP.
    changes_loop1 BA-T4: the distance test above must coincide with a free-ball frame of the control decode or with the ball displaced toward the defender while both players and the ball are still (between_* / still_s2_max / ball_still_mps params, >= held_ball_min_s); edge events are dropped; attrs.basis.
    changes_loop2 BA-T4b: a ball-between (tie-up) run starts where both players come to rest on the ball (onset_still_* / onset_search_s), not at the noisy distance-run start. A noise-tier-aware radius / lateral bound was tried and rejected (see changes_loop2).
    changes_loop3 BA-T4c: attrs.noise_status (ok / noise_limited, noise_limited_pair_sigma_m) and attrs.pair_sigma_m; at the sigma_p 0.5 tier the item is noise-limited (P/R 0.30 / 0.30) and says so.
  params:
    radius_m: {value: 0.7, unit: m, note: proposal (research 1.0 m)}
    mean_window_s: {value: 0.3, unit: s, note: moving mean of each distance against per-frame ball noise}
    margin_m: {value: 0.45, unit: m}
    max_gap_frames: {value: 9, unit: frames}
    ball_max_speed_mps: {value: 3.0, unit: m/s}
    min_frames: {value: 9, unit: frames, note: 0.3 s (research 3 frames fires on noise next to an on-ball defender)}
    held_ball_min_s: {value: 0.5, unit: s}
    between_proj_lo: {value: 0.35, unit: '1', note: 'changes_loop1 BA-T4: ball projection onto the O-D segment (0 = offence, 1 = defence) lower bound; the ball must be displaced toward the defender (a ball at the holder is guarded, not contested)'}
    between_proj_hi: {value: 1.5, unit: '1', note: 'BA-T4: upper bound (> 1: the defender''s measured position is often on the ball at 0.3-0.6 m pair distances)'}
    between_lateral_m: {value: 0.35, unit: m, note: 'BA-T4: max lateral offset of the moving-mean ball from the O-D segment'}
    still_s2_max: {value: 5.99, unit: chi2 (2 dof), note: 'BA-T4: both players still (stationary_s2 below this on >= half the moving window)'}
    ball_still_mps: {value: 1.5, unit: m/s, note: 'BA-T4: moving-mean ball speed below this for the ball-between basis'}
    between_window_s: {value: 0.5, unit: s, note: 'BA-T4: moving-mean window for the ball-between geometry and ball speed (the pair is ~0.5 m apart, so per-frame projections are noise)'}
    onset_lookback_s: {value: 0.3, unit: s, note: 'BA-T4: a confirmed free-ball run (and a ball-between run with no rest onset)  is extended over the enclosing distance run, back by at most this (the stillness test lags the arrival)'}
    onset_still_mps: {value: 1.5, unit: m/s, note: 'changes_loop2 BA-T4b: a ball-between (tie-up) run starts where both players come to rest: the faster of their smoothed speeds below this ...'}
    onset_still_s: {value: 0.3, unit: s, note: 'changes_loop2 BA-T4b: ... for this long ...'}
    onset_still_gap_frames: {value: 2, unit: frames, note: 'changes_loop2 BA-T4b: gaps bridged inside the rest stretch'}
    onset_search_s: {value: 1.0, unit: s, note: 'changes_loop2 BA-T4b: ... the rest stretch containing the confirmed run start, back by at most this (S20b onset within 0.3 s: 20 / 20 / 18 of 20 at sigma 0.2 / 0.3 / 0.5, against 7 / 6 / 5 for the distance-run start)'}
    noise_limited_pair_sigma_m: {value: 0.24, unit: m, note: 'changes_loop3 BA-T4c: attrs.noise_status = noise_limited when the calibrated ball-player pair sigma at t0 exceeds this (sigma_p 0.2 / 0.3 / 0.5 tiers read 0.13 / 0.19 / 0.27-0.28 m on the harness); P/R at the 0.5 tier is 0.30 / 0.30, at the 0.2 / 0.3 tiers 0.86 / 0.90 and 0.62 / 0.75'}
  min_duration_s: 0.1
  outputs: offense, defense, held_ball_candidate, noise_status (ok / noise_limited), pair_sigma_m, possession_arrow (needs_pbp)
  confidence: min window_conf of P(d <= radius) for both players x c_edge x c_gap (ball)
  noise: >-
    Weak at sigma 0.3 m with AR noise (pair-distance error ~0.24 m, MP-19). The 0.1.0 distance-only rule
    had precision 0.02-0.05 in the independent test (60-80% false runs with an on-ball defender at 0.75-0.85 m,
    not the 5/40 the V0 sweep reported at 1.0 m). With the changes_loop1 BA-T4 restatement (free-ball frame
    or ball displaced toward the defender with both players still), tester harness, 10 seeds x mirrored:
    P/R 0.48/0.50 at sigma 0.2, 0.25/0.30 at 0.3, 0.12/0.10 at 0.5. With the changes_loop2 BA-T4b rest onset:
    0.86/0.90, 0.62/0.75, 0.30/0.30. At sigma 0.5 the moving-mean distances of a ball 0.3 m from both players
    read 0.6-0.9 m, so most tie-ups fail the radius / projection gates; widening them with the pair sigma
    was tried and lost more precision than it gained recall (see changes_loop2). Two bodies in contact: ID-swap risk.
    PBP held-ball rows should anchor it; status stays proposal.
  conflicts_resolved: []
  sources:
    - {url: 'https://squared2020.com/2017/05/07/identifying-player-possession-in-spatio-temporal-data', supports: defenders within the radius get credited without a touch (failure mode)}
  validation: Held-ball whistles in PBP vs held_ball_candidate.

- id: catch
  research_id: BA-01
  level: primitive
  name: Catch
  aliases: [reception, touch start]
  actors: {receiver: player, passer: player or null}
  t0: refined catch frame (first control frame + (enter - refine radius) / ball speed)
  status: canonical
  detectable: xy
  rule: |
    First control of a touch that follows a FLIGHT or LOOSE interval. catch_on_move = mean smoothed speed
    over speed_window_s after t0 >= on_move_speed_mps. Recorded: r, d3, spot, court_region, nearest
    opponent and its closing speed over closing_window_s before t0.
  params:
    on_move_speed_mps: {value: 2.0, unit: m/s}
    speed_window_s: {value: 0.4, unit: s}
    closing_window_s: {value: 0.5, unit: s}
  min_duration_s: 0.1
  outputs: receiver, passer, catch_on_move, speed_mps, r, d3, spot, court_region, nearest_def_m, def_closing_mps
  confidence: touch conf x c_edge(ball) x c_gap(ball)
  noise: Catch frame jitter about +-2 frames; a deflection then recovery reads as a catch (deflection needs a changepoint test, open question).
  conflicts_resolved: []
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/requirements_review/proposals_consolidated.yaml', supports: R-BL-04 release / catch as frame index}
  validation: Catch frame error vs SportVU / labelled frames (target |error| <= 3 frames on 90%).

- id: release
  research_id: BA-02
  level: primitive
  name: Release
  aliases: [ball leaves hand]
  actors: {holder: player}
  t0: refined release frame
  status: canonical
  detectable: xy
  rule: |
    Last control frame before a FLIGHT. release_kind (checker order): shot (shot_release) > lost (the flight
    ends in a LOOSE phase >= loose_min_s) > intercepted (next control is an opponent) > pass (teammate);
    'unresolved' when the ball leaves view with no next control. A flight back to the same player is a
    regather, not a release (the CMU dribble-through-traffic error).
    changes_loop2 T18b: the edge factor of a shot release is the shooter's (as in shot_release); the ball track
    usually ends at the rim right after a finish, which gave conf 0.
  params: {}
  min_duration_s: null
  outputs: release_kind, ball_speed_mps
  confidence: touch conf x c_edge(ball)
  noise: Ball occlusion at release delays control end by <= 3 frames; refine step back-extrapolates.
  conflicts_resolved:
    - "'lost' was unreachable in the research order (checker BA-02)."
  sources:
    - {url: 'https://www.stat.cmu.edu/cmsac/conference/2020/assets/pdf/nba_tracking_data.pdf', supports: pass start node needs a different next handler; dribbles through traffic were the main error}
  validation: Release frame error vs labelled frames.

- id: dribble_inferred
  research_id: BA-03 (XY presence proxy)
  level: primitive
  name: Dribble presence inferred from handler travel
  aliases: [dribble present, travel bound]
  actors: {handler: player}
  t0: start of the travelling run (walking back from the crossing while speed >= onset_speed_mps), not before the touch start
  status: proposal
  detectable: xy
  rule: |
    A holder cannot travel with the ball without dribbling. Pivot frame tp = catch + gather_allowance_s (two
    gather steps; tp = first control frame when the touch did not start with an observed catch). End te =
    last control frame - final_gather_s when the touch ends in a pass / shot / handoff / loss. If the
    holder's stance centre leaves the circle of radius travel_bound_m around its tp position at any frame in
    [tp, te], the touch contains >= 1 dribble. Stationary dribbles produce no XY evidence: absence of this
    event means 'not evident', never 0 dribbles. Dribble COUNT needs ball z (dribble_bounce).
    changes_loop1 BA-T7 / BA-T14: gather allowance only after a catch on the move; te from the refined release; onset walk-back also needs stationary_s2 >= onset_s2_min and (after a set catch) the stance outside the noise band onset_disp_k.
  params:
    gather_allowance_s: {value: 0.5, unit: s}
    final_gather_s: {value: 0.5, unit: s}
    travel_bound_m: {value: 1.2, unit: m, note: proposal; pivot stride about 0.6-0.8 m plus margin}
    onset_speed_mps: {value: 1.0, unit: m/s}
    catch_move_window_s: {value: 0.2, unit: s, note: 'changes_loop1 BA-T7: catch on the move = mean speed over this window after the catch >= catch.on_move_speed_mps; the gather allowance applies only then'}
    onset_s2_min: {value: 5.99, unit: chi2 (2 dof), note: 'changes_loop1 BA-T14: onset walk-back also needs stationary_s2 >= this'}
    onset_disp_k: {value: 1.0, unit: sigma, note: 'changes_loop1 BA-T14: walk-back stops where the stance is within onset_disp_k x sqrt(2) x calibrated sigma of the pivot position (noise band)'}
  min_duration_s: null
  outputs: handler, max_disp_m, dribble_count (unknown_needs_ball_z), method travel_bound
  confidence: P(max displacement >= travel_bound) x c_edge x c_gap (handler)
  noise: A catch on the move with a long gather can exceed the bound (false dribble); a stationary probe dribble is invisible.
  conflicts_resolved:
    - Research method B (ray oscillation) depends on how CV builds ball XY (open question); this proxy does not.
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml', supports: dribbling context 0 / 1 / 2 needs a dribble model}
  validation: Against SportVU ball-z bounces - precision of 'present' per touch; recall reported separately for stationary dribbles.

- id: dribble_bounce
  research_id: BA-03
  level: primitive
  name: Dribble bounce, dribble segment, pickup
  aliases: [dribble count, DRIBBLE_START, DRIBBLE_END, gather]
  actors: {handler: player}
  t0: bounce frame; pickup frame
  status: proposal
  detectable: needs_data
  needs: [ball_z]
  rule: |
    With z: bounce at a local minimum z <= bounce_max_z_m with v_z sign change, >= min_bounce_gap_s after
    the previous bounce, ball within 1.5 m of the holder. Pickup (checker fix): no bounce for >=
    max(pickup_min_s, pickup_period_mult x local period); z >= 0.6 m only as support. Method B (no z, floor
    homography ball XY only): band-pass the camera-ray offset at band_lo_hz-band_hi_hz, amplitude >= 0.4 m;
    allowed only when the CV ball-XY method is recorded as floor homography of the ball pixel.
  params:
    bounce_max_z_m: {value: 0.30, unit: m}
    min_bounce_gap_s: {value: 0.20, unit: s}
    pickup_min_s: {value: 0.5, unit: s}
    pickup_period_mult: {value: 1.5, unit: '1'}
    band_lo_hz: {value: 1.0, unit: Hz}
    band_hi_hz: {value: 5.5, unit: Hz, note: checker BA-03 (was 4.0)}
    ray_amp_min_m: {value: 0.4, unit: m}
  min_duration_s: 0.2
  outputs: dribbles rows, dribble_count, pickup_ts, method {z, ray, pose}
  confidence: Phi margins on z and spacing (when implemented)
  noise: Occlusion in traffic -> dribble_count_partial.
  conflicts_resolved:
    - Pickup z >= 0.6 m for 0.35 s fired on every slow dribble (checker BA-03).
  sources:
    - {url: 'https://www.stat.cmu.edu/cmsac/conference/2020/assets/pdf/nba_tracking_data.pdf', supports: ball height used to separate bounce passes and dribbles}
  validation: Dribble count exact on >= 85% of touches (R-BL-06) on SportVU.

- id: dribble_move_type
  research_id: BA-10..BA-20
  level: primitive
  name: Dribble-move types
  aliases: [crossover, between the legs, behind the back, hesitation, in-and-out, spin, retreat, push, pound, snatch-back, hand switch]
  actors: {handler: player}
  t0: per move (move onset)
  status: proposal
  detectable: needs_data
  needs: [ball_z, pose_hands]
  rule: |
    Scope decision: no dribble-move types from XY. With ball z (bounce frames) and hand keypoints:
    - hand_switch: ball lateral offset changes side with |d lat| >= hand_switch_swing_m (checker BA-10),
      axis from heading only when speed >= 2.5 m/s, else the rim axis; crossover / between-legs /
      behind-back split by the forward offset of the bounce (+- 0.15 m) and pose.
    - hesitation (checker BA-14): slow phase >= hesitation_min_slow_s, defined as a displacement deficit
      >= hesitation_deficit_m against constant-speed extrapolation over 0.5 s, then re-acceleration.
    - retreat: 'vr >= +1.0 m/s for >= 0.5 s and dr >= +1.0 m while dribbling; push: speed >= 4.0 m/s for'
      >= 0.5 s with the bounce >= 0.6 m ahead; pound: period <= 0.45 s, apex <= hip; snatch-back: >= 1.0 m
      back in <= 0.6 s with heading change >= 135 deg after >= 3.0 m/s.
    The XY-only parts (retreat / push kinematics) are kinematics-family primitives on the handler.
  params:
    hand_switch_swing_m: {value: 0.8, unit: m}
    hesitation_min_slow_s: {value: 0.3, unit: s}
    hesitation_deficit_m: {value: 0.6, unit: m}
    push_speed_mps: {value: 4.0, unit: m/s}
    pound_period_max_s: {value: 0.45, unit: s}
  min_duration_s: null
  outputs: move_type, unresolved alternatives
  confidence: n/a until z / pose exist
  noise: XY hand switch fires ~8 false switches per minute under AR noise (checker BA-10).
  conflicts_resolved:
    - Hesitation 0.15 s stops are undetectable with a 0.4 s window (checker BA-14).
  sources:
    - {url: 'file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/vocab/actions_extra.yaml', supports: push >= 4.0 m/s, bounce >= 0.60 m ahead; pound < 1.0 m/s, period <= 0.45 s}
    - {url: 'https://fansided.com/2017/09/08/nylon-calculus-understanding-synergy-play-type-data/', supports: two retreat dribbles can reclass a PnR as isolation}
  validation: R-EV-05 >= 75% on resolved classes with the unresolved rate reported.

