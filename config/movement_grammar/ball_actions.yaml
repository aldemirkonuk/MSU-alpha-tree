changes_loop1:
  # Loop 1 of the independent test (tester harness: 33 scenarios x mirrored x 10 seeds x sigma_p 0.2 / 0.3 / 0.5).
  # Metrics are label-level precision / recall from that harness, 0.1.0 -> 0.1.1, at sigma 0.2 unless stated.
  - id: BA-T1 close finishes never release
    what: >-
      _split_rim_finishes after the decode: a control segment is cut at the first frame where ball r <=
      rim_finish_reach_m, the holder's stance is >= rim_finish_holder_gap_m farther from the rim and the ball's
      r fell >= rim_finish_approach_m over rim_finish_approach_s; release = last frame with d_bp <=
      refine_radius_m before it; control resumes rim_finish_resume_s later. A free interval reaching the rim
      from a releaser at r <= rim_finish_releaser_r_max_m is a flight even when slow. New touch params.
    why: Layups, dunks, putbacks and post finishes are released inside the 1.5 m exit radius, so control never ended and no FGA existed.
    evidence: shot_release R 0.72 -> 1.00 (0.96 at sigma 0.3), release R 0.90 -> 1.00, drive_outcome 0.61 -> 1.00, potential_assist R 0.71 -> 1.00; tests l1_layup (BA-T1 cases).
  - id: BA-T2 dump-off under the rim read as a shot
    what: Pass-through progress is measured on the ball track up to the receiver's control end (f.nxt.b), not the free-interval end.
    why: The free interval stops at the receiver's 1.0 m enter run, hiding most of a drift pass's progress past the rim.
    evidence: >-
      dump_off R 0.05 -> 1.00, rebound_control P 0.76 -> 1.00, drive_outcome dump_off_pass restored; tests
      l1_dump_baseline. The tester's extra far-side rule (teammate control within 0.4 s of the rim frame at r <= 3.0
      on the far side = pass) was implemented and REJECTED: it turned the S15 long offensive rebound into a pass
      (shot_release miss, pass / lob / entry / post_up / potential_assist FPs at 6/6 seeds, sigma 0.2); the
      pass-through fix alone already gives dump_off 1.00. Guard tests on l1_putback.
  - id: BA-T3 deflection becomes two turnovers
    what: >-
      Team-change confirmation also treats a middle opponent segment as contact when it is followed by a slow ball
      (mean speed over deflect_slow_frames < flight_min_speed_mps), the ball recedes from him by >= deflect_recede_m
      and the segment is < deflect_max_s. pass_incomplete thrown_away_loose now needs an opponent recovery.
    why: A deflected ball rolling away stays inside the deflector's exit radius for 0.75-0.85 s, longer than team_change_confirm_s.
    evidence: loose_ball R 0.00 -> 0.95 (P 1.00), live_ball_turnover P 0.25 -> 1.00 (with BA-T9), pass_incomplete P 0.50 -> 1.00; tests l1_deflect.
  - id: BA-T4 contested_ball fires on ordinary on-ball defence
    what: >-
      Restated on the control decode: the distance test must coincide with (a) a free-ball frame or (b) the ball
      displaced toward the defender (0.5 s moving-mean projection onto the O-D segment in [between_proj_lo,
      between_proj_hi], lateral <= between_lateral_m), both players still (stationary_s2) and the moving-mean ball
      speed < ball_still_mps for >= held_ball_min_s; a confirmed run spans the enclosing distance run (back by at most
      onset_lookback_s); events at a ball segment edge are dropped; attrs.basis added. Noise note updated.
    why: Distances alone gave precision 0.02-0.05 (holder with a defender at 0.66-0.85 m, catches on closeouts, conf-0 clip-start runs).
    evidence: >-
      contested_ball P/R 0.05/0.25 -> 0.48/0.50 (sigma 0.2), 0.02/0.20 -> 0.25/0.30 (0.3), 0.03/0.30 -> 0.12/0.10
      (0.5: recall fell, still open). The tester's exact form (projection 0.2-0.8, lateral 0.3, per-frame ball
      speed < 1.0) found 1/10 tie-ups at sigma 0.3: the O-D pair is measured 0.3-0.6 m apart, so the per-frame
      projection is noise and often > 1; hence the 0.5 s means, upper bound 1.5 and lookback. Tests l1_tight_onball,
      l1_faceup, tie_up basis test.
  - id: BA-T5 isolation fires on every spaced holder
    what: >-
      An isolation window needs an attack in [a - attack_before_s, b + attack_after_s]: a drive, a shot, or an inferred
      dribble with the defender within attack_def_m for >= attack_dribble_min_s that gains >= attack_dribble_gain_m
      toward the rim; windows starting <= catch_drive_exclusion_s after a catch followed that soon by a drive (spot-up
      drive) and windows at a segment edge are dropped; attrs.attack added; max_gap_frames is a param.
    why: Coaches / Synergy label isolation only when the handler attacks one-on-one; the hold-only rule fired on any 2 s touch in normal spacing.
    evidence: >-
      isolation P 0.17 -> 1.00 (0.95 / 0.87 at sigma 0.3 / 0.5), R 1.00 kept. The gain requirement is an addition to
      the tester's fix (S26 dribble reversal with a shadowing defender was 4-5/6 FPs without it). The author's
      'iso' positive now drives (3.4-4.6 s); the old hold-only clip is the negative 'iso_hold'.
  - id: BA-T6 post_up gate admits mid-range face-ups and putbacks
    what: Gate clause |x| <= gate_abs_x_m and y <= FT_Y also needs r <= gate_r_max_m (4.2); the pass / shot short-touch exception no longer applies to rebound / loose-ball touches.
    why: An 18-ft face-up at (3.9, 3.9) and a 0.5 s putback were post-ups.
    evidence: post_up P 0.29 -> 0.70 (detection-level 1.00; the rest are defense_position flips at the 45 deg boundary), kick_out P 0.73 -> 1.00; tests l1_faceup, l1_putback.
  - id: BA-T7 one-dribble pull-up invisible
    what: dribble_inferred applies gather_allowance_s only to a catch on the move (mean speed over catch_move_window_s >= catch.on_move_speed_mps) and ends the window at the refined release minus final_gather_s.
    why: After a set catch the window was ~0.2 s, too short to see a 1.8 m side-step.
    evidence: pull_up R 0.50 -> 0.88, catch_and_shoot P 0.83 -> 0.95; tests l1_one_dribble_pullup.
  - id: BA-T8 ball_reversal ignores a drive before the first pass
    what: Any drive (gain >= drive_gain_block_m) overlapping [first passer's touch start, final catch] blocks the reversal.
    why: A slot drive and kick-out to the opposite wing is a drive-and-kick, not a reversal.
    evidence: ball_reversal P 0.75 -> 1.00, R unchanged; test l1_slot_kick.
  - id: BA-T9 airball is not a shot
    what: >-
      _shot_scan airball class: aimed at the rim, released from r >= airball_release_r_min_m, ball r_min (followed into
      the grabber's hands for pass_through_window_s) in (rim_reach_m, airball_r_max_m], ending loose or with an
      opponent, no teammate within airball_teammate_clear_m of the ball at that frame. shot_release attrs.airball and
      alternatives {shot_airball, pass_intercepted}; no pass_incomplete / live_ball_turnover for it.
    why: A short FGA grabbed by a defender was an interception and a turnover.
    evidence: S12 shot_release and defensive rebound found 20/20 at sigma 0.2 (rebound_control R 0.75 -> 1.00); tests l1_airball.
  - id: BA-T10 shot credited to the closing-out defender
    what: In the merge loop, a defensive segment shorter than team_change_confirm_s right after an offensive holder and followed by a fast ball that passes the geometric shot test (_shot_like) is contact; the shooter's segment is extended to its end.
    why: At sigma 0.5 a closeout defender took control in the shooter's last frames and was credited with the shot.
    evidence: >-
      Partial: defender-credited shots in the harness 7 -> 5 of 660 scenes at sigma 0.5 (1 -> 1 at 0.3); the rest
      (S19 'DE' at the catch-and-shoot) have the defender segment after a catch, not after a shooter's touch, or a
      flight that fails the geometric shot test. Synthetic l1_closeout_contest (defender on the ball 0.45 s) records
      the contact and credits A on seeds 2-3.
  - id: BA-T11 DHO read as a pass when the receiver runs away
    what: >-
      pass: handoff distance = closest approach over [A.b - handoff_lookback_s, B.a]; ball travel <= handoff_max_travel_m
      with that approach <= handoff_max_dist_m is a handoff regardless of air. drive: after a teammate exchange the onset
      may walk back to the giver-receiver closest-approach frame (drive.handoff_lookback_s).
    why: The receiver's control starts late (1.43-1.77 s vs 1.2 s), by which time he is > 1.5 m from the giver.
    evidence: S21 pass FP 0 / 1 / 7 of 20 at sigma 0.2 / 0.3 / 0.5 (was 0 / 3 / 11); tests l1_dho.
  - id: BA-T12 loose_ball on a dead ball out of bounds
    what: Frames whose court_region contains out_of_bounds are excluded from the loose-ball slow mask (computed once per scene).
    why: A ball resting out of bounds is dead, not loose.
    evidence: S14 loose_ball FP 20/20 -> 0; test l1_oob.
  - id: BA-T13 lob air time biased short
    what: >-
      lob_pass adds back refine_radius / v at the release and refine_radius / v_close at the catch (v_close = ball speed
      minus the receiver's velocity along the pass) before the tof test; attrs.air_corrected_s. The tester's literal
      fix (closing speed in the catch extrapolation) would shorten the air further: the bias comes from both refined
      frames sitting 0.5 m from the hands, not from the receiver's speed.
    why: Measured air 0.98 s for a true 1.10 s lob; the tof route (>= 1.03 s) missed 30-50%.
    evidence: lob_pass R 0.70 -> 1.00 (P 1.00) at sigma 0.2, 0.65 -> 1.00 at 0.3, 0.50 -> 0.80 at 0.5; high-skip negative still passes; test l1_lob_cutter.
  - id: BA-T14 dribble and drive onset drift early at sigma 0.5
    what: >-
      dribble onset walk-back also needs stationary_s2 >= onset_s2_min and, after a set catch, the stance outside
      onset_disp_k x sqrt(2) x calibrated sigma of the pivot; drive onset walk-back needs stationary_s2 >= onset_s2_min.
    why: Smoothed noise speed is ~1 m/s at sigma 0.5, so speed-only walk-backs ran 0.3-0.6 s early.
    evidence: dribble_inferred P/R at sigma 0.5 0.48/0.42 -> 0.76/0.69; drive 0.72/0.66 -> 0.81/0.74 (sigma 0.2 drive 0.99 -> 0.97, S18 slow transition push onset 1.3 vs 1.0). The s2 test alone did not move dribble_inferred (0.48); the displacement band did. Test l1_pullup_top at sigma 0.5.
  - id: BA-T15 paint_touch accumulates noise flicker
    what: One consecutive run (gaps <= max_gap_frames) of >= min_dwell_s whose window_conf(P_in) >= p_in_min replaces the cumulative count.
    why: A post on the block 0.17 m outside the lane accumulated noise frames.
    evidence: >-
      Partial: early fires on that post 3/6/11 -> 2/5/10 of 20 at sigma 0.2/0.3/0.5. p_in_min 0.7 gives 2/2/5 but
      cuts harness recall 0.97 -> 0.92 at sigma 0.3, so 0.5 is kept; a real fix needs the stance-vs-ball bias of
      the CV pipeline (open question). Test l1_post_spin (<= 2 of 10 seeds).
  - id: BA-T16 entry label on dump-offs and cut catches
    what: The 'entry' label needs passer r >= passer_min_r_m, no drive by the passer within drive_exclusion_s before the release, and the pass not a lob_pass or dump_off.
    why: A driver's dump to the dunker and a lob to a cutter are not entry passes.
    evidence: entry_pass P 0.90 (after BA-T2) -> 1.00; tests on 'dump' and l1_dump_baseline.
  - id: BA-T17 potential_assist after a multi-dribble drive
    what: No potential assist when the receiver's inferred travel (dribble max_disp) exceeds max_one_dribble_travel_m (4.5 m); the 0.5 prior stays below it.
    why: The NBA definition allows <= 1 dribble; 7 m off the bounce needs >= 2.
    evidence: potential_assist P 0.87 -> 1.00 at sigma 0.2 (S01 FP removed); test l1_layup.
  - id: BA-T18 conf-0 edge events and hard-coded constants
    what: >-
      Every DETECTORS entry tags events whose conf is 0 at a track segment edge with attrs.edge_status 'edge'
      (contested_ball and isolation drop them). New params: lob_pass receiver_vr_window_s, lob_to_rim_r_m;
      drive closeout_closing_window_s; shot_release closing_window_s; catch_and_shoot catch_speed_window_s;
      entry_pass post_match_s; post_seal seal_strict_r_m; isolation max_gap_frames; touch clip_start_s;
      pass_incomplete heading_frames. lob max_conf_xy note now says multiplier.
    why: Consumers could not tell edge events from real zero-confidence ones; constants outside the YAML broke the single-source rule.
    evidence: tests test_loop1_t18_constants_are_yaml_params and test_loop1_t18_edge_events_are_tagged.

changes_loop2:
  # Loop 2 (fix pass 2) on the loop-1 confirmer's still_failing items and regressions. Harness: the tester's and the
  # confirmer's harness.py / scenarios.py (byte-identical; both run, identical tables), 33 scenarios x mirrored x
  # 10 seeds x sigma_p 0.2 / 0.3 / 0.5. Label-level P/R, 0.1.1 (loop 1) -> 0.1.2, as sigma 0.2 / 0.3 / 0.5.
  - id: BA-T10b defender-credited possession changes (offence possession prior)
    what: >-
      _possession_prior after the team-change merge loop: a defence segment during which one offensive player keeps
      the ball within exit_radius_m on >= possession_prior_frac (0.8) of its frames is reassigned to that player
      (recorded in contacts; adjacent same-player segments re-merged with merge_gap_s / merge_max_travel_m), except
      after a shot-like flight (rebound). It covers the confirmer's three causes at once: out-and-back defender
      segments of 0.6-2.5 s, the trailing defender segment at the clip end, and the closeout defender at the
      kick-out catch. isolation windows starting within touch.clip_start_s of the clip start are dropped (they
      appeared once the possession was right and have no screen lookback).
    why: >-
      Under AR noise an on-ball defender is measured nearer the ball than the holder for 0.5-2.5 s. Labelling
      every decoded segment against the scenario truth (33 scenarios x 5 seeds x mirrored x sigma 0.2 / 0.5, 133
      defence segments): every wrong defence segment had an offensive player within 1.5 m of the ball on 0.88-1.0
      of its frames (one 0.67), every true one (rebounds, outlets, the interception) 0.0-0.2. The rule is
      asymmetric on purpose: offence segments always have a defender that close.
    evidence: >-
      live_ball_turnover P 1.00 / 0.71 / 0.20 -> 1.00 / 1.00 / 0.69 (events at sigma 0.5 92 -> 26, R 0.90 kept);
      pass_incomplete P 1.00 / 0.89 / 0.53 -> 1.00 / 1.00 / 0.87; touch P at 0.5 0.90 -> 0.95; drive R at 0.5
      0.74 -> 0.89 (with BA-T11b / T14b); kick_out R at 0.5 0.78 -> 0.95; hockey_assist R 0.80 -> 0.95. Costs at
      sigma 0.5: isolation P 0.87 -> 0.83 (S03 / S26 windows that now have the right holder for > 2 s), pull_up P
      0.96 -> 0.92 (1 event), post_up P 0.56 -> 0.53 (a former miss now found with the wrong defence label).
      The confirmer's exact sub-fixes were checked: (a) an inclusive frame count makes segments LONGER (19
      frames = 0.63 s either way), so it cannot make a 0.60 s segment short; it changed nothing and was not kept;
      (a) confirm_s scaled by median(ball.var_p)^0.5 / 0.3 never exceeds 1 (the smoothed ball sigma is 0.055 /
      0.078 / 0.119 m at sigma_p 0.2 / 0.3 / 0.5), so it is a no-op; (b)-(d) are subsumed. Tests
      test_loop2_t10b_* (tight on-ball at sigma 0.5, closeout at the catch, real interception kept),
      test_loop2_isolation_not_at_clip_start.
  - id: BA-T4b contested_ball onset scatter and recall at sigma 0.5
    what: >-
      A ball-between (tie-up) run starts where both players come to rest on the ball: the rest stretch (faster of
      the two smoothed speeds < onset_still_mps 1.5 for >= onset_still_s 0.3, gaps <= onset_still_gap_frames 2) containing the
      confirmed run start, back by at most onset_search_s 1.0 (else the first rest stretch inside the run, else
      the old enclosing-near-run start). Free-ball runs keep the old onset.
    why: >-
      The near run's start scatters 0.3-1.0 s early or late under noise. On S20b the rest onset is within 0.3 s
      of the truth in 20 / 20 / 18 of 20 runs at sigma 0.2 / 0.3 / 0.5 against 7 / 6 / 5 for the near-run start.
      The confirmer's hysteresis on the distance run (enter 0.7 / 0.45, exit +0.25 / +0.2) starts even earlier
      (0 / 1 / 3 of 20). A noise-tier-aware radius and lateral bound (radius_m and between_lateral_m widened by k x
      (pair sigma - 0.13 m)) were swept (k 0-3): at sigma 0.5 the best recall gain (0.30 -> 0.50) cost precision
      0.33 -> 0.22; at sigma 0.3 the lateral widening helped (0.58 / 0.70 -> 0.64 / 0.80) but hurt 0.5 (FP 12 ->
      17), so neither was kept.
    evidence: >-
      contested_ball P/R 0.48 / 0.50 -> 0.86 / 0.90 (sigma 0.2), 0.25 / 0.30 -> 0.62 / 0.75 (0.3), 0.12 / 0.10 ->
      0.30 / 0.30 (0.5; the loop-1 recall regression is back to the 0.1.0 level 0.30 with 4x the precision). The
      author's tie_up onset (truth = the defender's arrival) is 9 / 20 within 0.3 s at sigma 0.3, 10 / 20 before.
      Tests test_loop2_t4b_tie_up_onset, test_loop2_t4b_tight_onball_still_negative_at_low_noise.
  - id: BA-T11b DHO with a running receiver
    what: >-
      _handoff_cut in the control decode: for consecutive teammates' segments, the giver-receiver closest approach
      over [giver end - pass.handoff_lookback_s, receiver start]; when it is <= pass.handoff_max_dist_m and the ball
      is within exit_radius_m of both there, the giver's segment ends one frame before it and the receiver's starts
      at it (an 'exchange': start_kind handoff, no pass, and the drive onset may walk back to it).
    why: >-
      The giver keeps the ball inside his 1.5 m exit radius while the receiver runs away with it, so the exchange
      was decoded 0.4-0.9 s late as a short flight (a pass), and the receiver's touch, dribble and drive started
      late. Over all scenarios (5 seeds, mirrored, sigma 0.2 / 0.5) only the DHO had a teammate closest approach
      <= 1.5 m with the ball near both (one S19 case at 1.78 m does not pass).
    evidence: >-
      S21 pass FPs 1 / 7 -> 0 / 3 of 20 at sigma 0.3 / 0.5, B's late drive onset 4 / 12 -> 0 / 2; drive P/R at 0.3 0.96 -> 0.98, at 0.5 0.85 / 0.82 -> 0.90 / 0.89;
      dribble_inferred R at 0.5 0.71 -> 0.75; potential_assist P at 0.5 0.95 -> 0.97. The confirmer's 'travel
      <= 1.5 m' clause was not needed (the travel of the late flights is 0.9-4.1 m, so it would miss most).
      Test test_loop2_t11b_dho_handoff_at_high_noise.
  - id: BA-T14b drive onset on a slow start and approach-end time at sigma 0.5
    what: >-
      Onset: after the s2-gated walk-back, continue up to onset_s2_lag_s (0.2) while vr < onset_lag_vr_mps (0.0; -0.2 since changes_loop3 BA-T14c),
      only when the driver's calibrated sigma <= onset_s2_lag_sigma_max_m (0.15 m: the sigma_p 0.2 / 0.3 tiers).
      End: a new approach-end time te (event t0 of drive_depth and drive_outcome) = first frame after the run's
      peak where vr rises above end_vr_mps - end_vr_sigma_slope (11) x (sigma - end_vr_sigma_ref_m (0.09)), capped
      at t1; t1 (geometry: depth class, direction, defender reaction, outcome windows) is unchanged.
    why: >-
      S18's ramp from rest crosses onset_vr_mps -0.5 at 1.27-1.30 s (truth 1.0): it is the vr threshold on a slow
      ramp, not only s2 latency, so the confirmer's '< onset_vr_mps' allowance alone left t0 at 1.30; walking back
      to vr 0 does. At sigma 0.5 the same allowance undid BA-T14 (S27 onset 0.33 s early), hence the tier gate.
      The heavier smoothing of the high-noise tier stretches the deceleration, so the -1.0 m/s crossing is 0.2-0.4
      s late at sigma 0.5; on the harness drives the best fixed threshold is -1.0 / -1.5 / -2.0 m/s at sigma 0.2 /
      0.3 / 0.5 (72 / 72 / 70 of 72 / 72 / 71 within 0.3 s), which the slope reproduces. A fraction of the peak radial
      speed was tried and failed on the long transition push (bell-shaped profile); moving t1 itself cut
      drive_depth to 0.53 at sigma 0.2 (labels at a shallower position). The confirmer's '3 consecutive frames'
      end rule moves t1 later, not earlier.
    evidence: >-
      drive 0.97 / 0.94 / 0.82 (P) -> 0.99 / 0.98 / 0.90 (S18 onset misses 5 / 5 / 3 -> 0 / 0 / 3 of 20);
      drive_depth 0.96 / 0.85 / 0.53 -> 0.96 / 0.87 / 0.78; drive_outcome 1.00 / 0.95 / 0.46 -> 1.00 / 1.00 /
      0.90. Cost: drive_direction at sigma 0.3 0.97 -> 0.95 (S17 onset 0.33 s early in 2 / 20). Tests
      test_loop2_t14b_drive_onset_after_slow_ramp, test_loop2_t14b_approach_end_time_at_high_noise.
  - id: BA-T9b airball at higher noise
    what: >-
      The airball direction, r_min and pass-through bounds widen by airball_noise_k (2.0) standard errors: direction
      by sqrt(2) x ball sigma / release displacement (deg), r_min by ball sigma, pass-through by 1.5 x ball sigma.
    why: The misses at sigma 0.3 / 0.5 were direction 15.6-25.5 deg (tolerance 15), pass-through 1.52 m (1.5) and r_min 2.05-2.15 m (2.0), all within 2 standard errors.
    evidence: >-
      S12 shot found 17 / 11 of 20 -> 20 / 19 of 20 at sigma 0.3 / 0.5; rebound_control R 0.96 / 0.86 -> 1.00 / 0.96;
      shot_release R at 0.5 0.89 -> 0.92; no new shot FPs. Test test_loop2_t9b_airball_at_high_noise.
  - id: BA-T3b deflection with an adjacent recovery
    what: The BA-T3 deflection test (slow ball after the deflector's segment, ball receding >= deflect_recede_m, < deflect_max_s) also applies when the recoverer's control starts right after the deflector's (no free frame between).
    why: At sigma 0.3-0.5 the rolling ball passes from the deflector's exit radius straight into the recoverer's enter radius, so the test (which needed a free frame) never ran.
    evidence: live_ball_turnover P at 0.3 0.91 -> 1.00, at 0.5 0.64 -> 0.69; loose_ball R 0.90 / 0.75 -> 0.95 / 0.80 at 0.3 / 0.5; pass_incomplete P at 0.5 0.85 -> 0.87; contested_ball P at 0.5 0.33 -> 0.30 (2 events). Test test_loop2_t3b_deflection_with_adjacent_recovery.
  - id: BA-T6b post_up defence-position label flips
    what: post_up attrs.defense_position_alternatives {behind, front, three_quarter} (phi of the margin to behind_max_deg / front_max_deg over the angle standard error pair sigma / distance) and defense_position_status (unresolved_margin); the point label is unchanged.
    why: >-
      S07's true geometry is 38.6 deg, 6.4 deg inside the 45 deg boundary, and the angle standard error between two
      stances 0.66 m apart is 8-15 deg at sigma_p 0.2-0.5, so P(read > 45) is ~0.25: the 6-8 / 20 flips are the
      noise, not a bias. A dead band would only move the flips; the confirmer scoring a hard label here is the
      wrong test, so the probability is reported instead.
    evidence: post_up label P/R unchanged by this (0.70 / 0.55 / 0.53); detection level 1.00 / 0.95 / 1.00. Test test_loop2_t6b_post_up_defense_position_alternatives.
  - id: T18b rim-finish release events carry conf 0
    what: A release of kind shot takes the shooter's edge factor (as shot_release does), not the ball's.
    why: The ball track ends at the rim right after a finish, so the ball's edge factor at the release frame is 0.
    evidence: conf-0 release events in the sweep 145 -> 0 (all conf-0 events 3985 -> 3839, the rest are clip-start touches / possessions tagged edge). Test test_loop2_t18b_rim_finish_release_conf.
  - id: loop2 not changed
    what: >-
      BA-T15 paint_touch early fires on the block post (3 / 4 / 9 of 20) and post_seal recall at sigma 0.5 (0.45) are
      left as they are.
    why: >-
      The paint flicker comes from the AR-correlated stance error (0.17 m outside the lane, ~1 s correlation), which
      the per-frame sigma in P_in does not model; loop 1 measured the only threshold lever (p_in_min 0.7) costing
      recall 0.97 -> 0.92. Needs the CV pipeline's stance-vs-ball bias (open question).
    evidence: paint_touch 0.98 / 0.97 / 0.87 -> 0.98 / 0.97 / 0.90 (via BA-T10b / T11b only).

changes_loop3:
  # Loop 3 (fix pass 3) on the pass-2 confirmer's still_failing items and regressions. Harnesses: the tester's
  # 1980-scene harness (scenarios.py, 10 seeds x mirrored x sigma_p 0.2 / 0.3 / 0.5) and the confirmer's
  # adversarial steal probes (P1 strip + quick outlet, P2 pick-pocket chased up-court, 120 scenes). Label-level
  # P/R, 0.1.2 (loop 2) -> 0.1.3, as sigma 0.2 / 0.3 / 0.5. Every detector not listed is unchanged at every sigma.
  - id: BA-T10c possession prior absorbs real steals
    what: >-
      _possession_prior decides from the last segment backwards and does not reassign a defence segment when
      (a) the next control is the defence's, that segment is itself not absorbed, and the ball does not reach it
      on an attempt-like path at the attacked rim (_attempt_like: heading within shot_release.dir_tol_deg and
      coming within airball_r_max_m of the rim, both widened by airball_noise_k standard errors), or (b) the ball
      moves >= possession_prior_upcourt_m (3.0) away from the attacked rim over the segment.
    why: >-
      Features of all 552 decoded defence segments on both harnesses (10 seeds), labelled against the truth
      holder: 180 met the prior, 107 of them real steals (all in P1 / P2) and 73 offensive contact. Rule (a) or
      (b) frees 99 / 107 steals and 3 / 73 contacts. Two of those 3 are S20b tie-up segments followed by another
      segment of the same defender; requiring the next segment to be un-absorbed (backward decision) keeps them
      contact. The third is S12 at sigma 0.5 seed 5: a closeout whose segment runs into the airball's flight to the
      defensive rebounder. The confirmer's one-line form (next segment is defence) frees it, giving +1 strip FP,
      +1 entry/pass FP, -1 shot and -1 rebound at sigma 0.5. Defenders do not shoot at the offence's rim, so
      the attempt-like exemption keeps it contact. Contact segments move the ball at most +1.0 m outward
      (max over the harness); the chased steals move it +4.5 to +5.6 m. So (b) has a wide margin and needs no
      noise term (ball sigma <= 0.22 m). The confirmer's 'ball travel >= 4 m' cost lbt P 0.69 -> 0.60 because
      travel does not separate them: contact on drives travels 3-4.5 m toward the rim, and the radial sign does
      separate them. Distance margins do not separate the cases (confirmer, measured); this rule needs none.
    evidence: >-
      Probes: live_ball_turnover 0.00 / 0.00, 0.10 / 0.05, 0.20 / 0.10 -> 0.95 / 0.90, 0.92 / 0.82, 0.72 / 0.65
      (P1 20 / 19 / 16 of 20, P2 16 / 14 / 10 of 20; pass 1 had 20 / 18 / 16 and 16 / 14 / 10). team_possession
      on the probes 0.67 / 0.50, 0.67 / 0.50, 0.58 / 0.44 -> 0.97 / 0.95, 0.93 / 0.89, 0.75 / 0.71. Main harness:
      no change at any sigma for any detector (the confirmer's one-line form measured -0.02 lbt P, -0.01 drive
      R and -0.01 rebound R at 0.5). The remaining P2 misses are late takeovers in the decoder (D's control starts
      0.3-0.7 s late or only at 3.4 s, when A is still within nearest_margin_m), not the prior. Tests
      test_loop3_t10c_strip_with_quick_outlet_is_a_steal, test_loop3_t10c_pick_pocket_chased_upcourt_is_a_steal,
      test_loop3_t10c_upcourt_guard_is_a_yaml_param, test_loop3_t10c_closeout_before_an_airball_stays_contact.
  - id: BA-T3c deflection confirmed after the prior
    what: The team-change confirmation (_confirm_team_changes, the BA-T3 / T3b / T10 contact rules) runs again after the possession prior.
    why: >-
      S13 at sigma 0.5 seed 3 decodes A, D (deflector), DB (0.17 s next to B), B. The D segment was not between two
      offensive segments when the confirmation ran, so it was kept. The prior then hands DB's frames to B, which
      leaves A-D-B, and D's segment passes the deflection test (slow ball after it, recedes 0.93 m, 0.8 s). The
      result was an 'interception' by D plus a 'loose_recovery' by B.
    evidence: >-
      live_ball_turnover P at 0.5 0.69 -> 0.75 (26 -> 24 events, R 0.90 kept); loose_ball 0.53 / 0.80 -> 0.55 / 0.85
      at 0.5; pass_incomplete P at 0.5 0.87 -> 0.89; no change at 0.2 / 0.3. Test
      test_loop3_t3c_deflection_confirmed_after_the_prior. The other S13 FP pair (mirrored seed 4) has a mean ball
      speed of 3.01 m/s after D against the 3.0 slow bound: noise-limited, left.
  - id: BA-I1 isolation precision at sigma 0.5 (noise-aware gates)
    what: >-
      isolation: the no-teammate test needs dT >= teammate_min_m + teammate_noise_k (1.0) x the handler's pair
      sigma, and the attacking-dribble gain bound is attack_dribble_gain_m + attack_gain_noise_k (1.0) x the pair
      sigma at the window start.
    why: >-
      The 0.87 -> 0.83 drop was S03 (3 FPs at sigma 0.5) and S26 (1). S03: T stands 3.35 m from A at the catch,
      and at sigma 0.5 the distance reads >= 4.0 m, so the window starts at the catch and lasts 2.07 s; with the
      true distance it lasts 1.6 s and is no isolation. BA-T10b only exposed this by handing the contact frames
      back to A. S26: a dribble reversal along the chord across the top truly comes 0.7 m closer to the rim, and
      a start-minus-minimum of noisy r reads >= 1.0 m. Both are min / max statistics of noisy series, so the
      bound widens with the measured sigma. k = 2 on teammates moved S26 windows past the clip-start drop at
      sigma 0.2 (+2 FPs), so k = 1.
    evidence: >-
      isolation 1.00 / 1.00, 0.95 / 1.00, 0.83 / 1.00 -> 1.00 / 1.00, 1.00 / 1.00, 0.95 / 1.00 (above pass 1's 0.87
      at 0.5). No other detector changed. Tests test_loop3_i1_noise_aware_isolation_gates,
      test_loop3_i1_true_isolation_kept_at_high_noise, test_loop3_params_are_yaml_params.
  - id: BA-T14c drive onset early after a long rest (drive_direction at sigma 0.3)
    what: drive.onset_lag_vr_mps 0.0 -> -0.2 m/s (the BA-T14b lag allowance continues only while the driver really moves toward the rim).
    why: >-
      S17 (A at rest for 2.6 s, then a baseline drive at 3.5 s) was dated 3.17 s at sigma 0.3 seeds 1 / 10. The smoothed
      vr of a still player is below 0 on about half of the frames, so the 0.2 s allowance ran its full length
      on noise. -0.2 and -0.4 gave the same harness result; -0.2 is the smaller change.
    evidence: >-
      drive_direction at 0.3 0.95 -> 0.97 (back to the baseline / pass 1); drive at 0.3 0.98 -> 0.99; drive at 0.2
      (the S18 slow-ramp fix) unchanged at 0.99; drive_defender_reaction t0 moves by 1-2 frames only. Test
      test_loop3_t14c_drive_onset_after_long_rest; test_loop2_t14b_drive_onset_after_slow_ramp still passes.
  - id: BA-T4c contested_ball at sigma 0.5 (noise_status)
    what: >-
      attrs.noise_status (ok / noise_limited) and attrs.pair_sigma_m. The status is noise_limited when the calibrated
      ball-player pair sigma at t0 exceeds noise_limited_pair_sigma_m (0.24 m). The harness reads 0.13 / 0.19 / 0.27-0.28 m at the three tiers.
      P/R is unchanged by design.
    why: >-
      At sigma 0.5 the S20b tie-up (ball 0.3 m from both, players 0.63 m apart) and the S20 on-ball defence (ball at the holder,
      defender 0.75 m) overlap in every gate: over the 2 s window the measured ball projection onto the O-D segment
      is 0.00-0.94 for the tie-up and -0.48-0.41 for on-ball defence, and |dA - dD| runs up to 0.63 m. Loop 2
      rejected widening the radius and lateral bounds (recall +0.20 for precision -0.11). The confirmer offered a choice:
      accept the item as noise-limited, or mark it. It now marks itself.
    evidence: >-
      contested_ball 0.86 / 0.90, 0.62 / 0.75, 0.30 / 0.30 (unchanged). On S20b, S20, S26 and S07 (10 seeds) every event
      at sigma 0.5 is noise_limited and every event at 0.2 / 0.3 is ok. Test test_loop3_t4c_contested_noise_status.
  - id: loop3 tried and rejected
    what: >-
      (1) dribble_inferred travel bound held for travel_hold_s 0.1 / 0.2 s (aimed at the S30 jab FP behind the pull_up
      P drop at 0.5). (2) No further change for post_up and pull_up precision at 0.5.
    why: >-
      (1) It cut pull_up R 0.88 / 0.80 / 0.57 -> 0.72 / 0.65 / 0.50 (0.1 s) and catch_and_shoot P 0.95 -> 0.90: a
      one-dribble pull-up's displacement crosses 1.2 m only in the last frames before the final gather. The S30
      jab FP (max displacement 1.24 m, conf 0.56) and the S04 true one-dribble pull-ups (1.22-1.47 m, conf 0.53-0.86)
      overlap, so no displacement bound separates them. (2) pull_up P at 0.5 0.96 -> 0.92 is 1 FP in 25 events:
      S30 mirrored seed 5, where the BA-T10b prior correctly gives the jab segment back to B. The other FP, S17 mirrored
      seed 9, was already there in pass 1. post_up P at 0.5 0.56 -> 0.53 is a former miss that is now detected with
      the wrong defence label. Detection level is 1.00 / 0.85 against 1.00 / 0.80 in pass 1, so the drop is a gain
      in detection, and the BA-T6b label probability covers the label. The confirmer counts both as precision losses;
      at the detection level they are not.
    evidence: Sweeps in fix3_ball_actions/main (c4_h0.1, c4_h0.2); dbg_dr.py displacement table.

changes_loop4:
  # Loop 4: calibration on real tracking (SportVU, 3 NBA 2015-16 games, 194 clock-running chunks, 6855 s; private
  # research data, aggregates only). Runner told sigma 0.15 m; PBP truth matched on (period, clock), detection clock
  # shifted 2.0 s, tolerance 2.5 s, greedy one-to-one. Covered truth: 386 FGA, 25 steals (27 live turnovers), 229
  # player rebounds. Synthetic checks: the loop-3 harnesses (main 1980 scenes, steal probes P1 / P2, confirm3
  # adversarial set N01-N14), sigma_p 0.2 / 0.3 / 0.5; a change was kept only with real agreement up and no
  # synthetic loss beyond one event. Loop start -> end (clean): shot_release P / R 0.75 / 0.35 -> 0.79 / 0.67
  # (shooter id 0.60 / 0.28 -> 0.73 / 0.62); live_ball_turnover 276 events (P 0.08, steal R 0.84) -> 118 (P 0.18,
  # R 0.84); rebound P / R 0.42 / 0.29 -> 0.47 / 0.63; pass_incomplete 192 -> 63 events (steal R 0.56 -> 0.44).
  # With added noise 0.3 m: shot 76 -> 133 / 48 min, live_ball_turnover 110 -> 56, rebound 66 -> 123 (clean 138 /
  # 50 / 129): rates move <= 14 % under noise.
  - id: BA-R4b team baskets from the goal-side vote (replaces the BA-R4a draft)
    what: >-
      _team_rims: a clip holds both teams' possessions, so each list gets its own basket. On every frame with all
      players in one half, each attacker's nearest opponent is goal-side (nearer that half's basket) or not; the
      frame votes for the majority, signed by the half. The net vote decides when |vote| >= rim_goalside_min_s and
      both lists have >= rim_goalside_min_players; else the default (offence list -> origin). Every rim test
      (shot / attempt / rim finish / rebound / oop / release_r / spot / three) uses the releasing team's basket;
      shot_release attrs gain basket (origin / far).
    why: >-
      The SportVU loader puts each chunk in the frame of the basket the ball is nearest most of the time; 138 of
      the first 194 classified FGA misses went to the other basket. The BA-R4a draft (team whose ball-control
      frames sit in the origin half more) put 43 of 194 chunks (900 s) at the wrong basket; the loader's own
      offence/attacked-end pairing is wrong on 47 chunks (1826 s).
    evidence: >-
      Goal-side vote vs each team's per-half basket (consistent across the 4 periods and both teams of all 3
      games): 0 wrong of 193 decided chunks, 1 undecided (11 s), also with added noise 0.5 m. Real: shot R 0.35 ->
      0.53, rebound R 0.29 -> 0.48, live_ball_turnover 276 -> 193 events. Synthetic: unchanged at every sigma
      (2-on-2 adversarial scenes N01 / N07 voted the wrong basket without the player minimum). Tests
      test_loop4_r4b_*.
  - id: BA-R4c alley-oop guard needs a catch at the rim frame by another player
    what: >-
      _shot_scan oop: the receiving teammate must not be the shooter and his refined catch must come within
      shot_release.oop_catch_lag_s (0.15 s) of the rim frame.
    why: >-
      37 real misses had every shot criterion passed and were dropped as alley-oops: a teammate (11 of them the
      shooter) gained the ball 0.2-0.6 s after the rim frame, i.e. an offensive rebound or putback.
    evidence: Real shot R 0.53 -> 0.60 (tp 204 -> 232), OREB R 0.22 -> 0.38. Synthetic unchanged. Test test_loop4_r4c_*.
  - id: BA-R4d rim reach followed into the rebounder's control
    what: >-
      _shot_scan: when the free interval ends at the next control, the rim-reach window extends into it for up to
      shot_release.rim_reach_ext_s (0.3 s) while the smoothed ball speed stays >= touch.flight_min_speed_mps.
    why: >-
      A rebounder under the rim enters his 1.0 m control run 0.07-0.33 s before the ball reaches the rim (35 real
      misses: r_min over the free 0.8-2.3 m, 0.0-0.6 m through the catch); a caught pass slows to the catcher's pace.
    evidence: >-
      Real shot R 0.60 -> 0.66 at P 0.79; live_ball_turnover 193 -> 170, pass_incomplete 124 -> 101 events (shots
      read as interceptions). Synthetic: potential_assist and rebound_control at sigma 0.5 move by one event each
      (156 / 158, 81 / 80 events); nothing else. Test test_loop4_r4d_*.
  - id: BA-R4f rebound-scramble touches are not possessions
    what: >-
      _scramble: a touch starting <= rebound_control.scramble_window_s (3.0 s) after a shot's rim frame and lasting
      < rebound_control.secure_min_s (1.5 s). Losing it to the other team is not a live_ball_turnover; a flight
      from it is not a pass_incomplete.
    why: >-
      Of 150 unmatched real live-ball turnovers, 86 followed a rim visit (ball z); 45 had a scramble-length lost_by
      touch, against 0 of 20 PBP-matched steals. NBA scoring credits the opponent's rebound, not a steal.
    evidence: >-
      Real live_ball_turnover 170 -> 126 events with steal recall unchanged (0.76), pass_incomplete 101 -> 86.
      Synthetic unchanged. Tests test_loop4_r4f_*. Tried and reverted (BA-R4g): crediting the rebound to the first
      secured control dropped rebounder-id matches 87 -> 77 and broke rebound_outlet (a rebound and a quick outlet).
  - id: BA-R4h possession prior favours the team in its frontcourt
    what: >-
      _possession_prior: the prior is applied for the possessing team, taken as the defence list when the ball at
      the segment start is within touch.possession_prior_frontcourt_r_m (7.5 m) of the defence list's basket, else
      the offence list (as before); guards (a) / (b) and the up-court distance use that team's basket.
    why: >-
      The offence-list prior handed far-basket passes to a nearby offence-list defender (inspected false
      interceptions: receiver 0.2-0.4 m from the ball, defender 1.3-1.5 m). A first version (possessor = nearer
      basket at any distance) regressed the steal probes (stealer crossing half court).
    evidence: >-
      Real live_ball_turnover P / R 0.15 / 0.76 -> 0.18 / 0.84 (118 events), shot R 0.66 -> 0.68, rebound R 0.62 ->
      0.64 (rebounder id 0.38 -> 0.41). Synthetic unchanged at every sigma. Test test_loop4_r4h_*.
  - id: BA-R4i possession-prior guards need the defender to lead the ball (loop-3 open items a and b)
    what: >-
      Guard (a) frees a defence segment only when the ball over its last possession_prior_lead_s (0.3 s) is on
      average >= possession_prior_lead_m (0.0 m) nearer the defender than the absorbing player; guard (b) only when
      the defender is nearer the ball on most frames and the absorbing player does not take the next control.
    why: >-
      confirm3 still_failing BA-T10c-a (glued on-ball defender before an intercepted pass became a false strip and
      hid the interception) and BA-T10c-b (back-out dribble under pressure gave strip / re-strip pairs).
    evidence: >-
      Adversarial set, sigma 0.2 / 0.3 / 0.5: live_ball_turnover P 0.50 / 0.41 / 0.27 -> 0.51 / 0.42 / 0.35, R
      0.38 / 0.33 / 0.22 -> 0.38 / 0.33 / 0.28; pass_incomplete R at 0.5 0.58 -> 0.78; N03 found 12 -> 15 of 20 at 0.5,
      N10 10 -> 16, N05 / N05b false strips 0/6/6 / 4/3/8 -> 0/2/1 / 0/2/2; team_possession at 0.5 0.48 / 0.44 ->
      0.54 / 0.49. Main harness and P1 / P2 unchanged (a 0.3 m lead margin lost quick strip-and-outlets and was
      dropped to 0.0). Real: +-1 event. Tests test_loop4_r4i_*.
  - id: BA-R4e (reverted) closeout merge when the ball flies over the defender
    what: Merge a short defender segment into the shooter's when the ball from the shooter's release heads at the rim and recedes from the defender.
    why: 14 real misses decoded the contesting defender as the holder for 0.3-0.5 s (ball over his head at z 12 ft).
    evidence: Real shot R 0.66 -> 0.63 (the merged shooter segment swallowed releases); reverted.
