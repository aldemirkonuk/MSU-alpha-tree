# L2: shots (XY proxies) and rebounds / turnovers
# ======================================================================================
- id: shot_release
  research_id: BA-80
  level: primitive
  name: Shot release (XY proxy) and gather
  aliases: [FGA, shot release]
  actors: {shooter: player}
  t0: refined release frame
  status: proposal
  detectable: xy
  rule: |
    A FLIGHT from a touch where (a) the ball's displacement over the first dir_window_s (or to the rim
    frame) is within dir_tol_deg of the bearing to the rim (skipped when release r < layup_r_m); (b) the
    ball reaches r <= rim_reach_m within max_flight_s; (c) the ball does not pass through: forward progress
    along the release direction over pass_through_window_s after the rim frame <= pass_through_max_m; (d)
    not an alley-oop: no teammate control at r <= oop_catch_r_m starting <= oop_window_s after the rim frame.
    changes_loop4: each team's own basket (BA-R4b, attrs.basket); the oop guard needs another player's catch within
    oop_catch_lag_s of the rim frame (BA-R4c); rim reach followed into the rebounder's control (BA-R4d).
    With z (not here): release z >= 1.8 m and apex >= 3.05 m. PBP shot row within 2.0 s anchors.
    gather = end of the inferred dribble run, else the catch. made / missed needs PBP or z.
    changes_loop1: pass-through measured into the receiver's control (BA-T2); airball class (BA-T9, airball_* params, attrs.airball).
    changes_loop2 BA-T9b: the airball direction, r_min and pass-through bounds widen by airball_noise_k standard errors.
  params:
    dir_tol_deg: {value: 15, unit: deg}
    dir_window_s: {value: 0.3, unit: s}
    rim_reach_m: {value: 0.75, unit: m}
    max_flight_s: {value: 3.0, unit: s}
