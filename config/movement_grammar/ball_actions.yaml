  rule: |
    An offensive touch starting with a catch / handoff / rebound / loose recovery, the holder at the catch
    in post_area_rule or (|x| <= gate_abs_x_m and y <= FT_Y) (checker BA-61), and within window_s after the
    catch: nearest defender within contact_radius_m on >= contact_min_s of frames, and a quiet sub-window
    (displacement over quiet_s <= quiet_disp_m). Touch >= min_s unless it ends in a pass or shot.
    post_depth (deep / standard / high named spots) and spot are attributes, not gates. defense_position
    (BA-62): behind if the median angle at P between rim and D <= behind_max_deg, front if between ball and D
    <= front_max_deg, else three_quarter. Posture (back-to-basket vs face-up) needs pose: 'unknown'.
    changes_loop1 BA-T6: the |x| clause also needs r <= gate_r_max_m; rebound / loose-ball touches must last min_s.
    changes_loop2 BA-T6b: attrs.defense_position_alternatives {behind, front, three_quarter} from the angle standard error (pair sigma / distance) and defense_position_status (unresolved_margin); the point label is unchanged.
  params:
