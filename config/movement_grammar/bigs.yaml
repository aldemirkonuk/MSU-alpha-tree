changes_loop2:
- id: L2-B14
  what: id_swap_risk applies min_s to the whole stay interval (d < stay_dist_m) instead of the enter run (d < swap_dist_m);
    enter runs of any length qualify when their mean P(d < swap_dist_m) >= enter_p_min. Confidence unchanged.
  why: 'Loop-1 regression R2: hysteresis measures (last - a) * DT, so min_s 0.1 s needs 4 frames below 0.6 m and a 5 m/s
    lane crossing has 3. The 0.8 m standoff false positive is noise-limited: on the tester harness its smoothed distance
    reads mean 0.33-0.75 m over 1-2 s (sigma_p 0.2-0.5), inside the 0.30-0.69 m range of the true 0.45 m bodying
    positive, so no distance, duration or centred-mean gate separates them. The confirmer''s proposed conf multiplier
    P(min 0.3 s centred-mean d < 0.6) was measured and rejected: it lowers the AUC of conf (true events vs standoff
    events) from 0.975 / 0.844 / 0.562 to 0.644 / 0.534 / 0.338 at sigma_p 0.2 / 0.3 / 0.5, because the fast crossing
    has the highest centred mean of all. Sub-0.2 m pair-distance splits are not resolvable at sigma_p >= 0.2 from XY; a
    tracker ID-confidence feed is needed.'
  evidence: 'Harness (10 seeds x 2 sides): id_swap_risk P/R 0.83/0.88, 0.77/0.85, 0.73/0.75 -> 0.85/1.00, 0.80/0.97,
    0.74/0.88 at sigma_p 0.2 / 0.3 / 0.5; paths_cross_in_lane 15/15/14 -> 20/20/19 of 20; standoff false positives
    7/10/9 -> 7/10/10 (noise-limited; the extra one at 0.5 had a 3-frame enter run, conf mean 0.34/0.44/0.54 vs 0.63/0.60/0.56 for true events). Tests
    test_l2_b14_fast_crossing_enter_run_under_min_s, test_b14_paths_cross_in_lane.'
- id: L2-B7
  what: 'ghost never-set test replaced: no run of CA-RTS speed < never_set_speed_mps longer than never_set_slow_frames (4
    low / 2 high tier) may touch t_closest +- never_set_half_s (each run counted with its full length); the stationary-run
    test and the min-speed test are gone; psp = Phi((max + 1 - longest) / never_set_slow_sigma_frames 1.5). approach_h_m,
    approach_dh_m and closing_mps are tier-aware (2.0/2.5 m, 1.5/1.8 m, 1.5/1.0 m/s). New shared helpers noise_tier,
    tiered, run_lengths.'
  why: 'The smoother rounds a 150 deg reversal at 3 m/s into a 0.26-0.97 m/s minimum and an s2-stationary blip, the same
    reading as a real stop, so min speed and the stationary run rejected 17/16/19 of 20 ghosts on the tester''s
    wing-three scenario. The DURATION of the slow reading separates them: longest run below 1.0 m/s 0-0.20 s (median
    0.13) for the reversal vs 0.17-0.37 s for the real ~0.3 s set at sigma 0.2-0.3. The confirmer''s proposals were
    measured and not adopted: the minimum chord speed over a sliding 0.3-0.4 s window overlaps (reversal 0.30-1.34
    vs set 0.05-0.78 m/s at sigma 0.3), and exempting mask_stat inside +-0.2 s of t_closest removes the only stationary evidence of the real
    set (on almost every run its stationary frames fall inside +-0.2 s). At sigma 0.5 (q = 10) the smoother cuts the corner by 0.7-1.0
    m (true 1.35 m to h reads 2.0-2.4 m) and the closing speed reads 1.0-1.45 m/s, hence the tier-aware approach. The
    slow-run cap at the high tier is 2 (3 let 2 of 20 real sets through). A set that ends just before the window
    (the family test: 1.2 s set, then walks past h) is rejected because runs count in full.'
  evidence: 'Harness: ghost P/R 1.00/0.53, 1.00/0.50, 1.00/0.30 -> 1.00/0.85, 1.00/0.70, 1.00/0.60 at sigma_p 0.2 / 0.3 /
    0.5 (wing three 3/4/1 -> 14/9/6 of 20; ghost_in 18/16/11 -> 20/19/18); all three ghost negatives 0 FP at every
    sigma; screener_post_action label errors unchanged (1/3/7 of 120). Residual: at sigma 0.3 a 150 deg constant-speed
    reversal reads slow for 5-8 frames on 11 of 20 runs, overlapping the real set (>= 5 frames); not separable from XY.
    Tests test_l2_b7_*, test_ghost, test_b7_ghost_out_along_the_arc.'
- id: L2-B13
  what: post_seal and roll_into_post read seal_def_m per noise tier (1.2 m low, 1.5 m high); post_seal r_max per tier (3.5 m
    low, 3.8 m high; also used in P(r < r_max)).
  why: 'At sigma_p 0.5 the measured geometry is biased: a true 0.89 m post-defender gap reads 1.2-1.9 m and a true r 3.12 m
    post reads 3.5-3.9 m for most of the seal, so the strict frames started 0.6-1.1 s late (fn + fp) or never. The
    confirmer''s angle-agnostic walk-back was already in place (cand ignores the angle); the binding limits were the
    distance and r cuts, not the angle class. The roll-arrival onset proposal was not needed after this.'
  evidence: 'Harness: post_seal 0.71/0.68 -> 0.90/0.90 and roll_into_post 0.83/0.72 -> 0.92/0.88 at sigma_p 0.5; sigma 0.2
    / 0.3 unchanged by construction (low tier); negatives (three-quarter front, moving cut, fronts ballside, roll through)
    0 FP. Tests test_l2_b13_post_seal_sigma_0p5 (16 seeds: loop 1 12, now >= 15), test_l2_b13_post_seal_negatives_sigma_0p5.'
- id: L2-R5
  what: post_seal intervals closer than seal_merge_gap_s (0.5 s) merge before min_s (seal_intervals merge_gap).
  why: A noise break of 2-11 frames split one post seal into two events (the second one an extra event = fp).
  evidence: 'Harness: post_seal sigma 0.3 P/R 0.90/0.93 -> 1.00/0.97; sigma 0.5 fp 6 -> 4 (with L2-B13). Test
    test_l2_r5_seal_intervals_merge_gap.'
- id: L2-R3
  what: screen_frame early_margin_s per noise tier (0.1 s low, 0.15 s high).
  why: 'Loop-1 regression R3: at sigma_p 0.5 the smoothed roll start leads the true release by up to 0.3 s on some seeds, so
    a post-use top roll read t_use - t_rel = 3 frames = 0.1001 s against the 0.1 s cut and was called early (slip), which
    removed roll, replace and roll_and_replace on that seed.'
  evidence: 'Harness at sigma_p 0.5: replace R 0.88 -> 0.98, roll_and_replace 0.88 -> 0.97, short_roll 0.95 -> 1.00,
    short_roll_playmaking 0.85 -> 0.90; slip, slip_to_arc, screen_frame and screener_post_action totals unchanged; low
    tier unchanged. Test test_l2_r3_top_roll_post_use_at_sigma_0p5 (the harness seed 1004 path).'
- id: L2-R1
  what: No detector change (behind_def negative wing_defender_runs_level_0p3m_ahead_in_y).
  why: 'Harness label, not a detector bug: with the B8 rim-direction definition the defender''s radial lead during the roll
    reads 0.68-1.02 m at sigma 0.2 (true ~0.86 m) >= behind_m 0.76, so the scenario is a positive. The tester should use
    a defender offset of about (+0.5, +0.3) m (radial lead ~0.55 m) to keep it a near-miss negative.'
  evidence: diag_bd3 (confirm_bigs) and fix2_bigs re-run; behind_def precision is 1.00 at every sigma without this scenario.
- id: L2-B11
  what: No change (pop_mid_baseline labelled pop_arc / none / ghost 4-5 of 20 at sigma 0.5).
  why: 'A tier-aware never_set_speed_mps (1.0 / 1.3 m/s) in screen_frame was tried: it fixed one label and gained pop_arc +1
    and pop_mid +1 but cost move_to_screen recall 0.78 -> 0.72 and slip_to_arc recall 0.82 -> 0.80 at sigma 0.5, so it was
    reverted (no metric may be traded for a worse one).'
  evidence: fix2_bigs/run3_05.txt vs run4_05.txt (all detectors at sigma 0.5).
changes_loop4:
- id: L4-1
  what: bigs.screen_class reads the input screen's class from attrs screen_class, else from the screens family's attrs kind
    via shared screen_kind_map (on_ball -> ball, off_ball -> off_ball, handoff -> dho), else ball.
  why: 'Real SportVU (3 NBA 2015-16 games, screens -> bigs): the screens family writes kind and no screen_class, so every
    off-ball screen was read as a ball screen; a screener drifting out after a down screen became pop_arc / pop_mid (19 of
    64 off-ball screens in the first real run).'
  evidence: 'Real, clean, sigma told 0.15: pop_arc 9.3 -> 1.2 /48, pop_mid 2.9 -> 0 /48; the 114 off-ball screens now label
    none 108, roll 3, move_to_screen 2, slip 1. Synthetic harness (7,500 runs, sigma_p 0.2/0.3/0.5) unchanged. Test
    test_l4_1_screens_family_kind_is_the_screen_class.'
- id: L4-2
  what: 'post_up: the run must start with a pass reception from a teammate (require_pass), catch_r_min 1.27 m (outside
    the restricted area), mean speed <= 2.0 m/s over the 0.3 s before the catch, and no ball XY within fga_rim_r of the rim
    from 1.5 s before to 1.0 s after the catch.'
  why: 'Real post_up 78.6 /48 against about 16-20 /48 expected (NBA 2015-16 post-ups about 8-10 per team per game, and
    those include mid-post catches outside this rule-book post_area). Inspection of the 111 candidates the loop-3 rule
    accepts on the current loader (48.7 /48, every L4-2 gate off): 17 are tips / put-backs under the rim (r < 1.27 and the
    ball at the rim < 1 s later), 9 fail only the rim-before test and all had the ball 11-16 ft high in the 1.5 s before
    (rebounds; ball height used for diagnosis only), 14 fail only the speed test and 10 of them moved >= 2.4 m/s straight
    through the catch (cuts, drives, handoffs from 1.5-3.7 m), 6 fail only the pass test and all 6 had no holder for 0.3-2 s
    before with the ball 0.2-4 ft high (dribble pickups).'
  evidence: 'Real: post_up 78.6 -> 4.6 /48 (noise 0.3: 3.8). Funnel on the current loader: pass catches by an attacker
    held >= 0.5 s 479 /48 -> r in [1.27, 4.5] 65 -> no rim visit 35 -> slow 18 -> inside post_area 9.7 -> defender within
    1.5 m 4.6; the shortfall against NBA post-up rates is the rule-book post_area (|x| <= 2.74 m, below the FT line),
    not a gate. A dribble-chain bridge was measured and rejected (L4-4). Harness post_up sigma 0.5 P 0.93 -> 0.97, R
    unchanged. Tests test_l4_2_*.'
- id: L4-3
  what: 'ghost: half court only (neither h nor s in named_spots backcourt at t_closest) and the screener''s own velocity
    toward h supplies >= screener_share_min (0.5) of the mean closing speed.'
  why: Real ghosts included teammates sprinting past the handler in transition and handlers driving past a standing or
    drifting teammate (the closing speed was the handler's).
  evidence: 'Real ghost 23.9 -> 9.7 /48. Harness ghost TP 34 / 28 / 24 of 40 at sigma_p 0.2 / 0.3 / 0.5, P 1.00 (unchanged
    from loop 3). Tests test_l4_3_ghost_real_failure_modes, test_l4_3_ghost_closing_is_the_screeners_own_speed.'
- id: L4-4
  what: No change (a dribble-chain bridge for post_up was tried and reverted).
  why: 'Hypothesis: a post catch followed by back-down dribbles splits into short holder runs, and require_pass rejects
    every run after the first. Joining same-player runs across holder-less gaps <= 0.8 s with the ball within 1.5 m was
    implemented and measured.'
  evidence: 'Real post_up 4.6 /48 with gap 0, 0.5, 0.8 and 1.2 s alike: the holder model (HOLD_R 1.0 m) keeps the
    dribbler as holder through most bounces (about 39 same-player gaps per game, none of them at a post catch). Reverted
    (no measured benefit).'
- id: L4-5
  what: 'screener_post_action: the label detectors run on the screen with conf 1 (label_given_screen), so the label
    probabilities are P(label | screen); event conf = p_label x screen conf (attr p_screen).'
  why: 'Each label''s standalone conf multiplies the screen''s conf in. Real screens-family screens have median conf 0.63
    (25% < 0.45), so a sure roll (r 6.7 -> 0.4 m at 3-4 m/s) behind a conf-0.45 screen read roll 0.45 vs none 0.55 and was
    stored as ambiguous:roll|none (inspected: all 6 on-ball ambiguous:roll|none cases went from r 4.8-7.7 m to
    0.4-2.1 m at 2-4 m/s).'
  evidence: 'Real: ambiguous labels 19 -> 2 of 161 screens (noise 0.3: 8 of 146); on-ball top labels roll 11 -> 18 of 45,
    none 12 unchanged. Standalone rates unchanged. Harness unchanged (hand-labelled screens have conf 1). Test
    test_l4_5_label_given_screen.'
- id: L4-6
  what: 'roll accepts release_timing early when slip''s onset gate fails (early_without_slip_gate): no 0.5 s window
    starting in [t_rel - 0.2, t_rel + 0.5] s with mean v_r >= 2.0 m/s.'
  why: 'Real on-ball screens labelled none although the screener went from r 6.9 to 1.8 m: he left 0.1-0.2 s before the
    use (early) but reached v_r 2 m/s only about 0.8 s after the release, so roll (post_use only) and slip (gate) both
    refused it. A late-accelerating early release is a roll.'
  evidence: 'Real roll 9.7 -> 10.9 /48 (noise 0.3: 9.7); slip unchanged (1.2). Harness roll / slip / screener_post_action
    unchanged at sigma_p 0.2 / 0.3 / 0.5. Synthetic reproduction: the release of EARLY_ROLL_WP reads early on 6 of 12
    noisy runs (sigma_p 0.2-0.5) and the old rule lost the roll on each; tests test_l4_6_early_release_slow_start_is_a_roll,
    test_l4_6_quick_slip_is_still_a_slip.'
- id: L4-7
  what: id_swap_risk outputs flip_deg (bearing change of d around o from 0.3 s before the onset to 0.3 s after the end)
    and crossed (flip_deg >= 90). The flag rule is unchanged.
  why: 'The real rate (420.9 /48) is not a false-positive rate: on SportVU (centre noise ~2 mm) every flag is a true
    centre encounter below 0.6 m (median min distance 0.44 m, median 1.1 s, 40% with the attacker holding the ball), and
    vendor IDs cannot swap, so swap truth needs the production tracker. A two-target alpha-beta NN tracker run on the
    real encounter trajectories with sim.py noise swapped in about 25% of encounters at sigma_p 0.5 regardless of
    duration, distance, crossing or relative speed, i.e. the flag is not over-firing for an XY-only tracker. Consumers
    can now separate crossings (the classic swap geometry) from one-sided contact (post defence, box-outs, screens).'
  evidence: 'Real: 52% of flags crossed (noise 0.3: 52%); rate 420.9 /48 clean, 469.7 /48 at noise 0.3. Harness
    unchanged. Test test_l4_7_id_swap_crossed_attr. Real swap truth needs a tracker ID-confidence feed (upstream).'
- id: L4-8
  what: 'ghost: the path must turn near t_closest: for some u within +-0.3 s of it the heading of the displacement over
    [u - 0.5 s, u] and over [u, u + 0.7 s] differs by >= turn_min_deg (20). Unit-test GHOST_S now turns at the fake set;
    the old straight path is kept as a negative (GHOST_S_STRAIGHT).'
  why: 'Inspected all 23 real ghosts after L4-3: most were runs straight past the handler at 4-5 m/s (cuts to the rim,
    baseline runs, transition runs); turn measured 1-30 deg on 13 of them. Every harness ghost turns 82-151 deg and the
    60 deg arc-fade unit ghost reads >= 26 deg at sigma_p 0.5 (16 seeds).'
  evidence: 'Real ghost 9.7 -> 6.3 /48 (noise 0.3: 6.7). Harness ghost unchanged (TP 34 / 28 / 24, P 1.00). Tests
    test_l4_8_ghost_straight_run_past_is_a_cut, test_l4_8_turning_ghost_sigma_0p5, test_b7_ghost_out_along_the_arc.'
changes_loop5:
# Loop 5 (25 Oct 2026, minor-items pass): the B17 note left four rare branches without a dedicated scene. Each now has a
# positive and a near-miss scene, run on seeds 1-10 at sigma_p 0.2 / 0.3 / 0.5 (tests test_l5_rare_branch_rates,
# test_l5_branch_parents_still_found). No parameter or detector code changed, so real SportVU rates are unchanged
# (checked: bigs rates identical before / after on the 3 games, see L5-4).
- id: L5-1
  what: 'Test only: short_roll trap_context. Positive: the screener''s defender jumps out to the handler while the
    handler''s defender trails him (two defenders within trap_dist_m 2.0 m for >= trap_min_s 0.5 s in [t0 + 0.3, t0 +
    1.0] s). Near miss: the screener''s defender drops to 2.6 m below the screen with the roller.'
  why: B17 left trap without a dedicated test; trap_context is passed on to short_roll_playmaking.
  evidence: 'trap_context True on the trap scene 10 / 10 / 9 of 10 (sigma_p 0.2 / 0.3 / 0.5; the 0.5 miss is a missed
    short_roll), on the drop scene 0 / 0 / 0; short_roll found 10 / 10 / 9 in both. A first drop path that passed 0.8 m
    from the handler at the use read trap 3 / 5 / 4, correctly by the rule (two defenders inside 2.0 m), so the
    near miss keeps the dropping defender > 2 m away.'
- id: L5-2
  what: 'Test only: slip touch. Positive: the screener stops 0.4 s at the top and slips while the handler''s defender
    meets him 0.6 m away; near miss: the handler''s defender trails on the high side, never within 1.5 m of the screener.'
  why: B17 left slip touch without a test.
  evidence: 'touch True 10 / 9 / 1 of 10 at sigma_p 0.2 / 0.3 / 0.5, far scene 0 / 0 / 0; the slip is found 10 / 10 / 10
    in both. With a 0.2 s stop (SLIP_WP) touch read 8 / 3 / 0: the minimum smoothed screener speed of a 0.2 s stop
    is 0.6-1.5 m/s at 0.2-0.3 and 1.5-3.1 m/s at 0.5 (q 10 tier), above never_set_speed_mps 1.0, and at 0.5 t_rel is
    read 0.2-0.4 s early so the window ends before the brush. Documented limit, not changed: at the q 10 tier
    touch = false means unknown (a tier-aware touch is a judgment for gold labels, see the report).'
- id: L5-3
  what: 'Test only: dunker_relocation angle_short. Positive: a third attacker reaches the screen-side dunker spot
    0.6-0.8 s before the ball screen and stays; near misses: parked in the spot from the start (arrival > angle_short_before_s
    1.0 s earlier) and the opposite-side dunker spot.'
  why: B17 left angle_short without a test.
  evidence: 'angle_short 10 / 10 / 10 of 10 at sigma_p 0.2 / 0.3 / 0.5; parked 0 / 0 / 0; other side 0 / 0 / 0.'
- id: L5-4
  what: 'Test only: high_low lob. Positive: high-post passer at (0.5, 4.5), receiver cutting from (3.8, 3.4) to (0.4, 0.3)
    at >= 3 m/s into the catch (r < lob_r 1.5 m); near miss: the same pass to a standing receiver at r 1.28 m.'
  why: B17 left the high-low lob flag without a test.
  evidence: 'lob True 10 / 9 / 7 of 10 at sigma_p 0.2 / 0.3 / 0.5 (high_low itself 10 / 10 / 10; the misses read the
    0.3 s mean v_r just under 3.0 m/s), standing receiver lob 0 / 0 / 0 and high_low found 10 / 10 / 10. Real SportVU (3
    games, team_ends, clean): bigs rates identical before / after this loop (no code or parameter change).'
changes_decisions_oct25:
# Owner decisions of 25 Oct 2026 (Aldemir delegated clear judgment calls). Synthetic counts are seeds 1-10 at sigma_p 0.2 /
# 0.3 / 0.5 (the changes_loop5 scenes); real SportVU = 3 NBA 2015-16 games, 194 chunks, 6855 s, team_ends, sigma told
# 0.15, realdata.py with kinematics, screens, cuts, bigs, composition, before / after event dumps compared (aggregates only).
- id: D2-SLIP-TOUCH-UNKNOWN
  what: 'slip.touch_unknown_high_tier (true): on a screener track in the high-noise tier (shared high_noise_sig_p_m 0.15 m,
    the bigs noise_tier) a failed touch test gives touch = null (unknown) instead of false; a passed test stays true.
    Low-tier tracks are unchanged.'
  why: 'L5-2 measured that at the q 10 tier the minimum smoothed speed of a 0.4 s stop reads 1.5-3.1 m/s (above
    never_set_speed_mps 1.0) and t_rel 0.2-0.4 s early, so false there is no evidence of "no touch" (brush scene True 1
    of 10). Decision (25 Oct): report unknown rather than build a tier-aware touch test before gold labels exist.'
  evidence: 'Synthetic (seeds 1-10): sigma_p 0.2 brush True 10, far False 10; 0.3 brush True 9 / False 1, far False 10
    (unchanged); 0.4 brush True 8 / None 2, far None 10; 0.5 brush None 9 / True 1, far None 10 (before: False on all of
    these). Real SportVU (3 games, 194 chunks, 6855 s, team_ends, clean / noise 0.3 / noise 0.5), before / after event dumps: slip touch False 3 / 1 / 2 -> 3 / 1 / 0 and None 0 / 0 / 2 (True 2 / 1 / 3 unchanged); no other bigs
    event or attribute changes apart from the D3 attrs. Tests test_d2_slip_touch_is_unknown_not_false_at_the_high_tier, test_d2_switch_off_restores_false.'
- id: D3-SHORT-ROLL-STOP
  what: 'short_roll keeps the stop variant (a roller who stops short in the pocket without a catch is a short roll, CTG
    "stops short"); new attr a11_18_catch = (variant == catch) because offense A11.18 SHORT_ROLL requires a catch.'
  why: 'Decision (25 Oct): keep the CTG reading as the label and record the A11.18 difference on every event, so A11.18 /
