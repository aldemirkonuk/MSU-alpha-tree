  - re-screen
  - veer
  - flip
  - second screen
  actors: screener s rel. first and second users
  t0: t0 of the second screen
  rule: |-
    The same screener's next input screen whose set (t_set, else t0) starts <= within_s (2.0 s) after the first
    screen's t_rel. Same user and P_s moved <= rescreen_split_m (1.22 m = CTG 4 ft): same screen, no event. Subtypes:
    veer (second is off_ball), twist (same user, P_s on the other side of x = 0), re_screen (same user), new_user.
    Same user: P(moved > 1.22 m) with sigma = sqrt(sigma_p(t0_a)^2 + sigma_p(t0_b)^2) must be >= rescreen_p_min (0.5)
    and multiplies conf. Timing conf = Phi((within_s - gap) / gap_sigma_s 0.2 s).
