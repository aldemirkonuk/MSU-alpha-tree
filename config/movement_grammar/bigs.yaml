open_questions:
# The short-roll catch, ghost vs slip_to_arc and screens-enum questions were decided on 25 Oct (changes_decisions_oct25 D3).
- T_roll / T_pop travel speeds (2.5 m/s) need fitting on MSU/UConn film; no published NCAA roll-speed distribution found.
- Dwell calibration (split 0.4 s measured, lag 0.1 s) is for sigma_p 0.3; at 0.5 quick/slow is unresolvable in sim.
- Defender-relative outputs (behind_def, seal, 4-on-3) need the matchup model; they use nearest-defender proxies here.
changes_loop1:
- id: B1
  what: roll_and_replace shape window anchored to the roll's completion (first frame r <= rim_r) for shape_len_s 0.4 s;
    shape_from_s / shape_to_s replaced by shape_after_completion_s 0.0 and shape_len_s 0.4.
  why: The fixed [t0 + 1.8, t0 + 2.2] s window came before a normal top roll reached r < 3 m (r 3.7 at t0 + 1.8 s), while
    the roll item itself allows completion up to T_roll.
  evidence: 'Tester harness (10 seeds x 2 sides): recall 0/40 at every sigma before; 40/40, 40/40, 35/40 at sigma_p 0.2 /
    0.3 / 0.5 after, no false positives. Tests test_b1_*.'
- id: B2
  what: seal window distance-scaled, T_seal = clamp(0.5 + (r_s0 - r_max) / 2.5, 1.5, 3.0) s + min_s from the roll onset;
    within_s removed; params t_base_s, travel_mps, t_min_s, t_max_s; pin_shrink_m (0.3) moved to the YAML.
  why: A wing / top roller needs ~2.2-2.3 s to reach the seal band, so the fixed 2.0 s made seals after those screens
    unreachable.
  evidence: 'Recall 0.00 / 0.03 / 0.03 before; 0.93 / 0.82 / 0.62 after (precision 1.00). test_b2_seal_after_wing_roll
    (>= 4 of 5 seeds), test_b2_seal_negative_roll_through.'
- id: B3
  what: roll completion window counted from t_rel; travel_mps 2.0 (was 2.5), t_max_s 3.5 (was 3.0), onset_after_s 1.5 (was
    1.0). roll_into_post window = t_rel + clamp(0.5 + (r_s0 - deep_r) / 2.5, 1.5, 3.0) + min_s (within_s removed).
  why: Anchoring at t0 left 0.5 s for the hold and pivot; held or 2.0-2.5 m/s rolls ran out of window (E16 already anchors
    T_pop to t_rel).
  evidence: 'roll recall 0.72 / 0.70 / 0.62 before; 1.00 / 1.00 / 0.97 after, precision 1.00 (late-drift and early-slip
    negatives still 0/20). roll_into_post recall 0.82 / 0.82 / 0.53 before; 1.00 / 0.97 / 0.72 after. test_b3_*.'
- id: B4
  what: Point and gate tests read at the extremum inside their window (roll min r over [onset, end]; pop_arc / slip_to_arc
    max r and max displacement over [arrival, + point_window_s 0.5]; spain_pop max displacement; roll / slip / crash /
    dive / offensive_rebound_crash best 0.5 s v_r window via gate_conf; pop_mid settled displacement, see B12).
  why: At the first crossing the tested value equals the threshold, so P ~ 0.5 by construction; correct rolls averaged conf
    0.33-0.39 and confidence did not rank events.
  evidence: 'Wing roll conf 1.00 in 5/5 seeds (was 0.33-0.39); wing pop_arc conf >= 0.7 mean. Over all 3,700 emitted
    harness events wrongly fired events now average 0.68 against 0.90 for correct ones (loop 0: 0.75 vs 0.73); precision
    per conf bin <0.3 0.86, 0.3-0.5 0.81, 0.5-0.7 0.91, 0.7-0.9 0.94, >=0.9 0.99. The tester''s strict reliability test
    (|precision - mean conf| < 0.1 per bin) is NOT met below 0.9: low-conf events are still mostly right; calibration needs
    labelled film (open). Tests test_b4_confidence_not_capped, test_b4_conf_ranks_pop_mid_false_positives_below_true_ones.'
- id: B5
  what: short_roll stop (and slip pocket stop) may start by the window end / stop_by_s and run past it for stop_min_s plus
    half the 1.0 s speed support.
  why: The slow-in-band condition was cut at t0 + 2.0 s, so a side pick-and-roll stop first seen at t0 + 1.8-1.9 s could not
    last 0.3 s; the YAML only bounds the START of the stop.
  evidence: 'short_roll recall 0.78 / 0.72 / 0.68 before; 1.00 / 1.00 / 0.95 after; screener_post_action side short-roll
    label errors 45-55% before, 0/20 after. test_b5_side_short_roll_stop.'
- id: B6
  what: roll drop test = min r over [t0, completion + dr_eval_after_s 0.3] - r_s0 <= -min(dr_min_m, r_s0 - rim_r);
    dr_floor_r removed.
  why: With completion at the first r <= 2.5 frame, screens at r_s0 < 4.5 could never show a 2.0 m drop.
  evidence: 'Elbow roll (r_s0 4.8) 5/5 seeds at sigma 0.3 and >= 4/5 at 0.5 (loop 0: 0.75 at 0.5). test_b6_elbow_roll.'
- id: B7
  what: ghost 'out' exit passes on the 0.5 s mean outward speed OR the separation speed from h (-closing speed) >= out_mps,
    then pop_arc_zone with >= 1.5 m displacement.
  why: A fade along the arc is mostly lateral; its outward v_r is ~1.0 m/s or less.
  evidence: 'Tester scenario ghost_at_handler_defender_then_wing_three: the exit now passes in 20/20 runs per sigma (separation
    3.2-4.1 m/s). Its recall stays 0.15-0.25 because the scenario reverses 150 deg at a constant 3 m/s at the closest approach:
    the smoothed minimum speed there is 0.76 m/s (a real 0.2 s stop reads 0.64), so the never-set gate rejects it in 14-17 of
    20 runs; not changed (physically a player must decelerate to reverse 150 deg; loosening never_set would merge ghosts with
    slips). New test test_b7_ghost_out_along_the_arc uses a 60 deg turn whose outward v_r is 0.3-0.8 m/s.'
- id: B8
  what: behind_def gates on the lead along the roller's rim direction, (D_s - s) . (x_s, y_s) / r_s (= r(D_s) - r(s) to
    first order); CTG y lead stored as ctg_y_lead_m.
  why: The y-only test cannot see a baseline roll where the defender trails laterally.
  evidence: 'Baseline-roll scenario 0/60 before, 60/60 after. The tester''s fix text writes u = -(x_s, y_s) / r_s, which
    points toward the rim and would flip the sign; the implemented u points away from the rim (a defender farther from
    the rim has positive lead). Tester negative wing_defender_runs_level_0p3m_ahead_in_y now fires 20/20 by design: its
    true radial lead is 0.86 m for the whole roll (>= 0.76), so under the radial definition the tester asked for it is
    a positive. test_b8_behind_def_baseline_roll.'
- id: B9
  what: short_roll catch variant needs a deceleration (1.0 s-support speed < 1.5 m/s in [catch - 0.3, catch + 0.5] s) or no
    holder frame at r <= 2.5 within catch_after_s (1.0 s).
  why: A full roll caught in stride at the free-throw line was a short roll with conf 1.0.
  evidence: 'short_roll_playmaking negative NEG_catch_at_rim_r1p5_full_roll 20/20 false positives before, 0/20 after;
    pocket-catch positives unchanged. test_b9_catch_in_stride_is_not_short_roll.'
- id: B10
  what: A stationary run can only START on a frame with edge >= stat_min_edge_frames (5), K_CAL*sqrt(var_v) <= stat_sigv_rel
    (1.25) x the track median, and CA-RTS speed < stat_enter_speed_mps (1.0). Every detector drops conf 0.0 events
    (_nonzero; unknown_post_action kept).
  why: In smoother warm-up var_v is huge so s2 called the first frames stationary and the stay test carried a 3 m/s
    approach into the run (t_set = 0, conf 0 events).
  evidence: 'The tester''s absolute cap 0.35 m/s was not adopted: measured K_CAL*sqrt(var_v) mid-segment is 0.33 / 0.40 /
    0.40 m/s (p99 0.35 / 0.43 / 0.43) at sigma_p 0.2 / 0.3 / 0.5, so 0.35 would disable stationarity everywhere at 0.3
    and 0.5; the relative gate plus the speed condition fixes the warm-up run (seed 1002: run (0, 63) before). The precision
    gate alone did not help: at sigma 0.5 the approach reads 1.1-1.7 m/s with s2 < 9.21, hence the speed condition.
    screener_set_state recall 1.00 / 0.95 / 0.63 before, 1.00 / 0.97 / 0.90 after. Tests test_b10_*.'
- id: B11
  what: screener_post_action label = argmax of the renormalised probabilities over fired labels; PRECEDENCE breaks ties
    within precedence_margin (0.15); ghost outranks slip only with p_never_set >= ghost_never_set_min (0.5); a ghost 'in'
    does not compete with a fired slip (slip_type ghost_in carries it); precedence winner stored as precedence_label.
  why: First-by-precedence picked low-probability labels; quick slips whose 0.2 s stop is invisible in the smoothed speed
    (min speed 1.02-1.63 m/s, p_never_set 0.53-0.98) were labelled ghost, so the p_never_set rule alone could not fix them.
  evidence: 'Label top-1 errors over the six label scenarios: 22 / 24 / 27 of 120 before, 1 / 3 / 7 after (slip read as ghost
    25-45% -> 0; side short roll read as none 45-55% -> 0). test_b11_label_is_argmax.'
- id: B12
  what: P_s = mean smoothed position over the set run within +-ps_half_s (0.5 s) of t0 (single frame only for never_set /
    touch sets); move_to_screen same-user re-screens need P(moved > 1.22 m) >= rescreen_p_min (0.5), multiplied into conf;
    pop_mid confirms displacement and dr on the mean over [stop, + settle_s 0.5 s].
  why: One AR-noisy frame moved P_s by 0.3-0.6 m (E8).
  evidence: 'move_to_screen same-user 0.8 m negative: 0 false positives (was conf 1.0 events). pop_mid lateral 1.22 m slide
    false positives 5/20 and 8/20 before, 5/20 and 7/20 after: P_s still carries 0.2-0.7 m of correlated (AR 0.9) tracker
    bias and the settled displacement reads 1.5-1.7 m, which needs the free_throw_calibration bias model (open). The false
    events now carry conf 0.5-0.7 against 0.9-1.0 for true mid pops. test_b12_*.'
- id: B13
  what: seal_intervals walks the onset back over candidate frames (held, in region, defender within seal_def_m +
    seal_slack_m), merges touching intervals and applies min_s after; post_seal conf x strict-frame fraction x window mean
    P(r < r_max); roll_into_post conf x strict-frame fraction; three_sec_s param.
  why: Unknown-angle frames could only bridge, so onsets were late and short pieces dropped; conf overstated precision.
  evidence: 'post_seal 0.95/1.00, 0.95/0.93, 0.67/0.55 (P/R) before; 1.00/1.00, 0.90/0.93, 0.71/0.68 after. Remaining
    sigma 0.5 misses are measurement limits (post r reads 3.5-3.7 vs r_max 3.5, true 3.12; pair distance reads 1.4-1.6 vs
    1.2, true 0.89). test_b13_seal_intervals_unit.'
- id: B14
  what: id_swap_risk enter run (d < 0.6, gaps <= bridge_frames 2) must have window mean P(d < 0.6) >= enter_p_min (0.5);
    min_s kept at 0.1 s.
  why: Tester proposed min_s 0.3 s plus the probability gate against a 0.8 m standoff.
  evidence: 'min_s 0.3 NOT adopted: lane crossings (the tester''s own positive paths_cross_in_lane) have enter runs of
    0.07-0.17 s and fell to recall 0/60. The 0.8 m standoff negative is read under 0.6 m for up to 1.7-1.9 s with mean
    P(d < 0.6) 0.78-0.88, the same range as the 0.45 m bodying positive (0.33-1.57 s, 0.54-0.94): no duration or probability
    gate separates them, and since this item flags tracker identity risk from measured positions, firing there is
