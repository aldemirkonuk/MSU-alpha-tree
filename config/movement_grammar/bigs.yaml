    or 0. A roll that ends in a seal also matches seal; precedence picks seal.
  conflicts_resolved:
  - 'ROLL radial velocity vs distance, resolved by V0 sim (20 seeds per cell; screens at r_s0 5.5 / 7.0 / 8.5; mean roll speed
    2.0-3.5 m/s; negatives: hold then late drift at 1.2 m/s, pop then drift): recall at sigma_p 0.3 / 0.5 = distance only,
    2.0 s (motion_starts) 0.58 / 0.56; A11.18 per-frame v_r held 0.5 s + r < 2.5 in 2.0 s 0.57 / 0.55; this rule 0.76 / 0.77;
    false positives 0 for all three. The gain is the distance-scaled window: at r_s0 8.5 and 2.5-3.0 m/s the fixed 2.0 s rules
    score 0.00 and this rule 0.95-1.00. Both tests are kept: the v_r onset gate separates a roll from a late drift, the distance
    test defines completion.'
  - 'E4: the per-frame ''held for 0.5 s'' gate is replaced by a window mean (same false-positive rate in sim, better recall).'
  - 'T_roll travel 3.0 m/s (research) lowered to 2.5 m/s: at 3.0 the r_s0 7.0 / 2.5 m/s cell scored 0.15-0.35, at 2.5 it scores
    1.00 with no new false positives. Rolls at a 2.0 m/s mean are not labelled roll by any rule (slow drift).'
  - CTG 14 ft (4.27 m) kept only as ctg_roll_compat because it overlaps our pocket band.
  - 'Loop 1 (B3): the window is counted from t_rel with travel 2.0 m/s and t_max 3.5 s (onset gate up to t0 + 1.5 s). From t0
    with 2.5 m/s the tester measured 0/60 wing rolls at 2.2 m/s and 10-15% misses of 3.0 m/s rolls held 0.6 s; after the change
