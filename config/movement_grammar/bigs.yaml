family: bigs
version: 0.3.2
date: '2026-10-25'
owner: Mac session
status: proposal under the build freeze; numbers are V0-sim-checked proposals until fitted on R-ST-10 labels
scope: screener actions after a screen (roll, short roll, pop mid, pop arc, slip, slip to arc, ghost, replace, seal, crash,
  move to screen, roll into post) and big-man actions (post seal, duck-in, dive, rim run, dunker relocation, high-low, short-roll
  playmaking, post-up, offensive-rebound crash)
frame: named_spots attacked-rim frame, metres, seconds, 29.97 fps (DT = 1001/30000 s); mvlib v_r is positive toward the rim
implementation: tools/specgen/movement/detectors/bigs.py (reads every param from this file); tests tests/movement/test_bigs.py
input_contract:
  screen: |-
    mvlib.Event(kind='screen', actors={'screener': id, 'user': id, optional 'screener_defender': id, 'user_defender': id}, t0=<frame of the minimum smoothed screener-user distance (McQueen 2014, A3, R-ST-20)>, start, end, conf=<the screen's own probability>, attrs={'screen_class': 'ball' | 'dho' | 'off_ball', optional 'screen_type' ('ghost', 'spain', ...), optional 't_set'}). user = handler (ball), receiver (dho), cutter (off_ball). The screens family (or a hand label) produces it; this module never imports screens code.
  fga: 'mvlib.Event(kind=''fga'', actors={''shooter'': id}, t0=<release frame>); optional, else the ball-XY proxy'
  possession_change: mvlib.Event(kind='possession_change', t0=<frame>); optional, for rim_run t0
  bigs: optional list of player ids treated as bigs (dive, rim_run, offensive_rebound_crash)
  v_peak: 'optional {player id: m/s}, p95 of the 1 s-mean speed over >= 3 games (rim_run)'
confidence_model: conf = product of the item's test probabilities (window_conf of a per-frame Phi(margin / sigma) for per-frame
  conditions, Phi(margin / sigma) for point tests; sigma from the smoother covariance x K_CAL) x edge_factor(t0) x gap_factor(window)
  (MP-16) x the input screen's conf when there is one. Point and gate tests are read at the extremum inside their window
  (minimum r, maximum r / displacement, best v_r gate window), never at the first frame that crosses the threshold, where
  P sits at ~0.5 by construction. A detector never emits an event with conf 0.0 (except screener_post_action's
  'unknown_post_action'). Loop 1.
sign_conventions: v_r > 0 toward the rim; outward speed = -v_r; theta = atan2(y, x) deg; m = atan2(y, |x|)
shared_params:
  s2_enter: {value: 5.99, unit: chi2_2dof}
  s2_stay: {value: 9.21, unit: chi2_2dof}
  stat_bridge_frames: {value: 6, unit: frames}
  support_long_s: {value: 1.0, unit: s}
  gate_window_s: {value: 0.5, unit: s}
  never_set_speed_mps: {value: 1.0, unit: m/s}
  rim_r: {value: 2.5, unit: m}
  ra_r: {value: 1.27, unit: m}
  arc_r: {value: 6.6, unit: m}
  fga_rim_r: {value: 0.6, unit: m}
  fga_max_flight_s: {value: 2.5, unit: s}
  timing_sigma_s: {value: 0.1, unit: s}
  holder_min_run_s: {value: 0.2, unit: s}
  merge_gap_s: {value: 0.5, unit: s}
  merge_shift_m: {value: 0.8, unit: m}
  stat_sigv_rel: {value: 1.25, unit: '1'}
  stat_min_edge_frames: {value: 5, unit: frames}
  stat_enter_speed_mps: {value: 1.0, unit: m/s}
  # Loop 2 noise tier: a track is 'high' noise when the median smoothed position sigma K_CAL*sqrt(var_p) >= this
  # (sim 0.088 / 0.124 / 0.16 / 0.18 m at sigma_p 0.2 / 0.3 / 0.4 / 0.5). A param named <name>_low / <name>_high is
  # read for the track's tier (bigs.tiered).
  high_noise_sig_p_m: {value: 0.15, unit: m}
  # L4-1: the screens family writes the screen class as attrs 'kind' (on_ball / off_ball / handoff), not
  # 'screen_class'; bigs.screen_class maps it (an event with neither is read as a ball screen, as before).
  screen_kind_map: {value: {on_ball: ball, off_ball: off_ball, handoff: dho}, unit: enum}
items:
- id: smoothing_input
  level: rule
  name: Smoothing and feature input (shared by every rule in this family)
  aliases:
  - P-SMOOTH
  - kinematics input
  actors: every tracked player and the ball
  t0: n/a (per frame)
  rule: |-
    Every quantity is read from mvlib (MP rules): CA Kalman + RTS per segment (q = 30 m^2/s^5, 10 when median
    sigma_p >= 0.45 m), Kin features with validity gates (speed, sigma_speed, heading, accel_along, turn_rate, curvature,
    r, v_r, stationary_s2), MP-05 gap classes and MP-06 edge warm-up. No gate in this family uses a raw finite
    difference. v_r follows mvlib: POSITIVE TOWARD THE RIM (the research text writes dr/dt, negative toward the rim);
    every number below is in the mvlib sign. Speed and v_r gates are window means over gate_window_s (0.5 s, 16 frames)
    of the smoothed value (E4 fix), never 'every frame of the window'. Decisions are never taken on interp_long or
    'none' frames (gap_factor 0).
  params: {}
  min_duration_s: null
  outputs: x, y, vx, vy, speed, v_r, stationary_s2, var_p, var_v, state, edge (mvlib.Kin)
  confidence: conf = product of the item's test probabilities (window_conf of a per-frame Phi(margin / sigma) for per-frame
    conditions, Phi(margin / sigma) for point tests; sigma from the smoother covariance x K_CAL) x edge_factor(t0) x gap_factor(window)
    (MP-16) x the input screen's conf when there is one.
  noise: 'E3 corrected: at sigma_p 0.5 the 1.5 m/s roll gate is ~1.7 sigma and the 2.0 m/s slip gate ~2.2 sigma of a 0.5 s
    local-linear velocity (sigma_v 0.90); the CA-RTS window mean is tighter (sim recall below), but confidence is lower there
    and is reported, not hidden.'
  conflicts_resolved:
  - Research P-SMOOTH note claimed 2.8 / 3.7 sigma at sigma_p 0.5; those are the sigma_p 0.3 ratios (E3). Corrected here.
  sources:
  - url: file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/tools/specgen/movement/mvlib.py
    supports: CA-RTS smoother, Kin features, hysteresis, window_conf, edge_factor, gap_factor
  status: canonical
  detector: null
- id: stationary_state
  level: rule
  name: Shared stationary (held-position) state
  aliases:
  - P-STATIONARY
  - stand
  - set
  - held
  actors: any player (consumed for screeners, seals, posts)
  t0: run onset frame
  rule: |-
    STATIONARY when mvlib stationary_s2 < s2_enter (5.99 = chi-square 2 dof 95%); a run continues while s2 < s2_stay
    (9.21, 99%) with gaps of <= stat_bridge_frames (6) bridged. A run can only START on a frame with a precise velocity
    estimate (edge >= stat_min_edge_frames 5 and K_CAL*sqrt(var_v) <= stat_sigv_rel 1.25 x the track median) whose
    CA-RTS speed is < stat_enter_speed_mps (1.0 m/s): in smoother warm-up var_v is huge and s2 alone called every
    segment start stationary (loop-1 B10). Runs at the same spot are merged when the gap is
    <= merge_gap_s (0.5 s) and the mean positions differ by < merge_shift_m (0.8 m): correlated (AR) tracker noise
    breaks a held screen into pieces. Per-frame probability P(stationary) = Phi((5.99 - s2) / 2). Raw speed is never
    compared with 0.3 / 0.5 / 0.6 m/s: the CA-RTS speed of a truly stationary player is biased upward (Rayleigh).
  params: {}
  min_duration_s: 0.0
  outputs: mask, runs (a, b), merged runs, p_stationary
  confidence: conf = product of the item's test probabilities (window_conf of a per-frame Phi(margin / sigma) for per-frame
    conditions, Phi(margin / sigma) for point tests; sigma from the smoother covariance x K_CAL) x edge_factor(t0) x gap_factor(window)
    (MP-16) x the input screen's conf when there is one.
  noise: 'V0 sim, 200 seeds, stationary player: P(s2 < 5.99) = 0.991 / 0.984 / 0.958 and P(s2 > 9.21) = 0.0014 / 0.0020 /
    0.0079 per frame at sigma_p 0.2 / 0.3 / 0.5, while the mean CA-RTS speed at rest is 0.34 / 0.45 / 0.50 m/s (p95 0.67 /
    0.87 / 0.98). A raw ''speed < 0.3'' rule fails at every noise level; ''speed < 0.6'' flickers at sigma 0.5 (E1). The s2
    test does not.'
  conflicts_resolved:
  - 'E1 (stationary flicker at 0.5 s support): replaced by the chi-square statistic, which is normalised by the smoother''s
    own velocity covariance; enter 0.6 / exit 1.0 m/s and still_strict 0.3 m/s are superseded for this family.'
  - 'Moving-screen candidate (fouls.yaml > 0.5 m/s at contact): reported by screener_set_state as min CA-RTS speed >= 1.0
    with dwell < 0.2 s, because 0.5 m/s is inside the at-rest speed distribution.'
  sources:
  - url: file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/tools/specgen/movement/mvlib.py
    supports: stationary_s2 (MP-09), hysteresis (MP-10)
  - url: file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml
    supports: temporal hysteresis and slow_speed 1.0 m/s
  status: proposal
  detector: null
- id: screen_frame
  level: primitive
  name: Screen reference frame of a screener's post-action (input contract)
  aliases:
  - P-SCREEN-FRAME
  - screen moment frame
  actors: screener s, user u (handler h for a ball screen, receiver for a DHO, cutter for off-ball)
  t0: t0 = screen moment = frame of minimum smoothed screener-user distance, supplied by the input screen event
  rule: |-
    INPUT: mvlib.Event kind 'screen' (see input_contract). From it:
    - t_set / set_end: the merged stationary run that contains t0, ends <= set_before_s (0.5 s) before it or starts
      <= set_after_s (0.3 s) after it; dwell_s = (set_end - t_set) * DT.
    - never_set: no such run AND the minimum CA-RTS speed in t0 +- never_set_half_s (0.5 s) >= never_set_speed_mps
      (1.0 m/s). p_never_set = Phi((min_speed - 1.0) / never_set_sigma_mps (0.31)). Without a run but with a slower
      minimum, t_set = set_end = the speed minimum (touch set).
    - P_s: mean smoothed position of s over the set run within +-ps_half_s (0.5 s) of t0 (of set_end when the
      screener left before t0, a slip); a single frame at the speed minimum in [t0 - 1.0, t0 + 0.3] s when never_set
      or for a touch set. r_s0 = r(P_s).
    - t_rel: set_end + 1 - release_lag_s (0.1 s, the sim run-end lag), provided s later gets >= release_disp_m (0.5 m)
      from P_s inside the window; never_set: the speed minimum; otherwise held (null).
    - t_use: ball/off-ball: first frame >= t0 - use_before_s (1.0 s) with (u - P_s) . u_hat >= 0 and |u - P_s| <=
      use_radius_m (2.0 m), u_hat = u's mean heading over [t0 - 1.0, t0 - 0.2] s (needs >= 1.0 m/s); DHO: first frame
      the debounced holder is u. Fallback (handler stopped / rejected): t0 + use_fallback_s (0.2 s), flagged.
    - release_timing (axis A): never_set | early (t_use - t_rel > early_margin_s: 0.1 s low tier, 0.15 s high tier) |
      post_use | held.
      p_early = Phi(margin / timing_sigma_s (0.1 s)). p_slow (slow vs quick slip) = Phi((dwell - 0.4) / 0.13).
    - first_move (axis B): direction of s - P_s when s first reaches first_move_m (1.0 m) from P_s after t_rel:
      c = (r - r_s0) / |s - P_s|; rimward c <= -0.5, outward c >= +0.5, else lateral; hold if never 1.0 m.
    - window W = [t_rel, t0 + window_cap_s (3.0 s)] (a proposal; CTG's 3 s bounds its screen search, not the post-action).
    - D_s / D_h: event actors, else the nearest defender over [t0 - defender_window_s (0.5), t0] s. drag flag: s's mean -vy over
      [t0 - 2.0, t0 - 0.5] s >= 3.0 m/s (transition trailer screen).
  params:
    set_before_s: {value: 0.5, unit: s}
    set_after_s: {value: 0.3, unit: s}
    never_set_half_s: {value: 0.5, unit: s}
    window_cap_s: {value: 3.0, unit: s}
    release_lag_s: {value: 0.1, unit: s}
    never_set_sigma_mps: {value: 0.31, unit: m/s}
    never_rel_before_s: {value: 1.0, unit: s}
    never_rel_after_s: {value: 0.3, unit: s}
    release_disp_m: {value: 0.5, unit: m}
    use_before_s: {value: 1.0, unit: s}
    heading_from_s: {value: 1.0, unit: s}
    heading_to_s: {value: 0.2, unit: s}
    use_min_speed_mps: {value: 1.0, unit: m/s}
    use_radius_m: {value: 2.0, unit: m}
    use_fallback_s: {value: 0.2, unit: s}
    early_margin_s_low: {value: 0.1, unit: s}
    early_margin_s_high: {value: 0.15, unit: s}
    slow_dwell_split_s: {value: 0.4, unit: s}
    dwell_sigma_s: {value: 0.13, unit: s}
    first_move_m: {value: 1.0, unit: m}
    first_move_cos: {value: 0.5, unit: '1'}
    drag_from_s: {value: 2.0, unit: s}
    drag_to_s: {value: 0.5, unit: s}
    drag_speed_mps: {value: 3.0, unit: m/s}
    ps_half_s: {value: 0.5, unit: s}
    defender_window_s: {value: 0.5, unit: s}
  min_duration_s: null
  outputs: screen_t0, P_s, r_s0, t_set, dwell_s, t_rel, t_use, use_fallback, release_timing, early, p_early, p_slow, p_never_set,
    min_speed, first_move, drag, screener_defender, user_defender
  confidence: conf = product of the item's test probabilities (window_conf of a per-frame Phi(margin / sigma) for per-frame
    conditions, Phi(margin / sigma) for point tests; sigma from the smoother covariance x K_CAL) x edge_factor(t0) x gap_factor(window)
    (MP-16) x the input screen's conf when there is one.
  noise: 'V0 sim (sim.scenario, 60 seeds per cell; approach 2.3 m in 1.0 s, true hold D, rimward exit): measured stationary-run
    dwell = D + 0.1 s at sigma_p 0.3 (sd 0.12-0.14 s; D 0.2 -> 0.30, D 0.3 -> 0.42, D 0.5 -> 0.62); at sigma_p 0.5 dwell is
    under-read (D 0.3 -> 0.15, D 0.5 -> 0.44). Minimum CA-RTS speed: pass-through 2.35 +- 0.24 m/s, stop-and-go (D = 0) 1.35
    +- 0.31, D 0.2 0.64 +- 0.31. Run-end lag after the true departure 0.13 s (sigma 0.3), 0.01 s (sigma 0.5). Quick vs slow
    is therefore a probability with the split at measured 0.4 s (true 0.3 s) and is unresolvable at sigma_p >= 0.45 (report
    p_slow but do not branch on it there). If t0 falls on interp_long frames the frame is built but every post-action gets
    gap_factor 0 (camera_cut_policy).'
  conflicts_resolved:
  - 'Screen timestamp: CTG''s ''frame the screen is set'' is stored as t_set; t0 is McQueen et al. 2014 / repo A3 / R-ST-20
    minimum distance.'
  - '''Within 1.0 s of the handler passing'' (A11.18) vs ''after t0'' (motion_starts): everything is anchored to t0 with t_use
    stored separately.'
  - 'E2 (dwell not resolvable at 0.1 s): never_set uses the minimum CA-RTS speed (sim separates pass-through 2.35 m/s from
    a 0.2 s stop 0.64 m/s); quick/slow is a probability, not a branch.'
  - Off-ball screens and DHOs use the same frame (missing items 'DHO post-actions' and 'off-ball screens by bigs'); for a
    DHO t_use = the handoff frame.
  sources:
  - url: https://cdn.prod.website-files.com/68d6be744d7efccc2207f571/68d6be744d7efccc2208061f_2014_SSAC_Recognizing-on-Ball-Screens.pdf
    supports: screen moment = minimum handler-screener distance; screener within 10 ft and <= 2 ft farther from the basket
  - url: https://docs.cleaningtheglass.com/pro/data-sets/ball-screens
    supports: screening frame, 3 s screen window, roller-behind test, re-screen split
  - url: file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md
    supports: A3 t0 = minimum handler-screener distance, P_s
  - url: file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/schema/tables/screens.yaml
    supports: screener_action_after enum (line 608)
  status: canonical
  detector: detect_screen_frame
- id: screener_set_state
  level: primitive
  name: Screener's set at the screen
  aliases:
  - set screen
  - screen set
  - quick/slow set
  actors: screener s
  t0: t_set (onset of the set run)
  rule: |-
    For each input screen that is not never_set: emit 'screen_set' over [t_set, set_end] with dwell_s and p_slow.
    A touch set (no stationary run, speed minimum < 1.0 m/s) is emitted at the speed minimum with
    conf = P(min speed < 1.0) with never_set_sigma_mps read from screen_frame. moving_screen_candidate: minimum CA-RTS speed >= moving_screen_mps (1.0) and dwell <
    moving_screen_dwell_s (0.2 s).
  params:
    moving_screen_mps: {value: 1.0, unit: m/s}
    moving_screen_dwell_s: {value: 0.2, unit: s}
  min_duration_s: 0.0
  outputs: dwell_s, p_slow, touch_set, moving_screen_candidate
  confidence: conf = product of the item's test probabilities (window_conf of a per-frame Phi(margin / sigma) for per-frame
    conditions, Phi(margin / sigma) for point tests; sigma from the smoother covariance x K_CAL) x edge_factor(t0) x gap_factor(window)
    (MP-16) x the input screen's conf when there is one.
  noise: Set onset fires when the decelerating screener's speed drops below ~1 m/s (s2 < 5.99 at sigma 0.3), ~0.1 s before
    the true stop; V0 t0 error within +-0.3 s in 30/30 seeds.
  conflicts_resolved:
  - Consumes the SCREEN family's set; does not decide screen validity (conflict C7 belongs to the screens family).
  sources:
  - url: file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/tools/specgen/movement/mvlib.py
    supports: stationary_s2
  - url: https://docs.cleaningtheglass.com/pro/data-sets/ball-screens
    supports: quick vs slow slip by whether the screener set
  status: proposal
  detector: detect_screener_set_state
- id: behind_def
  level: primitive
  name: Roller behind his screener's defender
  aliases:
  - F-BEHIND-DEF
  - got behind
  - rim advantage
  - did_roller_get_behind_screener_defender
  actors: roller s rel. screener defender D_s
  t0: t_rel
  rule: |-
    behind(t): lead = (D_s - s) . u >= behind_m (0.76 m = CTG 2.5 ft), u = (x_s, y_s) / r_s the unit vector from the
    rim through the roller (lead = r(D_s) - r(s) to first order), while the 0.5 s centred mean v_r of s >= rimward_mps
    (1.0 m/s); evaluated over [t_rel, end of W]. Emitted when it holds for >= min_s (0.2 s). CTG compatibility: the
    y-axis lead y(D_s) - y(s) is stored as ctg_y_lead_m, and ctg_behind is the y-axis test bounded by the end of the
    handler's holder run containing t0 (CTG: before the handler's touch ends).
  params:
    behind_m: {value: 0.76, unit: m}
    rimward_mps: {value: 1.0, unit: m/s}
    min_s: {value: 0.2, unit: s}
  min_duration_s: 0.2
  outputs: first_behind_frame, max_lead_m, radial_lead_m (r(D_s) - r(s) at the end), ctg_y_lead_m, ctg_behind, handler_touch_end,
    frame attrs
  confidence: conf = product of the item's test probabilities (window_conf of a per-frame Phi(margin / sigma) for per-frame
    conditions, Phi(margin / sigma) for point tests; sigma from the smoother covariance x K_CAL) x edge_factor(t0) x gap_factor(window)
    (MP-16) x the input screen's conf when there is one.
  noise: Pair y-difference sigma = sqrt(sigma_p(s)^2 + sigma_p(D_s)^2) from var_p; correlated tracker bias is the real limit
    (E8) and is calibrated with free_throw_calibration. Needs D_s (matchup); without defenders it emits nothing.
  conflicts_resolved:
  - CTG uses its x axis toward the baseline; mapped to our y. The radial version is stored for wing rolls.
  - 'E15: CTG bounds the test by the end of the handler''s touch; we evaluate to the end of W and store radial_lead_m; a CTG-compatible
    value is the subset before the handler''s last holder frame.'
  sources:
  - url: https://docs.cleaningtheglass.com/pro/data-sets/ball-screens
    supports: 'did_roller_get_behind_screener_defender: > 2.5 ft closer to the baseline'
  status: proposal
  detector: detect_behind_def
- id: post_seal
  level: primitive
  name: Post seal (positional seal by a big)
  aliases:
  - P-POST-SEAL
  - seal
  - post seal
  - deep seal
  - pin
  actors: post player o rel. nearest defender d and the ball
  t0: seal onset (first frame the held state and the geometry are met, walked back over 1-sigma slack frames)
  rule: |-
    o is not the holder, inside named_spots post_area with r <= r_max (3.5 m; 3.8 m high tier), in the held (merged
    stationary) state, nearest defender d at seal_def_min_m (0.4) .. seal_def_m (1.2 m; 1.5 m high tier), and phi = angle at o between o->d and o->ball
    > phi_partial_deg (90). Frames with d closer than 0.4 m (angle undefined) bridge but cannot start a seal; the
    onset is walked back <= walk_back_s (1.0 s) over candidate frames (held, in the region, d within seal_def_m +
    seal_slack_m 0.4 m), intervals closer than seal_merge_gap_s (0.5 s) merge, and only then is min_s (0.8 s) applied (unknown-angle frames
    count toward it). conf also carries the fraction of strict frames and the window mean of P(r < r_max). seal_type behind if mean phi > 135, else partial. Ball position = ball XY, else the
    holder (ball above heads). Flags deep_seal (named_spots deep_seal at onset), three_second_risk (> 3 s inside
    three_second_lane, > three_sec_s 3.0).
  params:
    r_max_low: {value: 3.5, unit: m}
    r_max_high: {value: 3.8, unit: m}
    min_s: {value: 0.8, unit: s}
    seal_def_m_low: {value: 1.2, unit: m}
    seal_def_m_high: {value: 1.5, unit: m}
    seal_def_min_m: {value: 0.4, unit: m}
    seal_slack_m: {value: 0.4, unit: m}
    walk_back_s: {value: 1.0, unit: s}
    seal_merge_gap_s: {value: 0.5, unit: s}
    phi_partial_deg: {value: 90, unit: deg}
    phi_behind_deg: {value: 135, unit: deg}
    phi_sigma_deg: {value: 20, unit: deg}
    three_sec_s: {value: 3.0, unit: s}
  min_duration_s: 0.8
  outputs: seal_type, phi_mean_deg, r, strict_frac, deep_seal, three_second_risk
  confidence: conf = product of the item's test probabilities (window_conf of a per-frame Phi(margin / sigma) for per-frame
    conditions, Phi(margin / sigma) for point tests; sigma from the smoother covariance x K_CAL) x edge_factor(t0) x gap_factor(window)
    (MP-16) x the input screen's conf when there is one.
  noise: 'V0: with the defender truly 0.8 m away, AR tracker noise reads 0.24-0.4 m for long stretches (sigma_p 0.3), which
    is why near frames bridge instead of breaking the seal. Lob seal (fronted, weak side empty) is not emitted here: it needs
    reliable fronting geometry and the LOB family.'
  conflicts_resolved:
  - 'SEAL r < 2.5 (motion_starts) vs zone block 1.8-3.5 (A1): r <= 3.5 inside post_area, because named_spots low_post reaches
    r 3.26.'
  sources:
  - url: file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/config/named_spots.yaml
    supports: post_area, post_* geometry (1.2 m), deep_seal, three_second_lane
  - url: file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/motion_starts.md
