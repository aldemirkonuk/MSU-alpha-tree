- id: ghost
  level: action
  name: Ghost screen (fake screen, never set)
  aliases:
  - A-GHOST
  - ghost
  - fake screen
  - ghost out
  - ghost slip
  - ghost flare
  actors: screener s rel. holder h and h's defender D_h
  t0: t_closest = local minimum of smoothed |s - h|
  rule: |-
    No screen event needed. h is the debounced holder for >= hold_frac (80%) of t_closest +- 0.5 s. Approach: |s - h|
    <= approach_h_m (2.0; 2.5 high tier) or |s - D_h| <= approach_dh_m (1.5; 1.8 high tier) at t_closest; mean
    closing speed over the 0.5 s before >= closing_mps (1.5; 1.0 high tier); r(s) <= r(h) + 0.61 m (McQueen geometry). Never
    set: no run of CA-RTS speed < never_set_speed_mps (1.0 m/s) longer than never_set_slow_frames (4 low / 2 high tier)
    touches t_closest +- 0.5 s (never_set_half_s read from screen_frame; a run is counted with its full length). Exit within 1.5 s: in =
    0.5 s window mean v_r >= 2.0 starting >= in_lead_s (0.2 s) before t_closest, then r <= 3.0 within 2.0 s; out =
    moves away from h to the arc: 0.5 s mean outward speed (-v_r) OR separation speed from h (-closing speed) >= 1.0
    m/s, then pop_arc_zone with >= 1.5 m displacement within 2.0 s; mid = stop (< 1.5 m/s) in pop_mid_zone. D_h =
    nearest defender of h over the dh_window_s (0.17 s) before t_closest. One event per (s, h) per 2.0 s.
    L4-3: half court only (neither h nor s in named_spots backcourt at t_closest), and the screener's own velocity
    component toward h supplies >= screener_share_min (0.5) of that mean closing speed (a handler driving past a standing
    or drifting teammate closes the gap too).
    L4-8: the path turns near t_closest: for some u within +-turn_search_s (0.3 s) of t_closest the heading of the
    displacement over [u - turn_pre_s (0.5 s), u] and over [u, u + turn_post_s (0.7 s)] differs by >= turn_min_deg
    (20 deg). A run straight past the handler is a cut or a transition run, not a fake set.
  params:
    hold_frac: {value: 0.8, unit: '1'}
    screener_share_min: {value: 0.5, unit: '1'}
    turn_pre_s: {value: 0.5, unit: s, note: 'L4-8'}
    turn_post_s: {value: 0.7, unit: s, note: 'L4-8'}
    turn_search_s: {value: 0.3, unit: s, note: 'L4-8'}
    turn_min_deg: {value: 20.0, unit: deg, note: 'L4-8'}
    approach_h_m_low: {value: 2.0, unit: m}
    approach_h_m_high: {value: 2.5, unit: m}
    approach_dh_m_low: {value: 1.5, unit: m}
    approach_dh_m_high: {value: 1.8, unit: m}
    approach_s: {value: 0.5, unit: s}
    closing_mps_low: {value: 1.5, unit: m/s}
    closing_mps_high: {value: 1.0, unit: m/s}
    farther_m: {value: 0.61, unit: m}
    exit_s: {value: 1.5, unit: s}
    arrive_s: {value: 2.0, unit: s}
    in_v_r_mps: {value: 2.0, unit: m/s}
    in_r: {value: 3.0, unit: m}
    out_mps: {value: 1.0, unit: m/s}
    disp_m: {value: 1.5, unit: m}
    stop_speed_mps: {value: 1.5, unit: m/s}
    dedupe_s: {value: 2.0, unit: s}
    in_lead_s: {value: 0.2, unit: s}
    dh_window_s: {value: 0.17, unit: s}
    never_set_slow_frames_low: {value: 4, unit: frames}
    never_set_slow_frames_high: {value: 2, unit: frames}
    never_set_slow_sigma_frames: {value: 1.5, unit: frames}
  min_duration_s: 1.0
  outputs: subtype (in/out/mid), d_min_to_h, d_min_to_Dh, min_speed, arrival_frame
  confidence: conf = product of the item's test probabilities (window_conf of a per-frame Phi(margin / sigma) for per-frame
    conditions, Phi(margin / sigma) for point tests; sigma from the smoother covariance x K_CAL) x edge_factor(t0) x gap_factor(window)
    (MP-16) x the input screen's conf when there is one.
  noise: Minimum speed is Rayleigh-biased upward at rest, which pushes brief real stops toward 'never set'; the sim numbers
    in screen_frame set the 1.0 m/s cut between a 0.2 s stop (0.64 m/s) and a pass-through (2.35 m/s).
  conflicts_resolved:
  - 'Approach 1.5 m (A0) vs 2 m (offense 5.4): <= 2.0 m to h OR <= 1.5 m to D_h.'
  - 'Exit: A0 r >= 6.6 vs coaching back-cuts: subtypes out / mid / in (in is also emitted by slip as ghost_in).'
  sources:
  - url: https://www.coachesclipboard.net/basketball-ghost-screens.html
    supports: fake screen without contact, then flare or back-cut
  - url: file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md
    supports: A0 GHOST; 5.4 within 2 m
  - url: https://cdn.prod.website-files.com/68d6be744d7efccc2207f571/68d6be744d7efccc2208061f_2014_SSAC_Recognizing-on-Ball-Screens.pdf
    supports: screener <= 2 ft farther from the basket than the handler
  status: proposal
  detector: detect_ghost
- id: seal
  level: action
  name: Hostage / Gortat seal after the roll
  aliases:
  - A-SEAL-HOSTAGE
  - seal
  - Gortat
  - hostage
  - roll and seal
  actors: roller s rel. sealed defender d and beneficiary (h or a cutter)
  t0: seal onset
  rule: |-
    A roll onset (roll gate) after the screen; within T_seal + min_s of the onset, T_seal = clamp(t_base 0.5 + (r_s0 -
    r_max 3.5) / travel 2.5 m/s, 1.5, 3.0) s (distance-scaled like T_roll), a merged held run of >= min_s (0.3 s)
    starts at mean r in [1.5, 3.5] m; the nearest defender d over the run is within def_m (1.2 m); a
    beneficiary (h first, then other attackers) comes within ben_m (2.0 m) of the seal point at r < ben_r (3.0) within
    ben_s (2.0 s) of onset; and d is pinned: mean speed < 1.5 m/s or the d-beneficiary distance does not shrink by >
    pin_shrink_m (0.3 m).
  params:
    t_base_s: {value: 0.5, unit: s}
    travel_mps: {value: 2.5, unit: m/s}
    t_min_s: {value: 1.5, unit: s}
    t_max_s: {value: 3.0, unit: s}
    min_s: {value: 0.3, unit: s}
    r_min: {value: 1.5, unit: m}
    r_max: {value: 3.5, unit: m}
    def_m: {value: 1.2, unit: m}
    ben_s: {value: 2.0, unit: s}
    ben_m: {value: 2.0, unit: m}
    ben_r: {value: 3.0, unit: m}
    def_speed_mps: {value: 1.5, unit: m/s}
    pin_shrink_m: {value: 0.3, unit: m}
  min_duration_s: 0.3
  outputs: seal_spot, r, seal_dwell_s, seal_window_s, defender_role (screener_defender/help), roll_start_frame, frame attrs
