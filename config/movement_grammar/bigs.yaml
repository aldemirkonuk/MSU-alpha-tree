  - rim roll
  - deep roll
  - pick-and-roll roller
  actors: screener s rel. user h (ball screen, DHO giver or off-ball screen)
  t0: t0 of the screen; roll_start_frame stored
  rule: |-
    release_timing = post_use and first_move = rimward. Onset gate: some 0.5 s window starting in [t0 - 0.3, t0 + 1.5]
    s has mean v_r >= v_r_gate_mps (1.5 m/s). Completion within T_roll of t_rel (the release, not t0), T_roll =
    clamp(t_base 0.5 + (r_s0 - 2.5) / travel 2.0 m/s, 1.5, 3.5) s: r <= rim_r (2.5 m), or a catch by s at r <= catch_r
    (3.0) with v_r >= 1.0. Also min r over [t0, completion + dr_eval_after_s 0.3 s] - r_s0 <= -min(dr_min_m 2.0,
    r_s0 - rim_r). The rim test's confidence is read at the minimum r inside the window, not at the first crossing. Excluded when a held
    run of >= short_stop_s (0.3 s) starts after the onset at mean r in (2.5, 6.0] (that is a short roll). Flags
    deep_roll (r_min <= RA_R 1.27), ctg_roll_compat (r_min <= 4.27 m = 14 ft).
    L4-6 (early_without_slip_gate): release_timing early is also accepted when slip's onset gate fails (no 0.5 s
    window starting in [t_rel - 0.2, t_rel + 0.5] s with mean v_r >= 2.0 m/s): the screener left a few frames before
