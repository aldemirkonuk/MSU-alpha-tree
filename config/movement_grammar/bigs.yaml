    conditions, Phi(margin / sigma) for point tests; sigma from the smoother covariance x K_CAL) x edge_factor(t0) x gap_factor(window)
    (MP-16) x the input screen's conf when there is one.
  noise: 'Body contact is invisible in XY; 1.2 m centre-to-centre is the proxy. Defender identity in a crowded paint: see
    id_swap_risk.'
  conflicts_resolved:
  - r 1.5-3.0 (offense 5.4, A3.27) widened to 3.5 (named_spots low_post reaches 3.26).
  - 'Within 1.5 s of roll start (A3.27) widened to 2.0 s: V0 seals from r_s0 8 at a 3.3 m/s roll start the held run 1.5-1.6
    s after the gate window start (the run onset needs s2 < 5.99).'
  sources:
  - url: file:///Users/aldemirkonuk/Projects/MSU-Alpha-3/docs/taxonomy/offense_full.md
    supports: 5.4 Seal / Gortat; F3; A3.27 roll-and-seal
