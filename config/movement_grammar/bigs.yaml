    onset_after_s: {value: 1.5, unit: s}
    early_without_slip_gate: {value: true, unit: bool, note: 'L4-6: an early release that fails the slip onset gate is read as a roll'}
    t_base_s: {value: 0.5, unit: s}
    travel_mps: {value: 2.0, unit: m/s}
    t_min_s: {value: 1.5, unit: s}
    t_max_s: {value: 3.5, unit: s}
    catch_r: {value: 3.0, unit: m}
    catch_vr_mps: {value: 1.0, unit: m/s}
    dr_min_m: {value: 2.0, unit: m}
    dr_eval_after_s: {value: 0.3, unit: s}
    short_stop_s: {value: 0.3, unit: s}
    pocket_r_max: {value: 6.0, unit: m}
    ctg_roll_r: {value: 4.27, unit: m}
  min_duration_s: 0.5
