- id: screener_post_action
  level: rule
  name: Factorised screener post-action label (fills screens.screener_action_after)
  aliases:
  - R-SCREENER-POST-ACTION
  - screener action after
  actors: screener s (+ h, D_s)
  t0: t0 of the screen
  rule: |-
    For each input screen: run the label detectors on that screen alone and take each label's conf. Precedence:
    move_to_screen > ghost (never_set) > slip > slip_to_arc > seal > roll > short_roll > pop_arc > pop_mid > replace
    (screener sink-pop) > crash > roll_into_post > none. p_none = product of (1 - conf) over fired labels; all
    probabilities renormalised. Output the fired label with the highest probability; precedence only breaks near-ties
    (within precedence_margin 0.15), and ghost outranks slip only when p_never_set >= ghost_never_set_min (0.5). The
    pure-precedence winner is stored as precedence_label. Ghost events match a screen within ghost_match_s (1.0 s) of
    t0; a ghost 'in' does not compete with a fired slip (it is slip_type ghost_in). Output label, probability, label_2 and margin; 'ambiguous:<a>|<b>' when p < ambiguous_below (0.5).
    L4-5 (label_given_screen): the label detectors are run on the screen with its conf set to 1, so the probabilities
    are P(label | screen); the event conf is p_label x the screen's conf (stored as p_screen).
    camera_cut_policy: gap_factor 0 over [t0 - gap_check_before_s 0.5 s, end of W] ->
    'unknown_post_action'. Compatibility: ctg_compat_label (roll, short_roll, pop, mid_post, move_to_screen, crash,
    none; slips map to roll/pop by destination) and synergy_compat (roll_man for roll, short roll, pops, slips, seal).
    Screens enum (D3, 25 Oct): screener_action_after = top1 (a base value of screens.yaml screen_record_schema or one
    of its sub-labels slip_to_arc, crash, move_to_screen, roll_into_post); screener_action_parent = the base value a
    sub-label rolls up to (sub_label_parent), the label itself for a base value.
  params:
    ambiguous_below: {value: 0.5, unit: '1'}
    sub_label_parent: {value: {slip_to_arc: slip, crash: none, move_to_screen: none, roll_into_post: roll}, unit: enum, note: 'D3 (25 Oct): sub-labels of the screens enum screener_action_after and the base value each rolls up to; identical to screens.yaml screen_record_schema screener_action_sub_labels (test_d3_screens_enum_matches_bigs). slip_to_arc: an early release (CTG slip timing) to the arc; crash: the screener held, no action off the screen until the shot; move_to_screen: the next screen is its own row; roll_into_post: a roll that ends in a post seal'}
    label_given_screen: {value: true, unit: bool, note: 'L4-5: label probabilities conditional on the screen (screen conf 1 inside), output conf = p_label x screen conf'}
    precedence_margin: {value: 0.15, unit: '1'}
    ghost_never_set_min: {value: 0.5, unit: '1'}
    gap_check_before_s: {value: 0.5, unit: s}
    ghost_match_s: {value: 1.0, unit: s}
  min_duration_s: null
  outputs: label, top1, screener_action_after, screener_action_parent, precedence_label, p_label, label_2, p_label_2, margin, probs,
    ctg_compat_label, synergy_compat, frame attrs
  confidence: conf = product of the item's test probabilities (window_conf of a per-frame Phi(margin / sigma) for per-frame
    conditions, Phi(margin / sigma) for point tests; sigma from the smoother covariance x K_CAL) x edge_factor(t0) x gap_factor(window)
    (MP-16) x the input screen's conf when there is one.
  noise: Labels flip near band edges and timing edges; these show up as low margins, not hard errors.
  conflicts_resolved:
  - 'E6: slip owns every early release; short_roll and pop_arc need post_use, so no branch is unreachable.'
  - 'screens.yaml enum: slip_to_arc, crash, move_to_screen, roll_into_post are sub-labels of screener_action_after with a
    base parent each (owner decision 25 Oct, D3; screens.yaml screen_record_schema and sub_label_parent here); ''replace''
    pinned to the screener-level sink-then-pop.'
  - 'Ghost vs slip_to_arc: kept separate (owner decision 25 Oct, D3); ghost = never set (p_never_set), slip_to_arc = set,
    then an early release to the arc, with (1 - p_never_set) in its conf.'
