    (0.80) x v_peak, v_peak = the player's own value from the caller (p95 of 1 s-mean speed over >= 3 games, E9) else
    the prior 6.23 m/s (conf x prior_factor 0.8). Ball (if tracked) first reaches r < 6.75 no more than 1.0 s before
    arrival. rim_run_repo flag: a 2.0 s window mean >= 5.5 m/s.
