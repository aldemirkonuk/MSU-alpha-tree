nodes:
- id: A
  name: Game structure and rules
  parent: ROOT
  definition: Everything the 2026-27 NCAA men's rules book defines about how a game is organised, timed, scored, penalised, restarted, officiated and reviewed.
  leaf: false
- id: A.01
  name: Game, periods and result
  parent: A
  definition: Game objective, periods, intermissions, extra periods, result and abnormal endings (Rules 1-1, 5-2 to 5-9).
  leaf: false
- id: A.01.01
  name: Team's own basket and direction of play
  parent: A.01
  definition: Each team attacks its own basket; first-half baskets are those farthest from the team bench; teams change baskets at half time.
  leaf: true
  rule_ref: 1-1.2, 1-1.3
  vocab: []
  tables:
  - state_frame.basket_attacked
  - frames.homography
  requirement_ids:
  - R-CG-06
  status: covered
  note: new-IV-21 (change of baskets) is proposed in config/invariants.yaml.
- id: A.01.02
  name: Halves (2 x 20:00)
  parent: A.01
  definition: Regulation is two halves of 1200 s; game clock counts down from 20:00.
  leaf: true
  rule_ref: 5-6.1
  vocab: []
  tables:
  - state_frame.period
  - state_frame.game_clock_s
  requirement_ids:
  - R-IV-16
  - R-SR-01
  - R-MD-01
  status: covered
- id: A.01.03
  name: End of period and try in flight
  parent: A.01
  definition: A period ends when the clock reads zero (red light or horn); a goal counts only if the try was released before; a try in flight ends the period when the try ends.
  leaf: true
  rule_ref: 5-7, 5-1.5, 6-6.1
  vocab: []
  tables:
  - shots.release_before_horn
  - made_basket_events.release_vs_horn
  - made_basket_events.release_game_clock_s
  requirement_ids:
  - R-MB-06
  status: covered
  note: Invariant wording proposed as new-IV-23.
- id: A.01.04
  name: Intermissions (half time, before extra periods)
  parent: A.01
  definition: Half-time intermission and the 1-minute intermission before each extra period; start, end and length.
  leaf: true
  rule_ref: 5-8, 5-9
  vocab: []
  tables:
  - state_second.phase
  - state_frame.stoppage_kind
  requirement_ids:
  - R-PL-04
  status: partial
  gaps:
  - proposed_id: new-SR-1
    tier: Shall
    text: Record each intermission (half time and before every extra period) as a stoppage row with start and end video time, duration and the teams' return time to the floor.
    acceptance: Intermission duration within +/- 2 s of the scoreboard countdown or the video cut times on 100% of processed games; every game has exactly 1 + n_OT intermission rows.
    implies: 'timeouts: allow timeout_type = intermission (or a new `intermissions` table: game_id, kind, start_ts_ms, end_ts_ms, duration_s).'
    priority: 3
- id: A.01.05
  name: Extra periods (overtime)
  parent: A.01
  definition: Each extra period is 5:00, starts with a jump ball, keeps the second-half baskets and team-foul counts.
  leaf: true
  rule_ref: 5-9.1 to 5-9.4
  vocab: []
  tables:
  - games.overtime_periods
  - jump_balls.kind
  - state_frame.period
  requirement_ids:
  - R-IV-16
  - R-IV-10
  - R-EV-14
  status: covered
  note: Team-foul carry-over into extra periods is proposed as new-IV-20.
- id: A.01.06
  name: Final result and winner
  parent: A.01
  definition: Final score, winner and score by half; the official scorebook is authoritative.
  leaf: true
  rule_ref: 5-2, 2-9.13
  vocab: []
  tables:
  - games.home_score
  - games.away_score
  - games.home_period_points
  - team_box.points
  requirement_ids:
  - R-FD-01
  - R-IV-04
  - R-IV-15
  - R-DQ-06
  status: covered
- id: A.01.07
  name: Forfeit and no contest
  parent: A.01
  definition: A forfeit (2-0 unless 30 min played, then the score stands) or a no contest ends a game abnormally.
  leaf: true
  rule_ref: 5-3
  vocab: []
  tables:
  - games.status
  requirement_ids: []
  status: partial
  gaps:
  - existing_proposal: new-IV-30
    note: Invariant exists only as a proposal; games.status has no forfeit / no_contest values.
  - proposed_id: new-FD-2
    tier: Shall
    text: Game registry status distinguishes forfeited, no-contest and suspended games, with the playing time completed (s) and the rule applied.
    acceptance: games.status takes values final, forfeit, no_contest, suspended, postponed, canceled; for every non-final game the completed playing time is stored in s (+/- 1 s) and the game is excluded from engine training unless status = final.
    implies: 'games.status enum: add forfeit, no_contest, suspended; new column games.playing_time_completed_s (s).'
    priority: 3
- id: A.01.08
  name: Interrupted or suspended game
  parent: A.01
  definition: A game interrupted by events beyond the officials' control and resumed or terminated later.
  leaf: true
  rule_ref: 5-4
  vocab: []
  tables: []
  requirement_ids: []
  status: missing
  gaps:
  - proposed_id: new-FD-3
    tier: Should
    text: Record interruptions longer than 300 s (floor, lighting, clock failure, emergencies) with cause, game clock at interruption and resumption date-time.
    acceptance: Each interruption row carries game_clock_s (0.1 s), period, cause from a fixed list and resumption UTC; possessions spanning an interruption are flagged and excluded from tempo statistics.
    implies: New stoppage cause `interruption` in state_frame.stoppage_kind; new columns games.interrupted (bool), games.resumed_utc.
    priority: 3
- id: A.01.09
  name: Game type, season type and round
  parent: A.01
  definition: Exhibition, non-conference, conference, conference tournament, NCAA tournament (round, seeds), NIT and others.
  leaf: true
  rule_ref: null
  vocab: []
  tables:
  - games.game_type
  - games.season_type
  - games.tournament_round
  - games.home_seed
  requirement_ids:
  - R-MD-14
  - R-CX-15
  - R-FD-01
  status: covered
- id: A.01.10
  name: Rules edition in force per game
  parent: A.01
  definition: Which rules edition (season) and which competition-specific rules apply to a game, e.g. 35 s vs 30 s shot clock, 2025-26 coach's challenge, 2026-27 appeals and logo rules.
  leaf: true
  rule_ref: Preface; Rules changes 2025-26 and 2026-27
  vocab: []
  tables: []
  requirement_ids:
  - R-TR-18
  status: partial
  note: R-TR-18 only mentions the shot-clock era for transition thresholds.
  gaps:
  - proposed_id: new-RL-1
    tier: Shall
    text: Every game row carries a rules_edition_id that points to a versioned rules configuration (config/rules_ncaa_men_<season>.yaml) holding every rule-derived constant (clock lengths, shot-clock values, foul limits, timeout allotments, court marks, challenge rules) with its rule citation; every check and simulation reads constants from that edition only.
    acceptance: 100% of games have a rules_edition_id; a test changes one constant in a copy of the edition and every dependent check changes result; 0 rule constants hard-coded in code (grep test).
    implies: New config files config/rules_ncaa_men_<season>.yaml (merge of court_ncaa_men.yaml constants and invariants.yaml constants); new column games.rules_edition_id.
    priority: 1
- id: A.02
  name: Game clock
  parent: A
  definition: Starting, stopping, displaying and correcting the game clock (Rules 1-18, 5-10 to 5-12).
  leaf: false
- id: A.02.01
  name: Game clock value and display
  parent: A.02
  definition: Seconds remaining in the period; tenths shown under 60 s.
  leaf: true
  rule_ref: 1-18.2, 5-10
  vocab: []
  tables:
  - state_frame.game_clock_s
  - scoreboard_ocr.game_clock_parsed_s
  requirement_ids:
  - R-SR-01
  - R-SY-01
  - R-MD-01
  status: covered
- id: A.02.02
  name: Game clock start triggers
  parent: A.02
  definition: The clock starts when a throw-in is legally touched inbounds, a jump ball is legally tapped, or a missed live free throw is touched.
  leaf: true
  rule_ref: 5-10.1 to 5-10.3
  vocab: []
  tables:
  - state_frame.clock_running
  - restarts.video_ts_ms_live
  requirement_ids:
  - R-IV-05
  - R-SR-01
  status: partial
  gaps:
  - proposed_id: new-SR-2
    tier: Shall
    text: Store for every clock start the trigger (throw-in touch, jump-ball tap, free-throw touch, period start) and the delay between the trigger frame and the first frame the clock is seen running.
    acceptance: Trigger correct on >= 95% of clock starts in gold-v1 (proposal); median start delay reported per game in s; delays > 1.0 s flagged as timing-mistake candidates (Rule 5-12).
    implies: New columns restarts.clock_start_trigger (enum) and restarts.clock_start_delay_s (s).
    priority: 2
- id: A.02.03
  name: Game clock stop events
  parent: A.02
  definition: The clock stops on whistles, at period end and after a made field goal in the last 59.9 s of the second half and extra periods.
  leaf: true
  rule_ref: 5-11, 2-10.12
  vocab: []
  tables:
  - state_frame.clock_running
  - state_frame.live_ball
  requirement_ids:
  - R-IV-05
  - R-IV-06
  - R-SR-01
  status: covered
- id: A.02.04
  name: Minimum time off on a touch (0.3 s) and tap-only rule
  parent: A.02
  definition: In the last 59.9 s at least 0.3 s comes off on a touch followed by a stop; with 0.3 s or less only a tap can score.
  leaf: true
  rule_ref: 5-10.2.d, 5-10.3.d, 5-1.19
  vocab: []
  tables:
  - shots.release_before_horn
  requirement_ids: []
  status: partial
  gaps:
  - existing_proposal: new-IV-22
    note: Proposed invariant; needs adoption in the live doc.
- id: A.02.05
  name: Timing mistakes and corrections
  parent: A.02
