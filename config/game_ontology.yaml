- id: A.03.06
  name: No-reset situations
  parent: A.03
  definition: 'Unexpired time continues: ball out of bounds off the defence, injury, end of timeout, arrow to team in control, technical on the team in control, etc.'
  leaf: true
  rule_ref: 2-11.6.a.1 to a.9
